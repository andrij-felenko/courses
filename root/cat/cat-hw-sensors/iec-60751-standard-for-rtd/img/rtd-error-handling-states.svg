<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діаграма станів та межевих значень опору RTD (IEC 60751)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Діагностика несправностей вимірювального тракту та відповідні коди C/C++ API</text>

  <!-- Top Panel Container -->
  <rect x="30" y="75" width="900" height="167" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="93" font-size="12" font-weight="bold" fill="#6b7280">КЛАСИФІКАЦІЯ ДІАПАЗОНІВ ОПОРУ (Pt100)</text>

  <!-- Range Cards -->
  <!-- Card 1: Short Circuit -->
  <rect x="45" y="102" width="154" height="82" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="122" y="118" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Коротке замикання</text>
  <text x="122" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">R &lt; 10 Ом</text>
  <rect x="57" y="146" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="122" y="162" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RTD_ERR_SHORT</text>

  <!-- Card 2: Underflow -->
  <rect x="213" y="102" width="154" height="82" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="290" y="118" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Нижче хв. межі</text>
  <text x="290" y="134" font-size="11" fill="#1a1a1a" text-anchor="middle">10 Ом ≤ R &lt; 18.5 Ом</text>
  <rect x="225" y="146" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="290" y="162" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RTD_ERR_UNDER</text>

  <!-- Card 3: Normal Range -->
  <rect x="381" y="102" width="198" height="82" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="118" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий діапазон</text>
  <text x="480" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">18.5 Ом ≤ R ≤ 390.5 Ом</text>
  <rect x="425" y="146" width="110" height="24" rx="4" fill="#27ae60"/>
  <text x="480" y="162" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RTD_OK</text>

  <!-- Card 4: Overflow -->
  <rect x="593" y="102" width="154" height="82" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="670" y="118" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вище макс. межі</text>
  <text x="670" y="134" font-size="11" fill="#1a1a1a" text-anchor="middle">390.5 Ом &lt; R ≤ 450 Ом</text>
  <rect x="605" y="146" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="670" y="162" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RTD_ERR_OVER</text>

  <!-- Card 5: Open Circuit -->
  <rect x="761" y="102" width="154" height="82" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="838" y="118" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Обрив лінії</text>
  <text x="838" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">R &gt; 450 Ом</text>
  <rect x="773" y="146" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="838" y="162" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RTD_ERR_OPEN</text>

  <!-- Axis Line -->
  <line x1="45" y1="195" x2="915" y2="195" stroke="#6b7280" stroke-width="2"/>

  <!-- Axis Ticks & Values -->
  <line x1="206" y1="190" x2="206" y2="200" stroke="#c0392b" stroke-width="2"/>
  <text x="206" y="212" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">10 Ом</text>
  <text x="206" y="226" font-size="11" fill="#6b7280" text-anchor="middle">(Межа КЗ)</text>

  <line x1="381" y1="190" x2="381" y2="200" stroke="#27ae60" stroke-width="2"/>
  <text x="381" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">18.52 Ом</text>
  <text x="381" y="226" font-size="11" fill="#6b7280" text-anchor="middle">(-200 °C)</text>

  <line x1="480" y1="190" x2="480" y2="200" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">100.00 Ом</text>
  <text x="480" y="226" font-size="11" fill="#2457d6" text-anchor="middle">(0 °C / R₀)</text>

  <line x1="579" y1="190" x2="579" y2="200" stroke="#27ae60" stroke-width="2"/>
  <text x="579" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">390.48 Ом</text>
  <text x="579" y="226" font-size="11" fill="#6b7280" text-anchor="middle">(+850 °C)</text>

  <line x1="761" y1="190" x2="761" y2="200" stroke="#c0392b" stroke-width="2"/>
  <text x="761" y="212" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">450 Ом</text>
  <text x="761" y="226" font-size="11" fill="#6b7280" text-anchor="middle">(Межа обриву)</text>

  <!-- Bottom Section: API Processing Architecture -->
  <!-- Left Panel: Input Data -->
  <rect x="30" y="255" width="235" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="255" width="235" height="32" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="147.5" y="276" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхідні дані та налаштування</text>

  <text x="45" y="305" font-size="12" font-weight="bold" fill="#1a1a1a">• R_meas</text>
  <text x="55" y="320" font-size="11" fill="#6b7280">поточне значення опору</text>

  <text x="45" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">• R₀ (номінал)</text>
  <text x="55" y="357" font-size="11" fill="#6b7280">100.0 Ом або 1000.0 Ом</text>

  <text x="45" y="379" font-size="12" font-weight="bold" fill="#1a1a1a">• I_ex (струм збудження)</text>
  <text x="55" y="394" font-size="11" fill="#6b7280">аналіз самонагріву P_ex</text>

  <text x="45" y="416" font-size="12" font-weight="bold" fill="#1a1a1a">• Коефіцієнти CVD (A, B, C)</text>
  <text x="55" y="431" font-size="11" fill="#6b7280">стандартні або індивідуальні</text>

  <text x="45" y="453" font-size="12" font-weight="bold" fill="#1a1a1a">• Клас точності (AA, A, B, C)</text>
  <text x="55" y="468" font-size="11" fill="#6b7280">для rtd_get_tolerance()</text>

  <!-- Arrow Left -> Center -->
  <line x1="265" y1="375" x2="287" y2="375" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Middle Panel: Processing Pipeline -->
  <rect x="295" y="255" width="370" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="295" y="255" width="370" height="32" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="276" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Алгоритм обробки сигналів (rtd_r_to_temp)</text>

  <!-- Step 1 -->
  <rect x="305" y="295" width="350" height="42" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="315" y="311" font-size="12" font-weight="bold" fill="#c0392b">1. Перевірка апаратної цілісності</text>
  <text x="315" y="327" font-size="11" fill="#1a1a1a">R &lt; R_short  ||  R &gt; R_open  ⇒  помилка лінії</text>

  <!-- Arrow Step 1 -> Step 2 -->
  <line x1="480" y1="337" x2="480" y2="344" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Step 2 -->
  <rect x="305" y="347" width="350" height="42" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="315" y="363" font-size="12" font-weight="bold" fill="#c0392b">2. Перевірка припустимого діапазону</text>
  <text x="315" y="379" font-size="11" fill="#1a1a1a">T &lt; -200 °C  ||  T &gt; +850 °C  ⇒  RTD_ERR_OUT_OF_RANGE</text>

  <!-- Arrow Step 2 -> Step 3 -->
  <line x1="480" y1="389" x2="480" y2="396" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Step 3 -->
  <rect x="305" y="399" width="350" height="86" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="315" y="415" font-size="12" font-weight="bold" fill="#27ae60">3. Аналіз самонагріву та розрахунок T:</text>
  <text x="315" y="431" font-size="11" fill="#1a1a1a">P = I_ex² · R &gt; P_max  ⇒  RTD_WARN_SELF_HEATING</text>
  <text x="315" y="448" font-size="11" font-weight="bold" fill="#1a1a1a">T ≥ 0°C:   R(T) = R₀(1 + A·T + B·T²)</text>
  <text x="315" y="465" font-size="11" font-weight="bold" fill="#1a1a1a">T &lt; 0°C:   R(T) = R₀[1 + A·T + B·T² + C(T-100)T³]</text>

  <!-- Arrow Center -> Right -->
  <line x1="665" y1="375" x2="687" y2="375" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Right Panel: API Output -->
  <rect x="695" y="255" width="235" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="695" y="255" width="235" height="32" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="812.5" y="276" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Результат API</text>

  <rect x="707" y="298" width="211" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="717" y="314" font-size="12" font-weight="bold" fill="#1a1a1a">rtd_status_t</text>
  <text x="717" y="330" font-size="11" font-weight="bold" fill="#27ae60">RTD_OK / код помилки</text>

  <rect x="707" y="346" width="211" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="717" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">float *temperature</text>
  <text x="717" y="378" font-size="11" fill="#2457d6">обчислене значення °C</text>

  <rect x="707" y="394" width="211" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="717" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">float *tolerance</text>
  <text x="717" y="426" font-size="11" fill="#6b7280">±(a + b·|t|) °C (IEC)</text>

  <rect x="707" y="442" width="211" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="717" y="458" font-size="12" font-weight="bold" fill="#1a1a1a">uint32_t diag_flags</text>
  <text x="717" y="474" font-size="11" font-weight="bold" fill="#c0392b">SHORT | OPEN | SELFHEAT</text>
</svg>
