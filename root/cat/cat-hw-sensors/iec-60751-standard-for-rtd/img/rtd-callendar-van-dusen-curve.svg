<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Температурна залежність опору Pt100 (Крива Каллендара — Ван Дюзена)</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Стандарт IEC 60751: рівняння для від'ємного (t &lt; 0 °C) та додатного (t ≥ 0 °C) діапазонів</text>

  <!-- Domain Region Header Badges -->
  <rect x="100" y="68" width="148.6" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="174.3" y="83" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">t &lt; 0 °C (від'ємний)</text>

  <rect x="248.6" y="68" width="631.4" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="564.3" y="83" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">t ≥ 0 °C (додатний)</text>

  <!-- Plot Background Shading -->
  <rect x="100" y="120" width="148.6" height="320" fill="#eaf0fd" fill-opacity="0.4"/>
  <rect x="248.6" y="120" width="631.4" height="320" fill="#e9f7ef" fill-opacity="0.25"/>

  <!-- Horizontal Grid Lines -->
  <line x1="100" y1="120" x2="880" y2="120" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="100" y1="200" x2="880" y2="200" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="100" y1="280" x2="880" y2="280" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="100" y1="360" x2="880" y2="360" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- Vertical Grid Lines -->
  <line x1="174.3" y1="120" x2="174.3" y2="440" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="248.6" y1="120" x2="248.6" y2="440" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="322.9" y1="120" x2="322.9" y2="440" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="545.7" y1="120" x2="545.7" y2="440" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="694.3" y1="120" x2="694.3" y2="440" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- Plot Axes -->
  <line x1="100" y1="440" x2="895" y2="440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="888" y="428" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">t (°C)</text>

  <line x1="100" y1="440" x2="100" y2="105" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="88" y="104" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">Опір R, Ом</text>

  <!-- Y Axis Ticks and Labels -->
  <line x1="95" y1="120" x2="100" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="124" font-size="12" fill="#6b7280" text-anchor="end">400 Ω</text>

  <line x1="95" y1="200" x2="100" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="204" font-size="12" fill="#6b7280" text-anchor="end">300 Ω</text>

  <line x1="95" y1="280" x2="100" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="284" font-size="12" fill="#6b7280" text-anchor="end">200 Ω</text>

  <line x1="95" y1="360" x2="100" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <text x="88" y="364" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">100 Ω</text>

  <line x1="95" y1="440" x2="100" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="444" font-size="12" fill="#6b7280" text-anchor="end">0 Ω</text>

  <!-- X Axis Ticks and Labels -->
  <line x1="100" y1="440" x2="100" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="458" font-size="12" fill="#2457d6" text-anchor="middle">−200 °C</text>

  <line x1="174.3" y1="440" x2="174.3" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="174.3" y="458" font-size="12" fill="#6b7280" text-anchor="middle">−100 °C</text>

  <line x1="248.6" y1="440" x2="248.6" y2="445" stroke="#1a1a1a" stroke-width="2"/>
  <text x="248.6" y="458" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0 °C</text>

  <line x1="322.9" y1="440" x2="322.9" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="322.9" y="458" font-size="12" fill="#6b7280" text-anchor="middle">+100 °C</text>

  <line x1="397.1" y1="440" x2="397.1" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="397.1" y="458" font-size="12" fill="#6b7280" text-anchor="middle">+200 °C</text>

  <line x1="545.7" y1="440" x2="545.7" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="545.7" y="458" font-size="12" fill="#6b7280" text-anchor="middle">+400 °C</text>

  <line x1="694.3" y1="440" x2="694.3" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="694.3" y="458" font-size="12" fill="#6b7280" text-anchor="middle">+600 °C</text>

  <line x1="880.0" y1="440" x2="880.0" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="880.0" y="458" font-size="12" fill="#27ae60" text-anchor="middle">+850 °C</text>

  <!-- Alpha Coefficient Box -->
  <rect x="260" y="136" width="320" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="154" font-size="12" font-weight="bold" fill="#1a1a1a">Температурний коефіцієнт α (IEC 60751):</text>
  <text x="270" y="174" font-size="12" font-weight="bold" fill="#2457d6">α = (R₁₀₀ − R₀) / (100·R₀) = 0.003851 °C⁻¹</text>

  <!-- Pt100 Resistance Curves -->
  <!-- Negative segment (-200 °C to 0 °C) -->
  <path d="M 100.0 425.2 C 124.7 414.2, 149.5 403.0, 174.3 391.8 C 199.1 380.6, 223.8 369.4, 248.6 360.0" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Positive segment (0 °C to +850 °C) -->
  <path d="M 248.6 360.0 C 273.4 349.5, 298.1 339.2, 322.9 329.2 C 372.4 309.2, 421.9 289.8, 471.4 270.4 C 521.0 251.0, 570.5 231.7, 620.0 215.2 C 669.5 198.7, 719.0 182.2, 768.6 163.8 C 818.1 145.4, 842.9 136.2, 880.0 127.6" fill="none" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Key Points & Labels -->
  <!-- Point: -200 °C -->
  <circle cx="100.0" cy="425.2" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1"/>
  <rect x="108" y="392" width="130" height="22" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="114" y="407" font-size="12" font-weight="bold" fill="#2457d6">18.52 Ом (−200 °C)</text>

  <!-- Point: 0 °C (R0) -->
  <circle cx="248.6" cy="360.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="256" y="338" width="128" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="262" y="353" font-size="12" font-weight="bold" fill="#1a1a1a">R₀ = 100 Ом (0 °C)</text>

  <!-- Point: +100 °C -->
  <circle cx="322.9" cy="329.2" r="4.5" fill="#27ae60" stroke="#ffffff" stroke-width="1"/>
  <rect x="330" y="302" width="122" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="336" y="317" font-size="12" fill="#27ae60">R₁₀₀ = 138.51 Ом</text>

  <!-- Point: +850 °C -->
  <circle cx="880.0" cy="127.6" r="4.5" fill="#27ae60" stroke="#ffffff" stroke-width="1"/>
  <rect x="724" y="132" width="146" height="22" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="862" y="147" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">390.48 Ом (+850 °C)</text>

  <!-- Bottom Callout Domain Panels -->
  <!-- Left Panel: Negative Range -->
  <rect x="100" y="470" width="365" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="114" y="488" font-size="13" font-weight="bold" fill="#2457d6">Від'ємний діапазон (−200 °C ≤ t &lt; 0 °C)</text>
  <text x="114" y="507" font-size="12" fill="#1a1a1a">R(t) = R₀ · [1 + A·t + B·t² + C·(t − 100)·t³]</text>
  <text x="114" y="525" font-size="12" fill="#6b7280">Член 4-го степеня: C = −4.183 × 10⁻¹² °C⁻⁴</text>

  <!-- Right Panel: Positive Range -->
  <rect x="480" y="470" width="400" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="494" y="488" font-size="13" font-weight="bold" fill="#27ae60">Додатний діапазон (0 °C ≤ t ≤ +850 °C)</text>
  <text x="494" y="507" font-size="12" fill="#1a1a1a">R(t) = R₀ · [1 + A·t + B·t²]</text>
  <text x="494" y="525" font-size="12" fill="#6b7280">Квадратичне рівняння Каллендара (C = 0)</text>
</svg>
