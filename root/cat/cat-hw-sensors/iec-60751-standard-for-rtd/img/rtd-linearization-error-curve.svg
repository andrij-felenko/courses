<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристика PT100 та похибка лінійного наближення</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Нелінійність кривої R(t) спричиняє зростання похибки лінеаризації до −96 °C на межі діапазону (+850 °C)</text>

  <!-- TOP PANEL: Resistance Curve R(t) -->
  <rect x="30" y="70" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="90" font-size="14" font-weight="bold" fill="#1a1a1a">1. Залежність опору від температури R(t) для PT100</text>
  <text x="92" y="105" font-size="12" fill="#6b7280" text-anchor="end">R (Ω)</text>

  <!-- Top Chart Plot Area -->
  <rect x="100" y="105" width="810" height="145" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Top Chart Horizontal Grid Lines -->
  <line x1="100" y1="235" x2="910" y2="235" stroke="#d0d7de" stroke-width="1"/>
  <line x1="100" y1="202.5" x2="910" y2="202.5" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="100" y1="170" x2="910" y2="170" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="100" y1="137.5" x2="910" y2="137.5" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="695" y1="105" x2="910" y2="105" stroke="#e5e7eb" stroke-dasharray="4,4"/>

  <!-- Top Chart Vertical Grid Lines (Segmented to avoid legend/CVD boxes & R0 text) -->
  <line x1="130" y1="155" x2="130" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="277" y1="155" x2="277" y2="175" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="277" y1="195" x2="277" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="350" y1="155" x2="350" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="423" y1="155" x2="423" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="570" y1="155" x2="570" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="717" y1="105" x2="717" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="900" y1="105" x2="900" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Top Y-Axis Tick Labels -->
  <text x="92" y="239" font-size="12" fill="#6b7280" text-anchor="end">0 Ω</text>
  <text x="92" y="206.5" font-size="12" fill="#6b7280" text-anchor="end">100 Ω</text>
  <text x="92" y="174" font-size="12" fill="#6b7280" text-anchor="end">200 Ω</text>
  <text x="92" y="141.5" font-size="12" fill="#6b7280" text-anchor="end">300 Ω</text>
  <text x="92" y="109" font-size="12" fill="#6b7280" text-anchor="end">400 Ω</text>

  <!-- Top X-Axis Tick Labels -->
  <text x="130" y="268" font-size="12" fill="#6b7280" text-anchor="middle">−200°C</text>
  <text x="277" y="268" font-size="12" fill="#6b7280" text-anchor="middle">0°C</text>
  <text x="350" y="268" font-size="12" fill="#6b7280" text-anchor="middle">100°C</text>
  <text x="423" y="268" font-size="12" fill="#6b7280" text-anchor="middle">200°C</text>
  <text x="570" y="268" font-size="12" fill="#6b7280" text-anchor="middle">400°C</text>
  <text x="717" y="268" font-size="12" fill="#6b7280" text-anchor="middle">600°C</text>
  <text x="900" y="268" font-size="12" fill="#6b7280" text-anchor="middle">850°C</text>

  <!-- Linear Approximation Line (R_lin) -->
  <polyline points="130,227.5 277,202.5 350,190.0 423,177.5 570,152.5 717,127.5 900,96.3" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Actual IEC 60751 Curve (R_real) -->
  <path d="M 130,229.0 Q 200,215.5 277,202.5 Q 423,177.8 570,154.8 Q 717,133.2 900,108.3" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Point at R0 (0°C, 100 Ω) -->
  <circle cx="277" cy="202.5" r="4" fill="#2457d6"/>
  <text x="277" y="188" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R₀ = 100 Ω (0°C)</text>

  <!-- Resistance Divergence Marker at +850°C -->
  <line x1="900" y1="96.3" x2="900" y2="108.3" stroke="#c0392b" stroke-width="2"/>
  <circle cx="900" cy="96.3" r="3" fill="#c0392b"/>
  <circle cx="900" cy="108.3" r="3" fill="#2457d6"/>
  <text x="890" y="90" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ΔR = +36.9 Ω</text>

  <!-- Top Chart Legend Box -->
  <rect x="110" y="112" width="215" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="118" y1="124" x2="138" y2="124" stroke="#2457d6" stroke-width="2.5"/>
  <text x="145" y="128" font-size="12" fill="#1a1a1a">Дійсна R(t) (IEC 60751)</text>
  <line x1="118" y1="142" x2="138" y2="142" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="145" y="146" font-size="12" fill="#1a1a1a">Лінійне наближення R_lin(t)</text>

  <!-- CVD Equation Box -->
  <rect x="340" y="112" width="355" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="350" y="127" font-size="12" font-weight="bold" fill="#2457d6">Рівняння Каллендара — Ван Дюзена</text>
  <text x="350" y="145" font-size="12" fill="#1a1a1a">R(t) = R₀·(1 + A·t + B·t² + C·(t−100)·t³)</text>

  <!-- BOTTOM PANEL: Temperature Error Δt -->
  <rect x="30" y="295" width="900" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="316" font-size="14" font-weight="bold" fill="#1a1a1a">2. Температурна похибка лінійного наближення Δt = t_lin − t_дійсн (°C)</text>

  <!-- Bottom Chart Plot Area -->
  <rect x="100" y="330" width="810" height="155" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Bottom Chart Horizontal Grid Lines (Segmented y=426 to avoid callout text) -->
  <line x1="100" y1="350" x2="910" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="374" x2="910" y2="374" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="100" y1="398" x2="910" y2="398" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="100" y1="422" x2="110" y2="422" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="245" y1="422" x2="490" y2="422" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="710" y1="422" x2="910" y2="422" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="100" y1="446" x2="910" y2="446" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="100" y1="470" x2="910" y2="470" stroke="#e5e7eb" stroke-dasharray="4,4"/>

  <!-- Bottom Chart Vertical Grid Lines (Segmented to avoid boxes) -->
  <line x1="130" y1="330" x2="130" y2="395" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="130" y1="450" x2="130" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="277" y1="350" x2="277" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="350" y1="350" x2="350" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="423" y1="330" x2="423" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="570" y1="330" x2="570" y2="410" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="570" y1="472" x2="570" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="717" y1="330" x2="717" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="900" y1="330" x2="900" y2="485" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Bottom Y-Axis Tick Labels -->
  <text x="92" y="354" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0 °C</text>
  <text x="92" y="378" font-size="12" fill="#6b7280" text-anchor="end">−20 °C</text>
  <text x="92" y="402" font-size="12" fill="#6b7280" text-anchor="end">−40 °C</text>
  <text x="92" y="426" font-size="12" fill="#6b7280" text-anchor="end">−60 °C</text>
  <text x="92" y="450" font-size="12" fill="#6b7280" text-anchor="end">−80 °C</text>
  <text x="92" y="474" font-size="12" fill="#6b7280" text-anchor="end">−100 °C</text>

  <!-- Bottom X-Axis Tick Labels -->
  <text x="130" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">−200°C</text>
  <text x="277" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">0°C</text>
  <text x="350" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">100°C</text>
  <text x="423" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">200°C</text>
  <text x="570" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">400°C</text>
  <text x="717" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">600°C</text>
  <text x="900" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">850°C</text>

  <!-- Bottom Axis Label -->
  <text x="480" y="515" font-size="12" fill="#6b7280" text-anchor="middle">Температура навколишнього середовища, t (°C)</text>

  <!-- Filled Area Under Error Curve -->
  <path d="M 130,350 L 130,363.9 Q 200,353.0 277,350 Q 314,349.5 350,350 Q 423,351.8 570,370.8 Q 717,406.7 900,464.8 L 900,350 Z" fill="#fdecea" fill-opacity="0.65"/>

  <!-- Error Curve Δt(t) -->
  <path d="M 130,363.9 Q 200,353.0 277,350 Q 314,349.5 350,350 Q 423,351.8 570,370.8 Q 717,406.7 900,464.8" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Green Accurate Zone Callout (0...100 °C) -->
  <rect x="240" y="335" width="148" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="314" y="349" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точна зона (Δt ≈ 0 °C)</text>

  <!-- Cryogenic Error Callout (-200 °C) -->
  <rect x="110" y="405" width="135" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="118" y="421" font-size="12" font-weight="bold" fill="#c0392b">Похибка: −11.6 °C</text>
  <text x="118" y="437" font-size="12" fill="#1a1a1a">при t = −200 °C</text>
  <circle cx="130" cy="363.9" r="4" fill="#c0392b"/>
  <line x1="145" y1="405" x2="133" y2="370" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <!-- High Temperature Error Callout (+850 °C) -->
  <rect x="490" y="415" width="220" height="54" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="500" y="431" font-size="12" font-weight="bold" fill="#c0392b">Похибка: −95.7 °C</text>
  <text x="500" y="446" font-size="12" fill="#1a1a1a">при t = +850 °C</text>
  <text x="500" y="461" font-size="12" fill="#6b7280">(Допуск Класу A: ±1.85 °C)</text>
  <circle cx="900" cy="464.8" r="4" fill="#c0392b"/>
  <line x1="710" y1="442" x2="892" y2="463" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
</svg>
