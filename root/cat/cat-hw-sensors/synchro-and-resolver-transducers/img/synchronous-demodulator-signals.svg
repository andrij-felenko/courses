<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow marker -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Blue arrow marker -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="570" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Сигнали та часові діаграми синхронного демодулятора</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Повноперіодне фазочутливе випрямлення перетворює змінну несучу на постійну напругу</text>

  <!-- Main Panel -->
  <rect x="30" y="75" width="900" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Alignment Lines (Dashed Time Grid) -->
  <line x1="240" y1="85" x2="240" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="400" y1="85" x2="400" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="560" y1="85" x2="560" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="720" y1="85" x2="720" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="880" y1="85" x2="880" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- TRACK 1: Carrier Signal u_in(t) -->
  <!-- Label Box -->
  <rect x="45" y="95" width="140" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="115" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">u_in(t)</text>
  <text x="115" y="140" text-anchor="middle" font-size="12" fill="#1a1a1a">Сигнал несучої (AC)</text>

  <!-- Y-Axis Ticks & Baseline -->
  <text x="222" y="100" text-anchor="end" font-size="12" fill="#6b7280">+U_m</text>
  <text x="222" y="155" text-anchor="end" font-size="12" fill="#6b7280">-U_m</text>
  <line x1="230" y1="125" x2="885" y2="125" stroke="#d0d7de" stroke-width="1"/>

  <!-- Waveform u_in(t) -->
  <path d="M 240 125 C 284.2 95, 355.8 95, 400 125 C 444.2 155, 515.8 155, 560 125 C 604.2 95, 675.8 95, 720 125 C 764.2 155, 835.8 155, 880 125" fill="none" stroke="#2457d6" stroke-width="2.5"/>


  <!-- TRACK 2: Reference Square Wave s_ref(t) -->
  <!-- Label Box -->
  <rect x="45" y="185" width="140" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="115" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">s_ref(t)</text>
  <text x="115" y="230" text-anchor="middle" font-size="12" fill="#6b7280">Опорний меандр</text>

  <!-- Y-Axis Ticks & Baseline -->
  <text x="222" y="195" text-anchor="end" font-size="12" fill="#6b7280">+1</text>
  <text x="222" y="245" text-anchor="end" font-size="12" fill="#6b7280">-1</text>
  <line x1="230" y1="215" x2="885" y2="215" stroke="#d0d7de" stroke-width="1"/>

  <!-- Waveform s_ref(t) -->
  <path d="M 240 190 L 400 190 L 400 240 L 560 240 L 560 190 L 720 190 L 720 240 L 880 240" fill="none" stroke="#1a1a1a" stroke-width="2"/>


  <!-- TRACK 3: Switched (Rectified) Signal u_sw(t) -->
  <!-- Label Box -->
  <rect x="45" y="275" width="140" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="115" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">u_sw(t)</text>
  <text x="115" y="320" text-anchor="middle" font-size="12" fill="#1a1a1a">Комутований сигнал</text>

  <!-- Y-Axis Ticks & Baseline -->
  <text x="222" y="280" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">|U_m|</text>
  <text x="222" y="310" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <line x1="230" y1="305" x2="885" y2="305" stroke="#d0d7de" stroke-width="1"/>

  <!-- Shaded Rectified Area -->
  <path d="M 240 305 C 284.2 275, 355.8 275, 400 305 C 444.2 275, 515.8 275, 560 305 C 604.2 275, 675.8 275, 720 305 C 754.2 275, 835.8 275, 880 305 L 880 305 L 240 305 Z" fill="#27ae60" fill-opacity="0.12"/>

  <!-- Waveform u_sw(t) -->
  <path d="M 240 305 C 284.2 275, 355.8 275, 400 305 C 444.2 275, 515.8 275, 560 305 C 604.2 275, 675.8 275, 720 305 C 754.2 275, 835.8 275, 880 305" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Callout Annotation on Track 3 -->
  <text x="480" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Фазове інвертування (-1 × -u_in)</text>


  <!-- TRACK 4: DC Output Signal U_out -->
  <!-- Label Box -->
  <rect x="45" y="365" width="140" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="115" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">U_out</text>
  <text x="115" y="410" text-anchor="middle" font-size="12" fill="#1a1a1a">Постійна напруга (DC)</text>

  <!-- Y-Axis Ticks & Baseline -->
  <text x="222" y="380" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">U_DC</text>
  <text x="222" y="400" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <line x1="230" y1="395" x2="885" y2="395" stroke="#d0d7de" stroke-width="1"/>

  <!-- Faint Raw Input Arches in Background of Track 4 -->
  <path d="M 240 395 C 284.2 365, 355.8 365, 400 395 C 444.2 365, 515.8 365, 560 395 C 604.2 365, 675.8 365, 720 395 C 754.2 365, 835.8 365, 880 395" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Filtered DC Output Shading & Line -->
  <path d="M 240 395 Q 260 376 280 376 L 880 376 L 880 395 L 240 395 Z" fill="#2457d6" fill-opacity="0.12"/>
  <path d="M 240 395 Q 260 376 280 376 L 880 376" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Formula Badge on Track 4 -->
  <rect x="475" y="358" width="230" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="590" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">U_out = (2/π) · U_m · cos(φ)</text>


  <!-- TIME AXIS -->
  <line x1="220" y1="445" x2="895" y2="445" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="905" y="449" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">t</text>

  <!-- Time Ticks & Labels -->
  <line x1="240" y1="440" x2="240" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">0</text>

  <line x1="400" y1="440" x2="400" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">T/2</text>

  <line x1="560" y1="440" x2="560" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="560" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">T</text>

  <line x1="720" y1="440" x2="720" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="720" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">3T/2</text>

  <line x1="880" y1="440" x2="880" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="880" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">2T</text>


  <!-- BOTTOM SUMMARY CARDS -->
  <!-- Card 1: In Phase -->
  <rect x="150" y="485" width="310" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="165" y="504" font-size="12" font-weight="bold" fill="#27ae60">Збіг фази (φ = 0°):</text>
  <text x="165" y="522" font-size="11" fill="#1a1a1a">U_out &gt; 0 (максимальна додатна напруга)</text>

  <!-- Card 2: Out of Phase -->
  <rect x="500" y="485" width="310" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="515" y="504" font-size="12" font-weight="bold" fill="#c0392b">Протифаза (φ = 180°):</text>
  <text x="515" y="522" font-size="11" fill="#1a1a1a">U_out &lt; 0 (максимальна від&apos;ємна напруга)</text>
</svg>
