<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#6b7280"/>
    </marker>

    <!-- Active Stator Winding (Blue - Indicator Mode) centered at local (100, 100) -->
    <g id="stator-winding-blue">
      <circle cx="100" cy="100" r="40" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
      <circle cx="100" cy="100" r="3" fill="#2457d6"/>
      <path d="M 100,100 L 100,92 Q 95,88 100,84 Q 95,80 100,76 Q 95,72 100,68" fill="none" stroke="#2457d6" stroke-width="2"/>
      <path d="M 100,100 L 100,92 Q 95,88 100,84 Q 95,80 100,76 Q 95,72 100,68" fill="none" stroke="#2457d6" stroke-width="2" transform="rotate(120, 100, 100)"/>
      <path d="M 100,100 L 100,92 Q 95,88 100,84 Q 95,80 100,76 Q 95,72 100,68" fill="none" stroke="#2457d6" stroke-width="2" transform="rotate(240, 100, 100)"/>
      <circle cx="100" cy="68" r="3.5" fill="#2457d6"/>
      <circle cx="72.3" cy="116" r="3.5" fill="#2457d6"/>
      <circle cx="127.7" cy="116" r="3.5" fill="#2457d6"/>
    </g>

    <!-- Gray Stator Winding (Control Transformer Mode) centered at local (100, 100) -->
    <g id="stator-winding-gray">
      <circle cx="100" cy="100" r="40" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
      <circle cx="100" cy="100" r="3" fill="#6b7280"/>
      <path d="M 100,100 L 100,92 Q 95,88 100,84 Q 95,80 100,76 Q 95,72 100,68" fill="none" stroke="#6b7280" stroke-width="1.8"/>
      <path d="M 100,100 L 100,92 Q 95,88 100,84 Q 95,80 100,76 Q 95,72 100,68" fill="none" stroke="#6b7280" stroke-width="1.8" transform="rotate(120, 100, 100)"/>
      <path d="M 100,100 L 100,92 Q 95,88 100,84 Q 95,80 100,76 Q 95,72 100,68" fill="none" stroke="#6b7280" stroke-width="1.8" transform="rotate(240, 100, 100)"/>
      <circle cx="100" cy="68" r="3.5" fill="#6b7280"/>
      <circle cx="72.3" cy="116" r="3.5" fill="#6b7280"/>
      <circle cx="127.7" cy="116" r="3.5" fill="#6b7280"/>
    </g>

    <!-- Rotor Coil Winding Definition centered at local (100, 100) -->
    <g id="rotor-coil">
      <line x1="100" y1="74" x2="100" y2="126" stroke="#d97706" stroke-width="2.5"/>
      <rect x="93" y="88" width="14" height="24" rx="3" fill="#fffbe6" stroke="#d97706" stroke-width="2"/>
      <line x1="93" y1="94" x2="107" y2="94" stroke="#d97706" stroke-width="1.5"/>
      <line x1="93" y1="100" x2="107" y2="100" stroke="#d97706" stroke-width="1.5"/>
      <line x1="93" y1="106" x2="107" y2="106" stroke="#d97706" stroke-width="1.5"/>
      <circle cx="100" cy="74" r="2.5" fill="#d97706"/>
      <circle cx="100" cy="126" r="2.5" fill="#d97706"/>
    </g>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схеми ввімкнення сельсинів: індикаторна передача та трансформатор управління</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">В індикаторному режимі виникає момент M_синх, у трансформаторному — напруга неузгодження U_неузг</text>

  <!-- LEFT PANEL: Indicator Mode -->
  <rect x="30" y="65" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="77" width="405" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247.5" y="94" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">а) Індикаторна передача (СД + СП)</text>
  <text x="247.5" y="111" font-size="12" fill="#1a1a1a" text-anchor="middle">Пряма синхронна передача кута повороту</text>

  <!-- Left Panel: Shaft Inputs & Top Labels -->
  <text x="130" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний кут θ₁</text>
  <line x1="130" y1="138" x2="130" y2="172" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>

  <text x="365" y="134" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихідний кут θ₂</text>
  <path d="M 348,142 A 15,15 0 0,1 378,142" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="365" y="158" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Момент M_синх (θ₂ → θ₁)</text>
  <line x1="365" y1="162" x2="365" y2="172" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stator Interconnections (Left Panel) -->
  <!-- S1 Line -->
  <path d="M 130,193 L 130,177 L 365,177 L 365,193" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 235,177 L 255,177" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="247.5" y="171" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₁</text>

  <!-- S2 Line -->
  <path d="M 102.3,241 L 102.3,300 L 337.3,300 L 337.3,241" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 205,300 L 225,300" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="220" y="294" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₂</text>

  <!-- S3 Line -->
  <path d="M 157.7,241 L 157.7,325 L 392.7,325 L 392.7,241" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 265,325 L 285,325" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="275" y="319" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₃</text>

  <!-- Synchro Units (Left Panel) -->
  <!-- SD Unit (Center 130, 225) -->
  <use href="#stator-winding-blue" x="30" y="125"/>
  <use href="#rotor-coil" x="30" y="125" transform="rotate(-30, 130, 225)"/>
  <text x="116" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">S1</text>
  <text x="90" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">S2</text>
  <text x="170" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">S3</text>
  <text x="105" y="225" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">θ₁</text>
  <text x="130" y="358" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сельсин-датчик (СД)</text>

  <!-- SP Unit (Center 365, 225) -->
  <use href="#stator-winding-blue" x="265" y="125"/>
  <use href="#rotor-coil" x="265" y="125" transform="rotate(-10, 365, 225)"/>
  <text x="351" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">S1</text>
  <text x="325" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">S2</text>
  <text x="405" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">S3</text>
  <text x="390" y="225" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">θ₂</text>
  <text x="365" y="358" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сельсин-приймач (СП)</text>

  <!-- Excitation Supply (Left Panel - Connected to both rotors via Central Corridor) -->
  <circle cx="247.5" cy="405" r="15" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 240.5,405 Q 244,399 247.5,405 Q 251,411 254.5,405" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="247.5" y="434" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Джерело збудження U_зб</text>
  <!-- Excitation Wires (Dashed) -->
  <path d="M 247.5,390 L 247.5,265 L 130,265 L 130,251" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 247.5,265 L 365,265 L 365,251" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Left Bottom Summary Box -->
  <rect x="45" y="455" width="405" height="52" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="247.5" y="474" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">M_синх = M_max · sin(θ₁ - θ₂)</text>
  <text x="247.5" y="494" font-size="12" fill="#6b7280" text-anchor="middle">Вирівнювальні струми створюють обертальний момент</text>


  <!-- RIGHT PANEL: Control Transformer Mode -->
  <rect x="495" y="65" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="77" width="405" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712.5" y="94" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">б) Трансформатор управління (СД + СПТ)</text>
  <text x="712.5" y="111" font-size="12" fill="#1a1a1a" text-anchor="middle">Слідкуюча система • Сигнал неузгодження</text>

  <!-- Right Panel: Shaft Inputs & Top Labels -->
  <text x="595" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний кут θ₁</text>
  <line x1="595" y1="138" x2="595" y2="172" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>

  <text x="830" y="134" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Положення ротора θ₂</text>
  <line x1="830" y1="138" x2="830" y2="172" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stator Interconnections (Right Panel) -->
  <!-- S1 Line -->
  <path d="M 595,193 L 595,177 L 830,177 L 830,193" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 700,177 L 720,177" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="712.5" y="171" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">i₁</text>

  <!-- S2 Line -->
  <path d="M 567.3,241 L 567.3,300 L 802.3,300 L 802.3,241" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 670,300 L 690,300" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="685" y="294" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">i₂</text>

  <!-- S3 Line -->
  <path d="M 622.7,241 L 622.7,325 L 857.7,325 L 857.7,241" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 730,325 L 750,325" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="740" y="319" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">i₃</text>

  <!-- Synchro Units (Right Panel) -->
  <!-- SD Unit (Center 595, 225) -->
  <use href="#stator-winding-gray" x="495" y="125"/>
  <use href="#rotor-coil" x="495" y="125" transform="rotate(-30, 595, 225)"/>
  <text x="581" y="193" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">S1</text>
  <text x="555" y="248" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">S2</text>
  <text x="635" y="248" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">S3</text>
  <text x="569" y="225" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">θ₁</text>
  <text x="595" y="358" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сельсин-датчик (СД)</text>

  <!-- SPT Unit (Center 830, 225) -->
  <use href="#stator-winding-gray" x="730" y="125"/>
  <use href="#rotor-coil" x="730" y="125" transform="rotate(60, 830, 225)"/>
  <text x="816" y="193" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">S1</text>
  <text x="790" y="248" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">S2</text>
  <text x="870" y="248" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">S3</text>
  <text x="855" y="225" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">θ₂</text>
  <text x="830" y="358" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сельсин-трансформатор (СПТ)</text>

  <!-- Excitation Supply (СД Only) & Output Signal (СПТ) (Right Panel) -->
  <!-- Excitation Generator (connected ONLY to SD rotor) -->
  <circle cx="595" cy="405" r="15" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 588,405 Q 591.5,399 595,405 Q 598.5,411 602,405" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="595" y="434" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Джерело збудження U_зб</text>
  <path d="M 595,390 L 595,370 L 510,370 L 510,265 L 595,265 L 595,251" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Output Box from СПТ Rotor (via Central Corridor) -->
  <path d="M 830,251 L 830,265 L 712.5,265 L 712.5,405 L 765,405" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="765" y="390" width="130" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="830" y="409" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихід: U_неузг</text>
  <text x="830" y="434" font-size="12" fill="#6b7280" text-anchor="middle">На підсилювач / RDC</text>

  <!-- Right Bottom Summary Box -->
  <rect x="510" y="455" width="405" height="52" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="712.5" y="474" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">U_неузг = U_max · sin(θ₁ - θ₂) · sin(ωt)</text>
  <text x="712.5" y="494" font-size="12" fill="#6b7280" text-anchor="middle">Напруга дорівнює нулю при узгодженій позиції (θ₁ - θ₂ = 90°)</text>
</svg>
