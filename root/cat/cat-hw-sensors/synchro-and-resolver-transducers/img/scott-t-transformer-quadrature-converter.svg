<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Трансформатор Скотта: перетворення «сельсин (3Ф) → резольвер (2Ф)»</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Формування квадратурних напруг V_sin і V_cos із трифазного сигналу сельсина завдяки відводу 50% та обмотці √3/2</text>

  <!-- PANEL 1: Synchro (3-phase Input) -->
  <rect x="24" y="85" width="236" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="34" y="95" width="216" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="142" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Трифазний сельсин</text>

  <!-- Rotor Section -->
  <text x="142" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Обмотка збудження (Ротор)</text>
  <line x1="142" y1="154" x2="142" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="142" cy="184" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <path d="M 134 184 Q 138 177 142 184 T 150 184" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="142" y1="200" x2="142" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">U_зб = U_0 · sin(ωt)</text>

  <!-- Stator Section -->
  <text x="142" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Обмотки статора (Зірка Y)</text>
  
  <!-- Y-Winding Center Junction (Neutral N) -->
  <circle cx="142" cy="330" r="4" fill="#1a1a1a"/>
  
  <!-- Winding S1 (top-right) -->
  <path d="M 142 330 L 175 282 C 182 272 192 287 200 277 C 208 267 218 282 225 272 L 245 180" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="245" cy="180" r="4" fill="#1a1a1a"/>
  <text x="245" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">S1</text>

  <!-- Winding S2 (middle-right) -->
  <path d="M 142 330 L 170 315 C 180 305 190 325 200 315 C 210 305 220 325 230 315 L 245 290" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="245" cy="290" r="4" fill="#2457d6"/>
  <text x="245" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">S2</text>

  <!-- Winding S3 (bottom-right) -->
  <path d="M 142 330 L 175 378 C 182 388 192 373 200 383 C 208 393 218 378 225 388 L 245 420" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="245" cy="420" r="4" fill="#1a1a1a"/>
  <text x="245" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">S3</text>

  <text x="100" y="334" text-anchor="end" font-size="12" fill="#6b7280">Кут θ</text>

  <!-- Panel 1 Summary Box -->
  <rect x="34" y="468" width="216" height="48" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="142" y="488" text-anchor="middle" font-size="11" fill="#6b7280">3-фазні вихідні напруги</text>
  <text x="142" y="504" text-anchor="middle" font-size="11" fill="#1a1a1a">модульовані sin(θ) та cos(θ)</text>

  <!-- PANEL 2: Scott-T Transformer Network -->
  <rect x="276" y="85" width="404" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="286" y="95" width="384" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="478" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Схема з'єднання Скотта (Scott-T)</text>

  <!-- Teaser & Main Badges -->
  <rect x="310" y="134" width="160" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="390" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Тізерний ТР (Teaser)</text>

  <rect x="495" y="134" width="165" height="20" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="577" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Головний ТР (Main)</text>

  <!-- Input Wires from Synchro (Panel 1) to Scott-T (Panel 2) -->
  <!-- Wire S1 -->
  <path d="M 245 180 L 260 180 L 260 156 L 520 156 L 520 180" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <!-- Wire S2 (Teaser input) -->
  <path d="M 245 290 L 340 290" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Wire S3 -->
  <path d="M 245 420 L 520 420" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- TEASER TRANSFORMER (Left) -->
  <!-- Teaser Secondary Coil (Top) -->
  <text x="400" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Обмотка V_cos</text>
  <path d="M 340 200 C 340 185, 370 185, 370 200 C 370 185, 400 185, 400 200 C 400 185, 430 185, 430 200 C 430 185, 460 185, 460 200" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Teaser Core -->
  <line x1="335" y1="230" x2="465" y2="230" stroke="#6b7280" stroke-width="2"/>
  <line x1="335" y1="235" x2="465" y2="235" stroke="#6b7280" stroke-width="2"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#6b7280">Осердя Тізера</text>

  <!-- Teaser Primary Winding (Bottom: S2 to Center Tap M) -->
  <path d="M 340 290 C 340 275, 370 275, 370 290 C 370 275, 400 275, 400 290 C 400 275, 430 275, 430 290 C 430 275, 460 275, 460 290" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="460" y1="290" x2="520" y2="290" stroke="#2457d6" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">0.866 N (√3/2 N)</text>

  <!-- MAIN TRANSFORMER (Right) -->
  <!-- Main Primary Upper Coil (0.5 N) -->
  <path d="M 520 180 C 538 180, 538 207.5, 520 207.5 C 538 207.5, 538 235, 520 235 C 538 235, 538 262.5, 520 262.5 C 538 262.5, 538 290, 520 290" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="505" y="235" text-anchor="end" font-size="12" fill="#6b7280">0.5 N</text>

  <!-- Center Tap Point M (50%) -->
  <circle cx="520" cy="290" r="5" fill="#2457d6"/>
  <text x="505" y="315" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">Відвід M (50%)</text>

  <!-- Main Primary Lower Coil (0.5 N) -->
  <path d="M 520 290 C 538 290, 538 322.5, 520 322.5 C 538 322.5, 538 355, 520 355 C 538 355, 538 387.5, 520 387.5 C 538 387.5, 538 420, 520 420" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="505" y="365" text-anchor="end" font-size="12" fill="#6b7280">0.5 N</text>

  <!-- Main Core -->
  <line x1="542" y1="155" x2="542" y2="420" stroke="#6b7280" stroke-width="2"/>
  <line x1="547" y1="155" x2="547" y2="420" stroke="#6b7280" stroke-width="2"/>
  <text x="544" y="438" text-anchor="middle" font-size="11" fill="#6b7280">Осердя</text>

  <!-- Main Secondary Winding -->
  <path d="M 565 200 C 547 200, 547 236, 565 236 C 547 236, 547 272, 565 272 C 547 272, 547 308, 565 308 C 547 308, 547 344, 565 344 C 547 344, 547 380, 565 380" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="585" y="295" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Обмотка V_sin</text>

  <!-- Output Wires from Panel 2 to Panel 3 -->
  <!-- Teaser Cosine Output Wire (Top) -->
  <path d="M 340 200 L 315 200 L 315 160 L 696 160" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- Main Sine Output Wire (Middle) -->
  <path d="M 565 200 L 630 200 L 630 265 L 696 265" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Ground / Reference Wire (Bottom) -->
  <path d="M 565 380 L 696 380" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Panel 2 Callout Box -->
  <rect x="286" y="468" width="384" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="478" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Ключовий принцип Скотта:</text>
  <text x="478" y="504" text-anchor="middle" font-size="11" fill="#1a1a1a">Обмотка √3/2 зрівнює амплітуди V_sin і V_cos для 2-фазного виходу</text>

  <!-- PANEL 3: Quadrature Output & RDC Interface -->
  <rect x="696" y="85" width="240" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="706" y="95" width="220" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="816" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Двофазний квадратурний вихід</text>

  <!-- Top Card: Cosine Signal -->
  <rect x="706" y="140" width="220" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="816" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Косинусна напруга V_cos (U_β)</text>
  <text x="816" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_cos = K · U_0 · cos(θ) · sin(ωt)</text>
  <text x="816" y="210" text-anchor="middle" font-size="11" fill="#6b7280">Вихід Тізерного ТР (Teaser)</text>

  <!-- Middle Card: Sine Signal -->
  <rect x="706" y="244" width="220" height="92" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="816" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Синусна напруга V_sin (U_α)</text>
  <text x="816" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_sin = K · U_0 · sin(θ) · sin(ωt)</text>
  <text x="816" y="314" text-anchor="middle" font-size="11" fill="#6b7280">Вихід Головного ТР (Main)</text>

  <!-- Bottom Card: RDC Interface & Features -->
  <rect x="706" y="348" width="220" height="168" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="816" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Обробка в RDC / МК</text>

  <rect x="720" y="380" width="192" height="30" rx="4" fill="#f4f6f8" stroke="#2457d6"/>
  <text x="816" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">θ = arctan(V_sin / V_cos)</text>

  <text x="718" y="432" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Фазовий зсув: 90° (квадратура)</text>
  <text x="718" y="452" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Рівні амплітуди виходів</text>
  <text x="718" y="472" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Повна гальванічна розв'язка</text>
  <text x="718" y="492" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Сумісність із RDC / ADC</text>
</svg>
