<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтерфейс аналогового фронтенду (AFE) резольвера до RDC</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Диференційне фільтрування, узгодження імпедансу та заземлення екранів витих пар</text>

  <!-- PANEL 1: RESOLVER (LEFT) -->
  <rect x="30" y="75" width="220" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="40" y="85" width="200" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="140" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">РЕЗОЛЬВЕР (ДАВАЧ)</text>

  <!-- PANEL 2: CABLE (MIDDLE) -->
  <rect x="270" y="75" width="220" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
  <rect x="280" y="85" width="200" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="380" y="104" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ЕКРАНОВАНІ ВИТІ ПАРИ</text>

  <!-- PANEL 3: AFE & RDC (RIGHT) -->
  <rect x="510" y="75" width="420" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="520" y="85" width="400" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="720" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">МОДУЛЬ АФЕ ТА ПЕРЕТВОРЮВАЧ RDC</text>

  <!-- Subpanel AFE Filters -->
  <rect x="525" y="125" width="220" height="375" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="635" y="143" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вхідні фільтри та узгодження</text>

  <!-- Subpanel RDC IC -->
  <rect x="760" y="125" width="160" height="375" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="840" y="145" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікросхема RDC</text>

  <!-- ==================== ROW 1: EXCITATION (R1 - R2) ==================== -->
  <!-- Resolver Rotor Coil -->
  <text x="115" y="133" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обмотка збудження</text>
  <path d="M 75,150 C 60,150 60,160 75,160 C 60,160 60,170 75,170 C 60,170 60,180 75,180 C 60,180 60,190 75,190" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="75" y1="150" x2="240" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="75" y1="190" x2="240" y2="190" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="240" cy="150" r="3" fill="#2457d6"/>
  <circle cx="240" cy="190" r="3" fill="#2457d6"/>
  <text x="232" y="146" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R1</text>
  <text x="232" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R2</text>
  <text x="120" y="214" font-size="12" fill="#6b7280" text-anchor="middle">V_exc = Vm · sin(ωt)</text>

  <!-- Cable Excitation Shield & Lines -->
  <text x="380" y="133" font-size="12" fill="#6b7280" text-anchor="middle">Пара збудження R1 / R2</text>
  <rect x="285" y="140" width="190" height="60" fill="none" stroke="#6b7280" stroke-dasharray="4 3" rx="4"/>
  <line x1="240" y1="150" x2="540" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="240" y1="190" x2="540" y2="190" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Driver Amp in AFE -->
  <rect x="540" y="142" width="90" height="56" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="585" y="163" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвер</text>
  <text x="585" y="179" font-size="12" fill="#2457d6" text-anchor="middle">збудження</text>

  <!-- Reference Connection to RDC -->
  <line x1="630" y1="155" x2="760" y2="155" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="630" y1="185" x2="760" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="760" cy="155" r="3" fill="#2457d6"/>
  <circle cx="760" cy="185" r="3" fill="#2457d6"/>
  <text x="768" y="159" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">EXC+</text>
  <text x="768" y="189" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">EXC-</text>

  <!-- ==================== ROW 2: SINE CHANNEL (S1 - S3) ==================== -->
  <!-- Resolver Sine Coil -->
  <text x="115" y="253" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обмотка статора SIN</text>
  <path d="M 75,270 C 60,270 60,280 75,280 C 60,280 60,290 75,290 C 60,290 60,300 75,300 C 60,300 60,310 75,310" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="75" y1="270" x2="240" y2="270" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="75" y1="310" x2="240" y2="310" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="240" cy="270" r="3" fill="#27ae60"/>
  <circle cx="240" cy="310" r="3" fill="#27ae60"/>
  <text x="232" y="266" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S1 (SIN+)</text>
  <text x="232" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S3 (SIN-)</text>
  <text x="120" y="334" font-size="12" fill="#6b7280" text-anchor="middle">V_SIN = K·V_exc·sin(θ)</text>

  <!-- Cable SIN Shield & Lines -->
  <text x="380" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Вита пара: Канал SIN</text>
  <rect x="285" y="260" width="190" height="60" fill="none" stroke="#6b7280" stroke-dasharray="4 3" rx="4"/>
  <line x1="240" y1="270" x2="540" y2="270" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="240" y1="310" x2="540" y2="310" stroke="#27ae60" stroke-width="1.5"/>

  <!-- AFE SIN Filters & Termination -->
  <!-- Series RF on S1 -->
  <rect x="548" y="265" width="22" height="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="559" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">RF</text>

  <!-- Series RF on S3 -->
  <rect x="548" y="305" width="22" height="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="559" y="327" font-size="12" fill="#1a1a1a" text-anchor="middle">RF</text>

  <!-- Termination Rterm across SIN -->
  <line x1="595" y1="270" x2="595" y2="283" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="590" y="283" width="10" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="595" y1="297" x2="595" y2="310" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="595" cy="270" r="2.5" fill="#27ae60"/>
  <circle cx="595" cy="310" r="2.5" fill="#27ae60"/>
  <text x="605" y="294" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_term</text>

  <!-- Differential CD capacitor -->
  <line x1="645" y1="270" x2="645" y2="286" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="639" y1="286" x2="651" y2="286" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="639" y1="294" x2="651" y2="294" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="645" y1="294" x2="645" y2="310" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="645" cy="270" r="2.5" fill="#27ae60"/>
  <circle cx="645" cy="310" r="2.5" fill="#27ae60"/>
  <text x="656" y="294" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">CD</text>

  <!-- Common-mode CCM capacitors to AGND -->
  <line x1="700" y1="270" x2="700" y2="284" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="694" y1="284" x2="706" y2="284" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="694" y1="290" x2="706" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="700" y1="290" x2="700" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <line x1="700" y1="310" x2="700" y2="301" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="694" y1="301" x2="706" y2="301" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="694" y1="295" x2="706" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="700" cy="270" r="2.5" fill="#27ae60"/>
  <circle cx="700" cy="310" r="2.5" fill="#27ae60"/>
  <text x="710" y="294" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">CCM</text>

  <!-- RDC Pins SIN -->
  <circle cx="760" cy="270" r="3" fill="#27ae60"/>
  <circle cx="760" cy="310" r="3" fill="#27ae60"/>
  <text x="768" y="274" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">SIN+</text>
  <text x="768" y="314" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">SIN-</text>

  <!-- ==================== ROW 3: COSINE CHANNEL (S2 - S4) ==================== -->
  <!-- Resolver Cosine Coil -->
  <text x="115" y="373" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обмотка статора COS</text>
  <path d="M 75,390 C 60,390 60,400 75,400 C 60,400 60,410 75,410 C 60,410 60,420 75,420 C 60,420 60,430 75,430" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="75" y1="390" x2="240" y2="390" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="75" y1="430" x2="240" y2="430" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="240" cy="390" r="3" fill="#27ae60"/>
  <circle cx="240" cy="430" r="3" fill="#27ae60"/>
  <text x="232" y="386" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S2 (COS+)</text>
  <text x="232" y="426" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S4 (COS-)</text>
  <text x="120" y="454" font-size="12" fill="#6b7280" text-anchor="middle">V_COS = K·V_exc·cos(θ)</text>

  <!-- Cable COS Shield & Lines -->
  <text x="380" y="373" font-size="12" fill="#6b7280" text-anchor="middle">Вита пара: Канал COS</text>
  <rect x="285" y="380" width="190" height="60" fill="none" stroke="#6b7280" stroke-dasharray="4 3" rx="4"/>
  <line x1="240" y1="390" x2="540" y2="390" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="240" y1="430" x2="540" y2="430" stroke="#27ae60" stroke-width="1.5"/>

  <!-- AFE COS Filters & Termination -->
  <!-- Series RF on S2 -->
  <rect x="548" y="385" width="22" height="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="559" y="378" font-size="12" fill="#1a1a1a" text-anchor="middle">RF</text>

  <!-- Series RF on S4 -->
  <rect x="548" y="425" width="22" height="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="559" y="447" font-size="12" fill="#1a1a1a" text-anchor="middle">RF</text>

  <!-- Termination Rterm across COS -->
  <line x1="595" y1="390" x2="595" y2="403" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="590" y="403" width="10" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="595" y1="417" x2="595" y2="430" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="595" cy="390" r="2.5" fill="#27ae60"/>
  <circle cx="595" cy="430" r="2.5" fill="#27ae60"/>
  <text x="605" y="414" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_term</text>

  <!-- Differential CD capacitor -->
  <line x1="645" y1="390" x2="645" y2="406" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="639" y1="406" x2="651" y2="406" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="639" y1="414" x2="651" y2="414" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="645" y1="414" x2="645" y2="430" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="645" cy="390" r="2.5" fill="#27ae60"/>
  <circle cx="645" cy="430" r="2.5" fill="#27ae60"/>
  <text x="656" y="414" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">CD</text>

  <!-- Common-mode CCM capacitors to AGND -->
  <line x1="700" y1="390" x2="700" y2="404" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="694" y1="404" x2="706" y2="404" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="694" y1="410" x2="706" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="700" y1="410" x2="700" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <line x1="700" y1="430" x2="700" y2="421" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="694" y1="421" x2="706" y2="421" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="694" y1="415" x2="706" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="700" cy="390" r="2.5" fill="#27ae60"/>
  <circle cx="700" cy="430" r="2.5" fill="#27ae60"/>
  <text x="710" y="414" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">CCM</text>

  <!-- RDC Pins COS -->
  <circle cx="760" cy="390" r="3" fill="#27ae60"/>
  <circle cx="760" cy="430" r="3" fill="#27ae60"/>
  <text x="768" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">COS+</text>
  <text x="768" y="434" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">COS-</text>

  <!-- ==================== GROUNDING & SHIELDING DETAILS ==================== -->
  <!-- Common Shield Interconnection Line in Cable -->
  <line x1="475" y1="170" x2="475" y2="465" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="475" y1="465" x2="535" y2="465" stroke="#6b7280" stroke-width="1.5"/>

  <!-- AGND Ground Symbol in AFE -->
  <line x1="535" y1="465" x2="535" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="523" y1="475" x2="547" y2="475" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="527" y1="479" x2="543" y2="479" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="531" y1="483" x2="539" y2="483" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="535" y="497" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AGND</text>

  <!-- Shield Grounding Callout Banner -->
  <rect x="280" y="460" width="180" height="34" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="370" y="474" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Заземлення екранів</text>
  <text x="370" y="488" font-size="12" fill="#27ae60" text-anchor="middle">лише в 1 точці (боки AFE)</text>

  <!-- Resolver Side Shield Isolation Callout -->
  <rect x="45" y="465" width="190" height="34" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="140" y="479" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Екран не заземлювати!</text>
  <text x="140" y="493" font-size="12" fill="#c0392b" text-anchor="middle">(запобігання контуру)</text>

  <!-- ==================== RDC INTERNAL CORE & OUTPUT ==================== -->
  <!-- RDC Tracking Converter Block -->
  <rect x="808" y="235" width="95" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="855" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Слідкувальний</text>
  <text x="855" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">демодулятор</text>
  <text x="855" y="290" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">та АЦП</text>
  <text x="855" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення</text>
  <text x="855" y="341" font-size="12" fill="#1a1a1a" text-anchor="middle">кута θ = atan(S/C)</text>
  <text x="855" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RDC CORE</text>

  <!-- Output Signal Arrow -->
  <line x1="855" y1="385" x2="855" y2="455" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="805" y="460" width="100" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="855" y="477" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід: Кут θ</text>

</svg>
