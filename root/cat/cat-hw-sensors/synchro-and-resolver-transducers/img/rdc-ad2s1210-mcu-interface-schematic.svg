<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення RDC AD2S1210 до мікроконтролера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">SPI-інтерфейс передає кут і швидкість, а GPIO керують режимами A0/A1, стробом SAMPLE та скиданням</text>

  <!-- Panel 1: Power & Configuration (Left) -->
  <rect x="20" y="70" width="200" height="470" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="120" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Живлення та конфігурація</text>
  <text x="120" y="108" font-size="12" fill="#6b7280" text-anchor="middle">Розв'язка та режим</text>

  <!-- Analog Power & Decoupling -->
  <text x="28" y="132" font-size="11" font-weight="bold" fill="#2457d6">+5V AVDD</text>
  <line x1="28" y1="138" x2="240" y2="138" stroke="#2457d6" stroke-width="1.5"/>

  <!-- C1 (100nF) -->
  <text x="80" y="162" font-size="11" fill="#6b7280" text-anchor="end">C1: 100nF</text>
  <line x1="90" y1="138" x2="90" y2="155" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="83" y1="155" x2="97" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="83" y1="161" x2="97" y2="161" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="161" x2="90" y2="185" stroke="#6b7280" stroke-width="1.5"/>

  <!-- C2 (10uF) -->
  <text x="145" y="162" font-size="11" fill="#6b7280" text-anchor="end">C2: 10 µF</text>
  <line x1="155" y1="138" x2="155" y2="155" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="148" y1="155" x2="162" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="148" y1="161" x2="162" y2="161" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="155" y1="161" x2="155" y2="185" stroke="#6b7280" stroke-width="1.5"/>

  <!-- AGND Line -->
  <line x1="28" y1="185" x2="240" y2="185" stroke="#6b7280" stroke-width="1.5"/>
  <text x="28" y="180" font-size="11" fill="#6b7280">AGND</text>

  <!-- Digital Power & Decoupling -->
  <text x="28" y="207" font-size="11" font-weight="bold" fill="#2457d6">+3.3V DVDD</text>
  <line x1="28" y1="213" x2="240" y2="213" stroke="#2457d6" stroke-width="1.5"/>

  <!-- C3 (100nF) -->
  <text x="80" y="237" font-size="11" fill="#6b7280" text-anchor="end">C3: 100nF</text>
  <line x1="90" y1="213" x2="90" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="83" y1="230" x2="97" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="83" y1="236" x2="97" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="236" x2="90" y2="260" stroke="#6b7280" stroke-width="1.5"/>

  <!-- C4 (10uF) -->
  <text x="145" y="237" font-size="11" fill="#6b7280" text-anchor="end">C4: 10 µF</text>
  <line x1="155" y1="213" x2="155" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="148" y1="230" x2="162" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="148" y1="236" x2="162" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="155" y1="236" x2="155" y2="260" stroke="#6b7280" stroke-width="1.5"/>

  <!-- DGND Line -->
  <line x1="28" y1="260" x2="240" y2="260" stroke="#6b7280" stroke-width="1.5"/>
  <text x="28" y="255" font-size="11" fill="#6b7280">DGND</text>

  <!-- Ground Connection via Ferrite Bead FB1 -->
  <line x1="195" y1="185" x2="195" y2="280" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="187" y="280" width="16" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="183" y="292" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">FB1 (Феріт)</text>
  <line x1="195" y1="296" x2="195" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <text x="180" y="314" font-size="11" fill="#27ae60" text-anchor="end">Star GND</text>

  <!-- Ground Symbol -->
  <line x1="185" y1="310" x2="205" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="189" y1="314" x2="201" y2="314" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="193" y1="318" x2="197" y2="318" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Resolution Configuration Sub-box -->
  <rect x="30" y="340" width="180" height="65" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="120" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігурація RES</text>
  <text x="120" y="374" font-size="11" fill="#6b7280" text-anchor="middle">RES0=1, RES1=1 (16 біт)</text>
  <text x="120" y="391" font-size="11" fill="#2457d6" text-anchor="middle">R_pullup = 10 кОм</text>
  <line x1="210" y1="361" x2="240" y2="361" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="210" y1="381" x2="240" y2="381" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Clock Source Sub-box -->
  <rect x="30" y="420" width="180" height="50" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="120" y="437" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тактовий генератор</text>
  <text x="120" y="454" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">OSC 8.192 МГц</text>
  <line x1="210" y1="445" x2="240" y2="445" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Resolver Inputs Sub-box -->
  <rect x="30" y="480" width="180" height="50" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="120" y="497" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Входи резольвера</text>
  <text x="120" y="515" font-size="12" fill="#6b7280" text-anchor="middle">SIN/COS (Фільтр)</text>
  <line x1="210" y1="505" x2="240" y2="505" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Panel 2: AD2S1210 IC (Center) -->
  <rect x="240" y="70" width="240" height="470" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="360" y="92" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">AD2S1210 (RDC)</text>
  <text x="360" y="108" font-size="12" fill="#6b7280" text-anchor="middle">Перетворювач резольвер-код</text>

  <!-- Left Pins inside AD2S1210 -->
  <text x="245" y="134" font-size="11" font-weight="bold" fill="#2457d6">AVDD</text>
  <text x="245" y="181" font-size="11" fill="#6b7280">AGND</text>
  <text x="245" y="209" font-size="11" font-weight="bold" fill="#2457d6">DVDD</text>
  <text x="245" y="256" font-size="11" fill="#6b7280">DGND</text>
  <text x="245" y="357" font-size="11" fill="#1a1a1a">RES0</text>
  <text x="245" y="377" font-size="11" fill="#1a1a1a">RES1</text>
  <text x="245" y="441" font-size="11" fill="#1a1a1a">CLKIN</text>
  <text x="245" y="501" font-size="11" fill="#1a1a1a">SIN/COS</text>

  <!-- AD2S1210 Inner Architecture Block -->
  <rect x="295" y="125" width="130" height="400" fill="white" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="360" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ядро RDC</text>
  <text x="360" y="168" font-size="11" fill="#6b7280" text-anchor="middle">Демодулятор</text>
  <text x="360" y="183" font-size="11" fill="#6b7280" text-anchor="middle">сигналів</text>
  <text x="360" y="210" font-size="11" fill="#6b7280" text-anchor="middle">Слідкуючий АЦП</text>
  <text x="360" y="225" font-size="11" fill="#6b7280" text-anchor="middle">(Type II Tracking)</text>
  <text x="360" y="252" font-size="11" fill="#6b7280" text-anchor="middle">Регістр кута</text>
  <text x="360" y="267" font-size="11" fill="#6b7280" text-anchor="middle">та швидкості</text>
  <text x="360" y="305" font-size="11" fill="#6b7280" text-anchor="middle">Контролер SPI</text>
  <text x="360" y="320" font-size="11" fill="#6b7280" text-anchor="middle">та режимів A0/A1</text>
  <text x="360" y="358" font-size="11" fill="#6b7280" text-anchor="middle">Детектор помилок</text>
  <text x="360" y="373" font-size="11" fill="#6b7280" text-anchor="middle">Loss of Signal</text>
  <text x="360" y="388" font-size="11" fill="#6b7280" text-anchor="middle">Loss of Track</text>
  <text x="360" y="435" font-size="11" fill="#6b7280" text-anchor="middle">Блок живлення</text>
  <text x="360" y="450" font-size="11" fill="#6b7280" text-anchor="middle">AVDD / DVDD</text>

  <!-- Right Pins inside AD2S1210 -->
  <text x="475" y="157" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">CS</text>
  <text x="475" y="183" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SCLK</text>
  <text x="475" y="209" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SDO</text>
  <text x="475" y="235" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SDI</text>
  <text x="475" y="299" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">SAMPLE</text>
  <text x="475" y="329" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">RESET</text>
  <text x="475" y="393" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">A0</text>
  <text x="475" y="423" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">A1</text>
  <text x="475" y="489" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">FAULT</text>

  <!-- Interconnection Group 1: SPI Interface -->
  <rect x="500" y="130" width="170" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="585" y="143" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Інтерфейс SPI</text>

  <text x="585" y="156" font-size="11" fill="#2457d6" text-anchor="middle">CS — Вибір чипа</text>
  <line x1="690" y1="162" x2="480" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="585" y="182" font-size="11" fill="#2457d6" text-anchor="middle">SCLK — Тактування</text>
  <line x1="690" y1="188" x2="480" y2="188" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="585" y="208" font-size="11" fill="#2457d6" text-anchor="middle">SDO → MISO (Дані)</text>
  <line x1="480" y1="214" x2="690" y2="214" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="585" y="234" font-size="11" fill="#2457d6" text-anchor="middle">SDI ← MOSI (Команди)</text>
  <line x1="690" y1="240" x2="480" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Interconnection Group 2: Control Signals -->
  <rect x="500" y="270" width="170" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="585" y="283" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сигнали управління</text>

  <text x="585" y="297" font-size="11" fill="#1a1a1a" text-anchor="middle">SAMPLE (Строб)</text>
  <line x1="690" y1="305" x2="480" y2="305" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <text x="585" y="327" font-size="11" fill="#1a1a1a" text-anchor="middle">RESET (Скидання)</text>
  <line x1="690" y1="335" x2="480" y2="335" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Interconnection Group 3: Address / Mode -->
  <rect x="500" y="365" width="170" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="585" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вибір режиму (A0, A1)</text>

  <text x="585" y="390" font-size="11" fill="#1a1a1a" text-anchor="middle">A0 (Режим 0)</text>
  <line x1="690" y1="398" x2="480" y2="398" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <text x="585" y="420" font-size="11" fill="#1a1a1a" text-anchor="middle">A1 (Режим 1)</text>
  <line x1="690" y1="428" x2="480" y2="428" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Interconnection Group 4: Diagnostics / Fault -->
  <rect x="500" y="460" width="170" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" rx="6"/>
  <text x="585" y="473" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Сигнал помилки</text>

  <text x="585" y="487" font-size="11" fill="#c0392b" text-anchor="middle">SOST / FAULT (Аварія)</text>
  <line x1="480" y1="495" x2="690" y2="495" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Panel 3: Microcontroller MCU (Right) -->
  <rect x="690" y="70" width="250" height="470" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="815" y="92" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="815" y="108" font-size="12" fill="#6b7280" text-anchor="middle">STM32 / ESP32 / C2000</text>

  <!-- Left Pins inside MCU -->
  <text x="698" y="157" font-size="11" font-weight="bold" fill="#2457d6">SPI_CS</text>
  <text x="698" y="183" font-size="11" font-weight="bold" fill="#2457d6">SPI_SCK</text>
  <text x="698" y="209" font-size="11" font-weight="bold" fill="#2457d6">SPI_MISO</text>
  <text x="698" y="235" font-size="11" font-weight="bold" fill="#2457d6">SPI_MOSI</text>
  <text x="698" y="300" font-size="11" fill="#1a1a1a">GPIO_SAMPLE</text>
  <text x="698" y="330" font-size="11" fill="#1a1a1a">GPIO_RESET</text>
  <text x="698" y="393" font-size="11" fill="#1a1a1a">GPIO_A0</text>
  <text x="698" y="423" font-size="11" fill="#1a1a1a">GPIO_A1</text>
  <text x="698" y="490" font-size="11" font-weight="bold" fill="#c0392b">EXTI_FAULT</text>

  <!-- MCU Internal Modules -->
  <!-- SPI Module -->
  <rect x="775" y="130" width="150" height="120" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="850" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Периферія SPI</text>
  <text x="850" y="168" font-size="11" fill="#6b7280" text-anchor="middle">Режим 1 (CPOL=0)</text>
  <text x="850" y="186" font-size="11" fill="#6b7280" text-anchor="middle">CPHA=1 (Trailing)</text>
  <text x="850" y="204" font-size="11" fill="#6b7280" text-anchor="middle">f_SCLK ≤ 25 МГц</text>
  <text x="850" y="222" font-size="11" fill="#6b7280" text-anchor="middle">16-бітний кадр</text>

  <!-- GPIO Module -->
  <rect x="775" y="270" width="150" height="170" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="850" y="288" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль GPIO</text>
  <text x="850" y="308" font-size="11" fill="#6b7280" text-anchor="middle">Строб SAMPLE</text>
  <text x="850" y="328" font-size="11" fill="#6b7280" text-anchor="middle">Скидання RESET</text>
  <text x="850" y="368" font-size="11" fill="#6b7280" text-anchor="middle">Режими A0, A1</text>
  <text x="850" y="388" font-size="11" fill="#6b7280" text-anchor="middle">Вибір сигналу:</text>
  <text x="850" y="408" font-size="11" fill="#6b7280" text-anchor="middle">Позиція / Швидкість</text>

  <!-- EXTI Module -->
  <rect x="775" y="460" width="150" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="850" y="480" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Обробка EXTI</text>
  <text x="850" y="500" font-size="11" fill="#c0392b" text-anchor="middle">Сигнал тривоги</text>
</svg>
