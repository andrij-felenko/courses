<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Main Titles -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Маркування виводів та топологія обмоток сільсина і резольвера</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Сільсин: 3-фазна зірка статора (120°) | Резольвер: 2-фазна ортогональна схема (90°)</text>

  <!-- PANEL 1: SYNCHRO -->
  <rect x="30" y="75" width="435" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="247" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Сільсин (Synchro)</text>
  <text x="247" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">3-фазна зіркова топологія статора (120°)</text>

  <!-- Card 1A: Rotor Excitation Winding -->
  <rect x="45" y="128" width="405" height="96" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Обмотка збудження (Ротор): R1 – R2</text>
  <text x="55" y="164" font-size="12" fill="#6b7280">Живлення: 115 V / 26 V (400 Гц–10 кГц)</text>
  <text x="55" y="182" font-size="12" fill="#2457d6">1-фазне первинне збудження ротора</text>

  <!-- Rotor Coil schematic R1-R2 -->
  <text x="320" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">R1</text>
  <circle cx="330" cy="160" r="4" fill="#2457d6"/>
  <path d="M 330,160 C 335,148 340,148 345,160 C 350,148 355,148 360,160 C 365,148 370,148 375,160 C 380,148 385,148 390,160" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="390" cy="160" r="4" fill="#2457d6"/>
  <text x="400" y="164" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">R2</text>

  <!-- AC Source symbol -->
  <path d="M 330,160 L 330,190 L 348,190" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 390,160 L 390,190 L 372,190" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="360" cy="190" r="10" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 354,190 Q 357,185 360,190 T 366,190" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="218" text-anchor="middle" font-size="12" fill="#6b7280">U_exc(t)</text>

  <!-- Card 1B: Stator Windings (Star / Y) -->
  <rect x="45" y="238" width="405" height="203" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="255" font-size="12" font-weight="bold" fill="#1a1a1a">Вторинні обмотки (Статор): Зірка (Y)</text>
  <text x="55" y="270" font-size="12" fill="#6b7280">Три виводи S1, S2, S3 зі зсувом 120°</text>

  <!-- Star Topology Schematic -->
  <circle cx="185" cy="355" r="4" fill="#1a1a1a"/>
  <text x="185" y="376" text-anchor="middle" font-size="12" fill="#6b7280">N</text>

  <path d="M 185,345 C 175,341 175,333 185,329 C 175,325 175,317 185,313 C 175,309 175,301 185,297" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="185" y1="297" x2="185" y2="292" stroke="#2457d6" stroke-width="2"/>
  <circle cx="185" cy="292" r="4.5" fill="#2457d6"/>
  <text x="185" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">S1</text>

  <path d="M 177,360 C 170.1,357.1 162.5,361.6 161.7,369.0 C 154.8,366.1 147.1,370.6 146.3,378.0 C 139.5,375.1 131.8,379.6 131.0,387.0" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="131" y1="387" x2="122" y2="392" stroke="#2457d6" stroke-width="2"/>
  <circle cx="122" cy="392" r="4.5" fill="#2457d6"/>
  <text x="106" y="396" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">S2</text>

  <path d="M 193,360 C 199.9,357.1 207.5,361.6 208.3,369.0 C 215.2,366.1 222.9,370.6 223.7,378.0 C 230.5,375.1 238.2,379.6 239.0,387.0" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="239" y1="387" x2="248" y2="392" stroke="#2457d6" stroke-width="2"/>
  <circle cx="248" cy="392" r="4.5" fill="#2457d6"/>
  <text x="264" y="396" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">S3</text>

  <path d="M 185,325 A 30,30 0 0,1 211,370" fill="none" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="220" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">120°</text>

  <!-- Card 1B Info Box (Equations) -->
  <rect x="305" y="285" width="135" height="142" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="372" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Лінійні напруги</text>
  <text x="313" y="326" font-size="12" fill="#1a1a1a">V_S12: sin(θ)</text>
  <text x="313" y="348" font-size="12" fill="#1a1a1a">V_S32: sin(θ + 120°)</text>
  <text x="313" y="370" font-size="12" fill="#1a1a1a">V_S13: sin(θ + 240°)</text>
  <text x="313" y="412" font-size="12" fill="#6b7280">* несуча: sin(ωt)</text>

  <!-- PANEL 2: RESOLVER -->
  <rect x="495" y="75" width="435" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="712" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Резольвер (Resolver)</text>
  <text x="712" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">2-фазна ортогональна топологія статора (90°)</text>

  <!-- Card 2A: Rotor Excitation Winding -->
  <rect x="510" y="128" width="405" height="96" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="520" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Обмотка збудження (Ротор): R1 – R2</text>
  <text x="520" y="164" font-size="12" fill="#6b7280">Живлення: 2 V – 26 V (2 кГц–20 кГц)</text>
  <text x="520" y="182" font-size="12" fill="#27ae60">1-фазне первинне збудження ротора</text>

  <!-- Rotor Coil schematic R1-R2 -->
  <text x="785" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">R1</text>
  <circle cx="795" cy="160" r="4" fill="#27ae60"/>
  <path d="M 795,160 C 800,148 805,148 810,160 C 815,148 820,148 825,160 C 830,148 835,148 840,160 C 845,148 850,148 855,160" fill="none" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
  <circle cx="855" cy="160" r="4" fill="#27ae60"/>
  <text x="865" y="164" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">R2</text>

  <!-- AC Source symbol -->
  <path d="M 795,160 L 795,190 L 813,190" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M 855,160 L 855,190 L 837,190" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="825" cy="190" r="10" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 819,190 Q 822,185 825,190 T 831,190" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="825" y="218" text-anchor="middle" font-size="12" fill="#6b7280">U_exc(t)</text>

  <!-- Card 2B: Stator Windings (Orthogonal / Quadrature) -->
  <rect x="510" y="238" width="405" height="203" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="520" y="255" font-size="12" font-weight="bold" fill="#1a1a1a">Вторинні обмотки (Статор): Ортогональні (90°)</text>
  <text x="520" y="270" font-size="12" fill="#6b7280">Дві незалежні фази S1–S3 та S2–S4</text>

  <!-- Orthogonal Schematic -->
  <!-- Phase 1: Cosine (S1–S3, Vertical) -->
  <circle cx="640" cy="292" r="4.5" fill="#27ae60"/>
  <text x="640" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">S1</text>
  <line x1="640" y1="292" x2="640" y2="305" stroke="#27ae60" stroke-width="2"/>
  <path d="M 640,305 C 628,311 628,317 640,323 C 628,329 628,335 640,341 M 640,379 C 628,385 628,391 640,397 C 628,403 628,409 640,415" fill="none" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
  <line x1="640" y1="415" x2="640" y2="423" stroke="#27ae60" stroke-width="2"/>
  <circle cx="640" cy="423" r="4.5" fill="#27ae60"/>
  <text x="640" y="437" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">S3</text>

  <!-- Phase 2: Sine (S2–S4, Horizontal) -->
  <circle cx="560" cy="360" r="4.5" fill="#2457d6"/>
  <text x="548" y="364" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">S2</text>
  <line x1="560" y1="360" x2="575" y2="360" stroke="#2457d6" stroke-width="2"/>
  <path d="M 575,360 C 581,348 587,348 593,360 C 599,348 605,348 611,360 M 669,360 C 675,348 681,348 687,360 C 693,348 699,348 705,360" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <line x1="705" y1="360" x2="720" y2="360" stroke="#2457d6" stroke-width="2"/>
  <circle cx="720" cy="360" r="4.5" fill="#2457d6"/>
  <text x="732" y="364" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">S4</text>

  <!-- 90° angle symbol at center -->
  <path d="M 640,346 L 654,346 L 654,360" fill="none" stroke="#27ae60" stroke-width="1.2"/>
  <text x="662" y="340" font-size="12" font-weight="bold" fill="#27ae60">90°</text>

  <!-- Card 2B Info Box (Equations) -->
  <rect x="770" y="285" width="135" height="142" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="837" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вихідні напруги</text>
  <text x="778" y="326" font-size="12" font-weight="bold" fill="#27ae60">Фаза Cos (S1–S3):</text>
  <text x="778" y="344" font-size="12" fill="#1a1a1a">V_S1-S3 = E · cos θ</text>
  <text x="778" y="370" font-size="12" font-weight="bold" fill="#2457d6">Фаза Sin (S2–S4):</text>
  <text x="778" y="388" font-size="12" fill="#1a1a1a">V_S2-S4 = E · sin θ</text>
  <text x="778" y="412" font-size="12" fill="#6b7280">* несуча: sin(ωt)</text>
</svg>
