<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#4b5563"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Годограф вектора напруг та діагностика несправностей резольвера</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#64748b">Контроль норми амплітуди вектора √(U_sin² + U_cos²) = k·U₀ для миттєвого виявлення обривів і завад</text>

  <!-- LEFT PANEL: Hodograph Circle -->
  <rect x="30" y="75" width="450" height="425" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="255" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Годограф на комплексній площині (U_cos, U_sin)</text>

  <!-- Tolerance Annular Band -->
  <circle cx="255" cy="285" r="145" fill="none" stroke="#fca5a5" stroke-dasharray="5,4" stroke-width="1.5"/>
  <circle cx="255" cy="285" r="95" fill="none" stroke="#fdba74" stroke-dasharray="5,4" stroke-width="1.5"/>
  <!-- Normal operating ring -->
  <path d="M 255 150 A 135 135 0 1 0 255 420 A 135 135 0 1 0 255 150 M 255 180 A 105 105 0 1 1 255 390 A 105 105 0 1 1 255 180" fill="#dcfce7" fill-opacity="0.5"/>

  <!-- Main Operating Circle -->
  <circle cx="255" cy="285" r="120" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Axes -->
  <line x1="75" y1="285" x2="435" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="255" y1="460" x2="255" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="278" font-size="13" font-weight="bold" fill="#475569">U_cos</text>
  <text x="265" y="125" font-size="13" font-weight="bold" fill="#475569">U_sin</text>
  <text x="245" y="298" font-size="11" fill="#94a3b8">0</text>

  <!-- Rotating Vector -->
  <line x1="255" y1="285" x2="340" y2="200" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)"/>
  <!-- Angle Arc -->
  <path d="M 295 285 A 40 40 0 0 0 283 257" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="265" font-size="13" font-weight="bold" fill="#d97706">θ</text>

  <!-- Vector Label -->
  <text x="315" y="235" font-size="12" font-weight="bold" fill="#2563eb">U(θ)</text>

  <!-- Fault Point (Broken Wire) -->
  <circle cx="265" cy="290" r="5" fill="#ef4444"/>
  <text x="280" y="315" font-size="11" font-weight="bold" fill="#dc2626">Обрив S1-S4: |U| → 0</text>

  <!-- Limits Labels -->
  <text x="255" y="160" text-anchor="middle" font-size="10" fill="#dc2626">U_max (верхня межа)</text>
  <text x="255" y="380" text-anchor="middle" font-size="10" fill="#d97706">U_min (нижня межа)</text>
  <text x="375" y="170" font-size="11" font-weight="bold" fill="#16a34a">Норма: |U| = k·U₀</text>

  <!-- RIGHT PANEL: Diagnostics & Faults Matrix -->
  <rect x="500" y="75" width="430" height="425" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="715" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Критерії діагностики та апаратні стани</text>

  <!-- Math Rule Box -->
  <rect x="520" y="125" width="390" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="715" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Тригонометричний інваріант кола:</text>
  <text x="715" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">U_sin²(θ) + U_cos²(θ) = (k · U₀)² = const</text>

  <!-- Fault Diagnostic Cards -->
  <!-- Card 1: Normal -->
  <rect x="520" y="200" width="390" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <circle cx="540" cy="230" r="8" fill="#16a34a"/>
  <text x="540" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">✓</text>
  <text x="560" y="222" font-size="13" font-weight="bold" fill="#166534">Штатний режим (Normal Tracking)</text>
  <text x="560" y="244" font-size="11.5" fill="#334155">U_min ≤ |U| ≤ U_max. Сигнали симетричні, кут θ валідний.</text>

  <!-- Card 2: LOS / Fault -->
  <rect x="520" y="270" width="390" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <circle cx="540" cy="300" r="8" fill="#ef4444"/>
  <text x="540" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">✕</text>
  <text x="560" y="292" font-size="13" font-weight="bold" fill="#991b1b">Втрата сигналу (LOS / Loss of Signal)</text>
  <text x="560" y="314" font-size="11.5" fill="#334155">|U| &lt; U_min. Обрив обмотки збудження R1-R2 або кабелю.</text>

  <!-- Card 3: DOS / Degradation -->
  <rect x="520" y="340" width="390" height="60" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="540" cy="370" r="8" fill="#f59e0b"/>
  <text x="540" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">!</text>
  <text x="560" y="362" font-size="13" font-weight="bold" fill="#92400e">Деградація сигналу (DOS / Degradation of Signal)</text>
  <text x="560" y="384" font-size="11.5" fill="#334155">Просідання амплітуди, сильний фазовий зсув або перегрів.</text>

  <!-- Card 4: Overvoltage / Saturation -->
  <rect x="520" y="410" width="390" height="60" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
  <circle cx="540" cy="440" r="8" fill="#a855f7"/>
  <text x="540" y="444" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">⚡</text>
  <text x="560" y="432" font-size="13" font-weight="bold" fill="#6b21a8">Перенапруга або асиметрія каналів</text>
  <text x="560" y="454" font-size="11.5" fill="#334155">|U| &gt; U_max або еліптичне викривлення годографа.</text>
</svg>
