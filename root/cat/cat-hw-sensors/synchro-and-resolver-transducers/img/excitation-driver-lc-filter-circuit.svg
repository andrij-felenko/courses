<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема драйвера збудження первинної обмотки резольвера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">LC-фільтрація вищого порядку та струмовий буфер для індуктивного навантаження (10 кГц)</text>

  <!-- PANEL 1: Генератор RDC -->
  <rect x="20" y="75" width="200" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="85" width="180" height="45" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="120" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Генератор RDC</text>
  <text x="120" y="121" font-size="12" fill="#6b7280" text-anchor="middle">AD2S1210 (10 кГц)</text>

  <!-- Panel 1 waveform preview box -->
  <rect x="32" y="145" width="176" height="135" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="120" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вбудований ЦАП RDC</text>
  <rect x="40" y="175" width="160" height="70" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <!-- Stepped Sine Wave -->
  <path d="M 45,210 H 52 V 198 H 60 V 188 H 70 V 183 H 85 V 188 H 95 V 198 H 103 V 210 H 117 V 222 H 125 V 232 H 135 V 237 H 150 V 232 H 160 V 222 H 168 V 210 H 195" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="268" font-size="12" fill="#c0392b" text-anchor="middle">ВЧ-шум дискретизації</text>

  <!-- Output pin lines in Panel 1 -->
  <line x1="120" y1="330" x2="200" y2="330" stroke="#2457d6" stroke-width="2"/>
  <circle cx="200" cy="330" r="4" fill="#2457d6"/>
  <text x="190" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">EXC</text>

  <line x1="120" y1="430" x2="200" y2="430" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="200" cy="430" r="4" fill="#6b7280"/>
  <text x="190" y="422" font-size="12" fill="#6b7280" text-anchor="end">EXCB (не викор.)</text>

  <!-- Connection Panel 1 -> 2 -->
  <line x1="200" y1="330" x2="245" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="232.5" y="318" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_DAC</text>

  <!-- PANEL 2: Пасивний LC-фільтр -->
  <rect x="245" y="75" width="210" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="255" y="85" width="190" height="45" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="350" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Пасивний LC-фільтр</text>
  <text x="350" y="121" font-size="12" fill="#6b7280" text-anchor="middle">Фільтрація 2-го порядку</text>

  <!-- Panel 2 sine preview box -->
  <rect x="257" y="145" width="186" height="110" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="350" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Відфільтрований синус</text>
  <path d="M 267,205 Q 288,175 309,205 T 351,205 T 393,205 T 433,205" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="242" font-size="12" fill="#6b7280" text-anchor="middle">fc ≈ 34 кГц, THD &lt; 0.5%</text>

  <!-- Inductor Lf -->
  <line x1="245" y1="330" x2="270" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 270,330 A 7.5,7.5 0 0,1 285,330 A 7.5,7.5 0 0,1 300,330 A 7.5,7.5 0 0,1 315,330 A 7.5,7.5 0 0,1 330,330" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Lf = 220 µH</text>
  <text x="300" y="310" font-size="12" fill="#6b7280" text-anchor="middle">(дросель)</text>

  <!-- Node & Capacitor Cf -->
  <line x1="330" y1="330" x2="360" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="360" cy="330" r="3" fill="#1a1a1a"/>
  <line x1="360" y1="330" x2="360" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="345" y1="365" x2="375" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="345" y1="373" x2="375" y2="373" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="360" y1="373" x2="360" y2="425" stroke="#1a1a1a" stroke-width="2"/>

  <!-- GND at Capacitor -->
  <line x1="350" y1="425" x2="370" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="354" y1="429" x2="366" y2="429" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="358" y1="433" x2="362" y2="433" stroke="#1a1a1a" stroke-width="1"/>

  <text x="382" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Cf = 100 nF</text>
  <text x="382" y="386" font-size="12" fill="#6b7280" text-anchor="start">(Фільтр C)</text>

  <!-- Line to output of Panel 2 -->
  <line x1="360" y1="330" x2="440" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Connection Panel 2 -> 3 -->
  <line x1="440" y1="330" x2="480" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="467.5" y="318" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_FILT</text>

  <!-- PANEL 3: Драйвер струму -->
  <rect x="480" y="75" width="220" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="490" y="85" width="200" height="45" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="590" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Драйвер струму</text>
  <text x="590" y="121" font-size="12" fill="#6b7280" text-anchor="middle">ОУ + Струмовий буфер</text>

  <!-- Feedback Network Rf and Cf -->
  <line x1="530" y1="330" x2="530" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="530" y1="190" x2="530" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Rf Branch y=190 -->
  <path d="M 530,190 H 545 L 549,184 L 555,196 L 561,184 L 567,196 L 573,184 L 577,190 H 618" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="575" y="178" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rf = 20 kΩ</text>

  <!-- Cf Branch y=230 -->
  <line x1="530" y1="230" x2="570" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="570" y1="222" x2="570" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="578" y1="222" x2="578" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="578" y1="230" x2="618" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="575" y="250" font-size="12" fill="#6b7280" text-anchor="middle">Cf = 47 pF</text>

  <line x1="618" y1="190" x2="618" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="618" y1="210" x2="675" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="675" y1="210" x2="675" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Input Resistor Rin -->
  <path d="M 480,330 H 488 L 492,324 L 498,336 L 504,324 L 510,336 L 516,324 L 520,330 H 530" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="505" y="305" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rin</text>
  <text x="505" y="318" font-size="12" fill="#6b7280" text-anchor="middle">10 kΩ</text>
  <circle cx="530" cy="330" r="3" fill="#1a1a1a"/>

  <!-- Op-Amp Triangle -->
  <polygon points="545,310 545,390 595,350" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="552" y="334" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="552" y="374" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="572" y="354" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">ОУ</text>

  <!-- Non-inverting input reference GND -->
  <line x1="545" y1="370" x2="545" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="535" y1="425" x2="555" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="539" y1="429" x2="551" y2="429" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="543" y1="433" x2="547" y2="433" stroke="#1a1a1a" stroke-width="1"/>
  <text x="538" y="415" font-size="12" fill="#6b7280" text-anchor="end">V_REF (GND)</text>

  <!-- Op-Amp to Buffer line -->
  <line x1="595" y1="350" x2="620" y2="350" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Push-Pull Buffer Stage -->
  <rect x="620" y="325" width="45" height="50" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="642.5" y="346" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер</text>
  <text x="642.5" y="362" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">струму</text>

  <!-- Power supplies -->
  <line x1="642.5" y1="325" x2="642.5" y2="310" stroke="#c0392b" stroke-width="1.5"/>
  <text x="642.5" y="306" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+12V</text>

  <line x1="642.5" y1="375" x2="642.5" y2="390" stroke="#2457d6" stroke-width="1.5"/>
  <text x="642.5" y="402" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-12V</text>

  <!-- Buffer Output Node -->
  <line x1="665" y1="350" x2="685" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="675" cy="350" r="3" fill="#1a1a1a"/>

  <!-- Panel 3 Spec box at bottom -->
  <rect x="495" y="435" width="190" height="48" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="590" y="453" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_out max ≥ 200 mA</text>
  <text x="590" y="470" font-size="12" fill="#6b7280" text-anchor="middle">Низький вихідний опір</text>

  <!-- Connection Panel 3 -> 4 -->
  <line x1="685" y1="350" x2="725" y2="350" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="712.5" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_DRV</text>

  <!-- PANEL 4: Обмотка R1-R2 -->
  <rect x="725" y="75" width="215" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="735" y="85" width="195" height="45" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="832.5" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Обмотка R1-R2</text>
  <text x="832.5" y="121" font-size="12" fill="#6b7280" text-anchor="middle">Первинне коло резольвера</text>

  <!-- Winding Parameters Box -->
  <rect x="737" y="145" width="191" height="100" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="832.5" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри обмотки</text>
  <text x="832.5" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Z_in ≈ 100...200 Ω</text>
  <text x="832.5" y="202" font-size="12" fill="#6b7280" text-anchor="middle">L_in ≈ 2...5 mH</text>
  <text x="832.5" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Чистий синус 10 кГц</text>

  <!-- Blocking Cap C_DC -->
  <line x1="725" y1="350" x2="740" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="740" y1="338" x2="740" y2="362" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="748" y1="338" x2="748" y2="362" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="748" y1="350" x2="785" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="740" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C_DC = 10 µF</text>
  <text x="740" y="320" font-size="12" fill="#6b7280" text-anchor="middle">(Захист DC)</text>

  <!-- Damping Resistor Rm -->
  <path d="M 785,350 H 790 L 794,344 L 800,356 L 806,344 L 812,356 L 818,344 L 820,350 H 855" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="825" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rm = 10 Ω</text>
  <text x="825" y="320" font-size="12" fill="#6b7280" text-anchor="middle">(демпфер)</text>

  <!-- Terminal R1 -->
  <circle cx="855" cy="350" r="4" fill="#2457d6"/>
  <text x="855" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R1</text>

  <!-- Winding L_EXC (vertical coil) -->
  <path d="M 855,350 A 8,8 0 0,1 855,368 A 8,8 0 0,1 855,386 A 8,8 0 0,1 855,404 A 8,8 0 0,1 855,422 L 855,435" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="870" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">L_EXC</text>
  <text x="870" y="391" font-size="12" fill="#6b7280" text-anchor="start">(Обмотка)</text>
  <text x="870" y="407" font-size="12" fill="#6b7280" text-anchor="start">10 кГц</text>

  <!-- Current Arrow -->
  <line x1="838" y1="365" x2="838" y2="420" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="830" y="396" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_EXC</text>

  <!-- Terminal R2 (GND) -->
  <circle cx="855" cy="435" r="4" fill="#2457d6"/>
  <line x1="855" y1="435" x2="855" y2="475" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="845" y1="475" x2="865" y2="475" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="849" y1="479" x2="861" y2="479" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="853" y1="483" x2="857" y2="483" stroke="#1a1a1a" stroke-width="1"/>
  <text x="870" y="439" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R2 (GND)</text>
</svg>
