<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Демодуляція сигналів сельсина через трансформатор Скотта</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення 3-фазних АМ-напруг у 2-фазні квадратурні огинаючі sin(θ) та cos(θ)</text>

  <!-- COLUMN 1: Сельсин-давач -->
  <rect x="25" y="75" width="195" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="122.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сельсин-давач</text>
  <text x="122.5" y="116" font-size="12" fill="#6b7280" text-anchor="middle">3-фазна система напруг</text>

  <!-- Rotor Excitation Box -->
  <rect x="35" y="130" width="175" height="44" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="122.5" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Опора ротора (несуча):</text>
  <text x="122.5" y="164" font-size="12" fill="#1a1a1a" text-anchor="middle">V_c(t) = E_m sin(ω_c t)</text>

  <!-- Stator Phase Outputs -->
  <!-- Phase S1 -->
  <rect x="35" y="190" width="175" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="43" y="211" font-size="12" font-weight="bold" fill="#1a1a1a">S1:</text>
  <text x="68" y="211" font-size="12" fill="#1a1a1a">U_m sin(θ) · V_c</text>

  <!-- Phase S2 -->
  <rect x="35" y="265" width="175" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="43" y="286" font-size="12" font-weight="bold" fill="#1a1a1a">S2:</text>
  <text x="68" y="286" font-size="12" fill="#1a1a1a">U_m sin(θ+120°) · V_c</text>

  <!-- Phase S3 -->
  <rect x="35" y="340" width="175" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="43" y="361" font-size="12" font-weight="bold" fill="#1a1a1a">S3:</text>
  <text x="68" y="361" font-size="12" fill="#1a1a1a">U_m sin(θ+240°) · V_c</text>

  <text x="122.5" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Кут ротора θ кодується</text>
  <text x="122.5" y="426" font-size="12" fill="#6b7280" text-anchor="middle">в огинаючих 3 фаз</text>

  <!-- Wires from Col 1 to Col 2 -->
  <path d="M 210 207 L 236 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 210 282 L 236 282" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 210 357 L 236 335" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>


  <!-- COLUMN 2: Трансформатор Скотта -->
  <rect x="236" y="75" width="230" height="380" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="351" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Трансформатор Скотта</text>
  <text x="351" y="116" font-size="12" fill="#2457d6" text-anchor="middle">Векторне зведення (3Ф ➔ 2Ф)</text>

  <!-- Subpanel Sine / Teaser -->
  <rect x="246" y="135" width="210" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="351" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Канал синуса (Teaser)</text>
  <text x="351" y="173" font-size="12" fill="#6b7280" text-anchor="middle">V_sin = (2/√3)·[S3 - ½(S1+S2)]</text>
  <line x1="256" y1="185" x2="446" y2="185" stroke="#eaf0fd" stroke-width="1.5"/>
  <text x="351" y="206" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_sin,AM = U_m sin θ · sin(ω_c t)</text>
  <text x="351" y="225" font-size="12" fill="#6b7280" text-anchor="middle">Амплітудно-модульована несуча</text>

  <!-- Subpanel Cosine / Main -->
  <rect x="246" y="265" width="210" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="351" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Канал косинуса (Main)</text>
  <text x="351" y="303" font-size="12" fill="#6b7280" text-anchor="middle">V_cos = (1/√3)·(S1 - S2)</text>
  <line x1="256" y1="315" x2="446" y2="315" stroke="#eaf0fd" stroke-width="1.5"/>
  <text x="351" y="336" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_cos,AM = U_m cos θ · sin(ω_c t)</text>
  <text x="351" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Амплітудно-модульована несуча</text>

  <text x="351" y="410" font-size="12" fill="#2457d6" text-anchor="middle">Результат: 2 квадратурні</text>
  <text x="351" y="426" font-size="12" fill="#2457d6" text-anchor="middle">сигнали у фазовому зсуві 90°</text>

  <!-- Wires from Col 2 to Col 3 -->
  <path d="M 456 190 L 517 190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <path d="M 456 320 L 517 320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>


  <!-- COLUMN 3: Синхронний детектор -->
  <rect x="482" y="75" width="210" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="587" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронний детектор</text>
  <text x="587" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Множення на sin(ω_c t)</text>

  <!-- Upper Multiplier -->
  <text x="535" y="158" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Множник 1</text>
  <circle cx="535" cy="190" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="535" y="195" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">×</text>

  <!-- Reference Carrier Source Box -->
  <rect x="495" y="240" width="80" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="259" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">sin(ω_c t)</text>
  <path d="M 535 240 L 535 208" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-accent)"/>
  <path d="M 535 270 L 535 302" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-accent)"/>

  <!-- Lower Multiplier -->
  <circle cx="535" cy="320" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="535" y="325" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">×</text>
  <text x="535" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Множник 2</text>

  <!-- Math signals after multiplication -->
  <text x="635" y="166" font-size="12" fill="#1a1a1a" text-anchor="middle">½ U_m sin θ ·</text>
  <text x="635" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">[1 - cos(2ω_c t)]</text>

  <text x="635" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">½ U_m cos θ ·</text>
  <text x="635" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">[1 - cos(2ω_c t)]</text>

  <text x="587" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Подвоєна частота 2ω_c</text>
  <text x="587" y="426" font-size="12" fill="#6b7280" text-anchor="middle">буде відфільтрована</text>

  <!-- Wires from Col 3 to Col 4 -->
  <path d="M 553 190 L 715 190" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 553 320 L 715 320" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>


  <!-- COLUMN 4: Фільтрація та Вихід -->
  <rect x="708" y="75" width="227" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="821.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фільтрація та Вихід</text>
  <text x="821.5" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Виділення огинаючої (DC)</text>

  <!-- LPF 1 -->
  <rect x="718" y="165" width="60" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="748" y="187" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ФНЧ</text>
  <text x="748" y="202" font-size="12" fill="#27ae60" text-anchor="middle">(LPF)</text>

  <path d="M 778 190 L 792 190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Output 1 Badge -->
  <rect x="795" y="165" width="130" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="860" y="186" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_y = E · sin(θ)</text>
  <text x="860" y="203" font-size="12" fill="#1a1a1a" text-anchor="middle">Квадратура Y (Sin)</text>

  <!-- LPF 2 -->
  <rect x="718" y="295" width="60" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="748" y="317" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ФНЧ</text>
  <text x="748" y="332" font-size="12" fill="#27ae60" text-anchor="middle">(LPF)</text>

  <path d="M 778 320 L 792 320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Output 2 Badge -->
  <rect x="795" y="295" width="130" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="860" y="316" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_x = E · cos(θ)</text>
  <text x="860" y="333" font-size="12" fill="#1a1a1a" text-anchor="middle">Квадратура X (Cos)</text>

  <!-- RDC Computation Box -->
  <rect x="718" y="370" width="207" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="821.5" y="388" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обчислення кута (RDC):</text>
  <text x="821.5" y="407" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">θ = arctan2(V_y , V_x)</text>
  <text x="821.5" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Не залежить від амплітуди E</text>
</svg>
