<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Градуювальні калібрувальні таблиці (Strapping Tables) та сплайн-інтерполяція
  </text>

  <!-- Схема градуювальної таблиці -->
  <g transform="translate(60, 90)">
    <rect width="320" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="160" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">
      Градуювальна матриця (LUT)
    </text>

    <!-- Таблиця точок -->
    <g transform="translate(20, 50)">
      <rect width="280" height="26" fill="#21262d"/>
      <text x="30" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8b949e">Точка #</text>
      <text x="110" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8b949e">Висота h (мм)</text>
      <text x="210" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8b949e">Об'єм V (л)</text>

      <rect x="0" y="30" width="280" height="22" fill="#161b22"/>
      <text x="45" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">1</text>
      <text x="130" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">0.0</text>
      <text x="220" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">0.0</text>

      <rect x="0" y="55" width="280" height="22" fill="#21262d"/>
      <text x="45" y="71" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">2</text>
      <text x="130" y="71" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">250.0</text>
      <text x="220" y="71" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">412.5</text>

      <rect x="0" y="80" width="280" height="22" fill="#161b22"/>
      <text x="45" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">3</text>
      <text x="130" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">500.0</text>
      <text x="220" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">1150.0</text>

      <rect x="0" y="105" width="280" height="22" fill="#21262d"/>
      <text x="45" y="121" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">4</text>
      <text x="130" y="121" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">750.0</text>
      <text x="220" y="121" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">2140.0</text>

      <rect x="0" y="130" width="280" height="22" fill="#161b22"/>
      <text x="45" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">5</text>
      <text x="130" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">1000.0</text>
      <text x="220" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">3200.0</text>

      <rect x="0" y="155" width="280" height="22" fill="#21262d"/>
      <text x="45" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">...</text>
      <text x="130" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">...</text>
      <text x="220" y="171" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">...</text>

      <text x="0" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">
        • Формується проливкою або лазерним 3D-скануванням
      </text>
      <text x="0" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
        • Враховує нерівності стінок і внутрішні ребра
      </text>
    </g>
  </g>

  <!-- Порівняння методів інтерполяції -->
  <g transform="translate(420, 90)">
    <rect width="370" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="185" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#3fb950">
      Кусково-лінійна vs Кубічна сплайн-апроксимація
    </text>

    <!-- Графік інтерполяції -->
    <g transform="translate(30, 50)">
      <rect width="310" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
      
      <!-- Вузлові точки -->
      <circle cx="40" cy="120" r="5" fill="#f85149"/>
      <circle cx="110" cy="90" r="5" fill="#f85149"/>
      <circle cx="190" cy="50" r="5" fill="#f85149"/>
      <circle cx="270" cy="25" r="5" fill="#f85149"/>

      <!-- Кусково-лінійна (ламана лінія) -->
      <polyline points="40,120 110,90 190,50 270,25" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,2"/>
      
      <!-- Кубічний сплайн (гладка крива) -->
      <path d="M 40,120 C 70,110 90,95 110,90 C 135,82 165,58 190,50 C 220,40 250,28 270,25" fill="none" stroke="#3fb950" stroke-width="3"/>

      <text x="210" y="115" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">-- Лінійна (злами)</text>
      <text x="210" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950">— Кубічний сплайн</text>
    </g>

    <g transform="translate(30, 220)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">Вимоги до обчислень:</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Лінійна: O(log N) пошук бінарним деревом</text>
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Сплайн: безперервність похідної dV/dt (витрата)</text>
      <text x="10" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787">• Похибка розрахунку об'єму &lt; 0.15%</text>
    </g>
  </g>
</svg>