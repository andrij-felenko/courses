<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Математична геометрія кругового сегмента горизонтального резервуара
  </text>

  <!-- Креслення кола та сегмента -->
  <g transform="translate(60, 90)">
    <rect width="360" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Коло резервуара -->
    <circle cx="180" cy="165" r="120" fill="#161b22" stroke="#388bfd" stroke-width="3"/>

    <!-- Рідина (Сегмент) -->
    <path d="M 76,225 A 120,120 0 0 0 284,225 Z" fill="#0c2d6b" stroke="#58a6ff" stroke-width="2"/>

    <!-- Центр кола -->
    <circle cx="180" cy="165" r="4" fill="#f0f6fc"/>
    <text x="190" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#f0f6fc">O (Центр)</text>

    <!-- Радіуси до кінців хорди -->
    <line x1="180" y1="165" x2="76" y2="225" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="180" y1="165" x2="284" y2="225" stroke="#f0883e" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="120" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#f0883e">r</text>
    <text x="235" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#f0883e">r</text>

    <!-- Кут тета при центрі -->
    <path d="M 160,175 A 25,25 0 0 0 200,175" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <text x="180" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f2cc60">θ</text>

    <!-- Висота стовпа h -->
    <line x1="315" y1="285" x2="315" y2="225" stroke="#3fb950" stroke-width="3"/>
    <line x1="305" y1="285" x2="325" y2="285" stroke="#3fb950" stroke-width="2"/>
    <line x1="305" y1="225" x2="325" y2="225" stroke="#3fb950" stroke-width="2"/>
    <text x="335" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#3fb950">h</text>

    <line x1="76" y1="225" x2="284" y2="225" stroke="#58a6ff" stroke-width="2"/>
    <text x="180" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#79c0ff">Хорда w(h)</text>
  </g>

  <!-- Математичний вивід праворуч -->
  <g transform="translate(450, 90)">
    <rect width="340" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="170" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">
      Аналітичні співвідношення
    </text>

    <g transform="translate(25, 55)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f2cc60">1. Центральний кут сектора:</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">θ = 2 * arccos((r - h) / r)</text>

      <text x="0" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">2. Площа кругового сегмента:</text>
      <text x="15" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">S(h) = 0.5 * r² * (θ - sin(θ))</text>
      <text x="15" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">або в алгебраїчній формі:</text>
      <text x="15" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787">r²*arccos((r-h)/r) - (r-h)*√(2rh - h²)</text>

      <text x="0" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">3. Повний об'єм резервуара довжиною L:</text>
      <text x="15" y="207" font-family="system-ui, sans-serif" font-size="11" fill="#79c0ff">V(h) = S(h) * L + V_днищ(h)</text>

      <text x="0" y="245" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">• Чутливість dV/dh мінімальна біля дна</text>
      <text x="0" y="265" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">• Чутливість максимальна на рівні h = r</text>
    </g>
  </g>
</svg>