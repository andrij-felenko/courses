<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Компенсація нахилу (крену й диференту) цистерн та двосенсорна схема
  </text>

  <!-- Схема нахиленого резервуара -->
  <g transform="translate(60, 90)">
    <rect width="730" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Нахилений контур цистерни -->
    <g transform="translate(180, 140) rotate(-10)">
      <rect x="-180" y="-50" width="360" height="100" rx="20" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
      
      <!-- Давач 1 (Передній) -->
      <line x1="-130" y1="-50" x2="-130" y2="50" stroke="#f85149" stroke-width="3"/>
      <circle cx="-130" cy="-50" r="5" fill="#f85149"/>
      <text x="-130" y="-60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Сенсор S1</text>

      <!-- Давач 2 (Задній) -->
      <line x1="130" y1="-50" x2="130" y2="50" stroke="#3fb950" stroke-width="3"/>
      <circle cx="130" cy="-50" r="5" fill="#3fb950"/>
      <text x="130" y="-60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Сенсор S2</text>
    </g>

    <!-- Горизонтальна площина рідини під дією гравітації -->
    <line x1="100" y1="160" x2="520" y2="160" stroke="#388bfd" stroke-width="3"/>
    <text x="310" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#79c0ff">
      Справжній горизонтальний рівень рідини
    </text>

    <!-- Формула компенсації праворуч -->
    <g transform="translate(540, 40)">
      <rect width="160" height="260" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="80" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d29922">
        Компенсація нахилу
      </text>

      <g transform="translate(15, 60)">
        <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Один сенсор:</text>
        <text x="0" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Похибка до ±35% при нахилі 5°!</text>

        <text x="0" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Два сенсори S1 та S2:</text>
        <text x="0" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787">h_eff = (h1 + h2) / 2</text>
        <text x="0" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Похибка крену повністю скорочується!</text>

        <text x="0" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">+ IMU Акселерометр:</text>
        <text x="0" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">Вимірює кути θ, φ</text>
      </g>
    </g>
  </g>
</svg>