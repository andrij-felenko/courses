<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Програмний конвеєр температурно-вологісної компенсації</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Ланцюжок алгоритмічної обробки сирого сигналу АЦП до достовірної концентрації CO в ppm</text>

  <!-- Step 1: Raw Acquisition -->
  <rect x="40" y="90" width="220" height="150" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="65" cy="115" r="14" fill="#58a6ff"/>
  <text x="65" y="120" font-family="monospace" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">1</text>
  <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#f0f6fc">Збір вимірювань</text>

  <text x="55" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• АЦП фази вимірювання (1.4 В):</text>
  <text x="65" y="168" font-family="monospace" font-size="10" fill="#58a6ff">V_rl = ADC_raw * Vref / 4095</text>
  <text x="55" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Зчитування клімату по I2C:</text>
  <text x="65" y="208" font-family="monospace" font-size="10" fill="#3fb950">T_cur [°C], RH_cur [%]</text>

  <!-- Arrow 1 to 2 -->
  <line x1="260" y1="165" x2="310" y2="165" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 2: Sensor Resistance Rs -->
  <rect x="310" y="90" width="220" height="150" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="335" cy="115" r="14" fill="#58a6ff"/>
  <text x="335" y="120" font-family="monospace" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">2</text>
  <text x="360" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#f0f6fc">Розрахунок Rs</text>

  <text x="325" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Опір чутливого шару SnO2:</text>
  <text x="335" y="172" font-family="monospace" font-size="11" fill="#f0f6fc">Rs = RL * (Vc - V_rl)/V_rl</text>
  <text x="325" y="200" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Захист від ділення на нуль</text>
  <text x="325" y="218" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Експоненційне згладжування</text>

  <!-- Arrow 2 to 3 -->
  <line x1="530" y1="165" x2="580" y2="165" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 3: Bilinear Interpolation K(T, RH) -->
  <rect x="580" y="90" width="220" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="605" cy="115" r="14" fill="#3fb950"/>
  <text x="605" y="120" font-family="monospace" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">3</text>
  <text x="630" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#3fb950">Інтерполяція LUT</text>

  <text x="595" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Пошук 4-х найближчих вузлів</text>
  <text x="605" y="170" font-family="monospace" font-size="10" fill="#f0f6fc">Q11, Q12, Q21, Q22</text>
  <text x="595" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Білінійний коефіцієнт:</text>
  <text x="605" y="212" font-family="monospace" font-size="11" font-weight="bold" fill="#3fb950">K = Bilinear(T, RH)</text>

  <!-- Arrow Down to Step 4 -->
  <line x1="690" y1="240" x2="690" y2="290" stroke="#3fb950" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 4: Rs Normalization -->
  <rect x="580" y="290" width="220" height="160" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="605" cy="315" r="14" fill="#d29922"/>
  <text x="605" y="320" font-family="monospace" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">4</text>
  <text x="630" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#d29922">Нормалізація Rs</text>

  <text x="595" y="350" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Приведення до (20 °C, 65%):</text>
  <text x="605" y="372" font-family="monospace" font-size="11" font-weight="bold" fill="#d29922">Rs_corr = Rs / K(T, RH)</text>
  <text x="595" y="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Співвідношення з базою R0:</text>
  <text x="605" y="420" font-family="monospace" font-size="11" fill="#f0f6fc">Ratio = Rs_corr / R0_clean</text>

  <!-- Arrow 4 to 5 -->
  <line x1="580" y1="370" x2="400" y2="370" stroke="#d29922" stroke-width="2" stroke-dasharray="4"/>

  <!-- Step 5: Power-Law Concentration -->
  <rect x="100" y="290" width="300" height="160" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <circle cx="125" cy="315" r="14" fill="#f85149"/>
  <text x="125" y="320" font-family="monospace" font-size="12" font-weight="bold" fill="#0d1117" text-anchor="middle">5</text>
  <text x="150" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="bold" fill="#f85149">Концентрація CO (ppm)</text>

  <text x="115" y="355" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#8b949e">• Степенева апроксимація кривої:</text>
  <text x="125" y="380" font-family="monospace" font-size="13" font-weight="bold" fill="#f0f6fc">ppm = A * (Ratio) ^ B</text>
  <text x="115" y="408" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#3fb950">Похибка зменшується з +-70% до +-12%</text>
  <text x="115" y="428" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#58a6ff">Відповідність вимогам EN 50291 (CO safety)</text>
</svg>