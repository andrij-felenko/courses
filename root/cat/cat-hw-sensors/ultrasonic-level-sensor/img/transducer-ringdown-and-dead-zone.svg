<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Механічне затухання (Ringdown) п'єзокристала та мертва зона (Blanking Distance)
  </text>

  <!-- Часова осцилограма на датчику -->
  <g transform="translate(60, 90)">
    <rect width="730" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Часова вісь t -->
    <line x1="40" y1="200" x2="680" y2="200" stroke="#8b949e" stroke-width="2"/>
    <text x="685" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">t (мс)</text>

    <!-- 1. Імпульс збудження (TX Burst) -->
    <g transform="translate(60, 200)">
      <path d="M 0,0 L 5,-80 L 10,80 L 15,-80 L 20,80 L 25,-80 L 30,80 L 35,0" fill="none" stroke="#f85149" stroke-width="3"/>
      <text x="15" y="-90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149">TX Імпульс (200 В)</text>
    </g>

    <!-- 2. Механічний дзвін кристала (Ringdown Decay) -->
    <g transform="translate(95, 200)">
      <path d="M 0,0 L 10,-60 L 20,50 L 30,-40 L 40,30 L 50,-20 L 60,15 L 70,-10 L 80,5 L 90,0" fill="none" stroke="#d29922" stroke-width="2"/>
      <text x="45" y="-68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#d29922">Ringdown (Згасання п'єзокераміки)</text>
    </g>

    <!-- Зона мертвого блокування (Blanking Distance) -->
    <rect x="50" y="60" width="160" height="230" fill="#da3633" opacity="0.15" stroke="#f85149" stroke-dasharray="4,2"/>
    <text x="130" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f85149">
      Мертва зона (15–30 см)
    </text>
    <text x="130" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f85149">
      Приймач заблоковано!
    </text>

    <!-- 3. Корисний відбитий ехо-сигнал від рідини (Echo) -->
    <g transform="translate(420, 200)">
      <path d="M 0,0 L 10,-35 L 20,35 L 30,-35 L 40,35 L 50,-20 L 60,10 L 70,0" fill="none" stroke="#3fb950" stroke-width="3"/>
      <text x="35" y="-45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Корисне ЕХО</text>
    </g>

    <!-- Пороговий рівень детекції (Threshold) -->
    <line x1="210" y1="175" x2="650" y2="175" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="600" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff">Поріг чутливості</text>

    <!-- Інтервал ToF -->
    <line x1="60" y1="260" x2="440" y2="260" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="60" cy="260" r="4" fill="#58a6ff"/>
    <circle cx="440" cy="260" r="4" fill="#58a6ff"/>
    <text x="250" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">
      Час польоту ToF = 2*d / c
    </text>
  </g>
</svg>