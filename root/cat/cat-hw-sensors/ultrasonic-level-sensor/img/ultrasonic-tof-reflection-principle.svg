<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Ультразвуковий метод ToF (Time-of-Flight) та акустичне відбиття
  </text>

  <!-- Схема резервуара з датчиком -->
  <g transform="translate(60, 85)">
    <rect width="360" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Стінки резервуара -->
    <path d="M 50,30 L 50,310 L 310,310 L 310,30" fill="none" stroke="#8b949e" stroke-width="3"/>

    <!-- Рідина в резервуарі -->
    <rect x="52" y="190" width="256" height="118" fill="#0c2d6b" opacity="0.4"/>
    <line x1="52" y1="190" x2="308" y2="190" stroke="#388bfd" stroke-width="3"/>
    <text x="180" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#58a6ff">Рідина (Z ≈ 1.5·10^6 Rayl)</text>

    <!-- Ультразвуковий датчик зверху -->
    <rect x="150" y="20" width="60" height="40" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <rect x="155" y="55" width="50" height="10" fill="#388bfd"/>
    <text x="180" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">П'єзо PZT</text>

    <!-- Випромінювані ультразвукові хвилі (Вниз) -->
    <path d="M 160,80 A 30,30 0 0 0 200,80" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <path d="M 150,110 A 50,50 0 0 0 210,110" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <path d="M 140,140 A 70,70 0 0 0 220,140" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <path d="M 130,170 A 90,90 0 0 0 230,170" fill="none" stroke="#f2cc60" stroke-width="2"/>

    <!-- Відбиті хвилі (Вгору) -->
    <path d="M 145,130 A 60,60 0 0 1 215,130" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M 155,100 A 40,40 0 0 1 205,100" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Розмірні лінії -->
    <!-- Дистанція d -->
    <line x1="330" y1="65" x2="330" y2="190" stroke="#f2cc60" stroke-width="2"/>
    <text x="345" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f2cc60">d</text>

    <!-- Рівень h -->
    <line x1="330" y1="190" x2="330" y2="308" stroke="#3fb950" stroke-width="2"/>
    <text x="345" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">h</text>
  </g>

  <!-- Математичний блок праворуч -->
  <g transform="translate(450, 85)">
    <rect width="340" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="170" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">
      Рівняння вимірювання
    </text>

    <g transform="translate(25, 55)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f2cc60">1. Відстань до дзеркала рідини:</text>
      <text x="15" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9">d = (c(T) * t_flight) / 2</text>

      <text x="0" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">2. Розрахований рівень рідини:</text>
      <text x="15" y="110" font-family="system-ui, sans-serif" font-size="13" fill="#3fb950">h = H_tank - d</text>

      <text x="0" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">3. Акустичний контраст (Коефіцієнт R):</text>
      <text x="15" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">R = ((Z_вода - Z_повітря) / (Z_вода + Z_повітря))²</text>
      <text x="15" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">R ≈ 0.999 (99.9% відбиття енергії!)</text>

      <text x="0" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">• Безконтактний монтаж (гігієнічний)</text>
      <text x="0" y="258" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">• Не залежить від провідності рідини</text>
      <text x="0" y="281" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Не вимагає занурення в агресивне середовище</text>
    </g>
  </g>
</svg>