<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Залежність вихідної напруги від відстані Sharp GP2Y0A21YK0F
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Характеристична крива з піком перегину при 10 см, сліпою зоною та робочим діапазоном 10–80 см
  </text>

  <!-- Plot Area: x: 100 to 800, y: 100 to 420 -->
  <!-- Grid Lines -->
  <line x1="100" y1="420" x2="820" y2="420" stroke="#475569" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="420" stroke="#475569" stroke-width="1.5"/>

  <!-- Horizontal Grid (Voltage 0.5V, 1.0V, 1.5V, 2.0V, 2.5V, 3.0V) -->
  <!-- 0V: 420, 1V: 320, 2V: 220, 3V: 120 -->
  <line x1="100" y1="370" x2="820" y2="370" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="90" y="374" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">0.5 В</text>

  <line x1="100" y1="320" x2="820" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="90" y="324" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">1.0 В</text>

  <line x1="100" y1="270" x2="820" y2="270" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="90" y="274" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">1.5 В</text>

  <line x1="100" y1="220" x2="820" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="90" y="224" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">2.0 В</text>

  <line x1="100" y1="170" x2="820" y2="170" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="90" y="174" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">2.5 В</text>

  <line x1="100" y1="120" x2="820" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="90" y="124" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">3.0 В</text>

  <!-- Vertical Distances: 0, 10, 20, 30, 40, 50, 60, 70, 80 cm -->
  <!-- 0: 100, 10: 190, 20: 280, 30: 370, 40: 460, 50: 550, 60: 640, 70: 730, 80: 820 -->
  <line x1="190" y1="100" x2="190" y2="420" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="190" y="440" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">10 см</text>

  <line x1="280" y1="100" x2="280" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="280" y="440" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">20</text>

  <line x1="370" y1="100" x2="370" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="370" y="440" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">30</text>

  <line x1="460" y1="100" x2="460" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="460" y="440" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">40</text>

  <line x1="550" y1="100" x2="550" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="550" y="440" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">50</text>

  <line x1="640" y1="100" x2="640" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="640" y="440" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">60</text>

  <line x1="730" y1="100" x2="730" y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="730" y="440" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">70</text>

  <line x1="820" y1="100" x2="820" y2="420" stroke="#334155" stroke-width="1.5"/>
  <text x="820" y="440" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">80 см</text>

  <!-- Shaded Regions -->
  <!-- Blind Zone 0 to 10 cm: 100 to 190 -->
  <rect x="100" y="100" width="90" height="320" fill="#ef4444" fill-opacity="0.12"/>
  <text x="145" y="140" fill="#f87171" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Сліпа зона</text>
  <text x="145" y="157" fill="#fca5a5" font-family="system-ui" font-size="10" text-anchor="middle">&lt; 10 см</text>

  <!-- Valid Region 10 to 80 cm: 190 to 820 -->
  <rect x="190" y="100" width="630" height="320" fill="#10b981" fill-opacity="0.06"/>
  <text x="505" y="130" fill="#34d399" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
    Нормований робочий діапазон: 10–80 см (Монотонна гіперболічна функція)
  </text>

  <!-- Curve: Blind zone rise from 0.8V to 3.1V, then hyperbolic drop to 0.4V at 80cm -->
  <!-- 0cm: 100, y=340 (0.8V) -> 5cm: 145, y=270 (1.5V) -> 10cm: 190, y=110 (3.1V peak) -->
  <!-- 15cm: 235, y=190 (2.3V) -> 20cm: 280, y=240 (1.8V) -> 30cm: 370, y=290 (1.3V) -> 50cm: 550, y=350 (0.7V) -> 80cm: 820, y=380 (0.4V) -->
  <path d="M 100 340 Q 135 240, 190 110 T 280 240 Q 450 330, 820 380" fill="none" stroke="#38bdf8" stroke-width="3.5"/>

  <!-- Peak point at 10cm, 3.1V -->
  <circle cx="190" cy="110" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <text x="205" y="105" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="bold">Точка перегину (3.1 В, 10 см)</text>

  <!-- Ambiguity demonstration: Line at 1.5V (y = 270) -->
  <line x1="100" y1="270" x2="380" y2="270" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="145" cy="270" r="5" fill="#f43f5e"/>
  <circle cx="330" cy="270" r="5" fill="#f43f5e"/>
  <text x="390" y="274" fill="#fb7185" font-family="system-ui" font-size="11" font-weight="bold">
    1.5 В = як 4 см (аварія), так і 26 см (безпечно!)
  </text>

  <!-- Axis labels -->
  <text x="460" y="475" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Відстань до об&#39;єкта (см)</text>
  <text x="35" y="260" fill="#cbd5e1" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90 35 260)">Напруга виходу (В)</text>
</svg>