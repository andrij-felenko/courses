<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad4)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Кусково-лінійна інтерполяція таблиці пошуку (LUT)
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Швидкий цілочисельний перерахунок напруги U у відстань d між калібрувальними вузлами
  </text>

  <!-- Left: Graph (Voltage vs Distance) -->
  <g transform="translate(60, 90)">
    <rect width="450" height="360" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>

    <!-- Axis -->
    <line x1="60" y1="310" x2="420" y2="310" stroke="#64748b" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="60" y2="310" stroke="#64748b" stroke-width="1.5"/>

    <!-- Labels -->
    <text x="420" y="330" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="end">Напруга U (мВ)</text>
    <text x="50" y="30" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="start">Відстань d (мм)</text>

    <!-- Curve: Continuous real curve (dashed) -->
    <path d="M 390 60 Q 200 120, 90 290" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="280" y="90" fill="#64748b" font-family="system-ui" font-size="10">Реальна гіпербола</text>

    <!-- LUT Piecewise Segments -->
    <!-- Nodes:
         Node 0: (390, 60) -> 3000 mV, 100 mm
         Node 1: (300, 100) -> 2300 mV, 150 mm
         Node 2: (220, 150) -> 1650 mV, 250 mm
         Node 3: (150, 210) -> 1050 mV, 400 mm
         Node 4: (90, 290) -> 450 mV, 800 mm
    -->
    <line x1="390" y1="60" x2="300" y2="100" stroke="#10b981" stroke-width="2.5"/>
    <line x1="300" y1="100" x2="220" y2="150" stroke="#10b981" stroke-width="2.5"/>
    <line x1="220" y1="150" x2="150" y2="210" stroke="#10b981" stroke-width="2.5"/>
    <line x1="150" y1="210" x2="90" y2="290" stroke="#10b981" stroke-width="2.5"/>

    <!-- Nodes dots -->
    <circle cx="390" cy="60" r="5" fill="#f59e0b"/>
    <circle cx="300" cy="100" r="5" fill="#f59e0b"/>
    <text x="310" y="95" fill="#fde68a" font-family="monospace" font-size="10.5">(U_i, d_i)</text>

    <circle cx="220" cy="150" r="5" fill="#f59e0b"/>
    <text x="230" y="145" fill="#fde68a" font-family="monospace" font-size="10.5">(U_{i+1}, d_{i+1})</text>

    <circle cx="150" cy="210" r="5" fill="#f59e0b"/>
    <circle cx="90" cy="290" r="5" fill="#f59e0b"/>

    <!-- Target interpolation point U -->
    <line x1="265" y1="122" x2="265" y2="310" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="60" y1="122" x2="265" y2="122" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="265" cy="122" r="6" fill="#38bdf8"/>
    <text x="265" y="325" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">U</text>
    <text x="50" y="126" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">d</text>
  </g>

  <!-- Right: Algorithm & Math Explanation -->
  <g transform="translate(540, 90)">
    <rect width="300" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="150" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Формула інтерполяції:
    </text>

    <rect x="20" y="45" width="260" height="50" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="150" y="75" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
      d = d_i + (U - U_i) · Δd / ΔU
    </text>

    <text x="25" y="120" fill="#e2e8f0" font-family="system-ui" font-size="11.5" font-weight="bold">Етапи розрахунку:</text>
    <text x="25" y="142" fill="#cbd5e1" font-family="system-ui" font-size="10.5">1. Бінарний пошук або лінійний прохід</text>
    <text x="35" y="158" fill="#94a3b8" font-family="system-ui" font-size="10">знаходить вузол U_i ≥ U &gt; U_{i+1}</text>

    <text x="25" y="182" fill="#cbd5e1" font-family="system-ui" font-size="10.5">2. Цілочисельне множення та зсув</text>
    <text x="35" y="198" fill="#94a3b8" font-family="system-ui" font-size="10">без участі повільного FPU (float)</text>

    <text x="25" y="222" fill="#cbd5e1" font-family="system-ui" font-size="10.5">3. Час обчислення — &lt; 50 тактів MCU</text>

    <rect x="20" y="250" width="260" height="90" rx="5" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="270" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="bold">Перевага над поліномом:</text>
    <text x="30" y="290" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Немає осциляцій Рунге на краях</text>
    <text x="30" y="308" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Гарантована монотонність</text>
    <text x="30" y="326" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Легка калібровка під окремий датчик</text>
  </g>
</svg>