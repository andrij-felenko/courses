<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad6)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Архітектура модульного C/C++ API-драйвера Sharp GP2Y0A21
  </text>
  <text x="450" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Конвеєр обробки даних від апаратного АЦП через фільтрацію та лінеаризацію до застосунку
  </text>

  <!-- Layer 1: Hardware Abstraction Layer (HAL ADC) -->
  <g transform="translate(50, 95)">
    <rect width="230" height="380" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="115" y="30" fill="#c7d2fe" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      1. Рівень HAL / АЦП
    </text>

    <!-- Sub-boxes -->
    <rect x="20" y="60" width="190" height="70" rx="5" fill="#312e81"/>
    <text x="115" y="85" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Драйвер АЦП MCU</text>
    <text x="115" y="103" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">ESP-IDF adc_oneshot /</text>
    <text x="115" y="117" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Arduino analogRead()</text>

    <rect x="20" y="150" width="190" height="65" rx="5" fill="#312e81"/>
    <text x="115" y="175" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Таймер вибірки</text>
    <text x="115" y="195" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Період опитування 10–20 мс</text>

    <rect x="20" y="235" width="190" height="110" rx="5" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="115" y="260" fill="#a5b4fc" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Сховище калібрування</text>
    <text x="115" y="280" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">EEPROM / NVS Flash</text>
    <text x="115" y="300" fill="#cbd5e1" font-family="system-ui" font-size="9.5" text-anchor="middle">• Таблиця LUT вузлів</text>
    <text x="115" y="318" fill="#cbd5e1" font-family="system-ui" font-size="9.5" text-anchor="middle">• Контрольна сума CRC16</text>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <line x1="280" y1="210" x2="330" y2="210" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="330,210 322,205 322,215" fill="#38bdf8"/>

  <!-- Layer 2: Core Processing & Filtering -->
  <g transform="translate(330, 95)">
    <rect width="240" height="380" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="120" y="30" fill="#a5f3fc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      2. Ядро обробки драйвера
    </text>

    <rect x="20" y="55" width="200" height="60" rx="5" fill="#155e75"/>
    <text x="120" y="78" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Медіанний фільтр</text>
    <text x="120" y="96" fill="#cffafe" font-family="system-ui" font-size="10" text-anchor="middle">Вікно N=5 (видалення піків)</text>

    <rect x="20" y="125" width="200" height="60" rx="5" fill="#155e75"/>
    <text x="120" y="148" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Фільтр EMA</text>
    <text x="120" y="166" fill="#cffafe" font-family="system-ui" font-size="10" text-anchor="middle">Згладжування шуму (α=0.2)</text>

    <rect x="20" y="195" width="200" height="75" rx="5" fill="#155e75"/>
    <text x="120" y="218" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Блок лінеаризації</text>
    <text x="120" y="236" fill="#cffafe" font-family="system-ui" font-size="10" text-anchor="middle">Кусково-лінійна інтерполяція</text>
    <text x="120" y="252" fill="#fde047" font-family="monospace" font-size="10" text-anchor="middle">LUT 10–15 вузлів</text>

    <rect x="20" y="280" width="200" height="75" rx="5" fill="#155e75"/>
    <text x="120" y="303" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">FSM Діагностики</text>
    <text x="120" y="321" fill="#fca5a5" font-family="system-ui" font-size="10" text-anchor="middle">Сліпа зона + гістерезис</text>
    <text x="120" y="337" fill="#cffafe" font-family="system-ui" font-size="10" text-anchor="middle">Перевірка обриву лінії</text>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <line x1="570" y1="210" x2="620" y2="210" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="620,210 612,205 612,215" fill="#38bdf8"/>

  <!-- Layer 3: Application Interface (Public API) -->
  <g transform="translate(620, 95)">
    <rect width="230" height="380" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="115" y="30" fill="#bbf7d0" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      3. Публічний API застосунку
    </text>

    <rect x="15" y="55" width="200" height="70" rx="5" fill="#166534"/>
    <text x="115" y="80" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">gp2y0a21_read()</text>
    <text x="115" y="100" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">Повертає відстань у мм</text>
    <text x="115" y="114" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">та статус валідності</text>

    <rect x="15" y="135" width="200" height="70" rx="5" fill="#166534"/>
    <text x="115" y="160" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">gp2y0a21_calibrate()</text>
    <text x="115" y="180" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">Запис калібрувальних</text>
    <text x="115" y="194" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">точок у EEPROM</text>

    <rect x="15" y="215" width="200" height="135" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="115" y="240" fill="#34d399" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Кінцевий застосунок</text>
    <text x="25" y="265" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Оминання перешкод роботом</text>
    <text x="25" y="285" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Аварійний Stop за прапорцем</text>
    <text x="25" y="305" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Контроль рівня рідини/сипучих</text>
    <text x="25" y="325" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Безконтактний вимикач</text>
  </g>
</svg>