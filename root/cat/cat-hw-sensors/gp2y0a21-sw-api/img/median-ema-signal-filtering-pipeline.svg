<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad3)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Двокаскадний конвеєр цифрової фільтрації сигналу Sharp GP2Y0A21
  </text>
  <text x="450" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Усунення спалахових імпульсних сплесків медіанним фільтром та високочастотного шуму фільтром EMA
  </text>

  <!-- Block 1: Raw ADC Input -->
  <g transform="translate(40, 100)">
    <rect width="180" height="150" rx="8" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="25" fill="#fca5a5" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">1. Сирий сигнал АЦП</text>
    
    <!-- Mini wave with spike -->
    <path d="M 20 90 L 50 85 L 80 40 L 95 90 L 130 85 L 160 88" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="80" cy="40" r="4" fill="#f87171"/>
    <text x="80" y="32" fill="#f87171" font-family="system-ui" font-size="10" text-anchor="middle">Сплеск струму!</text>

    <text x="90" y="125" fill="#cbd5e1" font-family="system-ui" font-size="10.5" text-anchor="middle">Шум квантування +</text>
    <text x="90" y="140" fill="#cbd5e1" font-family="system-ui" font-size="10.5" text-anchor="middle">імпульсні сплески спалаху</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="220" y1="175" x2="260" y2="175" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="260,175 252,170 252,180" fill="#38bdf8"/>

  <!-- Block 2: Median Filter -->
  <g transform="translate(260, 100)">
    <rect width="250" height="150" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="125" y="25" fill="#a5f3fc" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">2. Медіанний фільтр (N = 5)</text>

    <!-- Mini sorting visual -->
    <rect x="25" y="45" width="200" height="40" rx="4" fill="#0e7490"/>
    <text x="125" y="65" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">[1.2, 1.2, 1.3, 1.3, 2.7]</text>
    <text x="125" y="80" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Медіана = 1.3 В (2.7 відкинуто!)</text>

    <text x="125" y="115" fill="#cffafe" font-family="system-ui" font-size="10.5" text-anchor="middle">Ковзне вікно з 5 відліків</text>
    <text x="125" y="132" fill="#cffafe" font-family="system-ui" font-size="10.5" text-anchor="middle">Повне відсікання одиночних викидів</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="510" y1="175" x2="550" y2="175" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="550,175 542,170 542,180" fill="#38bdf8"/>

  <!-- Block 3: EMA Filter -->
  <g transform="translate(550, 100)">
    <rect width="310" height="150" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="155" y="25" fill="#bbf7d0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">3. Експоненційне згладжування EMA</text>

    <!-- Formula -->
    <rect x="25" y="45" width="260" height="40" rx="4" fill="#166534"/>
    <text x="155" y="68" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">y[k] = α · x[k] + (1 - α) · y[k-1]</text>

    <!-- Smooth wave visual -->
    <path d="M 40 115 Q 100 95, 160 115 T 280 115" fill="none" stroke="#86efac" stroke-width="2"/>
    <text x="155" y="138" fill="#dcfce7" font-family="system-ui" font-size="10.5" text-anchor="middle">α = 0.15 ... 0.25 (безшумна напруга)</text>
  </g>

  <!-- Bottom: Processing Results and Flowchart -->
  <g transform="translate(40, 280)">
    <rect width="820" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="410" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Переваги двокаскадної схеми перед звичайним арифметичним усередненням:
    </text>

    <g transform="translate(30, 45)">
      <rect width="360" height="110" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="20" y="25" fill="#fca5a5" font-family="system-ui" font-size="12" font-weight="bold">Чому не можна середнє арифметичне:</text>
      <text x="20" y="48" fill="#cbd5e1" font-family="system-ui" font-size="11">• Сплеск 2.7 В зміщує середнє з 1.2 В до 1.5 В</text>
      <text x="20" y="68" fill="#cbd5e1" font-family="system-ui" font-size="11">• Зміщення напруги на 300 мВ на відстані 70 см</text>
      <text x="20" y="88" fill="#f87171" font-family="system-ui" font-size="11" font-weight="bold">• Спричиняє похибку вимірювання до 15–20 см!</text>
    </g>

    <g transform="translate(430, 45)">
      <rect width="360" height="110" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="25" fill="#a7f3d0" font-family="system-ui" font-size="12" font-weight="bold">Ефективність комбінованого фільтра:</text>
      <text x="20" y="48" fill="#cbd5e1" font-family="system-ui" font-size="11">• Медіана на 100% ліквідує імпульсний сплеск</text>
      <text x="20" y="68" fill="#cbd5e1" font-family="system-ui" font-size="11">• EMA фільтрує залишковий тепловий гауссів шум</text>
      <text x="20" y="88" fill="#34d399" font-family="system-ui" font-size="11" font-weight="bold">• Помилка відстані не перевищує ±5–10 мм</text>
    </g>
  </g>
</svg>