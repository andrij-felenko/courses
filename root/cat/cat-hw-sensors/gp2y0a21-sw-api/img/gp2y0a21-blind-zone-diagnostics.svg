<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad5)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Діагностика граничних станів та сліпої зони з гістерезисом
  </text>
  <text x="450" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Розпізнавання зони неоднозначності при перетині порогів U_high та U_low для запобігання аваріям
  </text>

  <!-- Left Side: Curve and State Regions -->
  <g transform="translate(50, 90)">
    <rect width="460" height="370" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>

    <!-- Zones -->
    <!-- Blind zone -->
    <rect x="50" y="40" width="90" height="280" fill="#ef4444" fill-opacity="0.15"/>
    <text x="95" y="60" fill="#f87171" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">BLIND ZONE</text>
    <text x="95" y="75" fill="#fca5a5" font-family="system-ui" font-size="9.5" text-anchor="middle">&lt; 10 см</text>

    <!-- Valid zone -->
    <rect x="140" y="40" width="220" height="280" fill="#10b981" fill-opacity="0.1"/>
    <text x="250" y="60" fill="#34d399" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">VALID RANGE (10–80 см)</text>

    <!-- Out of range far -->
    <rect x="360" y="40" width="80" height="280" fill="#eab308" fill-opacity="0.12"/>
    <text x="400" y="60" fill="#fde047" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">TOO FAR</text>
    <text x="400" y="75" fill="#fef08a" font-family="system-ui" font-size="9" text-anchor="middle">&gt; 80 см</text>

    <!-- Hysteresis thresholds horizontal lines -->
    <!-- U_high = 2.9V -->
    <line x1="50" y1="100" x2="440" y2="100" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="445" y="104" fill="#fb7185" font-family="monospace" font-size="10" text-anchor="start">U_high (2.9В)</text>

    <!-- U_low = 2.65V -->
    <line x1="50" y1="130" x2="440" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="445" y="134" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="start">U_low (2.65В)</text>

    <!-- Characteristic Curve -->
    <path d="M 50 240 Q 95 160, 140 80 T 220 180 Q 320 270, 440 290" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="140" cy="80" r="5" fill="#f59e0b"/>

    <text x="250" y="345" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">Відстань до об&#39;єкта →</text>
  </g>

  <!-- Right Side: State Machine FSM -->
  <g transform="translate(540, 90)">
    <rect width="320" height="370" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Автомат станів валідності (FSM)
    </text>

    <!-- State 1: STATE_NORMAL -->
    <rect x="40" y="55" width="240" height="55" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="78" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">RANGE_VALID</text>
    <text x="160" y="96" fill="#a7f3d0" font-family="system-ui" font-size="10.5" text-anchor="middle">Дані достовірні (10 ... 80 см)</text>

    <!-- Arrow down -->
    <line x1="160" y1="110" x2="160" y2="150" stroke="#f43f5e" stroke-width="2"/>
    <polygon points="160,150 155,142 165,142" fill="#f43f5e"/>
    <text x="165" y="135" fill="#fca5a5" font-family="system-ui" font-size="9.5">U &gt; U_high</text>

    <!-- State 2: STATE_BLIND_ZONE -->
    <rect x="40" y="150" width="240" height="60" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="160" y="174" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">RANGE_BLIND_ZONE</text>
    <text x="160" y="192" fill="#fecdd3" font-family="system-ui" font-size="10.5" text-anchor="middle">Аварійна зона &lt; 10 см! Зупинка!</text>

    <!-- Arrow back up with hysteresis -->
    <path d="M 60 150 Q 20 130, 60 110" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="60,110 52,115 58,122" fill="#38bdf8"/>
    <text x="10" y="130" fill="#38bdf8" font-family="system-ui" font-size="9.5">U &lt; U_low</text>

    <!-- State 3: STATE_TOO_FAR -->
    <rect x="40" y="250" width="240" height="55" rx="6" fill="#713f12" stroke="#eab308" stroke-width="1.5"/>
    <text x="160" y="273" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">RANGE_TOO_FAR</text>
    <text x="160" y="291" fill="#fef08a" font-family="system-ui" font-size="10.5" text-anchor="middle">U &lt; 0.4 В (&gt; 80 см, рівень шуму)</text>

    <!-- State 4: Hardware Fault -->
    <rect x="40" y="315" width="240" height="42" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="160" y="333" fill="#fca5a5" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">RANGE_HARDWARE_FAULT</text>
    <text x="160" y="348" fill="#fee2e2" font-family="system-ui" font-size="9.5" text-anchor="middle">U ≈ 0V або U &gt; 3.2V (обрив / КЗ)</text>
  </g>
</svg>