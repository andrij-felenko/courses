<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Порівняння передатних характеристик: LM35, LM34, LM335, TMP36</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Напруга на виході сенсора залежно від температури за шкалою Цельсія (°C)</text>

  <!-- Plot frame -->
  <rect x="50" y="80" width="750" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Zero axes -->
  <line x1="200" y1="90" x2="200" y2="330" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="200" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle">0 °C</text>

  <line x1="60" y1="280" x2="780" y2="280" stroke="#8b949e" stroke-width="1.5"/>
  <text x="770" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">T (°C)</text>
  <text x="70" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">0.0 В</text>

  <!-- Curve 1: LM335 (Kelvin 10mV/K, +2.73V at 0°C) -> Magenta -->
  <line x1="80" y1="135" x2="750" y2="90" stroke="#bc8cff" stroke-width="2.5"/>
  <text x="690" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#bc8cff">LM335 (10 мВ/K)</text>
  <circle cx="200" cy="126" r="4" fill="#bc8cff"/>
  <text x="210" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#bc8cff">2.73 В при 0°C</text>

  <!-- Curve 2: TMP36 (Celsius with +500mV offset) -> Green -->
  <line x1="80" y1="260" x2="750" y2="150" stroke="#3fb950" stroke-width="3"/>
  <text x="690" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">TMP36 (+500 мВ зсув)</text>
  <circle cx="200" cy="245" r="4" fill="#3fb950"/>
  <text x="210" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3fb950">0.50 В при 0°C</text>

  <!-- Curve 3: LM35 (Celsius 10mV/°C, 0V at 0°C) -> Blue -->
  <line x1="80" y1="315" x2="750" y2="185" stroke="#58a6ff" stroke-width="3"/>
  <text x="690" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">LM35 (10 мВ/°C)</text>
  <circle cx="200" cy="280" r="5" fill="#58a6ff"/>
  <text x="210" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#58a6ff">0.00 В при 0°C</text>

  <!-- Curve 4: LM34 (Fahrenheit 10mV/°F, ~18mV/°C slope) -> Yellow -->
  <line x1="80" y1="325" x2="650" y2="160" stroke="#d29922" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="660" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922">LM34 (10 мВ/°F)</text>
  <circle cx="200" cy="260" r="4" fill="#d29922"/>
  <text x="140" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d29922">0.32 В при 0°C (32°F)</text>

  <!-- Four Summary Cards below -->
  <rect x="50" y="355" width="175" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="137" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">LM35 (Цельсій)</text>
  <text x="60" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• 10.0 мВ/°C</text>
  <text x="60" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• Нуль при 0.0 °C</text>
  <text x="60" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f85149">• Для &lt;0°C потрібен зсув</text>

  <rect x="240" y="355" width="175" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="327" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">TMP36 (Для 3.3В)</text>
  <text x="250" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• 10.0 мВ/°C</text>
  <text x="250" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• Зсув +500 мВ (0°C)</text>
  <text x="250" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#7ee787">• -40..+125°C від 1 живлення</text>

  <rect x="430" y="355" width="175" height="110" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="517" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">LM335 (Кельвін)</text>
  <text x="440" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• 10.0 мВ/K</text>
  <text x="440" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• Режим стабілітрона</text>
  <text x="440" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#79c0ff">• Потрібен R_bias</text>

  <rect x="620" y="355" width="180" height="110" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="710" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">LM34 (Фаренгейт)</text>
  <text x="630" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• 10.0 мВ/°F</text>
  <text x="630" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">• 18.0 мВ/°C (крутіше)</text>
  <text x="630" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Стандарт США</text>
</svg>