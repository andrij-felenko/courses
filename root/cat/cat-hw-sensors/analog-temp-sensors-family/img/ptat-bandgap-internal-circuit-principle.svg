<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Фізичний принцип генератора PTAT на забороненій зоні кремнію</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Різниця напруг база-емітер двох біполярних транзисторів із різною площею емітерів</text>

  <!-- Left: Transistor pair diagram -->
  <rect x="40" y="85" width="410" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="245" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Базова комірка PTAT (Брокау / Відлар)</text>

  <!-- Power rail +V -->
  <line x1="80" y1="140" x2="410" y2="140" stroke="#f85149" stroke-width="2"/>
  <circle cx="80" cy="140" r="4" fill="#f85149"/>
  <text x="90" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f85149">+V_CC</text>

  <!-- Current mirror loads I1, I2 -->
  <rect x="150" y="155" width="45" height="35" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="172" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">I₁</text>
  <line x1="172" y1="140" x2="172" y2="155" stroke="#f85149" stroke-width="1.5"/>

  <rect x="310" y="155" width="45" height="35" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="332" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">I₂</text>
  <line x1="332" y1="140" x2="332" y2="155" stroke="#f85149" stroke-width="1.5"/>

  <!-- Transistor Q1 (1X Area) -->
  <circle cx="172" cy="240" r="22" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="172" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">Q₁ (1X)</text>
  <line x1="172" y1="190" x2="172" y2="218" stroke="#3fb950" stroke-width="1.5"/>

  <!-- Transistor Q2 (NX Area, e.g. 8X) -->
  <circle cx="332" cy="240" r="26" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="332" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">Q₂ (8X)</text>
  <line x1="332" y1="190" x2="332" y2="214" stroke="#d29922" stroke-width="1.5"/>

  <!-- Coupled Bases -->
  <line x1="150" y1="240" x2="100" y2="240" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="100" y1="240" x2="100" y2="300" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="306" y1="240" x2="260" y2="240" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="260" y1="240" x2="260" y2="300" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="100" y1="300" x2="260" y2="300" stroke="#8b949e" stroke-width="1.5"/>
  <circle cx="180" cy="300" r="4" fill="#8b949e"/>
  <text x="180" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Спільна база</text>

  <!-- Emitter resistor R_ptat on Q2 -->
  <line x1="332" y1="266" x2="332" y2="330" stroke="#d29922" stroke-width="1.5"/>
  <rect x="322" y="330" width="20" height="40" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="355" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922">R</text>

  <line x1="172" y1="262" x2="172" y2="390" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="332" y1="370" x2="332" y2="390" stroke="#d29922" stroke-width="1.5"/>
  <line x1="172" y1="390" x2="332" y2="390" stroke="#8b949e" stroke-width="2"/>
  <line x1="250" y1="390" x2="250" y2="420" stroke="#8b949e" stroke-width="2"/>
  <!-- Ground -->
  <line x1="235" y1="420" x2="265" y2="420" stroke="#8b949e" stroke-width="2"/>
  <line x1="240" y1="425" x2="260" y2="425" stroke="#8b949e" stroke-width="1.5"/>

  <!-- Right: Mathematical deduction -->
  <rect x="475" y="85" width="335" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="642" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Математичний вивід PTAT</text>

  <rect x="495" y="135" width="295" height="75" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="505" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">1. Різниця напруг база-емітер:</text>
  <text x="505" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">ΔV_be = V_be1 - V_be2</text>
  <text x="505" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">ΔV_be = (k · T / q) · ln(J₁ / J₂)</text>

  <rect x="495" y="220" width="295" height="85" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="505" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">2. Фізична лінійність від Кельвіна:</text>
  <text x="505" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">ΔV_be = (k / q) · ln(N) · T</text>
  <text x="505" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">де k/q = 86.17 мкВ/K, N = 8</text>
  <text x="505" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79c0ff">ΔV_be ≈ 179 мкВ / K</text>

  <rect x="495" y="315" width="295" height="115" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="505" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">3. Масштабування підсилювачем:</text>
  <text x="505" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Внутрішній прецизійний ОП чипа</text>
  <text x="505" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">масштабує 179 мкВ/K до стандартних</text>
  <text x="505" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">10.00 мВ/°C (LM35) або 10 мВ/K (LM335)</text>
  <text x="505" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">Повна термокомпенсація лазерною підгонкою</text>
</svg>