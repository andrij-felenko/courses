<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Низьковольтний сенсор TMP36 для 3.3 В систем</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Зсув шкали на +500 мВ усуває потребу у від'ємному живленні для діапазону -40 °C .. +125 °C</text>

  <!-- Left: Direct MCU Connection -->
  <rect x="40" y="85" width="460" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="270" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Пряме підключення до STM32 / ESP32</text>

  <!-- TMP36 Chip -->
  <rect x="80" y="160" width="130" height="150" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="145" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">TMP36</text>
  <text x="145" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Аналоговий</text>
  <text x="145" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">+500 мВ @ 0°C</text>

  <!-- +3.3V Power Line -->
  <line x1="80" y1="180" x2="40" y2="180" stroke="#f85149" stroke-width="2"/>
  <circle cx="40" cy="180" r="4" fill="#f85149"/>
  <text x="35" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f85149">+3.3 V</text>

  <!-- Decoupling Cap 100nF -->
  <line x1="60" y1="180" x2="60" y2="230" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="50" y1="230" x2="70" y2="230" stroke="#8b949e" stroke-width="2"/>
  <line x1="50" y1="236" x2="70" y2="236" stroke="#8b949e" stroke-width="2"/>
  <line x1="60" y1="236" x2="60" y2="270" stroke="#8b949e" stroke-width="1.5"/>
  <text x="60" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">100нФ</text>

  <!-- GND -->
  <line x1="145" y1="310" x2="145" y2="360" stroke="#8b949e" stroke-width="2"/>
  <line x1="130" y1="360" x2="160" y2="360" stroke="#8b949e" stroke-width="2"/>
  <line x1="135" y1="365" x2="155" y2="365" stroke="#8b949e" stroke-width="1.5"/>
  <text x="145" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">GND</text>

  <!-- Output line with Snubber resistor -->
  <line x1="210" y1="235" x2="270" y2="235" stroke="#3fb950" stroke-width="2"/>
  <!-- Series isolation resistor R_iso -->
  <rect x="270" y="225" width="40" height="20" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="290" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">100R</text>
  <line x1="310" y1="235" x2="380" y2="235" stroke="#3fb950" stroke-width="2"/>

  <!-- MCU Box -->
  <rect x="380" y="160" width="100" height="150" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="430" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">MCU</text>
  <text x="430" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">ADC1_IN0</text>
  <text x="430" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">12 біт SAR</text>

  <rect x="60" y="405" width="420" height="35" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">Жодного додаткового джерела від'ємної напруги не потрібно!</text>

  <!-- Right: Output Voltage to Temp Map -->
  <rect x="520" y="85" width="290" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="665" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Шкала напруги TMP36</text>

  <rect x="535" y="135" width="260" height="65" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="545" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">T = -40 °C:</text>
  <text x="545" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">V_out = 0.5 В - 0.4 В = 0.10 В</text>

  <rect x="535" y="210" width="260" height="65" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="545" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">T = 0 °C:</text>
  <text x="545" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#79c0ff">V_out = 0.500 В (Ідеальний зсув)</text>

  <rect x="535" y="285" width="260" height="65" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="545" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">T = +25 °C:</text>
  <text x="545" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">V_out = 0.5 В + 0.25 В = 0.75 В</text>

  <rect x="535" y="360" width="260" height="65" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="545" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">T = +125 °C:</text>
  <text x="545" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">V_out = 0.5 В + 1.25 В = 1.75 В</text>
</svg>