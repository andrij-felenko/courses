<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Схема підключення та калібрування LM335 (режим стабілітрона)</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Двопровідне шунтуюче включення зі струмообмежувальним резистором R_bias та піном ADJ</text>

  <!-- Left: Schematic Diagram -->
  <rect x="40" y="85" width="440" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="260" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Принципова схема (2 дроти + ADJ)</text>

  <!-- +V Supply -->
  <line x1="80" y1="140" x2="260" y2="140" stroke="#f85149" stroke-width="2"/>
  <circle cx="80" cy="140" r="4" fill="#f85149"/>
  <text x="90" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f85149">+V_SUP (+5В .. +15В)</text>

  <!-- Resistor R_bias -->
  <line x1="260" y1="140" x2="260" y2="175" stroke="#bc8cff" stroke-width="2"/>
  <rect x="250" y="175" width="20" height="45" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="280" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#bc8cff">R_bias</text>
  <line x1="260" y1="220" x2="260" y2="255" stroke="#bc8cff" stroke-width="2"/>

  <!-- Node to ADC / V_out -->
  <circle cx="260" cy="255" r="5" fill="#3fb950"/>
  <line x1="260" y1="255" x2="380" y2="255" stroke="#3fb950" stroke-width="2.5"/>
  <circle cx="380" cy="255" r="4" fill="#3fb950"/>
  <text x="390" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">До АЦП MCU</text>
  <text x="390" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">10 мВ / K (2.98В @ 25°C)</text>

  <!-- LM335 Zener Diode Symbol -->
  <line x1="260" y1="255" x2="260" y2="295" stroke="#58a6ff" stroke-width="2"/>
  <!-- Zener triangle -->
  <polygon points="245,295 275,295 260,325" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <!-- Zener bar with bent edges -->
  <line x1="245" y1="325" x2="275" y2="325" stroke="#58a6ff" stroke-width="2"/>
  <line x1="245" y1="325" x2="245" y2="332" stroke="#58a6ff" stroke-width="2"/>
  <line x1="275" y1="325" x2="275" y2="318" stroke="#58a6ff" stroke-width="2"/>
  <text x="210" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">LM335</text>

  <!-- Cathode to Ground -->
  <line x1="260" y1="325" x2="260" y2="370" stroke="#8b949e" stroke-width="2"/>
  <line x1="245" y1="370" x2="275" y2="370" stroke="#8b949e" stroke-width="2"/>
  <line x1="250" y1="375" x2="270" y2="375" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="255" y1="380" x2="265" y2="380" stroke="#8b949e" stroke-width="1"/>
  <text x="285" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">GND</text>

  <!-- Trimmer Potentiometer 10k on ADJ pin -->
  <line x1="275" y1="310" x2="330" y2="310" stroke="#d29922" stroke-width="1.5"/>
  <rect x="330" y="300" width="35" height="20" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="347" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">ADJ</text>
  <line x1="365" y1="310" x2="390" y2="310" stroke="#d29922" stroke-width="1.5"/>
  <text x="400" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#d29922">Підстроювач 10 кОм</text>

  <!-- Bottom formula in box -->
  <rect x="60" y="395" width="400" height="40" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="260" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">R_bias = (V_sup - V_zener) / I_zener (де I_z ≈ 1 мА)</text>

  <!-- Right: Calibration procedure & Pros/Cons -->
  <rect x="500" y="85" width="310" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="655" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Калібрування та властивості</text>

  <rect x="520" y="135" width="270" height="95" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="535" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">Калібрування в 1 точці:</text>
  <text x="535" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Оскільки нуль фіксований на 0 K,</text>
  <text x="535" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">підлаштування ADJ при +25.0 °C</text>
  <text x="535" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">до V = 2.982 В калібрує весь діапазон!</text>

  <rect x="520" y="240" width="270" height="95" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="535" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Головна перевага:</text>
  <text x="535" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Двопровідне підключення по кабелю</text>
  <text x="535" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Опір дротів компенсується</text>
  <text x="535" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">живленням від стабільного струму</text>

  <rect x="520" y="345" width="270" height="90" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="535" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">Недолік для 3.3В систем:</text>
  <text x="535" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">При +60 °C напруга становить 3.33 В,</text>
  <text x="535" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149">що перевищує діапазон 3.3В АЦП!</text>
</svg>