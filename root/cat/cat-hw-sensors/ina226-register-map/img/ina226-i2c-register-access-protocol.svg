<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="500" rx="12" fill="url(#bg-grad2)"/>

  <text x="480" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    Протокол доступу до 16-бітних регістрів INA226 через шину I2C / SMBus
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Послідовність байтів покажчика (Pointer) та передачі даних у порядку MSB -> LSB (Big-Endian)
  </text>

  <!-- Legend -->
  <g transform="translate(140, 78)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#2563eb"/>
    <text x="24" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Від майстра (Master)</text>
    <rect x="180" y="0" width="18" height="18" rx="3" fill="#059669"/>
    <text x="204" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Від INA226 (Slave)</text>
    <rect x="360" y="0" width="18" height="18" rx="3" fill="#dc2626"/>
    <text x="384" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">START / STOP / NACK</text>
    <rect x="540" y="0" width="18" height="18" rx="3" fill="#d97706"/>
    <text x="564" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Покажчик регістра (Pointer)</text>
  </g>

  <!-- Transaction 1: WRITE REGISTER -->
  <g transform="translate(30, 115)">
    <rect width="900" height="160" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
      1. Запис у 16-бітний регістр (Register Write — Configuration, Calibration, Mask/Enable, Alert Limit)
    </text>

    <!-- Blocks row -->
    <g transform="translate(20, 48)">
      <!-- START -->
      <rect x="0" y="0" width="38" height="52" rx="4" fill="#dc2626"/>
      <text x="19" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">S</text>
      <text x="19" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fecaca">START</text>

      <!-- SLAVE ADDR + W -->
      <rect x="44" y="0" width="150" height="52" rx="4" fill="#2563eb"/>
      <text x="119" y="24" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">Slave Addr (7 bit) + W(0)</text>
      <text x="119" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#bfdbfe">наприклад: 0x80 (0x40 &lt;&lt; 1)</text>

      <!-- ACK from Slave -->
      <rect x="198" y="0" width="38" height="52" rx="4" fill="#059669"/>
      <text x="217" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="217" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">INA ACK</text>

      <!-- REGISTER POINTER -->
      <rect x="242" y="0" width="150" height="52" rx="4" fill="#d97706"/>
      <text x="317" y="24" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">Register Pointer</text>
      <text x="317" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fef3c7">8-біт адреса (0x00..0x07)</text>

      <!-- ACK from Slave -->
      <rect x="396" y="0" width="38" height="52" rx="4" fill="#059669"/>
      <text x="415" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="415" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">INA ACK</text>

      <!-- DATA MSB -->
      <rect x="440" y="0" width="165" height="52" rx="4" fill="#2563eb"/>
      <text x="522" y="24" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">Data Byte MSB [15:8]</text>
      <text x="522" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#bfdbfe">Старший байт даних</text>

      <!-- ACK from Slave -->
      <rect x="609" y="0" width="38" height="52" rx="4" fill="#059669"/>
      <text x="628" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="628" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">INA ACK</text>

      <!-- DATA LSB -->
      <rect x="653" y="0" width="165" height="52" rx="4" fill="#2563eb"/>
      <text x="735" y="24" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">Data Byte LSB [7:0]</text>
      <text x="735" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#bfdbfe">Молодший байт даних</text>

      <!-- ACK from Slave -->
      <rect x="822" y="0" width="38" height="52" rx="4" fill="#059669"/>
      <text x="841" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="841" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">INA ACK</text>

      <!-- STOP -->
      <rect x="864" y="0" width="38" height="52" rx="4" fill="#dc2626"/>
      <text x="883" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">P</text>
      <text x="883" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fecaca">STOP</text>
    </g>

    <!-- Note -->
    <text x="20" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      Оновлення значення регістра всередині INA226 відбувається атомарно по завершенню прийому 8-го біта молодшого байта (LSB).
    </text>
  </g>

  <!-- Transaction 2: READ REGISTER -->
  <g transform="translate(30, 290)">
    <rect width="900" height="185" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#34d399">
      2. Читання 16-бітного регістра (Register Read — Shunt, Bus Voltage, Current, Power, ID)
    </text>

    <!-- Phase 1: Set pointer -->
    <g transform="translate(20, 44)">
      <!-- START -->
      <rect x="0" y="0" width="34" height="48" rx="4" fill="#dc2626"/>
      <text x="17" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">S</text>
      <text x="17" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fecaca">START</text>

      <!-- SLAVE + W -->
      <rect x="38" y="0" width="130" height="48" rx="4" fill="#2563eb"/>
      <text x="103" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">Slave Addr + W(0)</text>
      <text x="103" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#bfdbfe">Фаза адресації</text>

      <!-- ACK -->
      <rect x="172" y="0" width="34" height="48" rx="4" fill="#059669"/>
      <text x="189" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="189" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">ACK</text>

      <!-- POINTER -->
      <rect x="210" y="0" width="130" height="48" rx="4" fill="#d97706"/>
      <text x="275" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">Pointer Byte</text>
      <text x="275" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fef3c7">Вибір регістра</text>

      <!-- ACK -->
      <rect x="344" y="0" width="34" height="48" rx="4" fill="#059669"/>
      <text x="361" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="361" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">ACK</text>

      <!-- REPEATED START -->
      <rect x="382" y="0" width="34" height="48" rx="4" fill="#dc2626"/>
      <text x="399" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Sr</text>
      <text x="399" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fecaca">RESTART</text>

      <!-- SLAVE + R -->
      <rect x="420" y="0" width="130" height="48" rx="4" fill="#2563eb"/>
      <text x="485" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">Slave Addr + R(1)</text>
      <text x="485" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#bfdbfe">Запит читання</text>

      <!-- ACK from Slave -->
      <rect x="554" y="0" width="34" height="48" rx="4" fill="#059669"/>
      <text x="571" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="571" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#a7f3d0">ACK</text>

      <!-- DATA MSB FROM SLAVE -->
      <rect x="592" y="0" width="120" height="48" rx="4" fill="#059669"/>
      <text x="652" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">Data MSB [15:8]</text>
      <text x="652" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">Від INA226</text>

      <!-- ACK FROM MASTER -->
      <rect x="716" y="0" width="34" height="48" rx="4" fill="#2563eb"/>
      <text x="733" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="733" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#bfdbfe">MCU ACK</text>

      <!-- DATA LSB FROM SLAVE -->
      <rect x="754" y="0" width="120" height="48" rx="4" fill="#059669"/>
      <text x="814" y="22" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">Data LSB [7:0]</text>
      <text x="814" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">Від INA226</text>

      <!-- NACK FROM MASTER -->
      <rect x="878" y="0" width="34" height="48" rx="4" fill="#dc2626"/>
      <text x="895" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NA</text>
      <text x="895" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fecaca">NACK</text>
    </g>

    <!-- Bottom Flow Explanation -->
    <g transform="translate(20, 110)">
      <rect width="860" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">
        Властивість покажчика:
      </text>
      <text x="145" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        Покажчик регістра зберігається всередині INA226. Якщо потрібно багаторазово зчитувати той самий регістр (наприклад, Current),
      </text>
      <text x="15" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        повторно відправляти Pointer Byte не обов'язково — майстер може відразу починати транзакцію з читання (START -> Addr+R -> Read MSB -> Read LSB).
      </text>
    </g>
  </g>
</svg>