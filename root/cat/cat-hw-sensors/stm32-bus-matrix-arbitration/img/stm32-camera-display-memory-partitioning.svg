<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Оптимальна сегментація пам'яті для відеотракту (Камера + Дисплей)
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Ізоляція потоків DCMI, DMA2D, LTDC та CPU по фізично розділених банках ОЗП (Zero Contention Architecture)
  </text>

  <!-- Flow 1: Camera Ingestion -->
  <g transform="translate(40, 90)">
    <rect width="880" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">
      Тракт 1: Захоплення камери (DCMI -> SRAM1)
    </text>
    <rect x="20" y="42" width="160" height="32" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="100" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">Камера OV2640</text>

    <line x1="180" y1="58" x2="230" y2="58" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>

    <rect x="235" y="42" width="180" height="32" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="325" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">DCMI + DMA2 (Very High)</text>

    <line x1="415" y1="58" x2="465" y2="58" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>

    <rect x="470" y="42" width="390" height="32" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="665" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      Виділений буфер у SRAM1 (Ping-Pong Double Buffer)
    </text>
  </g>

  <!-- Flow 2: Graphics Blitting -->
  <g transform="translate(40, 190)">
    <rect width="880" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
      Тракт 2: Обробка та копіювання (DMA2D Chrom-ART -> SDRAM)
    </text>
    <rect x="20" y="42" width="160" height="32" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">SRAM1 (Ping готов)</text>

    <line x1="180" y1="58" x2="230" y2="58" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="235" y="42" width="180" height="32" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="325" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">DMA2D (Pixel Convert)</text>

    <line x1="415" y1="58" x2="465" y2="58" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="470" y="42" width="390" height="32" rx="5" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="665" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      FMC Зовнішня SDRAM (Back-Buffer кадру)
    </text>
  </g>

  <!-- Flow 3: Display Refresh -->
  <g transform="translate(40, 290)">
    <rect width="880" height="85" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6">
      Тракт 3: Вивід на дисплей (LTDC читає SDRAM -> TFT панель)
    </text>
    <rect x="20" y="42" width="220" height="32" rx="5" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
    <text x="130" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      FMC SDRAM (Front-Buffer)
    </text>

    <line x1="240" y1="58" x2="300" y2="58" stroke="#ec4899" stroke-width="2" marker-end="url(#arrPink)"/>

    <rect x="305" y="42" width="180" height="32" rx="5" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="395" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#f472b6">LTDC DMA Читання</text>

    <line x1="485" y1="58" x2="545" y2="58" stroke="#ec4899" stroke-width="2" marker-end="url(#arrPink)"/>

    <rect x="550" y="42" width="310" height="32" rx="5" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
    <text x="705" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
      RGB888 / RGB565 TFT Дисплей 60 Гц
    </text>
  </g>

  <!-- Flow 4: CPU Independence -->
  <g transform="translate(40, 390)">
    <rect width="880" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
      Тракт 4: Робота ядра CPU (Cortex-M7 -> DTCM / ITCM)
    </text>
    <rect x="20" y="42" width="180" height="32" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">Cortex-M Ядро</text>

    <line x1="200" y1="58" x2="260" y2="58" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="265" y="42" width="595" height="32" rx="5" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="562" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      DTCM RAM (Стек, змінні, логіка) — 0 тактів очікування, жодного конфлікту з DMA!
    </text>
  </g>

  <!-- Bottom Final Summary Bar -->
  <rect x="40" y="488" width="880" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="480" y="504" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
    Підсумок: Жоден майстер не блокує іншого. Швидкість оновлення 60 FPS та відсутність артефактів камери гарантовані на 100%.
  </text>
</svg>