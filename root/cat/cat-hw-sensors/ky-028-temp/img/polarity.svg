<line x1="200.0" y1="330.0" x2="509.7" y2="330.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="509.7" y="307.4" width="220.6" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">спокій = LOW  →  НОРМА = LOW</tspan><tspan x="620.0" dy="14.3">перетин порогу = HIGH = «гаряче»</tspan></text>
<rect x="153.9" y="377.5" width="652.3" height="29.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="395.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Далі «гаряче» = будь-який стан, ПРОТИЛЕЖНИЙ до спокою. Код працює на обох партіях без правок.</tspan></text>
