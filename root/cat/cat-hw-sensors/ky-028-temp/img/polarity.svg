<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автовизначення полярності DO при старті</text>
<rect x="139.6" y="68.6" width="120.7" height="82.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">СТАРТ</tspan><tspan x="200.0" dy="15.6">прочитати DO</tspan><tspan x="200.0" dy="15.6">поки поріг ще</tspan><tspan x="200.0" dy="15.6">не перетнуто</tspan></text>
<line x1="200.0" y1="151.4" x2="200.0" y2="205.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="200,205 290,235 200,265 110,235" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="200.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">спокій</text>
<text x="200.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">= ?</text>
<line x1="290.0" y1="235.0" x2="470.0" y2="235.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="360.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">HIGH</text>
<line x1="470.0" y1="235.0" x2="470.0" y2="175.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="470.0" y1="175.0" x2="512.8" y2="175.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="512.8" y="152.3" width="214.4" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">спокій = HIGH  →  НОРМА = HIGH</tspan><tspan x="620.0" dy="14.3">перетин порогу = LOW = «гаряче»</tspan></text>
<line x1="200.0" y1="265.0" x2="200.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8"/>
