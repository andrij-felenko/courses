<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Монолітна CMOS-MEMS структура акселерометра</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Скорочення міжз'єднань усуває паразитну ємність дротів і зберігає корисний сигнал</text>

  <!-- Left Panel: Problem -->
  <rect x="30" y="75" width="435" height="425" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <rect x="45" y="90" width="405" height="34" fill="#ffffff" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="247" y="112" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">ПРОБЛЕМА: Дискретна схема (двочипове розварювання)</text>

  <!-- Wire Callout -->
  <rect x="165" y="135" width="165" height="38" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="247" y="150" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Довгий дріт: L ≈ 2–5 мм</text>
  <text x="247" y="166" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">C_p ≈ 1–2 пФ (ВЕЛИКА!)</text>

  <!-- MEMS Chip Left -->
  <rect x="55" y="240" width="160" height="85" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <rect x="65" y="230" width="140" height="10" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
  <rect x="60" y="195" width="18" height="35" fill="#d97706" rx="2"/>
  <rect x="162" y="195" width="18" height="35" fill="#d97706" rx="2"/>
  <rect x="80" y="190" width="80" height="35" fill="#f59e0b" stroke="#d97706" stroke-width="1" rx="2"/>
  <text x="120" y="212" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">MEMS-маса</text>
  <rect x="182" y="215" width="22" height="15" fill="#94a3b8" stroke="#475569" stroke-width="1" rx="1"/>
  <text x="135" y="315" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">MEMS-чип (кремній)</text>

  <!-- CMOS Chip Left -->
  <rect x="285" y="240" width="160" height="85" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <rect x="295" y="230" width="140" height="10" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
  <rect x="295" y="215" width="22" height="15" fill="#94a3b8" stroke="#475569" stroke-width="1" rx="1"/>
  <rect x="330" y="185" width="95" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="377" y="212" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMOS Затвор</text>
  <text x="365" y="315" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CMOS-чип (підсилювач)</text>

  <!-- Wire Arc -->
  <path d="M 193,215 C 215,182 280,182 306,215" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Bottom Info Left -->
  <rect x="45" y="340" width="405" height="145" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="247" y="360" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Вплив паразитної ємності C_p:</text>
  <text x="60" y="384" font-size="12" fill="#1a1a1a">1. Вихідний сигнал: ΔV_out = V_in × [ ΔC / (C_0 + C_p) ]</text>
  <text x="60" y="406" font-size="12" fill="#1a1a1a">2. Сигнал сенсора: ΔC ≈ 1–10 фФ (0.001–0.01 пФ)</text>
  <text x="60" y="428" font-size="12" fill="#1a1a1a">3. Паразитна ємність: C_p ≈ 1000–2000 фФ (дроти)</text>
  <rect x="55" y="445" width="385" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="247" y="465" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">❌ Корисний сигнал згасає у 100–1000 разів!</text>

  <!-- Right Panel: Solution -->
  <rect x="495" y="75" width="435" height="425" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <rect x="510" y="90" width="405" height="34" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="712" y="112" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">РОЗВ'ЯЗОК: Монолітна CMOS-MEMS структура</text>

  <!-- Track Callout -->
  <rect x="627" y="135" width="170" height="38" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="712" y="150" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Металевий трек: L &lt; 50 мкм</text>
  <text x="712" y="166" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">C_p &lt; 10 фФ (МІНІМАЛЬНА!)</text>

  <!-- Single Substrate Right -->
  <rect x="520" y="240" width="385" height="85" fill="#e2e8f0" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <rect x="530" y="230" width="365" height="10" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
  <text x="712" y="315" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Єдина підкладка кремнію (Monolithic Substrate)</text>

  <!-- Integrated MEMS Right -->
  <rect x="530" y="195" width="18" height="35" fill="#d97706" rx="2"/>
  <rect x="550" y="190" width="80" height="35" fill="#f59e0b" stroke="#d97706" stroke-width="1" rx="2"/>
  <text x="590" y="212" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">MEMS-маса</text>
  <rect x="635" y="185" width="25" height="45" fill="#d97706" rx="2"/>

  <!-- Integrated CMOS Right -->
  <rect x="785" y="185" width="95" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="832" y="212" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMOS Затвор</text>

  <!-- Monolithic Metal Interconnect -->
  <path d="M 660,205 L 785,205" fill="none" stroke="#2457d6" stroke-width="4"/>
  <path d="M 712,173 L 712,197" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Bottom Info Right -->
  <rect x="510" y="340" width="405" height="145" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="712" y="360" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Переваги монолітної інтеграції:</text>
  <text x="525" y="384" font-size="12" fill="#1a1a1a">1. Вихідний сигнал: ΔV_out ≈ V_in × ( ΔC / C_0 )</text>
  <text x="525" y="406" font-size="12" fill="#1a1a1a">2. Сигнал сенсора: ΔC ≈ 1–10 фФ (без втрат)</text>
  <text x="525" y="428" font-size="12" fill="#1a1a1a">3. Паразитна ємність: C_p &lt; 10 фФ (зменшено у 100+ разів)</text>
  <rect x="520" y="445" width="385" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="712" y="465" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Пряме зчитування фемтофарад без втрат!</text>
</svg>
