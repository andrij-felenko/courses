<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Диференціальна схема зчитування MEMS на перемикальних конденсаторах</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Двофазна комутація (Φ₁, Φ₂) переносить корисний заряд ΔQ у підсилювач і блокує вплив паразитних ємностей</text>

  <!-- Panel 1: Main Schematic -->
  <rect x="30" y="85" width="580" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Схема перемикання та зарядового підсилювача</text>

  <!-- Excitation Lines & Voltage Labels -->
  <text x="55" y="165" font-size="13" font-weight="bold" fill="#2457d6">+V_s</text>
  <line x1="85" y1="160" x2="95" y2="160" stroke="#2457d6" stroke-width="2"/>
  
  <text x="55" y="445" font-size="13" font-weight="bold" fill="#2457d6">-V_s</text>
  <line x1="85" y1="440" x2="95" y2="440" stroke="#2457d6" stroke-width="2"/>

  <!-- Switch S1 (Phi1) -->
  <circle cx="95" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="150" cy="160" r="3" fill="#1a1a1a"/>
  <line x1="95" y1="160" x2="142" y2="148" stroke="#2457d6" stroke-width="2"/>
  <text x="125" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">S₁ (Φ₁)</text>

  <!-- Switch S2 (Phi2) -->
  <line x1="95" y1="240" x2="95" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="83" y1="250" x2="107" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="87" y1="254" x2="103" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="91" y1="258" x2="99" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="95" cy="240" r="3" fill="#1a1a1a"/>
  <circle cx="150" cy="200" r="3" fill="#1a1a1a"/>
  <line x1="95" y1="240" x2="142" y2="225" stroke="#2457d6" stroke-width="2"/>
  <text x="125" y="248" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">S₂ (Φ₂)</text>

  <!-- Switch S4 (Phi2) -->
  <line x1="95" y1="340" x2="95" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="83" y1="330" x2="107" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="87" y1="326" x2="103" y2="326" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="91" y1="322" x2="99" y2="322" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="95" cy="340" r="3" fill="#1a1a1a"/>
  <circle cx="150" cy="380" r="3" fill="#1a1a1a"/>
  <line x1="95" y1="340" x2="142" y2="355" stroke="#2457d6" stroke-width="2"/>
  <text x="125" y="332" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">S₄ (Φ₂)</text>

  <!-- Switch S3 (Phi1) -->
  <circle cx="95" cy="440" r="3" fill="#1a1a1a"/>
  <circle cx="150" cy="440" r="3" fill="#1a1a1a"/>
  <line x1="95" y1="440" x2="142" y2="452" stroke="#2457d6" stroke-width="2"/>
  <text x="125" y="458" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">S₃ (Φ₁)</text>

  <!-- Input Wires to MEMS -->
  <line x1="150" y1="160" x2="180" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="200" x2="180" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="160" x2="180" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="150" y1="440" x2="180" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="380" x2="180" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="440" x2="180" y2="360" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MEMS Boundary Box -->
  <rect x="195" y="185" width="120" height="215" rx="6" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="255" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">MEMS-структура</text>

  <!-- MEMS Capacitors -->
  <!-- C1 (Top Capacitor) -->
  <line x1="180" y1="220" x2="210" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="220" x2="250" y2="220" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="210" y1="232" x2="250" y2="232" stroke="#2457d6" stroke-width="3"/>
  <text x="265" y="225" font-size="13" font-weight="bold" fill="#1a1a1a">C₁ = C₀ + ΔC</text>

  <!-- C2 (Bottom Capacitor) -->
  <line x1="210" y1="348" x2="250" y2="348" stroke="#2457d6" stroke-width="3"/>
  <line x1="210" y1="360" x2="250" y2="360" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="180" y1="360" x2="210" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <text x="265" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">C₂ = C₀ - ΔC</text>

  <!-- Sense Node Connections (Proof Mass) -->
  <line x1="230" y1="232" x2="230" y2="348" stroke="#2457d6" stroke-width="2"/>
  <circle cx="230" cy="290" r="4" fill="#2457d6"/>
  <text x="265" y="295" font-size="13" font-weight="bold" fill="#2457d6">V_x (Рухома маса)</text>

  <!-- Line from Sense Node to Op-Amp -->
  <line x1="230" y1="290" x2="370" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="330" cy="290" r="3.5" fill="#1a1a1a"/>

  <!-- Parasitic Capacitance Cp to GND -->
  <line x1="330" y1="290" x2="330" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="318" y1="320" x2="342" y2="320" stroke="#c0392b" stroke-width="2"/>
  <line x1="318" y1="328" x2="342" y2="328" stroke="#c0392b" stroke-width="2"/>
  <line x1="330" y1="328" x2="330" y2="345" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Cp Ground -->
  <line x1="320" y1="345" x2="340" y2="345" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="324" y1="349" x2="336" y2="349" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="327" y1="353" x2="333" y2="353" stroke="#c0392b" stroke-width="1.5"/>
  <text x="348" y="328" font-size="12" font-weight="bold" fill="#c0392b">C_p</text>
  <text x="330" y="380" font-size="12" text-anchor="middle" fill="#c0392b">Паразитна ємність</text>
  <text x="330" y="402" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">V_x = V_cm ⇒ Q_Cp = 0!</text>

  <!-- Input Wire to Op-Amp Inverting Terminal -->
  <circle cx="370" cy="290" r="3.5" fill="#1a1a1a"/>
  <line x1="370" y1="290" x2="370" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="265" x2="400" y2="265" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Operational Amplifier Symbol -->
  <polygon points="400,240 400,340 480,290" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="408" y="270" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="408" y="320" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>

  <!-- Op-Amp Non-Inverting Terminal (+) Ground -->
  <line x1="370" y1="315" x2="400" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="315" x2="370" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="358" y1="340" x2="382" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="362" y1="344" x2="378" y2="344" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="366" y1="348" x2="374" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="370" y="372" font-size="12" text-anchor="middle" fill="#6b7280">Віртуальна земля (V_cm)</text>

  <!-- Feedback Loop (Above Op-Amp) -->
  <!-- Wire from Inverting input going up -->
  <line x1="370" y1="265" x2="370" y2="165" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Branch 1: Feedback Capacitor Cf (y=165) -->
  <line x1="370" y1="165" x2="435" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="435" y1="152" x2="435" y2="178" stroke="#2457d6" stroke-width="3"/>
  <line x1="447" y1="152" x2="447" y2="178" stroke="#2457d6" stroke-width="3"/>
  <line x1="447" y1="165" x2="520" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <text x="441" y="142" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">C_f</text>

  <!-- Branch 2: Reset Switch S_rst (Phi1) (y=215) -->
  <circle cx="370" cy="215" r="3.5" fill="#1a1a1a"/>
  <line x1="370" y1="215" x2="415" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="415" cy="215" r="3" fill="#1a1a1a"/>
  <circle cx="470" cy="215" r="3" fill="#1a1a1a"/>
  <line x1="415" y1="215" x2="462" y2="203" stroke="#2457d6" stroke-width="2"/>
  <line x1="470" y1="215" x2="520" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <text x="442" y="198" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">S_rst (Φ₁)</text>

  <!-- Output Wire & Labels -->
  <line x1="480" y1="290" x2="555" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="520" y1="165" x2="520" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="520" cy="215" r="3.5" fill="#1a1a1a"/>
  <circle cx="520" cy="290" r="3.5" fill="#1a1a1a"/>
  <circle cx="555" cy="290" r="4" fill="#2457d6"/>
  <text x="565" y="285" font-size="14" font-weight="bold" fill="#2457d6">V_out</text>
  <text x="490" y="330" font-size="13" font-weight="bold" fill="#27ae60">V_out = (2 · V_s · ΔC) / C_f</text>

  <!-- Panel 2: Timing Signals (Top Right) -->
  <rect x="630" y="85" width="300" height="200" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="645" y="112" font-size="14" font-weight="bold" fill="#2457d6">Фази комутації (Non-overlapping)</text>

  <!-- Signal Phi1 -->
  <text x="645" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">Φ₁ (S₁, S₃, S_rst)</text>
  <path d="M 740,135 L 800,135 L 800,160 L 890,160 L 890,135 L 910,135" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="810" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Скидання C_f</text>

  <!-- Signal Phi2 -->
  <text x="645" y="205" font-size="12" font-weight="bold" fill="#1a1a1a">Φ₂ (S₂, S₄)</text>
  <path d="M 740,220 L 815,220 L 815,195 L 875,195 L 875,220 L 910,220" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="860" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Перенос ΔQ</text>

  <!-- Non-overlapping Gap Annotations -->
  <line x1="800" y1="135" x2="800" y2="230" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="815" y1="135" x2="815" y2="230" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="785" y="248" font-size="12" text-anchor="middle" fill="#6b7280">Захисний інтервал (Gap)</text>
  <text x="785" y="266" font-size="12" text-anchor="middle" fill="#6b7280">унеможливлює скрізний струм</text>

  <!-- Panel 3: Key Features & Formulas (Bottom Right) -->
  <rect x="630" y="297" width="300" height="218" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="645" y="322" font-size="14" font-weight="bold" fill="#27ae60">Ключові переваги схеми</text>

  <!-- Bullet 1: Charge Transfer -->
  <text x="645" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">1. Перенос заряду за такт:</text>
  <text x="645" y="368" font-size="12" font-weight="bold" fill="#2457d6">ΔQ = V_s · (C₁ - C₂) = 2 V_s ΔC</text>

  <!-- Bullet 2: CMRR -->
  <text x="645" y="396" font-size="12" font-weight="bold" fill="#1a1a1a">2. Пригнічення синфазної завади:</text>
  <text x="645" y="414" font-size="12" fill="#6b7280">Завада живлення діє однаково</text>
  <text x="645" y="430" font-size="12" fill="#6b7280">на C₁ і C₂ та взаємно віднімається.</text>

  <!-- Bullet 3: Parasitic Immunity -->
  <text x="645" y="458" font-size="12" font-weight="bold" fill="#1a1a1a">3. Нечутливість до паразитної C_p:</text>
  <text x="645" y="476" font-size="12" font-weight="bold" fill="#27ae60">Оскільки V_x = 0 V (віртуальна земля),</text>
  <text x="645" y="492" font-size="12" font-weight="bold" fill="#27ae60">струм не витрачається на заряд C_p.</text>
</svg>
