<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title Block -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Диференційний перенос заряду в MEMS на перемикальних конденсаторах</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Двофазна комутація збудження (Φ₁, Φ₂) переносить різницевий заряд ΔQ = 4ΔC·V_ref на C_f та придушує C₀</text>

  <!-- PANEL 1: Phase 1 -->
  <rect x="30" y="70" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="82" width="405" height="26" rx="4" fill="#2457d6"/>
  <text x="247.5" y="99" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Фаза 1 (Φ₁): Накопичення початкового заряду</text>

  <!-- Voltage Terminals & Switches Phase 1 -->
  <!-- +Vref Terminal -->
  <circle cx="50" cy="135" r="4" fill="#c0392b"/>
  <text x="50" y="153" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+V_ref</text>
  <line x1="50" y1="135" x2="80" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="135" r="2.5" fill="#2457d6"/>
  <line x1="80" y1="135" x2="115" y2="135" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="115" cy="135" r="2.5" fill="#2457d6"/>
  <text x="97.5" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Φ₁ (закр)</text>
  <line x1="115" y1="135" x2="150" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="135" x2="150" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- -Vref Terminal -->
  <circle cx="50" cy="315" r="4" fill="#2457d6"/>
  <text x="50" y="333" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-V_ref</text>
  <line x1="50" y1="315" x2="80" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="315" r="2.5" fill="#2457d6"/>
  <line x1="80" y1="315" x2="115" y2="315" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="115" cy="315" r="2.5" fill="#2457d6"/>
  <text x="97.5" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Φ₁ (закр)</text>
  <line x1="115" y1="315" x2="150" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="315" x2="150" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MEMS Capacitive Sensor Structure Phase 1 -->
  <line x1="135" y1="165" x2="165" y2="165" stroke="#4b5563" stroke-width="4"/>
  <rect x="130" y="222" width="40" height="6" rx="1.5" fill="#1a1a1a"/>
  <line x1="135" y1="285" x2="165" y2="285" stroke="#4b5563" stroke-width="4"/>

  <!-- Displacement Arrow dx -->
  <line x1="120" y1="238" x2="120" y2="218" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="112" y="231" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Δx</text>

  <!-- Capacitance Labels -->
  <text x="175" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₁ = C₀ + ΔC</text>
  <text x="175" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₂ = C₀ - ΔC</text>

  <!-- Sense Node & Wire -->
  <line x1="170" y1="225" x2="185" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="185" y1="225" x2="185" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="185" y1="215" x2="295" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="195" cy="215" r="3.5" fill="#2457d6"/>
  <text x="195" y="247" font-size="12" fill="#6b7280" text-anchor="middle">V_s ≈ 0 B</text>

  <!-- Op-Amp Phase 1 -->
  <polygon points="295,200 295,250 345,225" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="218" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="300" y="238" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>

  <!-- GND on + terminal -->
  <line x1="295" y1="235" x2="295" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="287" y1="255" x2="303" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="290" y1="259" x2="300" y2="259" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="293" y1="263" x2="297" y2="263" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Feedback Loop Phase 1 -->
  <line x1="260" y1="215" x2="260" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="140" x2="305" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Cf Capacitor -->
  <line x1="305" y1="130" x2="305" y2="150" stroke="#2457d6" stroke-width="3"/>
  <line x1="315" y1="130" x2="315" y2="150" stroke="#2457d6" stroke-width="3"/>
  <text x="310" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C_f</text>
  <line x1="315" y1="140" x2="380" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Parallel Reset Switch Phis_rst (Closed in Phase 1) -->
  <line x1="260" y1="175" x2="290" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="290" cy="175" r="2.5" fill="#2457d6"/>
  <line x1="290" y1="175" x2="330" y2="175" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="330" cy="175" r="2.5" fill="#2457d6"/>
  <line x1="330" y1="175" x2="380" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="272" y="163" font-size="12" fill="#2457d6" text-anchor="start">Φ_rst (скид, закр)</text>

  <line x1="380" y1="140" x2="380" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="345" y1="225" x2="415" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="415" cy="225" r="3.5" fill="#1a1a1a"/>
  <text x="415" y="210" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_out1</text>
  <text x="415" y="245" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">= 0 B</text>

  <!-- Panel 1 Equations Box -->
  <rect x="45" y="365" width="405" height="78" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="383" font-size="12" font-weight="bold" fill="#1a1a1a">Заряд у фазі 1 (комутація Φ₁):</text>
  <text x="55" y="401" font-size="12" fill="#2457d6">Q₁⁽¹⁾ = +(C₀ + ΔC) · V_ref</text>
  <text x="55" y="419" font-size="12" fill="#2457d6">Q₂⁽¹⁾ = -(C₀ - ΔC) · V_ref</text>
  <text x="55" y="435" font-size="12" font-weight="bold" fill="#1a1a1a">Q_net⁽¹⁾ = Q₁⁽¹⁾ + Q₂⁽¹⁾ = 2ΔC · V_ref</text>


  <!-- PANEL 2: Phase 2 -->
  <rect x="495" y="70" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="82" width="405" height="26" rx="4" fill="#27ae60"/>
  <text x="712.5" y="99" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Фаза 2 (Φ₂): Перенос заряду на C_f та вимірювання</text>

  <!-- Voltage Terminals & Switches Phase 2 -->
  <!-- -Vref Terminal (Switched) -->
  <circle cx="515" cy="135" r="4" fill="#2457d6"/>
  <text x="515" y="153" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-V_ref</text>
  <line x1="515" y1="135" x2="545" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="545" cy="135" r="2.5" fill="#27ae60"/>
  <line x1="545" y1="135" x2="580" y2="135" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="580" cy="135" r="2.5" fill="#27ae60"/>
  <text x="562.5" y="120" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Φ₂ (закр)</text>
  <line x1="580" y1="135" x2="615" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="135" x2="615" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- +Vref Terminal (Switched) -->
  <circle cx="515" cy="315" r="4" fill="#c0392b"/>
  <text x="515" y="333" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+V_ref</text>
  <line x1="515" y1="315" x2="545" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="545" cy="315" r="2.5" fill="#27ae60"/>
  <line x1="545" y1="315" x2="580" y2="315" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="580" cy="315" r="2.5" fill="#27ae60"/>
  <text x="562.5" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Φ₂ (закр)</text>
  <line x1="580" y1="315" x2="615" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="315" x2="615" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MEMS Capacitive Sensor Structure Phase 2 -->
  <line x1="600" y1="165" x2="630" y2="165" stroke="#4b5563" stroke-width="4"/>
  <rect x="595" y="222" width="40" height="6" rx="1.5" fill="#1a1a1a"/>
  <line x1="600" y1="285" x2="630" y2="285" stroke="#4b5563" stroke-width="4"/>

  <!-- Displacement Arrow dx -->
  <line x1="585" y1="238" x2="585" y2="218" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="577" y="231" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Δx</text>

  <!-- Capacitance Labels -->
  <text x="640" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₁ = C₀ + ΔC</text>
  <text x="640" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₂ = C₀ - ΔC</text>

  <!-- Charge Flow Arrow and Label in Phase 2 -->
  <line x1="650" y1="205" x2="705" y2="205" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="650" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Перенос ΔQ</text>

  <!-- Sense Node & Wire -->
  <line x1="635" y1="225" x2="650" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="650" y1="225" x2="650" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="650" y1="215" x2="760" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="660" cy="215" r="3.5" fill="#27ae60"/>
  <text x="660" y="247" font-size="12" fill="#6b7280" text-anchor="middle">V_s ≈ 0 B</text>

  <!-- Op-Amp Phase 2 -->
  <polygon points="760,200 760,250 810,225" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="765" y="218" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="765" y="238" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>

  <!-- GND on + terminal -->
  <line x1="760" y1="235" x2="760" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="752" y1="255" x2="768" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="755" y1="259" x2="765" y2="259" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="758" y1="263" x2="762" y2="263" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Feedback Loop Phase 2 -->
  <line x1="725" y1="215" x2="725" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="725" y1="140" x2="770" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Cf Capacitor with Charge -->
  <line x1="770" y1="130" x2="770" y2="150" stroke="#27ae60" stroke-width="3"/>
  <line x1="780" y1="130" x2="780" y2="150" stroke="#27ae60" stroke-width="3"/>
  <text x="775" y="122" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C_f</text>
  <text x="755" y="163" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+ΔQ</text>
  <text x="795" y="163" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">-ΔQ</text>
  <line x1="780" y1="140" x2="845" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Parallel Reset Switch Phis_rst (Open in Phase 2) -->
  <line x1="725" y1="175" x2="740" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="740" cy="175" r="2.5" fill="#c0392b"/>
  <line x1="740" y1="175" x2="765" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="770" cy="175" r="2.5" fill="#c0392b"/>
  <line x1="770" y1="175" x2="845" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="735" y="193" font-size="12" fill="#c0392b" text-anchor="start">Φ_rst (відкр)</text>

  <line x1="845" y1="140" x2="845" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="225" x2="875" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="875" cy="225" r="3.5" fill="#27ae60"/>
  <text x="875" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_out</text>
  <text x="860" y="245" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">= (4ΔC/C_f)·V_ref</text>

  <!-- Panel 2 Equations Box -->
  <rect x="510" y="365" width="405" height="78" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="520" y="383" font-size="12" font-weight="bold" fill="#1a1a1a">Зміна заряду та вихід у фазі 2:</text>
  <text x="520" y="401" font-size="12" fill="#27ae60">ΔQ = Q_net⁽¹⁾ - Q_net⁽²⁾ = 4ΔC · V_ref</text>
  <text x="520" y="419" font-size="12" font-weight="bold" fill="#27ae60">V_out = ΔQ / C_f = (4ΔC / C_f) · V_ref</text>
  <text x="520" y="435" font-size="12" fill="#6b7280">C₀ (синфазна ємність) повністю відфільтрована</text>


  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="30" y="470" width="900" height="75" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="50" y="490" font-size="13" font-weight="bold" fill="#2457d6">Основні фізико-математичні характеристики вимірювального тракту:</text>

  <text x="50" y="510" font-size="12" fill="#1a1a1a">• Чутливість: <tspan font-weight="bold" fill="#2457d6">S_V = dV_out / d(ΔC) = 4 V_ref / C_f</tspan> [В/Ф]</text>
  <text x="50" y="530" font-size="12" fill="#1a1a1a">• Шум комутації: <tspan font-weight="bold" fill="#1a1a1a">e_n,sw² = 2 kT / C_f</tspan> (шум kT/C)</text>

  <text x="470" y="510" font-size="12" fill="#1a1a1a">• Придушення синфазних завад (CMRR): скасування C₀</text>
  <text x="470" y="530" font-size="12" fill="#1a1a1a">• Вхід на віртуальній землі придушує паразитну ємність C_p</text>
</svg>
