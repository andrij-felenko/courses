<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="550" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл регістрового простору CDC мікросхеми</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Організація регістрів збудження, компенсації C_offset та 24-бітних даних АЦП</text>

  <!-- Left Panel: Address Space Map -->
  <rect x="30" y="78" width="280" height="446" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="99" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта регістрів CDC (0x00 – 0x27)</text>

  <!-- Block 1: System Control -->
  <rect x="42" y="105" width="256" height="48" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="52" y="123" font-size="12" font-weight="bold" fill="#1a1a1a">0x00–0x03: Системний контроль</text>
  <text x="52" y="141" font-size="12" fill="#6b7280">• Стан DRDY, переривання, режими</text>

  <!-- Block 2: Excitation Setup -->
  <rect x="42" y="167" width="256" height="68" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="52" y="184" font-size="12" font-weight="bold" fill="#2457d6">0x04–0x07: Налаштування збудження</text>
  <text x="52" y="203" font-size="12" fill="#1a1a1a">• EXC_FREQ: частота z-збудження</text>
  <text x="52" y="222" font-size="12" fill="#6b7280">• EXC_SETUP: амплітуда та фаза</text>

  <!-- Block 3: Offset Compensation -->
  <rect x="42" y="249" width="256" height="68" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="52" y="266" font-size="12" font-weight="bold" fill="#27ae60">0x08–0x0F: Компенсація зміщення</text>
  <text x="52" y="285" font-size="12" fill="#1a1a1a">• CAPDAC_POS / NEG: C_offset</text>
  <text x="52" y="304" font-size="12" fill="#6b7280">• Усунення паразитної ємності</text>

  <!-- Block 4: ADC Config -->
  <rect x="42" y="331" width="256" height="48" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="52" y="349" font-size="12" font-weight="bold" fill="#1a1a1a">0x10–0x1B: Конфігурація АЦП</text>
  <text x="52" y="367" font-size="12" fill="#6b7280">• Час перетворення, усереднення</text>

  <!-- Block 5: ADC Data -->
  <rect x="42" y="393" width="256" height="121" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="52" y="410" font-size="12" font-weight="bold" fill="#2457d6">0x1C–0x21: Вихідні дані АЦП</text>
  <text x="52" y="428" font-size="12" fill="#1a1a1a">• CDC_DATA_MSB (0x1C) [23:16]</text>
  <text x="52" y="446" font-size="12" fill="#1a1a1a">• CDC_DATA_MID (0x1D) [15:8]</text>
  <text x="52" y="464" font-size="12" fill="#1a1a1a">• CDC_DATA_LSB (0x1E) [7:0]</text>
  <text x="52" y="482" font-size="12" fill="#6b7280">• Авто-інкремент адреси</text>
  <text x="52" y="500" font-size="12" fill="#6b7280">• Фіксація значень при читанні</text>

  <!-- Connection Lines (Left Map -> Right Panels) -->
  <path d="M 298 201 L 322 201 L 322 145 L 345 145" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <path d="M 298 283 L 322 283 L 322 298.5 L 345 298.5" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <path d="M 298 453.5 L 345 453.5" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Right Panel 1: Excitation Setup -->
  <rect x="345" y="78" width="585" height="135" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="346" y="79" width="583" height="26" fill="#eaf0fd" rx="7"/>
  <text x="360" y="97" font-size="13" font-weight="bold" fill="#2457d6">1. Блок налаштування збудження MEMS (Excitation Setup)</text>

  <rect x="360" y="113" width="225" height="52" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="472" y="131" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Генератор збудження</text>
  <text x="472" y="150" font-size="12" fill="#6b7280" text-anchor="middle">f_EXC = f_CLK / (2 × DIV)</text>

  <line x1="585" y1="139" x2="613" y2="139" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="599" y="131" font-size="12" fill="#2457d6" text-anchor="middle">EXC</text>

  <rect x="615" y="113" width="180" height="52" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="705" y="131" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Формувач фаз A/B</text>
  <text x="705" y="150" font-size="12" fill="#1a1a1a" text-anchor="middle">V_EXCA, V_EXCB (протифаза)</text>

  <line x1="795" y1="139" x2="823" y2="139" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="825" y="113" width="95" height="52" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="872" y="131" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">До MEMS</text>
  <text x="872" y="150" font-size="12" fill="#6b7280" text-anchor="middle">C_sensor</text>

  <text x="360" y="195" font-size="12" fill="#6b7280">Керує частотою та амплітудою збудження для перенесення спектра вимірювання.</text>

  <!-- Right Panel 2: Offset Compensation -->
  <rect x="345" y="227" width="585" height="143" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="346" y="228" width="583" height="26" fill="#e9f7ef" rx="7"/>
  <text x="360" y="246" font-size="13" font-weight="bold" fill="#27ae60">2. Блок компенсації зміщення (CAPDAC Offset Compensation)</text>

  <rect x="360" y="261" width="140" height="45" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="278" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C_sensor (Вхід)</text>
  <text x="430" y="295" font-size="12" fill="#6b7280" text-anchor="middle">C_mems + C_par</text>

  <line x1="500" y1="283.5" x2="522" y2="283.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="511" y="276" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+</text>

  <circle cx="535" cy="283.5" r="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="535" y="287.5" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Σ</text>

  <rect x="465" y="318" width="140" height="42" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="535" y="334" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CAPDAC (0x08-0x0B)</text>
  <text x="535" y="351" font-size="12" fill="#1a1a1a" text-anchor="middle">C_DAC (компенсація)</text>

  <line x1="535" y1="318" x2="535" y2="297.5" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="545" y="310" font-size="12" font-weight="bold" fill="#27ae60">–</text>

  <line x1="547" y1="283.5" x2="613" y2="283.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="580" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔC</text>

  <rect x="615" y="261" width="150" height="45" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="690" y="278" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔC = C_in – C_DAC</text>
  <text x="690" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">Корисний сигнал</text>

  <line x1="765" y1="283.5" x2="788" y2="283.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="790" y="261" width="130" height="45" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="855" y="278" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід ΣΔ-АЦП</text>
  <text x="855" y="295" font-size="12" fill="#27ae60" text-anchor="middle">Без насичення</text>

  <!-- Right Panel 3: Data Registers -->
  <rect x="345" y="384" width="585" height="140" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="346" y="385" width="583" height="26" fill="#eaf0fd" rx="7"/>
  <text x="360" y="403" font-size="13" font-weight="bold" fill="#2457d6">3. 24-бітний вихідний регістр даних та сигнали готовності (DRDY / SPI)</text>

  <rect x="360" y="419" width="130" height="44" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="425" y="436" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DATA_MSB (0x1C)</text>
  <text x="425" y="453" font-size="12" fill="#6b7280" text-anchor="middle">Біти [23:16]</text>

  <line x1="490" y1="441" x2="503" y2="441" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="505" y="419" width="130" height="44" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="570" y="436" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DATA_MID (0x1D)</text>
  <text x="570" y="453" font-size="12" fill="#6b7280" text-anchor="middle">Біти [15:8]</text>

  <line x1="635" y1="441" x2="648" y2="441" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="650" y="419" width="130" height="44" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="715" y="436" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DATA_LSB (0x1E)</text>
  <text x="715" y="453" font-size="12" fill="#6b7280" text-anchor="middle">Біти [7:0]</text>

  <line x1="780" y1="441" x2="793" y2="441" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <rect x="795" y="419" width="125" height="44" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="857" y="436" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPI / DRDY</text>
  <text x="857" y="453" font-size="12" fill="#27ae60" text-anchor="middle">Переривання МК</text>

  <rect x="360" y="470" width="560" height="44" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="370" y="487" font-size="12" font-weight="bold" fill="#1a1a1a">Burst Read (Авто-інкремент):</text>
  <text x="555" y="487" font-size="12" fill="#6b7280">Читання 3 байт поспіль защелкає 24-бітний результат</text>
  <text x="370" y="504" font-size="12" fill="#6b7280">Сигнал DRDY інформує мікроконтролер про завершення циклу перетворення АЦП.</text>
</svg>
