<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паразитне шунтування ємності в MEMS-давачах</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Паразитна ємність дротів і підкладки (Cp &gt;&gt; C0) згашує вихідний сигнал ємнісного дільника</text>

  <!-- Left Panel: Circuit Schematic -->
  <rect x="30" y="80" width="480" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="106" font-size="14" font-weight="bold" fill="#1a1a1a">Еквівалентна схема ємнісного дільника з Cp</text>

  <!-- AC Excitation Source -->
  <text x="80" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Джерело</text>
  <text x="80" y="164" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Vexc</text>
  <circle cx="80" cy="200" r="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 70 200 Q 75 192 80 200 T 90 200" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="80" y1="180" x2="195" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="220" x2="80" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Ground at AC Source -->
  <line x1="68" y1="290" x2="92" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="72" y1="295" x2="88" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="76" y1="300" x2="84" y2="300" stroke="#1a1a1a" stroke-width="1"/>

  <!-- MEMS Sensing Capacitor Box & Component -->
  <rect x="140" y="120" width="130" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="205" y="140" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MEMS-структура</text>
  <line x1="195" y1="165" x2="195" y2="195" stroke="#27ae60" stroke-width="3"/>
  <line x1="205" y1="165" x2="205" y2="195" stroke="#27ae60" stroke-width="3"/>
  <line x1="205" y1="180" x2="320" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="205" y="215" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cs = C0 ± ΔC</text>
  <text x="205" y="230" font-size="12" fill="#27ae60" text-anchor="middle">~0.1–1 pF</text>

  <!-- Sense Node X -->
  <circle cx="320" cy="180" r="5" fill="#2457d6"/>
  <text x="320" y="145" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол X</text>
  <text x="320" y="162" font-size="12" fill="#6b7280" text-anchor="middle">(Sense Node)</text>

  <!-- Parasitic Capacitor Environment Box & Component -->
  <rect x="250" y="250" width="245" height="140" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="320" y1="180" x2="320" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="300" y1="290" x2="340" y2="290" stroke="#c0392b" stroke-width="3"/>
  <line x1="300" y1="302" x2="340" y2="302" stroke="#c0392b" stroke-width="3"/>
  <line x1="320" y1="302" x2="320" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Ground at Cp -->
  <line x1="308" y1="415" x2="332" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="312" y1="420" x2="328" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="316" y1="425" x2="324" y2="425" stroke="#1a1a1a" stroke-width="1"/>

  <text x="355" y="272" font-size="12" font-weight="bold" fill="#c0392b">Паразитна ємність Cp</text>
  <text x="355" y="296" font-size="12" font-weight="bold" fill="#c0392b">Cp ≈ 1–10 pF</text>
  <text x="355" y="314" font-size="12" fill="#6b7280">(Cp &gt;&gt; Cs)</text>
  <text x="355" y="332" font-size="12" fill="#6b7280">Cwire + Cpad + Cgate</text>

  <!-- Output Signal Line & Node -->
  <line x1="320" y1="180" x2="440" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="440" cy="180" r="4" fill="#2457d6"/>
  <text x="450" y="172" font-size="14" font-weight="bold" fill="#2457d6">Vout</text>
  <text x="450" y="190" font-size="12" fill="#6b7280">(до схеми)</text>

  <!-- Charge Shunting Arrow & Annotation -->
  <path d="M 335 188 Q 380 210 355 246" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="385" y="212" font-size="12" font-weight="bold" fill="#c0392b">Витік заряду</text>
  <text x="385" y="228" font-size="12" fill="#c0392b">(шунтування)</text>

  <!-- Right Panel: Mathematical Analysis & Solution -->
  <rect x="525" y="80" width="405" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="545" y="106" font-size="14" font-weight="bold" fill="#1a1a1a">Аналіз згасання сигналу та розв'язок</text>

  <!-- Card 1: Formula -->
  <rect x="540" y="120" width="375" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="555" y="138" font-size="12" font-weight="bold" fill="#6b7280">Передавальна функція дільника:</text>
  <text x="727" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Vout = Vexc · [ Cs / (Cs + Cp) ]</text>
  <text x="727" y="188" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔVout ≈ Vexc · [ ΔC / (C0 + Cp) ]</text>

  <!-- Card 2: Problem Effect -->
  <rect x="540" y="215" width="375" height="105" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="555" y="234" font-size="13" font-weight="bold" fill="#c0392b">Вплив паразитної ємності Cp:</text>
  <text x="555" y="256" font-size="12" fill="#1a1a1a">• Оскільки Cp (1–10 pF) &gt;&gt; C0 (0.1–1 pF) &gt;&gt; ΔC</text>
  <text x="555" y="278" font-size="12" font-weight="bold" fill="#c0392b">• Сигнал згасає у (1 + Cp/C0) разів — втрата в 10–100×</text>
  <text x="555" y="300" font-size="12" fill="#1a1a1a">• Падають відношення сигнал/шум (SNR) та чутливість</text>

  <!-- Card 3: Solution -->
  <rect x="540" y="330" width="375" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="555" y="350" font-size="13" font-weight="bold" fill="#27ae60">Розв'язок: Підсилювач заряду (Charge Amp)</text>
  <text x="555" y="372" font-size="12" fill="#1a1a1a">• Використання віртуального заземлення (VX ≈ 0 В)</text>
  <text x="555" y="394" font-size="12" font-weight="bold" fill="#27ae60">• Напруга на Cp = 0 В — паразитний струм = 0!</text>
  <text x="555" y="416" font-size="12" fill="#1a1a1a">• Сигнал не залежить від Cp: Vout = -Vexc · (ΔC / Cf)</text>
</svg>
