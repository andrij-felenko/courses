<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-start-blue" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-start-green" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-start-red" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-start-gray" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>

    <!-- Substrate Anchor Hatching -->
    <pattern id="anchor-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія та режими роботи MEMS гребінчастих електродів (Comb Drive)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Диференціальна схема: зміна міжелектродного зазору (Δd) проти зміни площі перекриття (ΔA)</text>

  <!-- ==================== PANEL 1: GAP-CLOSING MODE (Δd) ==================== -->
  <rect x="25" y="65" width="445" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Header Box -->
  <rect x="35" y="75" width="425" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="93" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Поперечний рух: Зміна зазору (Δd)</text>
  <text x="247" y="109" font-size="12" fill="#6b7280" text-anchor="middle">Рух перпендикулярно пальцям (dx ⊥ пальцям)</text>

  <!-- Panel 1 Stator Anchors & Buses -->
  <rect x="55" y="125" width="80" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="55" y="125" width="80" height="20" rx="3" fill="url(#anchor-hatch)" opacity="0.3"/>
  <text x="95" y="139" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Електрод C₁</text>
  <line x1="95" y1="145" x2="95" y2="155" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="95" y1="155" x2="200" y2="155" stroke="#27ae60" stroke-width="1.5"/>

  <rect x="365" y="125" width="80" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="365" y="125" width="80" height="20" rx="3" fill="url(#anchor-hatch)" opacity="0.3"/>
  <text x="405" y="139" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Електрод C₂</text>
  <line x1="405" y1="145" x2="405" y2="155" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="245" y1="155" x2="405" y2="155" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Panel 1 Formula Labels Above Fingers -->
  <text x="184.5" y="146" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">d₁ = d₀ - dx</text>
  <text x="260" y="146" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">d₂ = d₀ + dx</text>

  <!-- Panel 1 Comb Fingers -->
  <!-- Stator C1 Finger (Green) -->
  <rect x="155" y="155" width="14" height="70" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Proof Mass Finger (Blue) -->
  <rect x="200" y="165" width="14" height="65" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Stator C2 Finger (Red) -->
  <rect x="245" y="155" width="14" height="70" rx="1" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Proof Mass Trunk Bar -->
  <rect x="115" y="230" width="270" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="243" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рухома маса (Proof Mass)</text>

  <!-- Mass Anchors & Suspension Springs -->
  <!-- Left Suspension -->
  <text x="57.5" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>
  <rect x="40" y="222" width="35" height="26" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="40" y="222" width="35" height="26" rx="3" fill="url(#anchor-hatch)" opacity="0.4"/>
  <path d="M 75,235 L 83,225 L 91,245 L 99,225 L 107,245 L 115,235" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Right Suspension -->
  <text x="442.5" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>
  <rect x="425" y="222" width="35" height="26" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="425" y="222" width="35" height="26" rx="3" fill="url(#anchor-hatch)" opacity="0.4"/>
  <path d="M 385,235 L 393,225 L 401,245 L 409,225 L 417,245 L 425,235" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Panel 1 Annotations & Callouts -->
  <!-- Displacement dx -->
  <line x1="220" y1="260" x2="280" y2="260" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-start-blue)" marker-end="url(#arr-blue)"/>
  <text x="250" y="275" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зсув ±dx</text>

  <!-- Gap Callout 1 (d1) -->
  <line x1="171" y1="195" x2="198" y2="195" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-green)"/>
  <text x="184.5" y="188" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">d₁</text>

  <!-- Gap Callout 2 (d2) -->
  <line x1="216" y1="195" x2="243" y2="195" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
  <text x="229.5" y="188" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">d₂</text>

  <!-- Overlap L0 Callout -->
  <line x1="259" y1="165" x2="302" y2="165" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="259" y1="225" x2="302" y2="225" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="295" y1="168" x2="295" y2="222" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-start-gray)" marker-end="url(#arr-gray)"/>
  <text x="308" y="199" font-size="12" fill="#6b7280" text-anchor="start">L₀ = const</text>

  <!-- Panel 1 Card 1: Formulations -->
  <rect x="35" y="285" width="425" height="112" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="303" font-size="12" font-weight="bold" fill="#1a1a1a">Формули ємності диференціальної пари:</text>
  <text x="48" y="324" font-size="13" fill="#1a1a1a">C₁ = ε₀·A / (d₀ - dx),   C₂ = ε₀·A / (d₀ + dx)</text>
  <text x="48" y="346" font-size="13" font-weight="bold" fill="#2457d6">ΔC = C₁ - C₂ ≈ 2·C₀·(dx / d₀)   [при dx ≪ d₀]</text>
  <text x="48" y="367" font-size="12" fill="#6b7280">Чутливість: S = ∂C/∂x ∝ 1 / d₀²  (зворотно-квадратична)</text>
  <text x="48" y="386" font-size="12" fill="#6b7280">де A = h·L₀ — площа перекриття електродів</text>

  <!-- Panel 1 Card 2: Features & Limits -->
  <rect x="35" y="407" width="425" height="118" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="425" font-size="12" font-weight="bold" fill="#1a1a1a">Властивості та обмеження режиму Δd:</text>
  <text x="48" y="445" font-size="12" fill="#27ae60">✔ Максимальна чутливість до малих зсувів</text>
  <text x="48" y="465" font-size="12" fill="#c0392b">⚠ Нелінійність характеристик при зростанні dx</text>
  <text x="48" y="485" font-size="12" fill="#c0392b">⚠ Ризик Pull-in (електростатичне злипання при dx ≥ d₀/3)</text>
  <text x="48" y="505" font-size="12" fill="#6b7280">ℹ Використання: високочутливі акселерометри та Z-давачі</text>


  <!-- ==================== PANEL 2: AREA-CHANGE MODE (ΔA) ==================== -->
  <rect x="490" y="65" width="445" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Header Box -->
  <rect x="500" y="75" width="425" height="42" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="93" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Поздовжній рух: Зміна площі (ΔA)</text>
  <text x="712.5" y="109" font-size="12" fill="#6b7280" text-anchor="middle">Рух паралельно пальцям (dy ∥ пальцям)</text>

  <!-- Panel 2 Stator Anchors & Buses -->
  <rect x="520" y="125" width="80" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="520" y="125" width="80" height="20" rx="3" fill="url(#anchor-hatch)" opacity="0.3"/>
  <text x="560" y="139" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Електрод C₁</text>
  <line x1="560" y1="145" x2="560" y2="155" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="560" y1="155" x2="665" y2="155" stroke="#27ae60" stroke-width="1.5"/>

  <rect x="825" y="125" width="80" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="825" y="125" width="80" height="20" rx="3" fill="url(#anchor-hatch)" opacity="0.3"/>
  <text x="865" y="139" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Електрод C₂</text>
  <line x1="865" y1="145" x2="865" y2="155" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="760" y1="155" x2="865" y2="155" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Panel 2 Label Above Fingers -->
  <text x="649.5" y="146" font-size="12" fill="#6b7280" text-anchor="middle">d₀ = const</text>

  <!-- Panel 2 Center Mass Suspension Anchor (Vertical Spring) -->
  <text x="712.5" y="113" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>
  <rect x="690" y="118" width="45" height="22" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="690" y="118" width="45" height="22" rx="3" fill="url(#anchor-hatch)" opacity="0.4"/>
  <path d="M 712.5,140 L 704.5,152 L 720.5,167 L 704.5,182 L 720.5,197 L 704.5,212 L 712.5,230" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Panel 2 Comb Fingers -->
  <!-- Stator C1 Finger 1 (Green) -->
  <rect x="620" y="155" width="14" height="55" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Proof Mass Finger 1 (Blue) -->
  <rect x="665" y="175" width="14" height="55" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Stator C2 Finger (Red) -->
  <rect x="745" y="155" width="14" height="55" rx="1" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Proof Mass Finger 2 (Blue) -->
  <rect x="790" y="175" width="14" height="55" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Proof Mass Trunk Bar -->
  <rect x="580" y="230" width="265" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712.5" y="243" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рухома маса (Proof Mass)</text>

  <!-- Panel 2 Annotations & Callouts -->
  <!-- Displacement dy -->
  <line x1="865" y1="210" x2="865" y2="260" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-start-blue)" marker-end="url(#arr-blue)"/>
  <text x="875" y="239" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Зсув ±dy</text>

  <!-- Gap Callout (d0) -->
  <line x1="636" y1="195" x2="663" y2="195" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-start-gray)" marker-end="url(#arr-gray)"/>
  <text x="649.5" y="188" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">d₀</text>

  <!-- Overlap Callout L(y) -->
  <line x1="634" y1="175" x2="830" y2="175" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="634" y1="210" x2="830" y2="210" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="822" y1="178" x2="822" y2="207" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-start-blue)" marker-end="url(#arr-blue)"/>
  <text x="830" y="196" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">L(y) = L₀ ± dy</text>

  <!-- Panel 2 Card 1: Formulations -->
  <rect x="500" y="285" width="425" height="112" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="513" y="303" font-size="12" font-weight="bold" fill="#1a1a1a">Формули ємності диференціальної пари:</text>
  <text x="513" y="324" font-size="13" fill="#1a1a1a">C(y) = ε₀·h · (L₀ ± dy) / d₀</text>
  <text x="513" y="346" font-size="13" font-weight="bold" fill="#27ae60">ΔC = (ε₀·h / d₀) · dy   [суворо лінійна функція]</text>
  <text x="513" y="367" font-size="12" fill="#6b7280">Чутливість: S = ∂C/∂y = ε₀·h / d₀ = const</text>
  <text x="513" y="386" font-size="12" fill="#6b7280">де h — товщина структури (глибина прошарку)</text>

  <!-- Panel 2 Card 2: Features & Advantages -->
  <rect x="500" y="407" width="425" height="118" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="513" y="425" font-size="12" font-weight="bold" fill="#1a1a1a">Властивості та переваги режиму ΔA:</text>
  <text x="513" y="445" font-size="12" fill="#27ae60">✔ Сувора лінійність перетворення у всьому діапазоні</text>
  <text x="513" y="465" font-size="12" fill="#27ae60">✔ Відсутність ризику Pull-in ефекту по осі вимірювання</text>
  <text x="513" y="485" font-size="12" fill="#6b7280">ℹ Постійний зазор d₀ мінімізує squeeze-film демпфування</text>
  <text x="513" y="505" font-size="12" fill="#6b7280">ℹ Використання: гіроскопи, датчики великих переміщень</text>
</svg>
