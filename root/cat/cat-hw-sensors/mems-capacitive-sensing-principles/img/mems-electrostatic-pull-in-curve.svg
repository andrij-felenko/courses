<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions -->
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>

    <!-- Ground Pattern for MEMS Top Plate Base -->
    <pattern id="ground-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9ca3af" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Електростатична нестабільність та ефект схлопування (Pull-in) у MEMS</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">При x &gt; d₀/3 електростатична сила зростає швидше за пружну, спричиняючи незворотний колапс електродів</text>

  <!-- LEFT PANEL: Force vs Displacement Plot -->
  <rect x="30" y="75" width="530" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel Title -->
  <text x="295" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Баланс пружної та електростатичної сил F(x)</text>

  <!-- Region Badges -->
  <rect x="90" y="114" width="240" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="210" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Стійка область (x &lt; d₀/3)</text>

  <rect x="330" y="114" width="120" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="390" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Нестійка область</text>

  <!-- Plot Background Shading -->
  <rect x="90" y="145" width="240" height="285" fill="#e9f7ef" opacity="0.4"/>
  <rect x="330" y="145" width="120" height="285" fill="#fdecea" opacity="0.4"/>

  <!-- Grid Lines -->
  <line x1="90" y1="360" x2="450" y2="360" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="90" y1="290" x2="450" y2="290" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="90" y1="220" x2="450" y2="220" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="170" y1="145" x2="170" y2="430" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="250" y1="145" x2="250" y2="430" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="410" y1="145" x2="410" y2="430" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- Critical Threshold Line (x_crit = d0/3) -->
  <line x1="330" y1="145" x2="330" y2="430" stroke="#c0392b" stroke-dasharray="5,4" stroke-width="1.5"/>

  <!-- Axes -->
  <!-- X-Axis -->
  <line x1="80" y1="430" x2="475" y2="430" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <!-- Y-Axis -->
  <line x1="90" y1="438" x2="90" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- Axis Titles -->
  <text x="100" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Сила F [Н]</text>
  <text x="270" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Зсув електрода x (відносно початкового зазору d₀)</text>

  <!-- X-Axis Ticks & Labels -->
  <line x1="90" y1="430" x2="90" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="450" text-anchor="middle" font-size="12" fill="#1a1a1a">0</text>

  <line x1="330" y1="430" x2="330" y2="438" stroke="#c0392b" stroke-width="1.5"/>
  <text x="330" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">x_crit = d₀/3 (33.3%)</text>

  <line x1="450" y1="430" x2="450" y2="436" stroke="#6b7280" stroke-width="1.5"/>
  <text x="445" y="450" text-anchor="middle" font-size="12" fill="#6b7280">0.5 d₀ (50%)</text>

  <!-- Curves -->
  <!-- 1. Mechanical Restoring Force F_mech = k*x (Black straight line) -->
  <path d="M 90,430 L 450,190" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- 2. Electrostatic Force F_el for V < V_pi (Green curve) -->
  <path d="M 90,395 C 190,385 250,370 330,340 C 380,320 410,305 450,280" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- 3. Electrostatic Force F_el for V = V_pi (Blue curve - Tangent) -->
  <path d="M 90,360 C 190,342 250,325 330,270 C 380,235 410,200 450,165" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 4. Electrostatic Force F_el for V > V_pi (Red curve - Unstable) -->
  <path d="M 90,320 C 180,290 250,250 330,185 C 360,165 385,153 400,150" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Curve Labels -->
  <text x="458" y="194" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">F_mech = k·x</text>
  <text x="458" y="284" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">F_el (V &lt; V_pi)</text>
  <text x="458" y="169" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">F_el (V = V_pi)</text>
  <text x="405" y="154" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">F_el (V &gt; V_pi)</text>

  <!-- Equilibrium Points Markers & Annotations -->
  <!-- Stable Equilibrium Point (Green dot at V < V_pi intersection) -->
  <circle cx="170" cy="377" r="5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <line x1="170" y1="377" x2="195" y2="390" stroke="#27ae60" stroke-width="1.2"/>
  <text x="200" y="395" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Стійка рівновага</text>

  <!-- Pull-In Tangent Point (Blue dot at V = V_pi) -->
  <circle cx="330" cy="270" r="6" fill="#2457d6" stroke="white" stroke-width="2"/>

  <!-- Callout Box for Pull-in Point -->
  <line x1="290" y1="199" x2="324" y2="264" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="135" y="155" width="155" height="44" rx="5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="212.5" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Точка Pull-in (V = V_pi)</text>
  <text x="212.5" y="190" text-anchor="middle" font-size="12" fill="#1a1a1a">dF_el/dx = dF_mech/dx = k</text>


  <!-- RIGHT PANEL: MEMS Schematic & Formula Summary -->

  <!-- TOP RIGHT BOX: MEMS Structural Schematic -->
  <rect x="575" y="75" width="355" height="232" rx="8" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="752.5" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схема електродного вузла MEMS</text>

  <!-- Top Ground Base (Hatched pattern) -->
  <rect x="630" y="112" width="245" height="10" fill="url(#ground-hatch)" stroke="#9ca3af" stroke-width="1"/>
  <line x1="630" y1="122" x2="875" y2="122" stroke="#6b7280" stroke-width="2"/>

  <!-- Fixed Top Electrode -->
  <rect x="630" y="122" width="245" height="18" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="752.5" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Нерухомий електрод</text>

  <!-- Movable Displaced Electrode (at x > 0) -->
  <rect x="630" y="160" width="245" height="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="752.5" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Рухома маса (Напруга V)</text>

  <!-- Rest position indicator (Dashed outline for x = 0) -->
  <rect x="630" y="186" width="245" height="18" fill="none" stroke="#9ca3af" stroke-dasharray="4,3" stroke-width="1"/>
  <text x="752.5" y="199" text-anchor="middle" font-size="12" fill="#9ca3af">Початковий стан (x = 0)</text>

  <!-- Dimension line d0 (Initial Gap) -->
  <line x1="605" y1="140" x2="605" y2="204" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <text x="596" y="176" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">d₀</text>

  <!-- Dimension line x (Displacement arrow) -->
  <line x1="892" y1="195" x2="892" y2="168" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="900" y="186" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">зсув x</text>

  <!-- Springs connecting movable plate to base -->
  <!-- Left Spring -->
  <path d="M 660,178 L 660,200 L 653,205 L 667,213 L 653,221 L 667,229 L 660,234 L 660,248" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Right Spring -->
  <path d="M 845,178 L 845,200 L 838,205 L 852,213 L 838,221 L 852,229 L 845,234 L 845,248" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Substrate Base Line -->
  <line x1="630" y1="248" x2="875" y2="248" stroke="#6b7280" stroke-width="2"/>
  <rect x="630" y="248" width="245" height="8" fill="url(#ground-hatch)" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="752.5" y="272" text-anchor="middle" font-size="12" fill="#6b7280">Пружний підвіс маси (Жорсткість k)</text>

  <!-- Force Vectors on Movable Plate -->
  <!-- F_el Arrow (Pointing UP) -->
  <line x1="645" y1="160" x2="645" y2="142" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="645" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">F_el</text>

  <!-- F_mech Arrow (Pointing DOWN) -->
  <line x1="860" y1="178" x2="860" y2="198" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="860" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">F_mech</text>


  <!-- BOTTOM RIGHT BOX: Physics & Formula Summary -->
  <rect x="575" y="320" width="355" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="752.5" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фізико-математичний підсумок</text>

  <!-- Box 1: Critical Displacement -->
  <rect x="587" y="350" width="331" height="44" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="752.5" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Граничний стійкий зсув:  x_crit = d₀ / 3  (≈ 33.3%)</text>
  <text x="752.5" y="383" text-anchor="middle" font-size="12" fill="#1e7e34">Максимальне безпечне відносне відхилення електрода</text>

  <!-- Box 2: Pull-in Voltage Formula -->
  <rect x="587" y="406" width="331" height="48" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="752.5" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Напруга схлопування (Pull-in Voltage):</text>
  <text x="752.5" y="441" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_pi = √[ (8 · k · d₀³) / (27 · ε₀ · A) ]</text>

  <!-- Box 3: Practical Design Limit -->
  <rect x="587" y="466" width="331" height="42" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="752.5" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Практична межа робочого діапазону:</text>
  <text x="752.5" y="498" text-anchor="middle" font-size="12" fill="#962d22">Для лінійності та запасу стійкості обирають x &lt; 0.2 · d₀</text>

</svg>
