<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паразитні ємності MEMS та активне екранування (Guarding)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Активний буфер утримує V_guard = V_sense, усуваючи витік струму через паразитну ємність</text>

  <!-- LEFT PANEL: Without Shielding -->
  <rect x="30" y="75" width="435" height="445" rx="8" fill="#fcf8f8" stroke="#f5c6cb" stroke-width="1.5"/>
  <rect x="45" y="87" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="108" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Без екранування: витік струму через C_p</text>

  <!-- MEMS Sensor (Left) -->
  <rect x="55" y="140" width="100" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="105" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MEMS Сенсор</text>
  <text x="105" y="190" font-size="12" fill="#6b7280" text-anchor="middle">C_s (~fF)</text>

  <!-- Input arrow (Left) -->
  <line x1="22" y1="180" x2="53" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="37" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">V_in</text>

  <!-- Sense Trace (Left) -->
  <line x1="155" y1="180" x2="330" y2="180" stroke="#2457d6" stroke-width="3"/>
  <circle cx="250" cy="180" r="4" fill="#2457d6"/>
  <text x="250" y="160" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол V_sense</text>

  <!-- Front-end AFE (Left) -->
  <rect x="330" y="140" width="115" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="387" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фронтенд AFE</text>
  <text x="387" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Зарядовий підс.</text>
  <text x="387" y="203" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_sig (зменшений)</text>

  <!-- Parasitic Capacitance Cp (Left) -->
  <line x1="250" y1="180" x2="250" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Capacitor Cp symbol -->
  <line x1="240" y1="230" x2="260" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="238" x2="260" y2="238" stroke="#1a1a1a" stroke-width="2"/>
  <text x="268" y="238" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">C_p (~1-10 pF)</text>
  <line x1="250" y1="238" x2="250" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground (Left) -->
  <line x1="238" y1="295" x2="262" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="242" y1="300" x2="258" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="246" y1="305" x2="254" y2="305" stroke="#1a1a1a" stroke-width="1"/>
  <text x="250" y="320" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Leakage Current Arrow -->
  <path d="M 235,190 L 235,280" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="228" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Витік i_p</text>

  <!-- External Interference Stray Source -->
  <rect x="55" y="260" width="80" height="45" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="95" y="278" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Завади V_n</text>
  <text x="95" y="293" font-size="12" fill="#c0392b" text-anchor="middle">E-поле</text>
  <!-- Stray Capacitor C_stray -->
  <path d="M 135,280 L 160,280 L 160,238" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="152" y1="238" x2="168" y2="238" stroke="#c0392b" stroke-width="2"/>
  <line x1="152" y1="230" x2="168" y2="230" stroke="#c0392b" stroke-width="2"/>
  <line x1="160" y1="230" x2="160" y2="180" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <text x="172" y="238" font-size="12" fill="#c0392b" text-anchor="start">C_stray</text>

  <!-- Panel 1 Summary Card -->
  <rect x="45" y="345" width="405" height="160" rx="6" fill="#fdecea" stroke="#f5c6cb"/>
  <text x="60" y="368" font-size="13" font-weight="bold" fill="#c0392b">Проблема звичайного підключення:</text>
  <text x="60" y="392" font-size="12" fill="#1a1a1a">• C_p &gt;&gt; C_s: паразитна ємність більша у 100–1000 разів</text>
  <text x="60" y="414" font-size="12" fill="#1a1a1a">• Шунтування сигналу: більшість I_sig іде в GND через C_p</text>
  <text x="60" y="436" font-size="12" fill="#1a1a1a">• Наводки: зовнішнє E-поле наводить струм через C_stray</text>
  <text x="60" y="458" font-size="12" fill="#1a1a1a">• Дрейф: нестабільність C_p від температури спотворює нуль</text>
  <text x="60" y="484" font-size="12" font-weight="bold" fill="#c0392b">• Результат: різке падіння чутливості та SNR</text>

  <!-- RIGHT PANEL: With Active Guarding -->
  <rect x="495" y="75" width="435" height="445" rx="8" fill="#f6fbf8" stroke="#c3e6cb" stroke-width="1.5"/>
  <rect x="510" y="87" width="405" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="108" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">З активним екрануванням (Active Guarding)</text>

  <!-- MEMS Sensor (Right) -->
  <rect x="515" y="140" width="100" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="565" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MEMS Сенсор</text>
  <text x="565" y="190" font-size="12" fill="#6b7280" text-anchor="middle">C_s (~fF)</text>

  <!-- Input arrow (Right) -->
  <line x1="485" y1="180" x2="513" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="499" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">V_in</text>

  <!-- Guard Shield Box Envelope -->
  <rect x="630" y="162" width="150" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="705" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активний екран (Guard Shield)</text>

  <!-- Central Sense Trace (Right) -->
  <line x1="615" y1="180" x2="805" y2="180" stroke="#2457d6" stroke-width="3"/>
  <circle cx="740" cy="180" r="4" fill="#2457d6"/>
  <text x="740" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_sense</text>

  <!-- Inner Capacitance Cp_in (between trace and guard) -->
  <text x="640" y="174" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">C_p_in</text>
  <line x1="660" y1="180" x2="660" y2="184" stroke="#27ae60" stroke-width="1"/>
  <line x1="653" y1="184" x2="667" y2="184" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="653" y1="188" x2="667" y2="188" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="660" y1="188" x2="660" y2="198" stroke="#27ae60" stroke-width="1"/>

  <!-- Front-end AFE (Right) -->
  <rect x="805" y="140" width="110" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="860" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фронтенд AFE</text>
  <text x="860" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Зарядовий підс.</text>
  <text x="860" y="203" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">100% I_sig</text>

  <!-- Zero Potential Drop Text -->
  <text x="530" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ΔV = 0 ➔ i_p = 0</text>

  <!-- Guard Buffer (Op-Amp Follower A=1) -->
  <path d="M 740,180 L 740,220 L 645,220 L 645,250 L 670,250" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="670,240 670,280 710,260" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="676" y="254" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="676" y="274" font-size="12" font-weight="bold" fill="#27ae60">-</text>
  <!-- Feedback loop A=1 -->
  <path d="M 710,260 L 725,260 L 725,290 L 645,290 L 645,270 L 670,270" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="690" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер A = 1</text>

  <!-- Buffer Output driving Guard Shield -->
  <line x1="710" y1="260" x2="710" y2="198" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="704" y="215" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">V_guard = V_sense</text>

  <!-- Outer Capacitance Cp_out (Guard to GND) -->
  <line x1="760" y1="198" x2="760" y2="230" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="750" y1="230" x2="770" y2="230" stroke="#6b7280" stroke-width="2"/>
  <line x1="750" y1="238" x2="770" y2="238" stroke="#6b7280" stroke-width="2"/>
  <text x="778" y="242" font-size="12" fill="#6b7280" text-anchor="start">C_p_out (до GND)</text>
  <line x1="760" y1="238" x2="760" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Ground (Right) -->
  <line x1="748" y1="295" x2="772" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="752" y1="300" x2="768" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="756" y1="305" x2="764" y2="305" stroke="#1a1a1a" stroke-width="1"/>
  <text x="760" y="320" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>
  <text x="760" y="335" font-size="12" fill="#27ae60" text-anchor="middle">Струм перезаряду з буфера</text>

  <!-- Panel 2 Summary Card -->
  <rect x="510" y="345" width="405" height="160" rx="6" fill="#e9f7ef" stroke="#c3e6cb"/>
  <text x="525" y="368" font-size="13" font-weight="bold" fill="#27ae60">Фізика та переваги Active Guarding:</text>
  <text x="525" y="392" font-size="12" fill="#1a1a1a">• Нульова різниця потенціалів: ΔV = V_sense - V_guard = 0 В</text>
  <text x="525" y="414" font-size="12" fill="#1a1a1a">• Повне усунення витоку: i_p = C_p_in · (dΔV/dt) = 0 А</text>
  <text x="525" y="436" font-size="12" fill="#1a1a1a">• Екранування завад: екран перехоплює зовнішні E-поля</text>
  <text x="525" y="458" font-size="12" fill="#1a1a1a">• Ізоляція: C_p_out перезаряджається виходом буфера</text>
  <text x="525" y="484" font-size="12" font-weight="bold" fill="#27ae60">• Результат: максимальна чутливість та стабільність нуля</text>
</svg>
