<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad6)"/>

  <!-- Title -->
  <text x="480" y="35" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle">Оптичний бар'єр, кут поля зору (FoV) та захист від паразитних засвічень</text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Правила інтеграції захисного скла та механічне ізолювання приймального і передавального каналів</text>

  <!-- Main Diagram: Cross section of optical sensor assembly -->
  <g transform="translate(60, 85)" filter="url(#shadow6)">
    <rect width="840" height="400" rx="10" fill="#1e293b" stroke="#334155"/>

    <!-- Cover Glass at Top -->
    <rect x="40" y="40" width="760" height="30" rx="4" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="420" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">Захисне скло приладу (Cover Glass, коефіцієнт пропускання &gt; 92% на 940 нм)</text>

    <!-- Air gap indicator -->
    <line x1="40" y1="80" x2="800" y2="80" stroke="#475569" stroke-dasharray="4,4"/>
    <text x="730" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Air gap &lt; 0.5 мм</text>

    <!-- Optical Rubber Gasket / Center Barrier -->
    <rect x="390" y="70" width="60" height="150" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="420" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle" transform="rotate(-90 420 145)">ГУМОВИЙ БАР'ЄР</text>

    <!-- Emitter Cavity (Left) -->
    <rect x="60" y="220" width="300" height="140" rx="6" fill="#111827" stroke="#ef4444"/>
    <text x="210" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">Камера випромінювача (VCSEL)</text>
    <rect x="180" y="270" width="60" height="30" rx="4" fill="#dc2626"/>
    <text x="210" y="290" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">Лазер</text>

    <!-- Emitter Cone / FoV -->
    <path d="M 210 270 L 60 40 L 360 40 Z" fill="#ef4444" fill-opacity="0.12"/>
    <text x="210" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Конус випромінювання ~25°</text>

    <!-- Receiver Cavity (Right) -->
    <rect x="480" y="220" width="300" height="140" rx="6" fill="#111827" stroke="#10b981"/>
    <text x="630" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">Камера приймача (SPAD)</text>
    <rect x="600" y="270" width="60" height="30" rx="4" fill="#047857"/>
    <text x="630" y="290" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">SPAD</text>

    <!-- Receiver Cone / FoV -->
    <path d="M 630 270 L 480 40 L 780 40 Z" fill="#10b981" fill-opacity="0.12"/>
    <text x="630" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Конус прийому (FoV)</text>

    <!-- Overlap / Effective measurement region (Above glass) -->
    <text x="420" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#facc15" text-anchor="middle">Зона перекриття конусів (Ефективна область вимірювання)</text>

    <!-- Critical Integration Rule Badge -->
    <rect x="80" y="325" width="680" height="25" rx="4" fill="#0f172a" stroke="#64748b"/>
    <text x="420" y="342" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Правило монтажу: бар'єр обов'язково повинен щільно притискатися до скла без найменшого оптичного просвіту!</text>
  </g>
</svg>