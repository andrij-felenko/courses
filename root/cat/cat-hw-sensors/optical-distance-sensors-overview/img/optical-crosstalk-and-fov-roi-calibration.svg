<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad4)"/>

  <!-- Title -->
  <text x="480" y="35" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle">Програмування зони інтересу ROI та оптичні завади Crosstalk</text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Керування кутом огляду FoV матриці SPAD та механізм виникнення паразитних перевідбиттів</text>

  <!-- Left: SPAD Matrix ROI Programming (16x16 Grid) -->
  <g transform="translate(60, 85)" filter="url(#shadow4)">
    <rect width="400" height="390" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="200" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Матриця SPAD 16×16 (Програмування ROI)</text>

    <!-- 16x16 Grid representation (outer box 256x256) -->
    <g transform="translate(72, 50)">
      <!-- Outer inactive cells -->
      <rect width="256" height="256" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      
      <!-- Grid lines -->
      <path d="M 0 32 L 256 32 M 0 64 L 256 64 M 0 96 L 256 96 M 0 128 L 256 128 M 0 160 L 256 160 M 0 192 L 256 192 M 0 224 L 256 224
               M 32 0 L 32 256 M 64 0 L 64 256 M 96 0 L 96 256 M 128 0 L 128 256 M 160 0 L 160 256 M 192 0 L 192 256 M 224 0 L 224 256"
            stroke="#1e293b" stroke-width="1"/>

      <!-- Full FoV (27 deg) label -->
      <text x="128" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Повний масив 16×16 (FoV = 27°)</text>

      <!-- Programmed Active ROI (e.g. 8x8 in center, FoV = 15 deg) -->
      <rect x="64" y="64" width="128" height="128" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Inner Active Spot (4x4 minimal ROI) -->
      <rect x="96" y="96" width="64" height="64" fill="#10b981" fill-opacity="0.5" stroke="#34d399" stroke-width="2"/>
      <text x="128" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ROI 4×4</text>
      <text x="128" y="145" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">FoV ≈ 9°</text>
    </g>

    <!-- Legend below grid -->
    <text x="200" y="340" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Зменшення ROI звужує поле зору та уникає завад від стін</text>
    <text x="200" y="365" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">VL53L1_SetROI(dev, &amp;roiConfig);</text>
  </g>

  <!-- Right: Cover Glass Crosstalk Path -->
  <g transform="translate(490, 85)" filter="url(#shadow4)">
    <rect width="410" height="390" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="205" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Фізика оптичного перехресного засвічення</text>

    <!-- Cover Glass -->
    <rect x="40" y="60" width="330" height="35" rx="4" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="205" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">Захисне скло (Cover Glass) t ≈ 1 мм</text>

    <!-- Air gap -->
    <text x="205" y="115" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Повітряний зазор (Air Gap &lt; 0.5 мм)</text>

    <!-- Optical Barrier / Gasket -->
    <rect x="185" y="95" width="40" height="90" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="205" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle" transform="rotate(-90 205 145)">БАР'ЄР</text>

    <!-- Emitter on left -->
    <rect x="50" y="185" width="110" height="40" rx="4" fill="#111827" stroke="#ef4444"/>
    <text x="105" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">VCSEL Лазер</text>

    <!-- Receiver on right -->
    <rect x="250" y="185" width="110" height="40" rx="4" fill="#111827" stroke="#10b981"/>
    <text x="305" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">SPAD Матриця</text>

    <!-- Ray Paths -->
    <!-- Valid Ray Out -->
    <line x1="105" y1="185" x2="105" y2="40" stroke="#ef4444" stroke-width="2"/>
    <!-- Crosstalk Ray (refracted and reflected inside glass) -->
    <path d="M 105 185 L 125 75 L 200 65 L 280 85 L 305 185" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3" fill="none"/>
    <circle cx="200" cy="65" r="4" fill="#f59e0b"/>
    <text x="205" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Внутрішнє відбиття</text>

    <!-- Explanatory text -->
    <rect x="30" y="250" width="350" height="115" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="45" y="272" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Наслідки Crosstalk для далекоміра:</text>
    <text x="45" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Паразитний спалах t₁ повертається миттєво (d ≈ 0).</text>
    <text x="45" y="310" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Далекомір сильно занижує виміряну відстань!</text>
    <text x="45" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Обов'язкова наявність гумового ущільнювача (gasket).</text>
    <text x="45" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#facc15">• Калібрування: віднімання фонової матриці Crosstalk.</text>
  </g>
</svg>