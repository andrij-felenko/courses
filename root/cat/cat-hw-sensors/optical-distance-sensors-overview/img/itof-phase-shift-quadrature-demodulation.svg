<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad5)"/>

  <!-- Title -->
  <text x="480" y="35" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle">Непрямий час польоту iToF (CW): Фазовий зсув та 4-фазна демодуляція</text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Вимірювання зсуву фази неперервно-модульованого сигналу інтегральними вибірками C₀, C₁, C₂, C₃</text>

  <!-- Left: Modulated Waveforms (Tx vs Rx) -->
  <g transform="translate(50, 85)" filter="url(#shadow5)">
    <rect width="470" height="390" rx="8" fill="#111827" stroke="#334155"/>
    <text x="235" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Хвильові форми та 4 квадратурні вибірки</text>

    <!-- Signal 1: Tx (Emitter Modulation, e.g. 50 MHz) -->
    <text x="30" y="65" font-family="monospace" font-size="12" font-weight="700" fill="#ef4444">Tx: Модуляція випромінювача (0°)</text>
    <path d="M 40 100 Q 80 50 120 100 T 200 100 T 280 100 T 360 100 T 440 100" stroke="#ef4444" stroke-width="2.5" fill="none"/>

    <!-- Signal 2: Rx (Received Reflected Light with phase shift phi) -->
    <text x="30" y="155" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">Rx: Відбитий сигнал (зсув фази φ)</text>
    <path d="M 40 190 Q 60 190 80 190 Q 120 140 160 190 T 240 190 T 320 190 T 400 190" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

    <!-- Phase shift marker phi -->
    <line x1="80" y1="75" x2="80" y2="210" stroke="#94a3b8" stroke-dasharray="2,2"/>
    <line x1="120" y1="165" x2="120" y2="210" stroke="#94a3b8" stroke-dasharray="2,2"/>
    <line x1="80" y1="200" x2="120" y2="200" stroke="#facc15" stroke-width="2"/>
    <text x="100" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#facc15" text-anchor="middle">Фаза φ</text>

    <!-- 4 Sampling Windows: C0, C1, C2, C3 -->
    <rect x="40" y="240" width="95" height="110" rx="4" fill="#1e293b" stroke="#60a5fa"/>
    <text x="87" y="260" font-family="monospace" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">C₀ (0°)</text>
    <text x="87" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Накопичення</text>
    <text x="87" y="300" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">заряду 0°..90°</text>

    <rect x="145" y="240" width="95" height="110" rx="4" fill="#1e293b" stroke="#34d399"/>
    <text x="192" y="260" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">C₁ (90°)</text>
    <text x="192" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Накопичення</text>
    <text x="192" y="300" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">заряду 90°..180°</text>

    <rect x="250" y="240" width="95" height="110" rx="4" fill="#1e293b" stroke="#f59e0b"/>
    <text x="297" y="260" font-family="monospace" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">C₂ (180°)</text>
    <text x="297" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Накопичення</text>
    <text x="297" y="300" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">заряду 180°..270°</text>

    <rect x="355" y="240" width="95" height="110" rx="4" fill="#1e293b" stroke="#ec4899"/>
    <text x="402" y="260" font-family="monospace" font-size="11" font-weight="700" fill="#fbcfe8" text-anchor="middle">C₃ (270°)</text>
    <text x="402" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Накопичення</text>
    <text x="402" y="300" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">заряду 270°..360°</text>
  </g>

  <!-- Right: Mathematical Formulas & Comparison -->
  <g transform="translate(540, 85)" filter="url(#shadow5)">
    <rect width="370" height="390" rx="8" fill="#111827" stroke="#334155"/>
    <text x="185" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Математика iToF демодуляції</text>

    <rect x="15" y="45" width="340" height="95" rx="6" fill="#1e293b" stroke="#f59e0b"/>
    <text x="30" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#facc15">1. Розрахунок фазового зсуву φ:</text>
    <rect x="30" y="78" width="310" height="45" rx="4" fill="#0f172a"/>
    <text x="185" y="106" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">φ = atan2(C₁ - C₃, C₀ - C₂)</text>

    <rect x="15" y="150" width="340" height="95" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="30" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">2. Розрахунок відстані d:</text>
    <rect x="30" y="182" width="310" height="45" rx="4" fill="#0f172a"/>
    <text x="185" y="210" font-family="monospace" font-size="13" font-weight="700" fill="#facc15" text-anchor="middle">d = (c · φ) / (4 · π · f_mod)</text>

    <rect x="15" y="255" width="340" height="115" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="30" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">3. Переваги та обмеження iToF:</text>
    <text x="30" y="298" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Не потребує пікосекундних таймерів TDC.</text>
    <text x="30" y="316" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">• Легко масштабується на 2D-матриці (ToF-камери).</text>
    <text x="30" y="334" font-family="system-ui, sans-serif" font-size="10" fill="#fca5a5">• Проблема фазової неоднозначності (d &gt; c / 2f_mod).</text>
    <text x="30" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Чутливий до завад від суміжних камер (Multi-path).</text>
  </g>
</svg>