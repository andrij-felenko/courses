<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів DVP OV2640</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Передача байт даних D[7:0] синхронізується тактом PCLK за активного рівня VSYNC та HREF</text>

  <!-- Main Container Panel -->
  <rect x="35" y="75" width="890" height="410" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Vertical Timing Grid Guidelines -->
  <line x1="260" y1="90" x2="260" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="820" y1="90" x2="820" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Signal 1: VSYNC -->
  <g>
    <!-- Badge Box -->
    <rect x="50" y="105" width="110" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">VSYNC</text>
    <text x="105" y="137" text-anchor="middle" font-size="11" fill="#6b7280">Кадровий синхро</text>

    <!-- Waveform -->
    <path d="M 180,110 L 900,110" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>

    <!-- Annotation -->
    <text x="540" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">VSYNC = 1 (Активний кадр)</text>
  </g>

  <!-- Signal 2: HREF -->
  <g>
    <!-- Badge Box -->
    <rect x="50" y="180" width="110" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">HREF</text>
    <text x="105" y="212" text-anchor="middle" font-size="11" fill="#6b7280">Рядковий синхро</text>

    <!-- Waveform -->
    <path d="M 180,215 L 260,215 L 260,185 L 820,185 L 820,215 L 900,215" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>

    <!-- Annotations -->
    <text x="540" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HREF = 1 (Активна передача рядка пікселів)</text>
    <text x="220" y="232" text-anchor="middle" font-size="11" fill="#6b7280">HBLANK</text>
    <text x="860" y="232" text-anchor="middle" font-size="11" fill="#6b7280">HBLANK</text>
  </g>

  <!-- Signal 3: PCLK -->
  <g>
    <!-- Badge Box -->
    <rect x="50" y="255" width="110" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">PCLK</text>
    <text x="105" y="287" text-anchor="middle" font-size="11" fill="#6b7280">Тактовий сигнал</text>

    <!-- Waveform -->
    <path d="M 180,290 L 195,290 L 195,260 L 227.5,260 L 227.5,290 L 260,290 L 260,260 L 292.5,260 L 292.5,290 L 325,290 L 325,260 L 357.5,260 L 357.5,290 L 390,290 L 390,260 L 422.5,260 L 422.5,290 L 455,290 L 455,260 L 487.5,260 L 487.5,290 L 520,290 M 560,290 L 560,260 L 592.5,260 L 592.5,290 L 625,290 L 625,260 L 657.5,260 L 657.5,290 L 690,290 L 690,260 L 722.5,260 L 722.5,290 L 755,290 L 755,260 L 787.5,260 L 787.5,290 L 820,290 L 820,260 L 852.5,260 L 852.5,290 L 885,290 L 885,260 L 900,260" stroke="#1a1a1a" stroke-width="2" fill="none"/>

    <!-- PCLK Break Dots -->
    <text x="540" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">• • •</text>

    <!-- Rising Edge Strobe Markers (Latch points) -->
    <line x1="292.5" y1="290" x2="292.5" y2="252" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
    <polygon points="292.5,247 289.5,254 295.5,254" fill="#27ae60"/>

    <line x1="357.5" y1="290" x2="357.5" y2="252" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
    <polygon points="357.5,247 354.5,254 360.5,254" fill="#27ae60"/>

    <line x1="422.5" y1="290" x2="422.5" y2="252" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
    <polygon points="422.5,247 419.5,254 425.5,254" fill="#27ae60"/>

    <line x1="487.5" y1="290" x2="487.5" y2="252" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
    <polygon points="487.5,247 484.5,254 490.5,254" fill="#27ae60"/>
  </g>

  <!-- Signal 4: D[7:0] -->
  <g>
    <!-- Badge Box -->
    <rect x="50" y="330" width="110" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">D[7:0]</text>
    <text x="105" y="362" text-anchor="middle" font-size="11" fill="#6b7280">Паралельні дані</text>

    <!-- HBLANK Idle Data Lines -->
    <line x1="180" y1="350" x2="260" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="220" y="346" text-anchor="middle" font-size="11" fill="#6b7280">Неактивно</text>

    <line x1="820" y1="350" x2="900" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="860" y="346" text-anchor="middle" font-size="11" fill="#6b7280">Неактивно</text>

    <!-- Byte 1 -->
    <polygon points="260,350 268,335 317,335 325,350 317,365 268,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="292.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт 1</text>
    <text x="292.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">P1 (High)</text>

    <!-- Byte 2 -->
    <polygon points="325,350 333,335 382,335 390,350 382,365 333,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="357.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт 2</text>
    <text x="357.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">P1 (Low)</text>

    <!-- Byte 3 -->
    <polygon points="390,350 398,335 447,335 455,350 447,365 398,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="422.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт 3</text>
    <text x="422.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">P2 (High)</text>

    <!-- Byte 4 -->
    <polygon points="455,350 463,335 512,335 520,350 512,365 463,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="487.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт 4</text>
    <text x="487.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">P2 (Low)</text>

    <!-- Data Bus Break Dots -->
    <text x="540" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">• • •</text>

    <!-- Byte N-3 -->
    <polygon points="560,350 568,335 617,335 625,350 617,365 568,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="592.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт N-3</text>
    <text x="592.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">Pk-1 (H)</text>

    <!-- Byte N-2 -->
    <polygon points="625,350 633,335 682,335 690,350 682,365 633,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="657.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт N-2</text>
    <text x="657.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">Pk-1 (L)</text>

    <!-- Byte N-1 -->
    <polygon points="690,350 698,335 747,335 755,350 747,365 698,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="722.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт N-1</text>
    <text x="722.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">Pk (High)</text>

    <!-- Byte N -->
    <polygon points="755,350 763,335 812,335 820,350 812,365 763,365" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="787.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт N</text>
    <text x="787.5" y="382" text-anchor="middle" font-size="11" fill="#6b7280">Pk (Low)</text>
  </g>

  <!-- Explanatory Cards at Bottom -->
  <g>
    <!-- Card 1: Data Format -->
    <rect x="50" y="410" width="410" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="65" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">Формат передачі 16-бітних пікселів:</text>
    <text x="65" y="446" font-size="11" fill="#6b7280">• RGB565: Байт 1 = R[4:0]+G[5:3], Байт 2 = G[2:0]+B[4:0]</text>
    <text x="65" y="462" font-size="11" fill="#6b7280">• YUV422: Байт 1 = Y₀ (яскравість), Байт 2 = U₀ (колір)</text>

    <!-- Card 2: Latching Rule -->
    <rect x="480" y="410" width="430" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="495" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">Правило зчитування байт даних:</text>
    <text x="495" y="446" font-size="11" fill="#6b7280">• Дані D[7:0] встановлюються за спадом PCLK</text>
    <text x="495" y="462" font-size="11" font-weight="bold" fill="#27ae60">• Фіксація (latch) даних — за фронтом PCLK</text>
  </g>
</svg>
