<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів інтерфейсу DCMI (OV2640)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Дані D[7:0] стробуються за фронтом PIXCLK під час активних рівнів VSYNC та HSYNC (HREF)</text>

  <!-- Main Diagram Panel -->
  <rect x="30" y="68" width="900" height="434" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left-black" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-left-gray" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0 L4,7 L7,0 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Vertical Timing Grid Lines -->
  <line x1="200" y1="92" x2="200" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="840" y1="92" x2="840" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="220" y1="166" x2="220" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="460" y1="166" x2="460" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="540" y1="166" x2="540" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="780" y1="166" x2="780" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Timing Dimension Lines (Top) -->
  <line x1="200" y1="78" x2="200" y2="90" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="840" y1="78" x2="840" y2="90" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="208" y1="84" x2="832" y2="84" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-left-black)" marker-end="url(#arr-black)"/>
  <text x="520" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">t_FRAME (Активний кадр)</text>

  <line x1="910" y1="78" x2="910" y2="90" stroke="#6b7280" stroke-width="1"/>
  <line x1="848" y1="84" x2="902" y2="84" stroke="#6b7280" stroke-width="1.2" marker-start="url(#arr-left-gray)" marker-end="url(#arr-gray)"/>
  <text x="875" y="78" text-anchor="middle" font-size="12" fill="#6b7280">t_VBLANK</text>

  <!-- TRACK 1: VSYNC -->
  <text x="45" y="116" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="45" y="132" text-anchor="start" font-size="12" fill="#6b7280">(кадрова синхр.)</text>
  <path d="M 200,142 L 200,98 L 840,98 L 840,142 Z" fill="#2457d6" fill-opacity="0.05"/>
  <path d="M 165,142 L 200,142 L 200,98 L 840,98 L 840,142 L 910,142" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Timing Dimension Lines for HSYNC -->
  <line x1="220" y1="154" x2="220" y2="166" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="460" y1="154" x2="460" y2="166" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="540" y1="154" x2="540" y2="166" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="780" y1="154" x2="780" y2="166" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="228" y1="160" x2="452" y2="160" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-left-black)" marker-end="url(#arr-black)"/>
  <text x="340" y="152" text-anchor="middle" font-size="12" fill="#1a1a1a">t_LINE (Рядок 1)</text>

  <line x1="468" y1="160" x2="532" y2="160" stroke="#6b7280" stroke-width="1.2" marker-start="url(#arr-left-gray)" marker-end="url(#arr-gray)"/>
  <text x="500" y="152" text-anchor="middle" font-size="12" fill="#6b7280">t_HBLANK</text>

  <line x1="548" y1="160" x2="772" y2="160" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-left-black)" marker-end="url(#arr-black)"/>
  <text x="660" y="152" text-anchor="middle" font-size="12" fill="#1a1a1a">t_LINE (Рядок 2)</text>

  <!-- TRACK 2: HSYNC / HREF -->
  <text x="45" y="198" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">HSYNC / HREF</text>
  <text x="45" y="214" text-anchor="start" font-size="12" fill="#6b7280">(рядкова синхр.)</text>
  <path d="M 220,230 L 220,188 L 460,188 L 460,230 Z" fill="#2457d6" fill-opacity="0.08"/>
  <path d="M 540,230 L 540,188 L 780,188 L 780,230 Z" fill="#2457d6" fill-opacity="0.08"/>
  <path d="M 165,230 L 220,230 L 220,188 L 460,188 L 460,230 L 540,230 L 540,188 L 780,188 L 780,230 L 910,230" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Sampling Edge Callout -->
  <text x="280" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Фронт зчитування D[7:0]</text>
  <line x1="280" y1="254" x2="280" y2="265" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- TRACK 3: PIXCLK -->
  <text x="45" y="286" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">PIXCLK</text>
  <text x="45" y="302" text-anchor="start" font-size="12" fill="#6b7280">(тактування)</text>
  <path d="M 165,308 L 165,272 L 180,272 L 180,308 L 200,308 L 200,272 L 220,272 L 220,308 L 240,308 L 240,272 L 260,272 L 260,308 L 280,308 L 280,272 L 300,272 L 300,308 L 320,308 L 320,272 L 340,272 L 340,308 L 360,308 L 360,272 L 380,272 L 380,308 L 400,308 L 400,272 L 420,272 L 420,308 L 440,308 L 440,272 L 460,272 L 460,308 L 480,308 L 480,272 L 500,272 L 500,308 L 520,308 L 520,272 L 540,272 L 540,308 L 560,308 L 560,272 L 580,272 L 580,308 L 600,308 L 600,272 L 620,272 L 620,308 L 640,308 L 640,272 L 660,272 L 660,308 L 680,308 L 680,272 L 700,272 L 700,308 L 720,308 L 720,272 L 740,272 L 740,308 L 760,308 L 760,272 L 780,272 L 780,308 L 800,308 L 800,272 L 820,272 L 820,308 L 840,308 L 840,272 L 860,272 L 860,308 L 880,308 L 880,272 L 900,272 L 900,308 L 910,308" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Rising Edge Sampling Markers -->
  <line x1="240" y1="272" x2="240" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="280" y1="272" x2="280" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="320" y1="272" x2="320" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="360" y1="272" x2="360" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="400" y1="272" x2="400" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="440" y1="272" x2="440" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>

  <line x1="560" y1="272" x2="560" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="600" y1="272" x2="600" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="640" y1="272" x2="640" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="680" y1="272" x2="680" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="720" y1="272" x2="720" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="760" y1="272" x2="760" y2="355" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- TRACK 4: D[7:0] Data Bus -->
  <text x="45" y="370" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">D[7:0]</text>
  <text x="45" y="386" text-anchor="start" font-size="12" fill="#6b7280">(шина даних)</text>

  <!-- Inactive / High-Z baseline lines -->
  <line x1="165" y1="375" x2="220" y2="375" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="460" y1="375" x2="540" y2="375" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="780" y1="375" x2="910" y2="375" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- HBLANK region text (placed above the High-Z line) -->
  <text x="500" y="344" text-anchor="middle" font-size="12" fill="#6b7280">Неактивно</text>

  <!-- Active Line 1 Data Packets -->
  <polygon points="220,375 226,355 254,355 260,375 254,395 226,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="240" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B1</text>

  <polygon points="260,375 266,355 294,355 300,375 294,395 266,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="280" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B2</text>

  <polygon points="300,375 306,355 334,355 340,375 334,395 306,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B3</text>

  <polygon points="340,375 346,355 374,355 380,375 374,395 346,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B4</text>

  <polygon points="380,375 386,355 414,355 420,375 414,395 386,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="400" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B5</text>

  <polygon points="420,375 426,355 454,355 460,375 454,395 426,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="440" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B6</text>

  <!-- Active Line 2 Data Packets -->
  <polygon points="540,375 546,355 574,355 580,375 574,395 546,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B1</text>

  <polygon points="580,375 586,355 614,355 620,375 614,395 586,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="600" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B2</text>

  <polygon points="620,375 626,355 654,355 660,375 654,395 626,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="640" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B3</text>

  <polygon points="660,375 666,355 694,355 700,375 694,395 666,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="680" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B4</text>

  <polygon points="700,375 706,355 734,355 740,375 734,395 706,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="720" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B5</text>

  <polygon points="740,375 746,355 774,355 780,375 774,395 746,395" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="760" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">B6</text>

  <!-- Summary / Legend Card -->
  <rect x="50" y="415" width="860" height="75" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Column 1: Pixel structure -->
  <text x="70" y="436" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Структура кадру та пікселів:</text>
  <text x="70" y="455" text-anchor="start" font-size="12" fill="#1a1a1a">• 1-й байт (B1, B3): R[4:0]G[5:3] або Y0 / Y1</text>
  <text x="70" y="474" text-anchor="start" font-size="12" fill="#1a1a1a">• 2-й байт (B2, B4): G[2:0]B[4:0] або U0 / V0</text>

  <!-- Column 2: DCMI FIFO rules -->
  <text x="430" y="436" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Логіка зчитування контролером DCMI:</text>
  <text x="430" y="455" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">• Запис у FIFO: тільки при VSYNC = 1 та HSYNC = 1</text>
  <text x="430" y="474" text-anchor="start" font-size="12" fill="#6b7280">• Тактування: кожен байт стробується за фронтом PIXCLK</text>
</svg>
