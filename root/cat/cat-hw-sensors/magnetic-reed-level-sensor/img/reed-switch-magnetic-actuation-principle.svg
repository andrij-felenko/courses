<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Фізичний принцип магнітного замикання геркона (Reed Switch)
  </text>

  <!-- Ліва частина: Розімкнений стан (Магніт далеко) -->
  <g transform="translate(60, 95)">
    <rect width="340" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="170" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#8b949e">
      1. Магніт далеко (НЗ / НР стан)
    </text>
    <text x="170" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">
      Магнітне поле відсутнє, контакти розімкнені
    </text>

    <!-- Скляна колба геркона -->
    <rect x="40" y="120" width="260" height="60" rx="30" fill="#161b22" stroke="#388bfd" stroke-width="2" opacity="0.8"/>
    <text x="170" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#79c0ff">
      Герметична скляна колба (Азот / Вакуум)
    </text>

    <!-- Феромагнітна пластина 1 (ліва) -->
    <line x1="20" y1="150" x2="160" y2="150" stroke="#f0883e" stroke-width="6"/>
    <!-- Пластина 2 (права) з зазором -->
    <line x1="175" y1="135" x2="320" y2="135" stroke="#f0883e" stroke-width="6"/>
    <!-- Зазор -->
    <line x1="160" y1="130" x2="175" y2="130" stroke="#f85149" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="168" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">Зазор 0.1 мм</text>

    <text x="170" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9">
      Пружні пермалоєві пелюстки
    </text>
    <text x="170" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">
      Опір ізоляції R_iz &gt; 10^10 Ом
    </text>
  </g>

  <!-- Права частина: Замкнений стан (Поплавок з магнітом наблизився) -->
  <g transform="translate(450, 95)">
    <rect width="340" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="170" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#3fb950">
      2. Поплавок на рівні геркона
    </text>
    <text x="170" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">
      Намагнічування та взаємне притягання N-S
    </text>

    <!-- Кільцевий магніт поплавка -->
    <rect x="20" y="80" width="300" height="24" rx="4" fill="#da3633" stroke="#f85149" stroke-width="2"/>
    <text x="70" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">МАГНІТ [ N ]</text>
    <text x="220" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">[ S ] МАГНІТ</text>

    <!-- Скляна колба -->
    <rect x="40" y="120" width="260" height="60" rx="30" fill="#161b22" stroke="#388bfd" stroke-width="2"/>

    <!-- Лінії магнітного поля -->
    <path d="M 60,104 C 60,150 160,150 160,150" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 280,104 C 280,150 180,150 180,150" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Зімкнуті контакти -->
    <line x1="20" y1="150" x2="185" y2="150" stroke="#3fb950" stroke-width="6"/>
    <line x1="165" y1="150" x2="320" y2="150" stroke="#3fb950" stroke-width="6"/>

    <!-- Іскра / точка контакту з родієвим покриттям -->
    <circle cx="175" cy="150" r="7" fill="#f2cc60"/>

    <text x="170" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#3fb950">
      Контакт надійно замкнено (R &lt; 0.1 Ом)
    </text>
    <text x="170" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9">
      Покриття контактів: Рутеній (Ru) / Родій (Rh)
    </text>
  </g>
</svg>