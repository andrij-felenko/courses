<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Електрична схема та інтерфейс передавача 4–20 мА / ADC
  </text>

  <!-- Ланцюг резисторів подільника -->
  <g transform="translate(60, 95)">
    <rect width="320" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="160" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">
      Резистивний ланцюг подільника
    </text>

    <!-- Шина живлення VCC -->
    <line x1="60" y1="60" x2="60" y2="290" stroke="#f85149" stroke-width="3"/>
    <text x="60" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f85149">VCC (+5V)</text>

    <!-- Резистори R1..R4 -->
    <rect x="52" y="80" width="16" height="30" fill="#d29922"/>
    <text x="30" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#d29922">100R</text>

    <rect x="52" y="130" width="16" height="30" fill="#d29922"/>
    <text x="30" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#d29922">100R</text>

    <rect x="52" y="180" width="16" height="30" fill="#d29922"/>
    <text x="30" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#d29922">100R</text>

    <rect x="52" y="230" width="16" height="30" fill="#d29922"/>
    <text x="30" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#d29922">100R</text>

    <!-- Спільна шина зчитування сигналу (Wiper bus) -->
    <line x1="220" y1="60" x2="220" y2="290" stroke="#3fb950" stroke-width="3"/>
    <text x="220" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">V_OUT (Сигнал)</text>

    <!-- Геркони, що шунтують вузли -->
    <line x1="60" y1="120" x2="120" y2="120" stroke="#8b949e" stroke-width="2"/>
    <circle cx="130" cy="120" r="4" fill="#58a6ff"/>
    <line x1="140" y1="120" x2="220" y2="120" stroke="#8b949e" stroke-width="2"/>

    <!-- Активний замкнений геркон -->
    <line x1="60" y1="170" x2="120" y2="170" stroke="#3fb950" stroke-width="2"/>
    <line x1="120" y1="170" x2="220" y2="170" stroke="#3fb950" stroke-width="3"/>
    <circle cx="170" cy="170" r="6" fill="#f2cc60"/>
    <text x="170" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f2cc60">Замкнено магнітом</text>

    <line x1="60" y1="220" x2="120" y2="220" stroke="#8b949e" stroke-width="2"/>
    <circle cx="130" cy="220" r="4" fill="#58a6ff"/>
    <line x1="140" y1="220" x2="220" y2="220" stroke="#8b949e" stroke-width="2"/>
  </g>

  <!-- Схема аналогового узла / струмової петлі 4-20 мА -->
  <g transform="translate(430, 95)">
    <rect width="360" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#3fb950">
      Інтерфейс нормування XTR115 / MCU
    </text>

    <!-- Буферний операційний підсилювач (Voltage Follower) -->
    <polygon points="60,90 120,120 60,150" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="80" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#58a6ff">ОУ</text>
    <line x1="30" y1="105" x2="60" y2="105" stroke="#3fb950" stroke-width="2"/>
    <line x1="120" y1="120" x2="160" y2="120" stroke="#58a6ff" stroke-width="2"/>

    <!-- Перетворювач напруга-струм (XTR115) -->
    <rect x="160" y="80" width="140" height="80" rx="6" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="230" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f0883e">
      XTR115
    </text>
    <text x="230" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">
      V/I перетворювач
    </text>

    <!-- Вихідна 2-провідна струмова петля -->
    <line x1="300" y1="100" x2="340" y2="100" stroke="#f85149" stroke-width="3"/>
    <text x="340" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">LOOP (+24V)</text>

    <line x1="300" y1="140" x2="340" y2="140" stroke="#388bfd" stroke-width="3"/>
    <text x="340" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#388bfd">I_OUT (4..20mA)</text>

    <!-- Захист від дребезгу та індуктивності -->
    <g transform="translate(30, 200)">
      <rect width="300" height="105" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d29922">
        Схема захисту контактів
      </text>
      <text x="20" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9">• RC-демпфер (Snubber): 100 Ом + 10 нФ</text>
      <text x="20" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9">• Захист від ємнісного кидка струму</text>
      <text x="20" y="94" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9">• Ресурс контактів: понад 50 000 000 комутацій</text>
    </g>
  </g>
</svg>