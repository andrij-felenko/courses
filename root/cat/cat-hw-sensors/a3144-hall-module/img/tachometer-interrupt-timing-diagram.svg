<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-blue-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red-down" markerWidth="9" markerHeight="9" refX="4" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L4,8 L8,0 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма переривань цифрового тахометра</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Спадний фронт на виході A3144 фіксує момент переривання MCU для розрахунку періоду Δt</text>

  <!-- Main Container Panel -->
  <rect x="25" y="72" width="910" height="304" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Divider between Labels and Graph -->
  <line x1="205" y1="82" x2="205" y2="366" stroke="#d0d7de" stroke-width="1"/>

  <!-- Horizontal Track Separators -->
  <line x1="25" y1="160" x2="935" y2="160" stroke="#d0d7de" stroke-width="1"/>
  <line x1="25" y1="265" x2="935" y2="265" stroke="#d0d7de" stroke-width="1"/>

  <!-- TRACK 1 LABELS -->
  <text x="48" y="114" font-size="13" font-weight="bold" fill="#1a1a1a">Положення магніту</text>
  <text x="48" y="132" font-size="12" fill="#6b7280">(на обертовому валу)</text>

  <!-- TRACK 2 LABELS -->
  <text x="48" y="200" font-size="13" font-weight="bold" fill="#2457d6">Сигнал V_out (GPIO)</text>
  <text x="48" y="218" font-size="12" fill="#6b7280">(відкритий колектор)</text>

  <!-- TRACK 3 LABELS -->
  <text x="48" y="298" font-size="13" font-weight="bold" fill="#c0392b">Апаратне переривання</text>
  <text x="48" y="316" font-size="12" fill="#6b7280">(режим FALLING)</text>

  <!-- GRAPH AREA CONTENT -->
  <!-- Horizontal Grid / Reference Lines for Voltage Levels -->
  <line x1="220" y1="185" x2="910" y2="185" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="220" y1="240" x2="910" y2="240" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="220" y="178" font-size="12" fill="#6b7280">V_CC (HIGH)</text>
  <text x="220" y="254" font-size="12" fill="#6b7280">0В (LOW)</text>

  <!-- Track 1 Baseline -->
  <line x1="220" y1="140" x2="910" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Vertical Trigger / Alignment Guide Lines (Falling Edges) -->
  <line x1="300" y1="134" x2="300" y2="358" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="580" y1="134" x2="580" y2="358" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="820" y1="134" x2="820" y2="358" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Track 1: Physical Magnet Indicators -->
  <!-- Event 1 -->
  <text x="330" y="94" font-size="12" fill="#6b7280" text-anchor="middle">Проходження</text>
  <rect x="300" y="102" width="60" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="330" y="122" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Магніт S</text>

  <!-- Event 2 -->
  <text x="610" y="94" font-size="12" fill="#6b7280" text-anchor="middle">Проходження</text>
  <rect x="580" y="102" width="60" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="610" y="122" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Магніт S</text>

  <!-- Event 3 -->
  <text x="850" y="94" font-size="12" fill="#6b7280" text-anchor="middle">Проходження</text>
  <rect x="820" y="102" width="60" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="850" y="122" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Магніт S</text>

  <!-- Track 2: Signal LOW Fills -->
  <rect x="300" y="185" width="60" height="55" fill="#eaf0fd" opacity="0.6"/>
  <rect x="580" y="185" width="60" height="55" fill="#eaf0fd" opacity="0.6"/>
  <rect x="820" y="185" width="60" height="55" fill="#eaf0fd" opacity="0.6"/>

  <!-- Track 2: Signal Path -->
  <path d="M 220,185 L 300,185 L 300,240 L 360,240 L 360,185 L 580,185 L 580,240 L 640,240 L 640,185 L 820,185 L 820,240 L 880,240 L 880,185 L 910,185" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Track 2: Falling Edge Annotations -->
  <circle cx="300" cy="212" r="4" fill="#c0392b"/>
  <text x="295" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Спадний фронт</text>

  <circle cx="580" cy="212" r="4" fill="#c0392b"/>
  <text x="575" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Спадний фронт</text>

  <circle cx="820" cy="212" r="4" fill="#c0392b"/>
  <text x="815" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Спадний фронт</text>

  <!-- Track 3: Interrupt Events (ISR Tags) -->
  <!-- ISR Event 1 -->
  <rect x="265" y="276" width="70" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="300" y="292" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ISR t₁</text>
  <text x="300" y="312" font-size="12" fill="#6b7280" text-anchor="middle">t₁ = micros()</text>

  <!-- ISR Event 2 -->
  <rect x="545" y="276" width="70" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="580" y="292" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ISR t₂</text>
  <text x="580" y="312" font-size="12" fill="#6b7280" text-anchor="middle">t₂ = micros()</text>

  <!-- ISR Event 3 -->
  <rect x="785" y="276" width="70" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="820" y="292" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ISR t₃</text>
  <text x="820" y="312" font-size="12" fill="#6b7280" text-anchor="middle">t₃ = micros()</text>

  <!-- Track 3: Interval Measurement Arrows -->
  <!-- Interval 1 -->
  <line x1="306" y1="344" x2="370" y2="344" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-left)"/>
  <rect x="375" y="331" width="130" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="440" y="347" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δt₁ = t₂ - t₁</text>
  <line x1="510" y1="344" x2="574" y2="344" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue-right)"/>

  <!-- Interval 2 -->
  <line x1="586" y1="344" x2="630" y2="344" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-left)"/>
  <rect x="635" y="331" width="130" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="700" y="347" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δt₂ = t₃ - t₂</text>
  <line x1="770" y1="344" x2="814" y2="344" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue-right)"/>

  <!-- Bottom Cards Section -->
  <!-- Bottom Card 1: Formula -->
  <rect x="25" y="386" width="445" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="40" y="406" font-size="12" font-weight="bold" fill="#2457d6">Розрахунок частоти обертання (RPM)</text>
  <text x="40" y="426" font-size="12" font-weight="bold" fill="#1a1a1a">RPM = (60 × 10⁶) / Δt [мкс]</text>
  <text x="235" y="426" font-size="12" fill="#6b7280">(період 1 оберту)</text>

  <!-- Bottom Card 2: Technical Note -->
  <rect x="490" y="386" width="445" height="56" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="505" y="406" font-size="12" font-weight="bold" fill="#27ae60">Особливість A3144: вихід Open-Drain</text>
  <text x="505" y="426" font-size="12" fill="#1a1a1a">Наближення магніту перемикає вихід з HIGH у LOW (FALLING)</text>
</svg>
