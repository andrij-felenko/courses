<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігурація перемичок та підключення RTD-датчиків до MAX31865</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Перемички 2/3-Wire на платі визначають режим компенсації опору вимірювальних дротів</text>

  <!-- ==================== ПАНЕЛЬ 1: 2-ПРОВІДНЕ ПІДКЛЮЧЕННЯ ==================== -->
  <rect x="30" y="80" width="286" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="173" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. 2-провідне підключення</text>
  <text x="173" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Без компенсації опору дротів</text>

  <!-- Блок 1.1: Перемички -->
  <rect x="42" y="132" width="262" height="104" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="173" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Налаштування перемичок</text>

  <text x="52" y="172" font-size="12" fill="#1a1a1a" text-anchor="start">• Перемичка 2 WAY:</text>
  <text x="176" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ЗАМКНЕНА</text>
  <!-- Візуальні площадки 2-WAY запаяно -->
  <circle cx="260" cy="168" r="5" fill="#d0d7de" stroke="#6b7280"/>
  <circle cx="272" cy="168" r="5" fill="#d0d7de" stroke="#6b7280"/>
  <rect x="256" y="163" width="20" height="10" rx="4" fill="#27ae60"/>

  <text x="52" y="192" font-size="12" fill="#1a1a1a" text-anchor="start">• Перемичка 3 WAY:</text>
  <text x="176" y="192" font-size="12" fill="#6b7280" text-anchor="start">РОЗІМКНЕНО</text>
  <!-- Візуальні площадки 3-WAY відкриті -->
  <circle cx="260" cy="188" r="4" fill="#d0d7de" stroke="#6b7280"/>
  <circle cx="272" cy="188" r="4" fill="#d0d7de" stroke="#6b7280"/>

  <text x="52" y="212" font-size="12" fill="#6b7280" text-anchor="start">(запаяти 2-way площадки)</text>

  <!-- Блок 1.2: Схема дротів -->
  <rect x="42" y="250" width="262" height="148" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="173" y="267" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення дротів</text>

  <!-- Клемна колодка -->
  <rect x="52" y="278" width="56" height="110" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="80" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">F+</text>
  <text x="80" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">IN+</text>
  <text x="80" y="346" font-size="12" fill="#1a1a1a" text-anchor="middle">IN-</text>
  <text x="80" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">F-</text>

  <!-- Перемички на клемнику -->
  <line x1="108" y1="290" x2="108" y2="316" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="108" y1="342" x2="108" y2="368" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Дроти до сенсора -->
  <line x1="108" y1="305" x2="235" y2="305" stroke="#c0392b" stroke-width="2"/>
  <line x1="108" y1="355" x2="235" y2="355" stroke="#2457d6" stroke-width="2"/>

  <!-- Текст на клемнику і дротах -->
  <text x="115" y="293" font-size="12" fill="#27ae60" text-anchor="start">Перемичка</text>
  <text x="180" y="293" font-size="12" fill="#c0392b" text-anchor="start">Дріт 1</text>
  <text x="115" y="345" font-size="12" fill="#27ae60" text-anchor="start">Перемичка</text>
  <text x="180" y="345" font-size="12" fill="#2457d6" text-anchor="start">Дріт 2</text>

  <!-- Блок RTD -->
  <rect x="235" y="300" width="58" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="264" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RTD</text>
  <text x="264" y="345" font-size="12" fill="#6b7280" text-anchor="middle">PT100</text>

  <!-- Блок 1.3: Оцінка -->
  <rect x="42" y="412" width="262" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="173" y="430" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Похибка опору дротів</text>
  <text x="52" y="452" font-size="12" fill="#1a1a1a" text-anchor="start">• R_виміряний = R_RTD + 2·R_w</text>
  <text x="52" y="472" font-size="12" fill="#c0392b" text-anchor="start">• Похибка ~2.5 °C на 1 Ом дротів</text>
  <text x="52" y="492" font-size="12" fill="#6b7280" text-anchor="start">• Використовувати до 0.5 м</text>


  <!-- ==================== ПАНЕЛЬ 2: 3-ПРОВІДНЕ ПІДКЛЮЧЕННЯ ==================== -->
  <rect x="336" y="80" width="286" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="479" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. 3-провідне підключення</text>
  <text x="479" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Часткова компенсація дротів</text>

  <!-- Блок 2.1: Перемички -->
  <rect x="348" y="132" width="262" height="104" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="479" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Налаштування перемичок</text>

  <text x="358" y="172" font-size="12" fill="#1a1a1a" text-anchor="start">• Перемичка 2 WAY:</text>
  <text x="482" y="172" font-size="12" fill="#6b7280" text-anchor="start">РОЗРІЗАНО</text>
  <!-- Візуальні площадки 2-WAY відкриті -->
  <circle cx="566" cy="168" r="4" fill="#d0d7de" stroke="#6b7280"/>
  <circle cx="578" cy="168" r="4" fill="#d0d7de" stroke="#6b7280"/>

  <text x="358" y="192" font-size="12" fill="#1a1a1a" text-anchor="start">• Перемичка 3 WAY:</text>
  <text x="482" y="192" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ЗАМКНЕНА</text>
  <!-- Візуальні площадки 3-WAY запаяно -->
  <circle cx="566" cy="188" r="5" fill="#d0d7de" stroke="#6b7280"/>
  <circle cx="578" cy="188" r="5" fill="#d0d7de" stroke="#6b7280"/>
  <rect x="562" y="183" width="20" height="10" rx="4" fill="#27ae60"/>

  <text x="358" y="212" font-size="12" fill="#6b7280" text-anchor="start">(запаяти 3-way площадки)</text>

  <!-- Блок 2.2: Схема дротів -->
  <rect x="348" y="250" width="262" height="148" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="479" y="267" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення дротів</text>

  <!-- Клемна колодка -->
  <rect x="358" y="278" width="56" height="110" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="386" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">F+</text>
  <text x="386" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">IN+</text>
  <text x="386" y="346" font-size="12" fill="#1a1a1a" text-anchor="middle">IN-</text>
  <text x="386" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">F-</text>

  <!-- Перемичка IN- до F- -->
  <line x1="414" y1="342" x2="414" y2="368" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Дроти до сенсора -->
  <path d="M 414 294 H 490 L 541 305" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 414 320 H 490 L 541 305" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="414" y1="355" x2="541" y2="355" stroke="#2457d6" stroke-width="2"/>

  <!-- Підписи дротів -->
  <text x="425" y="286" font-size="12" fill="#c0392b" text-anchor="start">Червоний 1</text>
  <text x="425" y="312" font-size="12" fill="#c0392b" text-anchor="start">Червоний 2</text>
  <text x="425" y="345" font-size="12" fill="#27ae60" text-anchor="start">Перемичка</text>
  <text x="425" y="375" font-size="12" fill="#2457d6" text-anchor="start">Білий</text>

  <!-- Блок RTD -->
  <rect x="541" y="300" width="58" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RTD</text>
  <text x="570" y="345" font-size="12" fill="#6b7280" text-anchor="middle">PT100</text>

  <!-- Блок 2.3: Оцінка -->
  <rect x="348" y="412" width="262" height="96" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="479" y="430" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Балансна компенсація</text>
  <text x="358" y="452" font-size="12" fill="#1a1a1a" text-anchor="start">• Компенсує R_w1 за умови R_w1=R_w2</text>
  <text x="358" y="472" font-size="12" fill="#2457d6" text-anchor="start">• Дроти мають бути однакової довжини</text>
  <text x="358" y="492" font-size="12" fill="#6b7280" text-anchor="start">• Оптимально для ліній до 10 м</text>


  <!-- ==================== ПАНЕЛЬ 3: 4-ПРОВІДНЕ ПІДКЛЮЧЕННЯ ==================== -->
  <rect x="642" y="80" width="286" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. 4-провідне підключення</text>
  <text x="785" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Повна компенсація (прецизійне)</text>

  <!-- Блок 3.1: Перемички -->
  <rect x="654" y="132" width="262" height="104" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Налаштування перемичок</text>

  <text x="664" y="172" font-size="12" fill="#1a1a1a" text-anchor="start">• Перемичка 2 WAY:</text>
  <text x="788" y="172" font-size="12" fill="#6b7280" text-anchor="start">РОЗІМКНЕНО</text>
  <!-- Візуальні площадки 2-WAY відкриті -->
  <circle cx="872" cy="168" r="4" fill="#d0d7de" stroke="#6b7280"/>
  <circle cx="884" cy="168" r="4" fill="#d0d7de" stroke="#6b7280"/>

  <text x="664" y="192" font-size="12" fill="#1a1a1a" text-anchor="start">• Перемичка 3 WAY:</text>
  <text x="788" y="192" font-size="12" fill="#6b7280" text-anchor="start">РОЗІМКНЕНО</text>
  <!-- Візуальні площадки 3-WAY відкриті -->
  <circle cx="872" cy="188" r="4" fill="#d0d7de" stroke="#6b7280"/>
  <circle cx="884" cy="188" r="4" fill="#d0d7de" stroke="#6b7280"/>

  <text x="664" y="212" font-size="12" fill="#6b7280" text-anchor="start">(усі перемички відкриті)</text>

  <!-- Блок 3.2: Схема дротів -->
  <rect x="654" y="250" width="262" height="148" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="267" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення дротів</text>

  <!-- Клемна колодка -->
  <rect x="664" y="278" width="56" height="110" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="692" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">F+</text>
  <text x="692" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">IN+</text>
  <text x="692" y="346" font-size="12" fill="#1a1a1a" text-anchor="middle">IN-</text>
  <text x="692" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">F-</text>

  <!-- Дроти до сенсора (4 окремі) -->
  <path d="M 720 290 H 805 L 847 310" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 720 316 H 805 L 847 310" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 720 342 H 805 L 847 350" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 720 368 H 805 L 847 350" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Підписи дротів -->
  <text x="725" y="284" font-size="12" fill="#c0392b" text-anchor="start">F+ (струм)</text>
  <text x="725" y="310" font-size="12" fill="#2457d6" text-anchor="start">IN+ (сигнал)</text>
  <text x="725" y="362" font-size="12" fill="#2457d6" text-anchor="start">IN- (сигнал)</text>
  <text x="725" y="384" font-size="12" fill="#1a1a1a" text-anchor="start">F- (струм)</text>

  <!-- Блок RTD -->
  <rect x="847" y="300" width="58" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="876" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RTD</text>
  <text x="876" y="345" font-size="12" fill="#6b7280" text-anchor="middle">PT100</text>

  <!-- Блок 3.3: Оцінка -->
  <rect x="654" y="412" width="262" height="96" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="785" y="430" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Повна компенсація опору</text>
  <text x="664" y="452" font-size="12" fill="#1a1a1a" text-anchor="start">• Опір дротів повністю виключено</text>
  <text x="664" y="472" font-size="12" fill="#27ae60" text-anchor="start">• Вимірюється суто напруга R_RTD</text>
  <text x="664" y="492" font-size="12" fill="#6b7280" text-anchor="start">• Найвища точність для довгих ліній</text>
</svg>
