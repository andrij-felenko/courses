<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Метод Ньютона — Рафсона для рівняння Каллендара — Ван Дюзена (t &lt; 0 °C)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Квадратична збіжність до точного значення температури досягається всього за 2 ітерації</text>

  <!-- Ліва панель: Графічна діаграма ітерацій -->
  <rect x="35" y="80" width="545" height="415" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="106" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Графік функції f(t) = R_CVD(t) - R_виміряне</text>

  <!-- Вісь Y: f(t) -->
  <line x1="95" y1="425" x2="95" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="95" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">f(t) [Ом]</text>

  <!-- Вісь X: t (°C) (Лінія балансу f(t) = 0) -->
  <line x1="75" y1="330" x2="525" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="532" y="334" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">t (°C)</text>
  <text x="82" y="322" text-anchor="start" font-size="11" font-weight="bold" fill="#6b7280">f(t) = 0</text>

  <!-- Крива f(t) -->
  <path d="M 130 430 C 230 415, 390 230, 500 140" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="440" y="135" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">y = f(t)</text>

  <!-- Початкова точка t0 (k=0) -->
  <line x1="160" y1="330" x2="160" y2="412" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="160" cy="330" r="4" fill="#c0392b"/>
  <text x="160" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">t₀ = -148.4 °C</text>

  <!-- Точка на кривій f(t0) -->
  <circle cx="160" cy="412" r="4" fill="#c0392b"/>
  <text x="172" y="425" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">(t₀, f(t₀))</text>

  <!-- Дотична 1 (від f(t0) до t1) -->
  <line x1="135" y1="427" x2="310" y2="321" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="150" y="360" text-anchor="start" font-size="11" fill="#c0392b">Дотична f'(t₀)</text>

  <!-- Перша ітерація t1 (k=1) -->
  <line x1="295" y1="330" x2="295" y2="358" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="295" cy="330" r="4" fill="#2457d6"/>
  <text x="295" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">t₁ = -149.998 °C</text>

  <!-- Точка на кривій f(t1) -->
  <circle cx="295" cy="358" r="4" fill="#2457d6"/>
  <text x="305" y="378" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">(t₁, f(t₁))</text>

  <!-- Дотична 2 (від f(t1) до t2) -->
  <line x1="275" y1="367" x2="370" y2="323" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="240" y="352" text-anchor="end" font-size="11" fill="#2457d6">Дотична f'(t₁)</text>

  <!-- Точна точка t* / t2 -->
  <circle cx="355" cy="330" r="6" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>

  <!-- Виносне плашка-пояснення для t* -->
  <rect x="375" y="375" width="185" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 375 390 L 362 337" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="385" y="394" text-anchor="start" font-size="11.5" font-weight="bold" fill="#27ae60">t₂ ≈ t* = -150.000 °C</text>
  <text x="385" y="411" text-anchor="start" font-size="11" fill="#27ae60">Похибка Δt &lt; 0.0001 °C</text>
  <text x="385" y="428" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">Збіжність за 2 ітерації</text>

  <!-- Легенда внизу лівої панелі -->
  <rect x="50" y="448" width="310" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="65" cy="465" r="4" fill="#c0392b"/>
  <text x="75" y="469" text-anchor="start" font-size="11" fill="#1a1a1a">t₀: Початкове</text>
  <circle cx="170" cy="465" r="4" fill="#2457d6"/>
  <text x="180" y="469" text-anchor="start" font-size="11" fill="#1a1a1a">t₁: 1-ша ітерація</text>
  <circle cx="290" cy="465" r="4" fill="#27ae60"/>
  <text x="300" y="469" text-anchor="start" font-size="11" fill="#1a1a1a">t*: Точне t</text>

  <!-- Права панель: Алгоритм та Таблиця збіжності -->
  <rect x="595" y="80" width="335" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Картка 1: Рівняння Каллендара — Ван Дюзена -->
  <rect x="607" y="95" width="311" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="617" y="114" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Рівняння Каллендара — Ван Дюзена:</text>
  <rect x="615" y="122" width="295" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="762" y="141" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">f(t) = R₀ [1 + At + Bt² + C(t-100)t³] - R_вимір</text>
  <text x="617" y="167" text-anchor="start" font-size="11" fill="#6b7280">Поліном 4-го степеня (без аналітичного розв'язку)</text>

  <!-- Картка 2: Алгоритм Ньютона — Рафсона -->
  <rect x="607" y="190" width="311" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="617" y="209" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Формула ітераційного наближення:</text>
  <rect x="615" y="217" width="295" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="762" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">t_{k+1} = t_k - f(t_k) / f'(t_k)</text>
  <text x="617" y="267" text-anchor="start" font-size="11" fill="#1a1a1a">Похідна: f'(t) = R₀ [ A + 2Bt + C (4t³ - 300t²) ]</text>
  <text x="617" y="286" text-anchor="start" font-size="11" fill="#6b7280">t₀ обчислюється аналітично з квадратичного R(t)</text>

  <!-- Картка 3: Таблиця збіжності -->
  <rect x="607" y="315" width="311" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="617" y="333" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Процес збіжності (PT100 при -150 °C):</text>

  <!-- Шапка таблиці -->
  <rect x="615" y="342" width="295" height="22" rx="3" fill="#d5f5e3"/>
  <text x="635" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">k</text>
  <text x="720" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">t_k (°C)</text>
  <text x="835" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Похибка |Δt|</text>

  <!-- Рядок 0: t0 -->
  <text x="635" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0</text>
  <text x="720" y="377" text-anchor="middle" font-size="11" fill="#1a1a1a">-148.420 °C</text>
  <text x="835" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">1.5800 °C</text>

  <!-- Рядок 1: t1 -->
  <text x="635" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">1</text>
  <text x="720" y="395" text-anchor="middle" font-size="11" fill="#1a1a1a">-149.998 °C</text>
  <text x="835" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">0.0020 °C</text>

  <!-- Рядок 2: t2 -->
  <text x="635" y="413" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">2</text>
  <text x="720" y="413" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">-150.000 °C</text>
  <text x="835" y="413" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">&lt; 0.0001 °C</text>

  <!-- Підсумковий баннер -->
  <rect x="615" y="427" width="295" height="44" rx="4" fill="#27ae60"/>
  <text x="762" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Квадратична швидкість збіжності!</text>
  <text x="762" y="461" text-anchor="middle" font-size="11" fill="#ffffff">Всього 2 ітерації для метрологічної точності</text>
</svg>
