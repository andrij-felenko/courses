<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff" />

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b" />
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6" />
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив опору дротів на вимірювання температури (2-провідна схема)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Паразитний опір дротів R_w додається до R_RTD і створює позитивне зміщення температури</text>

  <!-- Ліва панель: Еквівалентна схема -->
  <rect x="30" y="75" width="530" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" />
  <text x="45" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Еквівалентна схема підключення PT100</text>

  <!-- Блок вимірювача MAX31865 -->
  <rect x="45" y="115" width="140" height="300" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <path d="M 45,121 A 6,6 0 0 1 51,115 L 179,115 A 6,6 0 0 1 185,121 L 185,161 L 45,161 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" />
  <text x="115" y="134" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MAX31865</text>
  <text x="115" y="150" font-size="12" fill="#6b7280" text-anchor="middle">(АЦП / вимірювач)</text>

  <!-- Генератор струму -->
  <circle cx="115" cy="195" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" />
  <line x1="115" y1="204" x2="115" y2="188" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)" />
  <text x="115" y="226" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Струм I_EXC</text>

  <!-- Внутрішній блок АЦП -->
  <rect x="60" y="246" width="110" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1" />
  <text x="115" y="263" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">АЦП MAX31865</text>
  <text x="115" y="280" font-size="12" fill="#6b7280" text-anchor="middle">V_вимір = I · R_сум</text>

  <!-- Виводи MAX31865 -->
  <circle cx="185" cy="180" r="4" fill="#2457d6" />
  <text x="176" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">FORCE+ / RTIN+</text>

  <circle cx="185" cy="340" r="4" fill="#2457d6" />
  <text x="176" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">FORCE- / RTIN-</text>

  <!-- Дроти та паразитні опори -->
  <!-- Верхній дріт -->
  <line x1="185" y1="180" x2="250" y2="180" stroke="#c0392b" stroke-width="2" />
  <line x1="195" y1="180" x2="220" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="207" y="168" font-size="12" fill="#2457d6" text-anchor="middle">I_EXC →</text>

  <text x="297" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Дріт 1 (паразитний)</text>
  <rect x="250" y="165" width="95" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" />
  <text x="297" y="184" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_w1 = 1.0 Ом</text>

  <line x1="345" y1="180" x2="405" y2="180" stroke="#c0392b" stroke-width="2" />

  <!-- Нижній дріт -->
  <line x1="405" y1="340" x2="345" y2="340" stroke="#c0392b" stroke-width="2" />
  <line x1="220" y1="340" x2="195" y2="340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="207" y="324" font-size="12" fill="#2457d6" text-anchor="middle">← I_EXC</text>

  <rect x="250" y="325" width="95" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" />
  <text x="297" y="344" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_w2 = 1.0 Ом</text>
  <text x="297" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Дріт 2 (паразитний)</text>

  <line x1="250" y1="340" x2="185" y2="340" stroke="#c0392b" stroke-width="2" />

  <!-- Блок сенсора PT100 -->
  <rect x="405" y="115" width="140" height="300" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" />
  <path d="M 405,121 A 6,6 0 0 1 411,115 L 539,115 A 6,6 0 0 1 545,121 L 545,161 L 405,161 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" />
  <text x="475" y="134" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Сенсор PT100</text>
  <text x="475" y="150" font-size="12" fill="#6b7280" text-anchor="middle">(Гільза / Детектор)</text>

  <!-- Внутрішнє з'єднання та резистор -->
  <circle cx="405" cy="180" r="4" fill="#2457d6" />
  <polyline points="405,180 425,180 425,235 440,235" fill="none" stroke="#2457d6" stroke-width="1.5" />

  <rect x="440" y="215" width="80" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" />
  <text x="480" y="236" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">R_RTD</text>
  <text x="480" y="253" font-size="12" fill="#2457d6" text-anchor="middle">(100.0 Ом)</text>

  <circle cx="405" cy="340" r="4" fill="#2457d6" />
  <polyline points="405,340 425,340 425,245 440,245" fill="none" stroke="#2457d6" stroke-width="1.5" />

  <!-- Інформація про температурне середовище -->
  <rect x="420" y="285" width="110" height="115" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" />
  <text x="475" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хар-ки PT100:</text>
  <text x="475" y="324" font-size="12" fill="#6b7280" text-anchor="middle">при 0°C:</text>
  <text x="475" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R = 100.0 Ом</text>
  <text x="475" y="365" font-size="12" fill="#6b7280" text-anchor="middle">при 100°C:</text>
  <text x="475" y="381" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R = 138.5 Ом</text>

  <!-- Права панель: Математика та розрахунок -->
  <rect x="580" y="75" width="350" height="360" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
  <text x="595" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Математика та розрахунок похибки</text>

  <!-- Картка 1: Формула -->
  <rect x="595" y="115" width="320" height="140" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
  <text x="610" y="136" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Формула виміряного опору</text>
  <text x="610" y="160" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_вимір = R_RTD + R_w1 + R_w2</text>
  <text x="610" y="182" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">R_вимір = R_RTD + 2 · R_wire</text>

  <rect x="610" y="195" width="290" height="48" rx="4" fill="#ffffff" stroke="#c0392b" stroke-dasharray="3,3" />
  <text x="620" y="213" font-size="12" fill="#6b7280" text-anchor="start">Паразитне зміщення опору (похибка):</text>
  <text x="620" y="232" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ΔR = 2 · R_wire  (додається постійно)</text>

  <!-- Картка 2: Числовий приклад -->
  <rect x="595" y="270" width="320" height="150" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2" />
  <text x="610" y="291" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Числовий приклад (датчик PT100)</text>
  <text x="610" y="312" font-size="12" fill="#1a1a1a" text-anchor="start">• Чутливість PT100: α ≈ 0.385 Ом/°C</text>
  <text x="610" y="330" font-size="12" fill="#1a1a1a" text-anchor="start">• Опір 10м мідного дроту: R_wire = 1.0 Ом</text>
  <text x="610" y="348" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• ΔT = ΔR / 0.385 = 2.0 Ом / 0.385 Ом/°C</text>

  <rect x="610" y="360" width="290" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
  <text x="755" y="378" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Похибка вимірювання: ΔT ≈ +5.19 °C !</text>
  <text x="755" y="395" font-size="12" fill="#6b7280" text-anchor="middle">Вимагає 3- або 4-провідного підключення</text>
</svg>
