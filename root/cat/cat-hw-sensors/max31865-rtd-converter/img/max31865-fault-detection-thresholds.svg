<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діагностика несправностей та регістрові пороги MAX31865</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння коду АЦП із порогами High/Low виявляє обриви, короткі замикання та вихід за межі</text>

  <!-- Left Panel: Comparator Architecture -->
  <rect x="25" y="72" width="540" height="443" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Структура компараторів та регістрів</text>

  <!-- Column 1: Input Registers & Pins -->
  <rect x="45" y="115" width="155" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="122.5" y="138" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Код АЦП D_RTD</text>
  <text x="122.5" y="158" font-size="12" fill="#6b7280" text-anchor="middle">Регістри 0x01–0x02</text>

  <rect x="45" y="195" width="155" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="122.5" y="218" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Поріг High (D_HIGH)</text>
  <text x="122.5" y="238" font-size="12" fill="#6b7280" text-anchor="middle">Регістри 0x03–0x04</text>

  <rect x="45" y="275" width="155" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="122.5" y="298" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Поріг Low (D_LOW)</text>
  <text x="122.5" y="318" font-size="12" fill="#6b7280" text-anchor="middle">Регістри 0x05–0x06</text>

  <rect x="45" y="355" width="155" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="122.5" y="378" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналогові входи</text>
  <text x="122.5" y="398" font-size="12" fill="#6b7280" text-anchor="middle">FORCE / RTIN pins</text>

  <!-- Column 2: Comparators -->
  <rect x="235" y="155" width="155" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="312.5" y="178" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Компаратор High</text>
  <text x="312.5" y="198" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D_RTD &gt; D_HIGH ?</text>

  <rect x="235" y="255" width="155" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="312.5" y="278" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Компаратор Low</text>
  <text x="312.5" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D_RTD &lt; D_LOW ?</text>

  <rect x="235" y="355" width="155" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="312.5" y="378" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналогова перевірка</text>
  <text x="312.5" y="398" font-size="12" fill="#6b7280" text-anchor="middle">Детектор напруг V_IN</text>

  <!-- Signal Arrows Column 1 to Column 2 -->
  <path d="M 200 145 L 218 145 L 218 170 L 227 170" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <path d="M 200 225 L 218 225 L 218 200 L 227 200" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

  <path d="M 200 145 L 212 145 L 212 270 L 227 270" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <path d="M 200 305 L 218 305 L 218 300 L 227 300" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

  <path d="M 200 385 L 227 385" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Column 3: Fault Status Register 0x07 -->
  <rect x="425" y="115" width="125" height="380" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="487.5" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістр 0x07</text>
  <text x="487.5" y="156" font-size="12" fill="#6b7280" text-anchor="middle">Fault Status</text>

  <rect x="433" y="170" width="109" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="487.5" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D7: High Fault</text>
  <text x="487.5" y="208" font-size="12" fill="#6b7280" text-anchor="middle">Over-Temp/Open</text>

  <rect x="433" y="235" width="109" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="487.5" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D6: Low Fault</text>
  <text x="487.5" y="273" font-size="12" fill="#6b7280" text-anchor="middle">Under-Temp/Short</text>

  <rect x="433" y="300" width="109" height="65" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="487.5" y="320" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D5–D2: V_IN Err</text>
  <text x="487.5" y="338" font-size="12" fill="#6b7280" text-anchor="middle">Short / Overvolt</text>
  <text x="487.5" y="354" font-size="12" fill="#6b7280" text-anchor="middle">to VBIAS / GND</text>

  <rect x="433" y="380" width="109" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="487.5" y="400" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вивід /FAULT</text>
  <text x="487.5" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Низький рівень</text>

  <!-- Signal Arrows Column 2 to Column 3 -->
  <path d="M 390 185 L 408 185 L 408 196 L 425 196" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>
  <path d="M 390 285 L 408 285 L 408 261 L 425 261" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>
  <path d="M 390 385 L 410 385 L 410 332 L 425 332" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

  <!-- Right Panel: Threshold Map & Fault Diagnostic Conditions -->
  <rect x="585" y="72" width="350" height="443" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="605" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Карта порогів та діагностика</text>

  <!-- Card 1: High Fault Region -->
  <rect x="605" y="115" width="310" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="620" y="137" font-size="13" font-weight="bold" fill="#c0392b">D_RTD &gt; D_HIGH  —  Помилка High</text>
  <text x="620" y="157" font-size="12" fill="#1a1a1a">Причина: обрив датчика / дротів або Over-Temp</text>
  <text x="620" y="175" font-size="12" fill="#6b7280">Статус: Регістр 0x07 [Bit 7] = 1,  /FAULT = LOW</text>

  <!-- Threshold Divider Line & Pill D_HIGH -->
  <line x1="605" y1="202" x2="697" y2="202" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="823" y1="202" x2="915" y2="202" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="697.5" y="192" width="125" height="20" rx="10" fill="#c0392b"/>
  <text x="760" y="206" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Поріг D_HIGH</text>

  <!-- Card 2: Normal Region -->
  <rect x="605" y="218" width="310" height="78" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="620" y="240" font-size="13" font-weight="bold" fill="#27ae60">D_LOW ≤ D_RTD ≤ D_HIGH  —  Норма</text>
  <text x="620" y="260" font-size="12" fill="#1a1a1a">Вимірювання в межах робочого діапазону</text>
  <text x="620" y="278" font-size="12" fill="#6b7280">Статус: Регістр 0x07 = 0x00,  /FAULT = High-Z</text>

  <!-- Threshold Divider Line & Pill D_LOW -->
  <line x1="605" y1="305" x2="697" y2="305" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="823" y1="305" x2="915" y2="305" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="697.5" y="295" width="125" height="20" rx="10" fill="#c0392b"/>
  <text x="760" y="309" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Поріг D_LOW</text>

  <!-- Card 3: Low Fault Region -->
  <rect x="605" y="321" width="310" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="620" y="343" font-size="13" font-weight="bold" fill="#c0392b">D_RTD &lt; D_LOW  —  Помилка Low</text>
  <text x="620" y="363" font-size="12" fill="#1a1a1a">Причина: КЗ датчика RTD або Under-Temp</text>
  <text x="620" y="381" font-size="12" fill="#6b7280">Статус: Регістр 0x07 [Bit 6] = 1,  /FAULT = LOW</text>

  <!-- Card 4: Analog Faults Summary -->
  <rect x="605" y="415" width="310" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="620" y="435" font-size="13" font-weight="bold" fill="#1a1a1a">Аналогова діагностика кола (Bits D5–D2)</text>
  <text x="620" y="455" font-size="12" fill="#c0392b">• V_IN Fault: <tspan font-size="12" fill="#6b7280">V_IN &gt; 0.85 · V_BIAS (Over/Under)</tspan></text>
  <text x="620" y="475" font-size="12" fill="#c0392b">• FORCE/RTIN Short: <tspan font-size="12" fill="#6b7280">КЗ на V_BIAS або GND</tspan></text>
</svg>
