<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Співвідносне (Ratiometric) вимірювання в MAX31865</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">Струм збудження I_BIAS скасовується: результат залежить лише від відношення R_RTD / R_ref</text>

  <!-- ==================== LEFT PANEL: MAX31865 IC ==================== -->
  <rect x="20" y="75" width="500" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Мікросхема MAX31865 (RTD-to-Digital)</text>

  <!-- Excitation Current Source Block -->
  <rect x="35" y="110" width="175" height="45" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="122" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Джерело струму</text>
  <text x="122" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I_BIAS</text>

  <!-- Internal Wire from I_BIAS to FORCE+ pin -->
  <line x1="210" y1="121" x2="455" y2="121" stroke="#2457d6" stroke-width="2"/>

  <!-- SPI External Connections (Left side) -->
  <text x="25" y="165" font-size="12" font-weight="bold" fill="#6b7280">SPI</text>
  <line x1="5" y1="190" x2="31" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="5" y1="205" x2="31" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="5" y1="220" x2="31" y2="220" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="31" y1="235" x2="5" y2="235" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- SPI & Control Block -->
  <rect x="35" y="170" width="175" height="275" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="122" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">SPI &amp; Контролер</text>
  <line x1="50" y1="202" x2="195" y2="202" stroke="#e5e7eb" stroke-width="1"/>
  <text x="122" y="218" text-anchor="middle" font-size="12" fill="#6b7280">Конфігурація регістрів</text>
  <text x="122" y="234" text-anchor="middle" font-size="12" fill="#6b7280">(CR0, Fault Status)</text>
  <line x1="50" y1="244" x2="195" y2="244" stroke="#e5e7eb" stroke-width="1"/>
  <text x="122" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Діагностика:</text>
  <text x="122" y="278" text-anchor="middle" font-size="12" fill="#c0392b">• обрив / КЗ сенсора</text>
  <text x="122" y="295" text-anchor="middle" font-size="12" fill="#c0392b">• порогові межі RTD</text>
  <line x1="50" y1="305" x2="195" y2="305" stroke="#e5e7eb" stroke-width="1"/>
  <text x="122" y="322" text-anchor="middle" font-size="12" fill="#6b7280">Фільтрація завад</text>
  <text x="122" y="338" text-anchor="middle" font-size="12" fill="#6b7280">50 Гц / 60 Гц</text>
  <line x1="50" y1="348" x2="195" y2="348" stroke="#e5e7eb" stroke-width="1"/>
  <text x="122" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">15-бітний код</text>
  <text x="122" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">вимірювання</text>

  <!-- Delta-Sigma ADC Block -->
  <rect x="225" y="170" width="210" height="275" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="330" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">15-біт ΔΣ АЦП</text>
  <text x="330" y="208" text-anchor="middle" font-size="12" fill="#6b7280">(Delta-Sigma ADC)</text>

  <!-- Inner Vref Section -->
  <rect x="235" y="218" width="190" height="58" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Опорна напруга (Vref)</text>
  <text x="330" y="250" text-anchor="middle" font-size="12" fill="#2457d6">Vref = V(REFIN+) - V(REFIN-)</text>
  <text x="330" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Vref = I_BIAS × R_ref</text>

  <!-- Inner Vin Section -->
  <rect x="235" y="286" width="190" height="58" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідна напруга (Vin)</text>
  <text x="330" y="318" text-anchor="middle" font-size="12" fill="#27ae60">Vin = V(RTIN+) - V(RTIN-)</text>
  <text x="330" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Vin = I_BIAS × R_RTD</text>

  <!-- ADC Ratio Calculation inside ADC -->
  <text x="330" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Код = 32768 × (Vin / Vref)</text>
  <text x="330" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Код = 32768 × (R_RTD / R_ref)</text>

  <!-- Arrow from ADC to SPI block -->
  <line x1="225" y1="390" x2="214" y2="390" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="217" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Код</text>

  <!-- Internal Wiring from ADC to REFIN+, REFIN-, RTIN+, RTIN- pins -->
  <line x1="435" y1="181" x2="455" y2="181" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="435" y1="241" x2="455" y2="241" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="435" y1="301" x2="455" y2="301" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="435" y1="361" x2="455" y2="361" stroke="#27ae60" stroke-width="1.5"/>

  <!-- IC Pin Boxes -->
  <!-- FORCE+ Pin -->
  <rect x="455" y="111" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="485" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">FORCE+</text>

  <!-- REFIN+ Pin -->
  <rect x="455" y="171" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#2457d6" stroke-width="1.5"/>
  <text x="485" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">REFIN+</text>

  <!-- REFIN- Pin -->
  <rect x="455" y="231" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#2457d6" stroke-width="1.5"/>
  <text x="485" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">REFIN-</text>

  <!-- RTIN+ Pin -->
  <rect x="455" y="291" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="485" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">RTIN+</text>

  <!-- RTIN- Pin -->
  <rect x="455" y="351" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="485" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">RTIN-</text>

  <!-- FORCE- Pin -->
  <rect x="455" y="411" width="60" height="20" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="485" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">FORCE-</text>

  <!-- Internal GND Connection for FORCE- (routed clear of ADC block) -->
  <path d="M 455,421 L 455,470 L 330,470 L 330,490" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="318" y1="490" x2="342" y2="490" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="322" y1="494" x2="338" y2="494" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="326" y1="498" x2="334" y2="498" stroke="#1a1a1a" stroke-width="1"/>
  <text x="350" y="495" font-size="12" fill="#6b7280">GND</text>

  <!-- ==================== RIGHT PANEL: EXTERNAL CIRCUIT ==================== -->
  <rect x="550" y="75" width="390" height="465" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="570" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Зовнішнє вимірювальне коло</text>

  <!-- External Current Path (I_BIAS) -->
  <line x1="515" y1="121" x2="730" y2="121" stroke="#2457d6" stroke-width="2"/>
  <line x1="640" y1="121" x2="650" y2="121" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="620" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I_BIAS (струм збудження)</text>

  <line x1="730" y1="121" x2="730" y2="155" stroke="#2457d6" stroke-width="2"/>
  <line x1="730" y1="138" x2="730" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- R_ref Resistor -->
  <rect x="710" y="155" width="40" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="760" y="172" font-size="13" font-weight="bold" fill="#2457d6">R_ref</text>
  <text x="760" y="189" font-size="12" fill="#6b7280">Опорний резистор</text>
  <text x="760" y="204" font-size="12" fill="#6b7280">(400 Ом для PT100)</text>

  <!-- Wire between R_ref and R_RTD -->
  <line x1="730" y1="210" x2="730" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="730" y1="240" x2="730" y2="248" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- R_RTD Sensor -->
  <rect x="710" y="275" width="40" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="760" y="292" font-size="13" font-weight="bold" fill="#27ae60">R_RTD (PT100/PT1000)</text>
  <text x="760" y="309" font-size="12" fill="#6b7280">Термоперетворювач</text>
  <text x="760" y="324" font-size="12" fill="#6b7280">(сенсор температури)</text>

  <!-- Return Wire to FORCE- -->
  <path d="M 730,330 L 730,421 L 515,421" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="635" y1="421" x2="625" y2="421" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="625" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Повернення I_BIAS</text>

  <!-- Tap connections from External Circuit to IC pins -->
  <!-- REFIN+ tap -->
  <path d="M 730,140 L 640,140 L 640,181 L 515,181" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="730" cy="140" r="3.5" fill="#2457d6"/>
  <text x="575" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">REFIN+</text>

  <!-- REFIN- tap -->
  <path d="M 730,230 L 655,230 L 655,241 L 515,241" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="730" cy="230" r="3.5" fill="#2457d6"/>
  <text x="585" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">REFIN-</text>

  <!-- RTIN+ tap -->
  <path d="M 730,255 L 655,255 L 655,301 L 515,301" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="730" cy="255" r="3.5" fill="#27ae60"/>
  <text x="585" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RTIN+</text>

  <!-- RTIN- tap -->
  <path d="M 730,345 L 640,345 L 640,361 L 515,361" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="730" cy="345" r="3.5" fill="#27ae60"/>
  <text x="575" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RTIN-</text>

  <!-- Ratiometric Equation Summary Box -->
  <rect x="570" y="448" width="350" height="72" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="745" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Скасування струму I_BIAS:</text>
  <text x="745" y="485" text-anchor="middle" font-size="12" fill="#1a1a1a">Код = 32768 × (I_BIAS · R_RTD) / (I_BIAS · R_ref)</text>
  <text x="745" y="506" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Код АЦП = 32768 × ( R_RTD / R_ref )</text>
</svg>
