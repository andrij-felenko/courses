<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Карта регістрів MAX31865 та структура конфігураційного регістру 0x00</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Регістр 0x00 задає режим вимірювання, компенсацію завад 50/60 Гц та прапорці скидання помилок</text>

  <!-- Left Panel: Register Map -->
  <rect x="25" y="70" width="375" height="450" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="25" y="70" width="375" height="34" rx="6" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="212" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Карта 8-бітних регістрів MAX31865</text>

  <!-- Register Row 0: Config (Highlighted) -->
  <rect x="35" y="112" width="355" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="130" font-size="12" font-weight="bold" fill="#2457d6">0x00 (R) / 0x80 (W)</text>
  <text x="175" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">CONFIG</text>
  <text x="175" y="146" font-size="11" fill="#6b7280">Конфігурація вимірювань та режимів</text>

  <!-- Register Row 1: RTD MSB -->
  <rect x="35" y="162" width="355" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">0x01 (R) / 0x81 (W)</text>
  <text x="175" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">RTD MSB</text>
  <text x="175" y="195" font-size="11" fill="#6b7280">Старші 8 біт виміряного опору (D15..D8)</text>

  <!-- Register Row 2: RTD LSB -->
  <rect x="35" y="210" width="355" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">0x02 (R) / 0x82 (W)</text>
  <text x="175" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">RTD LSB</text>
  <text x="175" y="243" font-size="11" fill="#6b7280">Молодші 7 біт (D7..D1) + Bit 0 Fault Flag</text>

  <!-- Register Row 3: High Fault Threshold MSB -->
  <rect x="35" y="258" width="355" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="276" font-size="12" font-weight="bold" fill="#1a1a1a">0x03 (R) / 0x83 (W)</text>
  <text x="175" y="276" font-size="12" font-weight="bold" fill="#1a1a1a">HIGH FAULT MSB</text>
  <text x="175" y="291" font-size="11" fill="#6b7280">Поріг верхньої помилки (D15..D8)</text>

  <!-- Register Row 4: High Fault Threshold LSB -->
  <rect x="35" y="306" width="355" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="324" font-size="12" font-weight="bold" fill="#1a1a1a">0x04 (R) / 0x84 (W)</text>
  <text x="175" y="324" font-size="12" font-weight="bold" fill="#1a1a1a">HIGH FAULT LSB</text>
  <text x="175" y="339" font-size="11" fill="#6b7280">Поріг верхньої помилки (D7..D0)</text>

  <!-- Register Row 5: Low Fault Threshold MSB -->
  <rect x="35" y="354" width="355" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="372" font-size="12" font-weight="bold" fill="#1a1a1a">0x05 (R) / 0x85 (W)</text>
  <text x="175" y="372" font-size="12" font-weight="bold" fill="#1a1a1a">LOW FAULT MSB</text>
  <text x="175" y="387" font-size="11" fill="#6b7280">Поріг нижньої помилки (D15..D8)</text>

  <!-- Register Row 6: Low Fault Threshold LSB -->
  <rect x="35" y="402" width="355" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">0x06 (R) / 0x86 (W)</text>
  <text x="175" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">LOW FAULT LSB</text>
  <text x="175" y="435" font-size="11" fill="#6b7280">Поріг нижньої помилки (D7..D0)</text>

  <!-- Register Row 7: Fault Status (Read Only) -->
  <rect x="35" y="450" width="355" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="45" y="468" font-size="12" font-weight="bold" fill="#c0392b">0x07 (Read Only)</text>
  <text x="175" y="468" font-size="12" font-weight="bold" fill="#c0392b">FAULT STATUS</text>
  <text x="175" y="483" font-size="11" fill="#6b7280">Регістр прапорців апаратних помилок</text>

  <!-- Connector Line between Config Register and Right Panel -->
  <line x1="390" y1="134" x2="415" y2="134" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-accent)"/>

  <!-- Right Panel: Detailed Bit Breakdown -->
  <rect x="420" y="70" width="515" height="450" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="420" y="70" width="515" height="34" rx="6" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="677" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Деталізація конфігураційного регістру 0x00 (8 бітів)</text>

  <!-- Bit Header Bar (Bits 7 to 0) -->
  <rect x="430" y="113" width="59" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="459" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 7</text>
  <text x="459" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">VBIAS</text>

  <rect x="492" y="113" width="59" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="521" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 6</text>
  <text x="521" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CONV</text>

  <rect x="554" y="113" width="59" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="583" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 5</text>
  <text x="583" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1-SHOT</text>

  <rect x="616" y="113" width="59" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="645" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 4</text>
  <text x="645" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3-WIRE</text>

  <rect x="678" y="113" width="59" height="42" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="707" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 3</text>
  <text x="707" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">FAULT1</text>

  <rect x="740" y="113" width="59" height="42" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="769" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 2</text>
  <text x="769" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">FAULT0</text>

  <rect x="802" y="113" width="59" height="42" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="831" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 1</text>
  <text x="831" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CLR_FLT</text>

  <rect x="864" y="113" width="59" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="893" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Bit 0</text>
  <text x="893" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">50/60Hz</text>

  <!-- Left Column Bit Cards (Bits 7 to 4) -->
  <!-- Bit 7 Card -->
  <rect x="430" y="165" width="243" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="438" y="183" font-size="12" font-weight="bold" fill="#2457d6">Bit 7 — VBIAS (Напруга зсуву)</text>
  <text x="438" y="201" font-size="11" fill="#1a1a1a">1 = Увімкнено, 0 = Вимкнено (OFF)</text>
  <text x="438" y="217" font-size="11" fill="#6b7280">Потрібно вмикати перед вимірюванням</text>
  <text x="438" y="233" font-size="11" fill="#6b7280">для збудження опору PT100/PT1000</text>

  <!-- Bit 6 Card -->
  <rect x="430" y="251" width="243" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="438" y="269" font-size="12" font-weight="bold" fill="#2457d6">Bit 6 — CONV (Режим перетворення)</text>
  <text x="438" y="287" font-size="11" fill="#1a1a1a">1 = Автоматичне (Auto / Continuous)</text>
  <text x="438" y="303" font-size="11" fill="#1a1a1a">0 = Ручне / За запитом (Normally Off)</text>
  <text x="438" y="319" font-size="11" fill="#6b7280">Неперервний вимір або одиночні цикли</text>

  <!-- Bit 5 Card -->
  <rect x="430" y="337" width="243" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="438" y="355" font-size="12" font-weight="bold" fill="#2457d6">Bit 5 — 1-SHOT (Одиночний запуск)</text>
  <text x="438" y="373" font-size="11" fill="#1a1a1a">1 = Запуск одного циклу перетворення</text>
  <text x="438" y="389" font-size="11" fill="#6b7280">Працює при Bit 6 = 0 (Normally Off)</text>
  <text x="438" y="405" font-size="11" fill="#6b7280">Автоматично скидається в 0 після виміру</text>

  <!-- Bit 4 Card -->
  <rect x="430" y="423" width="243" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="438" y="441" font-size="12" font-weight="bold" fill="#2457d6">Bit 4 — 3-WIRE (Схема RTD)</text>
  <text x="438" y="459" font-size="11" fill="#1a1a1a">1 = 3-провідне підключення датчика</text>
  <text x="438" y="475" font-size="11" fill="#1a1a1a">0 = 2-провідне або 4-провідне</text>
  <text x="438" y="491" font-size="11" fill="#6b7280">Вмикає компенсацію дротів (FORCE2)</text>

  <!-- Right Column Bit Cards (Bits 3:2, Bit 1, Bit 0) -->
  <!-- Bits 3:2 Card -->
  <rect x="682" y="165" width="243" height="164" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="690" y="183" font-size="12" font-weight="bold" fill="#c0392b">Bits 3:2 — FAULT DETECT CYCLE</text>
  <text x="690" y="201" font-size="11" fill="#1a1a1a">00 = Без дій (No action / Normal)</text>
  <text x="690" y="217" font-size="11" fill="#1a1a1a">01 = Автовиявлення з затримкою</text>
  <text x="690" y="233" font-size="11" fill="#1a1a1a">10 = Ручний цикл 1 (перевірка кола)</text>
  <text x="690" y="249" font-size="11" fill="#1a1a1a">11 = Ручний цикл 2 (перевірка кола)</text>
  <text x="690" y="267" font-size="11" fill="#6b7280">Виявляє обрив дротів, коротке</text>
  <text x="690" y="283" font-size="11" fill="#6b7280">замикання та вихід за пороги</text>
  <text x="690" y="299" font-size="11" fill="#6b7280">High Fault / Low Fault threshold</text>
  <text x="690" y="315" font-size="11" fill="#6b7280">Автоматично повертається в 00</text>

  <!-- Bit 1 Card -->
  <rect x="682" y="337" width="243" height="78" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="690" y="355" font-size="12" font-weight="bold" fill="#27ae60">Bit 1 — FAULT CLEAR (Скидання)</text>
  <text x="690" y="373" font-size="11" fill="#1a1a1a">1 = Скидання регістру помилок 0x07</text>
  <text x="690" y="389" font-size="11" fill="#6b7280">Очищає прапорці несправностей</text>
  <text x="690" y="405" font-size="11" fill="#6b7280">Самоочищуваний біт (авто в 0)</text>

  <!-- Bit 0 Card -->
  <rect x="682" y="423" width="243" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="690" y="441" font-size="12" font-weight="bold" fill="#2457d6">Bit 0 — 50/60Hz FILTER SELECT</text>
  <text x="690" y="459" font-size="11" fill="#1a1a1a">1 = Фільтр 50 Гц (мережі ЄС/Україна)</text>
  <text x="690" y="475" font-size="11" fill="#1a1a1a">0 = Фільтр 60 Гц (мережі США)</text>
  <text x="690" y="491" font-size="11" fill="#6b7280">Пригнічення мережевої наводки</text>
</svg>
