<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">3-провідний міст Уітстона: компенсація опору дротів</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Рівні опори ліній r₁ = r₃ компенсуються у точці балансу, але виникає похибка при розбалансі</text>

  <!-- Left Panel: Schematic -->
  <rect x="25" y="75" width="545" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Схема мостового вимірювального тракту</text>

  <!-- Sub-Panel 1: Board Area -->
  <rect x="40" y="110" width="215" height="387" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="128" font-size="12" font-weight="bold" fill="#6b7280">Вимірювальна плата</text>

  <!-- Supply Node (+VEX) -->
  <text x="147.5" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">+VEX</text>
  <circle cx="147.5" cy="153" r="4" fill="#2457d6"/>
  <!-- Supply Wires -->
  <path d="M 147.5 153 L 80 153 L 80 178" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 147.5 153 L 215 153 L 215 178" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R1 -->
  <rect x="65" y="178" width="30" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">R₁</text>
  <line x1="80" y1="218" x2="80" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R2 -->
  <rect x="200" y="178" width="30" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="215" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">R₂</text>
  <line x1="215" y1="218" x2="215" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node A (VA) -->
  <circle cx="80" cy="255" r="4" fill="#1a1a1a"/>
  <text x="58" y="259" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">VA</text>
  <line x1="80" y1="255" x2="80" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node B (VB) -->
  <circle cx="215" cy="255" r="4" fill="#1a1a1a"/>
  <text x="230" y="245" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">VB</text>

  <!-- Resistor R3 -->
  <rect x="65" y="292" width="30" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">R₃</text>
  <line x1="80" y1="332" x2="80" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Differential Voltmeter Vout -->
  <circle cx="147.5" cy="255" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="147.5" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Vout</text>
  <!-- Meter Connections -->
  <line x1="80" y1="255" x2="127.5" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">−</text>
  <path d="M 190 330 L 190 255 L 167.5 255" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="183" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">+</text>

  <!-- Sub-Panel 2: Cable Area -->
  <rect x="270" y="110" width="165" height="387" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="352" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">З'єднувальний кабель</text>

  <!-- Wire 1 (r1) -->
  <text x="352" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дріт 1 (r₁)</text>
  <line x1="215" y1="255" x2="337" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="337" y="243" width="30" height="24" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">r₁</text>
  <line x1="367" y1="255" x2="490" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="285" y1="255" x2="305" y2="255" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="295" y="245" font-size="12" font-weight="bold" fill="#2457d6">I₂</text>

  <!-- Wire 2 (r2) -->
  <text x="352" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дріт 2 (r₂, I≈0)</text>
  <path d="M 490 255 L 460 255 L 460 330 L 367 330" fill="none" stroke="#2457d6" stroke-dasharray="3 3" stroke-width="1.5"/>
  <rect x="337" y="318" width="30" height="24" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">r₂</text>
  <line x1="337" y1="330" x2="190" y2="330" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="322" font-size="12" fill="#6b7280">I ≈ 0</text>

  <!-- Wire 3 (r3) -->
  <line x1="80" y1="420" x2="337" y2="420" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="337" y="408" width="30" height="24" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">r₃</text>
  <line x1="367" y1="420" x2="490" y2="420" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дріт 3 (r₃)</text>
  <line x1="285" y1="420" x2="305" y2="420" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="295" y="412" font-size="12" font-weight="bold" fill="#2457d6">I₁</text>

  <!-- Sub-Panel 3: Remote Probe -->
  <rect x="450" y="110" width="105" height="387" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="502" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Давач (Probe)</text>

  <!-- Terminal 1 (T1) -->
  <circle cx="490" cy="255" r="4" fill="#2457d6"/>
  <text x="502" y="259" font-size="12" font-weight="bold" fill="#2457d6">T1</text>
  <line x1="490" y1="255" x2="490" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- RTD Element -->
  <rect x="470" y="295" width="40" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="490" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">RTD</text>
  <text x="490" y="331" text-anchor="middle" font-size="12" fill="#6b7280">Pt100</text>

  <!-- Terminal 2 (T2) -->
  <line x1="490" y1="340" x2="490" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="490" cy="420" r="4" fill="#2457d6"/>
  <text x="502" y="424" font-size="12" font-weight="bold" fill="#2457d6">T2</text>

  <!-- Right Panel: Cards & Analysis -->
  <rect x="585" y="75" width="350" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Аналіз компенсації та похибок</text>

  <!-- Card 1: Balance condition -->
  <rect x="598" y="110" width="324" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="610" y="128" font-size="13" font-weight="bold" fill="#27ae60">1. Умова балансу (r₁ = r₃)</text>
  <text x="610" y="147" font-size="12" fill="#1a1a1a">Гілка A: VA = VEX · (R₃+r₃) / (R₁+R₃+r₃)</text>
  <text x="610" y="165" font-size="12" fill="#1a1a1a">Гілка B: VB = VEX · (RRTD+r₁) / (R₂+RRTD+r₁)</text>
  <text x="610" y="185" font-size="12" font-weight="bold" fill="#27ae60">При R₁=R₂ та r₁=r₃ ⟹ Vout = 0 при RRTD = R₃</text>
  <text x="610" y="203" font-size="12" fill="#27ae60">Опір однакових дротів повністю компенсується!</text>

  <!-- Card 2: Residual errors -->
  <rect x="598" y="242" width="324" height="135" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="610" y="260" font-size="13" font-weight="bold" fill="#c0392b">2. Залишкова похибка моста</text>
  <text x="610" y="278" font-size="12" font-weight="bold" fill="#c0392b">Асиметрія ліній (r₁ ≠ r₃):</text>
  <text x="610" y="295" font-size="12" fill="#1a1a1a">Δr = r₁ − r₃ викликає зміщення нуля:</text>
  <text x="610" y="311" font-size="12" fill="#1a1a1a">  ΔV ≈ VEX · Δr / 4R</text>
  <text x="610" y="331" font-size="12" font-weight="bold" fill="#c0392b">Нелінійність при розбалансі (RRTD ≠ R₃):</text>
  <text x="610" y="348" font-size="12" fill="#1a1a1a">При зміні T опір r₁ змінює чутливість моста</text>
  <text x="610" y="365" font-size="12" fill="#1a1a1a">і створює залишкову нелінійну похибку</text>

  <!-- Card 3: Role of wire r2 -->
  <rect x="598" y="389" width="324" height="108" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="610" y="407" font-size="13" font-weight="bold" fill="#2457d6">3. Роль вимірювального дроту r₂</text>
  <text x="610" y="426" font-size="12" fill="#1a1a1a">Дріт r₂ під'єднано до входу підсилювача/АЦП</text>
  <text x="610" y="444" font-size="12" fill="#1a1a1a">Високий опір: Ir₂ ≈ 0 A ⟹ Vr₂ = Ir₂ · r₂ = 0 В</text>
  <text x="610" y="464" font-size="12" font-weight="bold" fill="#2457d6">Опір дроту r₂ не вносить похибки у виміряння</text>
</svg>
