<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Проблема когерентності кеш-пам'яті L1 D-Cache та DMA в ARM Cortex-M7
  </text>
  <text x="480" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Контролер DMA працює безпосередньо з фізичною шиною RAM, оминаючи локальний кеш ядра процесора
  </text>

  <!-- Left: Scenario A - DMA Write (RX: Camera -> RAM) -->
  <g transform="translate(40, 95)">
    <rect width="425" height="415" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="425" height="34" rx="10" fill="#be123c"/>
    <text x="212" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Сценарій А: DMA запис у пам'ять (Прийом камери DCMI)
    </text>

    <!-- Sub-blocks -->
    <rect x="25" y="55" width="160" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="105" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Периферія DCMI</text>
    <text x="105" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Нові байти пікселів</text>

    <line x1="185" y1="85" x2="235" y2="85" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>

    <rect x="240" y="55" width="160" height="60" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Фізична пам'ять RAM</text>
    <text x="320" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">[Нові пікселі]</text>

    <!-- Incoherency with D-Cache -->
    <path d="M 320 115 L 320 180" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4"/>

    <rect x="240" y="185" width="160" height="60" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="320" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fecdd3">L1 D-Cache (Кеш)</text>
    <text x="320" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">[Застарілі дані!]</text>

    <!-- CPU Reading Stale -->
    <line x1="240" y1="215" x2="190" y2="215" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRed)"/>

    <rect x="25" y="185" width="160" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Cortex-M7 CPU</text>
    <text x="105" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Читає старе сміття</text>

    <!-- Danger Alert -->
    <rect x="25" y="270" width="375" height="125" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="40" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">
      Небезпека невідповідності (Stale Data):
    </text>
    <text x="40" y="318" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">1. DMA поклав новий кадр у фізичну RAM.</text>
    <text x="40" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">2. Ядро CPU читає адресу буфера, але потрапляє в D-Cache (Hit)</text>
    <text x="40" y="354" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">   і бачить старі байти до приходу кадру.</text>
    <text x="40" y="376" font-family="monospace" font-size="10" fill="#34d399">
      Вирішення: SCB_InvalidateDCache_by_Addr()
    </text>
  </g>

  <!-- Right: Scenario B - DMA Read (TX: RAM -> Display LTDC / SPI) -->
  <g transform="translate(495, 95)">
    <rect width="425" height="415" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="425" height="34" rx="10" fill="#0284c7"/>
    <text x="212" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Сценарій Б: DMA читання з пам'яті (Вивід на дисплей LTDC)
    </text>

    <!-- Sub-blocks -->
    <rect x="25" y="55" width="160" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Cortex-M7 CPU</text>
    <text x="105" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Малює інтерфейс UI</text>

    <line x1="185" y1="85" x2="235" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)"/>

    <rect x="240" y="55" width="160" height="60" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">L1 D-Cache (Dirty)</text>
    <text x="320" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#7dd3fc">[Свіжі пікселі UI]</text>

    <!-- Write-Back delay -->
    <path d="M 320 115 L 320 180" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4"/>

    <rect x="240" y="185" width="160" height="60" rx="6" fill="#450a0a" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="320" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fecdd3">Фізична пам'ять RAM</text>
    <text x="320" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">[Застарілий буфер]</text>

    <!-- DMA Reading Stale from RAM -->
    <line x1="240" y1="215" x2="190" y2="215" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRed)"/>

    <rect x="25" y="185" width="160" height="60" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <text x="105" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6">Контролер LTDC</text>
    <text x="105" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Читає старий кадр</text>

    <!-- Danger Alert -->
    <rect x="25" y="270" width="375" height="125" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="40" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
      Небезпека відкладеного запису (Write-Back):
    </text>
    <text x="40" y="318" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">1. Процесор намалював кнопку у D-Cache, але ще не скинув у RAM.</text>
    <text x="40" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">2. Контролер LTDC читає фізичну RAM і виводить старий кадр.</text>
    <text x="40" y="354" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">3. З'являється артефакт мерехтіння або затримка малювання.</text>
    <text x="40" y="376" font-family="monospace" font-size="10" fill="#34d399">
      Вирішення: SCB_CleanDCache_by_Addr()
    </text>
  </g>
</svg>