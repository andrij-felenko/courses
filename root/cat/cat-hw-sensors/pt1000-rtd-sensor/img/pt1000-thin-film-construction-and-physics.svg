<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad1)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Тонкоплівкова конструкція та топологія сенсора PT1000</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Керамічна підкладка Al2O3, платиновий меандр із лазерною підгонкою 1000 Ом та скляна пасивація</text>

  <!-- Physical Sensor Diagram -->
  <g transform="translate(50, 110)">
    <rect width="360" height="260" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="180" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Тонкоплівковий кристал PT1000 (SMD / Кріплення)</text>

    <!-- Ceramic Substrate (Al2O3) -->
    <rect x="30" y="50" width="300" height="180" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    <text x="180" y="70" fill="#8b949e" font-family="system-ui" font-size="11" text-anchor="middle">Керамічна підкладка Al2O3 (Висока теплопровідність)</text>

    <!-- Platinum Meander Layer (Pt thin-film) -->
    <g transform="translate(50, 85)">
      <!-- S-shaped meander tracks -->
      <path d="M 0 40 L 40 40 L 40 10 L 80 10 L 80 70 L 120 70 L 120 10 L 160 10 L 160 70 L 200 70 L 200 10 L 240 10 L 240 40 L 260 40" 
            fill="none" stroke="#e3b341" stroke-width="5"/>
      <text x="130" y="50" fill="#e3b341" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Платиновий меандр Pt (1000.0 Ω при 0 °C)</text>
    </g>

    <!-- Laser Trimming Notches -->
    <line x1="210" y1="95" x2="210" y2="115" stroke="#f85149" stroke-width="2"/>
    <line x1="215" y1="95" x2="215" y2="115" stroke="#f85149" stroke-width="2"/>
    <text x="212" y="130" fill="#f85149" font-family="sans-serif" font-size="8" text-anchor="middle">Лазерне</text>
    <text x="212" y="140" fill="#f85149" font-family="sans-serif" font-size="8" text-anchor="middle">підстроювання</text>

    <!-- Leads / Wire Terminals -->
    <!-- Left Lead -->
    <rect x="0" y="120" width="30" height="15" fill="#bc8cff"/>
    <line x1="-30" y1="127" x2="0" y2="127" stroke="#bc8cff" stroke-width="3"/>
    <text x="-40" y="132" fill="#bc8cff" font-family="monospace" font-size="11" text-anchor="end">Вивід 1 (Pt-Ni)</text>

    <!-- Right Lead -->
    <rect x="330" y="120" width="30" height="15" fill="#bc8cff"/>
    <line x1="360" y1="127" x2="390" y2="127" stroke="#bc8cff" stroke-width="3"/>
    <text x="400" y="132" fill="#bc8cff" font-family="monospace" font-size="11">Вивід 2 (Pt-Ni)</text>

    <!-- Glass Passivation Layer (Translucent overlay) -->
    <rect x="40" y="75" width="280" height="140" rx="4" fill="#58a6ff" opacity="0.15" stroke="#58a6ff" stroke-dasharray="3,3"/>
    <text x="180" y="205" fill="#58a6ff" font-family="system-ui" font-size="10" text-anchor="middle">Захисний шар силікатно-скляної глазурі (до +500 °C)</text>
  </g>

  <!-- IEC 60751 Specification Card -->
  <g transform="translate(470, 110)">
    <rect width="340" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Метрологічний стандарт IEC 60751</text>

    <text x="25" y="60" fill="#8b949e" font-family="system-ui" font-size="11">Базовий опір при 0 °C (R0):</text>
    <text x="25" y="80" fill="#f0f6fc" font-family="monospace" font-size="14" font-weight="bold">R0 = 1000.00 Ω (Класи A, B, 1/3 DIN)</text>

    <text x="25" y="110" fill="#8b949e" font-family="system-ui" font-size="11">Температурний коефіцієнт (TCR / α):</text>
    <text x="25" y="130" fill="#7ee787" font-family="monospace" font-size="13" font-weight="bold">α = 0.003851 °C^-1 (3850 ppm/K)</text>

    <text x="25" y="160" fill="#8b949e" font-family="system-ui" font-size="11">Чутливість (коефіцієнт dR/dT):</text>
    <text x="25" y="185" fill="#e3b341" font-family="monospace" font-size="16" font-weight="bold">3.85 Ω / °C (у 10 разів вище за PT100!)</text>

    <text x="25" y="215" fill="#8b949e" font-family="system-ui" font-size="11">Діапазон робочих температур:</text>
    <text x="25" y="235" fill="#f0f6fc" font-family="monospace" font-size="12">-200 °C .. +600 °C (стандарт: -50 .. +300 °C)</text>
  </g>

  <!-- Summary Banner -->
  <g transform="translate(50, 400)">
    <rect width="760" height="75" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="25" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Головна перевага високого номіналу R0 = 1000 Ом:</text>
    <text x="20" y="48" fill="#f0f6fc" font-family="monospace" font-size="12">Приріст сигналу 3.85 Ом/°C робить паразитний опір з'єднувальних проводів (0.5..1.0 Ом) майже непомітним,</text>
    <text x="20" y="66" fill="#7ee787" font-family="monospace" font-size="11">дозволяючи використовувати просту двопровідну схему підключення в автоматиці HVAC і автомобілях.</text>
  </g>
</svg>