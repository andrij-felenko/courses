<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові інтервали I2C для SHT30: Single Shot vs Periodic Mode</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Single Shot блокує шину SCL на час вимірювання; Periodic Mode дозволяє негайне зчитання даних через Fetch Data</text>

  <!-- Panel 1: Single Shot Mode -->
  <rect x="30" y="75" width="900" height="198" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel 1 Badges -->
  <rect x="45" y="90" width="280" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="185" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Single Shot Mode (з Clock Stretching)</text>

  <rect x="580" y="90" width="335" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="747.5" y="107" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шина I2C заблокована на час t_meas (4.5–15 мс)</text>

  <!-- Panel 1 I2C Blocks -->
  <rect x="50" y="132" width="165" height="44" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="132.5" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Cmd 0x2C06 (Single)</text>
  <text x="132.5" y="166" font-size="12" fill="#1a1a1a" text-anchor="middle">Start + Addr(W) + Cmd</text>

  <line x1="215" y1="154" x2="228" y2="154" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="230" y="132" width="440" height="44" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="450" y="150" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Clock Stretching (лінія SCL утримана в LOW)</text>
  <text x="450" y="166" font-size="12" fill="#c0392b" text-anchor="middle">SHT30 вимірює T &amp; RH — шина I2C повністю заблокована</text>

  <line x1="670" y1="154" x2="683" y2="154" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="685" y="132" width="225" height="44" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="797.5" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Read Data (6 Bytes)</text>
  <text x="797.5" y="166" font-size="12" fill="#1a1a1a" text-anchor="middle">Temp(2B)+CRC, RH(2B)+CRC</text>

  <!-- Panel 1 Timing & Notes -->
  <line x1="230" y1="198" x2="670" y2="198" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="230" y1="192" x2="230" y2="204" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="670" y1="192" x2="670" y2="204" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M238,194 L230,198 L238,202 Z" fill="#c0392b"/>
  <path d="M662,194 L670,198 L662,202 Z" fill="#c0392b"/>

  <rect x="350" y="212" width="200" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="450" y="228" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Затримка: t_meas = 4.5–15 мс</text>

  <text x="50" y="228" font-size="12" fill="#6b7280">Старт вимірювання</text>
  <text x="910" y="228" font-size="12" fill="#6b7280" text-anchor="end">Зчитування результату</text>

  <text x="450" y="258" font-size="12" font-style="italic" fill="#6b7280" text-anchor="middle">Недолік: МК не може спілкуватися з іншими I2C-пристроями, поки SHT30 тримає SCL у LOW</text>


  <!-- Panel 2: Periodic Mode -->
  <rect x="30" y="295" width="900" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Badges -->
  <rect x="45" y="310" width="270" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="180" y="327" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Periodic Mode (з Fetch Data)</text>

  <rect x="570" y="310" width="345" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="742.5" y="327" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шина вільна! Дані зчитуються миттєво (t_read ≈ 0.6 мс)</text>

  <!-- Background Process Row -->
  <text x="50" y="353" font-size="12" font-weight="bold" fill="#2457d6">Фоновий процес SHT30:</text>
  <text x="200" y="353" font-size="12" fill="#6b7280">Автономні вимірювання за внутрішнім таймером (наприклад, 1 mps)</text>

  <rect x="50" y="362" width="860" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <rect x="52" y="364" width="115" height="18" rx="3" fill="#2457d6"/>
  <text x="109.5" y="377" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Meas #1 (t_meas)</text>

  <line x1="167" y1="364" x2="167" y2="382" stroke="#27ae60" stroke-width="2"/>

  <text x="290" y="377" font-size="11" fill="#2457d6" text-anchor="middle">Пауза в режимі очікування (Sleep / Idle)</text>

  <rect x="430" y="364" width="115" height="18" rx="3" fill="#2457d6"/>
  <text x="487.5" y="377" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Meas #2 (t_meas)</text>

  <text x="665" y="377" font-size="11" fill="#2457d6" text-anchor="middle">Пауза (очікування наступного такту 1 сек)</text>

  <rect x="805" y="364" width="103" height="18" rx="3" fill="#2457d6"/>
  <text x="856.5" y="377" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Meas #3</text>

  <!-- I2C Bus Row -->
  <text x="50" y="403" font-size="12" font-weight="bold" fill="#1a1a1a">Шина I2C (Master):</text>
  <line x1="650" y1="412" x2="650" y2="388" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="658" y="403" font-size="12" font-weight="bold" fill="#27ae60">Зчитування з RAM</text>

  <rect x="50" y="412" width="140" height="42" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="429" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Cmd 0x2130</text>
  <text x="120" y="445" font-size="12" fill="#1a1a1a" text-anchor="middle">Start Periodic (1 mps)</text>

  <rect x="204" y="412" width="366" height="42" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="387" y="429" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шина I2C вільна для інших завдань</text>
  <text x="387" y="445" font-size="12" fill="#6b7280" text-anchor="middle">SHT30 не блокує SCL під час вимірювань</text>

  <rect x="584" y="412" width="132" height="42" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="650" y="429" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Cmd 0xE000</text>
  <text x="650" y="445" font-size="12" fill="#1a1a1a" text-anchor="middle">Fetch Data</text>

  <rect x="730" y="412" width="180" height="42" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="820" y="429" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Read 6 Bytes (T, RH)</text>
  <text x="820" y="445" font-size="12" fill="#1a1a1a" text-anchor="middle">Без затримки (без stretch)</text>

  <!-- Panel 2 Conclusion -->
  <text x="450" y="482" font-size="12" font-style="italic" fill="#27ae60" text-anchor="middle">Перевага: Мікроконтролер може зчитувати найновіші дані у будь-який момент за ~0.6 мс без очікування</text>
</svg>
