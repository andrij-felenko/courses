<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення цифрового давача SHT30 до мікроконтролера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Паралельний фільтрувальний конденсатор (100 нФ), підтяжка I2C та виводи ADDR, ALERT, nRESET</text>

  <!-- Left Panel: MCU -->
  <rect x="40" y="80" width="170" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <path d="M 40 88 A 8 8 0 0 1 48 80 L 202 80 A 8 8 0 0 1 210 88 L 210 122 L 40 122 Z" fill="#eaf0fd"/>
  <line x1="40" y1="122" x2="210" y2="122" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="100" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="125" y="116" font-size="12" fill="#6b7280" text-anchor="middle">(MCU / 3.3V Logic)</text>

  <!-- MCU Pins text -->
  <text x="195" y="150" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">3.3V (VDD)</text>
  <text x="195" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SCL (I2C)</text>
  <text x="195" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SDA (I2C)</text>
  <text x="195" y="360" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">GPIO (ALERT)</text>
  <text x="195" y="420" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO (nRESET)</text>
  <text x="195" y="480" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND (0V)</text>

  <!-- MCU Pin Nodes -->
  <circle cx="210" cy="150" r="4" fill="#c0392b"/>
  <circle cx="210" cy="220" r="4" fill="#1a1a1a"/>
  <circle cx="210" cy="290" r="4" fill="#1a1a1a"/>
  <circle cx="210" cy="360" r="4" fill="#2457d6"/>
  <circle cx="210" cy="420" r="4" fill="#1a1a1a"/>
  <circle cx="210" cy="480" r="4" fill="#1a1a1a"/>

  <!-- Right Panel: SHT30 -->
  <rect x="700" y="80" width="220" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <path d="M 700 88 A 8 8 0 0 1 708 80 L 912 80 A 8 8 0 0 1 920 80 L 920 122 L 700 122 Z" fill="#eaf0fd"/>
  <line x1="700" y1="122" x2="920" y2="122" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="810" y="100" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Давач SHT30</text>
  <text x="810" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Корпус DFN-8 (Sensirion)</text>

  <!-- SHT30 Pins text -->
  <text x="715" y="150" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Pin 5: VDD</text>
  <text x="715" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Pin 4: SCL</text>
  <text x="715" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Pin 1: SDA</text>
  <text x="715" y="360" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Pin 3: ALERT</text>
  <text x="715" y="420" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Pin 6: nRESET</text>
  <text x="715" y="455" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Pin 2: ADDR</text>
  <text x="715" y="480" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Pin 8: VSS (GND)</text>
  <text x="715" y="505" font-size="11" fill="#6b7280" text-anchor="start">Pin 7 (R) &amp; Die Pad ➔ GND</text>

  <!-- SHT30 Pin Nodes -->
  <circle cx="700" cy="150" r="4" fill="#c0392b"/>
  <circle cx="700" cy="220" r="4" fill="#1a1a1a"/>
  <circle cx="700" cy="290" r="4" fill="#1a1a1a"/>
  <circle cx="700" cy="360" r="4" fill="#2457d6"/>
  <circle cx="700" cy="420" r="4" fill="#1a1a1a"/>
  <circle cx="700" cy="455" r="4" fill="#27ae60"/>
  <circle cx="700" cy="480" r="4" fill="#1a1a1a"/>

  <!-- Main Connecting Bus Lines -->
  <!-- VDD Line (3.3V) -->
  <line x1="210" y1="150" x2="700" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="220" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VDD = 3.3V (2.15–5.5V)</text>

  <!-- SCL Line -->
  <line x1="210" y1="220" x2="700" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <text x="220" y="236" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">SCL (I2C Clock)</text>

  <!-- SDA Line -->
  <line x1="210" y1="290" x2="700" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <text x="220" y="306" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">SDA (I2C Data)</text>

  <!-- ALERT Line -->
  <line x1="700" y1="360" x2="210" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="220" y="376" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">ALERT (Сигнал тривоги / Переривання)</text>

  <!-- nRESET Line -->
  <line x1="210" y1="420" x2="700" y2="420" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="220" y="436" font-size="12" fill="#6b7280" text-anchor="start">nRESET (Активний LOW / Скидання)</text>

  <!-- ADDR Line -->
  <polyline points="700,455 660,455 660,480" fill="none" stroke="#27ae60" stroke-width="2"/>
  <circle cx="660" cy="480" r="3.5" fill="#27ae60"/>

  <!-- GND Line -->
  <line x1="210" y1="480" x2="700" y2="480" stroke="#1a1a1a" stroke-width="2"/>
  <text x="455" y="498" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільна шина заземлення (GND / VSS = 0V)</text>

  <!-- Components in Middle Area -->

  <!-- R1 (Pull-up for SCL) -->
  <circle cx="280" cy="150" r="3.5" fill="#c0392b"/>
  <line x1="280" y1="150" x2="280" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="272" y="172" width="16" height="26" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="280" y1="198" x2="280" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="280" cy="220" r="3.5" fill="#1a1a1a"/>
  <text x="296" y="182" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R1: 10 кОм</text>
  <text x="296" y="196" font-size="11" fill="#6b7280" text-anchor="start">(підтяжка SCL)</text>

  <!-- R2 (Pull-up for SDA) -->
  <circle cx="390" cy="150" r="3.5" fill="#c0392b"/>
  <line x1="390" y1="150" x2="390" y2="232" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="382" y="232" width="16" height="26" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="390" y1="258" x2="390" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="390" cy="290" r="3.5" fill="#1a1a1a"/>
  <text x="406" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R2: 10 кОм</text>
  <text x="406" y="256" font-size="11" fill="#6b7280" text-anchor="start">(підтяжка SDA)</text>

  <!-- R3 (Pull-up for nRESET) -->
  <circle cx="500" cy="150" r="3.5" fill="#c0392b"/>
  <line x1="500" y1="150" x2="500" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="492" y="372" width="16" height="26" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="500" y1="398" x2="500" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="500" cy="420" r="3.5" fill="#1a1a1a"/>
  <text x="516" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R3: 10 кОм</text>
  <text x="516" y="396" font-size="11" fill="#6b7280" text-anchor="start">(підтяжка nRESET)</text>

  <!-- C1 (Decoupling Capacitor near SHT30) -->
  <circle cx="620" cy="150" r="3.5" fill="#c0392b"/>
  <line x1="620" y1="150" x2="620" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="610" y1="175" x2="630" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="610" y1="183" x2="630" y2="183" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="620" y1="183" x2="620" y2="480" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="620" cy="480" r="3.5" fill="#1a1a1a"/>
  <text x="605" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1: 100 нФ</text>
  <text x="605" y="184" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">Кераміка X7R</text>
  <text x="605" y="197" font-size="11" fill="#6b7280" text-anchor="end">(біля піна VDD)</text>

  <!-- ADDR Config Panel -->
  <rect x="230" y="510" width="450" height="38" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="455" y="525" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ADDR ➔ GND  ➜  Адреса I2C = 0x44 (типова)</text>
  <text x="455" y="540" font-size="11" fill="#6b7280" text-anchor="middle">(якщо ADDR ➔ VDD  ➜  Адреса I2C = 0x45)</text>

</svg>
