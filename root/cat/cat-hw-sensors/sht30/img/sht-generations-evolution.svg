<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція поколінь Sensirion SHT: SHT1x → SHT2x → SHT3x</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Зменшення габаритів, перехід від Sensibus до I2C та інтеграція мікронагрівача</text>

  <!-- Card 1: SHT1x -->
  <rect x="35" y="80" width="250" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="92" width="230" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="160" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">SHT1x (1-ше пок.)</text>

  <rect x="45" y="132" width="230" height="106" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <!-- Package drawing LCC-8 -->
  <rect x="108" y="153" width="7" height="5" fill="#bdc3c7"/>
  <rect x="108" y="169.5" width="7" height="5" fill="#bdc3c7"/>
  <rect x="108" y="186" width="7" height="5" fill="#bdc3c7"/>
  <rect x="205" y="153" width="7" height="5" fill="#bdc3c7"/>
  <rect x="205" y="169.5" width="7" height="5" fill="#bdc3c7"/>
  <rect x="205" y="186" width="7" height="5" fill="#bdc3c7"/>
  <rect x="115" y="147" width="90" height="50" rx="3" fill="#34495e" stroke="#1a252f" stroke-width="1.5"/>
  <circle cx="160" cy="172" r="15" fill="#7f8c8d" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="160" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">7.5 × 5.0 мм (LCC-8)</text>

  <!-- Specs Card 1 -->
  <rect x="45" y="246" width="230" height="36" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="55" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">Інтерфейс</text>
  <text x="265" y="268" text-anchor="end" font-size="12" fill="#c0392b">Sensibus (custom)</text>

  <rect x="45" y="288" width="230" height="36" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="55" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Нагрівач</text>
  <text x="265" y="310" text-anchor="end" font-size="12" fill="#6b7280">Тестовий (базовий)</text>

  <rect x="45" y="330" width="230" height="36" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="55" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">Точність</text>
  <text x="265" y="352" text-anchor="end" font-size="12" fill="#6b7280">±3.0% ... ±4.5% RH</text>

  <rect x="45" y="372" width="230" height="56" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="55" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">Живлення</text>
  <text x="265" y="392" text-anchor="end" font-size="12" fill="#6b7280">2.4 В – 5.5 В</text>
  <text x="55" y="416" font-size="11" fill="#c0392b">Складна шина Sensibus</text>

  <!-- Arrow 1: SHT1x -> SHT2x -->
  <text x="320" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2010 р.</text>
  <line x1="292" y1="240" x2="348" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Card 2: SHT2x -->
  <rect x="355" y="80" width="250" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="365" y="92" width="230" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">SHT2x (2-ге пок.)</text>

  <rect x="365" y="132" width="230" height="106" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <!-- Package drawing DFN-6 -->
  <rect x="450" y="152" width="5" height="7" fill="#f1c40f"/>
  <rect x="450" y="168.5" width="5" height="7" fill="#f1c40f"/>
  <rect x="450" y="185" width="5" height="7" fill="#f1c40f"/>
  <rect x="505" y="152" width="5" height="7" fill="#f1c40f"/>
  <rect x="505" y="168.5" width="5" height="7" fill="#f1c40f"/>
  <rect x="505" y="185" width="5" height="7" fill="#f1c40f"/>
  <rect x="455" y="147" width="50" height="50" rx="3" fill="#34495e" stroke="#1a252f" stroke-width="1.5"/>
  <rect x="469" y="161" width="22" height="22" rx="2" fill="#7f8c8d" stroke="#bdc3c7" stroke-width="1"/>
  <text x="480" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3.0 × 3.0 мм (DFN-6)</text>

  <!-- Specs Card 2 -->
  <rect x="365" y="246" width="230" height="36" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="375" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">Інтерфейс</text>
  <text x="585" y="268" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">I2C / PWM / SDM</text>

  <rect x="365" y="288" width="230" height="36" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="375" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Нагрівач</text>
  <text x="585" y="310" text-anchor="end" font-size="12" fill="#6b7280">Вбудований (Heater)</text>

  <rect x="365" y="330" width="230" height="36" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="375" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">Точність</text>
  <text x="585" y="352" text-anchor="end" font-size="12" fill="#6b7280">±1.8% ... ±2.0% RH</text>

  <rect x="365" y="372" width="230" height="56" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="375" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">Живлення</text>
  <text x="585" y="392" text-anchor="end" font-size="12" fill="#6b7280">2.1 В – 3.6 В</text>
  <text x="375" y="416" font-size="11" fill="#2457d6">Стандартна шина I2C</text>

  <!-- Arrow 2: SHT2x -> SHT3x -->
  <text x="640" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2015 р.</text>
  <line x1="612" y1="240" x2="668" y2="240" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Card 3: SHT3x -->
  <rect x="675" y="80" width="250" height="360" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="685" y="92" width="230" height="32" rx="4" fill="#27ae60"/>
  <text x="800" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="white">SHT3x (3-тє пок.)</text>

  <rect x="685" y="132" width="230" height="106" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <!-- Package drawing DFN-8 -->
  <rect x="776" y="155" width="4" height="5" fill="#f1c40f"/>
  <rect x="776" y="163" width="4" height="5" fill="#f1c40f"/>
  <rect x="776" y="171" width="4" height="5" fill="#f1c40f"/>
  <rect x="776" y="179" width="4" height="5" fill="#f1c40f"/>
  <rect x="820" y="155" width="4" height="5" fill="#f1c40f"/>
  <rect x="820" y="163" width="4" height="5" fill="#f1c40f"/>
  <rect x="820" y="171" width="4" height="5" fill="#f1c40f"/>
  <rect x="820" y="179" width="4" height="5" fill="#f1c40f"/>
  <rect x="780" y="152" width="40" height="40" rx="3" fill="#34495e" stroke="#1a252f" stroke-width="1.5"/>
  <rect x="791" y="163" width="18" height="18" rx="2" fill="#7f8c8d" stroke="#bdc3c7" stroke-width="1"/>
  <path d="M793,172 h2 l2,-3 l2,6 l2,-6 l2,6 l1,-3 h2" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="800" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2.5 × 2.5 мм (DFN-8)</text>

  <!-- Specs Card 3 -->
  <rect x="685" y="246" width="230" height="36" rx="4" fill="white" stroke="#c8e6c9"/>
  <text x="695" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">Інтерфейс</text>
  <text x="905" y="268" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Fast I2C + Alert</text>

  <rect x="685" y="288" width="230" height="36" rx="4" fill="white" stroke="#c8e6c9"/>
  <text x="695" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Нагрівач</text>
  <text x="905" y="310" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Мікронагрівач (Micro)</text>

  <rect x="685" y="330" width="230" height="36" rx="4" fill="white" stroke="#c8e6c9"/>
  <text x="695" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">Точність</text>
  <text x="905" y="352" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">±1.5% RH (Висока)</text>

  <rect x="685" y="372" width="230" height="56" rx="4" fill="white" stroke="#c8e6c9"/>
  <text x="695" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">Живлення</text>
  <text x="905" y="392" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">2.15 В – 5.5 В</text>
  <text x="695" y="416" font-size="11" font-weight="bold" fill="#27ae60">Максимальна інтеграція</text>

  <!-- Bottom Summary Bar -->
  <rect x="35" y="455" width="890" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Column 1 -->
  <text x="180" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Площа корпусу</text>
  <text x="180" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">37.5 мм² → 9.0 мм² → 6.25 мм² (-83%)</text>
  <line x1="331" y1="461" x2="331" y2="503" stroke="#d0d7de" stroke-width="1"/>

  <!-- Column 2 -->
  <text x="480" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Шина даних</text>
  <text x="480" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Sensibus → Standard I2C → Fast I2C</text>
  <line x1="627" y1="461" x2="627" y2="503" stroke="#d0d7de" stroke-width="1"/>

  <!-- Column 3 -->
  <text x="775" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Функціонал та нагрівач</text>
  <text x="775" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Тестовий → On-chip → Programmable</text>
</svg>
