<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" width="960" height="495" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="495" fill="white"/>

  <!-- Маркери для стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-start-green" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія друкованої плати з терморозв'язкою давача SHT30</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Фрезеровані прорізи та мінімізовані доріжки блокують кондуктивний нагрів сенсора</text>

  <!-- ЛІВА ПАНЕЛЬ: НЕПРАВИЛЬНО -->
  <g id="panel-left">
    <rect x="40" y="82" width="420" height="390" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <rect x="52" y="94" width="396" height="30" rx="4" fill="#c0392b"/>
    <text x="250" y="114" font-size="14" font-weight="bold" fill="white" text-anchor="middle">НЕПРАВИЛЬНО: Паразитний нагрів сенсора</text>

    <!-- Текстоліт плати -->
    <rect x="60" y="137" width="380" height="235" rx="6" fill="#2d5a27" stroke="#1e3e1a" stroke-width="2"/>

    <!-- Джерело тепла (MCU / LDO) -->
    <ellipse cx="125" cy="235" rx="55" ry="50" fill="#e74c3c" opacity="0.25"/>
    <rect x="80" y="190" width="90" height="90" rx="4" fill="#34495e" stroke="#1a252f"/>
    <text x="125" y="230" font-size="13" font-weight="bold" fill="white" text-anchor="middle">MCU / LDO</text>
    <text x="125" y="250" font-size="12" fill="#f1948a" text-anchor="middle">P_heat &gt; 0.5 Вт</text>

    <!-- Підпис доріжок -->
    <text x="250" y="195" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle"><tspan x="250" dy="0">Суцільна мідь</tspan><tspan x="250" dy="15">широкі доріжки</tspan></text>
    <rect x="170" y="222" width="160" height="26" fill="#d4ac0d" stroke="#b7950b"/>

    <!-- Тепловий потік -->
    <path d="M 170 235 L 315 235" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
    <text x="250" y="268" font-size="12" font-weight="bold" fill="#f1948a" text-anchor="middle">Тепловий потік Q_heat</text>

    <!-- Чип SHT30 -->
    <rect x="330" y="207.5" width="55" height="55" rx="3" fill="#1a1a1a" stroke="#c0392b" stroke-width="2"/>
    <text x="357.5" y="240" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SHT30</text>

    <!-- Попередження про перегрів -->
    <rect x="300" y="295" width="130" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="365" y="315" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Нагрів сенсора!</text>
    <text x="365" y="333" font-size="12" fill="#c0392b" text-anchor="middle">T_sensor &gt; T_ambient</text>
    <line x1="357.5" y1="264" x2="357.5" y2="293" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>

    <!-- Нижній блок опису -->
    <rect x="52" y="385" width="396" height="72" rx="6" fill="white" stroke="#e74c3c" stroke-width="1"/>
    <text x="64" y="405" font-size="12" fill="#c0392b">• Тепло вільно поширюється через текстоліт та мідь</text>
    <text x="64" y="425" font-size="12" font-weight="bold" fill="#c0392b">• Похибка вимірювання температури: +1.5 °C ... +3.0 °C</text>
    <text x="64" y="445" font-size="12" fill="#6b7280">• Викривлення відносної вологості: RH занижено на 8–15%</text>
  </g>

  <!-- ПРАВА ПАНЕЛЬ: ПРАВИЛЬНО -->
  <g id="panel-right">
    <rect x="500" y="82" width="420" height="390" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="512" y="94" width="396" height="30" rx="4" fill="#27ae60"/>
    <text x="710" y="114" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ПРАВИЛЬНО: Ефективна терморозв'язка</text>

    <!-- Текстоліт плати -->
    <rect x="520" y="137" width="380" height="235" rx="6" fill="#2d5a27" stroke="#1e3e1a" stroke-width="2"/>

    <!-- Лінія відстані -->
    <text x="692.5" y="148" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Відстань d ≥ 15–20 мм</text>
    <line x1="575" y1="154" x2="810" y2="154" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-green)"/>

    <!-- Заблоковане тепло -->
    <text x="572" y="180" font-size="12" font-weight="bold" fill="#ff9999" text-anchor="middle">Q_heat заблоковано</text>
    <path d="M 612 220 C 638 220 642 198 625 190" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

    <!-- Джерело тепла (MCU / LDO) -->
    <ellipse cx="572" cy="235" rx="45" ry="45" fill="#e74c3c" opacity="0.25"/>
    <rect x="532" y="195" width="80" height="80" rx="4" fill="#34495e" stroke="#1a252f"/>
    <text x="572" y="240" font-size="13" font-weight="bold" fill="white" text-anchor="middle">MCU / LDO</text>

    <!-- Фрезеровані ізоляційні прорізи (вирізи у платі) -->
    <rect x="645" y="171" width="220" height="18" fill="#e9f7ef" stroke="#7f8c8d" stroke-dasharray="3 3"/>
    <rect x="645" y="285" width="220" height="18" fill="#e9f7ef" stroke="#7f8c8d" stroke-dasharray="3 3"/>
    <rect x="865" y="171" width="18" height="132" fill="#e9f7ef" stroke="#7f8c8d" stroke-dasharray="3 3"/>
    <text x="755" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фрезеровані ізоляційні прорізи</text>

    <!-- Острівець давача -->
    <rect x="712" y="189" width="153" height="96" fill="#2d5a27" stroke="#1e3e1a"/>

    <!-- Вузький місток з доріжками -->
    <text x="662.5" y="204" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle"><tspan x="662.5" dy="0">Вузькі доріжки</tspan><tspan x="662.5" dy="14">(w ≤ 0.2 мм)</tspan></text>

    <rect x="612" y="225" width="100" height="35" fill="#2d5a27"/>
    <line x1="612" y1="229" x2="780" y2="229" stroke="#e74c3c" stroke-width="1.5"/>
    <line x1="612" y1="236" x2="780" y2="236" stroke="#2980b9" stroke-width="1.5"/>
    <line x1="612" y1="243" x2="780" y2="243" stroke="#f39c12" stroke-width="1.5"/>
    <line x1="612" y1="250" x2="780" y2="250" stroke="#27ae60" stroke-width="1.5"/>

    <!-- Конденсатор розв'язки -->
    <rect x="725" y="222" width="14" height="26" fill="#d35400" stroke="#a04000" rx="2"/>
    <text x="732" y="263" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">100 nF</text>

    <!-- Чип SHT30 -->
    <rect x="780" y="207.5" width="55" height="55" rx="3" fill="#1a1a1a" stroke="#27ae60" stroke-width="2"/>
    <text x="807.5" y="240" font-size="13" font-weight="bold" fill="white" text-anchor="middle">SHT30</text>

    <!-- Позначення острівця -->
    <text x="785" y="328" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Сенсорний острівець</text>
    <text x="785" y="348" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">T_island = T_ambient</text>

    <!-- Нижній блок опису -->
    <rect x="512" y="385" width="396" height="72" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
    <text x="524" y="405" font-size="12" font-weight="bold" fill="#27ae60">• Пази блокують кондуктивний тепловий потік на 90–95%</text>
    <text x="524" y="425" font-size="12" fill="#27ae60">• Температура острівця дорівнює температурі довкілля</text>
    <text x="524" y="445" font-size="12" fill="#6b7280">• Забезпечено паспортну точність SHT30 (±0.2 °C, ±2% RH)</text>
  </g>
</svg>
