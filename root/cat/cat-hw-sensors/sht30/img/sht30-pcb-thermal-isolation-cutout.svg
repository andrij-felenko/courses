<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="550" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Теплова ізоляція та розташування SHT30 на друкованій платі</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Фрезерований U-паз усуває кондуктивний нагрів від МК, а винесення R_pu запобігає похибці T/RH</text>

  <!-- Top Status Banners -->
  <rect x="50" y="78" width="410" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="255" y="96" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Джерело тепла (МК / LDO): P &gt; 100 мВт</text>
  <text x="255" y="114" font-size="12" fill="#1a1a1a" text-anchor="middle">Створює тепловий потік Q через мідь плати</text>

  <rect x="500" y="78" width="410" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="705" y="96" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Теплова розв&apos;язка (U-подібний паз PCB)</text>
  <text x="705" y="114" font-size="12" fill="#1a1a1a" text-anchor="middle">Повітряний бар&apos;єр зупиняє передачу тепла</text>

  <!-- Main PCB Board Container -->
  <rect x="50" y="145" width="860" height="315" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- MCU Section (Left Side) -->
  <text x="160" y="172" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Гаряча зона PCB</text>

  <!-- MCU Board Outer Box -->
  <rect x="85" y="185" width="150" height="150" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <!-- MCU Silicon Package -->
  <rect x="105" y="205" width="110" height="110" rx="4" fill="#1a1a1a"/>

  <!-- MCU Pins -->
  <rect x="100" y="220" width="5" height="8" fill="#d0d7de"/>
  <rect x="100" y="240" width="5" height="8" fill="#d0d7de"/>
  <rect x="100" y="260" width="5" height="8" fill="#d0d7de"/>
  <rect x="100" y="280" width="5" height="8" fill="#d0d7de"/>
  <rect x="215" y="220" width="5" height="8" fill="#d0d7de"/>
  <rect x="215" y="240" width="5" height="8" fill="#d0d7de"/>
  <rect x="215" y="260" width="5" height="8" fill="#d0d7de"/>
  <rect x="215" y="280" width="5" height="8" fill="#d0d7de"/>

  <!-- MCU Labels -->
  <text x="160" y="252" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MCU / SoC</text>
  <text x="160" y="275" font-size="12" fill="#fdecea" text-anchor="middle">P &gt; 100 мВт</text>
  <text x="160" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Основне джерело тепла</text>

  <!-- Heat Flow Conduction Lines -->
  <text x="345" y="172" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Тепловий потік Q (мідний шар PCB)</text>
  <line x1="240" y1="200" x2="370" y2="200" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>
  <line x1="240" y1="256" x2="370" y2="256" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>

  <!-- Thermal Barrier Badge -->
  <rect x="375" y="215" width="90" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="420" y="232" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Бар&apos;єр Q ≈ 0</text>

  <!-- Pull-up Resistors Area -->
  <rect x="260" y="315" width="175" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="347.5" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підтягуючі резистори I2C</text>

  <!-- Resistor 1 -->
  <rect x="275" y="345" width="45" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="297.5" y="359" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R1</text>
  <text x="330" y="359" font-size="12" fill="#1a1a1a" text-anchor="start">10 кОм (SDA)</text>

  <!-- Resistor 2 -->
  <rect x="275" y="375" width="45" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="297.5" y="389" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R2</text>
  <text x="330" y="389" font-size="12" fill="#1a1a1a" text-anchor="start">10 кОм (SCL)</text>

  <text x="347.5" y="432" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Винесені з острова (без нагріву)</text>

  <!-- Milled U-Slot Air Barrier Path (Single Continuous Polygon - No Overlapping Rectangles) -->
  <path d="M 450,265 L 450,170 L 735,170 L 735,420 L 450,420 L 450,335 L 475,335 L 475,395 L 710,395 L 710,195 L 475,195 L 475,265 Z" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Slot Labels -->
  <text x="592.5" y="187" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Фрезерований U-паз (повітряний бар&apos;єр)</text>
  <text x="592.5" y="411" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Ширина вирізу d ≥ 1.5–2.0 мм</text>

  <!-- PCB Bridge Section -->
  <rect x="450" y="265" width="65" height="70" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="445" y1="277" x2="515" y2="277" stroke="#2457d6" stroke-width="2"/>
  <line x1="445" y1="291" x2="515" y2="291" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="445" y1="305" x2="515" y2="305" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="319" x2="515" y2="319" stroke="#27ae60" stroke-width="2"/>
  <text x="495" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Місток</text>
  <text x="495" y="256" font-size="11" fill="#6b7280" text-anchor="middle">ліній</text>

  <!-- Sensor Island -->
  <rect x="515" y="200" width="195" height="190" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="612.5" y="220" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Ізольований острівець SHT30</text>

  <!-- SHT30 Chip Body -->
  <rect x="577.5" y="232" width="70" height="65" rx="4" fill="#1a1a1a" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="587.5" cy="242" r="3" fill="#ffffff"/>

  <!-- SHT30 Pins -->
  <rect x="572.5" y="240" width="5" height="6" fill="#d0d7de"/>
  <rect x="572.5" y="252" width="5" height="6" fill="#d0d7de"/>
  <rect x="572.5" y="264" width="5" height="6" fill="#d0d7de"/>
  <rect x="572.5" y="276" width="5" height="6" fill="#d0d7de"/>
  <rect x="647.5" y="240" width="5" height="6" fill="#d0d7de"/>
  <rect x="647.5" y="252" width="5" height="6" fill="#d0d7de"/>
  <rect x="647.5" y="264" width="5" height="6" fill="#d0d7de"/>
  <rect x="647.5" y="276" width="5" height="6" fill="#d0d7de"/>

  <!-- SHT30 Labels -->
  <text x="612.5" y="260" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SHT30</text>
  <text x="612.5" y="276" font-size="11" fill="#eaf0fd" text-anchor="middle">DFN-8</text>

  <!-- Built-in Heater Section -->
  <rect x="527.5" y="308" width="170" height="68" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="612.5" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вбудований мікронагрівач</text>
  <text x="612.5" y="342" font-size="11" fill="#1a1a1a" text-anchor="middle">Періодична дегазація</text>
  <text x="612.5" y="358" font-size="11" fill="#6b7280" text-anchor="middle">та зняття конденсату</text>

  <!-- Ambient Sensing Area -->
  <line x1="885" y1="245" x2="760" y2="245" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="885" y1="345" x2="760" y2="345" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="822.5" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Повітряний потік</text>
  <text x="822.5" y="275" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">T_amb , RH_amb</text>
  <text x="822.5" y="297" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимірювання без</text>
  <text x="822.5" y="315" font-size="12" fill="#1a1a1a" text-anchor="middle">теплового зсуву</text>

  <!-- Bottom Rules Panel -->
  <rect x="50" y="475" width="860" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="190" y="504" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Ширина вирізу d ≥ 1.5 мм</text>
  <text x="480" y="504" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Полігони GND/VCC розірвані</text>
  <text x="770" y="504" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. R_pu поза островом</text>
</svg>
