<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Монолітна архітектура Sensirion CMOSens (SHT30)</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Ємнісний сенсор вологості, давач температури та АЦП на єдиному кремнієвому кристалі</text>

  <!-- Main Container Panel -->
  <rect x="30" y="80" width="900" height="415" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Container Header Labels -->
  <rect x="50" y="92" width="280" height="24" rx="4" fill="#2457d6"/>
  <text x="190" y="108" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">МОНОЛІТНИЙ КРИСТАЛ (CMOSENS DIE)</text>

  <rect x="610" y="92" width="300" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="760" y="108" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Без зовнішніх міжкомпонентних провідників</text>

  <!-- Component 1: RH Sensor & Heater -->
  <rect x="50" y="126" width="270" height="199" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="50" y="126" width="270" height="30" rx="8" fill="#eaf0fd"/>
  <rect x="50" y="146" width="270" height="10" fill="#eaf0fd"/>
  <text x="185" y="146" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Чутливий елемент вологості (RH)</text>

  <circle cx="120" cy="155" r="3.5" fill="#3b82f6"/>
  <circle cx="185" cy="153" r="4.5" fill="#2457d6"/>
  <circle cx="250" cy="155" r="3.5" fill="#3b82f6"/>
  <text x="185" y="175" font-size="12" fill="#2457d6" text-anchor="middle">Молекули вологи (H₂O)</text>

  <rect x="65" y="182" width="240" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="185" y="198" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Гігроскопічний полімер (εᵣ)</text>

  <rect x="65" y="212" width="240" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <line x1="75" y1="217" x2="75" y2="231" stroke="#b45309" stroke-width="2"/>
  <line x1="75" y1="220" x2="240" y2="220" stroke="#b45309" stroke-width="1.5"/>
  <line x1="75" y1="228" x2="240" y2="228" stroke="#b45309" stroke-width="1.5"/>
  <line x1="295" y1="217" x2="295" y2="231" stroke="#b45309" stroke-width="2"/>
  <line x1="295" y1="224" x2="130" y2="224" stroke="#b45309" stroke-width="1.5"/>
  <line x1="295" y1="230" x2="130" y2="230" stroke="#b45309" stroke-width="1.5"/>
  <text x="185" y="246" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Гребінчасті електроди (C_RH)</text>

  <rect x="65" y="260" width="240" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="185" y="277" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Мікронагрівач (Heater)</text>

  <text x="185" y="308" font-size="12" fill="#6b7280" text-anchor="middle">Зміна εᵣ → зміна ємності C_RH</text>

  <!-- Component 2: Temperature Sensor -->
  <rect x="340" y="126" width="220" height="199" rx="8" fill="#ffffff" stroke="#e07a5f" stroke-width="1.5"/>
  <rect x="340" y="126" width="220" height="30" rx="8" fill="#fbebe8"/>
  <rect x="340" y="146" width="220" height="10" fill="#fbebe8"/>
  <text x="450" y="146" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Давач температури (T)</text>

  <rect x="355" y="175" width="190" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="365" y="180" width="80" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="405" y="198" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">P-область</text>
  <rect x="455" y="180" width="80" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="495" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N-область</text>

  <text x="450" y="243" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bandgap / PTAT елемент</text>

  <rect x="355" y="256" width="190" height="26" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="450" y="273" font-size="12" fill="#4b5563" text-anchor="middle">Прямий тепловий контакт</text>

  <text x="450" y="308" font-size="12" fill="#6b7280" text-anchor="middle">V_PTAT ∝ T (Кельвін)</text>

  <!-- Component 3: Signal Processing & I2C -->
  <rect x="580" y="126" width="330" height="199" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="580" y="126" width="330" height="30" rx="8" fill="#e9f7ef"/>
  <rect x="580" y="146" width="330" height="10" fill="#e9f7ef"/>
  <text x="745" y="146" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Схема обробки сигналів та I2C</text>

  <rect x="595" y="168" width="140" height="38" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="665" y="191" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підсилювач (AFE)</text>

  <rect x="755" y="168" width="140" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="825" y="191" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">АЦП 16-біт (ΣΔ)</text>

  <line x1="735" y1="187" x2="753" y2="187" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="595" y="222" width="140" height="38" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="665" y="245" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пам'ять OTP (Calib)</text>

  <rect x="755" y="222" width="140" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="825" y="245" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I2C / CRC-8 / Control</text>

  <line x1="825" y1="206" x2="825" y2="220" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="735" y1="241" x2="753" y2="241" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="585" y="274" width="320" height="36" rx="6" fill="#1a1a1a"/>
  <text x="745" y="296" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Виводи: VDD | VSS | SCL | SDA | ADDR | ALERT</text>

  <!-- Monolithic Interconnect Bus -->
  <path d="M 320,270 L 335,270 L 335,366 L 575,366 L 575,187 L 593,187" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <path d="M 560,270 L 575,270" fill="none" stroke="#e07a5f" stroke-width="2" stroke-dasharray="5,3"/>

  <rect x="355" y="334" width="210" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="460" y="348" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Внутрішня металізація CMOS</text>

  <!-- Silicon Substrate -->
  <rect x="50" y="380" width="860" height="65" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="407" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Спільна кремнієва підкладка (Monolithic P-type Silicon Substrate)</text>
  <text x="480" y="427" font-size="12" fill="#64748b" text-anchor="middle">Виготовлено за єдиним технологічним процесом CMOS</text>

  <!-- Bottom Key Takeaway Banner -->
  <rect x="50" y="455" width="860" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="474" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ключова перевага CMOSens: відсутність міжкомпонентних дротів мінімізує паразитивні ємності та шуми</text>
</svg>
