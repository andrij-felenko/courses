<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad1)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Архітектура та цоколівка сенсора DHT22 (AM2302 / RHT03)</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Ємнісний датчик вологості, прецизійний NTC-термістор та вбудований калібрувальний 8-бітний контролер</text>

  <!-- Package Outer View -->
  <g transform="translate(40, 110)">
    <rect width="180" height="280" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    
    <!-- Vent Grill -->
    <rect x="30" y="30" width="120" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <line x1="45" y1="45" x2="135" y2="45" stroke="#8b949e" stroke-width="2"/>
    <line x1="45" y1="60" x2="135" y2="60" stroke="#8b949e" stroke-width="2"/>
    <line x1="45" y1="75" x2="135" y2="75" stroke="#8b949e" stroke-width="2"/>
    <line x1="45" y1="90" x2="135" y2="90" stroke="#8b949e" stroke-width="2"/>
    <line x1="45" y1="105" x2="135" y2="105" stroke="#8b949e" stroke-width="2"/>

    <text x="90" y="160" fill="#f0f6fc" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">DHT22</text>
    <text x="90" y="180" fill="#58a6ff" font-family="monospace" font-size="12" text-anchor="middle">AM2302</text>

    <!-- 4 Pins at bottom -->
    <!-- Pin 1: VDD -->
    <rect x="25" y="280" width="10" height="60" fill="#f85149"/>
    <text x="30" y="360" fill="#f85149" font-family="monospace" font-size="11" text-anchor="middle">1:VDD</text>
    <text x="30" y="375" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">3.3-5.5V</text>

    <!-- Pin 2: DATA -->
    <rect x="65" y="280" width="10" height="60" fill="#58a6ff"/>
    <text x="70" y="360" fill="#58a6ff" font-family="monospace" font-size="11" text-anchor="middle">2:SDA</text>
    <text x="70" y="375" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Data/I/O</text>

    <!-- Pin 3: NC -->
    <rect x="105" y="280" width="10" height="60" fill="#8b949e"/>
    <text x="110" y="360" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">3:NC</text>
    <text x="110" y="375" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Не підкл.</text>

    <!-- Pin 4: GND -->
    <rect x="145" y="280" width="10" height="60" fill="#3fb950"/>
    <text x="150" y="360" fill="#3fb950" font-family="monospace" font-size="11" text-anchor="middle">4:GND</text>
    <text x="150" y="375" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">0 В</text>
  </g>

  <!-- Internal Architecture Block Diagram -->
  <g transform="translate(270, 110)">
    <rect width="530" height="340" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="35" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Внутрішня структура датчика AM2302</text>

    <!-- Humidity Sensing Element (Capacitive Polymer) -->
    <g transform="translate(30, 60)">
      <rect width="180" height="70" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="90" y="28" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Ємнісний полімерний сенсор</text>
      <text x="90" y="48" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">Вологість 0..99.9% RH (±2%)</text>
    </g>

    <!-- Temperature Sensing Element (NTC) -->
    <g transform="translate(30, 150)">
      <rect width="180" height="70" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
      <text x="90" y="28" fill="#d29922" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Прецизійний NTC термістор</text>
      <text x="90" y="48" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">-40..+80 °C (±0.5 °C)</text>
    </g>

    <!-- Internal Controller Module -->
    <g transform="translate(280, 60)">
      <rect width="210" height="160" rx="6" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="105" y="28" fill="#bc8cff" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Вбудований 8-бітний МК</text>
      
      <rect x="20" y="45" width="170" height="30" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
      <text x="105" y="65" fill="#f0f6fc" font-family="sans-serif" font-size="11" text-anchor="middle">14-бітний сигнальний АЦП</text>

      <rect x="20" y="85" width="170" height="30" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
      <text x="105" y="105" fill="#f0f6fc" font-family="sans-serif" font-size="11" text-anchor="middle">Калібрувальна OTP ROM</text>

      <rect x="20" y="125" width="170" height="25" rx="4" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
      <text x="105" y="142" fill="#7ee787" font-family="sans-serif" font-size="10" text-anchor="middle">Формувач 40-бітного пакету</text>
    </g>

    <!-- Arrows from sensors to MCU -->
    <path d="M 210 95 L 280 95" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 210 185 L 245 185 L 245 130 L 280 130" stroke="#d29922" stroke-width="2" fill="none"/>

    <!-- Open-Drain Driver at output -->
    <g transform="translate(280, 240)">
      <rect width="210" height="80" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="105" y="25" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Вихідний буфер Open-Drain</text>
      <text x="105" y="48" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">N-канальний MOSFET із підтяжкою</text>
      <text x="105" y="68" fill="#7ee787" font-family="monospace" font-size="10" text-anchor="middle">SDA Data Line (1 провід)</text>
    </g>
    <path d="M 385 220 L 385 240" stroke="#bc8cff" stroke-width="2" fill="none"/>
  </g>
</svg>