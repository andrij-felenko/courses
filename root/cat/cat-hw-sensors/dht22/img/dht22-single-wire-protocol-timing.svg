<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad2)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Часові діаграми протоколу Single-Wire для DHT22 / AM2302</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Послідовність: Старт МК (1–10 мс) → Відповідь сенсора (80+80 мкс) → 40 біт даних → Завершення</text>

  <!-- Waveform Canvas -->
  <g transform="translate(30, 110)">
    <!-- Signal Level Labels -->
    <text x="10" y="55" fill="#f85149" font-family="monospace" font-size="11">HIGH (VDD)</text>
    <text x="10" y="145" fill="#3fb950" font-family="monospace" font-size="11">LOW (GND)</text>

    <!-- Grid lines -->
    <line x1="80" y1="50" x2="800" y2="50" stroke="#30363d" stroke-dasharray="2,2"/>
    <line x1="80" y1="140" x2="800" y2="140" stroke="#30363d" stroke-dasharray="2,2"/>

    <!-- Waveform Path -->
    <!-- 1. Idle (High) -->
    <!-- 2. MCU Start: Pulls low 1..10 ms -->
    <!-- 3. MCU Releases: Pull-up takes it high 20..40 us -->
    <!-- 4. DHT Response: Pulls low 80 us -->
    <!-- 5. DHT Response: Pulls high 80 us -->
    <!-- 6. Bit 0 Transmission: 50 us low, 26 us high -->
    <!-- 7. Bit 1 Transmission: 50 us low, 70 us high -->
    <!-- 8. End of transmission: pulls low 50 us then idle high -->

    <path d="M 80 50 L 120 50 L 120 140 L 250 140 L 250 50 L 290 50 L 290 140 L 370 140 L 370 50 L 450 50 L 450 140 L 510 140 L 510 50 L 550 50 L 550 140 L 610 140 L 610 50 L 710 50 L 710 140 L 750 140 L 750 50 L 800 50" 
          fill="none" stroke="#58a6ff" stroke-width="3"/>

    <!-- Section 1: MCU Master Start -->
    <rect x="120" y="170" width="170" height="50" rx="4" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/>
    <text x="205" y="192" fill="#f85149" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">1. Старт хоста (MCU)</text>
    <text x="205" y="210" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">Low: 1–10 мс | High: 20–40 мкс</text>
    <line x1="120" y1="150" x2="120" y2="170" stroke="#f85149" stroke-dasharray="2,2"/>
    <line x1="290" y1="150" x2="290" y2="170" stroke="#f85149" stroke-dasharray="2,2"/>

    <!-- Section 2: Sensor ACK -->
    <rect x="290" y="235" width="160" height="50" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
    <text x="370" y="257" fill="#d29922" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">2. Відповідь сенсора (ACK)</text>
    <text x="370" y="275" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">Low: 80 мкс | High: 80 мкс</text>
    <line x1="290" y1="150" x2="290" y2="235" stroke="#d29922" stroke-dasharray="2,2"/>
    <line x1="450" y1="150" x2="450" y2="235" stroke="#d29922" stroke-dasharray="2,2"/>

    <!-- Section 3: Data Bit 0 -->
    <rect x="450" y="170" width="100" height="50" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
    <text x="500" y="192" fill="#3fb950" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Біт «0»</text>
    <text x="500" y="210" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">50 мкс + 26 мкс</text>
    <line x1="450" y1="150" x2="450" y2="170" stroke="#3fb950" stroke-dasharray="2,2"/>
    <line x1="550" y1="150" x2="550" y2="170" stroke="#3fb950" stroke-dasharray="2,2"/>

    <!-- Section 4: Data Bit 1 -->
    <rect x="550" y="235" width="160" height="50" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="630" y="257" fill="#bc8cff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Біт «1»</text>
    <text x="630" y="275" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">50 мкс + 70 мкс</text>
    <line x1="550" y1="150" x2="550" y2="235" stroke="#bc8cff" stroke-dasharray="2,2"/>
    <line x1="710" y1="150" x2="710" y2="235" stroke="#bc8cff" stroke-dasharray="2,2"/>

    <!-- Section 5: End -->
    <rect x="710" y="170" width="85" height="50" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1.5"/>
    <text x="752" y="192" fill="#8b949e" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Кінець (EOF)</text>
    <text x="752" y="210" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">50 мкс Low</text>
  </g>

  <!-- Technical Notes Card -->
  <g transform="translate(40, 420)">
    <rect width="770" height="65" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="24" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Критичні таймінги шини:</text>
    <text x="20" y="46" fill="#f0f6fc" font-family="monospace" font-size="11">• Мінімальний інтервал опитування між зчитуваннями: 2.0 секунди (0.5 Гц)</text>
    <text x="480" y="46" fill="#7ee787" font-family="monospace" font-size="11">• Рекомендований Pull-Up резистор: 4.7 кОм</text>
  </g>
</svg>