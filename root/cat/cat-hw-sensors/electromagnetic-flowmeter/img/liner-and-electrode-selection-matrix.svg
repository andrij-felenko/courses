<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Матриця сумісності футерувань та електродів із технологічними середовищами</text>

<!-- Section 1: Liners (Left) -->
<rect x="40" y="65" width="420" height="330" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="250" y="95" font-size="15" fill="#58a6ff" font-weight="700" text-anchor="middle">Матеріали футерування труби (Liner)</text>

<!-- Table rows -->
<rect x="55" y="115" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="70" y="137" font-size="13" fill="#3fb950" font-weight="700">PTFE (Тефлон) / PFA</text>
<text x="70" y="155" font-size="11" fill="#8b949e">t: −20 ... +180 °C | Агресивні кислоти, луги, висока температура</text>

<rect x="55" y="175" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="70" y="197" font-size="13" fill="#58a6ff" font-weight="700">Тверда гума (Hard Rubber)</text>
<text x="70" y="215" font-size="11" fill="#8b949e">t: 0 ... +90 °C | Технічна та стічна вода, помірні абразиви</text>

<rect x="55" y="235" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="70" y="257" font-size="13" fill="#f0883e" font-weight="700">Поліуретан (Polyurethane)</text>
<text x="70" y="275" font-size="11" fill="#8b949e">t: −20 ... +60 °C | Екстремальна абразивна стійкість (пісок, гравій)</text>

<rect x="55" y="295" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="70" y="317" font-size="13" fill="#bc8cff" font-weight="700">Оксидна кераміка (Al2O3)</text>
<text x="70" y="335" font-size="11" fill="#8b949e">t: −40 ... +250 °C | Абсолютна стійкість до вакууму, зносу й тиску</text>

<text x="250" y="375" font-size="11" fill="#8b949e" text-anchor="middle">Футерування запобігає замиканню ЕРС через металеву трубу</text>

<!-- Section 2: Electrodes (Right) -->
<rect x="480" y="65" width="420" height="330" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="690" y="95" font-size="15" fill="#3fb950" font-weight="700" text-anchor="middle">Матеріали сенсорних електродів</text>

<rect x="495" y="115" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="510" y="137" font-size="13" fill="#3fb950" font-weight="700">AISI 316L / 1.4404</text>
<text x="510" y="155" font-size="11" fill="#8b949e">Базове застосування: питна вода, стічні води, слабоагресивні середовища</text>

<rect x="495" y="175" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="510" y="197" font-size="13" fill="#f0883e" font-weight="700">Хастеллой (Hastelloy C-276)</text>
<text x="510" y="215" font-size="11" fill="#8b949e">Окиснювальні кислоти, розчини хлоридів, морська вода, хімічні стоки</text>

<rect x="495" y="235" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="510" y="257" font-size="13" fill="#58a6ff" font-weight="700">Титан (Titanium) / Тантал (Tantalum)</text>
<text x="510" y="275" font-size="11" fill="#8b949e">Концентрована соляна, азотна, сірчана кислоти, гарячі розсоли</text>

<rect x="495" y="295" width="390" height="50" rx="4" fill="#0d1117" stroke="#30363d"/>
<text x="510" y="317" font-size="13" fill="#bc8cff" font-weight="700">Платина / Іридій (Pt / Ir)</text>
<text x="510" y="335" font-size="11" fill="#8b949e">Фармацевтика, надчисті процеси, екстремальні окисники</text>

<text x="690" y="375" font-size="11" fill="#8b949e" text-anchor="middle">Вибір металу повинен виключати контактні гальванічні шуми</text>
</svg>