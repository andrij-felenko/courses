<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<defs>
  <marker id="ar_afe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
  </marker>
</defs>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Аналоговий вхід AFE та мікроконтролерна обробка слабких сигналів</text>

<!-- Electrodes input left -->
<circle cx="60" cy="120" r="10" fill="#f85149"/>
<text x="60" y="95" font-size="12" fill="#f85149" font-weight="700" text-anchor="middle">E1 (мкВ)</text>
<circle cx="60" cy="200" r="10" fill="#58a6ff"/>
<text x="60" y="230" font-size="12" fill="#58a6ff" font-weight="700" text-anchor="middle">E2 (мкВ)</text>

<line x1="70" y1="120" x2="120" y2="120" stroke="#f85149" stroke-width="2"/>
<line x1="70" y1="200" x2="120" y2="200" stroke="#58a6ff" stroke-width="2"/>

<!-- Block 1: High Impedance Instrument Amp (In-Amp) -->
<rect x="120" y="90" width="160" height="140" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="200" y="120" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="middle">Інструментальний</text>
<text x="200" y="140" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="middle">підсилювач (In-Amp)</text>
<text x="200" y="170" font-size="11" fill="#3fb950" text-anchor="middle">R_вх &gt; 10¹² Ом (Гігаоми)</text>
<text x="200" y="190" font-size="11" fill="#8b949e" text-anchor="middle">CMRR &gt; 110 дБ</text>
<text x="200" y="210" font-size="11" fill="#d29922" text-anchor="middle">G = 100 ... 1000</text>

<line x1="280" y1="160" x2="330" y2="160" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_afe)"/>

<!-- Block 2: Switched Synchronous Demodulator -->
<rect x="330" y="90" width="160" height="140" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="410" y="120" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">Синхронний</text>
<text x="410" y="140" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">демодулятор</text>
<text x="410" y="170" font-size="11" fill="#f0f6fc" text-anchor="middle">Синхронізація з</text>
<text x="410" y="190" font-size="11" fill="#f0883e" font-weight="700" text-anchor="middle">струмом котушок</text>
<text x="410" y="210" font-size="11" fill="#8b949e" text-anchor="middle">Відсікає шум 50 Гц</text>

<line x1="490" y1="160" x2="540" y2="160" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_afe)"/>

<!-- Block 3: 24-bit Delta-Sigma ADC -->
<rect x="540" y="100" width="140" height="120" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
<text x="610" y="130" font-size="13" fill="#d29922" font-weight="700" text-anchor="middle">24-бітний АЦП</text>
<text x="610" y="155" font-size="11" fill="#8b949e" text-anchor="middle">Sigma-Delta</text>
<text x="610" y="180" font-size="11" fill="#3fb950" text-anchor="middle">V_роздільна: &lt; 0.1 мкВ</text>
<text x="610" y="200" font-size="11" fill="#f0f6fc" text-anchor="middle">Швидкість: 100 Sps</text>

<line x1="680" y1="160" x2="730" y2="160" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_afe)"/>

<!-- Block 4: MCU / DSP Core -->
<rect x="730" y="80" width="170" height="160" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<text x="815" y="110" font-size="14" fill="#bc8cff" font-weight="700" text-anchor="middle">Мікроконтролер</text>
<text x="815" y="130" font-size="12" fill="#f0f6fc" text-anchor="middle">STM32 / ARM Cortex</text>
<text x="815" y="160" font-size="11" fill="#3fb950" text-anchor="middle">• Керування ключами H-моста</text>
<text x="815" y="180" font-size="11" fill="#d29922" text-anchor="middle">• Розрахунок Q = v · S</text>
<text x="815" y="200" font-size="11" fill="#58a6ff" text-anchor="middle">• Детектування сухої труби</text>
<text x="815" y="220" font-size="11" fill="#f85149" text-anchor="middle">• Вихід 4–20 мА / Modbus</text>

<!-- Bottom Circuit Analysis -->
<rect x="40" y="260" width="860" height="145" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="65" y="290" font-size="13" fill="#58a6ff" font-weight="700">Ключові інженерні виклики аналогової обробки:</text>
<text x="65" y="315" font-size="12" fill="#f0f6fc">1. <tspan fill="#3fb950" font-weight="700">Надвисокий вхідний опір:</tspan> при низькій провідності води (20 мкСм/см) внутрішній імпеданс джерела сигналу досягає 100 кОм. Будь-який струм витоку підсилювача призводить до фатального спотворення показу.</text>
<text x="65" y="345" font-size="12" fill="#f0f6fc">2. <tspan fill="#d29922" font-weight="700">Синфазне придушення (CMRR):</tspan> потенціал землі в промисловій трубі містить наведені завади до 1–5 Вольт. Підсилювач повинен виділити корисний сигнал 50 мкВ на фоні перешкоди у 100 000 разів більшої амплітуди!</text>
<text x="65" y="375" font-size="12" fill="#bc8cff" font-weight="700">3. <tspan fill="#f0883e" font-weight="700">Детектування порожньої труби (Empty Pipe Detection):</tspan> якщо рідина злита, опір між електродами зростає до мегаомів; алгоритм миттєво обнуляє витрату та вмикає аварійний прапорець.</text>
</svg>