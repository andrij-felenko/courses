<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<defs>
  <marker id="ar_mag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
  </marker>
  <marker id="ar_flow_em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
  </marker>
</defs>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Фізичний принцип електромагнітної індукції Фарадея у витратомірі</text>

<!-- 3D Perspective Cross Section of Pipe -->
<ellipse cx="280" cy="220" rx="140" ry="110" fill="#161b22" stroke="#30363d" stroke-width="3"/>
<ellipse cx="280" cy="220" rx="120" ry="90" fill="#1f3b5c" fill-opacity="0.4" stroke="#388bfd" stroke-width="2"/>

<!-- Magnetic Coils Top and Bottom -->
<!-- Top Coil (North pole) -->
<rect x="220" y="55" width="120" height="45" rx="5" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
<text x="280" y="82" font-size="13" fill="#f0883e" font-weight="700" text-anchor="middle">Котушка N (Північ)</text>

<!-- Bottom Coil (South pole) -->
<rect x="220" y="340" width="120" height="45" rx="5" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
<text x="280" y="367" font-size="13" fill="#f0883e" font-weight="700" text-anchor="middle">Котушка S (Південь)</text>

<!-- Magnetic Field Lines B (Top to Bottom) -->
<line x1="250" y1="100" x2="250" y2="340" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar_mag)"/>
<line x1="280" y1="100" x2="280" y2="340" stroke="#f0883e" stroke-width="3" marker-end="url(#ar_mag)"/>
<line x1="310" y1="100" x2="310" y2="340" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar_mag)"/>
<text x="325" y="140" font-size="13" fill="#f0883e" font-weight="700">Магнітна індукція B (Тесла)</text>

<!-- Electrodes Left and Right (Perpendicular to B and Flow) -->
<!-- Left Electrode E1 (+) -->
<circle cx="160" cy="220" r="10" fill="#3fb950" stroke="#ffffff" stroke-width="2"/>
<text x="140" y="215" font-size="14" fill="#3fb950" font-weight="700" text-anchor="end">Електрод 1 (+)</text>

<!-- Right Electrode E2 (-) -->
<circle cx="400" cy="220" r="10" fill="#f85149" stroke="#ffffff" stroke-width="2"/>
<text x="420" y="215" font-size="14" fill="#f85149" font-weight="700" text-anchor="start">Електрод 2 (−)</text>

<!-- Induced Voltage arrow between electrodes -->
<line x1="175" y1="220" x2="385" y2="220" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="280" y="210" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">Індукована ЕРС U_e</text>

<!-- Flow Vector v (Through the screen) -->
<circle cx="280" cy="260" r="14" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
<text x="280" y="265" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="middle">⊗ v</text>
<text x="280" y="295" font-size="12" fill="#58a6ff" font-weight="700" text-anchor="middle">Потік рідини v (від нас)</text>

<!-- Right Side Formulas -->
<rect x="540" y="65" width="360" height="325" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="720" y="98" font-size="16" fill="#58a6ff" font-weight="700" text-anchor="middle">Закон електромагнітної індукції</text>

<rect x="560" y="118" width="320" height="65" rx="5" fill="#0d1117" stroke="#388bfd"/>
<text x="720" y="145" font-size="13" fill="#8b949e" text-anchor="middle">Індукована напруга (ЕРС):</text>
<text x="720" y="170" font-size="18" fill="#3fb950" font-weight="700" text-anchor="middle">U_e = B · v · D · k</text>

<text x="570" y="212" font-size="12" fill="#f0f6fc">
  <tspan fill="#f0883e" font-weight="700">B</tspan> — магнітна індукція у вимірювальному каналі [Тл]
</text>
<text x="570" y="235" font-size="12" fill="#f0f6fc">
  <tspan fill="#58a6ff" font-weight="700">v</tspan> — середня лінійна швидкість потоку [м/с]
</text>
<text x="570" y="258" font-size="12" fill="#f0f6fc">
  <tspan fill="#3fb950" font-weight="700">D</tspan> — внутрішній діаметр трубопроводу [м]
</text>
<text x="570" y="281" font-size="12" fill="#f0f6fc">
  <tspan fill="#d29922" font-weight="700">k</tspan> — безрозмірний калібрувальний коефіцієнт сенсора
</text>

<rect x="560" y="305" width="320" height="70" rx="5" fill="#21262d" stroke="#30363d"/>
<text x="720" y="328" font-size="12" fill="#d29922" font-weight="700" text-anchor="middle">Вимога провідності середовища:</text>
<text x="720" y="348" font-size="11" fill="#f0f6fc" text-anchor="middle">Рідина повинна мати питому електропровідність</text>
<text x="720" y="365" font-size="11" fill="#3fb950" font-weight="700" text-anchor="middle">σ ≥ 5 ... 20 мкСм/см (дистилят і нафта НЕ працюють)</text>

<!-- Footer -->
<rect x="40" y="400" width="860" height="22" rx="4" fill="#21262d"/>
<text x="470" y="415" font-size="11" fill="#8b949e" text-anchor="middle">Вектори магнітного поля B, швидкості потоку v та лінії між електродами взаємно перпендикулярні (правило лівої руки)</text>
</svg>