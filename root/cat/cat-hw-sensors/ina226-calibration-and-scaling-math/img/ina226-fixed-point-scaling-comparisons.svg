<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="12" fill="url(#bg-grad3)"/>

  <text x="480" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    Порівняння підходів до обробки даних INA226: Floating-Point vs Fixed-Point
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Оптимізація обчислень для мікроконтролерів без апаратного FPU (Cortex-M0, ESP8266, AVR)
  </text>

  <!-- Left Card: Floating Point -->
  <g transform="translate(40, 85)">
    <rect width="420" height="340" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="420" height="42" rx="8" fill="#0284c7" fill-opacity="0.3"/>
    <text x="210" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Підхід з рухомою комою (float / double)
    </text>

    <g transform="translate(20, 58)">
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">
        Принцип:
      </text>
      <text x="0" y="36" font-family="monospace" font-size="11" fill="#cbd5e1">
        float curr = (float)raw_curr * current_lsb;
      </text>
      <text x="0" y="54" font-family="monospace" font-size="11" fill="#cbd5e1">
        float volt = (float)raw_volt * 0.00125f;
      </text>

      <text x="0" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">
        Переваги:
      </text>
      <text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Інтуїтивна зрозумілість коду та відповідність фізичним одиницям (Ампери, Вольти, Вати).
      </text>
      <text x="10" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Легка інтеграція з математичними бібліотеками та фільтрами Калмана.
      </text>

      <text x="0" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f87171">
        Недоліки на MCU без FPU:
      </text>
      <text x="10" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Програмна емуляція float потребує 100-300 тактів CPU на кожну операцію множення.
      </text>
      <text x="10" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Збільшення розміру бінарного файлу прошивки на 4-12 КБ через бібліотеки Soft-Float.
      </text>
      <text x="10" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Недетермінований час виконання у перериваннях (ISR).
      </text>
    </g>
  </g>

  <!-- Right Card: Integer Fixed Point -->
  <g transform="translate(500, 85)">
    <rect width="420" height="340" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="420" height="42" rx="8" fill="#059669" fill-opacity="0.3"/>
    <text x="210" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      Підхід з фіксованою комою (int32_t / мкА / мВ)
    </text>

    <g transform="translate(20, 58)">
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">
        Принцип:
      </text>
      <text x="0" y="36" font-family="monospace" font-size="11" fill="#cbd5e1">
        int32_t curr_ua = (int32_t)raw_curr * lsb_ua;
      </text>
      <text x="0" y="54" font-family="monospace" font-size="11" fill="#cbd5e1">
        int32_t volt_mv = ((int32_t)raw_volt * 5) / 4;
      </text>

      <text x="0" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">
        Переваги:
      </text>
      <text x="10" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Виконання за 1-2 такти процесора (апаратне 32-бітне цілочисельне множення).
      </text>
      <text x="10" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Нульовий оверхед за обсягом Flash-пам'яті (відсутність зовнішніх бібліотек).
      </text>
      <text x="10" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • 100% передбачуваний і детермінований час роботи всередині обробників переривань.
      </text>

      <text x="0" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#facc15">
        Особливості реалізації:
      </text>
      <text x="10" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Вимагає контролю розрядності акумулятора для запобігання переповненню int32_t.
      </text>
      <text x="10" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Округлення через додання половини дільника: (val + div/2) / div.
      </text>
    </g>
  </g>

  <!-- Bottom Recommendation -->
  <g transform="translate(40, 440)">
    <rect width="880" height="30" rx="4" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
    <text x="440" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8">
      Рекомендація: для промислових контролерів та пристроїв з акумуляторним живленням віддавайте перевагу фіксованій комі у мікроамперах та мілівольтах.
    </text>
  </g>
</svg>