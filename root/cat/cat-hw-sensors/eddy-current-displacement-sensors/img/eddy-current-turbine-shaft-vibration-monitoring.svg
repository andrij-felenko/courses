<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .panel-sub { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
      .lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: #f8fafc; }
      .lbl-bold { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .lbl-dim { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl-code { font-family: monospace, monospace; font-size: 11px; fill: #38bdf8; }
      
      .shaft { fill: #475569; stroke: #94a3b8; stroke-width: 2; }
      .bearing { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 6,4; }
      .probe { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 4px; }
      .probe-x { fill: #0284c7; stroke: #38bdf8; stroke-width: 1.5; }
      .probe-y { fill: #b45309; stroke: #fbbf24; stroke-width: 1.5; }
      .orbit { fill: none; stroke: #f43f5e; stroke-width: 2.5; }
      .arrow { stroke-width: 2; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title Block -->
  <text x="30" y="38" class="title">Моніторинг вібрації та биття вала турбіни (Стандарт API 670)</text>
  <text x="30" y="60" class="subtitle">Ортогональні вихрострумові датчики X/Y у гідродинамічному підшипнику та побудова орбіти вала</text>

  <!-- Left: Bearing & Probe Placement Diagram -->
  <g transform="translate(30, 85)">
    <rect width="470" height="425" class="panel" />
    <text x="20" y="28" class="h2">1. Конфігурація датчиків X-Y під кутом 90°</text>

    <g transform="translate(235, 200)">
      <!-- Outer Bearing Shell -->
      <circle cx="0" cy="0" r="145" class="bearing" />
      <text x="0" y="-155" class="lbl-dim" text-anchor="middle">Корпус гідродинамічного підшипника</text>

      <!-- Shaft Cross-Section -->
      <circle cx="0" cy="0" r="85" class="shaft" />
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
      <text x="0" y="5" class="lbl-bold" text-anchor="middle" fill="#ffffff">Вал турбіни</text>

      <!-- Dynamic Orbit Path of Shaft Center -->
      <path d="M -15 -10 Q 20 -25 25 15 T -15 20 Z" class="orbit" />
      <text x="35" y="25" class="lbl-bold" fill="#f43f5e">Орбіта вала</text>

      <!-- Probe Y (Mount at 45° left) -->
      <g transform="rotate(-45) translate(0, -145)">
        <rect x="-15" y="-60" width="30" height="60" class="probe-y" rx="2" />
        <text x="0" y="-70" class="lbl-bold" text-anchor="middle" fill="#fbbf24">Датчик Y (+45°)</text>
      </g>

      <!-- Probe X (Mount at 45° right, 90° to Y) -->
      <g transform="rotate(45) translate(0, -145)">
        <rect x="-15" y="-60" width="30" height="60" class="probe-x" rx="2" />
        <text x="0" y="-70" class="lbl-bold" text-anchor="middle" fill="#38bdf8">Датчик X (-45°)</text>
      </g>

      <!-- Oil Film note -->
      <text x="0" y="105" class="lbl-dim" text-anchor="middle" fill="#4ade80">Масляний клин (товщина 20–80 мкм)</text>
    </g>

    <rect x="25" y="365" width="420" height="45" class="panel-sub" />
    <text x="35" y="385" class="lbl">Імунітет до середовища: вихрострумовий датчик «не бачить» мастило,</text>
    <text x="35" y="400" class="lbl">вимірюючи <tspan fill="#4ade80">чистий зазор безпосередньо до поверхні сталевого вала</tspan>.</text>
  </g>

  <!-- Right: Vibration Orbit Analysis & Metrology -->
  <g transform="translate(520, 85)">
    <rect width="370" height="425" class="panel" />
    <text x="20" y="28" class="h2">2. Діагностика за стандартом API 670</text>

    <!-- Sub-panel 1: Orbit Plot -->
    <g transform="translate(20, 45)">
      <rect width="330" height="155" class="panel-sub" />
      <text x="15" y="22" class="lbl-bold" fill="#38bdf8">Траєкторія руху осі вала (Orbit Plot):</text>

      <!-- Miniature oscilloscope screen -->
      <g transform="translate(165, 85)">
        <rect x="-65" y="-50" width="130" height="100" fill="#0f172a" stroke="#334155" rx="4" />
        <!-- Crosshair -->
        <line x1="-65" y1="0" x2="65" y2="0" stroke="#334155" stroke-dasharray="2,2" />
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#334155" stroke-dasharray="2,2" />
        <!-- Precession orbit -->
        <ellipse cx="5" cy="-5" rx="35" ry="20" class="orbit" transform="rotate(25)" />
        <text x="-55" y="-38" class="lbl-dim">X vs Y</text>
      </g>
    </g>

    <!-- Sub-panel 2: Parameters monitored -->
    <g transform="translate(20, 215)">
      <rect width="330" height="195" class="panel-sub" />
      <text x="15" y="22" class="lbl-bold" fill="#fbbf24">Критичні діагностичні параметри:</text>

      <text x="15" y="48" class="lbl">• <tspan fill="#38bdf8">Радіальна вібрація (Dynamic Runout):</tspan></text>
      <text x="25" y="66" class="lbl-dim">Амплітуда коливань вала (розмах Peak-to-Peak у мкм).</text>

      <text x="15" y="90" class="lbl">• <tspan fill="#4ade80">Положення центру шийки (Gap Voltage):</tspan></text>
      <text x="25" y="108" class="lbl-dim">Постійна складова напруги відображає знос бабіту.</text>

      <text x="15" y="132" class="lbl">• <tspan fill="#f43f5e">Осьовий зсув (Axial Thrust Position):</tspan></text>
      <text x="25" y="150" class="lbl-dim">Контроль упорного підшипника проти осьового заклинювання.</text>

      <text x="15" y="174" class="lbl">• <tspan fill="#fbbf24">Частотна мітка (Keyphasor):</tspan> Фазова прив'язка 1X/2X обертів.</text>
    </g>
  </g>
</svg>