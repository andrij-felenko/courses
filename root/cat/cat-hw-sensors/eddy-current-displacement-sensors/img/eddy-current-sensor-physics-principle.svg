<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .panel-sub { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
      .lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: #f8fafc; }
      .lbl-bold { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .lbl-dim { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl-code { font-family: monospace, monospace; font-size: 11px; fill: #38bdf8; }
      
      .probe-body { fill: #334155; stroke: #64748b; stroke-width: 1.5; }
      .probe-coil { fill: #b45309; stroke: #fbbf24; stroke-width: 1.5; }
      .target-mat { fill: #475569; stroke: #94a3b8; stroke-width: 2; rx: 3px; }
      .skin-layer { fill: #f43f5e; fill-opacity: 0.25; stroke: #f43f5e; stroke-dasharray: 4,3; stroke-width: 1.5; }
      
      .flux-prim { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 5,4; }
      .flux-sec { fill: none; stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 4,3; }
      .eddy-curr { fill: none; stroke: #fbbf24; stroke-width: 2.5; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title Block -->
  <text x="30" y="38" class="title">Фізичний принцип вихрострумового вимірювання переміщення</text>
  <text x="30" y="60" class="subtitle">Генерація первинного поля ВЧ-котушкою, індукція струмів Фуко в скін-шарі мішені та реакція протиполя</text>

  <!-- Left: Physical Probe & Target Assembly -->
  <g transform="translate(30, 85)">
    <rect width="470" height="425" class="panel" />
    <text x="20" y="28" class="h2">1. Електромагнітна взаємодія в зазорі</text>

    <!-- Probe Body & Coil -->
    <g transform="translate(30, 50)">
      <!-- Probe Casing -->
      <rect x="0" y="30" width="130" height="150" class="probe-body" rx="4" />
      <text x="65" y="110" class="lbl-bold" text-anchor="middle" fill="#ffffff">Корпус датчика</text>
      <text x="65" y="128" class="lbl-dim" text-anchor="middle">(нерж. сталь)</text>

      <!-- Ceramic tip & Coil -->
      <rect x="130" y="45" width="25" height="120" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Inductive Coil turns -->
      <rect x="135" y="55" width="15" height="100" class="probe-coil" />
      <text x="142" y="105" class="lbl-bold" text-anchor="middle" transform="rotate(-90 142 105)" fill="#ffffff">Котушка L_0</text>

      <!-- RF Excitation source -->
      <g transform="translate(-15, 195)">
        <rect width="160" height="40" class="panel-sub" />
        <text x="80" y="25" class="lbl-code" text-anchor="middle">ВЧ-генератор (1–3 МГц)</text>
      </g>
    </g>

    <!-- Air gap dimension x -->
    <g transform="translate(195, 75)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#fbbf24" stroke-width="2" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#fbbf24" stroke-width="2" />
      <line x1="60" y1="-6" x2="60" y2="6" stroke="#fbbf24" stroke-width="2" />
      <text x="30" y="-10" class="lbl-bold" text-anchor="middle" fill="#fbbf24">Зазор x (0.2–2 мм)</text>
    </g>

    <!-- Primary Magnetic Flux Lines (Blue) -->
    <path d="M 190 100 C 240 70, 240 180, 190 150" class="flux-prim" />
    <path d="M 190 85 C 265 50, 265 200, 190 165" class="flux-prim" />
    <line x1="205" y1="95" x2="225" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="235" y="65" class="lbl-bold" fill="#38bdf8">B_prim (первинне)</text>

    <!-- Conductive Target -->
    <g transform="translate(255, 65)">
      <!-- Main Metallic Body -->
      <rect x="0" y="0" width="180" height="180" class="target-mat" />
      <text x="90" y="95" class="lbl-bold" text-anchor="middle" fill="#ffffff">Електропровідна</text>
      <text x="90" y="115" class="lbl-bold" text-anchor="middle" fill="#ffffff">мішень (вал)</text>

      <!-- Skin Layer (Depth delta) -->
      <rect x="0" y="10" width="20" height="160" class="skin-layer" />
      <text x="10" y="90" class="lbl-dim" text-anchor="middle" transform="rotate(-90 10 90)" fill="#fecdd3">Скін-шар δ</text>

      <!-- Induced Eddy Currents (Eddy swirls) -->
      <ellipse cx="10" cy="55" rx="7" ry="25" class="eddy-curr" />
      <ellipse cx="10" cy="125" rx="7" ry="25" class="eddy-curr" />
      <text x="35" y="45" class="lbl-bold" fill="#fbbf24">Струми Фуко (i_eddy)</text>

      <!-- Secondary Opposing Flux Lines (Red) -->
      <path d="M 5 60 C -40 75, -40 105, 5 120" class="flux-sec" />
      <line x1="-20" y1="90" x2="-35" y2="90" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)" />
      <text x="-40" y="80" class="lbl-bold" text-anchor="end" fill="#f43f5e">B_sec (протиполе)</text>
    </g>

    <!-- Physics Summary Box -->
    <rect x="20" y="325" width="430" height="85" class="panel-sub" />
    <text x="30" y="347" class="lbl">• <tspan fill="#38bdf8">Закон Фарадея:</tspan> Змінне поле B_prim індукує вихрові струми у мішені.</text>
    <text x="30" y="367" class="lbl">• <tspan fill="#f43f5e">Правило Ленца:</tspan> Поле B_sec спрямоване назустріч первинному полю.</text>
    <text x="30" y="387" class="lbl">• <tspan fill="#fbbf24">Наслідок:</tspan> При наближенні мішені (x↓) індуктивність котушки <tspan fill="#f43f5e">L_eq↓</tspan>, а втрати <tspan fill="#4ade80">R_eq↑</tspan>.</text>
  </g>

  <!-- Right: Equivalent Transformer Model & Skin Depth -->
  <g transform="translate(520, 85)">
    <rect width="370" height="425" class="panel" />
    <text x="20" y="28" class="h2">2. Еквівалентна схема та скін-ефект</text>

    <!-- Equivalent Coupled Circuit -->
    <g transform="translate(20, 45)">
      <rect width="330" height="150" class="panel-sub" />
      <text x="165" y="24" class="lbl-bold" text-anchor="middle" fill="#38bdf8">Модель зв'язаних контурів</text>

      <!-- Primary Circuit (Sensor) -->
      <text x="20" y="55" class="lbl-bold" fill="#38bdf8">Котушка сенсора:</text>
      <text x="20" y="75" class="lbl-code">L_0 (власна індуктивність)</text>
      <text x="20" y="93" class="lbl-code">R_0 (опір міді дроту)</text>

      <!-- Mutual Coupling M(x) -->
      <line x1="165" y1="50" x2="165" y2="135" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" />
      <text x="165" y="85" class="lbl-bold" text-anchor="middle" fill="#fbbf24">Взаємо-</text>
      <text x="165" y="100" class="lbl-bold" text-anchor="middle" fill="#fbbf24">індукція</text>
      <text x="165" y="115" class="lbl-code" text-anchor="middle" fill="#fbbf24">M(x)</text>

      <!-- Secondary Circuit (Target) -->
      <text x="210" y="55" class="lbl-bold" fill="#f43f5e">Мішень (виток):</text>
      <text x="210" y="75" class="lbl-code">L_t (індуктивність)</text>
      <text x="210" y="93" class="lbl-code">R_t (опір струмів)</text>

      <!-- Equivalent Impedance Formula -->
      <text x="20" y="135" class="lbl-code">Z_eq(x) = R_eq(x) + j·ω·L_eq(x)</text>
    </g>

    <!-- Skin Depth Card -->
    <g transform="translate(20, 210)">
      <rect width="330" height="195" class="panel-sub" />
      <text x="15" y="24" class="lbl-bold" fill="#fbbf24">Глибина проникнення скін-шару:</text>

      <rect x="15" y="38" width="300" height="35" fill="#1e293b" stroke="#fbbf24" rx="4" />
      <text x="165" y="60" class="lbl-code" text-anchor="middle" font-size="13" fill="#fbbf24">δ = √( ρ / (π · f · μ_0 · μ_r) )</text>

      <text x="15" y="92" class="lbl">• <tspan fill="#38bdf8">f:</tspan> частота збудження (типово 1–3 МГц)</text>
      <text x="15" y="110" class="lbl">• <tspan fill="#38bdf8">ρ:</tspan> питомий електричний опір металу [Ом·м]</text>
      <text x="15" y="128" class="lbl">• <tspan fill="#38bdf8">μ_r:</tspan> відносна магнітна проникність</text>

      <text x="15" y="152" class="lbl-bold" fill="#4ade80">Вимога до товщини мішені:</text>
      <text x="15" y="172" class="lbl">Товщина стінки вала <tspan fill="#4ade80">d_target ≥ 3 · δ</tspan> для усунення</text>
      <text x="15" y="188" class="lbl">впливу зворотного боку металу.</text>
    </g>
  </g>
</svg>