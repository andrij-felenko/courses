<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .panel-sub { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
      .lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: #f8fafc; }
      .lbl-bold { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .lbl-dim { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl-code { font-family: monospace, monospace; font-size: 11px; fill: #38bdf8; }
      
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #334155; stroke-dasharray: 4,4; stroke-width: 1; }
      .pipe-adc { fill: #0284c7; stroke: #38bdf8; stroke-width: 1.5; rx: 4px; }
      .pipe-spi { fill: #7c3aed; stroke: #a855f7; stroke-width: 1.5; rx: 4px; }
      .pipe-clarke { fill: #0d9488; stroke: #14b8a6; stroke-width: 1.5; rx: 4px; }
      .pipe-pi { fill: #d97706; stroke: #fbbf24; stroke-width: 1.5; rx: 4px; }
      .pipe-svpwm { fill: #b91c1c; stroke: #f43f5e; stroke-width: 1.5; rx: 4px; }
      .pipe-free { fill: #065f46; stroke: #10b981; stroke-width: 1.5; rx: 4px; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title Block -->
  <text x="30" y="38" class="title">Хронограма закритого контуру FOC із неблокувальним SPI</text>
  <text x="30" y="60" class="subtitle">Послідовність виконання операцій у перериванні ШІМ частотою 20 кГц (бюджет 50 мкс)</text>

  <!-- Timeline Breakdown -->
  <g transform="translate(30, 85)">
    <rect width="860" height="260" class="panel" />
    <text x="25" y="28" class="h2">1. Конвеєр розрахунку контуру струму в реальному часі</text>

    <!-- Visual Gantt Chart of 50 us cycle -->
    <g transform="translate(30, 50)">
      <!-- Axis -->
      <line x1="0" y1="80" x2="800" y2="80" class="axis" />
      <text x="810" y="84" class="lbl-dim">Час</text>

      <!-- Time ticks: 0, 10, 20, 30, 40, 50 us -->
      <line x1="0" y1="20" x2="0" y2="90" class="grid" />
      <line x1="160" y1="20" x2="160" y2="90" class="grid" />
      <line x1="320" y1="20" x2="320" y2="90" class="grid" />
      <line x1="480" y1="20" x2="480" y2="90" class="grid" />
      <line x1="640" y1="20" x2="640" y2="90" class="grid" />
      <line x1="800" y1="20" x2="800" y2="90" class="grid" />

      <text x="0" y="105" class="lbl-dim" text-anchor="middle">0 мкс</text>
      <text x="160" y="105" class="lbl-dim" text-anchor="middle">10 мкс</text>
      <text x="320" y="105" class="lbl-dim" text-anchor="middle">20 мкс</text>
      <text x="480" y="105" class="lbl-dim" text-anchor="middle">30 мкс</text>
      <text x="640" y="105" class="lbl-dim" text-anchor="middle">40 мкс</text>
      <text x="800" y="105" class="lbl-dim" text-anchor="middle">50 мкс</text>

      <!-- Step 1: ADC sampling & SPI Trigger (1.5 us = 24 px) -->
      <rect x="0" y="25" width="24" height="45" class="pipe-adc" />
      <text x="12" y="52" class="lbl-bold" text-anchor="middle" fill="#ffffff">ADC</text>

      <!-- Step 2: SPI Interrupt / Latched Angle unpack (0.8 us = 13 px) -->
      <rect x="26" y="25" width="18" height="45" class="pipe-spi" />
      <text x="35" y="52" class="lbl-bold" text-anchor="middle" fill="#ffffff">θ</text>

      <!-- Step 3: Clarke & Park (1.8 us = 29 px) -->
      <rect x="46" y="25" width="29" height="45" class="pipe-clarke" />
      <text x="60" y="52" class="lbl-bold" text-anchor="middle" fill="#ffffff">I_dq</text>

      <!-- Step 4: PI Controllers Id / Iq (3.0 us = 48 px) -->
      <rect x="77" y="25" width="48" height="45" class="pipe-pi" />
      <text x="101" y="52" class="lbl-bold" text-anchor="middle" fill="#ffffff">PI reg</text>

      <!-- Step 5: Inv Park & SVPWM Duty update (2.2 us = 35 px) -->
      <rect x="127" y="25" width="35" height="45" class="pipe-svpwm" />
      <text x="144" y="52" class="lbl-bold" text-anchor="middle" fill="#ffffff">PWM</text>

      <!-- Step 6: Remaining Free CPU Time (40.7 us = 638 px) -->
      <rect x="164" y="25" width="636" height="45" class="pipe-free" />
      <text x="482" y="52" class="lbl-bold" text-anchor="middle" fill="#ffffff">ВІЛЬНИЙ ЧАС ДЛЯ RTOS, ТРАЄКТОРІЙ ТА ЗВ'ЯЗКУ (81.4%)</text>
    </g>

    <!-- Legend -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="15" height="15" class="pipe-adc" />
      <text x="22" y="12" class="lbl-dim">Зчитування струмів фаз (1.5 мкс)</text>

      <rect x="220" y="0" width="15" height="15" class="pipe-spi" />
      <text x="242" y="12" class="lbl-dim">Розпакування кута AS5048 (0.8 мкс)</text>

      <rect x="470" y="0" width="15" height="15" class="pipe-clarke" />
      <text x="492" y="12" class="lbl-dim">Перетворення Кларка / Парка (1.8 мкс)</text>

      <rect x="0" y="25" width="15" height="15" class="pipe-pi" />
      <text x="22" y="37" class="lbl-dim">ПІ-регулятори струмів d/q (3.0 мкс)</text>

      <rect x="220" y="25" width="15" height="15" class="pipe-svpwm" />
      <text x="242" y="37" class="lbl-dim">Оновлення регістрів ШІМ таймера (2.2 мкс)</text>

      <rect x="470" y="25" width="15" height="15" class="pipe-free" />
      <text x="492" y="37" class="lbl-bold" fill="#4ade80">Сумарне навантаження: лише 18.6%!</text>
    </g>
  </g>

  <!-- Bottom Detailed Insights Panel -->
  <g transform="translate(30, 365)">
    <rect width="860" height="145" class="panel" />
    <text x="25" y="26" class="lbl-bold" fill="#38bdf8">Результати оптимізації неблокувального обміну:</text>
    <text x="25" y="52" class="lbl">1. <tspan fill="#4ade80">Відсутність блокування процесора:</tspan> Використання асинхронного SPI звільняє понад 8 мкс у кожному 50-мксному циклі.</text>
    <text x="25" y="74" class="lbl">2. <tspan fill="#fbbf24">Мінімальна затримка контуру:</tspan> Кут положення ротора оновлюється безпосередньо перед формуванням векторів напруги.</text>
    <text x="25" y="96" class="lbl">3. <tspan fill="#38bdf8">Запас для складних алгоритмів:</tspan> Вільні 40 мкс дозволяють реалізувати спостерігач стану (Luenberger Observer), фільтр Калмана або автоналаштування.</text>
    <text x="25" y="118" class="lbl">4. <tspan fill="#f43f5e">Бездоганна плавність руху:</tspan> Виключення джиттеру переривань забезпечує безшумну роботу серводвигуна на низьких швидкостях.</text>
  </g>
</svg>