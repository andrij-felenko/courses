<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Динаміка роботи мікронагрівача (Heater) для деконденсації</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Усунення насичення полімерного шару (100% RH creep) імпульсним нагріванням кристала</text>

  <!-- Timing Chart Area -->
  <g transform="translate(80, 85)">
    <!-- Axes -->
    <line x1="0" y1="280" x2="800" y2="280" stroke="#30363d" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="280" stroke="#30363d" stroke-width="2"/>
    <text x="790" y="305" font-family="sans-serif" font-size="12" fill="#8b949e">Час t (с)</text>

    <!-- Grid lines -->
    <line x1="0" y1="80" x2="800" y2="80" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#21262d" stroke-dasharray="4 4"/>
    <text x="-15" y="85" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">100% RH / +60°C</text>
    <text x="-15" y="165" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">50% RH / +25°C</text>

    <!-- Event Phases -->
    <rect x="50" y="20" width="180" height="260" fill="#1f6feb" fill-opacity="0.08"/>
    <text x="140" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">1. Конденсація / Залипання</text>

    <rect x="230" y="20" width="160" height="260" fill="#da3633" fill-opacity="0.12"/>
    <text x="310" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">2. Імпульс нагрівача (Heater ON)</text>

    <rect x="390" y="20" width="210" height="260" fill="#d29922" fill-opacity="0.08"/>
    <text x="495" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">3. Охолодження кристала</text>

    <rect x="600" y="20" width="180" height="260" fill="#238636" fill-opacity="0.08"/>
    <text x="690" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">4. Точні вимірювання</text>

    <!-- Curve: Temperature (Red) -->
    <!-- path: starts at 25C (y=160), stays, then shoots up to 60C (y=80), then cools back to 160 -->
    <path d="M 0,160 L 230,160 Q 250,70 310,65 L 390,70 Q 450,140 600,160 L 800,160" 
          fill="none" stroke="#f85149" stroke-width="3"/>
    <text x="340" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149">Температура T (°C)</text>

    <!-- Curve: Relative Humidity (Blue) -->
    <!-- path: starts at 100% (y=80), drops during heater to 15% (y=240), then recovers to real ambient 60% (y=140) -->
    <path d="M 0,80 L 230,80 Q 270,240 350,245 L 390,240 Q 470,180 600,145 L 800,145" 
          fill="none" stroke="#58a6ff" stroke-width="3"/>
    <text x="640" y="130" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">Вологість RH (%)</text>
  </g>

  <!-- Bottom Explanatory Notes -->
  <g transform="translate(80, 395)">
    <rect width="800" height="65" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="11" fill="#f0f6fc">
      <tspan font-weight="bold" fill="#f85149">• Чому це важливо:</tspan> При 100% RH на полімері утворюється плівка конденсату, викликаючи тривале "залипання" сенсора.
    </text>
    <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#f0f6fc">
      <tspan font-weight="bold" fill="#3fb950">• Стратегія вбудованого ПЗ:</tspan> Вмикати нагрівач імпульсом (наприклад, 200 мВт на 100 мс у SHT4x), витримати паузу охолодження 1-2 с перед читанням.
    </text>
  </g>
</svg>