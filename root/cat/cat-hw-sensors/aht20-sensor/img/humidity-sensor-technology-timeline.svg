<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-timeline" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція технологій вимірювання вологості повітря</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Від дискретних аналогових датчиків до цифрових MEMS-чипів AHT20 з OTP-калібруванням</text>

  <!-- Main Timeline Arrow -->
  <line x1="50" y1="230" x2="910" y2="230" stroke="#2457d6" stroke-width="4" marker-end="url(#arr-timeline)"/>

  <!-- Stage 1: 1970-1980s -->
  <circle cx="140" cy="230" r="10" fill="#c0392b" stroke="white" stroke-width="2"/>
  <line x1="140" y1="220" x2="140" y2="160" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="35" y="75" width="210" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="140" y="98" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">1970–1980-ті рр.</text>
  <text x="140" y="118" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналогові елементи</text>
  <text x="140" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Резистивні та ємнісні</text>
  <text x="140" y="150" font-size="12" fill="#6b7280" text-anchor="middle">сенсори, значний дрейф</text>

  <!-- Stage 2: 1990s -->
  <circle cx="370" cy="230" r="10" fill="#6b7280" stroke="white" stroke-width="2"/>
  <line x1="370" y1="240" x2="370" y2="300" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="265" y="300" width="210" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="370" y="323" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1990-ті рр.</text>
  <text x="370" y="343" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гібридні модулі</text>
  <text x="370" y="361" font-size="12" fill="#6b7280" text-anchor="middle">Аналогова схема</text>
  <text x="370" y="375" font-size="12" fill="#6b7280" text-anchor="middle">нормування сигналу</text>

  <!-- Stage 3: 2000s -->
  <circle cx="600" cy="230" r="10" fill="#2457d6" stroke="white" stroke-width="2"/>
  <line x1="600" y1="220" x2="600" y2="160" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="495" y="75" width="210" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="600" y="98" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2000-ні рр.</text>
  <text x="600" y="118" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перші цифрові чипи</text>
  <text x="600" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Шина I2C / 1-Wire,</text>
  <text x="600" y="150" font-size="12" fill="#6b7280" text-anchor="middle">вбудований АЦП</text>

  <!-- Stage 4: 2010s+ (AHT20) -->
  <circle cx="830" cy="230" r="12" fill="#27ae60" stroke="white" stroke-width="2"/>
  <line x1="830" y1="240" x2="830" y2="300" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="725" y="300" width="210" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="830" y="323" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Сучасність (AHT20)</text>
  <text x="830" y="343" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MEMS + CMOS ASIC</text>
  <text x="830" y="361" font-size="12" fill="#6b7280" text-anchor="middle">OTP-калібрування, 20-біт АЦП</text>
  <text x="830" y="378" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Висока стабільність</text>

</svg>
