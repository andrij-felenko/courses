<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-start" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Внутрішня архітектура цифрового давача AHT20</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Взаємодія MEMS-сенсора, термодатчика, ASIC з OTP-пам'яттю та I2C-інтерфейсу</text>

  <!-- Outer LGA Chip Package Container -->
  <rect x="40" y="80" width="880" height="415" rx="10" ry="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="60" y="105" font-size="13" font-weight="bold" fill="#6b7280">Корпус AHT20 (SMD / LGA-6)</text>

  <!-- PANEL 1: Primary Sensors -->
  <rect x="60" y="125" width="210" height="345" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Сенсорний блок</text>

  <!-- MEMS Humidity Sensor Block -->
  <rect x="72" y="168" width="186" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">MEMS-сенсор RH</text>
  <text x="165" y="214" text-anchor="middle" font-size="12" fill="#1a1a1a">Ємнісна полімерна плівка</text>
  <text x="165" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Вимірювання вологості</text>
  <text x="165" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід: зміна ємності ΔC</text>

  <!-- Temperature Sensor Block -->
  <rect x="72" y="318" width="186" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Сенсор температури T</text>
  <text x="165" y="364" text-anchor="middle" font-size="12" fill="#1a1a1a">Напівпровідниковий P-N</text>
  <text x="165" y="386" text-anchor="middle" font-size="12" fill="#6b7280">Вимірювання температури</text>
  <text x="165" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід: зміна напруги ΔV</text>

  <!-- PANEL 2: ASIC Integrated Circuit -->
  <rect x="325" y="125" width="345" height="345" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="497.5" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Спеціалізований контролер ASIC</text>

  <!-- AFE & ADC Sub-block -->
  <rect x="335" y="168" width="155" height="120" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="412.5" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">AFE &amp; 20-bit АЦП</text>
  <text x="412.5" y="214" text-anchor="middle" font-size="12" fill="#6b7280">Підсилення сигналів</text>
  <text x="412.5" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Аналогово-цифрове</text>
  <text x="412.5" y="258" text-anchor="middle" font-size="12" fill="#6b7280">перетворення (ADC)</text>

  <!-- OTP Memory Sub-block -->
  <rect x="505" y="168" width="155" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="582.5" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">OTP-пам'ять</text>
  <text x="582.5" y="214" text-anchor="middle" font-size="12" fill="#1a1a1a">Заводська калібровка</text>
  <text x="582.5" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Коефіцієнти обробки</text>
  <text x="582.5" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Захист від перезапису</text>

  <!-- DSP & Digital Logic Sub-block -->
  <rect x="335" y="318" width="325" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="497.5" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Цифровий блок DSP &amp; Контролер</text>
  <text x="497.5" y="364" text-anchor="middle" font-size="12" fill="#1a1a1a">Калібрування OTP → сирі коди S_RH, S_T</text>
  <text x="497.5" y="386" text-anchor="middle" font-size="12" fill="#6b7280">Контроль бітів Busy (0x80) та Cal (0x08)</text>
  <text x="497.5" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Обчислення CRC8 та вихідних даних</text>

  <!-- PANEL 3: I2C Interface & Pins -->
  <rect x="770" y="125" width="140" height="345" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="840" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">I2C Інтерфейс</text>

  <!-- I2C Controller Sub-block -->
  <rect x="780" y="168" width="120" height="120" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="840" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">I2C Контролер</text>
  <text x="840" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Адреса: 0x38</text>
  <text x="840" y="236" text-anchor="middle" font-size="12" fill="#6b7280">Команди: 0xAC</text>
  <text x="840" y="258" text-anchor="middle" font-size="12" fill="#6b7280">Статус: 0x71 / 0xBA</text>

  <!-- Pins Sub-block -->
  <rect x="780" y="318" width="120" height="120" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="840" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Виводи чипа</text>
  <text x="840" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SDA (Дані)</text>
  <text x="840" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SCL (Тактування)</text>
  <text x="840" y="408" text-anchor="middle" font-size="12" fill="#1a1a1a">VDD / GND</text>

  <!-- CONNECTING ARROWS & LABELS -->

  <!-- 1. MEMS -> AFE -->
  <line x1="258" y1="228" x2="335" y2="228" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="294" y="216" text-anchor="middle" font-size="12" fill="#2457d6">ΔC</text>

  <!-- 2. Temp Sensor -> AFE -->
  <path d="M 258,378 L 294,378 L 294,250 L 335,250" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="314" y="238" text-anchor="middle" font-size="12" fill="#2457d6">ΔV</text>

  <!-- 3. AFE -> DSP -->
  <line x1="412.5" y1="288" x2="412.5" y2="318" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="420.5" y="306" text-anchor="start" font-size="12" fill="#2457d6">20-біт коди</text>

  <!-- 4. OTP -> DSP -->
  <line x1="582.5" y1="288" x2="582.5" y2="318" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="590.5" y="306" text-anchor="start" font-size="12" fill="#27ae60">Калібровка</text>

  <!-- 5. DSP -> I2C Controller -->
  <path d="M 660,340 L 705,340 L 705,228 L 780,228" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="713" y="284" text-anchor="start" font-size="12" fill="#2457d6">Кадр I2C</text>

  <!-- 6. I2C Controller <-> Pins -->
  <line x1="840" y1="288" x2="840" y2="318" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr-start)"/>
  <text x="832" y="307" text-anchor="end" font-size="12" fill="#1a1a1a">Шина I2C</text>
  <text x="848" y="307" text-anchor="start" font-size="12" fill="#6b7280">Обмін</text>
</svg>
