<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <!-- Red arrow for heat flow -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <!-- Blue arrow for thermal bridge pointer -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Green arrow for slot pointer -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Теплова ізоляція сенсора AHT20 на друкованій платі</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Фрезеровані прорізи та розділення полігонів запобігають нагріву від гарячих компонентів</text>

  <!-- LEFT PANEL: WRONG DESIGN -->
  <rect x="35" y="80" width="430" height="435" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="47" y="92" width="406" height="32" rx="4" fill="#c0392b"/>
  <text x="250" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Без теплоізоляції — ПОМИЛКА ДИЗАЙНУ</text>

  <!-- Left PCB Substrate -->
  <rect x="50" y="138" width="400" height="285" rx="6" fill="#244a32" stroke="#183322" stroke-width="2"/>
  <!-- Left Continuous Copper Ground Plane -->
  <rect x="60" y="148" width="380" height="265" rx="4" fill="#316644" stroke="#438a5b" stroke-width="1"/>
  <text x="70" y="168" text-anchor="start" font-size="12" font-weight="bold" fill="#a8e6cf">Суцільний мідний полігон (GND)</text>

  <!-- Left MCU / Heat Source -->
  <rect x="75" y="240" width="115" height="95" rx="4" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <text x="132" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">LDO / MCU</text>
  <text x="132" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">Джерело тепла</text>
  <text x="132" y="310" text-anchor="middle" font-size="12" fill="#bdc3c7">P = 0.5...1.0 Вт</text>

  <!-- Heat Flow Arrows -->
  <path d="M 195 265 Q 260 260 330 265" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <path d="M 195 287 Q 260 282 330 287" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arr-red)"/>
  <path d="M 195 309 Q 260 304 330 309" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Left Heat Callout Box -->
  <rect x="198" y="190" width="134" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="265" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Паразитне тепло Q</text>
  <text x="265" y="221" text-anchor="middle" font-size="12" fill="#c0392b">прямо через мідь</text>

  <!-- Left AHT20 IC -->
  <rect x="345" y="255" width="65" height="65" rx="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="2"/>
  <!-- Pins Left -->
  <rect x="338" y="263" width="7" height="8" fill="#d4af37"/>
  <rect x="338" y="283" width="7" height="8" fill="#d4af37"/>
  <rect x="338" y="303" width="7" height="8" fill="#d4af37"/>
  <!-- Pins Right -->
  <rect x="410" y="263" width="7" height="8" fill="#d4af37"/>
  <rect x="410" y="283" width="7" height="8" fill="#d4af37"/>
  <rect x="410" y="303" width="7" height="8" fill="#d4af37"/>
  <!-- Metal Cap / Sensor Opening -->
  <circle cx="377" cy="287" r="13" fill="#333333" stroke="#777777" stroke-width="1.5"/>
  <circle cx="377" cy="287" r="5" fill="#111111"/>
  <text x="377" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">AHT20</text>

  <!-- Left Result Warning Box -->
  <rect x="47" y="435" width="406" height="62" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="60" y="457" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">❌ Наслідок: Перегрів сенсора на +2 °C...5 °C</text>
  <text x="60" y="480" text-anchor="start" font-size="12" fill="#1a1a1a">Критично спотворює вимірювання температури й RH%</text>

  <!-- RIGHT PANEL: CORRECT DESIGN -->
  <rect x="495" y="80" width="430" height="435" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="507" y="92" width="406" height="32" rx="4" fill="#27ae60"/>
  <text x="710" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Фрезеровані прорізи та термоміст — ПРАВИЛЬНО</text>

  <!-- Right PCB Substrate -->
  <rect x="510" y="138" width="400" height="285" rx="6" fill="#244a32" stroke="#183322" stroke-width="2"/>
  <!-- Right Main Ground Copper Plane -->
  <rect x="520" y="148" width="185" height="265" rx="4" fill="#316644" stroke="#438a5b" stroke-width="1"/>
  <text x="530" y="168" text-anchor="start" font-size="12" font-weight="bold" fill="#a8e6cf">Основний полігон GND</text>

  <!-- Routing Slots (Cutouts in FR4 PCB) -->
  <!-- Top Slot -->
  <rect x="705" y="185" width="190" height="10" rx="3" fill="#152219" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Bottom Slot -->
  <rect x="705" y="365" width="190" height="10" rx="3" fill="#152219" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Right Vertical Slot -->
  <rect x="885" y="185" width="10" height="190" rx="3" fill="#152219" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Left Upper Vertical Slot -->
  <rect x="705" y="185" width="10" height="65" rx="3" fill="#152219" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Left Lower Vertical Slot -->
  <rect x="705" y="310" width="10" height="65" rx="3" fill="#152219" stroke="#81c784" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Sensor Island Copper Plane -->
  <rect x="715" y="195" width="170" height="170" rx="4" fill="#316644" stroke="#438a5b" stroke-width="1"/>
  <text x="807" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#a8e6cf">Острівець AHT20</text>

  <!-- Right MCU / Heat Source -->
  <rect x="530" y="240" width="110" height="95" rx="4" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <text x="585" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">LDO / MCU</text>
  <text x="585" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">Джерело тепла</text>
  <text x="585" y="310" text-anchor="middle" font-size="12" fill="#bdc3c7">P = 0.5...1.0 Вт</text>

  <!-- Blocked Heat Path & Indicator -->
  <line x1="635" y1="248" x2="698" y2="248" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="705" y1="235" x2="705" y2="261" stroke="#c0392b" stroke-width="3.5"/>

  <!-- Heat Blocked Box -->
  <rect x="565" y="182" width="120" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="625" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Тепло заблоковано</text>
  <text x="625" y="213" text-anchor="middle" font-size="11" fill="#c0392b">прорізом у платі</text>

  <!-- Traces across Thermal Bridge (x=640 to 775, y=267, 280, 293, 306) -->
  <line x1="640" y1="267" x2="771" y2="267" stroke="#e67e22" stroke-width="2"/>
  <line x1="640" y1="280" x2="771" y2="280" stroke="#3498db" stroke-width="2"/>
  <line x1="640" y1="293" x2="771" y2="293" stroke="#2ecc71" stroke-width="2"/>
  <line x1="640" y1="306" x2="771" y2="306" stroke="#9b59b6" stroke-width="2"/>

  <!-- Right AHT20 IC -->
  <rect x="775" y="255" width="65" height="65" rx="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="2"/>
  <!-- Pins Left -->
  <rect x="768" y="263" width="7" height="8" fill="#d4af37"/>
  <rect x="768" y="283" width="7" height="8" fill="#d4af37"/>
  <rect x="768" y="303" width="7" height="8" fill="#d4af37"/>
  <!-- Pins Right -->
  <rect x="840" y="263" width="7" height="8" fill="#d4af37"/>
  <rect x="840" y="283" width="7" height="8" fill="#d4af37"/>
  <rect x="840" y="303" width="7" height="8" fill="#d4af37"/>
  <!-- Metal Cap / Sensor Opening -->
  <circle cx="807" cy="287" r="13" fill="#333333" stroke="#777777" stroke-width="1.5"/>
  <circle cx="807" cy="287" r="5" fill="#111111"/>
  <text x="807" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">AHT20</text>

  <!-- Callout 1: Slot Label -->
  <rect x="715" y="142" width="170" height="36" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="800" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Фрезеровані прорізи</text>
  <text x="800" y="171" text-anchor="middle" font-size="11" fill="#6b7280">Повітряний зазор 1.0–1.5 мм</text>
  <path d="M 800 178 L 800 185" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Callout 2: Thermal Bridge Label -->
  <rect x="525" y="348" width="160" height="38" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="605" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Вузький термоміст</text>
  <text x="605" y="379" text-anchor="middle" font-size="11" fill="#6b7280">Розрив мідного полігону</text>
  <path d="M 685 367 C 705 367 705 320 705 285" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Right Result Success Box -->
  <rect x="507" y="435" width="406" height="62" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="520" y="457" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">✓ Результат: Точні вимірювання температури й RH%</text>
  <text x="520" y="480" text-anchor="start" font-size="12" fill="#1a1a1a">Повітряний зазор забезпечує опір R_th &gt; 100 K/Вт</text>
</svg>
