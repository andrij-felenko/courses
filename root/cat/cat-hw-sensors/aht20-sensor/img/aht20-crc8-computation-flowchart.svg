<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <text x="480" y="40" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Блок-схема обчислення CRC8 для AHT20</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Поліном 0x31, ініціалізація 0xFF</text>
  <rect x="380" y="100" width="200" height="60" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="135" font-size="14" text-anchor="middle" fill="#1a1a1a">Початок обчислення</text>
  <rect x="380" y="200" width="200" height="60" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="480" y="235" font-size="14" text-anchor="middle" fill="#2457d6">Цикл по бітах</text>
  <rect x="380" y="300" width="200" height="60" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="480" y="335" font-size="14" text-anchor="middle" fill="#27ae60">Результат CRC8</text>
  <line x1="480" y1="160" x2="480" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="260" x2="480" y2="300" stroke="#1a1a1a" stroke-width="2"/>
</svg>
