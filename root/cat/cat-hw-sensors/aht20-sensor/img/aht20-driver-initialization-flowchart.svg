<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Алгоритм ініціалізації драйвера AHT20</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність кроків перевірки калібрування, подачі живлення та ініціалізації датчика</text>

  <!-- Flowchart Nodes -->
  <!-- 1. Start -->
  <rect x="400" y="90" width="160" height="40" rx="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="115" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Старт ініціалізації</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="480" y1="130" x2="480" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. Read Status Byte -->
  <rect x="380" y="155" width="200" height="50" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="177" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зчитати регістр статусу</text>
  <text x="480" y="195" font-size="12" fill="#6b7280" text-anchor="middle">I2C Read (1 байт статусу)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="480" y1="205" x2="480" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Decision: Calibrated? -->
  <polygon points="480,230 575,265 480,300 385,265" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="261" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт Calibrated == 1?</text>
  <text x="480" y="278" font-size="12" fill="#6b7280" text-anchor="middle">(статус &amp; 0x08)</text>

  <!-- Decision labels -->
  <!-- "Ні" -> Left to Send Init Command -->
  <text x="365" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Ні</text>
  <line x1="385" y1="265" x2="280" y2="265" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. Send Init Command (0xBE) -->
  <rect x="150" y="240" width="130" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="215" y="262" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Команда 0xBE</text>
  <text x="215" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Ініціалізація датчика</text>

  <!-- Arrow from Init Command down, then right to delay -->
  <line x1="215" y1="290" x2="215" y2="345" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="215" y1="345" x2="380" y2="345" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision "Так" -> Down to Ready -->
  <text x="495" y="318" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>
  <line x1="480" y1="300" x2="480" y2="320" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Delay / Ready -->
  <rect x="380" y="320" width="200" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="342" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Затримка 10 мс</text>
  <text x="480" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Очікування готовності</text>

  <!-- Arrow 5 -> 6 -->
  <line x1="480" y1="370" x2="480" y2="395" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. Success End -->
  <rect x="390" y="395" width="180" height="45" rx="22.5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="422" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвер готовий до роботи</text>
</svg>
