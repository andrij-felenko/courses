<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вплив інтервалу опитування AHT20 на теплове зміщення показань</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Часті вимірювання (Δt &lt; 2 с) спричиняють самонагрів: T хибно зростає, a RH занижується</text>

  <!-- Left Chart Panel Container -->
  <rect x="30" y="70" width="600" height="370" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Region Highlights -->
  <rect x="90" y="110" width="280" height="280" fill="#fdecea" opacity="0.65"/>
  <rect x="370" y="110" width="220" height="280" fill="#e9f7ef" opacity="0.65"/>

  <!-- Region Header Badges -->
  <rect x="115" y="78" width="220" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="225" y="94" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Зона самонагріву (Δt &lt; 2 с)</text>

  <rect x="380" y="78" width="190" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="475" y="94" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Безпечний режим (Δt ≥ 2 с)</text>

  <!-- Threshold Line at 2.0 s -->
  <line x1="370" y1="110" x2="370" y2="390" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Grid Lines -->
  <line x1="90" y1="180" x2="590" y2="180" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="240" x2="590" y2="240" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="300" x2="590" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="360" x2="590" y2="360" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Axes -->
  <!-- Left Y Axis (Temperature) -->
  <line x1="90" y1="110" x2="90" y2="390" stroke="#c0392b" stroke-width="1.5"/>
  <text x="42" y="94" font-size="12" font-weight="700" fill="#c0392b">T (°C)</text>

  <text x="82" y="124" font-size="11" text-anchor="end" fill="#c0392b">27.0°</text>
  <text x="82" y="184" font-size="11" text-anchor="end" fill="#c0392b">26.5°</text>
  <text x="82" y="244" font-size="11" text-anchor="end" fill="#c0392b">26.0°</text>
  <text x="82" y="304" font-size="11" text-anchor="end" fill="#c0392b">25.5°</text>
  <text x="82" y="364" font-size="11" text-anchor="end" fill="#c0392b">25.0°</text>

  <!-- Right Y Axis (Humidity) -->
  <line x1="590" y1="110" x2="590" y2="390" stroke="#2457d6" stroke-width="1.5"/>
  <text x="582" y="94" font-size="12" font-weight="700" fill="#2457d6">RH (%)</text>

  <text x="598" y="124" font-size="11" fill="#2457d6">42%</text>
  <text x="598" y="184" font-size="11" fill="#2457d6">44%</text>
  <text x="598" y="244" font-size="11" fill="#2457d6">46%</text>
  <text x="598" y="304" font-size="11" fill="#2457d6">48%</text>
  <text x="598" y="364" font-size="11" fill="#2457d6">50%</text>

  <!-- X Axis -->
  <line x1="90" y1="390" x2="590" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="340" y="426" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Інтервал опитування Δt (секунди)</text>

  <text x="90" y="408" font-size="11" text-anchor="middle" fill="#1a1a1a">0.2 с</text>
  <text x="175" y="408" font-size="11" text-anchor="middle" fill="#1a1a1a">0.5 с</text>
  <text x="260" y="408" font-size="11" text-anchor="middle" fill="#1a1a1a">1.0 с</text>
  <text x="370" y="408" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">2.0 с</text>
  <text x="485" y="408" font-size="11" text-anchor="middle" fill="#1a1a1a">5.0 с</text>
  <text x="590" y="408" font-size="11" text-anchor="middle" fill="#1a1a1a">10.0 с</text>

  <!-- Data Curves -->
  <!-- Temperature curve (Red) -->
  <path d="M 90 144 C 140 180, 200 280, 260 312 C 300 335, 340 360, 370 360 L 590 360" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Humidity curve (Blue) -->
  <path d="M 90 196 C 140 230, 200 310, 260 336 C 300 350, 340 360, 370 360 L 590 360" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Curve Labels -->
  <rect x="105" y="115" width="130" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">+1.8 °C Дрейф T</text>

  <rect x="105" y="326" width="130" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="341" font-size="11" font-weight="700" text-anchor="middle" fill="#2457d6">-5.8 % Хибний RH</text>

  <rect x="415" y="326" width="140" height="22" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="485" y="341" font-size="11" font-weight="700" text-anchor="middle" fill="#27ae60">Номінальні показання</text>

  <!-- Right Side Summary Panel -->
  <rect x="650" y="70" width="280" height="370" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="790" y="95" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Аналіз та рекомендації</text>
  <line x1="665" y1="105" x2="915" y2="105" stroke="#d0d7de" stroke-width="1"/>

  <!-- Card 1: Physical cause -->
  <rect x="665" y="118" width="250" height="92" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="677" y="136" font-size="12" font-weight="700" fill="#c0392b">1. Причина самонагріву</text>
  <text x="677" y="154" font-size="12" fill="#1a1a1a">• Струм вимірювання: I ≈ 980 мкА</text>
  <text x="677" y="172" font-size="12" fill="#1a1a1a">• Активація ASIC + MEMS елемента</text>
  <text x="677" y="190" font-size="12" fill="#1a1a1a">• За Δt &lt; 2 с тепло накопичується</text>

  <!-- Card 2: Impact -->
  <rect x="665" y="222" width="250" height="74" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="677" y="240" font-size="12" font-weight="700" fill="#1a1a1a">2. Вплив на вимірювання</text>
  <text x="677" y="258" font-size="12" fill="#c0392b">• ΔT &gt; 0: зростає температура кристала</text>
  <text x="677" y="276" font-size="12" fill="#2457d6">• ΔRH &lt; 0: падає виміряна вологість</text>

  <!-- Card 3: Solution -->
  <rect x="665" y="308" width="250" height="118" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="677" y="326" font-size="12" font-weight="700" fill="#27ae60">3. Правильний алгоритм</text>
  <text x="677" y="344" font-size="12" fill="#1a1a1a">• Пауза між замірами Δt ≥ 2...5 с</text>
  <text x="677" y="362" font-size="12" fill="#1a1a1a">• Deep Sleep МК між вимірами</text>
  <text x="677" y="380" font-size="12" fill="#1a1a1a">• Вимикати шину I²C у сні</text>
  <text x="677" y="398" font-size="12" fill="#1a1a1a">• Струм спокою вузла &lt; 5 мкА</text>
</svg>
