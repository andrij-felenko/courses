<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розпінування та схемотехніка підключення AHT20 (SMD-6 / QFN-6)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Схема живлення 2.0–5.5 В із розв'язувальним конденсатором C1 = 100 нФ та підтяжками шини I2C</text>

  <!-- Power Rail Line VDD (3.3V) -->
  <line x1="80" y1="90" x2="880" y2="90" stroke="#c0392b" stroke-width="3"/>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#c0392b">VDD (2.0V – 5.5V)</text>

  <!-- GND Rail Line -->
  <line x1="80" y1="390" x2="880" y2="390" stroke="#1a1a1a" stroke-width="3"/>
  <text x="80" y="415" font-size="13" font-weight="bold" fill="#1a1a1a">GND (Спільна земля)</text>

  <!-- AHT20 IC Body -->
  <rect x="360" y="150" width="240" height="180" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="230" font-size="20" font-weight="bold" fill="#2457d6" text-anchor="middle">AHT20</text>
  <text x="480" y="255" font-size="12" fill="#6b7280" text-anchor="middle">SMD-6 / QFN-6 Package</text>

  <!-- AHT20 Pins Left Side (1..3) -->
  <!-- Pin 1: VDD -->
  <rect x="330" y="170" width="30" height="16" fill="#c0392b" rx="2"/>
  <text x="375" y="183" font-size="12" font-weight="bold" fill="#1a1a1a">1: VDD</text>
  <line x1="330" y1="178" x2="280" y2="178" stroke="#c0392b" stroke-width="2"/>
  <line x1="280" y1="178" x2="280" y2="90" stroke="#c0392b" stroke-width="2"/>

  <!-- Pin 2: SDA -->
  <rect x="330" y="232" width="30" height="16" fill="#2457d6" rx="2"/>
  <text x="375" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">2: SDA</text>
  <line x1="330" y1="240" x2="200" y2="240" stroke="#2457d6" stroke-width="2"/>

  <!-- Pin 3: SCL -->
  <rect x="330" y="294" width="30" height="16" fill="#27ae60" rx="2"/>
  <text x="375" y="307" font-size="12" font-weight="bold" fill="#1a1a1a">3: SCL</text>
  <line x1="330" y1="302" x2="140" y2="302" stroke="#27ae60" stroke-width="2"/>

  <!-- AHT20 Pins Right Side (4..6) -->
  <!-- Pin 4: GND -->
  <rect x="600" y="170" width="30" height="16" fill="#1a1a1a" rx="2"/>
  <text x="585" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">4: GND</text>
  <line x1="630" y1="178" x2="680" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="178" x2="680" y2="390" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Pin 5: NC -->
  <rect x="600" y="232" width="30" height="16" fill="#6b7280" rx="2"/>
  <text x="585" y="245" font-size="12" fill="#6b7280" text-anchor="end">5: NC</text>

  <!-- Pin 6: NC -->
  <rect x="600" y="294" width="30" height="16" fill="#6b7280" rx="2"/>
  <text x="585" y="307" font-size="12" fill="#6b7280" text-anchor="end">6: NC</text>

  <!-- Decoupling Capacitor C1 = 100nF -->
  <line x1="720" y1="90" x2="720" y2="210" stroke="#c0392b" stroke-width="2"/>
  <line x1="720" y1="270" x2="720" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="705" y="210" width="30" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="750" y="245" font-size="12" font-weight="bold" fill="#2457d6">C1 = 100 nF</text>
  <text x="750" y="260" font-size="12" fill="#6b7280">(керамічний розв'язувальний)</text>

  <!-- Pull-Up Resistors R1 & R2 for I2C -->
  <!-- R2 for SCL (Line at x=140) -->
  <line x1="140" y1="90" x2="140" y2="150" stroke="#c0392b" stroke-width="2"/>
  <rect x="128" y="150" width="24" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="110" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">R2 = 4.7 kΩ</text>
  <line x1="140" y1="200" x2="140" y2="302" stroke="#27ae60" stroke-width="2"/>

  <!-- R1 for SDA (Line at x=200) -->
  <line x1="200" y1="90" x2="200" y2="150" stroke="#c0392b" stroke-width="2"/>
  <rect x="188" y="150" width="24" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="225" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">R1 = 4.7 kΩ</text>
  <line x1="200" y1="200" x2="200" y2="240" stroke="#2457d6" stroke-width="2"/>

  <!-- MCU Connections Label -->
  <text x="140" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">До SCL МК</text>
  <text x="200" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">До SDA МК</text>

  <!-- Recommendation Box -->
  <rect x="360" y="360" width="400" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="377" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обов'язкове розміщення C1 у безпосередній близькості до виводів VDD/GND</text>

</svg>
