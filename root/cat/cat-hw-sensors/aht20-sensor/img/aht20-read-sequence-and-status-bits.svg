<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Послідовність обміну I2C та біти статусу давача AHT20</text>
  <text x="480" y="55" font-size="13" text-anchor="middle" fill="#6b7280">Команди 0xBE і 0xAC, структура регістра статусу (Busy / CAL) та 7-байтний кадр з CRC8</text>

  <!-- PANEL 1: I2C Sequence -->
  <rect x="30" y="78" width="900" height="182" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Часова послідовність I2C-обміну (Ініціалізація, Запуск та Зчитування)</text>

  <!-- Frame 1: Init -->
  <rect x="45" y="112" width="240" height="78" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="55" y="128" font-size="12" font-weight="bold" fill="#2457d6">Крок 1: Ініціалізація (Cmd 0xBE)</text>
  
  <rect x="55" y="136" width="52" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="81" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x70(W)</text>
  
  <rect x="111" y="136" width="48" height="26" rx="2" fill="#2457d6" stroke="#2457d6"/>
  <text x="135" y="153" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">0xBE</text>
  
  <rect x="163" y="136" width="44" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="185" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x08</text>
  
  <rect x="211" y="136" width="44" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="233" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x00</text>
  
  <text x="55" y="178" font-size="11" fill="#6b7280">Виконується, якщо CAL (Bit 3) == 0</text>

  <!-- Delay Arrow 1 -->
  <line x1="289" y1="150" x2="323" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="306" y="142" font-size="11" text-anchor="middle" fill="#6b7280">10 ms</text>

  <!-- Frame 2: Measurement Start -->
  <rect x="328" y="112" width="240" height="78" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="338" y="128" font-size="12" font-weight="bold" fill="#2457d6">Крок 2: Вимірювання (Cmd 0xAC)</text>
  
  <rect x="338" y="136" width="52" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="364" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x70(W)</text>
  
  <rect x="394" y="136" width="48" height="26" rx="2" fill="#2457d6" stroke="#2457d6"/>
  <text x="418" y="153" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">0xAC</text>
  
  <rect x="446" y="136" width="44" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="468" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x33</text>
  
  <rect x="494" y="136" width="44" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="516" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x00</text>
  
  <text x="338" y="178" font-size="11" fill="#6b7280">Запуск циклу вимірювання T та RH</text>

  <!-- Delay Arrow 2 -->
  <line x1="572" y1="150" x2="611" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="591" y="142" font-size="11" text-anchor="middle" fill="#6b7280">> 80 ms</text>

  <!-- Frame 3: Read 7 Bytes -->
  <rect x="616" y="112" width="298" height="78" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="626" y="128" font-size="12" font-weight="bold" fill="#27ae60">Крок 3: Зчитування даних (7 байтів)</text>
  
  <rect x="626" y="136" width="52" height="26" rx="2" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="652" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">0x71(R)</text>
  
  <rect x="682" y="136" width="60" height="26" rx="2" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="712" y="153" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">B0 Status</text>
  
  <rect x="746" y="136" width="104" height="26" rx="2" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="798" y="153" font-size="11" text-anchor="middle" fill="#1a1a1a">B1..B5 (RH &amp; T)</text>
  
  <rect x="854" y="136" width="52" height="26" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <text x="880" y="153" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">B6 CRC</text>
  
  <text x="626" y="178" font-size="11" fill="#6b7280">Зчитування 7 байтів після Busy (Bit 7) == 0</text>

  <!-- Status Bar / Polling Rules inside Panel 1 -->
  <rect x="45" y="200" width="870" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="218" font-size="12" fill="#1a1a1a">
    <tspan font-weight="bold" fill="#c0392b">Bit 7 (Busy):</tspan> 1 = Триває перетворення (зачекати 10 ms і повторити) | <tspan font-weight="bold" fill="#27ae60">0 = Дані готові до зчитування</tspan>
  </text>
  <text x="55" y="236" font-size="12" fill="#1a1a1a">
    <tspan font-weight="bold" fill="#27ae60">Bit 3 (CAL):</tspan> 1 = Відкалібровано | <tspan font-weight="bold" fill="#c0392b">0 = Потрібна ініціалізація</tspan> (відправити команду 0xBE 0x08 0x00)
  </text>

  <!-- PANEL 2: Status Byte Structure -->
  <rect x="30" y="275" width="410" height="265" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="295" font-size="14" font-weight="bold" fill="#1a1a1a">2. Структура байта статусу (Status Byte / B0)</text>

  <!-- Bit Grid -->
  <!-- Bit 7 -->
  <rect x="45" y="310" width="45" height="42" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="67.5" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">Bit 7</text>
  <text x="67.5" y="343" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Busy</text>

  <!-- Bit 6 -->
  <rect x="93" y="310" width="45" height="42" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="115.5" y="325" font-size="10" text-anchor="middle" fill="#6b7280">Bit 6</text>
  <text x="115.5" y="343" font-size="11" text-anchor="middle" fill="#6b7280">Mode</text>

  <!-- Bit 5 -->
  <rect x="141" y="310" width="45" height="42" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="163.5" y="325" font-size="10" text-anchor="middle" fill="#6b7280">Bit 5</text>
  <text x="163.5" y="343" font-size="11" text-anchor="middle" fill="#6b7280">Mode</text>

  <!-- Bit 4 -->
  <rect x="189" y="310" width="45" height="42" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="211.5" y="325" font-size="10" text-anchor="middle" fill="#6b7280">Bit 4</text>
  <text x="211.5" y="343" font-size="11" text-anchor="middle" fill="#6b7280">Res</text>

  <!-- Bit 3 -->
  <rect x="237" y="310" width="45" height="42" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="259.5" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">Bit 3</text>
  <text x="259.5" y="343" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">CAL</text>

  <!-- Bit 2 -->
  <rect x="285" y="310" width="45" height="42" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="307.5" y="325" font-size="10" text-anchor="middle" fill="#6b7280">Bit 2</text>
  <text x="307.5" y="343" font-size="11" text-anchor="middle" fill="#6b7280">Res</text>

  <!-- Bit 1 -->
  <rect x="333" y="310" width="45" height="42" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="355.5" y="325" font-size="10" text-anchor="middle" fill="#6b7280">Bit 1</text>
  <text x="355.5" y="343" font-size="11" text-anchor="middle" fill="#6b7280">Res</text>

  <!-- Bit 0 -->
  <rect x="381" y="310" width="44" height="42" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="403" y="325" font-size="10" text-anchor="middle" fill="#6b7280">Bit 0</text>
  <text x="403" y="343" font-size="11" text-anchor="middle" fill="#6b7280">Res</text>

  <!-- Detailed Bit Explanations -->
  <rect x="45" y="366" width="380" height="74" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="55" y="385" font-size="12" font-weight="bold" fill="#c0392b">Bit 7 — Busy (Прапорець зайнятості пристрою)</text>
  <text x="55" y="405" font-size="11" fill="#1a1a1a">• 1: Апаратне вимірювання триває (не зчитувати дані)</text>
  <text x="55" y="423" font-size="11" fill="#1a1a1a">• 0: Вимірювання завершено, дані в кадрі актуальні</text>

  <rect x="45" y="450" width="380" height="74" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="55" y="469" font-size="12" font-weight="bold" fill="#27ae60">Bit 3 — CAL (Прапорець калібрування)</text>
  <text x="55" y="489" font-size="11" fill="#1a1a1a">• 1: Давач відкалібрований і готовий до вимірювань</text>
  <text x="55" y="507" font-size="11" fill="#1a1a1a">• 0: Не відкалібровано — відправити команду 0xBE</text>

  <!-- PANEL 3: 7-Byte Frame & Formulas -->
  <rect x="460" y="275" width="470" height="265" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="295" font-size="14" font-weight="bold" fill="#1a1a1a">3. Формат 7-байтного кадру та обчислення</text>

  <!-- Byte Boxes Row -->
  <!-- B0 -->
  <rect x="475" y="310" width="56" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="503" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">B0</text>
  <text x="503" y="343" font-size="11" text-anchor="middle" fill="#1a1a1a">Status</text>

  <!-- B1 -->
  <rect x="535" y="310" width="60" height="42" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="565" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">B1</text>
  <text x="565" y="343" font-size="10" text-anchor="middle" fill="#1a1a1a">RH[19:12]</text>

  <!-- B2 -->
  <rect x="599" y="310" width="60" height="42" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="629" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">B2</text>
  <text x="629" y="343" font-size="10" text-anchor="middle" fill="#1a1a1a">RH[11:4]</text>

  <!-- B3 -->
  <rect x="663" y="310" width="76" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="701" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#d97706">B3</text>
  <text x="701" y="343" font-size="10" text-anchor="middle" fill="#1a1a1a">RH[3:0]|T[19:16]</text>

  <!-- B4 -->
  <rect x="743" y="310" width="60" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="773" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">B4</text>
  <text x="773" y="343" font-size="10" text-anchor="middle" fill="#1a1a1a">T[15:8]</text>

  <!-- B5 -->
  <rect x="807" y="310" width="60" height="42" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="837" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">B5</text>
  <text x="837" y="343" font-size="10" text-anchor="middle" fill="#1a1a1a">T[7:0]</text>

  <!-- B6 -->
  <rect x="871" y="310" width="54" height="42" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="898" y="325" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">B6</text>
  <text x="898" y="343" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">CRC8</text>

  <!-- Formulas Box -->
  <rect x="475" y="366" width="450" height="74" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="485" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">Формули декодування 20-бітних значень RH та T:</text>
  <text x="485" y="405" font-size="11" fill="#27ae60">• S_RH = (B1 &lt;&lt; 12) | (B2 &lt;&lt; 4) | (B3 &gt;&gt; 4)   ⇒   RH = (S_RH / 2²⁰) × 100%</text>
  <text x="485" y="423" font-size="11" fill="#2457d6">• S_T = ((B3 &amp; 0x0F) &lt;&lt; 16) | (B4 &lt;&lt; 8) | B5   ⇒   T = (S_T / 2²⁰) × 200 - 50 °C</text>

  <!-- CRC8 Box -->
  <rect x="475" y="450" width="450" height="74" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="485" y="469" font-size="12" font-weight="bold" fill="#c0392b">Контроль цілісності даних (CRC8 Checksum):</text>
  <text x="485" y="489" font-size="11" fill="#1a1a1a">• Поліном: X⁸ + X⁵ + X⁴ + 1 (0x31), початкове значення Init = 0xFF</text>
  <text x="485" y="507" font-size="11" fill="#1a1a1a">• Верифікація: розраховане CRC8(B0..B5) має дорівнювати байту B6</text>
</svg>
