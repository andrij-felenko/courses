<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність викликів I2C та розбір 7-байтного пакета AHT20</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Команда 0xAC, неблокуюча затримка 80 мс та розпакування 20-бітних даних</text>

  <!-- Step 1: Write Trigger Command -->
  <rect x="40" y="90" width="260" height="110" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="170" y="115" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Тригер вимірювання</text>
  <text x="170" y="140" font-size="12" fill="#1a1a1a" text-anchor="middle">Адреса: 0x38 + W</text>
  <text x="170" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байти: 0xAC, 0x33, 0x00</text>
  <text x="170" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Запуск конверсії АЦП</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300,145 L 340,145" stroke="#2457d6" stroke-width="2" fill="none"/>
  <polygon points="340,140 350,145 340,150" fill="#2457d6"/>

  <!-- Step 2: Conversion Delay -->
  <rect x="350" y="90" width="260" height="110" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Очікування конверсії</text>
  <text x="480" y="140" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза t_conv ≥ 80 мс</text>
  <text x="480" y="160" font-size="12" fill="#6b7280" text-anchor="middle">Busy Bit[7] = 1</text>
  <text x="480" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Не опитувати шину</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 610,145 L 650,145" stroke="#2457d6" stroke-width="2" fill="none"/>
  <polygon points="650,140 660,145 650,150" fill="#2457d6"/>

  <!-- Step 3: Read 7 Bytes -->
  <rect x="660" y="90" width="260" height="110" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="790" y="115" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Зчитування результату</text>
  <text x="790" y="140" font-size="12" fill="#1a1a1a" text-anchor="middle">Адреса: 0x38 + R</text>
  <text x="790" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Отримання 7 байтів</text>
  <text x="790" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Busy Bit[7] = 0</text>

  <!-- Structure Heading -->
  <text x="480" y="240" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура 7-байтового пакета даних відповіді</text>

  <!-- Byte 0 -->
  <rect x="40" y="265" width="115" height="70" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="97" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 0</text>
  <text x="97" y="307" font-size="12" fill="#2457d6" text-anchor="middle">Статус</text>
  <text x="97" y="323" font-size="12" fill="#6b7280" text-anchor="middle">Busy/Calib</text>

  <!-- Byte 1 -->
  <rect x="165" y="265" width="115" height="70" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="222" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 1</text>
  <text x="222" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hum[19:12]</text>
  <text x="222" y="323" font-size="12" fill="#6b7280" text-anchor="middle">8 біт вологості</text>

  <!-- Byte 2 -->
  <rect x="290" y="265" width="115" height="70" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="347" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 2</text>
  <text x="347" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hum[11:4]</text>
  <text x="347" y="323" font-size="12" fill="#6b7280" text-anchor="middle">8 біт вологості</text>

  <!-- Byte 3 -->
  <rect x="415" y="265" width="130" height="70" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 3</text>
  <text x="480" y="307" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hum[3:0] | Temp[19:16]</text>
  <text x="480" y="323" font-size="12" fill="#6b7280" text-anchor="middle">4 біти H / 4 біти T</text>

  <!-- Byte 4 -->
  <rect x="555" y="265" width="115" height="70" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="612" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 4</text>
  <text x="612" y="307" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Temp[15:8]</text>
  <text x="612" y="323" font-size="12" fill="#6b7280" text-anchor="middle">8 біт темп.</text>

  <!-- Byte 5 -->
  <rect x="680" y="265" width="115" height="70" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="737" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 5</text>
  <text x="737" y="307" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Temp[7:0]</text>
  <text x="737" y="323" font-size="12" fill="#6b7280" text-anchor="middle">8 біт темп.</text>

  <!-- Byte 6 -->
  <rect x="805" y="265" width="115" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="862" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт 6</text>
  <text x="862" y="307" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CRC-8</text>
  <text x="862" y="323" font-size="12" fill="#6b7280" text-anchor="middle">Поліном 0x31</text>

  <!-- Data Decode Annotations -->
  <!-- Humidity 20-bit code bracket -->
  <path d="M 165,345 L 165,360 L 350,360 L 350,370 L 350,360 L 515,360 L 515,345" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="350" y="390" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">20-бітний код вологості S_RH</text>
  <text x="350" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">RH = (S_RH / 1048576) × 100%</text>

  <!-- Temperature 20-bit code bracket -->
  <path d="M 450,425 L 450,440 L 612,440 L 612,450 L 612,440 L 795,440 L 795,425" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="612" y="470" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">20-бітний код температури S_T</text>
  <text x="612" y="490" font-size="12" fill="#1a1a1a" text-anchor="middle">T = (S_T / 1048576) × 200 - 50 °C</text>

</svg>
