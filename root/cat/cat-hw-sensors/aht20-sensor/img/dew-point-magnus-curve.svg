<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність тиску насичення водяної пари від температури</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Знаходження точки роси T_d на перетині дійсної пари E із експоненційною кривою Магнуса-Тетенса E_s(t)</text>

  <!-- Graph Plot Box area: x=100..880, y=100..380 -->
  <rect x="100" y="100" width="780" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Axes -->
  <!-- X-Axis: Temperature -->
  <line x1="100" y1="350" x2="860" y2="350" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="865" y="355" font-size="13" font-weight="bold" fill="#1a1a1a">t (°C)</text>

  <!-- Y-Axis: Vapor Pressure E (hPa) -->
  <line x1="140" y1="360" x2="140" y2="110" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="140" y="100" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">E (гПа)</text>

  <!-- Grid lines & Ticks -->
  <line x1="140" y1="300" x2="860" y2="300" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="140" y1="230" x2="860" y2="230" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="140" y1="160" x2="860" y2="160" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Exponential Curve E_s(t) -->
  <path d="M 140 330 Q 400 320 550 250 T 850 120" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="710" y="115" font-size="13" font-weight="bold" fill="#2457d6">Крива насичення E_s(t)</text>

  <!-- Point Operating State: t=25°C, RH=80% -> E=25.28 hPa, E_s=31.6 hPa -->
  <!-- Dew point point (T_d = 21.3°C, E = 25.28 hPa) on curve -->
  <!-- Operating point: (t = 25°C, E = 25.28 hPa) -->
  <!-- Operating Point Circle (580, 230) -->
  <circle cx="580" cy="230" r="6" fill="#c0392b"/>
  <text x="595" y="225" font-size="13" font-weight="bold" fill="#c0392b">Поточний стан (t=25°C, RH=80%)</text>
  <text x="595" y="245" font-size="12" fill="#6b7280">Дійсний тиск пари E = 25.3 гПа</text>

  <!-- Horizontal line to Dew Point intersection on curve at x=500, y=230 -->
  <line x1="140" y1="230" x2="580" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Dew Point Intersection (500, 230) -->
  <circle cx="500" cy="230" r="6" fill="#27ae60"/>
  <text x="500" y="200" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка роси (100% RH)</text>

  <!-- Vertical dashed line down to X-axis for T_d -->
  <line x1="500" y1="230" x2="500" y2="350" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="500" y="372" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">T_d = 21.3 °C</text>

  <!-- Vertical dashed line down to X-axis for t -->
  <line x1="580" y1="230" x2="580" y2="350" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="580" y="372" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">t = 25.0 °C</text>

  <!-- Cooling Arrow along E line -->
  <line x1="570" y1="230" x2="515" y2="230" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="340" y="215" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Охолодження до роси</text>

  <!-- Footer Info -->
  <text x="480" y="425" font-size="12" fill="#6b7280" text-anchor="middle">При зниженні температури з 25.0°C до 21.3°C відносна вологість зростає з 80% до 100% (конденсація)</text>
</svg>
