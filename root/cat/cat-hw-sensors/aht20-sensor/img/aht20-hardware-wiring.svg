<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема апаратного підключення давача AHT20 до мікроконтролера</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Підтягувальні резистори I2C, фільтрація живлення C₁ та розв'язка для точності</text>

  <!-- BLOCK 1: MCU (x=40..240, y=85..510) -->
  <rect x="40" y="85" width="200" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <!-- MCU Badge -->
  <rect x="55" y="100" width="170" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="120" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="140" y="142" font-size="12" fill="#6b7280" text-anchor="middle">(ESP32 / STM32 / AVR)</text>

  <!-- MCU Pin Terminals on right edge (x=240) -->
  <line x1="215" y1="155" x2="240" y2="155" stroke="#d32f2f" stroke-width="2"/>
  <text x="210" y="159" font-size="12" font-weight="bold" fill="#d32f2f" text-anchor="end">3.3V (VDD)</text>

  <line x1="215" y1="195" x2="240" y2="195" stroke="#2457d6" stroke-width="2"/>
  <text x="210" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SDA</text>

  <line x1="215" y1="235" x2="240" y2="235" stroke="#7c3aed" stroke-width="2"/>
  <text x="210" y="239" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="end">SCL</text>

  <line x1="215" y1="275" x2="240" y2="275" stroke="#2c3e50" stroke-width="2"/>
  <text x="210" y="279" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="end">GND</text>

  <!-- MCU Specs Box -->
  <rect x="55" y="315" width="170" height="180" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="337" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри МК:</text>
  <text x="65" y="360" font-size="12" fill="#6b7280" text-anchor="start">• VDD: 1.6 ... 3.6 В</text>
  <text x="65" y="382" font-size="12" fill="#6b7280" text-anchor="start">• I2C: Master mode</text>
  <text x="65" y="404" font-size="12" fill="#6b7280" text-anchor="start">• f_SCL: до 400 кГц</text>
  <text x="65" y="426" font-size="12" fill="#6b7280" text-anchor="start">• GPIO Open-Drain</text>
  <text x="65" y="448" font-size="12" fill="#6b7280" text-anchor="start">• Вбудована підтяжка</text>
  <text x="65" y="466" font-size="11" fill="#c0392b" text-anchor="start">(часто недостатня)</text>

  <!-- BLOCK 2: Wires & Passives (x=240..640) -->
  <!-- VDD Main Line -->
  <line x1="240" y1="155" x2="640" y2="155" stroke="#d32f2f" stroke-width="2"/>
  <text x="250" y="147" font-size="12" font-weight="bold" fill="#d32f2f" text-anchor="start">+3.3V (VDD)</text>

  <!-- SDA Main Line -->
  <line x1="240" y1="195" x2="640" y2="195" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="187" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SDA</text>

  <!-- SCL Main Line -->
  <line x1="240" y1="235" x2="640" y2="235" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="227" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">SCL</text>

  <!-- GND Main Line -->
  <line x1="240" y1="275" x2="640" y2="275" stroke="#2c3e50" stroke-width="2"/>
  <text x="250" y="293" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">GND</text>

  <!-- Pull-up R1 (VDD to SDA at x=360) -->
  <circle cx="360" cy="155" r="3.5" fill="#d32f2f"/>
  <line x1="360" y1="155" x2="360" y2="166" stroke="#1a1a1a" stroke-width="1.8"/>
  <rect x="351" y="166" width="18" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="360" y1="184" x2="360" y2="195" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="360" cy="195" r="3.5" fill="#2457d6"/>
  <text x="343" y="178" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R₁ = 4.7 кОм</text>

  <!-- Pull-up R2 (VDD to SCL at x=440) -->
  <circle cx="440" cy="155" r="3.5" fill="#d32f2f"/>
  <line x1="440" y1="155" x2="440" y2="191" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M 440 191 L 440 192 A 3 3 0 0 1 440 198 L 440 206" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <rect x="431" y="206" width="18" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="440" y1="224" x2="440" y2="235" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="440" cy="235" r="3.5" fill="#7c3aed"/>
  <text x="423" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R₂ = 4.7 кОм</text>

  <!-- Filter Capacitor C1 (VDD to GND at x=520) -->
  <circle cx="520" cy="155" r="3.5" fill="#d32f2f"/>
  <line x1="520" y1="155" x2="520" y2="191" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M 520 191 L 520 192 A 3 3 0 0 1 520 198 L 520 231" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M 520 231 L 520 232 A 3 3 0 0 1 520 238 L 520 246" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="508" y1="246" x2="532" y2="246" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="508" y1="254" x2="532" y2="254" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="520" y1="254" x2="520" y2="275" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="520" cy="275" r="3.5" fill="#2c3e50"/>
  <text x="536" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₁ = 100 nF</text>
  <text x="536" y="264" font-size="11" fill="#6b7280" text-anchor="start">Фільтр 0.1 мкФ</text>

  <!-- Middle Info Panel -->
  <rect x="250" y="315" width="370" height="195" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="435" y="337" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Особливості шини I2C та живлення:</text>
  <text x="265" y="362" font-size="12" fill="#1a1a1a" text-anchor="start">• R₁, R₂ (Pull-up): 2.2 ... 10 кОм (типово 4.7 кОм)</text>
  <text x="265" y="386" font-size="12" fill="#1a1a1a" text-anchor="start">• Фіксована I2C-адреса AHT20: 0x38 (7-bit)</text>
  <text x="265" y="410" font-size="12" fill="#1a1a1a" text-anchor="start">• Конденсатор C₁ — якомога ближче до VDD</text>
  <text x="265" y="434" font-size="12" fill="#1a1a1a" text-anchor="start">• Максимальна довжина шини: &lt; 30 см</text>
  <text x="265" y="458" font-size="12" fill="#1a1a1a" text-anchor="start">• Перевірка давача: біт Busy = 0, Calibrated = 1</text>
  <text x="265" y="482" font-size="12" fill="#1a1a1a" text-anchor="start">• Контроль цілісності даних: CRC8 (пакет 7 байт)</text>

  <!-- BLOCK 3: AHT20 Sensor Module (x=640..920, y=85..510) -->
  <rect x="640" y="85" width="280" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <!-- Module Badge -->
  <rect x="655" y="100" width="250" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="780" y="120" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль давача AHT20</text>

  <!-- Input Pin Labels on left edge of AHT20 module -->
  <text x="652" y="159" font-size="12" font-weight="bold" fill="#d32f2f" text-anchor="start">VDD</text>
  <text x="652" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SDA</text>
  <text x="652" y="239" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">SCL</text>
  <text x="652" y="279" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">GND</text>

  <!-- AHT20 IC Package -->
  <rect x="705" y="145" width="180" height="150" rx="6" fill="#1a1a1a" stroke="#2457d6" stroke-width="2"/>
  
  <!-- MEMS Window -->
  <rect x="725" y="158" width="140" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="177" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MEMS Ємнісна комірка</text>
  <text x="795" y="193" font-size="11" fill="#6b7280" text-anchor="middle">Вологість &amp; Температура</text>

  <!-- ASIC Core -->
  <text x="795" y="232" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ASIC + OTP Калібрування</text>
  <text x="795" y="250" font-size="11" fill="#d0d7de" text-anchor="middle">20-bit ADC / CRC8 Check</text>
  <text x="795" y="278" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="middle">Busy Bit &amp; Calibrated Bit</text>

  <!-- Thermal Isolation Panel -->
  <rect x="655" y="315" width="250" height="195" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Decorative PCB isolation slots -->
  <rect x="662" y="325" width="4" height="175" rx="2" fill="#27ae60" opacity="0.35"/>
  <rect x="894" y="325" width="4" height="175" rx="2" fill="#27ae60" opacity="0.35"/>

  <text x="780" y="337" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вимоги до терморозв'язки:</text>
  
  <text x="675" y="360" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">1. Фрезерування прорізів</text>
  <text x="690" y="377" font-size="11" fill="#6b7280" text-anchor="start">ізоляція від тепла плати та МК</text>
  
  <text x="675" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Дистанціювання</text>
  <text x="690" y="415" font-size="11" fill="#6b7280" text-anchor="start">віддалення від джерел нагріву</text>
  
  <text x="675" y="436" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3. Інтервал опитування</text>
  <text x="690" y="453" font-size="11" fill="#6b7280" text-anchor="start">опитування ≥ 2 с (без самонагріву)</text>
  
  <text x="675" y="474" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">4. Захист довкілля</text>
  <text x="690" y="491" font-size="11" fill="#6b7280" text-anchor="start">захист від випарів та конденсату</text>
</svg>
