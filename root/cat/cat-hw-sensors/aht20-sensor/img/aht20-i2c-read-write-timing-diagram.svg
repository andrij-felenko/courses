<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-timing" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма обміну по шині I2C для AHT20</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність команд ініціалізації 0xBE та запуску вимірювання 0xAC із витримуванням затримок t_init ≥ 10 мс і t_meas ≥ 80 мс</text>

  <!-- Section 1: Init Command Sequence (0xBE) -->
  <rect x="50" y="90" width="860" height="150" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="70" y="115" font-size="14" font-weight="bold" fill="#2457d6">1. Процедура ініціалізації (0xBE)</text>

  <!-- I2C Packets for Init -->
  <!-- START -->
  <rect x="70" y="135" width="45" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="92" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">START</text>

  <!-- Address 0x70 (Write 0x38) -->
  <rect x="123" y="135" width="90" height="35" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="168" y="157" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x70 (W)</text>

  <!-- Command 0xBE -->
  <rect x="221" y="135" width="80" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="261" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Cmd 0xBE</text>

  <!-- Param 0x08 -->
  <rect x="309" y="135" width="80" height="35" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="349" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Data 0x08</text>

  <!-- Param 0x00 -->
  <rect x="397" y="135" width="80" height="35" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="437" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Data 0x00</text>

  <!-- STOP -->
  <rect x="485" y="135" width="45" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="507" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">STOP</text>

  <!-- Delay Arrow t_init -->
  <rect x="550" y="135" width="340" height="35" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="720" y="157" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Затримка t_init ≥ 10 мс (завантаження OTP)</text>

  <!-- Section 2: Measurement Trigger Sequence (0xAC) -->
  <rect x="50" y="260" width="860" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="70" y="285" font-size="14" font-weight="bold" fill="#27ae60">2. Цикл вимірювання (0xAC) та зчитання кадру</text>

  <!-- START -->
  <rect x="70" y="305" width="45" height="35" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="92" y="327" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">START</text>

  <!-- Address 0x70 -->
  <rect x="123" y="305" width="90" height="35" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="168" y="327" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x70 (W)</text>

  <!-- Cmd 0xAC -->
  <rect x="221" y="305" width="80" height="35" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="261" y="327" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Cmd 0xAC</text>

  <!-- Data 0x33 -->
  <rect x="309" y="305" width="70" height="35" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="344" y="327" font-size="12" fill="#1a1a1a" text-anchor="middle">0x33</text>

  <!-- Data 0x00 -->
  <rect x="387" y="305" width="70" height="35" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="422" y="327" font-size="12" fill="#1a1a1a" text-anchor="middle">0x00</text>

  <!-- STOP -->
  <rect x="465" y="305" width="45" height="35" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="487" y="327" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">STOP</text>

  <!-- Hardware Delay t_meas -->
  <rect x="520" y="305" width="220" height="35" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="630" y="327" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Затримка t_meas ≥ 80 мс</text>

  <!-- Read Packet 7 bytes -->
  <rect x="750" y="305" width="145" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="822" y="327" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0x71 (R) + 7 байтів</text>

  <!-- Bottom Annotation -->
  <text x="480" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Байт 0: Status (Busy=0, Calibrated=1) | Байти 1–3: RH 20-біт | Байти 3–5: Temp 20-біт | Байт 6: CRC-8</text>
  <text x="480" y="405" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Повне завершення вимірювання гарантує відсутність зчитування застарілих регістрів</text>

</svg>
