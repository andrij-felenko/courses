<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-rh" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-t" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розпакування 20-бітних даних AHT20 з 6 байтів I2C</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Байт 3 розщеплюється: старші 4 біти [7:4] належать S_RH, молодші 4 біти [3:0] — S_T</text>

  <!-- Панель вхідного масиву байтів I2C -->
  <rect x="40" y="80" width="880" height="155" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="55" y="104" font-size="13" font-weight="bold" fill="#1a1a1a">Вхідний масив 6 байтів I2C від давача AHT20</text>

  <!-- Byte 0: Статус -->
  <rect x="60" y="118" width="120" height="95" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="120" y="142" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Byte 0</text>
  <text x="120" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Статус AHT20</text>
  <text x="120" y="190" font-size="12" fill="#9ca3af" text-anchor="middle">біт [7:0]</text>

  <!-- Byte 1: S_RH [19:12] -->
  <rect x="195" y="118" width="120" height="95" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="255" y="142" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Byte 1</text>
  <text x="255" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">S_RH [19:12]</text>
  <text x="255" y="190" font-size="12" fill="#2457d6" text-anchor="middle">8 біт (старші)</text>

  <!-- Byte 2: S_RH [11:4] -->
  <rect x="330" y="118" width="120" height="95" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="390" y="142" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Byte 2</text>
  <text x="390" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">S_RH [11:4]</text>
  <text x="390" y="190" font-size="12" fill="#2457d6" text-anchor="middle">8 біт (середні)</text>

  <!-- Byte 3: Розщеплений (Спліт-байт) -->
  <rect x="465" y="118" width="156" height="95" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <text x="543" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Byte 3 (розділений)</text>

  <!-- Byte 3 Лівий нібл [7:4] (RH Low) -->
  <rect x="469" y="142" width="72" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="505" y="159" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S_RH</text>
  <text x="505" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">[3:0]</text>
  <text x="505" y="194" font-size="12" fill="#2457d6" text-anchor="middle">біти [7:4]</text>

  <!-- Byte 3 Правий нібл [3:0] (T High) -->
  <rect x="544" y="142" width="72" height="65" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="580" y="159" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S_T</text>
  <text x="580" y="176" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">[19:16]</text>
  <text x="580" y="194" font-size="12" fill="#27ae60" text-anchor="middle">біти [3:0]</text>

  <!-- Byte 4: S_T [15:8] -->
  <rect x="636" y="118" width="120" height="95" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="696" y="142" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Byte 4</text>
  <text x="696" y="165" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">S_T [15:8]</text>
  <text x="696" y="190" font-size="12" fill="#27ae60" text-anchor="middle">8 біт (середні)</text>

  <!-- Byte 5: S_T [7:0] -->
  <rect x="771" y="118" width="120" height="95" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="831" y="142" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Byte 5</text>
  <text x="831" y="165" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">S_T [7:0]</text>
  <text x="831" y="190" font-size="12" fill="#27ae60" text-anchor="middle">8 біт (молодші)</text>

  <!-- Стрілки від вхідних байтів до 20-бітних регістрів -->
  <!-- Стрілки S_RH (сині) -->
  <path d="M 255 213 C 255 250, 115 250, 115 274" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-rh)"/>
  <path d="M 390 213 C 390 250, 240 250, 240 274" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-rh)"/>
  <path d="M 505 207 C 505 250, 377.5 250, 377.5 274" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-rh)"/>

  <!-- Стрілки S_T (зелені) -->
  <path d="M 580 207 C 580 250, 582.5 250, 582.5 274" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-t)"/>
  <path d="M 696 213 C 696 250, 720 250, 720 274" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-t)"/>
  <path d="M 831 213 C 831 250, 845 250, 845 274" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-t)"/>

  <!-- Нижній лівий блок: Вологість S_RH -->
  <rect x="40" y="265" width="425" height="250" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="8"/>

  <!-- 20-бітний регістр S_RH -->
  <g>
    <rect x="55" y="280" width="120" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
    <text x="115" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Byte 1 [7:0]</text>
    <text x="115" y="318" font-size="12" fill="#2457d6" text-anchor="middle">біти [19:12]</text>

    <rect x="180" y="280" width="120" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
    <text x="240" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Byte 2 [7:0]</text>
    <text x="240" y="318" font-size="12" fill="#2457d6" text-anchor="middle">біти [11:4]</text>

    <rect x="305" y="280" width="145" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
    <text x="377.5" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Byte 3 [7:4]</text>
    <text x="377.5" y="318" font-size="12" fill="#2457d6" text-anchor="middle">біти [3:0]</text>
  </g>

  <!-- Підпис блоку вологості -->
  <text x="252.5" y="350" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Розпакований 20-бітний код вологості S_RH</text>

  <!-- С-код вологості -->
  <rect x="55" y="365" width="395" height="44" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="252.5" y="391" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S_RH = (Byte1 &lt;&lt; 12) | (Byte2 &lt;&lt; 4) | (Byte3 &gt;&gt; 4)</text>

  <!-- Формула вологості -->
  <rect x="55" y="425" width="395" height="72" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="252.5" y="452" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RH = (S_RH / 2²⁰) × 100%</text>
  <text x="252.5" y="478" font-size="12" fill="#6b7280" text-anchor="middle">Діапазон вологості: 0% ... 100% RH</text>

  <!-- Нижній правий блок: Температура S_T -->
  <rect x="495" y="265" width="425" height="250" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5" rx="8"/>

  <!-- 20-бітний регістр S_T -->
  <g>
    <rect x="510" y="280" width="145" height="48" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="582.5" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Byte 3 [3:0]</text>
    <text x="582.5" y="318" font-size="12" fill="#27ae60" text-anchor="middle">біти [19:16]</text>

    <rect x="660" y="280" width="120" height="48" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="720" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Byte 4 [7:0]</text>
    <text x="720" y="318" font-size="12" fill="#27ae60" text-anchor="middle">біти [15:8]</text>

    <rect x="785" y="280" width="120" height="48" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
    <text x="845" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Byte 5 [7:0]</text>
    <text x="845" y="318" font-size="12" fill="#27ae60" text-anchor="middle">біти [7:0]</text>
  </g>

  <!-- Підпис блоку температури -->
  <text x="707.5" y="350" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Розпакований 20-бітний код температури S_T</text>

  <!-- С-код температури -->
  <rect x="510" y="365" width="395" height="44" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="707.5" y="391" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S_T = ((Byte3 &amp; 0x0F) &lt;&lt; 16) | (Byte4 &lt;&lt; 8) | Byte5</text>

  <!-- Формула температури -->
  <rect x="510" y="425" width="395" height="72" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="707.5" y="452" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T (°C) = (S_T / 2²⁰) × 200 - 50</text>
  <text x="707.5" y="478" font-size="12" fill="#6b7280" text-anchor="middle">Діапазон температури: -40 °C ... +85 °C</text>
</svg>
