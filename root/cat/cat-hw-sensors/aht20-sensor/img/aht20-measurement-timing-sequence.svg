<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова послідовність вимірювання та стани шини I2C давача AHT20</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Пауза ≥80 мс та перевірка біта Busy (Bit 7) запобігають зчитуванню некоректних даних</text>

  <!-- Step 1: Start Measurement -->
  <rect x="30" y="85" width="205" height="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="42" y="97" width="181" height="24" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="132" y="113" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">КРОК 1: ЗАПУСК</text>
  <text x="132" y="140" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Команда 0xAC 0x33 0x00</text>
  <text x="132" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Запис 3 байтів на I2C 0x38</text>
  <text x="132" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">Старт АЦП-перетворення</text>
  <text x="132" y="206" font-size="12" fill="#6b7280" text-anchor="middle">ініціація вимірювання</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="237" y1="155" x2="254" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2: Delay -->
  <rect x="261" y="85" width="205" height="140" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="273" y="97" width="181" height="24" fill="#ffffff" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="363" y="113" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">КРОК 2: ЗАТРИМКА</text>
  <text x="363" y="140" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Пауза t_meas ≥ 80 мс</text>
  <text x="363" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Час вимірювання T та RH</text>
  <text x="363" y="184" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Статус: Busy = 1</text>
  <text x="363" y="206" font-size="12" fill="#c0392b" text-anchor="middle">Зчитування заборонено</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="468" y1="155" x2="485" y2="155" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Step 3: Polling -->
  <rect x="492" y="85" width="205" height="140" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="504" y="97" width="181" height="24" fill="#ffffff" stroke="#6b7280" stroke-width="1" rx="4"/>
  <text x="594" y="113" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">КРОК 3: ОПИТУВАННЯ</text>
  <text x="594" y="140" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Читання стану (0x38 R)</text>
  <text x="594" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Опитування біта Busy (Bit 7)</text>
  <text x="594" y="184" font-size="12" fill="#c0392b" text-anchor="middle">Busy = 1 → чекати</text>
  <text x="594" y="206" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Busy = 0 → готово</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="699" y1="155" x2="716" y2="155" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step 4: Read Data -->
  <rect x="723" y="85" width="207" height="140" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="735" y="97" width="183" height="24" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="826" y="113" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">КРОК 4: ЗЧИТУВАННЯ</text>
  <text x="826" y="140" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Кадр 7 байтів</text>
  <text x="826" y="162" font-size="12" fill="#1a1a1a" text-anchor="middle">Status + RH + Temp + CRC8</text>
  <text x="826" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Calibrated (Bit 3) == 1</text>
  <text x="826" y="206" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Перевірка CRC8</text>

  <!-- Lower Left Panel: Signal Sequence -->
  <rect x="30" y="245" width="435" height="250" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="247" y="268" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова послідовність сигналів шини I2C</text>

  <!-- Inner Container Left -->
  <rect x="45" y="282" width="405" height="198" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Phase 1: Command Write -->
  <rect x="55" y="295" width="90" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="100" y="314" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">0xAC 0x33 0x00</text>
  <text x="100" y="331" font-size="12" fill="#6b7280" text-anchor="middle">I2C Write (0x38)</text>

  <!-- Phase 2: Delay Wait -->
  <rect x="160" y="295" width="160" height="45" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="240" y="314" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Пауза t_meas ≥ 80 мс</text>
  <text x="240" y="331" font-size="12" fill="#1a1a1a" text-anchor="middle">Busy = 1 (вимірювання)</text>

  <!-- Phase 3: Read Frame -->
  <rect x="335" y="295" width="100" height="45" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="385" y="314" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">7B Response</text>
  <text x="385" y="331" font-size="12" fill="#6b7280" text-anchor="middle">I2C Read (0x38)</text>

  <!-- Phase Arrows -->
  <line x1="146" y1="317" x2="158" y2="317" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="321" y1="317" x2="333" y2="317" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Timeline Axis -->
  <line x1="55" y1="365" x2="425" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="435" y="360" font-size="12" fill="#6b7280" text-anchor="end">t (час)</text>

  <!-- Timeline Ticks & Labels -->
  <line x1="100" y1="358" x2="100" y2="372" stroke="#2457d6" stroke-width="1.5"/>
  <text x="100" y="392" font-size="12" fill="#1a1a1a" text-anchor="middle">0 мс</text>
  <text x="100" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Старт</text>

  <line x1="240" y1="358" x2="240" y2="372" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="392" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">80 мс</text>
  <text x="240" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">Опитування Busy</text>

  <line x1="385" y1="358" x2="385" y2="372" stroke="#27ae60" stroke-width="1.5"/>
  <text x="385" y="392" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">~80..100 мс</text>
  <text x="385" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">Зчитування даних</text>

  <!-- Summary Note Box Left -->
  <rect x="55" y="430" width="380" height="38" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="245" y="446" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Правило: не читати дані до завершення паузи 80 мс!</text>
  <text x="245" y="462" font-size="12" fill="#6b7280" text-anchor="middle">Раннє зчитування повертає застарілі або недійсні значення</text>

  <!-- Lower Right Panel: 7-byte Frame Structure -->
  <rect x="495" y="245" width="435" height="250" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="712" y="268" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Структура 7-байтного кадру відповіді (I2C Read)</text>

  <!-- Inner Container Right -->
  <rect x="510" y="282" width="405" height="198" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- 7 Byte Boxes -->
  <rect x="518" y="295" width="52" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="544" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 0</text>
  <text x="544" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">Status</text>

  <rect x="574" y="295" width="52" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="600" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 1</text>
  <text x="600" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">RH[19:12]</text>

  <rect x="630" y="295" width="52" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="656" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 2</text>
  <text x="656" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">RH[11:4]</text>

  <rect x="686" y="295" width="52" height="44" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" rx="3"/>
  <text x="712" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Байт 3</text>
  <text x="712" y="329" font-size="12" fill="#6b7280" text-anchor="middle">RH|Temp</text>

  <rect x="742" y="295" width="52" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="768" y="312" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Байт 4</text>
  <text x="768" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">T[15:8]</text>

  <rect x="798" y="295" width="52" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="824" y="312" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Байт 5</text>
  <text x="824" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">T[7:0]</text>

  <rect x="854" y="295" width="52" height="44" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="3"/>
  <text x="880" y="312" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Байт 6</text>
  <text x="880" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">CRC8</text>

  <!-- Field Cards Right -->
  <!-- Card 1: Status Byte -->
  <rect x="518" y="350" width="115" height="118" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="575" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Байт 0: Status</text>
  <text x="575" y="387" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Bit 7: Busy</text>
  <text x="575" y="405" font-size="12" fill="#6b7280" text-anchor="middle">1=вимірює, 0=готов</text>
  <text x="575" y="427" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Bit 3: Calibrated</text>
  <text x="575" y="445" font-size="12" fill="#6b7280" text-anchor="middle">1=калібровано</text>

  <!-- Card 2: 20-bit Fields -->
  <rect x="641" y="350" width="195" height="118" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="738" y="367" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">20-бітні поля даних</text>
  <text x="738" y="387" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">RH raw = {B1, B2, B3[7:4]}</text>
  <text x="738" y="405" font-size="12" fill="#6b7280" text-anchor="middle">формують 20 біт вологості</text>
  <text x="738" y="427" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Temp raw = {B3[3:0], B4, B5}</text>
  <text x="738" y="445" font-size="12" fill="#6b7280" text-anchor="middle">формують 20 біт температури</text>

  <!-- Card 3: CRC8 -->
  <rect x="844" y="350" width="62" height="118" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="875" y="367" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">CRC8</text>
  <text x="875" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Контроль</text>
  <text x="875" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">помилок</text>
  <text x="875" y="430" font-size="12" fill="#6b7280" text-anchor="middle">кадру</text>
</svg>
