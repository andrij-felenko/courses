<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header and Subheader -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність ініціалізації та калібрування VL53L0X API</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Порядок викликів DataInit, StaticInit, RefCalibration та переходи станів драйвера</text>

  <!-- Column Headers -->
  <rect x="70" y="70" width="140" height="35" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="140" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Додаток MCU</text>

  <rect x="360" y="70" width="160" height="35" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="440" y="92" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X API (Драйвер)</text>

  <rect x="630" y="70" width="160" height="35" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="710" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VL53L0X (Сенсор)</text>

  <rect x="815" y="70" width="115" height="35" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="872" y="92" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Стан API</text>

  <!-- Lifelines -->
  <line x1="140" y1="105" x2="140" y2="468" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="440" y1="105" x2="440" y2="468" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="710" y1="105" x2="710" y2="468" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <line x1="872" y1="105" x2="872" y2="468" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- Activations -->
  <rect x="433" y="125" width="14" height="56" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <rect x="703" y="147" width="14" height="34" fill="#f4f6f8" stroke="#6b7280" rx="2"/>

  <rect x="433" y="203" width="14" height="56" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <rect x="703" y="225" width="14" height="34" fill="#f4f6f8" stroke="#6b7280" rx="2"/>

  <rect x="433" y="281" width="14" height="100" fill="#e9f7ef" stroke="#27ae60" rx="2"/>
  <rect x="703" y="295" width="14" height="86" fill="#e9f7ef" stroke="#27ae60" rx="2"/>

  <rect x="433" y="403" width="14" height="56" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <rect x="703" y="440" width="14" height="18" fill="#eaf0fd" stroke="#2457d6" rx="2"/>

  <!-- STEP 1 -->
  <!-- Call VL53L0X_DataInit -->
  <text x="286" y="125" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X_DataInit(&amp;Dev)</text>
  <line x1="140" y1="132" x2="425" y2="132" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Action: Soft Reset & Read Model ID -->
  <text x="575" y="147" font-size="11" fill="#1a1a1a" text-anchor="middle">Soft Reset &amp; I2C Init (0x52)</text>
  <line x1="447" y1="154" x2="695" y2="154" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <text x="575" y="169" font-size="11" fill="#6b7280" text-anchor="middle">Model ID (0xEE) &amp; Revision</text>
  <line x1="703" y1="176" x2="455" y2="176" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)"/>

  <!-- State Badge 1 -->
  <rect x="815" y="130" width="115" height="42" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="872" y="146" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">UNINITIALIZED</text>
  <text x="872" y="161" font-size="10" fill="#c0392b" text-anchor="middle">&#x2794; WAIT_STATICINIT</text>

  <!-- STEP 2 -->
  <!-- Call VL53L0X_StaticInit -->
  <text x="286" y="203" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X_StaticInit(&amp;Dev)</text>
  <line x1="140" y1="210" x2="425" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Actions -->
  <text x="575" y="225" font-size="11" fill="#1a1a1a" text-anchor="middle">Завантаження Tuning Table (RAM/Reg)</text>
  <line x1="447" y1="232" x2="695" y2="232" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <text x="575" y="247" font-size="11" fill="#1a1a1a" text-anchor="middle">Конфігурація матриці SPAD</text>
  <line x1="447" y1="254" x2="695" y2="254" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- State Badge 2 -->
  <rect x="815" y="208" width="115" height="42" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="872" y="224" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">WAIT_STATICINIT</text>
  <text x="872" y="239" font-size="10" fill="#2457d6" text-anchor="middle">&#x2794; STATE_IDLE</text>

  <!-- STEP 3 -->
  <!-- Call RefSpadManagement -->
  <text x="286" y="281" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X_PerformRefSpadManagement()</text>
  <line x1="140" y1="288" x2="425" y2="288" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="575" y="303" font-size="11" fill="#1a1a1a" text-anchor="middle">Пошук reference SPAD (Aperture)</text>
  <line x1="447" y1="310" x2="695" y2="310" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Call RefCalibration -->
  <text x="286" y="325" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X_PerformRefCalibration()</text>
  <line x1="140" y1="332" x2="425" y2="332" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="575" y="347" font-size="11" fill="#27ae60" text-anchor="middle">VHV Calibration (Напруга VCSEL)</text>
  <line x1="447" y1="354" x2="695" y2="354" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <text x="575" y="369" font-size="11" fill="#27ae60" text-anchor="middle">Phase Calibration (Затримка/фаза)</text>
  <line x1="447" y1="376" x2="695" y2="376" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- State Badge 3 -->
  <rect x="815" y="295" width="115" height="70" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="872" y="313" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">STATE_IDLE</text>
  <text x="872" y="328" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">(Calibrated)</text>
  <text x="872" y="343" font-size="10" fill="#27ae60" text-anchor="middle">VHV + Phase OK</text>
  <text x="872" y="356" font-size="10" fill="#6b7280" text-anchor="middle">SPAD map saved</text>

  <!-- STEP 4 -->
  <!-- Call Timing Budget & Start -->
  <text x="286" y="403" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X_SetMeasurementTimingBudget()</text>
  <line x1="140" y1="410" x2="425" y2="410" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="286" y="425" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X_StartMeasurement()</text>
  <line x1="140" y1="432" x2="425" y2="432" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="575" y="447" font-size="11" fill="#1a1a1a" text-anchor="middle">Старт VCSEL імпульсів (940 нм)</text>
  <line x1="447" y1="454" x2="695" y2="454" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- State Badge 4 -->
  <rect x="815" y="410" width="115" height="42" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="872" y="426" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">STATE_RUNNING</text>
  <text x="872" y="441" font-size="10" fill="#2457d6" text-anchor="middle">(Single / Cont)</text>

  <!-- Summary Footer Bar -->
  <rect x="30" y="475" width="900" height="38" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="480" y="499" font-size="12" fill="#1a1a1a" text-anchor="middle">Послідовність: DataInit (Reset/ID) &#x2794; StaticInit (Tuning/SPAD) &#x2794; RefCalibration (VHV/Phase) &#x2794; Start Ranging</text>
</svg>
