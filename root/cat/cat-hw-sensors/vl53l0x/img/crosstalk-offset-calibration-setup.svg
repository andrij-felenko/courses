<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Практичне калібрування лазерного далекоміра VL53L0X</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Offset усуває системний зсув відстані, Crosstalk приглушує перевідбиття від скла</text>

  <!-- PANEL 1: OFFSET CALIBRATION -->
  <rect x="30" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="106" font-size="15" font-weight="bold" fill="#1a1a1a">1. Калібрування зсуву (Offset Calibration)</text>
  <text x="50" y="125" font-size="12" fill="#6b7280">Корекція систематичної похибки виміряної відстані</text>

  <!-- Headers for components in Panel 1 -->
  <text x="171" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Захисне скло</text>
  <text x="95" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус пристрою</text>

  <text x="399" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сіра мішень</text>
  <text x="399" y="156" font-size="12" fill="#6b7280" text-anchor="middle">(17% відбиття)</text>

  <!-- Device housing -->
  <rect x="50" y="165" width="130" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- VL53L0X Sensor -->
  <rect x="62" y="195" width="70" height="110" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="97" y="213" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X</text>

  <!-- VCSEL & SPAD -->
  <rect x="72" y="225" width="50" height="22" rx="3" fill="#2457d6"/>
  <text x="97" y="240" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VCSEL</text>

  <rect x="72" y="275" width="50" height="22" rx="3" fill="#27ae60"/>
  <text x="97" y="290" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SPAD</text>

  <!-- Gasket wall (Optical barrier) -->
  <rect x="128" y="250" width="37" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Pointer and Label for Gasket -->
  <path d="M 200,256 L 168,256" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="205" y="260" font-size="12" fill="#1a1a1a">Перестінок</text>

  <!-- Cover Glass -->
  <rect x="165" y="175" width="12" height="150" rx="2" fill="#2457d6" fill-opacity="0.15" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Target Plate -->
  <rect x="390" y="175" width="18" height="150" rx="2" fill="#b0b8c0" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Beams -->
  <line x1="122" y1="236" x2="390" y2="236" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="275" y="226" font-size="12" fill="#2457d6" text-anchor="middle">Прямий промінь (VCSEL)</text>

  <line x1="390" y1="286" x2="122" y2="286" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="275" y="304" font-size="12" fill="#27ae60" text-anchor="middle">Відбитий сигнал (SPAD)</text>

  <!-- Dimension line -->
  <line x1="177" y1="340" x2="177" y2="362" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="390" y1="340" x2="390" y2="362" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="177" y1="352" x2="390" y2="352" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 183,348 L 177,352 L 183,356" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 384,348 L 390,352 L 384,356" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="283.5" y="372" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_cal = 100 мм</text>

  <!-- Summary Box Offset -->
  <rect x="50" y="390" width="395" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="414" font-size="13" font-weight="bold" fill="#1a1a1a">Формула та регістри Offset:</text>
  <text x="65" y="435" font-size="12" fill="#1a1a1a">• D_real = D_raw - D_offset</text>
  <text x="65" y="455" font-size="12" fill="#6b7280">• D_offset = D_measured - 100 мм</text>
  <text x="65" y="482" font-size="12" font-weight="bold" fill="#2457d6">API: VL53L0X_SetOffsetCalibrationDataMicroMeter()</text>

  <!-- PANEL 2: CROSSTALK CALIBRATION -->
  <rect x="495" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="515" y="106" font-size="15" font-weight="bold" fill="#1a1a1a">2. Калібрування Crosstalk (Паразитне наведення)</text>
  <text x="515" y="125" font-size="12" fill="#6b7280">Вимірювання та компенсація перевідбиття від скла</text>

  <!-- Headers for components in Panel 2 -->
  <text x="636" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Скло (джерело XTalk)</text>
  <text x="560" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус пристрою</text>

  <text x="864" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Чорна мішень</text>
  <text x="864" y="156" font-size="12" fill="#6b7280" text-anchor="middle">(3% відбиття)</text>

  <!-- Device housing -->
  <rect x="515" y="165" width="130" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- VL53L0X Sensor -->
  <rect x="527" y="195" width="70" height="110" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="562" y="213" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VL53L0X</text>

  <!-- VCSEL & SPAD -->
  <rect x="537" y="225" width="50" height="22" rx="3" fill="#2457d6"/>
  <text x="562" y="240" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VCSEL</text>

  <rect x="537" y="275" width="50" height="22" rx="3" fill="#27ae60"/>
  <text x="562" y="290" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SPAD</text>

  <!-- Gasket gap/wall -->
  <rect x="593" y="250" width="37" height="12" rx="2" fill="#1a1a1a"/>

  <!-- Cover Glass with XTalk reflection -->
  <rect x="630" y="175" width="12" height="150" rx="2" fill="#fdecea" fill-opacity="0.8" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Internal reflection path (Crosstalk) -->
  <path d="M 587,236 L 630,236 L 630,286 L 587,286" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <!-- Pointer and Label for Crosstalk -->
  <path d="M 665,256 L 635,256" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="670" y="260" font-size="12" fill="#c0392b">Паразитне наведення (XTalk)</text>

  <!-- Target Plate (Black) -->
  <rect x="855" y="175" width="18" height="150" rx="2" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transmitted beam (absorbed) -->
  <line x1="642" y1="236" x2="855" y2="236" stroke="#2457d6" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#arr-accent)"/>
  <text x="748" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Основний промінь поглинається</text>

  <!-- Dimension line -->
  <line x1="642" y1="340" x2="642" y2="362" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="855" y1="340" x2="855" y2="362" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="642" y1="352" x2="855" y2="352" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 648,348 L 642,352 L 648,356" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 849,348 L 855,352 L 849,356" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="748.5" y="372" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_cal ≥ 400 мм</text>

  <!-- Summary Box Crosstalk -->
  <rect x="515" y="390" width="395" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="414" font-size="13" font-weight="bold" fill="#1a1a1a">Обчислення та регістри Crosstalk:</text>
  <text x="530" y="435" font-size="12" fill="#c0392b">• I_xtalk (kcps) = сигнал SPAD без ехо від мішені</text>
  <text x="530" y="455" font-size="12" fill="#6b7280">• Компенсація фонового перевідбиття у реальному часі</text>
  <text x="530" y="482" font-size="12" fill="#2457d6">API: VL53L0X_SetXTalkCompensationRateMegaCps()</text>
</svg>
