<svg width="960" height="530" viewBox="0 0 960 530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шина I2C та керування XSHUT для кількох VL53L0X</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Послідовне переведення з Hardware Shutdown у робочий режим для динамічної зміни I2C-адрес</text>

  <!-- СЕКЦІЯ 1: Апаратне підключення -->
  <rect x="20" y="65" width="920" height="240" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="35" y="88" font-size="14" font-weight="bold" fill="#2457d6">1. Апаратне підключення (Спільна шина I2C + окремі лінії XSHUT)</text>

  <!-- Мікроконтролер (MCU) -->
  <rect x="35" y="105" width="180" height="185" fill="white" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="125" y="125" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="125" y="142" font-size="12" fill="#6b7280" text-anchor="middle">(ESP32 / STM32)</text>

  <!-- Виводи МК -->
  <text x="205" y="170" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="end">SDA (GPIO21)</text>
  <text x="205" y="195" font-size="12" font-weight="bold" fill="#d97706" text-anchor="end">SCL (GPIO22)</text>
  <text x="205" y="225" font-size="12" fill="#1a1a1a" text-anchor="end">GPIO17 (X1)</text>
  <text x="205" y="250" font-size="12" fill="#1a1a1a" text-anchor="end">GPIO18 (X2)</text>
  <text x="205" y="275" font-size="12" fill="#1a1a1a" text-anchor="end">GPIO19 (X3)</text>

  <!-- Підтягувальні резистори I2C (R_pu) -->
  <line x1="265" y1="105" x2="315" y2="105" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="100" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3 В</text>

  <line x1="275" y1="105" x2="275" y2="125" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="267" y="125" width="16" height="24" fill="white" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="141" font-size="12" fill="#6b7280" text-anchor="end">R_pu</text>
  <line x1="275" y1="149" x2="275" y2="166" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="275" cy="166" r="3" fill="#2563eb"/>

  <line x1="305" y1="105" x2="305" y2="125" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="297" y="125" width="16" height="24" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="141" font-size="12" fill="#6b7280" text-anchor="start">R_pu</text>
  <line x1="305" y1="149" x2="305" y2="191" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="305" cy="191" r="3" fill="#d97706"/>

  <!-- Лінії шини I2C -->
  <line x1="215" y1="166" x2="905" y2="166" stroke="#2563eb" stroke-width="2.5"/>
  <text x="225" y="158" font-size="12" font-weight="bold" fill="#2563eb">SDA</text>

  <line x1="215" y1="191" x2="905" y2="191" stroke="#d97706" stroke-width="2.5"/>
  <text x="225" y="183" font-size="12" font-weight="bold" fill="#d97706">SCL</text>

  <!-- Лінії керування XSHUT -->
  <!-- XSHUT1 -> VL53L0X #1 -->
  <line x1="215" y1="221" x2="370" y2="221" stroke="#2457d6" stroke-width="2"/>

  <!-- XSHUT2 -> VL53L0X #2 (трасування обходу по нижньому краю) -->
  <path d="M 215,246 L 340,246 L 340,294 L 545,294 L 545,246 L 555,246" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- XSHUT3 -> VL53L0X #3 (трасування обходу по найнижчому краю) -->
  <path d="M 215,271 L 330,271 L 330,299 L 730,299 L 730,271 L 740,271" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- ДАВАЧ 1 (VL53L0X #1) -->
  <rect x="370" y="105" width="160" height="185" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="450" y="125" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VL53L0X №1</text>
  <rect x="390" y="133" width="120" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="450" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C: 0x30 (зміна)</text>

  <circle cx="400" cy="166" r="3" fill="#2563eb"/>
  <line x1="400" y1="166" x2="400" y2="178" stroke="#2563eb" stroke-width="1.5"/>
  <text x="408" y="174" font-size="12" fill="#2563eb">SDA</text>

  <circle cx="430" cy="191" r="3" fill="#d97706"/>
  <line x1="430" y1="191" x2="430" y2="203" stroke="#d97706" stroke-width="1.5"/>
  <text x="438" y="199" font-size="12" fill="#d97706">SCL</text>

  <circle cx="370" cy="221" r="3" fill="#2457d6"/>
  <text x="378" y="225" font-size="12" font-weight="bold" fill="#2457d6">XSHUT</text>
  <text x="450" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Канал 1</text>

  <!-- ДАВАЧ 2 (VL53L0X #2) -->
  <rect x="555" y="105" width="160" height="185" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="635" y="125" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VL53L0X №2</text>
  <rect x="575" y="133" width="120" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="635" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C: 0x31 (зміна)</text>

  <circle cx="585" cy="166" r="3" fill="#2563eb"/>
  <line x1="585" y1="166" x2="585" y2="178" stroke="#2563eb" stroke-width="1.5"/>
  <text x="593" y="174" font-size="12" fill="#2563eb">SDA</text>

  <circle cx="615" cy="191" r="3" fill="#d97706"/>
  <line x1="615" y1="191" x2="615" y2="203" stroke="#d97706" stroke-width="1.5"/>
  <text x="623" y="199" font-size="12" fill="#d97706">SCL</text>

  <circle cx="555" cy="246" r="3" fill="#2457d6"/>
  <text x="563" y="250" font-size="12" font-weight="bold" fill="#2457d6">XSHUT</text>
  <text x="635" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Канал 2</text>

  <!-- ДАВАЧ 3 (VL53L0X #3) -->
  <rect x="740" y="105" width="160" height="185" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="820" y="125" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VL53L0X №3</text>
  <rect x="760" y="133" width="120" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="820" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C: 0x32 (зміна)</text>

  <circle cx="770" cy="166" r="3" fill="#2563eb"/>
  <line x1="770" y1="166" x2="770" y2="178" stroke="#2563eb" stroke-width="1.5"/>
  <text x="778" y="174" font-size="12" fill="#2563eb">SDA</text>

  <circle cx="800" cy="191" r="3" fill="#d97706"/>
  <line x1="800" y1="191" x2="800" y2="203" stroke="#d97706" stroke-width="1.5"/>
  <text x="808" y="199" font-size="12" fill="#d97706">SCL</text>

  <circle cx="740" cy="271" r="3" fill="#2457d6"/>
  <text x="748" y="275" font-size="12" font-weight="bold" fill="#2457d6">XSHUT</text>
  <text x="820" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Канал 3</text>

  <!-- СЕКЦІЯ 2: Алгоритм послідовного включення -->
  <rect x="20" y="320" width="920" height="195" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="35" y="343" font-size="14" font-weight="bold" fill="#2457d6">2. Послідовність динамічної зміни адрес при завантаженні (Power-On Reset)</text>

  <!-- Крок 1 -->
  <rect x="35" y="355" width="210" height="143" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="45" y="365" width="190" height="24" fill="#c0392b" rx="4"/>
  <text x="140" y="381" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Крок 1: Апаратне скидання</text>

  <rect x="55" y="396" width="170" height="20" fill="white" stroke="#c0392b" stroke-dasharray="3,3" rx="3"/>
  <text x="140" y="410" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">XSHUT1..3 = LOW (0 В)</text>

  <text x="140" y="434" font-size="12" fill="#1a1a1a" text-anchor="middle">Усі давачі вимкнені</text>
  <text x="140" y="454" font-size="12" fill="#1a1a1a" text-anchor="middle">Шина I2C повністю вільна</text>
  <text x="140" y="474" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Немає колізії 0x29</text>

  <!-- Стрілка 1->2 -->
  <line x1="247" y1="426" x2="257" y2="426" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Крок 2 -->
  <rect x="260" y="355" width="210" height="143" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="270" y="365" width="190" height="24" fill="#2457d6" rx="4"/>
  <text x="365" y="381" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Крок 2: Налаштування №1</text>

  <rect x="280" y="396" width="170" height="20" fill="white" stroke="#2457d6" rx="3"/>
  <text x="365" y="410" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">XSHUT1 = HIGH (3.3 В)</text>

  <text x="365" y="434" font-size="12" fill="#1a1a1a" text-anchor="middle">Sens 1 вмикається (0x29)</text>
  <text x="365" y="454" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис нової адреси в I2C</text>
  <text x="365" y="474" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Sens 1 -> адреса 0x30</text>

  <!-- Стрілка 2->3 -->
  <line x1="472" y1="426" x2="482" y2="426" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Крок 3 -->
  <rect x="485" y="355" width="210" height="143" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="495" y="365" width="190" height="24" fill="#2457d6" rx="4"/>
  <text x="590" y="381" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Крок 3: Налаштування №2</text>

  <rect x="505" y="396" width="170" height="20" fill="white" stroke="#2457d6" rx="3"/>
  <text x="590" y="410" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">XSHUT2 = HIGH (3.3 В)</text>

  <text x="590" y="434" font-size="12" fill="#1a1a1a" text-anchor="middle">Sens 2 вмикається (0x29)</text>
  <text x="590" y="454" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис нової адреси в I2C</text>
  <text x="590" y="474" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Sens 2 -> адреса 0x31</text>

  <!-- Стрілка 3->4 -->
  <line x1="697" y1="426" x2="707" y2="426" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Крок 4 -->
  <rect x="710" y="355" width="210" height="143" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="720" y="365" width="190" height="24" fill="#27ae60" rx="4"/>
  <text x="815" y="381" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Крок 4: Готовність</text>

  <rect x="730" y="396" width="170" height="20" fill="white" stroke="#27ae60" rx="3"/>
  <text x="815" y="410" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">XSHUT3 = HIGH (3.3 В)</text>

  <text x="815" y="434" font-size="12" fill="#1a1a1a" text-anchor="middle">Sens 3 -> адреса 0x32</text>
  <text x="815" y="454" font-size="12" fill="#1a1a1a" text-anchor="middle">Усі 3 давачі в роботі</text>
  <text x="815" y="474" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Паралельне опитування</text>
</svg>
