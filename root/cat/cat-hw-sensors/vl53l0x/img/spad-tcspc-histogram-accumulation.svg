<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гістограма накопичення фотонів у часових каналах TCSPC</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Виділення піку корисного сигналу N_sig над пуассонівським фоном сонячного шуму N_bg</text>

  <!-- Left Main Chart Panel -->
  <rect x="30" y="75" width="610" height="405" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="50" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Розподіл фотонних відліків по часових каналах (Bins)</text>

  <!-- Histogram Bins (Rectangles) -->
  <!-- Pre-start & Start Pulse Bins -->
  <rect x="126" y="312" width="8" height="88" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="136" y="308" width="8" height="92" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="146" y="270" width="8" height="130" fill="#6b7280" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="156" y="210" width="8" height="190" fill="#6b7280" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="166" y="265" width="8" height="135" fill="#6b7280" stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Inter-pulse Noise Bins -->
  <rect x="176" y="314" width="8" height="86" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="186" y="306" width="8" height="94" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="196" y="311" width="8" height="89" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="206" y="305" width="8" height="95" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="216" y="313" width="8" height="87" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="226" y="307" width="8" height="93" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="236" y="310" width="8" height="90" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="246" y="304" width="8" height="96" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="256" y="312" width="8" height="88" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="266" y="308" width="8" height="92" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="276" y="315" width="8" height="85" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="286" y="307" width="8" height="93" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="296" y="311" width="8" height="89" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="306" y="306" width="8" height="94" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="316" y="313" width="8" height="87" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="326" y="305" width="8" height="95" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>

  <!-- Signal Peak Bins -->
  <rect x="336" y="295" width="8" height="105" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="346" y="275" width="8" height="125" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="356" y="235" width="8" height="165" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="366" y="190" width="8" height="210" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="376" y="160" width="8" height="240" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="386" y="145" width="8" height="255" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="396" y="160" width="8" height="240" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="406" y="190" width="8" height="210" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="416" y="235" width="8" height="165" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="426" y="275" width="8" height="125" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect x="436" y="295" width="8" height="105" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Post-signal Noise Bins -->
  <rect x="446" y="308" width="8" height="92" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="456" y="313" width="8" height="87" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="466" y="306" width="8" height="94" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="476" y="310" width="8" height="90" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="486" y="304" width="8" height="96" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="496" y="312" width="8" height="88" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="506" y="308" width="8" height="92" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="516" y="314" width="8" height="86" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="526" y="306" width="8" height="94" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="536" y="310" width="8" height="90" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="546" y="308" width="8" height="92" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="556" y="312" width="8" height="88" fill="#d0d7de" stroke="#6b7280" stroke-width="0.5"/>

  <!-- Noise Floor Line -->
  <line x1="110" y1="310" x2="580" y2="310" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="250" y="265" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">
    <tspan x="250" dy="0">Рівень фону N_bg</tspan>
    <tspan x="250" dy="16">(пуассонівський шум)</tspan>
  </text>
  <line x1="95" y1="398" x2="95" y2="312" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>
  <text x="88" y="360" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">N_bg</text>

  <!-- Start Pulse Reference Mark -->
  <line x1="160" y1="400" x2="160" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="160" y="145" font-size="12" fill="#6b7280" text-anchor="middle">Старт (t₀)</text>
  <text x="160" y="160" font-size="12" fill="#6b7280" text-anchor="middle">опорний лазер</text>

  <!-- Signal Peak Envelope & Annotation -->
  <path d="M 330 310 Q 360 310 370 195 Q 390 135 410 195 Q 420 310 450 310" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="390" y1="400" x2="390" y2="135" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="390" y="120" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Стоп t_TOF (Пік відбиття)</text>

  <!-- Signal Height Dimension Arrow (N_sig) -->
  <line x1="442" y1="308" x2="442" y2="147" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="454" y="220" font-size="12" font-weight="bold" fill="#2457d6">Корисний сигнал N_sig</text>
  <text x="454" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">N_peak = N_sig + N_bg</text>

  <!-- Axes -->
  <line x1="110" y1="400" x2="110" y2="125" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="110" y1="400" x2="610" y2="400" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Axis Titles & Tick Labels -->
  <text x="130" y="116" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Накопичені фотони (N)</text>

  <line x1="160" y1="400" x2="160" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="420" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t₀ (Старт)</text>

  <line x1="390" y1="400" x2="390" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_TOF (Стоп)</text>

  <!-- Delta t Dimension Line -->
  <line x1="160" y1="434" x2="390" y2="434" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="275" y="450" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Час затримки Δt = t_TOF - t₀</text>

  <text x="360" y="468" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові канали TCSPC (Bins)</text>

  <!-- Right Side Panel 1: Principle & Noise -->
  <rect x="660" y="75" width="270" height="195" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="675" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Принцип накопичення (TCSPC)</text>
  <text x="675" y="124" font-size="12" fill="#1a1a1a">• M зондувальних імпульсів</text>
  <text x="675" y="146" font-size="12" fill="#1a1a1a">• ≤ 1 фотона за цикл на SPAD</text>
  <text x="675" y="168" font-size="12" fill="#1a1a1a">• Пуассонівський шум фону:</text>
  <text x="690" y="190" font-size="12" font-weight="bold" fill="#c0392b">N_bg = λ_bg · Δt · M</text>
  <text x="675" y="214" font-size="12" fill="#1a1a1a">• Згасання сигналу з відстанню:</text>
  <text x="690" y="236" font-size="12" font-weight="bold" fill="#2457d6">N_sig ∝ 1 / d²</text>

  <!-- Right Side Panel 2: Formulas & SNR -->
  <rect x="660" y="285" width="270" height="195" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="675" y="308" font-size="14" font-weight="bold" fill="#2457d6">Математичні формули</text>
  <text x="675" y="330" font-size="12" fill="#1a1a1a">Розрахунок відстані d:</text>
  <text x="690" y="352" font-size="13" font-weight="bold" fill="#2457d6">d = (c · t_TOF) / 2</text>
  <text x="675" y="376" font-size="12" fill="#1a1a1a">Співвідношення сигнал/шум:</text>
  <text x="690" y="398" font-size="13" font-weight="bold" fill="#27ae60">SNR = N_sig / √(N_sig + N_bg)</text>
  <text x="675" y="422" font-size="12" fill="#1a1a1a">Гранична точність вимірювання:</text>
  <text x="690" y="444" font-size="12" font-weight="bold" fill="#27ae60">σ_d ∝ FWHM / (2 · SNR)</text>
  <text x="675" y="466" font-size="12" font-weight="bold" fill="#27ae60">Пік виділяється навіть при SNR &lt; 1</text>
</svg>
