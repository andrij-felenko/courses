<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#8e44ad"/>
    </marker>
    <marker id="arr-purple-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,4 L7,7 Z" fill="#8e44ad"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VL53L0X: Режими вимірювання та структура Timing Budget</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння точок старту вимірювань і часового балансу Pre-Range та Final Range</text>

  <!-- Section 1 Panel: Ranging Modes -->
  <rect x="20" y="70" width="920" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="93" font-size="14" font-weight="bold" fill="#1a1a1a">1. Режими вимірювання VL53L0X (Single, Continuous, Timed)</text>

  <!-- Row 1: Single-shot -->
  <text x="40" y="128" font-size="13" font-weight="bold" fill="#1a1a1a">Single-shot</text>
  <text x="40" y="144" font-size="12" fill="#6b7280">За командою I2C</text>

  <text x="220" y="110" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C Start</text>
  <line x1="220" y1="114" x2="220" y2="124" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <rect x="230" y="126" width="160" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="310" y="143" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">T_budget (Активне)</text>

  <line x1="390" y1="124" x2="390" y2="114" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="390" y="110" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO1 IRQ</text>

  <rect x="390" y="126" width="510" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="645" y="143" font-size="12" fill="#6b7280" text-anchor="middle">Режим очікування (Standby / Low-Power)</text>

  <line x1="180" y1="158" x2="900" y2="158" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Row 2: Continuous -->
  <text x="40" y="183" font-size="13" font-weight="bold" fill="#1a1a1a">Continuous</text>
  <text x="40" y="199" font-size="12" fill="#6b7280">Безперервний потік</text>

  <text x="220" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C Start</text>
  <line x1="220" y1="169" x2="220" y2="179" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="230" y="181" width="150" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="305" y="198" font-size="12" fill="#2457d6" text-anchor="middle">Цикл 1 (T_budget)</text>

  <line x1="380" y1="179" x2="380" y2="169" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="380" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IRQ 1</text>

  <rect x="380" y="181" width="150" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="455" y="198" font-size="12" fill="#2457d6" text-anchor="middle">Цикл 2 (T_budget)</text>

  <line x1="530" y1="179" x2="530" y2="169" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="530" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IRQ 2</text>

  <rect x="530" y="181" width="150" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="605" y="198" font-size="12" fill="#2457d6" text-anchor="middle">Цикл 3 (T_budget)</text>

  <line x1="680" y1="179" x2="680" y2="169" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="680" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IRQ 3</text>

  <rect x="680" y="181" width="220" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="790" y="198" font-size="12" fill="#6b7280" text-anchor="middle">безперервно далі...</text>

  <line x1="180" y1="213" x2="900" y2="213" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Row 3: Continuous Timed -->
  <text x="40" y="238" font-size="13" font-weight="bold" fill="#1a1a1a">Continuous Timed</text>
  <text x="40" y="254" font-size="12" fill="#6b7280">Періодичні заміри</text>

  <text x="220" y="220" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C Start</text>
  <line x1="220" y1="224" x2="220" y2="234" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="230" y="236" width="110" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="253" font-size="12" fill="#2457d6" text-anchor="middle">T_budget</text>

  <rect x="340" y="236" width="150" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="415" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Сон (Low-Power)</text>

  <rect x="490" y="236" width="110" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="545" y="253" font-size="12" fill="#2457d6" text-anchor="middle">T_budget</text>

  <rect x="600" y="236" width="150" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="675" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Сон (Low-Power)</text>

  <rect x="750" y="236" width="110" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="805" y="253" font-size="12" fill="#2457d6" text-anchor="middle">T_budget</text>

  <!-- Dimension Arrow for Inter-Measurement Period -->
  <line x1="230" y1="265" x2="230" y2="293" stroke="#8e44ad" stroke-dasharray="2,2"/>
  <line x1="490" y1="265" x2="490" y2="293" stroke="#8e44ad" stroke-dasharray="2,2"/>
  <line x1="230" y1="288" x2="490" y2="288" stroke="#8e44ad" stroke-width="1.5" marker-start="url(#arr-purple-start)" marker-end="url(#arr-purple)"/>
  <text x="360" y="281" font-size="12" font-weight="bold" fill="#8e44ad" text-anchor="middle">Період вимірювання (T_inter)</text>

  <!-- Section 2 Left Panel: Timing Budget Breakdown -->
  <rect x="20" y="318" width="450" height="242" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="340" font-size="14" font-weight="bold" fill="#1a1a1a">2. Внутрішній розподіл Timing Budget</text>
  <text x="35" y="356" font-size="12" fill="#6b7280">Структура одного вимірювального циклу (напр. 33 мс)</text>

  <!-- Bar Container -->
  <rect x="40" y="368" width="410" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Pre-Range -->
  <rect x="43" y="371" width="110" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="98" y="387" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Pre-Range</text>
  <text x="98" y="401" font-size="12" fill="#2457d6" text-anchor="middle">~25% часу</text>

  <!-- Final Range -->
  <rect x="156" y="371" width="240" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="276" y="387" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Final Range</text>
  <text x="276" y="401" font-size="12" fill="#27ae60" text-anchor="middle">~70% часу</text>

  <!-- Overhead -->
  <rect x="399" y="371" width="48" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="423" y="394" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">~5%</text>

  <!-- Detail Card 1 -->
  <rect x="40" y="422" width="410" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="438" font-size="12" font-weight="bold" fill="#2457d6">• Pre-Range:</text>
  <text x="135" y="438" font-size="12" fill="#1a1a1a">Імпульси VCSEL для оцінки освітленості</text>
  <text x="50" y="455" font-size="12" fill="#6b7280">Запобігає насиченню SPAD від близьких цілей</text>

  <!-- Detail Card 2 -->
  <rect x="40" y="472" width="410" height="76" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="488" font-size="12" font-weight="bold" fill="#27ae60">• Final Range:</text>
  <text x="145" y="488" font-size="12" fill="#1a1a1a">Основний накоплювальний ToF-вимір</text>
  <text x="50" y="505" font-size="12" fill="#6b7280">Більший час (budget) → більше фотонів → вища точність</text>
  <text x="50" y="534" font-size="12" font-weight="bold" fill="#1a1a1a">Формула:</text>
  <text x="115" y="534" font-size="12" font-style="italic" fill="#2457d6">T_budget = T_pre + T_final + T_overhead</text>

  <!-- Section 2 Right Panel: Profiles Comparison -->
  <rect x="490" y="318" width="450" height="242" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="340" font-size="14" font-weight="bold" fill="#1a1a1a">3. Профілі вимірювання ST API</text>
  <text x="505" y="356" font-size="12" fill="#6b7280">Компроміс між точністю, дальністю та швидкістю</text>

  <!-- Profile 1: High Speed -->
  <rect x="505" y="368" width="420" height="54" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="505" y="368" width="6" height="54" rx="2" fill="#d97706"/>
  <text x="520" y="385" font-size="12" font-weight="bold" fill="#d97706">High Speed Profile</text>
  <text x="910" y="385" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Timing Budget: 20 ms</text>
  <text x="520" y="401" font-size="12" fill="#6b7280">Дальність: ~1.2 м  |  Точність: ±5%  |  До 50 вим/с</text>
  <text x="520" y="415" font-size="12" fill="#1a1a1a">Застосування: швидка робототехніка, трекінг рухів</text>

  <!-- Profile 2: Default -->
  <rect x="505" y="430" width="420" height="54" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="505" y="430" width="6" height="54" rx="2" fill="#2457d6"/>
  <text x="520" y="447" font-size="12" font-weight="bold" fill="#2457d6">Default Profile</text>
  <text x="910" y="447" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Timing Budget: 33 ms</text>
  <text x="520" y="463" font-size="12" fill="#6b7280">Дальність: ~1.2 м  |  Точність: ±3%  |  ~30 вим/с</text>
  <text x="520" y="477" font-size="12" fill="#1a1a1a">Застосування: базове вимірювання, стандартний режим</text>

  <!-- Profile 3: High Accuracy / Long Range -->
  <rect x="505" y="492" width="420" height="54" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="505" y="492" width="6" height="54" rx="2" fill="#27ae60"/>
  <text x="520" y="509" font-size="12" font-weight="bold" fill="#27ae60">High Accuracy / Long Range</text>
  <text x="910" y="509" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Timing Budget: 200 ms</text>
  <text x="520" y="525" font-size="12" fill="#6b7280">Дальність: до 2.0 м  |  Точність: ±1%  |  5 вим/с</text>
  <text x="520" y="539" font-size="12" fill="#1a1a1a">Застосування: стаціонарний вимір, темні поверхні</text>
</svg>
