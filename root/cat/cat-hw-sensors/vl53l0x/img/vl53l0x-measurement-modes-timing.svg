<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background layer -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Markers definition -->
  <defs>
    <marker id="arr-right-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">VL53L0X: Режими вимірювання, часовий бюджет (T_budget) та переривання</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Часова діаграма роботи далекоміра в режимах Single-shot, Continuous та Timed</text>

  <!-- ==================== PANEL 1: SINGLE-SHOT MODE ==================== -->
  <rect x="24" y="68" width="912" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Left Header & Signal Labels -->
  <rect x="36" y="78" width="168" height="26" rx="5" fill="#2457d6"/>
  <text x="120" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1. Single-shot Mode</text>
  
  <text x="40" y="122" font-size="12" font-weight="bold" fill="#1a1a1a">I2C Команда</text>
  <text x="40" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">Ядро VL53L0X</text>
  <text x="40" y="190" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO Переривання</text>

  <!-- Column Separator Line -->
  <line x1="220" y1="78" x2="220" y2="202" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Panel 1 Timeline Content -->
  <!-- Dimension Arrow T_budget -->
  <line x1="250" y1="92" x2="250" y2="138" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="520" y1="92" x2="520" y2="138" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="250" y1="92" x2="520" y2="92" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <text x="385" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">T_budget (33...200 ms)</text>

  <!-- I2C Track -->
  <rect x="245" y="106" width="50" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="270" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Start</text>

  <rect x="580" y="106" width="110" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="635" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Read &amp; Clear IRQ</text>

  <!-- ToF Core Track -->
  <rect x="230" y="138" width="20" height="24" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="2 2"/>
  <rect x="250" y="138" width="270" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="385" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Активне вимірювання (T_budget)</text>

  <rect x="520" y="138" width="380" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="710" y="154" text-anchor="middle" font-size="12" fill="#6b7280">Режим Standby (Низьке споживання)</text>

  <!-- GPIO Track -->
  <polyline points="230,176 520,176 520,192 600,192 600,176 900,176" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="560" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Data Ready IRQ</text>


  <!-- ==================== PANEL 2: CONTINUOUS MODE ==================== -->
  <rect x="24" y="228" width="912" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Header & Signal Labels -->
  <rect x="36" y="238" width="168" height="26" rx="5" fill="#2457d6"/>
  <text x="120" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2. Continuous Mode</text>

  <text x="40" y="282" font-size="12" font-weight="bold" fill="#1a1a1a">I2C Команда</text>
  <text x="40" y="316" font-size="12" font-weight="bold" fill="#1a1a1a">Ядро VL53L0X</text>
  <text x="40" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO Переривання</text>

  <!-- Column Separator Line -->
  <line x1="220" y1="238" x2="220" y2="362" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Panel 2 Timeline Content -->
  <!-- Dimension Arrow T_cycle -->
  <line x1="460" y1="252" x2="460" y2="298" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="670" y1="252" x2="670" y2="298" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="460" y1="252" x2="670" y2="252" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <text x="565" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">T_cycle ≈ T_budget (без пауз)</text>

  <!-- I2C Track -->
  <rect x="245" y="266" width="100" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="295" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">StartContinuous</text>

  <!-- ToF Core Track -->
  <rect x="250" y="298" width="210" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="355" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вимірювання #1 (T_budget)</text>

  <rect x="460" y="298" width="210" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="565" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вимірювання #2 (T_budget)</text>

  <rect x="670" y="298" width="210" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="775" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вимірювання #3 (T_budget)</text>

  <!-- GPIO Track -->
  <polyline points="230,336 460,336 460,352 490,352 490,336 670,336 670,352 700,352 700,336 880,336 880,352 910,352" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="475" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">IRQ #1</text>
  <text x="685" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">IRQ #2</text>
  <text x="895" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">IRQ #3</text>


  <!-- ==================== PANEL 3: TIMED MODE ==================== -->
  <rect x="24" y="388" width="912" height="144" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Header & Signal Labels -->
  <rect x="36" y="398" width="168" height="26" rx="5" fill="#2457d6"/>
  <text x="120" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3. Timed Mode</text>

  <text x="40" y="442" font-size="12" font-weight="bold" fill="#1a1a1a">I2C Команда</text>
  <text x="40" y="476" font-size="12" font-weight="bold" fill="#1a1a1a">Ядро VL53L0X</text>
  <text x="40" y="510" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO Переривання</text>

  <!-- Column Separator Line -->
  <line x1="220" y1="398" x2="220" y2="522" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Panel 3 Timeline Content -->
  <!-- Dimension Arrows T_inter -->
  <line x1="250" y1="412" x2="250" y2="458" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="560" y1="412" x2="560" y2="458" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="870" y1="412" x2="870" y2="458" stroke="#2457d6" stroke-dasharray="2 2" stroke-width="1"/>

  <line x1="250" y1="412" x2="560" y2="412" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <text x="405" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Період T_inter (Inter-Measurement)</text>

  <line x1="560" y1="412" x2="870" y2="412" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <text x="715" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Повторення через T_inter</text>

  <!-- I2C Track -->
  <rect x="245" y="426" width="75" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="282.5" y="439" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">StartTimed</text>

  <!-- ToF Core Track -->
  <rect x="250" y="458" width="150" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="325" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">T_budget</text>

  <rect x="400" y="458" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="480" y="474" text-anchor="middle" font-size="12" fill="#6b7280">Low-Power Wait</text>

  <rect x="560" y="458" width="150" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="635" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">T_budget</text>

  <rect x="710" y="458" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="790" y="474" text-anchor="middle" font-size="12" fill="#6b7280">Low-Power Wait</text>

  <!-- GPIO Track -->
  <polyline points="230,496 400,496 400,512 430,512 430,496 710,496 710,512 740,512 740,496 900,496" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="415" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">IRQ #1</text>
  <text x="725" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">IRQ #2</text>
</svg>
