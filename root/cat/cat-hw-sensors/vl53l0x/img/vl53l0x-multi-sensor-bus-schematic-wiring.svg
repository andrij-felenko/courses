<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers for signals -->
    <marker id="arr-sda" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-scl" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8e44ad"/>
    </marker>
    <marker id="arr-xshut" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-int" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="590" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення масиву давачів VL53L0X до шини I2C</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Спільна шина I2C та індивідуальні лінії XSHUT (адресація) і GPIO1 (переривання)</text>

  <!-- Top Bus Line Labels -->
  <text x="25" y="76" font-size="12" font-weight="bold" fill="#c0392b">3.3V (VDD)</text>
  <text x="25" y="96" font-size="12" font-weight="bold" fill="#2c3e50">GND (0V)</text>
  <text x="25" y="116" font-size="12" font-weight="bold" fill="#2457d6">SDA (Дані)</text>
  <text x="25" y="136" font-size="12" font-weight="bold" fill="#8e44ad">SCL (Тактування)</text>

  <!-- Trunk Lines -->
  <path d="M 140,80 H 885" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 140,100 H 885" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  <path d="M 140,120 H 885" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 140,140 H 885" fill="none" stroke="#8e44ad" stroke-width="2.5"/>

  <!-- Pull-Up Resistors Box -->
  <text x="220" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Підтяжка</text>
  <rect x="185" y="68" width="70" height="82" fill="none" stroke="#d0d7de" stroke-dasharray="3,3" rx="4"/>

  <!-- R1 (SDA Pull-Up) -->
  <path d="M 205,80 V 85" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="198" y="85" width="14" height="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="205" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">R1</text>
  <path d="M 205,99 V 120" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="205" cy="80" r="3" fill="#c0392b"/>
  <circle cx="205" cy="120" r="3" fill="#2457d6"/>

  <!-- R2 (SCL Pull-Up) -->
  <path d="M 235,80 V 125" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="228" y="125" width="14" height="14" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" rx="2"/>
  <text x="235" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#8e44ad">R2</text>
  <path d="M 235,139 V 140" stroke="#8e44ad" stroke-width="1.5"/>
  <circle cx="235" cy="80" r="3" fill="#c0392b"/>
  <circle cx="235" cy="140" r="3" fill="#8e44ad"/>

  <text x="220" y="164" text-anchor="middle" font-size="12" fill="#6b7280">2× 4.7 kΩ</text>

  <!-- MCU Drop Lines to Trunk Bus -->
  <path d="M 170,230 H 175 V 80 H 140" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 170,248 H 180 V 100 H 140" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <path d="M 170,266 H 185 V 120 H 140" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 170,284 H 190 V 140 H 140" fill="none" stroke="#8e44ad" stroke-width="2"/>

  <!-- Microcontroller Block -->
  <rect x="25" y="175" width="145" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <path d="M 25,215 V 183 a 8,8 0 0 1 8,-8 h 129 a 8,8 0 0 1 8,8 v 32 Z" fill="#2457d6"/>
  <text x="97" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="white">МІКРОКОНТРОЛЕР</text>
  <text x="97" y="208" text-anchor="middle" font-size="11" fill="#eaf0fd">(ESP32 / STM32)</text>

  <!-- MCU Pins -->
  <text x="162" y="230" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">3.3V</text>
  <text x="162" y="248" text-anchor="end" font-size="11" font-weight="bold" fill="#2c3e50">GND</text>
  <text x="162" y="266" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">SDA</text>
  <text x="162" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#8e44ad">SCL</text>

  <text x="162" y="315" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">GPIO 16 (XSHUT1)</text>
  <text x="162" y="333" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">GPIO 17 (XSHUT2)</text>
  <text x="162" y="351" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">GPIO 18 (XSHUT3)</text>

  <text x="162" y="385" text-anchor="end" font-size="11" font-weight="bold" fill="#d97706">GPIO 19 (INT1)</text>
  <text x="162" y="403" text-anchor="end" font-size="11" font-weight="bold" fill="#d97706">GPIO 23 (INT2)</text>
  <text x="162" y="421" text-anchor="end" font-size="11" font-weight="bold" fill="#d97706">GPIO 25 (INT3)</text>

  <!-- Sensor 1 Drop Lines from Top Bus -->
  <path d="M 320,80 V 175" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="320" cy="80" r="3" fill="#c0392b"/>

  <path d="M 350,100 V 175" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="350" cy="100" r="3" fill="#2c3e50"/>

  <path d="M 380,120 V 175" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-sda)"/>
  <circle cx="380" cy="120" r="3" fill="#2457d6"/>

  <path d="M 410,140 V 175" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr-scl)"/>
  <circle cx="410" cy="140" r="3" fill="#8e44ad"/>

  <!-- Sensor 1 Block -->
  <rect x="275" y="175" width="180" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <path d="M 275,215 V 183 a 8,8 0 0 1 8,-8 h 164 a 8,8 0 0 1 8,8 v 32 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="365" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">VL53L0X №1</text>
  <text x="365" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">I2C: 0x30</text>

  <!-- Sensor 1 Top Pins Labels -->
  <text x="320" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">VDD</text>
  <text x="350" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">GND</text>
  <text x="380" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">SDA</text>
  <text x="410" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">SCL</text>

  <!-- Sensor 1 Internal Modules -->
  <rect x="285" y="238" width="160" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="365" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Лазер VCSEL (940 нм)</text>

  <rect x="285" y="272" width="160" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="365" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Приймач SPAD (фотодіоди)</text>

  <rect x="285" y="306" width="160" height="136" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="365" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Контролер &amp; Регістри</text>
  <text x="365" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Поточна: 0x30</text>
  <text x="365" y="357" text-anchor="middle" font-size="11" fill="#6b7280">(Boot: 0x29)</text>
  <rect x="305" y="365" width="120" height="20" fill="#27ae60" rx="4"/>
  <text x="365" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="white">XSHUT = HIGH</text>

  <!-- Sensor 1 Terminal Pins -->
  <rect x="285" y="392" width="60" height="20" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="315" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">XSHUT</text>
  <path d="M 275,402 H 285" fill="none" stroke="#27ae60" stroke-width="2"/>

  <rect x="285" y="416" width="60" height="20" fill="#ffffff" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="315" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">GPIO1</text>
  <path d="M 285,426 H 275" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Sensor 2 Drop Lines from Top Bus -->
  <path d="M 535,80 V 175" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="535" cy="80" r="3" fill="#c0392b"/>

  <path d="M 565,100 V 175" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="565" cy="100" r="3" fill="#2c3e50"/>

  <path d="M 595,120 V 175" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-sda)"/>
  <circle cx="595" cy="120" r="3" fill="#2457d6"/>

  <path d="M 625,140 V 175" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr-scl)"/>
  <circle cx="625" cy="140" r="3" fill="#8e44ad"/>

  <!-- Sensor 2 Block -->
  <rect x="490" y="175" width="180" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <path d="M 490,215 V 183 a 8,8 0 0 1 8,-8 h 164 a 8,8 0 0 1 8,8 v 32 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="580" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">VL53L0X №2</text>
  <text x="580" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">I2C: 0x31</text>

  <!-- Sensor 2 Top Pins Labels -->
  <text x="535" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">VDD</text>
  <text x="565" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">GND</text>
  <text x="595" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">SDA</text>
  <text x="625" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">SCL</text>

  <!-- Sensor 2 Internal Modules -->
  <rect x="500" y="238" width="160" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="580" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Лазер VCSEL (940 нм)</text>

  <rect x="500" y="272" width="160" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="580" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Приймач SPAD (фотодіоди)</text>

  <rect x="500" y="306" width="160" height="136" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="580" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Контролер &amp; Регістри</text>
  <text x="580" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Поточна: 0x31</text>
  <text x="580" y="357" text-anchor="middle" font-size="11" fill="#6b7280">(Boot: 0x29)</text>
  <rect x="520" y="365" width="120" height="20" fill="#27ae60" rx="4"/>
  <text x="580" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="white">XSHUT = HIGH</text>

  <!-- Sensor 2 Terminal Pins -->
  <rect x="500" y="392" width="60" height="20" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="530" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">XSHUT</text>
  <path d="M 490,402 H 500" fill="none" stroke="#27ae60" stroke-width="2"/>

  <rect x="500" y="416" width="60" height="20" fill="#ffffff" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="530" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">GPIO1</text>
  <path d="M 500,426 H 490" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Sensor 3 Drop Lines from Top Bus -->
  <path d="M 750,80 V 175" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="750" cy="80" r="3" fill="#c0392b"/>

  <path d="M 780,100 V 175" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="780" cy="100" r="3" fill="#2c3e50"/>

  <path d="M 810,120 V 175" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-sda)"/>
  <circle cx="810" cy="120" r="3" fill="#2457d6"/>

  <path d="M 840,140 V 175" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#arr-scl)"/>
  <circle cx="840" cy="140" r="3" fill="#8e44ad"/>

  <!-- Sensor 3 Block -->
  <rect x="705" y="175" width="180" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <path d="M 705,215 V 183 a 8,8 0 0 1 8,-8 h 164 a 8,8 0 0 1 8,8 v 32 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">VL53L0X №3</text>
  <text x="795" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">I2C: 0x32</text>

  <!-- Sensor 3 Top Pins Labels -->
  <text x="750" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">VDD</text>
  <text x="780" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">GND</text>
  <text x="810" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">SDA</text>
  <text x="840" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#8e44ad">SCL</text>

  <!-- Sensor 3 Internal Modules -->
  <rect x="715" y="238" width="160" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="795" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Лазер VCSEL (940 нм)</text>

  <rect x="715" y="272" width="160" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="795" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Приймач SPAD (фотодіоди)</text>

  <rect x="715" y="306" width="160" height="136" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="795" y="323" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Контролер &amp; Регістри</text>
  <text x="795" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Поточна: 0x32</text>
  <text x="795" y="357" text-anchor="middle" font-size="11" fill="#6b7280">(Boot: 0x29)</text>
  <rect x="735" y="365" width="120" height="20" fill="#27ae60" rx="4"/>
  <text x="795" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="white">XSHUT = HIGH</text>

  <!-- Sensor 3 Terminal Pins -->
  <rect x="715" y="392" width="60" height="20" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="745" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">XSHUT</text>
  <path d="M 705,402 H 715" fill="none" stroke="#27ae60" stroke-width="2"/>

  <rect x="715" y="416" width="60" height="20" fill="#ffffff" stroke="#d97706" stroke-width="1" rx="3"/>
  <text x="745" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">GPIO1</text>
  <path d="M 715,426 H 705" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- XSHUT Control Lines -->
  <!-- XSHUT 1 Line -->
  <path d="M 170,315 H 205 V 402 H 275" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-xshut)"/>
  <text x="175" y="309" font-size="10" font-weight="bold" fill="#27ae60">XSHUT 1</text>

  <!-- XSHUT 2 Line -->
  <path d="M 170,333 H 215 V 460 H 475 V 402 H 490" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-xshut)"/>
  <text x="360" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">XSHUT 2</text>

  <!-- XSHUT 3 Line -->
  <path d="M 170,351 H 225 V 476 H 690 V 402 H 705" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-xshut)"/>
  <text x="580" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">XSHUT 3</text>

  <!-- GPIO1 Interrupt Lines (Dashed) -->
  <!-- INT 1 Line -->
  <path d="M 275,426 H 235 V 385 H 170" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-int)"/>
  <text x="255" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">INT 1</text>

  <!-- INT 2 Line -->
  <path d="M 490,426 H 475 V 492 H 195 V 403 H 170" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-int)"/>
  <text x="340" y="504" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">INT 2</text>

  <!-- INT 3 Line -->
  <path d="M 705,426 H 690 V 508 H 185 V 421 H 170" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-int)"/>
  <text x="560" y="504" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">INT 3</text>

  <!-- Bottom Summary & Logic Box -->
  <rect x="25" y="518" width="910" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Послідовна ініціалізація (XSHUT): виведення з Reset по черзі ➔ зміна I2C адреси з 0x29 на 0x30, 0x31, 0x32</text>
  <text x="480" y="556" text-anchor="middle" font-size="12" fill="#6b7280">Асинхронні переривання (GPIO1): сигналізування про готовність вимірювання без блокування циклу MCU</text>
</svg>
