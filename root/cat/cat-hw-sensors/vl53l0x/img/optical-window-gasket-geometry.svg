<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dim-top" markerWidth="6" markerHeight="6" refX="3" refY="1" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,5 L3,0 L6,5 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-dim-bot" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L3,6 L6,1 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Оптична геометрія захисного вікна та ізоляційного перестінку VL53L0X</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Щільне прилягання силіконової прокладки запобігає оптичному перехресному наведенню (Crosstalk)</text>

  <!-- LEFT PANEL: Without Gasket -->
  <g id="left-panel">
    <rect x="40" y="80" width="425" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
    
    <!-- Status Header -->
    <rect x="55" y="95" width="395" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="5"/>
    <text x="252" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">❌ Без перестінку: виникає паразитне відбиття</text>

    <!-- Cover Glass -->
    <rect x="85" y="145" width="310" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
    <text x="240" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Захисне скло (Cover Glass)</text>

    <!-- Dimension Lines -->
    <!-- t_glass -->
    <line x1="400" y1="145" x2="410" y2="145" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="400" y1="175" x2="410" y2="175" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="405" y1="148" x2="405" y2="172" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-dim-top)" marker-end="url(#arr-dim-bot)"/>
    <text x="412" y="164" font-size="11" fill="#1a1a1a">t_glass</text>

    <!-- d_gap -->
    <line x1="400" y1="265" x2="410" y2="265" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="405" y1="178" x2="405" y2="262" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-dim-top)" marker-end="url(#arr-dim-bot)"/>
    <text x="412" y="224" font-size="11" fill="#1a1a1a">d_gap</text>

    <!-- VCSEL Light Cone -->
    <polygon points="165,280 115,175 215,175" fill="#e74c3c" opacity="0.12"/>
    
    <!-- Parasitic Reflection Ray -->
    <path d="M 165,280 L 205,175 L 315,280" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

    <!-- Reflection Callout Badge -->
    <rect x="255" y="195" width="130" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
    <text x="320" y="212" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Паразитне відбиття</text>

    <!-- Package Base & Substrate -->
    <rect x="115" y="265" width="250" height="75" fill="#34495e" rx="4"/>
    <rect x="233" y="265" width="14" height="45" fill="#1a252f"/>
    <rect x="85" y="340" width="310" height="20" fill="#2c3e50" rx="2"/>
    <text x="240" y="354" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Друкована плата (PCB)</text>

    <!-- VCSEL & SPAD Components -->
    <rect x="135" y="280" width="60" height="30" fill="#e74c3c" rx="3"/>
    <text x="165" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">VCSEL</text>

    <rect x="285" y="280" width="60" height="30" fill="#2980b9" rx="3"/>
    <text x="315" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">SPAD</text>

    <!-- Summary Box -->
    <rect x="55" y="375" width="395" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="70" y="395" font-size="12" font-weight="bold" fill="#c0392b">• Наслідки відсутності перестінку:</text>
    <text x="70" y="416" font-size="12" fill="#1a1a1a">1. Внутрішнє відбиття світла 940 нм від граней скла</text>
    <text x="70" y="436" font-size="12" fill="#1a1a1a">2. Пряме потрапляння паразитного сигналу на SPAD</text>
    <text x="70" y="456" font-size="12" fill="#1a1a1a">3. Дрейф нуля (Offset) та хибні показання відстані</text>
  </g>

  <!-- RIGHT PANEL: With Gasket -->
  <g id="right-panel">
    <rect x="495" y="80" width="425" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

    <!-- Status Header -->
    <rect x="510" y="95" width="395" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
    <text x="707" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ З ізолювальним перестінком (Gasket)</text>

    <!-- Cover Glass -->
    <rect x="540" y="145" width="310" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
    <text x="695" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Захисне скло (High T &gt; 90% @ 940 nm)</text>

    <!-- Dimension Lines -->
    <!-- t_glass -->
    <line x1="855" y1="145" x2="865" y2="145" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="855" y1="175" x2="865" y2="175" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="860" y1="148" x2="860" y2="172" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-dim-top)" marker-end="url(#arr-dim-bot)"/>
    <text x="867" y="164" font-size="11" fill="#1a1a1a">t_glass</text>

    <!-- d_gap -->
    <line x1="855" y1="265" x2="865" y2="265" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="860" y1="178" x2="860" y2="262" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-dim-top)" marker-end="url(#arr-dim-bot)"/>
    <text x="867" y="224" font-size="11" fill="#1a1a1a">d_gap</text>

    <!-- Silicone Gasket Structure -->
    <rect x="540" y="175" width="30" height="90" fill="#7f8c8d" opacity="0.4"/>
    <rect x="820" y="175" width="30" height="90" fill="#7f8c8d" opacity="0.4"/>
    <!-- Central Gasket Barrier Upper -->
    <rect x="673" y="175" width="44" height="63" fill="#2c3e50" rx="2"/>
    <text x="695" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Gasket</text>

    <!-- VCSEL Beam Cone & Ray -->
    <polygon points="620,280 600,175 640,175" fill="#e74c3c" opacity="0.15"/>
    <line x1="620" y1="280" x2="620" y2="135" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="620" y="138" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">FoV ≈ 25°</text>

    <!-- SPAD Beam Cone & Ray -->
    <polygon points="770,280 750,175 790,175" fill="#2457d6" opacity="0.15"/>
    <line x1="770" y1="135" x2="770" y2="275" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="770" y="138" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">FoV ≈ 25°</text>

    <!-- Blocked Reflection Ray -->
    <path d="M 620,280 L 650,175 L 673,195" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="673" cy="195" r="4" fill="#c0392b"/>

    <!-- Isolation Badge Rect & Text -->
    <rect x="625" y="238" width="140" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
    <text x="695" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">100% оптична розв'язка</text>

    <!-- Package Base & Substrate -->
    <rect x="570" y="265" width="250" height="75" fill="#34495e" rx="4"/>
    <rect x="688" y="265" width="14" height="45" fill="#1a252f"/>
    <rect x="540" y="340" width="310" height="20" fill="#2c3e50" rx="2"/>
    <text x="695" y="354" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Друкована плата (PCB)</text>

    <!-- VCSEL & SPAD Components -->
    <rect x="590" y="280" width="60" height="30" fill="#e74c3c" rx="3"/>
    <text x="620" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">VCSEL</text>

    <rect x="740" y="280" width="60" height="30" fill="#2980b9" rx="3"/>
    <text x="770" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">SPAD</text>

    <!-- Summary Box -->
    <rect x="510" y="375" width="395" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="525" y="395" font-size="12" font-weight="bold" fill="#27ae60">• Переваги герметичної геометрії:</text>
    <text x="525" y="416" font-size="12" fill="#1a1a1a">1. Повне фізичне блокування перехресних завад (Crosstalk)</text>
    <text x="525" y="436" font-size="12" fill="#1a1a1a">2. Стабільна робота калібрування зсуву (Offset calibration)</text>
    <text x="525" y="456" font-size="12" fill="#1a1a1a">3. Надійна точність вимірювання відстані до об'єкта</text>
  </g>
</svg>
