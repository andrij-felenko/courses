<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Definitions -->
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Cover Glass Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2457d6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2457d6" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оптичне перехресне наведення (Crosstalk) у VL53L0X під захисним склом</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Паразитні відбиття від поверхонь скла потрапляють на SPAD, створюючи хибний сигнал за неналежного зазору</text>

  <!-- LEFT MAIN PANEL: Optical Cross-Section Schematic -->
  <rect x="40" y="75" width="580" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оптична схема випромінювання та паразитного відбиття</text>

  <!-- Protective Cover Glass -->
  <rect x="70" y="125" width="520" height="30" rx="3" fill="url(#glass-grad)" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="70" y1="125" x2="590" y2="125" stroke="#2457d6" stroke-width="1"/>
  <line x1="70" y1="155" x2="590" y2="155" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="144" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Захисне скло (λ = 940 нм)</text>

  <!-- Glass Thickness Dimension d_glass -->
  <line x1="595" y1="125" x2="595" y2="155" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="590" y1="125" x2="600" y2="125" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="590" y1="155" x2="600" y2="155" stroke="#6b7280" stroke-width="1.5"/>
  <text x="605" y="144" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">d_glass</text>

  <!-- Air Gap Dimension d_gap -->
  <line x1="55" y1="155" x2="55" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="50" y1="155" x2="60" y2="155" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="50" y1="310" x2="60" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <text x="64" y="225" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">d_gap</text>
  <text x="64" y="240" font-size="11" fill="#6b7280" text-anchor="start">≤0.5 мм</text>

  <!-- Optical Septum / Barrier -->
  <rect x="315" y="163" width="30" height="147" rx="2" fill="#34495e" stroke="#1a1a1a"/>
  <!-- Rubber Seal Gasket Cap -->
  <rect x="307" y="155" width="46" height="8" rx="2" fill="#1a1a1a"/>

  <!-- Optical Septum Callout Badge -->
  <rect x="265" y="258" width="130" height="22" rx="4" fill="#ffffff" stroke="#34495e" stroke-width="1"/>
  <text x="330" y="273" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оптична перегородка</text>

  <!-- Useful Signal Beam (Green) -->
  <!-- Emitted Ray -->
  <line x1="165" y1="310" x2="165" y2="85" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <text x="155" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Випромінювання</text>

  <!-- Return Ray -->
  <line x1="495" y1="85" x2="495" y2="310" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <text x="505" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Сигнал від цілі</text>

  <!-- Crosstalk Rays (Red) -->
  <!-- Internal Reflection Ray 1 -->
  <path d="M 195,310 L 255,155 L 330,125 L 405,155 L 465,310" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <!-- Air Gap Leakage Ray 2 -->
  <path d="M 205,310 L 330,155 L 455,310" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8" marker-end="url(#arr-red)"/>

  <!-- Crosstalk Callout Badge -->
  <rect x="250" y="180" width="160" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="330" y="195" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Паразитний Crosstalk</text>

  <!-- Module Substrate Base -->
  <rect x="70" y="357" width="520" height="38" rx="4" fill="#2c3e50" stroke="#1a1a1a"/>
  <text x="330" y="381" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Підкладка модуля VL53L0X (4.4 × 2.4 мм)</text>

  <!-- VCSEL Emitter Unit -->
  <rect x="125" y="310" width="110" height="47" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="180" y="329" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCSEL 940 нм</text>
  <text x="180" y="345" font-size="11" fill="#6b7280" text-anchor="middle">Лазерний випромінювач</text>

  <!-- SPAD Receiver Unit -->
  <rect x="425" y="310" width="110" height="47" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="329" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SPAD-матриця</text>
  <text x="480" y="345" font-size="11" fill="#6b7280" text-anchor="middle">Детектор фотонів</text>

  <!-- Warning Badge at Schematic Bottom -->
  <rect x="150" y="407" width="360" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="330" y="424" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠ Хибний оптичний сигнал = помилка вимірювання відстані</text>

  <!-- RIGHT PANEL 1: Crosstalk Causes & Factors -->
  <rect x="640" y="75" width="280" height="180" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="780" y="99" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Джерела та фактори Crosstalk</text>
  <line x1="655" y1="109" x2="905" y2="109" stroke="#f5c6cb" stroke-width="1"/>
  <text x="655" y="130" font-size="12" fill="#1a1a1a">• Відбиття скло-повітря (n = 1.5)</text>
  <text x="655" y="152" font-size="12" fill="#1a1a1a">• Великий зазор (d_gap &gt; 0.5 мм)</text>
  <text x="655" y="174" font-size="12" fill="#1a1a1a">• Зазор / щілина в перегородці</text>
  <text x="655" y="196" font-size="12" fill="#1a1a1a">• Пил, бруд, відбитки пальців</text>
  <text x="655" y="226" font-size="12" font-weight="bold" fill="#c0392b">➔ Спотворює виміряну відстань</text>

  <!-- RIGHT PANEL 2: Mitigation & Calibration -->
  <rect x="640" y="270" width="280" height="175" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="780" y="294" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Захист та компенсація</text>
  <line x1="655" y1="304" x2="905" y2="304" stroke="#c3e6cb" stroke-width="1"/>
  <text x="655" y="325" font-size="12" fill="#1a1a1a">1. Гумове ущільнення (Gasket)</text>
  <text x="655" y="347" font-size="12" fill="#1a1a1a">2. Матова чорна перегородка</text>
  <text x="655" y="369" font-size="12" fill="#1a1a1a">3. Просвітлювальне покриття (AR)</text>
  <text x="655" y="395" font-size="12" font-weight="bold" fill="#2457d6">4. Калібрування Crosstalk:</text>
  <text x="655" y="417" font-size="12" font-weight="bold" fill="#27ae60">➔ Віднімання фону в Mcps</text>

  <!-- BOTTOM BANNER: Formula & API call -->
  <rect x="40" y="460" width="880" height="48" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="55" y="470" width="115" height="28" rx="4" fill="#2457d6"/>
  <text x="112" y="488" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КАЛІБРУВАННЯ</text>
  <text x="185" y="480" font-size="12" font-weight="bold" fill="#1a1a1a">Програмне калібрування в API: VL53L0X_PerformXTalkCalibration()</text>
  <text x="185" y="497" font-size="11" fill="#6b7280">Вимірює фоновий потік Crosstalk на 100 мм від 17%-мішені та зберігає коефіцієнт компенсації.</text>
</svg>
