<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципи вимірювання Time-of-Flight: dToF проти iToF</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">dToF вимірює прямий час затримки імпульсу Δt, а iToF визначає відстань через зсув фази Δφ модульованої хвилі</text>

  <!-- Left Panel: dToF -->
  <rect x="30" y="68" width="435" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- dToF Header Box -->
  <rect x="45" y="80" width="405" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="98" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">dToF (Direct Time-of-Flight)</text>
  <text x="247" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Пряме хронометрування імпульсу світла</text>

  <!-- dToF Graph Box -->
  <rect x="45" y="140" width="405" height="240" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- S_tx Label & Signals -->
  <text x="80" y="162" font-size="12" font-weight="bold" fill="#2457d6">S_tx (випромінений імпульс)</text>
  <line x1="80" y1="210" x2="420" y2="210" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="115,210 115,175 145,175 145,210" fill="#2457d6" opacity="0.15"/>
  <path d="M 80 210 L 115 210 L 115 175 L 145 175 L 145 210 L 420 210" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <!-- S_rx Label & Signals -->
  <text x="80" y="247" font-size="12" font-weight="bold" fill="#27ae60">S_rx (прийнятий імпульс SPAD)</text>
  <line x1="80" y1="295" x2="420" y2="295" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="255,295 255,260 285,260 285,295" fill="#27ae60" opacity="0.15"/>
  <path d="M 80 295 L 255 295 L 255 260 L 285 260 L 285 295 L 420 295" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <!-- Guidelines & Delta t measurement -->
  <line x1="115" y1="175" x2="115" y2="340" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="255" y1="260" x2="255" y2="340" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="115" y1="325" x2="255" y2="325" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="185" y="318" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Δt (час прольоту)</text>

  <!-- Time Axis -->
  <line x1="80" y1="352" x2="420" y2="352" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="420" y="370" font-size="12" fill="#6b7280" text-anchor="end">Час (t)</text>

  <!-- dToF Formula & Notes -->
  <rect x="45" y="390" width="405" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="165" y="398" width="165" height="24" rx="4" fill="#eaf0fd"/>
  <text x="247" y="415" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">d = (c · Δt) / 2</text>
  <text x="60" y="438" font-size="12" fill="#1a1a1a">• Пряма фіксація точного моменту приходу фотонів</text>
  <text x="60" y="456" font-size="12" fill="#6b7280">• Висока завадостійкість і стійкість до альбедо</text>

  <!-- Right Panel: iToF -->
  <rect x="495" y="68" width="435" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- iToF Header Box -->
  <rect x="510" y="80" width="405" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="98" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">iToF (Indirect Time-of-Flight)</text>
  <text x="712" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювання фазового зсуву хвилі</text>

  <!-- iToF Graph Box -->
  <rect x="510" y="140" width="405" height="240" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- S_tx Label & Signals -->
  <text x="545" y="162" font-size="12" font-weight="bold" fill="#2457d6">S_tx (модульований сигнал)</text>
  <line x1="545" y1="205" x2="885" y2="205" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 545 205 L 550 205 C 563.8 180, 561.2 180, 575 180 C 588.8 180, 586.2 205, 600 205 C 613.8 205, 611.2 230, 625 230 C 638.8 230, 636.2 205, 650 205 C 663.8 205, 661.2 180, 675 180 C 688.8 180, 686.2 205, 700 205 C 713.8 205, 711.2 230, 725 230 C 738.8 230, 736.2 205, 750 205 C 763.8 205, 761.2 180, 775 180 C 788.8 180, 786.2 205, 800 205 C 813.8 205, 811.2 230, 825 230 C 838.8 230, 836.2 205, 850 205 L 885 205" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <!-- S_rx Label & Signals -->
  <text x="545" y="247" font-size="12" font-weight="bold" fill="#27ae60">S_rx (прийнята хвиля зі зсувом)</text>
  <line x1="545" y1="290" x2="885" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 545 290 L 620 290 C 633.8 265, 631.2 265, 645 265 C 648.8 265, 646.2 290, 660 290 C 673.8 290, 671.2 315, 695 315 C 708.8 315, 706.2 290, 720 290 C 733.8 290, 731.2 265, 745 265 C 748.8 265, 746.2 290, 760 290 C 773.8 290, 771.2 315, 785 315 C 798.8 315, 796.2 290, 800 290 C 813.8 290, 811.2 265, 825 265 C 838.8 265, 836.2 290, 850 290 L 885 290" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <!-- Guidelines & Delta phi measurement -->
  <line x1="600" y1="180" x2="600" y2="340" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="670" y1="265" x2="670" y2="340" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="325" x2="670" y2="325" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="635" y="318" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">зсув Δφ</text>

  <!-- Time Axis -->
  <line x1="545" y1="352" x2="885" y2="352" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="885" y="370" font-size="12" fill="#6b7280" text-anchor="end">Час (t)</text>

  <!-- iToF Formula & Notes -->
  <rect x="510" y="390" width="405" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="615" y="398" width="195" height="24" rx="4" fill="#eaf0fd"/>
  <text x="712" y="415" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">d = (c · Δφ) / (4π · f)</text>
  <text x="525" y="438" font-size="12" fill="#1a1a1a">• Фаза обчислюється вимірюванням накопиченого заряду</text>
  <text x="525" y="456" font-size="12" fill="#6b7280">• Вимагає високої потужності та чутлива до завад</text>
</svg>
