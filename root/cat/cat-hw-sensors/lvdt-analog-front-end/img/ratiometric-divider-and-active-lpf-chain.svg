<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .box-div { fill: #0f172a; stroke: #a855f7; stroke-width: 1.5; rx: 6px; }
      .box-lpf { fill: #0f172a; stroke: #10b981; stroke-width: 1.5; rx: 6px; }
      .box-diag { fill: #0f172a; stroke: #f43f5e; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .wire-green { stroke: #10b981; stroke-width: 2.5; fill: none; }
      .dot { fill: #38bdf8; }
    </style>
    <marker id="marr5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="marr5-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Аналоговий раціометричний дільник та вихідний активний ФНЧ Саллена-Кея</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Повне скорочення амплітудної нестабільності збудження, захист від обриву та згладжування пульсацій 2·f_c</text>

  <!-- Main Pipeline Blocks -->
  <g transform="translate(30, 80)">
    <!-- Inputs: V_diff and V_sum -->
    <rect x="0" y="20" width="140" height="55" class="box" style="stroke: #38bdf8;" />
    <text x="70" y="42" text-anchor="middle" class="lbl-bold" fill="#38bdf8">V_diff (чисельник)</text>
    <text x="70" y="60" text-anchor="middle" class="subtitle">V1 - V2 ~ K(T)·V_ex·x</text>

    <rect x="0" y="100" width="140" height="55" class="box" style="stroke: #fbbf24;" />
    <text x="70" y="122" text-anchor="middle" class="lbl-bold" fill="#fbbf24">V_sum (знаменник)</text>
    <text x="70" y="140" text-anchor="middle" class="subtitle">V1 + V2 ~ K(T)·V_ex·L</text>

    <!-- Wires into divider -->
    <line x1="140" y1="47" x2="190" y2="70" class="wire" marker-end="url(#marr5)" />
    <line x1="140" y1="127" x2="190" y2="100" class="wire" marker-end="url(#marr5)" />

    <!-- Branch from V_sum to Loss of Carrier Diagnostic Comparator -->
    <line x1="140" y1="127" x2="140" y2="200" class="wire" />
    <line x1="140" y1="200" x2="190" y2="200" class="wire" marker-end="url(#marr5)" />

    <!-- Analog Ratiometric Divider Block -->
    <rect x="190" y="45" width="200" height="85" class="box-div" />
    <text x="290" y="70" text-anchor="middle" class="lbl-bold" fill="#a855f7">Раціометричний дільник</text>
    <text x="290" y="88" text-anchor="middle" class="subtitle">AD698 / Комірка Ґілберта</text>
    <text x="290" y="106" text-anchor="middle" class="lbl">V_ratio = (V1-V2) / (V1+V2)</text>
    <text x="290" y="120" text-anchor="middle" class="subtitle" fill="#10b981">= x / L (чиста геометрія!)</text>

    <!-- Wire from Divider to Sallen-Key LPF -->
    <line x1="390" y1="87" x2="445" y2="87" class="wire" marker-end="url(#marr5)" />

    <!-- Sallen-Key 2nd Order Butterworth LPF -->
    <rect x="445" y="45" width="220" height="85" class="box-lpf" />
    <text x="555" y="70" text-anchor="middle" class="lbl-bold" fill="#10b981">Активний ФНЧ Саллена-Кея</text>
    <text x="555" y="88" text-anchor="middle" class="subtitle">2-й порядок, Баттерворт (Q=0.707)</text>
    <text x="555" y="106" text-anchor="middle" class="lbl">f_cut = 100...500 Гц &lt;&lt; 2·f_c</text>
    <text x="555" y="120" text-anchor="middle" class="subtitle">Пригнічення пульсацій &gt; 45 дБ</text>

    <!-- Wire to Final DC Output -->
    <line x1="665" y1="87" x2="720" y2="87" class="wire-green" marker-end="url(#marr5-g)" />

    <!-- Final Output Point -->
    <circle cx="730" cy="87" r="5" fill="#10b981" />
    <text x="745" y="80" class="lbl-bold" fill="#10b981">V_out(x)</text>
    <text x="745" y="98" class="subtitle">0...5 В або ±10 В</text>
    <text x="745" y="112" class="subtitle">до АЦП / МК</text>

    <!-- Loss of Carrier Diagnostic block (Bottom) -->
    <rect x="190" y="170" width="200" height="60" class="box-diag" />
    <text x="290" y="192" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Детектор обриву несучої</text>
    <text x="290" y="210" text-anchor="middle" class="subtitle">V_sum &lt; V_threshold</text>
    <text x="290" y="224" text-anchor="middle" class="subtitle">Блокування ділення на нуль!</text>

    <line x1="390" y1="200" x2="445" y2="200" class="wire" stroke="#f43f5e" marker-end="url(#marr5)" />
    <rect x="445" y="170" width="220" height="60" class="box" style="stroke: #f43f5e;" />
    <text x="555" y="192" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Аварійне вимикання (FAULT)</text>
    <text x="555" y="210" text-anchor="middle" class="subtitle">Запобігає хаотичним викидам</text>
    <text x="555" y="224" text-anchor="subtitle">при обриві кабелю давача</text>
  </g>

  <!-- Bottom Explanatory Summary Panel -->
  <rect x="30" y="340" width="820" height="135" class="panel" />
  <text x="50" y="365" class="lbl-bold" fill="#38bdf8">Математичні переваги раціометричної архітектури LVDT:</text>
  <text x="50" y="388" class="lbl">1. <tspan fill="#10b981">Повне усунення температурного дрейфу:</tspan> Дріт обмоток гріється однаково, тому коефіцієнт K(T) присутній як у чисельнику, так і в знаменнику й скорочується.</text>
  <text x="50" y="410" class="lbl">2. <tspan fill="#fbbf24">Інваріантність до джерела збудження:</tspan> Пульсації амплітуди генератора V_exc присутні в обох каналах і не впливають на вихідну напругу.</text>
  <text x="50" y="432" class="lbl">3. <tspan fill="#a855f7">Чиста функція геометрії:</tspan> V_out = x / L. Статична крутизна каналу залежить лише від геометричних розмірів датчика.</text>
  <text x="50" y="454" class="lbl">4. <tspan fill="#38bdf8">Динамічний компроміс ФНЧ:</tspan> Частота зрізу обирається з умови f_mech &lt; f_cut &lt;&lt; 2·f_c для мінімізації фазового лагу в сервоприводі.</text>
</svg>