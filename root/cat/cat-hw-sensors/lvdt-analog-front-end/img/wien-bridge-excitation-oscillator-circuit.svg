<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .wire-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .resistor { fill: #334155; stroke: #fbbf24; stroke-width: 1.5; }
      .cap { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .opamp { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
      .dot { fill: #38bdf8; }
    </style>
    <marker id="marr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Генератор синусоїдального збудження Віна з АРА на польовому транзисторі</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Схемотехніка термостабільного джерела несучої 1–10 кГц з ультранизьким коефіцієнтом гармонік THD &lt; 0.5%</text>

  <!-- Left Main Schematic -->
  <rect x="30" y="65" width="530" height="415" class="panel" />
  <text x="50" y="90" class="lbl-bold" fill="#38bdf8">Принципова схема збудження (Wien Bridge + AGC + Power Buffer)</text>

  <!-- Wien Network Box (Positive Feedback to Non-Inverting +) -->
  <rect x="50" y="110" width="150" height="150" class="box" />
  <text x="125" y="130" text-anchor="middle" class="lbl-bold" fill="#38bdf8">Міст Віна (ПЗЗ)</text>
  <text x="125" y="146" text-anchor="middle" class="subtitle">Частота f_0 = 1/(2πRC)</text>

  <!-- Series RC -->
  <rect x="65" y="160" width="35" height="14" class="resistor" />
  <text x="82" y="155" text-anchor="middle" class="subtitle">R</text>
  <line x1="100" y1="167" x2="115" y2="167" class="wire" />
  <!-- Cap C series -->
  <line x1="115" y1="158" x2="115" y2="176" class="cap" />
  <line x1="121" y1="158" x2="121" y2="176" class="cap" />
  <text x="118" y="155" text-anchor="middle" class="subtitle">C</text>
  <line x1="121" y1="167" x2="180" y2="167" class="wire" />

  <!-- Parallel RC to GND -->
  <circle cx="150" cy="167" r="3" class="dot" />
  <line x1="150" y1="167" x2="150" y2="195" class="wire" />
  <rect x="135" y="195" width="30" height="14" class="resistor" />
  <line x1="150" y1="209" x2="150" y2="225" class="wire" />
  <!-- GND -->
  <line x1="140" y1="225" x2="160" y2="225" class="wire" />

  <!-- Wire from Wien bridge to OpAmp Non-inverting input -->
  <line x1="180" y1="167" x2="230" y2="167" class="wire" />
  <line x1="230" y1="167" x2="230" y2="215" class="wire" />
  <line x1="230" y1="215" x2="260" y2="215" class="wire" />

  <!-- OpAmp Triangle -->
  <polygon points="260,175 260,265 330,220" class="opamp" />
  <text x="270" y="198" class="lbl-bold" font-size="16">-</text>
  <text x="270" y="248" class="lbl-bold" font-size="16">+</text>
  <text x="290" y="224" text-anchor="middle" class="lbl-bold" fill="#38bdf8">ОП</text>

  <!-- OpAmp Output -->
  <line x1="330" y1="220" x2="360" y2="220" class="wire" />
  <circle cx="360" cy="220" r="4" class="dot" />

  <!-- Feedback back to Wien Bridge input (top wire) -->
  <line x1="360" y1="220" x2="360" y2="95" class="wire" />
  <line x1="360" y1="95" x2="60" y2="95" class="wire" />
  <line x1="60" y1="95" x2="60" y2="167" class="wire" />
  <line x1="60" y1="167" x2="65" y2="167" class="wire" />

  <!-- Negative Feedback branch (AGC with JFET) -->
  <line x1="360" y1="220" x2="360" y2="295" class="wire" />
  <line x1="360" y1="295" x2="320" y2="295" class="wire" />
  <!-- R_f resistor -->
  <rect x="275" y="288" width="45" height="14" class="resistor" />
  <text x="297" y="283" text-anchor="middle" class="subtitle">R_f (22k)</text>
  <line x1="275" y1="295" x2="230" y2="295" class="wire" />
  <line x1="230" y1="295" x2="230" y2="195" class="wire" />
  <line x1="230" y1="195" x2="260" y2="195" class="wire" />

  <!-- JFET connected to Inverting node -->
  <circle cx="230" cy="295" r="3" class="dot" />
  <line x1="230" y1="295" x2="230" y2="340" class="wire" />
  <rect x="210" y="340" width="40" height="30" class="box" style="stroke: #a855f7;" />
  <text x="230" y="360" text-anchor="middle" class="lbl-bold" fill="#a855f7">JFET</text>
  <text x="230" y="385" text-anchor="middle" class="subtitle">R_ds ~ V_err</text>
  <line x1="230" y1="370" x2="230" y2="400" class="wire" />
  <!-- GND -->
  <line x1="220" y1="400" x2="240" y2="400" class="wire" />

  <!-- AGC Peak Detector block -->
  <rect x="280" y="340" width="100" height="40" class="box" style="stroke: #fbbf24;" />
  <text x="330" y="358" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Піковий АРА</text>
  <text x="330" y="372" text-anchor="middle" class="subtitle">V_peak vs V_ref</text>
  <!-- Wire from opamp out to AGC detector -->
  <line x1="360" y1="295" x2="360" y2="340" class="wire" />
  <!-- Wire from AGC detector to JFET gate -->
  <line x1="280" y1="360" x2="250" y2="360" class="wire" stroke-dasharray="2,2" stroke="#a855f7" />

  <!-- Power Buffer Stage (Push-Pull Drivers) -->
  <rect x="390" y="190" width="70" height="60" class="box" style="stroke: #10b981;" />
  <text x="425" y="215" text-anchor="middle" class="lbl-bold" fill="#10b981">Буфер</text>
  <text x="425" y="232" text-anchor="middle" class="subtitle">струму</text>
  <line x1="360" y1="220" x2="390" y2="220" class="wire" />
  <line x1="460" y1="220" x2="490" y2="220" class="wire" />

  <!-- DC blocking cap & output -->
  <line x1="490" y1="210" x2="490" y2="230" class="cap" />
  <line x1="496" y1="210" x2="496" y2="230" class="cap" />
  <text x="493" y="205" text-anchor="middle" class="subtitle">C_dc</text>
  <line x1="496" y1="220" x2="520" y2="220" class="wire" />
  <circle cx="520" cy="220" r="4" fill="#10b981" />
  <text x="510" y="245" class="lbl-bold" fill="#10b981">V_exc</text>
  <text x="470" y="270" class="subtitle">до первинної котушки</text>

  <!-- Right Details & Formulas Panel -->
  <rect x="580" y="65" width="270" height="415" class="panel" />
  <text x="600" y="90" class="lbl-bold" fill="#38bdf8">Інженерні вимоги генератора:</text>

  <rect x="595" y="110" width="240" height="110" class="box" />
  <text x="610" y="130" class="lbl-bold" fill="#fbbf24">1. Умова стаціонарності:</text>
  <text x="610" y="148" class="lbl">• Баланс фаз: φ_loop(f_0) = 0°</text>
  <text x="610" y="166" class="lbl">• Баланс амплітуд: A_v = 1 + R_f/R_in = 3</text>
  <text x="610" y="184" class="lbl">• R_in = R_1 + R_ds(JFET)</text>
  <text x="610" y="202" class="subtitle">АРА утримує A_v = 3.000 при зміні темп.</text>

  <rect x="595" y="230" width="240" height="110" class="box" />
  <text x="610" y="250" class="lbl-bold" fill="#10b981">2. Вихідний струм та захист:</text>
  <text x="610" y="268" class="lbl">• Первинна котушка: R_p = 20–200 Ом</text>
  <text x="610" y="286" class="lbl">• Піковий струм I_peak = 50–100 мА</text>
  <text x="610" y="304" class="lbl">• Розділювальний C_dc відсікає постійний струм</text>
  <text x="610" y="322" class="subtitle">Запобігає підмагнічуванню фериту</text>

  <rect x="595" y="350" width="240" height="115" class="box" />
  <text x="610" y="370" class="lbl-bold" fill="#f43f5e">3. Якість синусоїди:</text>
  <text x="610" y="388" class="lbl">• THD &lt; 0.5% (захист від гармонік)</text>
  <text x="610" y="406" class="lbl">• Конденсатори містка: тільки NP0/C0G</text>
  <text x="610" y="424" class="lbl">• Резистори: ТКС &lt; ±15 ppm/°C</text>
  <text x="610" y="442" class="subtitle">Виключає дрейф несучої частоти</text>
</svg>