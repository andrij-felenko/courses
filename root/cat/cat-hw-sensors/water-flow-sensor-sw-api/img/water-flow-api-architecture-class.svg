<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Архітектура об'єктно-орієнтованого API класу WaterFlowSensor</text>

<!-- UML Class Diagram Card -->
<rect x="50" y="65" width="420" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<!-- Class Header -->
<rect x="50" y="65" width="420" height="45" rx="8" fill="#1f3b5c"/>
<text x="260" y="93" font-size="16" fill="#f0f6fc" font-weight="700" text-anchor="middle">class WaterFlowSensor</text>

<!-- Class Attributes -->
<text x="70" y="130" font-size="12" fill="#8b949e">- uint8_t pin_</text>
<text x="70" y="150" font-size="12" fill="#8b949e">- float k_factor_ (номінал 7.5)</text>
<text x="70" y="170" font-size="12" fill="#f85149">- volatile uint32_t pulse_count_</text>
<text x="70" y="190" font-size="12" fill="#8b949e">- uint32_t last_calc_time_ms_</text>
<text x="70" y="210" font-size="12" fill="#3fb950">- float current_flow_l_min_</text>
<text x="70" y="230" font-size="12" fill="#58a6ff">- double total_volume_liters_</text>

<line x1="50" y1="245" x2="470" y2="245" stroke="#30363d" stroke-width="1.5"/>

<!-- Class Methods -->
<text x="70" y="270" font-size="12" fill="#3fb950" font-weight="700">+ bool begin(uint8_t pin, float k_factor)</text>
<text x="70" y="292" font-size="12" fill="#58a6ff" font-weight="700">+ void update(uint32_t now_ms)</text>
<text x="70" y="314" font-size="12" fill="#f0f6fc">+ float getFlowRateLMin() const</text>
<text x="70" y="336" font-size="12" fill="#f0f6fc">+ double getTotalVolumeLiters() const</text>
<text x="70" y="358" font-size="12" fill="#d29922">+ void resetTotalVolume()</text>
<text x="70" y="380" font-size="12" fill="#f85149">+ static void isrHandler()</text>

<!-- Right Side Dataflow & Integration -->
<rect x="500" y="65" width="400" height="330" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="700" y="95" font-size="15" fill="#3fb950" font-weight="700" text-anchor="middle">Потік даних у додатку</text>

<!-- Flow step blocks -->
<rect x="525" y="115" width="350" height="50" rx="4" fill="#0d1117" stroke="#f85149"/>
<text x="540" y="137" font-size="12" fill="#f85149" font-weight="700">1. Апаратний імпульс (ISR):</text>
<text x="540" y="153" font-size="11" fill="#8b949e">Кожен оберт турбіни збільшує pulse_count_</text>

<rect x="525" y="175" width="350" height="50" rx="4" fill="#0d1117" stroke="#58a6ff"/>
<text x="540" y="197" font-size="12" fill="#58a6ff" font-weight="700">2. Періодичний update() кожні 500–1000 мс:</text>
<text x="540" y="213" font-size="11" fill="#8b949e">Атомарно зчитує пульси, рахує частоту f та л/хв</text>

<rect x="525" y="235" width="350" height="50" rx="4" fill="#0d1117" stroke="#3fb950"/>
<text x="540" y="257" font-size="12" fill="#3fb950" font-weight="700">3. Інтеграція об'єму (Лічильник літрів):</text>
<text x="540" y="273" font-size="11" fill="#8b949e">total_liters += pulses / (k_factor * 60.0)</text>

<rect x="525" y="295" width="350" height="80" rx="4" fill="#21262d" stroke="#d29922"/>
<text x="540" y="318" font-size="12" fill="#d29922" font-weight="700">4. Переваги компонентної архітектури:</text>
<text x="540" y="337" font-size="11" fill="#f0f6fc">• Можливість опитування кількох сенсорів одночасно</text>
<text x="540" y="355" font-size="11" fill="#f0f6fc">• Неблокуючий код, сумісний з FreeRTOS / ESP-IDF</text>
</svg>