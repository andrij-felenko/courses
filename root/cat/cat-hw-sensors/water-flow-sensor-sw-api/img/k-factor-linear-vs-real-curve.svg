<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Калібрувальна залежність K-фактора: Ідеальна лінія vs Реальна крива</text>

<!-- Graph area left -->
<rect x="60" y="65" width="460" height="300" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>

<!-- Grid lines -->
<line x1="120" y1="110" x2="490" y2="110" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="160" x2="490" y2="160" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="210" x2="490" y2="210" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="260" x2="490" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="310" x2="490" y2="310" stroke="#21262d" stroke-dasharray="3 3"/>

<!-- Axes -->
<line x1="120" y1="70" x2="120" y2="320" stroke="#8b949e" stroke-width="2"/>
<line x1="120" y1="320" x2="500" y2="320" stroke="#8b949e" stroke-width="2"/>

<!-- Y-axis: Frequency f [Hz] -->
<text x="110" y="115" font-size="11" fill="#8b949e" text-anchor="end">200</text>
<text x="110" y="165" font-size="11" fill="#8b949e" text-anchor="end">150</text>
<text x="110" y="215" font-size="11" fill="#8b949e" text-anchor="end">100</text>
<text x="110" y="265" font-size="11" fill="#8b949e" text-anchor="end">50</text>
<text x="110" y="320" font-size="11" fill="#8b949e" text-anchor="end">0</text>
<text x="70" y="190" font-size="13" fill="#58a6ff" font-weight="700" transform="rotate(-90 70 190)" text-anchor="middle">Частота f [Гц]</text>

<!-- X-axis: Flow Q [L/min] -->
<text x="120" y="340" font-size="11" fill="#8b949e" text-anchor="middle">0</text>
<text x="195" y="340" font-size="11" fill="#8b949e" text-anchor="middle">5</text>
<text x="270" y="340" font-size="11" fill="#8b949e" text-anchor="middle">10</text>
<text x="345" y="340" font-size="11" fill="#8b949e" text-anchor="middle">15</text>
<text x="420" y="340" font-size="11" fill="#8b949e" text-anchor="middle">20</text>
<text x="480" y="340" font-size="11" fill="#8b949e" text-anchor="middle">25</text>
<text x="310" y="360" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">Витрата Q [л/хв]</text>

<!-- Curves -->
<!-- Ideal Line (Green dashed): f = 7.5 * Q -->
<line x1="120" y1="320" x2="480" y2="100" stroke="#3fb950" stroke-width="2" stroke-dasharray="5 5"/>

<!-- Real Curve (Red/Orange): Non-linear at low flow due to friction, saturates at high flow -->
<path d="M 120 320 Q 150 318 195 285 Q 270 220 345 155 Q 420 105 480 85" fill="none" stroke="#f0883e" stroke-width="3"/>

<!-- Dead zone annotation at start -->
<rect x="125" y="275" width="60" height="40" fill="#f85149" fill-opacity="0.2" stroke="#f85149" stroke-width="1"/>
<text x="155" y="295" font-size="10" fill="#f85149" font-weight="700" text-anchor="middle">Мертва зона</text>
<text x="155" y="308" font-size="9" fill="#f85149" text-anchor="middle">&lt; 1.0 л/хв</text>

<!-- Right Side Analysis Box -->
<rect x="545" y="65" width="355" height="300" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="722" y="95" font-size="15" fill="#f0883e" font-weight="700" text-anchor="middle">Причини нелінійності K-фактора</text>

<text x="565" y="130" font-size="12" fill="#f85149" font-weight="700">1. Механічне тертя осі (Q &lt; 1.5 л/хв):</text>
<text x="580" y="148" font-size="11" fill="#8b949e">Гідродинамічний тиск води недостатній для</text>
<text x="580" y="165" font-size="11" fill="#8b949e">подолання тертя спокою. Турбіна стоїть або ковзає.</text>

<text x="565" y="195" font-size="12" fill="#3fb950" font-weight="700">2. Лінійна зона (2 ... 18 л/хв):</text>
<text x="580" y="213" font-size="11" fill="#8b949e">Ідеальний режим роботи. Похибка не перевищує</text>
<text x="580" y="230" font-size="11" fill="#3fb950" font-weight="700">±2–3%. Застосовується номінал K = 7.50.</text>

<text x="565" y="260" font-size="12" fill="#d29922" font-weight="700">3. Кавітація та прослизання (Q &gt; 20 л/хв):</text>
<text x="580" y="278" font-size="11" fill="#8b949e">Висока швидкість зриває потік з лопаток;</text>
<text x="580" y="295" font-size="11" fill="#8b949e">прилад починає занижувати покази на 5–8%.</text>

<rect x="565" y="315" width="315" height="35" rx="4" fill="#0d1117" stroke="#388bfd"/>
<text x="722" y="337" font-size="11" fill="#58a6ff" text-anchor="middle">Рішення: поліноміальне багатоточкове калібрування K(f)</text>

<!-- Footer -->
<rect x="60" y="380" width="840" height="26" rx="4" fill="#21262d"/>
<text x="480" y="397" font-size="11" fill="#8b949e" text-anchor="middle">Для високоточного обліку калібрувальний коефіцієнт K задають таблицею з кусочно-лінійною інтерполяцією</text>
</svg>