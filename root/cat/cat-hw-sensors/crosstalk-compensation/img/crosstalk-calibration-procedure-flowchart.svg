<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad4)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Процедура стендового калібрування оптичного кростолку
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Послідовність заміру фонового потоку скла в Mcps та збереження у Flash/EEPROM
  </text>

  <!-- Flowchart Steps -->
  <!-- Step 1 -->
  <g transform="translate(60, 95)">
    <rect width="160" height="120" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="80" y="25" fill="#c7d2fe" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Крок 1: Стенд</text>
    <text x="80" y="50" fill="#ffffff" font-family="system-ui" font-size="11" text-anchor="middle">Вільний простір</text>
    <text x="80" y="70" fill="#a5b4fc" font-family="system-ui" font-size="10.5" text-anchor="middle">Немає перешкод</text>
    <text x="80" y="90" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">або чорна мішень</text>
    <text x="80" y="105" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">&gt; 800 мм</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="220" y1="155" x2="260" y2="155" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="260,155 252,150 252,160" fill="#38bdf8"/>

  <!-- Step 2 -->
  <g transform="translate(260, 95)">
    <rect width="170" height="120" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="85" y="25" fill="#a5f3fc" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Крок 2: Замір</text>
    <text x="85" y="50" fill="#ffffff" font-family="system-ui" font-size="11" text-anchor="middle">Серія 50 вимірювань</text>
    <text x="85" y="70" fill="#67e8f9" font-family="system-ui" font-size="10.5" text-anchor="middle">Накопичення фотонів</text>
    <text x="85" y="90" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Усі повернені фотони</text>
    <text x="85" y="105" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">= тільки скло!</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="430" y1="155" x2="470" y2="155" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="470,155 462,150 462,160" fill="#38bdf8"/>

  <!-- Step 3 -->
  <g transform="translate(470, 95)">
    <rect width="170" height="120" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="85" y="25" fill="#bbf7d0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Крок 3: Розрахунок</text>
    <text x="85" y="50" fill="#ffffff" font-family="system-ui" font-size="11" text-anchor="middle">Розрахунок Mcps</text>
    <text x="85" y="70" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">XtalkPlaneVal</text>
    <text x="85" y="90" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">Формат FixPoint 9.7</text>
    <text x="85" y="105" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">Нормалізація сигналу</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="640" y1="155" x2="680" y2="155" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="680,155 672,150 672,160" fill="#38bdf8"/>

  <!-- Step 4 -->
  <g transform="translate(680, 95)">
    <rect width="140" height="120" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="25" fill="#fde68a" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Крок 4: Запис</text>
    <text x="70" y="50" fill="#ffffff" font-family="system-ui" font-size="11" text-anchor="middle">Flash / NVS</text>
    <text x="70" y="70" fill="#fde047" font-family="system-ui" font-size="10.5" text-anchor="middle">Регістри ToF</text>
    <text x="70" y="90" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Контрольна сума</text>
    <text x="70" y="105" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">CRC16</text>
  </g>

  <!-- Bottom: Runtime Subtraction Algorithm -->
  <g transform="translate(60, 245)">
    <rect width="760" height="210" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="380" y="30" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Робота в реальному часі під час вимірювань:
    </text>

    <g transform="translate(30, 50)">
      <rect width="330" height="135" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="25" fill="#34d399" font-family="system-ui" font-size="12" font-weight="bold">Автоматичне віднімання DSP:</text>
      <text x="20" y="50" fill="#cbd5e1" font-family="system-ui" font-size="11">• Від кожного відліку накопиченої гістограми</text>
      <text x="20" y="70" fill="#cbd5e1" font-family="system-ui" font-size="11">віднімається каліброване значення Xtalk (Mcps).</text>
      <text x="20" y="95" fill="#cbd5e1" font-family="system-ui" font-size="11">• Повний захист від заниження дистанції.</text>
      <text x="20" y="118" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="bold">• Відновлюється зір сенсора на дистанціях 1–4 м.</text>
    </g>

    <g transform="translate(390, 50)">
      <rect width="340" height="135" rx="5" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="20" y="25" fill="#fca5a5" font-family="system-ui" font-size="12" font-weight="bold">Діагностика забруднення скла:</text>
      <text x="20" y="50" fill="#cbd5e1" font-family="system-ui" font-size="11">• Якщо поточний кростолк &gt; 3.0 Mcps</text>
      <text x="20" y="70" fill="#cbd5e1" font-family="system-ui" font-size="11">(перевищує поріг калібрування втричі):</text>
      <text x="20" y="95" fill="#f87171" font-family="system-ui" font-size="11" font-weight="bold">• Встановлюється статус COVER_GLASS_DIRTY.</text>
      <text x="20" y="118" fill="#fecdd3" font-family="system-ui" font-size="11">Робот сповіщає про необхідність очистити скло!</text>
    </g>
  </g>
</svg>