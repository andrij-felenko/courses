<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Фізичні шляхи оптичного кростолку (Optical Crosstalk) у ToF-сенсорах
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Френелівське внутрішнє відбиття від поверхонь захисного скла та розсіювання на мікродефектах
  </text>

  <!-- Cover Glass Layer -->
  <g transform="translate(100, 110)">
    <rect width="680" height="40" rx="4" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="340" y="25" fill="#e0f2fe" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">
      Захисне скло (Cover Glass) t_glass = 1.0–1.5 мм (показник заломлення n ≈ 1.5)
    </text>

    <!-- Glass Boundaries labels -->
    <text x="690" y="10" fill="#7dd3fc" font-family="system-ui" font-size="10.5">Зовнішня грань (R ≈ 4%)</text>
    <text x="690" y="35" fill="#7dd3fc" font-family="system-ui" font-size="10.5">Внутрішня грань (R ≈ 4%)</text>

    <!-- Dirt / finger print on top of glass -->
    <circle cx="280" cy="0" r="10" fill="#f59e0b" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1"/>
    <text x="280" y="-14" fill="#fde68a" font-family="system-ui" font-size="10" text-anchor="middle">Пил / відбиток пальця</text>
  </g>

  <!-- Air Gap -->
  <line x1="80" y1="150" x2="80" y2="280" stroke="#f43f5e" stroke-width="1.5"/>
  <polygon points="80,150 76,160 84,160" fill="#f43f5e"/>
  <polygon points="80,280 76,270 84,270" fill="#f43f5e"/>
  <text x="65" y="215" fill="#f43f5e" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 65 215)">
    Повітряний зазор d_gap
  </text>

  <!-- Sensor Module Body at bottom -->
  <g transform="translate(180, 280)">
    <rect width="520" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="260" y="135" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      ToF Сенсор (VL53L0X / VL53L1X) LGA Корпус
    </text>

    <!-- Tx Aperture (VCSEL) -->
    <rect x="50" y="20" width="140" height="85" rx="5" fill="#991b1b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="120" y="55" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">VCSEL Лазер</text>
    <text x="120" y="75" fill="#fee2e2" font-family="monospace" font-size="11" text-anchor="middle">Tx 940 нм</text>

    <!-- Rx Aperture (SPAD Array) -->
    <rect x="330" y="20" width="140" height="85" rx="5" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="400" y="55" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Матриця SPAD</text>
    <text x="400" y="75" fill="#cffafe" font-family="monospace" font-size="11" text-anchor="middle">Rx Приймач</text>
  </g>

  <!-- Ray Paths -->
  <!-- Useful Beam 1: Leaving Tx and passing glass to target -->
  <path d="M 300 280 L 300 60" stroke="#ef4444" stroke-width="3" stroke-dasharray="5 3"/>
  <polygon points="300,50 295,65 305,65" fill="#ef4444"/>
  <text x="310" y="75" fill="#f87171" font-family="system-ui" font-size="11" font-weight="bold">Корисний зондувальний імпульс</text>

  <!-- Parasitic Crosstalk Ray 1: Internal reflection at inner surface -->
  <path d="M 300 280 L 380 150 L 580 280" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <polygon points="580,280 570,272 575,265" fill="#f43f5e"/>
  <text x="480" y="205" fill="#f43f5e" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">
    Паразитний відблиск (Кростолк)
  </text>

  <!-- Parasitic Crosstalk Ray 2: Reflection from dirt on outer surface -->
  <path d="M 300 280 L 380 110 L 580 280" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="580,280 568,278 572,270" fill="#fbbf24"/>
  <text x="490" y="175" fill="#fde047" font-family="system-ui" font-size="10.5" text-anchor="middle">
    Розсіювання від бруду
  </text>
</svg>