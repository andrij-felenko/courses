<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad2)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Спотворення часової гістограми SPAD через оптичний кростолк
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Накладання паразитних фотонів скла (t ≈ 0) на корисний відгук цілі та зміщення центру мас
  </text>

  <!-- Left: Histogram WITHOUT Compensation (Corrupted) -->
  <g transform="translate(50, 90)">
    <rect width="360" height="370" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <text x="180" y="28" fill="#fca5a5" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      БЕЗ компенсації: Спотворена гістограма
    </text>

    <!-- Graph Axis -->
    <line x1="40" y1="310" x2="330" y2="310" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="40" y2="310" stroke="#475569" stroke-width="1.5"/>
    <text x="330" y="328" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="end">Час t (затримка ToF)</text>
    <text x="35" y="50" fill="#94a3b8" font-family="system-ui" font-size="10">Відліки (Mcps)</text>

    <!-- Huge Crosstalk Spike at t=0 -->
    <path d="M 45 310 L 60 110 L 75 310" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="60" cy="110" r="4" fill="#ef4444"/>
    <text x="75" y="95" fill="#f87171" font-family="system-ui" font-size="11" font-weight="bold">Пік кростолку (t ≈ 0)</text>

    <!-- Target peak at real distance (small because distance is far) -->
    <path d="M 210 310 L 235 220 L 260 310" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="235" cy="220" r="4" fill="#38bdf8"/>
    <text x="235" y="205" fill="#7dd3fc" font-family="system-ui" font-size="10.5" text-anchor="middle">Ціль 1.5 м</text>

    <!-- Corrupted Center of Mass arrow -->
    <line x1="60" y1="160" x2="110" y2="160" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="110,160 102,156 102,164" fill="#f59e0b"/>
    <text x="180" y="270" fill="#f87171" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">
      Помилковий розрахунок: 25 мм замість 1500 мм!
    </text>
  </g>

  <!-- Right: Histogram WITH Crosstalk Subtraction -->
  <g transform="translate(470, 90)">
    <rect width="360" height="370" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="28" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      З компенсацією: Віднімання фону Mcps
    </text>

    <!-- Graph Axis -->
    <line x1="40" y1="310" x2="330" y2="310" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="40" y2="310" stroke="#475569" stroke-width="1.5"/>
    <text x="330" y="328" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="end">Час t (затримка ToF)</text>
    <text x="35" y="50" fill="#94a3b8" font-family="system-ui" font-size="10">Відліки (Mcps)</text>

    <!-- Subtracted crosstalk (flat base) -->
    <line x1="45" y1="305" x2="80" y2="305" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="60" y="290" fill="#64748b" font-family="system-ui" font-size="9.5" text-anchor="middle">Віднято</text>

    <!-- Target peak isolated clearly -->
    <path d="M 210 310 L 235 150 L 260 310" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="235" cy="150" r="5" fill="#34d399"/>
    <text x="235" y="135" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      Істинний ToF пік (1.5 м)
    </text>

    <!-- Valid Center of Mass -->
    <text x="180" y="270" fill="#34d399" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">
      Точний центр мас: 1502 мм (Похибка &lt; 2 мм!)
    </text>
  </g>
</svg>