<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="590" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта регістрів цифрового компаса QMC5883L (I2C: 0x0D)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розподіл пам'яті 0x00–0x0C: 16-бітні дані вимірів, регістри стану та конфігурації</text>

  <!-- Left Panel: Register Table -->
  <rect x="30" y="70" width="425" height="500" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="93" font-size="14" font-weight="bold" fill="#1a1a1a">Адреси та вміст регістрів 0x00–0x0C</text>

  <!-- Table Header -->
  <rect x="45" y="105" width="395" height="24" rx="4" ry="4" fill="#d0d7de"/>
  <text x="55" y="121" font-size="11" font-weight="bold" fill="#1a1a1a">Адреса</text>
  <text x="115" y="121" font-size="11" font-weight="bold" fill="#1a1a1a">Назва регістру</text>
  <text x="230" y="121" font-size="11" font-weight="bold" fill="#1a1a1a">Опис та призначення</text>

  <!-- Row 0x00: Output_X_L -->
  <rect x="45" y="134" width="395" height="27" rx="3" ry="3" fill="#eaf0fd" stroke="#b4c6fc"/>
  <text x="55" y="151" font-size="11" font-weight="bold" fill="#2457d6">0x00</text>
  <text x="115" y="151" font-size="11" font-weight="bold" fill="#1a1a1a">Output_X_L</text>
  <text x="230" y="151" font-size="11" fill="#1a1a1a">Молодший байт даних X [7:0]</text>

  <!-- Row 0x01: Output_X_M -->
  <rect x="45" y="164" width="395" height="27" rx="3" ry="3" fill="#eaf0fd" stroke="#b4c6fc"/>
  <text x="55" y="181" font-size="11" font-weight="bold" fill="#2457d6">0x01</text>
  <text x="115" y="181" font-size="11" font-weight="bold" fill="#1a1a1a">Output_X_M</text>
  <text x="230" y="181" font-size="11" fill="#1a1a1a">Старший байт даних X [15:8]</text>

  <!-- Row 0x02: Output_Y_L -->
  <rect x="45" y="194" width="395" height="27" rx="3" ry="3" fill="#eaf0fd" stroke="#b4c6fc"/>
  <text x="55" y="211" font-size="11" font-weight="bold" fill="#2457d6">0x02</text>
  <text x="115" y="211" font-size="11" font-weight="bold" fill="#1a1a1a">Output_Y_L</text>
  <text x="230" y="211" font-size="11" fill="#1a1a1a">Молодший байт даних Y [7:0]</text>

  <!-- Row 0x03: Output_Y_M -->
  <rect x="45" y="224" width="395" height="27" rx="3" ry="3" fill="#eaf0fd" stroke="#b4c6fc"/>
  <text x="55" y="241" font-size="11" font-weight="bold" fill="#2457d6">0x03</text>
  <text x="115" y="241" font-size="11" font-weight="bold" fill="#1a1a1a">Output_Y_M</text>
  <text x="230" y="241" font-size="11" fill="#1a1a1a">Старший байт даних Y [15:8]</text>

  <!-- Row 0x04: Output_Z_L -->
  <rect x="45" y="254" width="395" height="27" rx="3" ry="3" fill="#eaf0fd" stroke="#b4c6fc"/>
  <text x="55" y="271" font-size="11" font-weight="bold" fill="#2457d6">0x04</text>
  <text x="115" y="271" font-size="11" font-weight="bold" fill="#1a1a1a">Output_Z_L</text>
  <text x="230" y="271" font-size="11" fill="#1a1a1a">Молодший байт даних Z [7:0]</text>

  <!-- Row 0x05: Output_Z_M -->
  <rect x="45" y="284" width="395" height="27" rx="3" ry="3" fill="#eaf0fd" stroke="#b4c6fc"/>
  <text x="55" y="301" font-size="11" font-weight="bold" fill="#2457d6">0x05</text>
  <text x="115" y="301" font-size="11" font-weight="bold" fill="#1a1a1a">Output_Z_M</text>
  <text x="230" y="301" font-size="11" fill="#1a1a1a">Старший байт даних Z [15:8]</text>

  <!-- Row 0x06: Status -->
  <rect x="45" y="314" width="395" height="27" rx="3" ry="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="55" y="331" font-size="11" font-weight="bold" fill="#27ae60">0x06</text>
  <text x="115" y="331" font-size="11" font-weight="bold" fill="#1a1a1a">Status</text>
  <text x="230" y="331" font-size="11" fill="#1a1a1a">Прапори: DRDY, OVFL, DOR</text>

  <!-- Row 0x07: TOUT_L -->
  <rect x="45" y="344" width="395" height="27" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="361" font-size="11" font-weight="bold" fill="#1a1a1a">0x07</text>
  <text x="115" y="361" font-size="11" font-weight="bold" fill="#1a1a1a">TOUT_L</text>
  <text x="230" y="361" font-size="11" fill="#1a1a1a">Молодший байт температури [7:0]</text>

  <!-- Row 0x08: TOUT_M -->
  <rect x="45" y="374" width="395" height="27" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="391" font-size="11" font-weight="bold" fill="#1a1a1a">0x08</text>
  <text x="115" y="391" font-size="11" font-weight="bold" fill="#1a1a1a">TOUT_M</text>
  <text x="230" y="391" font-size="11" fill="#1a1a1a">Старший байт температури [15:8]</text>

  <!-- Row 0x09: Control 1 -->
  <rect x="45" y="404" width="395" height="27" rx="3" ry="3" fill="#fff3e0" stroke="#ffe0b2"/>
  <text x="55" y="421" font-size="11" font-weight="bold" fill="#d97706">0x09</text>
  <text x="115" y="421" font-size="11" font-weight="bold" fill="#1a1a1a">Control 1</text>
  <text x="230" y="421" font-size="11" fill="#1a1a1a">Налаштування OSR, RNG, ODR, MODE</text>

  <!-- Row 0x0A: Control 2 -->
  <rect x="45" y="434" width="395" height="27" rx="3" ry="3" fill="#fff3e0" stroke="#ffe0b2"/>
  <text x="55" y="451" font-size="11" font-weight="bold" fill="#d97706">0x0A</text>
  <text x="115" y="451" font-size="11" font-weight="bold" fill="#1a1a1a">Control 2</text>
  <text x="230" y="451" font-size="11" fill="#1a1a1a">Біти SOFT_RST, ROL_PNT, INT_ENB</text>

  <!-- Row 0x0B: SET/RESET -->
  <rect x="45" y="464" width="395" height="27" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="481" font-size="11" font-weight="bold" fill="#1a1a1a">0x0B</text>
  <text x="115" y="481" font-size="11" font-weight="bold" fill="#1a1a1a">SET/RESET</text>
  <text x="230" y="481" font-size="11" fill="#1a1a1a">Період Set/Reset (значення 0x01)</text>

  <!-- Row 0x0C: Chip ID -->
  <rect x="45" y="494" width="395" height="27" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="511" font-size="11" font-weight="bold" fill="#1a1a1a">0x0C</text>
  <text x="115" y="511" font-size="11" font-weight="bold" fill="#1a1a1a">Chip ID</text>
  <text x="230" y="511" font-size="11" fill="#1a1a1a">ID пристрою (фіксовано 0xFF)</text>

  <!-- Left Panel Footnotes -->
  <text x="45" y="542" font-size="11" font-weight="bold" fill="#2457d6">● 0x00–0x05:</text>
  <text x="130" y="542" font-size="11" fill="#6b7280">6 байтів даних зчитуються підряд (Burst Read)</text>
  <text x="45" y="558" font-size="11" font-weight="bold" fill="#27ae60">● 0x06–0x0A:</text>
  <text x="130" y="558" font-size="11" fill="#6b7280">Контроль готовності та конфігурація режиму</text>

  <!-- Right Panel 1: Data Decoding -->
  <rect x="475" y="70" width="455" height="145" rx="8" ry="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="490" y="93" font-size="13" font-weight="bold" fill="#2457d6">1. Формування 16-бітного виміру з двох байтів</text>

  <rect x="490" y="106" width="115" height="34" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="547" y="122" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">LSB (0x00..0x04)</text>
  <text x="547" y="134" font-size="10" fill="#6b7280" text-anchor="middle">Байт [7:0]</text>

  <text x="615" y="127" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">+</text>

  <rect x="625" y="106" width="115" height="34" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="682" y="122" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MSB (0x01..0x05)</text>
  <text x="682" y="134" font-size="10" fill="#6b7280" text-anchor="middle">Байт [15:8]</text>

  <path d="M 748 123 L 762 123" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="770" y="106" width="145" height="34" rx="4" ry="4" fill="#2457d6"/>
  <text x="842" y="122" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">16-бітне значення</text>
  <text x="842" y="134" font-size="10" fill="#eaf0fd" text-anchor="middle">Зі знаком (int16_t)</text>

  <text x="490" y="163" font-size="12" font-weight="bold" fill="#1a1a1a">Формула:</text>
  <text x="550" y="163" font-size="12" fill="#2457d6">Data = (int16_t)((MSB &lt;&lt; 8) | LSB)</text>
  <text x="490" y="185" font-size="11" fill="#6b7280">Виміри представлені в доповняльному коді (-32768..+32767 LSB)</text>
  <text x="490" y="200" font-size="11" fill="#6b7280">Діапазон вимірювання задається в Control 1 (±2G або ±8G)</text>

  <!-- Right Panel 2: Control 1 & Status Registers -->
  <rect x="475" y="228" width="455" height="172" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="248" font-size="13" font-weight="bold" fill="#1a1a1a">2. Регістр налаштувань Control 1 (0x09) та біти стану</text>

  <rect x="490" y="258" width="102" height="38" rx="4" ry="4" fill="#fff3e0" stroke="#ffe0b2"/>
  <text x="541" y="273" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">OSR [7:6]</text>
  <text x="541" y="288" font-size="10" fill="#6b7280" text-anchor="middle">512/256/128/64</text>

  <rect x="598" y="258" width="102" height="38" rx="4" ry="4" fill="#fff3e0" stroke="#ffe0b2"/>
  <text x="649" y="273" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">RNG [5:4]</text>
  <text x="649" y="288" font-size="10" fill="#6b7280" text-anchor="middle">00:±2G | 01:±8G</text>

  <rect x="706" y="258" width="112" height="38" rx="4" ry="4" fill="#fff3e0" stroke="#ffe0b2"/>
  <text x="762" y="273" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">ODR [3:2]</text>
  <text x="762" y="288" font-size="10" fill="#6b7280" text-anchor="middle">10/50/100/200Hz</text>

  <rect x="824" y="258" width="96" height="38" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="872" y="273" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">MODE [1:0]</text>
  <text x="872" y="288" font-size="10" fill="#27ae60" text-anchor="middle">00:Stby 01:Cont</text>

  <line x1="490" y1="307" x2="920" y2="307" stroke="#e5e7eb" stroke-width="1"/>

  <text x="490" y="324" font-size="12" font-weight="bold" fill="#1a1a1a">Регістр стану Status (0x06):</text>

  <rect x="490" y="333" width="135" height="34" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="557" y="348" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">bit 0: DRDY</text>
  <text x="557" y="360" font-size="10" fill="#6b7280" text-anchor="middle">1 = дані готові</text>

  <rect x="633" y="333" width="135" height="34" rx="4" ry="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="700" y="348" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">bit 1: OVFL</text>
  <text x="700" y="360" font-size="10" fill="#6b7280" text-anchor="middle">1 = переповнення</text>

  <rect x="776" y="333" width="144" height="34" rx="4" ry="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="848" y="348" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">bit 2: DOR</text>
  <text x="848" y="360" font-size="10" fill="#6b7280" text-anchor="middle">1 = пропуск читання</text>

  <text x="490" y="385" font-size="11" fill="#6b7280">Перед читанням даних опитується DRDY=1. OVFL=1 означає вихід за FSR.</text>

  <!-- Right Panel 3: Burst Read Transaction Flow -->
  <rect x="475" y="413" width="455" height="157" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="433" font-size="13" font-weight="bold" fill="#1a1a1a">3. Послідовність пакетного I2C-читання 6 байтів</text>

  <rect x="490" y="443" width="70" height="40" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="525" y="458" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">START</text>
  <text x="525" y="473" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x0D + W</text>

  <path d="M 563 463 L 572 463" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="575" y="443" width="65" height="40" rx="4" ry="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="607" y="458" font-size="10" fill="#6b7280" text-anchor="middle">Вказати</text>
  <text x="607" y="473" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Reg 0x00</text>

  <path d="M 643 463 L 652 463" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="655" y="443" width="75" height="40" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="692" y="458" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">RESTART</text>
  <text x="692" y="473" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x0D + R</text>

  <path d="M 733 463 L 742 463" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="745" y="443" width="135" height="40" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="812" y="458" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Пакетне читання</text>
  <text x="812" y="473" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">6 байт (0x00..0x05)</text>

  <path d="M 883 463 L 890 463" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="893" y="443" width="32" height="40" rx="4" ry="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="909" y="468" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">STOP</text>

  <text x="490" y="502" font-size="11" font-weight="bold" fill="#1a1a1a">Скидання DRDY:</text>
  <text x="590" y="502" font-size="11" fill="#6b7280">автоматично відбувається після зчитування всіх 6 байтів</text>
  <text x="490" y="520" font-size="11" font-weight="bold" fill="#1a1a1a">Безперервний режим:</text>
  <text x="635" y="520" font-size="11" fill="#6b7280">при ROL_PNT=1 можна читати 6 байтів циклічно</text>
  <text x="490" y="538" font-size="11" font-weight="bold" fill="#1a1a1a">Set/Reset Period:</text>
  <text x="610" y="538" font-size="11" fill="#6b7280">регістр 0x0B рекомендовано записувати значенням 0x01</text>
</svg>
