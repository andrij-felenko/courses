<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title Block -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Компенсація нахилу (Tilt Compensation) 3D-магнітометра</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Проекція виміряного вектора B з нахиленої системи координат (X, Y, Z) на горизонт (X_h, Y_h)</text>

  <!-- LEFT PANEL: Uncompensated Measurements -->
  <g id="left-panel">
    <!-- Main Outer Box -->
    <rect x="30" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

    <!-- Header Box -->
    <rect x="40" y="85" width="415" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="247" y="106" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Без компенсації: помилка азимута при нахилі</text>

    <!-- Legends in Top Left of Panel -->
    <text x="48" y="134" font-size="12" fill="#6b7280">Горизонтальна площина</text>
    <text x="48" y="150" font-size="12" fill="#2457d6">Плата QMC5883L (нахилена)</text>
    <text x="48" y="166" font-size="12" font-weight="bold" fill="#c0392b">Осі давача (X_s, Y_s, Z_s)</text>

    <!-- Graphic Diagram -->
    <!-- Horizontal Reference Plane (Dashed Gray) -->
    <polygon points="130,290 290,290 345,230 185,230" fill="#ffffff" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="235" y1="260" x2="335" y2="260" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)"/>
    <line x1="235" y1="260" x2="160" y2="280" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)"/>

    <!-- Tilted Board PCB Plane -->
    <polygon points="145,305 305,270 340,195 180,230" fill="#eaf0fd" fill-opacity="0.75" stroke="#2457d6" stroke-width="2"/>
    <!-- QMC5883L IC Chip -->
    <polygon points="220,255 250,248 255,238 225,245" fill="#1a1a1a"/>

    <!-- Sensor Axes (Xs, Ys, Zs) -->
    <!-- X_s axis pointing up-right along board -->
    <line x1="235" y1="250" x2="305" y2="235" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <!-- Y_s axis pointing down-left along board -->
    <line x1="235" y1="250" x2="175" y2="263" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <!-- Z_s axis pointing up-right slightly to clear legend on left -->
    <line x1="235" y1="250" x2="245" y2="155" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

    <!-- 3D Field Vector B -->
    <line x1="235" y1="250" x2="320" y2="165" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

    <!-- Uncompensated Projection on Tilted Board -->
    <line x1="320" y1="165" x2="295" y2="212" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="235" y1="250" x2="295" y2="212" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>

    <!-- Pitch Arc -->
    <path d="M 275,260 A 40,40 0 0,0 273,244" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Labels for Left Diagram -->
    <text x="252" y="150" font-size="12" font-weight="bold" fill="#c0392b">Z_s</text>
    <text x="330" y="160" font-size="13" font-weight="bold" fill="#2457d6">Вектор B (3D)</text>
    <text x="300" y="224" font-size="12" font-weight="bold" fill="#c0392b">X_s</text>
    <text x="125" y="255" font-size="12" font-weight="bold" fill="#c0392b">Y_s</text>
    <text x="278" y="255" font-size="12" fill="#1a1a1a">θ</text>
    <text x="325" y="182" font-size="12" font-weight="bold" fill="#c0392b">Хибний азимут ψ_raw</text>

    <!-- Bottom Explanation Card -->
    <rect x="45" y="365" width="405" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="60" y="387" font-size="13" font-weight="bold" fill="#c0392b">Формула без компенсації (хибна):</text>
    <text x="60" y="412" font-size="13" font-weight="bold" fill="#1a1a1a">ψ_raw = atan2( Y_sens , X_sens )</text>
    <text x="60" y="437" font-size="12" fill="#6b7280">• При нахилі плати компоненти Bx, By спотворюються</text>
    <text x="60" y="460" font-size="12" fill="#6b7280">• Визначений курс відхиляється на десятки градусів</text>
    <text x="60" y="483" font-size="12" fill="#6b7280">• Потрібне врахування показань акселерометра</text>
  </g>

  <!-- RIGHT PANEL: Compensated Horizontal Projection -->
  <g id="right-panel">
    <!-- Main Outer Box -->
    <rect x="495" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

    <!-- Header Box -->
    <rect x="505" y="85" width="415" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="712" y="106" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">З компенсацією: ортогональна проекція на горизонт</text>

    <!-- Legend in Top Left -->
    <text x="515" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Кути нахилу IMU: θ (Pitch), ϕ (Roll)</text>

    <!-- Graphic Diagram -->
    <!-- True Horizontal Reference Plane (Green) -->
    <polygon points="560,290 740,290 800,230 620,230" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

    <!-- Horizontal Axes (Xh, Yh) -->
    <line x1="650" y1="260" x2="775" y2="260" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <line x1="650" y1="260" x2="580" y2="290" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

    <!-- Gravity Vector g (Black dashed down) -->
    <line x1="650" y1="260" x2="650" y2="335" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-dark)"/>

    <!-- 3D Field Vector B -->
    <line x1="650" y1="260" x2="750" y2="160" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

    <!-- Orthogonal Projection Line to Horizon -->
    <line x1="750" y1="160" x2="750" y2="225" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 4"/>
    <polyline points="742,225 742,217 750,217" fill="none" stroke="#27ae60" stroke-width="1.5"/>

    <!-- True Projected Vector Bh in Horizontal Plane -->
    <line x1="650" y1="260" x2="750" y2="225" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>

    <!-- True Heading Arc (psi) -->
    <path d="M 690,260 A 40,40 0 0,0 688,248" fill="none" stroke="#2457d6" stroke-width="1.5"/>

    <!-- Labels for Right Diagram -->
    <text x="760" y="155" font-size="13" font-weight="bold" fill="#2457d6">Вектор B (3D)</text>
    <text x="762" y="195" font-size="12" fill="#6b7280">Ортогональна проекція</text>
    <text x="545" y="215" font-size="12" font-weight="bold" fill="#27ae60">Проекція B_h</text>
    <text x="690" y="278" font-size="12" font-weight="bold" fill="#2457d6">Курс ψ</text>
    <text x="785" y="264" font-size="12" font-weight="bold" fill="#27ae60">X_h (Північ)</text>
    <text x="510" y="310" font-size="12" font-weight="bold" fill="#27ae60">Y_h (Схід)</text>
    <text x="660" y="335" font-size="12" fill="#1a1a1a">g (Гравітація)</text>

    <!-- Bottom Explanation Card -->
    <rect x="510" y="365" width="405" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="525" y="387" font-size="13" font-weight="bold" fill="#27ae60">Формули компенсації нахилу:</text>
    <text x="525" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">B_xh = B_x·cos θ + B_y·sin ϕ·sin θ + B_z·cos ϕ·sin θ</text>
    <text x="525" y="432" font-size="12" font-weight="bold" fill="#1a1a1a">B_yh = B_y·cos ϕ - B_z·sin ϕ</text>
    <text x="525" y="457" font-size="13" font-weight="bold" fill="#2457d6">Точний азимут:  ψ = atan2( B_yh , B_xh )</text>
    <text x="525" y="483" font-size="12" fill="#6b7280">• Точний курс не залежить від кутів нахилу плати</text>
  </g>
</svg>
