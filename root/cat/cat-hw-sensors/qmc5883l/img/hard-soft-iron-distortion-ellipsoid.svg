<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title block -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Спотворення магнетометра: Hard-Iron та Soft-Iron</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Hard-Iron зміщує центр сфери (вектор v_b), Soft-Iron деформує її в еліпсоїд (матриця W)</text>

  <!-- Panel 1: Left Visual Plot -->
  <rect x="30" y="80" width="440" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="106" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Геометрична модель у просторі вимірювань</text>

  <!-- Coordinate Axes -->
  <!-- B_x horizontal -->
  <line x1="60" y1="275" x2="390" y2="275" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="402" y="279" font-size="13" font-weight="700" fill="#1a1a1a">B_x</text>

  <!-- B_y vertical -->
  <line x1="210" y1="420" x2="210" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="210" y="120" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">B_y</text>

  <!-- B_z diagonal -->
  <line x1="210" y1="275" x2="115" y2="345" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="98" y="358" font-size="13" font-weight="700" fill="#1a1a1a">B_z</text>

  <!-- Ideal Circle -->
  <circle cx="210" cy="275" r="85" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="210" cy="275" r="4" fill="#27ae60"/>
  <text x="145" y="260" font-size="12" font-weight="700" fill="#27ae60">O (0,0,0)</text>

  <!-- Radius B_e line -->
  <line x1="210" y1="275" x2="210" y2="190" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="216" y="215" font-size="12" font-weight="700" fill="#27ae60">B_e</text>

  <!-- Hard-Iron Vector v_b -->
  <line x1="210" y1="275" x2="265" y2="235" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="265" cy="235" r="4" fill="#2457d6"/>
  <text x="275" y="230" font-size="12" font-weight="700" fill="#2457d6">O' (v_b)</text>
  <text x="230" y="218" font-size="13" font-weight="700" fill="#2457d6">v_b</text>

  <!-- Soft-Iron Distorted Ellipse -->
  <ellipse cx="265" cy="235" rx="115" ry="65" fill="#fdecea" fill-opacity="0.3" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="265" y1="235" x2="380" y2="235" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="295" y="252" font-size="12" fill="#c0392b">a (Soft-Iron)</text>
  <line x1="265" y1="235" x2="265" y2="170" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="270" y="195" font-size="12" fill="#c0392b">b</text>

  <!-- Legend in Panel 1 -->
  <circle cx="58" cy="451" r="5" fill="#27ae60"/>
  <text x="70" y="455" font-size="12" fill="#1a1a1a">Ідеальна сфера (B_e)</text>

  <line x1="200" y1="451" x2="215" y2="451" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="222" y="455" font-size="12" fill="#1a1a1a">Hard-Iron зсув (v_b)</text>

  <ellipse cx="348" cy="451" rx="8" ry="5" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="362" y="455" font-size="12" fill="#1a1a1a">Еліпсоїд (W)</text>

  <!-- Panel 2: Right Explanation & Math -->
  <rect x="490" y="80" width="440" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="106" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Аналіз спотворень та математична модель</text>

  <!-- Sub-card 1: Hard-Iron -->
  <rect x="506" y="120" width="408" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="522" y="142" font-size="14" font-weight="700" fill="#2457d6">1. Hard-Iron (Постійне магнітне зміщення)</text>
  <text x="522" y="163" font-size="12" fill="#1a1a1a">• Джерело: постійні магніти, намагнічені гвинти, деталі PCB.</text>
  <text x="522" y="181" font-size="12" fill="#1a1a1a">• Ефект: зсув центра сфери на сталий вектор v_b = [V_x, V_y, V_z]ᵀ.</text>
  <text x="522" y="199" font-size="12" font-weight="700" fill="#2457d6">• Модель: h_hard = h_ideal + v_b  (форма сфери не змінюється)</text>

  <!-- Sub-card 2: Soft-Iron -->
  <rect x="506" y="232" width="408" height="100" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="522" y="254" font-size="14" font-weight="700" fill="#c0392b">2. Soft-Iron (Наводжуване магнітне поле)</text>
  <text x="522" y="275" font-size="12" fill="#1a1a1a">• Джерело: м'які феромагнетики (сталь, залізо), що викривляють поле.</text>
  <text x="522" y="293" font-size="12" fill="#1a1a1a">• Ефект: деформація сфери в еліпсоїд (стиснення, розтяг, поворот).</text>
  <text x="522" y="311" font-size="12" font-weight="700" fill="#c0392b">• Модель: h_soft = W · h_ideal  (W — матриця 3×3)</text>

  <!-- Sub-card 3: Calibration -->
  <rect x="506" y="344" width="408" height="118" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="522" y="366" font-size="14" font-weight="700" fill="#27ae60">3. Повна модель та алгоритм калібрування</text>
  <text x="522" y="387" font-size="13" font-weight="700" fill="#1a1a1a">Сирі вимірювання:   h_meas = W · h_ideal + v_b</text>
  <text x="522" y="408" font-size="13" font-weight="700" fill="#27ae60">Калібрований вектор:  h_cal = W⁻¹ · (h_meas - v_b)</text>
  <text x="522" y="427" font-size="12" fill="#6b7280">• EEPROM зберігає: vector v_b [3×1] та matrix W⁻¹ [3×3]</text>
  <text x="522" y="445" font-size="12" fill="#6b7280">• Результат: відновлена сфера радіуса |h_cal| = B_e</text>
</svg>
