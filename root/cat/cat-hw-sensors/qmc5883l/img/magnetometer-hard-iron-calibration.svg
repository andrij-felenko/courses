<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Калібрування магнітометра QMC5883L: компенсація Hard-Iron</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Обчислення зсуву V_offset за екстремумами повертає центр кола вимірювань у (0,0)</text>

  <!-- Card 1: Uncalibrated / Hard-Iron Shifted Data -->
  <rect x="30" y="76" width="415" height="338" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="42" y="86" width="391" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="237" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">1. Спотворені сирі дані (зсув Hard-Iron)</text>

  <!-- Axes Card 1 -->
  <line x1="65" y1="265" x2="395" y2="265" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="402" y="269" text-anchor="start" font-size="12" fill="#1a1a1a">X_raw</text>

  <line x1="215" y1="390" x2="215" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="215" y="129" text-anchor="middle" font-size="12" fill="#1a1a1a">Y_raw</text>

  <text x="203" y="282" text-anchor="end" font-size="12" fill="#6b7280">(0,0)</text>

  <!-- Shifted Circle & Extremes Card 1 -->
  <line x1="205" y1="135" x2="205" y2="298" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="205" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">X_min</text>

  <line x1="345" y1="135" x2="345" y2="298" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="345" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">X_max</text>

  <line x1="190" y1="145" x2="355" y2="145" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="363" y="149" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Y_max</text>

  <line x1="190" y1="285" x2="355" y2="285" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="363" y="289" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Y_min</text>

  <!-- Shifted Trajectory Circle -->
  <circle cx="275" cy="215" r="70" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Raw Sample Points -->
  <circle cx="345" cy="215" r="3" fill="#c0392b"/>
  <circle cx="336" cy="250" r="3" fill="#c0392b"/>
  <circle cx="310" cy="276" r="3" fill="#c0392b"/>
  <circle cx="275" cy="285" r="3" fill="#c0392b"/>
  <circle cx="240" cy="276" r="3" fill="#c0392b"/>
  <circle cx="214" cy="250" r="3" fill="#c0392b"/>
  <circle cx="205" cy="215" r="3" fill="#c0392b"/>
  <circle cx="214" cy="180" r="3" fill="#c0392b"/>
  <circle cx="240" cy="154" r="3" fill="#c0392b"/>
  <circle cx="275" cy="145" r="3" fill="#c0392b"/>
  <circle cx="310" cy="154" r="3" fill="#c0392b"/>
  <circle cx="336" cy="180" r="3" fill="#c0392b"/>

  <!-- Shift Vector & Center -->
  <line x1="215" y1="265" x2="271" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="240" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_offset</text>
  <circle cx="275" cy="215" r="4" fill="#c0392b"/>
  <text x="283" y="211" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">C_raw</text>

  <!-- Middle Transition Arrow -->
  <line x1="452" y1="235" x2="500" y2="235" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="476" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Зсув -V</text>
  <text x="476" y="254" text-anchor="middle" font-size="12" fill="#6b7280">калібрування</text>

  <!-- Card 2: Calibrated Data -->
  <rect x="515" y="76" width="415" height="338" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="527" y="86" width="391" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="722" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">2. Відкаліброване коло (центр у (0,0))</text>

  <!-- Axes Card 2 -->
  <line x1="550" y1="255" x2="880" y2="255" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="887" y="259" text-anchor="start" font-size="12" fill="#1a1a1a">X_cal</text>

  <line x1="722" y1="390" x2="722" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="722" y="129" text-anchor="middle" font-size="12" fill="#1a1a1a">Y_cal</text>

  <text x="710" y="272" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">(0,0)</text>

  <!-- Symmetric Extrema Lines Card 2 -->
  <line x1="652" y1="135" x2="652" y2="298" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="652" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">-R</text>

  <line x1="792" y1="135" x2="792" y2="298" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="792" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+R</text>

  <line x1="637" y1="185" x2="807" y2="185" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="815" y="189" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">+R</text>

  <line x1="637" y1="325" x2="807" y2="325" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1" opacity="0.6"/>
  <text x="815" y="329" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">-R</text>

  <!-- Calibrated Circle -->
  <circle cx="722" cy="255" r="70" fill="#e9f7ef" fill-opacity="0.4" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Calibrated Sample Points -->
  <circle cx="792" cy="255" r="3" fill="#27ae60"/>
  <circle cx="783" cy="290" r="3" fill="#27ae60"/>
  <circle cx="757" cy="316" r="3" fill="#27ae60"/>
  <circle cx="722" cy="325" r="3" fill="#27ae60"/>
  <circle cx="687" cy="316" r="3" fill="#27ae60"/>
  <circle cx="661" cy="290" r="3" fill="#27ae60"/>
  <circle cx="652" cy="255" r="3" fill="#27ae60"/>
  <circle cx="661" cy="220" r="3" fill="#27ae60"/>
  <circle cx="687" cy="194" r="3" fill="#27ae60"/>
  <circle cx="722" cy="185" r="3" fill="#27ae60"/>
  <circle cx="757" cy="194" r="3" fill="#27ae60"/>
  <circle cx="783" cy="220" r="3" fill="#27ae60"/>

  <!-- Center Dot Card 2 -->
  <circle cx="722" cy="255" r="4" fill="#27ae60"/>

  <!-- Azimuth Vector & Angle -->
  <line x1="722" y1="255" x2="773" y2="219" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="725" y="198" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">B (вектор)</text>
  <path d="M 750 255 A 28 28 0 0 0 745 239" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="758" y="249" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">θ</text>

  <!-- Bottom Formula & Algorithm Panel -->
  <rect x="30" y="430" width="900" height="72" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="40" y="438" width="286" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="183" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">1. Обчислення зсуву (Offset)</text>
  <text x="183" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_x = (X_min+X_max)/2 , V_y = (Y_min+Y_max)/2</text>

  <rect x="337" y="438" width="286" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2. Компенсація завади</text>
  <text x="480" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">X_cal = X_raw - V_x , Y_cal = Y_raw - V_y</text>

  <rect x="634" y="438" width="286" height="56" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="777" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">3. Точний азимут (Кут)</text>
  <text x="777" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">α = atan2(Y_cal, X_cal) × (180 / π)</text>
</svg>
