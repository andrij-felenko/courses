<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип роботи AMR-містком Вітстона у магнітометрі</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішнє магнітне поле повертає вектор намагніченості пермалою, змінюючи опір плечей містка</text>

  <!-- LEFT PANEL: Electrical Bridge Circuit -->
  <rect x="40" y="80" width="420" height="455" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="250" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратно-електрична схема містка (AMR Bridge)</text>

  <!-- Power Supply Vcc -->
  <text x="250" y="138" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Живлення Vcc (+1.8V)</text>
  <line x1="250" y1="144" x2="250" y2="160" stroke="#2457d6" stroke-width="2"/>
  <circle cx="250" cy="160" r="4" fill="#2457d6"/>

  <!-- Top Horizontal Bridge Wire -->
  <line x1="160" y1="160" x2="340" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Left Upper Branch Wire to R1 -->
  <line x1="160" y1="160" x2="160" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R1 Box -->
  <rect x="144" y="185" width="32" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="160" y="217" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">+ΔR</text>

  <!-- R1 Labels -->
  <text x="134" y="205" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Плече R₁</text>
  <text x="134" y="222" font-size="12" fill="#27ae60" text-anchor="end">R₀ + ΔR</text>

  <!-- Right Upper Branch Wire to R2 -->
  <line x1="340" y1="160" x2="340" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R2 Box -->
  <rect x="324" y="185" width="32" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="340" y="217" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">-ΔR</text>

  <!-- R2 Labels -->
  <text x="366" y="205" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Плече R₂</text>
  <text x="366" y="222" font-size="12" fill="#c0392b" text-anchor="start">R₀ - ΔR</text>

  <!-- Middle Nodes & Differential Output Wire -->
  <line x1="160" y1="240" x2="160" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="240" x2="340" y2="320" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="160" cy="280" r="4" fill="#c0392b"/>
  <text x="122" y="284" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Vout-</text>

  <circle cx="340" cy="280" r="4" fill="#27ae60"/>
  <text x="378" y="284" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Vout+</text>

  <!-- Voltmeter Output Box -->
  <line x1="160" y1="280" x2="200" y2="280" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="200" y="265" width="100" height="30" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="250" y="284" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Vout (ΔV)</text>
  <line x1="300" y1="280" x2="340" y2="280" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Left Lower Branch R3 Box -->
  <rect x="144" y="320" width="32" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="160" y="352" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">-ΔR</text>

  <!-- R3 Labels -->
  <text x="134" y="340" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Плече R₃</text>
  <text x="134" y="357" font-size="12" fill="#c0392b" text-anchor="end">R₀ - ΔR</text>

  <!-- Right Lower Branch R4 Box -->
  <rect x="324" y="320" width="32" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="340" y="352" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">+ΔR</text>

  <!-- R4 Labels -->
  <text x="366" y="340" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Плече R₄</text>
  <text x="366" y="357" font-size="12" fill="#27ae60" text-anchor="start">R₀ + ΔR</text>

  <!-- Bottom Horizontal Wire & GND Node -->
  <line x1="160" y1="375" x2="160" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="375" x2="340" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="160" y1="410" x2="340" y2="410" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="250" cy="410" r="4" fill="#1a1a1a"/>
  <line x1="250" y1="410" x2="250" y2="422" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Ground Symbol -->
  <line x1="235" y1="422" x2="265" y2="422" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="426" x2="260" y2="426" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="245" y1="430" x2="255" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="446" font-size="12" fill="#6b7280" text-anchor="middle">Земля (GND)</text>

  <!-- Panel 1 Equation Card -->
  <rect x="60" y="460" width="380" height="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="250" y="482" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Vout = Vcc · (ΔR / R₀) ∝ H_ext</text>
  <text x="250" y="504" font-size="12" fill="#6b7280" text-anchor="middle">Вихідна диф. напруга пропорційна вимірюваному полю</text>

  <!-- RIGHT PANEL: AMR Magnetoresistive Physics -->
  <rect x="480" y="80" width="440" height="455" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="700" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фізика AMR-ефекту в тонкій плівці Пермалою</text>

  <!-- Card A: Equilibrium State (H_ext = 0) -->
  <rect x="498" y="128" width="404" height="165" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="515" y="150" font-size="13" font-weight="bold" fill="#1a1a1a">1. Стан спокою (H_ext = 0)</text>

  <!-- Permalloy Strip Graphic A -->
  <rect x="520" y="165" width="220" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="530" y="182" font-size="12" font-weight="bold" fill="#2457d6">Пермалой (Ni80Fe20)</text>

  <!-- Magnetization Vector M (Collinear with I, above I) -->
  <line x1="580" y1="202" x2="670" y2="202" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="580" y="196" font-size="12" font-weight="bold" fill="#2457d6">Вектор M (θ = 0°)</text>

  <!-- Current Arrow I (Dashed black line, below M) -->
  <line x1="535" y1="214" x2="715" y2="214" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-black)"/>
  <text x="535" y="228" font-size="12" fill="#1a1a1a">Струм I</text>

  <!-- Result Callout A -->
  <rect x="755" y="165" width="135" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="822" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Опір R = R₀</text>
  <text x="822" y="213" font-size="12" fill="#6b7280" text-anchor="middle">(Максимальний)</text>

  <!-- Card A Notes -->
  <text x="515" y="258" font-size="12" fill="#6b7280">Вектор M паралельний струму I (кут θ = 0°).</text>
  <text x="515" y="276" font-size="12" fill="#6b7280">Опір максимальний: R = R₀ + ΔR_max.</text>

  <!-- Card B: Transverse Magnetic Field (H_ext > 0) -->
  <rect x="498" y="305" width="404" height="215" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="515" y="325" font-size="13" font-weight="bold" fill="#1a1a1a">2. Вплив поперечного поля H_ext</text>

  <!-- Permalloy Strip Graphic B -->
  <rect x="520" y="340" width="220" height="85" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="530" y="356" font-size="12" font-weight="bold" fill="#c0392b">Пермалой (Ni80Fe20)</text>

  <!-- Current Axis I -->
  <line x1="535" y1="405" x2="715" y2="405" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-black)"/>
  <text x="535" y="420" font-size="12" fill="#1a1a1a">Струм I</text>

  <!-- Rotated Magnetization Vector M -->
  <line x1="575" y1="405" x2="650" y2="371" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 610 405 A 35 35 0 0 0 607 390" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="614" y="401" font-size="12" font-weight="bold" fill="#2457d6">θ</text>
  <text x="658" y="368" font-size="12" font-weight="bold" fill="#2457d6">Вектор M</text>

  <!-- External Magnetic Field Arrow H_ext -->
  <line x1="630" y1="465" x2="630" y2="432" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="642" y="455" font-size="12" font-weight="bold" fill="#c0392b">Поле H_ext</text>

  <!-- Result Callout B -->
  <rect x="755" y="340" width="135" height="85" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="822" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зміна опору ΔR</text>
  <text x="822" y="385" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R(θ) = R₀ · cos²θ</text>
  <text x="822" y="405" font-size="11" fill="#6b7280" text-anchor="middle">Опір зменшується</text>

  <!-- Card B Notes -->
  <text x="515" y="484" font-size="12" fill="#6b7280">Поле H_ext повертає вектор M на кут θ відносно струму I.</text>
  <text x="515" y="502" font-size="12" font-weight="bold" fill="#1a1a1a">Це викликає дисбаланс містка та вихідну напругу Vout.</text>
</svg>
