<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Схема перетворення шкали Кельвіна в градуси Цельсія (10 мВ/°C) на ОУ</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Віднімання опорного струму 273.2 мкА (0 °C = 0.000 В) у підсумовуючій точці операційного підсилювача</text>

  <!-- Схема ОУ перетворювача -->
  <g transform="translate(40, 85)">
    <!-- Датчик AD590 зліва -->
    <rect x="10" y="50" width="160" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="90" y="75" fill="#e3b341" font-size="13" font-weight="700" text-anchor="middle">AD590</text>
    <text x="90" y="93" fill="#8b949e" font-size="10" text-anchor="middle">Сенсор на об'єкті</text>

    <!-- Вивід + до V_CC (+15 В) -->
    <line x1="90" y1="20" x2="90" y2="50" stroke="#f0883e" stroke-width="2.5"/>
    <circle cx="90" cy="20" r="4" fill="#f0883e"/>
    <text x="105" y="25" fill="#f0883e" font-size="11" font-weight="700">+15 В</text>

    <!-- Вивід - зі струмом I_T (1 мкА/К) -->
    <line x1="90" y1="140" x2="280" y2="140" stroke="#3fb950" stroke-width="2.5"/>
    <polygon points="210,140 198,135 198,145" fill="#3fb950"/>
    <text x="210" y="130" fill="#3fb950" font-size="11" font-weight="700">I_T = 1 мкА/К</text>

    <!-- Схема зсуву нуля (Zero Offset: віднімання 273.2 мкА) -->
    <g transform="translate(180, 230)">
      <!-- Джерело опорної напруги -V_ref (-10 В або -5 В) -->
      <circle cx="10" cy="0" r="4" fill="#ff7b72"/>
      <text x="25" y="5" fill="#ff7b72" font-size="11" font-weight="700">-V_REF (-10.00 В)</text>
      <line x1="10" y1="0" x2="10" y2="30" stroke="#ff7b72" stroke-width="2"/>

      <!-- Резистор R_zero (підстроєчник зміщення нуля 0 °C) -->
      <rect x="0" y="30" width="20" height="40" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
      <text x="30" y="55" fill="#ff7b72" font-size="10" font-weight="700">R_zero (36.6 кОм)</text>
      
      <line x1="10" y1="70" x2="10" y2="100" stroke="#ff7b72" stroke-width="2"/>
      <line x1="10" y1="100" x2="100" y2="100" stroke="#ff7b72" stroke-width="2"/>
      <line x1="100" y1="100" x2="100" y2="-90" stroke="#ff7b72" stroke-width="2"/>
      
      <polygon points="100,-20 95,-10 105,-10" fill="#ff7b72"/>
      <text x="110" y="-30" fill="#ff7b72" font-size="10" font-weight="700">I_zero = -273.2 мкА</text>
    </g>

    <!-- Суматорна точка ОУ (Віртуальний нуль) -->
    <circle cx="280" cy="140" r="5" fill="#f0f6fc"/>
    <text x="260" y="165" fill="#8b949e" font-size="10">Віртуальна земля</text>

    <!-- Операційний підсилювач (OP-07 / OPA277) -->
    <polygon points="340,90 340,190 430,140" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="365" y="145" fill="#58a6ff" font-size="12" font-weight="700">ОУ</text>

    <!-- Входи ОУ -->
    <line x1="280" y1="115" x2="340" y2="115" stroke="#f0f6fc" stroke-width="2"/>
    <text x="325" y="112" fill="#f0f6fc" font-size="12">-</text>

    <line x1="280" y1="140" x2="280" y2="115" stroke="#f0f6fc" stroke-width="2"/>

    <!-- Неінвертуючий вхід на землю -->
    <line x1="310" y1="165" x2="340" y2="165" stroke="#8b949e" stroke-width="2"/>
    <text x="325" y="162" fill="#8b949e" font-size="12">+</text>
    <line x1="310" y1="165" x2="310" y2="185" stroke="#8b949e" stroke-width="2"/>
    <line x1="300" y1="185" x2="320" y2="185" stroke="#8b949e" stroke-width="2"/>
    <text x="290" y="200" fill="#8b949e" font-size="9">GND</text>

    <!-- Резистор зворотного зв'язку R_f (10 кОм) -->
    <line x1="280" y1="115" x2="280" y2="55" stroke="#f0f6fc" stroke-width="2"/>
    <line x1="280" y1="55" x2="340" y2="55" stroke="#f0f6fc" stroke-width="2"/>

    <rect x="340" y="45" width="45" height="20" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="362" y="59" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">R_f</text>
    <text x="362" y="38" fill="#8b949e" font-size="9" text-anchor="middle">10.00 кОм (0.1%)</text>

    <line x1="385" y1="55" x2="455" y2="55" stroke="#f0f6fc" stroke-width="2"/>
    <line x1="455" y1="55" x2="455" y2="140" stroke="#f0f6fc" stroke-width="2"/>

    <!-- Вихід ОУ V_out -->
    <line x1="430" y1="140" x2="520" y2="140" stroke="#3fb950" stroke-width="3"/>
    <circle cx="520" cy="140" r="5" fill="#3fb950"/>
    <text x="535" y="145" fill="#3fb950" font-size="14" font-weight="700">V_out (10 мВ / °C)</text>

    <!-- Права панель: Градуювання шкали Цельсія -->
    <g transform="translate(560, 20)">
      <rect width="320" height="315" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
      <rect width="320" height="30" rx="8" fill="#21262d"/>
      <text x="160" y="21" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Вихідна напруга в шкалі Цельсія</text>

      <text x="15" y="55" fill="#f0f6fc" font-size="11" font-weight="600">Формула вихідної напруги схеми:</text>
      <rect x="10" y="65" width="300" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
      <text x="20" y="92" fill="#3fb950" font-size="12" font-family="Consolas, monospace">
        V_out = (I_T - 273.15 мкА) × R_f
      </text>

      <!-- Таблиця точок -->
      <g transform="translate(10, 125)">
        <text x="10" y="15" fill="#58a6ff" font-size="11" font-weight="700">Температура</text>
        <text x="130" y="15" fill="#8b949e" font-size="11" font-weight="700">Струм I_T</text>
        <text x="220" y="15" fill="#3fb950" font-size="11" font-weight="700">Напруга V_out</text>

        <line x1="0" y1="22" x2="300" y2="22" stroke="#30363d"/>

        <text x="10" y="42" fill="#f0f6fc" font-size="11">0.0 °C</text>
        <text x="130" y="42" fill="#8b949e" font-size="11">273.2 мкА</text>
        <text x="220" y="42" fill="#3fb950" font-size="11" font-weight="700">0.000 В</text>

        <text x="10" y="68" fill="#f0f6fc" font-size="11">+25.0 °C</text>
        <text x="130" y="68" fill="#8b949e" font-size="11">298.2 мкА</text>
        <text x="220" y="68" fill="#3fb950" font-size="11" font-weight="700">+0.250 В</text>

        <text x="10" y="94" fill="#f0f6fc" font-size="11">+100.0 °C</text>
        <text x="130" y="94" fill="#8b949e" font-size="11">373.2 мкА</text>
        <text x="220" y="94" fill="#3fb950" font-size="11" font-weight="700">+1.000 В</text>

        <line x1="0" y1="105" x2="300" y2="105" stroke="#30363d"/>
      </g>

      <text x="15" y="270" fill="#e3b341" font-size="10" font-weight="700">Калібрування за 2 точками:</text>
      <text x="15" y="287" fill="#8b949e" font-size="9">1. При 0 °C (лід): R_zero виставляє V_out = 0.000 В</text>
      <text x="15" y="302" fill="#8b949e" font-size="9">2. При 100 °C (окріп): R_f виставляє V_out = 1.000 В</text>
    </g>
  </g>

  <!-- Підвал -->
  <g transform="translate(40, 435)">
    <rect width="880" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ПЕРЕВАГА ОУ-ПЕРЕТВОРЮВАЧА ДЛЯ АЦП МІКРОКОНТРОЛЕРА:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Сигнал 10 мВ/°C ідеально узгоджується з діапазоном АЦП 0..3.3 В (діапазон 0...+150 °C займає напругу від 0 до 1.50 В).
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • Віртуальна земля ОУ усуває залежність вихідного струму сенсора від потенціалу навантаження.
    </text>
  </g>
</svg>
