<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Порівняльна матриця датчиків температури: Струмовий AD590 vs Напруговий LM35 vs Цифровий DS18B20</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Аналіз стійкості до довжини кабелю, електромагнітних завад (EMI) та складності підключення</text>

  <!-- Таблиця порівняння (4 типи датчиків) -->
  <g transform="translate(30, 85)">
    <!-- Шапка таблиці -->
    <rect x="0" y="0" width="900" height="40" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="110" y="25" fill="#f0f6fc" font-size="12" font-weight="700">Тип сенсора</text>
    <text x="270" y="25" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">Тип сигналу</text>
    <text x="420" y="25" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Довжина кабелю</text>
    <text x="590" y="25" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">Завадостійкість (EMI)</text>
    <text x="770" y="25" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">Кількість жил / Складність</text>

    <!-- Рядок 1: AD590 / AD592 -->
    <rect x="0" y="44" width="900" height="65" fill="#161b22"/>
    <circle cx="20" cy="76" r="6" fill="#3fb950"/>
    <text x="35" y="70" fill="#3fb950" font-size="12" font-weight="700">AD590 / AD592</text>
    <text x="35" y="88" fill="#8b949e" font-size="10">Струмовий PTAT (Analog Devices)</text>
    <text x="270" y="72" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Струм: 1.0 мкА / K</text>
    <text x="270" y="90" fill="#8b949e" font-size="10" text-anchor="middle">Z_out &gt; 10 МОм</text>
    <text x="420" y="72" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">&gt; 100...500 метрів</text>
    <text x="420" y="90" fill="#8b949e" font-size="10" text-anchor="middle">Опір дроту не впливає</text>
    <text x="590" y="72" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Максимальна (петля)</text>
    <text x="590" y="90" fill="#8b949e" font-size="10" text-anchor="middle">Стійкий до наводок поля</text>
    <text x="770" y="72" fill="#f0f6fc" font-size="11" text-anchor="middle">2 жили (тільки пара)</text>
    <text x="770" y="90" fill="#3fb950" font-size="10" text-anchor="middle">1 резистор R_L = 1 кОм</text>

    <!-- Рядок 2: LM35 / TMP36 -->
    <rect x="0" y="113" width="900" height="65" fill="#0d1117"/>
    <circle cx="20" cy="145" r="6" fill="#58a6ff"/>
    <text x="35" y="140" fill="#58a6ff" font-size="12" font-weight="700">LM35 / TMP36</text>
    <text x="35" y="158" fill="#8b949e" font-size="10">Напруговий кремнієвий IC (TI/ADI)</text>
    <text x="270" y="142" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">Напруга: 10 мВ / °C</text>
    <text x="270" y="160" fill="#8b949e" font-size="10" text-anchor="middle">Низький вихідний опір</text>
    <text x="420" y="142" fill="#ff7b72" font-size="11" text-anchor="middle">&lt; 1...3 метри</text>
    <text x="420" y="160" fill="#ff7b72" font-size="10" text-anchor="middle">Похибка від I_gnd кабелю</text>
    <text x="590" y="142" fill="#ff7b72" font-size="11" text-anchor="middle">Низька</text>
    <text x="590" y="160" fill="#8b949e" font-size="10" text-anchor="middle">Схильний до збудження на C</text>
    <text x="770" y="142" fill="#f0f6fc" font-size="11" text-anchor="middle">3 жили (VCC, GND, OUT)</text>
    <text x="770" y="160" fill="#8b949e" font-size="10" text-anchor="middle">Прямий вхід в АЦП</text>

    <!-- Рядок 3: DS18B20 -->
    <rect x="0" y="182" width="900" height="65" fill="#161b22"/>
    <circle cx="20" cy="214" r="6" fill="#e3b341"/>
    <text x="35" y="209" fill="#e3b341" font-size="12" font-weight="700">DS18B20</text>
    <text x="35" y="227" fill="#8b949e" font-size="10">Цифровий 1-Wire (Dallas/Maxim)</text>
    <text x="270" y="211" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Цифровий код 9..12 біт</text>
    <text x="270" y="229" fill="#8b949e" font-size="10" text-anchor="middle">Шина 1-Wire з CRC-8</text>
    <text x="420" y="211" fill="#e3b341" font-size="11" text-anchor="middle">До 30...50 метрів</text>
    <text x="420" y="229" fill="#8b949e" font-size="10" text-anchor="middle">Обмежена ємністю шини</text>
    <text x="590" y="211" fill="#58a6ff" font-size="11" text-anchor="middle">Висока (цифра)</text>
    <text x="590" y="229" fill="#8b949e" font-size="10" text-anchor="middle">CRC захист від збоїв</text>
    <text x="770" y="211" fill="#f0f6fc" font-size="11" text-anchor="middle">2 або 3 жили</text>
    <text x="770" y="229" fill="#8b949e" font-size="10" text-anchor="middle">Потребує timing мікросекунд</text>

    <!-- Рядок 4: Платиновий RTD Pt100 -->
    <rect x="0" y="251" width="900" height="60" fill="#0d1117"/>
    <circle cx="20" cy="281" r="6" fill="#d2a8ff"/>
    <text x="35" y="276" fill="#d2a8ff" font-size="12" font-weight="700">Pt100 (RTD)</text>
    <text x="35" y="294" fill="#8b949e" font-size="10">Платиновий резистор IEC 60751</text>
    <text x="270" y="278" fill="#d2a8ff" font-size="11" font-weight="700" text-anchor="middle">Опір: 0.385 Ом / °C</text>
    <text x="270" y="296" fill="#8b949e" font-size="10" text-anchor="middle">Низький імпеданс</text>
    <text x="420" y="278" fill="#58a6ff" font-size="11" text-anchor="middle">До 50...100 метрів</text>
    <text x="420" y="296" fill="#8b949e" font-size="10" text-anchor="middle">Лише з 3/4-провідним AFE</text>
    <text x="590" y="278" fill="#8b949e" font-size="11" text-anchor="middle">Середня</text>
    <text x="590" y="296" fill="#8b949e" font-size="10" text-anchor="middle">Синфазні завади 50 Гц</text>
    <text x="770" y="278" fill="#f0f6fc" font-size="11" text-anchor="middle">3 або 4 жили</text>
    <text x="770" y="296" fill="#ff7b72" font-size="10" text-anchor="middle">Дорогий AFE + джерело струму</text>
  </g>

  <!-- Підвал -->
  <g transform="translate(30, 435)">
    <rect width="900" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ГОЛОВНА НІША ЗАСТОСУВАННЯ AD590:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • AD590 є неперевершеним вибором, коли необхідно винести аналоговий датчик на 50–200 метрів від приладу безпосередньо у промислову зону
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • з високим рівнем електромагнітних завад по дешевій дводротовій лінії, виключаючи будь-які калібрування опору кабелю.
    </text>
  </g>
</svg>
