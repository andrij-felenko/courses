<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Будова дротяного платинового термоопору (Wire-Wound PT100)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Вільне розміщення платинової спіралі в керамічних каналах запобігає механічним напруженням при нагріві</text>

  <!-- Вказівки та виноси (Верхній ряд) -->
  <text x="140" y="85" font-size="13" font-weight="700" fill="#1a1a1a">Керамічний каркас (Al₂O₃)</text>
  <text x="140" y="101" font-size="12" fill="#6b7280">Високочиста кераміка з каналами</text>
  <line x1="260" y1="105" x2="260" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="420" y="85" font-size="13" font-weight="700" fill="#2457d6">Платинова спіраль (Pt)</text>
  <text x="420" y="101" font-size="12" fill="#6b7280">Вільна вита форма запобігає напруженню</text>
  <line x1="470" y1="105" x2="470" y2="135" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="700" y="85" font-size="13" font-weight="700" fill="#1a1a1a">Герметична глазур</text>
  <text x="700" y="101" font-size="12" fill="#6b7280">Скляний затвор проти вологи</text>
  <line x1="710" y1="105" x2="665" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Основний корпус термоопору -->
  <!-- Керамічний циліндр -->
  <rect x="140" y="115" width="540" height="170" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- Середня монолітна стінка між каналами -->
  <rect x="140" y="185" width="490" height="30" fill="#e6ebf0"/>

  <!-- Канал 1 (Верхній) -->
  <rect x="175" y="135" width="455" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Канал 2 (Нижній) -->
  <rect x="175" y="215" width="455" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Дрібні цятки керамічного порошку у каналах -->
  <circle cx="210" cy="145" r="1.5" fill="#a0aec0"/>
  <circle cx="250" cy="175" r="1.5" fill="#a0aec0"/>
  <circle cx="310" cy="143" r="1.5" fill="#a0aec0"/>
  <circle cx="370" cy="177" r="1.5" fill="#a0aec0"/>
  <circle cx="430" cy="144" r="1.5" fill="#a0aec0"/>
  <circle cx="490" cy="176" r="1.5" fill="#a0aec0"/>
  <circle cx="550" cy="143" r="1.5" fill="#a0aec0"/>

  <circle cx="210" cy="255" r="1.5" fill="#a0aec0"/>
  <circle cx="250" cy="223" r="1.5" fill="#a0aec0"/>
  <circle cx="310" cy="257" r="1.5" fill="#a0aec0"/>
  <circle cx="370" cy="223" r="1.5" fill="#a0aec0"/>
  <circle cx="430" cy="256" r="1.5" fill="#a0aec0"/>
  <circle cx="490" cy="224" r="1.5" fill="#a0aec0"/>
  <circle cx="550" cy="257" r="1.5" fill="#a0aec0"/>

  <!-- Платинова спіраль (Верхня та нижня гілки з U-петлею ліворуч) -->
  <path d="M 190,160 C 170,160 170,240 190,240" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Верхня спіраль -->
  <path d="M 190,160 
           C 195,145 205,145 210,160 C 215,175 225,175 230,160 
           C 235,145 245,145 250,160 C 255,175 265,175 270,160 
           C 275,145 285,145 290,160 C 295,175 305,175 310,160 
           C 315,145 325,145 330,160 C 335,175 345,175 350,160 
           C 355,145 365,145 370,160 C 375,175 385,175 390,160 
           C 395,145 405,145 410,160 C 415,175 425,175 430,160 
           C 435,145 445,145 450,160 C 455,175 465,175 470,160 
           C 475,145 485,145 490,160 C 495,175 505,175 510,160 
           C 515,145 525,145 530,160 C 535,175 545,175 550,160 
           C 555,145 565,145 570,160 C 575,175 585,175 590,160 
           L 680,160" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Нижня спіраль -->
  <path d="M 190,240 
           C 195,225 205,225 210,240 C 215,255 225,255 230,240 
           C 235,225 245,225 250,240 C 255,255 265,255 270,240 
           C 275,225 285,225 290,240 C 295,255 305,255 310,240 
           C 315,225 325,225 330,240 C 335,255 345,255 350,240 
           C 355,225 365,225 370,240 C 375,255 385,255 390,240 
           C 395,225 405,225 410,240 C 415,255 425,255 430,240 
           C 435,225 445,225 450,240 C 455,255 465,255 470,240 
           C 475,225 485,225 490,240 C 495,255 505,255 510,240 
           C 515,225 525,225 530,240 C 535,255 545,255 550,240 
           C 555,225 565,225 570,240 C 575,255 585,255 590,240 
           L 680,240" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Скляна глазур / Затвор -->
  <rect x="630" y="125" width="50" height="150" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <!-- Вивідні провідники -->
  <line x1="680" y1="160" x2="845" y2="160" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="680" y1="240" x2="845" y2="240" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Контактні площадки виводів -->
  <circle cx="850" cy="160" r="5" fill="#2457d6"/>
  <circle cx="850" cy="240" r="5" fill="#2457d6"/>

  <!-- Додаткові виноски збоку і знизу -->
  <text x="25" y="192" font-size="13" font-weight="700" fill="#1a1a1a">U-подібна петля</text>
  <text x="25" y="208" font-size="12" fill="#6b7280">Суцільний дріт</text>
  <line x1="125" y1="200" x2="165" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="200" y="302" font-size="13" font-weight="700" fill="#1a1a1a">Фіксуючий порошок (Al₂O₃)</text>
  <text x="200" y="318" font-size="12" fill="#6b7280">Заповнює канали, передає тепло</text>
  <line x1="280" y1="294" x2="280" y2="268" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="720" y="192" font-size="13" font-weight="700" fill="#1a1a1a">Вивідні провідники</text>
  <text x="720" y="208" font-size="12" fill="#6b7280">Для вимірювального кола</text>
  <line x1="770" y1="215" x2="770" y2="232" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Нижні картки пояснень -->
  <!-- Картка 1: Механіка розв'язки -->
  <rect x="40" y="340" width="420" height="92" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="60" y="364" font-size="13" font-weight="700" fill="#27ae60">✓ Механічна розв'язка (Stress-Free Design)</text>
  <text x="60" y="386" font-size="12" fill="#1a1a1a">• Вільна спіраль вільно розширюється у поздовжніх каналах</text>
  <text x="60" y="404" font-size="12" fill="#1a1a1a">• Відсутність деформацій запобігає дрейфу опору R₀ при нагріві</text>
  <text x="60" y="422" font-size="12" fill="#6b7280">• Забезпечує найвищу метрологічну стабільність (до +660 °C)</text>

  <!-- Картка 2: Роль порошку -->
  <rect x="490" y="340" width="430" height="92" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="510" y="364" font-size="13" font-weight="700" fill="#2457d6">ℹ Роль дисперсного порошку (Al₂O₃)</text>
  <text x="510" y="386" font-size="12" fill="#1a1a1a">• Утримує витки спіралі по центру, запобігаючи короткому замиканню</text>
  <text x="510" y="404" font-size="12" fill="#1a1a1a">• Забезпечує високу теплопровідність від корпусу до платини</text>
  <text x="510" y="422" font-size="12" fill="#6b7280">• Демпфує механічні вібрації та удари в експлуатації</text>
</svg>
