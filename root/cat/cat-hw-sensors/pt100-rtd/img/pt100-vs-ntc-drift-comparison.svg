<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння часового дрейфу та стабільності температурних сенсорів</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Платинові RTD (PT100) мають мінімальний часовий дрейф (&lt; 0.05 °C/5 років) на відміну від NTC та IC</text>

  <!-- Plot Area Background -->
  <rect x="110" y="90" width="480" height="290" fill="#f8fafc" rx="4"/>

  <!-- Grid Lines -->
  <line x1="110" y1="100" x2="590" y2="100" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="156" x2="590" y2="156" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="212" x2="590" y2="212" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="268" x2="590" y2="268" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="110" y1="324" x2="590" y2="324" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="110" y1="380" x2="110" y2="84" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="110" y1="380" x2="602" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Y-axis Title and Ticks -->
  <text x="35" y="78" font-size="12" font-weight="bold" fill="#1a1a1a">Похилка дрейфу ΔT (°C)</text>

  <text x="100" y="104" font-size="12" fill="#6b7280" text-anchor="end">+0.5 °C</text>
  <text x="100" y="160" font-size="12" fill="#6b7280" text-anchor="end">+0.4 °C</text>
  <text x="100" y="216" font-size="12" fill="#6b7280" text-anchor="end">+0.3 °C</text>
  <text x="100" y="272" font-size="12" fill="#6b7280" text-anchor="end">+0.2 °C</text>
  <text x="100" y="328" font-size="12" fill="#6b7280" text-anchor="end">+0.1 °C</text>
  <text x="100" y="384" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="end">0.0 °C</text>

  <line x1="105" y1="100" x2="110" y2="100" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="105" y1="156" x2="110" y2="156" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="105" y1="212" x2="110" y2="212" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="105" y1="268" x2="110" y2="268" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="105" y1="324" x2="110" y2="324" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="105" y1="380" x2="110" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- X-axis Ticks and Title -->
  <line x1="110" y1="380" x2="110" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="206" y1="380" x2="206" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="302" y1="380" x2="302" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="398" y1="380" x2="398" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="494" y1="380" x2="494" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="590" y1="380" x2="590" y2="385" stroke="#1a1a1a" stroke-width="1"/>

  <text x="110" y="402" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="206" y="402" font-size="12" fill="#6b7280" text-anchor="middle">1 рік</text>
  <text x="302" y="402" font-size="12" fill="#6b7280" text-anchor="middle">2 роки</text>
  <text x="398" y="402" font-size="12" fill="#6b7280" text-anchor="middle">3 роки</text>
  <text x="494" y="402" font-size="12" fill="#6b7280" text-anchor="middle">4 роки</text>
  <text x="590" y="402" font-size="12" fill="#6b7280" text-anchor="middle">5 років</text>

  <text x="350" y="425" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час безперервної експлуатації (роки)</text>

  <!-- Curve 1: NTC Thermistor (Red) -->
  <path d="M 110 380 C 170 315, 240 245, 302 223.2 C 360 195, 450 145, 590 105.6" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="110" cy="380" r="3.5" fill="#c0392b"/>
  <circle cx="206" cy="290.4" r="3.5" fill="#c0392b"/>
  <circle cx="302" cy="223.2" r="3.5" fill="#c0392b"/>
  <circle cx="398" cy="172.8" r="3.5" fill="#c0392b"/>
  <circle cx="494" cy="133.6" r="3.5" fill="#c0392b"/>
  <circle cx="590" cy="105.6" r="3.5" fill="#c0392b"/>
  <text x="160" y="135" font-size="12" font-weight="bold" fill="#c0392b">NTC (дрейф 0.1–0.5 °C/рік)</text>

  <!-- Curve 2: Semiconductor IC (Blue) -->
  <path d="M 110 380 L 206 357.6 L 302 335.2 L 398 312.8 L 494 290.4 L 590 268.0" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="110" cy="380" r="3" fill="#2457d6"/>
  <circle cx="206" cy="357.6" r="3" fill="#2457d6"/>
  <circle cx="302" cy="335.2" r="3" fill="#2457d6"/>
  <circle cx="398" cy="312.8" r="3" fill="#2457d6"/>
  <circle cx="494" cy="290.4" r="3" fill="#2457d6"/>
  <circle cx="590" cy="268.0" r="3" fill="#2457d6"/>
  <text x="320" y="250" font-size="12" font-weight="bold" fill="#2457d6">IC-датчики (0.05–0.2 °C/рік)</text>

  <!-- Curve 3: Platinum RTD PT100 (Green) -->
  <path d="M 110 380 L 590 366.0" fill="none" stroke="#27ae60" stroke-width="3.5"/>
  <circle cx="110" cy="380" r="3.5" fill="#27ae60"/>
  <circle cx="206" cy="377.2" r="3.5" fill="#27ae60"/>
  <circle cx="302" cy="374.4" r="3.5" fill="#27ae60"/>
  <circle cx="398" cy="371.6" r="3.5" fill="#27ae60"/>
  <circle cx="494" cy="368.8" r="3.5" fill="#27ae60"/>
  <circle cx="590" cy="366.0" r="3.5" fill="#27ae60"/>
  <text x="320" y="355" font-size="12" font-weight="bold" fill="#27ae60">PT100 RTD (&lt; 0.05 °C / 5 років)</text>

  <!-- Bottom Summary Banner -->
  <rect x="35" y="448" width="555" height="46" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="465" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Висновок:</tspan> PT100 не потребує рекалібровки роками завдяки стабільності платини.</text>
  <text x="45" y="482" font-size="12" fill="#6b7280">NTC потребують періодичної калібровки через нелінійне старіння оксидів.</text>

  <!-- Right Cards Panel -->

  <!-- Card 1: PT100 RTD -->
  <rect x="620" y="80" width="310" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="632" y="92" width="110" height="22" rx="4" fill="#27ae60"/>
  <text x="687" y="107" font-size="12" font-weight="bold" fill="white" text-anchor="middle">PT100 (RTD)</text>
  <text x="750" y="107" font-size="13" font-weight="bold" fill="#1e7e34">Платина (IEC 60751)</text>
  <text x="635" y="133" font-size="12" fill="#1a1a1a">• Дрейф: &lt; 0.05 °C / 5 років (&lt; 0.01 °C/р)</text>
  <text x="635" y="153" font-size="12" fill="#1a1a1a">• Механізм: Стабільна кристалічна ґратка Pt</text>
  <text x="635" y="173" font-size="12" fill="#1a1a1a">• Призначення: Прецизійні та пром. системи</text>

  <!-- Card 2: IC Sensors -->
  <rect x="620" y="215" width="310" height="120" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="632" y="227" width="110" height="22" rx="4" fill="#2457d6"/>
  <text x="687" y="242" font-size="12" font-weight="bold" fill="white" text-anchor="middle">IC-датчики</text>
  <text x="750" y="242" font-size="13" font-weight="bold" fill="#1a42a0">DS18B20 / LM35</text>
  <text x="635" y="268" font-size="12" fill="#1a1a1a">• Дрейф: ~0.1–0.2 °C за 5 років</text>
  <text x="635" y="288" font-size="12" fill="#1a1a1a">• Механізм: Деградація p-n переходу Si</text>
  <text x="635" y="308" font-size="12" fill="#1a1a1a">• Призначення: Побутова електроніка, HVAC</text>

  <!-- Card 3: NTC Thermistors -->
  <rect x="620" y="350" width="310" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="632" y="362" width="110" height="22" rx="4" fill="#c0392b"/>
  <text x="687" y="377" font-size="12" font-weight="bold" fill="white" text-anchor="middle">NTC-термістор</text>
  <text x="750" y="377" font-size="13" font-weight="bold" fill="#962d22">Оксидна кераміка</text>
  <text x="635" y="403" font-size="12" fill="#1a1a1a">• Дрейф: 0.1–0.5 °C / рік (високий)</text>
  <text x="635" y="423" font-size="12" fill="#1a1a1a">• Механізм: Старіння оксидів, термоцикли</text>
  <text x="635" y="443" font-size="12" fill="#1a1a1a">• Призначення: Бюджетні датчики, захист</text>
</svg>
