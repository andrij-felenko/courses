<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ратіометричне вимірювання PT100 за допомогою MAX31865</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Спільне джерело струму усуває вплив дрейфу живлення: АЦП вимірює співвідношення опорів</text>

  <!-- Left Panel: Circuit & ADC -->
  <rect x="30" y="80" width="550" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вимірювальне коло та прецизійний АЦП</text>

  <!-- Current Excitation Flow Line -->
  <text x="235" y="178" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Струм збудження I_EXC</text>
  <path d="M 300 190 L 170 190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 170 190 L 170 205" stroke="#2457d6" stroke-width="2"/>

  <!-- R_ref Resistor -->
  <rect x="160" y="205" width="20" height="50" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="148" y="228" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_ref</text>
  <text x="148" y="246" font-size="12" fill="#6b7280" text-anchor="end">400 Ω (0.1%)</text>
  <circle cx="170" cy="198" r="3.5" fill="#2457d6"/>
  <circle cx="170" cy="262" r="3.5" fill="#2457d6"/>

  <!-- V_REF Sense Lines -->
  <path d="M 170 198 L 240 198 L 240 230 L 300 230" stroke="#2457d6" stroke-width="1.5" fill="none"/>
  <path d="M 170 262 L 240 262 L 240 270 L 300 270" stroke="#2457d6" stroke-width="1.5" fill="none"/>
  <text x="270" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_REF</text>

  <!-- Wire between R_ref and RTD -->
  <path d="M 170 255 L 170 325" stroke="#1a1a1a" stroke-width="2"/>

  <!-- R_RTD Resistor (PT100) -->
  <rect x="160" y="325" width="20" height="50" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <path d="M 155 365 L 185 335 M 180 335 L 185 335 L 185 340" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <text x="148" y="348" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">R_RTD (PT100)</text>
  <text x="148" y="366" font-size="12" fill="#6b7280" text-anchor="end">100 Ω при 0°C</text>
  <circle cx="170" cy="318" r="3.5" fill="#27ae60"/>
  <circle cx="170" cy="382" r="3.5" fill="#27ae60"/>

  <!-- V_IN Sense Lines -->
  <path d="M 170 318 L 240 318 L 240 310 L 300 310" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <path d="M 170 382 L 240 382 L 240 360 L 300 360" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <text x="270" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_IN</text>

  <!-- Ground Return Line -->
  <path d="M 170 375 L 170 410 L 300 410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="170" y1="410" x2="170" y2="420" stroke="#6b7280" stroke-width="2"/>
  <line x1="160" y1="420" x2="180" y2="420" stroke="#6b7280" stroke-width="2"/>
  <line x1="164" y1="424" x2="176" y2="424" stroke="#6b7280" stroke-width="2"/>
  <line x1="168" y1="428" x2="172" y2="428" stroke="#6b7280" stroke-width="2"/>
  <text x="170" y="445" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- MAX31865 IC Block -->
  <rect x="300" y="120" width="260" height="315" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="430" y="145" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Прецизійний АЦП MAX31865</text>

  <!-- Pins -->
  <text x="308" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">BIAS</text>
  <text x="308" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">REFIN+</text>
  <text x="308" y="274" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">REFIN-</text>
  <text x="308" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">RTDIN+</text>
  <text x="308" y="364" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">RTDIN-</text>
  <text x="308" y="414" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">FORCE-</text>

  <!-- Current Generator Block -->
  <circle cx="430" cy="190" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="430" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_EXC</text>
  <text x="430" y="222" font-size="12" fill="#6b7280" text-anchor="middle">Джерело струму</text>

  <!-- Internal ADC Block -->
  <rect x="360" y="255" width="185" height="160" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="452.5" y="278" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔΣ АЦП (15-bit)</text>
  <text x="452.5" y="306" font-size="12" fill="#1a1a1a" text-anchor="middle">Код = 32768 × (V_IN / V_REF)</text>
  <text x="452.5" y="336" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">= 32768 × (R_RTD / R_ref)</text>

  <rect x="375" y="354" width="155" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="452.5" y="374" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_EXC скорочено!</text>
  <text x="452.5" y="392" font-size="12" fill="#27ae60" text-anchor="middle">Не залежить від V_DD</text>

  <!-- Right Panel: Explanation Cards -->
  <rect x="600" y="80" width="330" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="615" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Принцип ратіометричності</text>

  <!-- Card 1: Math Derivation -->
  <rect x="615" y="115" width="300" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="630" y="134" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Математична компенсація</text>
  <text x="630" y="154" font-size="12" fill="#27ae60" text-anchor="start">V_IN  = I_EXC × R_RTD</text>
  <text x="630" y="172" font-size="12" fill="#2457d6" text-anchor="start">V_REF = I_EXC × R_ref</text>
  <text x="630" y="196" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">V_IN / V_REF = R_RTD / R_ref</text>

  <!-- Card 2: Benefits -->
  <rect x="615" y="225" width="300" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="630" y="246" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Переваги ratiometric-схеми</text>
  <text x="630" y="268" font-size="12" fill="#1a1a1a" text-anchor="start">✔ Незалежність від дрейфу I_EXC</text>
  <text x="630" y="288" font-size="12" fill="#1a1a1a" text-anchor="start">✔ Стійкість до пульсацій живлення</text>
  <text x="630" y="310" font-size="12" fill="#1a1a1a" text-anchor="start">✔ Висока точність без джерела V_REF</text>

  <!-- Card 3: Critical Requirement -->
  <rect x="615" y="345" width="300" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="630" y="366" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Вимога до референсу R_ref</text>
  <text x="630" y="388" font-size="12" fill="#1a1a1a" text-anchor="start">Точність вимірювання залежить</text>
  <text x="630" y="408" font-size="12" fill="#1a1a1a" text-anchor="start">виключно від стабільності R_ref</text>
</svg>
