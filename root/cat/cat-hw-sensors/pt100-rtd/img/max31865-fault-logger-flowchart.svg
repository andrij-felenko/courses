<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="45" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Алгоритм обробки аварійних станів MAX31865 (Fault Status)</text>
  <text x="480" y="70" fill="#8b949e" font-size="13" text-anchor="middle">Перевірка регістру 0x07, діагностика обриву/КЗ, реєстрація подій у журнал та скидання аварії</text>

  <!-- Блок-схема ліворуч (Послідовність дій) -->
  <g transform="translate(40, 95)">
    <!-- Блок 1: Старт / Зчитування -->
    <rect x="20" y="0" width="280" height="45" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="160" y="22" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">1. Зчитування даних через SPI</text>
    <text x="160" y="38" fill="#c9d1d9" font-size="11" text-anchor="middle">Регістри RTD MSB/LSB (0x01, 0x02)</text>

    <path d="M 160 45 L 160 65" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Блок 2: Перевірка D0 -->
    <polygon points="160,65 270,95 160,125 50,95" fill="#161b22" stroke="#d29922" stroke-width="1.8"/>
    <text x="160" y="92" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">Прапорець Fault?</text>
    <text x="160" y="107" fill="#8b949e" font-size="10" text-anchor="middle">(LSB біт D0 == 1)</text>

    <!-- Гілка НІ (Дані валідні) -->
    <path d="M 270 95 L 340 95 L 340 180" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="300" y="88" fill="#3fb950" font-size="11" font-weight="600">НІ (0)</text>

    <!-- Блок Норма -->
    <rect x="260" y="180" width="160" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/>
    <text x="340" y="202" fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">Дані валідні</text>
    <text x="340" y="219" fill="#c9d1d9" font-size="10" text-anchor="middle">Розрахунок CVD та логування</text>

    <!-- Гілка ТАК (Аварія) -->
    <path d="M 160 125 L 160 150" stroke="#f85149" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="175" y="142" fill="#f85149" font-size="11" font-weight="600">ТАК (1)</text>

    <!-- Блок 3: Зчитування регістру 0x07 -->
    <rect x="20" y="150" width="280" height="50" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.8"/>
    <text x="160" y="172" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">2. Зчитування Fault Status (0x07)</text>
    <text x="160" y="189" fill="#c9d1d9" font-size="10" text-anchor="middle">Отримання 8-бітової бітової маски аварії</text>

    <path d="M 160 200 L 160 225" stroke="#f85149" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Блок 4: Реєстрація в журнал -->
    <rect x="20" y="225" width="280" height="50" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.8"/>
    <text x="160" y="247" fill="#bc8cff" font-size="12" font-weight="600" text-anchor="middle">3. Запис у журнал (Event Log)</text>
    <text x="160" y="264" fill="#c9d1d9" font-size="10" text-anchor="middle">Мітка часу RTC + код аварії у Flash / UART</text>

    <path d="M 160 275 L 160 300" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr-purple)"/>

    <!-- Блок 5: Скидання аварії -->
    <rect x="20" y="300" width="280" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
    <text x="160" y="322" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">4. Скидання прапорців (Clear Faults)</text>
    <text x="160" y="339" fill="#8b949e" font-size="10" text-anchor="middle">Запис біта D1=1 у конфігураційний регістр 0x80</text>

    <path d="M 160 350 L 160 380 L 340 380 L 340 235" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Деталізація бітів регістру Fault Status (Праворуч) -->
  <g transform="translate(480, 95)">
    <rect width="440" height="405" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="28" rx="8" fill="#21262d"/>
    <text x="20" y="19" fill="#f85149" font-size="12" font-weight="700">БІТОВІ МАСКИ РЕГІСТРУ АВАРІЙ MAX31865 (0x07)</text>

    <!-- Таблиця бітів -->
    <!-- D7 -->
    <g transform="translate(15, 40)">
      <rect width="410" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#f85149" fill-opacity="0.2"/>
      <text x="20" y="28" fill="#f85149" font-size="12" font-weight="700" text-anchor="middle">D7</text>
      <text x="50" y="20" fill="#f0f6fc" font-size="11" font-weight="600">RTD High Threshold (Поріг верхньої межі)</text>
      <text x="50" y="38" fill="#8b949e" font-size="10">Обрив чутливого елемента або обрив кабелю (R &gt; R_HIGH)</text>
    </g>

    <!-- D6 -->
    <g transform="translate(15, 96)">
      <rect width="410" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#f85149" fill-opacity="0.2"/>
      <text x="20" y="28" fill="#f85149" font-size="12" font-weight="700" text-anchor="middle">D6</text>
      <text x="50" y="20" fill="#f0f6fc" font-size="11" font-weight="600">RTD Low Threshold (Поріг нижньої межі)</text>
      <text x="50" y="38" fill="#8b949e" font-size="10">Коротке замикання сенсора або жил кабелю (R &lt; R_LOW)</text>
    </g>

    <!-- D5 -->
    <g transform="translate(15, 152)">
      <rect width="410" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#d29922" fill-opacity="0.2"/>
      <text x="20" y="28" fill="#d29922" font-size="12" font-weight="700" text-anchor="middle">D5</text>
      <text x="50" y="20" fill="#f0f6fc" font-size="11" font-weight="600">REFIN- &gt; 0.85 × VBIAS</text>
      <text x="50" y="38" fill="#8b949e" font-size="10">Обрив опорного резистора RREF або замикання на VBIAS</text>
    </g>

    <!-- D4 -->
    <g transform="translate(15, 208)">
      <rect width="410" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#d29922" fill-opacity="0.2"/>
      <text x="20" y="28" fill="#d29922" font-size="12" font-weight="700" text-anchor="middle">D4</text>
      <text x="50" y="20" fill="#f0f6fc" font-size="11" font-weight="600">REFIN- &lt; 0.85 × VBIAS (FORCE- Open)</text>
      <text x="50" y="38" fill="#8b949e" font-size="10">Обрив лінії струмового збудження FORCE-</text>
    </g>

    <!-- D3 -->
    <g transform="translate(15, 264)">
      <rect width="410" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#bc8cff" fill-opacity="0.2"/>
      <text x="20" y="28" fill="#bc8cff" font-size="12" font-weight="700" text-anchor="middle">D3</text>
      <text x="50" y="20" fill="#f0f6fc" font-size="11" font-weight="600">RTDIN- &lt; 0.85 × VBIAS (FORCE- Open)</text>
      <text x="50" y="38" fill="#8b949e" font-size="10">Обрив зворотного проводу струмового кола RTD</text>
    </g>

    <!-- D2 -->
    <g transform="translate(15, 320)">
      <rect width="410" height="48" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="40" height="48" rx="4" fill="#58a6ff" fill-opacity="0.2"/>
      <text x="20" y="28" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">D2</text>
      <text x="50" y="20" fill="#f0f6fc" font-size="11" font-weight="600">Overvoltage / Undervoltage (OV/UV)</text>
      <text x="50" y="38" fill="#8b949e" font-size="10">Перенапруга на входах RTD або пробій напруги живлення</text>
    </g>
  </g>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#3fb950"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f85149"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#bc8cff"/>
    </marker>
  </defs>
</svg>
