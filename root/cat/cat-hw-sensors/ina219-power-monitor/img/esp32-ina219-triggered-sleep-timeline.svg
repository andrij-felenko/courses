<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Часова діаграма синхронізації ESP32 та INA219 у тригерному режимі</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">ESP32 пробуджується для надсилання тригера I2C, а INA219 виконує АЦП під час сну контролера</text>

  <!-- Панель 1: ESP32 -->
  <rect x="40" y="80" width="880" height="105" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="102" font-size="14" font-weight="700" fill="#1a1a1a">1. ESP32 (Мікроконтролер)</text>
  
  <text x="150" y="132" text-anchor="middle" font-size="12" fill="#6b7280">Глибокий сон (Deep Sleep ~10 мкА)</text>
  <rect x="60" y="145" width="180" height="16" fill="#d0d7de" rx="3"/>

  <rect x="240" y="118" width="180" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="330" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Пробудження &amp; I2C Trigger</text>
  <text x="330" y="151" text-anchor="middle" font-size="12" fill="#2457d6">~15 мА (активний стан 1–2 мс)</text>

  <text x="660" y="132" text-anchor="middle" font-size="12" fill="#6b7280">Повернення в глибокий сон (Deep Sleep ~10 мкА)</text>
  <rect x="420" y="145" width="480" height="16" fill="#d0d7de" rx="3"/>

  <!-- Панель 2: Шина I2C -->
  <rect x="40" y="195" width="880" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="217" font-size="14" font-weight="700" fill="#1a1a1a">2. Шина I2C (SDA / SCL)</text>

  <text x="170" y="238" text-anchor="middle" font-size="12" fill="#6b7280">Стан спокою (Idle: High)</text>
  <line x1="60" y1="245" x2="280" y2="245" stroke="#6b7280" stroke-width="2"/>

  <rect x="280" y="233" width="80" height="24" fill="#2457d6" rx="4"/>
  <text x="320" y="249" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">I2C CMD</text>
  <text x="320" y="271" text-anchor="middle" font-size="12" fill="#2457d6">Запис Config Reg (Triggered)</text>

  <text x="630" y="238" text-anchor="middle" font-size="12" fill="#6b7280">Шина вільна (High)</text>
  <line x1="360" y1="245" x2="900" y2="245" stroke="#6b7280" stroke-width="2"/>

  <!-- Панель 3: INA219 -->
  <rect x="40" y="295" width="880" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="317" font-size="14" font-weight="700" fill="#1a1a1a">3. INA219 (Давач струму й напруги)</text>

  <text x="210" y="347" text-anchor="middle" font-size="12" fill="#6b7280">Power-Down (~0.6 мкА)</text>
  <rect x="60" y="356" width="300" height="16" fill="#d0d7de" rx="3"/>

  <text x="540" y="328" text-anchor="middle" font-size="12" fill="#27ae60">Виконується автономно під час сну ESP32</text>
  <rect x="360" y="333" width="360" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="540" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">12-бітне АЦП перетворення (Shunt &amp; Bus)</text>
  <text x="540" y="366" text-anchor="middle" font-size="12" fill="#27ae60">Тривалість t_conv (~1..68 мс, ~1 мА)</text>

  <text x="810" y="347" text-anchor="middle" font-size="12" fill="#6b7280">Power-Down (~0.6 мкА)</text>
  <rect x="720" y="356" width="180" height="16" fill="#d0d7de" rx="3"/>
  <text x="810" y="390" text-anchor="middle" font-size="12" fill="#6b7280">Дані у регістрах</text>

  <!-- Пунктирні лінії синхронізації -->
  <line x1="240" y1="165" x2="240" y2="435" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="360" y1="260" x2="360" y2="435" stroke="#27ae60" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="420" y1="165" x2="420" y2="435" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="720" y1="380" x2="720" y2="435" stroke="#27ae60" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Вісь часу -->
  <line x1="50" y1="440" x2="890" y2="440" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="900" y="444" font-size="12" font-weight="700" fill="#1a1a1a">Час (t)</text>

  <circle cx="240" cy="440" r="4" fill="#2457d6"/>
  <text x="240" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">t₁: Пробудження ESP32</text>
  <text x="240" y="476" text-anchor="middle" font-size="12" fill="#6b7280">з Deep Sleep за таймером</text>

  <circle cx="360" cy="440" r="4" fill="#27ae60"/>
  <text x="360" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">t₂: Тригер АЦП</text>
  <text x="360" y="512" text-anchor="middle" font-size="12" fill="#6b7280">команда I2C від ESP32</text>

  <circle cx="420" cy="440" r="4" fill="#6b7280"/>
  <text x="420" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">t₃: ESP32 засинає</text>
  <text x="420" y="476" text-anchor="middle" font-size="12" fill="#6b7280">перехід у Deep Sleep</text>

  <circle cx="720" cy="440" r="4" fill="#27ae60"/>
  <text x="720" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">t₄: Завершення АЦП</text>
  <text x="720" y="476" text-anchor="middle" font-size="12" fill="#6b7280">перехід у Power-Down</text>
</svg>
