<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектура телеметрії та вимірювального тракту INA219 — STM32</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Падіння напруги V_shunt обробляється INA219, зчитується по I2C і передається в UART</text>

  <!-- Panel 1: Power Circuit -->
  <rect x="25" y="70" width="230" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="35" y="80" width="210" height="28" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="140" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">СИЛОВЕ КОЛО І НАВАНТАЖЕННЯ</text>

  <rect x="45" y="120" width="190" height="55" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="140" y="142" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Джерело живлення V_IN</text>
  <text x="140" y="160" font-size="12" fill="#6b7280" text-anchor="middle">+5 В ... +26 В DC</text>

  <rect x="45" y="215" width="190" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="140" y="238" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Шунт R_shunt (0.1 Ом)</text>
  <text x="140" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">V_shunt = I_load × R_shunt</text>

  <rect x="45" y="320" width="190" height="55" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="140" y="342" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Навантаження (Load)</text>
  <text x="140" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Споживач струму I_load</text>

  <rect x="45" y="440" width="190" height="40" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="140" y="464" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">Спільне заземлення (GND)</text>

  <line x1="140" y1="175" x2="140" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="152" y="198" font-size="12" font-weight="700" fill="#2457d6">I_load</text>
  <line x1="140" y1="280" x2="140" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="140" y1="375" x2="140" y2="440" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sense wires from Panel 1 to Panel 2 -->
  <polyline points="140,200 265,200 265,142 303,142" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="210" y="192" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">VIN+</text>

  <polyline points="140,295 275,295 275,177 303,177" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="210" y="287" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">VIN-</text>

  <polyline points="265,142 265,212 303,212" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="270" y="226" font-size="12" font-weight="700" fill="#2457d6">VBUS</text>

  <polyline points="235,460 285,460" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260" y="452" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Panel 2: INA219 -->
  <rect x="285" y="70" width="365" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="295" y="80" width="345" height="28" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="467" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">INA219 I2C POWER MONITOR</text>

  <!-- Analog front-end -->
  <rect x="295" y="118" width="345" height="122" fill="white" stroke="#d0d7de" rx="6"/>
  <rect x="303" y="130" width="54" height="24" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="330" y="146" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">VIN+</text>
  <rect x="303" y="165" width="54" height="24" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="330" y="181" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">VIN-</text>
  <rect x="303" y="200" width="54" height="24" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="330" y="216" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">VBUS</text>

  <rect x="370" y="128" width="260" height="102" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="500" y="146" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">PGA &amp; 12-bit Delta-Sigma ADC</text>
  <text x="500" y="166" font-size="12" fill="#6b7280" text-anchor="middle">PGA Gain: /1, /2, /4, /8 (±40mV ... ±320mV)</text>
  <text x="500" y="186" font-size="12" fill="#6b7280" text-anchor="middle">V_bus range: 0 ... 32 V (дискрет 4 мВ)</text>
  <text x="500" y="214" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Усереднення: 9..128 вибірок (8.51 ms)</text>

  <line x1="357" y1="142" x2="370" y2="142" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="357" y1="177" x2="370" y2="177" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="357" y1="212" x2="370" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Digital registers -->
  <rect x="295" y="250" width="345" height="255" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="467" y="268" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">РЕГІСТРИ ТА ВНУТРІШНЯ МАТЕМАТИКА</text>

  <rect x="305" y="278" width="325" height="30" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="467" y="297" font-size="12" fill="#1a1a1a" text-anchor="middle">Configuration (00h): Reset, Bus Voltage Range, PGA, ADC</text>

  <rect x="305" y="316" width="325" height="42" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="467" y="333" font-size="12" fill="#1a1a1a" text-anchor="middle">Shunt Voltage (01h) [16-bit, LSB = 10 µV]</text>
  <text x="467" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Bus Voltage (02h) [16-bit, LSB = 4 mV | CNVR | OVF]</text>

  <rect x="305" y="366" width="325" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="467" y="383" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Calibration (05h) = trunc( 0.04096 / (I_LSB × R_shunt) )</text>
  <text x="467" y="400" font-size="12" fill="#6b7280" text-anchor="middle">Записується з МК при ініціалізації</text>

  <rect x="305" y="416" width="325" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="467" y="433" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Current Reg (04h) = (ShuntVoltage × Calibration) / 4096</text>
  <text x="467" y="452" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Power Reg (03h) = (Current × BusVoltage) / 5000</text>

  <rect x="305" y="468" width="325" height="28" fill="#fdecea" stroke="#c0392b" rx="3"/>
  <text x="467" y="486" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Прапорці у Reg 02h: CNVR (Готовність) | Math OVF (Переповнення)</text>

  <line x1="500" y1="230" x2="500" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Panel 3: STM32 -->
  <rect x="680" y="70" width="255" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="690" y="80" width="235" height="28" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="807" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">STM32 (BARE-METAL DRIVER)</text>

  <rect x="695" y="120" width="225" height="75" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="807" y="140" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">I2C Master Периферія</text>
  <text x="807" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">Регістри: CR1, CR2, OAR1, DR, SR1, SR2</text>
  <text x="807" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Стандартний режим 100 кГц / 400 кГц</text>

  <rect x="695" y="210" width="225" height="175" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="807" y="228" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Обробка телеметрії в C/C++</text>

  <rect x="703" y="238" width="209" height="28" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="807" y="256" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Запис Cal (05h) + Config (00h)</text>

  <rect x="703" y="272" width="209" height="28" fill="#fdecea" stroke="#c0392b" rx="3"/>
  <text x="807" y="290" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2. Опитування CNVR та Math OVF</text>

  <rect x="703" y="306" width="209" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="807" y="323" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">3. I = Current_Reg × I_LSB</text>
  <text x="807" y="340" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">   P = Power_Reg × P_LSB</text>

  <rect x="703" y="354" width="209" height="24" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="807" y="370" font-size="12" fill="#6b7280" text-anchor="middle">Формування кадру телеметрії</text>

  <rect x="695" y="400" width="225" height="100" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="807" y="420" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">USART1_TX (Потік телеметрії)</text>
  <text x="807" y="442" font-size="12" fill="#1a1a1a" text-anchor="middle">Вивід у термінал / ПК:</text>
  <text x="807" y="464" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">"V: 12.04V | I: 1.25A | P: 15.0W"</text>
  <text x="807" y="486" font-size="12" fill="#6b7280" text-anchor="middle">Періодичне опитування (напр. 10 Гц)</text>

  <line x1="807" y1="195" x2="807" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="807" y1="385" x2="807" y2="400" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- I2C Bus lines between Panel B and Panel C -->
  <line x1="695" y1="145" x2="650" y2="145" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="672" y="137" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">SCL</text>

  <line x1="695" y1="170" x2="650" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="672" y="162" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SDA</text>
</svg>
