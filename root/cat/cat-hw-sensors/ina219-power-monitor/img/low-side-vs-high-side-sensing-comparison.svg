<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Low-Side vs High-Side: вимірювання струму в колі живлення</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">High-Side (INA219) зберігає цілісність землі та виявляє короткі замикання на корпус</text>

  <!-- ==================== PANEL 1: LOW-SIDE ==================== -->
  <rect x="30" y="70" width="435" height="425" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Header Box 1 -->
  <rect x="45" y="85" width="405" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="107" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b">Low-Side (Низькобічне вимірювання)</text>

  <!-- Power Source V_IN -->
  <rect x="100" y="135" width="110" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="155" y="155" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">+V_IN (Живлення)</text>

  <!-- Main current wire from V_IN to Load -->
  <line x1="155" y1="165" x2="155" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="165" y="187" font-size="12" fill="#2457d6">I_LOAD</text>

  <!-- Load -->
  <rect x="100" y="200" width="110" height="60" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="155" y="235" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Навантаження</text>

  <!-- Wire from Load to Shunt -->
  <line x1="155" y1="260" x2="155" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="155" cy="280" r="4" fill="#1a1a1a"/>

  <!-- Load GND Shift Label -->
  <text x="165" y="274" font-size="11" font-weight="700" fill="#c0392b">V_GND = I × R_SHUNT</text>

  <!-- Sense Line 1 (Low-side IN+) -->
  <line x1="155" y1="280" x2="300" y2="280" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Shunt Resistor R_SHUNT -->
  <rect x="127" y="305" width="56" height="40" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="155" y="329" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">R_SHUNT</text>

  <!-- Wire from Shunt to System GND -->
  <line x1="155" y1="345" x2="155" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="155" cy="360" r="4" fill="#1a1a1a"/>

  <!-- Sense Line 2 (Low-side IN-) -->
  <line x1="155" y1="360" x2="300" y2="360" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="375" font-size="11" fill="#6b7280">GND (земля вимірювача)</text>

  <!-- System GND Symbol -->
  <line x1="135" y1="385" x2="175" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="142" y1="390" x2="168" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="149" y1="395" x2="161" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="155" y="410" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Спільна земля (GND)</text>

  <!-- Measuring Subsystem / Amp -->
  <rect x="300" y="260" width="125" height="115" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="362" y="282" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Підсилювач / АЦП</text>
  <text x="362" y="300" font-size="11" text-anchor="middle" fill="#6b7280">(Low-Side)</text>
  <text x="308" y="277" font-size="10" font-weight="700" fill="#2457d6">IN+</text>
  <text x="308" y="357" font-size="10" font-weight="700" fill="#2457d6">IN-</text>

  <!-- Fault Path (Short-to-Ground) -->
  <path d="M 100 230 L 58 230 L 58 385 L 135 385" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <text x="62" y="280" font-size="11" font-weight="700" fill="#c0392b">КЗ на корпус</text>
  <text x="62" y="294" font-size="10" fill="#c0392b">(в обхід шунта)</text>

  <!-- Info Box 1 -->
  <rect x="45" y="425" width="405" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="445" font-size="12" fill="#c0392b">❌ Зсув землі: потенціал землі навантаження вищий за GND</text>
  <text x="55" y="467" font-size="12" fill="#c0392b">❌ Струм КЗ на корпус іде в обхід шунта і НЕ виявляється</text>

  <!-- ==================== PANEL 2: HIGH-SIDE ==================== -->
  <rect x="495" y="70" width="435" height="425" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Header Box 2 -->
  <rect x="510" y="85" width="405" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="107" font-size="14" font-weight="700" text-anchor="middle" fill="#27ae60">High-Side (Високобічне вимірювання — INA219)</text>

  <!-- Power Source V_IN -->
  <rect x="565" y="135" width="110" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="620" y="155" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">+V_IN (Живлення)</text>

  <!-- Wire from Power Source to Shunt -->
  <line x1="620" y1="165" x2="620" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="620" cy="180" r="4" fill="#1a1a1a"/>

  <!-- Sense Line 1 (IN+) -->
  <line x1="620" y1="180" x2="755" y2="180" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Shunt Resistor R_SHUNT -->
  <rect x="592" y="195" width="56" height="40" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="620" y="219" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">R_SHUNT</text>

  <!-- Wire from Shunt to Load -->
  <line x1="620" y1="235" x2="620" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="620" cy="255" r="4" fill="#1a1a1a"/>

  <!-- Sense Line 2 (IN-) -->
  <line x1="620" y1="255" x2="755" y2="255" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Load -->
  <rect x="565" y="275" width="110" height="60" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="620" y="310" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Навантаження</text>

  <!-- Direct Wire from Load to GND -->
  <line x1="620" y1="335" x2="620" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="620" cy="355" r="4" fill="#27ae60"/>

  <!-- Load GND Label (No Shift) -->
  <text x="632" y="359" font-size="11" font-weight="700" fill="#27ae60">V_GND = 0 В (без зсуву!)</text>

  <!-- System GND Symbol -->
  <line x1="600" y1="385" x2="640" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="607" y1="390" x2="633" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="614" y1="395" x2="626" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="620" y="410" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Спільна земля (GND)</text>

  <!-- INA219 Chip -->
  <rect x="755" y="160" width="145" height="130" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="827" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">INA219</text>
  <text x="827" y="198" font-size="11" text-anchor="middle" fill="#6b7280">Монітор живлення</text>

  <text x="763" y="184" font-size="10" font-weight="700" fill="#2457d6">IN+</text>
  <text x="763" y="259" font-size="10" font-weight="700" fill="#2457d6">IN-</text>

  <text x="827" y="222" font-size="11" text-anchor="middle" fill="#1a1a1a">PGA (±40...±320мВ)</text>
  <text x="827" y="238" font-size="11" text-anchor="middle" fill="#1a1a1a">12-bit ADC / I2C</text>
  <text x="827" y="258" font-size="11" font-weight="700" text-anchor="middle" fill="#2457d6">I, V_BUS, P</text>
  <text x="827" y="274" font-size="10" text-anchor="middle" fill="#6b7280">Регістри обчислень</text>

  <!-- Fault Path (Short-to-Ground) -->
  <path d="M 565 300 L 530 300 L 530 385 L 600 385" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>
  <text x="535" y="346" font-size="11" font-weight="700" fill="#27ae60">КЗ на корпус</text>
  <text x="535" y="360" font-size="10" fill="#27ae60">(іде через шунт)</text>

  <!-- Info Box 2 -->
  <rect x="510" y="425" width="405" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="445" font-size="12" fill="#27ae60">✓ Спільна земля: потенціал землі навантаження стабільний (0 В)</text>
  <text x="520" y="467" font-size="12" fill="#27ae60">✓ Струм КЗ проходить через R_SHUNT і успішно фіксується</text>
</svg>
