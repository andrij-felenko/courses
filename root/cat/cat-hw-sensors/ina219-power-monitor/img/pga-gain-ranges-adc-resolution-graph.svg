<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">INA219: Діапазони PGA, роздільна здатність АЦП та втрати на шунті</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Компроміс між максимальним струмом, кроком 12-бітного АЦП та тепловиділенням (при R = 0.1 Ом)</text>

  <!-- Картка 1: PGA /1 (±40 мВ) -->
  <rect x="30" y="70" width="213" height="255" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="40" y="80" width="193" height="32" rx="4" fill="#27ae60"/>
  <text x="136" y="101" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">PGA /1 (±40 мВ)</text>
  <text x="136" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#1e7e34">Максимальна точність</text>

  <!-- Шкала вибірки / діапазону -->
  <rect x="45" y="142" width="183" height="12" rx="3" fill="#ffffff" stroke="#c3e6cb"/>
  <rect x="45" y="142" width="23" height="12" rx="3" fill="#27ae60"/>

  <text x="45" y="175" font-size="12" fill="#1a1a1a">V_shunt max: <tspan font-weight="700">40 мВ</tspan></text>
  <text x="45" y="197" font-size="12" fill="#1a1a1a">Крок АЦП: <tspan font-weight="700">9.77 мкВ</tspan></text>
  <text x="45" y="219" font-size="12" fill="#1a1a1a">Макс. струм: <tspan font-weight="700">0.4 А</tspan></text>
  <text x="45" y="241" font-size="12" fill="#1a1a1a">Крок струму: <tspan font-weight="700">97.7 мкА</tspan></text>
  <text x="45" y="263" font-size="12" fill="#1a1a1a">Втрати P_loss: <tspan font-weight="700" fill="#27ae60">16 мВт</tspan></text>

  <rect x="40" y="278" width="193" height="36" rx="4" fill="#ffffff" stroke="#c3e6cb"/>
  <text x="136" y="295" font-size="12" text-anchor="middle" fill="#155724">Мінімальний нагрів</text>
  <text x="136" y="309" font-size="12" text-anchor="middle" fill="#155724">та шуми вимірювань</text>

  <!-- Картка 2: PGA /2 (±80 мВ) -->
  <rect x="259" y="70" width="213" height="255" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="269" y="80" width="193" height="32" rx="4" fill="#2457d6"/>
  <text x="365" y="101" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">PGA /2 (±80 мВ)</text>
  <text x="365" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4ed8">Точне вимірювання</text>

  <rect x="274" y="142" width="183" height="12" rx="3" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="274" y="142" width="46" height="12" rx="3" fill="#2457d6"/>

  <text x="274" y="175" font-size="12" fill="#1a1a1a">V_shunt max: <tspan font-weight="700">80 мВ</tspan></text>
  <text x="274" y="197" font-size="12" fill="#1a1a1a">Крок АЦП: <tspan font-weight="700">19.53 мкВ</tspan></text>
  <text x="274" y="219" font-size="12" fill="#1a1a1a">Макс. струм: <tspan font-weight="700">0.8 А</tspan></text>
  <text x="274" y="241" font-size="12" fill="#1a1a1a">Крок струму: <tspan font-weight="700">195 мкА</tspan></text>
  <text x="274" y="263" font-size="12" fill="#1a1a1a">Втрати P_loss: <tspan font-weight="700" fill="#1d4ed8">64 мВт</tspan></text>

  <rect x="269" y="278" width="193" height="36" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="365" y="295" font-size="12" text-anchor="middle" fill="#1e40af">Низьке падіння напруги,</text>
  <text x="365" y="309" font-size="12" text-anchor="middle" fill="#1e40af">добрий баланс</text>

  <!-- Картка 3: PGA /4 (±160 мВ) -->
  <rect x="488" y="70" width="213" height="255" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="498" y="80" width="193" height="32" rx="4" fill="#4b5563"/>
  <text x="594" y="101" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">PGA /4 (±160 мВ)</text>
  <text x="594" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#374151">Розширений діапазон</text>

  <rect x="503" y="142" width="183" height="12" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="503" y="142" width="92" height="12" rx="3" fill="#4b5563"/>

  <text x="503" y="175" font-size="12" fill="#1a1a1a">V_shunt max: <tspan font-weight="700">160 мВ</tspan></text>
  <text x="503" y="197" font-size="12" fill="#1a1a1a">Крок АЦП: <tspan font-weight="700">39.06 мкВ</tspan></text>
  <text x="503" y="219" font-size="12" fill="#1a1a1a">Макс. струм: <tspan font-weight="700">1.6 А</tspan></text>
  <text x="503" y="241" font-size="12" fill="#1a1a1a">Крок струму: <tspan font-weight="700">391 мкА</tspan></text>
  <text x="503" y="263" font-size="12" fill="#1a1a1a">Втрати P_loss: <tspan font-weight="700" fill="#374151">256 мВт</tspan></text>

  <rect x="498" y="278" width="193" height="36" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <text x="594" y="295" font-size="12" text-anchor="middle" fill="#374151">Для середніх навантажень,</text>
  <text x="594" y="309" font-size="12" text-anchor="middle" fill="#374151">помірне тепловиділення</text>

  <!-- Картка 4: PGA /8 (±320 мВ) -->
  <rect x="717" y="70" width="213" height="255" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="727" y="80" width="193" height="32" rx="4" fill="#c0392b"/>
  <text x="823" y="101" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">PGA /8 (±320 мВ)</text>
  <text x="823" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">За замовчуванням (Max)</text>

  <rect x="732" y="142" width="183" height="12" rx="3" fill="#ffffff" stroke="#fca5a5"/>
  <rect x="732" y="142" width="183" height="12" rx="3" fill="#c0392b"/>

  <text x="732" y="175" font-size="12" fill="#1a1a1a">V_shunt max: <tspan font-weight="700">320 мВ</tspan></text>
  <text x="732" y="197" font-size="12" fill="#1a1a1a">Крок АЦП: <tspan font-weight="700">78.13 мкВ</tspan></text>
  <text x="732" y="219" font-size="12" fill="#1a1a1a">Макс. струм: <tspan font-weight="700">3.2 А</tspan></text>
  <text x="732" y="241" font-size="12" fill="#1a1a1a">Крок струму: <tspan font-weight="700">781 мкА</tspan></text>
  <text x="732" y="263" font-size="12" fill="#1a1a1a">Втрати P_loss: <tspan font-weight="700" fill="#991b1b">1.024 Вт</tspan></text>

  <rect x="727" y="278" width="193" height="36" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="823" y="295" font-size="12" text-anchor="middle" fill="#991b1b">Високий нагрів шунта,</text>
  <text x="823" y="309" font-size="12" text-anchor="middle" fill="#991b1b">найнижча точність (LSB)</text>

  <!-- Нижня панель: Порівняльний інженерний висновок -->
  <rect x="30" y="345" width="435" height="170" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="42" y="357" width="411" height="28" rx="4" fill="#27ae60"/>
  <text x="247" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Режим високої точності (High Precision Mode)</text>

  <text x="50" y="402" font-size="12" fill="#1a1a1a">• Вузький PGA (±40...±80 мВ) та більший опір шунта R_shunt</text>
  <text x="50" y="424" font-size="12" fill="#1a1a1a">• Мінімальний крок струму (I_LSB ≈ 10...20 мкВ / R_shunt)</text>
  <text x="50" y="446" font-size="12" fill="#1a1a1a">• Низький рівень шумів та висока деталізація малих струмів</text>
  <text x="50" y="468" font-size="12" fill="#1a1a1a">• Мінімальний тепловий дрейф завдяки низькому P_loss</text>

  <rect x="42" y="482" width="411" height="24" rx="4" fill="#ffffff" stroke="#c3e6cb"/>
  <text x="247" y="498" font-size="12" font-weight="700" text-anchor="middle" fill="#155724">Застосування: прецизійні сенсори, батарейне живлення, IoT</text>

  <rect x="495" y="345" width="435" height="170" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="507" y="357" width="411" height="28" rx="4" fill="#c0392b"/>
  <text x="712" y="376" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Режим широкого діапазону (High Power Mode)</text>

  <text x="515" y="402" font-size="12" fill="#1a1a1a">• Широкий PGA (±160...±320 мВ) для вимірювання великих струмів</text>
  <text x="515" y="424" font-size="12" fill="#1a1a1a">• Збільшений крок вимірювання АЦП (V_LSB до 78.13 мкВ)</text>
  <text x="515" y="446" font-size="12" fill="#1a1a1a">• Значний нагрів шунта (P_loss = I² · R_shunt) при макс. струмі</text>
  <text x="515" y="468" font-size="12" fill="#1a1a1a">• Вимагає потужнішого шунта (1...3 Вт) та відводу тепла</text>

  <rect x="507" y="482" width="411" height="24" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="712" y="498" font-size="12" font-weight="700" text-anchor="middle" fill="#991b1b">Застосування: мотори, силові джерела живлення, контролери</text>
</svg>
