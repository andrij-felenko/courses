<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Ефект міжканального перенесення заряду (Charge Ghosting)</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Як перемикання мультиплексора з низькоомного каналу 3.3 В спотворює високоомний канал 1.0 В</text>

  <!-- Multiplexer Switch Simulation -->
  <rect x="40" y="85" width="770" height="240" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Channel 1 (Low impedance 3.3V) -->
  <rect x="65" y="115" width="180" height="85" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="155" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">Канал 1 (CH1)</text>
  <text x="155" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">Напруга: +3.3 В</text>
  <text x="155" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">R_src = 100 Ом (ОП буфер)</text>

  <!-- Channel 2 (High impedance 1.0V) -->
  <rect x="65" y="220" width="180" height="85" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="155" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f85149" text-anchor="middle">Канал 2 (CH2)</text>
  <text x="155" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">Напруга: +1.0 В</text>
  <text x="155" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">R_src = 100 кОм (Термістор)</text>

  <!-- MUX Block -->
  <polygon points="290,105 340,140 340,280 290,315" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="315" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle" transform="rotate(-90 315 215)">MUX АЦП</text>

  <line x1="245" y1="155" x2="290" y2="155" stroke="#3fb950" stroke-width="2"/>
  <line x1="245" y1="265" x2="290" y2="265" stroke="#f85149" stroke-width="2"/>

  <!-- MUX Output line to C_sample -->
  <line x1="340" y1="210" x2="440" y2="210" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- Sampling Capacitor with Ghost Charge -->
  <rect x="440" y="160" width="130" height="100" rx="6" fill="#1f242c" stroke="#f85149" stroke-width="2"/>
  <text x="505" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f85149" text-anchor="middle">C_sample</text>
  <text x="505" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Залишок +3.3 В!</text>
  <text x="505" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f85149" text-anchor="middle">Заряд від CH1</text>

  <!-- Arrow to ADC result -->
  <line x1="570" y1="210" x2="630" y2="210" stroke="#f85149" stroke-width="2.5" marker-end="url(#arr-gh)"/>

  <!-- Fake measurement result box -->
  <rect x="635" y="155" width="155" height="110" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="712" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">Спотворений відлік CH2:</text>
  <text x="712" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">+1.85 В</text>
  <text x="712" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Замість реального 1.0 В!</text>
  <text x="712" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Похибка: +85%</text>

  <!-- Explanation below -->
  <rect x="40" y="340" width="770" height="115" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="60" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d29922">Механізм виникнення "примарного заряду" (Ghosting):</text>
  <text x="60" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">1. Під час опитування CH1 ємність C_sample зарядилася до 3.3 В.</text>
  <text x="60" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">2. МУКС миттєво підключає CH2. Через високий опір джерела (100 кОм) C_sample не встигає розрядитися з 3.3 В до 1.0 В за стандартний час вибірки t_sample (наприклад, 1.5 такти).</text>
  <text x="60" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Рішення: встановлення буфера ОП, накопичувального конденсатора C_ext або збільшення SamplingTime в регістрі SMPR.</text>

  <defs>
    <marker id="arr-gh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
</svg>