<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Крива встановлення заряду (Settling Time) та поріг 0.5 LSB</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Скільки постійних часу τ необхідно для повної зарядки конденсатора вибірки C_sample?</text>

  <!-- Plot Frame -->
  <rect x="50" y="80" width="750" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Asymptote 100% V_IN -->
  <line x1="80" y1="120" x2="780" y2="120" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="70" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="end">100% V_IN</text>

  <!-- 0.5 LSB Error band for 12-bit (99.988%) -->
  <line x1="80" y1="125" x2="780" y2="125" stroke="#f85149" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="740" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f85149">Поріг 0.5 LSB (12-біт)</text>

  <!-- Time Axis -->
  <line x1="80" y1="300" x2="780" y2="300" stroke="#8b949e" stroke-width="1.5"/>
  <text x="770" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Час t</text>

  <!-- Charging Exponential Curve -->
  <path d="M 80 300 Q 180 290 280 180 T 480 130 T 650 121 T 780 120" fill="none" stroke="#58a6ff" stroke-width="3"/>

  <!-- Markers for taus -->
  <!-- 1 tau: 63.2% -->
  <line x1="160" y1="300" x2="160" y2="235" stroke="#8b949e" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="160" cy="235" r="4" fill="#58a6ff"/>
  <text x="160" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">1τ (63.2%)</text>

  <!-- 3 tau: 95.0% -->
  <line x1="280" y1="300" x2="280" y2="175" stroke="#8b949e" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="280" cy="175" r="4" fill="#58a6ff"/>
  <text x="280" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">3τ (95.0%)</text>

  <!-- 9 tau: 99.988% (12-bit) -->
  <line x1="520" y1="300" x2="520" y2="125" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="520" cy="125" r="5" fill="#3fb950"/>
  <text x="520" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">9.01τ (12 біт)</text>
  <text x="520" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">Помилка &lt; 0.5 LSB</text>

  <!-- 12 tau: 99.999% (16-bit) -->
  <line x1="680" y1="300" x2="680" y2="121" stroke="#bc8cff" stroke-width="1.5"/>
  <circle cx="680" cy="121" r="5" fill="#bc8cff"/>
  <text x="680" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">11.78τ (16 біт)</text>

  <!-- Three Table Cards below -->
  <rect x="50" y="355" width="235" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="167" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">10-бітний АЦП (AVR/SAM)</text>
  <text x="65" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Кількість рівнів: 1024</text>
  <text x="65" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Поріг 0.5 LSB: 1 / 2048</text>
  <text x="65" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">t_sample ≥ 7.62 · τ</text>

  <rect x="307" y="355" width="235" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="424" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">12-бітний АЦП (STM32/ESP32)</text>
  <text x="322" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Кількість рівнів: 4096</text>
  <text x="322" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Поріг 0.5 LSB: 1 / 8192</text>
  <text x="322" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">t_sample ≥ 9.01 · τ</text>

  <rect x="565" y="355" width="235" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="682" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">16-бітний АЦП (DSP/STM32H7)</text>
  <text x="580" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Кількість рівнів: 65 536</text>
  <text x="580" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Поріг 0.5 LSB: 1 / 131 072</text>
  <text x="580" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">t_sample ≥ 11.78 · τ</text>
</svg>