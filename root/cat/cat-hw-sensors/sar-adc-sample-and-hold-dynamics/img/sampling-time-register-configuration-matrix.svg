<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Налаштування часу вибірки (SamplingTime) у регістрах MCU</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Зв'язок максимального допустимого R_Ain_max від кількості тактів АЦП (STM32 ADC_SMPR)</text>

  <!-- Table Layout -->
  <rect x="40" y="85" width="770" height="255" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Table Header -->
  <rect x="40" y="85" width="770" height="35" rx="8" fill="#21262d"/>
  <text x="120" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#79c0ff">SMPR[2:0]</text>
  <text x="250" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#79c0ff">Такти вибірки</text>
  <text x="390" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#79c0ff">Час вибірки (f_ADC = 14 МГц)</text>
  <text x="610" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#79c0ff">Максимальний R_Ain_max</text>

  <!-- Row 1 -->
  <line x1="40" y1="120" x2="810" y2="120" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">000</text>
  <text x="250" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f85149">1.5 циклу</text>
  <text x="390" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">0.11 мкс</text>
  <text x="610" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">0.4 кОм (дуже мало!)</text>

  <!-- Row 2 -->
  <line x1="40" y1="152" x2="810" y2="152" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">001</text>
  <text x="250" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">7.5 циклів</text>
  <text x="390" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">0.54 мкс</text>
  <text x="610" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">5.9 кОм</text>

  <!-- Row 3 -->
  <line x1="40" y1="184" x2="810" y2="184" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">010</text>
  <text x="250" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">13.5 циклів</text>
  <text x="390" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">0.96 мкс</text>
  <text x="610" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">11.4 кОм</text>

  <!-- Row 4 -->
  <line x1="40" y1="216" x2="810" y2="216" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">011</text>
  <text x="250" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">28.5 циклів</text>
  <text x="390" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">2.04 мкс</text>
  <text x="610" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">25.2 кОм</text>

  <!-- Row 5 -->
  <line x1="40" y1="248" x2="810" y2="248" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">100</text>
  <text x="250" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950">41.5 циклів</text>
  <text x="390" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">2.96 мкс</text>
  <text x="610" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950">37.2 кОм (Оптимально)</text>

  <!-- Row 6 -->
  <line x1="40" y1="280" x2="810" y2="280" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">111</text>
  <text x="250" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">239.5 циклів</text>
  <text x="390" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">17.1 мкс</text>
  <text x="610" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787">50.0 кОм (Для NTC термісторів)</text>

  <!-- Practical Recommendation Card -->
  <rect x="40" y="355" width="770" height="105" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="60" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950">Інженерне правило налаштування в HAL / LL:</text>
  <text x="60" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">• Для аналогових термодавачів (LM35, NTC, мости) завжди встановлюйте максимальний або передостанній SamplingTime:</text>
  <text x="75" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">  sConfig.SamplingTime = ADC_SAMPLETIME_239CYCLES_5; /* або ADC_SAMPLETIME_640CYCLES_5 */</text>
  <text x="60" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Кліматичні процеси повільні — додаткові 15 мкс вибірки повністю усувають спотворення без втрати швидкодії системи.</text>
</svg>