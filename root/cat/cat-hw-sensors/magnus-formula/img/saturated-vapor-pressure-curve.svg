<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крива насиченої водяної пари та геометричний зміст точки роси</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Формула Магнуса-Тетенса Es(T) визначає межу конденсації та зв'язок між відносною вологістю RH і точкою роси Td</text>

  <path d="M 100 90 L 100 385.6 C 160 372, 220 355, 276 346.8 C 330 330, 380 305, 418.8 283.3 C 470 250, 530 200, 610 114.9 L 610 90 Z" fill="#fdecea" opacity="0.75"/>
  <path d="M 100 410 L 100 385.6 C 160 372, 220 355, 276 346.8 C 330 330, 380 305, 418.8 283.3 C 470 250, 530 200, 610 114.9 L 610 410 Z" fill="#e9f7ef" opacity="0.75"/>

  <line x1="100" y1="330" x2="610" y2="330" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="250" x2="610" y2="250" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="170" x2="610" y2="170" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="90" x2="610" y2="90" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <line x1="227.5" y1="90" x2="227.5" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="355" y1="90" x2="355" y2="330" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="355" y1="346" x2="355" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="482.5" y1="90" x2="482.5" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="610" y1="90" x2="610" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <line x1="100" y1="410" x2="620" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="100" y1="410" x2="100" y2="75" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <text x="105" y="76" font-size="12" font-weight="bold" fill="#1a1a1a">E [гПа] (тиск пари)</text>
  <text x="355" y="464" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температура повітря T, °C</text>

  <line x1="94" y1="90" x2="100" y2="90" stroke="#1a1a1a"/>
  <text x="90" y="94" font-size="12" fill="#6b7280" text-anchor="end">80</text>
  <line x1="94" y1="170" x2="100" y2="170" stroke="#1a1a1a"/>
  <text x="90" y="174" font-size="12" fill="#6b7280" text-anchor="end">60</text>
  <line x1="94" y1="250" x2="100" y2="250" stroke="#1a1a1a"/>
  <text x="90" y="254" font-size="12" fill="#6b7280" text-anchor="end">40</text>
  <line x1="94" y1="330" x2="100" y2="330" stroke="#1a1a1a"/>
  <text x="90" y="334" font-size="12" fill="#6b7280" text-anchor="end">20</text>
  <line x1="94" y1="410" x2="100" y2="410" stroke="#1a1a1a"/>
  <text x="90" y="414" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <line x1="94" y1="346.8" x2="100" y2="346.8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="90" y="350.8" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">15.8</text>

  <line x1="94" y1="283.3" x2="100" y2="283.3" stroke="#2457d6" stroke-width="1.5"/>
  <text x="90" y="287.3" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">31.7</text>

  <line x1="100" y1="410" x2="100" y2="415" stroke="#1a1a1a"/>
  <text x="100" y="428" font-size="12" fill="#6b7280" text-anchor="middle">0°C</text>
  <line x1="227.5" y1="410" x2="227.5" y2="415" stroke="#1a1a1a"/>
  <text x="227.5" y="428" font-size="12" fill="#6b7280" text-anchor="middle">10°C</text>
  <line x1="355" y1="410" x2="355" y2="415" stroke="#1a1a1a"/>
  <text x="355" y="428" font-size="12" fill="#6b7280" text-anchor="middle">20°C</text>
  <line x1="482.5" y1="410" x2="482.5" y2="415" stroke="#1a1a1a"/>
  <text x="482.5" y="428" font-size="12" fill="#6b7280" text-anchor="middle">30°C</text>
  <line x1="610" y1="410" x2="610" y2="415" stroke="#1a1a1a"/>
  <text x="610" y="428" font-size="12" fill="#6b7280" text-anchor="middle">40°C</text>

  <line x1="276" y1="410" x2="276" y2="417" stroke="#c0392b" stroke-width="1.5"/>
  <text x="276" y="446" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Td = 13.8°C</text>

  <line x1="418.8" y1="410" x2="418.8" y2="417" stroke="#2457d6" stroke-width="1.5"/>
  <text x="418.8" y="446" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">T0 = 25°C</text>

  <path d="M 100 385.6 C 160 372, 220 355, 276 346.8 C 330 330, 380 305, 418.8 283.3 C 470 250, 530 200, 610 114.9" fill="none" stroke="#2457d6" stroke-width="3"/>

  <rect x="108" y="102" width="112" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="114" y="118" font-size="12" font-weight="bold" fill="#c0392b">Зона конденсації</text>
  <text x="114" y="134" font-size="11" fill="#6b7280">Тиск E &gt; Es(T) (вода)</text>

  <rect x="490" y="354" width="112" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="496" y="370" font-size="12" font-weight="bold" fill="#27ae60">Ненасичена пара</text>
  <text x="496" y="386" font-size="11" fill="#6b7280">Тиск E &lt; Es(T) (газ)</text>

  <text x="362" y="195" font-size="12" font-weight="bold" fill="#2457d6">Крива Es(T)</text>
  <text x="362" y="210" font-size="11" fill="#6b7280">RH = 100% (межа)</text>

  <line x1="100" y1="283.3" x2="418.8" y2="283.3" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="418.8" y1="410" x2="418.8" y2="283.3" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <line x1="405" y1="346.8" x2="286" y2="346.8" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="348" y="342" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Охолодження (E0 = const)</text>

  <line x1="276" y1="346.8" x2="276" y2="410" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <circle cx="418.8" cy="283.3" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="2"/>
  <text x="426" y="278" font-size="12" font-weight="bold" fill="#1a1a1a">Ps (25°C)</text>
  <text x="426" y="292" font-size="11" fill="#6b7280">31.7 гПа</text>

  <circle cx="418.8" cy="346.8" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2"/>
  <text x="426" y="344" font-size="12" font-weight="bold" fill="#2457d6">P0 (25°C)</text>
  <text x="426" y="358" font-size="11" fill="#6b7280">15.8 гПа</text>
  <text x="426" y="372" font-size="11" font-weight="bold" fill="#2457d6">RH = 50%</text>

  <circle cx="276" cy="346.8" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="234" y="300" font-size="12" font-weight="bold" fill="#c0392b">Точка роси Pd</text>
  <text x="234" y="314" font-size="11" fill="#6b7280">13.8 °C (конденсація)</text>

  <rect x="640" y="85" width="300" height="98" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="652" y="106" font-size="13" font-weight="bold" fill="#1a1a1a">1. Формула Магнуса-Тетенса</text>
  <text x="652" y="126" font-size="12" font-weight="bold" fill="#2457d6">Es(T) = 6.112 · exp[17.67·T / (243.5+T)]</text>
  <text x="652" y="146" font-size="12" fill="#6b7280">Es — тиск насичення [гПа], T — [°C]</text>
  <text x="652" y="164" font-size="12" fill="#6b7280">Точність &lt; 0.1% для 0...+50°C</text>

  <rect x="640" y="195" width="300" height="98" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="652" y="216" font-size="13" font-weight="bold" fill="#2457d6">2. Відносна вологість (RH)</text>
  <text x="652" y="236" font-size="12" font-weight="bold" fill="#1a1a1a">RH = (E0 / Es(T0)) · 100%</text>
  <text x="652" y="256" font-size="12" fill="#1a1a1a">При 25°C: Es = 31.7 гПа, E0 = 15.8 гПа</text>
  <text x="652" y="274" font-size="12" font-weight="bold" fill="#2457d6">Поточна вологість RH = 50%</text>

  <rect x="640" y="305" width="300" height="125" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="652" y="325" font-size="13" font-weight="bold" fill="#c0392b">3. Точка роси (Td)</text>
  <text x="652" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">α = (17.67·T)/(243.5+T) + ln(RH/100)</text>
  <text x="652" y="365" font-size="12" font-weight="bold" fill="#c0392b">Td = (243.5 · α) / (17.67 - α)</text>
  <text x="652" y="385" font-size="12" fill="#1a1a1a">Для T0 = 25°C, RH = 50%: α = 0.812</text>
  <text x="652" y="403" font-size="12" font-weight="bold" fill="#c0392b">Результат: Td = 13.8 °C</text>
  <text x="652" y="420" font-size="11" fill="#6b7280">Межа утворення конденсату</text>

  <rect x="20" y="468" width="920" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="40" cy="486" r="5" fill="#2457d6"/>
  <text x="52" y="490" font-size="12" font-weight="bold" fill="#1a1a1a">Крива Es(T):</text>
  <text x="135" y="490" font-size="12" fill="#6b7280">межа фазового переходу пара ↔ вода</text>

  <circle cx="420" cy="486" r="5" fill="#2457d6"/>
  <text x="432" y="490" font-size="12" font-weight="bold" fill="#1a1a1a">Точка P0:</text>
  <text x="496" y="490" font-size="12" fill="#6b7280">стан (25°C, 50% RH)</text>

  <circle cx="690" cy="486" r="5" fill="#c0392b"/>
  <text x="702" y="490" font-size="12" font-weight="bold" fill="#1a1a1a">Точка роси Td:</text>
  <text x="798" y="490" font-size="12" fill="#6b7280">13.8°C (конденсація)</text>
</svg>
