<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Алгоритм обчислення точки роси в мікроконтролері</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Перевірка давача, захист від обчислювальних помилок log/div та розрахунок Магнуса</text>

  <!-- Блок 1: Вхідні дані -->
  <rect x="150" y="88" width="340" height="54" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="109" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Зчитування даних давача</text>
  <text x="320" y="128" font-size="12" fill="#1a1a1a" text-anchor="middle">Температура T (°C) та відносна вологість RH (%)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="320" y1="142" x2="320" y2="178" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Валідація -->
  <rect x="150" y="178" width="340" height="58" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="199" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Валідація діапазону вимірювань</text>
  <text x="320" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">–40 °C ≤ T ≤ +85 °C   та   0% ≤ RH ≤ 100% ?</text>

  <!-- Гілка 2: Ні (Аномалія) -->
  <line x1="490" y1="207" x2="620" y2="207" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="555" y="198" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні (Аномалія)</text>

  <rect x="620" y="182" width="230" height="50" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="735" y="202" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">STATUS_ERR_RANGE</text>
  <text x="735" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">Некоректні дані давача</text>

  <!-- Гілка 2: Так -->
  <line x1="320" y1="236" x2="320" y2="270" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="332" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>

  <!-- Блок 3: Захист ln(0) -->
  <rect x="150" y="270" width="340" height="54" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="291" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Захист від помилки ln(0)</text>
  <text x="320" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">RH_safe = max(RH, 0.01%)  // запобігає ln(0) → -∞</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="320" y1="324" x2="320" y2="358" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 4: Обчислення gamma -->
  <rect x="140" y="358" width="360" height="64" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="378" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Обчислення параметра γ(T, RH)</text>
  <text x="320" y="397" font-size="12" fill="#1a1a1a" text-anchor="middle">γ = (a · T) / (b + T) + ln(RH_safe / 100)</text>
  <text x="320" y="413" font-size="12" fill="#6b7280" text-anchor="middle">Коефіцієнти: a = 17.27, b = 237.7 °C</text>

  <!-- Стрілка 4 -> 5 -->
  <line x1="320" y1="422" x2="320" y2="456" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 5: Захист від DIV/0 -->
  <rect x="150" y="456" width="340" height="58" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="477" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист від ділення на нуль</text>
  <text x="320" y="498" font-size="12" fill="#1a1a1a" text-anchor="middle">Чи |a – γ| &gt; 1e-6 ?  (знаменник ≠ 0)</text>

  <!-- Гілка 5: Ні (DIV/0) -->
  <line x1="490" y1="485" x2="620" y2="485" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="555" y="476" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні (DIV/0)</text>

  <rect x="620" y="460" width="230" height="50" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="735" y="480" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">STATUS_ERR_OVERFLOW</text>
  <text x="735" y="498" font-size="12" fill="#1a1a1a" text-anchor="middle">Переповнення обчислень</text>

  <!-- Гілка 5: Так -->
  <line x1="320" y1="514" x2="320" y2="548" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="332" y="536" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>

  <!-- Блок 6: Фінальний результат -->
  <rect x="140" y="548" width="360" height="58" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="569" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Обчислення точки роси T_d</text>
  <text x="320" y="590" font-size="12" fill="#1a1a1a" text-anchor="middle">T_d = (b · γ) / (a – γ)   [°C]   →   STATUS_OK</text>

  <!-- Права панель з особливостями MCU -->
  <rect x="620" y="252" width="280" height="184" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="760" y="275" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Особливості обчислень в MCU</text>
  <text x="635" y="300" font-size="12" fill="#1a1a1a">• Одинарна точність (float32):</text>
  <text x="650" y="319" font-size="12" fill="#6b7280">використання logf() в C/C++</text>
  <text x="635" y="344" font-size="12" fill="#1a1a1a">• Точність апроксимації Магнуса:</text>
  <text x="650" y="363" font-size="12" fill="#6b7280">помилка &lt; 0.4 °C (0 °C…+50 °C)</text>
  <text x="635" y="388" font-size="12" fill="#1a1a1a">• Захист від NaN та нескінченності:</text>
  <text x="650" y="407" font-size="12" fill="#6b7280">забезпечує надійність прошивки</text>
</svg>
