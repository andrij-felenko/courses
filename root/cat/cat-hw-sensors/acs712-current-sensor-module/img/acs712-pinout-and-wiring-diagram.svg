<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема розпиновки та підключення модуля GY-712 (ACS712)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Розділення силових виводів первинного провідника та низьковольтних сигнальних ліній</text>

  <!-- Block 1: Power Circuit (Left) -->
  <rect x="30" y="90" width="220" height="330" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="140" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Силове коло вимірювання</text>

  <rect x="55" y="150" width="170" height="80" fill="white" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="140" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Клема IP+</text>
  <text x="140" y="205" text-anchor="middle" font-size="12" fill="#6b7280">Вхід струму до 30A</text>

  <rect x="55" y="280" width="170" height="80" fill="white" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="140" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Клема IP-</text>
  <text x="140" y="335" text-anchor="middle" font-size="12" fill="#6b7280">Вихід струму до навантаження</text>

  <!-- Block 2: GY-712 Module & SOIC-8 (Center) -->
  <rect x="290" y="90" width="380" height="330" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Модуль GY-712 (ACS712 SOIC-8)</text>

  <!-- SOIC-8 Chip Outline -->
  <rect x="370" y="150" width="220" height="210" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="480" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Мікросхема ACS712</text>

  <!-- Left Pins SOIC-8 (IP) -->
  <text x="380" y="210" font-size="12" fill="#c0392b">Pin 1, 2: IP+ (Провідник)</text>
  <text x="380" y="240" font-size="12" fill="#c0392b">Pin 3, 4: IP- (Провідник)</text>

  <!-- Right Pins SOIC-8 (Signal) -->
  <text x="380" y="280" font-size="12" fill="#2457d6">Pin 5: GND (Земля)</text>
  <text x="380" y="305" font-size="12" fill="#27ae60">Pin 6: FILTER (C_FILT 1nF)</text>
  <text x="380" y="330" font-size="12" fill="#2457d6">Pin 7: VIOUT (Аналоговий вихід)</text>
  <text x="380" y="350" font-size="12" fill="#c0392b">Pin 8: VCC (+5V Живлення)</text>

  <!-- Block 3: MCU Interface (Right) -->
  <rect x="710" y="90" width="220" height="330" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="820" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Мікроконтролер (MCU)</text>

  <rect x="735" y="150" width="170" height="60" fill="white" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="820" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Шина +5V VCC</text>
  <text x="820" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Живлення сенсора</text>

  <rect x="735" y="235" width="170" height="60" fill="white" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="820" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Аналоговий вхід A0</text>
  <text x="820" y="280" text-anchor="middle" font-size="12" fill="#6b7280">Зчитування VOUT</text>

  <rect x="735" y="320" width="170" height="60" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="820" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Спільна Земля GND</text>
  <text x="820" y="365" text-anchor="middle" font-size="12" fill="#6b7280">0V Опорний потенціал</text>

  <!-- Connecting Wires -->
  <!-- Heavy current wires -->
  <path d="M 225 190 L 370 205" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 370 235 L 225 320" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Signal wires to MCU -->
  <path d="M 590 345 L 735 180" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 590 325 L 735 265" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 590 275 L 735 350" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
