<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема моніторингу потужності та захисту від струмового перевантаження</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Узгодження аналогового виходу ACS712 із 3.3 В ADC та керування силовим реле</text>

  <!-- Block 1: Load Circuit -->
  <rect x="25" y="90" width="170" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="110" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Силове коло</text>
  
  <rect x="45" y="140" width="130" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Джерело живлення</text>
  <text x="110" y="185" text-anchor="middle" font-size="12" fill="#6b7280">220V AC / DC Load</text>

  <rect x="45" y="380" width="130" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Навантаження</text>
  <text x="110" y="425" text-anchor="middle" font-size="12" fill="#6b7280">Двигун / Нагрівач</text>

  <!-- Block 2: ACS712 Module -->
  <rect x="220" y="90" width="190" height="390" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="315" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Модуль ACS712</text>
  <text x="315" y="138" text-anchor="middle" font-size="12" fill="#6b7280">Гальванічна ізоляція</text>

  <!-- Terminals -->
  <rect x="235" y="160" width="45" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="257" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">IP+</text>

  <rect x="235" y="390" width="45" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="257" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">IP-</text>

  <!-- Internal conductor -->
  <path d="M 280 175 L 305 175 L 305 405 L 280 405" fill="none" stroke="#c0392b" stroke-width="3"/>
  
  <!-- Conductor Resistance Label -->
  <rect x="290" y="280" width="60" height="24" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="320" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">1.2 mΩ</text>

  <!-- Sensor Signal Pins -->
  <rect x="355" y="170" width="45" height="25" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="377" y="187" text-anchor="middle" font-size="12" fill="#1a1a1a">VCC</text>
  
  <rect x="355" y="270" width="45" height="25" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="377" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">VOUT</text>

  <rect x="355" y="370" width="45" height="25" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="377" y="387" text-anchor="middle" font-size="12" fill="#1a1a1a">GND</text>

  <!-- Block 3: Voltage Divider & Filter -->
  <rect x="435" y="210" width="165" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="517" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Дільник напруги</text>
  <text x="517" y="255" text-anchor="middle" font-size="12" fill="#6b7280">Захист ADC 3.3V</text>

  <rect x="450" y="270" width="135" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="517" y="290" text-anchor="middle" font-size="12" fill="#1a1a1a">R1 = 10k / R2 = 20k</text>

  <text x="517" y="325" text-anchor="middle" font-size="12" fill="#2457d6">V_adc = VOUT * 2/3</text>
  <text x="517" y="348" text-anchor="middle" font-size="12" fill="#6b7280">(0.33В - 3.0В)</text>

  <!-- Block 4: Microcontroller MCU -->
  <rect x="625" y="90" width="175" height="390" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="712" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Мікроконтролер</text>
  <text x="712" y="138" text-anchor="middle" font-size="12" fill="#6b7280">ESP32 / STM32 (3.3V)</text>

  <!-- Pins -->
  <rect x="640" y="270" width="60" height="25" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="670" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ADC Pin</text>

  <rect x="725" y="370" width="60" height="25" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="755" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">GPIO Out</text>

  <!-- MCU Logic text box -->
  <rect x="640" y="160" width="145" height="90" rx="6" fill="#ffffff" stroke="#27ae60"/>
  <text x="712" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Програмна логіка</text>
  <text x="712" y="200" text-anchor="middle" font-size="12" fill="#6b7280">1. Обчислення I_rms</text>
  <text x="712" y="218" text-anchor="middle" font-size="12" fill="#c0392b">2. Порівняння з I_max</text>
  <text x="712" y="236" text-anchor="middle" font-size="12" fill="#27ae60">3. Сигнал на реле</text>

  <!-- Block 5: Relay Driver & Contacts -->
  <rect x="825" y="210" width="115" height="270" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="882" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Силове реле</text>
  <text x="882" y="255" text-anchor="middle" font-size="12" fill="#6b7280">Модуль захисту</text>

  <rect x="838" y="270" width="88" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="882" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Обмотка</text>
  <text x="882" y="304" text-anchor="middle" font-size="12" fill="#6b7280">+ Транзистор</text>

  <rect x="838" y="390" width="88" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="882" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">NC Контакт</text>
  <text x="882" y="424" text-anchor="middle" font-size="12" fill="#6b7280">(Норм. замкн.)</text>

  <!-- Lines & Connections -->
  <!-- Power Line to IP+ -->
  <line x1="175" y1="175" x2="235" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- IP- to Relay NC contact -->
  <line x1="235" y1="405" x2="175" y2="405" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Relay NC to Load -->
  <line x1="838" y1="411" x2="810" y2="411" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="2"/>
  
  <!-- VOUT to Voltage Divider -->
  <line x1="400" y1="282.5" x2="435" y2="282.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Voltage Divider output to MCU ADC -->
  <line x1="600" y1="282.5" x2="640" y2="282.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MCU GPIO Out to Relay Driver Coil -->
  <line x1="785" y1="382.5" x2="810" y2="382.5" stroke="#27ae60" stroke-width="2"/>
  <line x1="810" y1="382.5" x2="810" y2="291" stroke="#27ae60" stroke-width="2"/>
  <line x1="810" y1="291" x2="838" y2="291" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

</svg>
