<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Часові інтервали відеокадру LTDC: Синхронізація та гасіння (Porches)
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Розрахунок регістрів SSCR, BPCR, AWCR, TWCR та частоти піксельного генератора PLLSAI
  </text>

  <!-- Complete Frame Diagram Box -->
  <g transform="translate(60, 85)">
    <!-- Total Frame Box -->
    <rect width="840" height="240" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="420" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">
      Повний кадровий період (Total Period = H_Total x V_Total)
    </text>

    <!-- Horizontal Strip (Top Row) -->
    <g transform="translate(20, 40)">
      <!-- HSW -->
      <rect x="0" y="0" width="60" height="40" fill="#be123c"/>
      <text x="30" y="24" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">HSW</text>

      <!-- HBP -->
      <rect x="60" y="0" width="80" height="40" fill="#0369a1"/>
      <text x="100" y="24" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">HBP</text>

      <!-- Active Display Area (HACT) -->
      <rect x="140" y="0" width="560" height="40" fill="#065f46"/>
      <text x="420" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
        Активна зона відображення рядка: HACT (800 пікселів) — DE = High
      </text>

      <!-- HFP -->
      <rect x="700" y="0" width="100" height="40" fill="#0369a1"/>
      <text x="750" y="24" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">HFP</text>
    </g>

    <!-- Vertical Active Area Box in Center -->
    <rect x="160" y="90" width="560" height="110" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="440" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      АКТИВНИЙ ЕКРАН (Active Display Area)
    </text>
    <text x="440" y="170" text-anchor="middle" font-family="monospace" font-size="13" fill="#a7f3d0">
      800 x 480 пікселів (WVGA)
    </text>

    <!-- Side Vertical Annotations -->
    <!-- VSW -->
    <rect x="20" y="90" width="130" height="25" rx="3" fill="#be123c"/>
    <text x="85" y="106" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">VSW (Синхро)</text>

    <!-- VBP -->
    <rect x="20" y="120" width="130" height="25" rx="3" fill="#0369a1"/>
    <text x="85" y="136" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">VBP (Заднє гасіння)</text>

    <!-- VFP -->
    <rect x="20" y="150" width="130" height="25" rx="3" fill="#0369a1"/>
    <text x="85" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">VFP (Переднє гасіння)</text>
  </g>

  <!-- Bottom: Concrete Timing Math for 800x480 @ 60 Hz -->
  <g transform="translate(60, 345)">
    <rect width="840" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
      Розрахунок параметрів для дисплея 800x480 при 60 FPS:
    </text>

    <!-- Left Column: Geometry Sums -->
    <g transform="translate(25, 45)" font-family="monospace" font-size="11" fill="#cbd5e1">
      <text x="0" y="15">Горизонталь:</text>
      <text x="0" y="35" fill="#38bdf8">H_Total = HSW(1) + HBP(46) + HACT(800) + HFP(210) = 1057 такти</text>

      <text x="0" y="65">Вертикаль:</text>
      <text x="0" y="85" fill="#34d399">V_Total = VSW(1) + VBP(23) + VACT(480) + VFP(22)  = 526 рядків</text>
    </g>

    <!-- Right Column: Dot Clock Formula -->
    <g transform="translate(490, 45)" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
      <rect x="0" y="0" width="325" height="90" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="162" y="24" text-anchor="middle" font-weight="700" fill="#34d399">Необхідна частота тактування LCD_CLK:</text>
      <text x="162" y="48" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">
        F_dotclk = H_Total * V_Total * FPS
      </text>
      <text x="162" y="72" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">
        F_dotclk = 1057 * 526 * 60 ≈ 33.36 МГц
      </text>
    </g>
  </g>
</svg>