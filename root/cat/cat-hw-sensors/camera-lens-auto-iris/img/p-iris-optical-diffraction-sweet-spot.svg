<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="optArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Оптичний баланс чіткості P-Iris: Дифракція проти Аберацій
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Утримання робочої точки об'єктива в зоні оптичного оптимуму (Sweet Spot: F/2.8 .. F/5.6)
  </text>

  <!-- Graph Panel -->
  <rect x="50" y="85" width="860" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Axes -->
  <line x1="120" y1="340" x2="860" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="340" x2="120" y2="110" stroke="#64748b" stroke-width="1.5"/>

  <!-- Axis Labels -->
  <text x="490" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
    Діафрагмове число F-number (діафрагма закривається -> отвір менший)
  </text>
  <text x="75" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" transform="rotate(-90 75 210)">
    Роздільна здатність / Чіткість (MTF)
  </text>

  <!-- F-stop Ticks -->
  <g font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">
    <line x1="180" y1="340" x2="180" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="180" y="360">F/1.4</text>

    <line x1="280" y1="340" x2="280" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="280" y="360">F/2.0</text>

    <line x1="380" y1="340" x2="380" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="380" y="360">F/2.8</text>

    <line x1="480" y1="340" x2="480" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="480" y="360">F/4.0</text>

    <line x1="580" y1="340" x2="580" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="580" y="360">F/5.6</text>

    <line x1="680" y1="340" x2="680" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="680" y="360">F/8.0</text>

    <line x1="780" y1="340" x2="780" y2="345" stroke="#64748b" stroke-width="1.5"/>
    <text x="780" y="360">F/16.0</text>
  </g>

  <!-- Optimal Sweet Spot Zone Highlighting -->
  <rect x="360" y="110" width="240" height="230" fill="url(#optArea)"/>
  <line x1="360" y1="110" x2="360" y2="340" stroke="#10b981" stroke-dasharray="4" stroke-width="1.5"/>
  <line x1="600" y1="110" x2="600" y2="340" stroke="#10b981" stroke-dasharray="4" stroke-width="1.5"/>
  <rect x="390" y="120" width="180" height="26" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="480" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    Зона оптимуму (Sweet Spot)
  </text>

  <!-- Resolution Curve (Combined MTF) -->
  <path d="M 150 290 Q 230 250 350 160 Q 480 145 580 165 Q 680 230 820 320" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Aberrations Curve (Negative factor at large aperture) -->
  <path d="M 150 200 Q 250 270 400 330" fill="none" stroke="#f43f5e" stroke-dasharray="5" stroke-width="1.8"/>
  <text x="210" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">Сферичні аберації</text>

  <!-- Diffraction Curve (Negative factor at small aperture) -->
  <path d="M 520 330 Q 660 250 820 180" fill="none" stroke="#fbbf24" stroke-dasharray="5" stroke-width="1.8"/>
  <text x="720" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">Дифракція Ейрі</text>

  <!-- Legend in Graph -->
  <rect x="140" y="120" width="200" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <line x1="150" y1="135" x2="180" y2="135" stroke="#38bdf8" stroke-width="3"/>
  <text x="190" y="139" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Підсумкова різкість (MTF)</text>
  <circle cx="165" cy="155" r="4" fill="#34d399"/>
  <text x="190" y="159" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">Максимум F/4 .. F/5.6</text>

  <!-- Bottom Explanatory Row -->
  <rect x="50" y="405" width="860" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="430" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
    Алгоритм комбінованого керування P-Iris в контролері камери:
  </text>
  <text x="70" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
    1. При яскравому сонячному світлі звичайний DC-Iris закривається до F/16–F/22 -> розмір плями Ейрі перевищує розмір пікселя сенсора -> мило.
  </text>
  <text x="70" y="472" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
    2. Програмне забезпечення P-Iris тримає діафрагму на рівні F/4, а надлишок світла компенсує зменшенням часу електронного затвора (Shutter)
  </text>
  <text x="70" y="490" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
    та електронним нейтральним фільтром (Gain/ND), гарантуючи пікову чіткість усього поля зору.
  </text>
</svg>