<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad4)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Конвеєр верифікації контрольної суми CRC-8 для AHT20</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Поліном x^8 + x^5 + x^4 + 1 (0x31), початкове значення 0xFF та алгоритм захисту від шумів</text>

  <!-- LFSR Hardware Model -->
  <g transform="translate(40, 110)">
    <rect width="770" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Апаратна модель регістра зсуву з лінійним зворотним зв'язком (LFSR)</text>

    <!-- Shift register 8 bits -->
    <g transform="translate(50, 50)">
      <!-- Input XOR -->
      <circle cx="20" cy="30" r="14" fill="#1c2128" stroke="#e3b341" stroke-width="2"/>
      <text x="20" y="35" fill="#e3b341" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">⊕</text>
      <text x="20" y="65" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Вхід даних</text>

      <!-- 8 Flip-Flops -->
      <g stroke="#7ee787" stroke-width="1.5" fill="#1c2128">
        <rect x="60" y="15" width="45" height="30" rx="3"/>
        <rect x="120" y="15" width="45" height="30" rx="3"/>
        <rect x="180" y="15" width="45" height="30" rx="3"/>
        <rect x="240" y="15" width="45" height="30" rx="3"/>
        <rect x="300" y="15" width="45" height="30" rx="3"/>
        <rect x="360" y="15" width="45" height="30" rx="3"/>
        <rect x="420" y="15" width="45" height="30" rx="3"/>
        <rect x="480" y="15" width="45" height="30" rx="3"/>
      </g>
      <text x="82" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b0</text>
      <text x="142" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b1</text>
      <text x="202" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b2</text>
      <text x="262" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b3</text>
      <text x="322" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b4</text>
      <text x="382" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b5</text>
      <text x="442" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b6</text>
      <text x="502" y="34" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">b7</text>

      <!-- Feedback taps for polynomial 0x31 (bits 4, 5) -->
      <circle cx="310" cy="70" r="10" fill="#1c2128" stroke="#e3b341" stroke-width="1.5"/>
      <text x="310" y="74" fill="#e3b341" font-family="monospace" font-size="11" text-anchor="middle">⊕</text>

      <circle cx="370" cy="70" r="10" fill="#1c2128" stroke="#e3b341" stroke-width="1.5"/>
      <text x="370" y="74" fill="#e3b341" font-family="monospace" font-size="11" text-anchor="middle">⊕</text>

      <path d="M 525 30 L 560 30 L 560 70 L 20 70 L 20 44" stroke="#e3b341" stroke-width="2" fill="none"/>
      <text x="560" y="85" fill="#e3b341" font-family="sans-serif" font-size="9">Зворотний зв'язок (MSB)</text>
    </g>
  </g>

  <!-- Software Validation Logic -->
  <g transform="translate(40, 280)">
    <rect width="770" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Програмна верифікація 7-байтного пакету</text>

    <!-- Calculation Chain -->
    <g transform="translate(20, 50)">
      <rect width="250" height="50" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="125" y="22" fill="#58a6ff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">1. Обчислення CRC</text>
      <text x="125" y="40" fill="#f0f6fc" font-family="monospace" font-size="10" text-anchor="middle">calc_crc = crc8(buf, 6)</text>

      <text x="290" y="30" fill="#8b949e" font-family="monospace" font-size="18">══►</text>

      <rect x="330" y="0" width="220" height="50" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="440" y="22" fill="#bc8cff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">2. Порівняння з buf[6]</text>
      <text x="440" y="40" fill="#f0f6fc" font-family="monospace" font-size="10" text-anchor="middle">calc_crc == buf[6] ?</text>

      <text x="570" y="30" fill="#8b949e" font-family="monospace" font-size="18">══►</text>

      <rect x="610" y="0" width="140" height="50" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
      <text x="680" y="22" fill="#3fb950" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">3. Рішення</text>
      <text x="680" y="40" fill="#7ee787" font-family="sans-serif" font-size="10" text-anchor="middle">Валідно / Повтор</text>
    </g>
  </g>

  <!-- Formula Summary -->
  <g transform="translate(40, 420)">
    <rect width="770" height="65" rx="6" fill="#1c2128" stroke="#7ee787" stroke-width="1.5"/>
    <text x="20" y="24" fill="#7ee787" font-family="system-ui" font-size="12" font-weight="bold">Параметри поліному CRC-8 (Dallas/Sensirion стандарт):</text>
    <text x="20" y="46" fill="#f0f6fc" font-family="monospace" font-size="11">Поліном: 0x31 (x^8 + x^5 + x^4 + 1) | Початкове значення Init: 0xFF | Фінальний XOR: 0x00</text>
  </g>
</svg>