<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad3)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Алгоритм розпакування 20-бітних слів вологості та температури</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Побітове розщеплення спільного Байта 3 та обчислення фізичних значень RH (%) і T (°C)</text>

  <!-- Bitstream Visualization -->
  <g transform="translate(40, 110)">
    <!-- Byte 1 -->
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="70" y="25" fill="#58a6ff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Байт 1</text>
    <text x="70" y="45" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">RH [19 : 12]</text>
    <text x="70" y="60" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">8 біт вологості</text>

    <!-- Byte 2 -->
    <rect x="150" y="0" width="140" height="70" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="220" y="25" fill="#58a6ff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Байт 2</text>
    <text x="220" y="45" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">RH [11 : 4]</text>
    <text x="220" y="60" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">8 біт вологості</text>

    <!-- Byte 3 (Split Byte!) -->
    <g transform="translate(300, 0)">
      <rect width="170" height="70" rx="6" fill="#1c2128" stroke="#bc8cff" stroke-width="2.5"/>
      <text x="85" y="22" fill="#bc8cff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Байт 3 (Спільний!)</text>

      <!-- Left 4 bits (RH) -->
      <rect x="10" y="30" width="70" height="30" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="45" y="50" fill="#58a6ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">RH[3:0]</text>

      <!-- Right 4 bits (T) -->
      <rect x="90" y="30" width="70" height="30" rx="3" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
      <text x="125" y="50" fill="#d29922" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">T[19:16]</text>
    </g>

    <!-- Byte 4 -->
    <rect x="480" y="0" width="140" height="70" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="2"/>
    <text x="550" y="25" fill="#d29922" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Байт 4</text>
    <text x="550" y="45" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">T [15 : 8]</text>
    <text x="550" y="60" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">8 біт температури</text>

    <!-- Byte 5 -->
    <rect x="630" y="0" width="140" height="70" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="2"/>
    <text x="700" y="25" fill="#d29922" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Байт 5</text>
    <text x="700" y="45" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">T [7 : 0]</text>
    <text x="700" y="60" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">8 біт температури</text>
  </g>

  <!-- Math Decoding Boxes -->
  <g transform="translate(40, 210)">
    <!-- Humidity Calculation Box -->
    <rect width="370" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="20" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Обчислення відносної вологості (RH)</text>

    <text x="20" y="60" fill="#8b949e" font-family="system-ui" font-size="11">Побітове складання 20 біт:</text>
    <text x="20" y="80" fill="#f0f6fc" font-family="monospace" font-size="11">raw_rh = (B1 &lt;&lt; 12) | (B2 &lt;&lt; 4) | (B3 &gt;&gt; 4)</text>

    <text x="20" y="115" fill="#8b949e" font-family="system-ui" font-size="11">Формула переведення у відсотки (% RH):</text>
    <text x="20" y="145" fill="#7ee787" font-family="monospace" font-size="14" font-weight="bold">RH = (raw_rh / 1048576.0) × 100%</text>
    <text x="20" y="168" fill="#8b949e" font-family="sans-serif" font-size="10">Діапазон коду: 0 .. 1 048 575 → 0 .. 100%</text>

    <!-- Temperature Calculation Box -->
    <g transform="translate(400, 0)">
      <rect width="370" height="180" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
      <text x="20" y="30" fill="#d29922" font-family="system-ui" font-size="14" font-weight="bold">Обчислення температури (°C)</text>

      <text x="20" y="60" fill="#8b949e" font-family="system-ui" font-size="11">Побітове складання 20 біт:</text>
      <text x="20" y="80" fill="#f0f6fc" font-family="monospace" font-size="11">raw_t = ((B3 &amp; 0x0F) &lt;&lt; 16) | (B4 &lt;&lt; 8) | B5</text>

      <text x="20" y="115" fill="#8b949e" font-family="system-ui" font-size="11">Формула переведення у градуси Цельсія:</text>
      <text x="20" y="145" fill="#7ee787" font-family="monospace" font-size="14" font-weight="bold">T = ((raw_t / 1048576.0) × 200) - 50</text>
      <text x="20" y="168" fill="#8b949e" font-family="sans-serif" font-size="10">Діапазон коду: перекриває від -50 °C до +150 °C</text>
    </g>
  </g>

  <!-- Fixed-point optimization note -->
  <g transform="translate(40, 420)">
    <rect width="770" height="65" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="24" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Оптимізація цілочисельної арифметики для МК без FPU:</text>
    <text x="20" y="46" fill="#f0f6fc" font-family="monospace" font-size="11">int32_t temp_c_x100 = (int32_t)(((int64_t)raw_t * 20000) &gt;&gt; 20) - 5000;  // 25.42 °C → 2542</text>
  </g>
</svg>