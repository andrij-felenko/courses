<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad2)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Часові діаграми повного сеансу I2C-обміну AHT20</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Запит вимірювання (Write 0xAC, 0x33, 0x00) → Затримка 80 мс → Зчитування 7 байтів (Read 0x38)</text>

  <!-- Part 1: Write Command -->
  <g transform="translate(40, 110)">
    <text x="0" y="20" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold">1. Надсилання трибайтної команди запуску (Write Address 0x70):</text>

    <!-- Protocol Boxes -->
    <g transform="translate(0, 35)">
      <!-- START -->
      <rect x="0" y="0" width="50" height="40" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
      <text x="25" y="25" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">START</text>

      <!-- ADDR + W -->
      <rect x="55" y="0" width="120" height="40" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="115" y="20" fill="#58a6ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">0x38 + W (0x70)</text>
      <text x="115" y="33" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">ACK від датчика</text>

      <!-- Command 0xAC -->
      <rect x="180" y="0" width="100" height="40" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="230" y="20" fill="#bc8cff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">0xAC (Trigger)</text>
      <text x="230" y="33" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">ACK</text>

      <!-- Param 1: 0x33 -->
      <rect x="285" y="0" width="90" height="40" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="330" y="20" fill="#bc8cff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">0x33</text>
      <text x="330" y="33" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">ACK</text>

      <!-- Param 2: 0x00 -->
      <rect x="380" y="0" width="90" height="40" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="425" y="20" fill="#bc8cff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">0x00</text>
      <text x="425" y="33" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">ACK</text>

      <!-- STOP -->
      <rect x="475" y="0" width="50" height="40" rx="4" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/>
      <text x="500" y="25" fill="#f85149" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STOP</text>
    </g>
  </g>

  <!-- Part 2: Wait 80ms -->
  <g transform="translate(40, 210)">
    <rect width="770" height="40" rx="4" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="385" y="25" fill="#d29922" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">⏳ Апаратна пауза перетворення: щонайменше 80 мс (Датчик виставляє Status Bit 7 BUSY = 1)</text>
  </g>

  <!-- Part 3: Read 7 Bytes -->
  <g transform="translate(40, 275)">
    <text x="0" y="20" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold">2. Зчитування 7 байтів даних (Read Address 0x71):</text>

    <g transform="translate(0, 35)">
      <!-- START -->
      <rect x="0" y="0" width="45" height="45" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
      <text x="22" y="27" fill="#3fb950" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">START</text>

      <!-- ADDR + R -->
      <rect x="50" y="0" width="100" height="45" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="100" y="22" fill="#58a6ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">0x38+R (0x71)</text>
      <text x="100" y="36" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">ACK від сенсора</text>

      <!-- Byte 0: Status -->
      <rect x="155" y="0" width="90" height="45" rx="4" fill="#1c2128" stroke="#e3b341" stroke-width="1.5"/>
      <text x="200" y="20" fill="#e3b341" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Byte 0: Status</text>
      <text x="200" y="35" fill="#f0f6fc" font-family="sans-serif" font-size="8" text-anchor="middle">Bit7=0, Bit3=1</text>

      <!-- Byte 1: RH[19:12] -->
      <rect x="250" y="0" width="85" height="45" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="292" y="20" fill="#58a6ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Byte 1: RH</text>
      <text x="292" y="35" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">RH[19:12]</text>

      <!-- Byte 2: RH[11:4] -->
      <rect x="340" y="0" width="85" height="45" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="382" y="20" fill="#58a6ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Byte 2: RH</text>
      <text x="382" y="35" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">RH[11:4]</text>

      <!-- Byte 3: RH[3:0] + T[19:16] -->
      <rect x="430" y="0" width="105" height="45" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="482" y="20" fill="#bc8cff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Byte 3: Mix</text>
      <text x="482" y="35" fill="#f0f6fc" font-family="sans-serif" font-size="8" text-anchor="middle">RH[3:0] | T[19:16]</text>

      <!-- Byte 4: T[15:8] -->
      <rect x="540" y="0" width="75" height="45" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
      <text x="577" y="20" fill="#d29922" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Byte 4: T</text>
      <text x="577" y="35" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">T[15:8]</text>

      <!-- Byte 5: T[7:0] -->
      <rect x="620" y="0" width="75" height="45" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
      <text x="657" y="20" fill="#d29922" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Byte 5: T</text>
      <text x="657" y="35" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">T[7:0]</text>

      <!-- Byte 6: CRC-8 -->
      <rect x="700" y="0" width="70" height="45" rx="4" fill="#1c2128" stroke="#7ee787" stroke-width="1.5"/>
      <text x="735" y="20" fill="#7ee787" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CRC-8</text>
      <text x="735" y="35" fill="#f85149" font-family="sans-serif" font-size="8" text-anchor="middle">NACK від МК</text>
    </g>
  </g>

  <!-- Summary Footnote -->
  <g transform="translate(40, 420)">
    <rect width="770" height="65" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="24" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Важливе правило шини I2C:</text>
    <text x="20" y="46" fill="#f0f6fc" font-family="sans-serif" font-size="11">Після 7-го байту (CRC-8) мікроконтролер надсилає NACK (Not Acknowledge) та команду STOP, щоб звільнити шину.</text>
  </g>
</svg>