<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .wire-a { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .wire-b { stroke: #fbbf24; stroke-width: 2.5; fill: none; }
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .resistor { fill: #334155; stroke: #10b981; stroke-width: 2; }
      .opamp { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
      .dot { fill: #38bdf8; }
    </style>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Фізичний рівень RS-422: Симетрична передача та хвильова термінація 120 Ом</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Повне пригнічення синфазних завад (Common-Mode Rejection) та ліквідація хвильового відбиття</text>

  <!-- Left: RS-422 Transmitter (Driver) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="30" width="130" height="140" class="box" />
    <text x="65" y="55" text-anchor="middle" class="lbl-bold">Диференційний</text>
    <text x="65" y="72" text-anchor="middle" class="lbl-bold">передавач</text>
    <text x="65" y="90" text-anchor="middle" class="subtitle">(Line Driver)</text>
    <text x="65" y="125" text-anchor="middle" class="lbl" fill="#38bdf8">U_A (+3.5 В)</text>
    <text x="65" y="145" text-anchor="middle" class="lbl" fill="#fbbf24">U_B (+1.5 В)</text>

    <!-- Out pins -->
    <circle cx="130" cy="70" r="4" class="dot" />
    <circle cx="130" cy="130" r="4" fill="#fbbf24" />
  </g>

  <!-- Middle: Twisted Pair Cable with Noise Injection -->
  <g transform="translate(180, 100)">
    <!-- Line A (Non-inverting) -->
    <line x1="0" y1="70" x2="420" y2="70" class="wire-a" />
    <text x="210" y="60" text-anchor="middle" class="lbl-bold" fill="#38bdf8">Лінія A (+)</text>

    <!-- Line B (Inverting) -->
    <line x1="0" y1="130" x2="420" y2="130" class="wire-b" />
    <text x="210" y="148" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Лінія B (-)</text>

    <!-- Twisted pair crossover symbol representations -->
    <text x="210" y="105" text-anchor="middle" class="subtitle">Вита пара Z_0 = 120 Ом</text>

    <!-- Noise Injection (Common-Mode Noise Vector) -->
    <rect x="150" y="170" width="120" height="40" class="panel" style="stroke: #f43f5e;" />
    <text x="210" y="188" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Завада U_noise</text>
    <text x="210" y="202" text-anchor="middle" class="subtitle">ШІМ інвертора</text>
    <path d="M 210 170 L 210 135" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M 210 130 L 210 75" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Right: Termination Resistor and Receiver -->
  <g transform="translate(600, 100)">
    <!-- Termination Resistor 120 Ohm -->
    <line x1="0" y1="70" x2="40" y2="70" class="wire" />
    <line x1="0" y1="130" x2="40" y2="130" class="wire" />

    <line x1="40" y1="70" x2="40" y2="85" class="wire" />
    <rect x="32" y="85" width="16" height="30" class="resistor" />
    <text x="65" y="104" class="lbl-bold" fill="#10b981">R_term</text>
    <text x="65" y="118" class="subtitle" fill="#10b981">120 Ом</text>
    <line x1="40" y1="115" x2="40" y2="130" class="wire" />

    <!-- Connecting to Receiver -->
    <line x1="40" y1="70" x2="100" y2="70" class="wire" />
    <line x1="40" y1="130" x2="100" y2="130" class="wire" />

    <!-- Differential Receiver Triangle -->
    <polygon points="100,50 100,150 160,100" class="opamp" />
    <text x="105" y="75" class="lbl-bold" font-size="14">+</text>
    <text x="105" y="135" class="lbl-bold" font-size="14">-</text>
    <text x="125" y="105" text-anchor="middle" class="subtitle">Rx</text>

    <!-- Clean Output -->
    <line x1="160" y1="100" x2="220" y2="100" class="wire" />
    <circle cx="220" cy="100" r="4" fill="#10b981" />
    <text x="170" y="85" class="lbl-bold" fill="#10b981">U_out</text>
    <text x="170" y="125" class="subtitle">TTL / CMOS</text>
  </g>

  <!-- Bottom: Mathematical Proof of CMRR & Termination -->
  <rect x="40" y="330" width="800" height="145" class="panel" />
  <text x="60" y="355" class="lbl-bold" fill="#38bdf8">Математичне обґрунтування диференційної стійкості:</text>

  <g transform="translate(60, 365)">
    <text x="0" y="20" class="lbl-bold" fill="#fbbf24">1. Компенсація синфазної завади:</text>
    <text x="0" y="38" class="lbl">U_rx = (U_A + U_noise) - (U_B + U_noise) = U_A - U_B = U_diff = +2.0 В (чистий сигнал!)</text>
    <text x="0" y="54" class="subtitle">Завада U_noise діє однаково на обидва виті провідники і повністю віднімається на вході приймача.</text>

    <text x="0" y="80" class="lbl-bold" fill="#10b981">2. Хвильове узгодження та поглинання відбиттів:</text>
    <text x="0" y="98" class="lbl">Коефіцієнт відбиття: Γ = (R_term - Z_0) / (R_term + Z_0) = (120 - 120) / (120 + 120) = 0.</text>
    <text x="0" y="114" class="subtitle">Відсутність хвильового відбиття (Ringing) запобігає хибним тактовим імпульсам при довжині до 500 м.</text>
  </g>
</svg>