<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .w-clk { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .w-data { stroke: #10b981; stroke-width: 2.5; fill: none; }
      .ring-zone { fill: #a855f7; fill-opacity: 0.15; stroke: #a855f7; stroke-dasharray: 4,4; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="880" height="480" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Режим кільцевої передачі (Ring Transmission) протоколу SSI</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Повторна видача зафіксованого кадру без паузи t_m для верифікації цілісності даних</text>

  <!-- Timing Chart Panel -->
  <rect x="30" y="65" width="820" height="260" class="panel" />

  <g transform="translate(50, 100)">
    <!-- CLK Waveform continuous bursts -->
    <text x="0" y="25" class="lbl-bold" fill="#38bdf8">CLK</text>
    <!-- Frame 1 CLK (8 pulses) + immediate Frame 2 CLK (8 pulses) without pause! -->
    <path d="M 60 20 L 75 20 L 75 0 L 90 0 L 90 20 L 105 20 L 105 0 L 120 0 L 120 20 L 135 20 L 135 0 L 150 0 L 150 20 L 165 20 L 165 0 L 180 0 L 180 20 L 195 20 L 195 0 L 210 0 L 210 20 L 225 20 L 225 0 L 240 0 L 240 20 L 255 20 L 255 0 L 270 0 L 270 20 L 285 20 L 285 0 L 300 0 L 300 20 L 320 20 L 320 0 L 335 0 L 335 20 L 350 20 L 350 0 L 365 0 L 365 20 L 380 20 L 380 0 L 395 0 L 395 20 L 410 20 L 410 0 L 425 0 L 425 20 L 440 20 L 440 0 L 455 0 L 455 20 L 470 20 L 470 0 L 485 0 L 485 20 L 500 20 L 500 0 L 515 0 L 515 20 L 530 20 L 530 0 L 545 0 L 545 20 L 560 20 L 560 0 L 575 0 L 575 20 L 740 20" class="w-clk" />

    <!-- DATA Waveform -->
    <text x="0" y="75" class="lbl-bold" fill="#10b981">DATA</text>

    <!-- Frame 1 Data bits: MSB to LSB -->
    <path d="M 60 50 L 90 50 L 90 70 L 150 70 L 150 50 L 210 50 L 210 70 L 270 70 L 270 50 L 300 50 L 300 70 L 320 70 L 320 50 L 350 50 L 350 70 L 410 70 L 410 50 L 470 50 L 470 70 L 530 70 L 530 50 L 560 50 L 560 70 L 610 70 L 610 50 L 740 50" class="w-data" />

    <!-- Labels for Frame 1 -->
    <rect x="75" y="90" width="225" height="40" class="box" style="stroke: #38bdf8;" />
    <text x="187" y="115" text-anchor="middle" class="lbl-bold" fill="#38bdf8">Кадр 1: Дані позиції θ_0</text>

    <!-- Labels for Repeat Frame (Ring) -->
    <rect x="320" y="90" width="240" height="40" class="box" style="stroke: #a855f7;" />
    <text x="440" y="115" text-anchor="middle" class="lbl-bold" fill="#a855f7">Повторний кадр: ті самі дані θ_0!</text>

    <!-- Pause t_m after ring transmission finishes -->
    <rect x="580" y="90" width="140" height="40" class="box" style="stroke: #fbbf24;" />
    <text x="650" y="115" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Пауза t_m &gt; 20 мкс</text>
  </g>

  <!-- Explanation Panel below -->
  <rect x="30" y="340" width="820" height="120" class="panel" />
  <text x="50" y="365" class="lbl-bold" fill="#38bdf8">Як працює кільцева перевірка (Ring Transmission):</text>
  <text x="50" y="388" class="lbl">• <tspan fill="#a855f7">Безперервне тактування:</tspan> Якщо майстер не робить паузу t_m після LSB, моностабільний таймер енкодера не перезапускається.</text>
  <text x="50" y="410" class="lbl">• <tspan fill="#10b981">Повторне зчитування:</tspan> Енкодер повторно висуває збережений кадр. Контролер порівнює `Кадр_1 == Кадр_2`.</text>
  <text x="50" y="432" class="lbl">• <tspan fill="#fbbf24">Захист від завад:</tspan> Збіг бітів підтверджує відсутність імпульсних наводок без апаратної контрольної суми CRC.</text>
</svg>