<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .w-clk { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .w-data { stroke: #10b981; stroke-width: 2.5; fill: none; }
      .marker-line { stroke: #f43f5e; stroke-dasharray: 4,4; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Часові діаграми та структура кадру протоколу SSI (Synchronous Serial Interface)</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Фіксація позиції за 1-м спадом CLK, послідовна видача бітів MSB-to-LSB та розмежування паузою t_m</text>

  <!-- Main Timing Graph Panel -->
  <rect x="30" y="65" width="820" height="280" class="panel" />

  <g transform="translate(50, 105)">
    <!-- Signal CLK -->
    <text x="0" y="25" class="lbl-bold" fill="#38bdf8">CLK</text>
    <!-- Idle HIGH -> 1st Fall (Latch) -> pulses -> Idle HIGH -->
    <path d="M 60 0 L 100 0 L 100 30 L 130 30 L 130 0 L 160 0 L 160 30 L 190 30 L 190 0 L 220 0 L 220 30 L 250 30 L 250 0 L 280 0 L 280 30 L 310 30 L 310 0 L 340 0 L 340 30 L 370 30 L 370 0 L 400 0 L 400 30 L 430 30 L 430 0 L 460 0 L 460 30 L 490 30 L 490 0 L 520 0 L 520 30 L 550 30 L 550 0 L 740 0" class="w-clk" />

    <!-- 1st Falling Edge Marker -->
    <line x1="100" y1="-10" x2="100" y2="150" class="marker-line" />
    <text x="100" y="165" text-anchor="middle" class="lbl-bold" fill="#f43f5e">1-й спад: Latch позиції</text>

    <!-- Signal DATA -->
    <text x="0" y="85" class="lbl-bold" fill="#10b981">DATA</text>
    <path d="M 60 60 L 130 60 L 130 90 L 190 90 L 190 60 L 250 60 L 250 90 L 370 90 L 370 60 L 430 60 L 430 90 L 550 90 L 550 90 L 670 90 L 670 60 L 740 60" class="w-data" />

    <!-- Bit Names along DATA line -->
    <text x="145" y="75" text-anchor="middle" class="lbl-bold">MSB</text>
    <text x="205" y="75" text-anchor="middle" class="subtitle">Bit N-1</text>
    <text x="265" y="75" text-anchor="middle" class="subtitle">Bit N-2</text>
    <text x="385" y="75" text-anchor="middle" class="subtitle">...</text>
    <text x="445" y="75" text-anchor="middle" class="lbl-bold">LSB</text>
    <text x="535" y="105" text-anchor="middle" class="subtitle" fill="#f43f5e">LOW (утримання)</text>

    <!-- Monostable Timeout t_m window -->
    <rect x="550" y="45" width="120" height="60" class="box" style="stroke: #fbbf24; fill: #fbbf24; fill-opacity: 0.1;" />
    <text x="610" y="75" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Пауза t_m</text>
    <text x="610" y="92" text-anchor="middle" class="subtitle">12–20 мкс</text>
  </g>

  <!-- Bottom Explanatory Rules Panel -->
  <rect x="30" y="360" width="820" height="120" class="panel" />
  <text x="50" y="385" class="lbl-bold" fill="#38bdf8">Ключові часові фази протоколу SSI:</text>
  <text x="50" y="408" class="lbl">1. <tspan fill="#f43f5e">Фіксація відліку:</tspan> Перший спад CLK фіксує поточне значення кута в регістрі енкодера.</text>
  <text x="50" y="428" class="lbl">2. <tspan fill="#10b981">Висування бітів:</tspan> За кожним фронтом CLK енкодер виставляє черговий біт у коді Ґрея (MSB → LSB).</text>
  <text x="50" y="448" class="lbl">3. <tspan fill="#fbbf24">Моностабільний таймер t_m:</tspan> Після LSB лінія DATA тримається в LOW. Пауза t_m &gt; 20 мкс готує енкодер до нового кадру.</text>
</svg>