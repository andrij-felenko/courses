<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Геометрія розміщення давачів TCRT5000 над поверхнею</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Оптимальна висота 2.5 мм забезпечує максимальну чутливість, а крок p запобігає перекриттю плям</text>

  <!-- LEFT PANEL: Single Sensor Geometry -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247.5" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Одиночний давач: фокус та промені</text>

  <!-- Pins -->
  <line x1="225" y1="112" x2="225" y2="125" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="245" y1="112" x2="245" y2="125" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="285" y1="112" x2="285" y2="125" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="305" y1="112" x2="305" y2="125" stroke="#4a5568" stroke-width="2.5"/>

  <!-- Module Body -->
  <rect x="200" y="125" width="145" height="45" rx="4" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>

  <!-- IR LED (Emitter - Left) -->
  <rect x="210" y="145" width="55" height="20" rx="3" fill="#2457d6" opacity="0.9"/>
  <text x="237.5" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ІЧ-діод</text>

  <!-- Phototransistor (Receiver - Right) -->
  <rect x="280" y="145" width="55" height="20" rx="3" fill="#1a1a1a" opacity="0.9"/>
  <text x="307.5" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Фото-Тр</text>

  <!-- Cones of Light -->
  <!-- Emitted Light Cone (Blue) -->
  <polygon points="237.5,170 205,295 272.5,295" fill="#eaf0fd" opacity="0.75"/>
  <!-- Central Emitted Ray -->
  <line x1="237.5" y1="170" x2="252" y2="290" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Reflected Light Cone (Green) -->
  <polygon points="272.5,295 340,295 307.5,170" fill="#e9f7ef" opacity="0.75"/>
  <!-- Central Reflected Ray -->
  <line x1="272.5" y1="295" x2="300" y2="178" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Track Surface Line -->
  <rect x="50" y="295" width="395" height="8" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

  <!-- IR Reflection Spot on Surface -->
  <ellipse cx="272.5" cy="295" rx="35" ry="5" fill="#2457d6" opacity="0.3" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Height Dimension (h = 2.5 mm) -->
  <!-- Extension Lines -->
  <line x1="60" y1="170" x2="105" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="60" y1="295" x2="105" y2="295" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Dimension Line with Arrows -->
  <line x1="85" y1="215" x2="85" y2="173" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="85" y1="250" x2="85" y2="292" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Height Labels -->
  <text x="95" y="228" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">h = 2.5 мм</text>
  <text x="95" y="244" text-anchor="start" font-size="12" fill="#6b7280">(фокусна зона)</text>

  <!-- Beam Labels -->
  <text x="190" y="195" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Випромінювання</text>
  <line x1="193" y1="191" x2="230" y2="200" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="350" y="215" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Відбите світло</text>
  <line x1="347" y1="211" x2="310" y2="220" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Reflection Spot Text -->
  <text x="272.5" y="322" text-anchor="middle" font-size="12" fill="#1a1a1a">Зона відбиття (пляма ІЧ)</text>

  <!-- Left Recommendation Box -->
  <rect x="50" y="340" width="395" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <circle cx="68" cy="365" r="4" fill="#c0392b"/>
  <text x="80" y="369" text-anchor="start" font-size="12" fill="#c0392b">h &lt; 1 мм: Сліпа зона (занадто близько)</text>

  <circle cx="68" cy="405" r="4" fill="#27ae60"/>
  <text x="80" y="409" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">h = 2.5 мм: Оптимум (максимальний контраст)</text>

  <circle cx="68" cy="445" r="4" fill="#6b7280"/>
  <text x="80" y="449" text-anchor="start" font-size="12" fill="#6b7280">h &gt; 6 мм: Розсіювання (слабкий сигнал)</text>

  <!-- RIGHT PANEL: Array Placement Geometry -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712.5" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Масив давачів: крок p та ширина лінії</text>

  <!-- Pitch Dimension Lines & Arrows Above Sensors -->
  <!-- Reference lines above sensors -->
  <line x1="585" y1="104" x2="585" y2="135" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="712.5" y1="104" x2="712.5" y2="135" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="840" y1="104" x2="840" y2="135" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Pitch S1 to S2 -->
  <line x1="628" y1="112" x2="588" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="669.5" y1="112" x2="709.5" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="648.75" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Крок p</text>

  <!-- Pitch S2 to S3 -->
  <line x1="755.5" y1="112" x2="715.5" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="797" y1="112" x2="837" y2="112" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="776.25" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Крок p</text>

  <!-- Three Sensor Modules (S1, S2, S3) -->
  <!-- Sensor S1 -->
  <rect x="553" y="135" width="64" height="36" rx="4" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
  <text x="585" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">S1</text>

  <!-- Sensor S2 -->
  <rect x="680.5" y="135" width="64" height="36" rx="4" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
  <text x="712.5" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">S2</text>

  <!-- Sensor S3 -->
  <rect x="808" y="135" width="64" height="36" rx="4" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
  <text x="840" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">S3</text>

  <!-- Vertical Reference Lines from Sensors down to Surface -->
  <line x1="585" y1="171" x2="585" y2="295" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="712.5" y1="171" x2="712.5" y2="295" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="840" y1="171" x2="840" y2="295" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Light Cones & Rays for Array Sensors -->
  <!-- S1 Cones (Light surface -> strong reflection) -->
  <polygon points="585,171 565,295 605,295" fill="#e9f7ef" opacity="0.6"/>
  <line x1="585" y1="171" x2="575" y2="290" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <line x1="575" y1="290" x2="592" y2="175" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

  <!-- S2 Cones (Black line -> beam absorbed) -->
  <polygon points="712.5,171 692.5,295 732.5,295" fill="#fdecea" opacity="0.6"/>
  <line x1="712.5" y1="171" x2="712.5" y2="290" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- S3 Cones (Light surface -> strong reflection) -->
  <polygon points="840,171 820,295 860,295" fill="#e9f7ef" opacity="0.6"/>
  <line x1="840" y1="171" x2="830" y2="290" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <line x1="830" y1="290" x2="847" y2="175" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

  <!-- Track Surface divided into non-overlapping sections -->
  <!-- Left Track Surface -->
  <rect x="515" y="295" width="135" height="8" rx="2" fill="#cbd5e1"/>
  <!-- Black Line on Track under S2 -->
  <rect x="650" y="292" width="125" height="14" rx="2" fill="#1a1a1a"/>
  <!-- Right Track Surface -->
  <rect x="775" y="295" width="135" height="8" rx="2" fill="#cbd5e1"/>

  <!-- Line Width Dimension L -->
  <line x1="690" y1="320" x2="653" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="735" y1="320" x2="772" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="712.5" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Ширина лінії L (15–20 мм)</text>

  <!-- Output Signal Badges -->
  <!-- S1 Badge -->
  <rect x="540" y="355" width="90" height="25" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="585" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S1 = HIGH (1)</text>

  <!-- S2 Badge -->
  <rect x="667.5" y="355" width="90" height="25" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712.5" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">S2 = LOW (0)</text>

  <!-- S3 Badge -->
  <rect x="795" y="355" width="90" height="25" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S3 = HIGH (1)</text>

  <!-- Right Bottom Rule Box -->
  <rect x="515" y="395" width="395" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="415" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Умова надійного виявлення лінії:</text>
  <text x="530" y="437" text-anchor="start" font-size="12" fill="#27ae60">• p ≤ L / 2 — гарантує постійне виявлення лінії</text>
  <text x="530" y="459" text-anchor="start" font-size="12" fill="#c0392b">• p &gt; L — ризик пропуску лінії між сусідніми давачами</text>
</svg>
