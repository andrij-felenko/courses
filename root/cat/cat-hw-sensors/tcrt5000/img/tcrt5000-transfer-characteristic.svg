<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передавальна характеристика оптичного датчика TCRT5000</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Максимум вихідного струму I_C досягається на d = 0.8–1.0 мм з подальшим згасанням I_C ∝ 1/d²</text>

  <!-- Left Panel: Chart Container -->
  <rect x="40" y="85" width="580" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Chart Header & Peak Zone Title -->
  <text x="55" y="115" font-size="12" font-weight="bold" fill="#1a1a1a">Відносний струм колектора I_C / I_C(max), %</text>
  <text x="165" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зона максимуму (d = 0.8–1.0 мм)</text>

  <!-- Peak Zone Band -->
  <rect x="156" y="160" width="18" height="280" fill="#2457d6" fill-opacity="0.1" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Horizontal Grid Lines -->
  <line x1="120" y1="160" x2="570" y2="160" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="120" y1="216" x2="570" y2="216" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="120" y1="272" x2="570" y2="272" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="120" y1="328" x2="570" y2="328" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="120" y1="384" x2="570" y2="384" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- Vertical Grid Lines -->
  <line x1="165" y1="160" x2="165" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="210" y1="160" x2="210" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="255" y1="160" x2="255" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="300" y1="160" x2="300" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="345" y1="160" x2="345" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="390" y1="160" x2="390" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="435" y1="160" x2="435" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="480" y1="160" x2="480" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="525" y1="160" x2="525" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="570" y1="160" x2="570" y2="440" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- Main Axes -->
  <line x1="120" y1="160" x2="120" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="440" x2="570" y2="440" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Y Ticks & Labels -->
  <line x1="115" y1="160" x2="120" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="108" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">100%</text>

  <line x1="115" y1="216" x2="120" y2="216" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="108" y="220" font-size="12" fill="#1a1a1a" text-anchor="end">80%</text>

  <line x1="115" y1="272" x2="120" y2="272" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="108" y="276" font-size="12" fill="#1a1a1a" text-anchor="end">60%</text>

  <line x1="115" y1="328" x2="120" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="108" y="332" font-size="12" fill="#1a1a1a" text-anchor="end">40%</text>

  <line x1="115" y1="384" x2="120" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="108" y="388" font-size="12" fill="#1a1a1a" text-anchor="end">20%</text>

  <line x1="115" y1="440" x2="120" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="108" y="444" font-size="12" fill="#1a1a1a" text-anchor="end">0%</text>

  <!-- X Ticks & Labels -->
  <line x1="120" y1="440" x2="120" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>

  <line x1="165" y1="440" x2="165" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="165" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text>

  <line x1="210" y1="440" x2="210" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">2</text>

  <line x1="255" y1="440" x2="255" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">3</text>

  <line x1="300" y1="440" x2="300" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">4</text>

  <line x1="345" y1="440" x2="345" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="345" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">5</text>

  <line x1="390" y1="440" x2="390" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">6</text>

  <line x1="435" y1="440" x2="435" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="435" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">7</text>

  <line x1="480" y1="440" x2="480" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">8</text>

  <line x1="525" y1="440" x2="525" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="525" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">9</text>

  <line x1="570" y1="440" x2="570" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">10</text>

  <!-- X Axis Title -->
  <text x="345" y="498" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відстань до відбивної поверхні d, мм</text>

  <!-- Curves -->
  <!-- Curve 1: White Surface (90%) -->
  <path d="M 120,398 C 132,320 152,160 165,160 C 178,160 196,220 210,252 C 230,295 242,308 255,320 C 275,348 285,356 300,362 C 322,378 332,386 345,390 C 370,402 378,404 390,406 C 430,418 450,421 480,423 C 520,428 545,430 570,431" fill="none" stroke="#2457d6" stroke-width="3"/>
  <circle cx="165" cy="160" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="210" cy="252" r="3.5" fill="#2457d6"/>
  <circle cx="300" cy="362" r="3.5" fill="#2457d6"/>

  <!-- Curve 2: Gray Surface (18%) -->
  <path d="M 120,426 C 132,398 152,342 165,342 C 178,342 196,365 210,376 C 230,388 242,393 255,398 C 275,406 285,410 300,412 C 340,422 360,427 390,429 C 450,434 510,436 570,437" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="165" cy="342" r="3.5" fill="#27ae60" stroke="white" stroke-width="1"/>

  <!-- Curve 3: Black Surface (5%) -->
  <path d="M 120,435.8 C 132,428 152,412 165,412 C 178,412 196,418 210,421.2 C 230,425 242,426.5 255,428 C 300,433 345,435 390,436.5 C 450,438 510,438.8 570,439" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="165" cy="412" r="3.5" fill="#c0392b" stroke="white" stroke-width="1"/>

  <!-- Right Panel: Cards Container -->
  <rect x="640" y="85" width="280" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Card 1: Legend -->
  <rect x="655" y="100" width="250" height="115" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="670" y="122" font-size="13" font-weight="bold" fill="#1a1a1a">Коефіцієнт відбивання k_р</text>
  
  <line x1="670" y1="145" x2="695" y2="145" stroke="#2457d6" stroke-width="3"/>
  <circle cx="682.5" cy="145" r="3.5" fill="#2457d6"/>
  <text x="705" y="149" font-size="12" fill="#1a1a1a">90% — Біла поверхня (папір)</text>

  <line x1="670" y1="170" x2="695" y2="170" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="682.5" cy="170" r="3.5" fill="#27ae60"/>
  <text x="705" y="174" font-size="12" fill="#1a1a1a">18% — Сіра поверхня (картон)</text>

  <line x1="670" y1="195" x2="695" y2="195" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="682.5" cy="195" r="3.5" fill="#c0392b"/>
  <text x="705" y="199" font-size="12" fill="#1a1a1a">5% — Чорна матова поверхня</text>

  <!-- Card 2: Operational Zones -->
  <rect x="655" y="230" width="250" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="670" y="252" font-size="13" font-weight="bold" fill="#2457d6">Характерні зони робочої кривої</text>

  <text x="670" y="274" font-size="12" font-weight="bold" fill="#c0392b">d &lt; 0.8 мм — Сліпа зона:</text>
  <text x="670" y="291" font-size="12" fill="#1a1a1a">Конуси огляду ще не перетнулися.</text>

  <text x="670" y="313" font-size="12" font-weight="bold" fill="#2457d6">d = 0.8–1.0 мм — Пік I_C:</text>
  <text x="670" y="330" font-size="12" fill="#1a1a1a">Максимум оптичного перекриття.</text>

  <text x="670" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">d &gt; 1.0 мм — Робоча зона:</text>
  <text x="670" y="369" font-size="12" fill="#1a1a1a">Спадно згасання за законом ~ 1/d².</text>

  <!-- Card 3: Formula & Design Tip -->
  <rect x="655" y="395" width="250" height="123" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="670" y="417" font-size="13" font-weight="bold" fill="#27ae60">Формула струму колектора</text>
  <text x="670" y="440" font-size="12" font-weight="bold" fill="#1a1a1a">I_C(d) = k_р · I_C(max) · f(d)</text>
  <text x="670" y="460" font-size="12" fill="#1a1a1a">де k_р — коефіцієнт відбивання,</text>
  <text x="670" y="480" font-size="12" fill="#1a1a1a">f(d) — чинник геометрії та d.</text>
  <text x="670" y="502" font-size="12" font-weight="bold" fill="#27ae60">R_L обирають під діапазон АЦП</text>
</svg>
