<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема компаратора LM393 з позитивним зворотним зв'язком та його гістерезис</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Позитивний зворотний зв'язок формує пороги V_TH_HIGH та V_TH_LOW для захисту від брязкоту</text>

  <!-- Left Panel: Schematic -->
  <rect x="30" y="70" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="95" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема порогового компаратора</text>

  <!-- V_CC Rail -->
  <line x1="140" y1="135" x2="360" y2="135" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="125" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Живлення V_CC (+5V)</text>
  <circle cx="140" cy="135" r="3" fill="#c0392b"/>
  <circle cx="360" cy="135" r="3" fill="#c0392b"/>

  <!-- V_in Input -->
  <line x1="55" y1="210" x2="245" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="55" cy="210" r="3.5" fill="#2457d6"/>
  <text x="55" y="180" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">V_in</text>
  <text x="55" y="195" font-size="11" fill="#6b7280" text-anchor="start">(від давача)</text>

  <!-- LM393 Comparator -->
  <path d="M 250 185 L 320 235 L 250 285 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="262" y="208" font-size="16" font-weight="700" fill="#1a1a1a">-</text>
  <text x="262" y="272" font-size="16" font-weight="700" fill="#1a1a1a">+</text>
  <text x="282" y="239" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">LM393</text>

  <!-- Voltage Divider R1, R2 -->
  <line x1="140" y1="135" x2="140" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="130" y="155" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="122" y="177" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">R_1</text>
  <line x1="140" y1="190" x2="140" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <circle cx="140" cy="260" r="3.5" fill="#1a1a1a"/>
  <line x1="140" y1="260" x2="250" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="165" y="252" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">V_+</text>
  
  <line x1="140" y1="260" x2="140" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="130" y="295" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="122" y="317" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">R_2</text>
  <line x1="140" y1="330" x2="140" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- GND -->
  <line x1="130" y1="360" x2="150" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="134" y1="364" x2="146" y2="364" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="138" y1="368" x2="142" y2="368" stroke="#1a1a1a" stroke-width="1"/>
  <text x="140" y="382" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Positive Feedback Resistor R3 -->
  <circle cx="195" cy="260" r="3.5" fill="#2457d6"/>
  <line x1="195" y1="260" x2="195" y2="395" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="195" y1="395" x2="240" y2="395" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="240" y="387" width="45" height="16" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262" y="380" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">R_3 (ПОЗЗ)</text>
  <line x1="285" y1="395" x2="360" y2="395" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="360" y1="395" x2="360" y2="235" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Output Section -->
  <line x1="320" y1="235" x2="360" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="360" cy="235" r="3.5" fill="#1a1a1a"/>
  
  <line x1="360" y1="235" x2="360" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="350" y="155" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="378" y="177" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">R_PU</text>
  <line x1="360" y1="155" x2="360" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="360" y1="235" x2="420" y2="235" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="428" y="231" font-size="13" font-weight="700" fill="#27ae60" text-anchor="start">V_out</text>
  <text x="428" y="246" font-size="11" fill="#6b7280" text-anchor="start">(до МК)</text>

  <!-- Left Info Banner -->
  <rect x="45" y="425" width="405" height="36" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="440" font-size="11" font-weight="600" fill="#2457d6" text-anchor="middle">Якщо V_out = HIGH → V_+ = V_TH_HIGH</text>
  <text x="247" y="454" font-size="11" font-weight="600" fill="#2457d6" text-anchor="middle">Якщо V_out = LOW → V_+ = V_TH_LOW</text>

  <!-- Right Panel: Hysteresis Loop -->
  <rect x="495" y="70" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="95" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Передавальна характеристика</text>

  <!-- Axes -->
  <line x1="555" y1="360" x2="900" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="905" y="364" font-size="13" font-weight="700" fill="#2457d6" text-anchor="start">V_in</text>

  <line x1="575" y1="380" x2="575" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="115" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">V_out</text>

  <!-- Grid/Levels -->
  <line x1="575" y1="160" x2="880" y2="160" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <text x="567" y="164" font-size="11" font-weight="700" fill="#27ae60" text-anchor="end">V_OH</text>
  <text x="567" y="364" font-size="11" font-weight="700" fill="#6b7280" text-anchor="end">V_OL</text>

  <line x1="670" y1="135" x2="670" y2="360" stroke="#c0392b" stroke-dasharray="4,4"/>
  <text x="670" y="380" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">V_TH_LOW</text>
  <text x="670" y="394" font-size="10" fill="#6b7280" text-anchor="middle">Спрацьовує при ↓</text>

  <line x1="800" y1="135" x2="800" y2="360" stroke="#2457d6" stroke-dasharray="4,4"/>
  <text x="800" y="380" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">V_TH_HIGH</text>
  <text x="800" y="394" font-size="10" fill="#6b7280" text-anchor="middle">Спрацьовує при ↑</text>

  <!-- Hysteresis Loop Fill & Curve -->
  <rect x="670" y="160" width="130" height="200" fill="#eaf0fd" opacity="0.6"/>

  <line x1="575" y1="160" x2="800" y2="160" stroke="#2457d6" stroke-width="3"/>
  <line x1="720" y1="160" x2="745" y2="160" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <line x1="800" y1="160" x2="800" y2="360" stroke="#2457d6" stroke-width="3"/>
  <line x1="800" y1="240" x2="800" y2="270" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <line x1="880" y1="360" x2="670" y2="360" stroke="#c0392b" stroke-width="3"/>
  <line x1="750" y1="360" x2="725" y2="360" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <line x1="670" y1="360" x2="670" y2="160" stroke="#c0392b" stroke-width="3"/>
  <line x1="670" y1="270" x2="670" y2="240" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <!-- Width Indicator -->
  <line x1="675" y1="250" x2="795" y2="250" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 682 246 L 674 250 L 682 254" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 788 246 L 796 250 L 788 254" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="735" y="242" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">ΔV_HYS</text>
  <text x="735" y="266" font-size="11" fill="#6b7280" text-anchor="middle">Петля гістерезису</text>

  <!-- Right Info Banner -->
  <rect x="510" y="425" width="405" height="36" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="440" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Ширина гістерезису: ΔV_HYS = V_TH_HIGH - V_TH_LOW</text>
  <text x="712" y="454" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">Захищає від хибних спрацьовувань при шумі в районі порогу</text>
</svg>
