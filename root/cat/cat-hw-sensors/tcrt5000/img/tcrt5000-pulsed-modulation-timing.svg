<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма імпульсної модуляції та синхронної демодуляції</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Компенсація фонового інфрачервоного засвічування шляхом віднімання фону (V_out = V_ON − V_OFF)</text>

  <!-- Main Container Panel -->
  <rect x="40" y="72" width="880" height="368" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Vertical Synchronous Alignment Lines (Dashed Guides) -->
  <line x1="270" y1="80" x2="270" y2="428" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="360" y1="80" x2="360" y2="428" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="490" y1="80" x2="490" y2="428" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="580" y1="80" x2="580" y2="428" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="710" y1="80" x2="710" y2="428" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="800" y1="80" x2="800" y2="428" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- TRACK 1: TX LED CONTROL -->
  <text x="210" y="122" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">ІЧ-LED (I_LED)</text>
  <text x="210" y="140" font-size="12" fill="#6b7280" text-anchor="end">Передавач TX</text>
  <rect x="220" y="80" width="670" height="100" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Track 1 Pulses fill -->
  <polygon points="270,160 270,120 360,120 360,160" fill="#eaf0fd"/>
  <polygon points="490,160 490,120 580,120 580,160" fill="#eaf0fd"/>
  <polygon points="710,160 710,120 800,120 800,160" fill="#eaf0fd"/>

  <!-- Track 1 Baseline & Waveform -->
  <line x1="225" y1="160" x2="885" y2="160" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 225,160 L 270,160 L 270,120 L 360,120 L 360,160 L 490,160 L 490,120 L 580,120 L 580,160 L 710,160 L 710,120 L 800,120 L 800,160 L 885,160" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Track 1 Dimension Annotations -->
  <!-- Pulse width t_pulse -->
  <line x1="270" y1="94" x2="360" y2="94" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="315" y="144" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_pulse</text>

  <!-- Period T_mod -->
  <line x1="270" y1="106" x2="490" y2="106" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="425" y="100" font-size="12" fill="#6b7280" text-anchor="middle">T_mod (період)</text>

  <!-- TRACK 2: RX PHOTOTRANSISTOR SIGNAL -->
  <text x="210" y="252" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Сигнал фотоприймача</text>
  <text x="210" y="270" font-size="12" fill="#6b7280" text-anchor="end">V_RX (з засвічуванням)</text>
  <rect x="220" y="196" width="670" height="136" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Ambient noise background region -->
  <rect x="225" y="260" width="660" height="52" fill="#fdecea"/>
  <line x1="225" y1="260" x2="885" y2="260" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Track 2 Signal Pulses fill -->
  <polygon points="270,260 270,216 360,216 360,260" fill="#eaf0fd"/>
  <polygon points="490,260 490,216 580,216 580,260" fill="#eaf0fd"/>
  <polygon points="710,260 710,216 800,216 800,260" fill="#eaf0fd"/>

  <!-- Track 2 Baselines & Waveform -->
  <line x1="225" y1="312" x2="885" y2="312" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 225,260 L 270,260 L 270,216 L 360,216 L 360,260 L 490,260 L 490,216 L 580,216 L 580,260 L 710,260 L 710,216 L 800,216 L 800,260 L 885,260" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Track 2 Annotations -->
  <text x="315" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Корисний ΔV</text>
  <text x="645" y="288" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фоновий шум V_amb</text>

  <!-- Strobing / Sampling Markers -->
  <!-- V_OFF sample -->
  <line x1="435" y1="260" x2="435" y2="276" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="435" cy="260" r="4" fill="#c0392b"/>
  <text x="435" y="292" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вибірка V_OFF</text>

  <!-- V_ON sample -->
  <line x1="535" y1="216" x2="535" y2="255" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="535" cy="216" r="4" fill="#2457d6"/>
  <text x="535" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вибірка V_ON</text>

  <!-- TRACK 3: DEMODULATED OUTPUT SIGNAL -->
  <text x="210" y="380" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">Вихідний V_out</text>
  <text x="210" y="398" font-size="12" fill="#6b7280" text-anchor="end">(V_ON − V_OFF)</text>
  <rect x="220" y="348" width="670" height="80" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Track 3 Pulses fill -->
  <polygon points="270,412 270,368 360,368 360,412" fill="#e9f7ef"/>
  <polygon points="490,412 490,368 580,368 580,412" fill="#e9f7ef"/>
  <polygon points="710,412 710,368 800,368 800,412" fill="#e9f7ef"/>

  <!-- Track 3 Baseline & Waveform -->
  <line x1="225" y1="412" x2="885" y2="412" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 225,412 L 270,412 L 270,368 L 360,368 L 360,412 L 490,412 L 490,368 L 580,368 L 580,412 L 710,412 L 710,368 L 800,368 L 800,412 L 885,412" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Track 3 Annotations -->
  <text x="315" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Очищений ΔV</text>
  <text x="645" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фоновий шум = 0</text>

  <!-- TIME AXIS -->
  <line x1="220" y1="432" x2="890" y2="432" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="898" y="436" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Час (t)</text>

  <!-- SUMMARY / FORMULA PANEL -->
  <rect x="40" y="450" width="880" height="74" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Left Math Box -->
  <rect x="55" y="457" width="310" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="210" y="480" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_out = V_ON − V_OFF</text>
  <text x="210" y="502" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">= (V_amb + ΔV) − V_amb = ΔV</text>

  <!-- Right Result Box -->
  <rect x="380" y="457" width="525" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="395" y="475" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Результат синхронного віднімання:</text>
  <text x="395" y="493" font-size="12" fill="#1a1a1a" text-anchor="start">Постійне засвічення (сонце, лампи) повністю віднімається до 0.</text>
  <text x="395" y="509" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Корисний відгук TCRT5000 виділяється без фонових завад.</text>
</svg>
