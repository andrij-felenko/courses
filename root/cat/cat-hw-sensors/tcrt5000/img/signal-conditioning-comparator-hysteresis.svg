<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Формування сигналу TCRT5000 та усунення брязкоту гістерезисом</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Компаратор LM393 з пороговим гістерезисом перетворює оптичні завади на чіткі імпульси</text>

  <!-- ЛІВА ПАНЕЛЬ: СХЕМА -->
  <rect x="24" y="70" width="440" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="244" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схема формування сигналу (LM393)</text>

  <!-- Живлення +5V та GND -->
  <line x1="45" y1="125" x2="445" y2="125" stroke="#c0392b" stroke-width="2"/>
  <text x="45" y="112" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">+5V (Vcc)</text>

  <line x1="45" y1="485" x2="445" y2="485" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="505" text-anchor="start" font-size="12" fill="#1a1a1a">GND (0V)</text>

  <!-- Модуль / Контейнер TCRT5000 -->
  <rect x="35" y="145" width="185" height="315" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="127" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">TCRT5000</text>

  <!-- ІЧ-СД (Випромінювач) -->
  <line x1="80" y1="125" x2="80" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="71" y="175" width="18" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="66" y="190" text-anchor="end" font-size="12" fill="#1a1a1a">R_LED</text>
  <text x="66" y="206" text-anchor="end" font-size="12" fill="#6b7280">220 Ом</text>
  <line x1="80" y1="211" x2="80" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>

  <polygon points="71,235 89,235 80,253" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="71" y1="253" x2="89" y2="253" stroke="#2457d6" stroke-width="2"/>
  <text x="66" y="247" text-anchor="end" font-size="12" fill="#1a1a1a">ІЧ-СД</text>
  <line x1="80" y1="253" x2="80" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Стрілки ІЧ випромінювання -->
  <line x1="95" y1="242" x2="115" y2="242" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="95" y1="252" x2="115" y2="252" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="105" y="232" text-anchor="middle" font-size="12" fill="#2457d6">λ = 950 нм</text>

  <!-- Фототранзистор (Приймач) -->
  <line x1="160" y1="125" x2="160" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="151" y="175" width="18" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="173" y="190" text-anchor="start" font-size="12" fill="#1a1a1a">R_L</text>
  <text x="173" y="206" text-anchor="start" font-size="12" fill="#6b7280">10 кОм</text>
  <line x1="160" y1="211" x2="160" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="160" cy="230" r="3.5" fill="#2457d6"/>

  <!-- Символ транзистора -->
  <line x1="150" y1="275" x2="150" y2="295" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="150" y1="280" x2="160" y2="272" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="290" x2="160" y2="298" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="160" y1="298" x2="160" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="173" y="285" text-anchor="start" font-size="12" fill="#1a1a1a">Фото-Т</text>

  <!-- Лінія аналогового сигналу V_in -->
  <line x1="160" y1="230" x2="300" y2="230" stroke="#2457d6" stroke-width="2"/>
  <circle cx="300" cy="230" r="3.5" fill="#2457d6"/>
  <line x1="300" y1="230" x2="300" y2="260" stroke="#2457d6" stroke-width="2"/>

  <!-- Потенціометр RV1 (Порогова напруга V_ref) -->
  <line x1="235" y1="125" x2="235" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="226" y="310" width="18" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="222" y="335" text-anchor="end" font-size="12" fill="#1a1a1a">RV1</text>
  <text x="222" y="351" text-anchor="end" font-size="12" fill="#6b7280">10 кОм</text>
  <line x1="235" y1="370" x2="235" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Текст V_in (аналог) між RV1 line (235) та LM393 wire (300) -->
  <text x="267" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_in (аналог)</text>

  <!-- Рухомий контакт потенціометра -->
  <line x1="244" y1="340" x2="275" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="340" x2="300" y2="340" stroke="#6b7280" stroke-width="1.5"/>
  <text x="270" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">V_ref</text>

  <!-- Компаратор LM393 (Трикутник) -->
  <polygon points="300,240 370,300 300,360" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="308" y="265" font-size="14" font-weight="bold" fill="#2457d6">+</text>
  <text x="308" y="345" font-size="14" font-weight="bold" fill="#c0392b">−</text>
  <text x="328" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">LM393</text>

  <!-- Вихід компаратора V_OUT -->
  <line x1="370" y1="300" x2="445" y2="300" stroke="#27ae60" stroke-width="2"/>
  <circle cx="410" cy="300" r="3.5" fill="#27ae60"/>
  <text x="425" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_OUT</text>

  <!-- Резистор підтяжки R_PU (Open-Collector LM393) -->
  <line x1="410" y1="125" x2="410" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="401" y="195" width="18" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="410" y1="231" x2="410" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="395" y="210" text-anchor="end" font-size="12" fill="#1a1a1a">R_PU</text>
  <text x="395" y="226" text-anchor="end" font-size="12" fill="#6b7280">4.7 кОм</text>

  <!-- Резистор гістерезису R_H (Позитивний зворотний зв'язок) -->
  <line x1="390" y1="300" x2="390" y2="160" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="390" y1="160" x2="370" y2="160" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="320" y="151" width="50" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="345" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">R_H (100 кОм)</text>
  <line x1="320" y1="160" x2="300" y2="160" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="300" y1="160" x2="300" y2="230" stroke="#27ae60" stroke-width="1.5"/>

  <!-- ПРАВА ПАНЕЛЬ: ЧАСОВА ДІАГРАМА -->
  <rect x="496" y="70" width="440" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="716" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Часові діаграми: аналоговий сигнал vs вихід</text>

  <!-- ГРАФІК 1: Аналогова напруга V_in та пороги V_TH, V_TL -->
  <line x1="535" y1="235" x2="915" y2="235" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="920" y="239" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">t (час)</text>

  <line x1="535" y1="235" x2="535" y2="125" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="535" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_in</text>

  <!-- Порогова смуга гістерезису -->
  <rect x="535" y="165" width="370" height="30" fill="#2457d6" fill-opacity="0.07"/>
  <line x1="535" y1="165" x2="905" y2="165" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="528" y="169" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_TH</text>

  <line x1="535" y1="195" x2="905" y2="195" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="528" y="199" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">V_TL</text>

  <text x="900" y="184" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Гістерезис (ΔV_H)</text>

  <!-- Сигнал V_in(t) з шумом (оптичний брязкіт) -->
  <path d="M 535,135 L 570,135 L 585,155 L 595,175 L 605,155 L 615,180 L 625,160 L 640,205 L 650,220 L 730,220 L 745,185 L 755,205 L 770,175 L 780,198 L 795,150 L 810,135 L 905,135" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Позначення оптичного брязкоту -->
  <text x="630" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Оптичний брязкіт (шум від вібрацій)</text>

  <!-- Пунктирні лінії спрацьовування -->
  <line x1="640" y1="195" x2="640" y2="475" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="645" y="230" text-anchor="start" font-size="12" fill="#27ae60">Спрацювання V_TL</text>

  <line x1="795" y1="165" x2="795" y2="475" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="790" y="155" text-anchor="end" font-size="12" fill="#c0392b">Спрацювання V_TH</text>

  <!-- ГРАФІК 2: Вихід БЕЗ гістерезису -->
  <text x="535" y="272" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">1. Вихід БЕЗ гістерезису (звичайний компаратор)</text>
  <line x1="535" y1="355" x2="915" y2="355" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="535" y1="355" x2="535" y2="290" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="528" y="295" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_OUT</text>

  <path d="M 535,300 L 585,300 L 585,350 L 595,350 L 595,300 L 605,300 L 605,350 L 615,350 L 615,300 L 625,300 L 625,350 L 745,350 L 745,300 L 755,300 L 755,350 L 770,350 L 770,300 L 780,300 L 780,350 L 795,350 L 795,300 L 905,300" fill="none" stroke="#c0392b" stroke-width="2"/>

  <rect x="640" y="365" width="260" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="770" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⛔ Хибні імпульси та оптичний брязкіт!</text>

  <!-- ГРАФІК 3: Вихід З гістерезисом -->
  <text x="535" y="405" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">2. Вихід З гістерезисом (LM393 + R_H)</text>
  <line x1="535" y1="475" x2="915" y2="475" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="535" y1="475" x2="535" y2="420" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="528" y="425" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">V_OUT</text>

  <path d="M 535,430 L 640,430 L 640,475 L 795,475 L 795,430 L 905,430" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <rect x="655" y="440" width="130" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="720" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Чистий сигнал</text>
</svg>
