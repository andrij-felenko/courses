<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>

    <!-- Curve gradient -->
    <linearGradient id="curve-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2457d6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2457d6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Emitter beam gradient -->
    <linearGradient id="beam-led" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#2457d6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2457d6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Receiver field of view gradient -->
    <linearGradient id="beam-det" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#27ae60" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#27ae60" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Геометрія оптичних осей та фокусна зона TCRT5000</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Перетин випромінювання й зони огляду створює пік струму I_C на відстані d = 2.5 мм</text>

  <!-- Left Panel: Optical Geometry -->
  <rect x="30" y="80" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Геометрія оптичних осей сенсора</text>

  <!-- Focal Zone Header & Subtitle -->
  <text x="247" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Фокусна зона (перетин променів)</text>
  <text x="247" y="163" text-anchor="middle" font-size="12" fill="#1a1a1a">Максимальний відбитий потік</text>

  <!-- Target Label above target -->
  <text x="247" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Відбивна поверхня (мішень)</text>

  <!-- Target Surface at d = 2.5 mm -->
  <rect x="120" y="215" width="255" height="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>

  <!-- Focal Zone Highlight Ellipse -->
  <ellipse cx="247" cy="221" rx="48" ry="10" fill="#2457d6" fill-opacity="0.25" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="4,3"/>

  <!-- Beams Cone Polygons -->
  <!-- LED Emitter Beam -->
  <polygon points="155,385 195,385 295,221 165,221" fill="url(#beam-led)" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Detector FOV Beam -->
  <polygon points="299,385 339,385 329,221 199,221" fill="url(#beam-det)" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Central optical axis lines -->
  <line x1="175" y1="385" x2="230" y2="221" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-accent)"/>
  <line x1="319" y1="385" x2="264" y2="221" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>

  <!-- Distance Dimension Line (d = 2.5 mm) -->
  <line x1="55" y1="385" x2="55" y2="221" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-accent)" marker-end="url(#arr-accent)"/>
  <line x1="48" y1="221" x2="62" y2="221" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="48" y1="385" x2="62" y2="385" stroke="#2457d6" stroke-width="1.5"/>
  <text x="66" y="298" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">d = 2.5 мм</text>
  <text x="66" y="314" text-anchor="start" font-size="11" fill="#6b7280">(фокус)</text>

  <!-- Beam Labels -->
  <text x="140" y="325" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">ІЧ-випромінювання</text>
  <text x="355" y="325" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Зона огляду</text>

  <!-- TCRT5000 Housing / Package -->
  <rect x="120" y="385" width="255" height="65" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <!-- Internal Partition (Screen/Barrier) inside housing -->
  <rect x="239" y="385" width="16" height="65" fill="#4a5568" rx="2"/>
  <text x="247" y="472" text-anchor="middle" font-size="12" fill="#6b7280">Внутрішній перестінок (екранування)</text>

  <!-- LED Emitter Element -->
  <path d="M 155,385 A 20,10 0 0 1 195,385 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="160" y="400" width="30" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="175" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ІЧ LED</text>

  <!-- Phototransistor Detector Element -->
  <path d="M 299,385 A 20,10 0 0 1 339,385 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="304" y="400" width="30" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <text x="319" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Фото ТР</text>


  <!-- Right Panel: Characteristic Curve IC(d) -->
  <rect x="495" y="80" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Залежність струму I_C від відстані d</text>

  <!-- Graph Plotting Box -->
  <rect x="545" y="145" width="350" height="250" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Horizontal Grid Lines -->
  <line x1="585" y1="317.5" x2="875" y2="317.5" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="585" y1="270" x2="875" y2="270" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="585" y1="222.5" x2="875" y2="222.5" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="585" y1="175" x2="875" y2="175" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Vertical Grid Lines -->
  <line x1="614" y1="160" x2="614" y2="365" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="730" y1="160" x2="730" y2="365" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="802.5" y1="160" x2="802.5" y2="365" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="875" y1="160" x2="875" y2="365" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Vertical Peak Guide Line (2.5 mm) -->
  <line x1="657.5" y1="160" x2="657.5" y2="365" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Curve Fill Gradient -->
  <path d="M 585,365 L 585,355.5 C 595,330 610,240 628.5,203.5 C 640,180 648,175 657.5,175 C 670,175 685,210 701,241.5 C 730,290 800,340 875,349.8 L 875,365 Z" fill="url(#curve-grad)"/>

  <!-- Characteristic Curve Path -->
  <path d="M 585,355.5 C 595,330 610,240 628.5,203.5 C 640,180 648,175 657.5,175 C 670,175 685,210 701,241.5 C 730,290 800,340 875,349.8" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Peak Marker Circle -->
  <circle cx="657.5" cy="175" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="2"/>

  <!-- Axes Lines -->
  <line x1="585" y1="365" x2="882" y2="365" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="365" x2="585" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Axis Titles -->
  <text x="730" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Відстань d, мм</text>
  <text x="540" y="138" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Струм I_C / I_C,max (%)</text>

  <!-- Y Ticks & Labels -->
  <text x="578" y="369" text-anchor="end" font-size="11" fill="#6b7280">0</text>
  <text x="578" y="274" text-anchor="end" font-size="11" fill="#6b7280">50%</text>
  <text x="578" y="179" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">100%</text>

  <!-- X Ticks & Labels -->
  <text x="585" y="380" text-anchor="middle" font-size="11" fill="#6b7280">0</text>
  <text x="614" y="380" text-anchor="middle" font-size="11" fill="#6b7280">1</text>
  <text x="657.5" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">2.5</text>
  <text x="730" y="380" text-anchor="middle" font-size="11" fill="#6b7280">5</text>
  <text x="802.5" y="380" text-anchor="middle" font-size="11" fill="#6b7280">7.5</text>
  <text x="875" y="380" text-anchor="middle" font-size="11" fill="#6b7280">10</text>

  <!-- Peak Callout Badge -->
  <rect x="675" y="165" width="160" height="46" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="685" y="183" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Максимум I_C,max</text>
  <text x="685" y="199" text-anchor="start" font-size="12" fill="#1a1a1a">при d = 2.5 мм</text>

  <!-- Region Badges below Graph -->
  <!-- Zone 1: Blind / Close -->
  <rect x="510" y="420" width="125" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="572.5" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">d &lt; 1.5 мм</text>
  <text x="572.5" y="453" text-anchor="middle" font-size="11" fill="#1a1a1a">Неповний перетин</text>
  <text x="572.5" y="467" text-anchor="middle" font-size="11" fill="#6b7280">Струм I_C знижений</text>

  <!-- Zone 2: Optimal -->
  <rect x="647" y="420" width="130" height="58" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="712" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">d = 2.0...3.0 мм</text>
  <text x="712" y="453" text-anchor="middle" font-size="11" fill="#1a1a1a">Фокусна зона</text>
  <text x="712" y="467" text-anchor="middle" font-size="11" fill="#27ae60">Найвища чутливість</text>

  <!-- Zone 3: Far / Falloff -->
  <rect x="789" y="420" width="125" height="58" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="851.5" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">d &gt; 4.0 мм</text>
  <text x="851.5" y="453" text-anchor="middle" font-size="11" fill="#1a1a1a">Розсіювання світла</text>
  <text x="851.5" y="467" text-anchor="middle" font-size="11" fill="#6b7280">Спад I_C ~ 1/d²</text>
</svg>
