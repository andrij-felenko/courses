<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схеми підключення ІЧ-відбивального давача TCRT5000</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Дискретний аналоговий каскад та формування цифрового сигналу з компаратором LM393</text>

  <!-- Panel 1: Discrete Circuit -->
  <rect x="20" y="72" width="450" height="468" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="96" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Дискретне підключення TCRT5000</text>
  <text x="245" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Формування аналогового сигналу V_A</text>

  <!-- Power Rails Panel 1 -->
  <line x1="40" y1="130" x2="440" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <text x="40" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">+5V (VCC)</text>

  <line x1="40" y1="370" x2="440" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <text x="40" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND (0V)</text>

  <!-- TCRT5000 Package Box -->
  <rect x="100" y="195" width="290" height="155" rx="6" fill="#ffffff" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="245" y="213" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Корпус TCRT5000</text>

  <!-- Optical Barrier -->
  <rect x="210" y="222" width="10" height="95" rx="2" fill="#d0d7de"/>
  <text x="215" y="333" font-size="11" fill="#6b7280" text-anchor="middle">Перегородка</text>

  <!-- LED Branch -->
  <line x1="150" y1="130" x2="150" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="140" y="145" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="132" y="158" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_LED = 220 Ом</text>
  <text x="132" y="172" font-size="11" fill="#6b7280" text-anchor="end">(струмообмеження)</text>
  <line x1="150" y1="180" x2="150" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Diode Symbol -->
  <polygon points="138,230 162,230 150,250" fill="#2457d6"/>
  <line x1="138" y1="250" x2="162" y2="250" stroke="#2457d6" stroke-width="2"/>
  <line x1="150" y1="250" x2="150" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="178" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ІЧ-діод</text>

  <!-- Emission Light Rays -->
  <line x1="160" y1="235" x2="190" y2="245" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="160" y1="245" x2="190" y2="255" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Phototransistor Branch -->
  <line x1="280" y1="130" x2="280" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="270" y="145" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="158" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_L = 10 кОм</text>
  <text x="300" y="172" font-size="11" fill="#6b7280" text-anchor="start">(навантаження)</text>

  <!-- Node V_A -->
  <line x1="280" y1="180" x2="280" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="280" cy="190" r="3.5" fill="#2457d6"/>
  <line x1="280" y1="190" x2="405" y2="190" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="405" cy="190" r="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="415" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">V_A</text>
  <text x="415" y="200" font-size="11" fill="#2457d6" text-anchor="start">(на АЦП)</text>

  <!-- Phototransistor Symbol -->
  <line x1="270" y1="230" x2="270" y2="255" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="280" y1="225" x2="270" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="270" y1="250" x2="280" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="280" y1="260" x2="280" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Фототранзистор</text>

  <!-- Reception Light Rays -->
  <line x1="235" y1="235" x2="262" y2="242" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="235" y1="245" x2="262" y2="252" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 1 Summary Box -->
  <rect x="35" y="385" width="420" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="407" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Параметри та вихідний рівень V_A:</text>
  <text x="50" y="430" font-size="12" fill="#1a1a1a" text-anchor="start">• I_F = (5V - 1.25V) / 220Ω ≈ 17 мА</text>
  <text x="50" y="453" font-size="12" fill="#c0392b" text-anchor="start">• Без відбиття (чорне/темно): V_A ≈ 4.8V ... 5.0V</text>
  <text x="50" y="476" font-size="12" fill="#27ae60" text-anchor="start">• З відбиттям (біле/близько): V_A ≈ 0.2V ... 1.5V</text>
  <text x="50" y="499" font-size="12" fill="#6b7280" text-anchor="start">• Робоча дистанція: 0.2–15 мм (пік чутливості 2.5 мм)</text>

  <!-- Panel 2: LM393 Comparator Module -->
  <rect x="490" y="72" width="450" height="468" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="715" y="96" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Модуль з компаратором LM393</text>
  <text x="715" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Формування цифрового сигналу V_D із порогом V_ref</text>

  <!-- Power Rails Panel 2 -->
  <line x1="510" y1="130" x2="920" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <text x="510" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">+5V</text>

  <line x1="510" y1="370" x2="920" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <text x="510" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Sensor Block -->
  <rect x="515" y="170" width="105" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="567" y="195" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач TCRT5000</text>
  <text x="567" y="215" font-size="11" fill="#6b7280" text-anchor="middle">каскад із</text>
  <text x="567" y="230" font-size="11" fill="#6b7280" text-anchor="middle">дільником R_L</text>

  <!-- Signal V_A Output & Routing -->
  <line x1="620" y1="220" x2="640" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="640" cy="220" r="3.5" fill="#2457d6"/>
  <line x1="640" y1="220" x2="640" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="640" y1="160" x2="870" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="870" cy="160" r="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="880" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">A0 (V_A)</text>

  <line x1="640" y1="220" x2="700" y2="220" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Potentiometer R_pot -->
  <line x1="650" y1="130" x2="650" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="640" y="290" width="20" height="45" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="650" y1="335" x2="650" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="660" y1="312" x2="680" y2="312" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="680" y1="312" x2="680" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="680" y1="300" x2="700" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="632" y="308" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_pot (10k)</text>
  <text x="632" y="323" font-size="11" fill="#6b7280" text-anchor="end">(поріг V_ref)</text>

  <!-- LM393 Triangle -->
  <polygon points="700,195 700,325 775,260" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="712" y="224" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">-</text>
  <text x="712" y="304" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+</text>
  <text x="732" y="264" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LM393</text>

  <!-- Output & Pullup -->
  <line x1="775" y1="260" x2="820" y2="260" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="820" cy="260" r="3.5" fill="#27ae60"/>

  <line x1="820" y1="130" x2="820" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="810" y="195" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="820" y1="230" x2="820" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="838" y="210" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_pull = 10k</text>
  <text x="838" y="224" font-size="11" fill="#6b7280" text-anchor="start">(підтяжка 5V)</text>

  <line x1="820" y1="260" x2="870" y2="260" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="870" cy="260" r="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="880" y="264" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">D0 (V_D)</text>

  <!-- Panel 2 Summary Box -->
  <rect x="505" y="385" width="420" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="407" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Принцип формування цифрового сигналу D0:</text>
  <text x="520" y="430" font-size="12" fill="#c0392b" text-anchor="start">• V_A &gt; V_ref (без відбиття) ➔ V_D = LOW (0V)</text>
  <text x="520" y="453" font-size="12" fill="#27ae60" text-anchor="start">• V_A &lt; V_ref (є відбиття)     ➔ V_D = HIGH (5V)</text>
  <text x="520" y="476" font-size="12" fill="#1a1a1a" text-anchor="start">• R_pot дозволяє встановити поріг під контраст поверхні</text>
  <text x="520" y="499" font-size="12" fill="#6b7280" text-anchor="start">• Вихід D0 використовується для переривань мікроконтролера</text>
</svg>
