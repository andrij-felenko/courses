<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня перегородка корпусу TCRT5000 та оптична ізоляція</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Непрозорий суцільнолитий бар'єр блокує прямоточне світло й усуває паразитне засвічення</text>

  <!-- PANEL 1: WITHOUT BAFFLE -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Header -->
  <rect x="45" y="90" width="405" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="112" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Без перегородки: пряме засвічення</text>

  <!-- Panel 1 Sub-header Warning -->
  <rect x="65" y="140" width="365" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Паразитний оптичний пробій</text>
  <text x="247" y="177" font-size="12" fill="#c0392b" text-anchor="middle">Пряме світло викликає хибне спрацювання</text>

  <!-- Panel 1 Housing Body -->
  <rect x="85" y="215" width="325" height="185" rx="8" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="2"/>
  <rect x="115" y="235" width="265" height="135" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- IR LED (Discrete/Unshielded) -->
  <rect x="135" y="270" width="70" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="170" y="303" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ІЧ-діод</text>
  <text x="170" y="322" font-size="11" fill="#6b7280" text-anchor="middle">(LED)</text>

  <!-- Phototransistor (Discrete/Unshielded) -->
  <rect x="310" y="270" width="70" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="345" y="303" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фото-Т</text>
  <text x="345" y="322" font-size="11" fill="#6b7280" text-anchor="middle">(приймач)</text>

  <!-- Direct Ray Path (Unblocked Red Arrow) -->
  <line x1="205" y1="305" x2="300" y2="305" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-red)"/>
  <rect x="215" y="260" width="85" height="24" rx="4" fill="#c0392b"/>
  <text x="257" y="276" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Прямий потік</text>

  <!-- Panel 1 Bottom Card -->
  <rect x="45" y="420" width="405" height="65" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="443" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Світло вільно поширюється між відсіками</text>
  <text x="247" y="464" font-size="12" fill="#6b7280" text-anchor="middle">Потрібні зовнішні трубки або екрани для ізоляції</text>

  <!-- PANEL 2: TCRT5000 WITH INTERNAL BAFFLE -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Header -->
  <rect x="510" y="90" width="405" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="112" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Конструкція TCRT5000: перегородка</text>

  <!-- Reflected Object / Target -->
  <rect x="545" y="140" width="335" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="712" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Об'єкт виявлення / Відбивна поверхня</text>

  <!-- Rays for Panel 2 -->
  <!-- Emitted Ray (Blue) -->
  <line x1="597" y1="235" x2="650" y2="173" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="580" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Випромінювання</text>

  <!-- Reflected Ray (Green) -->
  <line x1="775" y1="173" x2="823" y2="230" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="845" y="195" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Відбитий промінь</text>

  <!-- TCRT5000 Housing Structure -->
  <rect x="535" y="215" width="355" height="185" rx="8" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>

  <!-- Left Channel Cavity (LED) -->
  <rect x="550" y="235" width="95" height="145" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Right Channel Cavity (Phototransistor) -->
  <rect x="780" y="235" width="95" height="145" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Central Opaque Baffle Badge/Label -->
  <rect x="655" y="230" width="115" height="44" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="712" y="247" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня</text>
  <text x="712" y="263" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">перегородка</text>

  <!-- IR LED Component (Inside Channel 1) -->
  <rect x="562" y="295" width="70" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="597" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ІЧ-діод</text>
  <text x="597" y="343" font-size="11" fill="#6b7280" text-anchor="middle">(LED)</text>

  <!-- Phototransistor Component (Inside Channel 2) -->
  <rect x="793" y="295" width="70" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="828" y="325" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фото-Т</text>
  <text x="828" y="343" font-size="11" fill="#6b7280" text-anchor="middle">(приймач)</text>

  <!-- Blocked Direct Ray (Internal Crosstalk Prevented) -->
  <line x1="632" y1="328" x2="672" y2="328" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="682" cy="328" r="10" fill="#c0392b"/>
  <line x1="678" y1="324" x2="686" y2="332" stroke="#ffffff" stroke-width="2"/>
  <line x1="686" y1="324" x2="678" y2="332" stroke="#ffffff" stroke-width="2"/>
  <rect x="652" y="348" width="121" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="364" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Шлях заблоковано!</text>

  <!-- Panel 2 Bottom Card -->
  <rect x="510" y="420" width="405" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="443" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Суцільнолитий корпус блокує прямий оптичний зв'язок</text>
  <text x="712" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">Приймач реагує виключно на відбите світло від об'єкта</text>
</svg>
