<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ispGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <text x="480" y="35" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle">Апаратна архітектура 3.1-Мп сенсора OV3640</text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Структура матриці QXGA, вбудованого ISP, мікроконтролера автофокусу та блоків регістрів 0x3000–0x3FFF</text>

  <!-- Left Column: Active Array & Analog Readout -->
  <g transform="translate(40, 80)" filter="url(#shadow2)">
    <rect width="260" height="400" rx="10" fill="url(#coreGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#4338ca"/>
    <text x="130" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Матриця та Аналоговий тракт</text>

    <!-- Sub-blocks -->
    <rect x="15" y="48" width="230" height="90" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="125" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">Матриця OmniPixel3-HS</text>
    <text x="125" y="90" font-family="monospace" font-size="11" fill="#a5b4fc" text-anchor="middle">2048 × 1536 (3.14 Мп)</text>
    <text x="125" y="110" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Розмір пікселя 1.75 мкм × 1.75 мкм</text>
    <text x="125" y="126" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Фільтр Байєра (RGGB) 1/4 дюйма</text>

    <rect x="15" y="150" width="230" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="125" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">Рядкові драйвери &amp; CDS</text>
    <text x="125" y="195" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Подвійна корельована вибірка шуму</text>

    <rect x="15" y="222" width="230" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="125" y="244" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">Колонкові АЦП (10-біт)</text>
    <text x="125" y="267" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Паралельне оцифрування 2048 стовпців</text>

    <rect x="15" y="294" width="230" height="90" rx="6" fill="#0f172a" stroke="#4f46e5"/>
    <text x="125" y="315" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">Тактовий блок та Dual-PLL</text>
    <text x="125" y="335" font-family="monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">Вхід: XVCLK (6..27 МГц)</text>
    <text x="125" y="353" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">PLL: SYSCLK до 108 МГц</text>
    <text x="125" y="371" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">PCLK: до 54 МГц на виході DVP</text>
  </g>

  <!-- Arrow Left -> Center -->
  <path d="M 305 240 L 335 240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="340,240 332,235 332,245" fill="#38bdf8"/>

  <!-- Middle Column: ISP Engine & Microcontroller -->
  <g transform="translate(345, 80)" filter="url(#shadow2)">
    <rect width="300" height="400" rx="10" fill="url(#ispGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="32" rx="10" fill="#047857"/>
    <text x="150" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Апаратний ISP та Контроль (0x3300)</text>

    <!-- ISP Components -->
    <rect x="15" y="45" width="270" height="36" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="135" y="67" font-family="system-ui, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">Калібрування чорного (BLC 0x301E)</text>

    <rect x="15" y="88" width="270" height="36" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="135" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">Корекція дефектів пікселів (DPC)</text>

    <rect x="15" y="131" width="270" height="36" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="135" y="153" font-family="system-ui, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">Корекція затінення об'єктива (LENC)</text>

    <rect x="15" y="174" width="270" height="36" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="135" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">Дебайєризація &amp; Фільтр шумів (De-noise)</text>

    <rect x="15" y="217" width="270" height="36" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="135" y="239" font-family="system-ui, sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">Матриця перетворення кольору (CCM)</text>

    <!-- Embedded AF MCU Sub-box -->
    <rect x="15" y="265" width="270" height="120" rx="6" fill="#111827" stroke="#d946ef" stroke-width="1.5"/>
    <text x="135" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">Вбудований MCU Автофокусу (0x3F00)</text>
    <text x="135" y="306" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">• Оцінка різкості за фільтром Собеля</text>
    <text x="135" y="324" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">• Керування приводом VCM через 10-бітний ЦАП</text>
    <text x="135" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">• Апаратний антидзвін (Anti-ringing shaper)</text>
    <text x="135" y="365" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle">AF_CMD / AF_STATUS Регістри</text>
  </g>

  <!-- Arrow Center -> Right -->
  <path d="M 650 240 L 680 240" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="685,240 677,235 677,245" fill="#38bdf8"/>

  <!-- Right Column: Control & Output Interface -->
  <g transform="translate(690, 80)" filter="url(#shadow2)">
    <rect width="230" height="400" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="32" rx="10" fill="#0284c7"/>
    <text x="115" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Інтерфейси та Керування</text>

    <!-- SCCB Module -->
    <rect x="15" y="48" width="200" height="110" rx="6" fill="#0f172a" stroke="#0ea5e9"/>
    <text x="115" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Шина SCCB (I2C Slave)</text>
    <text x="115" y="90" font-family="monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">16-біт адреса регістру</text>
    <text x="115" y="108" font-family="monospace" font-size="10" fill="#facc15" text-anchor="middle">Slave Addr: 0x78 / 0x79</text>
    <text x="115" y="126" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">SIO_C (SCL) до 400 кГц</text>
    <text x="115" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">SIO_D (SDA) двонаправлена</text>

    <!-- Output Formatter & FIFO -->
    <rect x="15" y="170" width="200" height="100" rx="6" fill="#0f172a" stroke="#3b82f6"/>
    <text x="115" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">Форматер та FIFO</text>
    <text x="115" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">RAW10, RGB565, YUV422</text>
    <text x="115" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Вбудоване масштабування</text>
    <text x="115" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">QXGA / 1080p / 720p / VGA</text>

    <!-- DVP Port -->
    <rect x="15" y="285" width="200" height="98" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="115" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">DVP Вихідні Сигнали</text>
    <text x="115" y="326" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">D[9:0] / D[7:0] паралельна</text>
    <text x="115" y="344" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">PCLK (тактовий сигнал)</text>
    <text x="115" y="362" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">HREF (рядок) / VSYNC (кадр)</text>
  </g>
</svg>