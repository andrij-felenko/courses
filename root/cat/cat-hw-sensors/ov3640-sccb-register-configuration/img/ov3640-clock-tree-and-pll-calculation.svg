<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="480" y="35" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle">Тактове дерево (Clock Tree) та розрахунок PLL сенсора OV3640</text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Синтез внутрішніх частот ядра SYSCLK, піксельного такту PCLK та розрахунок частоти кадрів</text>

  <!-- Flowchart Diagram: Clock Generation -->
  <g transform="translate(40, 80)">
    <!-- Stage 1: Input XVCLK -->
    <rect x="0" y="20" width="150" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow3)"/>
    <text x="75" y="47" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Вхідний XVCLK</text>
    <text x="75" y="67" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">6 .. 27 МГц</text>
    <text x="75" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(Типово: 24 МГц)</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 155 60 L 185 60" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <polygon points="190,60 182,55 182,65" fill="#38bdf8"/>

    <!-- Stage 2: Pre-Divider -->
    <rect x="195" y="20" width="160" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#shadow3)"/>
    <text x="275" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">Передподільник (Div)</text>
    <text x="275" y="65" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Регістр 0x3011[4:0]</text>
    <text x="275" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Коефіцієнт: 1 .. 32</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 360 60 L 390 60" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <polygon points="395,60 387,55 387,65" fill="#38bdf8"/>

    <!-- Stage 3: PLL Multiplier -->
    <rect x="400" y="20" width="170" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow3)"/>
    <text x="485" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="middle">Множник PLL (Mul)</text>
    <text x="485" y="65" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Регістр 0x3010[5:0]</text>
    <text x="485" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">VCO: 100 .. 250 МГц</text>

    <!-- Arrow 3 -> 4 -->
    <path d="M 575 60 L 605 60" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <polygon points="610,60 602,55 602,65" fill="#38bdf8"/>

    <!-- Stage 4: SYSCLK Root -->
    <rect x="615" y="20" width="150" height="80" rx="8" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#shadow3)"/>
    <text x="690" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">Частота Ядра SYSCLK</text>
    <text x="690" y="65" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">до 108 МГц</text>
    <text x="690" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Тактування ISP / DSP</text>

    <!-- Arrow 4 -> 5 -->
    <path d="M 770 60 L 800 60" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <polygon points="805,60 797,55 797,65" fill="#38bdf8"/>

    <!-- Stage 5: Output PCLK Divider -->
    <rect x="810" y="20" width="150" height="80" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#shadow3)"/>
    <text x="885" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">PCLK Divider</text>
    <text x="885" y="65" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Регістр 0x3012</text>
    <text x="885" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">PCLK: 12 .. 54 МГц</text>
  </g>

  <!-- Middle Formula Card -->
  <g transform="translate(40, 195)" filter="url(#shadow3)">
    <rect width="880" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Основні математичні співвідношення тактового тракту OV3640:</text>
    
    <text x="40" y="58" font-family="monospace" font-size="12" fill="#facc15">SYSCLK = (XVCLK / Pre_Div) * PLL_Mul</text>
    <text x="420" y="58" font-family="monospace" font-size="12" fill="#6ee7b7">PCLK = SYSCLK / PCLK_Divider</text>
    
    <text x="40" y="82" font-family="monospace" font-size="12" fill="#ec4899">FPS = PCLK / (HTS * VTS)</text>
    <text x="420" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">де HTS (Horizontal Total Size 0x380C) та VTS (Vertical Total Size 0x380E) включають Blanking інтервали.</text>
  </g>

  <!-- Bottom Table: Frame Rate Modes -->
  <g transform="translate(40, 310)" filter="url(#shadow3)">
    <rect width="880" height="185" rx="8" fill="#111827" stroke="#334155"/>
    <rect x="0" y="0" width="880" height="28" rx="8" fill="#1e293b"/>
    <text x="440" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Режими роздільної здатності та навантаження на шину мікроконтролера</text>

    <!-- Header Row -->
    <text x="80" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Режим</text>
    <text x="210" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Роздільна здатність</text>
    <text x="360" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Частота кадрів (FPS)</text>
    <text x="520" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Піксельний такт PCLK</text>
    <text x="740" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Пропускна здатність (YUV/RGB)</text>

    <!-- Row 1: QXGA -->
    <line x1="20" y1="58" x2="860" y2="58" stroke="#1f2937"/>
    <text x="80" y="78" font-family="monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">QXGA</text>
    <text x="210" y="78" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">2048 × 1536</text>
    <text x="360" y="78" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">15 fps</text>
    <text x="520" y="78" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">54.0 МГц</text>
    <text x="740" y="78" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">108 МБ/с (Тільки з JPEG / High-end MCU)</text>

    <!-- Row 2: 1080p -->
    <line x1="20" y1="88" x2="860" y2="88" stroke="#1f2937"/>
    <text x="80" y="108" font-family="monospace" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">1080p</text>
    <text x="210" y="108" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">1920 × 1080</text>
    <text x="360" y="108" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">20 fps</text>
    <text x="520" y="108" font-family="monospace" font-size="11" fill="#fb923c" text-anchor="middle">48.0 МГц</text>
    <text x="740" y="108" font-family="monospace" font-size="11" fill="#fb923c" text-anchor="middle">83 МБ/с (DMA Burst / PSRAM)</text>

    <!-- Row 3: 720p -->
    <line x1="20" y1="118" x2="860" y2="118" stroke="#1f2937"/>
    <text x="80" y="138" font-family="monospace" font-size="11" font-weight="700" fill="#facc15" text-anchor="middle">720p</text>
    <text x="210" y="138" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">1280 × 720</text>
    <text x="360" y="138" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">30 fps (Біннінг 2x2)</text>
    <text x="520" y="138" font-family="monospace" font-size="11" fill="#facc15" text-anchor="middle">36.0 МГц</text>
    <text x="740" y="138" font-family="monospace" font-size="11" fill="#facc15" text-anchor="middle">55 МБ/с (STM32F7 DCMI / ESP32)</text>

    <!-- Row 4: VGA -->
    <line x1="20" y1="148" x2="860" y2="148" stroke="#1f2937"/>
    <text x="80" y="168" font-family="monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">VGA</text>
    <text x="210" y="168" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">640 × 480</text>
    <text x="360" y="168" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">60 fps (Субдискретизація)</text>
    <text x="520" y="168" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">24.0 МГц</text>
    <text x="740" y="168" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">36.8 МБ/с (Стандартний відеопотік)</text>
  </g>
</svg>