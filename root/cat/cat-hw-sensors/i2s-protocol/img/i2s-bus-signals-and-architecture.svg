<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="master-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="slave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="12" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Архітектура та сигнальні лінії шини цифрового аудіо I2S (Inter-IC Sound)
  </text>
  <text x="480" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Синхронна передача нестисненого PCM-звуку між Master (процесор) та Slave (кодек / ЦАП / мікрофон)
  </text>

  <!-- Left Box: I2S Master -->
  <g transform="translate(50, 95)">
    <rect width="220" height="330" rx="8" fill="url(#master-grad)" filter="url(#shadow)"/>
    <text x="110" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      I2S Master (Хост)
    </text>
    <text x="110" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e0f2fe">
      MCU (ESP32, STM32, DSP)
    </text>

    <!-- Master Blocks -->
    <rect x="20" y="75" width="180" height="42" rx="4" fill="#0f172a" fill-opacity="0.5"/>
    <text x="110" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#facc15">
      Аудіо PLL / Генератор
    </text>

    <rect x="20" y="130" width="180" height="50" rx="4" fill="#0f172a" fill-opacity="0.5"/>
    <text x="110" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">
      DMA Контролер
    </text>
    <text x="110" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">
      Кільцеві буфери PCM
    </text>

    <text x="110" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      Формує сітку тактових
    </text>
    <text x="110" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      імпульсів SCK та кадрів WS
    </text>
  </g>

  <!-- Right Box: I2S Slave -->
  <g transform="translate(690, 95)">
    <rect width="220" height="330" rx="8" fill="url(#slave-grad)" filter="url(#shadow)"/>
    <text x="110" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      I2S Slave (Периферія)
    </text>
    <text x="110" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e0f2fe">
      Аудіо ЦАП (MAX98357) / Кодек
    </text>

    <!-- Slave Blocks -->
    <rect x="20" y="75" width="180" height="42" rx="4" fill="#0f172a" fill-opacity="0.5"/>
    <text x="110" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">
      Зсувний регістр вводу
    </text>

    <rect x="20" y="130" width="180" height="50" rx="4" fill="#0f172a" fill-opacity="0.5"/>
    <text x="110" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">
      ЦАП / Підсилювач
    </text>
    <text x="110" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#cbd5e1">
      Клас D / Сигма-дельта
    </text>

    <text x="110" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      Синхронізується за SCK
    </text>
    <text x="110" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      розділяє канали по WS
    </text>
  </g>

  <!-- Middle: Bus Lines -->
  <g transform="translate(270, 120)">
    <!-- Line 1: SCK / BCLK -->
    <g transform="translate(0, 0)">
      <path d="M 0 25 L 420 25" stroke="#38bdf8" stroke-width="3" fill="none"/>
      <polygon points="415,20 425,25 415,30" fill="#38bdf8"/>
      <rect x="110" y="8" width="200" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="210" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">SCK / BCLK (Bit Clock)</text>
      <text x="210" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Тактування кожного біта даних</text>
    </g>

    <!-- Line 2: WS / LRCLK -->
    <g transform="translate(0, 65)">
      <path d="M 0 25 L 420 25" stroke="#34d399" stroke-width="3" fill="none"/>
      <polygon points="415,20 425,25 415,30" fill="#34d399"/>
      <rect x="110" y="8" width="200" height="34" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="210" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">WS / LRCLK (Word Select)</text>
      <text x="210" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Вибір каналу: 0=Left, 1=Right</text>
    </g>

    <!-- Line 3: SD / SDATA -->
    <g transform="translate(0, 130)">
      <path d="M 0 25 L 420 25" stroke="#facc15" stroke-width="3" fill="none"/>
      <polygon points="415,20 425,25 415,30" fill="#facc15"/>
      <rect x="110" y="8" width="200" height="34" rx="4" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="210" y="25" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#facc15">SD / SDATA (Serial Data)</text>
      <text x="210" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Послідовні біти звуку (MSB first)</text>
    </g>

    <!-- Line 4: MCLK (Optional) -->
    <g transform="translate(0, 195)">
      <path d="M 0 25 L 420 25" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
      <polygon points="415,21 425,25 415,29" fill="#a78bfa"/>
      <rect x="110" y="8" width="200" height="34" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
      <text x="210" y="25" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#a78bfa">MCLK (Master Clock, опц.)</text>
      <text x="210" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">128..512 × fs для оверсемплінгу</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(50, 445)">
    <rect width="860" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
      Ключове правило полярності:
    </text>
    <text x="180" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      У стандарті Philips I2S низький рівень <tspan font-weight="700" fill="#34d399">WS = 0</tspan> завжди означає лівий канал (Left Channel),
    </text>
    <text x="20" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      а високий рівень <tspan font-weight="700" fill="#facc15">WS = 1</tspan> — правий канал (Right Channel). Це суворо відрізняє класичний I2S від формату Left-Justified.
    </text>
  </g>
</svg>