<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Ємнісний МЕМС-давач вологості BME280 та первинне перетворення</text>
  <text x="425" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Адсорбція молекул H₂O у полімерному діелектрику та формування 16-бітного коду adc_H</text>

  <!-- Left: Sensor cross section -->
  <rect x="35" y="85" width="370" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="220" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">Будова полімерної МЕМС-комірки</text>

  <!-- Gas permeable top electrode -->
  <rect x="65" y="145" width="310" height="25" rx="4" fill="#238636" stroke="#2ea043" stroke-width="1.5"/>
  <text x="220" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Пористий верхній електрод (газопроникний метал)</text>

  <!-- Water vapor molecules -->
  <circle cx="100" cy="133" r="5" fill="#58a6ff"/>
  <text x="110" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#79c0ff">H₂O</text>
  <circle cx="180" cy="130" r="5" fill="#58a6ff"/>
  <circle cx="260" cy="134" r="5" fill="#58a6ff"/>
  <circle cx="330" cy="131" r="5" fill="#58a6ff"/>

  <!-- Dielectric polymer layer -->
  <rect x="65" y="180" width="310" height="70" rx="4" fill="#1f242c" stroke="#d29922" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="220" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#d29922" text-anchor="middle">Вологочутливий полімер (ε ≈ 3.5 → 80)</text>
  <text x="220" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Ємність C = (ε · ε₀ · A) / d зростає при насиченні вологою</text>

  <!-- Bottom electrode -->
  <rect x="65" y="260" width="310" height="25" rx="4" fill="#388bfd" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="220" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Суцільний нижній базовий електрод</text>

  <!-- Silicon substrate -->
  <rect x="65" y="295" width="310" height="40" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="220" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Кремнієва підкладка МЕМС-чипа (Si Substrate)</text>

  <rect x="65" y="350" width="310" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">• Нелінійна характеристика: C(RH, T)</text>
  <text x="80" y="398" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Залежність діелектрика від температури</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Потребує математичної корекції за t_fine</text>

  <!-- Right: ASIC signal chain -->
  <rect x="435" y="85" width="380" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="625" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">Оцифрування сигналу в ASIC</text>

  <rect x="465" y="145" width="320" height="55" rx="6" fill="#21262d" stroke="#388bfd" stroke-width="1.5"/>
  <text x="625" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">Модулятор ємності в напругу (C/V Converter)</text>
  <text x="625" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Перезаряд фіксованим струмом високої лінійності</text>

  <line x1="625" y1="200" x2="625" y2="225" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="465" y="225" width="320" height="55" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="625" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">16-біт Сигма-Дельта АЦП (Σ-Δ ADC)</text>
  <text x="625" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Оверсемплінг x1, x2, x4, x8 або x16 (регістр 0xF2 ctrl_hum)</text>

  <line x1="625" y1="280" x2="625" y2="305" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="465" y="305" width="320" height="65" rx="6" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="625" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">Вихідні регістри: 0xFD (MSB) та 0xFE (LSB)</text>
  <text x="625" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">adc_H = (data[0] &lt;&lt; 8) | data[1] (16 біт без знаку)</text>

  <rect x="465" y="385" width="320" height="45" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="625" y="413" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">УВАГА: Значення adc_H не є відсотками RH без калібрування!</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>