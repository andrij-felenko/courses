<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Матеріальне виконання оптичних призм та хімічна стійкість
  </text>

  <!-- 1. Полісульфон (PSU) -->
  <g transform="translate(50, 85)">
    <rect width="230" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff">
      Полісульфон (PSU)
    </text>
    <text x="115" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
      n = 1.63 | -20...+85 °C
    </text>

    <!-- Схема конуса -->
    <polygon points="65,75 165,75 115,145" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
    <text x="115" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#79c0ff">Amber PSU</text>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Сумісність:</text>
    <text x="20" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Питна вода, антифриз</text>
    <text x="20" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Моторні оливи, паливо</text>
    <text x="20" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Розбавлені кислоти</text>

    <text x="20" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Нестійкий:</text>
    <text x="20" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Ацетон, толуол, естери</text>
    <text x="20" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Хлоровані розчинники</text>
  </g>

  <!-- 2. Гриламід (Grilamid TR55) -->
  <g transform="translate(310, 85)">
    <rect width="230" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#3fb950">
      Гриламід (Grilamid)
    </text>
    <text x="115" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
      n = 1.58 | -40...+125 °C
    </text>

    <!-- Схема конуса -->
    <polygon points="65,75 165,75 115,145" fill="#1b4721" stroke="#3fb950" stroke-width="2"/>
    <text x="115" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7ee787">Clear Grilamid</text>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Сумісність:</text>
    <text x="20" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Гальмівна рідина DOT4/5</text>
    <text x="20" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Гідравлічні масла</text>
    <text x="20" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Спирти, гліколі</text>

    <text x="20" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Нестійкий:</text>
    <text x="20" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Концентровані кислоти</text>
    <text x="20" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Феноли</text>
  </g>

  <!-- 3. Сапфір / Скло + Сталь 316L -->
  <g transform="translate(570, 85)">
    <rect width="230" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f0883e">
      Сапфір / Боросилікат
    </text>
    <text x="115" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
      n = 1.76 | -40...+140 °C | 100 бар
    </text>

    <!-- Схема конуса -->
    <polygon points="65,75 165,75 115,145" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="115" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f2cc60">Sapphire / 316L</text>

    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Сумісність:</text>
    <text x="20" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Абсолютно всі розчинники</text>
    <text x="20" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Фармацевтика, CIP-мийка</text>
    <text x="20" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Надвисокий тиск (до 100 бар)</text>

    <text x="20" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Обмеження:</text>
    <text x="20" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Плавикова кислота (HF)</text>
    <text x="20" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Вища вартість</text>
  </g>
</svg>