<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Вбудований нагрівач сенсорів Sensirion SHT: Де-конденсація та регенерація</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Фізичні механізми випаровування конденсату, відновлення полімеру після дрейфу та самодіагностика</text>

  <!-- 3 Секції функцій нагрівача -->
  <g transform="translate(30, 85)">
    <!-- 1. Де-конденсація (De-condensation) -->
    <rect x="10" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="28" cy="26" r="6" fill="#58a6ff"/>
    <text x="42" y="31" fill="#f0f6fc" font-size="13" font-weight="700">1. Захист від роси й конденсату</text>

    <!-- Схема крапель та випаровування -->
    <g transform="translate(30, 55)">
      <rect x="10" y="15" width="220" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      
      <!-- Полімерна матриця -->
      <rect x="25" y="55" width="190" height="30" fill="#1f2937" stroke="#3fb950" stroke-width="1.2"/>
      <text x="120" y="74" fill="#3fb950" font-size="10" text-anchor="middle">Полімерний сенсор RH</text>

      <!-- Краплі води на поверхні -->
      <circle cx="65" cy="45" r="7" fill="#58a6ff"/>
      <circle cx="115" cy="42" r="9" fill="#58a6ff"/>
      <circle cx="165" cy="46" r="6" fill="#58a6ff"/>

      <!-- Хвилі випаровування при нагріві -->
      <path d="M 65 35 Q 60 25 65 15" stroke="#f0883e" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
      <path d="M 115 30 Q 110 20 115 10" stroke="#f0883e" stroke-width="2" fill="none" stroke-dasharray="3,2"/>
      <path d="M 165 35 Q 160 25 165 15" stroke="#f0883e" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
    </g>

    <text x="25" y="175" fill="#f0f6fc" font-size="11" font-weight="600">Проблема:</text>
    <text x="25" y="195" fill="#8b949e" font-size="10">• При 100% вологості (туман, роса) рідка вода</text>
    <text x="25" y="210" fill="#8b949e" font-size="10">  затоплює пори полімеру. Сенсор "залипає"</text>
    <text x="25" y="225" fill="#ff7b72" font-size="10">  на значенні 100% RH на години навіть після спаду!</text>

    <text x="25" y="250" fill="#3fb950" font-size="11" font-weight="600">Рішення нагрівачем:</text>
    <text x="25" y="270" fill="#c9d1d9" font-size="10">• Короткий імпульс нагріву (200 мВт на 1 с)</text>
    <text x="25" y="285" fill="#3fb950" font-size="10">• Миттєво випаровує рідку плівку води</text>
    <text x="25" y="300" fill="#c9d1d9" font-size="10">• Повертає датчик у робочий стан за секунди</text>

    <!-- 2. Регенерація після хімічного дрейфу (Creep Recovery) -->
    <rect x="310" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="310" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="328" cy="26" r="6" fill="#e3b341"/>
    <text x="342" y="31" fill="#f0f6fc" font-size="13" font-weight="700">2. Регенерація після VOC / Дрейфу</text>

    <g transform="translate(330, 55)">
      <rect x="10" y="15" width="220" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <rect x="25" y="55" width="190" height="30" fill="#1f2937" stroke="#e3b341" stroke-width="1.2"/>
      <text x="120" y="74" fill="#e3b341" font-size="10" text-anchor="middle">Полімер після випарів лаку</text>

      <!-- Молекули летких органічних речовин (VOC) -->
      <circle cx="55" cy="35" r="5" fill="#a371f7"/>
      <circle cx="95" cy="40" r="5" fill="#a371f7"/>
      <circle cx="145" cy="33" r="5" fill="#a371f7"/>
      <circle cx="185" cy="38" r="5" fill="#a371f7"/>
      <text x="120" y="20" fill="#a371f7" font-size="9" text-anchor="middle">Пари розчинників / Флюс</text>
    </g>

    <text x="325" y="175" fill="#f0f6fc" font-size="11" font-weight="600">Проблема «повзучості» (Creep):</text>
    <text x="325" y="195" fill="#8b949e" font-size="10">• Тривала дія спиртів, клеїв, лаків на платі</text>
    <text x="325" y="210" fill="#8b949e" font-size="10">  або високої вологості (>80% RH понад тиждень)</text>
    <text x="325" y="225" fill="#ff7b72" font-size="10">  викликає зсув калібрування на 2...5% RH.</text>

    <text x="325" y="250" fill="#e3b341" font-size="11" font-weight="600">Процедура випалу (Bake):</text>
    <text x="325" y="270" fill="#c9d1d9" font-size="10">• Прогрів кристала до 100...120 °C на кілька годин</text>
    <text x="325" y="285" fill="#3fb950" font-size="10">• Повне випаровування леткої органіки</text>
    <text x="325" y="300" fill="#c9d1d9" font-size="10">• 100% відновлення заводської точності</text>

    <!-- 3. Апаратна самодіагностика (Built-in Self Test) -->
    <rect x="610" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="610" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="628" cy="26" r="6" fill="#3fb950"/>
    <text x="642" y="31" fill="#f0f6fc" font-size="13" font-weight="700">3. Апаратний самотест (Self-Test)</text>

    <g transform="translate(630, 55)">
      <rect x="10" y="15" width="220" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="120" y="35" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Контрольований сплеск:</text>
      <text x="120" y="55" fill="#ff7b72" font-size="11" font-family="Consolas, monospace">ΔT = +3.5...5.0 °C</text>
      <text x="120" y="75" fill="#58a6ff" font-size="11" font-family="Consolas, monospace">ΔRH = -15...-25 %</text>
      <text x="120" y="95" fill="#8b949e" font-size="9" text-anchor="middle">Зворотний зв'язок за 100 мс</text>
    </g>

    <text x="625" y="175" fill="#f0f6fc" font-size="11" font-weight="600">Перевірка працездатності в полі:</text>
    <text x="625" y="195" fill="#c9d1d9" font-size="10">• Дозволяє перевірити цілісність сенсора</text>
    <text x="625" y="210" fill="#c9d1d9" font-size="10">  дистанційно, без доступу людини до приладу.</text>
    <text x="625" y="225" fill="#3fb950" font-size="10">• Якщо при ввімкненні нагрівача температура</text>
    <text x="625" y="240" fill="#3fb950" font-size="10">  не зросла — сенсор пошкоджено або закрито брудом.</text>
    
    <text x="625" y="265" fill="#e3b341" font-size="11" font-weight="600">Профілі нагріву SHT4x:</text>
    <text x="625" y="285" fill="#8b949e" font-size="10">• High: 200 мВт (1 с / 0.1 с)</text>
    <text x="625" y="300" fill="#8b949e" font-size="10">• Medium: 110 мВт (1 с / 0.1 с)</text>
    <text x="625" y="315" fill="#8b949e" font-size="10">• Low: 20 мВт (1 с / 0.1 с)</text>
  </g>

  <!-- Підвал -->
  <g transform="translate(30, 435)">
    <rect width="900" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ПРАВИЛО ЗАСТОСУВАННЯ НАГРІВАЧА В БАТАРЕЙНИХ СИСТЕМАХ:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Нагрівач споживає потужність 20–200 мВт, тому його вмикають виключно імпульсно за спеціальним алгоритмом
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • (наприклад, 1 раз на добу або лише при фіксації RH > 98% понад 15 хвилин), щоб не розряджати автономне джерело живлення.
    </text>
  </g>
</svg>
