<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Протокол обміну I2C та верифікація контрольної суми CRC-8 сенсорів Sensirion SHT</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Структура пакетів передачі даних, поліном CRC-8 (0x31) та математичні формули розрахунку</text>

  <!-- Схема I2C пакетів -->
  <g transform="translate(40, 85)">
    <!-- 1. Запит вимірювання (I2C Write Command) -->
    <rect x="10" y="10" width="860" height="75" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="25" y="32" fill="#58a6ff" font-size="12" font-weight="700">1. Запуск перетворення (I2C Master Write):</text>
    
    <!-- Байти транзакції Write -->
    <g transform="translate(25, 42)">
      <!-- START -->
      <rect x="0" y="0" width="45" height="30" rx="3" fill="#238636"/>
      <text x="22" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">START</text>

      <!-- Адреса I2C + W -->
      <rect x="52" y="0" width="130" height="30" rx="3" fill="#1f2937" stroke="#58a6ff"/>
      <text x="117" y="19" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">Addr 0x44 + W (0)</text>

      <!-- ACK -->
      <rect x="188" y="0" width="40" height="30" rx="3" fill="#21262d"/>
      <text x="208" y="19" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">ACK</text>

      <!-- Команда вимірювання (0xFD для SHT4x або 0x2400 для SHT3x) -->
      <rect x="235" y="0" width="220" height="30" rx="3" fill="#1f2937" stroke="#e3b341"/>
      <text x="345" y="19" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Команда: 0xFD (High Precision)</text>

      <!-- ACK -->
      <rect x="462" y="0" width="40" height="30" rx="3" fill="#21262d"/>
      <text x="482" y="19" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">ACK</text>

      <!-- STOP -->
      <rect x="509" y="0" width="45" height="30" rx="3" fill="#da3633"/>
      <text x="531" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">STOP</text>

      <!-- Час очікування t_meas -->
      <rect x="575" y="0" width="260" height="30" rx="3" fill="#0d1117" stroke="#8b949e" stroke-dasharray="4,2"/>
      <text x="705" y="19" fill="#8b949e" font-size="11" text-anchor="middle">Очікування перетворення: 8.2 мс</text>
    </g>

    <!-- 2. Зчитування 6 байтів результату (I2C Master Read) -->
    <rect x="10" y="95" width="860" height="115" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="25" y="117" fill="#3fb950" font-size="12" font-weight="700">2. Зчитування даних із сенсора (I2C Master Read, 6 байтів):</text>

    <!-- Пакети з даними -->
    <g transform="translate(25, 130)">
      <!-- Байт 1: Temp MSB -->
      <rect x="0" y="0" width="105" height="42" rx="4" fill="#1f2937" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="52" y="18" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">Байт 0</text>
      <text x="52" y="34" fill="#f0f6fc" font-size="10" text-anchor="middle">Temp [15:8]</text>

      <!-- Байт 2: Temp LSB -->
      <rect x="110" y="0" width="105" height="42" rx="4" fill="#1f2937" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="162" y="18" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">Байт 1</text>
      <text x="162" y="34" fill="#f0f6fc" font-size="10" text-anchor="middle">Temp [7:0]</text>

      <!-- Байт 3: Temp CRC-8 -->
      <rect x="220" y="0" width="105" height="42" rx="4" fill="#2d1619" stroke="#ff7b72" stroke-width="1.5"/>
      <text x="272" y="18" fill="#ff7b72" font-size="10" font-weight="700" text-anchor="middle">Байт 2</text>
      <text x="272" y="34" fill="#ff7b72" font-size="10" font-weight="700" text-anchor="middle">CRC-8 Temp</text>

      <!-- Байт 4: RH MSB -->
      <rect x="345" y="0" width="105" height="42" rx="4" fill="#1f2937" stroke="#3fb950" stroke-width="1.2"/>
      <text x="397" y="18" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">Байт 3</text>
      <text x="397" y="34" fill="#f0f6fc" font-size="10" text-anchor="middle">RH [15:8]</text>

      <!-- Байт 5: RH LSB -->
      <rect x="455" y="0" width="105" height="42" rx="4" fill="#1f2937" stroke="#3fb950" stroke-width="1.2"/>
      <text x="507" y="18" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">Байт 4</text>
      <text x="507" y="34" fill="#f0f6fc" font-size="10" text-anchor="middle">RH [7:0]</text>

      <!-- Байт 6: RH CRC-8 -->
      <rect x="565" y="0" width="105" height="42" rx="4" fill="#2d1619" stroke="#ff7b72" stroke-width="1.5"/>
      <text x="617" y="18" fill="#ff7b72" font-size="10" font-weight="700" text-anchor="middle">Байт 5</text>
      <text x="617" y="34" fill="#ff7b72" font-size="10" font-weight="700" text-anchor="middle">CRC-8 RH</text>

      <!-- NACK + STOP -->
      <rect x="690" y="5" width="135" height="32" rx="4" fill="#21262d"/>
      <text x="757" y="25" fill="#8b949e" font-size="10" text-anchor="middle">NACK від Master + STOP</text>
    </g>

    <text x="25" y="198" fill="#ff7b72" font-size="10">Кожні 2 байти значущих даних мають окремий 8-бітний байт контрольної суми CRC!</text>

    <!-- 3. Алгоритм CRC-8 та математичні формули -->
    <g transform="translate(10, 220)">
      <!-- Блок CRC-8 -->
      <rect x="0" y="0" width="415" height="110" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.2"/>
      <text x="15" y="22" fill="#e3b341" font-size="11" font-weight="700">Параметри полінома Sensirion CRC-8:</text>
      <text x="15" y="42" fill="#f0f6fc" font-size="11" font-family="Consolas, monospace">• Поліном: 0x31 (x⁸ + x⁵ + x⁴ + 1)</text>
      <text x="15" y="60" fill="#f0f6fc" font-size="11" font-family="Consolas, monospace">• Початкове значення (Init): 0xFF</text>
      <text x="15" y="78" fill="#f0f6fc" font-size="11" font-family="Consolas, monospace">• Final XOR: 0x00</text>
      <text x="15" y="98" fill="#8b949e" font-size="10">Забезпечує 100% виявлення одиночних та подвійних бітових помилок I2C</text>

      <!-- Блок Формул перетворення -->
      <rect x="435" y="0" width="425" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
      <text x="450" y="22" fill="#3fb950" font-size="11" font-weight="700">Формули розрахунку фізичних величин (SHT4x):</text>
      
      <text x="450" y="48" fill="#58a6ff" font-size="12" font-family="Consolas, monospace">
        T [°C] = -45.0 + 175.0 × (S_T / 65535.0)
      </text>
      <text x="450" y="74" fill="#3fb950" font-size="12" font-family="Consolas, monospace">
        RH [%] = -6.0 + 125.0 × (S_RH / 65535.0)
      </text>
      <text x="450" y="98" fill="#8b949e" font-size="10">Значення RH програмно обмежується (clamp) інтервалом 0...100%</text>
    </g>
  </g>

  <!-- Підвал -->
  <g transform="translate(40, 435)">
    <rect width="880" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ОСОБЛИВОСТІ ТАКТУВАННЯ I2C У ДАТЧИКАХ SENSIRION:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Сенсори підтримують стандартну шину 100 кГц та Fast Mode 400 кГц. В нових серіях SHT4x відмовилися від Clock Stretching.
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • Мікроконтролер виконує неблокуючу затримку або опитує готовність датчика за допомогою повторних спроб I2C ACK.
    </text>
  </g>
</svg>
