<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Архітектура кристалів та технології сенсорів: Sensirion CMOSens vs Bosch MEMS</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Порівняння кремнієвих структур SHT4x (ємнісний полімер) та BME280 (тиск, вологість, температура)</text>

  <!-- Схема порівняння (2 колонки) -->
  <g transform="translate(40, 85)">
    <!-- Блок Sensirion SHT4x -->
    <rect x="10" y="10" width="415" height="325" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="10" y="10" width="415" height="32" rx="8" fill="#21262d"/>
    <circle cx="28" cy="26" r="6" fill="#58a6ff"/>
    <text x="42" y="31" fill="#f0f6fc" font-size="13" font-weight="700">Sensirion SHT4x (Технологія CMOSens)</text>

    <!-- Корпус DFN-4 розріз -->
    <g transform="translate(25, 55)">
      <!-- Корпус DFN -->
      <rect x="20" y="10" width="345" height="110" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <rect x="135" y="6" width="115" height="12" fill="#58a6ff" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
      <text x="192" y="15" fill="#58a6ff" font-size="9" text-anchor="middle">Отвір вентиляції (PTFE фільтр)</text>

      <!-- Ємнісний полімерний шар (Comb electrodes) -->
      <rect x="50" y="25" width="135" height="30" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
      <line x1="60" y1="35" x2="175" y2="35" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,2"/>
      <line x1="60" y1="45" x2="175" y2="45" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,2"/>
      <text x="117" y="44" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle">Ємнісний полімер RH</text>

      <!-- Нагрівач PTC де-конденсації -->
      <rect x="50" y="60" width="135" height="15" fill="#2d1619" stroke="#ff7b72" stroke-width="1"/>
      <text x="117" y="71" fill="#ff7b72" font-size="9" text-anchor="middle">Вбудований нагрівач Heater</text>

      <!-- Датчик температури Bandgap -->
      <rect x="50" y="80" width="135" height="25" fill="#1c2d1f" stroke="#e3b341" stroke-width="1"/>
      <text x="117" y="96" fill="#e3b341" font-size="9" font-weight="700" text-anchor="middle">Bandgap Temp кремній</text>

      <!-- Вбудований цифровий AFE + DSP ядро -->
      <rect x="205" y="25" width="145" height="80" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="277" y="45" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">Цифровий ASIC</text>
      <text x="277" y="62" fill="#8b949e" font-size="9" text-anchor="middle">16-біт Delta-Sigma АЦП</text>
      <text x="277" y="78" fill="#8b949e" font-size="9" text-anchor="middle">I2C логіка + CRC-8 блок</text>
      <text x="277" y="94" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle">Готовий лінійний вихід</text>
    </g>

    <text x="25" y="195" fill="#58a6ff" font-size="11" font-weight="700">Особливості архітектури SHT4x:</text>
    <text x="25" y="215" fill="#c9d1d9" font-size="10">• Все на одному монолітному кристалі (Monolithic SoC)</text>
    <text x="25" y="232" fill="#c9d1d9" font-size="10">• Не потребує калібрувальних формул на МК: видає відсотки</text>
    <text x="25" y="249" fill="#3fb950" font-size="10">• Рекордна точність: ±1.0% RH та ±0.1 °C (версія SHT45)</text>
    <text x="25" y="266" fill="#3fb950" font-size="10">• Струм споживання: 0.4 мкА (у сплячому режимі 0.08 мкА)</text>
    <text x="25" y="283" fill="#8b949e" font-size="10">• Застосування: медичні апарати ШВЛ, метеостанції, інкубатори</text>

    <!-- Блок Bosch BME280 -->
    <rect x="455" y="10" width="415" height="325" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="455" y="10" width="415" height="32" rx="8" fill="#21262d"/>
    <circle cx="473" cy="26" r="6" fill="#3fb950"/>
    <text x="487" y="31" fill="#f0f6fc" font-size="13" font-weight="700">Bosch Sensortec BME280 (Комбо MEMS)</text>

    <!-- Корпус LGA-8 розріз -->
    <g transform="translate(470, 55)">
      <rect x="20" y="10" width="345" height="110" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <rect x="135" y="6" width="115" height="12" fill="#d2a8ff" fill-opacity="0.2" stroke="#d2a8ff" stroke-width="1"/>
      <text x="192" y="15" fill="#d2a8ff" font-size="9" text-anchor="middle">Металева кришка з отвором</text>

      <!-- МЕМС мембрана тиску (вакуумна камера) -->
      <rect x="40" y="25" width="105" height="40" rx="3" fill="#1f2937" stroke="#d2a8ff" stroke-width="1.2"/>
      <ellipse cx="92" cy="45" rx="35" ry="10" fill="#0d1117" stroke="#d2a8ff" stroke-width="1"/>
      <text x="92" y="49" fill="#d2a8ff" font-size="9" font-weight="700" text-anchor="middle">Тиск (MEMS)</text>

      <!-- Сенсори RH + T -->
      <rect x="40" y="70" width="105" height="35" rx="3" fill="#1c2d1f" stroke="#3fb950" stroke-width="1.2"/>
      <text x="92" y="85" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle">Вологість RH</text>
      <text x="92" y="99" fill="#e3b341" font-size="8" text-anchor="middle">Bandgap Temp T</text>

      <!-- Блок ASIC з NVM коефіцієнтами калібрування -->
      <rect x="160" y="25" width="190" height="80" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
      <text x="255" y="45" fill="#f0f6fc" font-size="10" font-weight="700" text-anchor="middle">ASIC + NVM Trimming</text>
      <text x="255" y="62" fill="#ff7b72" font-size="9" text-anchor="middle">Видає «сирі» коди АЦП 20 біт</text>
      <text x="255" y="78" fill="#8b949e" font-size="9" text-anchor="middle">24 регістри калібрування dig_T/P/H</text>
      <text x="255" y="94" fill="#e3b341" font-size="9" font-weight="700" text-anchor="middle">Формули компенсації на МК</text>
    </g>

    <text x="470" y="195" fill="#3fb950" font-size="11" font-weight="700">Особливості архітектури BME280:</text>
    <text x="470" y="215" fill="#c9d1d9" font-size="10">• 3-в-1: тиск, вологість та температура в одному чіпі 2.5×2.5 мм</text>
    <text x="470" y="232" fill="#ff7b72" font-size="10">• Складна математика компенсації: вимагає розрахунку на MCU</text>
    <text x="470" y="249" fill="#3fb950" font-size="10">• Висока швидкість опитування (до 157 Гц) та IIR-фільтрація</text>
    <text x="470" y="266" fill="#c9d1d9" font-size="10">• Підтримка інтерфейсів I2C та SPI (до 10 МГц)</text>
    <text x="470" y="283" fill="#8b949e" font-size="10">• Застосування: смартфони, дрони, портативні висотоміри, трекери</text>
  </g>

  <!-- Підвал -->
  <g transform="translate(40, 435)">
    <rect width="870" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ФУНДАМЕНТАЛЬНА РІЗНИЦЯ ПІДХОДІВ SENSIRION ТА BOSCH:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Sensirion: фокус на максимальній точності та довготривалій стабільності вологості; готовий лінійний результат без навантаження на процесор.
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • Bosch: фокус на багатофункціональності (наявність барометра) та мобільній електроніці; потребує бібліотеки розрахунку коефіцієнтів.
    </text>
  </g>
</svg>
