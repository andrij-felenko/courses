<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Інженерна матриця вибору цифрових датчиків Sensirion та Bosch</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Порівняння сімейств SHT3x, SHT4x, BME280, BME680 та BMP581 за метрологією та енергоспоживанням</text>

  <!-- Таблиця (5 рядків чіпів) -->
  <g transform="translate(30, 85)">
    <!-- Шапка таблиці -->
    <rect x="0" y="0" width="900" height="40" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="110" y="25" fill="#f0f6fc" font-size="12" font-weight="700">Модель сенсора</text>
    <text x="280" y="25" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">Параметри виміру</text>
    <text x="450" y="25" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Точність (T / RH / P)</text>
    <text x="630" y="25" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">Інтерфейс та струм</text>
    <text x="810" y="25" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">Оптимальна галузь</text>

    <!-- Рядок 1: Sensirion SHT40 / SHT45 -->
    <rect x="0" y="44" width="900" height="58" fill="#161b22"/>
    <circle cx="20" cy="73" r="6" fill="#58a6ff"/>
    <text x="35" y="68" fill="#58a6ff" font-size="12" font-weight="700">Sensirion SHT4x</text>
    <text x="35" y="86" fill="#8b949e" font-size="10">DFN-4 (1.5 × 1.5 мм)</text>
    <text x="280" y="73" fill="#f0f6fc" font-size="11" text-anchor="middle">Температура + Вологість</text>
    <text x="450" y="66" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">±0.1 °C / ±1.0 % RH</text>
    <text x="450" y="84" fill="#8b949e" font-size="10" text-anchor="middle">(версія SHT45 еталонна)</text>
    <text x="630" y="66" fill="#e3b341" font-size="11" text-anchor="middle">I2C (до 1 МГц)</text>
    <text x="630" y="84" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">0.4 мкА (1 Гц) / 1.08..3.6 В</text>
    <text x="810" y="66" fill="#d2a8ff" font-size="11" text-anchor="middle">Медицина, лабораторії,</text>
    <text x="810" y="84" fill="#8b949e" font-size="10" text-anchor="middle">ультранизькоспоживаючий IoT</text>

    <!-- Рядок 2: Sensirion SHT30 / SHT31 / SHT35 -->
    <rect x="0" y="106" width="900" height="58" fill="#0d1117"/>
    <circle cx="20" cy="135" r="6" fill="#388bfd"/>
    <text x="35" y="130" fill="#79c0ff" font-size="12" font-weight="700">Sensirion SHT3x</text>
    <text x="35" y="148" fill="#8b949e" font-size="10">DFN-8 (2.5 × 2.5 мм)</text>
    <text x="280" y="135" fill="#f0f6fc" font-size="11" text-anchor="middle">Температура + Вологість</text>
    <text x="450" y="135" fill="#3fb950" font-size="11" text-anchor="middle">±0.2 °C / ±1.5 % RH</text>
    <text x="630" y="128" fill="#e3b341" font-size="11" text-anchor="middle">I2C (Alert pin / Reset)</text>
    <text x="630" y="146" fill="#8b949e" font-size="10" text-anchor="middle">1.7 мкА (1 Гц) / 2.15..5.5 В</text>
    <text x="810" y="128" fill="#d2a8ff" font-size="11" text-anchor="middle">Промислові контролери,</text>
    <text x="810" y="146" fill="#8b949e" font-size="10" text-anchor="middle">пряме живлення 5 В / 3.3 В</text>

    <!-- Рядок 3: Bosch BME280 -->
    <rect x="0" y="168" width="900" height="58" fill="#161b22"/>
    <circle cx="20" cy="197" r="6" fill="#3fb950"/>
    <text x="35" y="192" fill="#3fb950" font-size="12" font-weight="700">Bosch BME280</text>
    <text x="35" y="210" fill="#8b949e" font-size="10">LGA-8 (2.5 × 2.5 мм)</text>
    <text x="280" y="189" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">3-в-1: T + RH + Тиск</text>
    <text x="280" y="206" fill="#8b949e" font-size="10" text-anchor="middle">Барометрична висота</text>
    <text x="450" y="189" fill="#f0f6fc" font-size="11" text-anchor="middle">±0.5 °C / ±3.0 % RH</text>
    <text x="450" y="206" fill="#3fb950" font-size="11" text-anchor="middle">±1.0 гПа (±1 метр)</text>
    <text x="630" y="189" fill="#e3b341" font-size="11" text-anchor="middle">I2C / SPI (до 10 МГц)</text>
    <text x="630" y="206" fill="#8b949e" font-size="10" text-anchor="middle">3.6 мкА (1 Гц) / 1.71..3.6 В</text>
    <text x="810" y="189" fill="#d2a8ff" font-size="11" text-anchor="middle">Метеостанції, квадрокоптери,</text>
    <text x="810" y="206" fill="#8b949e" font-size="10" text-anchor="middle">смартфони, трекери</text>

    <!-- Рядок 4: Bosch BME680 / BME688 -->
    <rect x="0" y="230" width="900" height="58" fill="#0d1117"/>
    <circle cx="20" cy="259" r="6" fill="#f0883e"/>
    <text x="35" y="254" fill="#ffa657" font-size="12" font-weight="700">Bosch BME680/688</text>
    <text x="35" y="272" fill="#8b949e" font-size="10">LGA-8 (3.0 × 3.0 мм)</text>
    <text x="280" y="251" fill="#ffa657" font-size="11" font-weight="700" text-anchor="middle">4-в-1: T + RH + P + Газ</text>
    <text x="280" y="268" fill="#8b949e" font-size="10" text-anchor="middle">MOX сенсор летких VOC/IAQ</text>
    <text x="450" y="251" fill="#f0f6fc" font-size="11" text-anchor="middle">±0.5 °C / ±3.0 % RH</text>
    <text x="450" y="268" fill="#8b949e" font-size="10" text-anchor="middle">Індекс якості повітря IAQ</text>
    <text x="630" y="251" fill="#e3b341" font-size="11" text-anchor="middle">I2C / SPI</text>
    <text x="630" y="268" fill="#ff7b72" font-size="10" text-anchor="middle">До 12 мА (гаряча пластина)</text>
    <text x="810" y="251" fill="#d2a8ff" font-size="11" text-anchor="middle">Моніторинг якості повітря,</text>
    <text x="810" y="268" fill="#8b949e" font-size="10" text-anchor="middle">розумний дім, вентиляція</text>

    <!-- Рядок 5: Bosch BMP581 (Нове покоління барометрів) -->
    <rect x="0" y="292" width="900" height="52" fill="#161b22"/>
    <circle cx="20" cy="318" r="6" fill="#a371f7"/>
    <text x="35" y="313" fill="#d2a8ff" font-size="12" font-weight="700">Bosch BMP581</text>
    <text x="35" y="330" fill="#8b949e" font-size="10">LGA-8 (2.0 × 2.0 мм)</text>
    <text x="280" y="318" fill="#f0f6fc" font-size="11" text-anchor="middle">Прецизійний Тиск + Temp</text>
    <text x="450" y="311" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">±0.06 гПа (±6 см висоти!)</text>
    <text x="450" y="328" fill="#8b949e" font-size="10" text-anchor="middle">Рівень шуму RMS &lt; 0.08 Па</text>
    <text x="630" y="318" fill="#e3b341" font-size="11" text-anchor="middle">I2C / SPI / I3C</text>
    <text x="810" y="311" fill="#d2a8ff" font-size="11" text-anchor="middle">GPS висотоміри, дрони,</text>
    <text x="810" y="328" fill="#8b949e" font-size="10" text-anchor="middle">навігація поверхами будівель</text>
  </g>

  <!-- Підсумок внизу -->
  <g transform="translate(30, 445)">
    <rect width="900" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="24" fill="#58a6ff" font-size="12" font-weight="700">ГОЛОВНИЙ КРИТЕРІЙ ВИБОРУ МІЖ БРЕНДАМИ:</text>
    <text x="20" y="45" fill="#f0f6fc" font-size="11">
      Потрібна найвища точність вологості та простота прошивки: Sensirion SHT4x. Потрібен барометричний тиск/висота в тому самому корпусі: Bosch BME280.
    </text>
  </g>
</svg>
