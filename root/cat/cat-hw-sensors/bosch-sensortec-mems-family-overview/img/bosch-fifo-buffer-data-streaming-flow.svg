<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Апаратний буфер FIFO та пакетна передача даних (BMP388/390/581)</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Зменшення кількості пробуджень головного процесора та виключення пропуску відліків</text>

  <!-- Left: Sensor FIFO Hardware -->
  <g transform="translate(60, 95)">
    <rect width="380" height="340" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect width="380" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="190" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">Внутрішній буфер FIFO сенсора (512 байт)</text>

    <!-- FIFO Queue Visualization -->
    <rect x="25" y="55" width="330" height="150" rx="6" fill="#0d1117" stroke="#30363d"/>
    
    <!-- Frames -->
    <rect x="40" y="70" width="300" height="25" rx="3" fill="#1f6feb" fill-opacity="0.3" stroke="#58a6ff"/>
    <text x="190" y="87" font-family="monospace" font-size="10" fill="#f0f6fc" text-anchor="middle">Кадр [i]: Заголовок + P (3 байта) + T (3 байта)</text>

    <rect x="40" y="102" width="300" height="25" rx="3" fill="#1f6feb" fill-opacity="0.3" stroke="#58a6ff"/>
    <text x="190" y="119" font-family="monospace" font-size="10" fill="#f0f6fc" text-anchor="middle">Кадр [i+1]: Заголовок + P + T</text>

    <rect x="40" y="134" width="300" height="25" rx="3" fill="#d29922" fill-opacity="0.3" stroke="#d29922"/>
    <text x="190" y="151" font-family="monospace" font-size="10" fill="#d29922" text-anchor="middle">Кадр часу: Sensor Time Sync (3 байти)</text>

    <text x="190" y="185" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">Вміщує до 73 повних кадрів тиску й температури</text>

    <!-- Watermark Interrupt -->
    <rect x="25" y="220" width="330" height="95" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="245" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149">Апаратне переривання Watermark (INT):</text>
    <text x="35" y="265" font-family="sans-serif" font-size="10" fill="#8b949e">• Програмується рівень заповнення (наприклад, 400 Б).</text>
    <text x="35" y="282" font-family="sans-serif" font-size="10" fill="#8b949e">• При досягненні порогу пін INT піднімається у HIGH.</text>
    <text x="35" y="300" font-family="sans-serif" font-size="10" fill="#3fb950">• Жодного ризику переповнення буфера!</text>
  </g>

  <!-- Middle Connection Arrow -->
  <g transform="translate(450, 240)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#3fb950" stroke-width="3"/>
    <polygon points="50,0 40,-5 40,5" fill="#3fb950"/>
    <text x="25" y="-12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Burst SPI</text>
    <text x="25" y="20" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Пакетне читання</text>
  </g>

  <!-- Right: Host MCU Power Optimization -->
  <g transform="translate(510, 95)">
    <rect width="390" height="340" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="390" height="32" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="195" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">Енергоефективність мікроконтролера</text>

    <!-- Energy Comparison Chart -->
    <rect x="25" y="55" width="340" height="120" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="78" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149">Без FIFO (Постійні переривання 100 Гц):</text>
    <text x="35" y="96" font-family="sans-serif" font-size="10" fill="#8b949e">MCU прокидається 100 разів на секунду → батарея сідає</text>

    <text x="35" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950">З FIFO (Пакетне читання 1 раз на секунду):</text>
    <text x="35" y="145" font-family="sans-serif" font-size="10" fill="#f0f6fc">MCU спить 95% часу в Deep Sleep, читає 512 Б за 1 мс по SPI</text>
    <text x="35" y="162" font-family="sans-serif" font-size="10" fill="#3fb950">Заощадження заряду батареї: до 80%!</text>

    <!-- Real-time features -->
    <rect x="25" y="195" width="340" height="120" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="220" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc">Переваги для автопілотів (PX4 / Betaflight):</text>
    <text x="35" y="242" font-family="sans-serif" font-size="10" fill="#8b949e">• Жоден вимір не губиться, якщо CPU зайнятий моторами;</text>
    <text x="35" y="260" font-family="sans-serif" font-size="10" fill="#8b949e">• Вбудований Time-sync прив'язує тиск до таймера польоту;</text>
    <text x="35" y="280" font-family="sans-serif" font-size="10" fill="#8b949e">• DMA-читання без навантаження на обчислювальні ядра.</text>
  </g>
</svg>