<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Інженерна матриця вибору сенсорів родини Bosch Sensortec</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Порівняння параметрів, чутливості, інтерфейсів та цільового призначення чіпів</text>

  <!-- Table Grid -->
  <g transform="translate(40, 85)">
    <rect width="880" height="360" rx="8" fill="#161b22" stroke="#30363d"/>

    <!-- Header Row -->
    <rect x="0" y="0" width="880" height="40" rx="8" fill="#21262d"/>
    <text x="80" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Чіп</text>
    <text x="200" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Вимірювані величини</text>
    <text x="330" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Шум тиску / висоти</text>
    <text x="460" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Інтерфейс / FIFO</text>
    <text x="590" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Струм (1 Гц)</text>
    <text x="760" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Головне застосування</text>

    <!-- Row 1: BMP280 -->
    <g transform="translate(0, 40)">
      <line x1="0" y1="55" x2="880" y2="55" stroke="#30363d"/>
      <text x="80" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">BMP280</text>
      <text x="200" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Тиск (P) + Темп (T)</text>
      <text x="330" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">0.16 Па (±20 см)</text>
      <text x="460" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">I2C / SPI (без FIFO)</text>
      <text x="590" y="32" font-family="sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">2.7 мкА</text>
      <text x="760" y="32" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Бюджетні погодні вузли</text>
    </g>

    <!-- Row 2: BME280 -->
    <g transform="translate(0, 95)">
      <line x1="0" y1="55" x2="880" y2="55" stroke="#30363d"/>
      <text x="80" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">BME280</text>
      <text x="200" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Тиск + Темп + Вологість</text>
      <text x="330" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">0.16 Па (±20 см)</text>
      <text x="460" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">I2C / SPI (без FIFO)</text>
      <text x="590" y="32" font-family="sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">3.6 мкА</text>
      <text x="760" y="32" font-family="sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">Розумний дім, ОВіК, метео</text>
    </g>

    <!-- Row 3: BME680 / BME688 -->
    <g transform="translate(0, 150)">
      <line x1="0" y1="55" x2="880" y2="55" stroke="#30363d"/>
      <text x="80" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bc8cff" text-anchor="middle">BME688</text>
      <text x="200" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">P + T + RH + Газ (VOC)</text>
      <text x="200" y="42" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">+ ШІ класифікатор BSEC</text>
      <text x="330" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">0.12 Па (±15 см)</text>
      <text x="460" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">I2C / SPI (без FIFO)</text>
      <text x="590" y="25" font-family="sans-serif" font-size="11" fill="#d29922" text-anchor="middle">~0.1..12 мА</text>
      <text x="590" y="42" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">(імпульсний нагрів)</text>
      <text x="760" y="32" font-family="sans-serif" font-size="11" fill="#bc8cff" text-anchor="middle">Якість повітря (IAQ), безпека</text>
    </g>

    <!-- Row 4: BMP390 -->
    <g transform="translate(0, 205)">
      <line x1="0" y1="55" x2="880" y2="55" stroke="#30363d"/>
      <text x="80" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">BMP390</text>
      <text x="200" y="32" font-family="sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Тиск (P) + Темп (T)</text>
      <text x="330" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">0.05 Па (±5..8 см)</text>
      <text x="460" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">FIFO 512 Байт</text>
      <text x="460" y="42" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">I2C / SPI + INT пін</text>
      <text x="590" y="32" font-family="sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">3.2 мкА</text>
      <text x="760" y="32" font-family="sans-serif" font-size="11" fill="#d29922" text-anchor="middle">Дрони, висотоміри, альпінізм</text>
    </g>

    <!-- Row 5: BMP581 -->
    <g transform="translate(0, 260)">
      <text x="80" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">BMP581</text>
      <text x="200" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">Ємнісний P + T</text>
      <text x="200" y="42" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Нова технологія MEMS</text>
      <text x="330" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">0.015 Па (±1..2 см!)</text>
      <text x="460" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">FIFO 512 Байт</text>
      <text x="460" y="42" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">I2C / I3C / SPI</text>
      <text x="590" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">1.3 мкА</text>
      <text x="760" y="32" font-family="sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Смарт-годинники, VR-трекінг</text>
    </g>
  </g>
</svg>