<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Програмний стек Bosch BSEC та обчислення індексу IAQ</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Інтеграція сирих вимірів BME680/688 у високоточні показники якості повітря</text>

  <!-- Flowchart Layout -->
  <g transform="translate(60, 95)">
    <!-- Stage 1: Raw Sensor Inputs -->
    <rect x="0" y="30" width="190" height="240" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="0" y="30" width="190" height="30" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="95" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">1. Сирі дані з чіпа</text>

    <text x="15" y="85" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Температура T (°C)</text>
    <text x="15" y="115" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Атмосферний тиск P (Па)</text>
    <text x="15" y="145" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Вологість RH (%)</text>
    <text x="15" y="175" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Опір газу R_gas (Ом)</text>

    <text x="15" y="220" font-family="sans-serif" font-size="10" fill="#8b949e">Опитування за таймером</text>
    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#8b949e">(LP: 3 с, ULP: 300 с)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="150" x2="240" y2="150" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="240,150 230,145 230,155" fill="#58a6ff"/>

  <!-- Stage 2: BSEC Fusion Engine (Black Box) -->
  <g transform="translate(240, 20)">
    <rect width="360" height="260" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <rect width="360" height="32" rx="8" fill="#8957e5" fill-opacity="0.2"/>
    <text x="180" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">2. Алгоритмічне ядро Bosch BSEC (Lib)</text>

    <!-- Internal processing boxes -->
    <rect x="20" y="50" width="320" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="74" font-family="sans-serif" font-size="11" fill="#d2a8ff" text-anchor="middle">Компенсація самонагріву від гарячого MOX</text>

    <rect x="20" y="100" width="320" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="124" font-family="sans-serif" font-size="11" fill="#d2a8ff" text-anchor="middle">Нормалізація вологості та базової лінії газу</text>

    <rect x="20" y="150" width="320" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="180" y="174" font-family="sans-serif" font-size="11" fill="#d2a8ff" text-anchor="middle">ШІ класифікатор запахів / тренування (BME688)</text>

    <rect x="20" y="200" width="320" height="45" rx="4" fill="#8957e5" fill-opacity="0.15"/>
    <text x="180" y="222" font-family="sans-serif" font-size="10" font-weight="bold" fill="#bc8cff" text-anchor="middle">Енергонезалежне збереження стану (State Save)</text>
    <text x="180" y="236" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Автокалібрування фону чистим повітрям кожні кілька днів</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="150" x2="650" y2="150" stroke="#3fb950" stroke-width="2"/>
  <polygon points="650,150 640,145 640,155" fill="#3fb950"/>

  <!-- Stage 3: High-level Outputs -->
  <g transform="translate(650, 30)">
    <rect width="250" height="240" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="250" height="30" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="125" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">3. Фізичні виходи BSEC</text>

    <text x="15" y="85" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950">• IAQ (0 .. 500)</text>
    <text x="25" y="100" font-family="sans-serif" font-size="10" fill="#8b949e">Індекс якості повітря</text>

    <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#f0f6fc">• eCO2 (ppm)</text>
    <text x="25" y="140" font-family="sans-serif" font-size="10" fill="#8b949e">Еквівалент CO2 за леткістю</text>

    <text x="15" y="165" font-family="sans-serif" font-size="11" fill="#f0f6fc">• bVOC (ppm)</text>
    <text x="25" y="180" font-family="sans-serif" font-size="10" fill="#8b949e">Дихальні органічні сполуки</text>

    <text x="15" y="205" font-family="sans-serif" font-size="11" fill="#58a6ff">• T_comp та RH_comp</text>
    <text x="25" y="220" font-family="sans-serif" font-size="10" fill="#8b949e">Справжні температура й вологість</text>
  </g>

  <!-- Bottom IAQ Scale Bar -->
  <g transform="translate(60, 340)">
    <rect width="840" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="420" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Шкала індексу якості повітря (Indoor Air Quality, IAQ):</text>

    <!-- Segments -->
    <!-- 0-50 Excellent (Green) -->
    <rect x="30" y="40" width="150" height="25" fill="#238636"/>
    <text x="105" y="56" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">0..50 Відмінно</text>

    <!-- 51-100 Good (Yellow-Green) -->
    <rect x="185" y="40" width="150" height="25" fill="#2ea043"/>
    <text x="260" y="56" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">51..100 Добре</text>

    <!-- 101-150 Moderate (Yellow) -->
    <rect x="340" y="40" width="150" height="25" fill="#d29922"/>
    <text x="415" y="56" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">101..150 Помірно</text>

    <!-- 151-200 Poor (Orange) -->
    <rect x="495" y="40" width="150" height="25" fill="#db6d28"/>
    <text x="570" y="56" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">151..200 Погано</text>

    <!-- 201-300+ Unhealthy/Hazardous (Red/Purple) -->
    <rect x="650" y="40" width="160" height="25" fill="#da3633"/>
    <text x="730" y="56" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">201..500 Шкідливо</text>

    <text x="420" y="85" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">
      Автоматичне керування припливною вентиляцією, кондиціонерами та очищувачами повітря
    </text>
  </g>
</svg>