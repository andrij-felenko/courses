<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Барометричне нівелювання: перерахунок тиску у висоту (Гіпсометрична формула)</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Зв'язок між атмосферним тиском, висотою над рівнем моря та опорним тиском P0 (QNH)</text>

  <!-- Left: Atmosphere Profile Column -->
  <g transform="translate(60, 95)">
    <rect width="380" height="340" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect width="380" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="190" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">Профіль зміни тиску з висотою</text>

    <!-- Altitude Scale -->
    <line x1="50" y1="50" x2="50" y2="290" stroke="#30363d" stroke-width="2"/>
    
    <!-- Level 1: 0m Sea Level -->
    <circle cx="50" cy="270" r="5" fill="#3fb950"/>
    <line x1="50" y1="270" x2="350" y2="270" stroke="#3fb950" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="65" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Рівень моря: h = 0 м</text>
    <text x="65" y="280" font-family="monospace" font-size="10" fill="#8b949e">P0 = 1013.25 гПа (101325 Па)</text>

    <!-- Level 2: 1000m -->
    <circle cx="50" cy="180" r="5" fill="#58a6ff"/>
    <line x1="50" y1="180" x2="350" y2="180" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="65" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">Висота h = 1000 м</text>
    <text x="65" y="190" font-family="monospace" font-size="10" fill="#8b949e">P ≈ 898.7 гПа (-114.5 гПа)</text>

    <!-- Level 3: 2000m -->
    <circle cx="50" cy="90" r="5" fill="#bc8cff"/>
    <line x1="50" y1="90" x2="350" y2="90" stroke="#bc8cff" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="65" y="85" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bc8cff">Висота h = 2000 м</text>
    <text x="65" y="100" font-family="monospace" font-size="10" fill="#8b949e">P ≈ 795.0 гПа (-218.2 гПа)</text>

    <!-- Barometric Step Rule -->
    <rect x="30" y="300" width="320" height="25" rx="4" fill="#1f6feb" fill-opacity="0.1"/>
    <text x="190" y="317" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Біля землі: 1 гПа (100 Па) ≈ 8.43 метра висоти (Барометричний щабель)</text>
  </g>

  <!-- Right: Hypsometric Formula and Weather Drift -->
  <g transform="translate(470, 95)">
    <rect width="430" height="340" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="430" height="32" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="215" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">Міжнародна барометрична формула ICAO</text>

    <!-- Formula Box -->
    <rect x="20" y="50" width="390" height="75" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="205" y="78" font-family="monospace" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">h = 44330 * (1 - (P / P0)^(1 / 5.255))</text>
    <text x="205" y="105" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">де P — виміряний тиск, P0 — опорний тиск на рівні моря</text>

    <!-- Weather Drift Problem -->
    <text x="20" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f85149">Головна пастка: Метеорологічний дрейф (Погода)</text>
    <text x="20" y="172" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Проходження циклону або грозового фронту змінює тиск</text>
    <text x="20" y="190" font-family="sans-serif" font-size="11" fill="#8b949e">  на 5..15 гПа за кілька годин без зміни висоти.</text>
    <text x="20" y="212" font-family="sans-serif" font-size="11" fill="#f85149">• Зміна тиску на 10 гПа викличе помилку висоти на 85 метрів!</text>

    <!-- Calibration Strategy -->
    <text x="20" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Інженерне вирішення:</text>
    <text x="20" y="267" font-family="sans-serif" font-size="11" fill="#f0f6fc">1. Для дронів / ліфтів: калібрувати P0 перед стартом</text>
    <text x="20" y="285" font-family="monospace" font-size="10" fill="#8b949e">   (P0 = P_ground) для вимірювання відносної висоти Δh;</text>
    <text x="20" y="307" font-family="sans-serif" font-size="11" fill="#f0f6fc">2. Для абсолютних висотомірів: оновлювати аеродромний тиск QNH.</text>
  </g>
</svg>