<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автономний давач: МК спить у нулі струму, замикання геркона його будить</text>
<rect x="85.0" y="120.2" width="210.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">МК СПИТЬ (power-down)</tspan><tspan x="190.0" dy="14.3">тактовий генератор стоїть</tspan><tspan x="190.0" dy="14.3">струм ≈ 0.1 мкА (ATmega)</tspan></text>
<rect x="585.0" y="120.2" width="210.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ПРОКИНУВСЯ</tspan><tspan x="690.0" dy="14.3">надіслав тривогу / полічив</tspan><tspan x="690.0" dy="14.3">струм — міліампери, коротко</tspan></text>
<text x="440.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">геркон замкнувся → пін упав у LOW</text>
<text x="440.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рівневе переривання будить МК</text>
<line x1="300.0" y1="150.0" x2="578.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">діло зроблено → знову в сон</text>
<line x1="578.0" y1="205.0" x2="300.0" y2="205.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="113.3" y="294.3" width="253.4" height="71.4" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="240.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Чому РІВЕНЬ, а не край:</tspan><tspan x="240.0" dy="13.7">у power-down тактовий стоїть,</tspan><tspan x="240.0" dy="13.7">тож логіка країв не працює —</tspan><tspan x="240.0" dy="13.7">будить лише низький РІВЕНЬ на INT0/INT1</tspan></text>
<rect x="542.3" y="294.3" width="235.5" height="71.4" rx="6" fill="#fdf4ec" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Що дає підтяжка:</tspan><tspan x="660.0" dy="13.7">поки двері зачинені — геркон</tspan><tspan x="660.0" dy="13.7">тримає пін у LOW, МК спить;</tspan><tspan x="660.0" dy="13.7">відчинили — HIGH, край будить одразу</tspan></text>
<rect x="173.7" y="407.9" width="552.7" height="44.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="426.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Сам геркон струму не їсть — він лише замикає коло. Тому давач роками живе від «таблетки»:</tspan><tspan x="450.0" dy="13.7">99.99% часу МК спить у мікроамперах, прокидаючись на мілісекунду по кожному руху дверей.</tspan></text>
</svg>