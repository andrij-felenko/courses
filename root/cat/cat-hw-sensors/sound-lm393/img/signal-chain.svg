<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт сигналу: мікрофон → сирий сигнал → поріг → біт</text>
<rect x="30.0" y="150.0" width="150.0" height="88.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Електретний</tspan><tspan x="105.0" dy="18.2">мікрофон</tspan><tspan x="105.0" dy="18.2">(звук → струм)</tspan></text>
<rect x="250.0" y="150.0" width="150.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">Резистор зміщення</tspan><tspan x="325.0" dy="15.6">(струм → напруга,</tspan><tspan x="325.0" dy="15.6">сирий сигнал)</tspan></text>
<rect x="470.0" y="150.0" width="130.0" height="88.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="535.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">LM393</tspan><tspan x="535.0" dy="18.2">порівнює</tspan><tspan x="535.0" dy="18.2">з порогом</tspan></text>
<rect x="640.0" y="150.0" width="150.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="715.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Цифровий вихід</tspan><tspan x="715.0" dy="13.0">0 або 1</tspan><tspan x="715.0" dy="13.0">(відкритий колектор)</tspan></text>
<line x1="180.0" y1="194.0" x2="250.0" y2="194.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="194.0" x2="470.0" y2="194.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="194.0" x2="640.0" y2="194.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">поріг задає гвинтик</text>
<line x1="535.0" y1="136.0" x2="535.0" y2="148.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="425.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">гучніше → більший розмах, але ЛІНІЙНОГО підсилення тут нема</text>
<text x="715.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">лунко → 0, тиша → 1</text>
</svg>