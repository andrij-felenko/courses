<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad1)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Конструкція SiP (System-in-Package) та внутрішня топологія AHT20</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Дводійна гібридна компоновка: MEMS-сенсор вологості + обчислювальний ASIC у корпусі SMD 3×3×1 мм</text>

  <!-- Package Outer Outline (SMD 3x3mm) -->
  <g transform="translate(50, 110)">
    <rect width="320" height="340" rx="12" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="160" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Корпус SMD Flat No-Lead (3.0 × 3.0 мм)</text>

    <!-- Vent Hole / Protective Membrane -->
    <rect x="40" y="50" width="110" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="95" y="75" fill="#3fb950" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">MEMS кристал</text>
    <text x="95" y="95" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Ємнісний полімер</text>
    <circle cx="95" cy="125" r="18" fill="#1c2128" stroke="#3fb950" stroke-dasharray="3,3"/>
    <text x="95" y="130" fill="#3fb950" font-family="sans-serif" font-size="8" text-anchor="middle">Мембрана</text>

    <!-- ASIC Die -->
    <rect x="170" y="50" width="110" height="210" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="225" y="75" fill="#bc8cff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">ASIC кристал</text>
    <rect x="180" y="90" width="90" height="30" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
    <text x="225" y="108" fill="#f0f6fc" font-family="sans-serif" font-size="9" text-anchor="middle">20-біт АЦП (CDC)</text>

    <rect x="180" y="130" width="90" height="30" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
    <text x="225" y="148" fill="#f0f6fc" font-family="sans-serif" font-size="9" text-anchor="middle">Калібрування DSP</text>

    <rect x="180" y="170" width="90" height="30" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
    <text x="225" y="188" fill="#f0f6fc" font-family="sans-serif" font-size="9" text-anchor="middle">I2C контролер</text>

    <rect x="180" y="210" width="90" height="30" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
    <text x="225" y="228" fill="#f0f6fc" font-family="sans-serif" font-size="9" text-anchor="middle">OTP ROM пам'ять</text>

    <!-- Wire bonds between MEMS and ASIC -->
    <path d="M 150 90 Q 160 80, 170 90" stroke="#e3b341" stroke-width="2" fill="none"/>
    <path d="M 150 110 Q 160 100, 170 110" stroke="#e3b341" stroke-width="2" fill="none"/>
    <text x="160" y="130" fill="#e3b341" font-family="system-ui" font-size="8" text-anchor="middle">Зварні</text>
    <text x="160" y="140" fill="#e3b341" font-family="system-ui" font-size="8" text-anchor="middle">перемички</text>

    <!-- External SMD Contact Pads (6-pin layout) -->
    <!-- Pin 1: SCL -->
    <rect x="10" y="315" width="40" height="20" fill="#58a6ff"/>
    <text x="30" y="330" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SCL</text>

    <!-- Pin 2: SDA -->
    <rect x="60" y="315" width="40" height="20" fill="#58a6ff"/>
    <text x="80" y="330" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SDA</text>

    <!-- Pin 3: VDD -->
    <rect x="110" y="315" width="40" height="20" fill="#f85149"/>
    <text x="130" y="330" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">VDD</text>

    <!-- Pin 4: GND -->
    <rect x="170" y="315" width="40" height="20" fill="#3fb950"/>
    <text x="190" y="330" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">GND</text>

    <!-- Pin 5, 6: NC -->
    <rect x="220" y="315" width="40" height="20" fill="#8b949e"/>
    <text x="240" y="330" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">NC</text>
    <rect x="270" y="315" width="40" height="20" fill="#8b949e"/>
    <text x="290" y="330" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">NC</text>
  </g>

  <!-- Cross-Section Layer Diagram -->
  <g transform="translate(410, 110)">
    <rect width="400" height="340" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Пошаровий розріз корпусу AHT20</text>

    <!-- Upper Molding Compound with Air Cavity -->
    <rect x="40" y="60" width="320" height="70" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
    <text x="200" y="85" fill="#8b949e" font-family="system-ui" font-size="11" text-anchor="middle">Епоксидний компаунд (Molding compound)</text>

    <!-- Cavity & Filter Vent -->
    <polygon points="120,60 160,110 240,110 280,60" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="200" y="90" fill="#3fb950" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Дифузійний отвір (Вхід пари H2O)</text>

    <!-- Silicon Dies on Leadframe -->
    <rect x="80" y="130" width="100" height="35" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
    <text x="130" y="152" fill="#3fb950" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">MEMS кристал</text>

    <rect x="220" y="130" width="100" height="35" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="270" y="152" fill="#bc8cff" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">ASIC кристал</text>

    <!-- Substrate / Leadframe -->
    <rect x="40" y="165" width="320" height="25" fill="#30363d" stroke="#e3b341" stroke-width="1"/>
    <text x="200" y="182" fill="#e3b341" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Мідний фрейм (Leadframe) з позолоченими контактними майданчиками</text>

    <!-- Solder Balls / SMD lands -->
    <rect x="60" y="190" width="35" height="15" rx="3" fill="#58a6ff"/>
    <rect x="120" y="190" width="35" height="15" rx="3" fill="#58a6ff"/>
    <rect x="240" y="190" width="35" height="15" rx="3" fill="#f85149"/>
    <rect x="300" y="190" width="35" height="15" rx="3" fill="#3fb950"/>
    <text x="200" y="225" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">SMD виводи для поверхневого монтажу (Reflow)</text>

    <!-- Advantages Card -->
    <g transform="translate(20, 245)">
      <rect width="360" height="80" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="24" fill="#7ee787" font-family="system-ui" font-size="11" font-weight="bold">Переваги технології SiP:</text>
      <text x="15" y="44" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Мінімальні паразитні ємності зварних з'єднань (&lt; 0.05 пФ)</text>
      <text x="15" y="62" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Стійкість до вібрацій, термоударів та хімічного старіння</text>
    </g>
  </g>
</svg>