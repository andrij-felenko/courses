<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad3)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Функціональна архітектура ASIC-кристала обробки сигналів AHT20</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">CDC-перетворювач, сигма-дельта 20-бітний АЦП, калібрувальний DSP та цифровий модуль I2C</text>

  <!-- Main ASIC Architecture Area -->
  <g transform="translate(40, 110)">
    <!-- Sensor Inputs from MEMS -->
    <g transform="translate(0, 40)">
      <rect width="120" height="60" rx="6" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
      <text x="60" y="25" fill="#3fb950" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">MEMS RH</text>
      <text x="60" y="45" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">100..140 пФ</text>

      <rect y="100" width="120" height="60" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
      <text x="60" y="125" fill="#d29922" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Bandgap Temp</text>
      <text x="60" y="145" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">PTAT діод</text>
    </g>

    <!-- Analog Front End (AFE) -->
    <g transform="translate(160, 20)">
      <rect width="180" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="90" y="28" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Аналоговий тракт (AFE)</text>

      <rect x="15" y="45" width="150" height="45" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
      <text x="90" y="65" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">Перетворювач C-to-V</text>
      <text x="90" y="80" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">(Switched Capacitor CDC)</text>

      <rect x="15" y="105" width="150" height="45" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
      <text x="90" y="125" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">20-бітний сигма-дельта</text>
      <text x="90" y="140" fill="#7ee787" font-family="sans-serif" font-size="8" text-anchor="middle">АЦП (Delta-Sigma ADC)</text>
    </g>

    <!-- Connectors from Sensors to AFE -->
    <path d="M 120 70 L 160 70" stroke="#3fb950" stroke-width="2" fill="none"/>
    <path d="M 120 150 L 160 150" stroke="#d29922" stroke-width="2" fill="none"/>

    <!-- Digital Signal Processor & OTP ROM -->
    <g transform="translate(380, 20)">
      <rect width="200" height="180" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
      <text x="100" y="28" fill="#bc8cff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Цифровий блок DSP &amp; OTP</text>

      <rect x="15" y="45" width="170" height="45" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
      <text x="100" y="65" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">Калібрувальна матриця</text>
      <text x="100" y="80" fill="#8b949e" font-family="sans-serif" font-size="8" text-anchor="middle">Заводська OTP ROM</text>

      <rect x="15" y="105" width="170" height="45" rx="4" fill="#1c2128" stroke="#8b949e" stroke-width="1"/>
      <text x="100" y="125" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">DSP-лінеаризація</text>
      <text x="100" y="140" fill="#7ee787" font-family="sans-serif" font-size="8" text-anchor="middle">Формування 20-біт слів</text>
    </g>

    <!-- Arrow AFE to DSP -->
    <path d="M 340 110 L 380 110" stroke="#58a6ff" stroke-width="2" fill="none"/>

    <!-- I2C Communication Interface -->
    <g transform="translate(620, 20)">
      <rect width="150" height="180" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
      <text x="75" y="28" fill="#e3b341" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">I2C Інтерфейс</text>

      <text x="75" y="65" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">Адреса: 0x38</text>
      <text x="75" y="85" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Стандартний / Fast (400 кГц)</text>

      <rect x="15" y="105" width="120" height="45" rx="4" fill="#1c2128" stroke="#e3b341" stroke-width="1"/>
      <text x="75" y="125" fill="#7ee787" font-family="sans-serif" font-size="10" text-anchor="middle">CRC-8 генератор</text>
      <text x="75" y="140" fill="#8b949e" font-family="monospace" font-size="8" text-anchor="middle">Поліном 0x31</text>
    </g>

    <!-- Arrow DSP to I2C -->
    <path d="M 580 110 L 620 110" stroke="#bc8cff" stroke-width="2" fill="none"/>

    <!-- External Bus Lines -->
    <path d="M 770 70 L 800 70" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <text x="800" y="65" fill="#58a6ff" font-family="monospace" font-size="10">SDA</text>
    <path d="M 770 140 L 800 140" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <text x="800" y="135" fill="#58a6ff" font-family="monospace" font-size="10">SCL</text>
  </g>

  <!-- Technical Summary Card -->
  <g transform="translate(40, 360)">
    <rect width="770" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="28" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Ключові параметри та функції внутрішнього ASIC:</text>
    <text x="20" y="52" fill="#f0f6fc" font-family="sans-serif" font-size="11">• 20-бітна роздільна здатність дозволяє детектувати зміну ємності на рівні одиниць фемтофарад (1 фФ = 10^-15 Ф)</text>
    <text x="20" y="74" fill="#f0f6fc" font-family="sans-serif" font-size="11">• Струм у режимі сну: менше 0.25 мкА; струм під час оцифрування (80 мс): близько 23 мкА (середнє споживання &lt; 1 мкА при 1 вибірці/хв)</text>
    <text x="20" y="96" fill="#7ee787" font-family="sans-serif" font-size="11">• Апаратне обчислення CRC-8 (x^8 + x^5 + x^4 + 1) на кристалі гарантує надійність прийому в зашумлених лініях</text>
  </g>
</svg>