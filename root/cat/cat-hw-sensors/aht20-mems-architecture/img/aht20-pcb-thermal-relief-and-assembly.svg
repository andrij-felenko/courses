<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad5)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Трасування друкованої плати (PCB) та терморозвантажувальні прорізи AHT20</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Запобігання паразитній теплопередачі від процесора та дотримання профілю пайки Reflow</text>

  <!-- PCB Board Visualizer -->
  <g transform="translate(40, 110)">
    <rect width="450" height="260" rx="8" fill="#0d2818" stroke="#165b33" stroke-width="2"/>
    <text x="20" y="30" fill="#7ee787" font-family="monospace" font-size="12" font-weight="bold">FR-4 PCB (Верхній шар міді)</text>

    <!-- Heat Source (MCU ESP32 / STM32) -->
    <g transform="translate(30, 70)">
      <rect width="100" height="100" rx="4" fill="#1c2128" stroke="#f85149" stroke-width="1.5"/>
      <text x="50" y="45" fill="#f85149" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">MCU / Wi-Fi</text>
      <text x="50" y="65" fill="#f0f6fc" font-family="monospace" font-size="10" text-anchor="middle">ESP32</text>
      <text x="50" y="85" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">+45 °C (Тепло)</text>
    </g>

    <!-- Thermal Heat Flow Arrows -->
    <path d="M 140 120 L 210 120" stroke="#f85149" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
    <text x="175" y="110" fill="#f85149" font-family="sans-serif" font-size="9" text-anchor="middle">Тепловий потік</text>

    <!-- Isolation Cutout Slots (Milling Slots) -->
    <rect x="220" y="50" width="12" height="150" rx="4" fill="#0d1117" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="220" y="50" width="120" height="12" rx="4" fill="#0d1117" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="220" y="190" width="120" height="12" rx="4" fill="#0d1117" stroke="#e3b341" stroke-width="1.5"/>
    <text x="280" y="40" fill="#e3b341" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">U-подібний фрезерований паз</text>

    <!-- Isolated Island with AHT20 -->
    <g transform="translate(250, 80)">
      <rect width="80" height="80" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
      <text x="40" y="40" fill="#58a6ff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">AHT20</text>
      <text x="40" y="55" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">SMD 3x3</text>
      <text x="40" y="70" fill="#7ee787" font-family="sans-serif" font-size="8" text-anchor="middle">Ізольований острів</text>
    </g>

    <!-- Airflow symbol -->
    <path d="M 370 70 Q 390 120, 370 170" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <text x="410" y="125" fill="#58a6ff" font-family="system-ui" font-size="10">Вільна конвекція повітря</text>
  </g>

  <!-- Reflow Soldering Profile Card -->
  <g transform="translate(510, 110)">
    <rect width="300" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="28" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold">Температурний профіль пайки (JEDEC)</text>

    <!-- Profile Curve -->
    <path d="M 30 200 L 80 140 L 160 120 L 200 60 L 220 60 L 270 200" fill="none" stroke="#f85149" stroke-width="2.5"/>
    <line x1="30" y1="200" x2="280" y2="200" stroke="#8b949e" stroke-width="1"/>

    <!-- Peak marker -->
    <circle cx="210" cy="60" r="4" fill="#f85149"/>
    <text x="210" y="45" fill="#f85149" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">T_peak = 260 °C (max 10 c)</text>

    <text x="120" y="110" fill="#8b949e" font-family="sans-serif" font-size="9">Зона прогріву 150-200 °C</text>
    <text x="150" y="235" fill="#7ee787" font-family="sans-serif" font-size="10" text-anchor="middle">Безсвинцева пайка Pb-Free (SAC305)</text>
  </g>

  <!-- Assembly Guidelines Rule Card -->
  <g transform="translate(40, 390)">
    <rect width="770" height="85" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="24" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Правила захисту сенсора при виробництві:</text>
    <text x="20" y="46" fill="#f0f6fc" font-family="sans-serif" font-size="11">1. Категорично заборонено наносити лакове захисне покриття (Conformal Coating) безпосередньо на мембрану AHT20!</text>
    <text x="20" y="66" fill="#7ee787" font-family="sans-serif" font-size="11">2. Після пайки рекомендується технологічна дегазація (витримка при 50 °C протягом 6 годин) для вивітрювання парів флюсу.</text>
  </g>
</svg>