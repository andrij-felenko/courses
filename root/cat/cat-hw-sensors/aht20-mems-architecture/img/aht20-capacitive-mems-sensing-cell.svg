<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad2)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Ємнісний MEMS-осередок вологості: гребінчасті електроди та полімер</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Фізика зміни діелектричної проникності при дифузії молекул води крізь пористий електрод</text>

  <!-- Cross-Section of MEMS Cell -->
  <g transform="translate(40, 110)">
    <rect width="450" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold">Пошаровий розріз сенсорного конденсатора</text>

    <!-- Water vapor molecules above -->
    <g transform="translate(180, 45)">
      <circle cx="10" cy="10" r="5" fill="#58a6ff"/>
      <text x="20" y="14" fill="#58a6ff" font-family="sans-serif" font-size="9">H2O</text>
      <circle cx="60" cy="8" r="5" fill="#58a6ff"/>
      <circle cx="110" cy="12" r="5" fill="#58a6ff"/>
      <circle cx="160" cy="7" r="5" fill="#58a6ff"/>
    </g>

    <!-- Top Porous Gold Electrode -->
    <rect x="40" y="70" width="370" height="15" fill="#e3b341" stroke="#f0f6fc" stroke-dasharray="4,2"/>
    <text x="225" y="82" fill="#0d1117" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Верхній пористий золотий електрод (пропускає пари H2O)</text>

    <!-- Hygroscopic Polymer Dielectric -->
    <rect x="40" y="85" width="370" height="60" fill="#238636" opacity="0.85"/>
    <text x="225" y="112" fill="#f0f6fc" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Вологочутливий полімерний діелектрик</text>
    <text x="225" y="130" fill="#f0f6fc" font-family="monospace" font-size="10" text-anchor="middle">ε_сух ≈ 3.5  ──►  ε_водне ≈ 80  (ΔC ~ RH)</text>

    <!-- Lower Interdigitated Electrodes (Comb fingers) -->
    <g transform="translate(40, 145)">
      <rect x="0" y="0" width="370" height="20" fill="#1c2128"/>
      <rect x="30" y="0" width="20" height="20" fill="#58a6ff"/>
      <rect x="80" y="0" width="20" height="20" fill="#d29922"/>
      <rect x="130" y="0" width="20" height="20" fill="#58a6ff"/>
      <rect x="180" y="0" width="20" height="20" fill="#d29922"/>
      <rect x="230" y="0" width="20" height="20" fill="#58a6ff"/>
      <rect x="280" y="0" width="20" height="20" fill="#d29922"/>
      <rect x="330" y="0" width="20" height="20" fill="#58a6ff"/>
    </g>

    <!-- Silicon Dioxide Passivation -->
    <rect x="40" y="165" width="370" height="20" fill="#8b949e"/>
    <text x="225" y="179" fill="#0d1117" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Діелектричний шар пасивації (SiO2 / Si3N4)</text>

    <!-- Silicon Substrate -->
    <rect x="40" y="185" width="370" height="50" fill="#30363d"/>
    <text x="225" y="215" fill="#f0f6fc" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Кремнієва підкладка (Monocrystalline Silicon Substrate)</text>
  </g>

  <!-- Top View Comb Electrodes Diagram -->
  <g transform="translate(510, 110)">
    <rect width="300" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="30" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold">Топологія зустрічно-штирьових гребінців</text>

    <!-- Left Bus + Fingers -->
    <g stroke="#58a6ff" stroke-width="4" fill="none">
      <line x1="40" y1="60" x2="40" y2="230"/>
      <line x1="40" y1="80" x2="220" y2="80"/>
      <line x1="40" y1="120" x2="220" y2="120"/>
      <line x1="40" y1="160" x2="220" y2="160"/>
      <line x1="40" y1="200" x2="220" y2="200"/>
    </g>
    <text x="35" y="50" fill="#58a6ff" font-family="monospace" font-size="11">Електрод А</text>

    <!-- Right Bus + Fingers -->
    <g stroke="#d29922" stroke-width="4" fill="none">
      <line x1="260" y1="60" x2="260" y2="230"/>
      <line x1="260" y1="100" x2="80" y2="100"/>
      <line x1="260" y1="140" x2="80" y2="140"/>
      <line x1="260" y1="180" x2="80" y2="180"/>
      <line x1="260" y1="220" x2="80" y2="220"/>
    </g>
    <text x="265" y="50" fill="#d29922" font-family="monospace" font-size="11" text-anchor="end">Електрод В</text>
  </g>

  <!-- Physics Formula Card -->
  <g transform="translate(40, 390)">
    <rect width="770" height="85" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="26" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Математична модель ємності гребінчастої структури:</text>
    <text x="20" y="50" fill="#f0f6fc" font-family="monospace" font-size="12">C_total = (N - 1) × L × ε_0 × ε_r(RH) × (t / s)</text>
    <text x="20" y="72" fill="#7ee787" font-family="sans-serif" font-size="11">де N — кількість штирів, L — довжина перекриття, t — товщина металізації, s — міжелектродний зазор (2–3 мкм)</text>
  </g>
</svg>