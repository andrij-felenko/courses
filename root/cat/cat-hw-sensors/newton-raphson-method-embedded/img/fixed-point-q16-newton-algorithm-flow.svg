<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Арифметика Q16.16 та запобігання переповненню в методі Ньютона</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Масштабування проміжних добутків у 64-бітний акумулятор для мікроконтролерів Cortex-M0/M3</text>

  <!-- Flow Steps Horizontal -->
  <g transform="translate(60, 95)">
    <!-- Card 1: Format definition -->
    <rect x="0" y="20" width="250" height="260" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="0" y="20" width="250" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="125" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">1. Формат Q16.16 (int32_t)</text>
    
    <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#f0f6fc">• 1 біт знаку</text>
    <text x="15" y="102" font-family="sans-serif" font-size="11" fill="#f0f6fc">• 15 біт цілої частини (±32767)</text>
    <text x="15" y="124" font-family="sans-serif" font-size="11" fill="#f0f6fc">• 16 біт дробової частини</text>
    <text x="25" y="142" font-family="sans-serif" font-size="10" fill="#8b949e">(Крок = 1 / 65536 ≈ 15.26 мкВ/мк°C)</text>

    <rect x="15" y="165" width="220" height="40" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="125" y="190" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">SCALE = 65536 (1 &lt;&lt; 16)</text>

    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#3fb950">Ідеальний компроміс діапазону та роздільної здатності для сенсорів</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(250, 160)">
    <line x1="10" y1="0" x2="40" y2="0" stroke="#58a6ff" stroke-width="2"/>
    <polygon points="40,0 32,-4 32,4" fill="#58a6ff"/>
  </g>

  <!-- Card 2: Multiplication overflow problem & 64-bit casting -->
  <g transform="translate(300, 20)">
    <rect x="0" y="20" width="270" height="260" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect x="0" y="20" width="270" height="32" rx="8" fill="#da3633" fill-opacity="0.2"/>
    <text x="135" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f85149" text-anchor="middle">2. Проблема переповнення 32 біт</text>

    <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#f0f6fc">При множенні двох чисел Q16:</text>
    <text x="15" y="100" font-family="monospace" font-size="10" fill="#f85149">A_q16 * B_q16 =&gt; Q32.32 (64 біти!)</text>

    <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#8b949e">Пряме множення у int32 викликає</text>
    <text x="15" y="143" font-family="sans-serif" font-size="11" fill="#f85149">миттєве катастрофічне переповнення!</text>

    <rect x="15" y="165" width="240" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="135" y="185" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">int64_t prod = (int64_t)a * b;</text>
    <text x="135" y="200" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">return (int32_t)(prod &gt;&gt; 16);</text>

    <text x="15" y="235" font-family="sans-serif" font-size="10" fill="#3fb950">Апаратна інструкція SMULL у Cortex-M</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(570, 160)">
    <line x1="10" y1="0" x2="40" y2="0" stroke="#3fb950" stroke-width="2"/>
    <polygon points="40,0 32,-4 32,4" fill="#3fb950"/>
  </g>

  <!-- Card 3: Newton loop with safety guards -->
  <g transform="translate(620, 20)">
    <rect x="0" y="20" width="250" height="260" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="0" y="20" width="250" height="32" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="125" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">3. Захисні бар'єри циклу</text>

    <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Захист від ділення на нуль:</text>
    <text x="25" y="98" font-family="monospace" font-size="10" fill="#8b949e">if (abs(deriv) &lt; EPS) break;</text>

    <text x="15" y="125" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Жорсткий ліміт ітерацій:</text>
    <text x="25" y="143" font-family="monospace" font-size="10" fill="#8b949e">max_iterations = 6;</text>

    <text x="15" y="170" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Критерій виходу (похибка):</text>
    <text x="25" y="188" font-family="monospace" font-size="10" fill="#3fb950">if (abs(delta) &lt;= 1) break;</text>

    <rect x="15" y="210" width="220" height="40" rx="4" fill="#238636" fill-opacity="0.15"/>
    <text x="125" y="235" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">Гарантований детермінований час</text>
  </g>
</svg>