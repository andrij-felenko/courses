<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Геометричний зміст методу Ньютона — Рафсона (дотичних)</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Квадратична збіжність до кореня f(x) = 0 за допомогою послідовних лінійних апроксимацій</text>

  <!-- Plot Area -->
  <g transform="translate(100, 80)">
    <!-- Axes -->
    <line x1="0" y1="280" x2="760" y2="280" stroke="#30363d" stroke-width="2"/>
    <line x1="60" y1="20" x2="60" y2="340" stroke="#30363d" stroke-width="2"/>
    <text x="750" y="305" font-family="sans-serif" font-size="12" fill="#8b949e">x</text>
    <text x="40" y="35" font-family="sans-serif" font-size="12" fill="#8b949e">y = f(x)</text>

    <!-- Curve y = f(x) -->
    <!-- Root at x = 320 -->
    <path d="M 120,320 Q 220,295 320,280 Q 450,250 680,60" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <text x="690" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">y = f(x)</text>

    <!-- True root x* -->
    <circle cx="320" cy="280" r="6" fill="#3fb950"/>
    <text x="320" y="305" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">Корінь x*</text>

    <!-- Initial guess x0 -->
    <!-- Point on curve: x=600, y=105 -->
    <line x1="600" y1="280" x2="600" y2="105" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="600" cy="280" r="5" fill="#f85149"/>
    <text x="600" y="305" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">x_0 (Seed)</text>
    <circle cx="600" cy="105" r="5" fill="#f85149"/>
    <text x="615" y="105" font-family="sans-serif" font-size="11" fill="#f0f6fc">(x_0, f(x_0))</text>

    <!-- Tangent 1 at x0: slope ~ -0.6 (goes from 600,105 down to x1 ~ 420, 280) -->
    <line x1="650" y1="55" x2="400" y2="300" stroke="#f85149" stroke-width="2"/>
    <text x="560" y="170" font-family="sans-serif" font-size="11" fill="#f85149">Дотична 1: f'(x_0)</text>

    <!-- Next point x1 -->
    <circle cx="425" cy="280" r="5" fill="#d29922"/>
    <text x="425" y="305" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">x_1</text>

    <!-- Point on curve: x1=425, y=240 -->
    <line x1="425" y1="280" x2="425" y2="240" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="425" cy="240" r="5" fill="#d29922"/>

    <!-- Tangent 2 at x1: goes from 425,240 down to x2 ~ 330, 280 -->
    <line x1="460" y1="210" x2="310" y2="295" stroke="#d29922" stroke-width="2"/>
    <text x="430" y="215" font-family="sans-serif" font-size="11" fill="#d29922">Дотична 2: f'(x_1)</text>

    <!-- Next point x2 (almost at x*) -->
    <circle cx="335" cy="280" r="4" fill="#bc8cff"/>
    <text x="350" y="270" font-family="sans-serif" font-size="10" font-weight="bold" fill="#bc8cff">x_2 ≈ x*</text>
  </g>

  <!-- Formula Callout Card -->
  <g transform="translate(100, 395)">
    <rect width="760" height="65" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="380" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">
      x_{n+1} = x_n - f(x_n) / f'(x_n)
    </text>
    <text x="380" y="48" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">
      Кожна ітерація подвоює кількість точних двійкових розрядів (квадратична швидкість збіжності O(h^2))
    </text>
  </g>
</svg>