<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .zone-agnd { fill: #0369a1; fill-opacity: 0.25; stroke: #38bdf8; stroke-width: 2; rx: 8px; }
      .zone-dgnd { fill: #4338ca; fill-opacity: 0.25; stroke: #818cf8; stroke-width: 2; rx: 8px; }
      .ic-chip { fill: #0f172a; stroke: #f8fafc; stroke-width: 2; rx: 4px; }
      .pad { fill: #fbbf24; }
      .wire-diff { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .wire-dig { stroke: #818cf8; stroke-width: 2.5; fill: none; }
      .wire-split { stroke: #f43f5e; stroke-dasharray: 6,4; stroke-width: 2; }
    </style>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Топологія розведення друкованої плати RDC: розділення AGND та DGND</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Зіркове об'єднання земель під кристалом AD2S1210 та ізоляція аналогового тракту від цифрових завад</text>

  <!-- Left: PCB Ground Zones Diagram -->
  <g transform="translate(40, 75)">
    <!-- Boundary outline of PCB area -->
    <rect x="0" y="0" width="500" height="400" class="panel" />

    <!-- Split line between AGND and DGND -->
    <line x1="250" y1="10" x2="250" y2="390" class="wire-split" />
    <text x="250" y="25" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Лінія розрізу шарів землі</text>

    <!-- Left Zone: AGND (Analog Ground) -->
    <rect x="15" y="35" width="220" height="350" class="zone-agnd" />
    <text x="125" y="60" text-anchor="middle" class="lbl-bold" fill="#38bdf8">ЗОНА AGND (Аналогова земля)</text>
    <text x="125" y="78" text-anchor="middle" class="subtitle">Суцільний мідний шар</text>

    <!-- Components in AGND zone -->
    <rect x="35" y="100" width="180" height="70" class="box" style="stroke: #38bdf8;" />
    <text x="125" y="125" text-anchor="middle" class="lbl-bold" fill="#38bdf8">Вхідний аналоговий фільтр</text>
    <text x="125" y="145" text-anchor="middle" class="subtitle">Диференційні пари SIN / COS</text>

    <rect x="35" y="190" width="180" height="70" class="box" style="stroke: #fbbf24;" />
    <text x="125" y="215" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Драйвер збудження</text>
    <text x="125" y="235" text-anchor="middle" class="subtitle">Виходи EXC / EXCB до 200 мА</text>

    <rect x="35" y="280" width="180" height="85" class="box" />
    <text x="125" y="305" text-anchor="middle" class="lbl-bold">Аналогове живлення AVDD</text>
    <text x="125" y="325" text-anchor="middle" class="subtitle">Блокувальні C: 10 мкФ + 0.1 мкФ</text>
    <text x="125" y="345" text-anchor="middle" class="subtitle" fill="#38bdf8">Окремий LDO стабілізатор</text>

    <!-- Right Zone: DGND (Digital Ground) -->
    <rect x="265" y="35" width="220" height="350" class="zone-dgnd" />
    <text x="375" y="60" text-anchor="middle" class="lbl-bold" fill="#818cf8">ЗОНА DGND (Цифрова земля)</text>
    <text x="375" y="78" text-anchor="middle" class="subtitle">Імпульсні зворотні струми</text>

    <!-- Components in DGND zone -->
    <rect x="285" y="100" width="180" height="70" class="box" style="stroke: #818cf8;" />
    <text x="375" y="125" text-anchor="middle" class="lbl-bold" fill="#818cf8">Шина SPI (CS, CLK, MOSI, MISO)</text>
    <text x="375" y="145" text-anchor="middle" class="subtitle">Високошвидкісні фронти</text>

    <rect x="285" y="190" width="180" height="70" class="box" style="stroke: #10b981;" />
    <text x="375" y="215" text-anchor="middle" class="lbl-bold" fill="#10b981">Виходи енкодера A, B, Z</text>
    <text x="375" y="235" text-anchor="middle" class="subtitle">Інкрементальні лінії до ЧПУ</text>

    <rect x="285" y="280" width="180" height="85" class="box" />
    <text x="375" y="305" text-anchor="middle" class="lbl-bold">Цифрове живлення DVDD</text>
    <text x="375" y="325" text-anchor="middle" class="subtitle">Логіка 3.3 В / 5 В</text>
    <text x="375" y="345" text-anchor="middle" class="subtitle" fill="#818cf8">Фільтрація феритами</text>

    <!-- Center: IC AD2S1210 placed across split! -->
    <rect x="200" y="150" width="100" height="110" class="ic-chip" />
    <text x="250" y="185" text-anchor="middle" class="lbl-bold">AD2S1210</text>
    <text x="250" y="202" text-anchor="middle" class="subtitle">RDC Chip</text>

    <!-- Star Ground Bridge under Chip exposed pad -->
    <rect x="240" y="225" width="20" height="25" class="pad" />
    <text x="250" y="265" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Місток (Star)</text>
  </g>

  <!-- Right Details & Rules Panel -->
  <rect x="560" y="75" width="290" height="400" class="panel" />
  <text x="580" y="100" class="lbl-bold" fill="#38bdf8">Золоті правила розведення RDC:</text>

  <rect x="575" y="120" width="260" height="80" class="panel" style="fill: #0f172a; stroke: #fbbf24;" />
  <text x="590" y="142" class="lbl-bold" fill="#fbbf24">1. Точка об'єднання (Star Ground):</text>
  <text x="590" y="162" class="lbl">• Землі AGND і DGND з'єднуються</text>
  <text x="590" y="180" class="lbl">  СТРОГО в 1 точці під корпусом RDC</text>

  <rect x="575" y="210" width="260" height="80" class="panel" style="fill: #0f172a; stroke: #38bdf8;" />
  <text x="590" y="232" class="lbl-bold" fill="#38bdf8">2. Диференційні пари SIN/COS:</text>
  <text x="590" y="252" class="lbl">• Сувора симетрія та паралельність</text>
  <text x="590" y="270" class="lbl">• Захисні заземлені доріжки (Guard)</text>

  <rect x="575" y="300" width="260" height="80" class="panel" style="fill: #0f172a; stroke: #f43f5e;" />
  <text x="590" y="322" class="lbl-bold" fill="#f43f5e">3. Екран кабелю резольвера:</text>
  <text x="590" y="342" class="lbl">• Заземлюється на корпус (PE / шасі)</text>
  <text x="590" y="360" class="lbl">• В ЖОДНОМУ РАЗІ не до AGND!</text>

  <rect x="575" y="390" width="260" height="70" class="panel" style="fill: #0f172a; stroke: #10b981;" />
  <text x="590" y="412" class="lbl-bold" fill="#10b981">4. Захист від dV/dt інвертора:</text>
  <text x="590" y="432" class="lbl">• Просторове віддалення від шин ШІМ</text>
  <text x="590" y="450" class="subtitle">Повна відсутність збоїв при 10 кВ/мкс</text>
</svg>