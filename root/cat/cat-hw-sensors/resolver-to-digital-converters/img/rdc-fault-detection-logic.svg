<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .box-diag { fill: #0f172a; stroke: #f43f5e; stroke-width: 1.5; rx: 6px; }
      .box-warn { fill: #0f172a; stroke: #fbbf24; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .wire-red { stroke: #f43f5e; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="m4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="m4-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Логічна схема системи самодіагностики несправностей RDC</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Апаратне виявлення обриву обмоток (LOS), втрати стеження (LOT), деградації (DOS) та захист сервоприводу</text>

  <!-- Left: Source Signals -->
  <g transform="translate(40, 80)">
    <!-- Vector sum calculator -->
    <rect x="0" y="20" width="160" height="90" class="box" />
    <text x="80" y="45" text-anchor="middle" class="lbl-bold" fill="#38bdf8">Обчислювач амплітуди</text>
    <text x="80" y="65" text-anchor="middle" class="lbl">V_SIN² + V_COS²</text>
    <text x="80" y="85" text-anchor="middle" class="subtitle">= (k · V_exc)² = const</text>

    <!-- Phase error detector -->
    <rect x="0" y="160" width="160" height="90" class="box" />
    <text x="80" y="185" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Детектор помилки контуру</text>
    <text x="80" y="205" text-anchor="middle" class="lbl">e = |θ - φ_vco|</text>
    <text x="80" y="225" text-anchor="middle" class="subtitle">Помилка неузгодження</text>
  </g>

  <!-- Middle: Comparators & Diagnostic Logic -->
  <g transform="translate(260, 80)">
    <!-- 1. LOS Comparator (Loss of Signal) -->
    <rect x="0" y="10" width="220" height="65" class="box-diag" />
    <text x="110" y="32" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Компаратор LOS (обрив)</text>
    <text x="110" y="48" text-anchor="middle" class="subtitle">V_SIN² + V_COS² &lt; V_los_th²</text>
    <text x="110" y="62" text-anchor="middle" class="subtitle">Обрив кабелю чи зникнення ref</text>
    <line x1="220" y1="42" x2="280" y2="42" class="wire-red" marker-end="url(#m4)" />

    <!-- 2. DOS Comparator (Degradation) -->
    <rect x="0" y="90" width="220" height="65" class="box-warn" />
    <text x="110" y="112" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Компаратор DOS (деградація)</text>
    <text x="110" y="128" text-anchor="middle" class="subtitle">Вихід за вікно [V_min, V_max]</text>
    <text x="110" y="142" text-anchor="middle" class="subtitle">Міжвиткове КЗ або асиметрія</text>
    <line x1="220" y1="122" x2="280" y2="122" class="wire-red" marker-end="url(#m4)" />

    <!-- 3. LOT Comparator (Loss of Tracking) -->
    <rect x="0" y="170" width="220" height="65" class="box-diag" />
    <text x="110" y="192" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Компаратор LOT (зрив стеження)</text>
    <text x="110" y="208" text-anchor="middle" class="subtitle">|θ - φ_vco| &gt; 15°...45°</text>
    <text x="110" y="222" text-anchor="middle" class="subtitle">Надприскорення або сильна завада</text>
    <line x1="220" y1="202" x2="280" y2="202" class="wire-red" marker-end="url(#m4)" />
  </g>

  <!-- Wires from sources to comparators -->
  <path d="M 200 125 L 230 125 L 230 52 L 260 52" class="wire" marker-end="url(#m4-g)" />
  <path d="M 200 125 L 260 125" class="wire" marker-end="url(#m4-g)" />
  <path d="M 200 245 L 260 245 L 260 282 L 260 282" class="wire" />

  <!-- Right: Fault Register & Hardware Emergency Trip -->
  <g transform="translate(580, 80)">
    <!-- Latched Fault Register -->
    <rect x="0" y="15" width="260" height="110" class="panel" />
    <text x="130" y="40" text-anchor="middle" class="lbl-bold" fill="#38bdf8">Регістр помилок (SPI)</text>
    <text x="130" y="58" text-anchor="middle" class="subtitle">Фіксовані біти несправностей (Latched)</text>
    <text x="130" y="78" text-anchor="middle" class="lbl">• Біти: LOS, DOS, LOT, OVERSPEED</text>
    <text x="130" y="96" text-anchor="middle" class="subtitle">Зчитування телеметрії контролером</text>

    <!-- Hardware FAULT / STO Output -->
    <rect x="0" y="145" width="260" height="90" class="box-diag" />
    <text x="130" y="170" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Апаратний вихід FAULT</text>
    <text x="130" y="188" text-anchor="middle" class="subtitle">Пряме підключення до Safe Torque Off (STO)</text>
    <text x="130" y="206" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Час реакції: &lt; 2 мкс!</text>
    <text x="130" y="222" text-anchor="middle" class="subtitle">Миттєве блокування ШІМ інвертора</text>
  </g>

  <!-- Bottom Panel: Safety Significance -->
  <rect x="40" y="340" width="800" height="135" class="panel" />
  <text x="60" y="365" class="lbl-bold" fill="#fbbf24">Критичність апаратної самодіагностики для безпеки:</text>
  <text x="60" y="388" class="lbl">• <tspan fill="#f43f5e">Запобігання аварійному саморозгону (Runaway):</tspan> При обриві зворотного зв'язку за положенням FOC-контролер розкручує двигун на макс. струм. FAULT миттєво глушить ключі інвертора.</text>
  <text x="60" y="410" class="lbl">• <tspan fill="#10b981">Тригонометрична інваріантність:</tspan> Контроль суми sin²(θ) + cos²(θ) = const дає 100% покриття дефектів кабелю при будь-якому положенні вала.</text>
  <text x="60" y="432" class="lbl">• <tspan fill="#38bdf8">Фіксування помилок (Fault Latching):</tspan> Навіть короткочасний імпульсний збій фіксується у регістрі для подальшого аналізу сервісним персоналом.</text>
</svg>