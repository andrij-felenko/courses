<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .box-mult { fill: #0f172a; stroke: #a855f7; stroke-width: 1.5; rx: 6px; }
      .box-psd { fill: #0f172a; stroke: #f43f5e; stroke-width: 1.5; rx: 6px; }
      .box-vco { fill: #0f172a; stroke: #10b981; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .wire-green { stroke: #10b981; stroke-width: 2.5; fill: none; }
      .wire-purple { stroke: #a855f7; stroke-width: 2.5; fill: none; }
      .dot { fill: #38bdf8; }
    </style>
    <marker id="m1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="m1-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="m1-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="900" height="520" class="bg" />

  <text x="450" y="28" text-anchor="middle" class="title">Слідкуючий контур 2-го типу перетворювача «резольвер-код» (RDC Tracking Loop)</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">Архітектура безперервного зведення кутової помилки e = θ - φ до нуля без фазового запізнення швидкості</text>

  <!-- Left: Inputs V_SIN, V_COS -->
  <g transform="translate(30, 80)">
    <rect x="0" y="20" width="130" height="60" class="box" />
    <text x="65" y="43" text-anchor="middle" class="lbl-bold" fill="#38bdf8">V_SIN(t)</text>
    <text x="65" y="60" text-anchor="middle" class="subtitle">sin(θ)·sin(ω_c t)</text>
    <line x1="130" y1="50" x2="190" y2="50" class="wire" marker-end="url(#m1)" />

    <rect x="0" y="120" width="130" height="60" class="box" />
    <text x="65" y="143" text-anchor="middle" class="lbl-bold" fill="#38bdf8">V_COS(t)</text>
    <text x="65" y="160" text-anchor="middle" class="subtitle">cos(θ)·sin(ω_c t)</text>
    <line x1="130" y1="150" x2="190" y2="150" class="wire" marker-end="url(#m1)" />
  </g>

  <!-- Trigonometric Multiplier (DACs) -->
  <g transform="translate(220, 80)">
    <rect x="0" y="10" width="165" height="180" class="box-mult" />
    <text x="82" y="32" text-anchor="middle" class="lbl-bold" fill="#a855f7">Помножувальні ЦАП</text>
    <text x="82" y="48" text-anchor="middle" class="subtitle">Тригонометричний вузол</text>

    <!-- Cross multiply math -->
    <text x="82" y="80" text-anchor="middle" class="lbl">V_sin · cos(φ)</text>
    <text x="82" y="110" text-anchor="middle" class="lbl-bold" fill="#f43f5e">мінус</text>
    <text x="82" y="135" text-anchor="middle" class="lbl">V_cos · sin(φ)</text>

    <text x="82" y="170" text-anchor="middle" class="subtitle" fill="#10b981">sin(θ - φ) ≈ (θ - φ)</text>
    <line x1="165" y1="100" x2="205" y2="100" class="wire" marker-end="url(#m1)" />
  </g>

  <!-- Phase Sensitive Demodulator (PSD) -->
  <g transform="translate(425, 120)">
    <rect x="0" y="10" width="145" height="100" class="box-psd" />
    <text x="72" y="33" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Фазочутливий</text>
    <text x="72" y="50" text-anchor="middle" class="lbl-bold" fill="#f43f5e">демодулятор (PSD)</text>
    <text x="72" y="70" text-anchor="middle" class="subtitle">× sin(ω_c t + φ_c)</text>
    <text x="72" y="90" text-anchor="middle" class="subtitle">Постійна складова V_e</text>
    <line x1="145" y1="60" x2="185" y2="60" class="wire" marker-end="url(#m1)" />

    <!-- Carrier ref input from bottom -->
    <path d="M 72 170 L 72 110" class="wire-purple" marker-end="url(#m1-p)" />
    <text x="72" y="185" text-anchor="middle" class="subtitle" fill="#a855f7">Несуча ref</text>
  </g>

  <!-- Loop Filter (PI Controller / Integrator 1) -->
  <g transform="translate(610, 120)">
    <rect x="0" y="10" width="130" height="100" class="box" />
    <text x="65" y="33" text-anchor="middle" class="lbl-bold">Фільтр контуру</text>
    <text x="65" y="50" text-anchor="middle" class="subtitle">ПІ-регулятор</text>
    <text x="65" y="70" text-anchor="middle" class="lbl" fill="#38bdf8">Інтегратор 1</text>
    <text x="65" y="90" text-anchor="middle" class="lbl-bold" fill="#fbbf24">ω_est (швидкість)</text>
    <line x1="130" y1="60" x2="165" y2="60" class="wire" marker-end="url(#m1)" />
  </g>

  <!-- VCO / Digital Up/Down Counter (Integrator 2) -->
  <g transform="translate(775, 120)">
    <rect x="0" y="10" width="105" height="100" class="box-vco" />
    <text x="52" y="33" text-anchor="middle" class="lbl-bold" fill="#10b981">VCO / Лічильник</text>
    <text x="52" y="50" text-anchor="middle" class="subtitle">Інтегратор 2</text>
    <text x="52" y="75" text-anchor="middle" class="lbl-bold" fill="#10b981">Кут φ</text>
    <text x="52" y="92" text-anchor="middle" class="subtitle">(16 біт код)</text>
  </g>

  <!-- Feedback Loop wire (from VCO angle back to Multiplier) -->
  <path d="M 825 210 L 825 270 L 302 270 L 302 190" class="wire-green" marker-end="url(#m1-g)" />
  <text x="560" y="260" text-anchor="middle" class="lbl-bold" fill="#10b981">Зворотний зв'язок: цифровий кут φ подається на ЦАП sin(φ) / cos(φ)</text>

  <!-- Output tap to External Interfaces -->
  <path d="M 880 170 L 880 320 L 750 320" class="wire" marker-end="url(#m1)" />

  <!-- Bottom Panel: Dynamic Characteristics of Type II Loop -->
  <rect x="30" y="340" width="840" height="150" class="panel" />
  <text x="50" y="365" class="lbl-bold" fill="#38bdf8">Ключові властивості слідкуючого контуру 2-го типу (Type II Tracking Loop):</text>
  <text x="50" y="388" class="lbl">• <tspan fill="#10b981">Нульова динамічна помилка швидкості (e_ss = 0):</tspan> Наявність двох інтеграторів гарантує відсутність фазового запізнення кута при постійній швидкості обертання ротора.</text>
  <text x="50" y="410" class="lbl">• <tspan fill="#fbbf24">Фільтрація шуму:</tspan> Контур працює як вузькосмуговий фільтр 2-го порядку, пригнічуючи високочастотні завади ШІМ інвертора (dI/dt, dV/dt).</text>
  <text x="50" y="432" class="lbl">• <tspan fill="#38bdf8">Миттєве отримання швидкості:</tspan> Вихід першого інтегратора надає оцінку швидкості ω_est без потреби чисельного диференціювання кута.</text>
  <text x="50" y="454" class="lbl">• <tspan fill="#a855f7">Інваріантність до амплітуди:</tspan> Сигнал помилки формується через різницю добутків, що робить контур стійким до синфазних амплітудних коливань збудження.</text>
</svg>