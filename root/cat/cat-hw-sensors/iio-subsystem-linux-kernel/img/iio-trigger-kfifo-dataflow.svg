<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Потік даних IIO: від апаратного переривання до буфера kfifo</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність захоплення вибірок із часовими мітками через trigger handler у простір користувача</text>

  <!-- Card 1 -->
  <rect x="20" y="70" width="215" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="26" y="76" width="203" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="127" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Переривання &amp; Тригер</text>

  <rect x="30" y="118" width="195" height="72" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="38" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Давач (IMU / ADC)</text>
  <text x="38" y="154" font-size="12" fill="#6b7280">Сигнал DRDY (Data Ready)</text>
  <text x="38" y="172" font-size="12" fill="#c0392b">IRQ Line -&gt; Top-half ISR</text>

  <rect x="30" y="202" width="195" height="152" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="38" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">Обробник top-half:</text>
  <text x="38" y="238" font-size="12" font-weight="bold" fill="#2457d6">iio_trigger_poll()</text>
  <text x="38" y="262" font-size="12" fill="#1a1a1a">Фіксація часу:</text>
  <text x="38" y="280" font-size="12" fill="#2457d6">ktime_get_boottime_ns()</text>
  <text x="38" y="304" font-size="12" fill="#1a1a1a">Планування потоку:</text>
  <text x="38" y="322" font-size="12" fill="#6b7280">iio_pollfunc_store_time</text>
  <text x="38" y="340" font-size="12" fill="#6b7280">-&gt; Threaded IRQ</text>

  <rect x="30" y="366" width="195" height="122" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="38" y="386" font-size="12" font-weight="bold" fill="#2457d6">Результат кроку 1:</text>
  <text x="38" y="406" font-size="12" fill="#1a1a1a">• Зафіксовано timestamp</text>
  <text x="38" y="426" font-size="12" fill="#1a1a1a">• Запущено bottom-half</text>
  <text x="38" y="446" font-size="12" fill="#1a1a1a">• Мінімальна затримка</text>
  <text x="38" y="466" font-size="12" fill="#6b7280">  обробки переривання</text>

  <!-- Arrow 1 -->
  <line x1="237" y1="278" x2="251" y2="278" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Card 2 -->
  <rect x="255" y="70" width="215" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="261" y="76" width="203" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="362" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Trigger Handler</text>

  <rect x="265" y="118" width="195" height="72" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="273" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Контекст потоку ядра:</text>
  <text x="273" y="154" font-size="12" font-weight="bold" fill="#2457d6">iio_trigger_handler()</text>
  <text x="273" y="172" font-size="12" fill="#6b7280">Зчитування SPI / I2C шини</text>

  <rect x="265" y="202" width="195" height="152" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="273" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">Формат кадру в пам'яті:</text>
  <rect x="273" y="230" width="40" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="293" y="245" text-anchor="middle" font-size="11" fill="#2457d6">Ch0</text>
  <rect x="317" y="230" width="40" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="337" y="245" text-anchor="middle" font-size="11" fill="#2457d6">Ch1</text>
  <rect x="361" y="230" width="40" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="381" y="245" text-anchor="middle" font-size="11" fill="#2457d6">Ch2</text>
  <rect x="405" y="230" width="50" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="430" y="245" text-anchor="middle" font-size="11" fill="#27ae60">t-stamp</text>

  <text x="273" y="276" font-size="12" fill="#1a1a1a">• Вирівнювання: 8 байт</text>
  <text x="273" y="294" font-size="12" fill="#1a1a1a">• Упаковано scan_mask</text>
  <text x="273" y="316" font-size="12" fill="#2457d6">iio_push_to_buffers_</text>
  <text x="273" y="334" font-size="12" fill="#2457d6">  with_timestamp()</text>

  <rect x="265" y="366" width="195" height="122" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="273" y="386" font-size="12" font-weight="bold" fill="#2457d6">Результат кроку 2:</text>
  <text x="273" y="406" font-size="12" fill="#1a1a1a">• Всі канали прочитані</text>
  <text x="273" y="426" font-size="12" fill="#1a1a1a">• Сформовано структуру</text>
  <text x="273" y="446" font-size="12" fill="#1a1a1a">• Передано у кільцевий</text>
  <text x="273" y="466" font-size="12" fill="#6b7280">  буфер kfifo</text>

  <!-- Arrow 2 -->
  <line x1="472" y1="278" x2="486" y2="278" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Card 3 -->
  <rect x="490" y="70" width="215" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="496" y="76" width="203" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Буфер kfifo</text>

  <rect x="500" y="118" width="195" height="72" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="508" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Структура iio_kfifo:</text>
  <text x="508" y="154" font-size="12" fill="#6b7280">Кільцевий буфер в RAM</text>
  <text x="508" y="172" font-size="12" fill="#1a1a1a">Конфіг: watermarks / len</text>

  <rect x="500" y="202" width="195" height="152" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="508" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">Організація FIFO:</text>
  <rect x="508" y="230" width="42" height="22" rx="2" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="529" y="245" text-anchor="middle" font-size="11" fill="#6b7280">N-2</text>
  <rect x="554" y="230" width="42" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="575" y="245" text-anchor="middle" font-size="11" fill="#2457d6">N-1</text>
  <rect x="600" y="230" width="45" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="622" y="245" text-anchor="middle" font-size="11" fill="#27ae60">Кадр N</text>
  <rect x="649" y="230" width="41" height="22" rx="2" fill="white" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <text x="669" y="245" text-anchor="middle" font-size="11" fill="#6b7280">Вільн</text>

  <text x="508" y="276" font-size="12" fill="#1a1a1a">• Атомарний запис</text>
  <text x="508" y="294" font-size="12" fill="#1a1a1a">• Захист від втрати даних</text>
  <text x="508" y="316" font-size="12" font-weight="bold" fill="#27ae60">wake_up_interruptible()</text>
  <text x="508" y="334" font-size="12" fill="#6b7280">Сигнал чекаючим процесів</text>

  <rect x="500" y="366" width="195" height="122" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="508" y="386" font-size="12" font-weight="bold" fill="#27ae60">Результат кроку 3:</text>
  <text x="508" y="406" font-size="12" fill="#1a1a1a">• Дані збережено в kfifo</text>
  <text x="508" y="426" font-size="12" fill="#1a1a1a">• Згенеровано poll event</text>
  <text x="508" y="446" font-size="12" fill="#1a1a1a">• Готовність до читання</text>
  <text x="508" y="466" font-size="12" fill="#6b7280">  у користувацькому просторі</text>

  <!-- Arrow 3 -->
  <line x1="707" y1="278" x2="721" y2="278" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Card 4 -->
  <rect x="725" y="70" width="215" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="731" y="76" width="203" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="832" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">4. Простір користувача</text>

  <rect x="735" y="118" width="195" height="72" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="743" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Символьний пристрій:</text>
  <text x="743" y="154" font-size="12" font-weight="bold" fill="#2457d6">/dev/iio:device0</text>
  <text x="743" y="172" font-size="12" fill="#6b7280">/sys/bus/iio/devices/...</text>

  <rect x="735" y="202" width="195" height="152" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="743" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">Додаток користувача:</text>
  <text x="743" y="238" font-size="12" font-weight="bold" fill="#2457d6">poll(fd, POLLIN)</text>
  <text x="743" y="256" font-size="12" fill="#6b7280">Очікування події даних</text>
  <text x="743" y="280" font-size="12" font-weight="bold" fill="#27ae60">read(fd, buf, len)</text>
  <text x="743" y="298" font-size="12" fill="#1a1a1a">Зчитування точного кадру</text>
  <text x="743" y="316" font-size="12" fill="#1a1a1a">(канали + timestamp)</text>
  <text x="743" y="334" font-size="12" fill="#6b7280">Обробка в реальному часі</text>

  <rect x="735" y="366" width="195" height="122" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="743" y="386" font-size="12" font-weight="bold" fill="#27ae60">Завершення потоку:</text>
  <text x="743" y="406" font-size="12" fill="#1a1a1a">• Безвтратна передача</text>
  <text x="743" y="426" font-size="12" fill="#1a1a1a">• Часова синхронізація</text>
  <text x="743" y="446" font-size="12" fill="#1a1a1a">• Потокові дані IIO</text>
  <text x="743" y="466" font-size="12" fill="#6b7280">  готові до аналізу</text>
</svg>
