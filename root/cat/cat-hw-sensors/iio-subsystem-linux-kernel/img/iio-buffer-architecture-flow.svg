<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Dark Arrow (Hardware / Application Internal Flow) -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Blue Arrow (Kernel Write / Syscall Flow) -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Green Arrow (Data Refill / User Space Buffer Flow) -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Header: Title and Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура кільцевого буфера IIO та механізм refill у libiio</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Пакетне зчитування вимірів з Ring Buffer ядра в масив libiio без зайвого копіювання</text>

  <!-- ==================== PANEL 1: HARDWARE LEVEL ==================== -->
  <rect x="30" y="85" width="260" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Апаратний рівень</text>

  <!-- Sensor Box -->
  <rect x="50" y="130" width="220" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор / IMU</text>
  <text x="160" y="177" text-anchor="middle" font-size="12" fill="#6b7280">Апаратний вимірювач</text>
  <text x="160" y="199" text-anchor="middle" font-size="12" fill="#2457d6">Генерація даних (DRDY)</text>

  <!-- Arrow: Sensor -> Trigger -->
  <line x1="160" y1="220" x2="160" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="175" y="240" text-anchor="start" font-size="12" fill="#6b7280">IRQ</text>

  <!-- Trigger Box -->
  <rect x="50" y="255" width="220" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">IIO Trigger Source</text>
  <text x="160" y="302" text-anchor="middle" font-size="12" fill="#1a1a1a">Тригер дискретизації</text>
  <text x="160" y="324" text-anchor="middle" font-size="12" fill="#6b7280">Сигнал готовності (DRDY)</text>

  <!-- Arrow: Trigger -> Driver -->
  <line x1="160" y1="345" x2="160" y2="375" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="175" y="365" text-anchor="start" font-size="12" fill="#6b7280">Подія</text>

  <!-- Driver Box -->
  <rect x="50" y="380" width="220" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Драйвер IIO (Kernel)</text>
  <text x="160" y="425" text-anchor="middle" font-size="12" fill="#6b7280">Обробник переривань</text>
  <rect x="65" y="435" width="190" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">iio_push_to_buffers()</text>
  <text x="160" y="474" text-anchor="middle" font-size="12" fill="#6b7280">Запис вибірки в буфер</text>

  <!-- ==================== PANEL 2: KERNEL SPACE ==================== -->
  <rect x="320" y="85" width="310" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Простір ядра (Kernel Space)</text>

  <!-- Ring Buffer Container -->
  <rect x="335" y="130" width="280" height="235" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий буфер ядра (IIO Ring Buffer)</text>
  <text x="475" y="170" text-anchor="middle" font-size="12" fill="#6b7280">Буфер FIFO прямого доступу</text>

  <!-- Ready Block Highlight Border -->
  <rect x="344" y="181" width="154" height="50" rx="4" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Slots Array inside Ring Buffer -->
  <!-- Slot 0 (Ready / Read Tail) -->
  <rect x="348" y="185" width="46" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="371" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S[0]</text>

  <!-- Slot 1 (Ready) -->
  <rect x="398" y="185" width="46" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="421" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S[1]</text>

  <!-- Slot 2 (Ready) -->
  <rect x="448" y="185" width="46" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="471" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S[2]</text>

  <!-- Slot 3 (Writing / Write Head) -->
  <rect x="498" y="185" width="46" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="521" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">S[3]</text>

  <!-- Slot 4 (Empty) -->
  <rect x="548" y="185" width="46" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="571" y="210" text-anchor="middle" font-size="12" fill="#6b7280">S[4]</text>

  <!-- Read Pointer (Tail) -->
  <line x1="371" y1="260" x2="371" y2="233" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="371" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Read Tail</text>

  <!-- Write Pointer (Head) -->
  <line x1="521" y1="260" x2="521" y2="233" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="521" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Write Head</text>

  <!-- Buffer Explanatory Text -->
  <text x="475" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Готовий блок для refill (S[0]...S[2])</text>
  <text x="475" y="324" text-anchor="middle" font-size="12" fill="#6b7280">Захист від оновлення під час читання</text>
  <text x="475" y="343" text-anchor="middle" font-size="12" fill="#c0392b">Запобігання overrun (переповненню)</text>

  <!-- Char Device Box -->
  <rect x="335" y="380" width="280" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Символьний пристрій ядра</text>
  <rect x="355" y="417" width="240" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="475" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">/dev/iio:device0</text>
  <text x="475" y="475" text-anchor="middle" font-size="12" fill="#6b7280">Інтерфейс системного виклику read() / mmap</text>

  <!-- ==================== PANEL 3: USER SPACE ==================== -->
  <rect x="660" y="85" width="270" height="430" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Простір користувача (libiio)</text>

  <!-- libiio Container Box -->
  <rect x="680" y="130" width="230" height="115" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Бібліотека libiio</text>
  <rect x="695" y="163" width="200" height="32" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="795" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">iio_buffer_refill(buf)</text>
  <text x="795" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пакетне заповнення буфера</text>
  <text x="795" y="233" text-anchor="middle" font-size="12" fill="#6b7280">Мінімізація системних викликів</text>

  <!-- Arrow: libiio -> User Buffer -->
  <line x1="795" y1="245" x2="795" y2="268" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="805" y="260" text-anchor="start" font-size="12" fill="#27ae60">Заповнено</text>

  <!-- User Buffer Box -->
  <rect x="680" y="270" width="230" height="110" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Масив пам'яті libiio</text>

  <!-- User Slots Array -->
  <rect x="705" y="302" width="55" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="732" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S[0]</text>

  <rect x="767" y="302" width="55" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S[1]</text>

  <rect x="830" y="302" width="55" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="857" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">S[2]</text>

  <text x="795" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Локальний пакет вибірок</text>
  <text x="795" y="372" text-anchor="middle" font-size="12" fill="#6b7280">iio_buffer_first() ... step</text>

  <!-- Arrow: User Buffer -> User App -->
  <line x1="795" y1="380" x2="795" y2="403" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="805" y="395" text-anchor="start" font-size="12" fill="#6b7280">Ітерація</text>

  <!-- User Application Box -->
  <rect x="680" y="405" width="230" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Клієнтський додаток</text>
  <text x="795" y="449" text-anchor="middle" font-size="12" fill="#1a1a1a">C / Python (libiio-bindings)</text>
  <text x="795" y="471" text-anchor="middle" font-size="12" fill="#2457d6">Збереження / Онлайн-візуалізація</text>

  <!-- ==================== INTER-PANEL CONNECTIONS ==================== -->
  <!-- 1. Driver -> Ring Buffer (Blue Arrow, Write push) -->
  <path d="M 255 460 L 305 460 L 305 206 L 335 206" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2. libiio -> Char Device (Dashed Blue Arrow, Refill Syscall Request) -->
  <path d="M 695 179 L 640 179 L 640 433 L 615 433" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>

  <!-- 3. Ring Buffer -> User Buffer (Solid Green Thick Arrow, Refill Data Block) -->
  <path d="M 615 206 L 650 206 L 650 320 L 680 320" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
</svg>
