<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура iio_dev, приватний контекст та масив iio_chan_spec</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Масив специфікацій каналів визначає фізичні осі давача та маски sysfs-атрибутів</text>

  <!-- Панель 1: struct iio_dev -->
  <rect x="30" y="85" width="260" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="160" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура iio_dev</text>
  <text x="160" y="125" font-size="12" fill="#6b7280" text-anchor="middle">(головний об'єкт IIO-пристрою)</text>

  <!-- Поля iio_dev -->
  <rect x="45" y="140" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="55" y="161" font-size="12" font-weight="bold" fill="#1a1a1a">.name</text>
  <text x="265" y="161" font-size="12" fill="#6b7280" text-anchor="end">"mpu6050"</text>

  <rect x="45" y="182" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="55" y="203" font-size="12" font-weight="bold" fill="#1a1a1a">.info</text>
  <text x="265" y="203" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">&amp;mpu6050_info</text>

  <rect x="45" y="224" width="230" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="55" y="245" font-size="12" font-weight="bold" fill="#2457d6">.channels</text>
  <text x="265" y="245" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">&amp;channels[0]</text>

  <rect x="45" y="266" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="55" y="287" font-size="12" font-weight="bold" fill="#1a1a1a">.num_channels</text>
  <text x="265" y="287" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="end">3</text>

  <!-- Приватний контекст iio_priv() -->
  <rect x="45" y="312" width="230" height="205" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="160" y="332" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Приватна пам'ять драйвера</text>
  <text x="160" y="348" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">struct mpu6050_state</text>
  <text x="160" y="364" font-size="12" fill="#6b7280" text-anchor="middle">(через iio_priv(indio_dev))</text>

  <rect x="55" y="376" width="210" height="30" fill="#ffffff" stroke="#27ae60" rx="3"/>
  <text x="65" y="395" font-size="12" fill="#1a1a1a">struct i2c_client *client</text>

  <rect x="55" y="412" width="210" height="30" fill="#ffffff" stroke="#27ae60" rx="3"/>
  <text x="65" y="431" font-size="12" fill="#1a1a1a">struct mutex lock</text>

  <rect x="55" y="448" width="210" height="30" fill="#ffffff" stroke="#27ae60" rx="3"/>
  <text x="65" y="467" font-size="12" fill="#1a1a1a">u8 reg_cache[16]</text>

  <text x="160" y="501" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">&#x2713; Розміщена одразу за iio_dev</text>

  <!-- Панель 2A: struct iio_info -->
  <rect x="315" y="85" width="260" height="135" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="445" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">struct iio_info</text>
  <text x="445" y="125" font-size="12" fill="#6b7280" text-anchor="middle">(колбеки зчитування та запису)</text>

  <rect x="330" y="140" width="230" height="32" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="340" y="161" font-size="12" font-weight="bold" fill="#1a1a1a">.read_raw</text>
  <text x="550" y="161" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">mpu6050_read_raw</text>

  <rect x="330" y="178" width="230" height="32" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="340" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">.write_raw</text>
  <text x="550" y="199" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">mpu6050_write_raw</text>

  <!-- Панель 2B: sysfs Файли -->
  <rect x="315" y="235" width="260" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="445" y="258" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Генерування файлів sysfs</text>
  <text x="445" y="275" font-size="12" fill="#6b7280" text-anchor="middle">/sys/bus/iio/devices/iio:device0/</text>

  <rect x="330" y="290" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="340" y="311" font-size="12" font-weight="bold" fill="#1a1a1a">in_accel_x_raw</text>
  <text x="550" y="311" font-size="12" fill="#6b7280" text-anchor="end">(значення X)</text>

  <rect x="330" y="330" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="340" y="351" font-size="12" font-weight="bold" fill="#1a1a1a">in_accel_y_raw</text>
  <text x="550" y="351" font-size="12" fill="#6b7280" text-anchor="end">(значення Y)</text>

  <rect x="330" y="370" width="230" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="340" y="391" font-size="12" font-weight="bold" fill="#2457d6">in_accel_scale</text>
  <text x="550" y="391" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">(спільний scale)</text>

  <rect x="330" y="410" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="340" y="431" font-size="12" font-weight="bold" fill="#1a1a1a">in_temp_raw</text>
  <text x="550" y="431" font-size="12" fill="#6b7280" text-anchor="end">(температура)</text>

  <rect x="330" y="450" width="230" height="34" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="340" y="471" font-size="12" font-weight="bold" fill="#1a1a1a">in_temp_scale</text>
  <text x="550" y="471" font-size="12" fill="#6b7280" text-anchor="end">(масштаб T)</text>

  <text x="445" y="512" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">&#x2713; Зчитування sysfs викликає read_raw()</text>

  <!-- Панель 3: struct iio_chan_spec channels[] -->
  <rect x="600" y="85" width="330" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="765" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Масив iio_chan_spec channels[]</text>
  <text x="765" y="125" font-size="12" fill="#6b7280" text-anchor="middle">(специфікація фізичних каналів)</text>

  <!-- Канал 0 -->
  <rect x="615" y="140" width="300" height="118" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="615" y="140" width="300" height="26" fill="#eaf0fd" rx="6"/>
  <text x="625" y="158" font-size="12" font-weight="bold" fill="#2457d6">channels[0] &#x2014; IIO_ACCEL (Вісь X)</text>
  <text x="625" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">.type = IIO_ACCEL</text>
  <text x="905" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">[Вісь X]</text>
  <text x="625" y="200" font-size="12" font-weight="bold" fill="#1a1a1a">.modified = 1, .channel2 = IIO_MOD_X</text>
  <text x="625" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">.info_mask_separate</text>
  <text x="905" y="220" font-size="12" fill="#1a1a1a" text-anchor="end">= BIT(RAW)</text>
  <text x="625" y="240" font-size="12" font-weight="bold" fill="#2457d6">.info_mask_shared_by_type</text>
  <text x="905" y="240" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">= BIT(SCALE)</text>

  <!-- Канал 1 -->
  <rect x="615" y="268" width="300" height="118" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="615" y="268" width="300" height="26" fill="#eaf0fd" rx="6"/>
  <text x="625" y="286" font-size="12" font-weight="bold" fill="#2457d6">channels[1] &#x2014; IIO_ACCEL (Вісь Y)</text>
  <text x="625" y="308" font-size="12" font-weight="bold" fill="#1a1a1a">.type = IIO_ACCEL</text>
  <text x="905" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">[Вісь Y]</text>
  <text x="625" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">.modified = 1, .channel2 = IIO_MOD_Y</text>
  <text x="625" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">.info_mask_separate</text>
  <text x="905" y="348" font-size="12" fill="#1a1a1a" text-anchor="end">= BIT(RAW)</text>
  <text x="625" y="368" font-size="12" font-weight="bold" fill="#2457d6">.info_mask_shared_by_type</text>
  <text x="905" y="368" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">= BIT(SCALE)</text>

  <!-- Канал 2 -->
  <rect x="615" y="396" width="300" height="124" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="615" y="396" width="300" height="26" fill="#f4f6f8" rx="6"/>
  <text x="625" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">channels[2] &#x2014; IIO_TEMP (Температура)</text>
  <text x="625" y="435" font-size="12" font-weight="bold" fill="#1a1a1a">.type = IIO_TEMP</text>
  <text x="905" y="435" font-size="12" fill="#6b7280" text-anchor="end">[без модифікатора]</text>
  <text x="625" y="455" font-size="12" font-weight="bold" fill="#1a1a1a">.info_mask_separate</text>
  <text x="905" y="455" font-size="12" fill="#1a1a1a" text-anchor="end">= BIT(RAW)</text>
  <text x="625" y="475" font-size="12" font-weight="bold" fill="#1a1a1a">.info_mask_separate</text>
  <text x="905" y="475" font-size="12" fill="#1a1a1a" text-anchor="end">|= BIT(SCALE)</text>
  <text x="765" y="504" font-size="12" fill="#6b7280" text-anchor="middle">(індивідуальний масштабувальний коефіцієнт)</text>

  <!-- Стрілки зв'язку -->
  <!-- 1. Вказівник .info -> struct iio_info -->
  <path d="M 275 201 H 295 V 140 H 315" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 2. Вказівник .channels -> channels[] -->
  <path d="M 275 243 H 302 V 227 H 582 V 145 H 600" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 3. Зв'язки масок з sysfs-файлами -->
  <path d="M 615 220 H 585 V 307 H 560" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 615 348 H 588 V 347 H 560" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 615 240 H 591 V 387 H 560" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 615 368 H 591" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 615 455 H 585 V 427 H 560" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 615 475 H 588 V 467 H 560" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
</svg>
