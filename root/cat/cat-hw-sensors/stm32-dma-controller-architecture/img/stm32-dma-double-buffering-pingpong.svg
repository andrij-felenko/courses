<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Апаратний подвійний буфер DMA (Double-Buffer Mode / Ping-Pong)
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Автоматичне перемикання цільових буферів M0AR та M1AR за бітом CT без участі ядра процесора
  </text>

  <!-- Left: Phase 1 (CT = 0) -->
  <rect x="40" y="90" width="425" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="90" width="425" height="34" rx="10" fill="#0369a1"/>
  <text x="252" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Фаза 1: Біт CT = 0 (Запис у Буфер 0)
  </text>

  <g transform="translate(60, 145)">
    <!-- Peripheral DMA Flow -->
    <rect x="0" y="0" width="130" height="40" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="24" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">Камера DCMI</text>

    <line x1="130" y1="20" x2="180" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>

    <!-- Target Buffer 0 Active -->
    <rect x="185" y="0" width="200" height="40" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="285" y="24" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">
      Буфер 0 (M0AR): ЗАПИС DMA
    </text>

    <!-- Buffer 1 Processed by CPU -->
    <rect x="185" y="65" width="200" height="40" rx="5" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="285" y="89" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">
      Буфер 1 (M1AR): ЧИТАННЯ CPU
    </text>

    <line x1="130" y1="85" x2="180" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="0" y="65" width="130" height="40" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="89" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">Cortex-M Ядро</text>
  </g>

  <!-- Hardware Flip Event in Phase 1 -->
  <rect x="60" y="275" width="385" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">
    Подія завершення передачі (NDTR = 0):
  </text>
  <text x="80" y="325" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">1. Апаратний блок DMA генерує переривання TCIF (Transfer Complete).</text>
  <text x="80" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">2. Біт CT автоматично перемикається: CT = 1.</text>
  <text x="80" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">3. Лічильник NDTR миттєво перезавантажується початковим числом.</text>
  <text x="80" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">4. Потік пікселів продовжується в Буфер 1 без жодного втраченого такту!</text>
  <text x="80" y="415" font-family="monospace" font-size="10" fill="#34d399">Час перемикання буферів: 0 наносекунд (Hardware)</text>

  <!-- Right: Phase 2 (CT = 1) -->
  <rect x="495" y="90" width="425" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="495" y="90" width="425" height="34" rx="10" fill="#4338ca"/>
  <text x="707" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Фаза 2: Біт CT = 1 (Запис у Буфер 1)
  </text>

  <g transform="translate(515, 145)">
    <!-- Peripheral DMA Flow -->
    <rect x="0" y="65" width="130" height="40" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="65" y="89" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">Камера DCMI</text>

    <line x1="130" y1="85" x2="180" y2="85" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)"/>

    <!-- Target Buffer 1 Active -->
    <rect x="185" y="65" width="200" height="40" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <text x="285" y="89" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">
      Буфер 1 (M1AR): ЗАПИС DMA
    </text>

    <!-- Buffer 0 Processed by CPU -->
    <rect x="185" y="0" width="200" height="40" rx="5" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="285" y="24" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">
      Буфер 0 (M0AR): ЧИТАННЯ CPU
    </text>

    <line x1="130" y1="20" x2="180" y2="20" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="0" y="0" width="130" height="40" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="24" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">Cortex-M Ядро</text>
  </g>

  <!-- Hardware Flip Event in Phase 2 -->
  <rect x="515" y="275" width="385" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="535" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">
    Переваги Double-Buffer Mode (DBM):
  </text>
  <text x="535" y="325" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Повна ліквідація гонки даних (Race Conditions).</text>
  <text x="535" y="345" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Процесор може динамічно змінювати адресу пасивного буфера</text>
  <text x="535" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">  прямо під час активної передачі потоку DMA!</text>
  <text x="535" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Дозволяє організувати нескінченний конвеєр відеокадрів</text>
  <text x="535" y="415" font-family="monospace" font-size="10" fill="#38bdf8">DMA_SxCR: біт DBM = 1, біт EN = 1</text>

  <!-- Footer note -->
  <rect x="40" y="485" width="880" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="480" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
    Двобуферний режим підтримується всіма 8 потоками DMA1 та DMA2 у процесорах STM32F4 / F7 / H7.
  </text>
</svg>