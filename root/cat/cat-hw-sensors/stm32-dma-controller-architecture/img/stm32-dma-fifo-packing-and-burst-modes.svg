<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Апаратне пакування даних (Packing) та пакетний режим (Burst Mode) в DMA
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Трансформація 8-бітних байтів периферії у 32-бітні слова пам'яті через 16-байтовий FIFO
  </text>

  <!-- Left Box: Data Packing / Unpacking Mechanism -->
  <rect x="40" y="90" width="425" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="90" width="425" height="34" rx="10" fill="#0369a1"/>
  <text x="252" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. Апаратне пакування (Data Packing)
  </text>

  <!-- 4 separate bytes from peripheral -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      Периферія (PSIZE = Byte, 8 біт):
    </text>

    <!-- 4 bytes visual -->
    <rect x="0" y="15" width="40" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="37" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">B0</text>

    <rect x="50" y="15" width="40" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="37" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">B1</text>

    <rect x="100" y="15" width="40" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="37" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">B2</text>

    <rect x="150" y="15" width="40" height="35" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="37" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">B3</text>

    <!-- Packing Arrow -->
    <path d="M 210 32 L 255 32" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Accumulated 32-bit Word -->
    <rect x="270" y="15" width="115" height="35" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="327" y="37" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">
      [B3][B2][B1][B0]
    </text>
    <text x="270" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">MSIZE = Word (32 біти)</text>
  </g>

  <!-- FIFO Threshold explanation -->
  <rect x="60" y="245" width="385" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">
    Пороги спрацьовування FIFO (FTH):
  </text>
  <text x="80" y="295" font-family="monospace" font-size="11" fill="#cbd5e1">• 00: 1/4 FIFO (1 слово = 4 байти)</text>
  <text x="80" y="315" font-family="monospace" font-size="11" fill="#cbd5e1">• 01: 1/2 FIFO (2 слова = 8 байтів)</text>
  <text x="80" y="335" font-family="monospace" font-size="11" fill="#cbd5e1">• 10: 3/4 FIFO (3 слова = 12 байтів)</text>
  <text x="80" y="355" font-family="monospace" font-size="11" fill="#34d399">• 11: FULL FIFO (4 слова = 16 байтів)</text>

  <rect x="75" y="375" width="355" height="80" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="90" y="398" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Перевага апаратного пакування:</text>
  <text x="90" y="418" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Замість 4 окремих транзакцій запису по 8 біт DMA виконує</text>
  <text x="90" y="434" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">всього 1 транзакцію запису 32 біти в SRAM. Навантаження на шину</text>
  <text x="90" y="450" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">знижується рівно в 4 рази!</text>

  <!-- Right Box: Burst Mode vs Single Transfer -->
  <rect x="495" y="90" width="425" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="495" y="90" width="425" height="34" rx="10" fill="#4338ca"/>
  <text x="707" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. Пакетна передача (Burst Transfer)
  </text>

  <!-- Single Transfer Diagram -->
  <g transform="translate(515, 140)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">
      Поодинокий трансфер (Single Transfer):
    </text>
    <rect x="0" y="25" width="85" height="30" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="42" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">Addr + Data</text>

    <text x="95" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">-> Арбітраж -></text>

    <rect x="180" y="25" width="85" height="30" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="222" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">Addr + Data</text>

    <text x="0" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Повторний арбітраж адреси для КОЖНОГО слова (високий оверхед)</text>
  </g>

  <!-- Burst Transfer Diagram -->
  <g transform="translate(515, 240)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">
      Пакетний трансфер 4 слів (Burst INC4):
    </text>
    <!-- 1 Address beat -->
    <rect x="0" y="25" width="60" height="30" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="30" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">Адреса</text>

    <!-- 4 Data beats back-to-back -->
    <rect x="65" y="25" width="60" height="30" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="95" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">Слово 0</text>

    <rect x="130" y="25" width="60" height="30" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="160" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">Слово 1</text>

    <rect x="195" y="25" width="60" height="30" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="225" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">Слово 2</text>

    <rect x="260" y="25" width="60" height="30" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="290" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">Слово 3</text>

    <text x="0" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">1 арбітраж адреси -> неперервна передача 16 байтів за 4 такти шини!</text>
  </g>

  <!-- Burst Config Summary -->
  <rect x="515" y="345" width="385" height="125" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="535" y="370" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">
    Параметри Burst у регістрі DMA_SxCR:
  </text>
  <text x="535" y="392" font-family="monospace" font-size="11" fill="#cbd5e1">• MBURST = 01 (INC4) — пакет з 4 слів (ідеально для FIFO)</text>
  <text x="535" y="412" font-family="monospace" font-size="11" fill="#cbd5e1">• MBURST = 10 (INC8) — пакет з 8 слів (зовнішня SDRAM)</text>
  <text x="535" y="432" font-family="monospace" font-size="11" fill="#cbd5e1">• MBURST = 11 (INC16) — пакет з 16 слів (максимальний Burst)</text>
  <text x="535" y="455" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
    *Умова: адреса в пам'яті повинна бути кратна розміру пакета (вирівнювання 16/32 байти).
  </text>
</svg>