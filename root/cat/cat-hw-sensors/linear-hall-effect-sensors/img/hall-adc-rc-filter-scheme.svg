<svg viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <marker id="arr-axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрахунок та амплітудно-частотна характеристика RC-фільтра АЦП</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Узгодження вихідного імпедансу давача з комутованою ємністю вибірки АЦП та пригнічення шуму</text>

  <!-- Left: Schematic and Math Formula -->
  <rect x="30" y="80" width="380" height="330" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Схема RC-ланки</text>

  <!-- Sensor Terminal -->
  <rect x="50" y="130" width="70" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="85" y="155" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">V_OUT</text>

  <!-- Wire & Resistor R -->
  <line x1="120" y1="150" x2="160" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="160" y="142" width="50" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="185" y="135" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R = 1 kΩ</text>

  <!-- Wire & Capacitor C -->
  <line x1="210" y1="150" x2="270" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="270" cy="150" r="3" fill="#1a1a1a"/>
  <line x1="270" y1="150" x2="270" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="180" x2="280" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="260" y1="186" x2="280" y2="186" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="186" x2="270" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="262" y1="215" x2="278" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="185" font-size="11" font-weight="bold" fill="#1a1a1a">C = 100 nF</text>

  <!-- Output to ADC -->
  <line x1="270" y1="150" x2="340" y2="150" stroke="#27ae60" stroke-width="2"/>
  <rect x="340" y="130" width="55" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="367" y="155" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ADC</text>

  <!-- Formula Box -->
  <rect x="50" y="240" width="340" height="150" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="65" y="265" font-size="12" font-weight="bold" fill="#1e293b">Розрахунок частоти зрізу f_c:</text>
  <text x="65" y="295" font-size="13" font-family="Consolas, monospace" fill="#2457d6">f_c = 1 / (2 · π · R · C)</text>
  <text x="65" y="325" font-size="12" font-family="Consolas, monospace" fill="#1e293b">f_c = 1 / (2 · 3.14159 · 1000 · 100e-9)</text>
  <text x="65" y="355" font-size="13" font-weight="bold" font-family="Consolas, monospace" fill="#27ae60">f_c ≈ 1591.55 Hz (1.59 kHz)</text>
  <text x="65" y="380" font-size="10" fill="#64748b">Повне пригнічення чопперного шуму f_clk (100+ кГц)</text>

  <!-- Right: Bode Frequency Response Plot -->
  <rect x="440" y="80" width="490" height="330" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Амплітудно-частотна характеристика (АЧХ)</text>

  <!-- Bode Axes -->
  <line x1="500" y1="360" x2="900" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="500" y1="360" x2="500" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <text x="900" y="380" font-size="11" font-weight="bold" fill="#1a1a1a">Частота f (Гц, log)</text>
  <text x="500" y="120" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коефіцієнт передачі (дБ)</text>

  <text x="490" y="155" font-size="10" fill="#64748b" text-anchor="end">0 dB</text>
  <text x="490" y="200" font-size="10" fill="#2457d6" text-anchor="end">-3 dB</text>
  <text x="490" y="270" font-size="10" fill="#c0392b" text-anchor="end">-20 dB</text>
  <text x="490" y="340" font-size="10" fill="#c0392b" text-anchor="end">-40 dB</text>

  <line x1="500" y1="150" x2="880" y2="150" stroke="#e2e8f0" stroke-dasharray="2,2"/>
  <line x1="500" y1="200" x2="880" y2="200" stroke="#2457d6" stroke-dasharray="3,3"/>

  <!-- Frequency Grid Marks -->
  <text x="530" y="375" font-size="10" fill="#64748b" text-anchor="middle">10 Гц</text>
  <text x="620" y="375" font-size="10" fill="#64748b" text-anchor="middle">100 Гц</text>
  <text x="710" y="375" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">1.59 кГц</text>
  <text x="800" y="375" font-size="10" fill="#64748b" text-anchor="middle">20 кГц</text>
  <text x="870" y="375" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">100 кГц</text>

  <!-- Cutoff line vertical -->
  <line x1="710" y1="150" x2="710" y2="360" stroke="#2457d6" stroke-dasharray="3,3"/>

  <!-- Frequency Response Curve -->
  <path d="M 500 150 L 660 150 Q 710 160 740 210 L 890 350" fill="none" stroke="#27ae60" stroke-width="3"/>
  <circle cx="710" cy="200" r="4" fill="#2457d6"/>

  <text x="610" y="170" font-size="11" font-weight="bold" fill="#27ae60">Смуга пропускання сигналу</text>
  <text x="780" y="270" font-size="11" font-weight="bold" fill="#c0392b">Спад -20 дБ/декаду</text>
  <text x="820" y="330" font-size="10" fill="#c0392b">Пригнічення &gt; 36 дБ</text>

  <!-- Bottom Summary -->
  <rect x="30" y="430" width="900" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="460" font-size="12" font-weight="bold" fill="#1e293b">ІНЖЕНЕРНИЙ БАЛАНС:</text>
  <text x="210" y="453" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#2457d6">Вибір опору R (1 кОм):</tspan> обмежує вхідний струм, не перевантажуючи вхідний комутатор АЦП</text>
  <text x="210" y="473" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#27ae60">Вибір ємності C (10–100 нФ):</tspan> створює низькоомний резервуар заряду для конденсатора вибірки C_sample АЦП</text>
</svg>