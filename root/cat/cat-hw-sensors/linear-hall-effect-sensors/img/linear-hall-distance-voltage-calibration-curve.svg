<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Калібрувальна крива залежності напруги давача Холла від відстані</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Нелінійний закон спаду індукції магніту 1/r³ та лініаризована функція відновлення дистанції</text>

  <!-- Left: Physical Setup Diagram -->
  <rect x="30" y="80" width="280" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="105" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Фізична вимірювальна схема</text>

  <!-- Magnet -->
  <rect x="120" y="130" width="100" height="35" rx="3" fill="#c0392b"/>
  <text x="170" y="152" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ПОЛЮС S (North/South)</text>
  <rect x="120" y="165" width="100" height="35" rx="3" fill="#2457d6"/>
  <text x="170" y="187" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ПОЛЮС N</text>

  <!-- Arrow Distance d -->
  <line x1="170" y1="205" x2="170" y2="295" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <line x1="170" y1="295" x2="170" y2="205" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <text x="195" y="255" font-size="13" font-weight="bold" fill="#1a1a1a">Відстань d</text>

  <!-- Sensor IC -->
  <rect x="130" y="305" width="80" height="40" rx="4" fill="#334155"/>
  <text x="170" y="330" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SS49E</text>
  <line x1="150" y1="345" x2="150" y2="385" stroke="#64748b" stroke-width="2"/>
  <line x1="170" y1="345" x2="170" y2="385" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="345" x2="190" y2="385" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="405" font-size="11" fill="#64748b" text-anchor="middle">Виводи: VCC, GND, VOUT</text>

  <!-- Right: Plot Area -->
  <rect x="330" y="80" width="600" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Plot Axes -->
  <line x1="390" y1="380" x2="900" y2="380" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <line x1="390" y1="380" x2="390" y2="95" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>

  <!-- Axis Titles -->
  <text x="900" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Відстань d (мм)</text>
  <text x="390" y="88" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_OUT (В) / Відновлене d</text>

  <!-- Curve 1: Raw Voltage (Nonlinear 1/d^3) -->
  <path d="M 400 120 L 440 125 Q 500 150 560 270 T 880 345" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="610" y="240" font-size="12" font-weight="bold" fill="#c0392b">V_out(d) — нелінійний сигнал ~ 1/d³</text>

  <!-- Quiescent reference line -->
  <line x1="390" y1="350" x2="880" y2="350" stroke="#94a3b8" stroke-dasharray="4,4"/>
  <text x="380" y="354" font-size="11" fill="#64748b" text-anchor="end">2.5 В (B=0)</text>

  <!-- Saturation line -->
  <line x1="390" y1="120" x2="880" y2="120" stroke="#c0392b" stroke-dasharray="3,3"/>
  <text x="380" y="124" font-size="11" fill="#c0392b" text-anchor="end">4.8 В (Насичення)</text>

  <!-- Curve 2: Calibrated Linear Distance Output (Green) -->
  <line x1="440" y1="380" x2="840" y2="140" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="760" y="170" font-size="12" font-weight="bold" fill="#27ae60">Лініаризоване d після LUT / Полінома</text>

  <!-- Measurement Zones -->
  <!-- Zone 1: Dead/Sat zone -->
  <rect x="390" y="380" width="50" height="20" fill="#fee2e2"/>
  <text x="415" y="395" font-size="9" fill="#c0392b" text-anchor="middle">Насич.</text>

  <!-- Zone 2: Active Working Zone -->
  <rect x="440" y="380" width="300" height="20" fill="#dcfce7"/>
  <text x="590" y="395" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Робоча зона калібрування (1 мм … 12 мм)</text>

  <!-- Zone 3: Far zone -->
  <rect x="740" y="380" width="140" height="20" fill="#f1f5f9"/>
  <text x="810" y="395" font-size="9" fill="#64748b" text-anchor="middle">Шумове плато</text>

  <!-- Bottom Callouts -->
  <rect x="30" y="445" width="900" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="475" font-size="12" font-weight="bold" fill="#1e293b">МЕТОДИКА ЛІНІАРИЗАЦІЇ:</text>
  <text x="230" y="468" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#2457d6">1. Look-Up Table (LUT):</tspan> збережена сітка пар (V_i, d_i) з лінійною інтерполяцією між сусідніми точками</text>
  <text x="230" y="488" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#27ae60">2. Поліном 3-го степеня:</tspan> d(V) = c0 + c1*V + c2*V² + c3*V³ — обчислювальна економія пам'яті</text>
</svg>