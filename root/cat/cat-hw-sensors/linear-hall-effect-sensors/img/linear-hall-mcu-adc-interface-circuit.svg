<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення лінійного давача Холла до АЦП мікроконтролера</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Раціометричне спільне живлення, блокувальний конденсатор та протиаліасинговий RC-фільтр</text>

  <!-- Panel 1: Linear Sensor SS49E -->
  <rect x="40" y="80" width="240" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Давач SS49E / A1302</text>
  <text x="160" y="123" font-size="11" fill="#64748b" text-anchor="middle">Корпус TO-92 (Аналоговий)</text>

  <!-- Sensor Internal Box -->
  <rect x="55" y="140" width="210" height="260" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="75" y="160" width="60" height="45" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="105" y="180" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Hall</text>
  <text x="105" y="195" font-size="9" fill="#64748b" text-anchor="middle">Plate</text>

  <rect x="155" y="160" width="90" height="45" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="180" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Підсилювач</text>
  <text x="200" y="195" font-size="9" fill="#64748b" text-anchor="middle">зсув VCC/2</text>

  <!-- Pins -->
  <circle cx="265" cy="230" r="4" fill="#c0392b"/>
  <text x="255" y="225" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">Pin 1 (VCC)</text>

  <circle cx="265" cy="280" r="4" fill="#2457d6"/>
  <text x="255" y="275" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Pin 3 (VOUT)</text>

  <circle cx="265" cy="350" r="4" fill="#1a1a1a"/>
  <text x="255" y="345" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">Pin 2 (GND)</text>

  <!-- Panel 2: Signal Conditioning & Filtering -->
  <rect x="310" y="80" width="340" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Фільтрація та захист</text>
  <text x="480" y="123" font-size="11" fill="#64748b" text-anchor="middle">RC протиаліасинг та шунтування</text>

  <!-- Decoupling Cap C1 -->
  <line x1="265" y1="230" x2="350" y2="230" stroke="#c0392b" stroke-width="2"/>
  <circle cx="350" cy="230" r="3" fill="#c0392b"/>
  <line x1="350" y1="230" x2="350" y2="270" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="340" y1="270" x2="360" y2="270" stroke="#c0392b" stroke-width="2"/>
  <line x1="340" y1="276" x2="360" y2="276" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="350" y1="276" x2="350" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="350" r="3" fill="#1a1a1a"/>
  <text x="330" y="295" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1 = 100 nF</text>
  <text x="330" y="310" font-size="9" fill="#64748b" text-anchor="end">Блокувальний</text>

  <!-- Resistor R1 -->
  <line x1="265" y1="280" x2="400" y2="280" stroke="#2457d6" stroke-width="2"/>
  <rect x="400" y="272" width="45" height="16" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="422" y="265" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">R1 = 1 kΩ</text>
  <line x1="445" y1="280" x2="520" y2="280" stroke="#2457d6" stroke-width="2"/>

  <!-- Filter Cap C2 -->
  <circle cx="520" cy="280" r="3" fill="#2457d6"/>
  <line x1="520" y1="280" x2="520" y2="305" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="510" y1="305" x2="530" y2="305" stroke="#2457d6" stroke-width="2"/>
  <line x1="510" y1="311" x2="530" y2="311" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="520" y1="311" x2="520" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="520" cy="350" r="3" fill="#1a1a1a"/>
  <text x="545" y="305" font-size="11" font-weight="bold" fill="#1a1a1a">C2 = 10 nF</text>
  <text x="545" y="320" font-size="9" fill="#27ae60">ФНЧ (fc ≈ 15.9 kHz)</text>

  <!-- Line to MCU -->
  <line x1="520" y1="280" x2="680" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Ground Bar -->
  <line x1="265" y1="350" x2="680" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="370" font-size="11" fill="#64748b" text-anchor="middle">Спільна шина заземлення (GND plane)</text>

  <!-- Panel 3: MCU ADC -->
  <rect x="680" y="80" width="240" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="800" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="800" y="123" font-size="11" fill="#64748b" text-anchor="middle">STM32 / ESP32 / AVR</text>

  <!-- MCU Inner Box -->
  <rect x="695" y="140" width="210" height="260" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="715" y="255" width="170" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="800" y="275" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">12-бітний SAR ADC</text>
  <text x="800" y="293" font-size="10" fill="#64748b" text-anchor="middle">Вхід: ADC_CH1</text>

  <!-- VREF Rail Linking to VCC -->
  <line x1="350" y1="230" x2="800" y2="230" stroke="#c0392b" stroke-width="2"/>
  <circle cx="800" cy="230" r="3" fill="#c0392b"/>
  <line x1="800" y1="230" x2="800" y2="255" stroke="#c0392b" stroke-width="1.5"/>
  <text x="800" y="220" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Опора VREF = VCC (Спільне джерело)</text>

  <!-- Bottom Cards -->
  <rect x="40" y="445" width="880" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="475" font-size="12" font-weight="bold" fill="#1e293b">ПРАВИЛА РОЗВЕДЕННЯ:</text>
  <text x="240" y="468" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#c0392b">1. Спільне VCC:</tspan> живлення давача та опора АЦП від однієї шини для раціометричної компенсації</text>
  <text x="240" y="488" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#2457d6">2. Блокування C1:</tspan> керамічний конденсатор 100 нФ монтується безпосередньо біля виводів давача</text>
</svg>