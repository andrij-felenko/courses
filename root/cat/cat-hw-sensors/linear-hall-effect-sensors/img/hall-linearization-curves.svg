<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Програмні алгоритми лініаризації: Look-Up Table (LUT) та поліном</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння кусково-лінійної інтерполяції за калібрувальними вузлами та аналітичної апроксимації</text>

  <!-- Left: LUT Graph -->
  <rect x="30" y="80" width="435" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="247" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Таблиця пошуку LUT (Кусково-лінійна)</text>

  <!-- Axes Left -->
  <line x1="70" y1="380" x2="430" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="70" y1="380" x2="70" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <text x="430" y="398" font-size="11" font-weight="bold" fill="#1a1a1a">Код АЦП D</text>
  <text x="70" y="112" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відстань d (мм)</text>

  <!-- Theoretical true non-linear curve (dashed) -->
  <path d="M 80 360 Q 150 300 240 200 T 410 140" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- LUT Piecewise line segments -->
  <line x1="80" y1="360" x2="150" y2="310" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="150" y1="310" x2="230" y2="230" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="230" y1="230" x2="320" y2="170" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="320" y1="170" x2="410" y2="140" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Nodes -->
  <circle cx="80" cy="360" r="4" fill="#2457d6"/>
  <circle cx="150" cy="310" r="4" fill="#2457d6"/>
  <circle cx="230" cy="230" r="4" fill="#2457d6"/>
  <circle cx="320" cy="170" r="4" fill="#2457d6"/>
  <circle cx="410" cy="140" r="4" fill="#2457d6"/>

  <text x="150" y="295" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">(D_1, d_1)</text>
  <text x="230" y="215" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">(D_2, d_2)</text>
  <text x="320" y="155" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">(D_3, d_3)</text>

  <rect x="85" y="130" width="230" height="55" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="95" y="150" font-size="10" font-weight="bold" fill="#2457d6">Формула інтерполяції:</text>
  <text x="95" y="168" font-size="10" font-family="Consolas, monospace" fill="#1e293b">d = d_i + (D - D_i) · Δd / ΔD</text>

  <!-- Right: Polynomial Graph -->
  <rect x="495" y="80" width="435" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="712" y="105" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">2. Поліном 3-го степеня (МНК)</text>

  <!-- Axes Right -->
  <line x1="535" y1="380" x2="895" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="535" y1="380" x2="535" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <text x="895" y="398" font-size="11" font-weight="bold" fill="#1a1a1a">Код АЦП D</text>
  <text x="535" y="112" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відстань d (мм)</text>

  <!-- Smooth Polynomial Curve -->
  <path d="M 545 360 Q 615 295 705 200 T 875 140" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- Measured Points vs Curve -->
  <circle cx="580" cy="330" r="3.5" fill="#c0392b"/>
  <circle cx="630" cy="275" r="3.5" fill="#c0392b"/>
  <circle cx="705" cy="200" r="3.5" fill="#c0392b"/>
  <circle cx="790" cy="165" r="3.5" fill="#c0392b"/>
  <circle cx="850" cy="145" r="3.5" fill="#c0392b"/>

  <rect x="550" y="130" width="260" height="55" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="560" y="150" font-size="10" font-weight="bold" fill="#16a34a">Поліноміальна функція:</text>
  <text x="560" y="168" font-size="10" font-family="Consolas, monospace" fill="#1e293b">d(D) = c0 + c1·D + c2·D² + c3·D³</text>

  <text x="712" y="260" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Гладка аналітична крива без зламів</text>
  <text x="712" y="280" font-size="10" fill="#64748b" text-anchor="middle">Коефіцієнти розраховані методом найменших квадратів</text>

  <!-- Bottom Comparison Table -->
  <rect x="30" y="435" width="900" height="70" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="458" font-size="12" font-weight="bold" fill="#1e293b">ПОРІВНЯННЯ МЕТОДІВ:</text>
  <text x="210" y="458" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#2457d6">Look-Up Table (LUT):</tspan> швидке виконання (цілочисельне ділення), описує довільні складні спади, потребує пам'яті масиву</text>
  <text x="210" y="482" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#16a34a">Поліном 3-го степеня:</tspan> компактне зберігання (4 числа float), відсутність зламів інтерполяції, вимагає FPU або обчислень float</text>
</svg>