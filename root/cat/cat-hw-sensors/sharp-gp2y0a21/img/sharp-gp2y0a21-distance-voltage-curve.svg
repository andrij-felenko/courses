<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність вихідної напруги GP2Y0A21YK0F від відстані</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Оптична мертва зона (&lt; 10 см) створює неоднозначність; робочий діапазон — 10–80 см</text>

  <!-- Background Regions for Dead Zone & Working Range -->
  <rect x="140" y="98" width="90" height="292" fill="#fdecea" opacity="0.5"/>
  <rect x="230" y="98" width="630" height="292" fill="#e9f7ef" opacity="0.35"/>

  <!-- Zone Badges at Top of Chart -->
  <rect x="140" y="70" width="90" height="20" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="185" y="84" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Мертва зона</text>

  <rect x="240" y="70" width="620" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="550" y="84" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий діапазон вимірювань (10 – 80 см)</text>

  <!-- Horizontal Grid Lines -->
  <line x1="140" y1="350" x2="860" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="310" x2="860" y2="310" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="270" x2="860" y2="270" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="230" x2="860" y2="230" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="190" x2="860" y2="190" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="150" x2="860" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Vertical Grid Lines -->
  <line x1="230" y1="136" x2="230" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="230" y1="275" x2="230" y2="390" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>

  <line x1="320" y1="98" x2="320" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="410" y1="98" x2="410" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="500" y1="98" x2="500" y2="128" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="228" x2="500" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="590" y1="98" x2="590" y2="128" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="590" y1="228" x2="590" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="680" y1="98" x2="680" y2="128" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="680" y1="228" x2="680" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="770" y1="98" x2="770" y2="128" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="770" y1="228" x2="770" y2="390" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <line x1="860" y1="98" x2="860" y2="390" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Axes -->
  <!-- Y-Axis -->
  <line x1="140" y1="390" x2="140" y2="92" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- X-Axis -->
  <line x1="140" y1="390" x2="880" y2="390" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Y-Axis Ticks & Labels -->
  <line x1="134" y1="350" x2="140" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="354" font-size="12" fill="#6b7280" text-anchor="end">0.5 В</text>

  <line x1="134" y1="310" x2="140" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="314" font-size="12" fill="#6b7280" text-anchor="end">1.0 В</text>

  <line x1="134" y1="270" x2="140" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="274" font-size="12" fill="#6b7280" text-anchor="end">1.5 В</text>

  <line x1="134" y1="230" x2="140" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="234" font-size="12" fill="#6b7280" text-anchor="end">2.0 В</text>

  <line x1="134" y1="190" x2="140" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="194" font-size="12" fill="#6b7280" text-anchor="end">2.5 В</text>

  <line x1="134" y1="150" x2="140" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="154" font-size="12" fill="#6b7280" text-anchor="end">3.0 В</text>

  <text x="128" y="394" font-size="12" fill="#6b7280" text-anchor="end">0.0 В</text>

  <!-- Y-Axis Title -->
  <text x="128" y="105" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_out (В)</text>

  <!-- X-Axis Ticks & Labels -->
  <line x1="140" y1="390" x2="140" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="410" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="230" y1="390" x2="230" y2="395" stroke="#c0392b" stroke-width="1.5"/>
  <text x="230" y="410" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">10</text>

  <line x1="320" y1="390" x2="320" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="410" font-size="12" fill="#6b7280" text-anchor="middle">20</text>

  <line x1="410" y1="390" x2="410" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="410" y="410" font-size="12" fill="#6b7280" text-anchor="middle">30</text>

  <line x1="500" y1="390" x2="500" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="410" font-size="12" fill="#6b7280" text-anchor="middle">40</text>

  <line x1="590" y1="390" x2="590" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="590" y="410" font-size="12" fill="#6b7280" text-anchor="middle">50</text>

  <line x1="680" y1="390" x2="680" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="410" font-size="12" fill="#6b7280" text-anchor="middle">60</text>

  <line x1="770" y1="390" x2="770" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="770" y="410" font-size="12" fill="#6b7280" text-anchor="middle">70</text>

  <line x1="860" y1="390" x2="860" y2="395" stroke="#27ae60" stroke-width="1.5"/>
  <text x="860" y="410" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">80</text>

  <!-- X-Axis Title -->
  <text x="500" y="432" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відстань до об'єкта d (см)</text>

  <!-- Curve Paths -->
  <!-- Working range curve: d=10 (230, 206) to d=80 (860, 358) -->
  <path d="M 230,206 C 265,252 290,272 320,286 C 360,302 385,312 410,318 C 455,327 475,331 500,334 C 545,340 565,343 590,346 C 635,349 720,355 860,358" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dead zone curve: d=0 (140, 358) -> peak d=6 (194, 142) -> d=10 (230, 206) -->
  <path d="M 140,358 C 152,340 165,240 194,142 C 206,142 218,178 230,206" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-dasharray="6 3" stroke-linecap="round"/>

  <!-- Peak Point -->
  <line x1="194" y1="142" x2="194" y2="390" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="194" cy="142" r="5" fill="#c0392b" stroke="white" stroke-width="2"/>
  <text x="202" y="125" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_max ≈ 3.1 В (~6 см)</text>

  <!-- Ambiguity Line -->
  <line x1="170" y1="262" x2="284" y2="262" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="170" cy="262" r="4" fill="#c0392b"/>
  <circle cx="284" cy="262" r="4" fill="#c0392b"/>
  <text x="227" y="248" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Однакова V = 1.6 В</text>
  <text x="227" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">при 3.3 см і 16 см!</text>

  <!-- Key Points -->
  <circle cx="230" cy="206" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <text x="242" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">10 см: 2.3 В</text>

  <circle cx="860" cy="358" r="4.5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <text x="848" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">80 см: 0.4 В</text>

  <!-- Model Info Card -->
  <rect x="530" y="135" width="310" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="685" y="157" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Математична модель триангуляції</text>
  <text x="685" y="178" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_out ≈ k / (d + d₀)   ⇒   1 / V_out ∝ d</text>
  <text x="685" y="198" font-size="12" fill="#6b7280" text-anchor="middle">Обернена залежність: розрахунок d = k₁ / V + k₂</text>

  <!-- Summary Card -->
  <rect x="80" y="448" width="800" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="470" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Висновок: об'єкти ближче 10 см дають хибне значення напруги; у робочому діапазоні (10–80 см) потрібна лінеаризація 1/V</text>
</svg>
