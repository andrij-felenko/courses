<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Принцип оптичної триангуляції в давачах Sharp PSD</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зміна відстані до об'єкта змінює кут відбитого променя та зсуває пляму світла на PSD</text>

  <!-- Main Sensor Chassis Panel (Left) -->
  <rect x="25" y="85" width="230" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="95" width="200" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="114" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Корпус давача (Sensor Module)</text>

  <!-- Emitter LED Unit -->
  <rect x="45" y="140" width="70" height="50" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="80" y="162" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">ІЧ-LED</text>
  <text x="80" y="178" font-size="12" fill="#6b7280" text-anchor="middle">(випромінювач)</text>

  <!-- Lens 1 (Emitter Lens) -->
  <path d="M 175 140 A 12 25 0 0 1 175 190 A 12 25 0 0 1 175 140 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="175" y="133" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Лінза L₁</text>

  <!-- Lens 2 (Receiver Lens) -->
  <path d="M 175 315 A 12 35 0 0 1 175 385 A 12 35 0 0 1 175 315 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="175" y="308" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Лінза L₂</text>

  <!-- Baseline B -->
  <line x1="140" y1="165" x2="140" y2="350" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="132" y="260" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">База B</text>

  <!-- Focal Length f -->
  <line x1="90" y1="290" x2="175" y2="290" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="132" y="285" font-size="12" fill="#6b7280" text-anchor="middle">Фокус f</text>

  <!-- PSD Sensor Matrix -->
  <!-- Optical axis of receiver lens -->
  <line x1="75" y1="350" x2="175" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- PSD Strip -->
  <rect x="85" y="320" width="10" height="150" rx="2" fill="#1a1a1a"/>
  <!-- PSD active surface highlight -->
  <rect x="93" y="320" width="2" height="150" fill="#2457d6"/>
  <text x="90" y="490" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">PSD-сенсор</text>

  <!-- Light spots on PSD -->
  <!-- Optical Axis tick on PSD (y=350) -->
  <line x1="80" y1="350" x2="100" y2="350" stroke="#ffffff" stroke-width="1"/>
  <text x="74" y="354" font-size="12" fill="#6b7280" text-anchor="end">Вісь 0</text>

  <!-- Spot 2 (Far Object) at y = 377 -->
  <circle cx="94" cy="377" r="4.5" fill="#27ae60" stroke="white" stroke-width="1"/>
  <text x="74" y="381" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">x₂</text>

  <!-- Spot 1 (Near Object) at y = 415 -->
  <circle cx="94" cy="415" r="4.5" fill="#c0392b" stroke="white" stroke-width="1"/>
  <text x="74" y="419" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">x₁</text>

  <!-- Delta x bracket / label on the left -->
  <line x1="52" y1="377" x2="52" y2="415" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="48" y1="377" x2="56" y2="377" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="48" y1="415" x2="56" y2="415" stroke="#1a1a1a" stroke-width="1"/>
  <text x="42" y="400" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Δx</text>

  <!-- OBJECTS -->
  <!-- Projected Ray (Emitted Beam) -->
  <line x1="187" y1="165" x2="820" y2="165" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="270" y="138" width="180" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="360" y="153" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Випромінений ІЧ-промінь</text>

  <!-- Near Object (Object 1) -->
  <rect x="475" y="110" width="12" height="110" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="425" y="78" width="112" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="481" y="95" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Об'єкт 1 (близько)</text>

  <!-- Far Object (Object 2) -->
  <rect x="795" y="110" width="12" height="110" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="745" y="78" width="112" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="801" y="95" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Об'єкт 2 (далеко)</text>

  <!-- Distance Lines d1 and d2 -->
  <line x1="175" y1="230" x2="475" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="325" y="223" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Відстань d₁</text>

  <line x1="175" y1="260" x2="795" y2="260" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="635" y="253" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Відстань d₂</text>

  <!-- Reflected Rays -->
  <!-- Reflected Ray 1 (Near Object) -->
  <polyline points="481,165 175,350 94,415" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Reflected Ray 2 (Far Object) -->
  <polyline points="801,165 175,350 94,377" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Angles theta1 and theta2 at Lens 2 center (175, 350) -->
  <line x1="175" y1="350" x2="480" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <path d="M 235 350 A 60 60 0 0 0 227 321" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="330" font-size="12" font-weight="700" fill="#c0392b">θ₁</text>

  <path d="M 265 350 A 90 90 0 0 0 261 333" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="275" y="346" font-size="12" font-weight="700" fill="#27ae60">θ₂</text>

  <!-- RIGHT EXPLANATION PANEL -->
  <rect x="270" y="295" width="660" height="220" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Sub-card 1: Math Formula -->
  <rect x="285" y="310" width="305" height="190" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="295" y="320" width="285" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="437" y="336" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Формула триангуляції</text>

  <text x="300" y="365" font-size="13" font-weight="700" fill="#1a1a1a">Подібність трикутників:  x / f = B / d</text>
  <text x="300" y="390" font-size="13" font-weight="700" fill="#2457d6">Обчислення відстані:  d = (f · B) / x</text>
  <text x="300" y="415" font-size="12" fill="#6b7280">• x — зсув плями світла на PSD-матриці</text>
  <text x="300" y="435" font-size="12" fill="#6b7280">• f — фокусна відстань приймальної лінзи</text>
  <text x="300" y="455" font-size="12" fill="#6b7280">• B — оптична база між лінзами L₁ та L₂</text>
  <text x="300" y="482" font-size="12" font-weight="700" fill="#c0392b">Характеристика d(x) — нелінійна (1/x)</text>

  <!-- Sub-card 2: Key Advantages -->
  <rect x="605" y="310" width="310" height="190" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="615" y="320" width="290" height="24" rx="4" fill="#27ae60" stroke="#27ae60"/>
  <text x="760" y="336" font-size="12" font-weight="700" fill="white" text-anchor="middle">Чому триангуляція Sharp PSD?</text>

  <text x="620" y="365" font-size="12" font-weight="700" fill="#1a1a1a">✔ Вимірюється КУТ θ, а не інтенсивність</text>
  <text x="620" y="390" font-size="12" fill="#1a1a1a">✔ Незалежність від кольору та відбивності</text>
  <text x="620" y="415" font-size="12" fill="#1a1a1a">✔ Стійкість до фактури матеріалу об'єкта</text>
  <text x="620" y="440" font-size="12" fill="#1a1a1a">✔ Фізичне пригнічення завад освітлення</text>
  <text x="620" y="482" font-size="12" font-weight="700" fill="#27ae60">Стандарт триангуляції в робототехніці</text>
</svg>
