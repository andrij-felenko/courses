<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема розв'язки живлення давача Sharp GP2Y0A21YK0F</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Конденсатор C ≥ 10 мкФ біля роз'єму давача компенсує імпульси струму 200 мА та стабілізує сигнал Vo</text>

  <!-- Panel 1: Top Panel (Schematic) -->
  <rect x="30" y="70" width="900" height="215" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">Електрична схема та правильне розміщення фільтра живлення</text>

  <!-- MCU Box -->
  <rect x="55" y="105" width="165" height="150" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="137.5" y="127" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="137.5" y="144" font-size="12" fill="#6b7280" text-anchor="middle">(Arduino / STM32 / ESP32)</text>
  <text x="205" y="164" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5V</text>
  <text x="205" y="204" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">ADC (A0)</text>
  <text x="205" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="220" cy="160" r="3" fill="#c0392b"/>
  <circle cx="220" cy="200" r="3" fill="#2457d6"/>
  <circle cx="220" cy="230" r="3" fill="#1a1a1a"/>

  <!-- Connecting Wires -->
  <!-- VCC Wire -->
  <line x1="220" y1="160" x2="685" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="350" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC (+5V)</text>

  <!-- Vo Wire -->
  <line x1="685" y1="200" x2="616" y2="200" stroke="#2457d6" stroke-width="2"/>
  <path d="M 616,200 A 6,6 0 0 0 604,200" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="604" y1="200" x2="220" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="350" y="192" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Vo (Аналоговий сигнал)</text>

  <!-- GND Wire -->
  <line x1="220" y1="230" x2="685" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="350" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (Спільна земля)</text>

  <!-- Decoupling Filter Highlight Box & Capacitor C1 -->
  <rect x="510" y="122" width="145" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="582.5" y="115" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фільтр живлення</text>

  <!-- Capacitor C1 Connections & Symbol -->
  <circle cx="610" cy="160" r="3.5" fill="#27ae60"/>
  <circle cx="610" cy="230" r="3.5" fill="#27ae60"/>
  <line x1="610" y1="160" x2="610" y2="180" stroke="#27ae60" stroke-width="2"/>
  <line x1="610" y1="188" x2="610" y2="230" stroke="#27ae60" stroke-width="2"/>
  <!-- Top Plate -->
  <line x1="598" y1="180" x2="622" y2="180" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Bottom Plate -->
  <line x1="598" y1="188" x2="622" y2="188" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Plus sign -->
  <text x="626" y="180" font-size="12" font-weight="bold" fill="#c0392b">+</text>

  <!-- Capacitor C1 Labels -->
  <text x="594" y="177" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">C1 ≥ 10 мкФ</text>
  <text x="594" y="196" font-size="11" fill="#6b7280" text-anchor="end">(електроліт)</text>

  <text x="582.5" y="267" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Конденсатор C1 встановлювати</text>
  <text x="582.5" y="279" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">максимально близько до роз'єму</text>

  <!-- Sensor Box -->
  <rect x="685" y="105" width="230" height="150" rx="6" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="800" y="127" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sharp GP2Y0A21YK0F</text>
  <text x="800" y="144" font-size="12" fill="#6b7280" text-anchor="middle">ІЧ-далекомір (10–80 см)</text>
  <text x="700" y="164" font-size="12" font-weight="bold" fill="#c0392b">VCC (4.5–5.5В)</text>
  <text x="700" y="204" font-size="12" font-weight="bold" fill="#2457d6">Vo (0.4–3.1В)</text>
  <text x="700" y="234" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="800" y="248" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Піки струму ІЧ LED: I_peak ≈ 200 мА</text>
  <circle cx="685" cy="160" r="3" fill="#c0392b"/>
  <circle cx="685" cy="200" r="3" fill="#2457d6"/>
  <circle cx="685" cy="230" r="3" fill="#1a1a1a"/>

  <!-- Panel 2: Problem Panel (Left Bottom) -->
  <rect x="30" y="300" width="438" height="160" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="45" y="322" font-size="13" font-weight="bold" fill="#c0392b">❌ БЕЗ згладжувального конденсатора</text>
  <text x="45" y="338" font-size="12" fill="#6b7280">Просідання живлення через імпульси струму 200 мА</text>
  <text x="45" y="365" font-size="12" fill="#c0392b">• Падіння VCC під час спалаху ІЧ</text>
  <text x="45" y="390" font-size="12" fill="#c0392b">• Високочастотний шум на Vo</text>
  <text x="45" y="415" font-size="12" fill="#c0392b">• Хибні вимірювання в АЦП</text>
  <text x="45" y="440" font-size="12" fill="#c0392b">• Збої живлення суміжних давачів</text>

  <!-- Problem Waveform Plot -->
  <text x="395" y="356" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Просідання VCC</text>
  <text x="338" y="375" font-size="11" fill="#6b7280" text-anchor="end">5.0V</text>
  <line x1="342" y1="370" x2="452" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 342,370 L 365,370 L 367,390 L 377,390 L 379,370 L 405,370 L 407,390 L 417,390 L 419,370 L 452,370" fill="none" stroke="#c0392b" stroke-width="2"/>

  <text x="338" y="425" font-size="11" fill="#6b7280" text-anchor="end">Vo</text>
  <line x1="342" y1="425" x2="452" y2="425" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 342,425 L 365,425 L 366,415 L 368,433 L 371,418 L 377,425 L 405,425 L 406,415 L 408,433 L 411,418 L 417,425 L 452,425" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Panel 3: Solution Panel (Right Bottom) -->
  <rect x="492" y="300" width="438" height="160" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="507" y="322" font-size="13" font-weight="bold" fill="#27ae60">✓ З згладжувальним конденсатором C1</text>
  <text x="507" y="338" font-size="12" fill="#6b7280">C1 = 10..47 мкФ локально біля давача</text>
  <text x="507" y="365" font-size="12" fill="#27ae60">• Стабільне VCC без просідань</text>
  <text x="507" y="390" font-size="12" fill="#27ae60">• Чистий сигнал Vo без шуму</text>
  <text x="507" y="415" font-size="12" fill="#27ae60">• Точні вимірювання АЦП</text>
  <text x="507" y="440" font-size="12" fill="#27ae60">• Захист шини живлення системи</text>

  <!-- Solution Waveform Plot -->
  <text x="855" y="356" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">VCC = const</text>
  <text x="800" y="375" font-size="11" fill="#6b7280" text-anchor="end">5.0V</text>
  <line x1="805" y1="370" x2="915" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="805" y1="370" x2="915" y2="370" stroke="#27ae60" stroke-width="2"/>

  <text x="800" y="425" font-size="11" fill="#6b7280" text-anchor="end">Vo</text>
  <line x1="805" y1="425" x2="915" y2="425" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="805" y1="425" x2="915" y2="425" stroke="#2457d6" stroke-width="2"/>
</svg>
