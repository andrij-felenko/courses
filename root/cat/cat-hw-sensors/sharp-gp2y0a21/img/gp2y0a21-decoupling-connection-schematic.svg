<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення та шунтування давача Sharp GP2Y0A21YK0F</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Шунтувальні конденсатори біля давача гасять струмові піки ІЧ-діода та стабілізують сигнал</text>

  <!-- Panel 1: Sensor Unit -->
  <rect x="35" y="85" width="240" height="310" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="155" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ІЧ-давач Sharp GP2Y0A21</text>
  <text x="155" y="128" font-size="12" fill="#6b7280" text-anchor="middle">(Аналоговий далекомір 10–80 см)</text>

  <!-- Sensor Internal Blocks -->
  <rect x="48" y="145" width="196" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="146" y="164" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ІЧ-випромінювач (LED)</text>
  <text x="146" y="181" font-size="12" fill="#6b7280" text-anchor="middle">Імпульси струму до 50 мА</text>

  <rect x="48" y="205" width="196" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="146" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PSD-приймач та IC</text>
  <text x="146" y="241" font-size="12" fill="#6b7280" text-anchor="middle">Формування виходу Vo</text>

  <!-- Sensor Pins Labels -->
  <text x="268" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Vcc</text>
  <text x="268" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Vo</text>
  <text x="268" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Panel 2: Decoupling Zone -->
  <rect x="300" y="85" width="360" height="310" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="480" y="110" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Розв'язувальні конденсатори</text>
  <text x="480" y="128" font-size="12" fill="#6b7280" text-anchor="middle">(Монтаж безпосередньо біля давача)</text>

  <!-- Wire Labels in Panel 2 -->
  <text x="312" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Vcc (+5V)</text>
  <text x="312" y="238" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Vo (Сигнал)</text>
  <text x="312" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND (Земля)</text>

  <!-- Horizontal Power & Signal Wires -->
  <!-- Vcc Line -->
  <line x1="685" y1="160" x2="275" y2="160" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Vo Signal Line with Crossover Arcs over vertical wires at x=430 and x=535 -->
  <path d="M 275,250 L 422,250 A 8 8 0 0 1 438,250 L 527,250 A 8 8 0 0 1 543,250 L 685,250" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- GND Line -->
  <line x1="275" y1="350" x2="685" y2="350" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Capacitor C1 Branch (Electrolytic) at x=430 -->
  <line x1="430" y1="160" x2="430" y2="192" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="204" x2="430" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <!-- C1 Top Plate -->
  <line x1="417" y1="192" x2="443" y2="192" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="412" y="188" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">+</text>
  <!-- C1 Bottom Plate -->
  <line x1="417" y1="204" x2="443" y2="204" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- C1 Junction Dots -->
  <circle cx="430" cy="160" r="4" fill="#c0392b"/>
  <circle cx="430" cy="350" r="4" fill="#1a1a1a"/>
  <!-- C1 Labels (positioned to the left of x=430 wire, away from all lines) -->
  <text x="420" y="275" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1: 10–47 мкФ</text>
  <text x="420" y="291" font-size="12" fill="#6b7280" text-anchor="end">Електролітичний</text>
  <text x="420" y="307" font-size="12" fill="#6b7280" text-anchor="end">НЧ-резервуар</text>

  <!-- Capacitor C2 Branch (Ceramic) at x=535 -->
  <line x1="535" y1="160" x2="535" y2="192" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="535" y1="204" x2="535" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <!-- C2 Top Plate -->
  <line x1="522" y1="192" x2="548" y2="192" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- C2 Bottom Plate -->
  <line x1="522" y1="204" x2="548" y2="204" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- C2 Junction Dots -->
  <circle cx="535" cy="160" r="4" fill="#c0392b"/>
  <circle cx="535" cy="350" r="4" fill="#1a1a1a"/>
  <!-- C2 Labels (positioned to the right of x=535 wire, away from all lines) -->
  <text x="545" y="275" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C2: 0.1 мкФ</text>
  <text x="545" y="291" font-size="12" fill="#6b7280" text-anchor="start">Керамічний</text>
  <text x="545" y="307" font-size="12" fill="#6b7280" text-anchor="start">ВЧ-фільтр завад</text>

  <!-- Terminal Nodes at Sensor (x=275) -->
  <circle cx="275" cy="160" r="4" fill="#c0392b"/>
  <circle cx="275" cy="250" r="4" fill="#2457d6"/>
  <circle cx="275" cy="350" r="4" fill="#1a1a1a"/>

  <!-- Panel 3: Microcontroller (MCU) -->
  <rect x="685" y="85" width="240" height="310" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="805" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="805" y="128" font-size="12" fill="#6b7280" text-anchor="middle">(Arduino / STM32 / ESP32)</text>

  <!-- Terminal Nodes at MCU (x=685) -->
  <circle cx="685" cy="160" r="4" fill="#c0392b"/>
  <circle cx="685" cy="250" r="4" fill="#2457d6"/>
  <circle cx="685" cy="350" r="4" fill="#1a1a1a"/>

  <!-- MCU Pin Labels -->
  <text x="695" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+5V</text>
  <text x="695" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">ADC</text>
  <text x="695" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- MCU Internal Module Box -->
  <rect x="715" y="260" width="190" height="64" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="278" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль АЦП (ADC)</text>
  <text x="810" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Оцифрування напруги Vo</text>
  <text x="810" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Лінеаризація (LUT / 1/V)</text>

  <!-- Bottom Explanatory Comparison Cards -->
  <!-- Card 1: Problem / Without Decoupling -->
  <rect x="35" y="415" width="435" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="436" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">⚠️ Без розв'язувальних конденсаторів:</text>
  <text x="50" y="457" font-size="12" fill="#1a1a1a" text-anchor="start">• Спалахи ІЧ-діода створюють просідання Vcc (до 200–400 мВ)</text>
  <text x="50" y="477" font-size="12" fill="#1a1a1a" text-anchor="start">• Вихідний сигнал Vo містить високочастотні шуми та піки</text>
  <text x="50" y="497" font-size="12" fill="#1a1a1a" text-anchor="start">• Виміряна відстань АЦП нестабільна («плавають» покази)</text>

  <!-- Card 2: Solution / With Decoupling -->
  <rect x="490" y="415" width="435" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="436" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">✅ З правильним шунтуванням (C1 + C2):</text>
  <text x="505" y="457" font-size="12" fill="#1a1a1a" text-anchor="start">• C1 (10–47 мкФ) живить імпульси діода з конденсатора</text>
  <text x="505" y="477" font-size="12" fill="#1a1a1a" text-anchor="start">• C2 (0.1 мкФ) приглушує високочастотні завади в колі</text>
  <text x="505" y="497" font-size="12" fill="#1a1a1a" text-anchor="start">• Сигнал Vo чистий — оцифрування АЦП точне й відтворюване</text>
</svg>
