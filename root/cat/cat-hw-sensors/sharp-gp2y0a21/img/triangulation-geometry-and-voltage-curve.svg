<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-gray-rev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-dark-rev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип геометричної тріангуляції та характеристика напруги Sharp GP2Y0A21</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Зсув плями x ∝ 1/d на PSD-сенсорі формує нелінійну залежність напруги V(d) у діапазоні 10–80 см</text>

  <!-- Left Panel Container -->
  <rect x="25" y="75" width="445" height="445" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрична модель тріангулятора</text>
  <text x="247.5" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Закон подібних трикутників: x / f = L / d  ⇒  x = (f · L) / d</text>

  <!-- Object 2 (Far, d2 = 60 cm) -->
  <rect x="60" y="146" width="80" height="8" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="148" y="154" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Об'єкт 2 (d₂ = 60 см)</text>

  <!-- Object 1 (Near, d1 = 15 cm) -->
  <rect x="60" y="236" width="80" height="8" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="148" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Об'єкт 1 (d₁ = 15 см)</text>

  <!-- Distance Measurement Lines -->
  <!-- d2 line -->
  <line x1="38" y1="430" x2="38" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-start="url(#arr-gray-rev)" marker-end="url(#arr-gray)"/>
  <text x="36" y="295" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">d₂</text>

  <!-- d1 line -->
  <line x1="50" y1="430" x2="50" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="46" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">d₁</text>

  <!-- Emitter IR LED -->
  <rect x="78" y="424" width="24" height="12" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="78" y="436" width="24" height="14" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="90" y="458" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ІЧ-діод</text>

  <!-- Emitter Light Beams -->
  <!-- Beam to Object 1 -->
  <line x1="90" y1="424" x2="90" y2="240" stroke="#2457d6" stroke-width="2"/>
  <!-- Beam extension to Object 2 -->
  <line x1="90" y1="240" x2="90" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Baseline L dimension line -->
  <line x1="90" y1="412" x2="210" y2="412" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark-rev)" marker-end="url(#arr-dark)"/>
  <text x="150" y="405" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">База L</text>

  <!-- Lens Center Optical Axis -->
  <line x1="210" y1="130" x2="210" y2="495" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Receiver Lens -->
  <ellipse cx="210" cy="430" rx="16" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="235" y="434" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Лінза приймача</text>

  <!-- Focal Length f dimension line -->
  <line x1="280" y1="430" x2="280" y2="470" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark-rev)" marker-end="url(#arr-dark)"/>
  <text x="288" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">f (фокус)</text>

  <!-- Reflected Rays -->
  <!-- Ray 1 (Object 1 near) -->
  <line x1="90" y1="240" x2="210" y2="430" stroke="#2457d6" stroke-width="2"/>
  <line x1="210" y1="430" x2="235.3" y2="470" stroke="#2457d6" stroke-width="2"/>

  <!-- Ray 2 (Object 2 far) -->
  <line x1="90" y1="150" x2="210" y2="430" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="210" y1="430" x2="227.1" y2="470" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- PSD Array Detector -->
  <rect x="170" y="470" width="90" height="8" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="235.3" cy="474" r="4" fill="#2457d6"/>
  <circle cx="227.1" cy="474" r="3" fill="#6b7280"/>
  <text x="168" y="478" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">PSD-сенсор</text>

  <!-- Displacement Dimensions -->
  <!-- x1 displacement line -->
  <line x1="210" y1="496" x2="235.3" y2="496" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="222.6" y="510" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">зсув x₁</text>

  <!-- x2 label note -->
  <text x="300" y="488" font-size="12" fill="#6b7280" text-anchor="start">зсув x₂ &lt; x₁</text>

  <!-- Left Panel Takeaway Box -->
  <rect x="290" y="278" width="170" height="110" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="375" y="298" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ключовий зв'язок:</text>
  <text x="375" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">d ↓ (близько)</text>
  <text x="375" y="336" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">⇒ зсув x ↑ (більше)</text>
  <text x="375" y="356" font-size="12" fill="#1a1a1a" text-anchor="middle">d ↑ (далеко)</text>
  <text x="375" y="374" font-size="12" fill="#6b7280" font-weight="bold" text-anchor="middle">⇒ зсув x ↓ (менше)</text>

  <!-- Right Panel Container -->
  <rect x="490" y="75" width="445" height="445" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристика вихідної напруги V(d)</text>
  <text x="712.5" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Нелінійна обернена залежність: V = a / (d + b)</text>

  <!-- Shaded Regions -->
  <!-- Dead zone background (< 10 cm) -->
  <rect x="550" y="160" width="44" height="290" fill="#fdecea" opacity="0.6"/>
  <text x="572" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Сліпа зона</text>
  <text x="572" y="152" font-size="12" fill="#c0392b" text-anchor="middle">(&lt; 10 см)</text>

  <!-- Operating range background (10–80 cm) -->
  <rect x="594" y="160" width="306" height="290" fill="#e9f7ef" opacity="0.4"/>
  <text x="747" y="138" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий діапазон (10–80 см)</text>

  <!-- Grid lines -->
  <line x1="550" y1="160" x2="900" y2="160" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="550" y1="208" x2="900" y2="208" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="550" y1="257" x2="900" y2="257" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="550" y1="309" x2="900" y2="309" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="550" y1="357" x2="900" y2="357" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="550" y1="406" x2="900" y2="406" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>

  <line x1="594" y1="160" x2="594" y2="450" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="638" y1="160" x2="638" y2="450" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="725" y1="160" x2="725" y2="450" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="813" y1="160" x2="813" y2="450" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="900" y1="160" x2="900" y2="450" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Formula Card on Graph -->
  <rect x="640" y="168" width="220" height="72" rx="6" ry="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="750" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Модель лінеаризації:</text>
  <text x="750" y="208" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V = a / (d + b)  ⇔  d = a/V − b</text>
  <text x="750" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Гіперболічна апроксимація</text>

  <!-- Point 1 dashed guide lines -->
  <line x1="616" y1="450" x2="616" y2="291" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="550" y1="291" x2="616" y2="291" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Point 2 dashed guide lines -->
  <line x1="813" y1="450" x2="813" y2="397" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="550" y1="397" x2="813" y2="397" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Voltage Curve -->
  <path d="M 550,411 C 562,340 574,185 581,189 C 590,195 594,228 616,291 C 650,338 720,377 900,409" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Peak arrow callout in dead zone -->
  <line x1="544" y1="188" x2="574" y2="188" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="540" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Пік напруги (~2.7 В)</text>
  <text x="540" y="195" font-size="12" fill="#c0392b" text-anchor="end">(неоднозначність!)</text>

  <!-- Curve Points Markers -->
  <circle cx="616" cy="291" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="626" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">d₁ = 15 см ⇒ V₁ ≈ 1.65 В</text>

  <circle cx="813" cy="397" r="5" fill="#6b7280" stroke="#ffffff" stroke-width="1.5"/>
  <text x="803" y="385" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">d₂ = 60 см ⇒ V₂ ≈ 0.55 В</text>

  <!-- Axes -->
  <!-- Y Axis -->
  <line x1="550" y1="450" x2="550" y2="155" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="535" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Напруга V (В)</text>

  <!-- Y Ticks -->
  <text x="542" y="164" font-size="12" fill="#6b7280" text-anchor="end">3.0</text>
  <text x="542" y="212" font-size="12" fill="#6b7280" text-anchor="end">2.5</text>
  <text x="542" y="261" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>
  <text x="542" y="309" font-size="12" fill="#6b7280" text-anchor="end">1.5</text>
  <text x="542" y="357" font-size="12" fill="#6b7280" text-anchor="end">1.0</text>
  <text x="542" y="406" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>
  <text x="542" y="454" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>

  <!-- X Axis -->
  <line x1="550" y1="450" x2="910" y2="450" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="900" y="495" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Відстань d (см)</text>

  <!-- X Ticks -->
  <text x="550" y="472" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="594" y="472" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">10</text>
  <text x="638" y="472" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <text x="725" y="472" font-size="12" fill="#6b7280" text-anchor="middle">40</text>
  <text x="813" y="472" font-size="12" fill="#6b7280" text-anchor="middle">60</text>
  <text x="900" y="472" font-size="12" fill="#6b7280" text-anchor="middle">80</text>
</svg>
