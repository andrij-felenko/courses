<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип оптичної триангуляції ІЧ-далекоміра Sharp GP2Y0A21</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Зміщення плями на PSD-детекторі пропорційне 1/d, що дає нелінійну залежність напруги</text>

  <!-- Left Main Panel: Optical Path Diagram -->
  <rect x="25" y="75" width="595" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Оптичний тракт та хід променів</text>

  <!-- Object 1 (Far object) -->
  <rect x="130" y="122" width="360" height="22" rx="4" fill="#ffffff" stroke="#2457d6" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="310" y="137" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Далекий об'єкт (d₁ = 60 см)</text>

  <!-- Object 2 (Near object) -->
  <rect x="130" y="222" width="360" height="22" rx="4" fill="#ffffff" stroke="#27ae60" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="310" y="237" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Близький об'єкт (d₂ = 20 см)</text>

  <!-- Dimension line d2 (20 cm) -->
  <line x1="60" y1="365" x2="60" y2="233" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="68" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">d₂ = 20 см</text>

  <!-- Dimension line d1 (60 cm) -->
  <line x1="525" y1="365" x2="525" y2="133" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="533" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">d₁ = 60 см</text>

  <!-- Emitted IR Beam -->
  <line x1="175" y1="440" x2="175" y2="133" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="163" y="180" font-size="12" fill="#c0392b" text-anchor="end">ІЧ-промінь</text>

  <!-- Reflected Rays -->
  <!-- Ray 1 (Far Object, Blue) -->
  <line x1="175" y1="133" x2="390" y2="365" stroke="#2457d6" stroke-width="2"/>
  <line x1="390" y1="365" x2="465" y2="435" stroke="#2457d6" stroke-width="2"/>

  <!-- Ray 2 (Near Object, Green) -->
  <line x1="175" y1="233" x2="390" y2="365" stroke="#27ae60" stroke-width="2"/>
  <line x1="390" y1="365" x2="540" y2="435" stroke="#27ae60" stroke-width="2"/>

  <!-- Sensor Module Housing Box -->
  <rect x="80" y="365" width="520" height="125" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Sensor Housing Label -->
  <text x="92" y="382" font-size="11" font-weight="bold" fill="#6b7280">
    <tspan x="92" dy="0">Корпус</tspan>
    <tspan x="92" dy="13">датчика</tspan>
  </text>

  <!-- Emitter Lens -->
  <path d="M 150,365 C 150,357 200,357 200,365 C 200,373 150,373 150,365 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="163" y="350" font-size="12" fill="#2457d6" text-anchor="end">Лінза випромінювача</text>

  <!-- Receiver Lens -->
  <path d="M 365,365 C 365,357 415,357 415,365 C 415,373 365,373 365,365 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="402" y="350" font-size="12" fill="#2457d6" text-anchor="start">Лінза приймача</text>

  <!-- Baseline L -->
  <line x1="175" y1="380" x2="390" y2="380" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="282.5" y="396" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Базова відстань L</text>

  <!-- IR LED element -->
  <rect x="160" y="440" width="30" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="175" y="476" font-size="12" fill="#1a1a1a" text-anchor="middle">ІЧ-світлодіод</text>

  <!-- PSD Detector strip -->
  <rect x="365" y="435" width="220" height="14" rx="3" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Spots on PSD -->
  <circle cx="465" cy="442" r="4.5" fill="#2457d6"/>
  <text x="465" y="425" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">x₁</text>

  <circle cx="540" cy="442" r="4.5" fill="#27ae60"/>
  <text x="540" y="425" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">x₂</text>

  <!-- Extension lines & Spot displacement delta x -->
  <line x1="465" y1="449" x2="465" y2="464" stroke="#1a1a1a" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="540" y1="449" x2="540" y2="464" stroke="#1a1a1a" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="465" y1="458" x2="540" y2="458" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr-black)"/>
  <text x="502.5" y="455" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δx</text>

  <!-- PSD detector text -->
  <text x="477.5" y="482" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PSD-детектор (лінійка фотодіода)</text>

  <!-- Right Top Panel: Geometry & Formula -->
  <rect x="635" y="75" width="300" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="650" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Математика триангуляції</text>

  <rect x="650" y="112" width="270" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="785" y="136" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">x = (f · L) / d  ⇒  x ∝ 1/d</text>

  <text x="650" y="168" font-size="12" fill="#1a1a1a">• L — базова відстань між лінзами</text>
  <text x="650" y="188" font-size="12" fill="#1a1a1a">• f — фокусна відстань лінзи</text>
  <text x="650" y="208" font-size="12" fill="#1a1a1a">• d — відстань до об'єкта</text>
  <text x="650" y="228" font-size="12" fill="#1a1a1a">• x — зміщення плями на PSD</text>

  <rect x="650" y="242" width="270" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="259" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ближче об'єкт ⇒ більший кут і зміщення</text>

  <!-- Right Bottom Panel: Vout(d) Graph -->
  <rect x="635" y="295" width="300" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="650" y="320" font-size="14" font-weight="bold" fill="#1a1a1a">Характеристика Vout(d)</text>

  <rect x="650" y="330" width="270" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="785" y="346" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий діапазон: 10–80 см (V ∝ 1/d)</text>

  <!-- Blind zone shading -->
  <rect x="681" y="375" width="44" height="90" fill="#fdecea" opacity="0.7"/>
  <line x1="725" y1="375" x2="725" y2="465" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Blind zone text -->
  <text x="703" y="423" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Сліпа</text>
  <text x="703" y="438" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">зона</text>

  <!-- Curve Vout(d) -->
  <path d="M 680,445 C 695,410 710,380 725,380 C 760,380 785,438 885,454" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Graph Axes -->
  <line x1="680" y1="465" x2="900" y2="465" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="680" y1="465" x2="680" y2="368" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <text x="925" y="469" font-size="12" fill="#1a1a1a" text-anchor="end">d (см)</text>
  <text x="675" y="365" font-size="12" fill="#1a1a1a" text-anchor="end">V (В)</text>

  <!-- Ticks on Graph -->
  <line x1="725" y1="465" x2="725" y2="469" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="725" y="482" font-size="12" fill="#6b7280" text-anchor="middle">10</text>

  <line x1="765" y1="465" x2="765" y2="469" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="482" font-size="12" fill="#6b7280" text-anchor="middle">20</text>

  <line x1="865" y1="465" x2="865" y2="469" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="865" y="482" font-size="12" fill="#6b7280" text-anchor="middle">80</text>

  <line x1="676" y1="380" x2="680" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="672" y="384" font-size="12" fill="#6b7280" text-anchor="end">3.1В</text>

  <line x1="676" y1="454" x2="680" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="672" y="458" font-size="12" fill="#6b7280" text-anchor="end">0.4В</text>
</svg>
