<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Температурна компенсація 2-го порядку сенсора MS5611</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Параболічна корекція зсуву (OFF) та чутливості (SENS) при зниженні температури нижче +20 °C та -15 °C</text>

  <!-- Algorithm Flow Chart -->
  <g transform="translate(60, 95)">
    <!-- Stage 1: Standard First Order (T >= 20 C) -->
    <rect x="0" y="0" width="260" height="230" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="30" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="130" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">Зона 1: Норма (T ≥ 20 °C)</text>

    <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#f0f6fc">Лінійна компенсація:</text>
    <rect x="15" y="65" width="230" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="130" y="85" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">dT = D2 - C5 * 256</text>
    <text x="130" y="100" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">TEMP = 2000 + (dT * C6) / 2^23</text>

    <text x="15" y="135" font-family="sans-serif" font-size="11" fill="#f0f6fc">Корекції 2-го порядку відсутні:</text>
    <text x="25" y="155" font-family="monospace" font-size="11" fill="#8b949e">T2 = 0</text>
    <text x="25" y="175" font-family="monospace" font-size="11" fill="#8b949e">OFF2 = 0</text>
    <text x="25" y="195" font-family="monospace" font-size="11" fill="#8b949e">SENS2 = 0</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="330" y1="210" x2="360" y2="210" stroke="#3fb950" stroke-width="2"/>
  <polygon points="360,210 350,205 350,215" fill="#3fb950"/>

  <!-- Stage 2: Cold Zone (-15 C <= T < 20 C) -->
  <g transform="translate(360, 95)">
    <rect x="0" y="0" width="270" height="230" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="30" rx="8" fill="#d29922" fill-opacity="0.2"/>
    <text x="135" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">Зона 2: Холод (-15 °C ≤ T &lt; 20 °C)</text>

    <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#f0f6fc">Параболічні корекції:</text>
    <rect x="15" y="65" width="240" height="75" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="135" y="85" font-family="monospace" font-size="10" fill="#d29922" text-anchor="middle">T2 = (dT * dT) / 2^31</text>
    <text x="135" y="105" font-family="monospace" font-size="10" fill="#d29922" text-anchor="middle">OFF2 = 5 * (TEMP - 2000)² / 2</text>
    <text x="135" y="125" font-family="monospace" font-size="10" fill="#d29922" text-anchor="middle">SENS2 = 5 * (TEMP - 2000)² / 4</text>

    <text x="15" y="165" font-family="sans-serif" font-size="10" fill="#f0f6fc">• Компенсує нелінійне стиснення</text>
    <text x="15" y="180" font-family="sans-serif" font-size="10" fill="#8b949e">  п'єзорезисторів на кремнії.</text>
    <text x="15" y="200" font-family="sans-serif" font-size="10" fill="#d29922">• Запобігає заниженню тиску.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="640" y1="210" x2="670" y2="210" stroke="#d29922" stroke-width="2"/>
  <polygon points="670,210 660,205 660,215" fill="#d29922"/>

  <!-- Stage 3: Extreme Freeze (T < -15 C) -->
  <g transform="translate(670, 95)">
    <rect width="230" height="230" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect width="230" height="30" rx="8" fill="#da3633" fill-opacity="0.2"/>
    <text x="115" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">Зона 3: Мороз (T &lt; -15 °C)</text>

    <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#f0f6fc">Додаткове зміщення:</text>
    <rect x="15" y="65" width="200" height="75" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="85" font-family="monospace" font-size="9" fill="#f85149" text-anchor="middle">delta = TEMP - (-1500)</text>
    <text x="115" y="105" font-family="monospace" font-size="9" fill="#f85149" text-anchor="middle">OFF2 += 7 * delta²</text>
    <text x="115" y="125" font-family="monospace" font-size="9" fill="#f85149" text-anchor="middle">SENS2 += 11 * delta² / 2</text>

    <text x="15" y="165" font-family="sans-serif" font-size="10" fill="#f0f6fc">• Високогірні польоти</text>
    <text x="15" y="180" font-family="sans-serif" font-size="10" fill="#8b949e">  та стратосферні зонди.</text>
    <text x="15" y="200" font-family="sans-serif" font-size="10" fill="#f85149">• Точність до -40 °C!</text>
  </g>

  <!-- Bottom banner -->
  <rect x="60" y="395" width="840" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="425" font-family="sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">
    Завдяки тризонній компенсації другого порядку MS5611 зберігає абсолютну точність ±1.5 гПа у всьому діапазоні від -40 °C до +85 °C.
  </text>
</svg>