<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Порівняння прецизійного MS5611 проти BMP280 у варіометрах</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Чому парапланеристи та розробники БПЛА обирають сенсор TE Connectivity MS5611</text>

  <!-- Left Card: MS5611 (Specialized Aviation/Vario) -->
  <g transform="translate(60, 95)">
    <rect width="390" height="340" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <rect width="390" height="32" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="195" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">MS5611-01BA03 (TE Connectivity)</text>

    <text x="20" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Архітектура АЦП:</text>
    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#3fb950">• 24-бітний прецизійний Delta-Sigma (ΔΣ) АЦП</text>
    <text x="20" y="98" font-family="sans-serif" font-size="11" fill="#8b949e">  із наднизьким власним шумом.</text>

    <text x="20" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Роздільна здатність за висотою:</text>
    <text x="20" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3fb950">• До 10 см (0.012 гПа = 1.2 Па шуму)!</text>
    <text x="20" y="165" font-family="sans-serif" font-size="11" fill="#8b949e">  Фіксує навіть плавний підйом руки.</text>

    <text x="20" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Термокомпенсація 2-го порядку:</text>
    <text x="20" y="215" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Окремі параболічні криві для T &lt; 20 °C</text>
    <text x="20" y="233" font-family="sans-serif" font-size="11" fill="#8b949e">  та екстремального морозу T &lt; -15 °C.</text>

    <rect x="20" y="260" width="350" height="55" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="195" y="282" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Золотий стандарт польотних контролерів</text>
    <text x="195" y="300" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Pixhawk, ArduPilot, професійні варіометри</text>
  </g>

  <!-- Right Card: BMP280 (Consumer / Smartphone) -->
  <g transform="translate(510, 95)">
    <rect width="390" height="340" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect width="390" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="195" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">BMP280 (Bosch Sensortec)</text>

    <text x="20" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Архітектура АЦП:</text>
    <text x="20" y="80" font-family="sans-serif" font-size="11" fill="#58a6ff">• 16..20-бітний SAR АЦП</text>
    <text x="20" y="98" font-family="sans-serif" font-size="11" fill="#8b949e">  з апаратним оверсемплінгом.</text>

    <text x="20" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Роздільна здатність за висотою:</text>
    <text x="20" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#58a6ff">• Близько 20..30 см (0.16 Па шуму)</text>
    <text x="20" y="165" font-family="sans-serif" font-size="11" fill="#8b949e">  Потребує сильної IIR-фільтрації.</text>

    <text x="20" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Енергоспоживання та вартість:</text>
    <text x="20" y="215" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Споживає лише 2.7 мкА (проти 12.5 мкА у MS5611)</text>
    <text x="20" y="233" font-family="sans-serif" font-size="11" fill="#8b949e">• Вартість чіпа у 3-4 рази нижча за MS5611.</text>

    <rect x="20" y="260" width="350" height="55" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="195" y="282" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">Масовий споживчий ринок</text>
    <text x="195" y="300" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Смартфони, побутові метеостанції, фітнес-браслети</text>
  </g>
</svg>