<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad3)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Активний ФНЧ Саллена-Кея 2-го порядку для LM35 (fc = 10 Гц)</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Ефективне пригнічення мережевих завад 50/100 Гц та антиаліасингова фільтрація перед АЦП</text>

  <!-- Circuit Schematic Area -->
  <g transform="translate(30, 110)">
    <!-- Input from LM35 -->
    <text x="0" y="75" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">LM35_OUT</text>
    <circle cx="85" cy="70" r="4" fill="#58a6ff"/>
    <path d="M 85 70 L 120 70" stroke="#58a6ff" stroke-width="2" fill="none"/>

    <!-- Resistor R1 -->
    <rect x="120" y="63" width="40" height="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="140" y="55" fill="#58a6ff" font-family="sans-serif" font-size="11" text-anchor="middle">R1 16k</text>
    <path d="M 160 70 L 210 70" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <circle cx="185" cy="70" r="3" fill="#58a6ff"/>

    <!-- Resistor R2 -->
    <rect x="210" y="63" width="40" height="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="230" y="55" fill="#58a6ff" font-family="sans-serif" font-size="11" text-anchor="middle">R2 16k</text>
    <path d="M 250 70 L 300 70" stroke="#58a6ff" stroke-width="2" fill="none"/>

    <!-- Capacitor C1 in feedback to OUT -->
    <path d="M 185 70 L 185 10 L 390 10 L 390 90" stroke="#d29922" stroke-width="1.5" fill="none"/>
    <line x1="280" y1="5" x2="280" y2="15" stroke="#d29922" stroke-width="2"/>
    <line x1="290" y1="5" x2="290" y2="15" stroke="#d29922" stroke-width="2"/>
    <text x="285" y="30" fill="#d29922" font-family="sans-serif" font-size="10" text-anchor="middle">C1 1.4µF</text>

    <!-- Capacitor C2 to ground -->
    <circle cx="275" cy="70" r="3" fill="#58a6ff"/>
    <path d="M 275 70 L 275 140" stroke="#8b949e" stroke-width="1.5" fill="none"/>
    <line x1="265" y1="140" x2="285" y2="140" stroke="#8b949e" stroke-width="2"/>
    <line x1="265" y1="145" x2="285" y2="145" stroke="#8b949e" stroke-width="2"/>
    <path d="M 275 145 L 275 165" stroke="#3fb950" stroke-width="1.5" fill="none"/>
    <line x1="265" y1="165" x2="285" y2="165" stroke="#3fb950" stroke-width="2"/>
    <text x="305" y="145" fill="#8b949e" font-family="sans-serif" font-size="10">C2 700nF</text>

    <!-- Op-Amp Triangle -->
    <g transform="translate(300, 40)">
      <path d="M 0 0 L 100 50 L 0 100 Z" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
      <text x="15" y="35" fill="#58a6ff" font-family="monospace" font-size="16" font-weight="bold">+</text>
      <text x="15" y="75" fill="#d29922" font-family="monospace" font-size="16" font-weight="bold">−</text>
      <text x="45" y="55" fill="#bc8cff" font-family="sans-serif" font-size="11" font-weight="bold">ОП (G=1)</text>

      <!-- Feedback link from OUT to IN- -->
      <path d="M 100 50 L 120 50 L 120 100 L -15 100 L -15 70 L 0 70" stroke="#bc8cff" stroke-width="1.5" fill="none"/>
      <circle cx="120" cy="50" r="3" fill="#bc8cff"/>
    </g>

    <!-- Filter Output to ADC -->
    <path d="M 420 90 L 480 90" stroke="#3fb950" stroke-width="2" fill="none"/>
    <circle cx="480" cy="90" r="4" fill="#3fb950"/>
    <text x="495" y="94" fill="#3fb950" font-family="monospace" font-size="12" font-weight="bold">TO_ADC</text>
  </g>

  <!-- Frequency Response (Bode Plot) -->
  <g transform="translate(80, 270)">
    <rect width="690" height="210" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold">Амплітудно-частотна характеристика (АЧХ) Баттерворта 2-го порядку</text>
    
    <!-- Axes -->
    <line x1="70" y1="170" x2="650" y2="170" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="70" y2="170" stroke="#8b949e" stroke-width="1.5"/>
    
    <!-- Grid & Labels -->
    <text x="60" y="55" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">0 dB</text>
    <text x="60" y="90" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">-10 dB</text>
    <text x="60" y="125" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">-20 dB</text>
    <text x="60" y="160" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="end">-40 dB</text>

    <!-- Freq marks -->
    <text x="140" y="185" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">1 Гц</text>
    <text x="270" y="185" fill="#58a6ff" font-family="monospace" font-size="10" text-anchor="middle">fc = 10 Гц</text>
    <text x="430" y="185" fill="#f85149" font-family="monospace" font-size="10" text-anchor="middle">50 Гц (Мережа)</text>
    <text x="560" y="185" fill="#f85149" font-family="monospace" font-size="10" text-anchor="middle">100 Гц</text>

    <!-- Filter Curve -->
    <path d="M 70 55 Q 240 55, 270 65 T 430 135 T 560 165 T 640 170" fill="none" stroke="#7ee787" stroke-width="3"/>

    <!-- Marker 50 Hz -->
    <line x1="430" y1="50" x2="430" y2="170" stroke="#f85149" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="430" cy="135" r="4" fill="#f85149"/>
    <text x="440" y="125" fill="#f85149" font-family="sans-serif" font-size="11" font-weight="bold">-28 дБ (в 25 разів!)</text>

    <!-- Marker 100 Hz -->
    <line x1="560" y1="50" x2="560" y2="170" stroke="#f85149" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="560" cy="165" r="4" fill="#f85149"/>
    <text x="570" y="155" fill="#f85149" font-family="sans-serif" font-size="11" font-weight="bold">-40 дБ (в 100 разів!)</text>
  </g>
</svg>