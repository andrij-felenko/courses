<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad2)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Диференційний зсув рівня для вимірювання -55 °C ... +150 °C</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Перетворення двополярного сигналу (-0.55 В .. +1.50 В) в діапазон 0.0 .. 3.0 В для однополярного АЦП</text>

  <!-- LM35 with negative bias diode / pull-down -->
  <g transform="translate(40, 160)">
    <rect width="120" height="160" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="60" y="30" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">LM35CAZ</text>
    <text x="60" y="48" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">-55 .. +150°C</text>
    
    <circle cx="15" cy="80" r="4" fill="#f85149"/>
    <text x="25" y="84" fill="#f85149" font-family="monospace" font-size="10">+Vs (5V)</text>
    
    <!-- Virtual ground via LM385 1.2V -->
    <circle cx="15" cy="120" r="4" fill="#3fb950"/>
    <text x="25" y="124" fill="#3fb950" font-family="monospace" font-size="10">V_ref- (0V)</text>

    <circle cx="120" cy="100" r="4" fill="#58a6ff"/>
    <text x="110" y="95" fill="#58a6ff" font-family="monospace" font-size="10" text-anchor="end">V_out</text>

    <!-- Pull down resistor to -Vs -->
    <path d="M 120 100 L 140 100 L 140 180" stroke="#58a6ff" stroke-width="1.5" fill="none"/>
    <rect x="133" y="180" width="14" height="35" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="155" y="200" fill="#d29922" font-family="sans-serif" font-size="10">R_pull 18k</text>
    <path d="M 140 215 L 140 230" stroke="#f85149" stroke-width="1.5" fill="none"/>
    <text x="140" y="245" fill="#f85149" font-family="monospace" font-size="11" text-anchor="middle">-5V</text>
  </g>

  <!-- Level Shifter / Differential Op-Amp -->
  <g transform="translate(380, 200)">
    <path d="M 0 0 L 130 75 L 0 150 Z" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
    <text x="15" y="55" fill="#58a6ff" font-family="monospace" font-size="20" font-weight="bold">+</text>
    <text x="15" y="105" fill="#d29922" font-family="monospace" font-size="20" font-weight="bold">−</text>
    <text x="60" y="75" fill="#bc8cff" font-family="sans-serif" font-size="14" font-weight="bold">OPA333</text>
    <text x="60" y="92" fill="#8b949e" font-family="sans-serif" font-size="10">Zero-Drift</text>

    <path d="M 65 38 L 65 15" stroke="#f85149" stroke-width="1.5" fill="none"/>
    <text x="65" y="10" fill="#f85149" font-family="sans-serif" font-size="10" text-anchor="middle">+3.3V</text>
    <path d="M 65 112 L 65 135" stroke="#3fb950" stroke-width="1.5" fill="none"/>
    <line x1="55" y1="135" x2="75" y2="135" stroke="#3fb950" stroke-width="2"/>
  </g>

  <!-- Input resistor R_in+ to IN+ -->
  <path d="M 160 260 L 250 260" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <rect x="250" y="253" width="40" height="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="270" y="245" fill="#58a6ff" font-family="sans-serif" font-size="10" text-anchor="middle">R1 20k (0.1%)</text>
  <path d="M 290 260 L 380 255" stroke="#58a6ff" stroke-width="2" fill="none"/>
  
  <!-- Bias divider to IN+ from V_ref (1.25V) -->
  <circle cx="330" cy="258" r="3" fill="#58a6ff"/>
  <path d="M 330 258 L 330 330" stroke="#d29922" stroke-width="1.5" fill="none"/>
  <rect x="323" y="330" width="14" height="35" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="345" y="350" fill="#d29922" font-family="sans-serif" font-size="10">R2 20k</text>
  <path d="M 330 365 L 330 385" stroke="#3fb950" stroke-width="1.5" fill="none"/>
  <line x1="320" y1="385" x2="340" y2="385" stroke="#3fb950" stroke-width="2"/>

  <!-- Inverting input network with V_ref shift -->
  <!-- Precision V_ref LM4040 2.048V -->
  <g transform="translate(190, 320)">
    <rect width="80" height="60" rx="4" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="40" y="25" fill="#e3b341" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">V_REF</text>
    <text x="40" y="45" fill="#f0f6fc" font-family="monospace" font-size="11" text-anchor="middle">+1.000 В</text>
  </g>
  <path d="M 270 350 L 310 350 L 310 305 L 340 305" stroke="#e3b341" stroke-width="1.5" fill="none"/>
  <rect x="340" y="298" width="35" height="14" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="357" y="290" fill="#e3b341" font-family="sans-serif" font-size="10" text-anchor="middle">R3 20k</text>
  <path d="M 375 305 L 380 305" stroke="#e3b341" stroke-width="1.5" fill="none"/>

  <!-- Feedback R4 from OUT to IN- -->
  <path d="M 510 275 L 560 275 L 560 380 L 370 380 L 370 305" stroke="#bc8cff" stroke-width="2" fill="none"/>
  <circle cx="560" cy="275" r="3" fill="#bc8cff"/>
  <rect x="440" y="373" width="45" height="14" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="462" y="365" fill="#bc8cff" font-family="sans-serif" font-size="10" text-anchor="middle">R4 29.4kΩ</text>

  <!-- Output line -->
  <path d="M 560 275 L 650 275" stroke="#3fb950" stroke-width="2" fill="none"/>

  <!-- Voltage Scale Visualizer -->
  <g transform="translate(600, 140)">
    <rect width="210" height="290" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="105" y="28" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Маппінг напруги до АЦП</text>
    
    <!-- Scale Bar -->
    <line x1="40" y1="60" x2="40" y2="250" stroke="#8b949e" stroke-width="3"/>
    
    <!-- Marks -->
    <circle cx="40" cy="70" r="4" fill="#f85149"/>
    <text x="55" y="74" fill="#f85149" font-family="monospace" font-size="11">+150°C → 3.00 В</text>
    <text x="55" y="88" fill="#8b949e" font-family="sans-serif" font-size="9">(LM35: +1.50 В)</text>
    
    <circle cx="40" cy="130" r="4" fill="#d29922"/>
    <text x="55" y="134" fill="#d29922" font-family="monospace" font-size="11">+25°C → 1.17 В</text>
    <text x="55" y="148" fill="#8b949e" font-family="sans-serif" font-size="9">(LM35: +0.25 В)</text>

    <circle cx="40" cy="180" r="4" fill="#3fb950"/>
    <text x="55" y="184" fill="#3fb950" font-family="monospace" font-size="11">0°C → 0.81 В</text>
    <text x="55" y="198" fill="#8b949e" font-family="sans-serif" font-size="9">(LM35: 0.00 В)</text>

    <circle cx="40" cy="240" r="4" fill="#58a6ff"/>
    <text x="55" y="244" fill="#58a6ff" font-family="monospace" font-size="11">-55°C → 0.00 В</text>
    <text x="55" y="258" fill="#8b949e" font-family="sans-serif" font-size="9">(LM35: -0.55 В)</text>
  </g>
</svg>