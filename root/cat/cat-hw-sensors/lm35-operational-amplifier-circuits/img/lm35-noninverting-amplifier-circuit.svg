<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Неінвертуючий масштабуючий підсилювач для LM35 (0..1 В → 0..3.3 В)</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Оптимізація динамічного діапазону для 12-бітного АЦП мікроконтролера з однополярним живленням</text>

  <!-- LM35 Module -->
  <g transform="translate(50, 150)">
    <rect width="130" height="150" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="65" y="35" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LM35DZ</text>
    <text x="65" y="55" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">10 мВ/°C</text>
    
    <circle cx="15" cy="90" r="4" fill="#f85149"/>
    <text x="25" y="94" fill="#f85149" font-family="monospace" font-size="11">+Vs (5V)</text>
    
    <circle cx="15" cy="130" r="4" fill="#3fb950"/>
    <text x="25" y="134" fill="#3fb950" font-family="monospace" font-size="11">GND</text>
    
    <circle cx="130" cy="110" r="4" fill="#58a6ff"/>
    <text x="120" y="105" fill="#58a6ff" font-family="monospace" font-size="11" text-anchor="end">Vout</text>
  </g>

  <!-- R-iso and C-load isolation -->
  <path d="M 180 260 L 230 260" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <rect x="230" y="253" width="40" height="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="250" y="245" fill="#58a6ff" font-family="sans-serif" font-size="11" text-anchor="middle">R_iso 1k</text>
  <path d="M 270 260 L 320 260" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <circle cx="295" cy="260" r="3" fill="#58a6ff"/>
  <path d="M 295 260 L 295 300" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <!-- C1 cap to GND -->
  <line x1="285" y1="300" x2="305" y2="300" stroke="#8b949e" stroke-width="2"/>
  <line x1="285" y1="305" x2="305" y2="305" stroke="#8b949e" stroke-width="2"/>
  <line x1="295" y1="305" x2="295" y2="320" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="288" y1="320" x2="302" y2="320" stroke="#3fb950" stroke-width="2"/>
  <text x="315" y="305" fill="#8b949e" font-family="sans-serif" font-size="11">C1 10nF</text>

  <!-- Op-Amp Triangle -->
  <g transform="translate(360, 210)">
    <path d="M 0 0 L 120 70 L 0 140 Z" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
    <text x="15" y="55" fill="#58a6ff" font-family="monospace" font-size="18" font-weight="bold">+</text>
    <text x="15" y="95" fill="#d29922" font-family="monospace" font-size="18" font-weight="bold">−</text>
    <text x="55" y="75" fill="#bc8cff" font-family="sans-serif" font-size="13" font-weight="bold">MCP6001</text>
    <text x="55" y="90" fill="#8b949e" font-family="sans-serif" font-size="10">Rail-to-Rail</text>
    
    <!-- Op-amp power pins -->
    <path d="M 60 35 L 60 10" stroke="#f85149" stroke-width="1.5" fill="none"/>
    <text x="60" y="5" fill="#f85149" font-family="sans-serif" font-size="11" text-anchor="middle">+3.3V / 5V</text>
    
    <path d="M 60 105 L 60 130" stroke="#3fb950" stroke-width="1.5" fill="none"/>
    <line x1="50" y1="130" x2="70" y2="130" stroke="#3fb950" stroke-width="2"/>
  </g>

  <!-- Wire from R_iso to Op-Amp IN+ -->
  <path d="M 320 260 L 360 260" stroke="#58a6ff" stroke-width="2" fill="none"/>

  <!-- Feedback Network -->
  <!-- Wire from Op-Amp OUT back to IN- -->
  <path d="M 480 280 L 530 280 L 530 380 L 330 380 L 330 300 L 360 300" stroke="#d29922" stroke-width="2" fill="none"/>
  <circle cx="530" cy="280" r="3" fill="#bc8cff"/>
  <circle cx="330" cy="350" r="3" fill="#d29922"/>

  <!-- R2 in feedback top loop -->
  <rect x="410" y="373" width="45" height="14" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="432" y="365" fill="#d29922" font-family="sans-serif" font-size="11" text-anchor="middle">R2 23kΩ (0.1%)</text>

  <!-- C_feedback in parallel with R2 -->
  <path d="M 380 380 L 380 420 L 480 420 L 480 380" stroke="#8b949e" stroke-width="1.5" fill="none"/>
  <circle cx="380" cy="380" r="3" fill="#d29922"/>
  <circle cx="480" cy="380" r="3" fill="#d29922"/>
  <line x1="425" y1="415" x2="425" y2="425" stroke="#8b949e" stroke-width="2"/>
  <line x1="435" y1="415" x2="435" y2="425" stroke="#8b949e" stroke-width="2"/>
  <text x="430" y="440" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Cf 100pF (фільтр ВЧ)</text>

  <!-- R1 from IN- junction to GND -->
  <path d="M 330 350 L 260 350 L 260 380" stroke="#d29922" stroke-width="1.5" fill="none"/>
  <rect x="253" y="380" width="14" height="40" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="240" y="405" fill="#d29922" font-family="sans-serif" font-size="11" text-anchor="end">R1 10kΩ</text>
  <path d="M 260 420 L 260 440" stroke="#3fb950" stroke-width="1.5" fill="none"/>
  <line x1="250" y1="440" x2="270" y2="440" stroke="#3fb950" stroke-width="2"/>

  <!-- Output to ADC -->
  <path d="M 530 280 L 600 280" stroke="#bc8cff" stroke-width="2" fill="none"/>
  <rect x="600" y="273" width="35" height="14" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="617" y="265" fill="#bc8cff" font-family="sans-serif" font-size="11" text-anchor="middle">R_in 100Ω</text>
  <path d="M 635 280 L 690 280" stroke="#bc8cff" stroke-width="2" fill="none"/>

  <!-- MCU ADC Block -->
  <g transform="translate(690, 200)">
    <rect width="120" height="140" rx="8" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
    <text x="60" y="35" fill="#bc8cff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MCU ADC</text>
    <text x="60" y="55" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">STM32 / ESP32</text>
    
    <circle cx="0" cy="80" r="4" fill="#bc8cff"/>
    <text x="10" y="84" fill="#bc8cff" font-family="monospace" font-size="11">ADC_IN (0..3.3V)</text>
    <text x="60" y="115" fill="#3fb950" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">0.805 мВ/код</text>
  </g>

  <!-- Math & Formula Card -->
  <g transform="translate(480, 70)">
    <rect width="330" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="15" y="25" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Розрахунок коефіцієнта підсилення G:</text>
    <text x="15" y="50" fill="#f0f6fc" font-family="monospace" font-size="12">G = 1 + (R2 / R1) = 1 + (23k / 10k) = 3.3</text>
    <text x="15" y="72" fill="#7ee787" font-family="monospace" font-size="12">V_out = T(°C) × 10 мВ × 3.3 = 33 мВ / °C</text>
    <text x="15" y="95" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Діапазон 0..100 °C перетворюється в 0.00..3.30 В</text>
  </g>
</svg>