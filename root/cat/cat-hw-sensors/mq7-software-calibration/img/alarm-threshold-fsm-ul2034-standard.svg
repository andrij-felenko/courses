<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Алгоритм сигналізації за стандартами EN 50291 та UL 2034</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Інтегрування кумулятивної дози карбоксигемоглобіну (COHb) у часі замість простого порогового компаратора</text>

  <!-- Standards Table on Top -->
  <rect x="40" y="85" width="760" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="55" y="110" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#58a6ff">Критерії спрацьовування сигналізатора CO (EN 50291-1):</text>

  <!-- Table rows -->
  <rect x="55" y="125" width="730" height="26" fill="#21262d"/>
  <text x="70" y="142" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Рівень CO</text>
  <text x="240" y="142" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Час БЕЗ тривоги (No Alarm)</text>
  <text x="500" y="142" font-family="monospace" font-size="11" font-weight="bold" fill="#f0f6fc">Час ОБОВ'ЯЗКОВОЇ тривоги (Must Alarm)</text>

  <text x="70" y="172" font-family="monospace" font-size="11" fill="#3fb950">30 ppm</text>
  <text x="240" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">> 120 хвилин (без реакції)</text>
  <text x="500" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">Тривога заборонена (фоновий рівень)</text>

  <text x="70" y="195" font-family="monospace" font-size="11" fill="#d29922">50 ppm</text>
  <text x="240" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">&lt; 60 хвилин</text>
  <text x="500" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#d29922">60 ... 90 хвилин впливу</text>

  <text x="70" y="218" font-family="monospace" font-size="11" fill="#f85149">100 ppm</text>
  <text x="240" y="218" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">&lt; 10 хвилин</text>
  <text x="500" y="218" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#f85149">10 ... 40 хвилин впливу</text>

  <!-- FSM State Boxes on Bottom -->
  <!-- State 0: Normal Monitoring -->
  <rect x="40" y="240" width="220" height="210" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="65" cy="265" r="12" fill="#3fb950"/>
  <text x="65" y="270" font-family="monospace" font-size="11" font-weight="bold" fill="#0d1117" text-anchor="middle">1</text>
  <text x="85" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#3fb950">СТАН: НОРМА</text>

  <text x="55" y="300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• CO &lt; 30 ppm</text>
  <text x="55" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Дозовий інтегратор = 0</text>
  <text x="55" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Зелений індикатор блимає</text>
  <text x="55" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Сирена вимкнена</text>
  <text x="55" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Реле відкрито</text>

  <!-- Transition Arrow 1 to 2 -->
  <line x1="260" y1="345" x2="310" y2="345" stroke="#d29922" stroke-width="2" stroke-dasharray="3"/>
  <text x="285" y="335" font-family="monospace" font-size="10" fill="#d29922" text-anchor="middle">>50ppm</text>

  <!-- State 1: Accumulating Dose -->
  <rect x="310" y="240" width="220" height="210" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <circle cx="335" cy="265" r="12" fill="#d29922"/>
  <text x="335" y="270" font-family="monospace" font-size="11" font-weight="bold" fill="#0d1117" text-anchor="middle">2</text>
  <text x="355" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#d29922">СТАН: ІНТЕГРУВАННЯ</text>

  <text x="325" y="300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Накопичення дози COHb:</text>
  <text x="325" y="320" font-family="monospace" font-size="10" fill="#f0f6fc">Dose += ppm * delta_t</text>
  <text x="325" y="345" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Жовтий сигнал попередження</text>
  <text x="325" y="365" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Якщо повітря очистилося:</text>
  <text x="325" y="385" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">  -> Повільне розсіювання дози</text>

  <!-- Transition Arrow 2 to 3 -->
  <line x1="530" y1="345" x2="580" y2="345" stroke="#f85149" stroke-width="2" stroke-dasharray="3"/>
  <text x="555" y="335" font-family="monospace" font-size="10" fill="#f85149" text-anchor="middle">Dose Max</text>

  <!-- State 2: Critical Alarm -->
  <rect x="580" y="240" width="220" height="210" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <circle cx="605" cy="265" r="12" fill="#f85149"/>
  <text x="605" y="270" font-family="monospace" font-size="11" font-weight="bold" fill="#0d1117" text-anchor="middle">3</text>
  <text x="625" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#f85149">СТАН: ТРИВОГА (ALARM)</text>

  <text x="595" y="300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#f85149">• Звуковий зумер 85 дБ</text>
  <text x="595" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#f85149">• Спрацьовування реле клапана</text>
  <text x="595" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#f85149">• Блокування скидання (Latch)</text>
  <text x="595" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Скидання ТІЛЬКИ кнопкою</text>
  <text x="595" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">  після падіння CO &lt; 30 ppm</text>
</svg>