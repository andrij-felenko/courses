<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Логарифмічна калібрувальна крива MQ-7 (Rs/R0 vs CO ppm)</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Степенева апроксимація залежності опору у подвійних логарифмічних координатах</text>

  <!-- Plot Canvas -->
  <rect x="70" y="85" width="480" height="360" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Grid lines (Log scale ticks) -->
  <line x1="70" y1="145" x2="550" y2="145" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="205" x2="550" y2="205" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="265" x2="550" y2="265" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="325" x2="550" y2="325" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="385" x2="550" y2="385" stroke="#21262d" stroke-dasharray="4"/>

  <line x1="166" y1="85" x2="166" y2="445" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="262" y1="85" x2="262" y2="445" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="358" y1="85" x2="358" y2="445" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="454" y1="85" x2="454" y2="445" stroke="#21262d" stroke-dasharray="4"/>

  <!-- Y axis (Rs / R0) -->
  <text x="60" y="150" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="end">2.0</text>
  <text x="60" y="210" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="end">1.0</text>
  <text x="60" y="270" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="end">0.5</text>
  <text x="60" y="330" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="end">0.2</text>
  <text x="60" y="390" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="end">0.1</text>
  <text x="35" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#58a6ff" text-anchor="middle" transform="rotate(-90 35 265)">Співвідношення Rs / R0 (log)</text>

  <!-- X axis (CO ppm) -->
  <text x="166" y="465" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">10 ppm</text>
  <text x="262" y="465" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">50 ppm</text>
  <text x="358" y="465" font-family="monospace" font-size="11" fill="#3fb950" font-weight="bold" text-anchor="middle">100 ppm</text>
  <text x="454" y="465" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">500 ppm</text>
  <text x="540" y="465" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">1000</text>
  <text x="310" y="488" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#8b949e" text-anchor="middle">Концентрація CO (log ppm)</text>

  <!-- Linear Regression Line in Log-Log space -->
  <line x1="100" y1="120" x2="520" y2="400" stroke="#f85149" stroke-width="3"/>

  <!-- Calibration Points -->
  <circle cx="166" cy="165" r="5" fill="#f85149" stroke="#f0f6fc" stroke-width="1.5"/>
  <text x="180" y="160" font-family="monospace" font-size="10" fill="#f0f6fc">(10, 1.65)</text>

  <circle cx="262" cy="230" r="5" fill="#f85149" stroke="#f0f6fc" stroke-width="1.5"/>
  <text x="276" y="225" font-family="monospace" font-size="10" fill="#f0f6fc">(50, 0.78)</text>

  <!-- Nominal Point: 100 ppm = R0 standard baseline point -->
  <circle cx="358" cy="275" r="7" fill="#3fb950" stroke="#f0f6fc" stroke-width="2"/>
  <text x="372" y="270" font-family="monospace" font-size="11" font-weight="bold" fill="#3fb950">(100, 0.50)</text>

  <circle cx="454" cy="350" r="5" fill="#f85149" stroke="#f0f6fc" stroke-width="1.5"/>
  <text x="468" y="345" font-family="monospace" font-size="10" fill="#f0f6fc">(500, 0.22)</text>

  <!-- Math & Model Panel on Right -->
  <rect x="570" y="85" width="245" height="360" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="585" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#f0f6fc">Математична модель:</text>

  <rect x="580" y="130" width="225" height="80" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="590" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#58a6ff">1. Степеневе рівняння:</text>
  <text x="590" y="172" font-family="monospace" font-size="12" fill="#f0f6fc">ppm = A * (Rs/R0)^B</text>
  <text x="590" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">де A ≈ 99.04, B ≈ -1.518</text>

  <rect x="580" y="220" width="225" height="95" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="590" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#3fb950">2. Логарифмічна форма:</text>
  <text x="590" y="260" font-family="monospace" font-size="11" fill="#f0f6fc">ln(ppm) = m*ln(Ratio) + b</text>
  <text x="590" y="280" font-family="monospace" font-size="10" fill="#8b949e">m = (ln(y2)-ln(y1)) /</text>
  <text x="610" y="295" font-family="monospace" font-size="10" fill="#8b949e">(ln(x2)-ln(x1))</text>

  <rect x="580" y="325" width="225" height="105" rx="6" fill="#21262d" stroke="#d29922"/>
  <text x="590" y="347" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#d29922">Визначення базового R0:</text>
  <text x="590" y="367" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">У чистому повітрі відношення</text>
  <text x="590" y="383" font-family="monospace" font-size="10" fill="#3fb950">Rs_air / R0 ≈ 26.5</text>
  <text x="590" y="401" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">Тому в чистому повітрі:</text>
  <text x="590" y="418" font-family="monospace" font-size="10" fill="#58a6ff">R0 = Rs_measured / 26.5</text>
</svg>