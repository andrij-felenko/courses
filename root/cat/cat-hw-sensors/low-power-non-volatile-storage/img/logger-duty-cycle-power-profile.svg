<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Профіль струму логера: Flash проти FRAM</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Як час очікування програмування сторінки t_prog виснажує батарею живлення</text>

  <!-- Oscillogram frame -->
  <rect x="40" y="85" width="770" height="250" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Zero baseline -->
  <line x1="60" y1="290" x2="790" y2="290" stroke="#30363d" stroke-width="1.5"/>
  <text x="70" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">0 мкА</text>

  <!-- Deep sleep level: 0.8 uA -->
  <line x1="60" y1="285" x2="790" y2="285" stroke="#3fb950" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="140" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Глибокий сон (Deep Sleep ~0.8 мкА)</text>

  <!-- FLASH PROFILE (Red) -->
  <!-- Wakeup + Sensor read: 140..200 (10 mA) -->
  <!-- Flash Write page wait: 200..380 (5 ms at 15 mA) -->
  <path d="M 60 285 L 180 285 L 185 130 L 225 130 L 225 100 L 380 100 L 385 285 L 780 285" 
        fill="none" stroke="#f85149" stroke-width="2.5"/>
  <text x="290" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">Flash: очікування запису t_prog (3-5 мс, 15 мА)</text>

  <!-- FRAM PROFILE (Green - instant write and back to sleep) -->
  <path d="M 60 285 L 180 285 L 185 130 L 225 130 L 225 100 L 235 100 L 240 285 L 780 285" 
        fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="260" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">FRAM: запис за 50 мкс!</text>

  <!-- Difference area marker -->
  <rect x="240" y="105" width="140" height="175" fill="#f85149" opacity="0.15"/>
  <text x="310" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Марно витрачена</text>
  <text x="310" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">енергія зарядної помпи</text>

  <!-- Summary Cards below -->
  <rect x="40" y="350" width="370" height="110" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="225" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f85149" text-anchor="middle">Логер на Flash / EEPROM</text>
  <text x="55" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">• Активний час на цикл: ~6.5 мс</text>
  <text x="55" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">• Енергія на 1 точку вимірювання: ~180 мкДж</text>
  <text x="55" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">• Ресурс батареї CR2032: ~1.2 року (при циклі 1 хв)</text>

  <rect x="440" y="350" width="370" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="625" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">Логер на FRAM</text>
  <text x="455" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">• Активний час на цикл: ~1.5 мс (лише сенсор + SPI)</text>
  <text x="455" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">• Енергія на 1 точку вимірювання: ~35 мкДж</text>
  <text x="455" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">• Ресурс батареї CR2032: ~6.8 років!</text>
</svg>