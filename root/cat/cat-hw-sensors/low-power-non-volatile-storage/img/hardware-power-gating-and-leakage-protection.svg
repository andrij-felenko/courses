<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Апаратне відсікання живлення (Power Gating) та струми витоку</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Комутація шини живлення мікросхеми NVM та захист від паразитного живлення через ESD-діоди</text>

  <!-- Left: Schematic diagram -->
  <rect x="40" y="85" width="410" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="245" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Схема комутації живлення NVM</text>

  <!-- V_BAT Battery rail -->
  <line x1="60" y1="150" x2="160" y2="150" stroke="#f85149" stroke-width="2.5"/>
  <circle cx="60" cy="150" r="4" fill="#f85149"/>
  <text x="60" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">V_BAT (+3.0V)</text>

  <!-- P-MOSFET Switch -->
  <rect x="160" y="130" width="55" height="40" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="187" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">P-FET</text>

  <!-- Gate control from MCU GPIO -->
  <line x1="187" y1="170" x2="187" y2="230" stroke="#d29922" stroke-width="2"/>
  <rect x="130" y="230" width="115" height="35" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="187" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">MCU PWR_EN</text>

  <!-- Switched V_MEM rail -->
  <line x1="215" y1="150" x2="280" y2="150" stroke="#3fb950" stroke-width="2.5"/>
  <text x="250" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">V_MEM</text>

  <!-- Decoupling Cap -->
  <line x1="280" y1="150" x2="280" y2="180" stroke="#30363d" stroke-width="1.5"/>
  <line x1="270" y1="180" x2="290" y2="180" stroke="#8b949e" stroke-width="2"/>
  <line x1="270" y1="186" x2="290" y2="186" stroke="#8b949e" stroke-width="2"/>
  <line x1="280" y1="186" x2="280" y2="210" stroke="#30363d" stroke-width="1.5"/>
  <text x="315" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">100 нФ</text>

  <!-- NVM Chip (FRAM / Flash) -->
  <rect x="280" y="125" width="140" height="200" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="2"/>
  <text x="350" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">NVM (SPI)</text>
  <text x="300" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">CS#</text>
  <text x="300" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">SCK</text>
  <text x="300" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">MOSI</text>
  <text x="300" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">MISO</text>

  <!-- Bottom box in schematic: parasite path warning -->
  <rect x="60" y="345" width="370" height="90" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="75" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">УВАГА: Небезпека паразитного живлення!</text>
  <text x="75" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Якщо вимкнути V_MEM, але залишити CS=HIGH,</text>
  <text x="75" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">струм потече через внутрішній захисний діод CS → V_MEM,</text>
  <text x="75" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149">викликаючи витік 150..500 мкА!</text>

  <!-- Right: Firmware Rulebook for Deep Sleep -->
  <rect x="470" y="85" width="350" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="645" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Алгоритм переходу в сон</text>

  <rect x="490" y="135" width="310" height="65" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="505" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">1. Завершення транзакцій SPI</text>
  <text x="505" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Дочекатися скидання прапорця SPI_BUSY</text>

  <rect x="490" y="210" width="310" height="75" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="505" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">2. Команда Deep Power-Down (DPD)</text>
  <text x="505" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Для Flash/FRAM з підтримкою DPD (0xB9):</text>
  <text x="505" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">струм спокою падає до &lt; 0.1 мкА</text>

  <rect x="490" y="295" width="310" height="85" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="505" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">3. Переведення GPIO в Hi-Z / Analog</text>
  <text x="505" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Всі виводи шини (SCK, MOSI, MISO, CS)</text>
  <text x="505" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">налаштовуються в Analog Input без підтяжок</text>

  <rect x="490" y="390" width="310" height="50" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1.5"/>
  <text x="645" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">Сумарний струм сну платформи &lt; 1.5 мкА</text>
</svg>