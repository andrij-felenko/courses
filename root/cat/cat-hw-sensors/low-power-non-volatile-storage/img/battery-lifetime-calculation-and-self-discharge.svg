<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Розрахунок автономної роботи логера від батареї</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Залежність тривалості життя джерела живлення від інтервалу логування та технології пам'яті</text>

  <!-- Left: Formula & Battery specs -->
  <rect x="40" y="85" width="370" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Математична модель автономності</text>

  <rect x="60" y="135" width="330" height="85" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="225" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">Середньозважений струм:</text>
  <text x="225" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc" text-anchor="middle">I_avg = (I_sleep · T_sleep + I_act · T_act) / T_cycle</text>
  <text x="225" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">де T_cycle = T_sleep + T_act</text>

  <rect x="60" y="235" width="330" height="95" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="225" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">Термін життя батареї (роки):</text>
  <text x="225" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">Years = (C_nom · η_derating) / (I_avg · 8760 год)</text>
  <text x="225" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">η_derating ≈ 0.85 (саморозряд 1-2%/рік + кінцева напруга)</text>

  <rect x="60" y="345" width="330" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="75" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Типові хімічні джерела:</text>
  <text x="75" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• CR2032 (Li-MnO₂): 220 мАг, 3.0 В</text>
  <text x="75" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• ER14505 AA (Li-SOCl₂): 2700 мАг, 3.6 В</text>
  <text x="75" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950">• Li-SOCl₂ працює при -40 .. +85 °C</text>

  <!-- Right: Comparison Chart across Logging Intervals -->
  <rect x="435" y="85" width="375" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Час життя на батареї CR2032 (220 мАг)</text>

  <!-- Table of intervals -->
  <g transform="translate(450, 140)">
    <!-- Header -->
    <rect x="0" y="0" width="345" height="30" fill="#21262d" rx="4"/>
    <text x="10" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#79c0ff">Інтервал</text>
    <text x="110" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Flash NVM</text>
    <text x="210" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">FRAM NVM</text>
    <text x="290" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922">Приріст</text>

    <!-- Row 1: 10 sec -->
    <line x1="0" y1="40" x2="345" y2="40" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">10 секунд</text>
    <text x="110" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f85149">0.24 року</text>
    <text x="210" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">1.28 року</text>
    <text x="290" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d29922">+430%</text>

    <!-- Row 2: 1 min -->
    <line x1="0" y1="75" x2="345" y2="75" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">1 хвилина</text>
    <text x="110" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f85149">1.2 року</text>
    <text x="210" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">4.8 років</text>
    <text x="290" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d29922">+300%</text>

    <!-- Row 3: 10 min -->
    <line x1="0" y1="110" x2="345" y2="110" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">10 хвилин</text>
    <text x="110" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f85149">5.4 років</text>
    <text x="210" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">9.5 років</text>
    <text x="290" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d29922">+75%</text>

    <!-- Row 4: 1 hour -->
    <line x1="0" y1="145" x2="345" y2="145" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc">1 година</text>
    <text x="110" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">10+ років*</text>
    <text x="210" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">10+ років*</text>
    <text x="290" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">Ліміт хімії</text>
  </g>

  <rect x="450" y="340" width="345" height="95" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="465" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Висновок інженера:</text>
  <text x="465" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">При високій частоті логування (&lt; 1 хв) енергія запису NVM</text>
  <text x="465" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">домінує над струмом глибокого сну. Застосування FRAM</text>
  <text x="465" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">збільшує автономність пристрою у 4-5 разів!</text>
</svg>