<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Діаграма Парето: внесок компонентів у температурний бюджет</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Розподіл внеску похибок у діапазоні температур від -40 °C до +85 °C (ΔT = 60 °C від кімнатної)</text>

  <!-- Bar Chart Area -->
  <g transform="translate(100, 95)">
    <!-- Axes -->
    <line x1="0" y1="260" x2="760" y2="260" stroke="#30363d" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#30363d" stroke-width="2"/>

    <!-- Y labels -->
    <text x="-15" y="265" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">0.0%</text>
    <text x="-15" y="200" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">0.5%</text>
    <text x="-15" y="135" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">1.0%</text>
    <text x="-15" y="70" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">1.5%</text>
    <text x="-15" y="15" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">2.0%</text>

    <!-- Grid lines -->
    <line x1="0" y1="195" x2="760" y2="195" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="130" x2="760" y2="130" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="65" x2="760" y2="65" stroke="#21262d" stroke-dasharray="4 4"/>

    <!-- Bar 1: VREF Drift (e.g. 50 ppm/C * 60 C = 0.3%) -->
    <rect x="50" y="80" width="90" height="180" rx="4" fill="#d29922" fill-opacity="0.8"/>
    <text x="95" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">1.38%</text>
    <text x="95" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">VREF джерела</text>
    <text x="95" y="296" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">(Точність + дрейф)</text>

    <!-- Bar 2: Sensor Initial & Drift (e.g. LM35 or RTD) -->
    <rect x="190" y="130" width="90" height="130" rx="4" fill="#f85149" fill-opacity="0.8"/>
    <text x="235" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">1.00%</text>
    <text x="235" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Сенсор</text>
    <text x="235" y="296" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">(Похибка класу)</text>

    <!-- Bar 3: Resistor network TCR mismatch -->
    <rect x="330" y="210" width="90" height="50" rx="4" fill="#3fb950" fill-opacity="0.8"/>
    <text x="375" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">0.38%</text>
    <text x="375" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Резистори ОС</text>
    <text x="375" y="296" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">(TCR 50 ppm/°C)</text>

    <!-- Bar 4: Op-Amp Vos Drift -->
    <rect x="470" y="240" width="90" height="20" rx="4" fill="#bc8cff" fill-opacity="0.8"/>
    <text x="515" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bc8cff" text-anchor="middle">0.15%</text>
    <text x="515" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">ОП зсув Vos</text>
    <text x="515" y="296" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">(dVos/dT дрейф)</text>

    <!-- Bar 5: ADC Quantization & INL -->
    <rect x="610" y="250" width="90" height="10" rx="4" fill="#58a6ff" fill-opacity="0.8"/>
    <text x="655" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">0.07%</text>
    <text x="655" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">АЦП 12-біт</text>
    <text x="655" y="296" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">(Квант + INL)</text>
  </g>

  <!-- Bottom Key Finding Note -->
  <rect x="100" y="415" width="760" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="440" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">
    Головний висновок: 12-бітний АЦП дає лише 0.07% похибки, тоді як <tspan fill="#d29922">дешеве VREF (1.38%)</tspan> знецінює всю точність системи!
  </text>
</svg>