<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Методи агрегації похибок: WCA проти RSS та Монте-Карло</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Порівняння консервативного та статистичного підходів до проектування допусків</text>

  <!-- Column 1: Worst-Case Analysis -->
  <g transform="translate(50, 95)">
    <rect width="260" height="340" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect width="260" height="32" rx="8" fill="#da3633" fill-opacity="0.2"/>
    <text x="130" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f85149" text-anchor="middle">Worst-Case Analysis (WCA)</text>
    
    <text x="15" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Принцип:</text>
    <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#8b949e">Лінійна сума абсолютних</text>
    <text x="15" y="96" font-family="sans-serif" font-size="11" fill="#8b949e">максимальних відхилень:</text>

    <rect x="15" y="115" width="230" height="36" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="130" y="138" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle">Δ_tot = Σ |Δ_i|</text>

    <text x="15" y="175" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Припущення: всі компоненти</text>
    <text x="15" y="193" font-family="sans-serif" font-size="11" fill="#8b949e">  одночасно відхилилися</text>
    <text x="15" y="211" font-family="sans-serif" font-size="11" fill="#8b949e">  у найгірший бік (+3σ).</text>
    <text x="15" y="235" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Ймовірність: надзвичайно мала</text>
    <text x="15" y="253" font-family="sans-serif" font-size="11" fill="#8b949e">  (рідше 1 на мільйон).</text>
    <text x="15" y="280" font-family="sans-serif" font-size="11" fill="#d29922">• Наслідок: надлишкове</text>
    <text x="15" y="298" font-family="sans-serif" font-size="11" fill="#d29922">  здорожчання компонентів.</text>

    <rect x="15" y="315" width="230" height="20" fill="#f85149" fill-opacity="0.15" rx="3"/>
    <text x="130" y="330" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">Оцінка: ±2.85% (Перестраховка)</text>
  </g>

  <!-- Column 2: Root-Sum-of-Squares (RSS) -->
  <g transform="translate(350, 95)">
    <rect width="260" height="340" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="260" height="32" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="130" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">Root-Sum-of-Squares (RSS)</text>
    
    <text x="15" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Принцип:</text>
    <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#8b949e">Геометрична сума незалежних</text>
    <text x="15" y="96" font-family="sans-serif" font-size="11" fill="#8b949e">випадкових величин (дисперсій):</text>

    <rect x="15" y="115" width="230" height="36" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="130" y="138" font-family="monospace" font-size="12" fill="#3fb950" text-anchor="middle">σ_tot = √( Σ σ_i² )</text>

    <text x="15" y="175" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Нормальний (Гаусів) розподіл</text>
    <text x="15" y="193" font-family="sans-serif" font-size="11" fill="#8b949e">  похибок компонентів.</text>
    <text x="15" y="211" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Взаємна компенсація:</text>
    <text x="15" y="229" font-family="sans-serif" font-size="11" fill="#8b949e">  частина відхилень "+",</text>
    <text x="15" y="247" font-family="sans-serif" font-size="11" fill="#8b949e">  інша частина "-".</text>
    <text x="15" y="275" font-family="sans-serif" font-size="11" fill="#3fb950">• Охоплення: 99.73% виробів</text>
    <text x="15" y="293" font-family="sans-serif" font-size="11" fill="#8b949e">  знаходяться в межах ±3σ.</text>

    <rect x="15" y="315" width="230" height="20" fill="#238636" fill-opacity="0.15" rx="3"/>
    <text x="130" y="330" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">Оцінка: ±1.12% (Реалістична)</text>
  </g>

  <!-- Column 3: Monte Carlo Simulation -->
  <g transform="translate(650, 95)">
    <rect width="260" height="340" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect width="260" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="130" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">Моделювання Монте-Карло</text>
    
    <text x="15" y="60" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Принцип:</text>
    <text x="15" y="80" font-family="sans-serif" font-size="11" fill="#8b949e">Чисельний експеримент</text>
    <text x="15" y="96" font-family="sans-serif" font-size="11" fill="#8b949e">з 10 000+ віртуальних збірок:</text>

    <rect x="15" y="115" width="230" height="36" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="130" y="138" font-family="monospace" font-size="11" fill="#58a6ff" text-anchor="middle">N = 100 000 ітерацій</text>

    <text x="15" y="175" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Враховує нелінійності передачі</text>
    <text x="15" y="193" font-family="sans-serif" font-size="11" fill="#8b949e">  (V_out = f(R1, R2, Vref)).</text>
    <text x="15" y="211" font-family="sans-serif" font-size="11" fill="#f0f6fc">• Дозволяє довільні розподіли</text>
    <text x="15" y="229" font-family="sans-serif" font-size="11" fill="#8b949e">  (рівномірні, трапецієподібні).</text>
    <text x="15" y="255" font-family="sans-serif" font-size="11" fill="#58a6ff">• Точний прогноз виходу</text>
    <text x="15" y="273" font-family="sans-serif" font-size="11" fill="#58a6ff">  придатних виробів (Yield).</text>

    <rect x="15" y="315" width="230" height="20" fill="#1f6feb" fill-opacity="0.15" rx="3"/>
    <text x="130" y="330" font-family="sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">Yield &gt; 99.8% при ±1.18%</text>
  </g>
</svg>