<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Математичні моделі апроксимації NTC: B-параметр vs Стейнхарт-Харт</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Порівняння аналітичних рівнянь розрахунку температури за виміряним опором</text>

  <!-- Блоки моделей -->
  <g transform="translate(40, 90)">
    <!-- Блок 1: Рівняння Бета-параметра -->
    <rect x="10" y="10" width="415" height="295" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="10" y="10" width="415" height="34" rx="8" fill="#21262d"/>
    <circle cx="30" cy="27" r="7" fill="#e3b341"/>
    <text x="45" y="32" fill="#f0f6fc" font-size="14" font-weight="700">1. Рівняння B-параметра (Двоточкова модель)</text>

    <!-- Формула Бета -->
    <rect x="25" y="58" width="385" height="65" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="82" fill="#e3b341" font-size="13" font-family="Consolas, monospace">1 / T = 1 / T0 + (1 / B) × ln(R / R0)</text>
    <text x="40" y="106" fill="#8b949e" font-size="11" font-family="Consolas, monospace">R(T) = R0 × exp( B × (1/T - 1/T0) )</text>

    <text x="25" y="145" fill="#f0f6fc" font-size="12" font-weight="600">Параметри:</text>
    <text x="25" y="165" fill="#c9d1d9" font-size="11">• R0 — базовий опір при T0 = 298.15 K (25 °C), напр. 10 кОм</text>
    <text x="25" y="185" fill="#c9d1d9" font-size="11">• B — температурний коефіцієнт матеріалу (3380...4300 K)</text>
    <text x="25" y="205" fill="#c9d1d9" font-size="11">• T, T0 — абсолютна температура строго в Кельвінах (K = °C + 273.15)</text>

    <rect x="25" y="225" width="385" height="65" rx="6" fill="#1f2937"/>
    <text x="35" y="245" fill="#3fb950" font-size="11" font-weight="700">Плюси: простота розрахунку, єдиний коефіцієнт B в даташиті.</text>
    <text x="35" y="265" fill="#ff7b72" font-size="11" font-weight="700">Мінуси: B залежить від температури. Похибка до ±1.5 °C на краях.</text>
    <text x="35" y="280" fill="#8b949e" font-size="10">Оптимальний діапазон: 0 °C ... +50 °C.</text>

    <!-- Блок 2: Рівняння Стейнхарта-Харта -->
    <rect x="450" y="10" width="415" height="295" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="450" y="10" width="415" height="34" rx="8" fill="#21262d"/>
    <circle cx="470" cy="27" r="7" fill="#388bfd"/>
    <text x="485" y="32" fill="#f0f6fc" font-size="14" font-weight="700">2. Поліном Стейнхарта — Харта (Триточкова модель)</text>

    <!-- Формула Стейнхарта -->
    <rect x="465" y="58" width="385" height="65" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="480" y="85" fill="#58a6ff" font-size="13" font-family="Consolas, monospace">1 / T = A + B × ln(R) + C × [ln(R)]^3</text>
    <text x="480" y="108" fill="#8b949e" font-size="11">Член другого степеня [ln(R)]^2 відкинуто (нехтовно малий)</text>

    <text x="465" y="145" fill="#f0f6fc" font-size="12" font-weight="600">Коефіцієнти A, B, C:</text>
    <text x="465" y="165" fill="#c9d1d9" font-size="11">• Знаходять калібруванням у 3 реперних точках (напр. 0, 25, 70 °C)</text>
    <text x="465" y="185" fill="#c9d1d9" font-size="11">• Розв'язання системи трьох лінійних рівнянь методом Крамера</text>
    <text x="465" y="205" fill="#c9d1d9" font-size="11">• Забезпечує точність кращу за ±0.02 °C у всьому діапазоні</text>

    <rect x="465" y="225" width="385" height="65" rx="6" fill="#1f2937"/>
    <text x="475" y="245" fill="#3fb950" font-size="11" font-weight="700">Плюси: найвища метрологічна точність від -40 °C до +125 °C.</text>
    <text x="475" y="265" fill="#e3b341" font-size="11" font-weight="700">Мінуси: вимагає розрахунку логарифма ln(R) або таблиці LUT.</text>
    <text x="475" y="280" fill="#8b949e" font-size="10">Стандарт для медичних та наукових термометрів.</text>
  </g>

  <!-- Порівняння похибки внизу -->
  <g transform="translate(40, 415)">
    <rect width="875" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ПРАКТИЧНЕ ПРАВИЛО ВИБОРУ МАТЕМАТИЧНОЇ МОДЕЛІ ДЛЯ ВБУДОВАНИХ СИСТЕМ:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Мікроконтролери з FPU (STM32F4/G4/ESP32): обчислення Стейнхарта-Харта виконується за кілька мікросекунд через logf().
    </text>
    <text x="25" y="67" fill="#f0f6fc" font-size="11">
      • Прості 8/16-бітні МК (AVR / PIC): використовують заздалегідь згенеровану Flash-таблицю LUT (Look-Up Table) з кроком 1..2 °C та лінійною інтерполяцією.
    </text>
  </g>
</svg>
