<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Інженерна матриця вибору терморезисторів: NTC, Силістори, Керамічні PTC та PPTC</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Порівняння фізичних параметрів, функціонального призначення та критеріїв проектування</text>

  <!-- Таблиця / Матриця -->
  <g transform="translate(30, 85)">
    <!-- Шапка таблиці -->
    <rect x="0" y="0" width="900" height="40" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="110" y="25" fill="#f0f6fc" font-size="12" font-weight="700">Тип компонента</text>
    <text x="290" y="25" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">ТКС (TCR) / Знак</text>
    <text x="450" y="25" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Діапазон T (°C)</text>
    <text x="610" y="25" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">Основна функція</text>
    <text x="780" y="25" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">Ключова перевага</text>

    <!-- Рядок 1: NTC терморезистор -->
    <rect x="0" y="44" width="900" height="60" fill="#161b22"/>
    <circle cx="20" cy="74" r="6" fill="#f85149"/>
    <text x="35" y="67" fill="#ff7b72" font-size="12" font-weight="700">Оксидний NTC</text>
    <text x="35" y="85" fill="#8b949e" font-size="10">Оксиди Mn, Ni, Co, Fe</text>
    <text x="290" y="74" fill="#f85149" font-size="11" font-weight="700" text-anchor="middle">-3...-5 %/°C (Негативний)</text>
    <text x="450" y="74" fill="#f0f6fc" font-size="11" text-anchor="middle">-50 °C ... +150 °C</text>
    <text x="610" y="67" fill="#e3b341" font-size="11" text-anchor="middle">Прецизійний вимір T,</text>
    <text x="610" y="85" fill="#8b949e" font-size="10" text-anchor="middle">пусковий захист ICL</text>
    <text x="780" y="67" fill="#3fb950" font-size="11" text-anchor="middle">Величезна чутливість,</text>
    <text x="780" y="85" fill="#8b949e" font-size="10" text-anchor="middle">мініатюрність, низька ціна</text>

    <!-- Рядок 2: Кремнієвий Силістор (KTY) -->
    <rect x="0" y="108" width="900" height="60" fill="#0d1117"/>
    <circle cx="20" cy="138" r="6" fill="#58a6ff"/>
    <text x="35" y="131" fill="#79c0ff" font-size="12" font-weight="700">Силістор (KTY)</text>
    <text x="35" y="149" fill="#8b949e" font-size="10">Легований кремній n-типу</text>
    <text x="290" y="138" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">+0.7...0.9 %/°C (Позитивний)</text>
    <text x="450" y="138" fill="#f0f6fc" font-size="11" text-anchor="middle">-55 °C ... +175 °C</text>
    <text x="610" y="131" fill="#e3b341" font-size="11" text-anchor="middle">Вимірювання температури</text>
    <text x="610" y="149" fill="#8b949e" font-size="10" text-anchor="middle">в авто та інверторах</text>
    <text x="780" y="131" fill="#3fb950" font-size="11" text-anchor="middle">Висока лінійність,</text>
    <text x="780" y="149" fill="#8b949e" font-size="10" text-anchor="middle">стабільність до перегріву</text>

    <!-- Рядок 3: Керамічний перемикальний PTC -->
    <rect x="0" y="172" width="900" height="60" fill="#161b22"/>
    <circle cx="20" cy="202" r="6" fill="#3fb950"/>
    <text x="35" y="195" fill="#3fb950" font-size="12" font-weight="700">Керамічний PTC</text>
    <text x="35" y="213" fill="#8b949e" font-size="10">Титанат барію BaTiO3</text>
    <text x="290" y="202" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">До +50 %/°C (при Tc)</text>
    <text x="450" y="202" fill="#f0f6fc" font-size="11" text-anchor="middle">Tc = +60 °C ... +250 °C</text>
    <text x="610" y="195" fill="#e3b341" font-size="11" text-anchor="middle">Саморегульований нагрів,</text>
    <text x="610" y="213" fill="#8b949e" font-size="10" text-anchor="middle">захист трансформаторів</text>
    <text x="780" y="195" fill="#3fb950" font-size="11" text-anchor="middle">Пожежобезпечність,</text>
    <text x="780" y="213" fill="#8b949e" font-size="10" text-anchor="middle">безконтактне термостатування</text>

    <!-- Рядок 4: Полімерний запобіжник PPTC -->
    <rect x="0" y="236" width="900" height="60" fill="#0d1117"/>
    <circle cx="20" cy="266" r="6" fill="#f0883e"/>
    <text x="35" y="259" fill="#ffa657" font-size="12" font-weight="700">Полімерний PPTC</text>
    <text x="35" y="277" fill="#8b949e" font-size="10">PolySwitch, провідні сажі</text>
    <text x="290" y="266" fill="#ffa657" font-size="11" font-weight="700" text-anchor="middle">Стрибок R на 10⁴...10⁵</text>
    <text x="450" y="266" fill="#f0f6fc" font-size="11" text-anchor="middle">-40 °C ... +85 °C</text>
    <text x="610" y="259" fill="#e3b341" font-size="11" text-anchor="middle">Захист від надструмів КЗ,</text>
    <text x="610" y="277" fill="#8b949e" font-size="10" text-anchor="middle">USB порти, акумулятори</text>
    <text x="780" y="259" fill="#3fb950" font-size="11" text-anchor="middle">Багаторазове самовідновлення,</text>
    <text x="780" y="277" fill="#8b949e" font-size="10" text-anchor="middle">SMD монтаж без заміни</text>

    <!-- Рядок 5: Платиновий RTD PT100 (для контрасту) -->
    <rect x="0" y="300" width="900" height="50" fill="#161b22"/>
    <circle cx="20" cy="325" r="6" fill="#d2a8ff"/>
    <text x="35" y="322" fill="#d2a8ff" font-size="12" font-weight="700">Платиновий RTD</text>
    <text x="35" y="337" fill="#8b949e" font-size="10">PT100 / PT1000 чиста платина</text>
    <text x="290" y="325" fill="#d2a8ff" font-size="11" font-weight="700" text-anchor="middle">+0.385 %/°C (Лінійний)</text>
    <text x="450" y="325" fill="#f0f6fc" font-size="11" text-anchor="middle">-200 °C ... +600 °C</text>
    <text x="610" y="325" fill="#e3b341" font-size="11" text-anchor="middle">Еталонний вимір температури</text>
    <text x="780" y="325" fill="#3fb950" font-size="11" text-anchor="middle">Найвища стабільність (±0.05°C)</text>
  </g>

  <!-- Підсумок внизу -->
  <g transform="translate(30, 445)">
    <rect width="900" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="25" fill="#58a6ff" font-size="12" font-weight="700">РЕКОМЕНДАЦІЯ РОЗРОБНИКУ:</text>
    <text x="20" y="47" fill="#f0f6fc" font-size="11">
      Для контролю температури батарей та процесорів: NTC 10 кОм. Для захисту ліній живлення 5 В / USB від КЗ: PolySwitch PPTC.
    </text>
  </g>
</svg>
