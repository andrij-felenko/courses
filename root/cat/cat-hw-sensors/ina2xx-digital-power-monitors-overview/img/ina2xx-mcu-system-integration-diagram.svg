<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Адресація I2C та принципова схема виходу ALERT в INA226</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Виводи A0/A1 дають 16 I2C-адрес, а вихід ALERT з відкритим стоком потребує підтяжки R_PULLUP</text>

  <!-- ЛІВА ПАНЕЛЬ: 4-рівневе конфігурування I2C-адрес -->
  <rect x="24" y="75" width="444" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="246" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігурування 16 I2C-адрес (виводи A0, A1)</text>
  <text x="246" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Підключення A0 та A1 до ліній GND, VS, SDA, SCL</text>

  <!-- Підпанель 1: 4 джерела підключення -->
  <rect x="40" y="132" width="412" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">4 рівні підключення для кожного виводу:</text>

  <rect x="52" y="165" width="90" height="36" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="97" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>
  <text x="97" y="194" font-size="12" fill="#6b7280" text-anchor="middle">0V / Земля</text>

  <rect x="148" y="165" width="90" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="193" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VS</text>
  <text x="193" y="194" font-size="12" fill="#6b7280" text-anchor="middle">+V / Живлення</text>

  <rect x="244" y="165" width="90" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="289" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SDA</text>
  <text x="289" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Лінія даних</text>

  <rect x="340" y="165" width="90" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="385" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SCL</text>
  <text x="385" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Лінія такту</text>

  <text x="52" y="218" font-size="12" fill="#1a1a1a">• Виводи A0 та A1 опитуються при включенні (Power-On Reset)</text>
  <text x="52" y="236" font-size="12" fill="#6b7280">• Комбінація підключень 4 × 4 утворює 16 унікальних адрес</text>

  <!-- Підпанель 2: Матриця адрес -->
  <rect x="40" y="264" width="412" height="235" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">Матриця I2C-адрес INA226 (7-біт у HEX):</text>

  <!-- Шапка таблиці -->
  <path d="M 52 296 L 440 296 A 4 4 0 0 1 444 300 L 444 324 L 52 324 Z" fill="#eaf0fd"/>
  <line x1="52" y1="324" x2="444" y2="324" stroke="#d0d7de" stroke-width="1"/>
  <line x1="52" y1="360" x2="444" y2="360" stroke="#d0d7de" stroke-width="1"/>
  <line x1="52" y1="396" x2="444" y2="396" stroke="#d0d7de" stroke-width="1"/>
  <line x1="52" y1="432" x2="444" y2="432" stroke="#d0d7de" stroke-width="1"/>
  <line x1="52" y1="468" x2="444" y2="468" stroke="#d0d7de" stroke-width="1"/>

  <line x1="140" y1="296" x2="140" y2="468" stroke="#d0d7de" stroke-width="1"/>
  <line x1="215" y1="296" x2="215" y2="468" stroke="#d0d7de" stroke-width="1"/>
  <line x1="290" y1="296" x2="290" y2="468" stroke="#d0d7de" stroke-width="1"/>
  <line x1="365" y1="296" x2="365" y2="468" stroke="#d0d7de" stroke-width="1"/>

  <text x="96" y="314" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A1 / A0</text>
  <text x="177" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A0 = GND</text>
  <text x="252" y="314" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">A0 = VS</text>
  <text x="327" y="314" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A0 = SDA</text>
  <text x="402" y="314" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">A0 = SCL</text>

  <!-- Рядок 1: A1 = GND -->
  <text x="96" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A1 = GND</text>
  <rect x="142" y="328" width="71" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="177" y="346" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0x40 *</text>
  <text x="252" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x41</text>
  <text x="327" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x42</text>
  <text x="402" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x43</text>

  <!-- Рядок 2: A1 = VS -->
  <text x="96" y="382" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">A1 = VS</text>
  <text x="177" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x44</text>
  <text x="252" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x45</text>
  <text x="327" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x46</text>
  <text x="402" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x47</text>

  <!-- Рядок 3: A1 = SDA -->
  <text x="96" y="418" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A1 = SDA</text>
  <text x="177" y="418" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x48</text>
  <text x="252" y="418" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x49</text>
  <text x="327" y="418" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x4A</text>
  <text x="402" y="418" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x4B</text>

  <!-- Рядок 4: A1 = SCL -->
  <text x="96" y="454" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">A1 = SCL</text>
  <text x="177" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x4C</text>
  <text x="252" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x4D</text>
  <text x="327" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x4E</text>
  <text x="402" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x4F</text>

  <text x="52" y="486" font-size="12" fill="#27ae60">* 0x40 — адреса за замовчуванням (виводи A0 і A1 підключені до GND)</text>

  <!-- ПРАВА ПАНЕЛЬ: Принципова схема виходу ALERT -->
  <rect x="492" y="75" width="444" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="714" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема виходу сповіщення ALERT</text>
  <text x="714" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Конфігурація з відкритим стоком (Open-Drain) та R_PULLUP</text>

  <!-- Підпанель 1: Схема -->
  <rect x="508" y="132" width="412" height="198" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Внутрішність INA226 -->
  <rect x="520" y="150" width="180" height="165" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="610" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікросхема INA226</text>

  <!-- Логіка компаратора -->
  <rect x="530" y="195" width="70" height="50" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="565" y="216" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логіка</text>
  <text x="565" y="232" font-size="12" fill="#6b7280" text-anchor="middle">Alert / Lim</text>

  <!-- Затвор транзистора -->
  <line x1="600" y1="220" x2="630" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- MOSFET транзистор -->
  <line x1="630" y1="205" x2="630" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="636" y1="200" x2="636" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Стік (Drain) до виводу ALERT -->
  <path d="M 636 205 L 636 225 L 700 225" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="700" cy="225" r="4" fill="#2457d6"/>
  <text x="694" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">ALERT</text>

  <!-- Витік (Source) до GND -->
  <line x1="636" y1="235" x2="636" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="624" y1="265" x2="648" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="628" y1="269" x2="644" y2="269" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="632" y1="273" x2="640" y2="273" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="636" y="287" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <text x="640" y="186" font-size="12" font-weight="bold" fill="#c0392b">N-FET</text>

  <!-- Зовнішній МК -->
  <rect x="830" y="150" width="78" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="869" y="168" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">МК (MCU)</text>
  <circle cx="830" cy="225" r="4" fill="#27ae60"/>
  <text x="838" y="229" font-size="12" font-weight="bold" fill="#1a1a1a">INT</text>
  <text x="869" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Вхід</text>
  <text x="869" y="270" font-size="12" fill="#6b7280" text-anchor="middle">переривання</text>

  <!-- Лінія ALERT від ІС до МК -->
  <line x1="700" y1="225" x2="830" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="760" cy="225" r="3.5" fill="#1a1a1a"/>

  <!-- Резистор підтяжки R_PULLUP -->
  <text x="760" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VDD (+3.3V / +5V)</text>
  <line x1="760" y1="152" x2="760" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="748" y="168" width="24" height="36" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="778" y="182" font-size="12" font-weight="bold" fill="#1a1a1a">R_PULLUP</text>
  <text x="778" y="196" font-size="12" fill="#6b7280">10 кОм</text>
  <line x1="760" y1="204" x2="760" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Позначення рівнів сигналу -->
  <text x="710" y="258" font-size="12" fill="#27ae60">• Норма: HIGH (VDD)</text>
  <text x="710" y="274" font-size="12" fill="#c0392b">• Подія: LOW (GND)</text>

  <!-- Підпанель 2: Опис роботи -->
  <rect x="508" y="342" width="412" height="157" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="364" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип роботи виходу сповіщення ALERT:</text>

  <text x="520" y="386" font-size="12" fill="#1a1a1a">1. Відкритий стік (Open-Drain): без підтяжки напруга відсутня.</text>
  <text x="536" y="402" font-size="12" fill="#6b7280">Зовнішній резистор R_PULLUP підтягує лінію ALERT до VDD.</text>

  <text x="520" y="424" font-size="12" fill="#1a1a1a">2. Активний низький рівень (Active-LOW): при виході з меж</text>
  <text x="536" y="440" font-size="12" fill="#6b7280">(V, I або P) внутрішній N-FET замикає ALERT на GND (0V).</text>

  <text x="520" y="462" font-size="12" fill="#1a1a1a">3. Монтажне «І» (Wired-AND): дозволяє паралельно з'єднати</text>
  <text x="536" y="478" font-size="12" fill="#6b7280">виводи ALERT кількох ІС на один pin переривання МК.</text>
</svg>
