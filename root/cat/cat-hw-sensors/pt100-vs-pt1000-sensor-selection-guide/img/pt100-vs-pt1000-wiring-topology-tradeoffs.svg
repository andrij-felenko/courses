<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Топології підключення: 2-, 3- та 4-провідні схеми для Pt100 та Pt1000</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Компроміс між вартістю кабельної траси, складністю комутації та метрологічною точністю</text>

  <!-- 3 Колонки схем -->
  <g transform="translate(30, 85)">
    <!-- 1. 2-провідна схема (2-Wire) -->
    <rect x="10" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="28" cy="26" r="6" fill="#ff7b72"/>
    <text x="42" y="31" fill="#f0f6fc" font-size="13" font-weight="700">1. Дводротова схема (2-Wire)</text>

    <!-- Схема 2-провід -->
    <g transform="translate(30, 55)">
      <!-- Джерело струму / АЦП -->
      <rect x="10" y="20" width="50" height="90" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="35" y="65" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">АЦП</text>

      <!-- Дроти з опором RL1, RL2 -->
      <line x1="60" y1="35" x2="160" y2="35" stroke="#ff7b72" stroke-width="2"/>
      <rect x="95" y="28" width="24" height="14" fill="#0d1117" stroke="#ff7b72" stroke-width="1"/>
      <text x="107" y="39" fill="#ff7b72" font-size="8" text-anchor="middle">R_L1</text>

      <line x1="60" y1="95" x2="160" y2="95" stroke="#ff7b72" stroke-width="2"/>
      <rect x="95" y="88" width="24" height="14" fill="#0d1117" stroke="#ff7b72" stroke-width="1"/>
      <text x="107" y="99" fill="#ff7b72" font-size="8" text-anchor="middle">R_L2</text>

      <!-- Сенсор RTD -->
      <rect x="160" y="30" width="45" height="70" rx="4" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
      <text x="182" y="70" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">RTD</text>
    </g>

    <text x="25" y="195" fill="#ff7b72" font-size="11" font-weight="700">R_вимір = R_rtd + 2 × R_lead</text>
    
    <text x="25" y="225" fill="#f0f6fc" font-size="11" font-weight="600">Оцінка для сенсорів:</text>
    <text x="25" y="245" fill="#ff7b72" font-size="10">• Pt100: КАТЕГОРИЧНО НЕ РЕКОМЕНДОВАНО</text>
    <text x="25" y="260" fill="#8b949e" font-size="9">  Похибка 2.6 °C на кожен 1 Ом кабелю</text>
    <text x="25" y="280" fill="#3fb950" font-size="10">• Pt1000: ВІДМІННО для ліній до 15–20 м</text>
    <text x="25" y="295" fill="#8b949e" font-size="9">  Похибка менше 0.25 °C. Економія кабелю</text>
    <text x="25" y="318" fill="#8b949e" font-size="10">Застосування: HVAC, термостати приміщень</text>

    <!-- 2. 3-провідна схема (3-Wire) -->
    <rect x="310" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="310" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="328" cy="26" r="6" fill="#e3b341"/>
    <text x="342" y="31" fill="#f0f6fc" font-size="13" font-weight="700">2. Трипровідна схема (3-Wire)</text>

    <!-- Схема 3-провід -->
    <g transform="translate(330, 55)">
      <rect x="10" y="15" width="50" height="100" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="35" y="68" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">АЦП</text>

      <line x1="60" y1="30" x2="160" y2="30" stroke="#58a6ff" stroke-width="2"/>
      <line x1="60" y1="65" x2="160" y2="65" stroke="#e3b341" stroke-width="2"/>
      <line x1="60" y1="100" x2="160" y2="100" stroke="#3fb950" stroke-width="2"/>

      <line x1="160" y1="65" x2="160" y2="100" stroke="#3fb950" stroke-width="2"/>

      <rect x="160" y="25" width="45" height="80" rx="4" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
      <text x="182" y="68" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">RTD</text>
    </g>

    <text x="325" y="195" fill="#e3b341" font-size="11" font-weight="700">Компенсація при RL1 = RL2 = RL3</text>

    <text x="325" y="225" fill="#f0f6fc" font-size="11" font-weight="600">Оцінка для сенсорів:</text>
    <text x="325" y="245" fill="#3fb950" font-size="10">• Pt100: ПРОМИСЛОВИЙ СТАНДАРТ ДЕ-ФАКТО</text>
    <text x="325" y="260" fill="#8b949e" font-size="9">  Повна компенсація за умови однакових жил</text>
    <text x="325" y="280" fill="#58a6ff" font-size="10">• Pt1000: Висока надлишкова точність</text>
    <text x="325" y="295" fill="#8b949e" font-size="9">  Застосовується для довгих трас (&gt;50 м)</text>
    <text x="325" y="318" fill="#8b949e" font-size="10">Застосування: АСУТП, ПЛК (Siemens, WAGO)</text>

    <!-- 3. 4-провідна схема (4-Wire Кельвін) -->
    <rect x="610" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="610" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="628" cy="26" r="6" fill="#3fb950"/>
    <text x="642" y="31" fill="#f0f6fc" font-size="13" font-weight="700">3. Чотирипровідна (Kelvin 4-Wire)</text>

    <!-- Схема 4-провід -->
    <g transform="translate(630, 55)">
      <rect x="10" y="15" width="50" height="100" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="35" y="45" fill="#f0883e" font-size="9" font-weight="700" text-anchor="middle">I_FORCE</text>
      <text x="35" y="85" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle">V_SENSE</text>

      <line x1="60" y1="25" x2="160" y2="25" stroke="#f0883e" stroke-width="2"/>
      <line x1="60" y1="50" x2="160" y2="50" stroke="#3fb950" stroke-width="2"/>
      <line x1="60" y1="80" x2="160" y2="80" stroke="#3fb950" stroke-width="2"/>
      <line x1="60" y1="105" x2="160" y2="105" stroke="#f0883e" stroke-width="2"/>

      <rect x="160" y="20" width="45" height="90" rx="4" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
      <text x="182" y="68" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">RTD</text>
    </g>

    <text x="625" y="195" fill="#3fb950" font-size="11" font-weight="700">100% компенсація будь-яких дротів</text>

    <text x="625" y="225" fill="#f0f6fc" font-size="11" font-weight="600">Оцінка для сенсорів:</text>
    <text x="625" y="245" fill="#3fb950" font-size="10">• Pt100: ЕТАЛОННА ТОЧНІСТЬ (Class AA / 1/10 DIN)</text>
    <text x="625" y="260" fill="#8b949e" font-size="9">  Похибка лінії = 0.000 °C навіть при 100 Ом</text>
    <text x="625" y="280" fill="#58a6ff" font-size="10">• Pt1000: Лабораторний максимум</text>
    <text x="625" y="295" fill="#8b949e" font-size="9">  Вимоглива до вартості чотирижильного кабелю</text>
    <text x="625" y="318" fill="#8b949e" font-size="10">Застосування: Калібрувальні печі, метрологія</text>
  </g>

  <!-- Підсумок внизу -->
  <g transform="translate(30, 435)">
    <rect width="900" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ПРАКТИЧНЕ ПРАВИЛО ПРОЕКТУВАННЯ КАБЕЛЬНИХ ЛІНІЙ:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Якщо система будується на 2-провідному кабелі (економія монтажу) — обирайте строго Pt1000.
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • Якщо застосовуються стандартні промислові модулі ПЛК з 3- або 4-провідними входами — беззаперечним стандартом є Pt100.
    </text>
  </g>
</svg>
