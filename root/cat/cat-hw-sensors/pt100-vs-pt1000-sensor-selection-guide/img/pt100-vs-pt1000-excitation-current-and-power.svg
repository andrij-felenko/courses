<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Струм збудження, споживана потужність та енергоефективність: Pt100 vs Pt1000</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Чому Pt1000 забезпечує вдесятеро менший самопрогрів та кращу автономність бездротових IoT систем</text>

  <!-- Схема порівняння (2 колонки) -->
  <g transform="translate(40, 85)">
    <!-- Блок Pt100 -->
    <rect x="10" y="10" width="415" height="325" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="10" y="10" width="415" height="34" rx="8" fill="#21262d"/>
    <circle cx="30" cy="27" r="7" fill="#58a6ff"/>
    <text x="45" y="32" fill="#f0f6fc" font-size="14" font-weight="700">Енергетичні параметри Pt100</text>

    <!-- Струм та потужність Pt100 -->
    <g transform="translate(25, 60)">
      <rect width="385" height="75" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="24" fill="#58a6ff" font-size="12" font-weight="700">Струм збудження: I_ex = 1.0 мА (1000 мкА)</text>
      <text x="15" y="46" fill="#f0f6fc" font-size="12" font-family="Consolas, monospace">
        P_diss = I² × R = (1.0 мА)² × 100 Ом = 0.100 мВт
      </text>
      <text x="15" y="66" fill="#8b949e" font-size="11">
        Падіння напруги: V_out = 1.0 мА × 100 Ом = 100.0 мВ
      </text>
    </g>

    <!-- Самопрогрів Pt100 -->
    <g transform="translate(25, 145)">
      <rect width="385" height="75" rx="6" fill="#1f2937" stroke="#ff7b72" stroke-width="1.2"/>
      <text x="15" y="24" fill="#ff7b72" font-size="11" font-weight="700">Теплова похибка самопрогріву (при δ = 2 мВт/°C):</text>
      <text x="15" y="48" fill="#f0f6fc" font-size="12" font-family="Consolas, monospace">
        ΔT = P_diss / δ = 0.100 мВт / 2.0 мВт/°C = +0.050 °C
      </text>
      <text x="15" y="66" fill="#ff7b72" font-size="10">
        У нерухомому газі або вакуумі самопрогрів може сягати 0.2...0.5 °C!
      </text>
    </g>

    <text x="25" y="245" fill="#f0f6fc" font-size="11" font-weight="600">Висновки для автономних пристроїв:</text>
    <text x="25" y="265" fill="#c9d1d9" font-size="10">• Струм 1 мА надто великий для безперервного живлення від батарей</text>
    <text x="25" y="282" fill="#c9d1d9" font-size="10">• Потрібен обов'язковий строб-імпульсний режим опитування</text>
    <text x="25" y="300" fill="#8b949e" font-size="10">• Традиційний вибір промислових мереж 4–20 мА з живленням від петлі</text>

    <!-- Блок Pt1000 -->
    <rect x="455" y="10" width="415" height="325" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="455" y="10" width="415" height="34" rx="8" fill="#21262d"/>
    <circle cx="475" cy="27" r="7" fill="#3fb950"/>
    <text x="490" y="32" fill="#f0f6fc" font-size="14" font-weight="700">Енергетичні параметри Pt1000</text>

    <!-- Струм та потужність Pt1000 -->
    <g transform="translate(470, 60)">
      <rect width="385" height="75" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="24" fill="#3fb950" font-size="12" font-weight="700">Струм збудження: I_ex = 0.1 мА (100 мкА)</text>
      <text x="15" y="46" fill="#f0f6fc" font-size="12" font-family="Consolas, monospace">
        P_diss = I² × R = (0.1 мА)² × 1000 Ом = 0.010 мВт
      </text>
      <text x="15" y="66" fill="#8b949e" font-size="11">
        Падіння напруги: V_out = 0.1 мА × 1000 Ом = 100.0 мВ (однаковий рівень!)
      </text>
    </g>

    <!-- Самопрогрів Pt1000 -->
    <g transform="translate(470, 145)">
      <rect width="385" height="75" rx="6" fill="#1f2937" stroke="#3fb950" stroke-width="1.2"/>
      <text x="15" y="24" fill="#3fb950" font-size="11" font-weight="700">Теплова похибка самопрогріву (при δ = 2 мВт/°C):</text>
      <text x="15" y="48" fill="#f0f6fc" font-size="12" font-family="Consolas, monospace">
        ΔT = P_diss / δ = 0.010 мВт / 2.0 мВт/°C = +0.005 °C
      </text>
      <text x="15" y="66" fill="#3fb950" font-size="10">
        У 10 разів менший самопрогрів! Нехтовно мала систематична похибка.
      </text>
    </g>

    <text x="470" y="245" fill="#f0f6fc" font-size="11" font-weight="600">Переваги для Battery/IoT:</text>
    <text x="470" y="265" fill="#3fb950" font-size="10">• Економія заряду акумулятора у 10 разів при постійному струмі</text>
    <text x="470" y="282" fill="#3fb950" font-size="10">• Робота від однієї літієвої батарейки CR2032 або 18650 роками</text>
    <text x="470" y="300" fill="#8b949e" font-size="10">• Відмінний тепловий баланс у мікрозахисних гільзах та повітрі</text>
  </g>

  <!-- Підсумок внизу -->
  <g transform="translate(40, 435)">
    <rect width="870" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ЗОЛОТЕ ПРАВИЛО ВИБОРУ ЗА ЕНЕРГОСПОЖИВАННЯМ:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • При однаковій вихідній напрузі сигналу (100 мВ) сенсор Pt1000 розсіює лише 10 мкВт проти 100 мкВт у Pt100.
    </text>
    <text x="25" y="63" fill="#8b949e" font-size="11">
      • Для бездротових реєстраторів даних, термостатів HVAC та медичних портативних приладів перевагу завжди має Pt1000.
    </text>
  </g>
</svg>
