<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Компроміс точності та розміру таблиці в пам'яті Flash</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Залежність максимальної похибки апроксимації від кількості точок LUT та порядку інтерполяції</text>

  <!-- Chart Area -->
  <g transform="translate(120, 95)">
    <!-- Axes -->
    <line x1="0" y1="260" x2="720" y2="260" stroke="#30363d" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="260" stroke="#30363d" stroke-width="2"/>
    <text x="710" y="285" font-family="sans-serif" font-size="12" fill="#8b949e">Кількість вузлів (N)</text>
    <text x="-15" y="25" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Макс. похибка</text>

    <!-- X labels: 8, 16, 32, 64, 128, 256 -->
    <text x="80" y="280" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">8</text>
    <text x="200" y="280" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">16</text>
    <text x="320" y="280" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">32</text>
    <text x="440" y="280" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">64</text>
    <text x="560" y="280" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">128</text>
    <text x="680" y="280" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">256</text>

    <!-- Y labels (log scale) -->
    <text x="-15" y="50" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">5.0%</text>
    <text x="-15" y="105" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">1.0%</text>
    <text x="-15" y="160" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">0.2%</text>
    <text x="-15" y="215" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">0.05%</text>
    <text x="-15" y="255" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">0.01%</text>

    <!-- Grid lines -->
    <line x1="0" y1="100" x2="720" y2="100" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="155" x2="720" y2="155" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="210" x2="720" y2="210" stroke="#21262d" stroke-dasharray="4 4"/>

    <!-- Curve 1: Nearest Neighbor (0-order, Step) -->
    <path d="M 80,60 L 200,95 L 320,135 L 440,175 L 560,215 L 680,240" 
          fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="560" y="195" font-family="sans-serif" font-size="10" fill="#f85149">Без інтерполяції (Найближчий вузол)</text>

    <!-- Curve 2: Linear Interpolation (1st-order, LERP) O(1/N^2) -->
    <path d="M 80,75 L 200,130 L 320,185 L 440,235 L 560,255 L 680,258" 
          fill="none" stroke="#3fb950" stroke-width="3"/>
    <circle cx="80" cy="75" r="4" fill="#3fb950"/>
    <circle cx="200" cy="130" r="4" fill="#3fb950"/>
    <circle cx="320" cy="185" r="4" fill="#3fb950"/>
    <circle cx="440" cy="235" r="5" fill="#3fb950"/>
    <circle cx="560" cy="255" r="4" fill="#3fb950"/>
    <circle cx="680" cy="258" r="4" fill="#3fb950"/>
    <text x="360" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Лінійна LERP: O(1 / N²)</text>

    <!-- Sweet Spot Callout at N=64 -->
    <line x1="440" y1="235" x2="440" y2="110" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="360" y="75" width="160" height="40" rx="4" fill="#161b22" stroke="#d29922"/>
    <text x="440" y="93" font-family="sans-serif" font-size="10" font-weight="bold" fill="#d29922" text-anchor="middle">Оптимальний баланс</text>
    <text x="440" y="107" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">N = 64 точок (128 байт ROM, &lt;0.05%)</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(120, 395)">
    <rect width="720" height="65" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="25" font-family="sans-serif" font-size="11" fill="#f0f6fc">
      <tspan font-weight="bold" fill="#3fb950">• Правило квадратичного зменшення похибки:</tspan> Подвоєння кількості вузлів зменшує похибку лінійної LERP у 4 рази.
    </text>
    <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#f0f6fc">
      Таблиця всього на 64 точки забезпечує точність кращу за 0.05%, споживаючи лише 128 байтів flash-пам'яті мікроконтролера.
    </text>
  </g>
</svg>