<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Активна схема зміщення на прецизійному ОП (Single-Supply)</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Трансляція вхідного діапазону -55°C..+125°C у позитивну шкалу АЦП 0.1В..3.0В</text>

  <!-- Left: OpAmp circuit -->
  <rect x="40" y="85" width="460" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="270" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Диференціальний суматор на Rail-to-Rail ОП</text>

  <!-- LM35 source -->
  <rect x="60" y="160" width="80" height="60" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">LM35</text>

  <line x1="140" y1="190" x2="210" y2="190" stroke="#58a6ff" stroke-width="2"/>
  <rect x="210" y="180" width="45" height="20" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="232" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">R_in</text>

  <!-- OpAmp Triangle -->
  <polygon points="310,160 310,280 410,220" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="325" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f85149">-</text>
  <text x="325" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#3fb950">+</text>

  <line x1="255" y1="190" x2="310" y2="190" stroke="#f85149" stroke-width="2"/>

  <!-- V_REF block for positive shift -->
  <rect x="60" y="260" width="90" height="55" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="105" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">V_REF (ІОН)</text>
  <text x="105" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">+1.000 В</text>

  <line x1="150" y1="285" x2="220" y2="285" stroke="#d29922" stroke-width="2"/>
  <rect x="220" y="275" width="45" height="20" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="242" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">R_ref</text>
  <line x1="265" y1="285" x2="285" y2="285" stroke="#d29922" stroke-width="2"/>
  <line x1="285" y1="285" x2="285" y2="250" stroke="#d29922" stroke-width="2"/>
  <line x1="285" y1="250" x2="310" y2="250" stroke="#d29922" stroke-width="2"/>

  <!-- Feedback resistor R_f -->
  <line x1="290" y1="190" x2="290" y2="140" stroke="#bc8cff" stroke-width="2"/>
  <line x1="290" y1="140" x2="330" y2="140" stroke="#bc8cff" stroke-width="2"/>
  <rect x="330" y="130" width="45" height="20" fill="#21262d" stroke="#bc8cff" stroke-width="1"/>
  <text x="352" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#bc8cff" text-anchor="middle">R_f</text>
  <line x1="375" y1="140" x2="430" y2="140" stroke="#bc8cff" stroke-width="2"/>
  <line x1="430" y1="140" x2="430" y2="220" stroke="#bc8cff" stroke-width="2"/>

  <!-- OpAmp Output to MCU ADC -->
  <line x1="410" y1="220" x2="470" y2="220" stroke="#3fb950" stroke-width="2.5"/>
  <circle cx="470" cy="220" r="4" fill="#3fb950"/>
  <text x="475" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">До АЦП MCU</text>
  <text x="475" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">0.1 .. 3.0 В</text>

  <!-- Formula banner below -->
  <rect x="60" y="380" width="420" height="50" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="270" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">V_adc = V_ref + (R_f / R_in) · V_lm35</text>

  <!-- Right: Benefits of active solution -->
  <rect x="520" y="85" width="290" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="665" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Переваги активної схеми</text>

  <rect x="535" y="140" width="260" height="85" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="545" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">1. Один канал АЦП:</text>
  <text x="545" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Не потребує диференційного</text>
  <text x="545" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">віднімання двох каналів</text>

  <rect x="535" y="235" width="260" height="95" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="545" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">2. Нульовий дрейф нуля:</text>
  <text x="545" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">ІОН на базі TL431 або REF3025</text>
  <text x="545" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">стабільний (дрейф &lt; 20 ppm/°C)</text>
  <text x="545" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">проти -2.2 мВ/°C у діодів 1N4148</text>

  <rect x="535" y="340" width="260" height="95" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="545" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">3. Масштабування шкали:</text>
  <text x="545" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Підбором R_f можна задати</text>
  <text x="545" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">чутливість 20..50 мВ/°C для</text>
  <text x="545" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79c0ff">максимальної роздільності АЦП</text>
</svg>