<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Класична схема LM35 з двополярним живленням (+Vs / -Vs)</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Стікання струму через резистор R1 до від'ємної шини для вимірювання від -55 °C до +150 °C</text>

  <!-- Schematic Box -->
  <rect x="40" y="85" width="430" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="255" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Принципова схема (Texas Instruments)</text>

  <!-- LM35 Package Box -->
  <rect x="150" y="150" width="160" height="150" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="230" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">LM35</text>
  <text x="230" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">10 mV / °C</text>

  <!-- +Vs Pin 1 -->
  <line x1="230" y1="150" x2="230" y2="120" stroke="#f85149" stroke-width="2"/>
  <circle cx="230" cy="120" r="4" fill="#f85149"/>
  <text x="240" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">+Vs (+4В .. +30В)</text>

  <!-- GND Pin 3 -->
  <line x1="150" y1="225" x2="100" y2="225" stroke="#8b949e" stroke-width="2"/>
  <line x1="100" y1="225" x2="100" y2="255" stroke="#8b949e" stroke-width="2"/>
  <line x1="85" y1="255" x2="115" y2="255" stroke="#8b949e" stroke-width="2"/>
  <line x1="90" y1="260" x2="110" y2="260" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="95" y1="265" x2="105" y2="265" stroke="#8b949e" stroke-width="1"/>
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">GND</text>

  <!-- Vout Pin 2 -->
  <line x1="310" y1="225" x2="380" y2="225" stroke="#3fb950" stroke-width="2.5"/>
  <circle cx="380" cy="225" r="4" fill="#3fb950"/>
  <text x="390" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950">V_OUT</text>
  <text x="390" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">-550mV .. +1.5V</text>

  <!-- Resistor R1 to -Vs -->
  <circle cx="345" cy="225" r="4" fill="#3fb950"/>
  <line x1="345" y1="225" x2="345" y2="275" stroke="#bc8cff" stroke-width="2"/>
  <!-- Resistor box -->
  <rect x="335" y="275" width="20" height="45" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="365" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#bc8cff">R1</text>
  <line x1="345" y1="320" x2="345" y2="365" stroke="#bc8cff" stroke-width="2"/>
  <circle cx="345" cy="365" r="4" fill="#bc8cff"/>
  <text x="360" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#bc8cff">-Vs (-5В або -12В)</text>

  <!-- Equation note in schematic box -->
  <rect x="60" y="390" width="390" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="255" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7ee787" text-anchor="middle">Розрахунок: R1 = -V_s / 50 мкА (наприклад, 100 кОм при -5В)</text>

  <!-- Right: Principles and limits -->
  <rect x="490" y="85" width="320" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="650" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Принцип дії резистора R1</text>

  <rect x="510" y="140" width="280" height="85" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="525" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">1. Емітерний вихід NPN:</text>
  <text x="525" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Внутрішній вихідний транзистор</text>
  <text x="525" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">може лише віддавати струм (Source)</text>

  <rect x="510" y="240" width="280" height="85" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="525" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">2. Струм зміщення через R1:</text>
  <text x="525" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">Підтяжка до -Vs створює струм стоку</text>
  <text x="525" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">I_sink ≈ 50 мкА (гарантує лінійність)</text>

  <rect x="510" y="340" width="280" height="95" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="525" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">Головний недолік схеми:</text>
  <text x="525" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Потрібне додаткове джерело -Vs,</text>
  <text x="525" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">яке відсутнє в сучасних 3.3В / 5В</text>
  <text x="525" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">мікроконтролерних системах!</text>
</svg>