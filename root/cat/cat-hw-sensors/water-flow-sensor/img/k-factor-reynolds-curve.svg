<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e40af"/>
    </marker>
  </defs>

  <!-- Заголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Залежність K-фактора від числа Рейнольдса (Re) та режиму потоку</text>
  <text x="480" y="56" font-size="13" fill="#64748b" text-anchor="middle">Вплив в'язкого тертя при Re &lt; 2000, перехідного режиму та розвиненої турбулентності Re &gt; 4000</text>

  <!-- Зони потоку -->
  <!-- Ламінарна зона -->
  <rect x="130" y="90" width="160" height="310" fill="#fef2f2" stroke="#f87171" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.6"/>
  <!-- Перехідна зона -->
  <rect x="290" y="90" width="130" height="310" fill="#fffbeb" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.6"/>
  <!-- Турбулентна зона (робоче плато) -->
  <rect x="420" y="90" width="260" height="310" fill="#f0fdf4" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.6"/>

  <!-- Заголовки зон -->
  <text x="210" y="112" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Ламінарний режим</text>
  <text x="210" y="128" font-size="11" fill="#7f1d1d" text-anchor="middle">Re &lt; 2000 (в'язкість)</text>

  <text x="355" y="112" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Перехідна зона</text>
  <text x="355" y="128" font-size="11" fill="#78350f" text-anchor="middle">2000 ≤ Re ≤ 4000</text>

  <text x="550" y="112" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Турбулентний режим (Робоче плато)</text>
  <text x="550" y="128" font-size="11" fill="#14532d" text-anchor="middle">Re &gt; 4000 (K ≈ K_nom, лінійність)</text>

  <!-- Лінії сітки -->
  <line x1="130" y1="230" x2="680" y2="230" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="130" y1="160" x2="680" y2="160" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="130" y1="320" x2="680" y2="320" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Осі координат -->
  <line x1="130" y1="400" x2="130" y2="80" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-black)"/>
  <line x1="125" y1="400" x2="690" y2="400" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Підписи осей -->
  <text x="130" y="70" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">K-фактор (імп/л)</text>
  <text x="685" y="435" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">Число Рейнольдса Re / Швидкість v</text>

  <!-- Y-мітки -->
  <text x="120" y="234" font-size="12" font-weight="bold" fill="#15803d" text-anchor="end">K_nom (450)</text>
  <text x="120" y="164" font-size="11" fill="#64748b" text-anchor="end">+10%</text>
  <text x="120" y="324" font-size="11" fill="#64748b" text-anchor="end">-20%</text>
  <text x="120" y="394" font-size="11" fill="#64748b" text-anchor="end">-50%</text>

  <!-- X-мітки -->
  <text x="130" y="418" font-size="11" fill="#64748b" text-anchor="middle">0</text>
  <line x1="290" y1="400" x2="290" y2="406" stroke="#1e293b" stroke-width="1.5"/>
  <text x="290" y="420" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Re = 2000</text>

  <line x1="420" y1="400" x2="420" y2="406" stroke="#1e293b" stroke-width="1.5"/>
  <text x="420" y="420" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Re = 4000</text>

  <line x1="630" y1="400" x2="630" y2="406" stroke="#1e293b" stroke-width="1.5"/>
  <text x="630" y="420" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Re = 12 000</text>

  <!-- Крива K(Re) -->
  <path d="M 140,385 C 190,370 240,310 290,260 C 330,225 380,228 420,230 C 500,230 580,230 630,235 C 655,240 670,270 680,305" fill="none" stroke="#2563eb" stroke-width="3.5"/>

  <!-- Анотації на графіку -->
  <!-- Ламінарний завал -->
  <circle cx="190" cy="355" r="4" fill="#ef4444"/>
  <line x1="190" y1="345" x2="190" y2="280" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="190" y="270" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Механічне тертя</text>
  <text x="190" y="284" font-size="10" fill="#7f1d1d" text-anchor="middle">проковзування ротора</text>

  <!-- Плато -->
  <line x1="520" y1="210" x2="520" y2="225" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="520" y="195" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Лінійне плато K ≈ K_nom</text>
  <text x="520" y="208" font-size="10" fill="#64748b" text-anchor="middle">стабільний вихровий профіль</text>

  <!-- Турбулентний спад -->
  <circle cx="675" cy="290" r="4" fill="#ef4444"/>
  <line x1="650" y1="220" x2="668" y2="275" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="650" y="200" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Гідродинамічне</text>
  <text x="650" y="213" font-size="10" fill="#7f1d1d" text-anchor="middle">гальмування</text>

  <!-- Права панель з формулами та поясненнями -->
  <rect x="710" y="90" width="230" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="725" y="115" font-size="12" font-weight="bold" fill="#0f172a">Гідродинамічна модель</text>
  <text x="725" y="140" font-size="12" font-family="monospace" fill="#2563eb">Re = (4 · Q) / (π · d · ν)</text>
  <text x="725" y="165" font-size="11" fill="#475569">Q — об'ємна витрата рідини</text>
  <text x="725" y="185" font-size="11" fill="#475569">d — внутрішній діаметр сопла</text>
  <text x="725" y="205" font-size="11" fill="#475569">ν — кінематична в'язкість</text>
  <text x="725" y="225" font-size="11" fill="#64748b">Для води при 20°C: ν ≈ 10⁻⁶ м²/с</text>

  <rect x="710" y="255" width="230" height="145" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="725" y="278" font-size="12" font-weight="bold" fill="#15803d">Висновки для калібрування</text>
  <text x="725" y="302" font-size="11" fill="#1e293b">• Re &lt; 2000: потрібна LUT-</text>
  <text x="735" y="318" font-size="11" fill="#475569">корекція або поріг відсічки</text>
  <text x="725" y="340" font-size="11" fill="#1e293b">• 4000 &lt; Re &lt; 15000: висока</text>
  <text x="735" y="356" font-size="11" fill="#15803d">лінійність (похибка ≤ 2%)</text>
  <text x="725" y="378" font-size="11" fill="#1e293b">• Понад 15000: кавітація,</text>
  <text x="735" y="394" font-size="11" fill="#b91c1c">потрібен поліном 2-го порядку</text>

  <!-- Нижня легенда -->
  <rect x="130" y="450" width="550" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="150" y1="470" x2="185" y2="470" stroke="#2563eb" stroke-width="3.5"/>
  <text x="195" y="474" font-size="11" font-weight="bold" fill="#0f172a">Фактичний K(Re)</text>

  <line x1="330" y1="470" x2="365" y2="470" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="375" y="474" font-size="11" fill="#64748b">Паспортний номінал K_nom</text>

  <circle cx="530" cy="470" r="4" fill="#ef4444"/>
  <text x="542" y="474" font-size="11" fill="#b91c1c">Зони нелінійних відхилень</text>
</svg>
