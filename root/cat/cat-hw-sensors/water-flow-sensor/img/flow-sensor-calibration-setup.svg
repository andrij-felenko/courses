<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Заголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Стенд для експериментального калібрування давача витрати води</text>
  <text x="480" y="56" font-size="13" fill="#64748b" text-anchor="middle">Збір вимірювальної матриці частота-витрата за допомогою еталонного контрольного об'єму</text>

  <!-- Блок 1: Джерело води під тиском -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="110" height="180" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="55" y="28" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Резервуар /</text>
    <text x="55" y="44" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Водопровід</text>

    <!-- Рівень води -->
    <path d="M 5,80 Q 25,75 55,80 T 105,80 L 105,175 L 5,175 Z" fill="#bae6fd" opacity="0.7"/>
    <line x1="5" y1="80" x2="105" y2="80" stroke="#0284c7" stroke-width="1.5"/>

    <text x="55" y="125" font-size="11" fill="#0369a1" text-anchor="middle">Стабільний</text>
    <text x="55" y="140" font-size="11" fill="#0369a1" text-anchor="middle">тиск P_in</text>
  </g>

  <!-- Труба від резервуара до крана -->
  <rect x="150" y="185" width="60" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <line x1="155" y1="195" x2="205" y2="195" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Регулювальний вентиль -->
  <g transform="translate(210, 165)">
    <polygon points="0,10 40,30 0,30 40,10" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <!-- Маховик крана -->
    <line x1="20" y1="20" x2="20" y2="0" stroke="#475569" stroke-width="2"/>
    <rect x="10" y="-4" width="20" height="6" rx="2" fill="#ef4444"/>
    <text x="20" y="55" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Регулювальний</text>
    <text x="20" y="69" font-size="11" fill="#64748b" text-anchor="middle">вентиль</text>
  </g>

  <!-- Труба від крана до сенсора (ділянка ламінаризації) -->
  <rect x="250" y="185" width="80" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <line x1="260" y1="195" x2="320" y2="195" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="290" y="175" font-size="10" fill="#64748b" text-anchor="middle">L ≥ 10 D</text>

  <!-- Блок 3: Давач витрати YF-S201 -->
  <g transform="translate(330, 160)">
    <!-- Корпус датчика -->
    <rect x="0" y="15" width="90" height="40" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Патрубки -->
    <rect x="-10" y="25" width="10" height="20" fill="#475569"/>
    <rect x="90" y="25" width="10" height="20" fill="#475569"/>
    <!-- Кришка з Холлом -->
    <circle cx="45" cy="35" r="14" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="45" y="39" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">YF-S201</text>
    <text x="45" y="72" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Витратомір</text>
    <text x="45" y="86" font-size="10" fill="#64748b" text-anchor="middle">(G1/2″, Холл)</text>

    <!-- Провід сигнальний -->
    <path d="M 45,15 L 45,-30 L 150,-30" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="90" y="-35" font-size="10" font-weight="bold" fill="#ca8a04">Імпульси (EXTI)</text>
  </g>

  <!-- Труба після сенсора з виливом -->
  <rect x="430" y="185" width="70" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 500,185 L 530,185 L 530,225" fill="none" stroke="#64748b" stroke-width="14"/>
  <path d="M 500,185 L 530,185 L 530,225" fill="none" stroke="#cbd5e1" stroke-width="11"/>

  <!-- Струмінь води -->
  <path d="M 525,230 L 525,310" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8,4"/>

  <!-- Блок 4: Еталонний мірний циліндр / резервуар -->
  <g transform="translate(480, 290)">
    <!-- Мірна колба -->
    <rect x="0" y="0" width="100" height="170" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <!-- Рівень води -->
    <rect x="4" y="50" width="92" height="116" fill="#38bdf8" fill-opacity="0.4"/>
    <line x1="4" y1="50" x2="96" y2="50" stroke="#0284c7" stroke-width="2"/>

    <!-- Градуювальні мітки -->
    <line x1="4" y1="50" x2="25" y2="50" stroke="#1e293b" stroke-width="1.5"/>
    <text x="30" y="54" font-size="10" font-weight="bold" fill="#0f172a">10 л (V_ref)</text>

    <line x1="4" y1="80" x2="20" y2="80" stroke="#64748b" stroke-width="1"/>
    <text x="25" y="83" font-size="9" fill="#64748b">8 л</text>

    <line x1="4" y1="110" x2="20" y2="110" stroke="#64748b" stroke-width="1"/>
    <text x="25" y="113" font-size="9" fill="#64748b">5 л</text>

    <line x1="4" y1="140" x2="20" y2="140" stroke="#64748b" stroke-width="1"/>
    <text x="25" y="143" font-size="9" fill="#64748b">2 л</text>

    <text x="50" y="190" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Еталонний бак</text>
    <text x="50" y="204" font-size="10" fill="#64748b" text-anchor="middle">V_ref = 10.0 л</text>
  </g>

  <!-- Блок 5: Електронний модуль вимірювання (MCU + Дисплей + Секундомір) -->
  <g transform="translate(480, 95)">
    <rect x="0" y="0" width="160" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Екранчик OLED/LCD -->
    <rect x="10" y="10" width="140" height="65" rx="4" fill="#0f172a"/>
    <text x="20" y="28" font-size="10" font-family="monospace" fill="#4ade80">N: 4500 imp</text>
    <text x="20" y="44" font-size="10" font-family="monospace" fill="#38bdf8">f_avg: 75.0 Hz</text>
    <text x="20" y="60" font-size="10" font-family="monospace" fill="#facc15">t: 60.0 s</text>

    <text x="80" y="102" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Мікроконтролер (MCU)</text>
    <text x="80" y="115" font-size="10" fill="#64748b" text-anchor="middle">Апаратний лічильник</text>
  </g>

  <!-- Права частина: формули та методика калібрування -->
  <g transform="translate(680, 95)">
    <!-- Картка формул -->
    <rect x="0" y="0" width="245" height="200" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="25" font-size="13" font-weight="bold" fill="#0f172a">Розрахункові формули</text>

    <text x="15" y="52" font-size="11" fill="#475569">1. Еталонна витрата:</text>
    <text x="25" y="70" font-size="12" font-family="monospace" font-weight="bold" fill="#0284c7">Q_real = V_ref / Δt</text>

    <text x="15" y="96" font-size="11" fill="#475569">2. Середня частота сигналу:</text>
    <text x="25" y="114" font-size="12" font-family="monospace" font-weight="bold" fill="#16a34a">f_avg = N_pulses / Δt</text>

    <text x="15" y="140" font-size="11" fill="#475569">3. Експериментальний K-фактор:</text>
    <text x="25" y="158" font-size="12" font-family="monospace" font-weight="bold" fill="#b91c1c">K_exp = N_pulses / V_ref</text>

    <text x="25" y="180" font-size="11" font-family="monospace" fill="#64748b">або: K_exp = f_avg / Q_real</text>

    <!-- Картка алгоритму калібрування -->
    <rect x="0" y="215" width="245" height="185" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="15" y="238" font-size="12" font-weight="bold" fill="#166534">Порядок дій стенда</text>

    <text x="15" y="262" font-size="11" fill="#1e293b">1. Встановити кран на потік Q_i</text>
    <text x="15" y="282" font-size="11" fill="#1e293b">2. Дочекатися стабілізації струменя</text>
    <text x="15" y="302" font-size="11" fill="#1e293b">3. Наповнити еталонний об'єм V_ref</text>
    <text x="15" y="322" font-size="11" fill="#1e293b">4. Зафіксувати N_pulses та час Δt</text>
    <text x="15" y="342" font-size="11" fill="#1e293b">5. Повторити при зростанні й спаді</text>
    <text x="25" y="358" font-size="11" fill="#166534">для виключення гістерезису</text>
    <text x="15" y="380" font-size="11" fill="#0f172a">• Результат: рядок для LUT-таблиці</text>
  </g>
</svg>
