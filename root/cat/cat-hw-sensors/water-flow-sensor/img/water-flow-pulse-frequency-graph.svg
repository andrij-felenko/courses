<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title Section -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Характеристики сигналу та градуювальна залежність давача витрати води</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Частота прямокутних імпульсів пропорційна об'ємній витраті: f = K · Q</text>

  <!-- LEFT PANEL: Signal Waveform -->
  <rect x="30" y="85" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="247" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Вихідний прямокутний сигнал (NPN / Hall)</text>
  <text x="247" y="133" text-anchor="middle" font-size="12" fill="#6b7280">Осцилограма напруги u(t) при постійній витраті Q</text>

  <!-- Y-Axis -->
  <line x1="110" y1="365" x2="110" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="110" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">u(t), В</text>

  <!-- Voltage Level Guidelines -->
  <line x1="105" y1="220" x2="415" y2="220" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="102" y="224" text-anchor="end" font-size="12" fill="#6b7280">V_CC (5 В)</text>

  <line x1="105" y1="340" x2="415" y2="340" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="102" y="344" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>

  <!-- Period Marker Helpers and Line -->
  <line x1="130" y1="195" x2="130" y2="345" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="195" x2="290" y2="345" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="195" x2="290" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <text x="210" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Період T = 1 / f</text>

  <!-- Square Pulse Trace -->
  <path d="M 110 340 L 130 340 L 130 220 L 210 220 L 210 340 L 290 340 L 290 220 L 370 220 L 370 340 L 415 340" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Duty Cycle Label -->
  <text x="170" y="268" text-anchor="middle" font-size="12" fill="#6b7280">
    <tspan x="170" dy="0">Скважність</tspan>
    <tspan x="170" dy="16">≈ 50%</tspan>
  </text>

  <!-- X-Axis -->
  <line x1="100" y1="340" x2="425" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="425" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">t, с</text>

  <!-- Left Bottom Summary Card -->
  <rect x="50" y="385" width="395" height="58" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="407" text-anchor="middle" font-size="12" fill="#1a1a1a">Кожен імпульс — один оберт ротора з магнітом</text>
  <text x="247" y="427" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Частота імпульсів: f = N / t  (Гц)</text>

  <!-- RIGHT PANEL: Calibration Graph f(Q) -->
  <rect x="495" y="85" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="712" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Градуювальна характеристика f(Q)</text>
  <text x="712" y="133" text-anchor="middle" font-size="12" fill="#6b7280">Залежність частоти імпульсів від витрати води</text>

  <!-- Y-Axis -->
  <line x1="565" y1="365" x2="565" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="565" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">f, Гц</text>

  <!-- f_max Helper Line -->
  <line x1="560" y1="215" x2="825" y2="215" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="557" y="219" text-anchor="end" font-size="12" fill="#6b7280">f_max</text>

  <!-- 0 Tick -->
  <text x="557" y="344" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Operating Limits Dashed Lines -->
  <line x1="635" y1="305" x2="635" y2="345" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="635" y="362" text-anchor="middle" font-size="12" fill="#6b7280">Q_min</text>

  <line x1="825" y1="215" x2="825" y2="345" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="825" y="362" text-anchor="middle" font-size="12" fill="#6b7280">Q_max</text>

  <!-- Characteristic Line -->
  <line x1="565" y1="340" x2="860" y2="200" stroke="#2457d6" stroke-width="3" stroke-linecap="round"/>

  <!-- Formula Callout above line -->
  <text x="670" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">f = K · Q</text>
  <text x="670" y="193" text-anchor="middle" font-size="12" fill="#6b7280">де K — калібрувальний коефіцієнт (Гц / (л/хв))</text>

  <!-- Slope Triangle for K-factor -->
  <line x1="720" y1="266" x2="790" y2="266" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="790" y1="266" x2="790" y2="232" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="755" y="282" text-anchor="middle" font-size="12" fill="#6b7280">ΔQ</text>
  <text x="796" y="246" text-anchor="start" font-size="12" fill="#6b7280">Δf</text>
  <text x="830" y="253" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">K = Δf / ΔQ</text>

  <!-- X-Axis -->
  <line x1="555" y1="340" x2="890" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="362" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Q, л/хв</text>

  <!-- Right Bottom Summary Card -->
  <rect x="515" y="385" width="395" height="58" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Формули розрахунку витрати та об'єму</text>
  <text x="712" y="427" text-anchor="middle" font-size="12" fill="#1a1a1a">Q = f / K  [л/хв]   |   V = N / (K · 60)  [л]</text>
</svg>
