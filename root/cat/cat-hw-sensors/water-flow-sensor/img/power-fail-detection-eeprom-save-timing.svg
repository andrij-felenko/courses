<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White canvas background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма виявлення збою живлення та збереження в EEPROM</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Накопичувальний конденсатор утримує V_cc ≥ V_MIN протягом t_hold, забезпечуючи t_margin для t_write</text>

  <!-- Main Timing Diagram Panel -->
  <rect x="30" y="75" width="900" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Timeline Guides & Top Time Labels -->
  <!-- t_fail -->
  <line x1="260" y1="95" x2="260" y2="360" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="260" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t_fail (збій)</text>

  <!-- t_det -->
  <line x1="370" y1="95" x2="370" y2="360" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="370" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t_det (PVD)</text>

  <!-- t_done -->
  <line x1="640" y1="95" x2="640" y2="360" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="640" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">t_done (запис OK)</text>

  <!-- t_crit -->
  <line x1="760" y1="95" x2="760" y2="360" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="760" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_crit (V_MIN)</text>

  <!-- t_POR -->
  <line x1="860" y1="95" x2="860" y2="360" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="860" y="86" text-anchor="middle" font-size="12" fill="#6b7280">t_POR</text>

  <!-- TRACK 1: Voltage V_cc (y=95 to 220) -->
  <text x="160" y="118" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">Напруга V_cc</text>
  <text x="160" y="134" text-anchor="end" font-size="12" fill="#6b7280">(конденсатор C)</text>

  <!-- Voltage Level Threshold Reference Lines -->
  <!-- V_NOM = 5.0V -->
  <line x1="180" y1="108" x2="880" y2="108" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="254" y="104" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">V_NOM = 5.0 V</text>

  <!-- V_DET = 4.5V -->
  <line x1="180" y1="138" x2="880" y2="138" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="254" y="134" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_DET = 4.5 V</text>

  <!-- V_MIN = 2.7V -->
  <line x1="180" y1="180" x2="880" y2="180" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="254" y="176" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V_MIN = 2.7 V</text>

  <!-- V_POR = 1.8V -->
  <line x1="180" y1="210" x2="880" y2="210" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="254" y="206" text-anchor="end" font-size="12" fill="#6b7280">V_POR = 1.8 V</text>

  <!-- V_cc Curve Path -->
  <path d="M 180 108 L 260 108 C 300 108, 330 120, 370 138 C 450 148, 550 155, 640 162 C 680 168, 720 174, 760 180 C 800 192, 830 202, 860 210 L 890 222" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- TRACK 2: COMP / PVD Signal (y=230 to 290) -->
  <text x="160" y="248" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">Сигнал PVD / COMP</text>
  <text x="160" y="264" text-anchor="end" font-size="12" fill="#6b7280">(вхід NMI / EXTI)</text>

  <!-- PVD Waveform Path -->
  <path d="M 180 238 L 370 238 L 370 272 L 890 272" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- PVD State Annotations -->
  <text x="219" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">HIGH (норма)</text>
  <text x="505" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">LOW (Спрацювання PVD → NMI)</text>

  <!-- TRACK 3: EEPROM Write Status (y=305 to 365) -->
  <text x="160" y="338" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">Запис EEPROM</text>
  <text x="160" y="354" text-anchor="end" font-size="12" fill="#6b7280">(збереження даних)</text>

  <!-- IDLE line before and after write -->
  <line x1="180" y1="356" x2="370" y2="356" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="356" x2="890" y2="356" stroke="#1a1a1a" stroke-width="2"/>

  <!-- EEPROM Active Write Box -->
  <rect x="370" y="312" width="270" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="505" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ЦИКЛ ЗАПИСУ В EEPROM (t_write)</text>

  <!-- Margin Highlight Box -->
  <rect x="640" y="312" width="120" height="40" rx="4" fill="#27ae60" fill-opacity="0.1" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="700" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Запис успішний</text>
  <text x="700" y="344" text-anchor="middle" font-size="12" fill="#27ae60">t_margin &gt; 0</text>

  <!-- TIME INTERVAL BRACKETS & ARROWS -->
  <!-- t_hold (370 to 760) -->
  <line x1="370" y1="376" x2="760" y2="376" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="505" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_hold (Час утримання V_cc ≥ V_MIN)</text>

  <!-- t_write (370 to 640) -->
  <line x1="370" y1="398" x2="640" y2="398" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="505" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">t_write (час збереження)</text>

  <!-- t_margin (640 to 760) -->
  <line x1="640" y1="398" x2="760" y2="398" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="700" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">t_margin &gt; 0</text>

  <!-- Bottom Time Axis -->
  <line x1="175" y1="412" x2="880" y2="412" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="888" y="416" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">t (час)</text>

  <!-- Bottom Summary Panel -->
  <rect x="30" y="432" width="900" height="108" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Card 1: Reliability Condition -->
  <rect x="45" y="442" width="275" height="88" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="182.5" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1. Умова надійності</text>
  <text x="182.5" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">t_hold = t_write + t_margin</text>
  <text x="182.5" y="508" text-anchor="middle" font-size="12" fill="#6b7280">Обов'язково: t_margin &gt; 0</text>

  <!-- Card 2: Bulk Capacitance Calculation -->
  <rect x="342" y="442" width="275" height="88" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="479.5" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">2. Накопичувальна ємність C</text>
  <text x="479.5" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">C ≥ (I_max · t_write) / ΔV</text>
  <text x="479.5" y="508" text-anchor="middle" font-size="12" fill="#6b7280">де ΔV = V_DET - V_MIN</text>

  <!-- Card 3: Diode Protection -->
  <rect x="640" y="442" width="275" height="88" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="777.5" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">3. Схемотехнічна ізоляція</text>
  <text x="777.5" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Діод Шотткі перед C_hold</text>
  <text x="777.5" y="508" text-anchor="middle" font-size="12" fill="#6b7280">Блокує розряд у вхідну мережу</text>
</svg>
