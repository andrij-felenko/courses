<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Заголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">Кусково-лінійна інтерполяція K-фактора за таблицею калібрування (LUT)</text>
  <text x="480" y="56" font-size="13" fill="#64748b" text-anchor="middle">Відновлення нелінійного коефіцієнта K(f) між дискретними експериментальними точками</text>

  <!-- Осі графіка -->
  <line x1="120" y1="410" x2="120" y2="85" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-black)"/>
  <line x1="115" y1="410" x2="650" y2="410" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Підписи осей -->
  <text x="120" y="75" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">K-фактор (імп/л)</text>
  <text x="645" y="442" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">Частота імпульсів f (Гц)</text>

  <!-- Сітка графіка -->
  <line x1="120" y1="350" x2="630" y2="350" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="280" x2="630" y2="280" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="210" x2="630" y2="210" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="140" x2="630" y2="140" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Реальна плавна крива (напівпрозора) -->
  <path d="M 150,370 C 190,360 230,270 280,215 C 360,205 450,208 520,215 C 570,225 600,260 620,295" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Відрізки кусково-лінійної апроксимації -->
  <line x1="150" y1="370" x2="230" y2="310" stroke="#2563eb" stroke-width="3"/>
  <line x1="230" y1="310" x2="330" y2="215" stroke="#2563eb" stroke-width="3"/>
  <line x1="330" y1="215" x2="440" y2="210" stroke="#2563eb" stroke-width="3"/>
  <line x1="440" y1="210" x2="540" y2="225" stroke="#2563eb" stroke-width="3"/>
  <line x1="540" y1="225" x2="620" y2="295" stroke="#2563eb" stroke-width="3"/>

  <!-- Опорні вузли LUT -->
  <circle cx="150" cy="370" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="230" cy="310" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="330" cy="215" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="440" cy="210" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="540" cy="225" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="620" cy="295" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Підписи вузлів -->
  <text x="150" y="392" font-size="11" fill="#475569" text-anchor="middle">(f₀, K₀)</text>
  <text x="220" y="300" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="end">(f_i, K_i)</text>
  <text x="345" y="208" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="start">(f_i+1, K_i+1)</text>
  <text x="440" y="200" font-size="11" fill="#475569" text-anchor="middle">(f₃, K₃)</text>
  <text x="540" y="215" font-size="11" fill="#475569" text-anchor="start">(f₄, K₄)</text>

  <!-- Деталізація інтерполяції на інтервалі [f_i, f_i+1] -->
  <!-- Підсвічування інтервалу -->
  <rect x="230" y="215" width="100" height="195" fill="#eff6ff" fill-opacity="0.5"/>

  <!-- Проекції меж f_i та f_i+1 на вісь X -->
  <line x1="230" y1="310" x2="230" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="230" y="426" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">f_i</text>

  <line x1="330" y1="215" x2="330" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="426" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">f_i+1</text>

  <!-- Точка вимірювання f -->
  <!-- Координати точки: x = 280 (половина між 230 і 330), y = 310 + 0.5 * (215 - 310) = 262.5 -->
  <line x1="280" y1="262" x2="280" y2="410" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="120" y1="262" x2="280" y2="262" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Маркер інтерпольованої точки -->
  <circle cx="280" cy="262" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>

  <!-- Підпис значень f та K(f) -->
  <text x="280" y="426" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">f (поточна)</text>
  <text x="110" y="266" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="end">K(f)</text>

  <!-- Стрілки відрізків Δf та ΔK -->
  <line x1="230" y1="390" x2="280" y2="390" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="255" y="384" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Δf</text>

  <line x1="215" y1="310" x2="215" y2="215" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="205" y="265" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="end">ΔK</text>

  <!-- Права частина: математичні формули та таблиця -->
  <rect x="670" y="90" width="270" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="685" y="115" font-size="13" font-weight="bold" fill="#0f172a">Алгоритм обчислення</text>

  <text x="685" y="140" font-size="11" fill="#475569">1. Пошук інтервалу в таблиці:</text>
  <text x="700" y="156" font-size="11" font-family="monospace" fill="#1e40af">f_i ≤ f &lt; f_i+1</text>

  <text x="685" y="180" font-size="11" fill="#475569">2. Відносний ваговий коефіцієнт:</text>
  <text x="700" y="196" font-size="11" font-family="monospace" fill="#16a34a">W = (f - f_i) / (f_i+1 - f_i)</text>

  <text x="685" y="220" font-size="11" fill="#475569">3. Лінійна інтерполяція K(f):</text>
  <text x="700" y="236" font-size="11" font-family="monospace" fill="#2563eb">K(f) = K_i + W · (K_i+1 - K_i)</text>

  <text x="685" y="260" font-size="11" fill="#475569">4. Точна миттєва витрата:</text>
  <text x="700" y="278" font-size="12" font-family="monospace" font-weight="bold" fill="#0f172a">Q = f / K(f)   [л/хв]</text>

  <!-- Структура даних у пам'яті MCU -->
  <rect x="670" y="315" width="270" height="155" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="685" y="338" font-size="12" font-weight="bold" fill="#166534">Таблиця калібрування (LUT у Flash)</text>

  <!-- Таблиця точок -->
  <rect x="685" y="350" width="240" height="24" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="740" y="366" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Частота f (Гц)</text>
  <text x="860" y="366" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">K-фактор (імп/л)</text>

  <rect x="685" y="374" width="240" height="20" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="740" y="388" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">f0 = 8.5 Гц</text>
  <text x="860" y="388" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">K0 = 360 імп/л</text>

  <rect x="685" y="394" width="240" height="20" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="740" y="408" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">f1 = 22.0 Гц</text>
  <text x="860" y="408" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">K1 = 415 імп/л</text>

  <rect x="685" y="414" width="240" height="20" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="740" y="428" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">f2 = 45.0 Гц</text>
  <text x="860" y="428" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">K2 = 450 імп/л</text>

  <rect x="685" y="434" width="240" height="20" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="740" y="448" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">f3 = 120.0 Гц</text>
  <text x="860" y="448" font-size="10" font-family="monospace" fill="#1e293b" text-anchor="middle">K3 = 445 імп/л</text>

  <!-- Нижня легенда -->
  <rect x="120" y="460" width="510" height="35" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="135" y1="477" x2="165" y2="477" stroke="#2563eb" stroke-width="3"/>
  <circle cx="150" cy="477" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="481" font-size="11" fill="#0f172a">Опорні калібрувальні вузли</text>

  <circle cx="340" cy="477" r="5" fill="#16a34a"/>
  <text x="352" y="481" font-size="11" font-weight="bold" fill="#16a34a">Розрахована робоча точка K(f)</text>
</svg>
