<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристика нелінійності K-фактора давача витрати води</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">При низьких і високих витратах Q K-фактор відхиляється від номінального K_nom</text>

  <!-- Zone Background Shading -->
  <!-- Zone 1: Low Flow (Viscous Friction) -->
  <rect x="140" y="110" width="120" height="320" fill="#fdecea" fill-opacity="0.4" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.3"/>
  <!-- Zone 2: Linear Working Range -->
  <rect x="260" y="110" width="280" height="320" fill="#e9f7ef" fill-opacity="0.4" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.3"/>
  <!-- Zone 3: High Flow (Turbulence) -->
  <rect x="540" y="110" width="130" height="320" fill="#fdecea" fill-opacity="0.4" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.3"/>

  <!-- Nominal K-factor Band (±3% Error Band in Zone 2) -->
  <rect x="260" y="248" width="280" height="24" fill="#27ae60" fill-opacity="0.15"/>
  <line x1="260" y1="248" x2="540" y2="248" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="260" y1="272" x2="540" y2="272" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Zone Headers -->
  <text x="200" y="130" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона 1</text>
  <text x="200" y="146" font-size="12" fill="#c0392b" text-anchor="middle">В'язке терття</text>

  <text x="400" y="130" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона 2: Лінійний робочий діапазон</text>
  <text x="400" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Постійний K ≈ K_nom (похибка ±3%)</text>

  <text x="605" y="130" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона 3</text>
  <text x="605" y="146" font-size="12" fill="#c0392b" text-anchor="middle">Турбулентність</text>

  <!-- Nominal Reference Line (K_nom) across whole chart -->
  <line x1="140" y1="260" x2="670" y2="260" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Graph Grid Lines -->
  <line x1="140" y1="160" x2="670" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="140" y1="400" x2="670" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- Graph Axes -->
  <line x1="140" y1="435" x2="140" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <line x1="135" y1="430" x2="675" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Axis Labels -->
  <text x="140" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">K (імп/л)</text>
  <text x="670" y="472" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Витрата Q (л/хв)</text>

  <!-- Y Ticks and Labels -->
  <line x1="135" y1="160" x2="140" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="130" y="164" font-size="12" fill="#6b7280" text-anchor="end">1.1·K_nom</text>

  <line x1="135" y1="260" x2="140" y2="260" stroke="#27ae60" stroke-width="2"/>
  <text x="130" y="264" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">K_nom</text>

  <line x1="135" y1="400" x2="140" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="130" y="404" font-size="12" fill="#6b7280" text-anchor="end">0.7·K_nom</text>

  <!-- X Ticks and Labels -->
  <line x1="140" y1="430" x2="140" y2="435" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="452" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="260" y1="430" x2="260" y2="435" stroke="#c0392b" stroke-width="2"/>
  <text x="260" y="452" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Q_min</text>

  <line x1="400" y1="430" x2="400" y2="435" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q_ном</text>

  <line x1="540" y1="430" x2="540" y2="435" stroke="#c0392b" stroke-width="2"/>
  <text x="540" y="452" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Q_max</text>

  <!-- Compensated / Interpolated Curve (Piecewise linear / Polynomial) -->
  <path d="M 150,390 L 200,340 L 260,256 L 400,256 L 540,260 L 600,310 L 650,365" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Actual Real K-factor Curve (Blue solid curve) -->
  <path d="M 150,390 C 180,385 220,310 260,256 C 330,250 470,250 540,260 C 590,270 630,320 650,365" fill="none" stroke="#2457d6" stroke-width="3.5"/>

  <!-- Calibration Points (LUT / polynomial nodes) -->
  <circle cx="150" cy="390" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="200" cy="340" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="260" cy="256" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="400" cy="256" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="540" cy="260" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="600" cy="310" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="650" cy="365" r="4" fill="white" stroke="#27ae60" stroke-width="2"/>

  <!-- In-Graph Callouts & Annotations -->
  <text x="200" y="185" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Відхилення до -30%</text>
  <text x="200" y="200" font-size="12" fill="#c0392b" text-anchor="middle">(Недоулік об'єму)</text>
  <line x1="200" y1="208" x2="200" y2="320" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <text x="400" y="185" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Номінальний K_nom = 450 імп/л</text>
  <text x="400" y="200" font-size="12" fill="#2457d6" text-anchor="middle">— Реальна крива K(Q)</text>
  <line x1="400" y1="208" x2="400" y2="238" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="605" y="185" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Спад K(Q)</text>
  <text x="605" y="200" font-size="12" fill="#c0392b" text-anchor="middle">через опір</text>
  <line x1="605" y1="208" x2="615" y2="295" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Graph Bottom Legend -->
  <rect x="140" y="485" width="530" height="44" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>

  <line x1="155" y1="507" x2="185" y2="507" stroke="#2457d6" stroke-width="3.5"/>
  <text x="192" y="511" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Реальна крива K(Q)</text>

  <line x1="335" y1="507" x2="365" y2="507" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="372" y="511" font-size="12" fill="#1a1a1a" text-anchor="start">Номінал K_nom</text>

  <line x1="485" y1="507" x2="509" y2="507" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="497" cy="507" r="3.5" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="517" y="511" font-size="12" fill="#1a1a1a" text-anchor="start">Точки LUT / корекція</text>

  <!-- Right Side Explanation Cards -->
  <!-- Card 1: Math Model -->
  <rect x="700" y="110" width="230" height="105" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="715" y="132" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Математичні формули</text>
  <text x="715" y="156" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Q(t) = f(t) / K(Q)</text>
  <text x="715" y="178" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">V = ∑ (f_i / K_i) · Δt</text>
  <text x="715" y="198" font-size="12" fill="#6b7280" text-anchor="start">f — частота імпульсів (Гц)</text>

  <!-- Card 2: Causes of Non-linearity -->
  <rect x="700" y="230" width="230" height="115" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.4"/>
  <text x="715" y="252" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Фізичні причини помилок</text>
  <text x="715" y="275" font-size="12" fill="#1a1a1a" text-anchor="start">• Низькі Q: в'язкісне</text>
  <text x="730" y="291" font-size="12" fill="#6b7280" text-anchor="start">проковзування та тертя</text>
  <text x="715" y="311" font-size="12" fill="#1a1a1a" text-anchor="start">• Високі Q: турбулентність</text>
  <text x="730" y="327" font-size="12" fill="#6b7280" text-anchor="start">та гідравлічний опір</text>

  <!-- Card 3: Correction Methods -->
  <rect x="700" y="360" width="230" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-opacity="0.4"/>
  <text x="715" y="382" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Методи корекції в МК</text>
  <text x="715" y="405" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">1. Таблиця пошуку (LUT):</text>
  <text x="730" y="421" font-size="12" fill="#6b7280" text-anchor="start">Кусково-лінійна апроксимація</text>
  <text x="715" y="443" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Поліном K(f):</text>
  <text x="730" y="459" font-size="12" fill="#27ae60" text-anchor="start">K(f) = a_0 + a_1·f + a_2·f²</text>
  <text x="730" y="475" font-size="12" fill="#6b7280" text-anchor="start">Калібрування по 3-5 точках</text>
</svg>
