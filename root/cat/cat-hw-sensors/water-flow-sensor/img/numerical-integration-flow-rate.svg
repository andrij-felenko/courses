<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Числове інтегрування витрати води методом трапецій</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Геометричний зміст: сума площ трапецій на інтервалах Δt дорівнює об'єму V</text>

  <rect x="680" y="85" width="255" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="807" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Математична модель</text>
  <line x1="695" y1="120" x2="920" y2="120" stroke="#d0d7de" stroke-width="1"/>

  <text x="700" y="138" font-size="12" font-weight="bold" fill="#1a1a1a">1. Розрахунок витрати Q(t):</text>
  <text x="715" y="156" font-size="13" fill="#2457d6" font-weight="bold">Qᵢ = fᵢ / K</text>
  <text x="715" y="174" font-size="12" fill="#6b7280">fᵢ — частота імпульсів (Гц)</text>
  <text x="715" y="190" font-size="12" fill="#6b7280">K — калібрувальний фактор</text>

  <text x="700" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">2. Площа трапеції (Aᵢ):</text>
  <text x="715" y="234" font-size="13" fill="#2457d6" font-weight="bold">Aᵢ = ½ · (Qᵢ₋₁ + Qᵢ) · Δt</text>

  <text x="700" y="260" font-size="12" font-weight="bold" fill="#1a1a1a">3. Накопичений об'єм (V):</text>
  <text x="715" y="280" font-size="13" fill="#27ae60" font-weight="bold">V = ∑ Aᵢ ≈ ∫ Q(t) dt</text>

  <line x1="695" y1="295" x2="920" y2="295" stroke="#d0d7de" stroke-width="1"/>

  <line x1="700" y1="312" x2="725" y2="312" stroke="#2457d6" stroke-width="2.5"/>
  <text x="735" y="316" font-size="12" fill="#1a1a1a">Q(t) — реальна витрата</text>

  <rect x="700" y="330" width="25" height="14" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="735" y="342" font-size="12" fill="#1a1a1a">Aᵢ — елементарний об'єм</text>

  <rect x="700" y="356" width="25" height="14" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="735" y="368" font-size="12" fill="#1a1a1a">Похибка апроксимації</text>

  <text x="700" y="394" font-size="12" fill="#6b7280">Δt — крок дискретизації</text>

  <line x1="80" y1="280" x2="600" y2="280" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="210" x2="600" y2="210" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="140" x2="600" y2="140" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <line x1="75" y1="280" x2="80" y2="280" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="284" font-size="12" fill="#6b7280" text-anchor="end">3.0</text>

  <line x1="75" y1="210" x2="80" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="214" font-size="12" fill="#6b7280" text-anchor="end">6.0</text>

  <line x1="75" y1="140" x2="80" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="144" font-size="12" fill="#6b7280" text-anchor="end">9.0</text>

  <path d="M 290,115 Q 332.5,90 375,150 L 290,115 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>

  <polygon points="120,350 120,260 205,175 205,350" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="205,350 205,175 290,115 290,350" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="290,350 290,115 375,150 375,350" fill="#d2e0fb" stroke="#2457d6" stroke-width="2"/>
  <polygon points="375,350 375,150 460,220 460,350" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="460,350 460,220 545,290 545,350" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="120" y1="260" x2="120" y2="350" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="205" y1="175" x2="205" y2="350" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="290" y1="115" x2="290" y2="350" stroke="#2457d6" stroke-width="2"/>
  <line x1="375" y1="150" x2="375" y2="350" stroke="#2457d6" stroke-width="2"/>
  <line x1="460" y1="220" x2="460" y2="350" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="545" y1="290" x2="545" y2="350" stroke="#2457d6" stroke-width="1.5"/>

  <path d="M 95,310 C 105,290 110,275 120,260 C 150,215 175,190 205,175 C 240,155 265,100 290,115 Q 332.5,90 375,150 C 410,200 435,205 460,220 C 495,240 520,270 545,290 C 560,302 570,312 585,320" fill="none" stroke="#2457d6" stroke-width="3"/>

  <circle cx="120" cy="260" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="205" cy="175" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="290" cy="115" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="375" cy="150" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="460" cy="220" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="545" cy="290" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>

  <line x1="80" y1="350" x2="80" y2="92" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="80" y="76" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Витрата Q [л/хв]</text>

  <line x1="80" y1="350" x2="600" y2="350" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="540" y="388" font-size="13" font-weight="bold" fill="#1a1a1a">Час t [c]</text>

  <line x1="120" y1="350" x2="120" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">t₀</text>

  <line x1="205" y1="350" x2="205" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="205" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">t₁</text>

  <line x1="290" y1="350" x2="290" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="290" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">t₂</text>

  <line x1="375" y1="350" x2="375" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="375" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">t₃</text>

  <line x1="460" y1="350" x2="460" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">t₄</text>

  <line x1="545" y1="350" x2="545" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="545" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">t₅</text>

  <text x="120" y="244" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q₀</text>
  <text x="205" y="158" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q₁</text>
  <text x="290" y="98" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q₂</text>
  <text x="375" y="133" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q₃</text>
  <text x="460" y="203" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q₄</text>
  <text x="545" y="273" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q₅</text>

  <text x="332" y="228" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">A₃</text>
  <text x="332" y="246" font-size="12" fill="#2457d6" text-anchor="middle">площа A₃</text>

  <line x1="290" y1="396" x2="375" y2="396" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <line x1="290" y1="388" x2="290" y2="402" stroke="#2457d6" stroke-width="1"/>
  <line x1="375" y1="388" x2="375" y2="402" stroke="#2457d6" stroke-width="1"/>
  <text x="332" y="418" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δt (інтервал вимірювання)</text>

  <path d="M 165,130 Q 155,160 145,210" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <text x="115" y="128" font-size="12" font-weight="bold" fill="#2457d6">Неперервний потік Q(t)</text>

  <path d="M 235,90 Q 270,85 315,97" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
  <text x="230" y="90" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Похибка апроксимації</text>
</svg>
