<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема інтерфейсу давача витрати води з RC-фільтром</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Підтяжка R1, апаратний RC-фільтр R2-C1 та діод VD1 для захисту входу EXTI</text>

  <!-- PANEL 1: Water Flow Sensor -->
  <rect x="24" y="68" width="230" height="372" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="139" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач витрати (G1/2″)</text>

  <!-- Sensor Internal Block -->
  <rect x="34" y="105" width="210" height="145" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="139" y="123" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Турбіна + давач Холла</text>

  <!-- Turbine Graphic -->
  <circle cx="100" cy="165" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Turbine blades -->
  <line x1="100" y1="147" x2="100" y2="183" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="82" y1="165" x2="118" y2="165" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Flow Arrow -->
  <path d="M42,165 L76,165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="59" y="155" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Потік Q</text>

  <!-- Transistor / Output Text -->
  <text x="139" y="212" font-size="12" fill="#1a1a1a" text-anchor="middle">Вихід: NPN транзистор</text>
  <text x="139" y="228" font-size="12" fill="#6b7280" text-anchor="middle">(відкритий колектор)</text>

  <!-- Pin Labels Sensor -->
  <text x="238" y="115" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="end">VCC</text>
  <text x="238" y="185" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">OUT</text>
  <text x="238" y="237" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="end">GND</text>

  <!-- Oscillogram 1: Sensor Signal with noise -->
  <rect x="34" y="262" width="210" height="164" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="139" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Сигнал на виході OUT</text>
  <text x="139" y="296" font-size="12" fill="#c0392b" text-anchor="middle">Імпульси з ВЧ-дребезгом</text>

  <!-- Noisy Waveform -->
  <path d="M45,365 L65,365 L66,325 L68,338 L70,320 L72,332 L74,322 L75,330 L105,330 L106,370 L108,357 L110,373 L112,361 L115,365 L145,365 L146,325 L148,338 L150,320 L152,332 L154,322 L155,330 L185,330 L186,370 L188,357 L190,373 L192,361 L195,365 L225,365" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="139" y="412" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Ризик помилкових EXTI</text>


  <!-- PANEL 2: Interface & Filter Circuit -->
  <rect x="270" y="68" width="420" height="372" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коло узгодження та фільтрації</text>

  <!-- Power Rail (+3.3V) -->
  <line x1="280" y1="120" x2="680" y2="120" stroke="#c0392b" stroke-width="2"/>
  <text x="285" y="112" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+3.3V (Живлення MCU)</text>

  <!-- Ground Rail (GND) -->
  <line x1="280" y1="260" x2="680" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <text x="285" y="276" font-size="12" fill="#6b7280" text-anchor="start">GND (Земля)</text>

  <!-- Ground Symbols -->
  <path d="M315,260 L315,268 M307,268 L323,268 M310,272 L320,272 M313,276 L317,276" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M525,260 L525,268 M517,268 L533,268 M520,272 L530,272 M523,276 L527,276" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Connections from Sensor Panel to Panel 2 -->
  <!-- VCC Wire -->
  <line x1="244" y1="120" x2="280" y2="120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- OUT Wire -->
  <line x1="244" y1="190" x2="270" y2="190" stroke="#2457d6" stroke-width="2.5"/>
  <!-- GND Wire -->
  <line x1="244" y1="260" x2="280" y2="260" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Main Signal Bus through Panel 2 -->
  <line x1="270" y1="190" x2="435" y2="190" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="485" y1="190" x2="706" y2="190" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Node 1: Pull-up Branch (x=315) -->
  <circle cx="315" cy="190" r="3.5" fill="#2457d6"/>
  <line x1="315" y1="120" x2="315" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="306" y="140" width="18" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="315" y1="170" x2="315" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R1 Labels -->
  <text x="328" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R1 = 4.7 кОм</text>
  <text x="328" y="166" font-size="12" fill="#6b7280" text-anchor="start">(Підтяжка)</text>

  <!-- Component R2: Series Resistor (x=435 to x=485) -->
  <rect x="435" y="181" width="50" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <!-- R2 Labels -->
  <text x="460" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R2 = 1 кОм</text>
  <text x="460" y="144" font-size="12" fill="#6b7280" text-anchor="middle">(Обмеження)</text>

  <!-- Node 2: Capacitor C1 Branch (x=525) -->
  <circle cx="525" cy="190" r="3.5" fill="#2457d6"/>
  <line x1="525" y1="190" x2="525" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C1 Capacitor Plates -->
  <line x1="510" y1="218" x2="540" y2="218" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="510" y1="224" x2="540" y2="224" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="525" y1="224" x2="525" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- C1 Labels -->
  <text x="502" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1 = 10 нФ</text>
  <text x="502" y="234" font-size="12" fill="#6b7280" text-anchor="end">(Фільтр ВЧ)</text>

  <!-- Node 3: Protective Diode VD1 Branch (x=575) -->
  <circle cx="575" cy="190" r="3.5" fill="#2457d6"/>
  <line x1="575" y1="190" x2="575" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- VD1 Diode Symbol (pointing up) -->
  <polygon points="567,175 583,175 575,157" fill="#1a1a1a"/>
  <!-- Cathode bar with Schottky hooks -->
  <line x1="565" y1="157" x2="585" y2="157" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="565" y1="157" x2="565" y2="161" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="585" y1="157" x2="585" y2="153" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="575" y1="157" x2="575" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- VD1 Labels -->
  <text x="590" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">VD1 (BAT54)</text>
  <text x="590" y="166" font-size="12" fill="#6b7280" text-anchor="start">(Захист EXTI)</text>

  <!-- Oscillogram 2: Clean Signal after RC filter -->
  <rect x="284" y="295" width="392" height="130" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="480" y="313" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сигнал після RC-фільтра (на вході EXTI)</text>
  <text x="480" y="329" font-size="12" fill="#1a1a1a" text-anchor="middle">Згладжені фронти, без завад (τ = R2·C1 = 10 мкс)</text>

  <!-- Clean Waveform with soft RC exponential edges -->
  <path d="M305,375 L345,375 C348,365 350,340 355,340 L435,340 C438,350 440,375 445,375 L525,375 C528,365 530,340 535,340 L605,340 C608,350 610,375 615,375 L655,375" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="412" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Стабільне переривання EXTI</text>


  <!-- PANEL 3: Microcontroller (MCU) -->
  <rect x="706" y="68" width="230" height="372" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="821" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- MCU Outer Pin Frame -->
  <rect x="716" y="105" width="210" height="321" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- EXTI Input Terminal Pin -->
  <circle cx="706" cy="190" r="4" fill="#2457d6"/>
  <text x="821" y="123" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід GPIO / EXTI</text>

  <!-- Block 1: Schmitt Trigger -->
  <rect x="726" y="135" width="190" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="821" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тригер Шмітта</text>
  <text x="821" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Порогове формування</text>
  <text x="821" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Гістерезис VIH / VIL</text>

  <!-- Arrow down to ISR -->
  <line x1="821" y1="210" x2="821" y2="226" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Block 2: Interrupt Handler (EXTI ISR) -->
  <rect x="726" y="228" width="190" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="821" y="247" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обробник EXTI (ISR)</text>
  <text x="821" y="267" font-size="12" fill="#6b7280" text-anchor="middle">Фіксація часу tk</text>
  <text x="821" y="287" font-size="12" fill="#6b7280" text-anchor="middle">Частота f = 1 / Δt</text>

  <!-- Arrow down to Calculation -->
  <line x1="821" y1="318" x2="821" y2="332" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Block 3: Flow Rate & Volume Calculation -->
  <rect x="726" y="334" width="190" height="82" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="821" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Витрата Q = f / K</text>
  <text x="821" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Об'єм V = ∑ N / K</text>
  <text x="821" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Збереження в EEPROM</text>
</svg>
