<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .track-border { stroke: #475569; stroke-width: 1.5; fill: none; }
      .sector-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 2,2; }
      .dark-sec { fill: #334155; }
      .light-sec { fill: #0f172a; }
      .trans-mark { stroke: #f43f5e; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="880" height="520" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Геометрія кодових доріжок 4-бітового оптичного диска коду Ґрея</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">16 кутових секторів з одиничною відстанню Геммінга: на кожній межі змінюється стан лише однієї доріжки</text>

  <!-- Left: Concentric Tracks Schematic (Diagram) -->
  <g transform="translate(260, 280)">
    <!-- 4 Concentric Track Rings: r = 50, 90, 130, 170, 210 -->
    <circle cx="0" cy="0" r="210" class="track-border" />
    <circle cx="0" cy="0" r="170" class="track-border" />
    <circle cx="0" cy="0" r="130" class="track-border" />
    <circle cx="0" cy="0" r="90" class="track-border" />
    <circle cx="0" cy="0" r="50" class="track-border" fill="#1e293b" />

    <!-- Center shaft hole -->
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" class="subtitle">Вал</text>

    <!-- Radial Sector boundary lines (16 sectors, every 22.5 deg) -->
    <!-- Draw 16 spoke lines -->
    <line x1="0" y1="-50" x2="0" y2="-210" class="sector-line" />
    <line x1="0" y1="50" x2="0" y2="210" class="sector-line" />
    <line x1="-50" y1="0" x2="-210" y2="0" class="sector-line" />
    <line x1="50" y1="0" x2="210" y2="0" class="sector-line" />

    <!-- Angled spokes: 22.5, 45, 67.5, etc. -->
    <line x1="35" y1="35" x2="148" y2="148" class="sector-line" />
    <line x1="-35" y1="35" x2="-148" y2="148" class="sector-line" />
    <line x1="35" y1="-35" x2="148" y2="-148" class="sector-line" />
    <line x1="-35" y1="-35" x2="-148" y2="-148" class="sector-line" />

    <!-- Sector Numbers & Sample Codes at outer ring -->
    <text x="0" y="-220" text-anchor="middle" class="lbl-bold" fill="#38bdf8">0: 0000</text>
    <text x="85" y="-205" text-anchor="middle" class="lbl" fill="#cbd5e1">1: 0001</text>
    <text x="155" y="-155" text-anchor="middle" class="lbl" fill="#cbd5e1">2: 0011</text>
    <text x="205" y="-85" text-anchor="middle" class="lbl" fill="#cbd5e1">3: 0010</text>
    <text x="225" y="5" text-anchor="middle" class="lbl-bold" fill="#fbbf24">4: 0110</text>
    <text x="205" y="90" text-anchor="middle" class="lbl" fill="#cbd5e1">5: 0111</text>
    <text x="155" y="160" text-anchor="middle" class="lbl" fill="#cbd5e1">6: 0101</text>
    <text x="85" y="210" text-anchor="middle" class="lbl" fill="#cbd5e1">7: 0100</text>
    <text x="0" y="230" text-anchor="middle" class="lbl-bold" fill="#38bdf8">8: 1100</text>
    <text x="-85" y="210" text-anchor="middle" class="lbl" fill="#cbd5e1">9: 1101</text>
    <text x="-155" y="160" text-anchor="middle" class="lbl" fill="#cbd5e1">10: 1111</text>
    <text x="-205" y="90" text-anchor="middle" class="lbl" fill="#cbd5e1">11: 1110</text>
    <text x="-225" y="5" text-anchor="middle" class="lbl-bold" fill="#fbbf24">12: 1010</text>
    <text x="-205" y="-85" text-anchor="middle" class="lbl" fill="#cbd5e1">13: 1011</text>
    <text x="-155" y="-155" text-anchor="middle" class="lbl" fill="#cbd5e1">14: 1001</text>
    <text x="-85" y="-205" text-anchor="middle" class="lbl" fill="#cbd5e1">15: 1000</text>

    <!-- Highlight one single transition with red marker -->
    <line x1="20" y1="-170" x2="20" y2="-130" class="trans-mark" />
    <text x="45" y="-145" class="lbl-bold" fill="#f43f5e">Зміна 1 біта!</text>
  </g>

  <!-- Right: Code Table & Structural Rules -->
  <rect x="550" y="75" width="300" height="420" class="panel" />
  <text x="570" y="100" class="lbl-bold" fill="#38bdf8">Таблиця 4-бітового коду Ґрея:</text>

  <g transform="translate(570, 115)">
    <text x="0" y="20" class="lbl-bold" fill="#94a3b8">Двійковий</text>
    <text x="100" y="20" class="lbl-bold" fill="#38bdf8">Код Ґрея</text>
    <text x="190" y="20" class="lbl-bold" fill="#fbbf24">Зміна біта</text>

    <text x="0" y="42" class="lbl">0 : 0000</text><text x="100" y="42" class="lbl-bold">0000</text><text x="190" y="42" class="subtitle">старт</text>
    <text x="0" y="62" class="lbl">1 : 0001</text><text x="100" y="62" class="lbl-bold">0001</text><text x="190" y="62" class="subtitle">біт 0 (0→1)</text>
    <text x="0" y="82" class="lbl">2 : 0010</text><text x="100" y="82" class="lbl-bold">0011</text><text x="190" y="82" class="subtitle">біт 1 (0→1)</text>
    <text x="0" y="102" class="lbl">3 : 0011</text><text x="100" y="102" class="lbl-bold">0010</text><text x="190" y="102" class="subtitle">біт 0 (1→0)</text>
    <text x="0" y="122" class="lbl">4 : 0100</text><text x="100" y="122" class="lbl-bold">0110</text><text x="190" y="122" class="subtitle">біт 2 (0→1)</text>
    <text x="0" y="142" class="lbl">5 : 0101</text><text x="100" y="142" class="lbl-bold">0111</text><text x="190" y="142" class="subtitle">біт 0 (0→1)</text>
    <text x="0" y="162" class="lbl">6 : 0110</text><text x="100" y="162" class="lbl-bold">0101</text><text x="190" y="162" class="subtitle">біт 1 (1→0)</text>
    <text x="0" y="182" class="lbl">7 : 0111</text><text x="100" y="182" class="lbl-bold">0100</text><text x="190" y="182" class="subtitle">біт 0 (1→0)</text>
    <text x="0" y="202" class="lbl">8 : 1000</text><text x="100" y="202" class="lbl-bold">1100</text><text x="190" y="202" class="subtitle">біт 3 (0→1)</text>
    <text x="0" y="222" class="lbl">9 : 1001</text><text x="100" y="222" class="lbl-bold">1101</text><text x="190" y="222" class="subtitle">біт 0 (0→1)</text>
    <text x="0" y="242" class="lbl">10: 1010</text><text x="100" y="242" class="lbl-bold">1111</text><text x="190" y="242" class="subtitle">біт 1 (0→1)</text>
    <text x="0" y="262" class="lbl">11: 1011</text><text x="100" y="262" class="lbl-bold">1110</text><text x="190" y="262" class="subtitle">біт 0 (1→0)</text>
    <text x="0" y="282" class="lbl">12: 1100</text><text x="100" y="282" class="lbl-bold">1010</text><text x="190" y="282" class="subtitle">біт 2 (1→0)</text>
    <text x="0" y="302" class="lbl">13: 1101</text><text x="100" y="302" class="lbl-bold">1011</text><text x="190" y="302" class="subtitle">біт 0 (0→1)</text>
    <text x="0" y="322" class="lbl">14: 1110</text><text x="100" y="322" class="lbl-bold">1001</text><text x="190" y="322" class="subtitle">біт 1 (1→0)</text>
    <text x="0" y="342" class="lbl">15: 1111</text><text x="100" y="342" class="lbl-bold">1000</text><text x="190" y="342" class="subtitle">біт 0 (1→0)</text>

    <!-- Wrap around to 0: 1000 -> 0000: only bit 3 changes (1->0) -->
    <text x="0" y="365" class="lbl-bold" fill="#10b981">15 → 0 (коло):</text>
    <text x="100" y="365" class="lbl-bold" fill="#10b981">1000 → 0000</text>
    <text x="190" y="365" class="lbl-bold" fill="#10b981">біт 3 (1→0)</text>
  </g>
</svg>