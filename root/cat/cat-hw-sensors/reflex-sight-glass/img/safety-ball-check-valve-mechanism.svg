<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Запобіжний клапан аварійного відсікання з кулькою (Ball Check Valve)
  </text>

  <!-- Стан 1: Штатна робота -->
  <g transform="translate(60, 95)">
    <rect width="340" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="170" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#3fb950">
      1. Нормальна експлуатація
    </text>
    <text x="170" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">
      Тиск урівноважений (ΔP ≈ 0)
    </text>

    <!-- Корпус клапана -->
    <path d="M 60,120 L 140,120 L 180,90 L 260,90 L 260,170 L 180,170 L 140,220 L 60,220 Z" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <!-- Сідло клапана -->
    <rect x="210" y="90" width="8" height="25" fill="#f85149"/>
    <rect x="210" y="145" width="8" height="25" fill="#f85149"/>

    <!-- Сталева кулька лежить у кишені під дією сили тяжіння -->
    <circle cx="160" cy="180" r="18" fill="#a5d6ff" stroke="#388bfd" stroke-width="2"/>

    <!-- Повільний потік теплоносія вільно проходить -->
    <path d="M 70,160 Q 150,130 250,130" fill="none" stroke="#3fb950" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="250,130 240,125 240,135" fill="#3fb950"/>

    <text x="170" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c9d1d9">
      Кулька спирається на тримач.
    </text>
    <text x="170" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">
      Прохід для пари та води вільний
    </text>
  </g>

  <!-- Стан 2: Аварійне руйнування скла -->
  <g transform="translate(450, 95)">
    <rect width="340" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="170" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f85149">
      2. Аварійний розрив скла
    </text>
    <text x="170" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">
      Стрімкий перепад тиску (ΔP &gt;&gt; 0)
    </text>

    <!-- Корпус клапана -->
    <path d="M 60,120 L 140,120 L 180,90 L 260,90 L 260,170 L 180,170 L 140,220 L 60,220 Z" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <!-- Сідло клапана -->
    <rect x="210" y="90" width="8" height="25" fill="#f85149"/>
    <rect x="210" y="145" width="8" height="25" fill="#f85149"/>

    <!-- Швидкісний потік котлової води під тиском зриває кульку -->
    <path d="M 70,160 L 195,130" fill="none" stroke="#f85149" stroke-width="4"/>
    
    <!-- Кулька щільно притиснута до сідла клапана -->
    <circle cx="206" cy="130" r="18" fill="#f85149" stroke="#da3633" stroke-width="2"/>

    <text x="170" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f85149">
      Герметичне відсікання каналу!
    </text>
    <text x="170" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#c9d1d9">
      Захищає оператора від опіків парою
    </text>
  </g>
</svg>