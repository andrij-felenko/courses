<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <!-- Arrow marker for general lines / axes -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив вхідного опору АЦП на характеристику потенціометра</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Нелінійний прогин напруги спричиняє методичну похибку з максимумом при α ≈ 0.67</text>

  <!-- Left Panel: Equivalent Circuit -->
  <rect x="30" y="80" width="290" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="175" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема дільника</text>

  <!-- Circuit Diagram Elements -->
  <!-- VCC Node -->
  <circle cx="100" cy="145" r="4" fill="#2457d6"/>
  <text x="100" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">U_ref (+5V)</text>
  <line x1="100" y1="145" x2="100" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Potentiometer Resistor Body -->
  <rect x="90" y="160" width="20" height="140" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="2"/>

  <!-- Upper / Lower Resistance Labels -->
  <text x="82" y="190" font-size="12" fill="#6b7280" text-anchor="end">(1−α)R</text>
  <text x="82" y="270" font-size="12" fill="#6b7280" text-anchor="end">αR</text>

  <!-- Slider / Wiper Terminal at position alpha -->
  <path d="M 108 225 L 100 225" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 108 220 L 100 225 L 108 230 Z" fill="#1a1a1a"/>
  <line x1="108" y1="225" x2="150" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="150" cy="225" r="4" fill="#1a1a1a"/>
  <text x="150" y="212" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U_out</text>

  <!-- Connection to ADC input -->
  <line x1="150" y1="225" x2="230" y2="225" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ADC Input Container Box -->
  <rect x="190" y="180" width="120" height="155" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4" rx="6"/>
  <text x="250" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вхід АЦП</text>

  <!-- Load Resistor Rin (ADC input impedance) -->
  <line x1="230" y1="225" x2="230" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="220" y="240" width="20" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="2"/>
  <text x="245" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">R_in</text>
  <text x="245" y="272" font-size="11" fill="#6b7280" text-anchor="start">(опір АЦП)</text>
  <line x1="230" y1="295" x2="230" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bottom connection from Potentiometer to Ground -->
  <line x1="100" y1="300" x2="100" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="100" y1="330" x2="230" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Ground Symbol -->
  <line x1="88" y1="330" x2="112" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="93" y1="335" x2="107" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="98" y1="340" x2="102" y2="340" stroke="#1a1a1a" stroke-width="1"/>
  <text x="100" y="358" font-size="12" fill="#6b7280" text-anchor="middle">GND (0V)</text>

  <!-- Formula Card in Left Panel -->
  <rect x="45" y="375" width="260" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="175" y="395" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула вихідної напруги:</text>
  <text x="175" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">U_out = U_ref · α / [1 + γ·α(1−α)]</text>
  <text x="175" y="445" font-size="11" fill="#6b7280" text-anchor="middle">де γ = R / R_in,  α = θ / θ_max</text>

  <!-- Right Panel: Graph Area -->
  <rect x="340" y="80" width="590" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graph Grid Lines -->
  <!-- Horizontal Grid Lines -->
  <line x1="430" y1="345" x2="850" y2="345" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="430" y1="280" x2="850" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="430" y1="215" x2="850" y2="215" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="430" y1="150" x2="850" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Vertical Grid Lines -->
  <line x1="535" y1="150" x2="535" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="640" y1="150" x2="640" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="850" y1="150" x2="850" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Max Error Vertical Guide Line at alpha = 0.67 (X = 710) -->
  <line x1="710" y1="150" x2="710" y2="410" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Graph Axes -->
  <line x1="430" y1="410" x2="880" y2="410" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="410" x2="430" y2="125" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Y-Axis Ticks & Labels -->
  <text x="420" y="414" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="420" y="349" font-size="12" fill="#6b7280" text-anchor="end">0.25</text>
  <text x="420" y="284" font-size="12" fill="#6b7280" text-anchor="end">0.50</text>
  <text x="420" y="219" font-size="12" fill="#6b7280" text-anchor="end">0.75</text>
  <text x="420" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">1.0 (U_ref)</text>
  <text x="435" y="112" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вихідна напруга U_out / U_ref</text>

  <!-- X-Axis Ticks & Labels -->
  <text x="430" y="428" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="535" y="428" font-size="12" fill="#6b7280" text-anchor="middle">0.25</text>
  <text x="640" y="428" font-size="12" fill="#6b7280" text-anchor="middle">0.50</text>
  <text x="710" y="428" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0.67</text>
  <text x="850" y="428" font-size="12" fill="#6b7280" text-anchor="middle">1.0 (θ_max)</text>
  <text x="640" y="460" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відносне кутове положення вала α = θ / θ_max</text>

  <!-- Graph Legend Box -->
  <rect x="445" y="138" width="265" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="455" y1="155" x2="480" y2="155" stroke="#27ae60" stroke-width="3"/>
  <text x="488" y="159" font-size="12" font-weight="bold" fill="#1a1a1a">Ідеальна лінійна (R_in → ∞)</text>
  <line x1="455" y1="175" x2="480" y2="175" stroke="#c0392b" stroke-width="3"/>
  <text x="488" y="179" font-size="11" font-weight="bold" fill="#1a1a1a">Реальна з навантаженням (R/R_in &gt; 0)</text>

  <!-- Ideal Characteristic (Linear) Curve -->
  <line x1="430" y1="410" x2="850" y2="150" stroke="#27ae60" stroke-width="3"/>

  <!-- Real Loaded Characteristic (Curved) -->
  <path d="M 430,410 C 520,375 600,315 710,254 C 765,223 810,187 850,150" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Points of interest at alpha = 0.67 -->
  <circle cx="710" cy="236.7" r="5" fill="#27ae60"/>
  <circle cx="710" cy="254" r="5" fill="#c0392b"/>

  <!-- Error Delta Line -->
  <line x1="710" y1="237" x2="710" y2="254" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Dotted lead line to Callout Box -->
  <line x1="710" y1="245" x2="730" y2="275" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Callout Box for Max Error -->
  <rect x="730" y="275" width="185" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="740" y="295" font-size="12" font-weight="bold" fill="#c0392b">Максимальна похибка ΔU_max</text>
  <text x="740" y="318" font-size="12" font-weight="bold" fill="#1a1a1a">точка α = 2/3 ≈ 0.67</text>
  <text x="740" y="340" font-size="11" fill="#6b7280">ΔU = U_ideal − U_real</text>

</svg>
