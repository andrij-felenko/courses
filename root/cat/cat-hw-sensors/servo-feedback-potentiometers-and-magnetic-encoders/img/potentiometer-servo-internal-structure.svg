<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Будова та принцип роботи потенціометричного давача сервоприводу</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Формування сигналу V_out(θ), контактний знос доріжки та мертві зони</text>

  <!-- LEFT PANEL: Mechanical Structure -->
  <rect x="25" y="75" width="445" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="85" width="425" height="28" rx="4" fill="#eaf0fd"/>
  <text x="45" y="103" font-size="14" font-weight="bold" fill="#2457d6">1. Механічна будова та струмознімальний контакт</text>

  <!-- Track Title Label -->
  <text x="247.5" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Резистивна доріжка (вуглець / металокераміка)</text>

  <!-- Resistive Track Arc -->
  <path d="M 201.6,300.5 A 80,80 0 1,1 293.4,300.5" fill="none" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
  <path d="M 201.6,300.5 A 80,80 0 1,1 293.4,300.5" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>

  <!-- Dead Zones on Track Ends -->
  <path d="M 201.6,300.5 A 80,80 0 0,1 182.0,280.9" fill="none" stroke="#c0392b" stroke-width="20" stroke-linecap="round"/>
  <path d="M 313.0,280.9 A 80,80 0 0,1 293.4,300.5" fill="none" stroke="#c0392b" stroke-width="20" stroke-linecap="round"/>

  <!-- Wiper Hub & Shaft -->
  <circle cx="247.5" cy="235" r="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="247.5" cy="235" r="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="247.5" cy="235" r="4" fill="#2457d6"/>

  <!-- Wiper Arm & Brush Contact -->
  <line x1="247.5" y1="235" x2="287.5" y2="165.7" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="287.5" cy="165.7" r="6" fill="#f59e0b" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Rotation Angle Arrow -->
  <path d="M 225,196 A 45,45 0 0,1 270,196" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="247.5" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Кут θ</text>

  <!-- Wiper Annotations -->
  <text x="305" y="162" font-size="12" font-weight="bold" fill="#2457d6">Струмознімач (повзунок)</text>
  <text x="305" y="176" font-size="12" fill="#6b7280">обертається з валом</text>

  <!-- Dead Zone Callouts -->
  <line x1="135" y1="277" x2="165" y2="277" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="130" y="272" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Мертва зона</text>
  <text x="130" y="286" text-anchor="end" font-size="12" fill="#c0392b">(край 0 В / GND)</text>

  <line x1="360" y1="277" x2="330" y2="277" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="365" y="272" font-size="12" font-weight="bold" fill="#c0392b">Мертва зона</text>
  <text x="365" y="286" font-size="12" fill="#c0392b">(край Vcc / +5 В)</text>

  <!-- Terminal Pads & Wires -->
  <circle cx="201.6" cy="300.5" r="5" fill="#1a1a1a"/>
  <line x1="201.6" y1="305.5" x2="107.5" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="45" y="325" width="125" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="107.5" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вивід 1: GND</text>
  <text x="107.5" y="353" text-anchor="middle" font-size="12" fill="#6b7280">(0 В / маса)</text>

  <circle cx="293.4" cy="300.5" r="5" fill="#1a1a1a"/>
  <line x1="293.4" y1="305.5" x2="387.5" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="325" y="325" width="125" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="387.5" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вивід 3: Vcc</text>
  <text x="387.5" y="353" text-anchor="middle" font-size="12" fill="#6b7280">(+5 В живлення)</text>

  <line x1="247.5" y1="265" x2="247.5" y2="325" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="185" y="325" width="125" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247.5" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вивід 2: V_out(θ)</text>
  <text x="247.5" y="353" text-anchor="middle" font-size="12" fill="#6b7280">(сигнал кута)</text>

  <!-- Contact Wear Warning Box -->
  <rect x="35" y="378" width="425" height="108" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="45" y="396" font-size="12" font-weight="bold" fill="#c0392b">⚠️ Механічний знос та контактний шум (chatter):</text>
  <text x="45" y="415" font-size="12" fill="#1a1a1a">• Тертя контакту з часом стирає резистивний шар доріжки.</text>
  <text x="45" y="434" font-size="12" fill="#1a1a1a">• Наслідок: брязкіт контакту та стрибки напруги на АЦП.</text>
  <text x="45" y="453" font-size="12" fill="#1a1a1a">• Обмежений ресурс: ~10⁶ циклів (на відміну від енкодерів).</text>

  <!-- RIGHT PANEL TOP: Equivalent Circuit -->
  <rect x="490" y="75" width="445" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="500" y="85" width="425" height="28" rx="4" fill="#eaf0fd"/>
  <text x="510" y="103" font-size="14" font-weight="bold" fill="#2457d6">2. Еквівалентна схема дільника напруги</text>

  <!-- Circuit Elements -->
  <!-- Vcc Node -->
  <circle cx="540" cy="135" r="4" fill="#2457d6"/>
  <text x="540" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Vcc (+5 В)</text>
  <line x1="540" y1="135" x2="540" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R1 Resistor -->
  <rect x="533" y="145" width="14" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="556" y="158" font-size="12" fill="#1a1a1a">R1(θ) = R_tot · (1 - θ/θ_max)</text>

  <!-- Connection R1 to Middle Node -->
  <line x1="540" y1="173" x2="540" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="540" cy="185" r="4" fill="#2457d6"/>

  <!-- Connection Middle Node to R2 -->
  <line x1="540" y1="185" x2="540" y2="197" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R2 Resistor -->
  <rect x="533" y="197" width="14" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="556" y="214" font-size="12" fill="#1a1a1a">R2(θ) = R_tot · (θ/θ_max)</text>

  <!-- Connection R2 to GND -->
  <line x1="540" y1="225" x2="540" y2="237" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="530" y1="237" x2="550" y2="237" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="534" y1="241" x2="546" y2="241" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="538" y1="245" x2="542" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="259" text-anchor="middle" font-size="12" fill="#6b7280">GND (0 В)</text>

  <!-- Output & Filter Branch -->
  <line x1="540" y1="185" x2="640" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="640" y="178" width="28" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="654" y="171" text-anchor="middle" font-size="12" fill="#6b7280">R_f</text>
  <line x1="668" y1="185" x2="690" y2="185" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Filter Capacitor C_f -->
  <circle cx="690" cy="185" r="3" fill="#2457d6"/>
  <line x1="690" y1="185" x2="690" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="682" y1="200" x2="698" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="682" y1="205" x2="698" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="690" y1="205" x2="690" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="684" y1="218" x2="696" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="687" y1="221" x2="693" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="704" y="207" font-size="12" fill="#6b7280">C_f</text>

  <!-- Output Arrow to ADC Box -->
  <line x1="690" y1="185" x2="740" y2="185" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="745" y="170" width="175" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="832.5" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_out → АЦП МК</text>

  <!-- Formula Box Top Right -->
  <rect x="745" y="120" width="175" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="832.5" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_out = Vcc · R2 / R_tot</text>
  <text x="832.5" y="151" text-anchor="middle" font-size="12" fill="#2457d6">V_out ∝ θ (ідеально)</text>

  <!-- RIGHT PANEL BOTTOM: Characteristic & Dead Zones -->
  <rect x="490" y="295" width="445" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="500" y="305" width="425" height="28" rx="4" fill="#eaf0fd"/>
  <text x="510" y="323" font-size="14" font-weight="bold" fill="#2457d6">3. Графік V_out(θ), мертві зони та контактний шум</text>

  <!-- Graph Axes -->
  <!-- Y Axis -->
  <line x1="550" y1="450" x2="550" y2="345" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="550" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_out</text>

  <!-- X Axis -->
  <line x1="550" y1="450" x2="905" y2="450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="912" y="454" font-size="12" font-weight="bold" fill="#1a1a1a">θ</text>

  <!-- Y Ticks & Grid Lines -->
  <text x="542" y="454" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <line x1="550" y1="365" x2="900" y2="365" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="542" y="369" text-anchor="end" font-size="12" fill="#6b7280">Vcc</text>

  <!-- Dead Zone Rectangles & Boundaries -->
  <rect x="550" y="365" width="40" height="85" fill="#fdecea" opacity="0.75"/>
  <line x1="590" y1="365" x2="590" y2="450" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="570" y="402" text-anchor="middle" font-size="12" fill="#c0392b">Мертва</text>
  <text x="570" y="416" text-anchor="middle" font-size="12" fill="#c0392b">зона</text>

  <rect x="850" y="365" width="40" height="85" fill="#fdecea" opacity="0.75"/>
  <line x1="850" y1="365" x2="850" y2="450" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="870" y="402" text-anchor="middle" font-size="12" fill="#c0392b">Мертва</text>
  <text x="870" y="416" text-anchor="middle" font-size="12" fill="#c0392b">зона</text>

  <!-- X Ticks & Labels -->
  <text x="550" y="466" text-anchor="middle" font-size="12" fill="#6b7280">0°</text>
  <text x="590" y="466" text-anchor="middle" font-size="12" fill="#c0392b">θ_min</text>
  <text x="850" y="466" text-anchor="middle" font-size="12" fill="#c0392b">θ_max</text>
  <text x="890" y="466" text-anchor="middle" font-size="12" fill="#6b7280">300°</text>

  <!-- Ideal Characteristic Line -->
  <line x1="590" y1="450" x2="850" y2="365" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="1.5"/>

  <!-- Actual Signal Line with Contact Noise Jitter -->
  <path d="M 550,450 L 590,450 L 640,434 L 680,421 L 700,414 L 706,423 L 712,404 L 718,418 L 724,402 L 730,412 L 736,399 L 755,396 L 800,381 L 850,365 L 890,365" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Callout Box for Noise Jitter -->
  <rect x="635" y="337" width="200" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="725" y1="364" x2="718" y2="398" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="735" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Шум брязкіту контакту (сплески)</text>

  <!-- Working Range Dimension Bar -->
  <line x1="590" y1="480" x2="850" y2="480" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="590" y1="476" x2="590" y2="484" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="850" y1="476" x2="850" y2="484" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="493" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Робочий лінійний діапазон Δθ</text>
</svg>
