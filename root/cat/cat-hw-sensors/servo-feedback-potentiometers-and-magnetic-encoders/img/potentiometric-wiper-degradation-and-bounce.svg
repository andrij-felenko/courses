<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив вібрації на потенціометричний контакт: дребезг і шум</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Механічний відрив повзунка від резистивної доріжки викликає сплески напруги U_out</text>

  <!-- Left Panel: Mechanical Assembly & Contact Bounce -->
  <rect x="30" y="85" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Panel Header -->
  <rect x="45" y="100" width="405" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247.5" y="123" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Механічна вібрація та відрив повзунка</text>

  <!-- Output Signal Terminal & Label -->
  <text x="75" y="153" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">U_out</text>
  <line x1="85" y1="200" x2="85" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="85" cy="165" r="4" fill="#2457d6"/>

  <!-- Vibration Vector Indicator -->
  <text x="155" y="153" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вібрація F_vib</text>
  <line x1="155" y1="188" x2="155" y2="167" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="155" y1="188" x2="155" y2="210" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Wiper Base Mount -->
  <rect x="55" y="200" width="60" height="75" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="85" y="243" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Опора</text>

  <!-- Wiper Spring Arm & Label -->
  <text x="275" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">Пружний повзунок (Wiper)</text>
  <path d="M 115,230 L 210,230 L 315,325" fill="none" stroke="#2457d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Curved Wiper Tip -->
  <path d="M 315,325 Q 323,333 313,337" fill="none" stroke="#2457d6" stroke-width="3" stroke-linecap="round"/>

  <!-- Gap Dimension Lines & Callout Box -->
  <line x1="320" y1="337" x2="320" y2="326" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="320" y1="337" x2="320" y2="349" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="325" y="240" width="115" height="54" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="382.5" y="261" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ОТРИВ КОНТАКТУ</text>
  <text x="382.5" y="281" font-size="12" fill="#c0392b" text-anchor="middle">Зазор (Gap) Δy</text>
  <path d="M 350,294 L 327,330" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <!-- Track & Substrate -->
  <rect x="55" y="351" width="385" height="24" rx="2" fill="#374151" stroke="#1f2937" stroke-width="1"/>
  <text x="247.5" y="367" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Резистивний вугільний шар</text>

  <rect x="55" y="375" width="385" height="24" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="247.5" y="391" font-size="12" fill="#6b7280" text-anchor="middle">Ізоляційна підкладка (Substrate)</text>

  <!-- Left Summary Box -->
  <rect x="45" y="415" width="405" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247.5" y="432" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Причина: вібрація + механічний знос</text>
  <text x="247.5" y="448" font-size="12" fill="#6b7280" text-anchor="middle">Втрата притискного зусилля пелюстки</text>

  <!-- Right Panel: Electrical Signal & Bounce Spikes -->
  <rect x="495" y="85" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Right Panel Header -->
  <rect x="510" y="100" width="405" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712.5" y="123" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Електричний шум та імпульсні сплески</text>

  <!-- Oscilloscope Display Container -->
  <rect x="535" y="150" width="370" height="240" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Grid dashed lines -->
  <line x1="580" y1="190" x2="875" y2="190" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="580" y1="270" x2="875" y2="270" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Bounce zone highlight overlay -->
  <rect x="645" y="175" width="170" height="190" fill="#fdecea" fill-opacity="0.4" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3" rx="4"/>
  <text x="730" y="168" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона відриву (Дребезг)</text>

  <!-- Signal Axes -->
  <line x1="580" y1="375" x2="580" y2="165" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="580" y1="350" x2="885" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <text x="580" y="157" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U_out [V]</text>
  <text x="892" y="354" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">t</text>

  <!-- Voltage Level Ticks -->
  <text x="572" y="194" font-size="12" fill="#6b7280" text-anchor="end">V_CC</text>
  <text x="572" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">U_nom</text>
  <text x="572" y="354" font-size="12" fill="#6b7280" text-anchor="end">0 V</text>

  <!-- Normal Signal Phase -->
  <path d="M 580,270 L 645,270" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="612.5" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Норма</text>

  <!-- Bounce Waveform (Spikes) -->
  <path d="M 645,270 L 653,190 L 661,350 L 669,190 L 677,270 L 685,190 L 705,190 L 715,270 L 725,190 L 735,350 L 745,190 L 755,350 L 765,190 L 775,270 L 785,190 L 795,350 L 805,270 L 815,190 L 825,270" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Restored Signal Phase -->
  <path d="M 825,270 L 875,270" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Right Summary Box -->
  <rect x="510" y="415" width="405" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712.5" y="432" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Наслідок: висока похибка АЦП та збої</text>
  <text x="712.5" y="448" font-size="12" fill="#6b7280" text-anchor="middle">Хибні спрацьовування контуру керування</text>
</svg>
