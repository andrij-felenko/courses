<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура кадру SPI та конвеєр читання енкодера AS5048</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">16-бітний пакунок містить 14 біт кута, біт парності PAR та прапорець EF; дані повертаються з затримкою в 1 кадр</text>

  <!-- SECTION 1: Frame Structure -->
  <g id="section-frame-structure">
    <rect x="20" y="74" width="920" height="196" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="40" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">1. Розподіл бітів у 16-бітному пакунку (MOSI / MISO)</text>

    <!-- Bit Numbers Header -->
    <text x="140" y="114" text-anchor="middle" font-size="11" fill="#6b7280">15</text>
    <text x="190" y="114" text-anchor="middle" font-size="11" fill="#6b7280">14</text>
    <text x="240" y="114" text-anchor="middle" font-size="11" fill="#6b7280">13</text>
    <text x="290" y="114" text-anchor="middle" font-size="11" fill="#6b7280">12</text>
    <text x="340" y="114" text-anchor="middle" font-size="11" fill="#6b7280">11</text>
    <text x="390" y="114" text-anchor="middle" font-size="11" fill="#6b7280">10</text>
    <text x="440" y="114" text-anchor="middle" font-size="11" fill="#6b7280">9</text>
    <text x="490" y="114" text-anchor="middle" font-size="11" fill="#6b7280">8</text>
    <text x="540" y="114" text-anchor="middle" font-size="11" fill="#6b7280">7</text>
    <text x="590" y="114" text-anchor="middle" font-size="11" fill="#6b7280">6</text>
    <text x="640" y="114" text-anchor="middle" font-size="11" fill="#6b7280">5</text>
    <text x="690" y="114" text-anchor="middle" font-size="11" fill="#6b7280">4</text>
    <text x="740" y="114" text-anchor="middle" font-size="11" fill="#6b7280">3</text>
    <text x="790" y="114" text-anchor="middle" font-size="11" fill="#6b7280">2</text>
    <text x="840" y="114" text-anchor="middle" font-size="11" fill="#6b7280">1</text>
    <text x="890" y="114" text-anchor="middle" font-size="11" fill="#6b7280">0</text>

    <!-- MOSI Row -->
    <text x="105" y="143" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">MOSI (TX):</text>

    <rect x="115" y="122" width="50" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="140" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PAR</text>

    <rect x="165" y="122" width="50" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="190" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">R/W</text>

    <rect x="215" y="122" width="700" height="32" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="565" y="143" text-anchor="middle" font-size="12" fill="#1a1a1a">Адреса регістру [13:0] (наприклад, 0x3FFF — ANGLE / READ)</text>

    <!-- MISO Row -->
    <text x="105" y="183" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">MISO (RX):</text>

    <rect x="115" y="162" width="50" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="140" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PAR</text>

    <rect x="165" y="162" width="50" height="32" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="190" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">EF</text>

    <rect x="215" y="162" width="700" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="565" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Дані кута Angle Data [13:0] (14 біт, значення 0 ... 16383)</text>

    <!-- Field Descriptions Cards -->
    <rect x="115" y="204" width="230" height="56" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="127" y="221" font-size="12" font-weight="bold" fill="#2457d6">Біт 15: PAR (Парність)</text>
    <text x="127" y="236" font-size="12" fill="#4b5563">Парна кількість 1 у кадрі</text>
    <text x="127" y="250" font-size="12" fill="#6b7280">Перевірка цілісності SPI</text>

    <rect x="360" y="204" width="230" height="56" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
    <text x="372" y="221" font-size="12" font-weight="bold" fill="#c0392b">Біт 14: EF (Error Flag)</text>
    <text x="372" y="236" font-size="12" fill="#4b5563">1 = Помилка у попер. кадрі</text>
    <text x="372" y="250" font-size="12" fill="#6b7280">Скидається читанням 0x0001</text>

    <rect x="605" y="204" width="310" height="56" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="617" y="221" font-size="12" font-weight="bold" fill="#27ae60">Біти 13..0: Поле кута Angle</text>
    <text x="617" y="236" font-size="12" fill="#4b5563">14 біт = 16 384 відліків / оберт</text>
    <text x="617" y="250" font-size="12" fill="#6b7280">Роздільність: 360° / 16384 ≈ 0.022°</text>
  </g>

  <!-- SECTION 2: Timing Diagram & Pipeline Delay -->
  <g id="section-timing-diagram">
    <rect x="20" y="286" width="920" height="232" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="40" y="308" font-size="14" font-weight="bold" fill="#1a1a1a">2. Часова діаграма SPI та конвеєрна затримка (1-Frame Pipeline Delay)</text>

    <!-- Headers for Frames -->
    <text x="335" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Кадр N (Запит кута)</text>
    <text x="520" y="328" text-anchor="middle" font-size="12" fill="#6b7280">Пауза t_CSH</text>
    <text x="705" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Кадр N+1 (Отримання кута N)</text>

    <!-- Signal Names -->
    <text x="160" y="352" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">/CS</text>
    <text x="160" y="380" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">SCLK</text>
    <text x="160" y="415" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">MOSI</text>
    <text x="160" y="453" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">MISO</text>

    <!-- /CS Waveform -->
    <path d="M 170,342 L 190,342 L 190,356 L 480,356 L 480,342 L 560,342 L 560,356 L 850,356 L 850,342 L 870,342" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- SCLK Waveform -->
    <path d="M 170,384 L 195,384 L 195,370 L 210,370 L 210,384 L 225,384 L 225,370 L 240,370 L 240,384 L 255,384 L 255,370 L 270,370 L 270,384 L 285,384 L 285,370 L 300,370 L 300,384 L 315,384 L 315,370 L 330,370 L 330,384 L 345,384 L 345,370 L 360,370 L 360,384 L 375,384 L 375,370 L 390,370 L 390,384 L 405,384 L 405,370 L 420,370 L 420,384 L 435,384 L 435,370 L 450,370 L 450,384 L 475,384 L 565,384 L 565,370 L 580,370 L 580,384 L 595,384 L 595,370 L 610,370 L 610,384 L 625,384 L 625,370 L 640,370 L 640,384 L 655,384 L 655,370 L 670,370 L 670,384 L 685,384 L 685,370 L 700,370 L 700,384 L 715,384 L 715,370 L 730,370 L 730,384 L 745,384 L 745,370 L 760,370 L 760,384 L 775,384 L 775,370 L 790,370 L 790,384 L 805,384 L 805,370 L 820,370 L 820,384 L 845,384 L 870,384" fill="none" stroke="#6b7280" stroke-width="1.5"/>

    <!-- MOSI Data Packets -->
    <rect x="195" y="398" width="280" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="335" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Команда N: READ ANGLE (0x3FFF)</text>

    <rect x="565" y="398" width="280" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="705" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Команда N+1: NOP / READ</text>

    <!-- MISO Data Packets -->
    <rect x="195" y="436" width="280" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="335" y="453" text-anchor="middle" font-size="12" fill="#6b7280">Дані N-1 (Попередній результат)</text>

    <rect x="565" y="436" width="280" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="705" y="453" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Дані N: ANGLE (Результат Команди N)</text>

    <!-- Pipeline Delay Flow Arrow -->
    <path d="M 475,411 L 520,411 L 520,449 L 565,449" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>
    <path d="M 520,449 L 520,480" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Delay Badge -->
    <rect x="410" y="480" width="220" height="24" rx="4" fill="#2457d6"/>
    <text x="520" y="496" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Конвеєрна затримка: 1 кадр</text>
  </g>
</svg>
