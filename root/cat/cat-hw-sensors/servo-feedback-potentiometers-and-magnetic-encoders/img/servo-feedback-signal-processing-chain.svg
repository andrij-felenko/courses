<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тракт обробки сигналу зворотного зв'язку сервоприводу</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення аналогової напруги давача в цифровий код кута для мікроконтролера</text>

  <!-- Domain Panel 1: Analog Domain -->
  <rect x="30" y="85" width="435" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="110" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">АНАЛОГОВИЙ ТРАКТ</text>

  <!-- Domain Panel 2: Digital Domain -->
  <rect x="495" y="85" width="435" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="110" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">ЦИФРОВИЙ ТРАКТ (SPI / ADC)</text>

  <!-- Card 1: Sensor -->
  <rect x="45" y="130" width="185" height="305" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="45" y="130" width="185" height="32" rx="6" fill="#eaf0fd"/>
  <text x="137" y="151" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Давач кута</text>
  <text x="137" y="174" font-size="12" fill="#6b7280" text-anchor="middle">Потенціометр / Hall</text>

  <!-- Card 1 Schematic -->
  <circle cx="95" cy="235" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="95" cy="235" r="3" fill="#2457d6"/>
  <path d="M 85,225 A 13,13 0 0,1 105,225" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="95" y="208" font-size="12" fill="#1a1a1a" text-anchor="middle">Вал (кути θ)</text>
  <path d="M 109,235 L 144,235" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="150" y="188" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">+5V (V_cc)</text>
  <line x1="150" y1="192" x2="150" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="144" y="205" width="12" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="245" x2="150" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="142" y1="258" x2="158" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="145" y1="261" x2="155" y2="261" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="148" y1="264" x2="152" y2="264" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="150" y="274" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>
  <line x1="156" y1="235" x2="230" y2="235" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Card 1 Signal Box -->
  <rect x="55" y="280" width="165" height="145" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="137" y="297" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сигнал з шумами</text>
  <line x1="68" y1="380" x2="208" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <line x1="68" y1="310" x2="68" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <text x="64" y="312" font-size="12" fill="#6b7280" text-anchor="end">V</text>
  <text x="210" y="394" font-size="12" fill="#6b7280" text-anchor="end">t</text>
  <path d="M 68,365 L 75,350 L 80,362 L 88,342 L 95,355 L 105,332 L 115,348 L 125,325 L 135,338 L 148,318 L 160,330 L 175,315 L 190,322 L 205,310" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <text x="137" y="402" font-size="12" fill="#c0392b" text-anchor="middle">V_in(t) = V(θ) + e(t)</text>
  <text x="137" y="416" font-size="12" fill="#6b7280" text-anchor="middle">(наводки та шум контактів)</text>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="230" y1="220" x2="258" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="244" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_in</text>

  <!-- Card 2: Low Pass Filter -->
  <rect x="260" y="130" width="185" height="305" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="260" y="130" width="185" height="32" rx="6" fill="#eaf0fd"/>
  <text x="352" y="151" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Фільтр НЧ</text>
  <text x="352" y="174" font-size="12" fill="#6b7280" text-anchor="middle">RC-ланцюг (Low-Pass)</text>

  <!-- Card 2 Schematic -->
  <line x1="275" y1="220" x2="305" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="305" y="213" width="30" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R</text>
  <line x1="335" y1="220" x2="370" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="370" cy="220" r="3" fill="#1a1a1a"/>
  <line x1="370" y1="220" x2="370" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="234" x2="380" y2="234" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="360" y1="239" x2="380" y2="239" stroke="#1a1a1a" stroke-width="2"/>
  <text x="388" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C</text>
  <line x1="370" y1="239" x2="370" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="363" y1="252" x2="377" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="366" y1="255" x2="374" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="368" y1="258" x2="372" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="352" y="267" font-size="12" fill="#6b7280" text-anchor="middle">f_c = 1 / (2πRC)</text>
  <line x1="370" y1="220" x2="445" y2="220" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Card 2 Signal Box -->
  <rect x="270" y="280" width="165" height="145" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="352" y="297" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Згладжений сигнал</text>
  <line x1="283" y1="380" x2="423" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <line x1="283" y1="310" x2="283" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <text x="279" y="312" font-size="12" fill="#6b7280" text-anchor="end">V</text>
  <text x="425" y="394" font-size="12" fill="#6b7280" text-anchor="end">t</text>
  <path d="M 283,365 C 320,355 350,335 423,310" fill="none" stroke="#27ae60" stroke-width="2.2"/>
  <text x="352" y="402" font-size="12" fill="#27ae60" text-anchor="middle">V_flt(t) ≈ V(θ)</text>
  <text x="352" y="416" font-size="12" fill="#6b7280" text-anchor="middle">(ВЧ-шум придушено)</text>

  <!-- Flow Arrow 2 -> 3 (Analog to Digital Boundary) -->
  <line x1="445" y1="220" x2="508" y2="220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="477" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_flt</text>

  <!-- Card 3: ADC -->
  <rect x="510" y="130" width="185" height="305" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="130" width="185" height="32" rx="6" fill="#eaf0fd"/>
  <text x="602" y="151" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. АЦП (ADC)</text>
  <text x="602" y="174" font-size="12" fill="#6b7280" text-anchor="middle">Дискретизація і квантування</text>

  <!-- Card 3 Schematic -->
  <rect x="535" y="195" width="134" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="602" y="213" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Sample &amp; Hold</text>
  <text x="602" y="231" font-size="12" fill="#2457d6" text-anchor="middle">12-bit (N = 4096)</text>
  <text x="602" y="267" font-size="12" fill="#6b7280" text-anchor="middle">f_s &gt;&gt; 2 · f_max</text>

  <!-- Card 3 Signal Box -->
  <rect x="520" y="280" width="165" height="145" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="602" y="297" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дискретизований код</text>
  <line x1="533" y1="380" x2="673" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <line x1="533" y1="310" x2="533" y2="380" stroke="#9ca3af" stroke-width="1"/>
  <text x="543" y="312" font-size="12" fill="#6b7280" text-anchor="start">Code</text>
  <text x="675" y="394" font-size="12" fill="#6b7280" text-anchor="end">t</text>
  <path d="M 533,365 H 555 V 353 H 580 V 338 H 610 V 324 H 640 V 312 H 673" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="555" cy="353" r="3" fill="#2457d6"/>
  <circle cx="580" cy="338" r="3" fill="#2457d6"/>
  <circle cx="610" cy="324" r="3" fill="#2457d6"/>
  <circle cx="640" cy="312" r="3" fill="#2457d6"/>
  <text x="602" y="402" font-size="12" fill="#2457d6" text-anchor="middle">D_raw ∈ [0 ... 4095]</text>
  <text x="602" y="416" font-size="12" fill="#6b7280" text-anchor="middle">(квантування T_s)</text>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="695" y1="220" x2="723" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="709" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI</text>

  <!-- Card 4: MCU -->
  <rect x="725" y="130" width="185" height="305" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="725" y="130" width="185" height="32" rx="6" fill="#eaf0fd"/>
  <text x="817" y="151" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Мікроконтролер</text>
  <text x="817" y="174" font-size="12" fill="#6b7280" text-anchor="middle">Регістр та обчислення</text>

  <!-- Card 4 Schematic -->
  <rect x="735" y="195" width="165" height="50" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="817" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPI / ADC Data Register</text>
  <text x="817" y="233" font-size="12" font-family="monospace" font-weight="bold" fill="#2457d6" text-anchor="middle">RAW: 2623 (0x0A3F)</text>

  <!-- Card 4 Output Box -->
  <rect x="735" y="280" width="165" height="145" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="817" y="297" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Кут у програмі МК</text>
  <text x="817" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">θ = (D_raw / 4095) · θ_max</text>
  <rect x="750" y="337" width="134" height="28" rx="4" fill="#27ae60"/>
  <text x="817" y="356" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">θ_calc = 230.8°</text>
  <text x="817" y="398" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Похибка: ε &lt; 0.1°</text>
  <text x="817" y="416" font-size="12" fill="#6b7280" text-anchor="middle">(сигнал для PID)</text>
</svg>
