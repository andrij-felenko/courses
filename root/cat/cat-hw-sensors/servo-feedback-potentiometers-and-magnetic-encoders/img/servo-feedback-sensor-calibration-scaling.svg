<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Калібрування та лінеаризація вихідного сигналу давачів кута</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Компенсація зсуву нуля, мертвих зон (Deadband) та масштабування аналогового/цифрового сигналу</text>

  <!-- Panel 1: Raw Signal -->
  <rect x="25" y="70" width="425" height="430" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="37" y="82" width="401" height="32" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="237" y="103" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Сирий сигнал (зсув нуля та мертві зони)</text>

  <!-- Panel 1 Graph Elements -->
  <!-- Deadband regions -->
  <rect x="85" y="145" width="50" height="265" fill="#fdecea" opacity="0.7"/>
  <rect x="350" y="145" width="50" height="265" fill="#fdecea" opacity="0.7"/>
  <text x="110" y="260" font-size="12" fill="#c0392b" text-anchor="middle">Мертва</text>
  <text x="110" y="276" font-size="12" fill="#c0392b" text-anchor="middle">зона DZ1</text>
  <text x="375" y="260" font-size="12" fill="#c0392b" text-anchor="middle">Мертва</text>
  <text x="375" y="276" font-size="12" fill="#c0392b" text-anchor="middle">зона DZ2</text>

  <!-- Graph 1 Axes -->
  <line x1="85" y1="410" x2="420" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="85" y1="410" x2="85" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="85" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U_raw (В)</text>
  <text x="420" y="450" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Кут θ (град)</text>

  <!-- Graph 1 Ticks & Annotations -->
  <line x1="135" y1="410" x2="135" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="135" y="432" font-size="12" fill="#6b7280" text-anchor="middle">θ_min</text>
  <line x1="350" y1="410" x2="350" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="432" font-size="12" fill="#6b7280" text-anchor="middle">θ_max</text>

  <!-- Zero offset marker -->
  <line x1="45" y1="360" x2="135" y2="360" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="60" y1="405" x2="60" y2="365" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="55" y="388" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">U_0</text>

  <!-- Raw curve -->
  <path d="M 85 385 L 135 360 Q 220 310 350 175 L 400 170" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="220" y="240" font-size="12" fill="#c0392b" text-anchor="middle">Нелінійність S-кривої</text>

  <!-- Panel 1 Summary -->
  <rect x="75" y="450" width="325" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="237" y="466" font-size="12" fill="#c0392b" text-anchor="middle">● Нелінійність виходу  ● Зсув нуля U_0</text>
  <text x="237" y="480" font-size="12" fill="#c0392b" text-anchor="middle">● Насичення в мертвих зонах DZ1, DZ2</text>

  <!-- Central Processing Box -->
  <rect x="454" y="210" width="52" height="150" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="232" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU</text>
  <text x="480" y="248" font-size="12" fill="#2457d6" text-anchor="middle">/ DSP</text>
  <line x1="460" y1="258" x2="500" y2="258" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="276" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Опрац.</text>
  <text x="480" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Trim</text>
  <text x="480" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Shift</text>
  <text x="480" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">3. LUT</text>
  <text x="480" y="348" font-size="12" fill="#1a1a1a" text-anchor="middle">4. Scale</text>

  <line x1="430" y1="285" x2="450" y2="285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="508" y1="285" x2="528" y2="285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: Calibrated Signal -->
  <rect x="510" y="70" width="425" height="430" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="522" y="82" width="401" height="32" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="722" y="103" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Калібрований сигнал (лінеаризований)</text>

  <!-- Panel 2 Graph Elements -->
  <rect x="620" y="145" width="220" height="265" fill="#e9f7ef" opacity="0.6"/>
  <text x="730" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Лінійна зона вимірювання</text>

  <!-- Graph 2 Axes -->
  <line x1="570" y1="410" x2="905" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="570" y1="410" x2="570" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="570" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">θ_cal (град)</text>
  <text x="905" y="450" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Вхідний ADC</text>

  <!-- Graph 2 Lines & Projections -->
  <line x1="620" y1="370" x2="840" y2="185" stroke="#27ae60" stroke-width="3"/>
  <line x1="570" y1="370" x2="620" y2="370" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="840" y1="185" x2="890" y2="185" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Projections & Ticks -->
  <line x1="620" y1="370" x2="620" y2="410" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="620" y1="410" x2="620" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="620" y="432" font-size="12" fill="#6b7280" text-anchor="middle">ADC_min</text>

  <line x1="840" y1="185" x2="840" y2="410" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="840" y1="410" x2="840" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="840" y="432" font-size="12" fill="#6b7280" text-anchor="middle">ADC_max</text>

  <line x1="570" y1="370" x2="620" y2="370" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="562" y="374" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">0°</text>

  <line x1="570" y1="185" x2="840" y2="185" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="562" y="189" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">θ_max</text>

  <!-- Panel 2 Summary / Formula -->
  <rect x="560" y="450" width="325" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="722" y="466" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">θ_cal = K_scale × (ADC - ADC_min)</text>
  <text x="722" y="480" font-size="12" fill="#27ae60" text-anchor="middle">Ідеальна лінійна залежність у робочому куті</text>
</svg>
