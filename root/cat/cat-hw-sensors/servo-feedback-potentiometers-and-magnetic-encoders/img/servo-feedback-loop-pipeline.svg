<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обробка даних магнітного енкодера в контурі сервопривода</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Конвеєр від таймерного опитування SPI до PID-регулятора з переключенням на резервний ШІМ</text>

  <!-- Panel 1: ДАТЧИК -->
  <rect x="20" y="80" width="135" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="87.5" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. ДАТЧИК</text>

  <rect x="28" y="115" width="119" height="150" rx="6" ry="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="87.5" y="134" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">AS5048 / AS5047</text>
  <text x="87.5" y="153" font-size="12" fill="#1a1a1a" text-anchor="middle">Магнітна IC</text>
  <text x="87.5" y="173" font-size="12" fill="#6b7280" text-anchor="middle">14-біт кут</text>
  <text x="87.5" y="191" font-size="12" fill="#6b7280" text-anchor="middle">0..16383</text>
  <text x="87.5" y="211" font-size="12" fill="#1a1a1a" text-anchor="middle">• SPI: 16 біт</text>
  <text x="87.5" y="231" font-size="12" fill="#1a1a1a" text-anchor="middle">• ШІМ: Duty Cycle</text>
  <text x="87.5" y="251" font-size="12" fill="#6b7280" text-anchor="middle">• Флаги: MAGH/L</text>

  <rect x="28" y="280" width="119" height="205" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="87.5" y="298" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вал двигуна</text>
  <circle cx="87.5" cy="348" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="87.5" y1="324" x2="87.5" y2="372" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="73.5" y="352" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">N</text>
  <text x="101.5" y="352" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S</text>
  <text x="87.5" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Безконтактний</text>
  <text x="87.5" y="410" font-size="12" fill="#6b7280" text-anchor="middle">знімач положення</text>
  <text x="87.5" y="434" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Висока точність</text>
  <text x="87.5" y="454" font-size="12" fill="#6b7280" text-anchor="middle">14 біт = 0.022°</text>

  <!-- Panel 2: ЗЧИТУВАННЯ ТА ДІАГНОСТИКА -->
  <rect x="210" y="80" width="295" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="357.5" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. ЗЧИТУВАННЯ ТА ДІАГНОСТИКА</text>

  <rect x="220" y="115" width="125" height="110" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="282.5" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Timer ISR</text>
  <text x="282.5" y="156" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний таймер</text>
  <text x="282.5" y="176" font-size="12" fill="#1a1a1a" text-anchor="middle">Опитування SPI</text>
  <text x="282.5" y="200" font-size="12" fill="#6b7280" text-anchor="middle">f = 1–10 кГц</text>

  <rect x="365" y="115" width="130" height="110" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Прийом SPI</text>
  <text x="430" y="156" font-size="12" fill="#2457d6" text-anchor="middle">Кадр 16 біт</text>
  <text x="430" y="178" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка парності</text>
  <text x="430" y="200" font-size="12" fill="#6b7280" text-anchor="middle">Parity Bit check</text>

  <rect x="365" y="245" width="130" height="95" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="265" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діагностика</text>
  <text x="430" y="284" font-size="12" fill="#6b7280" text-anchor="middle">• Parity bit check</text>
  <text x="430" y="302" font-size="12" fill="#6b7280" text-anchor="middle">• EF / MAGH / MAGL</text>
  <text x="430" y="324" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перевірка кадру</text>

  <rect x="220" y="365" width="275" height="120" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="357.5" y="385" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">РЕЗЕРВНИЙ ШІМ-КАНАЛ</text>
  <text x="357.5" y="406" font-size="12" fill="#1a1a1a" text-anchor="middle">Захоплення таймера (Input Capture)</text>
  <text x="357.5" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювання t_high / T_period</text>
  <text x="357.5" y="447" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Авто-перемикання при збої SPI</text>
  <text x="357.5" y="467" font-size="12" fill="#6b7280" text-anchor="middle">Резервна точність 12 біт</text>

  <!-- Panel 3: АРБІТРАЖ ТА ФІЛЬТРАЦІЯ -->
  <rect x="525" y="80" width="210" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="630" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. АРБІТРАЖ ТА ФІЛЬТРАЦІЯ</text>

  <rect x="535" y="115" width="190" height="120" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="630" y="136" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Арбітр джерела</text>
  <text x="630" y="158" font-size="12" fill="#1a1a1a" text-anchor="middle">Вибір кута θ_raw:</text>
  <text x="630" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Норма: SPI (14 біт)</text>
  <text x="630" y="200" font-size="12" fill="#c0392b" text-anchor="middle">⚠ Аварія: ШІМ (12 біт)</text>
  <text x="630" y="222" font-size="12" fill="#6b7280" text-anchor="middle">Беззатримне переключення</text>

  <rect x="535" y="250" width="190" height="145" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="630" y="271" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фільтрація &amp; DSP</text>
  <text x="630" y="293" font-size="12" fill="#2457d6" text-anchor="middle">1. Перевід у рад / град</text>
  <text x="630" y="311" font-size="12" fill="#6b7280" text-anchor="middle">θ = θ_raw · (2π / 16384)</text>
  <text x="630" y="333" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Фільтр шуму (EWMA)</text>
  <text x="630" y="355" font-size="12" fill="#2457d6" text-anchor="middle">3. Обчислення швидкості</text>
  <text x="630" y="375" font-size="12" fill="#6b7280" text-anchor="middle">ω = dθ / dt</text>

  <rect x="535" y="410" width="190" height="70" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="630" y="432" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Очищені дані</text>
  <text x="630" y="454" font-size="12" fill="#1a1a1a" text-anchor="middle">Положення θ та швидкість ω</text>

  <!-- Panel 4: СЕРВОКОНТУР -->
  <rect x="755" y="80" width="185" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="847.5" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. СЕРВОКОНТУР</text>

  <rect x="765" y="115" width="165" height="80" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="847.5" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння кута</text>
  <text x="847.5" y="158" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">e(t) = θ_ref - θ</text>
  <text x="847.5" y="178" font-size="12" fill="#6b7280" text-anchor="middle">θ_ref: уставка</text>

  <rect x="765" y="210" width="165" height="120" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="847.5" y="231" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">PID-регулятор</text>
  <text x="847.5" y="253" font-size="12" fill="#1a1a1a" text-anchor="middle">• P: Пропорційний</text>
  <text x="847.5" y="273" font-size="12" fill="#1a1a1a" text-anchor="middle">• I: Інтегральний</text>
  <text x="847.5" y="293" font-size="12" fill="#1a1a1a" text-anchor="middle">• D: Диференціальний</text>
  <text x="847.5" y="315" font-size="12" fill="#6b7280" text-anchor="middle">Керування u(t)</text>

  <rect x="765" y="345" width="165" height="135" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="847.5" y="366" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силова частина</text>
  <text x="847.5" y="386" font-size="12" fill="#2457d6" text-anchor="middle">ШІМ-драйвер моста</text>
  <text x="847.5" y="406" font-size="12" fill="#1a1a1a" text-anchor="middle">Сервомотор</text>
  <text x="847.5" y="428" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Механічний рух</text>
  <text x="847.5" y="448" font-size="12" fill="#6b7280" text-anchor="middle">Вал обертається</text>

  <!-- Connections & Flows -->
  <!-- 1. SPI from Sensor to Timer/SPI module -->
  <line x1="147" y1="170" x2="220" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="183.5" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI</text>

  <!-- 2. PWM from Sensor to Backup PWM module -->
  <path d="M 147,231 L 180,231 L 180,425 L 220,425" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-red)"/>
  <text x="185" y="310" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ШІМ</text>

  <!-- 3. Timer ISR -> SPI Receive -->
  <line x1="345" y1="170" x2="365" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 4. SPI Receive -> Diagnostics -->
  <line x1="430" y1="225" x2="430" y2="245" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. SPI Diagnostics Fault -> Backup PWM trigger -->
  <line x1="430" y1="340" x2="430" y2="365" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="420" y="356" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Помилка SPI</text>

  <!-- 6. SPI Diagnostics OK -> Source Arbiter -->
  <path d="M 495,280 L 515,280 L 515,180 L 535,180" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arr-green)"/>

  <!-- 7. Backup PWM -> Source Arbiter -->
  <path d="M 495,425 L 515,425 L 515,200 L 535,200" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- 8. Arbiter -> DSP Filter -->
  <line x1="630" y1="235" x2="630" y2="250" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- 9. DSP Filter -> Output Box -->
  <line x1="630" y1="395" x2="630" y2="410" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 10. Output Box -> Servo Error Comparator -->
  <path d="M 725,445 L 745,445 L 745,155 L 765,155" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- 11. Error Comparator -> PID -->
  <line x1="847.5" y1="195" x2="847.5" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 12. PID -> Motor Actuator -->
  <line x1="847.5" y1="330" x2="847.5" y2="345" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 13. Mechanical Feedback Loop (Motor -> Encoder Shaft) -->
  <path d="M 847.5,480 L 847.5,525 L 87.5,525 L 87.5,485" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr-gray)"/>
  <text x="467.5" y="542" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Механічний зв'язок (вал двигуна ➔ магнітний енкодер)</text>
</svg>
