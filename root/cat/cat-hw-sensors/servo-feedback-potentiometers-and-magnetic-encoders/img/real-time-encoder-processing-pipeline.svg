<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Обчислювальний конвеєр обробки квадратурних сигналів енкодера</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">Синхронний конвеєр реального часу: від вибірки АЦП до багатооборотного кута позиції</text>

  <!-- Top Timing Line -->
  <line x1="60" y1="90" x2="900" y2="90" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="420" y="80" width="120" height="20" rx="4" fill="#f1f5f9"/>
  <text x="480" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">Частота ШІМ: 10–50 кГц</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 115)">
    <rect x="0" y="0" width="155" height="310" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="8" fill="#eff6ff"/>
    <text x="77.5" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">1. АЦП + DMA</text>
    
    <rect x="12" y="50" width="131" height="55" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Синхронна вибірка</text>
    <text x="77.5" y="88" text-anchor="middle" font-size="10" fill="#64748b">Тригер ШІМ-піку</text>

    <rect x="12" y="115" width="131" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Канали sin / cos</text>
    <text x="77.5" y="153" text-anchor="middle" font-size="10" fill="#64748b">Прямий доступ DMA</text>
    <text x="77.5" y="167" text-anchor="middle" font-size="9" fill="#2563eb">Без участі CPU</text>

    <rect x="12" y="185" width="131" height="115" rx="5" fill="#f1f5f9"/>
    <text x="77.5" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Вихід:</text>
    <text x="77.5" y="225" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">V_sin_raw</text>
    <text x="77.5" y="245" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">V_cos_raw</text>
    <text x="77.5" y="275" text-anchor="middle" font-size="10" fill="#64748b">12-16 біт сирі коди</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="195" y1="270" x2="220" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <g transform="translate(220, 115)">
    <rect x="0" y="0" width="155" height="310" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="8" fill="#f0f9ff"/>
    <text x="77.5" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">2. Фільтрація</text>

    <rect x="12" y="50" width="131" height="55" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">ФНЧ FIR / IIR</text>
    <text x="77.5" y="88" text-anchor="middle" font-size="10" fill="#64748b">Придушення ШІМ-шуму</text>

    <rect x="12" y="115" width="131" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Ідентичні коеф.</text>
    <text x="77.5" y="153" text-anchor="middle" font-size="10" fill="#64748b">Фазова симетрія</text>
    <text x="77.5" y="167" text-anchor="middle" font-size="9" fill="#0284c7">Δφ_filter = 0</text>

    <rect x="12" y="185" width="131" height="115" rx="5" fill="#f1f5f9"/>
    <text x="77.5" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Вихід:</text>
    <text x="77.5" y="225" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">V_sin_flt</text>
    <text x="77.5" y="245" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">V_cos_flt</text>
    <text x="77.5" y="275" text-anchor="middle" font-size="10" fill="#64748b">Очищені квадратури</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="375" y1="270" x2="400" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <g transform="translate(400, 115)">
    <rect x="0" y="0" width="155" height="310" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="8" fill="#f0fdfa"/>
    <text x="77.5" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">3. Калібрування</text>

    <rect x="12" y="50" width="131" height="55" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Зсув DC Offset</text>
    <text x="77.5" y="88" text-anchor="middle" font-size="10" fill="#64748b">Віднімання середнього</text>

    <rect x="12" y="115" width="131" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Матриця 2×2</text>
    <text x="77.5" y="153" text-anchor="middle" font-size="10" fill="#64748b">Gain Imbalance</text>
    <text x="77.5" y="167" text-anchor="middle" font-size="9" fill="#0d9488">Ортогоналізація φ</text>

    <rect x="12" y="185" width="131" height="115" rx="5" fill="#f1f5f9"/>
    <text x="77.5" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Вихід:</text>
    <text x="77.5" y="225" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">x = cos(θ)</text>
    <text x="77.5" y="245" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">y = sin(θ)</text>
    <text x="77.5" y="275" text-anchor="middle" font-size="10" fill="#64748b">Одиничне коло</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="555" y1="270" x2="580" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4 -->
  <g transform="translate(580, 115)">
    <rect x="0" y="0" width="155" height="310" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
    <rect x="0" y="0" width="155" height="36" rx="8" fill="#fffbeb"/>
    <text x="77.5" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">4. CORDIC</text>

    <rect x="12" y="50" width="131" height="55" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Vectoring Mode</text>
    <text x="77.5" y="88" text-anchor="middle" font-size="10" fill="#64748b">14 ітерацій зсувів &gt;&gt; i</text>

    <rect x="12" y="115" width="131" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="77.5" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Q15 Fixed-Point</text>
    <text x="77.5" y="153" text-anchor="middle" font-size="10" fill="#64748b">Без тригонометрії</text>
    <text x="77.5" y="167" text-anchor="middle" font-size="9" fill="#d97706">BAM 16 біт</text>

    <rect x="12" y="185" width="131" height="115" rx="5" fill="#f1f5f9"/>
    <text x="77.5" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Вихід:</text>
    <text x="77.5" y="225" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">theta_raw</text>
    <text x="77.5" y="245" text-anchor="middle" font-size="10" fill="#475569">[0 .. 65535]</text>
    <text x="77.5" y="275" text-anchor="middle" font-size="10" fill="#64748b">Електричний кут</text>
  </g>

  <!-- Arrow 4->5 -->
  <line x1="735" y1="270" x2="760" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 5 -->
  <g transform="translate(760, 115)">
    <rect x="0" y="0" width="160" height="310" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#f0fdf4"/>
    <text x="80" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">5. Unwrapping</text>

    <rect x="12" y="50" width="136" height="55" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Розгортання фази</text>
    <text x="80" y="88" text-anchor="middle" font-size="10" fill="#64748b">Перехід через 0xFFFF</text>

    <rect x="12" y="115" width="136" height="60" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Багатооборотність</text>
    <text x="80" y="153" text-anchor="middle" font-size="10" fill="#64748b">Лічильник turns</text>
    <text x="80" y="167" text-anchor="middle" font-size="9" fill="#16a34a">Розрахунок швидкості</text>

    <rect x="12" y="185" width="136" height="115" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="80" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">Фінальний результат:</text>
    <text x="80" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">angle_continuous</text>
    <text x="80" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">velocity_rad_s</text>
    <text x="80" y="275" text-anchor="middle" font-size="10" fill="#047857">До контуру FOC / PID</text>
  </g>
</svg>
