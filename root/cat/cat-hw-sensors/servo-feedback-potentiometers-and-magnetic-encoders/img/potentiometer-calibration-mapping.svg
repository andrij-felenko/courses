<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Калібрування та мапування сигналу потенціометра</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Обрізання мертвих зон біля упорів перетворює відліки АЦП у точний фізичний кут повороту</text>

  <!-- Vertical Alignment Reference Lines -->
  <line x1="220" y1="85" x2="220" y2="520" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>
  <line x1="740" y1="85" x2="740" y2="520" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- Panel 1: Raw ADC Range -->
  <rect x="40" y="85" width="880" height="145" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="60" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">1. Шкала сирих відліків АЦП (12-бітний АЦП: 0 … 4095)</text>

  <!-- Panel 1 Zones -->
  <rect x="120" y="125" width="100" height="45" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="170" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мертва зона</text>
  <text x="170" y="157" text-anchor="middle" font-size="11" fill="#c0392b">0 … ADC_min</text>

  <rect x="220" y="125" width="520" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="480" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Робочий лінійний діапазон сигналу</text>
  <text x="480" y="158" text-anchor="middle" font-size="11" fill="#1a1a1a">ADC_cal_min … ADC_cal_max</text>

  <rect x="740" y="125" width="100" height="45" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="790" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мертва зона</text>
  <text x="790" y="157" text-anchor="middle" font-size="11" fill="#c0392b">ADC_max … 4095</text>

  <!-- Panel 1 Axis & Ticks -->
  <line x1="120" y1="182" x2="840" y2="182" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="178" x2="120" y2="190" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="206" text-anchor="middle" font-size="11" fill="#6b7280">0</text>

  <line x1="220" y1="178" x2="220" y2="192" stroke="#2457d6" stroke-width="2"/>
  <text x="220" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ADC_cal_min (180)</text>

  <line x1="740" y1="178" x2="740" y2="192" stroke="#2457d6" stroke-width="2"/>
  <text x="740" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ADC_cal_max (3920)</text>

  <line x1="840" y1="178" x2="840" y2="190" stroke="#6b7280" stroke-width="1.5"/>
  <text x="840" y="206" text-anchor="middle" font-size="11" fill="#6b7280">4095</text>

  <!-- Inter-Panel Arrow 1 -->
  <line x1="480" y1="230" x2="480" y2="243" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: Software Pipeline -->
  <rect x="40" y="245" width="880" height="135" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="60" y="268" font-size="14" font-weight="bold" fill="#1a1a1a">2. Математична обробка у програмі (C/C++)</text>

  <!-- Box 2A: Clamping -->
  <rect x="90" y="282" width="340" height="84" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="260" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. Обмеження (Clamping)</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#1a1a1a">ADC_clamped = constrain(ADC_raw,</text>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#1a1a1a">ADC_cal_min, ADC_cal_max)</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#6b7280">(відтинає мертві зони біля упорів)</text>

  <!-- Inter-box Arrow in Panel 2 -->
  <line x1="430" y1="324" x2="520" y2="324" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="475" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ADC_clamped</text>

  <!-- Box 2B: Mapping -->
  <rect x="530" y="282" width="340" height="84" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="700" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2. Лінійне мапування (Map)</text>
  <text x="700" y="322" text-anchor="middle" font-size="11" fill="#1a1a1a">θ = θ_min + (ADC_clamped − ADC_cal_min) ×</text>
  <text x="700" y="339" text-anchor="middle" font-size="11" fill="#1a1a1a">(θ_max − θ_min) / (ADC_cal_max − ADC_cal_min)</text>
  <text x="700" y="356" text-anchor="middle" font-size="10" fill="#6b7280">(перетворення у кутові одиниці)</text>

  <!-- Inter-Panel Arrow 2 -->
  <line x1="480" y1="380" x2="480" y2="393" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Panel 3: Calibrated Angle Output -->
  <rect x="40" y="395" width="880" height="125" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="60" y="418" font-size="14" font-weight="bold" fill="#1a1a1a">3. Нормований кутовий вихід сервопривода (Фізичні градуси °)</text>

  <!-- Panel 3 Angle Scale Bar -->
  <rect x="220" y="432" width="520" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="480" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Корисний кутовий діапазон вала сервопривода (наприклад, 0° … 180°)</text>

  <!-- Panel 3 Axis & Ticks -->
  <line x1="220" y1="482" x2="740" y2="482" stroke="#27ae60" stroke-width="2"/>
  <line x1="220" y1="475" x2="220" y2="488" stroke="#27ae60" stroke-width="2"/>
  <text x="220" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">θ_min (0°)</text>

  <line x1="480" y1="475" x2="480" y2="488" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="506" text-anchor="middle" font-size="11" fill="#6b7280">θ_mid (90°)</text>

  <line x1="740" y1="475" x2="740" y2="488" stroke="#27ae60" stroke-width="2"/>
  <text x="740" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">θ_max (180°)</text>
</svg>
