<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Масив елементів Холла та обчислення кута через CORDIC в AS5048</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Диференціальне зчитування компенсує однорідні завади, формуючи Bx і By для CORDIC</text>

  <!-- Панель 1: Кристал і елементи Холла -->
  <rect x="30" y="75" width="290" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="175" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Кристал і масив Холла</text>
  <text x="175" y="118" font-size="12" fill="#6b7280" text-anchor="middle">4 елементи по колу (0°, 90°, 180°, 270°)</text>

  <!-- Кристал AS5048 -->
  <rect x="70" y="140" width="210" height="165" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="160" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Кристал AS5048</text>
  <circle cx="175" cy="245" r="55" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="175" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Магніт над кристалом</text>

  <!-- Давачі Холла -->
  <rect x="160" y="195" width="30" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="175" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hy+</text>

  <rect x="90" y="233" width="30" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="105" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hx-</text>

  <rect x="230" y="233" width="30" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="245" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hx+</text>

  <rect x="160" y="271" width="30" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="175" y="288" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hy-</text>

  <circle cx="175" cy="245" r="3" fill="#6b7280"/>

  <!-- Завадове поле -->
  <text x="175" y="316" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Однорідне поле завади B_stray</text>
  <line x1="50" y1="328" x2="300" y2="328" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-red)"/>
  <line x1="50" y1="342" x2="300" y2="342" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-red)"/>

  <!-- Блок пояснення сигналів -->
  <rect x="45" y="355" width="260" height="130" rx="6" fill="#fdecea" stroke="#f5c6cb" stroke-width="1.5"/>
  <text x="175" y="375" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Сигнали елементів:</text>
  <text x="175" y="396" font-size="12" fill="#1a1a1a" text-anchor="middle">Vx+ = V_корисне + V_завада</text>
  <text x="175" y="417" font-size="12" fill="#1a1a1a" text-anchor="middle">Vx- = -V_корисне + V_завада</text>
  <text x="175" y="442" font-size="12" fill="#6b7280" text-anchor="middle">Завадна компонента однакова</text>
  <text x="175" y="464" font-size="12" fill="#6b7280" text-anchor="middle">для всіх 4 сенсорів</text>

  <!-- Панель 2: Диференціальна обробка -->
  <rect x="335" y="75" width="290" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Диференціальна обробка</text>
  <text x="480" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Віднімання сигналів протилежних пар</text>

  <!-- Лінії передачі від П1 до П2 -->
  <line x1="320" y1="190" x2="445" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="385" y="180" font-size="12" fill="#2457d6" text-anchor="middle">Vx+, Vx-</text>

  <!-- Віднімач X -->
  <rect x="445" y="165" width="70" height="50" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="195" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Δ (X)</text>

  <line x1="515" y1="190" x2="640" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="560" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Bx = Vx+ - Vx-</text>

  <!-- Лінії передачі Y -->
  <line x1="320" y1="260" x2="445" y2="260" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="385" y="250" font-size="12" fill="#2457d6" text-anchor="middle">Vy+, Vy-</text>

  <!-- Віднімач Y -->
  <rect x="445" y="235" width="70" height="50" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="265" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Δ (Y)</text>

  <line x1="515" y1="260" x2="640" y2="260" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="560" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">By = Vy+ - Vy-</text>

  <!-- Зелений блок компенсації -->
  <rect x="350" y="310" width="260" height="175" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="332" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Принцип компенсації завад:</text>
  <text x="480" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">Bx = (V_корисне + V_завада) -</text>
  <text x="480" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">      (-V_корисне + V_завада)</text>
  <text x="480" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Bx = 2 · V_корисне  (V_завада = 0!)</text>
  <text x="480" y="420" font-size="12" fill="#6b7280" text-anchor="middle">Аналогічно для компоненти By</text>
  <text x="480" y="445" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Повне пригнічення B_stray</text>
  <text x="480" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">Стійкість до зовнішніх полів</text>

  <!-- Панель 3: Блок CORDIC та вихід -->
  <rect x="640" y="75" width="290" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Блок CORDIC та вихід</text>
  <text x="785" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Обчислення α = arctan2(By, Bx)</text>

  <!-- Блок CORDIC -->
  <rect x="660" y="145" width="250" height="150" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="785" y="168" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Векторне обчислення CORDIC</text>

  <!-- Міні-діаграма вектора -->
  <line x1="685" y1="250" x2="755" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="762" y="254" font-size="12" fill="#1a1a1a">Bx</text>

  <line x1="700" y1="265" x2="700" y2="195" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="692" y="190" font-size="12" fill="#1a1a1a">By</text>

  <line x1="700" y1="250" x2="740" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="725" y="222" font-size="12" font-weight="bold" fill="#2457d6">R</text>
  <path d="M 720 250 A 20 20 0 0 0 714 236" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="722" y="244" font-size="12" font-weight="bold" fill="#2457d6">α</text>

  <!-- Формули CORDIC справа -->
  <text x="845" y="200" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">α = arctan2(By, Bx)</text>
  <text x="845" y="225" font-size="12" fill="#6b7280" text-anchor="middle">R = √(Bx² + By²)</text>
  <text x="845" y="250" font-size="12" fill="#2457d6" text-anchor="middle">R → Контроль AGC</text>

  <!-- Стрілка від CORDIC до регістру -->
  <line x1="785" y1="295" x2="785" y2="315" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Блок вихідного регістру -->
  <rect x="660" y="315" width="250" height="80" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="785" y="337" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">14-бітне значення кута α</text>
  <text x="785" y="359" font-size="12" fill="#1a1a1a" text-anchor="middle">Роздільність: 0.022° (14 біт)</text>
  <text x="785" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Регістр ANGLE (0x3FFE / 0x3FFF)</text>

  <!-- Блок цифрові інтерфейси -->
  <rect x="660" y="410" width="250" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="430" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цифрові інтерфейси виводу:</text>
  <text x="785" y="450" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI (AS5048A)  |  I2C (AS5048B)</text>
  <text x="785" y="470" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ (PWM) + перевірка парності</text>
</svg>
