<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвеєрна затримка SPI-транзакцій в AS5048</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Результат виконання команди з кадру N повертається у шині MISO під час кадру N+1</text>

  <!-- Frame Boundary Vertical Grid Lines -->
  <line x1="185" y1="80" x2="185" y2="355" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="520" y1="80" x2="520" y2="355" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="565" y1="80" x2="565" y2="355" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="890" y1="80" x2="890" y2="355" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Frame Headers -->
  <rect x="190" y="80" width="330" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="355" y="96" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">КАДР N (16 клоків SCLK)</text>

  <rect x="560" y="80" width="330" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="725" y="96" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">КАДР N+1 (16 клоків SCLK)</text>

  <!-- CS Signal Line -->
  <text x="50" y="122" font-size="13" font-weight="bold" fill="#1a1a1a">CSn</text>
  <path d="M 120,110 L 175,110 L 185,128 L 520,128 L 530,110 L 555,110 L 565,128 L 890,128 L 900,110 L 930,110" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- MOSI Section -->
  <text x="50" y="165" font-size="13" font-weight="bold" fill="#1a1a1a">MOSI</text>
  <text x="50" y="182" font-size="11" fill="#6b7280">Майстер → AS5048</text>

  <!-- MOSI Frame N -->
  <rect x="190" y="140" width="330" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200" y="158" font-size="11" font-weight="bold" fill="#1a1a1a">Командний кадр N (Запит адреси)</text>

  <rect x="200" y="168" width="45" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="222.5" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">P</text>
  <text x="222.5" y="205" font-size="10" fill="#6b7280" text-anchor="middle">Бит 15</text>

  <rect x="250" y="168" width="55" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="277.5" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">RW=1</text>
  <text x="277.5" y="205" font-size="10" fill="#6b7280" text-anchor="middle">Бит 14</text>

  <rect x="310" y="168" width="200" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="410" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ADDR = 0x3FFF (ANGLE)</text>
  <text x="410" y="205" font-size="10" fill="#6b7280" text-anchor="middle">Біти 13..0 (Адреса)</text>

  <!-- MOSI Frame N+1 -->
  <rect x="560" y="140" width="330" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="570" y="158" font-size="11" font-weight="bold" fill="#1a1a1a">Командний кадр N+1 (Наступний запит)</text>

  <rect x="570" y="168" width="45" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="592.5" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">P</text>
  <text x="592.5" y="205" font-size="10" fill="#6b7280" text-anchor="middle">Бит 15</text>

  <rect x="620" y="168" width="55" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="647.5" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">RW=1</text>
  <text x="647.5" y="205" font-size="10" fill="#6b7280" text-anchor="middle">Бит 14</text>

  <rect x="680" y="168" width="200" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="780" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ADDR = 0x0000 (NOP)</text>
  <text x="780" y="205" font-size="10" fill="#6b7280" text-anchor="middle">Біти 13..0 (Адреса)</text>

  <!-- MISO Section -->
  <text x="50" y="290" font-size="13" font-weight="bold" fill="#1a1a1a">MISO</text>
  <text x="50" y="307" font-size="11" fill="#6b7280">AS5048 → Майстер</text>

  <!-- MISO Frame N -->
  <rect x="190" y="265" width="330" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200" y="283" font-size="11" font-weight="bold" fill="#6b7280">Кадр відповіді N (Дані запиту N-1)</text>

  <rect x="200" y="293" width="45" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="222.5" y="313" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">P</text>
  <text x="222.5" y="330" font-size="10" fill="#9ca3af" text-anchor="middle">Бит 15</text>

  <rect x="250" y="293" width="55" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="277.5" y="313" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">EF=0</text>
  <text x="277.5" y="330" font-size="10" fill="#9ca3af" text-anchor="middle">Бит 14</text>

  <rect x="310" y="293" width="200" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="410" y="313" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">DATA (з кадру N-1)</text>
  <text x="410" y="330" font-size="10" fill="#9ca3af" text-anchor="middle">Результат попередньої команди</text>

  <!-- MISO Frame N+1 (Highlighted Response) -->
  <rect x="560" y="265" width="330" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="570" y="283" font-size="11" font-weight="bold" fill="#27ae60">Кадр відповіді N+1 (Дані кута з кадру N)</text>

  <rect x="570" y="293" width="45" height="52" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="592.5" y="313" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">P</text>
  <text x="592.5" y="330" font-size="10" fill="#6b7280" text-anchor="middle">Бит 15</text>

  <rect x="620" y="293" width="55" height="52" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="647.5" y="313" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">EF=0</text>
  <text x="647.5" y="330" font-size="10" fill="#6b7280" text-anchor="middle">Бит 14</text>

  <rect x="680" y="293" width="200" height="52" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="780" y="313" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ANGLE DATA [13:0]</text>
  <text x="780" y="330" font-size="10" fill="#27ae60" text-anchor="middle">14-бітні дані кута з кадру N</text>

  <!-- Pipelined Delay Flow Arrow & Label -->
  <path d="M 410,220 C 410,248 435,260 465,260" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="5,4"/>
  <rect x="465" y="248" width="250" height="24" rx="12" fill="#2457d6"/>
  <text x="590" y="264" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Затримка отримання даних: 1 кадр</text>
  <path d="M 715,260 C 745,260 780,270 780,290" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>

  <!-- Legend & Bit Format Panel -->
  <rect x="50" y="380" width="860" height="105" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="70" y="402" font-size="12" font-weight="bold" fill="#2457d6">Формат кадру MOSI (Контролер → AS5048):</text>
  <text x="70" y="422" font-size="11" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Бит 15 (P):</tspan> Біт парності (парна кількість одиниць у кадрі)</text>
  <text x="70" y="440" font-size="11" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Бит 14 (RW):</tspan> Режим (1 = Читання регістру, 0 = Запис)</text>
  <text x="70" y="458" font-size="11" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Біти 13..0:</tspan> 14-бітна адреса (0x3FFF — реєстр кута ANGLE)</text>

  <text x="490" y="402" font-size="12" font-weight="bold" fill="#27ae60">Формат кадру MISO (AS5048 → Контролер):</text>
  <text x="490" y="422" font-size="11" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Бит 15 (P):</tspan> Біт парності відповіді</text>
  <text x="490" y="440" font-size="11" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Бит 14 (EF):</tspan> Прапорець помилки (1 = помилка у кадрі N-1)</text>
  <text x="490" y="458" font-size="11" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Біти 13..0:</tspan> 14-бітні дані відповіді на запит з кадру N-1</text>
</svg>
