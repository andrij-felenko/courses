<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Діагностика стану магнітного поля та AGC в AS5048</text>
  <text x="480" y="52" fill="#6b7280" font-size="13" text-anchor="middle">Аналіз регістра AGC та прапорців MAGH/MAGL для виявлення зносу підшипника</text>

  <!-- Main Plot Container Background -->
  <rect x="70" y="75" width="535" height="355" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>

  <!-- Zone Fill Backgrounds -->
  <!-- Top Zone: MAGL = 1 (Weak field) -->
  <rect x="151" y="95" width="424" height="70" fill="#fdecea" opacity="0.65"/>
  <!-- Middle Zone: Normal Operating Area -->
  <rect x="151" y="165" width="424" height="160" fill="#e9f7ef" opacity="0.65"/>
  <!-- Bottom Zone: MAGH = 1 (Strong field) -->
  <rect x="151" y="325" width="424" height="60" fill="#fdecea" opacity="0.65"/>

  <!-- Zone Threshold Lines -->
  <line x1="150" y1="165" x2="575" y2="165" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="150" y1="325" x2="575" y2="325" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <!-- Y-Axis -->
  <line x1="150" y1="385" x2="150" y2="90" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="82" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Регістр AGC</text>

  <!-- Y-Axis Ticks & Labels -->
  <line x1="145" y1="105" x2="150" y2="105" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="109" fill="#1a1a1a" font-size="12" text-anchor="end">255 (Max)</text>

  <line x1="145" y1="165" x2="150" y2="165" stroke="#c0392b" stroke-width="1.5"/>
  <text x="142" y="169" fill="#c0392b" font-size="12" text-anchor="end">AGC_HIGH</text>

  <line x1="145" y1="325" x2="150" y2="325" stroke="#c0392b" stroke-width="1.5"/>
  <text x="142" y="329" fill="#c0392b" font-size="12" text-anchor="end">AGC_LOW</text>

  <line x1="145" y1="385" x2="150" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="389" fill="#1a1a1a" font-size="12" text-anchor="end">0 (Min)</text>

  <!-- X-Axis -->
  <line x1="150" y1="385" x2="580" y2="385" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- X-Axis Ticks & Labels -->
  <line x1="220" y1="385" x2="220" y2="391" stroke="#c0392b" stroke-width="1.5"/>
  <text x="220" y="404" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">z_min</text>

  <line x1="360" y1="385" x2="360" y2="391" stroke="#27ae60" stroke-width="1.5"/>
  <text x="360" y="404" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">z₀ (номінал)</text>

  <line x1="500" y1="385" x2="500" y2="391" stroke="#c0392b" stroke-width="1.5"/>
  <text x="500" y="404" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">z_max</text>

  <text x="360" y="422" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Осьова відстань до магніту z (мм)</text>

  <!-- Vertical Position Guide Lines -->
  <line x1="220" y1="325" x2="220" y2="385" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="360" y1="245" x2="360" y2="385" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="500" y1="165" x2="500" y2="385" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Diagnostic Zone Descriptions inside Plot -->
  <!-- Top Zone: MAGL = 1 -->
  <text x="165" y="112" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="start">ЗОНА MAGL = 1 (Слабке магнітне поле)</text>
  <text x="165" y="128" fill="#6b7280" font-size="12" text-anchor="start">AGC = 255 • ризик втрати сигналу</text>

  <!-- Middle Zone: Normal -->
  <text x="165" y="190" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="start">НОРМАЛЬНА РОБОЧА ЗОНА</text>
  <text x="165" y="208" fill="#1a1a1a" font-size="12" text-anchor="start">MAGH = 0, MAGL = 0 (Норма)</text>
  <text x="165" y="226" fill="#6b7280" font-size="12" text-anchor="start">14-біт точність кута</text>

  <!-- Bottom Zone: MAGH = 1 -->
  <text x="368" y="344" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="start">ЗОНА MAGH = 1</text>
  <text x="368" y="360" fill="#1a1a1a" font-size="12" text-anchor="start">Поле занадто сильне</text>
  <text x="368" y="376" fill="#6b7280" font-size="12" text-anchor="start">AGC на мінімумі (0)</text>

  <!-- Allowable Mechanical Play Range Indicator -->
  <line x1="225" y1="300" x2="495" y2="300" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-left)" marker-end="url(#arr-green)"/>
  <text x="368" y="292" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="start">Допустимий люфт Δz</text>

  <!-- Wear & Drift Annotation -->
  <path d="M 410,210 Q 445,190 475,178" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="490" y="150" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="end">Дрейф AGC (знос підшипника)</text>

  <!-- Main Characteristic AGC Curve -->
  <path d="M 180,365 C 200,345 210,335 220,325 C 275,285 305,265 360,245 C 415,225 445,205 500,165 C 515,150 530,135 540,125" fill="none" stroke="#2457d6" stroke-width="3.5"/>

  <!-- Key Operating Points on Curve -->
  <circle cx="220" cy="325" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="360" cy="245" r="6" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="165" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>

  <!-- Diagnostic Status Panel Cards (Right Panel) -->
  <!-- Card 1: MAGL = 1 -->
  <rect x="625" y="75" width="305" height="105" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="637" y="87" width="80" height="22" fill="#c0392b" rx="4"/>
  <text x="677" y="102" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MAGL = 1</text>
  <text x="727" y="102" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="start">Поле заслабке</text>
  <text x="637" y="127" fill="#1a1a1a" font-size="12" text-anchor="start">• Причина: збільшення зазору z</text>
  <text x="637" y="145" fill="#1a1a1a" font-size="12" text-anchor="start">• Діагноз: знос підшипника / люфт</text>
  <text x="637" y="163" fill="#6b7280" font-size="12" text-anchor="start">• Стан AGC: максимум (255)</text>

  <!-- Card 2: Normal / OK -->
  <rect x="625" y="195" width="305" height="105" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="637" y="207" width="80" height="22" fill="#27ae60" rx="4"/>
  <text x="677" y="222" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">НОРМА</text>
  <text x="727" y="222" fill="#27ae60" font-size="13" font-weight="bold" text-anchor="start">Оптимальне поле</text>
  <text x="637" y="247" fill="#1a1a1a" font-size="12" text-anchor="start">• Прапорці: MAGH = 0, MAGL = 0</text>
  <text x="637" y="265" fill="#1a1a1a" font-size="12" text-anchor="start">• Точність: 14 біт без спотворень</text>
  <text x="637" y="283" fill="#6b7280" font-size="12" text-anchor="start">• Стан AGC: у робочому вікні</text>

  <!-- Card 3: MAGH = 1 -->
  <rect x="625" y="315" width="305" height="105" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="637" y="327" width="80" height="22" fill="#c0392b" rx="4"/>
  <text x="677" y="342" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">MAGH = 1</text>
  <text x="727" y="342" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="start">Поле засильне</text>
  <text x="637" y="367" fill="#1a1a1a" font-size="12" text-anchor="start">• Причина: зменшення зазору z</text>
  <text x="637" y="385" fill="#1a1a1a" font-size="12" text-anchor="start">• Діагноз: притискання / зсув</text>
  <text x="637" y="403" fill="#6b7280" font-size="12" text-anchor="start">• Стан AGC: мінімум (0)</text>

  <!-- Bottom Application Banner -->
  <rect x="70" y="442" width="860" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="88" y="460" fill="#2457d6" font-size="12" font-weight="bold" text-anchor="start">Практичне застосування діагностики AGC в мікроконтролері:</text>
  <text x="88" y="479" fill="#1a1a1a" font-size="12" text-anchor="start">Безперервний моніторинг AGC дозволяє реалізувати Predictive Maintenance та виявити знос підшипника до аварії.</text>
</svg>
