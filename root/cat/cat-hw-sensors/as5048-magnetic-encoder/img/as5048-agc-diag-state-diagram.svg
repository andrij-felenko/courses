<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Діагностика магнітного поля та стан AGC в AS5048</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">AGC компенсує рівень сигналу, а прапорці COMPL та COMPH сигналізують про вихід за межі робочої зони</text>

  <!-- Upper Panel Container -->
  <rect x="40" y="80" width="880" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Upper Panel Header -->
  <text x="60" y="105" font-size="13" font-weight="bold" fill="#1a1a1a">Залежність підсилення AGC від поля (B)</text>
  <text x="880" y="105" text-anchor="end" font-size="12" fill="#6b7280">Регістр 0x3FFE: AGC [7:0], COMPL [9], COMPH [10]</text>

  <!-- Graph Background Zones -->
  <!-- Zone 1: Weak field (COMPL) -->
  <rect x="150" y="122" width="200" height="140" fill="#fdecea" opacity="0.7"/>
  <!-- Zone 2: Normal field (OK) -->
  <rect x="350" y="122" width="300" height="140" fill="#e9f7ef" opacity="0.7"/>
  <!-- Zone 3: Strong field (COMPH) -->
  <rect x="650" y="122" width="200" height="140" fill="#fdecea" opacity="0.7"/>

  <!-- Zone Headers inside Plot Area -->
  <text x="250" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Слабке поле (B &lt; B_min)</text>
  <text x="500" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Робочий діапазон (B_min...B_max)</text>
  <text x="750" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Сильне поле (B &gt; B_max)</text>

  <!-- Threshold Dashed Lines -->
  <line x1="350" y1="122" x2="350" y2="262" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="650" y1="122" x2="650" y2="262" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Threshold Labels on X-axis -->
  <text x="350" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">B_min (COMPL)</text>
  <text x="650" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">B_max (COMPH)</text>

  <!-- Coordinate Axes -->
  <!-- Y-axis -->
  <line x1="150" y1="262" x2="150" y2="122" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="142" y="206" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">AGC (0..255)</text>

  <!-- Y-axis Ticks -->
  <line x1="145" y1="160" x2="150" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <text x="142" y="164" text-anchor="end" font-size="12" fill="#1a1a1a">255 (MAX)</text>

  <line x1="145" y1="245" x2="150" y2="245" stroke="#1a1a1a" stroke-width="1"/>
  <text x="142" y="249" text-anchor="end" font-size="12" fill="#1a1a1a">0 (MIN)</text>

  <!-- X-axis -->
  <line x1="150" y1="262" x2="860" y2="262" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="860" y="285" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Поле B (mT)</text>

  <!-- AGC Curve -->
  <path d="M 150 160 L 350 160 C 430 165, 570 240, 650 245 L 850 245" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Dots on AGC Curve at Thresholds -->
  <circle cx="350" cy="160" r="4" fill="#2457d6"/>
  <circle cx="650" cy="245" r="4" fill="#2457d6"/>

  <!-- Curve Labels -->
  <text x="250" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AGC = 255 (Максимум)</text>
  <text x="540" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Регулювання (1...254)</text>
  <text x="750" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AGC = 0 (Мінімум)</text>

  <!-- Lower Panel: 3 Diagnostic Cards -->

  <!-- Card 1: Weak Field (COMPL=1) -->
  <rect x="40" y="335" width="280" height="195" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="40" y="335" width="280" height="32" rx="6" fill="#c0392b"/>
  <text x="180" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ПОМИЛКА: COMPL = 1</text>

  <text x="55" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">Стан AGC:</text>
  <text x="145" y="390" font-size="12" font-weight="bold" fill="#c0392b">255 (Max saturation)</text>

  <text x="55" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Прапорці:</text>
  <text x="145" y="414" font-size="12" fill="#1a1a1a">COMPL=1, COMPH=0</text>

  <text x="55" y="440" font-size="12" font-weight="bold" fill="#1a1a1a">Причина:</text>
  <text x="55" y="458" font-size="12" fill="#6b7280">Поле слабке / зазор завеликий</text>

  <text x="55" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Дія:</text>
  <text x="55" y="502" font-size="12" font-weight="bold" fill="#c0392b">Зменшити повітряний зазор</text>

  <!-- Card 2: Optimal Field (OK) -->
  <rect x="340" y="335" width="280" height="195" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="340" y="335" width="280" height="32" rx="6" fill="#27ae60"/>
  <text x="480" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">НОРМА: COMPL=0, COMPH=0</text>

  <text x="355" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">Стан AGC:</text>
  <text x="445" y="390" font-size="12" font-weight="bold" fill="#27ae60">1...254 (Оптимально)</text>

  <text x="355" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Прапорці:</text>
  <text x="445" y="414" font-size="12" fill="#1a1a1a">COMPL=0, COMPH=0</text>

  <text x="355" y="440" font-size="12" font-weight="bold" fill="#1a1a1a">Причина:</text>
  <text x="355" y="458" font-size="12" fill="#6b7280">Поле в нормі (0.5...2.5 мм)</text>

  <text x="355" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Дія:</text>
  <text x="355" y="502" font-size="12" font-weight="bold" fill="#27ae60">Дані кута 14-біт дійсно точні</text>

  <!-- Card 3: Strong Field (COMPH=1) -->
  <rect x="640" y="335" width="280" height="195" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="640" y="335" width="280" height="32" rx="6" fill="#c0392b"/>
  <text x="780" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ПОМИЛКА: COMPH = 1</text>

  <text x="655" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">Стан AGC:</text>
  <text x="745" y="390" font-size="12" font-weight="bold" fill="#c0392b">0 (Min saturation)</text>

  <text x="655" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Прапорці:</text>
  <text x="745" y="414" font-size="12" fill="#1a1a1a">COMPL=0, COMPH=1</text>

  <text x="655" y="440" font-size="12" font-weight="bold" fill="#1a1a1a">Причина:</text>
  <text x="655" y="458" font-size="12" fill="#6b7280">Поле занадто сильне / зазор малий</text>

  <text x="655" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Дія:</text>
  <text x="655" y="502" font-size="12" font-weight="bold" fill="#c0392b">Збільшити повітряний зазор</text>
</svg>
