<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутовий розсинхрон енкодера AS5048: вектори Id/Iq та деградація моменту FOC</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Похибка кута Δθe розщеплює вектор струму Is: вихідний момент падає за косинусом, а вісь Id спричиняє перегрів</text>

  <!-- ЛІВА ПАНЕЛЬ: Векторна діаграма d-q -->
  <rect x="24" y="68" width="444" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="246" y="92" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вектори струму в системі координат d–q</text>
  <text x="246" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Розклад струму статора Is при кутовій похибці Δθe = 30°</text>

  <!-- Осі координат d-q -->
  <!-- Вісь +q (вертикальна) -->
  <line x1="160" y1="310" x2="160" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="160" y="137" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+q (вісь моменту)</text>

  <!-- Вісь +d (горизонтальна) -->
  <line x1="100" y1="280" x2="350" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="355" y="275" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">+d (вісь потоку)</text>

  <!-- Початок координат 0 -->
  <circle cx="160" cy="280" r="3" fill="#1a1a1a"/>
  <text x="148" y="295" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Ідеальний вектор при Δθe = 0 -->
  <line x1="160" y1="280" x2="160" y2="158" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="148" y="166" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Iq = Is (ідеал, Δθe = 0)</text>

  <!-- Реальний заданий вектор Is при зміщенні Δθe = 30° -->
  <line x1="160" y1="280" x2="222" y2="173" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="232" y="170" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Is (заданий струм)</text>

  <!-- Проекція на вісь q (корисний струм Iq) -->
  <line x1="222" y1="173" x2="160" y2="173" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="160" y1="280" x2="160" y2="176" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="148" y="215" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Iq = Is · cos(Δθe)</text>
  <text x="148" y="231" font-size="12" fill="#27ae60" text-anchor="end">момент (86.6%)</text>

  <!-- Проекція на вісь d (паразитний струм Id) -->
  <line x1="222" y1="173" x2="222" y2="280" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="160" y1="280" x2="219" y2="280" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr-red)"/>
  <text x="228" y="302" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Id = Is · sin(Δθe)</text>
  <text x="228" y="318" font-size="12" fill="#c0392b" text-anchor="start">паразитний нагрів (50%)</text>

  <!-- Кутова похибка Δθe (дуга) -->
  <path d="M 160 230 A 50 50 0 0 1 185 236.7" stroke="#c0392b" stroke-width="1.8" fill="none"/>
  <text x="175" y="218" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Δθe</text>

  <!-- Картки порівняння внизу лівої панелі -->
  <!-- Картка 1: Ідеальний стан -->
  <rect x="38" y="348" width="200" height="116" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="138" y="370" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Узгоджений нуль (Δθe = 0°)</text>
  <text x="138" y="392" font-size="12" fill="#1a1a1a" text-anchor="middle">Iq = 100% · Is (макс. момент)</text>
  <text x="138" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">Id = 0 (нуль паразитного струму)</text>
  <text x="138" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">ККД максимальний, нагрів мін.</text>
  <text x="138" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Оптимальний режим FOC</text>

  <!-- Картка 2: Помилка 30° -->
  <rect x="252" y="348" width="202" height="116" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="353" y="370" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кутовий зсув (Δθe = 30°)</text>
  <text x="353" y="392" font-size="12" fill="#1a1a1a" text-anchor="middle">Iq = 86.6% · Is (втрата 13.4% T)</text>
  <text x="353" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">Id = 50.0% · Is (демагнітизація)</text>
  <text x="353" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">Марні теплові втрати I²R</text>
  <text x="353" y="452" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">✗ Зниження тяги й перегрів</text>

  <!-- ПРАВА ПАНЕЛЬ: Графік залежності -->
  <rect x="492" y="68" width="444" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="714" y="92" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність моменту й струму від похибки енкодера</text>
  <text x="714" y="110" font-size="12" fill="#6b7280" text-anchor="middle">T(Δθe) = Tmax · cos(Δθe) та паразитний струм |Id| = Is · sin(|Δθe|)</text>

  <!-- Сітка графіка: горизонтальні лінії -->
  <line x1="534" y1="150" x2="894" y2="150" stroke="#d0d7de" stroke-width="1"/>
  <line x1="534" y1="190" x2="894" y2="190" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="534" y1="230" x2="894" y2="230" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="534" y1="270" x2="894" y2="270" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="534" y1="310" x2="894" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Сітка графіка: вертикальні лінії -->
  <line x1="534" y1="150" x2="534" y2="310" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="594" y1="150" x2="594" y2="310" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="654" y1="150" x2="654" y2="310" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="714" y1="150" x2="714" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="774" y1="150" x2="774" y2="310" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="834" y1="150" x2="834" y2="310" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="894" y1="150" x2="894" y2="310" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Підписи осі Y (відсотки) -->
  <text x="526" y="154" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
  <text x="526" y="194" font-size="12" fill="#6b7280" text-anchor="end">75%</text>
  <text x="526" y="234" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
  <text x="526" y="274" font-size="12" fill="#6b7280" text-anchor="end">25%</text>
  <text x="526" y="314" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

  <!-- Засічки осі X -->
  <line x1="534" y1="310" x2="534" y2="315" stroke="#1a1a1a"/>
  <line x1="594" y1="310" x2="594" y2="315" stroke="#1a1a1a"/>
  <line x1="654" y1="310" x2="654" y2="315" stroke="#1a1a1a"/>
  <line x1="714" y1="310" x2="714" y2="315" stroke="#1a1a1a"/>
  <line x1="774" y1="310" x2="774" y2="315" stroke="#1a1a1a"/>
  <line x1="834" y1="310" x2="834" y2="315" stroke="#1a1a1a"/>
  <line x1="894" y1="310" x2="894" y2="315" stroke="#1a1a1a"/>

  <!-- Підписи осі X -->
  <text x="534" y="328" font-size="12" fill="#6b7280" text-anchor="middle">-90°</text>
  <text x="594" y="328" font-size="12" fill="#6b7280" text-anchor="middle">-60°</text>
  <text x="654" y="328" font-size="12" fill="#6b7280" text-anchor="middle">-30°</text>
  <text x="714" y="328" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0°</text>
  <text x="774" y="328" font-size="12" fill="#6b7280" text-anchor="middle">+30°</text>
  <text x="834" y="328" font-size="12" fill="#6b7280" text-anchor="middle">+60°</text>
  <text x="894" y="328" font-size="12" fill="#6b7280" text-anchor="middle">+90°</text>
  <text x="714" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутова похибка енкодера Δθe (електричні градуси)</text>

  <!-- Крива моменту T (зелена суцільна) -->
  <polyline points="534.0,310.0 544.0,296.1 554.0,282.2 564.0,268.6 574.0,255.3 584.0,242.4 594.0,230.0 604.0,218.2 614.0,207.2 624.0,196.9 634.0,187.4 644.0,178.9 654.0,171.4 664.0,165.0 674.0,159.6 684.0,155.5 694.0,152.4 704.0,150.6 714.0,150.0 724.0,150.6 734.0,152.4 744.0,155.5 754.0,159.6 764.0,165.0 774.0,171.4 784.0,178.9 794.0,187.4 804.0,196.9 814.0,207.2 824.0,218.2 834.0,230.0 844.0,242.4 854.0,255.3 864.0,268.6 874.0,282.2 884.0,296.1 894.0,310.0" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Крива паразитного струму Id (червона пунктирна) -->
  <polyline points="534.0,150.0 544.0,150.6 554.0,152.4 564.0,155.5 574.0,159.6 584.0,165.0 594.0,171.4 604.0,178.9 614.0,187.4 624.0,196.9 634.0,207.2 644.0,218.2 654.0,230.0 664.0,242.4 674.0,255.3 684.0,268.6 694.0,282.2 704.0,296.1 714.0,310.0 724.0,296.1 734.0,282.2 744.0,268.6 754.0,255.3 764.0,242.4 774.0,230.0 784.0,218.2 794.0,207.2 804.0,196.9 814.0,187.4 824.0,178.9 834.0,171.4 844.0,165.0 854.0,159.6 864.0,155.5 874.0,152.4 884.0,150.6 894.0,150.0" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Маркери робочих точок на графіку -->
  <!-- Точка 0° (максимум) -->
  <circle cx="714" cy="150" r="4.5" fill="#27ae60"/>
  <text x="714" y="139" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">T = 100% (максимум)</text>

  <!-- Маркер для +30° -->
  <line x1="774" y1="171.4" x2="774" y2="310" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="774" cy="171.4" r="3.5" fill="#27ae60"/>
  <text x="764" y="166" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">86.6% T</text>
  <circle cx="774" cy="230" r="3.5" fill="#c0392b"/>
  <text x="764" y="246" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">50% Id</text>

  <!-- Точка 90° (зрив) -->
  <circle cx="894" cy="310" r="4.5" fill="#c0392b"/>
  <text x="886" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">T = 0</text>

  <!-- Блок пояснення та легенди внизу правої панелі -->
  <rect x="506" y="360" width="416" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Рядок 1 легенди: Момент -->
  <line x1="520" y1="384" x2="550" y2="384" stroke="#27ae60" stroke-width="3"/>
  <circle cx="535" cy="384" r="3.5" fill="#27ae60"/>
  <text x="558" y="388" font-size="12" font-weight="bold" fill="#27ae60">T = Tmax · cos(Δθe) — корисний вихідний момент</text>
  <text x="558" y="406" font-size="12" fill="#1a1a1a">При |Δθe| &gt; 30° тяга різко спадає, а при 90° падає до 0</text>

  <!-- Рядок 2 легенди: Паразитний струм -->
  <line x1="520" y1="428" x2="550" y2="428" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="535" cy="428" r="3.5" fill="#c0392b"/>
  <text x="558" y="432" font-size="12" font-weight="bold" fill="#c0392b">|Id| = Is · sin(|Δθe|) — паразитна демагнітизація</text>
  <text x="558" y="450" font-size="12" fill="#c0392b">Струм Id не створює тяги, а лише перегріває обмотки</text>
</svg>
