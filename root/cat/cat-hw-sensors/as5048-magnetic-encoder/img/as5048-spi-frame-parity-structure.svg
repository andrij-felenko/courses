<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура 16-бітного SPI-кадру AS5048 та перевірка цілісності</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Біт парності PAR гарантує цілісність кадру, а прапорець EF сигналізує про апаратний збій</text>

  <!-- Panel 1: Frame Structure -->
  <rect x="40" y="80" width="880" height="110" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="102" font-size="13" font-weight="bold" fill="#1a1a1a">16-бітний кадр MISO (AS5048 → Мікроконтролер):</text>

  <!-- Bit 15 (PAR) -->
  <rect x="60" y="115" width="70" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="95" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">[15]</text>
  <text x="95" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">PAR</text>
  <text x="95" y="179" text-anchor="middle" font-size="12" fill="#2457d6">Парність</text>

  <!-- Bit 14 (EF) -->
  <rect x="142" y="115" width="70" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="177" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">[14]</text>
  <text x="177" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">EF</text>
  <text x="177" y="179" text-anchor="middle" font-size="12" fill="#c0392b">Помилка</text>

  <!-- Bits 13:0 (DATA) -->
  <rect x="224" y="115" width="676" height="46" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="562" y="133" text-anchor="middle" font-size="12" fill="#6b7280">[13 : 0]</text>
  <text x="562" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">DATA[13:0] — Дані кутового положення (0..16383)</text>
  <text x="562" y="179" text-anchor="middle" font-size="12" fill="#6b7280">14 біт корисного навантаження кадру</text>

  <!-- Connectors from Panel 1 to Panel 2 -->
  <line x1="250" y1="190" x2="250" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="260" y="211" font-size="12" fill="#2457d6">Перевірка 16 біт</text>

  <line x1="710" y1="190" x2="710" y2="225" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="720" y="211" font-size="12" fill="#c0392b">Перевірка біта EF</text>

  <!-- Panel 2: Diagnostics Engine -->
  <!-- Block 2A: Parity Check -->
  <rect x="40" y="225" width="420" height="130" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">1. Контроль парності кадру (Even Parity)</text>
  <text x="250" y="275" text-anchor="middle" font-size="12" fill="#1a1a1a">Обчислення XOR суми всіх 16 бітів:</text>
  <rect x="80" y="287" width="340" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">PAR ⊕ EF ⊕ D13 ⊕ ... ⊕ D0 == 0</text>
  <text x="250" y="340" text-anchor="middle" font-size="12" fill="#6b7280">Результат має бути 0 (парне число одиниць)</text>

  <!-- Block 2B: Error Flag Check -->
  <rect x="500" y="225" width="420" height="130" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="710" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">2. Контроль апаратного прапорця (EF)</text>
  <text x="710" y="275" text-anchor="middle" font-size="12" fill="#1a1a1a">Перевірка прапорця помилки в біті 14:</text>
  <rect x="540" y="287" width="340" height="30" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="710" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">EF == 0 (Норма)  /  EF == 1 (Помилка)</text>
  <text x="710" y="340" text-anchor="middle" font-size="12" fill="#6b7280">Сигналізує про збій AGC або хибну команду</text>

  <!-- Connectors from Panel 2 to Panel 3 -->
  <line x1="250" y1="355" x2="250" y2="390" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="260" y="376" font-size="12" fill="#27ae60">Кадр коректний</text>

  <line x1="710" y1="355" x2="710" y2="390" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="720" y="376" font-size="12" fill="#c0392b">Збій цілісності</text>

  <!-- Panel 3: Action Outcomes -->
  <!-- Block 3A: Valid Frame Handler -->
  <rect x="40" y="390" width="420" height="100" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="250" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✓ Дійсний кадр (PAR OK &amp; EF = 0)</text>
  <rect x="60" y="426" width="380" height="26" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="250" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">raw_angle = frame &amp; 0x3FFF</text>
  <text x="250" y="474" text-anchor="middle" font-size="12" fill="#27ae60">Оновлення кута у контурі керування motor_control()</text>

  <!-- Block 3B: Corrupt Frame Handler -->
  <rect x="500" y="390" width="420" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="710" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">✗ Помилка кадру (PAR Error або EF = 1)</text>
  <rect x="520" y="426" width="380" height="26" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="710" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Відкидання пакета + Increment error_cnt</text>
  <text x="710" y="474" text-anchor="middle" font-size="12" fill="#c0392b">Зчитування 0x0001 (Clear Error Flag) при EF=1</text>
</svg>
