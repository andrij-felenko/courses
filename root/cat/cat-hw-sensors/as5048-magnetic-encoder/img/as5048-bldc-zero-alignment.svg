<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Узгодження нуля AS5048 з електричним нулем BLDC (Zero Offset)</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація ротора вектором Iα &gt; 0 визначає кут θoffset між механічним та електричним нулем</text>

  <!-- Panel 1: Geometry Diagram -->
  <rect x="20" y="75" width="520" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="35" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Фізична геометрія статора, ротора та давача AS5048</text>

  <!-- Motor Stator Circles -->
  <circle cx="175" cy="240" r="90" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="175" cy="240" r="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Stator Phase Poles -->
  <!-- Phase A Pole (0 deg, Right) -->
  <rect x="234" y="224" width="32" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A</text>

  <!-- Phase B Pole (120 deg, Top-Left) -->
  <text x="137.5" y="142" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Фаза B</text>
  <rect x="121.5" y="159" width="32" height="32" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="137.5" y="179" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">B</text>

  <!-- Phase C Pole (240 deg, Bottom-Left) -->
  <rect x="121.5" y="289" width="32" height="32" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="137.5" y="309" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">C</text>
  <text x="137.5" y="344" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Фаза C</text>

  <!-- Rotor Body -->
  <circle cx="175" cy="240" r="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Permanent Magnet N-S -->
  <rect x="175" y="227" width="30" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="190" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N</text>
  <rect x="145" y="227" width="30" height="26" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="244" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">S</text>

  <!-- Shaft and Center Cross -->
  <circle cx="175" cy="240" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="240" x2="180" y2="240" stroke="#6b7280" stroke-width="1"/>
  <line x1="175" y1="235" x2="175" y2="245" stroke="#6b7280" stroke-width="1"/>

  <!-- Phase A Axis / Test Current Vector Ialpha (theta_e = 0) -->
  <line x1="175" y1="240" x2="300" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="240" x2="370" y2="240" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="380" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Вектор Iα (θe = 0°)</text>
  <text x="380" y="253" font-size="12" fill="#2457d6" text-anchor="start">Вісь фази A</text>

  <!-- AS5048 Mechanical Zero Axis (theta_m = 0) -->
  <line x1="175" y1="240" x2="270" y2="126" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="280" y="122" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Нуль AS5048 (θm = 0°)</text>
  <text x="280" y="138" font-size="12" fill="#27ae60" text-anchor="start">Механічна вісь давача</text>

  <!-- Angle Offset Arc and Label -->
  <path d="M 245 240 A 70 70 0 0 0 220 186.4" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="280" y="172" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Кутовий зсув θoffset</text>
  <text x="280" y="188" font-size="12" fill="#c0392b" text-anchor="start">= θm,виміряний</text>

  <!-- Panel 1 Callout Box -->
  <rect x="35" y="390" width="490" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="50" y="412" font-size="12" fill="#1a1a1a" text-anchor="start">Режим калібрування: струм Iα &gt; 0 фіксує ротор у положенні θe = 0°</text>
  <text x="50" y="432" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Виміряний кут давача у цей момент дорівнює кутовому зсуву θoffset</text>

  <!-- Panel 2: Process & Math -->
  <rect x="560" y="75" width="380" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="575" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Алгоритм та компенсація зсуву</text>

  <!-- Step 1 Box -->
  <rect x="575" y="112" width="350" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="590" y="132" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">1. Фіксація та вимірювання</text>
  <text x="590" y="152" font-size="12" fill="#1a1a1a" text-anchor="start">• Подача Ud = Utest, Uq = 0 (фіксація θe = 0°)</text>
  <text x="590" y="170" font-size="12" fill="#6b7280" text-anchor="start">• Очікування затухання перехідного процесу</text>
  <text x="590" y="188" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• Зчитування θoffset = AS5048_ReadRawAngle()</text>

  <!-- Step 2 Box -->
  <rect x="575" y="216" width="350" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="590" y="236" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">2. Збереження нульового зсуву</text>
  <text x="590" y="256" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Апаратний спосіб (OTP AS5048):</text>
  <text x="602" y="272" font-size="12" fill="#6b7280" text-anchor="start">Запис θoffset у регістри ZPOSM / ZPOSL</text>
  <text x="590" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Програмний спосіб (MCU Flash):</text>
  <text x="602" y="306" font-size="12" fill="#6b7280" text-anchor="start">Віднімання θoffset у кожному циклі ШІМ</text>

  <!-- Step 3 Box -->
  <rect x="575" y="332" width="350" height="114" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="590" y="352" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">3. Перерахунок для FOC в перериванні</text>
  <text x="590" y="372" font-size="12" fill="#1a1a1a" text-anchor="start">Механічний кут: θm = AS5048_GetAngle()</text>
  <text x="590" y="394" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Електричний кут: θe = Np · (θm - θoffset)</text>
  <text x="590" y="414" font-size="12" fill="#6b7280" text-anchor="start">де Np — кількість пар магнітних полюсів</text>
  <text x="590" y="432" font-size="12" fill="#6b7280" text-anchor="start">Вхідні дані для перетворень Кларк і Парка</text>
</svg>
