<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перетворення механічного зміщення в 16-бітний код ADXL345 (Full Resolution)</text>
  <text x="480" y="64" font-size="13" fill="#6b7280" text-anchor="middle">Режим Full Resolution зберігає постійну чутливість 4 мг/МЗР для всіх діапазонів (±2g...±16g)</text>

  <!-- TOP PIPELINE STAGES -->

  <!-- Block 1: MEMS Sensor -->
  <rect x="20" y="85" width="190" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="20" y="85" width="190" height="32" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <rect x="20" y="111" width="190" height="6" fill="#eaf0fd"/>
  <line x1="20" y1="117" x2="210" y2="117" stroke="#d0d7de" stroke-width="1"/>
  <text x="115" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. MEMS-ядро</text>
  <text x="115" y="135" font-size="12" fill="#1a1a1a" text-anchor="middle">Прискорення a_x</text>
  <!-- Moving Mass graphic -->
  <rect x="60" y="147" width="110" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="115" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зміщення Δx</text>
  <text x="115" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Ємнісний зсув ΔC</text>
  <text x="115" y="226" font-size="12" fill="#6b7280" text-anchor="middle">(рухомі обкладки)</text>

  <!-- Arrow 1 -> Block 2 -->
  <line x1="210" y1="175" x2="250" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="230" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔC</text>

  <!-- Block 2: C/V & 13-bit ADC -->
  <rect x="250" y="85" width="195" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="250" y="85" width="195" height="32" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <rect x="250" y="111" width="195" height="6" fill="#eaf0fd"/>
  <line x1="250" y1="117" x2="445" y2="117" stroke="#d0d7de" stroke-width="1"/>
  <text x="347.5" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. C/V та АЦП</text>
  <rect x="265" y="132" width="165" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="347.5" y="151" font-size="12" fill="#1a1a1a" text-anchor="middle">Перетворювач C/V</text>
  <line x1="347.5" y1="162" x2="347.5" y2="174" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="265" y="178" width="165" height="32" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="347.5" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">13-бітний АЦП</text>
  <text x="347.5" y="232" font-size="12" fill="#6b7280" text-anchor="middle">Максимальна розрядність</text>

  <!-- Arrow 2 -> Block 3 -->
  <line x1="445" y1="175" x2="490" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="467.5" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">13 біт</text>

  <!-- Block 3: Full Resolution Scaling -->
  <rect x="490" y="85" width="210" height="180" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="490" y="85" width="210" height="32" fill="#27ae60" stroke="#27ae60" stroke-width="1" rx="6"/>
  <rect x="490" y="111" width="210" height="6" fill="#27ae60"/>
  <text x="595" y="106" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Full Resolution</text>
  <text x="595" y="133" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">FULL_RES = 1 (DATA_FORMAT)</text>
  <text x="595" y="153" font-size="12" fill="#1a1a1a" text-anchor="middle">Фіксована чутливість:</text>
  <rect x="505" y="163" width="180" height="32" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="595" y="184" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">4 мг/МЗР (3.9 mg/LSB)</text>
  <text x="595" y="215" font-size="12" fill="#6b7280" text-anchor="middle">Розрядність зростає з g</text>
  <text x="595" y="235" font-size="12" fill="#6b7280" text-anchor="middle">(10 біт ±2g ... 13 біт ±16g)</text>

  <!-- Arrow 3 -> Block 4 -->
  <line x1="700" y1="175" x2="750" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="725" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Масштаб</text>

  <!-- Block 4: Output Data Formatting -->
  <rect x="750" y="85" width="190" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="750" y="85" width="190" height="32" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <rect x="750" y="111" width="190" height="6" fill="#eaf0fd"/>
  <line x1="750" y1="117" x2="940" y2="117" stroke="#d0d7de" stroke-width="1"/>
  <text x="845" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Форматування 16 біт</text>
  <rect x="760" y="132" width="170" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="845" y="151" font-size="12" fill="#1a1a1a" text-anchor="middle">Знакове розширення</text>
  <line x1="845" y1="162" x2="845" y2="174" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <rect x="760" y="178" width="170" height="40" rx="4" fill="#2457d6"/>
  <text x="845" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DATAx0 / DATAx1</text>
  <text x="845" y="210" font-size="12" fill="#eaf0fd" text-anchor="middle">16-бітний знаковий код</text>
  <text x="845" y="237" font-size="12" fill="#6b7280" text-anchor="middle">(2's Complement format)</text>


  <!-- BOTTOM PANELS -->

  <!-- Left Panel: 16-bit Register Word Structure -->
  <rect x="20" y="285" width="450" height="250" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="20" y="285" width="450" height="30" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="20" y="309" width="450" height="6" fill="#f4f6f8"/>
  <line x1="20" y1="315" x2="470" y2="315" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="305" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура 16-бітного слова даних у режимі Full Resolution</text>

  <!-- Bit Indices Row -->
  <text x="66.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">15</text>
  <text x="89.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">14</text>
  <text x="112.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">13</text>
  <text x="135.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">12</text>
  <text x="158.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">11</text>
  <text x="181.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
  <text x="204.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">9</text>
  <text x="227.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">8</text>
  <text x="250.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
  <text x="273.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
  <text x="296.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
  <text x="319.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
  <text x="342.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
  <text x="365.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">2</text>
  <text x="388.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
  <text x="411.5" y="340" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <!-- Bit Cells -->
  <!-- D15..D13: Sign bits (red tint) -->
  <rect x="55" y="348" width="69" height="34" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="78" y1="348" x2="78" y2="382" stroke="#c0392b" stroke-width="1"/>
  <line x1="101" y1="348" x2="101" y2="382" stroke="#c0392b" stroke-width="1"/>

  <!-- D12..D0: Data bits (blue tint) -->
  <rect x="124" y="348" width="299" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="147" y1="348" x2="147" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="170" y1="348" x2="170" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="193" y1="348" x2="193" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="216" y1="348" x2="216" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="239" y1="348" x2="239" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="262" y1="348" x2="262" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="285" y1="348" x2="285" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="308" y1="348" x2="308" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="331" y1="348" x2="331" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="354" y1="348" x2="354" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="377" y1="348" x2="377" y2="382" stroke="#2457d6" stroke-width="1"/>
  <line x1="400" y1="348" x2="400" y2="382" stroke="#2457d6" stroke-width="1"/>

  <!-- Bit Field Labels -->
  <text x="89.5" y="400" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Знакові біти</text>
  <text x="89.5" y="422" font-size="12" fill="#c0392b" text-anchor="middle">(дублюють D12)</text>

  <text x="273.5" y="400" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">13 біт даних (при ±16g)</text>
  <text x="273.5" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">МЗР (LSB) = 4 мг/МЗР (постійна вага)</text>

  <!-- Register byte mapping block -->
  <rect x="40" y="445" width="410" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="245" y="466" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DATAx1 (0x33, 0x35, 0x37)  |  DATAx0 (0x32, 0x34, 0x36)</text>
  <text x="245" y="488" font-size="12" fill="#6b7280" text-anchor="middle">Старший байт (MSB)          Молодший байт (LSB)</text>


  <!-- Right Panel: Full Resolution vs 10-bit Comparison Table -->
  <rect x="490" y="285" width="450" height="250" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="490" y="285" width="450" height="30" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="490" y="309" width="450" height="6" fill="#f4f6f8"/>
  <line x1="490" y1="315" x2="940" y2="315" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="305" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики розрядності у режимі Full Resolution</text>

  <!-- Table Headers -->
  <rect x="505" y="325" width="420" height="26" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діапазон</text>
  <text x="620" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрядність</text>
  <text x="730" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Full Res (4 мг/МЗР)</text>
  <text x="860" y="342" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">10-бітний режим</text>

  <!-- Row 1: ±2g -->
  <rect x="505" y="351" width="420" height="24" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="367" font-size="12" fill="#1a1a1a" text-anchor="middle">±2 g</text>
  <text x="620" y="367" font-size="12" fill="#1a1a1a" text-anchor="middle">10 біт</text>
  <text x="730" y="367" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3.9 мг/МЗР (4 мг)</text>
  <text x="860" y="367" font-size="12" fill="#6b7280" text-anchor="middle">3.9 мг/МЗР</text>

  <!-- Row 2: ±4g -->
  <rect x="505" y="375" width="420" height="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="391" font-size="12" fill="#1a1a1a" text-anchor="middle">±4 g</text>
  <text x="620" y="391" font-size="12" fill="#1a1a1a" text-anchor="middle">11 біт</text>
  <text x="730" y="391" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3.9 мг/МЗР (4 мг)</text>
  <text x="860" y="391" font-size="12" fill="#c0392b" text-anchor="middle">7.8 мг/МЗР</text>

  <!-- Row 3: ±8g -->
  <rect x="505" y="399" width="420" height="24" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">±8 g</text>
  <text x="620" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">12 біт</text>
  <text x="730" y="415" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3.9 мг/МЗР (4 мг)</text>
  <text x="860" y="415" font-size="12" fill="#c0392b" text-anchor="middle">15.6 мг/МЗР</text>

  <!-- Row 4: ±16g -->
  <rect x="505" y="423" width="420" height="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="439" font-size="12" fill="#1a1a1a" text-anchor="middle">±16 g</text>
  <text x="620" y="439" font-size="12" fill="#1a1a1a" text-anchor="middle">13 біт</text>
  <text x="730" y="439" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3.9 мг/МЗР (4 мг)</text>
  <text x="860" y="439" font-size="12" fill="#c0392b" text-anchor="middle">31.2 мг/МЗР</text>

  <!-- Summary Box -->
  <rect x="505" y="457" width="420" height="66" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="715" y="476" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Перевага Full Resolution: чутливість не погіршується</text>
  <text x="715" y="498" font-size="12" fill="#2457d6" text-anchor="middle">при збільшенні діапазону вимірювання до ±16g!</text>
</svg>
