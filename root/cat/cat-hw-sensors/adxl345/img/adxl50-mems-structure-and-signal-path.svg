<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип дії диференціального ємнісного сенсора ADXL50</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Зміщення рухомої маси змінює зазори d₁ і d₂, створюючи різницю ємностей ΔC ∝ a</text>

  <!-- ================= ПАНЕЛЬ 1: СТАН СПОКОЮ (a = 0) ================= -->
  <rect x="30" y="80" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка панелі 1 -->
  <text x="247" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Стан спокою (a = 0)</text>
  <rect x="177" y="118" width="140" height="24" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Рівновага: C₁ = C₂</text>

  <!-- Анкери (Фіксовані кріплення) -->
  <text x="247" y="154" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>
  <rect x="217" y="162" width="60" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="217" y="362" width="60" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="247" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>

  <!-- Пружини / Підвіси -->
  <path d="M247,178 L247,183 L237,187 L257,192 L237,196 L247,200" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M247,340 L247,344 L237,348 L257,353 L237,357 L247,362" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Центральна рухома балка (Сейсмічна маса) -->
  <rect x="237" y="200" width="20" height="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Рухомий палець -->
  <rect x="257" y="260" width="115" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="314" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Рухомий палець</text>

  <!-- Фіксована обкладка 1 (CS1 - Верхня) -->
  <path d="M 150,225 L 372,225 L 372,195 L 390,195 L 390,240 L 150,240 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="270" y="188" font-size="12" font-weight="bold" fill="#c0392b">Фіксована обкладка 1 (CS₁)</text>

  <!-- Фіксована обкладка 2 (CS2 - Нижня) -->
  <path d="M 150,300 L 390,300 L 390,345 L 372,345 L 372,315 L 150,315 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="270" y="358" font-size="12" font-weight="bold" fill="#27ae60">Фіксована обкладка 2 (CS₂)</text>

  <!-- Позначення зазорів та ємностей в Панелі 1 -->
  <!-- Зазор d1 (від y=240 до y=260, висота 20px) -->
  <line x1="135" y1="240" x2="135" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="50" y="254" font-size="13" font-weight="bold" fill="#1a1a1a">d₁ = d₀</text>

  <!-- Зазор d2 (від y=280 до y=300, висота 20px) -->
  <line x1="135" y1="280" x2="135" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="50" y="294" font-size="13" font-weight="bold" fill="#1a1a1a">d₂ = d₀</text>

  <!-- Написи ємностей ліворуч -->
  <text x="50" y="215" font-size="13" font-weight="bold" fill="#c0392b">C₁ = C₀</text>
  <text x="50" y="335" font-size="13" font-weight="bold" fill="#27ae60">C₂ = C₀</text>

  <!-- Підпис рухомої маси -->
  <text x="247" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">Рухома сейсмічна маса</text>

  <!-- Підсумкова формула Панелі 1 -->
  <rect x="50" y="440" width="395" height="38" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="464" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ΔC = C₁ − C₂ = 0  (немає сигналу)</text>


  <!-- ================= ПАНЕЛЬ 2: ДІЯ ПРИСКОРЕННЯ (a > 0) ================= -->
  <rect x="495" y="80" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка панелі 2 -->
  <text x="712" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Прискорення (a &gt; 0)</text>
  <rect x="642" y="118" width="140" height="24" rx="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="134" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Разбаланс: C₂ &gt; C₁</text>

  <!-- Вектор прискорення a та інерційна сила Fin -->
  <!-- Прискорення a (вгору) -->
  <line x1="885" y1="175" x2="885" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="885" y="142" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">a (вгору)</text>

  <!-- Сила інерції Fin (вниз) -->
  <line x1="805" y1="150" x2="805" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="805" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">F_ін (вниз)</text>

  <!-- Анкери (Фіксовані) -->
  <text x="712" y="154" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>
  <rect x="682" y="162" width="60" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="682" y="362" width="60" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="712" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Анкер</text>

  <!-- Пружини (розтягнута зверху, стиснута знизу) -->
  <path d="M712,178 L712,185 L702,192 L722,200 L702,207 L712,212" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M712,352 L712,354 L702,356 L722,358 L702,360 L712,362" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Центральна рухома балка (зміщена вниз на 12px: y=212..352) -->
  <rect x="702" y="212" width="20" height="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Рухомий палець (зміщений вниз на 12px: top y=272, bottom y=292) -->
  <rect x="722" y="272" width="115" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="779" y="286" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зміщення Δx ↓</text>

  <!-- Фіксована обкладка 1 (CS1 - Верхня, нерухома) -->
  <path d="M 615,225 L 837,225 L 837,195 L 855,195 L 855,240 L 615,240 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="735" y="188" font-size="12" font-weight="bold" fill="#c0392b">Фіксована обкладка 1 (CS₁)</text>

  <!-- Фіксована обкладка 2 (CS2 - Нижня, нерухома) -->
  <path d="M 615,300 L 855,300 L 855,345 L 837,345 L 837,315 L 615,315 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="735" y="358" font-size="12" font-weight="bold" fill="#27ae60">Фіксована обкладка 2 (CS₂)</text>

  <!-- Позначення зазорів та ємностей в Панелі 2 -->
  <!-- Зазор d1 збільшився (від y=240 до y=272, висота 32px) -->
  <line x1="600" y1="240" x2="600" y2="272" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="515" y="260" font-size="13" font-weight="bold" fill="#c0392b">d₁ = d₀ + Δx</text>

  <!-- Зазор d2 зменшився (від y=292 до y=300, висота 8px) -->
  <line x1="600" y1="292" x2="600" y2="300" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="515" y="300" font-size="13" font-weight="bold" fill="#27ae60">d₂ = d₀ − Δx</text>

  <!-- Написи ємностей ліворуч -->
  <text x="515" y="215" font-size="13" font-weight="bold" fill="#c0392b">C₁ ↓ (менша)</text>
  <text x="515" y="335" font-size="13" font-weight="bold" fill="#27ae60">C₂ ↑ (більша)</text>

  <!-- Підпис рухомої маси -->
  <text x="712" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">Зсунута сейсмічна маса</text>

  <!-- Підсумкова формула Панелі 2 -->
  <rect x="515" y="440" width="395" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="464" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ΔC = C₂ − C₁ &gt; 0  (вихідний сигнал ∝ a)</text>
</svg>
