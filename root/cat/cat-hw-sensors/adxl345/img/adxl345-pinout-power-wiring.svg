<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розпіновка LGA-14 та схема підключення ADXL345</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Роздільне живлення VS і VDD_I/O з фільтраційними конденсаторами та перетворювачем рівнів</text>

  <!-- ЛІВА ПАНЕЛЬ: LGA-14 Pinout -->
  <rect x="24" y="75" width="376" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="212" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Призначення виводів (LGA-14)</text>
  <text x="212" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Корпус мікросхеми ADXL345 (вигляд зверху)</text>

  <!-- Корпус чіпа LGA-14 -->
  <rect x="142" y="140" width="140" height="300" rx="6" fill="#1a1a1a" stroke="#2457d6" stroke-width="2"/>
  <text x="212" y="285" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ADXL345</text>
  <text x="212" y="305" font-size="12" fill="#eaf0fd" text-anchor="middle">LGA-14 (3×5 мм)</text>
  <!-- Ключ виводу 1 -->
  <circle cx="156" cy="156" r="4" fill="#2457d6"/>

  <!-- Ліві контактні майданчики (всередині корпусу, x=142..150) -->
  <rect x="142" y="165" width="8" height="10" fill="#2457d6" rx="1"/>
  <rect x="142" y="205" width="8" height="10" fill="#6b7280" rx="1"/>
  <rect x="142" y="245" width="8" height="10" fill="#6b7280" rx="1"/>
  <rect x="142" y="285" width="8" height="10" fill="#6b7280" rx="1"/>
  <rect x="142" y="325" width="8" height="10" fill="#6b7280" rx="1"/>
  <rect x="142" y="365" width="8" height="10" fill="#2457d6" rx="1"/>
  <rect x="142" y="405" width="8" height="10" fill="#27ae60" rx="1"/>

  <!-- Ліві виводи 1..7 -->
  <line x1="86" y1="170" x2="142" y2="170" stroke="#2457d6" stroke-width="1.5"/>
  <text x="80" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">1: VDD_I/O</text>

  <line x1="86" y1="210" x2="142" y2="210" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="214" font-size="12" fill="#1a1a1a" text-anchor="end">2: GND</text>

  <line x1="86" y1="250" x2="142" y2="250" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="254" font-size="12" fill="#6b7280" text-anchor="end">3: RESERVED</text>

  <line x1="86" y1="290" x2="142" y2="290" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="294" font-size="12" fill="#1a1a1a" text-anchor="end">4: GND</text>

  <line x1="86" y1="330" x2="142" y2="330" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="334" font-size="12" fill="#1a1a1a" text-anchor="end">5: GND</text>

  <line x1="86" y1="370" x2="142" y2="370" stroke="#2457d6" stroke-width="1.5"/>
  <text x="80" y="374" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">6: VS</text>

  <line x1="86" y1="410" x2="142" y2="410" stroke="#27ae60" stroke-width="1.5"/>
  <text x="80" y="414" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">7: CS</text>

  <!-- Праві контактні майданчики (всередині корпусу, x=274..282) -->
  <rect x="274" y="165" width="8" height="10" fill="#27ae60" rx="1"/>
  <rect x="274" y="205" width="8" height="10" fill="#27ae60" rx="1"/>
  <rect x="274" y="245" width="8" height="10" fill="#1a1a1a" rx="1"/>
  <rect x="274" y="285" width="8" height="10" fill="#6b7280" rx="1"/>
  <rect x="274" y="325" width="8" height="10" fill="#6b7280" rx="1"/>
  <rect x="274" y="365" width="8" height="10" fill="#1a1a1a" rx="1"/>
  <rect x="274" y="405" width="8" height="10" fill="#1a1a1a" rx="1"/>

  <!-- Праві виводи 8..14 -->
  <line x1="282" y1="170" x2="338" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <text x="344" y="174" font-size="12" font-weight="bold" fill="#27ae60">14: SCL / SCLK</text>

  <line x1="282" y1="210" x2="338" y2="210" stroke="#27ae60" stroke-width="1.5"/>
  <text x="344" y="214" font-size="12" font-weight="bold" fill="#27ae60">13: SDA / SDI</text>

  <line x1="282" y1="250" x2="338" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="344" y="254" font-size="12" fill="#1a1a1a">12: SDO / ALT</text>

  <line x1="282" y1="290" x2="338" y2="290" stroke="#6b7280" stroke-width="1.5"/>
  <text x="344" y="294" font-size="12" fill="#6b7280">11: Reserved</text>

  <line x1="282" y1="330" x2="338" y2="330" stroke="#6b7280" stroke-width="1.5"/>
  <text x="344" y="334" font-size="12" fill="#6b7280">10: NC</text>

  <line x1="282" y1="370" x2="338" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="344" y="374" font-size="12" fill="#1a1a1a">9: INT2</text>

  <line x1="282" y1="410" x2="338" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="344" y="414" font-size="12" fill="#1a1a1a">8: INT1</text>

  <!-- Нижні примітки в лівій панелі -->
  <rect x="40" y="455" width="344" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="212" y="474" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VS (2.0–3.6 В) — живлення аналогового ядра</text>
  <text x="212" y="492" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD_I/O (1.7 В–VS) — рівень цифрових ліній</text>
  <text x="212" y="510" font-size="12" fill="#6b7280" text-anchor="middle">CS = 1 (I2C) | SDO = 0 (0x53), 1 (0x1D)</text>


  <!-- ПРАВА ПАНЕЛЬ: Схема підключення та узгодження -->
  <rect x="416" y="75" width="520" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="676" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема підключення та узгодження</text>
  <text x="676" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Спряження 5V мікроконтролера з 3.3V давачем ADXL345</text>

  <!-- 1. Блок Джерела живлення 3.3V -->
  <rect x="432" y="140" width="105" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="484" y="161" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Джерело +3.3V</text>
  <text x="484" y="177" font-size="12" fill="#6b7280" text-anchor="middle">LDO / VCC</text>

  <!-- 2. Блок МК 5V -->
  <rect x="432" y="325" width="105" height="145" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="484" y="348" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">МК (5 В)</text>
  <text x="484" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Arduino / MCU</text>
  <text x="484" y="395" font-size="12" fill="#1a1a1a" text-anchor="middle">SCL (5V)</text>
  <text x="484" y="425" font-size="12" fill="#1a1a1a" text-anchor="middle">SDA (5V)</text>
  <text x="484" y="455" font-size="12" fill="#1a1a1a" text-anchor="middle">INT1 (вхід)</text>

  <!-- 3. Блок Конвертера логічних рівнів -->
  <rect x="562" y="325" width="115" height="145" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="619" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Конвертер рівнів</text>
  <text x="619" y="365" font-size="12" fill="#6b7280" text-anchor="middle">HV: 5V ↔ LV: 3.3V</text>
  <text x="568" y="395" font-size="12" fill="#c0392b" text-anchor="start">HV1</text>
  <text x="670" y="395" font-size="12" fill="#27ae60" text-anchor="end">LV1</text>
  <text x="568" y="425" font-size="12" fill="#c0392b" text-anchor="start">HV2</text>
  <text x="670" y="425" font-size="12" fill="#27ae60" text-anchor="end">LV2</text>

  <!-- 4. Блок Модуля ADXL345 -->
  <rect x="736" y="140" width="184" height="330" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="828" y="163" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ADXL345 Module</text>

  <!-- Виводи ADXL345 у схемі -->
  <text x="746" y="195" font-size="12" font-weight="bold" fill="#2457d6">VS (Pin 6)</text>
  <text x="746" y="245" font-size="12" font-weight="bold" fill="#2457d6">VDD_I/O (Pin 1)</text>
  <text x="746" y="295" font-size="12" font-weight="bold" fill="#27ae60">CS (Pin 7)</text>
  <text x="746" y="345" font-size="12" fill="#1a1a1a">SDO / ALT (12)</text>
  <text x="746" y="395" font-size="12" font-weight="bold" fill="#27ae60">SCL (Pin 14)</text>
  <text x="746" y="425" font-size="12" font-weight="bold" fill="#27ae60">SDA (Pin 13)</text>
  <text x="746" y="455" font-size="12" fill="#1a1a1a">INT1 (Pin 8)</text>

  <!-- З'ЄДНАННЯ ТА ФІЛЬТРИ -->
  <!-- Шина +3.3V від джерела -->
  <line x1="537" y1="165" x2="736" y2="165" stroke="#2457d6" stroke-width="2"/>
  <circle cx="555" cy="165" r="3" fill="#2457d6"/>
  <circle cx="720" cy="165" r="3" fill="#2457d6"/>

  <!-- Відгалуження до VS (Pin 6) -->
  <path d="M555,165 L555,195 L736,195" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Конденсатор C1 (10 uF) -->
  <line x1="585" y1="195" x2="585" y2="215" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="577" y="215" width="16" height="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <line x1="577" y1="223" x2="593" y2="223" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="585" y1="223" x2="585" y2="238" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="577" y1="238" x2="593" y2="238" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="581" y1="241" x2="589" y2="241" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Напис C1 ліворуч від лінії x=585 -->
  <text x="570" y="224" font-size="12" fill="#2457d6" text-anchor="end">C1 10мкФ</text>

  <!-- Конденсатор C2 (0.1 uF) -->
  <line x1="645" y1="195" x2="645" y2="215" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="637" y1="215" x2="653" y2="215" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="637" y1="220" x2="653" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="645" y1="220" x2="645" y2="238" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="637" y1="238" x2="653" y2="238" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="641" y1="241" x2="649" y2="241" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Напис C2 праворуч від лінії x=645 -->
  <text x="658" y="224" font-size="12" fill="#2457d6" text-anchor="start">C2 0.1мкФ</text>

  <!-- Відгалуження до VDD_I/O (Pin 1) -->
  <path d="M720,165 L720,245 L736,245" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Конденсатор C3 (0.1 uF) на VDD_I/O -->
  <line x1="690" y1="245" x2="690" y2="265" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="682" y1="265" x2="698" y2="265" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="682" y1="270" x2="698" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="690" y1="270" x2="690" y2="288" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="682" y1="288" x2="698" y2="288" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="686" y1="291" x2="694" y2="291" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Напис C3 ліворуч від лінії x=690 -->
  <text x="677" y="274" font-size="12" fill="#2457d6" text-anchor="end">C3 0.1мкФ</text>

  <!-- CS підтяжка до VDD_I/O (High = I2C) -->
  <path d="M720,245 L720,295 L736,295" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="720" cy="245" r="3" fill="#2457d6"/>

  <!-- SDO до GND (Адреса 0x53) - всередині ADXL345 / примітка -->
  <line x1="736" y1="345" x2="710" y2="345" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="710" y1="345" x2="710" y2="360" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="704" y1="360" x2="716" y2="360" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="707" y1="363" x2="713" y2="363" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Лінії SCL та SDA від МК (5V) до Конвертера (HV) -->
  <line x1="537" y1="395" x2="562" y2="395" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="537" y1="425" x2="562" y2="425" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- Лінії SCL та SDA від Конвертера (LV) до ADXL345 (3.3V) -->
  <line x1="677" y1="395" x2="736" y2="395" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="677" y1="425" x2="736" y2="425" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Лінія INT1 напряму до МК (3.3V сумісна) -->
  <line x1="736" y1="455" x2="537" y2="455" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-black)"/>

  <!-- Нижня рамка приміток для правої панелі -->
  <rect x="432" y="485" width="488" height="42" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="676" y="503" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Конвертер запобігає перенапрузі 5V на виводах SCL/SDA ADXL345</text>
  <text x="676" y="519" font-size="12" fill="#6b7280" text-anchor="middle">Блокувальні конденсатори C1–C3 встановлюються якомога ближче до виводів</text>
</svg>
