<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="45" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Часова діаграма апаратного тап-детектора ADXL345</text>
  <text x="480" y="70" fill="#8b949e" font-size="13" text-anchor="middle">Параметри розпізнавання одиночного та подвійного дотику: THRESH_TAP, DUR, LATENT та WINDOW</text>

  <!-- Координатна сітка та осі графіка аналогового прискорення -->
  <g transform="translate(80, 90)">
    <!-- Сітка -->
    <line x1="0" y1="230" x2="820" y2="230" stroke="#30363d" stroke-width="1"/>
    <line x1="0" y1="160" x2="820" y2="160" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="90" x2="820" y2="90" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Вісь Y -->
    <line x1="0" y1="20" x2="0" y2="230" stroke="#8b949e" stroke-width="1.5"/>
    <polygon points="-4,24 0,14 4,24" fill="#8b949e"/>
    <text x="-15" y="25" fill="#8b949e" font-size="12" text-anchor="end">|a|, g</text>
    <text x="-12" y="94" fill="#f85149" font-size="12" font-weight="600" text-anchor="end">THRESH_TAP</text>
    <text x="-12" y="164" fill="#8b949e" font-size="11" text-anchor="end">1.0 g</text>
    <text x="-12" y="234" fill="#8b949e" font-size="11" text-anchor="end">0 g</text>

    <!-- Вісь X -->
    <line x1="0" y1="230" x2="830" y2="230" stroke="#8b949e" stroke-width="1.5"/>
    <polygon points="826,226 836,230 826,234" fill="#8b949e"/>
    <text x="830" y="250" fill="#8b949e" font-size="12">Час t</text>

    <!-- Затінення вікон -->
    <!-- Вікно DUR (перший удар) -->
    <rect x="70" y="30" width="80" height="200" fill="#58a6ff" fill-opacity="0.12"/>
    <line x1="70" y1="30" x2="70" y2="230" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="150" y1="30" x2="150" y2="230" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="110" y="25" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">DUR (макс. тривалість)</text>

    <!-- Вікно LATENT (затримка / придушення брязкоту) -->
    <rect x="135" y="30" width="160" height="200" fill="#d29922" fill-opacity="0.12"/>
    <line x1="135" y1="30" x2="135" y2="230" stroke="#d29922" stroke-width="1.5"/>
    <line x1="295" y1="30" x2="295" y2="230" stroke="#d29922" stroke-width="1.5"/>
    <text x="215" y="25" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">LATENT (ігнорування відскоків)</text>

    <!-- Вікно WINDOW (очікування другого удару) -->
    <rect x="295" y="30" width="310" height="200" fill="#3fb950" fill-opacity="0.12"/>
    <line x1="605" y1="30" x2="605" y2="230" stroke="#3fb950" stroke-width="1.5"/>
    <text x="450" y="25" fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">WINDOW (вікно очікування 2-го удару)</text>

    <!-- Вікно DUR (другий удар) -->
    <rect x="420" y="50" width="80" height="180" fill="#bc8cff" fill-opacity="0.15"/>
    <text x="460" y="45" fill="#bc8cff" font-size="10" font-weight="600" text-anchor="middle">DUR #2</text>

    <!-- Хвиля прискорення (аналоговий профіль) -->
    <path d="M 0 160 Q 30 160 50 160 
             Q 65 160 75 80 
             Q 90 45 105 45 
             Q 120 45 135 90 
             Q 150 140 165 175 
             Q 185 145 205 165 
             Q 230 155 260 160 
             Q 340 160 410 160 
             Q 425 160 435 75 
             Q 450 40 465 40 
             Q 480 40 495 90 
             Q 510 160 535 170 
             Q 570 160 820 160" 
          fill="none" stroke="#58a6ff" stroke-width="3"/>

    <!-- Точки перетину порогу -->
    <circle cx="73" cy="90" r="4" fill="#f85149"/>
    <circle cx="135" cy="90" r="4" fill="#f85149"/>
    <circle cx="432" cy="90" r="4" fill="#f85149"/>
    <circle cx="495" cy="90" r="4" fill="#f85149"/>

    <!-- Підписи імпульсів -->
    <text x="105" y="65" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">1-й удар</text>
    <text x="215" y="190" fill="#d29922" font-size="10" text-anchor="middle">Паразитні коливання корпусу</text>
    <text x="465" y="60" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">2-й удар</text>
  </g>

  <!-- Цифрові сигнали переривань (INT1 / INT2) -->
  <g transform="translate(80, 370)">
    <!-- Розділювач -->
    <line x1="0" y1="0" x2="820" y2="0" stroke="#30363d" stroke-width="1.5"/>

    <!-- Лінія Single Tap -->
    <text x="-12" y="30" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="end">SINGLE_TAP</text>
    <path d="M 0 35 L 135 35 L 135 12 L 180 12 L 180 35 L 820 35" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <text x="157" y="8" fill="#58a6ff" font-size="10" font-weight="600" text-anchor="middle">Імпульс 1-го дотику</text>

    <!-- Лінія Double Tap -->
    <text x="-12" y="85" fill="#3fb950" font-size="12" font-weight="600" text-anchor="end">DOUBLE_TAP</text>
    <path d="M 0 90 L 495 90 L 495 65 L 560 65 L 560 90 L 820 90" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="527" y="60" fill="#3fb950" font-size="10" font-weight="600" text-anchor="middle">Подія DOUBLE_TAP</text>
  </g>

  <!-- Блок пояснень параметрів -->
  <g transform="translate(80, 480)">
    <rect width="820" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="15" y="22" fill="#c9d1d9" font-size="11">
      <tspan fill="#f85149" font-weight="600">THRESH_TAP:</tspan> поріг 62.5 мг/LSB | 
      <tspan fill="#58a6ff" font-weight="600">DUR:</tspan> макс. тривалість 0.625 мс/LSB | 
      <tspan fill="#d29922" font-weight="600">LATENT:</tspan> затримка брязкоту 1.25 мс/LSB | 
      <tspan fill="#3fb950" font-weight="600">WINDOW:</tspan> вікно подвійного дотику 1.25 мс/LSB
    </text>
  </g>
</svg>
