<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Геометрія обчислення кутів нахилу ADXL345</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Проекції вектора прискорення утворюють прямокутні трикутники для розрахунку кутів через arctan2</text>

  <!-- Ліва панель: Крен (Roll) -->
  <rect x="24" y="72" width="444" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <rect x="38" y="84" width="416" height="34" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="246" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">Кут крену (Roll, ϕ) — проекція у площині Y-Z</text>

  <!-- Графічна область лівої панелі -->
  <rect x="38" y="130" width="416" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Осі координат для Y-Z -->
  <!-- Вісь Z -->
  <line x1="160" y1="285" x2="160" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="160" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Z (вісь давача)</text>

  <!-- Вісь Y -->
  <line x1="160" y1="285" x2="380" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="390" y="289" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Y</text>

  <!-- Вектор прискорення A_yz -->
  <line x1="160" y1="285" x2="310" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="322" y="178" text-anchor="start" font-size="13" font-weight="700" fill="#2457d6">A_yz</text>

  <!-- Проекційні лінії (прямокутний трикутник) -->
  <!-- Горизонтальний катет (A_y) -->
  <line x1="160" y1="180" x2="310" y2="180" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="235" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">A_y (протилежний катет)</text>

  <!-- Вертикальний катет (A_z) -->
  <text x="145" y="235" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">A_z (прилеглий)</text>

  <!-- Символ прямого кута -->
  <rect x="160" y="180" width="10" height="10" fill="none" stroke="#6b7280" stroke-width="1"/>

  <!-- Дуга кута phi -->
  <path d="M 160 250 A 35 35 0 0 1 181 255" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="195" y="215" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">ϕ (крен)</text>

  <!-- Корпус давача ADXL345 (міні-схема) -->
  <rect x="52" y="260" width="76" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="90" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">ADXL345</text>

  <!-- Картка з формулою крену -->
  <rect x="38" y="322" width="416" height="162" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="54" y="344" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Математика обчислення кута крену:</text>
  <text x="54" y="370" text-anchor="start" font-size="15" font-weight="700" fill="#2457d6">ϕ = arctan2( A_y , A_z )</text>
  <text x="54" y="396" text-anchor="start" font-size="12" fill="#1a1a1a">• tan(ϕ) = A_y / A_z (відношення катетів)</text>
  <text x="54" y="418" text-anchor="start" font-size="12" fill="#6b7280">• arctan2 дає повне коло в діапазоні [-180°, +180°]</text>
  <text x="54" y="440" text-anchor="start" font-size="12" fill="#27ae60">• Оберігає від ділення на нуль при A_z = 0</text>
  <text x="54" y="462" text-anchor="start" font-size="12" fill="#6b7280">• Масштаб у Full Res: 4 мг/МЗР для всіх осей</text>


  <!-- Права панель: Тангаж (Pitch) -->
  <rect x="492" y="72" width="444" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="506" y="84" width="416" height="34" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="714" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">Кут тангажу (Pitch, θ) — проекція у площині X-Z</text>

  <!-- Графічна область правої панелі -->
  <rect x="506" y="130" width="416" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Осі координат для X-Z -->
  <!-- Вертикальна вісь (квадратний корінь YZ) -->
  <line x1="628" y1="285" x2="628" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="628" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">√(A_y² + A_z²)</text>

  <!-- Горизонтальна вісь X -->
  <line x1="628" y1="285" x2="848" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="858" y="289" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">X</text>

  <!-- Вектор прискорення A -->
  <line x1="628" y1="285" x2="778" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="790" y="178" text-anchor="start" font-size="13" font-weight="700" fill="#2457d6">A</text>

  <!-- Проекційні лінії (прямокутний трикутник) -->
  <!-- Горизонтальний катет (-A_x) -->
  <line x1="628" y1="180" x2="778" y2="180" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="703" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">-A_x (протилежний катет)</text>

  <!-- Вертикальний катет -->
  <text x="613" y="235" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">прилеглий</text>

  <!-- Символ прямого кута -->
  <rect x="628" y="180" width="10" height="10" fill="none" stroke="#6b7280" stroke-width="1"/>

  <!-- Дуга кута theta -->
  <path d="M 628 250 A 35 35 0 0 1 649 255" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="650" y="215" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">θ (тангаж)</text>

  <!-- Картка з формулою тангажу -->
  <rect x="506" y="322" width="416" height="162" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="522" y="344" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Математика обчислення кута тангажу:</text>
  <text x="522" y="370" text-anchor="start" font-size="15" font-weight="700" fill="#2457d6">θ = arctan2( -A_x , √(A_y² + A_z²) )</text>
  <text x="522" y="396" text-anchor="start" font-size="12" fill="#1a1a1a">• tan(θ) = -A_x / √(A_y² + A_z²) (враховує вектор YZ)</text>
  <text x="522" y="418" text-anchor="start" font-size="12" fill="#6b7280">• Векторний знаменник компенсує крен</text>
  <text x="522" y="440" text-anchor="start" font-size="12" fill="#27ae60">• Робочий діапазон тангажу [-90°, +90°]</text>
  <text x="522" y="462" text-anchor="start" font-size="12" fill="#6b7280">• Калібрування: регістри OFSX, OFSY, OFSZ (15.6 мг/МЗР)</text>
</svg>
