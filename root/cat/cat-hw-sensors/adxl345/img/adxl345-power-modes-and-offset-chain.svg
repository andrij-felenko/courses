<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">ADXL345: Режими живлення та апаратна компенсація зсуву</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Автоматичний перехід у сон за відсутності руху та додавання OFSX/Y/Z до FIFO</text>

  <!-- Left Panel: Power Modes State Machine -->
  <rect x="25" y="65" width="445" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Діаграма станів режимів живлення</text>

  <!-- Standby State Box -->
  <rect x="147" y="110" width="200" height="72" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="247" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Standby (Очікування)</text>
  <text x="247" y="149" text-anchor="middle" font-size="12" fill="#6b7280">Measure = 0 | I_DD ≈ 0.1 µA</text>
  <text x="247" y="166" text-anchor="middle" font-size="12" fill="#6b7280">Вимірювання зупинено</text>

  <!-- Measurement State Box -->
  <rect x="35" y="260" width="170" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="120" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Measurement</text>
  <text x="120" y="300" text-anchor="middle" font-size="12" fill="#1a1a1a">Measure = 1, Sleep = 0</text>
  <text x="120" y="318" text-anchor="middle" font-size="12" fill="#6b7280">Повний ODR (0.1–3200 Hz)</text>
  <text x="120" y="336" text-anchor="middle" font-size="12" fill="#6b7280">I_DD ≈ 23–140 µA</text>

  <!-- Auto-Sleep State Box -->
  <rect x="290" y="260" width="170" height="90" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="375" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Auto-Sleep</text>
  <text x="375" y="300" text-anchor="middle" font-size="12" fill="#1a1a1a">AUTO_SLEEP = 1, LINK = 1</text>
  <text x="375" y="318" text-anchor="middle" font-size="12" fill="#6b7280">Сон ODR (1–8 Hz)</text>
  <text x="375" y="336" text-anchor="middle" font-size="12" fill="#6b7280">I_DD ≈ 30 µA</text>

  <!-- State Transitions -->
  <!-- Standby -> Measurement -->
  <line x1="175" y1="182" x2="135" y2="260" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="135" y="215" text-anchor="end" font-size="11" fill="#27ae60">Measure = 1</text>

  <!-- Measurement -> Standby -->
  <line x1="165" y1="260" x2="215" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="200" y="225" text-anchor="start" font-size="11" fill="#1a1a1a">Measure = 0</text>

  <!-- Measurement -> Auto-Sleep -->
  <line x1="205" y1="282" x2="290" y2="282" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="274" text-anchor="middle" font-size="11" fill="#c0392b">Бездіяльність</text>

  <!-- Auto-Sleep -> Measurement -->
  <line x1="290" y1="328" x2="205" y2="328" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="247" y="342" text-anchor="middle" font-size="11" fill="#27ae60">Активність</text>

  <!-- Auto-Sleep -> Standby -->
  <line x1="315" y1="260" x2="280" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="315" y="225" text-anchor="start" font-size="11" fill="#1a1a1a">Measure = 0</text>

  <!-- Left Panel Note Box -->
  <rect x="40" y="375" width="415" height="145" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="55" y="396" font-size="12" font-weight="bold" fill="#2457d6">Особливості режимів живлення ADXL345:</text>
  <text x="55" y="418" font-size="12" fill="#1a1a1a">• Standby: вимкнено вимірювання, збережено конфігурацію</text>
  <text x="55" y="438" font-size="12" fill="#1a1a1a">• Measurement: безперервне оновлення даних з вибраним ODR</text>
  <text x="55" y="458" font-size="12" fill="#1a1a1a">• Auto-Sleep: сон за відсутності руху (THRESH_INACT)</text>
  <text x="55" y="478" font-size="12" fill="#1a1a1a">• Авто-пробудження при виявленні події руху (THRESH_ACT)</text>
  <text x="55" y="498" font-size="12" fill="#1a1a1a">• Забезпечує тривалу автономну роботу від батареї</text>

  <!-- Right Panel: Offset Hardware Chain & FIFO -->
  <rect x="490" y="65" width="445" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Апаратний ланцюг компенсації зсуву та FIFO</text>

  <!-- MEMS Sensor Core Box -->
  <rect x="510" y="115" width="180" height="60" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="600" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">MEMS Ядро &amp; АЦП</text>
  <text x="600" y="156" text-anchor="middle" font-size="12" fill="#6b7280">Сирі дані (10–13 біт)</text>

  <!-- OFSX/Y/Z Box -->
  <rect x="735" y="115" width="180" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="825" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Регістри OFSX/Y/Z</text>
  <text x="825" y="156" text-anchor="middle" font-size="12" fill="#6b7280">8 біт (15.6 мг/МЗР)</text>

  <!-- Signal Flow: MEMS -> Adder -->
  <line x1="600" y1="175" x2="600" y2="210" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="590" y="197" text-anchor="end" font-size="12" fill="#6b7280">Data_raw</text>

  <!-- Signal Flow: OFS -> Adder -->
  <line x1="825" y1="175" x2="825" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="835" y="197" text-anchor="start" font-size="12" fill="#2457d6">+ OFS</text>

  <!-- Adder Hardware Box -->
  <rect x="510" y="210" width="405" height="65" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="545" cy="242.5" r="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="537" y1="242.5" x2="553" y2="242.5" stroke="#27ae60" stroke-width="2"/>
  <line x1="545" y1="234.5" x2="545" y2="250.5" stroke="#27ae60" stroke-width="2"/>
  <text x="735" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Апаратне додавання зсуву (Offset Chain)</text>
  <text x="735" y="254" text-anchor="middle" font-size="12" fill="#1a1a1a">Data_out = Data_raw + (OFS × 15.6 мг/МЗР)</text>

  <!-- Signal Flow: Adder -> FIFO -->
  <line x1="712" y1="275" x2="712" y2="310" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="722" y="297" text-anchor="start" font-size="12" fill="#27ae60">Скориговані дані</text>

  <!-- FIFO Buffer Box -->
  <rect x="510" y="310" width="405" height="75" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="530" y="322" width="60" height="50" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="530" y="322" width="60" height="18" rx="3" fill="#2457d6"/>
  <text x="560" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIFO</text>
  <line x1="530" y1="348" x2="590" y2="348" stroke="#d0d7de" stroke-width="1"/>
  <line x1="530" y1="358" x2="590" y2="358" stroke="#d0d7de" stroke-width="1"/>
  <rect x="534" y="361" width="52" height="7" rx="1" fill="#eaf0fd"/>

  <text x="750" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">32-рівневий FIFO-буфер</text>
  <text x="750" y="352" text-anchor="middle" font-size="12" fill="#1a1a1a">Режими: Bypass, FIFO, Stream, Trigger</text>
  <text x="750" y="370" text-anchor="middle" font-size="12" fill="#6b7280">Розвантажує ЦП від частих переривань</text>

  <!-- Signal Flow: FIFO -> Output Registers -->
  <line x1="712" y1="385" x2="712" y2="415" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="722" y="404" text-anchor="start" font-size="12" fill="#2457d6">Пакетний вихід</text>

  <!-- Output Registers Box -->
  <rect x="510" y="415" width="405" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вихідні регістри DATAX0..DATAZ1</text>
  <text x="712" y="458" text-anchor="middle" font-size="12" fill="#1a1a1a">• Інтерфейси: SPI (3/4-провідний) або I2C (ALT ADDRESS)</text>
  <text x="712" y="478" text-anchor="middle" font-size="12" fill="#1a1a1a">• Автоматична компенсація до збереження у FIFO</text>
  <text x="712" y="498" text-anchor="middle" font-size="12" fill="#27ae60">• Нульовий зсув на виході без програмних обчислень</text>
</svg>
