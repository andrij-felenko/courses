<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння завантаження ЦП: Опитування vs Переривання ADXL345</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Апаратний буфер FIFO та лінії INT1/INT2 забезпечують сон ЦП, знижуючи споживання на &gt;95%</text>

  <!-- ================= PANEL 1: POLLING MODE ================= -->
  <rect x="30" y="80" width="900" height="210" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="105" font-size="15" font-weight="bold" fill="#c0392b">1. Безперервне опитування (Polling Mode) — Нераціональне використання ресурсів</text>

  <!-- Polling Block Diagram -->
  <rect x="50" y="125" width="110" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="105" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Мікроконтролер</text>
  <text x="105" y="170" text-anchor="middle" font-size="12" fill="#1a1a1a">ЦП активний 100%</text>
  <text x="105" y="192" text-anchor="middle" font-size="12" fill="#6b7280">Цикл polling</text>

  <!-- Arrow Polling Requests -->
  <path d="M160,170 L255,170" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="207.5" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Запити I2C/SPI</text>
  <text x="207.5" y="192" text-anchor="middle" font-size="12" fill="#6b7280">f_poll &gt;&gt; ODR</text>

  <rect x="255" y="125" width="130" height="90" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ADXL345</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#1a1a1a">Регістри DATAX/Y/Z</text>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="#6b7280">Без FIFO-буфера</text>

  <!-- Polling Timeline Container -->
  <rect x="400" y="120" width="510" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- CPU Row -->
  <text x="415" y="148" font-size="12" font-weight="bold" fill="#1a1a1a">Стан ЦП:</text>
  <rect x="500" y="132" width="380" height="24" rx="3" fill="#c0392b"/>
  <text x="690" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ЦП постійно активний (100% завантаження, I_CPU ≈ 15 мА)</text>

  <!-- Bus Row -->
  <text x="415" y="188" font-size="12" font-weight="bold" fill="#1a1a1a">I2C / SPI:</text>

  <!-- Polling pulses -->
  <rect x="500" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="538" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="576" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="614" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="652" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="690" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="728" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="766" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="804" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>
  <rect x="842" y="172" width="20" height="20" rx="2" fill="#fdecea" stroke="#c0392b"/>

  <text x="690" y="212" text-anchor="middle" font-size="12" fill="#c0392b">Безперервний трафік опитування прапорця DATA_READY</text>

  <!-- Axis t -->
  <line x1="500" y1="235" x2="880" y2="235" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="880" y="255" text-anchor="end" font-size="12" fill="#1a1a1a">Час (t)</text>


  <!-- ================= PANEL 2: INTERRUPT + FIFO MODE ================= -->
  <rect x="30" y="305" width="900" height="230" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="50" y="330" font-size="15" font-weight="bold" fill="#27ae60">2. Обробка за перериваннями та FIFO (Interrupt + FIFO) — Енергоефективний режим</text>

  <!-- Interrupt Block Diagram -->
  <rect x="50" y="350" width="120" height="100" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="110" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Мікроконтролер</text>
  <text x="110" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">Сон (Sleep Mode)</text>
  <text x="110" y="410" text-anchor="middle" font-size="12" fill="#27ae60">Пробудження по INT</text>
  <text x="110" y="430" text-anchor="middle" font-size="12" fill="#6b7280">I_CPU &lt; 1 мкА</text>

  <!-- Line INT Signal -->
  <path d="M265,375 L170,375" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="217.5" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сигнал INT1</text>

  <!-- Arrow Burst Read -->
  <path d="M170,425 L265,425" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="217.5" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Burst Read</text>

  <rect x="265" y="350" width="120" height="100" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">ADXL345</text>
  <text x="325" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">32-рівневий FIFO</text>
  <text x="325" y="410" text-anchor="middle" font-size="12" fill="#2457d6">Watermark / Event</text>
  <text x="325" y="430" text-anchor="middle" font-size="12" fill="#6b7280">Автономний збір</text>

  <!-- Interrupt Timeline Container -->
  <rect x="400" y="340" width="510" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- INT Signal Waveform Row -->
  <text x="415" y="380" font-size="12" font-weight="bold" fill="#27ae60">Сигнал INT1:</text>
  <path d="M500,380 L710,380 L710,368 L740,368 L740,380 L880,380" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="725" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Подія FIFO Watermark</text>

  <!-- CPU Row -->
  <text x="415" y="415" font-size="12" font-weight="bold" fill="#1a1a1a">Стан ЦП:</text>
  <!-- Sleep 1 -->
  <rect x="500" y="400" width="210" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="605" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Глибокий сон ЦП (~95% часу)</text>
  <!-- Wakeup & Read -->
  <rect x="710" y="400" width="30" height="24" rx="3" fill="#2457d6"/>
  <text x="725" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Обробка</text>
  <!-- Sleep 2 -->
  <rect x="740" y="400" width="140" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="810" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сон</text>

  <!-- Bus Row -->
  <text x="415" y="465" font-size="12" font-weight="bold" fill="#1a1a1a">I2C / SPI:</text>
  <line x1="500" y1="460" x2="710" y2="460" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="605" y="452" text-anchor="middle" font-size="12" fill="#6b7280">Шина вільна</text>

  <rect x="710" y="450" width="30" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="725" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Burst Read (32 B)</text>

  <line x1="740" y1="460" x2="880" y2="460" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Axis t -->
  <line x1="500" y1="498" x2="880" y2="498" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="880" y="514" text-anchor="end" font-size="12" fill="#1a1a1a">Час (t)</text>

</svg>
