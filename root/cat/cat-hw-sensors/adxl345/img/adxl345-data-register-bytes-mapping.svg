<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Карта регістрів даних ADXL345 та порядок зчитування осей</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Послідовне читання 8-бітних регістрів, формування 16-бітного слова та обчислення прискорення в g</text>

  <!-- ==================== ПАНЕЛЬ 1 ==================== -->
  <rect x="25" y="75" width="270" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="160" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">1. Карта регістрів (0x32..0x37)</text>
  <text x="160" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Автоінкремент адреси при SPI/I2C</text>

  <!-- Регістри -->
  <!-- 0x32 DATAX0 -->
  <rect x="45" y="135" width="230" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="55" y="157" font-size="12" font-weight="700" fill="#2457d6">0x32 | DATAX0</text>
  <text x="265" y="157" text-anchor="end" font-size="12" fill="#2457d6">X-Axis LSB</text>

  <!-- 0x33 DATAX1 -->
  <rect x="45" y="177" width="230" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="55" y="199" font-size="12" font-weight="700" fill="#2457d6">0x33 | DATAX1</text>
  <text x="265" y="199" text-anchor="end" font-size="12" fill="#2457d6">X-Axis MSB</text>

  <!-- 0x34 DATAY0 -->
  <rect x="45" y="219" width="230" height="36" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="241" font-size="12" font-weight="700" fill="#1a1a1a">0x34 | DATAY0</text>
  <text x="265" y="241" text-anchor="end" font-size="12" fill="#6b7280">Y-Axis LSB</text>

  <!-- 0x35 DATAY1 -->
  <rect x="45" y="261" width="230" height="36" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="283" font-size="12" font-weight="700" fill="#1a1a1a">0x35 | DATAY1</text>
  <text x="265" y="283" text-anchor="end" font-size="12" fill="#6b7280">Y-Axis MSB</text>

  <!-- 0x36 DATAZ0 -->
  <rect x="45" y="303" width="230" height="36" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="325" font-size="12" font-weight="700" fill="#1a1a1a">0x36 | DATAZ0</text>
  <text x="265" y="325" text-anchor="end" font-size="12" fill="#6b7280">Z-Axis LSB</text>

  <!-- 0x37 DATAZ1 -->
  <rect x="45" y="345" width="230" height="36" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="367" font-size="12" font-weight="700" fill="#1a1a1a">0x37 | DATAZ1</text>
  <text x="265" y="367" text-anchor="end" font-size="12" fill="#6b7280">Z-Axis MSB</text>

  <!-- Інфобокс 1 -->
  <rect x="45" y="395" width="230" height="70" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="160" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Пакетне читання 6 байт</text>
  <text x="160" y="433" text-anchor="middle" font-size="12" fill="#6b7280">Старт з 0x32 (початкова адреса)</text>
  <text x="160" y="451" text-anchor="middle" font-size="12" fill="#6b7280">Автоінкремент опитує всі осі</text>

  <!-- ==================== З'ЄДНУВАЛЬНІ СТРІЛКИ 1->2 ==================== -->
  <!-- DATAX1 (0x33) -> MSB box -->
  <path d="M 275,195 C 300,195 315,157 335,157" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- DATAX0 (0x32) -> LSB box -->
  <path d="M 275,153 C 300,153 315,247 335,247" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== ПАНЕЛЬ 2 ==================== -->
  <rect x="320" y="75" width="325" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="482" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">2. Формування слова (int16_t)</text>
  <text x="482" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Зсув MSB та побітове АБО з LSB</text>

  <!-- MSB Box -->
  <rect x="340" y="135" width="285" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="154" font-size="12" font-weight="700" fill="#2457d6">DATAX1 (MSB, Старший байт)</text>
  <text x="350" y="170" font-size="12" fill="#6b7280">Біти [D15..D8] | Операція: DATAX1 &lt;&lt; 8</text>

  <!-- OR Sign -->
  <circle cx="482" cy="200" r="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="482" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">OR</text>

  <!-- LSB Box -->
  <rect x="340" y="225" width="285" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="244" font-size="12" font-weight="700" fill="#2457d6">DATAX0 (LSB, Молодший байт)</text>
  <text x="350" y="260" font-size="12" fill="#6b7280">Біти [D7..D0] | Операція: | DATAX0</text>

  <!-- Arrow down to result -->
  <line x1="482" y1="270" x2="482" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 16-bit result box -->
  <rect x="340" y="295" width="285" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="482" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Регістр Raw_X (16 біт, доповняльний код)</text>

  <!-- Bit visual blocks -->
  <rect x="355" y="325" width="120" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="415" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DATAX1 [15..8]</text>

  <rect x="490" y="325" width="120" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="550" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DATAX0 [7..0]</text>

  <text x="482" y="365" text-anchor="middle" font-size="12" fill="#6b7280">D15 — знаковий біт (Sign bit)</text>

  <!-- Code C/C++ Box -->
  <rect x="340" y="395" width="285" height="70" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="415" font-size="12" font-weight="700" fill="#1a1a1a">Код C / C++:</text>
  <text x="350" y="433" font-size="12" font-weight="700" fill="#2457d6">int16_t raw_x =</text>
  <text x="350" y="451" font-size="12" fill="#2457d6">  (int16_t)(buf[1] &lt;&lt; 8 | buf[0]);</text>

  <!-- ==================== З'ЄДНУВАЛЬНА СТРІЛКА 2->3 ==================== -->
  <line x1="625" y1="335" x2="663" y2="335" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="644" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Raw_X</text>

  <!-- ==================== ПАНЕЛЬ 3 ==================== -->
  <rect x="670" y="75" width="265" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="802" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">3. Обчислення прискорення</text>
  <text x="802" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Множення на масштабний коефіцієнт</text>

  <!-- Formula box -->
  <rect x="685" y="135" width="235" height="95" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="695" y="155" font-size="12" font-weight="700" fill="#1a1a1a">Формула перетворення:</text>
  <text x="802" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">a_x = Raw_X × K_scale [g]</text>
  <text x="802" y="197" text-anchor="middle" font-size="12" fill="#6b7280">Full-Res mode: K_scale = 3.9 mg/LSB</text>
  <text x="802" y="215" text-anchor="middle" font-size="12" fill="#6b7280">(0.0039 g/LSB або 1/256 g)</text>

  <!-- Calculation example box -->
  <rect x="685" y="242" width="235" height="135" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="695" y="262" font-size="12" font-weight="700" fill="#1a1a1a">Приклад розрахунку:</text>
  <text x="695" y="281" font-size="12" fill="#1a1a1a">Вхід: Raw_X = 256 (0x0100)</text>
  <text x="695" y="299" font-size="12" fill="#6b7280">a_x = 256 × 0.0039 g/LSB</text>

  <!-- Result tag -->
  <rect x="695" y="315" width="215" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="802" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#27ae60">a_x = +1.00 g</text>
  <text x="802" y="352" text-anchor="middle" font-size="12" fill="#27ae60">Прискорення по осі X</text>

  <!-- Summary Box -->
  <rect x="685" y="395" width="235" height="70" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="695" y="415" font-size="12" font-weight="700" fill="#27ae60">Результат:</text>
  <text x="695" y="433" font-size="12" fill="#1a1a1a">Дійсне число з плаваючою</text>
  <text x="695" y="451" font-size="12" fill="#1a1a1a">крапкою в одиницях g (м/с²)</text>
</svg>
