<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема генератора змінного струму для контактного давача рівня</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Перемикання полярності запобігає електролізу та корозії електродів у рідині</text>

  <!-- PANEL 1: Oscillator -->
  <rect x="20" y="75" width="280" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="20" y="75" width="280" height="32" fill="#eaf0fd" rx="8"/>
  <line x1="20" y1="107" x2="300" y2="107" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Генератор на логіці</text>

  <!-- Feedback Loop for Oscillator -->
  <line x1="85" y1="120" x2="110" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="110" y="114" width="30" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="140" y1="120" x2="175" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="175" y1="120" x2="175" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="175" cy="170" r="3" fill="#1a1a1a"/>
  <text x="125" y="138" text-anchor="middle" font-size="12" fill="#1a1a1a">Rf = 10 kΩ</text>

  <!-- Inverter U1A -->
  <polygon points="105,150 105,190 145,170" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="149" cy="170" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="174" text-anchor="middle" font-size="12" fill="#1a1a1a">U1A</text>

  <!-- Input Wire to U1A -->
  <line x1="85" y1="170" x2="105" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="85" cy="170" r="3" fill="#1a1a1a"/>
  <line x1="85" y1="170" x2="85" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Timing Capacitor Cf -->
  <line x1="85" y1="170" x2="85" y2="202" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="73" y1="202" x2="97" y2="202" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="73" y1="208" x2="97" y2="208" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="208" x2="85" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="75" y1="225" x2="95" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="79" y1="229" x2="91" y2="229" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="83" y1="233" x2="87" y2="233" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="105" y="208" text-anchor="start" font-size="12" fill="#1a1a1a">Cf = 10 nF</text>

  <!-- Output Signal A line through C1 -->
  <line x1="153" y1="170" x2="215" y2="170" stroke="#2457d6" stroke-width="2"/>
  <line x1="215" y1="160" x2="215" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="221" y1="160" x2="221" y2="180" stroke="#2457d6" stroke-width="2"/>
  <text x="218" y="152" text-anchor="middle" font-size="12" fill="#1a1a1a">C1 = 100 nF</text>
  <line x1="221" y1="170" x2="320" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="290" y="198" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Сигнал A (CLK)</text>

  <!-- Inverter U1B -->
  <line x1="175" y1="170" x2="175" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="175" y1="265" x2="105" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="105,245 105,285 145,265" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="149" cy="265" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="238" text-anchor="middle" font-size="12" fill="#1a1a1a">U1B</text>

  <!-- Waveform Box -->
  <rect x="35" y="315" width="250" height="180" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="160" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Форма сигналів (1 kHz)</text>

  <text x="45" y="365" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">A (CLK):</text>
  <path d="M 105 370 L 135 370 L 135 355 L 165 355 L 165 370 L 195 370 L 195 355 L 225 355 L 225 370 L 255 370" stroke="#2457d6" stroke-width="2" fill="none"/>

  <text x="45" y="410" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">B (CLK̅):</text>
  <path d="M 105 395 L 135 395 L 135 410 L 165 410 L 165 395 L 195 395 L 195 410 L 225 410 L 225 395 L 255 395" stroke="#c0392b" stroke-width="2" fill="none"/>

  <text x="160" y="450" text-anchor="middle" font-size="12" fill="#6b7280">Різниця потенціалів V_A - V_B</text>
  <text x="160" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">змінює знак (+5V ↔ -5V)</text>


  <!-- PANEL 2: Liquid Level Tank -->
  <rect x="320" y="75" width="320" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="320" y="75" width="320" height="32" fill="#eaf0fd" rx="8"/>
  <line x1="320" y1="107" x2="640" y2="107" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Вимірювальна комірка (AC)</text>

  <!-- Liquid Container Tank -->
  <rect x="345" y="130" width="270" height="205" fill="#ffffff" stroke="#475569" stroke-width="2.5" rx="6"/>
  <!-- Liquid Fill -->
  <path d="M 347 190 L 613 190 L 613 333 L 347 333 Z" fill="#eaf0fd" opacity="0.85"/>
  <!-- Wave on liquid surface -->
  <path d="M 347 190 Q 413 184, 480 190 T 613 190 L 613 195 L 347 195 Z" fill="#2457d6" opacity="0.5"/>

  <!-- Electrode A -->
  <rect x="385" y="142" width="12" height="155" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" rx="2"/>
  <circle cx="391" cy="170" r="3" fill="#2457d6"/>
  <text x="391" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Електрод A</text>

  <!-- Electrode B -->
  <rect x="563" y="142" width="12" height="155" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" rx="2"/>
  <circle cx="569" cy="170" r="3" fill="#2457d6"/>
  <text x="569" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Електрод B</text>

  <!-- Liquid Resistance R_рід -->
  <line x1="397" y1="240" x2="440" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="440" y="233" width="80" height="14" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="480" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">R_рід (опір рідини)</text>
  <line x1="520" y1="240" x2="563" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Conductive medium text -->
  <text x="480" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Провідне середовище (вода)</text>

  <!-- Wire from Electrode B to Panel 3 -->
  <line x1="569" y1="170" x2="660" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Physics Explanation Box -->
  <rect x="335" y="355" width="290" height="140" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="480" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Фізика захисту від корозії:</text>
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#c0392b">• При DC струмі: електроліз ➔ корозія</text>
  <text x="480" y="422" text-anchor="middle" font-size="12" fill="#1a1a1a">• При AC струмі: полярність змінюється</text>
  <text x="480" y="444" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">• Середній струм I_DC = 0 A</text>
  <text x="480" y="466" text-anchor="middle" font-size="12" fill="#27ae60">• Ресурс електродів зростає в сотні разів</text>


  <!-- PANEL 3: Detector & MCU -->
  <rect x="660" y="75" width="280" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="660" y="75" width="280" height="32" fill="#eaf0fd" rx="8"/>
  <line x1="660" y1="107" x2="940" y2="107" stroke="#d0d7de" stroke-width="1"/>
  <text x="800" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Дільник та детектування</text>

  <!-- Wire to C2 -->
  <line x1="660" y1="170" x2="700" y2="170" stroke="#2457d6" stroke-width="2"/>
  <line x1="700" y1="160" x2="700" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="706" y1="160" x2="706" y2="180" stroke="#2457d6" stroke-width="2"/>
  <text x="703" y="152" text-anchor="middle" font-size="12" fill="#1a1a1a">C2 = 100 nF</text>
  <line x1="706" y1="170" x2="735" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node 1 at (735, 170) -->
  <circle cx="735" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Pull-down Resistor Rm -->
  <line x1="735" y1="170" x2="735" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="728" y="190" width="14" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="735" y1="220" x2="735" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="725" y1="235" x2="745" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="729" y1="239" x2="741" y2="239" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="733" y1="243" x2="737" y2="243" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="735" y="256" text-anchor="middle" font-size="12" fill="#1a1a1a">Rm = 10 kΩ</text>

  <!-- Wire to Diode D1 -->
  <line x1="735" y1="170" x2="765" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="765,162 765,178 781,170" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="781" y1="162" x2="781" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <text x="773" y="152" text-anchor="middle" font-size="12" fill="#1a1a1a">D1</text>
  <line x1="781" y1="170" x2="805" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node 2 at (805, 170) -->
  <circle cx="805" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Filter Capacitor Cdet -->
  <line x1="805" y1="170" x2="805" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="793" y1="190" x2="817" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="793" y1="196" x2="817" y2="196" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="805" y1="196" x2="805" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="795" y1="235" x2="815" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="799" y1="239" x2="811" y2="239" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="803" y1="243" x2="807" y2="243" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="805" y="256" text-anchor="middle" font-size="12" fill="#1a1a1a">Cф = 1 µF</text>

  <!-- Wire to MCU -->
  <line x1="805" y1="170" x2="850" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Microcontroller Box (MCU) -->
  <rect x="850" y="135" width="75" height="100" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="887.5" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">МК</text>
  <text x="887.5" y="185" text-anchor="middle" font-size="12" fill="#1a1a1a">(ADC /</text>
  <text x="887.5" y="205" text-anchor="middle" font-size="12" fill="#1a1a1a">GPIO)</text>

  <!-- Output Status Box -->
  <rect x="675" y="275" width="250" height="220" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="800" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Рівень напруги на входу МК:</text>
  <text x="800" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_out ≈ V_AC × [R_m / (R_рід + R_m)]</text>
  <line x1="690" y1="325" x2="910" y2="325" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Status 1: Submerged -->
  <rect x="685" y="335" width="230" height="72" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="800" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">● Занурено: R_рід ≈ 1 kΩ</text>
  <text x="800" y="375" text-anchor="middle" font-size="12" fill="#1a1a1a">V_out ≈ 4.1 V ➔ Спрацював (1)</text>
  <text x="800" y="393" text-anchor="middle" font-size="12" fill="#6b7280">Сигнал перетинув поріг V_th</text>

  <!-- Status 2: Dry -->
  <rect x="685" y="415" width="230" height="72" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="800" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">○ Сухо: R_рід = ∞ (розрив)</text>
  <text x="800" y="455" text-anchor="middle" font-size="12" fill="#1a1a1a">V_out ≈ 0 V ➔ Норма (0)</text>
  <text x="800" y="473" text-anchor="middle" font-size="12" fill="#6b7280">Напруга нижче порогу V_th</text>
</svg>
