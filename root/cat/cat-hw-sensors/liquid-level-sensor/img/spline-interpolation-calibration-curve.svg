<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Калібрувальна крива залежності об'єму від рівня рідини V(h)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Кубічний сплайн гладко відтворює нелінійну ємність бака, усуваючи злами лінійної інтерполяції</text>

  <!-- Graph Container Panel -->
  <rect x="40" y="80" width="530" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Axis Titles & Tick Labels -->
  <text x="100" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Об'єм V, л</text>

  <!-- Y-Axis Ticks -->
  <text x="92" y="130" font-size="12" fill="#6b7280" text-anchor="end">250 л</text>
  <text x="92" y="170" font-size="12" fill="#6b7280" text-anchor="end">200 л</text>
  <text x="92" y="240" font-size="12" fill="#6b7280" text-anchor="end">150 л</text>
  <text x="92" y="310" font-size="12" fill="#6b7280" text-anchor="end">100 л</text>
  <text x="92" y="370" font-size="12" fill="#6b7280" text-anchor="end">50 л</text>
  <text x="92" y="430" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Grid Lines -->
  <line x1="100" y1="370" x2="540" y2="370" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="100" y1="310" x2="540" y2="310" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="100" y1="240" x2="540" y2="240" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="100" y1="170" x2="540" y2="170" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="100" y1="130" x2="540" y2="130" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>

  <line x1="164" y1="115" x2="164" y2="430" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="244" y1="115" x2="244" y2="430" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="340" y1="115" x2="340" y2="430" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="436" y1="115" x2="436" y2="430" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="500" y1="115" x2="500" y2="430" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- Shaded Non-Linearity Error Area (P2 to P3) -->
  <path d="M 244,298 C 274,258 308,208 340,182 L 244,298 Z" fill="#c0392b" fill-opacity="0.15" stroke="none"/>

  <!-- Axes -->
  <line x1="100" y1="430" x2="540" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="100" y1="430" x2="100" y2="115" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- X-Axis Ticks & Labels -->
  <text x="100" y="448" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="164" y="448" font-size="12" fill="#6b7280" text-anchor="middle">100</text>
  <text x="244" y="448" font-size="12" fill="#6b7280" text-anchor="middle">200</text>
  <text x="340" y="448" font-size="12" fill="#6b7280" text-anchor="middle">300</text>
  <text x="436" y="448" font-size="12" fill="#6b7280" text-anchor="middle">400</text>
  <text x="500" y="448" font-size="12" fill="#6b7280" text-anchor="middle">500</text>

  <text x="320" y="475" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рівень рідини h, мм</text>

  <!-- Piecewise Linear Interpolation Curve (Red dashed) -->
  <path d="M 100,430 L 164,394 L 244,298 L 340,182 L 436,132 L 500,115" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Smooth Cubic Spline Curve (Green solid) -->
  <path d="M 100,430 C 120,418 142,406 164,394 C 190,380 216,335 244,298 C 274,258 308,208 340,182 C 370,158 405,142 436,132 C 460,124 480,118 500,115" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Calibration Points (Discrete Measurements) -->
  <circle cx="100" cy="430" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="164" cy="394" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="244" cy="298" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="340" cy="182" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="436" cy="132" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="500" cy="115" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Point Labels -->
  <text x="75" y="448" font-size="12" font-weight="bold" fill="#2457d6">P₀</text>
  <text x="164" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">P₁</text>
  <text x="230" y="285" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">P₂</text>
  <text x="340" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">P₃</text>
  <text x="436" y="118" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">P₄</text>
  <text x="515" y="112" font-size="12" font-weight="bold" fill="#2457d6">P₅</text>

  <!-- Legend Box inside Graph -->
  <rect x="120" y="125" width="215" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Legend Item 1 -->
  <line x1="130" y1="141" x2="152" y2="141" stroke="#27ae60" stroke-width="3"/>
  <text x="160" y="145" font-size="12" fill="#1a1a1a">Кубічний сплайн S(h)</text>
  <!-- Legend Item 2 -->
  <line x1="130" y1="161" x2="152" y2="161" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="160" y="165" font-size="12" fill="#1a1a1a">Лінійна інтерполяція</text>
  <!-- Legend Item 3 -->
  <circle cx="141" cy="181" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="160" y="185" font-size="12" fill="#1a1a1a">Точки проливу (hᵢ, Vᵢ)</text>

  <!-- Callout / Annotation for Non-Linearity Error Delta V -->
  <line x1="292" y1="222" x2="292" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="345" y1="270" x2="295" y2="234" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <rect x="345" y="250" width="115" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="402.5" y="267" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Похилка ΔV</text>
  <text x="402.5" y="284" font-size="12" fill="#6b7280" text-anchor="middle">нелінійності</text>

  <!-- Right Panel 1: Interpolation Methods Comparison Card -->
  <rect x="590" y="80" width="345" height="235" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="605" y="104" font-size="14" font-weight="bold" fill="#1a1a1a">Порівняння методів інтерполяції</text>

  <!-- Sub-Card 1 (Linear) -->
  <rect x="605" y="116" width="315" height="82" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="618" y="135" font-size="13" font-weight="bold" fill="#c0392b">1. Лінійна інтерполяція (кускова)</text>
  <text x="618" y="155" font-size="12" fill="#1a1a1a">• Злами похідної dV/dh у вузлах калібровки</text>
  <text x="618" y="174" font-size="12" fill="#1a1a1a">• Похилка об'єму між точками досягає 15%</text>

  <!-- Sub-Card 2 (Spline) -->
  <rect x="605" y="210" width="315" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="618" y="230" font-size="13" font-weight="bold" fill="#27ae60">2. Кубічна сплайн-інтерполяція S(h)</text>
  <text x="618" y="250" font-size="12" fill="#1a1a1a">• Гладка крива C² (неперервні S', S'')</text>
  <text x="618" y="269" font-size="12" fill="#1a1a1a">• Точне відтворення нелінійної геометрії</text>
  <text x="618" y="288" font-size="12" fill="#1a1a1a">• Усуває злами та оптимізована для МК</text>

  <!-- Right Panel 2: Signal Processing Pipeline -->
  <rect x="590" y="330" width="345" height="165" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="605" y="354" font-size="14" font-weight="bold" fill="#2457d6">Алгоритм обробки сигналів давача</text>

  <text x="605" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">1. Вимірювання:</text>
  <text x="715" y="378" font-size="12" fill="#1a1a1a">АЦП / Первинне значення h_raw</text>

  <text x="605" y="402" font-size="12" font-weight="bold" fill="#1a1a1a">2. Фільтрація:</text>
  <text x="715" y="402" font-size="12" fill="#1a1a1a">Медіана + EMA (хвилі/сплески)</text>

  <text x="605" y="426" font-size="12" font-weight="bold" fill="#1a1a1a">3. Сплайн S(h):</text>
  <text x="715" y="426" font-size="12" fill="#1a1a1a">Обчислення об'єму V = S(h_filt)</text>

  <text x="605" y="450" font-size="12" font-weight="bold" fill="#1a1a1a">4. Результат:</text>
  <text x="715" y="450" font-size="12" fill="#1a1a1a">Точне значення V (літри / м³)</text>

  <text x="605" y="478" font-size="12" fill="#6b7280" font-style="italic">Калібрувальна таблиця LUT або кубічні коефіцієнти</text>
</svg>
