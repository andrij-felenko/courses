<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-gray-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переріз горизонтального циліндричного резервуара</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Площа заповнення S(h) зростає нелінійно через зміну ширини поверхні рідини L(h)</text>

  <!-- LEFT SECTION: TANK CROSS-SECTION -->
  <!-- Vertical Centerline -->
  <line x1="280" y1="135" x2="280" y2="455" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Liquid Filled Segment -->
  <path d="M 140.45 350 A 150 150 0 0 0 419.55 350 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Liquid Surface Line (Chord) -->
  <line x1="140.45" y1="350" x2="419.55" y2="350" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Outer Cylinder Wall -->
  <circle cx="280" cy="295" r="150" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Center Point O -->
  <circle cx="280" cy="295" r="4" fill="#1a1a1a"/>
  <text x="270" y="290" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">O</text>

  <!-- Radii lines to liquid endpoints A & B -->
  <line x1="280" y1="295" x2="140.45" y2="350" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="280" y1="295" x2="419.55" y2="350" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Radius line R -->
  <line x1="280" y1="295" x2="386.07" y2="188.93" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="343" y="235" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">R</text>

  <!-- Central Angle theta Arc & Label -->
  <path d="M 230.2 306.7 A 32 32 0 0 0 289.8 306.7" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="280" y="320" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">θ</text>

  <!-- Chord Width L(h) Dimension Line & Label -->
  <line x1="145" y1="370" x2="415" y2="370" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="280" y="365" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">L(h)</text>

  <!-- Liquid Area S(h) Label & Subtitle -->
  <text x="280" y="412" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">S(h)</text>
  <text x="280" y="430" font-size="12" fill="#6b7280" text-anchor="middle">(площа сегмента)</text>

  <!-- Height h Dimension Line & Extension Lines -->
  <line x1="130" y1="445" x2="80" y2="445" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="140.45" y1="350" x2="80" y2="350" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="90" y1="350" x2="90" y2="445" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="78" y="393" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="end">h</text>
  <text x="78" y="410" font-size="12" fill="#6b7280" text-anchor="end">(рівень)</text>

  <!-- Full Diameter D = 2R Dimension Line & Extension Lines -->
  <line x1="430" y1="145" x2="465" y2="145" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="430" y1="445" x2="465" y2="445" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="458" y1="145" x2="458" y2="445" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-gray-start)" marker-end="url(#arr-gray)"/>
  <text x="466" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">D = 2R</text>

  <!-- RIGHT SECTION: PANELS -->
  <!-- Top Panel: Formulas -->
  <rect x="520" y="85" width="420" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Математична модель перерізу</text>
  <text x="535" y="140" font-size="13" fill="#1a1a1a">• Центральний кут: <tspan font-weight="bold" fill="#2457d6">θ = 2 arccos(1 − h/R)</tspan></text>
  <text x="535" y="168" font-size="13" fill="#1a1a1a">• Ширина поверхні: <tspan font-weight="bold" fill="#2457d6">L(h) = 2 √(2Rh − h²)</tspan></text>
  <text x="535" y="196" font-size="13" fill="#1a1a1a">• Площа сегмента: <tspan font-weight="bold" fill="#2457d6">S(h) = ½ R² (θ − sin θ)</tspan></text>
  <text x="535" y="224" font-size="13" fill="#1a1a1a">• Об'єм рідини: <tspan font-weight="bold" fill="#2457d6">V(h) = L_рез · S(h)</tspan></text>
  <text x="535" y="252" font-size="12" fill="#6b7280">L_рез — довжина циліндричної частини бака</text>

  <!-- Bottom Panel: Graph -->
  <rect x="520" y="290" width="420" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="315" font-size="14" font-weight="bold" fill="#1a1a1a">Нелінійна залежність S(h)</text>

  <!-- Graph Axes -->
  <!-- X-axis -->
  <line x1="570" y1="475" x2="885" y2="475" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="898" y="479" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">h</text>

  <!-- Y-axis -->
  <line x1="580" y1="485" x2="580" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="580" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">S</text>

  <!-- Grid Lines & Ticks -->
  <!-- S_max -->
  <line x1="580" y1="360" x2="880" y2="360" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="572" y="364" font-size="12" fill="#6b7280" text-anchor="end">S_max</text>

  <!-- Ticks on X-axis -->
  <text x="580" y="493" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <!-- Tick R -->
  <line x1="730" y1="475" x2="730" y2="360" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="730" y1="475" x2="730" y2="479" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="730" y="493" font-size="12" fill="#6b7280" text-anchor="middle">R</text>

  <!-- Tick 2R -->
  <line x1="880" y1="475" x2="880" y2="360" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="880" y1="475" x2="880" y2="479" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="880" y="493" font-size="12" fill="#6b7280" text-anchor="middle">2R</text>

  <!-- Linear Reference Line -->
  <line x1="580" y1="475" x2="880" y2="360" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="770" y="445" font-size="12" fill="#6b7280" text-anchor="start">Лінійна стінка</text>

  <!-- Non-linear Cylinder Curve S(h) -->
  <path d="M 580 475 C 655 475, 805 360, 880 360" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="625" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">S(h) циліндра</text>

  <!-- Current level h mark on graph -->
  <line x1="673" y1="475" x2="673" y2="430.8" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1.5"/>
  <line x1="673" y1="475" x2="673" y2="479" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="673" cy="430.8" r="4" fill="#2457d6"/>
  <text x="673" y="493" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">h</text>
</svg>
