<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Ультразвукове вимірювання рівня рідини та температурна залежність c(T)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Відстань d обчислюється за часом прольоту t (d = c·t/2), а швидкість звуку c зростає на ~0.6 м/с на кожні 1°C</text>

  <!-- LEFT PANEL: Geometry of ToF -->
  <rect x="25" y="75" width="440" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схема ToF-вимірювання рівня</text>

  <!-- Sensor Transducer -->
  <text x="200" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Ультразвуковий давач</text>
  <rect x="170" y="130" width="60" height="26" rx="4" fill="#1a1a1a"/>
  <rect x="180" y="156" width="40" height="8" fill="#6b7280"/>

  <!-- Tank Container -->
  <!-- Liquid Body -->
  <rect x="120" y="300" width="160" height="130" fill="#eaf0fd" stroke="none"/>
  <!-- Liquid Surface -->
  <line x1="120" y1="300" x2="280" y2="300" stroke="#2457d6" stroke-width="2.5"/>
  <text x="200" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дзеркало рідини</text>
  <text x="200" y="365" text-anchor="middle" font-size="13" fill="#6b7280">Рідина в резервуарі</text>

  <!-- Tank Walls -->
  <path d="M 120,170 L 120,430 L 280,430 L 280,170" fill="none" stroke="#6b7280" stroke-width="3"/>

  <!-- Sound Waves (Direct & Reflected) -->
  <!-- Direct pulse down -->
  <line x1="185" y1="166" x2="185" y2="292" stroke="#2457d6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="175" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Прямий</text>
  <text x="175" y="238" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">імпульс</text>

  <!-- Echo pulse up -->
  <line x1="215" y1="292" x2="215" y2="166" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <text x="225" y="222" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Відбите</text>
  <text x="225" y="238" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">ехо</text>

  <!-- Dimensions -->
  <!-- Height H total (left side) -->
  <line x1="80" y1="164" x2="80" y2="430" stroke="#6b7280" stroke-width="1.2" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <line x1="70" y1="164" x2="115" y2="164" stroke="#d0d7de" stroke-width="1"/>
  <line x1="70" y1="430" x2="115" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="285" font-size="12" font-weight="bold" fill="#1a1a1a">H</text>
  <text x="32" y="301" font-size="12" fill="#6b7280">повна</text>
  <text x="32" y="317" font-size="12" fill="#6b7280">висота</text>

  <!-- Distance d (right side, top half) -->
  <line x1="330" y1="164" x2="330" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <line x1="285" y1="164" x2="345" y2="164" stroke="#d0d7de" stroke-width="1"/>
  <line x1="285" y1="300" x2="345" y2="300" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">d = c · t / 2</text>
  <text x="350" y="233" font-size="12" fill="#6b7280">дистанція ToF</text>

  <!-- Level h (right side, bottom half) -->
  <line x1="330" y1="300" x2="330" y2="430" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="285" y1="430" x2="345" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="355" font-size="12" font-weight="bold" fill="#2457d6">h = H - d</text>
  <text x="350" y="373" font-size="12" fill="#6b7280">рівень рідини</text>

  <!-- Bottom ToF formula box -->
  <rect x="40" y="440" width="410" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="245" y="460" text-anchor="middle" font-size="12" fill="#1a1a1a">Повний час прольоту: <tspan font-weight="bold" fill="#2457d6">t = 2d / c</tspan></text>

  <!-- RIGHT PANEL: Sound speed vs Temperature plot -->
  <rect x="490" y="75" width="445" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Залежність c(T) у повітрі</text>

  <!-- Formula Box -->
  <rect x="535" y="115" width="355" height="30" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">c(T) ≈ 331.3 + 0.606 · T  [м/с]</text>

  <!-- Grid lines -->
  <line x1="550" y1="333" x2="870" y2="333" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="550" y1="276" x2="870" y2="276" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="550" y1="218" x2="870" y2="218" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="550" y1="161" x2="870" y2="161" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="630" y1="160" x2="630" y2="400" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="710" y1="160" x2="710" y2="400" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="790" y1="160" x2="790" y2="400" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="870" y1="160" x2="870" y2="400" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Plot Axes -->
  <line x1="550" y1="400" x2="875" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="550" y1="400" x2="550" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <text x="882" y="404" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">T (°C)</text>
  <text x="550" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">c (м/с)</text>

  <!-- X axis ticks and labels -->
  <line x1="550" y1="400" x2="550" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="550" y="420" text-anchor="middle" font-size="12" fill="#6b7280">-20</text>

  <line x1="630" y1="400" x2="630" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="630" y="420" text-anchor="middle" font-size="12" fill="#6b7280">0</text>

  <line x1="710" y1="400" x2="710" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="710" y="420" text-anchor="middle" font-size="12" fill="#6b7280">+20</text>

  <line x1="790" y1="400" x2="790" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="790" y="420" text-anchor="middle" font-size="12" fill="#6b7280">+40</text>

  <line x1="870" y1="400" x2="870" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="870" y="420" text-anchor="middle" font-size="12" fill="#6b7280">+60</text>

  <!-- Y axis ticks and labels -->
  <text x="542" y="394" text-anchor="end" font-size="12" fill="#6b7280">319</text>

  <line x1="545" y1="333" x2="550" y2="333" stroke="#1a1a1a" stroke-width="1"/>
  <text x="542" y="337" text-anchor="end" font-size="12" fill="#6b7280">331</text>

  <line x1="545" y1="276" x2="550" y2="276" stroke="#1a1a1a" stroke-width="1"/>
  <text x="542" y="280" text-anchor="end" font-size="12" fill="#6b7280">343</text>

  <line x1="545" y1="218" x2="550" y2="218" stroke="#1a1a1a" stroke-width="1"/>
  <text x="542" y="222" text-anchor="end" font-size="12" fill="#6b7280">355</text>

  <line x1="545" y1="161" x2="550" y2="161" stroke="#1a1a1a" stroke-width="1"/>
  <text x="542" y="165" text-anchor="end" font-size="12" fill="#6b7280">368</text>

  <!-- Plot Line -->
  <line x1="550" y1="390" x2="870" y2="161" stroke="#2457d6" stroke-width="3"/>

  <!-- Reference Point at 20°C -->
  <line x1="710" y1="276" x2="710" y2="400" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="550" y1="276" x2="710" y2="276" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="710" cy="276" r="5" fill="#2457d6"/>
  <text x="718" y="268" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">20°C → 343.4 м/с</text>

  <!-- Reference Point at 0°C -->
  <circle cx="630" cy="333" r="4" fill="#2457d6"/>
  <text x="638" y="330" text-anchor="start" font-size="12" fill="#1a1a1a">0°C → 331.3 м/с</text>

  <!-- Warning box at bottom right -->
  <rect x="505" y="440" width="415" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Без компенсації: зміна T на 10°C дає похибку ~1.8%</text>
</svg>
