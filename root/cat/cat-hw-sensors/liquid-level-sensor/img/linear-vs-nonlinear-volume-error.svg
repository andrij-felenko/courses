<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність об'єму рідини V від рівня h у горизонтальному циліндрі</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Лінійна апроксимація призводить до значної систематичної похибки ΔV у нижній та верхній частинах резервуара</text>

  <!-- LEFT PANEL: GEOMETRY SCHEMATIC -->
  <rect x="25" y="80" width="270" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія циліндра</text>

  <!-- Cylinder Cross-section -->
  <circle cx="160" cy="205" r="55" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Cylinder center crosshair axes -->
  <line x1="95" y1="205" x2="225" y2="205" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="145" x2="160" y2="190" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="240" x2="160" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Liquid Segment Fill (h = 33 px, y_surface = 227) -->
  <path d="M 109.59 227 A 55 55 0 0 0 210.41 227 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="109.59" y1="227" x2="210.41" y2="227" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Dimension: Total Height H = 2R -->
  <line x1="70" y1="150" x2="70" y2="260" stroke="#6b7280" stroke-width="1"/>
  <line x1="65" y1="150" x2="75" y2="150" stroke="#6b7280" stroke-width="1"/>
  <line x1="65" y1="260" x2="75" y2="260" stroke="#6b7280" stroke-width="1"/>
  <text x="48" y="209" font-size="12" fill="#1a1a1a" text-anchor="middle">H = 2R</text>

  <!-- Dimension: Level h -->
  <line x1="235" y1="260" x2="235" y2="229" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="228" y1="260" x2="242" y2="260" stroke="#2457d6" stroke-width="1"/>
  <text x="248" y="249" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">h</text>

  <!-- Dimension: Surface Width b(h) -->
  <text x="160" y="220" font-size="12" fill="#2457d6" text-anchor="middle">b(h)</text>

  <!-- Formula Card Box Inside Left Panel -->
  <rect x="37" y="280" width="246" height="240" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="160" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Площа перерізу рідини A(h):</text>
  <text x="160" y="320" font-size="11" fill="#2457d6" text-anchor="middle">A(h) = R² · arccos((R − h) / R)</text>
  <text x="160" y="338" font-size="11" fill="#2457d6" text-anchor="middle">− (R − h) · √(2Rh − h²)</text>

  <line x1="47" y1="350" x2="273" y2="350" stroke="#e5e7eb" stroke-width="1"/>

  <text x="160" y="370" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точний об'єм (нелінійний):</text>
  <text x="160" y="390" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">V_real(h) = L · A(h)</text>

  <line x1="47" y1="402" x2="273" y2="402" stroke="#e5e7eb" stroke-width="1"/>

  <text x="160" y="422" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лінійна модель (помилкова):</text>
  <text x="160" y="442" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">V_lin(h) = V_max · (h / H)</text>

  <line x1="47" y1="454" x2="273" y2="454" stroke="#e5e7eb" stroke-width="1"/>

  <text x="160" y="474" font-size="12" fill="#6b7280" text-anchor="middle">dV/dh = L · b(h) ≠ const</text>
  <text x="160" y="494" font-size="11" fill="#6b7280" text-anchor="middle">(ширина поверхні змінюється з h)</text>


  <!-- RIGHT PANEL: GRAPH -->
  <rect x="310" y="80" width="625" height="455" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="622" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристика наповнення: V(h) vs V_lin(h)</text>

  <!-- Y Axis Title -->
  <text x="340" y="135" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Об'єм V (відносний V / V_max)</text>

  <!-- Grid Lines (segmented to avoid text box collisions) -->
  <line x1="410" y1="385" x2="430" y2="385" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="385" x2="860" y2="385" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="410" y1="310" x2="860" y2="310" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="410" y1="235" x2="860" y2="235" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="685" y1="160" x2="860" y2="160" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="522.5" y1="210" x2="522.5" y2="320" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="522.5" y1="380" x2="522.5" y2="460" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="635" y1="160" x2="635" y2="235" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="635" y1="310" x2="635" y2="460" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="747.5" y1="160" x2="747.5" y2="385" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="860" y1="160" x2="860" y2="460" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Systematic Error Zone 1 (Lower Area: V_lin > V_real) -->
  <path d="M 410 460 L 635 310 C 600 324.9, 557.5 388.4, 522.5 401.3 C 487.5 414.2, 450 460, 410 460 Z" fill="#fdecea" fill-opacity="0.8"/>

  <!-- Systematic Error Zone 2 (Upper Area: V_lin < V_real) -->
  <path d="M 635 310 L 860 160 C 820 160, 782.5 205.8, 747.5 218.7 C 712.5 231.6, 670 295.1, 635 310 Z" fill="#fdecea" fill-opacity="0.8"/>

  <!-- Linear Model Line (Ideal straight line) -->
  <line x1="410" y1="460" x2="860" y2="160" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Real Non-linear Curve V_real(h) -->
  <path d="M 410 460 C 450 460, 487.5 414.2, 522.5 401.3 C 557.5 388.4, 600 324.9, 635 310 C 670 295.1, 712.5 231.6, 747.5 218.7 C 782.5 205.8, 820 160, 860 160" fill="none" stroke="#2457d6" stroke-width="3.5"/>

  <!-- Graph Axes -->
  <line x1="410" y1="460" x2="885" y2="460" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="460" x2="410" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Y Axis Ticks & Labels -->
  <line x1="405" y1="160" x2="410" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">V_max</text>

  <line x1="405" y1="235" x2="410" y2="235" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="239" font-size="12" fill="#6b7280" text-anchor="end">0.75 V_max</text>

  <line x1="405" y1="310" x2="410" y2="310" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="314" font-size="12" fill="#6b7280" text-anchor="end">0.5 V_max</text>

  <line x1="405" y1="385" x2="410" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="389" font-size="12" fill="#6b7280" text-anchor="end">0.25 V_max</text>

  <line x1="405" y1="460" x2="410" y2="460" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="464" font-size="12" fill="#1a1a1a" text-anchor="end">0</text>

  <!-- X Axis Ticks & Labels -->
  <line x1="410" y1="460" x2="410" y2="465" stroke="#1a1a1a" stroke-width="1"/>
  <text x="410" y="480" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>

  <line x1="522.5" y1="460" x2="522.5" y2="465" stroke="#1a1a1a" stroke-width="1"/>
  <text x="522.5" y="480" font-size="12" fill="#6b7280" text-anchor="middle">0.25 H</text>

  <line x1="635" y1="460" x2="635" y2="465" stroke="#1a1a1a" stroke-width="1"/>
  <text x="635" y="480" font-size="12" fill="#6b7280" text-anchor="middle">0.5 H</text>

  <line x1="747.5" y1="460" x2="747.5" y2="465" stroke="#1a1a1a" stroke-width="1"/>
  <text x="747.5" y="480" font-size="12" fill="#6b7280" text-anchor="middle">0.75 H</text>

  <line x1="860" y1="460" x2="860" y2="465" stroke="#1a1a1a" stroke-width="1"/>
  <text x="860" y="480" font-size="12" fill="#1a1a1a" text-anchor="middle">H</text>

  <text x="635" y="515" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рівень рідини h (відносний рівень h / H)</text>

  <!-- LEGEND PANEL -->
  <rect x="430" y="155" width="250" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <line x1="445" y1="173" x2="470" y2="173" stroke="#2457d6" stroke-width="3.5"/>
  <text x="480" y="177" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Реальна залежність V_real(h)</text>

  <line x1="445" y1="193" x2="470" y2="193" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="480" y="197" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Лінійна модель V_lin(h)</text>

  <!-- CALLOUT 1: LOWER ERROR ZONE -->
  <line x1="522.5" y1="385" x2="522.5" y2="401.3" stroke="#c0392b" stroke-width="2"/>
  <circle cx="522.5" cy="385" r="3" fill="#c0392b"/>
  <circle cx="522.5" cy="401.3" r="3" fill="#c0392b"/>

  <rect x="435" y="325" width="160" height="44" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="515" y="342" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Завищення об'єму (ΔV > 0)</text>
  <text x="515" y="359" font-size="12" fill="#c0392b" text-anchor="middle">V_lin > V_real (до +5.5%)</text>
  <line x1="515" y1="369" x2="522.5" y2="385" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- INFLECTION POINT (CENTER: h = 0.5 H) -->
  <circle cx="635" cy="310" r="5" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  <rect x="520" y="240" width="150" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="256" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Точна точка (h = 0.5 H)</text>
  <text x="595" y="271" font-size="11" fill="#27ae60" text-anchor="middle">Похибка ΔV = 0</text>
  <line x1="620" y1="278" x2="635" y2="305" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- CALLOUT 2: UPPER ERROR ZONE -->
  <line x1="747.5" y1="218.7" x2="747.5" y2="235" stroke="#c0392b" stroke-width="2"/>
  <circle cx="747.5" cy="218.7" r="3" fill="#c0392b"/>
  <circle cx="747.5" cy="235" r="3" fill="#c0392b"/>

  <rect x="675" y="390" width="160" height="44" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="755" y="407" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Заниження об'єму (ΔV &lt; 0)</text>
  <text x="755" y="424" font-size="12" fill="#c0392b" text-anchor="middle">V_lin &lt; V_real (до −5.5%)</text>
  <line x1="747.5" y1="235" x2="747.5" y2="390" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

</svg>
