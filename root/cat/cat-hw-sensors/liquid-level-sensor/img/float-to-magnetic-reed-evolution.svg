<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція ізоляції давачів рівня: від важеля до геркона</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Магнітне поле крізь суцільну стінку усуває рухомі сальники та небезпеку витоків</text>

  <!-- Left Panel Container (Problem) -->
  <rect x="30" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Header Badge -->
  <rect x="45" y="92" width="405" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">МЕХАНІЧНИЙ ШТОК ІЗ САЛЬНИКОМ (ПРОБЛЕМА)</text>

  <!-- Left Diagram Graphics -->
  <!-- Tank Wall Segments -->
  <rect x="160" y="167" width="14" height="10" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="160" y="203" width="14" height="102" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Tank Liquid -->
  <rect x="45" y="210" width="115" height="95" fill="#eaf0fd"/>
  <line x1="45" y1="210" x2="160" y2="210" stroke="#2457d6" stroke-width="2"/>
  <rect x="52" y="268" width="100" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="102" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Рідина в баку</text>

  <!-- Float -->
  <rect x="60" y="176" width="75" height="30" rx="5" fill="#ffd166" stroke="#d97706" stroke-width="1.5"/>
  <text x="97.5" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Поплавок</text>

  <!-- Shaft / Rod -->
  <line x1="135" y1="190" x2="280" y2="190" stroke="#374151" stroke-width="4"/>

  <!-- Gland Seal -->
  <rect x="154" y="177" width="26" height="26" rx="3" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <rect x="158" y="181" width="18" height="18" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Gland Label & Line -->
  <rect x="90" y="138" width="150" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="165" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Сальник (ущільнення)</text>
  <line x1="165" y1="162" x2="165" y2="175" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-red)"/>

  <!-- Drips of Leakage -->
  <path d="M186,213 Q183,221 186,225 Q189,221 186,213 Z" fill="#c0392b"/>
  <path d="M186,230 Q183,238 186,242 Q189,238 186,230 Z" fill="#c0392b"/>
  <path d="M186,247 Q183,255 186,259 Q189,255 186,247 Z" fill="#c0392b"/>

  <rect x="215" y="235" width="110" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="270" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Знос і витік</text>
  <line x1="215" y1="247" x2="194" y2="247" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-red)"/>

  <!-- External Switch Unit -->
  <rect x="280" y="175" width="75" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="292" cy="183" r="3" fill="#1a1a1a"/>
  <circle cx="292" cy="197" r="3" fill="#1a1a1a"/>
  <line x1="292" y1="183" x2="315" y2="183" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="292" y1="197" x2="325" y2="186" stroke="#c0392b" stroke-width="2"/>

  <rect x="260" y="138" width="135" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="327.5" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Відкриті контакти</text>
  <line x1="327.5" y1="162" x2="327.5" y2="173" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-grey)"/>

  <!-- Left Cards -->
  <!-- Card 1 -->
  <rect x="45" y="325" width="405" height="44" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="55" y="333" width="28" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="69" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">⚠</text>
  <text x="95" y="342" font-size="12" font-weight="bold" fill="#c0392b">Неминучий знос сальника</text>
  <text x="95" y="359" font-size="12" fill="#6b7280">Тертя штока руйнує набивання й спричиняє протікання</text>

  <!-- Card 2 -->
  <rect x="45" y="383" width="405" height="44" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="55" y="391" width="28" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="69" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">⚠</text>
  <text x="95" y="400" font-size="12" font-weight="bold" fill="#c0392b">Ризик заклинювання важеля</text>
  <text x="95" y="417" font-size="12" fill="#6b7280">Сольові відкладення та корозія блокують рух штока</text>

  <!-- Card 3 -->
  <rect x="45" y="441" width="405" height="44" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="55" y="449" width="28" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="69" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">⚠</text>
  <text x="95" y="458" font-size="12" font-weight="bold" fill="#c0392b">Вплив зовнішнього середовища</text>
  <text x="95" y="475" font-size="12" fill="#6b7280">Пари рідини спричиняють окислення контактів</text>


  <!-- Right Panel Container (Solution) -->
  <rect x="495" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Right Header Badge -->
  <rect x="510" y="92" width="405" height="32" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ГЕРМЕТИЧНИЙ ГЕРКОН З МАГНІТНИМ ПОПЛАВКОМ (РІШЕННЯ)</text>

  <!-- Right Diagram Graphics -->
  <!-- Liquid surrounding tube -->
  <rect x="505" y="230" width="85" height="75" fill="#eaf0fd"/>
  <line x1="505" y1="230" x2="590" y2="230" stroke="#2457d6" stroke-width="2"/>
  <rect x="740" y="230" width="175" height="75" fill="#eaf0fd"/>
  <line x1="740" y1="230" x2="915" y2="230" stroke="#2457d6" stroke-width="2"/>

  <rect x="755" y="268" width="145" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="827.5" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ізольована рідина</text>

  <!-- Sealed Tube (Caps abut body cleanly without overlap) -->
  <rect x="647" y="162" width="36" height="8" rx="2" fill="#374151"/>
  <rect x="650" y="170" width="30" height="135" rx="4" fill="#f4f6f8" stroke="#4b5563" stroke-width="2"/>
  <rect x="654" y="174" width="22" height="127" rx="2" fill="#ffffff"/>
  <rect x="647" y="305" width="36" height="8" rx="2" fill="#374151"/>

  <rect x="505" y="138" width="120" height="24" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/>
  <text x="565" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Суцільна стінка</text>
  <line x1="625" y1="150" x2="647" y2="166" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-grey)"/>

  <!-- Reed Switch Capsule & Contacts -->
  <rect x="659" y="215" width="12" height="40" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <line x1="665" y1="174" x2="665" y2="231" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="665" y1="295" x2="665" y2="239" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="663" y1="231" x2="667" y2="236" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="667" y1="239" x2="663" y2="234" stroke="#2457d6" stroke-width="1.5"/>

  <rect x="505" y="183" width="110" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="560" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Геркон у колбі</text>
  <line x1="615" y1="195" x2="655" y2="225" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>

  <!-- Ring Float with Magnets -->
  <rect x="605" y="210" width="33" height="50" rx="4" fill="#ffd166" stroke="#d97706" stroke-width="1.5"/>
  <rect x="692" y="210" width="33" height="50" rx="4" fill="#ffd166" stroke="#d97706" stroke-width="1.5"/>

  <!-- Magnets -->
  <rect x="611" y="220" width="20" height="30" rx="2" fill="#c0392b" stroke="#900c3f" stroke-width="1"/>
  <text x="621" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">N</text>
  <text x="621" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S</text>

  <rect x="698" y="220" width="20" height="30" rx="2" fill="#c0392b" stroke="#900c3f" stroke-width="1"/>
  <text x="708" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">N</text>
  <text x="708" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S</text>

  <!-- Magnetic Field Lines -->
  <path d="M638,235 C646,230 652,230 658,235" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <path d="M692,235 C684,230 678,230 672,235" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

  <rect x="740" y="183" width="145" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="812.5" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Магнітна взаємодія</text>
  <line x1="740" y1="195" x2="727" y2="220" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-green)"/>

  <!-- Right Cards -->
  <!-- Card 1 -->
  <rect x="510" y="325" width="405" height="44" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="520" y="333" width="28" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="534" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✓</text>
  <text x="560" y="342" font-size="12" font-weight="bold" fill="#27ae60">100% Герметична ізоляція</text>
  <text x="560" y="359" font-size="12" fill="#6b7280">Абсолютна відсутність сальників та отворів у стінці</text>

  <!-- Card 2 -->
  <rect x="510" y="383" width="405" height="44" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="520" y="391" width="28" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="534" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✓</text>
  <text x="560" y="400" font-size="12" font-weight="bold" fill="#27ae60">Безконтактна передача руху</text>
  <text x="560" y="417" font-size="12" fill="#6b7280">Магнітне поле працює без тертя та заклинювання</text>

  <!-- Card 3 -->
  <rect x="510" y="441" width="405" height="44" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="520" y="449" width="28" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="534" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✓</text>
  <text x="560" y="458" font-size="12" font-weight="bold" fill="#27ae60">Ізольована контактна група</text>
  <text x="560" y="475" font-size="12" fill="#6b7280">Контакти геркона запаяні в інертному газі (азот/аргон)</text>
</svg>
