<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="url(#bgGrad2)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Цокольовка корпусу та сигнальна часова діаграма VL53L0X
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Корпус LGA12 (вигляд знизу) та послідовність стартової ініціалізації з перепризначенням I2C адреси
  </text>

  <!-- Left Side: LGA12 Pinout (Bottom View) -->
  <g transform="translate(50, 90)">
    <rect width="320" height="410" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="160" y="30" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Корпус LGA12 (4.4 × 2.4 мм)</text>
    <text x="160" y="48" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Вигляд знизу на контактні площадки</text>

    <!-- Chip Outline -->
    <rect x="70" y="70" width="180" height="300" rx="6" fill="url(#chipGrad)" stroke="#4b5563" stroke-width="2"/>
    <circle cx="90" cy="88" r="4" fill="#ef4444"/> <!-- Pin 1 index dot -->
    <text x="160" y="215" fill="#475569" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">VL53L0X</text>
    <text x="160" y="235" fill="#334155" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">LGA 12-pin</text>

    <!-- Left Pins (1 to 6) -->
    <!-- Pin 1 -->
    <rect x="70" y="90" width="30" height="18" fill="#f59e0b" rx="2"/>
    <text x="55" y="103" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">1: AVDDVCSEL</text>

    <!-- Pin 2 -->
    <rect x="70" y="130" width="30" height="18" fill="#64748b" rx="2"/>
    <text x="55" y="143" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">2: AVSSVCSEL</text>

    <!-- Pin 3 -->
    <rect x="70" y="170" width="30" height="18" fill="#64748b" rx="2"/>
    <text x="55" y="183" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">3: GND</text>

    <!-- Pin 4 -->
    <rect x="70" y="210" width="30" height="18" fill="#64748b" rx="2"/>
    <text x="55" y="223" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">4: GND2</text>

    <!-- Pin 5 -->
    <rect x="70" y="250" width="30" height="18" fill="#38bdf8" rx="2"/>
    <text x="55" y="263" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">5: XSHUT</text>

    <!-- Pin 6 -->
    <rect x="70" y="290" width="30" height="18" fill="#64748b" rx="2"/>
    <text x="55" y="303" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">6: GND3</text>

    <!-- Right Pins (12 down to 7) -->
    <!-- Pin 12 -->
    <rect x="220" y="90" width="30" height="18" fill="#f59e0b" rx="2"/>
    <text x="265" y="103" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start">12: VDD_IO</text>

    <!-- Pin 11 -->
    <rect x="220" y="130" width="30" height="18" fill="#f59e0b" rx="2"/>
    <text x="265" y="143" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start">11: AVDD</text>

    <!-- Pin 10 -->
    <rect x="220" y="170" width="30" height="18" fill="#10b981" rx="2"/>
    <text x="265" y="183" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start">10: SCL</text>

    <!-- Pin 9 -->
    <rect x="220" y="210" width="30" height="18" fill="#10b981" rx="2"/>
    <text x="265" y="223" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start">9: SDA</text>

    <!-- Pin 8 -->
    <rect x="220" y="250" width="30" height="18" fill="#475569" rx="2"/>
    <text x="265" y="263" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start">8: DNC</text>

    <!-- Pin 7 -->
    <rect x="220" y="290" width="30" height="18" fill="#c084fc" rx="2"/>
    <text x="265" y="303" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="start">7: GPIO1</text>
  </g>

  <!-- Right Side: Timing Diagram -->
  <g transform="translate(410, 90)">
    <rect width="420" height="410" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="210" y="30" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Часова діаграма старту та зміни адреси</text>

    <!-- Timeline Grid lines -->
    <line x1="100" y1="55" x2="100" y2="380" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="160" y1="55" x2="160" y2="380" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="280" y1="55" x2="280" y2="380" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="360" y1="55" x2="360" y2="380" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Signal 1: VDD (Power) -->
    <text x="20" y="85" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">VDD (2.8V)</text>
    <path d="M 90 90 L 120 90 L 130 65 L 390 65" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="135" y="60" fill="#fbbf24" font-family="system-ui" font-size="10">Живлення подано</text>

    <!-- Signal 2: XSHUT (Wakeup) -->
    <text x="20" y="150" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">XSHUT</text>
    <path d="M 90 160 L 160 160 L 170 135 L 390 135" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="175" y="130" fill="#7dd3fc" font-family="system-ui" font-size="10">Пробудження з RESET</text>
    <rect x="170" y="142" width="70" height="15" fill="#0369a1" fill-opacity="0.4"/>
    <text x="205" y="153" fill="#bae6fd" font-family="system-ui" font-size="9.5" text-anchor="middle">t_boot ~1.2мс</text>

    <!-- Signal 3: I2C Bus -->
    <text x="20" y="225" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">I2C Bus</text>
    <!-- Idle high -->
    <line x1="90" y1="210" x2="240" y2="210" stroke="#34d399" stroke-width="2"/>
    <!-- Packet 1: default 0x29 -->
    <rect x="240" y="200" width="70" height="20" rx="3" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="275" y="214" fill="#a7f3d0" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Addr 0x29</text>
    <!-- Packet 2: Set New Addr -->
    <rect x="315" y="200" width="70" height="20" rx="3" fill="#047857" stroke="#10b981" stroke-width="1"/>
    <text x="350" y="214" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Set 0x30</text>
    <text x="275" y="235" fill="#6ee7b7" font-family="system-ui" font-size="10" text-anchor="middle">Зміна адреси</text>

    <!-- Signal 4: GPIO1 (Interrupt / Data Ready) -->
    <text x="20" y="300" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">GPIO1 (IRQ)</text>
    <path d="M 90 285 L 340 285 L 345 310 L 375 310 L 380 285 L 390 285" fill="none" stroke="#c084fc" stroke-width="2"/>
    <text x="360" y="325" fill="#e9d5ff" font-family="system-ui" font-size="10" text-anchor="middle">Ready Pulse</text>

    <!-- Explanatory legend box -->
    <rect x="20" y="340" width="380" height="55" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="358" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Мультисенсорний запуск:</text>
    <text x="30" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Всі XSHUT в 0 → підняти XSHUT1 → змінити на 0x30 → підняти XSHUT2 → змінити на 0x31</text>
  </g>
</svg>