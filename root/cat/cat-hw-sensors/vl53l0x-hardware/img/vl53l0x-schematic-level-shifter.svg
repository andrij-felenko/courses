<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="540" fill="url(#bgGrad3)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Принципова схема підключення VL53L0X до 5 В мікроконтролера
  </text>
  <text x="450" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Двонаправлений перетворювач рівнів I2C на MOSFET BSS138 та стабілізатор живлення LDO 2.8 В
  </text>

  <!-- Left: 5V MCU Domain -->
  <g transform="translate(40, 90)">
    <rect width="180" height="400" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="30" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">5 В Контролер (AVR)</text>

    <!-- Pins -->
    <rect x="130" y="60" width="50" height="25" fill="#ef4444" rx="3"/>
    <text x="155" y="77" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">5V</text>

    <rect x="130" y="120" width="50" height="25" fill="#64748b" rx="3"/>
    <text x="155" y="137" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GND</text>

    <rect x="130" y="180" width="50" height="25" fill="#10b981" rx="3"/>
    <text x="155" y="197" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SDA</text>

    <rect x="130" y="240" width="50" height="25" fill="#10b981" rx="3"/>
    <text x="155" y="257" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SCL</text>

    <rect x="130" y="300" width="50" height="25" fill="#38bdf8" rx="3"/>
    <text x="155" y="317" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">D4 (XSHUT)</text>

    <rect x="130" y="350" width="50" height="25" fill="#c084fc" rx="3"/>
    <text x="155" y="367" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">D2 (GPIO1)</text>
  </g>

  <!-- Middle: Breakout Board / Level Shifter & LDO Circuit -->
  <g transform="translate(260, 90)">
    <rect width="380" height="400" rx="8" fill="#090d16" fill-opacity="0.8" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="190" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Схема модуля розширення (Breakout Board)</text>

    <!-- LDO Regulator -->
    <rect x="30" y="50" width="130" height="75" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="95" y="75" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LDO 2.8V / 3.3V</text>
    <text x="95" y="93" fill="#a5b4fc" font-family="monospace" font-size="10.5" text-anchor="middle">XC6206 / ME6211</text>
    <text x="95" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Cin: 10µF | Cout: 10µF</text>

    <!-- MOSFET Level Shifter SDA -->
    <rect x="30" y="160" width="320" height="55" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="180" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="bold">I2C SDA Перетворювач</text>
    <circle cx="190" cy="190" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="190" y="194" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">MOSFET</text>
    <text x="110" y="195" fill="#cbd5e1" font-family="system-ui" font-size="10">Pull-up 10k (5V)</text>
    <text x="270" y="195" fill="#cbd5e1" font-family="system-ui" font-size="10">Pull-up 10k (2.8V)</text>

    <!-- MOSFET Level Shifter SCL -->
    <rect x="30" y="225" width="320" height="55" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="245" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="bold">I2C SCL Перетворювач</text>
    <circle cx="190" cy="255" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="190" y="259" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">MOSFET</text>
    <text x="110" y="260" fill="#cbd5e1" font-family="system-ui" font-size="10">Pull-up 10k (5V)</text>
    <text x="270" y="260" fill="#cbd5e1" font-family="system-ui" font-size="10">Pull-up 10k (2.8V)</text>

    <!-- XSHUT Divider -->
    <rect x="30" y="295" width="320" height="45" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="40" y="315" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="bold">XSHUT Дільник / Зсувач</text>
    <text x="190" y="322" fill="#38bdf8" font-family="system-ui" font-size="10.5" text-anchor="middle">Резистивний дільник 1.8k / 3.3k або MOSFET</text>

    <!-- Decoupling Capacitors -->
    <rect x="30" y="350" width="320" height="38" rx="5" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="190" y="373" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Блокувальні керамічні ємності: C1 = 100 нФ (X7R), C2 = 4.7 мкФ
    </text>
  </g>

  <!-- Right: VL53L0X Chip Domain -->
  <g transform="translate(680, 90)">
    <rect width="180" height="400" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="30" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VL53L0X Датчик</text>

    <!-- Chip Pins -->
    <rect x="0" y="60" width="50" height="25" fill="#ef4444" rx="3"/>
    <text x="25" y="77" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">VDD</text>

    <rect x="0" y="120" width="50" height="25" fill="#64748b" rx="3"/>
    <text x="25" y="137" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GND</text>

    <rect x="0" y="180" width="50" height="25" fill="#10b981" rx="3"/>
    <text x="25" y="197" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SDA</text>

    <rect x="0" y="240" width="50" height="25" fill="#10b981" rx="3"/>
    <text x="25" y="257" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SCL</text>

    <rect x="0" y="300" width="50" height="25" fill="#38bdf8" rx="3"/>
    <text x="25" y="317" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">XSHUT</text>

    <rect x="0" y="350" width="50" height="25" fill="#c084fc" rx="3"/>
    <text x="25" y="367" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GPIO1</text>
  </g>

  <!-- Connectors from Left to Middle and Middle to Right -->
  <line x1="220" y1="162" x2="260" y2="162" stroke="#ef4444" stroke-width="2"/>
  <line x1="220" y1="222" x2="260" y2="222" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="282" x2="260" y2="282" stroke="#10b981" stroke-width="2"/>
  <line x1="220" y1="342" x2="260" y2="342" stroke="#10b981" stroke-width="2"/>
  <line x1="220" y1="402" x2="260" y2="402" stroke="#38bdf8" stroke-width="2"/>

  <line x1="640" y1="162" x2="680" y2="162" stroke="#ef4444" stroke-width="2"/>
  <line x1="640" y1="222" x2="680" y2="222" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="282" x2="680" y2="282" stroke="#10b981" stroke-width="2"/>
  <line x1="640" y1="342" x2="680" y2="342" stroke="#10b981" stroke-width="2"/>
  <line x1="640" y1="402" x2="680" y2="402" stroke="#38bdf8" stroke-width="2"/>
</svg>