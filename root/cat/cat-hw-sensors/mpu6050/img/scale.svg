<rect x="40.0" y="372.0" width="700.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="385.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">16 біт = 65536 сходинок ділять обраний діапазон. Вужчий діапазон → дрібніший крок (точніше),</tspan><tspan x="390.0" dy="15.6">але сильний удар/оберт вилазить за край і насичується. Обирай найвужчий, що вмістить рух.</tspan></text>
