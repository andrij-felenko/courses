<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Матеріали захисних гільз та інженерна матриця вибору для агресивних середовищ</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Порівняння нержавіючих сталей, суперсплавів на основі нікелю, титану та корундової кераміки</text>

  <!-- Таблиця матеріалів (6 рядків) -->
  <g transform="translate(30, 85)">
    <!-- Шапка таблиці -->
    <rect x="0" y="0" width="900" height="40" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="120" y="25" fill="#f0f6fc" font-size="12" font-weight="700">Матеріал / Сплав</text>
    <text x="310" y="25" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">Макс. T (°C)</text>
    <text x="460" y="25" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Корозійна стійкість</text>
    <text x="640" y="25" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">Типові технологічні середовища</text>
    <text x="820" y="25" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">Відносна вартість</text>

    <!-- Рядок 1: AISI 316L -->
    <rect x="0" y="44" width="900" height="52" fill="#161b22"/>
    <circle cx="20" cy="70" r="6" fill="#58a6ff"/>
    <text x="35" y="65" fill="#79c0ff" font-size="12" font-weight="700">AISI 316L (1.4404)</text>
    <text x="35" y="82" fill="#8b949e" font-size="10">Нержавіюча аустенітна сталь</text>
    <text x="310" y="72" fill="#f0f6fc" font-size="11" text-anchor="middle">До +600 °C</text>
    <text x="460" y="72" fill="#3fb950" font-size="11" text-anchor="middle">Універсальна промислова</text>
    <text x="640" y="65" fill="#f0f6fc" font-size="11" text-anchor="middle">Вода, пара, нафта, харчові продукти,</text>
    <text x="640" y="82" fill="#8b949e" font-size="10" text-anchor="middle">слабкі органічні кислоти</text>
    <text x="820" y="72" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Базова (1x)</text>

    <!-- Рядок 2: Hastelloy C-276 -->
    <rect x="0" y="100" width="900" height="52" fill="#0d1117"/>
    <circle cx="20" cy="126" r="6" fill="#3fb950"/>
    <text x="35" y="121" fill="#56d364" font-size="12" font-weight="700">Hastelloy C-276</text>
    <text x="35" y="138" fill="#8b949e" font-size="10">Нікель-молібден-хромовий сплав</text>
    <text x="310" y="128" fill="#f0f6fc" font-size="11" text-anchor="middle">До +1000 °C</text>
    <text x="460" y="128" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Екстремальна стійкість</text>
    <text x="640" y="121" fill="#f0f6fc" font-size="11" text-anchor="middle">Гаряча соляна (HCl) та сірчана кислоти,</text>
    <text x="640" y="138" fill="#8b949e" font-size="10" text-anchor="middle">вологий хлор, пітинг та щілинна корозія</text>
    <text x="820" y="128" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Висока (6x...8x)</text>

    <!-- Рядок 3: Inconel 600 / 625 -->
    <rect x="0" y="156" width="900" height="52" fill="#161b22"/>
    <circle cx="20" cy="182" r="6" fill="#f0883e"/>
    <text x="35" y="177" fill="#ffa657" font-size="12" font-weight="700">Inconel 600 / 625</text>
    <text x="35" y="194" fill="#8b949e" font-size="10">Жароміцний нікелевий суперсплав</text>
    <text x="310" y="184" fill="#ff7b72" font-size="11" font-weight="700" text-anchor="middle">До +1150 °C</text>
    <text x="460" y="184" fill="#3fb950" font-size="11" text-anchor="middle">Висока жаростійкість</text>
    <text x="640" y="177" fill="#f0f6fc" font-size="11" text-anchor="middle">Високотемпературне окислення в печах,</text>
    <text x="640" y="194" fill="#8b949e" font-size="10" text-anchor="middle">гази спалювання, термообробка металів</text>
    <text x="820" y="184" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Висока (5x...7x)</text>

    <!-- Рядок 4: Monel 400 -->
    <rect x="0" y="212" width="900" height="52" fill="#0d1117"/>
    <circle cx="20" cy="238" r="6" fill="#d2a8ff"/>
    <text x="35" y="233" fill="#d2a8ff" font-size="12" font-weight="700">Monel 400 (Ni-Cu)</text>
    <text x="35" y="250" fill="#8b949e" font-size="10">Нікель-мідний сплав</text>
    <text x="310" y="240" fill="#f0f6fc" font-size="11" text-anchor="middle">До +550 °C</text>
    <text x="460" y="240" fill="#3fb950" font-size="11" text-anchor="middle">Інертний до морської солі</text>
    <text x="640" y="233" fill="#f0f6fc" font-size="11" text-anchor="middle">Морська вода, опріснювальні станції,</text>
    <text x="640" y="250" fill="#8b949e" font-size="10" text-anchor="middle">плавикова кислота (HF), офшорні платформи</text>
    <text x="820" y="240" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Середня (4x...5x)</text>

    <!-- Рядок 5: Корундова кераміка Al2O3 -->
    <rect x="0" y="268" width="900" height="52" fill="#161b22"/>
    <circle cx="20" cy="294" r="6" fill="#ff7b72"/>
    <text x="35" y="289" fill="#ff7b72" font-size="12" font-weight="700">Кераміка Al2O3 (Alsint 99.7)</text>
    <text x="35" y="306" fill="#8b949e" font-size="10">Оксид алюмінію / Корунд</text>
    <text x="310" y="296" fill="#ff7b72" font-size="11" font-weight="700" text-anchor="middle">До +1700...+1800 °C</text>
    <text x="460" y="296" fill="#3fb950" font-size="11" text-anchor="middle">Повна хімічна інертність</text>
    <text x="640" y="289" fill="#f0f6fc" font-size="11" text-anchor="middle">Плавильні печі сталі та скла, сміттєспалювачі,</text>
    <text x="640" y="306" fill="#8b949e" font-size="10" text-anchor="middle">газощільний захист платинових термопар S/R/B</text>
    <text x="820" y="296" fill="#d2a8ff" font-size="11" font-weight="700" text-anchor="middle">Преміум (10x+)</text>

    <!-- Рядок 6: PTFE / Фторопластове покриття -->
    <rect x="0" y="324" width="900" height="46" fill="#0d1117"/>
    <circle cx="20" cy="347" r="6" fill="#388bfd"/>
    <text x="35" y="343" fill="#388bfd" font-size="12" font-weight="700">Покриття PTFE / PFA</text>
    <text x="35" y="358" fill="#8b949e" font-size="9">Фторопластовий шар на сталі</text>
    <text x="310" y="349" fill="#f0f6fc" font-size="11" text-anchor="middle">До +200 °C</text>
    <text x="460" y="349" fill="#3fb950" font-size="11" text-anchor="middle">Абсолютна інертність</text>
    <text x="640" y="349" fill="#f0f6fc" font-size="11" text-anchor="middle">Царська горілка, азотна кислота, гальваніка</text>
    <text x="820" y="349" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">Середня (3x...4x)</text>
  </g>

  <!-- Підсумок внизу -->
  <g transform="translate(30, 460)">
    <rect width="900" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="20" fill="#58a6ff" font-size="11" font-weight="700">ІНЖЕНЕРНИЙ ВИСНОВОК:</text>
    <text x="20" y="37" fill="#f0f6fc" font-size="10">
      Сталь 316L покриває 80% промислових завдань. При появі іонів хлору (Cl-) понад 200 ppm обов'язковий перехід на Hastelloy або Titanium для запобігання корозійному розтріскуванню під напругою (SCC).
    </text>
  </g>
</svg>
