<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Геометричні профілі та конструкції промислових захисних гільз (Thermowells)</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Класифікація за формою стрижня: пряма, ступінчаста, конічна та методи виготовлення</text>

  <!-- Схема трьох профілів (3 колонки) -->
  <g transform="translate(30, 90)">
    <!-- 1. Пряма гільза (Straight) -->
    <rect x="10" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="10" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="28" cy="26" r="6" fill="#58a6ff"/>
    <text x="42" y="31" fill="#f0f6fc" font-size="13" font-weight="700">1. Прямий профіль (Straight)</text>

    <!-- Креслення прямої гільзи -->
    <g transform="translate(30, 55)">
      <!-- Монтажна шестигранна гайка / фланець -->
      <rect x="25" y="10" width="60" height="24" rx="2" fill="#30363d" stroke="#8b949e" stroke-width="1.2"/>
      <line x1="25" y1="22" x2="85" y2="22" stroke="#8b949e" stroke-width="1"/>
      <text x="55" y="6" fill="#8b949e" font-size="9" text-anchor="middle">Різьба G 1/2"</text>

      <!-- Тіло гільзи (постійний діаметр) -->
      <path d="M 40 34 L 40 160 Q 40 168 55 168 Q 70 168 70 160 L 70 34 Z" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
      <!-- Внутрішній канал під сенсор -->
      <path d="M 47 34 L 47 155 Q 47 160 55 160 Q 63 160 63 155 L 63 34" fill="#0d1117" stroke="#388bfd" stroke-width="1.2" stroke-dasharray="3,2"/>
      
      <!-- Розмірні стрілки -->
      <line x1="15" y1="34" x2="15" y2="168" stroke="#8b949e" stroke-width="1"/>
      <text x="10" y="105" fill="#8b949e" font-size="10" text-anchor="end">U</text>
      
      <line x1="80" y1="100" x2="110" y2="100" stroke="#58a6ff" stroke-width="1"/>
      <text x="115" y="104" fill="#58a6ff" font-size="10">D = const (16 мм)</text>
    </g>

    <text x="25" y="245" fill="#f0f6fc" font-size="11" font-weight="600">Особливості конструкції:</text>
    <text x="25" y="265" fill="#c9d1d9" font-size="10">• Однорідний зовнішній діаметр по довжині</text>
    <text x="25" y="282" fill="#c9d1d9" font-size="10">• Найпростіша в механічній обробці</text>
    <text x="25" y="299" fill="#ff7b72" font-size="10">• Підвищений опір потоку середовища</text>
    <text x="25" y="316" fill="#8b949e" font-size="10">• Застосування: малі швидкості потоку (&lt; 2 м/с)</text>

    <!-- 2. Ступінчаста гільза (Stepped) -->
    <rect x="310" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="310" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="328" cy="26" r="6" fill="#3fb950"/>
    <text x="342" y="31" fill="#f0f6fc" font-size="13" font-weight="700">2. Ступінчастий (Stepped)</text>

    <!-- Креслення ступінчастої гільзи -->
    <g transform="translate(330, 55)">
      <!-- Гайка / кріплення -->
      <rect x="25" y="10" width="60" height="24" rx="2" fill="#30363d" stroke="#8b949e" stroke-width="1.2"/>
      
      <!-- Тіло ступінчастої гільзи -->
      <path d="M 38 34 L 38 105 L 46 105 L 46 160 Q 46 168 55 168 Q 64 168 64 160 L 64 105 L 72 105 L 72 34 Z" fill="#1f2937" stroke="#3fb950" stroke-width="2"/>
      <!-- Канал -->
      <path d="M 49 34 L 49 155 Q 49 160 55 160 Q 61 160 61 155 L 61 34" fill="#0d1117" stroke="#2ea043" stroke-width="1.2" stroke-dasharray="3,2"/>

      <line x1="75" y1="70" x2="105" y2="70" stroke="#8b949e" stroke-width="1"/>
      <text x="110" y="74" fill="#8b949e" font-size="10">D_base (19 мм)</text>

      <line x1="68" y1="135" x2="105" y2="135" stroke="#3fb950" stroke-width="1"/>
      <text x="110" y="139" fill="#3fb950" font-size="10">D_tip (12.7 мм)</text>
    </g>

    <text x="325" y="245" fill="#f0f6fc" font-size="11" font-weight="600">Особливості конструкції:</text>
    <text x="325" y="265" fill="#c9d1d9" font-size="10">• Зменшена товщина стінки на кінчику</text>
    <text x="325" y="282" fill="#3fb950" font-size="10">• Час термічного відгуку в 2-3 рази менший</text>
    <text x="325" y="299" fill="#c9d1d9" font-size="10">• Зменшує теплову інерцію системи</text>
    <text x="325" y="316" fill="#8b949e" font-size="10">• Концентратор напружень на сходинці</text>

    <!-- 3. Конічна гільза (Tapered) -->
    <rect x="610" y="10" width="280" height="325" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="610" y="10" width="280" height="32" rx="8" fill="#21262d"/>
    <circle cx="628" cy="26" r="6" fill="#e3b341"/>
    <text x="642" y="31" fill="#f0f6fc" font-size="13" font-weight="700">3. Конічний (Tapered)</text>

    <!-- Креслення конічної гільзи -->
    <g transform="translate(630, 55)">
      <!-- Гайка / кріплення -->
      <rect x="25" y="10" width="60" height="24" rx="2" fill="#30363d" stroke="#8b949e" stroke-width="1.2"/>

      <!-- Тіло конічної гільзи -->
      <path d="M 37 34 L 46 160 Q 46 168 55 168 Q 64 168 64 160 L 73 34 Z" fill="#1f2937" stroke="#e3b341" stroke-width="2"/>
      <!-- Внутрішній циліндричний канал -->
      <path d="M 49 34 L 49 155 Q 49 160 55 160 Q 61 160 61 155 L 61 34" fill="#0d1117" stroke="#d29922" stroke-width="1.2" stroke-dasharray="3,2"/>

      <line x1="75" y1="50" x2="105" y2="50" stroke="#8b949e" stroke-width="1"/>
      <text x="110" y="54" fill="#8b949e" font-size="10">Конус 1:16..1:32</text>

      <line x1="68" y1="145" x2="105" y2="145" stroke="#e3b341" stroke-width="1"/>
      <text x="110" y="149" fill="#e3b341" font-size="10">D_tip (14 мм)</text>
    </g>

    <text x="625" y="245" fill="#f0f6fc" font-size="11" font-weight="600">Особливості конструкції:</text>
    <text x="625" y="265" fill="#3fb950" font-size="10">• Найвища власна резонансна частота f_n</text>
    <text x="625" y="282" fill="#3fb950" font-size="10">• Максимальна стійкість за ASME PTC 19.3 TW</text>
    <text x="625" y="299" fill="#c9d1d9" font-size="10">• Відсутність сходинок та концентраторів сил</text>
    <text x="625" y="316" fill="#e3b341" font-size="10">• Стандарт для пари високого тиску (&gt;100 бар)</text>
  </g>

  <!-- Порівняння технологій виробництва внизу -->
  <g transform="translate(30, 440)">
    <rect width="900" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="24" fill="#58a6ff" font-size="12" font-weight="700">МЕТОДИ ВИГОТОВЛЕННЯ: СУЦІЛЬНОТОЧЕНІ (BARSTOCK) ПРОТИ ЗВАРНИХ (FABRICATED):</text>
    <text x="20" y="45" fill="#f0f6fc" font-size="11">
      • Суцільноточені (Barstock): глибоке свердління суцільного прутка, відсутність зварних швів, тиск до 400+ бар, висока вібронадійність.
    </text>
    <text x="20" y="59" fill="#8b949e" font-size="10">
      • Зварні (Fabricated): труба з привареним наконечником. Дозволяє довжину понад 1–2 метри за нижчої вартості, але робочий тиск обмежений 16–25 бар.
    </text>
  </g>
</svg>
