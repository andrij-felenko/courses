<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Способи технологічного приєднання термогільз до трубопроводів та апаратів</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Конструктивні виконання: різьбові, фланцеві, приварні та гігієнічні (Sanitary Tri-Clamp)</text>

  <!-- 4 Картки приєднання -->
  <g transform="translate(25, 85)">
    <!-- 1. Різьбове (Threaded) -->
    <rect x="5" y="10" width="215" height="330" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="5" y="10" width="215" height="30" rx="8" fill="#21262d"/>
    <text x="112" y="30" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="middle">1. Різьбове (Threaded)</text>

    <!-- Схема -->
    <g transform="translate(45, 55)">
      <rect x="25" y="10" width="60" height="20" rx="2" fill="#30363d" stroke="#8b949e"/>
      <!-- Різьба NPT / G -->
      <path d="M 35 30 L 75 30 L 70 55 L 40 55 Z" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="33" y1="36" x2="77" y2="36" stroke="#58a6ff" stroke-width="1"/>
      <line x1="35" y1="42" x2="75" y2="42" stroke="#58a6ff" stroke-width="1"/>
      <line x1="37" y1="48" x2="73" y2="48" stroke="#58a6ff" stroke-width="1"/>
      <!-- Стрижень гільзи -->
      <rect x="44" y="55" width="22" height="65" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
      <!-- Стінка бобишки труби -->
      <rect x="15" y="30" width="16" height="25" fill="#30363d" fill-opacity="0.5"/>
      <rect x="79" y="30" width="16" height="25" fill="#30363d" fill-opacity="0.5"/>
    </g>

    <text x="15" y="195" fill="#58a6ff" font-size="11" font-weight="700">Стандарти різьб:</text>
    <text x="15" y="213" fill="#c9d1d9" font-size="10">• 1/2" NPT (конічна ANSI)</text>
    <text x="15" y="228" fill="#c9d1d9" font-size="10">• G 1/2", G 3/4" (циліндрична)</text>
    <text x="15" y="243" fill="#c9d1d9" font-size="10">• М20×1.5 (метрична)</text>
    <text x="15" y="265" fill="#f0f6fc" font-size="11" font-weight="600">Параметри:</text>
    <text x="15" y="282" fill="#3fb950" font-size="10">• Швидкий монтаж/заміна</text>
    <text x="15" y="297" fill="#8b949e" font-size="10">• Тиск: до 160...250 бар</text>
    <text x="15" y="312" fill="#ff7b72" font-size="10">• Не для токсичних газів</text>

    <!-- 2. Фланцеве (Flanged) -->
    <rect x="235" y="10" width="215" height="330" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="235" y="10" width="215" height="30" rx="8" fill="#21262d"/>
    <text x="342" y="30" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="middle">2. Фланцеве (Flanged)</text>

    <!-- Схема -->
    <g transform="translate(275, 55)">
      <!-- Фланець гільзи -->
      <rect x="10" y="20" width="90" height="15" rx="2" fill="#21262d" stroke="#3fb950" stroke-width="1.8"/>
      <circle cx="20" cy="27" r="4" fill="#0d1117" stroke="#8b949e"/>
      <circle cx="90" cy="27" r="4" fill="#0d1117" stroke="#8b949e"/>
      <!-- Ущільнення RF / прокладка -->
      <rect x="30" y="35" width="50" height="4" fill="#d29922"/>
      <!-- Фланець відповідний на патрубку -->
      <rect x="10" y="39" width="90" height="15" rx="2" fill="#30363d" stroke="#8b949e" stroke-width="1.2"/>
      <!-- Стрижень гільзи -->
      <rect x="44" y="35" width="22" height="85" fill="#1f2937" stroke="#3fb950" stroke-width="1.5"/>
    </g>

    <text x="245" y="195" fill="#3fb950" font-size="11" font-weight="700">Стандарти фланців:</text>
    <text x="245" y="213" fill="#c9d1d9" font-size="10">• ASME B16.5 (1"–3" 150..2500#)</text>
    <text x="245" y="228" fill="#c9d1d9" font-size="10">• EN 1092-1 (DN25..DN80 PN40)</text>
    <text x="245" y="243" fill="#c9d1d9" font-size="10">• Дзеркало RF, RTJ (кільцеве)</text>
    <text x="245" y="265" fill="#f0f6fc" font-size="11" font-weight="600">Параметри:</text>
    <text x="245" y="282" fill="#3fb950" font-size="10">• Нафтогазова та хімгалузь</text>
    <text x="245" y="297" fill="#3fb950" font-size="10">• Повна герметичність газу</text>
    <text x="245" y="312" fill="#8b949e" font-size="10">• Зручний демонтаж болтами</text>

    <!-- 3. Вварне (Socket Weld / Weld-in) -->
    <rect x="465" y="10" width="215" height="330" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="465" y="10" width="215" height="30" rx="8" fill="#21262d"/>
    <text x="572" y="30" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="middle">3. Приварне (Weld-in)</text>

    <!-- Схема -->
    <g transform="translate(505, 55)">
      <rect x="25" y="10" width="60" height="20" rx="2" fill="#30363d" stroke="#8b949e"/>
      <!-- Потовщення під зварку -->
      <rect x="35" y="30" width="40" height="25" fill="#21262d" stroke="#e3b341" stroke-width="1.5"/>
      <!-- Зварний шов (трикутники) -->
      <polygon points="35,45 23,55 35,55" fill="#e3b341"/>
      <polygon points="75,45 87,55 75,55" fill="#e3b341"/>
      <!-- Стрижень гільзи -->
      <rect x="44" y="55" width="22" height="65" fill="#1f2937" stroke="#e3b341" stroke-width="1.5"/>
    </g>

    <text x="475" y="195" fill="#e3b341" font-size="11" font-weight="700">Особливості приварки:</text>
    <text x="475" y="213" fill="#c9d1d9" font-size="10">• Socket Weld (в муфту)</text>
    <text x="475" y="228" fill="#c9d1d9" font-size="10">• Full Penetration Weld</text>
    <text x="475" y="243" fill="#c9d1d9" font-size="10">• Нерозбірне з'єднання</text>
    <text x="475" y="265" fill="#f0f6fc" font-size="11" font-weight="600">Параметри:</text>
    <text x="475" y="282" fill="#3fb950" font-size="10">• Екстремальний тиск (&gt;400 бар)</text>
    <text x="475" y="297" fill="#3fb950" font-size="10">• Гостра пара ТЕС/АЕС (550 °C)</text>
    <text x="475" y="312" fill="#ff7b72" font-size="10">• Неможливо зняти без різки</text>

    <!-- 4. Гігієнічне (Sanitary Tri-Clamp) -->
    <rect x="695" y="10" width="215" height="330" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="695" y="10" width="215" height="30" rx="8" fill="#21262d"/>
    <text x="802" y="30" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="middle">4. Гігієнічне (Tri-Clamp)</text>

    <!-- Схема -->
    <g transform="translate(735, 55)">
      <rect x="25" y="10" width="60" height="20" rx="2" fill="#30363d" stroke="#8b949e"/>
      <!-- Комірці Tri-Clamp + хомут -->
      <path d="M 25 30 L 85 30 L 80 45 L 30 45 Z" fill="#21262d" stroke="#a371f7" stroke-width="1.5"/>
      <rect x="15" y="32" width="80" height="8" rx="3" fill="#a371f7" fill-opacity="0.3" stroke="#a371f7" stroke-width="1.2"/>
      <!-- Полірована гільза -->
      <rect x="44" y="45" width="22" height="75" rx="2" fill="#1f2937" stroke="#a371f7" stroke-width="1.5"/>
    </g>

    <text x="705" y="195" fill="#d2a8ff" font-size="11" font-weight="700">Гігієнічні стандарти:</text>
    <text x="705" y="213" fill="#c9d1d9" font-size="10">• ISO 2852 / DIN 32676</text>
    <text x="705" y="228" fill="#c9d1d9" font-size="10">• Сертифікація 3-A та EHEDG</text>
    <text x="705" y="243" fill="#c9d1d9" font-size="10">• Шорсткість Ra &lt; 0.8 / 0.4 мкм</text>
    <text x="705" y="265" fill="#f0f6fc" font-size="11" font-weight="600">Параметри:</text>
    <text x="705" y="282" fill="#3fb950" font-size="10">• Безщілинні з'єднання CIP/SIP</text>
    <text x="705" y="297" fill="#3fb950" font-size="10">• Фармацевтика, молоко, пиво</text>
    <text x="705" y="312" fill="#8b949e" font-size="10">• Тиск: обмежений до 16 бар</text>
  </g>

  <!-- Блок рекомендацій у підвалі -->
  <g transform="translate(25, 435)">
    <rect width="910" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="25" fill="#58a6ff" font-size="12" font-weight="700">ОСНОВНЕ ПРАВИЛО ВИБОРУ ТЕХНОЛОГІЧНОГО З'ЄДНАННЯ:</text>
    <text x="20" y="46" fill="#f0f6fc" font-size="11">
      • Різьбові гільзи — для загальнопромислових систем опалення, вентиляції та водопідготовки до 50 бар.
    </text>
    <text x="20" y="62" fill="#8b949e" font-size="11">
      • Фланцеві (ASME/DIN) — безумовний стандарт хімічних і нафтопереробних заводів для безпеки обслуговування під тиском.
    </text>
  </g>
</svg>
