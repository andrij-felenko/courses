<rect x="120.0" y="392.0" width="620.0" height="62.0" rx="6" fill="#fff9e6" stroke="#b8860b" stroke-width="1.5"/><text x="430.0" y="411.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Плата-компаратор — окрема від щупа: два електроди щупа йдуть двома дротами</tspan><tspan x="430.0" dy="15.6">на власні контакти плати. Живіть VCC лише під час заміру (див. текст) — так</tspan><tspan x="430.0" dy="15.6">щуп менше кородує. AO дає число, DO — готове «сухо/волого» за порогом гвинтика.</tspan></text>
