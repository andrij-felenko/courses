<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схеми підключення RTD: 2-, 3- та 4-провідні топології</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">2-провідна додає 2R_L до похибки; 3-провідна компенсує R_L; 4-провідна повністю усуває вплив дротів</text>

  <!-- PANEL 1: 2-WIRE -->
  <rect x="24" y="75" width="288" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel 1 Header Badge -->
  <rect x="36" y="85" width="264" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="168" y="104" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">2-провідне (Низька точність)</text>

  <!-- Panel 1 Instrument Box -->
  <rect x="38" y="130" width="84" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="150" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вимірювач</text>
  <circle cx="80" cy="220" r="18" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="80" y="224" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ADC</text>

  <!-- Panel 1 Instrument Internal Connections & Terminals -->
  <path d="M 80 202 L 80 160 L 122 160" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="122" cy="160" r="4" fill="#c0392b"/>
  <text x="106" y="151" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>

  <path d="M 80 238 L 80 280 L 122 280" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="122" cy="280" r="4" fill="#c0392b"/>
  <text x="106" y="271" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">−</text>

  <!-- Panel 1 Sensor Box -->
  <rect x="224" y="130" width="76" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262" y="150" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Датчик</text>
  <rect x="252" y="197" width="20" height="46" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_T</text>

  <path d="M 224 160 L 262 160 L 262 197" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="224" cy="160" r="3.5" fill="#2457d6"/>

  <path d="M 224 280 L 262 280 L 262 243" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="224" cy="280" r="3.5" fill="#2457d6"/>

  <!-- Panel 1 External Wires & Lead Resistors -->
  <!-- Wire 1 -->
  <line x1="122" y1="160" x2="154" y2="160" stroke="#c0392b" stroke-width="2"/>
  <rect x="154" y="151" width="38" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="173" y="164" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_L1</text>
  <line x1="192" y1="160" x2="224" y2="160" stroke="#c0392b" stroke-width="2"/>
  <text x="173" y="141" font-size="12" fill="#6b7280" text-anchor="middle">Провід 1</text>

  <!-- Wire 2 -->
  <line x1="122" y1="280" x2="154" y2="280" stroke="#c0392b" stroke-width="2"/>
  <rect x="154" y="271" width="38" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="173" y="284" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_L2</text>
  <line x1="192" y1="280" x2="224" y2="280" stroke="#c0392b" stroke-width="2"/>
  <text x="173" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Провід 2</text>

  <!-- Panel 1 Formula Box -->
  <rect x="36" y="325" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Виміряний опір кола:</text>
  <text x="48" y="372" font-size="12" font-weight="bold" fill="#c0392b">R_вимір = R_T + R_L1 + R_L2</text>
  <text x="48" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Похибка вимірювання:</text>
  <text x="48" y="420" font-size="12" font-weight="bold" fill="#c0392b">ΔR = R_L1 + R_L2 ≈ 2 · R_L</text>
  <text x="48" y="448" font-size="12" fill="#6b7280">Опір дротів додається до</text>
  <text x="48" y="468" font-size="12" fill="#6b7280">показника термодатчика.</text>


  <!-- PANEL 2: 3-WIRE -->
  <rect x="336" y="75" width="288" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel 2 Header Badge -->
  <rect x="348" y="85" width="264" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3-провідне (Промисловий стандарт)</text>

  <!-- Panel 2 Instrument Box -->
  <rect x="350" y="130" width="84" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="392" y="150" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вимірювач</text>
  <circle cx="392" cy="220" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="392" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Міст</text>

  <!-- Panel 2 Instrument Internal Connections & Terminals -->
  <path d="M 392 202 L 392 160 L 434 160" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="434" cy="160" r="4" fill="#2457d6"/>
  <text x="418" y="151" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <line x1="410" y1="220" x2="434" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="434" cy="220" r="4" fill="#27ae60"/>
  <text x="418" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2</text>

  <path d="M 392 238 L 392 280 L 434 280" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="434" cy="280" r="4" fill="#2457d6"/>
  <text x="418" y="271" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>

  <!-- Panel 2 Sensor Box -->
  <rect x="536" y="130" width="76" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="574" y="150" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Датчик</text>
  <rect x="564" y="197" width="20" height="46" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="574" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_T</text>

  <path d="M 536 160 L 574 160 L 574 197" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="536" cy="160" r="3.5" fill="#2457d6"/>

  <path d="M 536 280 L 574 280 L 574 243" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="536" cy="280" r="3.5" fill="#27ae60"/>

  <!-- Panel 2 External Wires & Lead Resistors -->
  <!-- Wire 1 -->
  <line x1="434" y1="160" x2="466" y2="160" stroke="#2457d6" stroke-width="2"/>
  <rect x="466" y="151" width="38" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="485" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_L1</text>
  <line x1="504" y1="160" x2="536" y2="160" stroke="#2457d6" stroke-width="2"/>
  <text x="485" y="141" font-size="12" fill="#6b7280" text-anchor="middle">Провід 1</text>

  <!-- Wire 2 (Compensation) -->
  <line x1="434" y1="220" x2="466" y2="220" stroke="#27ae60" stroke-width="2"/>
  <rect x="466" y="211" width="38" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="485" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_L2</text>
  <path d="M 504 220 L 516 220 L 536 280" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="485" y="196" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Провід 2 (К)</text>

  <!-- Wire 3 -->
  <line x1="434" y1="280" x2="466" y2="280" stroke="#2457d6" stroke-width="2"/>
  <rect x="466" y="271" width="38" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="485" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_L3</text>
  <line x1="504" y1="280" x2="536" y2="280" stroke="#2457d6" stroke-width="2"/>
  <text x="485" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Провід 3</text>

  <!-- Panel 2 Formula Box -->
  <rect x="348" y="325" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Алгоритм компенсації:</text>
  <text x="360" y="372" font-size="12" font-weight="bold" fill="#2457d6">R_вимір = (R_T + R_L1 + R_L3) − R_L2</text>
  <text x="360" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">За умови симетрії R_L1 = R_L2 = R_L3:</text>
  <text x="360" y="420" font-size="12" font-weight="bold" fill="#27ae60">R_вимір = R_T + R_L − R_L = R_T</text>
  <text x="360" y="448" font-size="12" fill="#6b7280">Опір дротів взаємно знищується</text>
  <text x="360" y="468" font-size="12" fill="#6b7280">при однаковому опорі ліній.</text>


  <!-- PANEL 3: 4-WIRE -->
  <rect x="648" y="75" width="288" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel 3 Header Badge -->
  <rect x="660" y="85" width="264" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="792" y="104" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">4-провідне (Найвища точність)</text>

  <!-- Panel 3 Instrument Box -->
  <rect x="662" y="130" width="84" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="704" y="150" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вимірювач</text>
  <circle cx="704" cy="220" r="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="704" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I / V</text>

  <!-- Panel 3 Instrument Internal Connections & Terminals -->
  <path d="M 704 200 L 704 148 L 746 148" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="746" cy="148" r="4" fill="#2457d6"/>
  <text x="726" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I+</text>

  <path d="M 704 208 L 716 208 L 716 192 L 746 192" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="746" cy="192" r="4" fill="#27ae60"/>
  <text x="726" y="184" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V+</text>

  <path d="M 704 232 L 716 232 L 716 248 L 746 248" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="746" cy="248" r="4" fill="#27ae60"/>
  <text x="726" y="240" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V−</text>

  <path d="M 704 240 L 704 292 L 746 292" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="746" cy="292" r="4" fill="#2457d6"/>
  <text x="726" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I−</text>

  <!-- Panel 3 Sensor Box -->
  <rect x="848" y="130" width="76" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="886" y="150" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Датчик</text>
  <rect x="876" y="197" width="20" height="46" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="886" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_T</text>

  <path d="M 848 170 L 886 170 L 886 197" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="848" cy="170" r="3.5" fill="#2457d6"/>

  <path d="M 848 270 L 886 270 L 886 243" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="848" cy="270" r="3.5" fill="#2457d6"/>

  <!-- Panel 3 External Wires & Lead Resistors -->
  <!-- Wire 1 (I+) -->
  <line x1="746" y1="148" x2="778" y2="148" stroke="#2457d6" stroke-width="2"/>
  <rect x="778" y="139" width="38" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="797" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_L1</text>
  <path d="M 816 148 L 828 148 L 848 170" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="785" y="131" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I+ (струм)</text>

  <!-- Wire 2 (V+) -->
  <line x1="746" y1="192" x2="778" y2="192" stroke="#27ae60" stroke-width="2"/>
  <rect x="778" y="183" width="38" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="797" y="196" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_L2</text>
  <path d="M 816 192 L 828 192 L 848 170" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="785" y="174" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V+ (потенціал)</text>

  <!-- Wire 3 (V-) -->
  <line x1="746" y1="248" x2="778" y2="248" stroke="#27ae60" stroke-width="2"/>
  <rect x="778" y="239" width="38" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="797" y="252" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_L3</text>
  <path d="M 816 248 L 828 248 L 848 270" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="785" y="230" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V− (потенціал)</text>

  <!-- Wire 4 (I-) -->
  <line x1="746" y1="292" x2="778" y2="292" stroke="#2457d6" stroke-width="2"/>
  <rect x="778" y="283" width="38" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="797" y="296" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_L4</text>
  <path d="M 816 292 L 828 292 L 848 270" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="785" y="314" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I− (струм)</text>

  <!-- Panel 3 Formula Box -->
  <rect x="660" y="325" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="672" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Схема Кельвіна (4 виводи):</text>
  <text x="672" y="372" font-size="12" font-weight="bold" fill="#27ae60">I_V ≈ 0 (R_вольтметра → ∞)</text>
  <text x="672" y="394" font-size="12" font-weight="bold" fill="#27ae60">U_вимір = I_ex · R_T</text>
  <text x="672" y="416" font-size="12" font-weight="bold" fill="#27ae60">R_T = U_вимір / I_ex</text>
  <text x="672" y="444" font-size="12" fill="#6b7280">Повна незалежність від опору</text>
  <text x="672" y="464" font-size="12" fill="#6b7280">та асиметрії підвідних дротів!</text>
</svg>
