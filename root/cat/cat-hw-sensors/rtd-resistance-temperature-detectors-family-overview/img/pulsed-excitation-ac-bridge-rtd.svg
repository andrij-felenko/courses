<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок у defs -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">4-провідне підключення Pt1000 з імпульсним перемиканням полярності (AC Excitation)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Вимірювання у двох фазах струму (I+ та I-) повністю усуває паразитну термоЕРС V_emf</text>

  <!-- ВЕРХНЯ СЕКЦІЯ: СХЕМА (Y = 80..295) -->

  <!-- БЛОК 1: АНАЛОГОВИЙ МОДУЛЬ АЦП ТА КОМУТАЦІЯ -->
  <rect x="30" y="80" width="290" height="215" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="30" y="80" width="290" height="30" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="175" y="100" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Аналоговий модуль (24-біт АЦП)</text>

  <!-- Джерело струму збудження -->
  <text x="70" y="125" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">I_exc</text>
  <text x="70" y="138" font-size="12" fill="#2457d6" text-anchor="middle">250 мкА</text>
  <circle cx="70" cy="158" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="162" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">I</text>

  <!-- H-міст перемикання полярності -->
  <rect x="110" y="118" width="165" height="72" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="192" y="135" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">H-міст перемикання</text>
  <text x="192" y="153" font-size="12" fill="#1a1a1a" text-anchor="middle">Фаза 1: F+→I+, F-→GND</text>
  <text x="192" y="171" font-size="12" fill="#1a1a1a" text-anchor="middle">Фаза 2: F-→I+, F+→GND</text>

  <!-- 24-бітний АЦП -->
  <rect x="110" y="202" width="165" height="84" fill="white" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="192" y="218" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">24-біт Sigma-Delta АЦП</text>
  <text x="120" y="238" font-size="12" font-weight="700" fill="#27ae60">IN+</text>
  <text x="120" y="258" font-size="12" font-weight="700" fill="#27ae60">IN-</text>
  <text x="192" y="276" font-size="11" fill="#6b7280" text-anchor="middle">R_in &gt; 100 МОм, I_sense = 0</text>

  <!-- Лінії внутрішньої комутації -->
  <line x1="84" y1="158" x2="110" y2="158" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="275" y1="140" x2="320" y2="140" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="275" y1="234" x2="280" y2="234" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="280" y1="234" x2="280" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="280" y1="190" x2="320" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="275" y1="254" x2="285" y2="254" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="285" y1="254" x2="285" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="285" y1="240" x2="320" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="275" y1="171" x2="308" y2="171" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="308" y1="171" x2="308" y2="280" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="308" y1="280" x2="320" y2="280" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Вихідні клеми модуля -->
  <circle cx="320" cy="140" r="4" fill="#2457d6"/>
  <text x="302" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">F+</text>

  <circle cx="320" cy="190" r="4" fill="#27ae60"/>
  <text x="302" y="184" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">S+</text>

  <circle cx="320" cy="240" r="4" fill="#27ae60"/>
  <text x="302" y="234" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">S-</text>

  <circle cx="320" cy="280" r="4" fill="#2457d6"/>
  <text x="302" y="274" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">F-</text>


  <!-- БЛОК 2: 4-ПРОВІДНИЙ КАБЕЛЬ -->
  <rect x="340" y="80" width="320" height="215" fill="white" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,5" rx="6"/>
  <text x="500" y="100" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">4-провідний вимірювальний кабель</text>
  <text x="500" y="117" font-size="12" fill="#6b7280" text-anchor="middle">(опори ліній R_L1 = R_L2 = R_L3 = R_L4 = R_L)</text>

  <!-- Дріт F+ -->
  <line x1="320" y1="140" x2="478" y2="140" stroke="#2457d6" stroke-width="2"/>
  <line x1="522" y1="140" x2="680" y2="140" stroke="#2457d6" stroke-width="2"/>
  <rect x="480" y="131" width="40" height="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="500" y="144" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">R_L1</text>
  <text x="400" y="128" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">I_exc → (Фаза 1)</text>

  <!-- Дріт S+ -->
  <line x1="320" y1="190" x2="478" y2="190" stroke="#27ae60" stroke-width="2"/>
  <line x1="522" y1="190" x2="680" y2="190" stroke="#27ae60" stroke-width="2"/>
  <rect x="480" y="181" width="40" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="500" y="194" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">R_L2</text>
  <text x="400" y="178" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">I_sense ≈ 0 А</text>

  <!-- Дріт S- -->
  <line x1="320" y1="240" x2="478" y2="240" stroke="#27ae60" stroke-width="2"/>
  <line x1="522" y1="240" x2="680" y2="240" stroke="#27ae60" stroke-width="2"/>
  <rect x="480" y="231" width="40" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="500" y="244" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">R_L3</text>
  <text x="400" y="228" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">I_sense ≈ 0 А</text>

  <!-- Дріт F- -->
  <line x1="320" y1="280" x2="478" y2="280" stroke="#2457d6" stroke-width="2"/>
  <line x1="522" y1="280" x2="680" y2="280" stroke="#2457d6" stroke-width="2"/>
  <rect x="480" y="271" width="40" height="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="500" y="284" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">R_L4</text>
  <text x="400" y="268" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">← I_exc (Фаза 1)</text>


  <!-- БЛОК 3: ЗОНД Pt1000 ТА ТЕРМО-ЕРС -->
  <rect x="680" y="80" width="250" height="215" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <rect x="680" y="80" width="250" height="30" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <text x="805" y="100" font-size="12" font-weight="700" fill="white" text-anchor="middle">Зонд Pt1000 + ТермоЕРС</text>

  <!-- З'єднання ліній всередині зонда -->
  <line x1="680" y1="140" x2="745" y2="140" stroke="#2457d6" stroke-width="2"/>
  <line x1="680" y1="190" x2="715" y2="190" stroke="#27ae60" stroke-width="2"/>
  <line x1="715" y1="190" x2="715" y2="140" stroke="#27ae60" stroke-width="2"/>
  <circle cx="715" cy="140" r="3.5" fill="#2457d6"/>

  <line x1="680" y1="280" x2="745" y2="280" stroke="#2457d6" stroke-width="2"/>
  <line x1="680" y1="240" x2="715" y2="240" stroke="#27ae60" stroke-width="2"/>
  <line x1="715" y1="240" x2="715" y2="280" stroke="#27ae60" stroke-width="2"/>
  <circle cx="715" cy="280" r="3.5" fill="#2457d6"/>

  <!-- Елемент Pt1000 -->
  <line x1="745" y1="140" x2="745" y2="175" stroke="#2457d6" stroke-width="2"/>
  <rect x="720" y="175" width="50" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="3"/>
  <line x1="745" y1="235" x2="745" y2="280" stroke="#2457d6" stroke-width="2"/>
  <text x="745" y="198" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Pt1000</text>
  <text x="745" y="220" font-size="12" fill="#6b7280" text-anchor="middle">1000 Ом</text>

  <!-- Позначка температури -->
  <line x1="692" y1="215" x2="712" y2="215" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="702" y="207" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t °C</text>

  <!-- Джерело паразитної термоЕРС -->
  <rect x="790" y="180" width="125" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="852" y="203" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">+ V_emf -</text>
  <text x="852" y="223" font-size="12" fill="#c0392b" text-anchor="middle">ТермоЕРС спаїв</text>
  <path d="M745,155 L790,155 L790,180" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>


  <!-- НИЖНЯ СЕКЦІЯ: МАТЕМАТИКА ТА КОМПЕНСАЦІЯ (Y = 320..515) -->

  <!-- ЛІВА ПАНЕЛЬ: 2 ФАЗИ СТРУМУ -->
  <rect x="30" y="320" width="435" height="195" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="30" y="320" width="435" height="30" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="247" y="340" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Вимірювання у двох фазах струму (AC Excitation)</text>

  <!-- Фаза 1 -->
  <rect x="45" y="362" width="405" height="46" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="55" y="381" font-size="12" font-weight="700" fill="#2457d6">Фаза 1 (+I):</text>
  <text x="150" y="381" font-size="12" font-weight="700" fill="#1a1a1a">V1 = + (I_exc · R_RTD) + V_emf</text>
  <text x="55" y="399" font-size="12" fill="#6b7280">Прямий струм: сигнал містить опір RTD та паразитну ЕРС</text>

  <!-- Фаза 2 -->
  <rect x="45" y="418" width="405" height="46" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="55" y="437" font-size="12" font-weight="700" fill="#2457d6">Фаза 2 (-I):</text>
  <text x="150" y="437" font-size="12" font-weight="700" fill="#1a1a1a">V2 = - (I_exc · R_RTD) + V_emf</text>
  <text x="55" y="455" font-size="12" fill="#6b7280">Зворотний струм: знак RTD змінюється, а V_emf не змінюється</text>

  <!-- Примітка -->
  <text x="247" y="495" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Увага: ТермоЕРС V_emf НЕ залежить від полярності струму</text>


  <!-- ПРАВА ПАНЕЛЬ: АЛГОРИТМ ТА ВИСНОВОК -->
  <rect x="495" y="320" width="435" height="195" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="495" y="320" width="435" height="30" fill="#27ae60" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="712" y="340" font-size="13" font-weight="700" fill="white" text-anchor="middle">Обробка в мікроконтролері / АЦП</text>

  <!-- Формула -->
  <rect x="510" y="362" width="405" height="52" fill="white" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="712" y="381" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">V_final = (V1 - V2) / 2</text>
  <text x="712" y="401" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">V_final = [ (I·R + V_emf) - (-I·R + V_emf) ] / 2 = I_exc · R_RTD</text>

  <!-- Переваги -->
  <text x="515" y="433" font-size="12" fill="#1a1a1a">• Паразитна термоЕРС V_emf повністю знівельована</text>
  <text x="515" y="453" font-size="12" fill="#1a1a1a">• Дрейф зсуву АЦП (V_offset) також скасовано</text>
  <text x="515" y="473" font-size="12" font-weight="700" fill="#27ae60">• Опір дротів R_L1..R_L4 не впливає завдяки 4-провідній схемі</text>
  <text x="515" y="493" font-size="12" fill="#6b7280">• Імпульсне збудження знижує самонагрів Pt1000</text>
</svg>
