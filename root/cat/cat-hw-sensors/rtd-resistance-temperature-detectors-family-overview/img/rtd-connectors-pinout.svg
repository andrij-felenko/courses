<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Маркування та розпіновка роз'ємів RTD (IEC 60751)</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Призначення виводів і колір жил для роз'ємів M12, DIN 43650 та RTD-мініштекера</text>

  <!-- ПАНЕЛЬ 1: Роз'єм M12 -->
  <rect x="20" y="75" width="290" height="465" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8" ry="8"/>
  <rect x="30" y="85" width="270" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6" ry="6"/>
  <text x="165" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Роз'єм M12 (4-pin)</text>
  <text x="165" y="120" font-size="12" text-anchor="middle" fill="#6b7280">Промисловий A-coded</text>

  <!-- Схема M12 -->
  <circle cx="165" cy="185" r="48" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="165" cy="185" r="42" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="161" y="143" width="8" height="7" fill="#d0d7de" rx="1"/>

  <!-- Контакти M12 -->
  <circle cx="142" cy="167" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="142" y="171" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">1</text>

  <circle cx="142" cy="203" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="142" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">2</text>

  <circle cx="188" cy="203" r="9" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="188" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3</text>

  <circle cx="188" cy="167" r="9" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="188" y="171" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4</text>

  <text x="165" y="244" font-size="12" text-anchor="middle" fill="#6b7280">M12 Вигляд з лиця</text>

  <!-- Картка 1A: 4-провідне підключення -->
  <rect x="30" y="255" width="270" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="40" y="273" font-size="13" font-weight="bold" fill="#1a1a1a">4-провідне підключення</text>
  
  <rect x="40" y="283" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="60" y="294" font-size="12" fill="#1a1a1a">Pin 1: Червоний (Red) — Ex+</text>

  <rect x="40" y="303" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="60" y="314" font-size="12" fill="#1a1a1a">Pin 2: Червоний (Red) — Sense+</text>

  <rect x="40" y="323" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="60" y="334" font-size="12" fill="#1a1a1a">Pin 3: Білий (White) — Sense-</text>

  <rect x="40" y="343" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="60" y="354" font-size="12" fill="#1a1a1a">Pin 4: Білий (White) — Ex-</text>

  <!-- Картка 1B: 3-провідне підключення -->
  <rect x="30" y="390" width="270" height="135" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="40" y="408" font-size="13" font-weight="bold" fill="#1a1a1a">3-провідне підключення</text>

  <rect x="40" y="418" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="60" y="429" font-size="12" fill="#1a1a1a">Pin 1: Червоний — Лінія A1</text>

  <rect x="40" y="438" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="60" y="449" font-size="12" fill="#1a1a1a">Pin 2: Червоний — Лінія A2</text>

  <rect x="40" y="458" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="60" y="469" font-size="12" fill="#1a1a1a">Pin 3: Білий — Лінія B</text>

  <rect x="40" y="478" width="12" height="12" fill="#9ca3af" rx="2"/>
  <text x="60" y="489" font-size="12" fill="#6b7280">Pin 4: N/C або Екран (Shield)</text>

  <text x="40" y="512" font-size="12" fill="#27ae60">Між A1 та A2 опір ≈ 0 Ом</text>

  <!-- ПАНЕЛЬ 2: Роз'єм DIN 43650 -->
  <rect x="335" y="75" width="290" height="465" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8" ry="8"/>
  <rect x="345" y="85" width="270" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6" ry="6"/>
  <text x="480" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Роз'єм DIN 43650</text>
  <text x="480" y="120" font-size="12" text-anchor="middle" fill="#6b7280">Форма A (3-pin + PE)</text>

  <!-- Схема DIN 43650 -->
  <rect x="430" y="145" width="100" height="80" fill="#ffffff" stroke="#2457d6" stroke-width="2.5" rx="6"/>
  <circle cx="480" cy="185" r="6" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Контакти DIN -->
  <rect x="442" y="153" width="22" height="14" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <text x="453" y="164" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">1</text>

  <rect x="496" y="153" width="22" height="14" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <text x="507" y="164" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">2</text>

  <rect x="442" y="203" width="22" height="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="453" y="214" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3</text>

  <rect x="496" y="203" width="22" height="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="507" y="214" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">PE</text>

  <text x="480" y="244" font-size="12" text-anchor="middle" fill="#6b7280">DIN 43650 Вигляд з лиця</text>

  <!-- Картка 2A: 3-провідне підключення -->
  <rect x="345" y="255" width="270" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="355" y="273" font-size="13" font-weight="bold" fill="#1a1a1a">3-провідне підключення</text>

  <rect x="355" y="283" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="375" y="294" font-size="12" fill="#1a1a1a">Pin 1: Червоний — Лінія A1</text>

  <rect x="355" y="303" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="375" y="314" font-size="12" fill="#1a1a1a">Pin 2: Червоний — Лінія A2</text>

  <rect x="355" y="323" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="375" y="334" font-size="12" fill="#1a1a1a">Pin 3: Білий — Лінія B</text>

  <rect x="355" y="343" width="12" height="12" fill="#2457d6" rx="2"/>
  <text x="375" y="354" font-size="12" fill="#2457d6">Pin PE: Екран / Заземлення</text>

  <!-- Картка 2B: 2-провідне підключення -->
  <rect x="345" y="390" width="270" height="135" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="355" y="408" font-size="13" font-weight="bold" fill="#1a1a1a">2-провідне підключення</text>

  <rect x="355" y="418" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="375" y="429" font-size="12" fill="#1a1a1a">Pin 1: Червоний — Лінія A (+)</text>

  <rect x="355" y="438" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="375" y="449" font-size="12" fill="#1a1a1a">Pin 2: Білий — Лінія B (-)</text>

  <rect x="355" y="458" width="12" height="12" fill="#9ca3af" rx="2"/>
  <text x="375" y="469" font-size="12" fill="#6b7280">Pin 3: Не використовується</text>

  <rect x="355" y="478" width="12" height="12" fill="#2457d6" rx="2"/>
  <text x="375" y="489" font-size="12" fill="#2457d6">Pin PE: Екран кабелю</text>

  <text x="355" y="512" font-size="12" fill="#c0392b">Без компенсації опору ліній</text>

  <!-- ПАНЕЛЬ 3: RTD-мініштекер -->
  <rect x="650" y="75" width="290" height="465" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8" ry="8"/>
  <rect x="660" y="85" width="270" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6" ry="6"/>
  <text x="795" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RTD-мініштекер</text>
  <text x="795" y="120" font-size="12" text-anchor="middle" fill="#6b7280">Плоскі контакти (3-pin)</text>

  <!-- Схема Міні-штекера -->
  <rect x="735" y="145" width="120" height="80" fill="#ffffff" stroke="#2457d6" stroke-width="2.5" rx="6"/>

  <rect x="750" y="160" width="14" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <text x="757" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">1</text>

  <rect x="788" y="160" width="14" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <text x="795" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">2</text>

  <rect x="824" y="160" width="18" height="50" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="833" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3</text>

  <text x="795" y="244" font-size="12" text-anchor="middle" fill="#6b7280">Міні-штекер (Вигляд згори)</text>

  <!-- Картка 3A: 3-контактний роз'єм -->
  <rect x="660" y="255" width="270" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="670" y="273" font-size="13" font-weight="bold" fill="#1a1a1a">3-контактний роз'єм</text>

  <rect x="670" y="283" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="690" y="294" font-size="12" fill="#1a1a1a">Контакт 1 (+): Червоний (A1)</text>

  <rect x="670" y="303" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="690" y="314" font-size="12" fill="#1a1a1a">Контакт 2 (+): Червоний (A2)</text>

  <rect x="670" y="323" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="690" y="334" font-size="12" fill="#1a1a1a">Контакт 3 (-): Білий (B)</text>

  <rect x="670" y="343" width="12" height="12" fill="#9ca3af" rx="2"/>
  <text x="690" y="354" font-size="12" fill="#6b7280">Контакт 3 ширший (полярність)</text>

  <!-- Картка 3B: Стандарт IEC 60751 -->
  <rect x="660" y="390" width="270" height="135" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="670" y="408" font-size="13" font-weight="bold" fill="#1a1a1a">Правило IEC 60751</text>

  <rect x="670" y="418" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="690" y="429" font-size="12" fill="#1a1a1a">Один кінець RTD — Червоний</text>

  <rect x="670" y="438" width="12" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="2"/>
  <text x="690" y="449" font-size="12" fill="#1a1a1a">Другий кінець RTD — Білий</text>

  <rect x="670" y="458" width="6" height="12" fill="#c0392b"/>
  <rect x="676" y="458" width="6" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="690" y="469" font-size="12" fill="#1a1a1a">Дод. жили — тотожний колір</text>

  <rect x="670" y="478" width="12" height="12" fill="#9ca3af" rx="2"/>
  <text x="690" y="489" font-size="12" fill="#6b7280">США (ASTM): Черв. / Чорн.</text>

  <text x="670" y="512" font-size="12" fill="#2457d6">Завжди перевіряйте паспорт!</text>
</svg>
