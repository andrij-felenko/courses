<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <linearGradient id="temp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="50%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#2457d6"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тепло-електрична модель RTD у захисній гільзі</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Джерела самонагріву (P = I²R), теплові опори відведення та зони виникнення паразитних термоЕРС</text>

  <!-- Left Panel: Physical & Thermal Sheath Cross-Section -->
  <rect x="30" y="75" width="490" height="465" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Фізична конструкція та джерела похибок</text>

  <!-- Ambient Medium & External Heat Exchange -->
  <text x="215" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вимірюване середовище (T_med)</text>
  <line x1="110" y1="155" x2="110" y2="130" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <line x1="320" y1="155" x2="320" y2="130" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <text x="215" y="140" font-size="12" fill="#2457d6" text-anchor="middle">Теплообмін Q_ext</text>

  <!-- Outer Protective Tube (Sheath) -->
  <rect x="75" y="155" width="305" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="75" y="275" width="305" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 75,155 A 25,67 0 0,0 75,289 L 75,275 A 18,53 0 0,1 75,169 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

  <!-- Ceramic Filler Cavity -->
  <rect x="75" y="169" width="305" height="106" fill="#ffffff"/>
  <text x="310" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Керамічний заповнювач (MgO)</text>

  <!-- Sensing Element R_T -->
  <rect x="90" y="200" width="75" height="44" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="127.5" y="226" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_T (Pt)</text>

  <!-- Heat Dissipation Arrows (Q_diss) -->
  <line x1="115" y1="200" x2="115" y2="173" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <line x1="115" y1="244" x2="115" y2="271" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="175" y="186" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Q_diss (P = I²R_T)</text>

  <!-- Pt Wires -->
  <line x1="165" y1="215" x2="230" y2="215" stroke="#78716c" stroke-width="2"/>
  <line x1="165" y1="229" x2="230" y2="229" stroke="#78716c" stroke-width="2"/>
  <text x="197.5" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Pt-виводи</text>

  <!-- Junction J1 (Pt-Cu Junctions at T1) -->
  <circle cx="230" cy="215" r="4" fill="#c0392b"/>
  <circle cx="230" cy="229" r="4" fill="#c0392b"/>
  <rect x="180" y="242" width="105" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="232.5" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Спаї Pt-Cu (T₁)</text>
  <text x="232.5" y="267" font-size="12" fill="#c0392b" text-anchor="middle">+V_th1 (термоЕРС)</text>

  <!-- Copper Wires (Cu) -->
  <line x1="230" y1="215" x2="380" y2="215" stroke="#b85b14" stroke-width="2"/>
  <line x1="230" y1="229" x2="380" y2="229" stroke="#b85b14" stroke-width="2"/>
  <text x="310" y="206" font-size="12" fill="#b85b14" text-anchor="middle">Мідні дроти (Cu)</text>

  <!-- Terminal Connection Head (T2) -->
  <rect x="380" y="140" width="125" height="155" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="442.5" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Головка (T₂)</text>
  <text x="442.5" y="180" font-size="12" fill="#2457d6" text-anchor="middle">Клемні спаї</text>
  <text x="442.5" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-V_th2</text>
  <rect x="386" y="209" width="12" height="12" fill="#cbd5e1" stroke="#2457d6"/>
  <rect x="386" y="223" width="12" height="12" fill="#cbd5e1" stroke="#2457d6"/>
  <circle cx="392" cy="215" r="3.5" fill="#2457d6"/>
  <circle cx="392" cy="229" r="3.5" fill="#2457d6"/>
  <line x1="398" y1="215" x2="495" y2="215" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="398" y1="229" x2="495" y2="229" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="442.5" y="260" font-size="12" fill="#6b7280" text-anchor="middle">До AFE / вимірювача</text>

  <!-- Stem Heat Conduction -->
  <line x1="75" y1="305" x2="370" y2="305" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dark)"/>
  <text x="222.5" y="322" font-size="12" fill="#64748b" text-anchor="middle">Теплопровідність уздовж стінки гільзи (Q_stem)</text>

  <!-- Temperature Gradient Section -->
  <text x="222.5" y="345" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температурний профіль вздовж датчика</text>
  <rect x="60" y="352" width="320" height="14" rx="4" fill="url(#temp-grad)"/>
  <text x="60" y="382" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">T₁ = T_tip (Гарячий)</text>
  <text x="380" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">T₂ = T_head (Холодний)</text>

  <!-- Left Summary Box -->
  <rect x="45" y="402" width="460" height="122" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="275" y="422" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Два головних джерела похибок RTD у гільзі:</text>
  <text x="60" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">1. Самонагрів P = I²R_T :</text>
  <text x="60" y="460" font-size="12" fill="#c0392b" text-anchor="start">локальне перегрівання чутливого елемента</text>
  <text x="60" y="485" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">2. ТермоЕРС V_th = S·(T₁ - T₂) :</text>
  <text x="60" y="501" font-size="12" fill="#c0392b" text-anchor="start">паразитна напруга від градієнта температур ΔT</text>

  <!-- Right Top Panel: Thermal Equivalent Model -->
  <rect x="540" y="75" width="390" height="225" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="555" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">2. Еквівалентна теплова схема (Самонагрів)</text>

  <!-- Thermal Power Source P_diss -->
  <circle cx="595" cy="140" r="14" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="595" y1="148" x2="595" y2="132" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="595" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">P_diss = I²R_T</text>

  <!-- Node T_s -->
  <line x1="609" y1="140" x2="620" y2="140" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="620" cy="140" r="3.5" fill="#c0392b"/>
  <text x="620" y="122" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T_s</text>

  <!-- Thermal Capacitor C_th -->
  <line x1="620" y1="140" x2="620" y2="152" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="612" y1="152" x2="628" y2="152" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="612" y1="156" x2="628" y2="156" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="156" x2="620" y2="165" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="614" y1="165" x2="626" y2="165" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="616" y1="168" x2="624" y2="168" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="618" y1="171" x2="622" y2="171" stroke="#6b7280" stroke-width="1"/>
  <text x="637" y="158" font-size="12" fill="#6b7280">C_th</text>

  <!-- Thermal Resistor R_fill -->
  <line x1="620" y1="140" x2="655" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="655" y="131" width="45" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="677.5" y="144" font-size="12" fill="#1a1a1a" text-anchor="middle">R_fill</text>
  <text x="677.5" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Заповнювач</text>

  <!-- Node T_w -->
  <line x1="700" y1="140" x2="735" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="735" cy="140" r="3.5" fill="#1a1a1a"/>
  <text x="735" y="122" font-size="12" fill="#1a1a1a" text-anchor="middle">T_w</text>

  <!-- Thermal Resistor R_ext -->
  <line x1="735" y1="140" x2="762" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="762" y="131" width="46" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="785" y="144" font-size="12" fill="#1a1a1a" text-anchor="middle">R_ext</text>
  <text x="785" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Середовище</text>

  <!-- Node T_med -->
  <line x1="808" y1="140" x2="845" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="845" y1="130" x2="845" y2="150" stroke="#2457d6" stroke-width="2"/>
  <text x="845" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">T_med</text>

  <!-- Formula Box Right Top -->
  <rect x="555" y="185" width="360" height="98" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="735" y="207" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔT_self = P_diss · ΣR_th = I_exc² · R_T · R_th</text>
  <text x="735" y="230" font-size="12" fill="#c0392b" text-anchor="middle">Похибка перегріву: ΔT_err = I_exc² · R_T · R_th</text>
  <text x="735" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Норма струму: I_exc ≤ 1 mA (Pt100), ≤ 0.1 mA (Pt1000)</text>

  <!-- Right Bottom Panel: Electrical & Thermo-EMF Model -->
  <rect x="540" y="315" width="390" height="225" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="555" y="338" font-size="14" font-weight="bold" fill="#1a1a1a">3. Електрична схема та термоЕРС</text>

  <!-- Excitation Current Arrow -->
  <line x1="575" y1="362" x2="845" y2="362" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="710" y="355" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_exc (струм збудження)</text>

  <!-- Terminal IN+ -->
  <circle cx="565" cy="395" r="3.5" fill="#2457d6"/>
  <text x="565" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IN+</text>

  <!-- Thermo-EMF Source 1 (+V_th1) -->
  <line x1="568.5" y1="395" x2="602" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="615" cy="395" r="13" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="615" y="399" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+V_th1</text>
  <text x="615" y="376" font-size="12" fill="#c0392b" text-anchor="middle">Спай T₁</text>

  <!-- Line to Resistor R_T -->
  <line x1="628" y1="395" x2="665" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R_T -->
  <rect x="665" y="385" width="55" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="692.5" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_T</text>
  <text x="692.5" y="420" font-size="12" fill="#2457d6" text-anchor="middle">V_R = I_exc · R_T</text>

  <!-- Line to Thermo-EMF Source 2 (-V_th2) -->
  <line x1="720" y1="395" x2="752" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Thermo-EMF Source 2 (-V_th2) -->
  <circle cx="765" cy="395" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="399" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-V_th2</text>
  <text x="765" y="376" font-size="12" fill="#2457d6" text-anchor="middle">Спай T₂</text>

  <!-- Line to Terminal IN- -->
  <line x1="778" y1="395" x2="811.5" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Terminal IN- -->
  <circle cx="815" cy="395" r="3.5" fill="#2457d6"/>
  <text x="815" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IN-</text>

  <!-- Formula Box Right Bottom -->
  <rect x="555" y="432" width="360" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="735" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_meas = I_exc · R_T + (V_th1 - V_th2)</text>
  <text x="735" y="477" font-size="12" fill="#c0392b" text-anchor="middle">Паразитна напруга: V_th = S_PtCu · (T₁ - T₂)</text>
  <text x="735" y="502" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Компенсація: Зміна полярності (Switched DC / AC)</text>
</svg>
