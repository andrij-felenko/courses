<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція конструкції RTD: від дротового елемента до тонкоплівкового</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перехід від крихкої спіралі до напиленого платинового меандру забезпечив мініатюризацію та вібростійкість</text>

  <!-- Left Panel: Wire-wound RTD -->
  <rect x="25" y="72" width="415" height="408" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="37" y="84" width="391" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="232" y="105" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Дротовий елемент (Wire-wound)</text>

  <!-- Left Top Annotations -->
  <text x="125" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">Керамічний каркас</text>
  <line x1="125" y1="146" x2="125" y2="176" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="235" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">Засипка Al₂O₃</text>
  <line x1="235" y1="146" x2="235" y2="176" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ceramic Mandrel Outer & Inner -->
  <rect x="75" y="180" width="195" height="60" fill="#ffffff" stroke="#6b7280" stroke-width="2" rx="8"/>
  <rect x="79" y="184" width="187" height="52" fill="#f8fafc" rx="6"/>

  <!-- Platinum Coil Wire -->
  <path d="M 90,210 C 95,190 105,190 110,210 C 115,230 125,230 130,210 C 135,190 145,190 150,210 C 155,230 165,230 170,210 C 175,190 185,190 190,210 C 195,230 205,230 210,210 C 215,190 225,190 230,210 C 235,230 245,230 250,210 C 255,190 260,190 265,210" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Ceramic Glass Seal -->
  <rect x="284" y="180" width="20" height="60" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5" rx="3"/>

  <!-- Lead Wires Left -->
  <line x1="304" y1="198" x2="385" y2="198" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="304" y1="222" x2="385" y2="222" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Left Bottom Annotations -->
  <line x1="160" y1="264" x2="160" y2="225" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="160" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Платинова спіраль (Pt)</text>

  <line x1="340" y1="264" x2="340" y2="225" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="340" y="284" font-size="12" fill="#1a1a1a" text-anchor="middle">Вивідні провідники</text>

  <!-- Left Info Box -->
  <rect x="37" y="310" width="391" height="154" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="49" y="332" font-size="13" font-weight="bold" fill="#c0392b">Особливості та обмеження:</text>
  <text x="49" y="354" font-size="12" fill="#1a1a1a">• Великі габарити (Ø 2–5 мм, L = 10–30 мм)</text>
  <text x="49" y="376" font-size="12" fill="#1a1a1a">• Чутливість до вібрацій та ударів</text>
  <text x="49" y="398" font-size="12" fill="#1a1a1a">• Висока трудомісткість та вартість</text>
  <text x="49" y="420" font-size="12" fill="#27ae60" font-weight="bold">• Перевага: найвища стабільність (Pt100 СПРТ)</text>
  <text x="49" y="442" font-size="12" fill="#6b7280">  (використовується в еталонних приладах)</text>

  <!-- Central Transition -->
  <line x1="450" y1="210" x2="510" y2="210" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="480" y="192" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Еволюція</text>
  <text x="480" y="232" font-size="12" fill="#6b7280" text-anchor="middle">технології</text>

  <!-- Right Panel: Thin-film RTD -->
  <rect x="520" y="72" width="415" height="408" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="532" y="84" width="391" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="727" y="105" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Тонкоплівковий елемент (Thin-film)</text>

  <!-- Right Top Annotations -->
  <text x="640" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">Захисна склоглазур</text>
  <line x1="640" y1="146" x2="640" y2="198" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="830" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">Контактні виводи</text>
  <line x1="830" y1="146" x2="830" y2="205" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ceramic Substrate -->
  <rect x="575" y="195" width="210" height="45" fill="#ffffff" stroke="#6b7280" stroke-width="2" rx="4"/>

  <!-- Thin-film Meander Pattern -->
  <path d="M 590,206 L 590,224 L 602,224 L 602,206 L 614,206 L 614,224 L 626,224 L 626,206 L 638,206 L 638,224 L 650,224 L 650,206 L 662,206 L 662,224 L 674,224 L 674,206 L 686,206 L 686,224 L 698,224 L 698,206 L 710,206 L 710,224 L 722,224 L 722,206 L 734,206 L 734,224 L 746,224 L 746,206" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Glass Passivation Layer -->
  <rect x="583" y="200" width="170" height="32" fill="#eaf0fd" opacity="0.6" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" rx="3"/>

  <!-- Contact Pads -->
  <rect x="760" y="202" width="18" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1" rx="1"/>
  <rect x="760" y="222" width="18" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1" rx="1"/>

  <!-- Lead Wires Right -->
  <line x1="778" y1="207" x2="880" y2="207" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="778" y1="227" x2="880" y2="227" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Right Bottom Annotations -->
  <line x1="635" y1="264" x2="635" y2="242" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="635" y="284" font-size="12" fill="#1a1a1a" text-anchor="middle">Керамічна підкладка</text>

  <line x1="760" y1="264" x2="710" y2="226" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="810" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Платиновий меандр (~1 мкм)</text>

  <!-- Right Info Box -->
  <rect x="532" y="310" width="391" height="154" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="544" y="332" font-size="13" font-weight="bold" fill="#27ae60">Переваги тонкоплівкової технології:</text>
  <text x="544" y="354" font-size="12" fill="#1a1a1a">• Мініатюрність (від 2 × 1.2 × 0.5 мм) і мала маса</text>
  <text x="544" y="376" font-size="12" fill="#1a1a1a">• Висока вібростійкість (плівка міцно зчеплена)</text>
  <text x="544" y="398" font-size="12" fill="#1a1a1a">• Швидка реакція на зміну температури</text>
  <text x="544" y="420" font-size="12" fill="#1a1a1a">• Масове фотолітографічне виробництво</text>
  <text x="544" y="442" font-size="12" fill="#2457d6" font-weight="bold">• Стандартизованість: IEC 60751 (Pt100, Pt1000)</text>
</svg>
