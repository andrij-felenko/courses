<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" width="960" height="535" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="535" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Компенсація опору дротів у 3-провідній схемі RTD</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Два однакові джерела струму (I₁ = I₂) усувають вплив опору провідників R_w1 та R_w2</text>

  <!-- Панель 1: Вимірювальний модуль -->
  <rect x="35" y="80" width="255" height="285" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="162.5" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вимірювальний модуль</text>

  <!-- Внутрішня шина живлення джерел -->
  <line x1="55" y1="130" x2="55" y2="220" stroke="#2457d6" stroke-width="2"/>
  <line x1="55" y1="130" x2="71" y2="130" stroke="#2457d6" stroke-width="2"/>
  <line x1="55" y1="220" x2="71" y2="220" stroke="#2457d6" stroke-width="2"/>

  <!-- Джерело струму 1 -->
  <text x="85" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Джерело I₁ = I</text>
  <circle cx="85" cy="130" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="78" y1="130" x2="91" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Джерело струму 2 -->
  <text x="85" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Джерело I₂ = I</text>
  <circle cx="85" cy="220" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="78" y1="220" x2="91" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Лінії сигналів від джерел до клем модулю -->
  <line x1="99" y1="130" x2="290" y2="130" stroke="#2457d6" stroke-width="2"/>
  <line x1="99" y1="220" x2="290" y2="220" stroke="#2457d6" stroke-width="2"/>

  <!-- Вузли відводу сигналів до АЦП -->
  <circle cx="215" cy="130" r="3.5" fill="#2457d6"/>
  <circle cx="215" cy="220" r="3.5" fill="#2457d6"/>

  <!-- Відвідні лінії до входів АЦП -->
  <line x1="215" y1="130" x2="215" y2="152" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="215" y1="220" x2="215" y2="202" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Блок АЦП -->
  <rect x="160" y="152" width="110" height="52" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="215" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Різницевий АЦП</text>
  <text x="215" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_diff = V₁ - V₂</text>

  <!-- Позначки входів АЦП (поруч з відвідними лініями, а не поверх них) -->
  <text x="227" y="145" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">V₁</text>
  <text x="227" y="213" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">V₂</text>

  <!-- Лінія третього провідника / Спільна шина (GND) -->
  <line x1="290" y1="295" x2="85" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="85" y1="295" x2="85" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="73" y1="310" x2="97" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="77" y1="314" x2="93" y2="314" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="81" y1="318" x2="89" y2="318" stroke="#1a1a1a" stroke-width="2"/>
  <text x="110" y="338" text-anchor="middle" font-size="12" fill="#6b7280">Спільна шина (GND)</text>

  <!-- Панель 2: З'єднувальний кабель -->
  <rect x="305" y="80" width="350" height="285" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="480" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">З'єднувальний кабель (3 дроти)</text>

  <!-- Провідник 1 -->
  <line x1="290" y1="130" x2="430" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="430" y="120" width="60" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_w1</text>
  <line x1="490" y1="130" x2="670" y2="130" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="325" y1="130" x2="365" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="345" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I₁ = I</text>
  <text x="575" y="117" text-anchor="middle" font-size="12" fill="#c0392b">+ V_w1 = I · R_w1 −</text>

  <!-- Провідник 2 -->
  <line x1="290" y1="220" x2="430" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="430" y="210" width="60" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_w2</text>
  <line x1="490" y1="220" x2="670" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="325" y1="220" x2="365" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="345" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I₂ = I</text>
  <text x="575" y="207" text-anchor="middle" font-size="12" fill="#c0392b">+ V_w2 = I · R_w2 −</text>

  <!-- Провідник 3 (Зворотний) -->
  <line x1="670" y1="295" x2="490" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="430" y="285" width="60" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_w3</text>
  <line x1="430" y1="295" x2="290" y2="295" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="365" y1="295" x2="325" y2="295" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="345" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I₁ + I₂ = 2I</text>
  <text x="575" y="280" text-anchor="middle" font-size="12" fill="#6b7280">V_w3 = 2I · R_w3</text>

  <!-- Панель 3: Головка датчика (RTD) -->
  <rect x="670" y="80" width="255" height="285" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="797.5" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Головка датчика (RTD)</text>

  <!-- Верхнє з'єднання (Провідник 1 -> RTD) -->
  <line x1="670" y1="130" x2="740" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="740" y1="130" x2="740" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="740" cy="130" r="3.5" fill="#1a1a1a"/>

  <!-- Елемент RTD -->
  <rect x="725" y="160" width="30" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="740" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">RTD</text>

  <!-- Позначки сенсора -->
  <text x="770" y="183" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">R_RTD(T)</text>
  <text x="770" y="200" text-anchor="start" font-size="12" fill="#6b7280">Сенсор</text>

  <!-- Нижній вивід RTD до вузла -->
  <line x1="740" y1="220" x2="740" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Провідник 2 до вузла -->
  <path d="M 670,220 L 710,220 L 710,250 L 740,250" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Провідник 3 до вузла -->
  <path d="M 670,295 L 740,295 L 740,250" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Спільна точка / Вузол з'єднання -->
  <circle cx="740" cy="250" r="4.5" fill="#1a1a1a"/>
  <text x="760" y="248" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Вузол з'єднання</text>
  <text x="760" y="264" text-anchor="start" font-size="12" fill="#6b7280">(на сенсорі)</text>

  <!-- Панель 4: Математичний доказ розв'язку -->
  <rect x="35" y="385" width="890" height="130" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Плашка бейджа -->
  <rect x="50" y="398" width="210" height="24" rx="4" fill="#27ae60"/>
  <text x="155" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Алгебраїчна компенсація</text>

  <!-- Крок 1 -->
  <text x="55" y="440" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">1. Напруги на входах АЦП:</text>
  <text x="55" y="462" text-anchor="start" font-size="12" fill="#1a1a1a">V₁ = I · R_w1 + I · R_RTD + 2I · R_w3</text>
  <text x="55" y="484" text-anchor="start" font-size="12" fill="#1a1a1a">V₂ = I · R_w2 + 2I · R_w3</text>

  <!-- Крок 2 -->
  <text x="330" y="440" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">2. Різницевий сигнал V_diff:</text>
  <text x="330" y="462" text-anchor="start" font-size="12" fill="#1a1a1a">V_diff = V₁ - V₂</text>
  <text x="330" y="484" text-anchor="start" font-size="12" fill="#1a1a1a">= I · R_RTD + I · (R_w1 - R_w2)</text>

  <!-- Крок 3 (Блок результату) -->
  <rect x="565" y="398" width="345" height="104" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="737.5" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">За умови симетрії (R_w1 = R_w2 = R_w):</text>
  <text x="737.5" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#27ae60">V_diff = I · R_RTD</text>
  <text x="737.5" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Вплив опору дротів R_w скасовано!</text>
</svg>
