<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери для стрілок -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Багатоканальна 4-провідна комутація RTD-давачів</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Окремі мультиплексори для Force та Sense повністю усувають похибку від опору ключів R_ON</text>

  <!-- ==================== ПАНЕЛЬ 1: ДАВАЧІ RTD ==================== -->
  <rect x="20" y="65" width="200" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="87" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давачі RTD (4 провідники)</text>

  <!-- Канал 1 (Активний) -->
  <rect x="30" y="100" width="180" height="155" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="120" y="118" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Канал 1: Pt1000 (Активний)</text>
  
  <!-- Елемент опору R_RTD1 -->
  <rect x="75" y="155" width="60" height="40" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="105" y="179" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_RTD1</text>
  
  <!-- Внутрішні вузли та провідники Каналу 1 -->
  <line x1="105" y1="155" x2="105" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="105" cy="145" r="3" fill="#27ae60"/>
  
  <line x1="105" y1="145" x2="105" y2="132" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="105" y1="132" x2="210" y2="132" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="105" y1="145" x2="105" y2="158" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="105" y1="158" x2="210" y2="158" stroke="#27ae60" stroke-width="1.5"/>

  <line x1="105" y1="195" x2="105" y2="205" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="105" cy="205" r="3" fill="#27ae60"/>

  <line x1="105" y1="205" x2="105" y2="188" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="105" y1="188" x2="210" y2="188" stroke="#27ae60" stroke-width="1.5"/>

  <line x1="105" y1="205" x2="105" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="105" y1="220" x2="210" y2="220" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Позначення клем Каналу 1 -->
  <text x="195" y="126" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">F1+</text>
  <text x="195" y="152" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S1+</text>
  <text x="195" y="204" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S1-</text>
  <text x="195" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">F1-</text>

  <!-- Канал 2 (Вимкнений) -->
  <rect x="30" y="270" width="180" height="160" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="288" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Канал 2: Pt1000 (Вимкнений)</text>
  
  <rect x="75" y="330" width="60" height="40" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="105" y="354" font-size="12" fill="#6b7280" text-anchor="middle">R_RTD2</text>
  
  <line x1="105" y1="330" x2="105" y2="320" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <circle cx="105" cy="320" r="3" fill="#9ca3af"/>

  <line x1="105" y1="320" x2="105" y2="307" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="105" y1="307" x2="210" y2="307" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <line x1="105" y1="320" x2="105" y2="333" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="105" y1="333" x2="210" y2="333" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <line x1="105" y1="370" x2="105" y2="380" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <circle cx="105" cy="380" r="3" fill="#9ca3af"/>

  <line x1="105" y1="380" x2="105" y2="367" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="105" y1="367" x2="210" y2="367" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <line x1="105" y1="380" x2="105" y2="410" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="105" y1="410" x2="210" y2="410" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <!-- Позначення клем Каналу 2 -->
  <text x="195" y="301" font-size="12" fill="#6b7280" text-anchor="end">F2+</text>
  <text x="195" y="327" font-size="12" fill="#6b7280" text-anchor="end">S2+</text>
  <text x="195" y="383" font-size="12" fill="#6b7280" text-anchor="end">S2-</text>
  <text x="195" y="426" font-size="12" fill="#6b7280" text-anchor="end">F2-</text>

  <!-- ==================== МІЖПАНЕЛЬНА МАРШРУТИЗАЦІЯ ==================== -->
  <!-- Канал 1 (Активні провідники) -->
  <line x1="210" y1="132" x2="240" y2="132" stroke="#2457d6" stroke-width="2"/>
  <line x1="240" y1="132" x2="240" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="240" y1="145" x2="265" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <line x1="210" y1="158" x2="245" y2="158" stroke="#27ae60" stroke-width="2"/>
  <line x1="245" y1="158" x2="245" y2="223" stroke="#27ae60" stroke-width="2"/>
  <line x1="245" y1="223" x2="265" y2="223" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  
  <line x1="210" y1="188" x2="250" y2="188" stroke="#27ae60" stroke-width="2"/>
  <line x1="250" y1="188" x2="250" y2="301" stroke="#27ae60" stroke-width="2"/>
  <line x1="250" y1="301" x2="265" y2="301" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  
  <line x1="210" y1="220" x2="255" y2="220" stroke="#2457d6" stroke-width="2"/>
  <line x1="255" y1="220" x2="255" y2="379" stroke="#2457d6" stroke-width="2"/>
  <line x1="255" y1="379" x2="265" y2="379" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Канал 2 (Вимкнені провідники) -->
  <line x1="210" y1="307" x2="235" y2="307" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="235" y1="307" x2="235" y2="156" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="235" y1="156" x2="265" y2="156" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <line x1="210" y1="333" x2="232" y2="333" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="232" y1="333" x2="232" y2="234" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="232" y1="234" x2="265" y2="234" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <line x1="210" y1="367" x2="229" y2="367" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="229" y1="367" x2="229" y2="312" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="229" y1="312" x2="265" y2="312" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <line x1="210" y1="410" x2="226" y2="410" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="226" y1="410" x2="226" y2="390" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="226" y1="390" x2="265" y2="390" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <!-- ==================== ПАНЕЛЬ 2: АНАЛОГОВІ МУЛЬТИПЛЕКСОРИ ==================== -->
  <rect x="255" y="65" width="410" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="87" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналогові мультиплексори (Комутація 4-х ліній)</text>

  <!-- MUX 1: Force+ MUX -->
  <rect x="265" y="100" width="390" height="68" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="275" y="117" font-size="12" font-weight="bold" fill="#2457d6">Force+ MUX (струм I_EXC)</text>
  <text x="570" y="117" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_EXC = 1 mA</text>

  <circle cx="330" cy="145" r="3" fill="#2457d6"/>
  <line x1="330" y1="145" x2="400" y2="145" stroke="#2457d6" stroke-width="2"/>
  <rect x="400" y="134" width="55" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="427.5" y="149" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_ON1</text>
  <line x1="455" y1="145" x2="640" y2="145" stroke="#2457d6" stroke-width="2"/>
  <circle cx="640" cy="145" r="3" fill="#2457d6"/>

  <text x="275" y="156" font-size="12" fill="#6b7280">CH2</text>
  <circle cx="305" cy="153" r="3" fill="#9ca3af"/>
  <line x1="305" y1="153" x2="325" y2="142" stroke="#9ca3af" stroke-width="2"/>

  <!-- MUX 2: Sense+ MUX -->
  <rect x="265" y="178" width="390" height="68" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="275" y="195" font-size="12" font-weight="bold" fill="#27ae60">Sense+ MUX (напруга V_AIN+)</text>
  <text x="570" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_SENSE ≈ 0 nA</text>

  <circle cx="330" cy="223" r="3" fill="#27ae60"/>
  <line x1="330" y1="223" x2="400" y2="223" stroke="#27ae60" stroke-width="2"/>
  <rect x="400" y="212" width="55" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="427.5" y="227" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_ON2</text>
  <line x1="455" y1="223" x2="640" y2="223" stroke="#27ae60" stroke-width="2"/>
  <circle cx="640" cy="223" r="3" fill="#27ae60"/>

  <text x="275" y="234" font-size="12" fill="#6b7280">CH2</text>
  <circle cx="305" cy="231" r="3" fill="#9ca3af"/>
  <line x1="305" y1="231" x2="325" y2="220" stroke="#9ca3af" stroke-width="2"/>

  <!-- MUX 3: Sense- MUX -->
  <rect x="265" y="256" width="390" height="68" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="275" y="273" font-size="12" font-weight="bold" fill="#27ae60">Sense- MUX (напруга V_AIN-)</text>
  <text x="570" y="273" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_R_ON = 0 V</text>

  <circle cx="330" cy="301" r="3" fill="#27ae60"/>
  <line x1="330" y1="301" x2="400" y2="301" stroke="#27ae60" stroke-width="2"/>
  <rect x="400" y="290" width="55" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="427.5" y="305" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_ON3</text>
  <line x1="455" y1="301" x2="640" y2="301" stroke="#27ae60" stroke-width="2"/>
  <circle cx="640" cy="301" r="3" fill="#27ae60"/>

  <text x="275" y="312" font-size="12" fill="#6b7280">CH2</text>
  <circle cx="305" cy="309" r="3" fill="#9ca3af"/>
  <line x1="305" y1="309" x2="325" y2="298" stroke="#9ca3af" stroke-width="2"/>

  <!-- MUX 4: Force- MUX -->
  <rect x="265" y="334" width="390" height="68" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="275" y="351" font-size="12" font-weight="bold" fill="#2457d6">Force- MUX (повернення струму)</text>
  <text x="570" y="351" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">До опорного R_REF</text>

  <circle cx="330" cy="379" r="3" fill="#2457d6"/>
  <line x1="330" y1="379" x2="400" y2="379" stroke="#2457d6" stroke-width="2"/>
  <rect x="400" y="368" width="55" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="427.5" y="383" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_ON4</text>
  <line x1="455" y1="379" x2="640" y2="379" stroke="#2457d6" stroke-width="2"/>
  <circle cx="640" cy="379" r="3" fill="#2457d6"/>

  <text x="275" y="390" font-size="12" fill="#6b7280">CH2</text>
  <circle cx="305" cy="387" r="3" fill="#9ca3af"/>
  <line x1="305" y1="387" x2="325" y2="376" stroke="#9ca3af" stroke-width="2"/>

  <!-- Підсумковий банер MUX -->
  <rect x="265" y="412" width="390" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="460" y="429" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: R_ON мультиплексорів не впливає на точність!</text>

  <!-- ==================== ПАНЕЛЬ 3: ВИМІРЮВАЛЬНИЙ ТРАКТ ==================== -->
  <rect x="685" y="65" width="255" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="812.5" y="87" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вимірювальний тракт</text>

  <!-- Джерело струму I_EXC -->
  <rect x="700" y="100" width="225" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="812.5" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Джерело струму I_EXC</text>
  <text x="812.5" y="137" font-size="12" fill="#6b7280" text-anchor="middle">Генератор точного струму</text>
  <line x1="700" y1="145" x2="640" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 24-бітний АЦП з PGA -->
  <rect x="700" y="168" width="225" height="160" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="812.5" y="188" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">24-бітний АЦП з PGA</text>
  
  <!-- Вхідні провідники АЦП -->
  <line x1="640" y1="223" x2="700" y2="223" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="710" y="217" font-size="12" font-weight="bold" fill="#27ae60">V_AIN+</text>

  <line x1="640" y1="301" x2="700" y2="301" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="710" y="295" font-size="12" font-weight="bold" fill="#27ae60">V_AIN-</text>

  <rect x="710" y="232" width="205" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="812.5" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний опір R_IN &gt; 10 GOm</text>
  <text x="812.5" y="268" font-size="12" fill="#27ae60" text-anchor="middle">Падіння на R_ON2 та R_ON3 = 0 В</text>

  <!-- Опорний опір R_REF та GND -->
  <rect x="700" y="345" width="225" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  
  <line x1="640" y1="379" x2="715" y2="379" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <rect x="715" y="365" width="55" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="742.5" y="383" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_REF</text>

  <text x="840" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">Опорний опір</text>
  <text x="840" y="381" font-size="12" fill="#6b7280">(Ratiometric)</text>

  <!-- Провідник від R_REF до GND -->
  <line x1="770" y1="379" x2="820" y2="379" stroke="#2457d6" stroke-width="2"/>
  <line x1="820" y1="379" x2="820" y2="408" stroke="#2457d6" stroke-width="2"/>
  
  <!-- Символ Землі (GND) -->
  <line x1="810" y1="408" x2="830" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="814" y1="412" x2="826" y2="412" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="817" y1="416" x2="823" y2="416" stroke="#1a1a1a" stroke-width="1"/>
  <text x="835" y="413" font-size="12" fill="#6b7280">GND</text>
</svg>
