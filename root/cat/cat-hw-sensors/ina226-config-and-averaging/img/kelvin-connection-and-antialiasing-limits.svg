<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Обмеження цифрового усереднення INA226: аналогові джерела похибок</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Паразитний опір доріжок та аліасинг ВЧ-завад викривляють сигнал ще до АЦП</text>

  <!-- PANEL 1: Kelvin Connection Issue -->
  <rect x="30" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Title -->
  <text x="247" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Не-Kelvin підключення шунта</text>
  <text x="247" y="122" text-anchor="middle" font-size="12" fill="#c0392b">Паразитний опір доріжок додається до R_shunt</text>

  <!-- Power Bus Wire -->
  <line x1="45" y1="165" x2="115" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="165" y1="165" x2="215" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="279" y1="165" x2="329" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="379" y1="165" x2="450" y2="165" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Power Bus Labels and Current Arrow -->
  <text x="65" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I_load</text>
  <line x1="48" y1="150" x2="82" y2="150" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="65" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">+V_BUS</text>
  <text x="420" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження</text>

  <!-- Parasitic R_tr1 -->
  <text x="140" y="142" text-anchor="middle" font-size="12" fill="#c0392b">доріжка</text>
  <rect x="115" y="152" width="50" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="140" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_tr1</text>

  <!-- Main Shunt Resistor -->
  <text x="247" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шунт</text>
  <rect x="215" y="148" width="64" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="247" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">R_shunt</text>

  <!-- Parasitic R_tr2 -->
  <text x="354" y="142" text-anchor="middle" font-size="12" fill="#c0392b">доріжка</text>
  <rect x="329" y="152" width="50" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="354" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_tr2</text>

  <!-- Non-Kelvin Taps (INCORRECT - RED DASHED LINES) -->
  <!-- Tap 1 at x=90 -->
  <circle cx="90" cy="165" r="4" fill="#c0392b"/>
  <path d="M 90 165 L 90 235 L 150 235 L 150 275" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="98" y="200" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">IN+ (з похибкою)</text>

  <!-- Tap 2 at x=404 -->
  <circle cx="404" cy="165" r="4" fill="#c0392b"/>
  <path d="M 404 165 L 404 235 L 344 235 L 344 275" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="396" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">IN- (з похибкою)</text>

  <!-- Explanatory label above sense horizontal path -->
  <text x="247" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Паразитне коло вимірювання</text>

  <!-- INA226 IC Box -->
  <rect x="100" y="275" width="294" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Цифровий монітор живлення INA226</text>

  <!-- ADC block -->
  <rect x="115" y="312" width="110" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ΔΣ АЦП</text>
  <text x="170" y="354" text-anchor="middle" font-size="12" fill="#2457d6">16-біт вибірки</text>

  <!-- Arrow inside IC -->
  <line x1="231" y1="341" x2="263" y2="341" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Averaging block -->
  <rect x="269" y="312" width="110" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="324" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Усереднення</text>
  <text x="324" y="354" text-anchor="middle" font-size="12" fill="#2457d6">N = 1..1024</text>

  <!-- Bottom Warning Box in Panel 1 -->
  <rect x="45" y="400" width="405" height="102" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_sense = I_load · (R_shunt + R_tr1 + R_tr2)</text>
  <text x="247" y="446" text-anchor="middle" font-size="12" fill="#1a1a1a">Цифрове усереднення зменшує випадковий шум,</text>
  <text x="247" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">але залишає 100% систематичної похибки від R_tr!</text>


  <!-- PANEL 2: Aliasing of High Frequency Noise -->
  <rect x="495" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Title -->
  <text x="712" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Аліасинг ВЧ-завад без RC-фільтра</text>
  <text x="712" y="122" text-anchor="middle" font-size="12" fill="#c0392b">Завади з f_noise &gt; f_s / 2 створюють хибний НЧ-сигнал</text>

  <!-- Waveform Box 1: Input signal with noise and ADC sampling -->
  <rect x="510" y="140" width="405" height="122" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="522" y="158" font-size="12" font-weight="bold" fill="#1a1a1a">1. Вхідний аналоговий V_in(t) та вибірки АЦП</text>

  <!-- Labels in Graph 1 -->
  <text x="552" y="178" font-size="12" font-weight="bold" fill="#27ae60">Дійсний V_shunt</text>
  <text x="885" y="178" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Вибірки АЦП (період T_s)</text>

  <!-- Real Shunt Voltage reference line -->
  <line x1="545" y1="205" x2="885" y2="205" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Axis 1 -->
  <line x1="545" y1="235" x2="895" y2="235" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>
  <text x="902" y="239" font-size="12" font-style="italic" fill="#1a1a1a">t</text>
  <line x1="545" y1="235" x2="545" y2="170" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>
  <text x="545" y="165" text-anchor="middle" font-size="12" font-style="italic" fill="#1a1a1a">V</text>

  <!-- High-Frequency Noise Wave -->
  <path d="M 545 205 Q 551 189 557 205 T 569 205 T 581 205 T 593 205 T 605 205 T 617 205 T 629 205 T 641 205 T 653 205 T 665 205 T 677 205 T 689 205 T 701 205 T 713 205 T 725 205 T 737 205 T 749 205 T 761 205 T 773 205 T 785 205 T 797 205 T 809 205 T 821 205 T 833 205 T 845 205 T 857 205 T 869 205 T 881 205 T 893 205" fill="none" stroke="#6b7280" stroke-width="1"/>

  <!-- Sampling Points and Ticks -->
  <line x1="565" y1="235" x2="565" y2="189" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="565" cy="189" r="3.5" fill="#c0392b"/>

  <line x1="613" y1="235" x2="613" y2="221" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="613" cy="221" r="3.5" fill="#c0392b"/>

  <line x1="661" y1="235" x2="661" y2="193" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="661" cy="193" r="3.5" fill="#c0392b"/>

  <line x1="709" y1="235" x2="709" y2="223" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="709" cy="223" r="3.5" fill="#c0392b"/>

  <line x1="757" y1="235" x2="757" y2="189" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="757" cy="189" r="3.5" fill="#c0392b"/>

  <line x1="805" y1="235" x2="805" y2="221" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="805" cy="221" r="3.5" fill="#c0392b"/>

  <line x1="853" y1="235" x2="853" y2="193" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="853" cy="193" r="3.5" fill="#c0392b"/>


  <!-- Waveform Box 2: Aliased Low-Frequency Wave & Averaging Offset -->
  <rect x="510" y="268" width="405" height="124" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="522" y="284" font-size="12" font-weight="bold" fill="#c0392b">2. Хибний НЧ-сигнал (аліас) та результат усереднення</text>

  <!-- Labels in Graph 2 -->
  <text x="552" y="302" font-size="12" font-weight="bold" fill="#c0392b">Аліасована НЧ-хвиля</text>
  <text x="885" y="302" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Усереднений V_out (зсув!)</text>

  <!-- Averaged Value Line (Shifted / Fluctuation) -->
  <line x1="545" y1="316" x2="885" y2="316" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Real Shunt Voltage reference line -->
  <line x1="545" y1="340" x2="885" y2="340" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="552" y="364" font-size="12" font-weight="bold" fill="#27ae60">Дійсний V_shunt</text>

  <!-- Axis 2 -->
  <line x1="545" y1="374" x2="895" y2="374" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>
  <text x="902" y="378" font-size="12" font-style="italic" fill="#1a1a1a">t</text>
  <line x1="545" y1="374" x2="545" y2="294" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>
  <text x="545" y="290" text-anchor="middle" font-size="12" font-style="italic" fill="#1a1a1a">V</text>

  <!-- Sample Dots in Graph 2 -->
  <circle cx="565" cy="324" r="3.5" fill="#c0392b"/>
  <circle cx="613" cy="356" r="3.5" fill="#c0392b"/>
  <circle cx="661" cy="328" r="3.5" fill="#c0392b"/>
  <circle cx="709" cy="358" r="3.5" fill="#c0392b"/>
  <circle cx="757" cy="324" r="3.5" fill="#c0392b"/>
  <circle cx="805" cy="356" r="3.5" fill="#c0392b"/>
  <circle cx="853" cy="328" r="3.5" fill="#c0392b"/>

  <!-- Low Frequency Aliased Wave (connecting sample dots) -->
  <path d="M 565 324 Q 589 356 613 356 T 661 328 T 709 358 T 757 324 T 805 356 T 853 328" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom Warning Box in Panel 2 -->
  <rect x="510" y="400" width="405" height="102" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Цифрове усереднення сприймає аліас як дійсний НЧ-сигнал!</text>
  <text x="712" y="446" text-anchor="middle" font-size="12" fill="#1a1a1a">ВЧ-завади з f &gt; f_s / 2 слід зрізати АНАЛОГОВИМ RC-фільтром</text>
  <text x="712" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">R_filt ≤ 10 Ом, C_filt безпосередньо на виводах IN+ / IN-</text>
</svg>
