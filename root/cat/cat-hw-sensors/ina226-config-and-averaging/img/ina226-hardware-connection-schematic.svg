<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Marker Defs -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема апаратного підключення INA226 (VSSOP-10)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Вимірювання струму на високому боці, напруги VBUS та шини I2C з сигналом ALERT</text>

  <!-- Panel 1: Power & Load (Left) -->
  <rect x="25" y="70" width="235" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8" ry="8"/>
  <text x="142.5" y="92" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">СИЛОВА ШИНА ТА НАВАНТАЖЕННЯ</text>

  <!-- Panel 2: INA226 IC (Center) -->
  <rect x="275" y="70" width="305" height="430" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="8" ry="8"/>
  <text x="427.5" y="92" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МІКРОСХЕМА INA226 (VSSOP-10)</text>
  <text x="427.5" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювач струму, напруги та потужності</text>

  <!-- Panel 3: MCU & Interface (Right) -->
  <rect x="595" y="70" width="340" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8" ry="8"/>
  <text x="765" y="92" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">МІКРОКОНТРОЛЕР ТА ШИНА I2C</text>

  <!-- === PANEL 1 CONTENT === -->
  <!-- V_IN Source label & main line -->
  <text x="38" y="122" font-size="12" font-weight="bold" fill="#1a1a1a">Джерело V_IN (0–36 В)</text>
  <line x1="35" y1="140" x2="115" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Shunt Resistor R_SHUNT -->
  <rect x="115" y="128" width="60" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="3"/>
  <text x="145" y="144" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_SHUNT</text>
  <text x="145" y="166" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювальний</text>
  <text x="145" y="180" font-size="12" fill="#6b7280" text-anchor="middle">шунт</text>
  <line x1="175" y1="140" x2="245" y2="140" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Junction Dots on Power Line -->
  <circle cx="55" cy="140" r="3.5" fill="#2457d6"/>
  <circle cx="95" cy="140" r="3.5" fill="#2457d6"/>
  <circle cx="205" cy="140" r="3.5" fill="#2457d6"/>

  <!-- Signal Lines to INA226 -->
  <polyline points="55,140 55,300 330,300" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="65" y="292" font-size="12" fill="#2457d6">VBUS Sense</text>

  <polyline points="95,140 95,200 330,200" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="105" y="192" font-size="12" font-weight="bold" fill="#2457d6">IN+ (High Side)</text>

  <polyline points="205,140 205,250 330,250" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="110" y="242" font-size="12" font-weight="bold" fill="#2457d6">IN- (Low Side)</text>

  <!-- Connection to Load -->
  <line x1="245" y1="140" x2="245" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="195" y="340" width="60" height="55" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="225" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LOAD</text>
  <text x="225" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Навантаження</text>

  <!-- Power Ground -->
  <line x1="225" y1="395" x2="225" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="430" x2="240" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="215" y1="435" x2="235" y2="435" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="440" x2="230" y2="440" stroke="#1a1a1a" stroke-width="1"/>
  <text x="225" y="460" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND_PWR</text>

  <!-- === PANEL 2 CONTENT: INA226 IC === -->
  <rect x="350" y="140" width="180" height="260" fill="white" stroke="#1a1a1a" stroke-width="2" rx="6" ry="6"/>
  <path d="M 430,140 A 10,10 0 0,0 450,140 Z" fill="#d0d7de"/>

  <!-- IC Title & Subtitle inside IC -->
  <text x="440" y="165" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">INA226</text>
  <text x="440" y="182" font-size="12" fill="#6b7280" text-anchor="middle">VSSOP-10</text>

  <!-- Internal Functional Blocks -->
  <rect x="390" y="200" width="100" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="440" y="221" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PGA / ADC</text>

  <rect x="390" y="250" width="100" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="440" y="271" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VBUS ADC</text>

  <rect x="390" y="300" width="100" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="440" y="318" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Math Engine</text>
  <text x="440" y="334" font-size="12" fill="#27ae60" text-anchor="middle">Регістри</text>

  <!-- Left Pins (10, 9, 8, 6, 7) -->
  <rect x="330" y="192" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="334" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">10</text>
  <text x="356" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">IN+</text>

  <rect x="330" y="242" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="337" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">9</text>
  <text x="356" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">IN-</text>

  <rect x="330" y="292" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="337" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">8</text>
  <text x="356" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">VBUS</text>

  <rect x="330" y="342" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="337" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">6</text>
  <text x="356" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">VS</text>

  <rect x="330" y="372" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="337" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">7</text>
  <text x="356" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Right Pins (5, 4, 3, 2, 1) -->
  <rect x="530" y="192" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="537" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">5</text>
  <text x="524" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SCL</text>

  <rect x="530" y="242" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="537" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">4</text>
  <text x="524" y="254" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SDA</text>

  <rect x="530" y="292" width="20" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="537" y="304" font-size="12" font-weight="bold" fill="#c0392b">3</text>
  <text x="524" y="304" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ALERT</text>

  <rect x="530" y="342" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="537" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">2</text>
  <text x="524" y="354" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">A0</text>

  <rect x="530" y="372" width="20" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="537" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="524" y="384" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">A1</text>

  <!-- VS Supply & Bypass Capacitor -->
  <text x="308" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_S (3.3 В)</text>
  <line x1="308" y1="328" x2="308" y2="350" stroke="#27ae60" stroke-width="2"/>
  <line x1="308" y1="350" x2="330" y2="350" stroke="#27ae60" stroke-width="2"/>
  <circle cx="308" cy="350" r="3" fill="#27ae60"/>

  <line x1="308" y1="350" x2="308" y2="362" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="300" y1="362" x2="316" y2="362" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="300" y1="366" x2="316" y2="366" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="308" y1="366" x2="308" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="296" y="368" font-size="12" fill="#6b7280" text-anchor="end">0.1 µF</text>

  <line x1="330" y1="380" x2="308" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="308" y1="380" x2="308" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="308" cy="380" r="3" fill="#1a1a1a"/>
  <line x1="298" y1="395" x2="318" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="302" y1="399" x2="314" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="306" y1="403" x2="310" y2="403" stroke="#1a1a1a" stroke-width="1"/>
  <text x="308" y="418" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Register 00h Banner -->
  <rect x="285" y="430" width="285" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="427.5" y="446" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Регістр 00h (Configuration Register)</text>
  <text x="427.5" y="462" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">[ RST | AVG | VBUSCT | VSHCT | MODE ]</text>
  <text x="427.5" y="478" font-size="12" fill="#6b7280" text-anchor="middle">Усереднення (1–1024) • Час VSH/VBUS • Режим</text>

  <!-- === PANEL 3 CONTENT: MCU & I2C BUS === -->
  <!-- V_DD Power Rail for Pull-ups -->
  <text x="690" y="115" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_DD (+3.3 V)</text>
  <line x1="630" y1="125" x2="750" y2="125" stroke="#27ae60" stroke-width="2"/>

  <!-- SCL Connection & Pull-up -->
  <line x1="550" y1="200" x2="770" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="125" x2="640" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="633" y="145" width="14" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="630" y="161" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R_PU</text>
  <line x1="640" y1="170" x2="640" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="640" cy="125" r="3" fill="#27ae60"/>
  <circle cx="640" cy="200" r="3" fill="#1a1a1a"/>

  <!-- SDA Connection & Pull-up -->
  <line x1="550" y1="250" x2="770" y2="250" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="690" y1="125" x2="690" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="683" y="145" width="14" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="680" y="161" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R_PU</text>
  <line x1="690" y1="170" x2="690" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="690" cy="125" r="3" fill="#27ae60"/>
  <circle cx="690" cy="250" r="3" fill="#1a1a1a"/>

  <!-- ALERT Connection & Pull-up -->
  <line x1="550" y1="300" x2="770" y2="300" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="740" y1="125" x2="740" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="733" y="145" width="14" height="25" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <text x="730" y="161" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">R_PU</text>
  <line x1="740" y1="170" x2="740" y2="300" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="740" cy="125" r="3" fill="#27ae60"/>
  <circle cx="740" cy="300" r="3" fill="#c0392b"/>
  <text x="605" y="320" font-size="12" font-weight="bold" fill="#c0392b">ALERT (Open-Drain)</text>

  <!-- Grounded Address Pins A0, A1 -->
  <polyline points="550,350 610,350 610,405" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <polyline points="550,380 610,380 610,405" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="610" y1="405" x2="610" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="600" y1="420" x2="620" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="604" y1="424" x2="616" y2="424" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="608" y1="428" x2="612" y2="428" stroke="#1a1a1a" stroke-width="1"/>
  <text x="625" y="365" font-size="12" font-weight="bold" fill="#27ae60">A0=0, A1=0</text>
  <text x="625" y="383" font-size="12" font-weight="bold" fill="#27ae60">Addr: 0x40</text>

  <!-- MCU Block -->
  <rect x="770" y="140" width="145" height="185" fill="white" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="842.5" y="165" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="780" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">SCL</text>
  <text x="780" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">SDA</text>
  <text x="780" y="304" font-size="12" font-weight="bold" fill="#c0392b">GPIO (INT)</text>

  <!-- MCU Feature Summary Box -->
  <rect x="705" y="340" width="215" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="812.5" y="362" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Особливості INA226</text>
  <text x="715" y="384" font-size="12" fill="#1a1a1a">• Шина VBUS: 0–36 В</text>
  <text x="715" y="404" font-size="12" fill="#1a1a1a">• Shunt Voltage: ±81.92 mV</text>
  <text x="715" y="424" font-size="12" fill="#1a1a1a">• Розрядність: 16-bit ADC</text>
  <text x="715" y="444" font-size="12" fill="#6b7280">• Точність струму/напруги</text>
  <text x="727" y="462" font-size="12" fill="#6b7280">та розрахунок потужності</text>
</svg>
