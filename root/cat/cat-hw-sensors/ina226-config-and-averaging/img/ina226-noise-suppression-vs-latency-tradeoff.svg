<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Компроміс між пригніченням шуму та затримкою в INA226</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Залежність точності й часу відгуку від кількості усереднень NUM та часу конверсії T_conv</text>

  <!-- Left Container: Main Plot -->
  <rect x="30" y="75" width="540" height="373" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Zone 1 Background Rect (Fast) -->
  <rect x="42" y="85" width="156" height="355" fill="#fdecea" stroke="#f5c6cb" stroke-width="1" rx="6"/>
  <!-- Zone 2 Background Rect (Balanced) -->
  <rect x="210" y="85" width="170" height="355" fill="#eaf0fd" stroke="#b8daff" stroke-width="1" rx="6"/>
  <!-- Zone 3 Background Rect (Precision) -->
  <rect x="392" y="85" width="166" height="355" fill="#e9f7ef" stroke="#c3e6cb" stroke-width="1" rx="6"/>

  <!-- Zone Headers -->
  <!-- Zone 1 -->
  <text x="120" y="98" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона 1: Швидка</text>
  <text x="120" y="114" font-size="12" fill="#c0392b" text-anchor="middle">Аварійний захист (OCP)</text>
  <text x="120" y="130" font-size="12" fill="#6b7280" text-anchor="middle">NUM = 1..4 | T &lt; 2.3 мс</text>

  <!-- Zone 2 -->
  <text x="295" y="98" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зона 2: Баланс</text>
  <text x="295" y="114" font-size="12" fill="#2457d6" text-anchor="middle">Фільтрація 50/60 Гц</text>
  <text x="295" y="130" font-size="12" fill="#6b7280" text-anchor="middle">NUM = 16..64 | 17..70 мс</text>

  <!-- Zone 3 -->
  <text x="475" y="98" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона 3: Точна</text>
  <text x="475" y="114" font-size="12" fill="#27ae60" text-anchor="middle">Повільна телеметрія</text>
  <text x="475" y="130" font-size="12" fill="#6b7280" text-anchor="middle">NUM = 128..1024 | T &gt; 0.1 s</text>

  <!-- Horizontal Grid lines -->
  <line x1="110" y1="315" x2="550" y2="315" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="110" y1="245" x2="550" y2="245" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="110" y1="175" x2="550" y2="175" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Y Axis Labels -->
  <text x="104" y="389" font-size="12" fill="#6b7280" text-anchor="end">0 dB (1×)</text>
  <text x="104" y="319" font-size="12" fill="#6b7280" text-anchor="end">10 dB (3×)</text>
  <text x="104" y="249" font-size="12" fill="#6b7280" text-anchor="end">20 dB (10×)</text>
  <text x="104" y="179" font-size="12" fill="#6b7280" text-anchor="end">30 dB (32×)</text>

  <!-- Vertical Grid lines (X Ticks) -->
  <line x1="135" y1="340" x2="135" y2="385" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="190" y1="340" x2="190" y2="385" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <!-- 50Hz Rejection line in 2 segments to avoid badge rect at Y=[252,276] -->
  <line x1="295" y1="160" x2="295" y2="248" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="295" y1="280" x2="295" y2="385" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="430" y1="168" x2="430" y2="385" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="525" y1="185" x2="525" y2="385" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- X Axis Tick Labels -->
  <text x="135" y="404" font-size="12" fill="#6b7280" text-anchor="middle">0.14 мс</text>
  <text x="190" y="404" font-size="12" fill="#6b7280" text-anchor="middle">1.1 мс</text>
  <text x="295" y="404" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">20 мс</text>
  <text x="430" y="404" font-size="12" fill="#6b7280" text-anchor="middle">140 мс</text>
  <text x="525" y="404" font-size="12" fill="#6b7280" text-anchor="middle">8.4 с</text>

  <!-- Plot Axes -->
  <line x1="110" y1="385" x2="550" y2="385" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="110" y1="385" x2="110" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Plot Axis Titles -->
  <text x="125" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Пригнічення шуму / Точність (dB)</text>
  <text x="330" y="426" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Затримка T_total (мс)</text>

  <!-- Noise Suppression Curve -->
  <path d="M 135 385 C 180 375, 220 330, 295 301 C 370 272, 440 215, 525 175" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Data Point 1 (Fast) -->
  <circle cx="135" cy="385" r="5" fill="#c0392b" stroke="white" stroke-width="2"/>
  <text x="115" y="335" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">140 мкс (NUM=1)</text>

  <!-- Data Point 2 (50Hz Rejection) -->
  <circle cx="295" cy="301" r="6" fill="#2457d6" stroke="white" stroke-width="2"/>
  <rect x="215" y="252" width="160" height="24" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="295" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пригнічення 50 Гц (20 мс)</text>

  <!-- Data Point 3 (High Precision) -->
  <circle cx="525" cy="175" r="5" fill="#27ae60" stroke="white" stroke-width="2"/>
  <text x="515" y="162" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">8.44 с (NUM=1024)</text>

  <!-- Bottom Left Panel: Math & Rules -->
  <rect x="30" y="460" width="540" height="78" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="45" y="480" font-size="12" font-weight="bold" fill="#1a1a1a">Формули: <tspan font-weight="normal">T_total = NUM × (T_conv_VSH + T_conv_VBUS)</tspan>  |  <tspan font-weight="normal">σ_out = σ_ADC / √NUM</tspan></text>
  <text x="45" y="500" font-size="12" fill="#2457d6" font-weight="bold">💡 Для 50 Гц обирайте T_total ≈ 20 мс (NUM = 16, T_conv = 1.1 мс → 17.6 мс)</text>
  <text x="45" y="520" font-size="12" fill="#6b7280">Пригнічення: 10·log₁₀(NUM). NUM=16 → 12 dB, NUM=64 → 18 dB, NUM=1024 → 30 dB</text>

  <!-- Right Side: Recommendation Cards -->
  <!-- Card 1: Fast / Protection -->
  <rect x="595" y="75" width="340" height="130" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="607" y="87" width="180" height="24" fill="#c0392b" rx="4"/>
  <text x="697" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1. Швидкий захист (OCP)</text>
  <text x="610" y="127" font-size="12" font-weight="bold" fill="#1a1a1a">Конфігурація: <tspan fill="#c0392b" font-weight="normal">NUM = 1..4, T_conv = 140..588 мкс</tspan></text>
  <text x="610" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">Час реакції (T_total): <tspan fill="#c0392b">140 мкс – 2.3 мс</tspan></text>
  <text x="610" y="163" font-size="12" fill="#6b7280">Пригнічення шуму: 0 – 6 dB (мінімальне)</text>
  <text x="610" y="181" font-size="12" fill="#1a1a1a">Застосування: Захист від КЗ, швидкий OCP</text>

  <!-- Card 2: Balanced / 50/60Hz Rejection -->
  <rect x="595" y="225" width="340" height="130" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="607" y="237" width="240" height="24" fill="#2457d6" rx="4"/>
  <text x="727" y="253" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2. Баланс та 50/60 Гц (Рекомендовано)</text>
  <text x="610" y="277" font-size="12" font-weight="bold" fill="#1a1a1a">Конфігурація: <tspan fill="#2457d6" font-weight="normal">NUM = 16..64, T_conv = 1.1 мс</tspan></text>
  <text x="610" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">Час реакції (T_total): <tspan fill="#2457d6">17.6 мс – 70.4 мс</tspan></text>
  <text x="610" y="313" font-size="12" fill="#6b7280">Пригнічення шуму: 12 – 18 dB (в 4–8 разів)</text>
  <text x="610" y="331" font-size="12" fill="#1a1a1a">Застосування: Телеметрія, DCDC, DC мотори</text>

  <!-- Card 3: High Precision -->
  <rect x="595" y="375" width="340" height="160" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="607" y="387" width="200" height="24" fill="#27ae60" rx="4"/>
  <text x="707" y="403" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3. Висока точність (Precision)</text>
  <text x="610" y="427" font-size="12" font-weight="bold" fill="#1a1a1a">Конфігурація: <tspan fill="#27ae60" font-weight="normal">NUM = 128..1024, T = 1.1–8.2 мс</tspan></text>
  <text x="610" y="445" font-size="12" font-weight="bold" fill="#1a1a1a">Час реакції (T_total): <tspan fill="#27ae60">0.14 с – 8.44 с</tspan></text>
  <text x="610" y="463" font-size="12" fill="#6b7280">Пригнічення шуму: 21 – 30 dB (у 11–32 рази)</text>
  <text x="610" y="481" font-size="12" fill="#1a1a1a">Застосування: АКБ, сонячні панелі,</text>
  <text x="610" y="499" font-size="12" fill="#1a1a1a">вимірювання малих струмів витоку</text>
</svg>
