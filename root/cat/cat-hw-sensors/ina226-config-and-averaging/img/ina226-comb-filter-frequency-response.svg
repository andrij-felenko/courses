  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Амплітудно-частотна характеристика фільтра INA226</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Залежність смуги пропускання та точок режекції 50/60 Гц від часу конверсії T_conv і усереднення N_AVG</text>

  <!-- Legend Bar (Above plot) -->
  <rect x="110" y="62" width="525" height="32" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <line x1="125" y1="78" x2="155" y2="78" stroke="#2457d6" stroke-width="2.5"/>
  <text x="163" y="82" font-size="12" fill="#1a1a1a">T_int = 20 мс (режекція 50 Гц)</text>
  <line x1="385" y1="78" x2="415" y2="78" stroke="#27ae60" stroke-width="2.5"/>
  <text x="423" y="82" font-size="12" fill="#1a1a1a">T_int = 16.67 мс (режекція 60 Гц)</text>

  <!-- Plot Background -->
  <rect x="110" y="110.0" width="525" height="275" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Horizontal Grid Lines -->
  <line x1="110" y1="110.0" x2="635" y2="110.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="190.6" x2="635" y2="190.6" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="247.5" x2="635" y2="247.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>

