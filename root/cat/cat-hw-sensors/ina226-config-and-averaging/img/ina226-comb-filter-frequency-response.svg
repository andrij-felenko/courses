  <!-- Notch Markers (Circles at Zeros) -->
  <circle cx="297.5" cy="385.0" r="5" fill="#2457d6"/>
  <circle cx="335.0" cy="385.0" r="5" fill="#27ae60"/>
  <circle cx="485.0" cy="385.0" r="4" fill="#2457d6"/>
  <circle cx="560.0" cy="385.0" r="4" fill="#27ae60"/>

  <!-- Y-Axis Ticks & Labels -->
  <text x="100" y="114" font-size="12" fill="#1a1a1a" text-anchor="end">1.0</text>
  <text x="100" y="194" font-size="12" fill="#6b7280" text-anchor="end">0.707 (-3 dB)</text>
  <text x="100" y="251" font-size="12" fill="#1a1a1a" text-anchor="end">0.5</text>
  <text x="100" y="389" font-size="12" fill="#1a1a1a" text-anchor="end">0.0</text>
  <text x="110" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Відносна амплітуда |H(f)|</text>

  <!-- X-Axis Ticks & Labels -->
  <text x="110.0" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="203.8" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">25</text>
  <text x="297.5" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">50</text>
  <text x="335.0" y="405" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">60</text>
  <text x="485.0" y="405" font-size="12" fill="#2457d6" text-anchor="middle">100</text>
  <text x="560.0" y="405" font-size="12" fill="#27ae60" text-anchor="middle">120</text>
  <text x="635.0" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">140</text>
  <text x="635.0" y="425" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Частота f [Гц]</text>

  <!-- Right Information Panel -->
  <rect x="655" y="62" width="280" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="795" y="85" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">РОЗРАХУНОК ФІЛЬТРАЦІЇ INA226</text>

  <rect x="670" y="100" width="250" height="85" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="680" y="120" font-size="12" font-weight="bold" fill="#2457d6">Час інтегрування T_int:</text>
  <text x="680" y="142" font-size="13" fill="#1a1a1a">T_int = N_AVG × T_conv</text>
  <text x="680" y="162" font-size="12" fill="#6b7280">Визначає загальний цикл вибірки</text>

  <rect x="670" y="195" width="250" height="100" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="680" y="215" font-size="12" font-weight="bold" fill="#2457d6">Частоти режекції (нулі АЧХ):</text>
  <text x="680" y="237" font-size="13" fill="#1a1a1a">f_notch = k / T_int,  k = 1, 2, 3...</text>
  <text x="680" y="257" font-size="12" fill="#6b7280">• T_int = 20 мс -&gt; 50, 100 Гц</text>
  <text x="680" y="277" font-size="12" fill="#6b7280">• T_int = 16.67 мс -&gt; 60, 120 Гц</text>

  <rect x="670" y="305" width="250" height="105" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="680" y="325" font-size="12" font-weight="bold" fill="#27ae60">Пригнічення шуму (SNR):</text>
  <text x="680" y="347" font-size="13" fill="#1a1a1a">σ_out = σ_in / √(N_AVG)</text>
  <text x="680" y="367" font-size="12" fill="#1a1a1a">При N_AVG = 16: шум ↓ в 4 рази</text>
  <text x="680" y="390" font-size="12" font-weight="bold" fill="#27ae60">SNR gain = +12.0 дБ</text>

  <!-- Bottom Summary Card -->
  <rect x="110" y="442" width="825" height="100" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="8"/>
  <text x="125" y="464" font-size="13" font-weight="bold" fill="#2457d6">ІНЖЕНЕРНИЙ БАЛАНС: ЗАТРИМКА, ШУМ ТА ЗАВАДОЗАХИЩЕНІСТЬ</text>
  <text x="125" y="484" font-size="12" fill="#1a1a1a">1. Точки режекції (нулі) залежать від добутку N_AVG × T_conv: T_int = 20 мс пригнічує 50 Гц, T_int = 16.67 мс — 60 Гц.</text>
  <text x="125" y="504" font-size="12" fill="#1a1a1a">2. Комбінований час T_int = 100 мс забезпечує режекцію обох частот (50 Гц і 60 Гц) одночасно.</text>
  <text x="125" y="524" font-size="12" fill="#1a1a1a">3. Збільшення N_AVG зменшує шум у √(N_AVG) разів, але пропорційно збільшує час оновлення даних T_cycle.</text>
</svg>
