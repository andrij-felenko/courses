<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Бітова маска конфігураційного регістру INA226 (00h)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Призначення бітових полів: скидання, усереднення вибірок, час конверсії АЦП та режим вимірювання</text>

  <!-- Bit Index Labels -->
  <g font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">
    <text x="56.0" y="84">D15</text>
    <text x="120.0" y="84">D14</text>
    <text x="172.0" y="84">D13</text>
    <text x="225.0" y="84">D12</text>
    <text x="289.0" y="84">D11</text>
    <text x="341.0" y="84">D10</text>
    <text x="394.0" y="84">D9</text>
    <text x="458.0" y="84">D8</text>
    <text x="510.0" y="84">D7</text>
    <text x="563.0" y="84">D6</text>
    <text x="627.0" y="84">D5</text>
    <text x="680.0" y="84">D4</text>
    <text x="732.0" y="84">D3</text>
    <text x="796.0" y="84">D2</text>
    <text x="849.0" y="84">D1</text>
    <text x="901.0" y="84">D0</text>
  </g>

  <!-- Register Bit Field Panels -->
  <!-- Block 1: RST (Bit 15) -->
  <rect x="30" y="94" width="52" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="56.0" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">RST</text>
  <text x="56.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>

  <!-- Block 2: Reserved (Bits 14..12) -->
  <rect x="94" y="94" width="157" height="46" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="146.3" y1="94" x2="146.3" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="198.6" y1="94" x2="198.6" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="172.0" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">Зарезервовано</text>
  <text x="120.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="172.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="225.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>

  <!-- Block 3: AVG (Bits 11..9) -->
  <rect x="263" y="94" width="157" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="315.3" y1="94" x2="315.3" y2="140" stroke="#2457d6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="367.6" y1="94" x2="367.6" y2="140" stroke="#2457d6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <text x="341.0" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">AVG [2:0]</text>
  <text x="289.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="341.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="394.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>

  <!-- Block 4: VBUSCT (Bits 8..6) -->
  <rect x="432" y="94" width="157" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="484.3" y1="94" x2="484.3" y2="140" stroke="#27ae60" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="536.6" y1="94" x2="536.6" y2="140" stroke="#27ae60" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <text x="510.0" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">VBUSCT [2:0]</text>
  <text x="458.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="510.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="563.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>

  <!-- Block 5: VSHCT (Bits 5..3) -->
  <rect x="601" y="94" width="157" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="653.3" y1="94" x2="653.3" y2="140" stroke="#2457d6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="705.6" y1="94" x2="705.6" y2="140" stroke="#2457d6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <text x="680.0" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">VSHCT [2:0]</text>
  <text x="627.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="680.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="732.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>

  <!-- Block 6: MODE (Bits 2..0) -->
  <rect x="770" y="94" width="157" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="822.3" y1="94" x2="822.3" y2="140" stroke="#27ae60" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="874.6" y1="94" x2="874.6" y2="140" stroke="#27ae60" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <text x="849.0" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">MODE [2:0]</text>
  <text x="796.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="849.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="901.0" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>

  <!-- Connectors from blocks to cards -->
  <line x1="140" y1="140" x2="140" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="341" y1="140" x2="341" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="510" y1="140" x2="510" y2="170" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="680" y1="140" x2="680" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="849" y1="140" x2="849" y2="170" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Lower Detail Cards -->
  <!-- Card 1: RST & Reserved -->
  <rect x="30" y="170" width="221" height="315" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">D15: RST | D14–D12: Res</text>

  <text x="42" y="218" font-size="12" font-weight="bold" fill="#c0392b">● D15 — Скидання (RST)</text>
  <text x="50" y="236" font-size="12" fill="#1a1a1a">1: Скидання регістрів (POR)</text>
  <text x="50" y="254" font-size="12" fill="#1a1a1a">0: Нормальна робота (def)</text>
  <text x="50" y="272" font-size="12" fill="#6b7280">Автоматично скидається в 0</text>

  <text x="42" y="298" font-size="12" font-weight="bold" fill="#6b7280">● D14–D12 — Зарезервовано</text>
  <text x="50" y="316" font-size="12" fill="#1a1a1a">Фіксоване значення: 100b</text>
  <text x="50" y="334" font-size="12" fill="#1a1a1a">Завжди писати 100b</text>

  <rect x="40" y="354" width="201" height="118" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="48" y="372" font-size="12" font-weight="bold" fill="#c0392b">Особливість RST:</text>
  <text x="48" y="390" font-size="12" fill="#1a1a1a">Запис 1 викликає POR-</text>
  <text x="48" y="408" font-size="12" fill="#1a1a1a">скидання всіх регістрів</text>
  <text x="48" y="426" font-size="12" fill="#1a1a1a">до початкових значень.</text>
  <text x="48" y="444" font-size="12" fill="#6b7280">Самоочищується в 0.</text>

  <!-- Card 2: AVG -->
  <rect x="263" y="170" width="157" height="315" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="341" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">AVG [2:0] (D11–D9)</text>
  <text x="341" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Усереднення вибірок</text>

  <text x="271" y="228" font-size="12" fill="#1a1a1a">000 → 1</text>
  <text x="345" y="228" font-size="12" fill="#1a1a1a">100 → 128</text>
  <text x="271" y="244" font-size="12" fill="#1a1a1a">001 → 4</text>
  <text x="345" y="244" font-size="12" fill="#1a1a1a">101 → 256</text>
  <text x="271" y="260" font-size="12" fill="#1a1a1a">010 → 16</text>
  <text x="345" y="260" font-size="12" fill="#1a1a1a">110 → 512</text>
  <text x="271" y="276" font-size="12" fill="#1a1a1a">011 → 64</text>
  <text x="345" y="276" font-size="12" fill="#1a1a1a">111 → 1024</text>

  <rect x="271" y="294" width="141" height="178" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="277" y="312" font-size="12" font-weight="bold" fill="#2457d6">Вплив усереднення:</text>
  <text x="277" y="330" font-size="12" fill="#1a1a1a">• Знижує рівень шуму</text>
  <text x="277" y="348" font-size="12" fill="#1a1a1a">• Збільшує час T_sum</text>
  <text x="277" y="370" font-size="12" font-weight="bold" fill="#6b7280">Формула часу:</text>
  <text x="277" y="388" font-size="12" fill="#1a1a1a">T_sum = N × T_conv</text>
  <text x="277" y="410" font-size="12" fill="#6b7280">Default = 000 (N=1)</text>
  <text x="277" y="432" font-size="12" fill="#6b7280">Фільтрація 50/60 Гц</text>
  <text x="277" y="452" font-size="12" fill="#6b7280">при N ≥ 128 вибірок</text>

  <!-- Card 3: VBUSCT -->
  <rect x="432" y="170" width="157" height="315" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="510" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">VBUSCT [2:0] (D8–D6)</text>
  <text x="510" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Час конверсії VBUS</text>

  <text x="438" y="228" font-size="12" fill="#1a1a1a">000: 140µs</text>
  <text x="508" y="228" font-size="12" fill="#1a1a1a">100: 1.1ms</text>
  <text x="438" y="244" font-size="12" fill="#1a1a1a">001: 204µs</text>
  <text x="508" y="244" font-size="12" fill="#1a1a1a">101: 2.12ms</text>
  <text x="438" y="260" font-size="12" fill="#1a1a1a">010: 332µs</text>
  <text x="508" y="260" font-size="12" fill="#1a1a1a">110: 4.16ms</text>
  <text x="438" y="276" font-size="12" fill="#1a1a1a">011: 588µs</text>
  <text x="508" y="276" font-size="12" fill="#1a1a1a">111: 8.24ms</text>

  <rect x="440" y="294" width="141" height="178" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="446" y="312" font-size="12" font-weight="bold" fill="#27ae60">Канал напруги шини:</text>
  <text x="446" y="330" font-size="12" fill="#1a1a1a">• Вимірювання VBUS</text>
  <text x="446" y="348" font-size="12" fill="#1a1a1a">• Діапазон: 0–36 В</text>
  <text x="446" y="370" font-size="12" font-weight="bold" fill="#6b7280">Параметри АЦП:</text>
  <text x="446" y="388" font-size="12" fill="#1a1a1a">За замовч.: 1.1 ms</text>
  <text x="446" y="410" font-size="12" fill="#6b7280">Довший час = вища</text>
  <text x="446" y="428" font-size="12" fill="#6b7280">точність та менший</text>
  <text x="446" y="446" font-size="12" fill="#6b7280">рівень шуму АЦП</text>

  <!-- Card 4: VSHCT -->
  <rect x="601" y="170" width="157" height="315" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="680" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">VSHCT [2:0] (D5–D3)</text>
  <text x="680" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Час конверсії шунта</text>

  <text x="607" y="228" font-size="12" fill="#1a1a1a">000: 140µs</text>
  <text x="677" y="228" font-size="12" fill="#1a1a1a">100: 1.1ms</text>
  <text x="607" y="244" font-size="12" fill="#1a1a1a">001: 204µs</text>
  <text x="677" y="244" font-size="12" fill="#1a1a1a">101: 2.12ms</text>
  <text x="607" y="260" font-size="12" fill="#1a1a1a">010: 332µs</text>
  <text x="677" y="260" font-size="12" fill="#1a1a1a">110: 4.16ms</text>
  <text x="607" y="276" font-size="12" fill="#1a1a1a">011: 588µs</text>
  <text x="677" y="276" font-size="12" fill="#1a1a1a">111: 8.24ms</text>

  <rect x="609" y="294" width="141" height="178" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="615" y="312" font-size="12" font-weight="bold" fill="#2457d6">Канал шунта (струм):</text>
  <text x="615" y="330" font-size="12" fill="#1a1a1a">• Вимірює V_SHUNT</text>
  <text x="615" y="348" font-size="12" fill="#1a1a1a">• Діапазон ±81.92 mV</text>
  <text x="615" y="370" font-size="12" font-weight="bold" fill="#6b7280">Параметри АЦП:</text>
  <text x="615" y="388" font-size="12" fill="#1a1a1a">За замовч.: 1.1 ms</text>
  <text x="615" y="410" font-size="12" fill="#6b7280">Незалежно від VBUS</text>
  <text x="615" y="428" font-size="12" fill="#6b7280">задає точний час</text>
  <text x="615" y="446" font-size="12" fill="#6b7280">конверсії струму</text>

  <!-- Card 5: MODE -->
  <rect x="770" y="170" width="157" height="315" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="849" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">MODE [2:0] (D2–D0)</text>
  <text x="849" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Режим вимірювання</text>

  <text x="777" y="226" font-size="12" fill="#1a1a1a">000: Вимкнено</text>
  <text x="777" y="240" font-size="12" fill="#1a1a1a">001: Шунт (тригер)</text>
  <text x="777" y="254" font-size="12" fill="#1a1a1a">010: Шина (тригер)</text>
  <text x="777" y="268" font-size="12" fill="#1a1a1a">011: Всі (тригер)</text>
  <text x="777" y="282" font-size="12" fill="#1a1a1a">100: Вимкнено</text>
  <text x="777" y="296" font-size="12" fill="#1a1a1a">101: Шунт (постійно)</text>
  <text x="777" y="310" font-size="12" fill="#1a1a1a">110: Шина (постійно)</text>
  <text x="777" y="324" font-size="12" fill="#27ae60" font-weight="bold">111: Всі (постійно, def)</text>

  <rect x="777" y="336" width="141" height="136" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="783" y="354" font-size="12" font-weight="bold" fill="#27ae60">Режими роботи:</text>
  <text x="783" y="372" font-size="12" fill="#1a1a1a">• Trig: тригерний</text>
  <text x="783" y="390" font-size="12" fill="#1a1a1a">• Cont: безперервний</text>
  <text x="783" y="412" font-size="12" fill="#6b7280">111b: Безперервний</text>
  <text x="783" y="430" font-size="12" fill="#6b7280">моніторинг VBUS та</text>
  <text x="783" y="448" font-size="12" fill="#6b7280">струму (default)</text>
</svg>
