<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-right-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-left-gray" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма вимірювального циклу INA226</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Послідовна конверсія каналів V_SHUNT і V_BUS та апаратне усереднення N вибірок до оновлення даних</text>

  <!-- Main Diagram Container Panel -->
  <rect x="30" y="74" width="900" height="314" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Header for Signals Column -->
  <text x="45" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">Сигнали та канали</text>

  <!-- Left Channel Labels -->
  <!-- Channel 1: V_SHUNT -->
  <rect x="45" y="112" width="165" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="127.5" y="134" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Канал V_SHUNT</text>

  <!-- Channel 2: V_BUS -->
  <rect x="45" y="158" width="165" height="34" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="127.5" y="180" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">Канал V_BUS</text>

  <!-- Averager -->
  <rect x="45" y="218" width="165" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="127.5" y="240" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Усереднювач (AVG)</text>

  <!-- Registers & CVRF -->
  <rect x="45" y="264" width="165" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="127.5" y="286" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Регістри та CVRF</text>

  <!-- Vertical Divider Line -->
  <line x1="225" y1="82" x2="225" y2="378" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- TIMELINE AREA (X = 240 to 910) -->

  <!-- Top Sample Headers -->
  <text x="310" y="98" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вибірка 1</text>
  <text x="460" y="98" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вибірка 2</text>
  <text x="580" y="98" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">• • •</text>
  <text x="700" y="98" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вибірка N</text>
  <text x="840" y="98" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Цикл N+1</text>

  <!-- Row 1: V_SHUNT Conversions -->
  <line x1="310" y1="129" x2="390" y2="129" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="460" y1="129" x2="630" y2="129" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="700" y1="129" x2="770" y2="129" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Sample 1 V_SHUNT -->
  <rect x="240" y="112" width="70" height="34" rx="4" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="275" y="134" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T_SHUNT</text>

  <!-- Sample 2 V_SHUNT -->
  <rect x="390" y="112" width="70" height="34" rx="4" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="425" y="134" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T_SHUNT</text>

  <!-- Sample N V_SHUNT -->
  <rect x="630" y="112" width="70" height="34" rx="4" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="665" y="134" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T_SHUNT</text>

  <!-- Next Cycle Sample 1 V_SHUNT -->
  <rect x="770" y="112" width="70" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="805" y="134" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">T_SHUNT</text>

  <!-- Row 2: V_BUS Conversions -->
  <line x1="240" y1="175" x2="310" y2="175" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="380" y1="175" x2="460" y2="175" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="530" y1="175" x2="700" y2="175" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="770" y1="175" x2="840" y2="175" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Sample 1 V_BUS -->
  <rect x="310" y="158" width="70" height="34" rx="4" fill="#7c3aed" stroke="#6d28d9" stroke-width="1"/>
  <text x="345" y="180" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T_BUS</text>

  <!-- Sample 2 V_BUS -->
  <rect x="460" y="158" width="70" height="34" rx="4" fill="#7c3aed" stroke="#6d28d9" stroke-width="1"/>
  <text x="495" y="180" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T_BUS</text>

  <!-- Sample N V_BUS -->
  <rect x="700" y="158" width="70" height="34" rx="4" fill="#7c3aed" stroke="#6d28d9" stroke-width="1"/>
  <text x="735" y="180" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T_BUS</text>

  <!-- Next Cycle Sample 1 V_BUS -->
  <rect x="840" y="158" width="70" height="34" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="875" y="180" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">T_BUS</text>

  <!-- Sample 1 Dimension Bracket (T_sample) -->
  <line x1="240" y1="202" x2="380" y2="202" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-left-gray)" marker-end="url(#arr-right-gray)"/>
  <text x="310" y="198" font-size="12" fill="#4b5563" text-anchor="middle">T_sample</text>

  <!-- Row 3: Averager / Accumulator -->
  <rect x="240" y="218" width="140" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="310" y="240" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Вибірка 1 / N</text>

  <rect x="390" y="218" width="140" height="34" rx="4" fill="#d1fae5" stroke="#27ae60" stroke-width="1"/>
  <text x="460" y="240" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Вибірка 2 / N</text>

  <text x="580" y="240" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">• • •</text>

  <rect x="630" y="218" width="140" height="34" rx="4" fill="#a7f3d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="700" y="240" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Вибірка N / N</text>

  <rect x="770" y="218" width="140" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="840" y="240" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Вибірка 1 / N (нові)</text>

  <!-- Row 4: Registers Update & CVRF Flag -->
  <rect x="240" y="264" width="520" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="286" font-size="12" fill="#6b7280" text-anchor="middle">Регістри 01h–04h утримують попередні значення • CVRF = 0</text>

  <rect x="770" y="264" width="140" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="840" y="286" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Нові дані &amp; CVRF=1</text>

  <!-- Update Instant Badge at Top of Trigger Line -->
  <rect x="715" y="74" width="110" height="24" rx="4" fill="#c0392b"/>
  <text x="770" y="91" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ОНОВЛЕННЯ</text>

  <!-- Vertical Trigger Line at Update Instant (X = 770), starting BELOW badge (y=102) -->
  <line x1="770" y1="102" x2="770" y2="310" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Total Cycle Time (T_update) Badge & Dimension Arrow Line -->
  <rect x="360" y="312" width="290" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="329" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T_update = N × (T_SHUNT + T_BUS)</text>

  <!-- Bottom Bracket inside Main Panel: Total Cycle Time (T_update) Line below badge -->
  <line x1="240" y1="350" x2="770" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <line x1="240" y1="342" x2="240" y2="358" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="770" y1="342" x2="770" y2="358" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- BOTTOM CARDS (3 Columns) -->

  <!-- Card 1: ADC Conversion Timing -->
  <rect x="30" y="400" width="284" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="423" font-size="13" font-weight="bold" fill="#1d4ed8">1. Налаштування часу АЦП</text>
  <text x="45" y="447" font-size="12" fill="#1a1a1a">• T_SHUNT, T_BUS: 140 мкс … 8.244 мс</text>
  <text x="45" y="469" font-size="12" fill="#1a1a1a">• За замовчуванням: 1.1 мс (CT=100)</text>
  <text x="45" y="491" font-size="12" font-weight="bold" fill="#1d4ed8">• T_sample = T_SHUNT + T_BUS</text>

  <!-- Card 2: Averaging -->
  <rect x="338" y="400" width="284" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="353" y="423" font-size="13" font-weight="bold" fill="#15803d">2. Апаратне усереднення</text>
  <text x="353" y="447" font-size="12" fill="#1a1a1a">• Вибір N: 1, 4, 16, 64 ... 1024 вибірок</text>
  <text x="353" y="469" font-size="12" fill="#1a1a1a">• Знижує шуми вимірювання в √N разів</text>
  <text x="353" y="491" font-size="12" font-weight="bold" fill="#15803d">• Пригнічує перешкоди 50/60 Гц</text>

  <!-- Card 3: Update Period Calculation -->
  <rect x="646" y="400" width="284" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="661" y="423" font-size="13" font-weight="bold" fill="#b45309">3. Обчислення періоду T_update</text>
  <text x="661" y="447" font-size="12" fill="#1a1a1a">• CT = 1.1 мс, N = 16 (за замовч.)</text>
  <text x="661" y="469" font-size="12" font-weight="bold" fill="#1a1a1a">• T_update = 16 × (1.1 + 1.1) = 35.2 мс</text>
  <text x="661" y="491" font-size="12" font-weight="bold" fill="#b45309">• Оновлення даних та CVRF/ALERT</text>
</svg>
