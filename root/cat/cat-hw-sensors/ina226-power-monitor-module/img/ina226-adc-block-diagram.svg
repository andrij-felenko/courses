<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура монітора живлення INA226 та 16-бітного ΔΣ АЦП</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Вимірювальне коло VBUS (0…36 В) повністю незалежне від власного живлення VS (2.7…5.5 В)</text>

  <!-- ЗОВНІШНЯ СХЕМА (ЛІВОРУЧ) -->
  <!-- Шина живлення навантаження -->
  <path d="M 24 125 L 140 125" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="75" y="115" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шина V_IN (0…36 В)</text>

  <!-- Шунт R_SHUNT -->
  <rect x="70" y="165" width="40" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="179" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_shunt</text>
  <path d="M 90 125 L 90 165" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M 90 185 L 90 220" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Відводу до IN+ та IN- -->
  <circle cx="90" cy="145" r="3" fill="#2457d6"/>
  <path d="M 90 145 L 190 145" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="135" y="138" font-size="11" fill="#2457d6" text-anchor="middle">IN+</text>

  <circle cx="90" cy="205" r="3" fill="#2457d6"/>
  <path d="M 90 205 L 190 205" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="135" y="198" font-size="11" fill="#2457d6" text-anchor="middle">IN-</text>

  <!-- Відвід VBUS до V_IN -->
  <circle cx="90" cy="135" r="3" fill="#27ae60"/>
  <path d="M 90 135 L 45 135 L 45 300 L 190 300" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="110" y="293" font-size="11" fill="#27ae60" text-anchor="middle">VBUS (до 36 В)</text>

  <!-- Навантаження R_LOAD -->
  <rect x="70" y="240" width="40" height="25" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="90" y="256" font-size="11" fill="#6b7280" text-anchor="middle">R_load</text>
  <path d="M 90 220 L 90 240" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 90 265 L 90 280" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Символ Землі для навантаження -->
  <path d="M 75 280 L 105 280" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 80 284 L 100 284" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 85 288 L 95 288" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Джерело живлення чипа VS (2.7...5.5 В) -->
  <path d="M 24 400 L 190 400" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="100" y="393" font-size="11" fill="#1a1a1a" text-anchor="middle">V_S (2.7…5.5 В)</text>

  <!-- Земля чипа GND -->
  <path d="M 110 445 L 190 445" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="438" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- КОРПУС ІМС INA226 -->
  <rect x="190" y="75" width="746" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="563" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня функціональна схема ІМС INA226</text>

  <!-- БЛОК 1: Вхідні кола -->
  <rect x="206" y="112" width="220" height="380" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="316" y="131" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналоговий вхідний блок (AFE)</text>

  <!-- 1.1 Шунт-канал -->
  <rect x="218" y="142" width="196" height="100" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="316" y="161" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Канал напруги шунта</text>
  <text x="316" y="179" font-size="12" fill="#2457d6" text-anchor="middle">Входи: IN+, IN-</text>
  <text x="316" y="196" font-size="12" fill="#2457d6" text-anchor="middle">Шкала: ±81.92 мВ</text>
  <text x="316" y="213" font-size="12" fill="#6b7280" text-anchor="middle">Роздільність: 2.5 мкВ</text>
  <text x="316" y="230" font-size="11" fill="#6b7280" text-anchor="middle">Підсилювач PGA (16-біт)</text>

  <!-- 1.2 Шина-канал (АКЦЕНТ НА НЕЗАЛЕЖНІСТЬ) -->
  <rect x="218" y="254" width="196" height="110" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="316" y="273" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Канал напруги шини</text>
  <text x="316" y="291" font-size="12" fill="#27ae60" text-anchor="middle">Вхід: VBUS (до 36 В)</text>
  <text x="316" y="308" font-size="12" fill="#27ae60" text-anchor="middle">Роздільність: 1.25 мВ</text>
  <text x="316" y="325" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Незалежний дільник напруги</text>
  <text x="316" y="341" font-size="11" fill="#1a1a1a" text-anchor="middle">Автономна робота від V_IN</text>

  <!-- 1.3 Власне живлення VS -->
  <rect x="218" y="376" width="196" height="100" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="316" y="395" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Власне живлення V_S</text>
  <text x="316" y="413" font-size="12" fill="#1a1a1a" text-anchor="middle">Живлення чипа: 2.7…5.5 В</text>
  <text x="316" y="430" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішній V_REF (1.25 В)</text>
  <text x="316" y="447" font-size="11" fill="#6b7280" text-anchor="middle">Схема скидання POR</text>

  <!-- Зв'язки AFE -> АЦП -->
  <path d="M 414 192 L 454 192" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 414 309 L 454 220" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- БЛОК 2: АЦП та Обчислювач -->
  <rect x="442" y="112" width="240" height="380" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="562" y="131" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">16-бітний ΔΣ АЦП та Math-ядро</text>

  <!-- 2.1 ΔΣ АЦП -->
  <rect x="454" y="142" width="216" height="116" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="562" y="161" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплексор та ΔΣ АЦП</text>
  <text x="562" y="179" font-size="12" fill="#2457d6" text-anchor="middle">16-бітне оцифрування</text>
  <text x="562" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Час: 140 мкс … 8.244 мс</text>
  <text x="562" y="213" font-size="12" fill="#6b7280" text-anchor="middle">Усереднення: 1…1024 проб</text>
  <text x="562" y="230" font-size="11" fill="#6b7280" text-anchor="middle">Цифровий фільтр шумів</text>

  <!-- 2.2 Math-ядро -->
  <rect x="454" y="270" width="216" height="206" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="562" y="289" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний обчислювач</text>
  <text x="562" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Калібрувальний регістр CAL</text>
  <text x="562" y="326" font-size="11" fill="#6b7280" text-anchor="middle">Математика обчислення:</text>

  <rect x="464" y="335" width="196" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="562" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I = (V_SHUNT × CAL) / 2048</text>
  <text x="562" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">P = (I × V_BUS) / 20000</text>

  <text x="562" y="415" font-size="11" fill="#27ae60" text-anchor="middle">Прямий розрахунок I та P</text>
  <text x="562" y="432" font-size="11" fill="#27ae60" text-anchor="middle">у фізичних одиницях (А, Вт)</text>
  <text x="562" y="449" font-size="11" fill="#6b7280" text-anchor="middle">без навантаження MCU</text>

  <!-- Зв'язок АЦП -> Math -> Регістри -->
  <path d="M 562 258 L 562 270" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 670 200 L 710 200" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 670 373 L 710 240" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- БЛОК 3: Регістри та I2C/ALERT -->
  <rect x="698" y="112" width="224" height="380" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="131" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістри даних та I2C / ALERT</text>

  <!-- 3.1 Карта регістрів -->
  <rect x="710" y="142" width="200" height="140" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="159" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок регістрів (16-біт):</text>
  <text x="720" y="177" font-size="11" fill="#6b7280">• Config (00h) — режими та час</text>
  <text x="720" y="193" font-size="11" fill="#6b7280">• V_SHUNT (01h) — напруга шунта</text>
  <text x="720" y="209" font-size="11" fill="#6b7280">• V_BUS (02h) — напруга шини</text>
  <text x="720" y="225" font-size="11" font-weight="bold" fill="#2457d6">• Power (03h) — потужність</text>
  <text x="720" y="241" font-size="11" font-weight="bold" fill="#2457d6">• Current (04h) — струм</text>
  <text x="720" y="257" font-size="11" font-weight="bold" fill="#2457d6">• Calibration (05h) — CAL</text>

  <!-- 3.2 I2C та ALERT -->
  <rect x="710" y="294" width="200" height="182" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="313" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2C / SMBus Інтерфейс</text>
  <text x="810" y="331" font-size="12" fill="#2457d6" text-anchor="middle">Виводи A0, A1</text>
  <text x="810" y="347" font-size="11" fill="#6b7280" text-anchor="middle">(16 унікальних I2C-адрес)</text>
  <text x="810" y="365" font-size="12" fill="#1a1a1a" text-anchor="middle">Лінії: SDA, SCL</text>

  <rect x="720" y="378" width="180" height="84" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="810" y="396" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихід ALERT (Warning)</text>
  <text x="810" y="413" font-size="11" fill="#c0392b" text-anchor="middle">Апаратне сповіщення</text>
  <text x="810" y="429" font-size="11" fill="#1a1a1a" text-anchor="middle">Перевищення меж I / V / P</text>
  <text x="810" y="445" font-size="11" fill="#6b7280" text-anchor="middle">відкритий колектор</text>

  <!-- Вихідні стрілки I2C та ALERT праворуч -->
  <path d="M 910 365 L 945 365" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="930" y="357" font-size="11" fill="#2457d6" text-anchor="middle">SDA/SCL</text>

  <path d="M 910 405 L 945 405" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="930" y="397" font-size="11" fill="#c0392b" text-anchor="middle">ALERT</text>
</svg>
