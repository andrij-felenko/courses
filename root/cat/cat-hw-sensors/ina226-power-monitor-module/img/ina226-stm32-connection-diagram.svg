<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення модуля INA226 та OLED-дисплея до STM32</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Струмовий шунт R_shunt у силовому колі, вимірювання VBUS, шина I2C із підтяжкою та EXTI-сигнал ALERT</text>

  <!-- BLOCK 1: POWER CIRCUIT -->
  <rect x="25" y="85" width="180" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="115" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СИЛОВЕ КОЛО</text>
  <text x="115" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Джерело та навантаження</text>

  <!-- V_IN Source Box -->
  <rect x="38" y="145" width="154" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="115" y="170" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело V_IN</text>
  <text x="115" y="190" font-size="12" fill="#6b7280" text-anchor="middle">0...36 В DC</text>
  <circle cx="180" cy="160" r="4" fill="#c0392b"/>
  <circle cx="180" cy="190" r="4" fill="#1a1a1a"/>

  <!-- Shunt Resistor Box -->
  <rect x="48" y="235" width="134" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="115" y="258" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Шунт R_shunt</text>
  <text x="115" y="278" font-size="12" fill="#1a1a1a" text-anchor="middle">0.1 Ом / 2 Вт</text>
  <!-- Shunt graphic symbol -->
  <rect x="75" y="285" width="80" height="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Load Box -->
  <rect x="38" y="340" width="154" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="115" y="367" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Навантаження</text>
  <text x="115" y="387" font-size="12" fill="#6b7280" text-anchor="middle">R_load (споживач)</text>
  <circle cx="180" cy="355" r="4" fill="#1a1a1a"/>

  <!-- Ground Symbol & Junction -->
  <line x1="115" y1="405" x2="115" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="190" x2="195" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="195" y1="190" x2="195" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="115" y1="450" x2="235" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="115" cy="450" r="3.5" fill="#1a1a1a"/>
  <circle cx="195" cy="450" r="3.5" fill="#1a1a1a"/>

  <!-- Main Power Connections in Block 1 -->
  <!-- V_IN+ to Shunt top -->
  <line x1="180" y1="160" x2="202" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="202" y1="160" x2="202" y2="225" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="202" y1="225" x2="115" y2="225" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="115" y1="225" x2="115" y2="235" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="202" cy="160" r="3.5" fill="#c0392b"/>
  <circle cx="115" cy="225" r="3.5" fill="#c0392b"/>

  <!-- Shunt bottom to Load input -->
  <line x1="115" y1="305" x2="115" y2="318" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="115" y1="318" x2="202" y2="318" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="202" y1="318" x2="202" y2="355" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="202" y1="355" x2="180" y2="355" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="115" cy="318" r="3.5" fill="#1a1a1a"/>
  <circle cx="202" cy="355" r="3.5" fill="#1a1a1a"/>


  <!-- BLOCK 2: INA226 MODULE -->
  <rect x="235" y="85" width="180" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="325" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МОДУЛЬ INA226</text>
  <text x="325" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Монітор струму і напруги</text>

  <!-- INA226 PCB Board -->
  <rect x="250" y="140" width="150" height="330" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="325" y="158" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">INA226 (I2C Sensor)</text>

  <!-- Left Pins of INA226 (Sensing Inputs) -->
  <text x="260" y="174" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VBUS</text>
  <text x="260" y="204" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="start">IN+</text>
  <text x="260" y="234" font-size="12" font-weight="bold" fill="#d35400" text-anchor="start">IN-</text>
  <text x="260" y="384" font-size="12" fill="#6b7280" text-anchor="start">A0, A1</text>
  <text x="260" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Right Pins of INA226 (Outputs / Interface) -->
  <text x="390" y="174" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>
  <text x="390" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SCL</text>
  <text x="390" y="294" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SDA</text>
  <text x="390" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">ALERT</text>
  <text x="390" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Address A0, A1 internal GND trace representation -->
  <line x1="315" y1="380" x2="315" y2="450" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="315" cy="450" r="3" fill="#6b7280"/>


  <!-- WIRES BETWEEN BLOCK 1 (POWER) AND BLOCK 2 (INA226) -->
  <!-- VBUS Wire: V_IN+ node (202, 160) to INA226 VBUS pin (250, 170) -->
  <line x1="202" y1="160" x2="222" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="222" y1="160" x2="222" y2="170" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="222" y1="170" x2="250" y2="170" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="212" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VBUS</text>

  <!-- IN+ Wire: Shunt high side (115, 225) to INA226 IN+ pin (250, 200) -->
  <line x1="115" y1="225" x2="215" y2="225" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="215" y1="225" x2="215" y2="200" stroke="#e67e22" stroke-width="1.5"/>
  <line x1="215" y1="200" x2="250" y2="200" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="212" y="192" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="middle">IN+</text>

  <!-- IN- Wire: Shunt low side (202, 318) to INA226 IN- pin (250, 230) -->
  <line x1="202" y1="318" x2="225" y2="318" stroke="#d35400" stroke-width="1.5"/>
  <line x1="225" y1="318" x2="225" y2="230" stroke="#d35400" stroke-width="1.5"/>
  <line x1="225" y1="230" x2="250" y2="230" stroke="#d35400" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="237" y="222" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">IN-</text>

  <!-- Power GND to INA226 GND -->
  <line x1="235" y1="450" x2="250" y2="450" stroke="#1a1a1a" stroke-width="2"/>


  <!-- INTER-BLOCK CHANNEL (BLOCK 2 TO BLOCK 3): PULL-UP RESISTORS & WIRES -->
  <!-- 3.3V Rail Wire: INA226 VCC (400, 170) to STM32 3V3 (550, 170) -->
  <line x1="400" y1="170" x2="550" y2="170" stroke="#c0392b" stroke-width="2"/>
  <text x="440" y="162" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3 В</text>

  <!-- SCL Line: INA226 SCL (400, 230) to STM32 PB6 (550, 230) -->
  <line x1="400" y1="230" x2="550" y2="230" stroke="#2457d6" stroke-width="2"/>
  <text x="430" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SCL</text>

  <!-- SDA Line: INA226 SDA (400, 290) to STM32 PB7 (550, 290) -->
  <line x1="400" y1="290" x2="550" y2="290" stroke="#2457d6" stroke-width="2"/>
  <text x="430" y="282" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SDA</text>

  <!-- ALERT Line: INA226 ALERT (400, 360) to STM32 PB0 (550, 360) -->
  <line x1="400" y1="360" x2="550" y2="360" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="430" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ALERT</text>

  <!-- GND Wire: INA226 GND (400, 450) to STM32 GND (550, 450) -->
  <line x1="400" y1="450" x2="550" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- PULL-UP RESISTORS IN CHANNEL (x=475, w=14) -->
  <text x="482" y="148" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Підтяжка R_p</text>

  <!-- SCL Pull-up Rp1 -->
  <line x1="482" y1="170" x2="482" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="475" y="185" width="14" height="28" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="482" y1="213" x2="482" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="482" cy="170" r="3.5" fill="#c0392b"/>
  <circle cx="482" cy="230" r="3.5" fill="#2457d6"/>
  <text x="495" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">4.7 кОм</text>

  <!-- SDA Pull-up Rp2 -->
  <line x1="482" y1="230" x2="482" y2="245" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="475" y="245" width="14" height="28" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="482" y1="273" x2="482" y2="290" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="482" cy="290" r="3.5" fill="#2457d6"/>
  <text x="495" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">4.7 кОм</text>

  <!-- ALERT Pull-up Rp3 (Open-Drain to 3.3V) -->
  <line x1="482" y1="290" x2="482" y2="315" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="475" y="315" width="14" height="28" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="482" y1="343" x2="482" y2="360" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="482" cy="360" r="3.5" fill="#27ae60"/>
  <text x="495" y="332" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">10 кОм</text>


  <!-- BLOCK 3: STM32 MCU -->
  <rect x="535" y="85" width="190" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="630" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">STM32 (MCU)</text>
  <text x="630" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Обробка та керування</text>

  <!-- STM32 PCB Board -->
  <rect x="550" y="140" width="160" height="330" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="630" y="158" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">STM32F4 / G4</text>

  <!-- Left Pins of STM32 -->
  <text x="560" y="174" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">3V3</text>
  <text x="560" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">PB6 (SCL)</text>
  <text x="560" y="294" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">PB7 (SDA)</text>
  <text x="560" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">PB0 (EXTI)</text>
  <text x="560" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Right Pins of STM32 (Bus Pass-through to OLED) -->
  <text x="700" y="174" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">3V3</text>
  <text x="700" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SCL</text>
  <text x="700" y="294" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SDA</text>
  <text x="700" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Microcontroller Chip Representation -->
  <rect x="600" y="388" width="60" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="630" y="415" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU</text>


  <!-- WIRES BETWEEN BLOCK 3 (STM32) AND BLOCK 4 (OLED) -->
  <line x1="710" y1="170" x2="780" y2="170" stroke="#c0392b" stroke-width="2"/>
  <line x1="710" y1="230" x2="780" y2="230" stroke="#2457d6" stroke-width="2"/>
  <line x1="710" y1="290" x2="780" y2="290" stroke="#2457d6" stroke-width="2"/>
  <line x1="710" y1="450" x2="780" y2="450" stroke="#1a1a1a" stroke-width="2"/>

  <text x="745" y="162" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3 В</text>
  <text x="745" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SCL</text>
  <text x="745" y="282" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SDA</text>
  <text x="745" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>


  <!-- BLOCK 4: OLED DISPLAY -->
  <rect x="765" y="85" width="170" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="850" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">OLED-ДИСПЛЕЙ</text>
  <text x="850" y="128" font-size="12" fill="#6b7280" text-anchor="middle">SSD1306 (0.96")</text>

  <!-- OLED PCB Board -->
  <rect x="780" y="140" width="140" height="330" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="850" y="158" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">OLED SSD1306</text>

  <!-- Left Pins of OLED Board -->
  <text x="790" y="174" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VCC</text>
  <text x="790" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SCL</text>
  <text x="790" y="294" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SDA</text>
  <text x="790" y="454" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- OLED Screen Area Graphic -->
  <rect x="792" y="325" width="116" height="110" fill="#1a1a1a" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="850" y="343" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">POWER MONITOR</text>
  <line x1="802" y1="348" x2="898" y2="348" stroke="#6b7280" stroke-width="1"/>
  <text x="805" y="366" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">V: 12.04 V</text>
  <text x="805" y="386" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">I:  1.48 A</text>
  <text x="805" y="406" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="start">P: 17.82 W</text>
  <text x="805" y="424" font-size="12" fill="#27ae60" text-anchor="start">ALERT: NORMAL</text>

</svg>
