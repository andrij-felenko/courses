<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Алгоритм калібрування та обчислення ppm у прошивці мікроконтролера
  </text>

  <!-- Блок-схема конвеєра -->
  <g transform="translate(60, 95)">
    <!-- Крок 1: Burn-in та прогрів -->
    <rect x="0" y="30" width="130" height="75" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="65" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f0883e">1. Розпал</text>
    <text x="65" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Прогрів 60..120 с</text>

    <!-- Стрілка 1 -->
    <path d="M 130,68 L 160,68" stroke="#8b949e" stroke-width="2"/>

    <!-- Крок 2: Відлік в опір Rs -->
    <rect x="160" y="30" width="130" height="75" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="225" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">2. Опір Rs</text>
    <text x="225" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">RL*(MAX-raw)/raw</text>

    <!-- Стрілка 2 -->
    <path d="M 290,68 L 320,68" stroke="#8b949e" stroke-width="2"/>

    <!-- Крок 3: Опорний нуль R0 -->
    <rect x="320" y="30" width="130" height="75" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="385" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">3. Опорна R0</text>
    <text x="385" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">Чисте повітря / 9.83</text>

    <!-- Стрілка 3 -->
    <path d="M 450,68 L 480,68" stroke="#8b949e" stroke-width="2"/>

    <!-- Крок 4: Степенева модель ppm -->
    <rect x="480" y="30" width="130" height="75" rx="8" fill="#21262d" stroke="#bc8cff" stroke-width="2"/>
    <text x="545" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#bc8cff">4. Степенева ppm</text>
    <text x="545" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">ppm = a*(Rs/R0)^b</text>

    <!-- Стрілка 4 -->
    <path d="M 610,68 L 640,68" stroke="#8b949e" stroke-width="2"/>

    <!-- Крок 5: Сторож порогу / Тривога -->
    <rect x="640" y="30" width="90" height="75" rx="8" fill="#1b4721" stroke="#3fb950" stroke-width="2"/>
    <text x="685" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Тривога</text>
    <text x="685" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f0f6fc">ppm &gt; Поріг</text>
  </g>

  <!-- Нижня інформаційна панель -->
  <g transform="translate(60, 220)">
    <rect width="730" height="200" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="365" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f0f6fc">
      Ключові константи перетворення для MQ-2
    </text>

    <g transform="translate(30, 55)">
      <rect width="205" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="102" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">Зріджений газ (LPG)</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• a = 574.25</text>
      <text x="10" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• b = -2.222</text>
      <text x="10" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• ppm = 574.25 * (Rs/R0)^-2.22</text>
    </g>

    <g transform="translate(260, 55)">
      <rect width="205" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="102" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Метан (CH4)</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• a = 1138.53</text>
      <text x="10" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• b = -2.77</text>
      <text x="10" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Висока крутизна кривої</text>
    </g>

    <g transform="translate(490, 55)">
      <rect width="205" height="120" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="102" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d29922">Дим / Горіння</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• a = 3630.0</text>
      <text x="10" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• b = -3.20</text>
      <text x="10" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Чутливий до аерозолів</text>
    </g>
  </g>
</svg>