<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Принципова схема модуля Keyes K869051 на базі LM393
  </text>

  <!-- Схема плати -->
  <g transform="translate(60, 85)">
    <rect width="730" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Шина VCC (+5V) -->
    <line x1="40" y1="40" x2="680" y2="40" stroke="#f85149" stroke-width="3"/>
    <text x="690" y="45" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f85149">VCC (+5V)</text>

    <!-- Шина GND -->
    <line x1="40" y1="300" x2="680" y2="300" stroke="#8b949e" stroke-width="3"/>
    <text x="690" y="305" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#8b949e">GND (0V)</text>

    <!-- Нагрівач сенсора (Heater H-H) -->
    <g transform="translate(60, 40)">
      <rect x="15" y="30" width="30" height="200" rx="4" fill="#161b22" stroke="#f0883e" stroke-dasharray="4,2"/>
      <text x="30" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f0883e">Нагрівач H</text>
      <!-- Спіраль 31 Ом -->
      <path d="M 30,40 L 30,70 L 22,80 L 38,90 L 22,100 L 38,110 L 22,120 L 38,130 L 30,140 L 30,260" fill="none" stroke="#f0883e" stroke-width="2"/>
      <text x="50" y="105" font-family="system-ui, sans-serif" font-size="10" fill="#f0883e">31 Ом (150 мА)</text>
    </g>

    <!-- Чутливий напівпровідник SnO2 (A-B) + Резистор RL -->
    <g transform="translate(180, 40)">
      <text x="30" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">Сенсор SnO2</text>
      <!-- Сенсорний шар Rs -->
      <line x1="30" y1="0" x2="30" y2="40" stroke="#f85149" stroke-width="2"/>
      <rect x="15" y="40" width="30" height="45" rx="3" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
      <text x="30" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#79c0ff">Rs</text>

      <!-- Вузол AO -->
      <line x1="30" y1="85" x2="30" y2="150" stroke="#3fb950" stroke-width="2"/>
      <circle cx="30" cy="115" r="5" fill="#3fb950"/>
      <line x1="30" y1="115" x2="160" y2="115" stroke="#3fb950" stroke-width="3"/>
      <circle cx="160" cy="115" r="5" fill="#3fb950"/>
      <text x="165" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">AO (Analog Out)</text>

      <!-- Навантажувальний резистор RL -->
      <rect x="20" y="150" width="20" height="40" fill="#d29922"/>
      <text x="50" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">RL (10–20k)</text>
      <line x1="30" y1="190" x2="30" y2="260" stroke="#8b949e" stroke-width="2"/>
    </g>

    <!-- Потенціометр регулювання порогу (Threshold Pot) -->
    <g transform="translate(360, 40)">
      <text x="30" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#d29922">Поріг 10k</text>
      <line x1="30" y1="0" x2="30" y2="50" stroke="#f85149" stroke-width="2"/>
      <rect x="20" y="50" width="20" height="70" fill="#21262d" stroke="#d29922"/>
      <!-- Повзунок -->
      <line x1="30" y1="85" x2="80" y2="85" stroke="#d29922" stroke-width="2"/>
      <polygon points="40,85 30,80 30,90" fill="#d29922"/>
      <line x1="30" y1="120" x2="30" y2="260" stroke="#8b949e" stroke-width="2"/>
      <text x="90" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#d29922">V_ref</text>
    </g>

    <!-- Компаратор LM393 -->
    <g transform="translate(480, 100)">
      <polygon points="0,0 80,45 0,90" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
      <text x="25" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#bc8cff">LM393</text>
      <!-- Входи -->
      <line x1="-140" y1="55" x2="0" y2="55" stroke="#3fb950" stroke-width="2"/>
      <text x="-15" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950">+</text>
      <line x1="-40" y1="25" x2="0" y2="25" stroke="#d29922" stroke-width="2"/>
      <text x="-15" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#d29922">−</text>

      <!-- Вихід DO (Digital Out) -->
      <line x1="80" y1="45" x2="160" y2="45" stroke="#58a6ff" stroke-width="3"/>
      <circle cx="160" cy="45" r="5" fill="#58a6ff"/>
      <text x="165" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">DO (Digital Out)</text>

      <!-- Світлодіод спрацьовування порогу LED_D0 -->
      <g transform="translate(100, 75)">
        <polygon points="10,0 25,0 17,15" fill="#3fb950"/>
        <line x1="10" y1="15" x2="25" y2="15" stroke="#3fb950" stroke-width="2"/>
        <text x="35" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950">LED DO</text>
      </g>
    </g>
  </g>
</svg>