<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .panel-sub { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
      .lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: #f8fafc; }
      .lbl-bold { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .lbl-dim { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl-code { font-family: monospace, monospace; font-size: 12px; fill: #38bdf8; }
      
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .wire-sin { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .wire-cos { stroke: #fbbf24; stroke-width: 2.5; fill: none; }
      .resistor { fill: #1e293b; stroke: #cbd5e1; stroke-width: 1.5; }
      .dot { fill: #38bdf8; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #334155; stroke-dasharray: 4,4; stroke-width: 1; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title Block -->
  <text x="30" y="38" class="title">Квадратурні мости Вітстона та формування сигналів</text>
  <text x="30" y="60" class="subtitle">Топологія ортогональних мостових схем для обчислення кута через функцію atan2(V_sin, V_cos)</text>

  <!-- Left: Bridge Schematics (Cosine Bridge & Sine Bridge) -->
  <g transform="translate(30, 80)">
    <rect width="440" height="430" class="panel" />
    <text x="20" y="28" class="h2">1. Схема двох просторово зсунутих мостів</text>

    <!-- Top Bridge: Cosine Bridge -->
    <g transform="translate(50, 45)">
      <text x="90" y="15" class="lbl-bold" fill="#fbbf24">Міст Косинуса (V_cos)</text>
      <!-- Diamond Bridge -->
      <!-- Top node: Vcc -->
      <line x1="90" y1="30" x2="30" y2="80" class="wire" />
      <line x1="90" y1="30" x2="150" y2="80" class="wire" />
      <!-- Bottom node: GND -->
      <line x1="30" y1="110" x2="90" y2="160" class="wire" />
      <line x1="150" y1="110" x2="90" y2="160" class="wire" />

      <!-- Resistors -->
      <!-- R1 (R0 + dR) -->
      <rect x="45" y="45" width="20" height="28" class="resistor" transform="rotate(-40 55 59)" />
      <text x="25" y="45" class="lbl-dim">R1 (+ΔR)</text>
      <!-- R2 (R0 - dR) -->
      <rect x="115" y="45" width="20" height="28" class="resistor" transform="rotate(40 125 59)" />
      <text x="135" y="45" class="lbl-dim">R2 (-ΔR)</text>
      <!-- R3 (R0 - dR) -->
      <rect x="45" y="115" width="20" height="28" class="resistor" transform="rotate(40 55 129)" />
      <text x="25" y="145" class="lbl-dim">R3 (-ΔR)</text>
      <!-- R4 (R0 + dR) -->
      <rect x="115" y="115" width="20" height="28" class="resistor" transform="rotate(-40 125 129)" />
      <text x="135" y="145" class="lbl-dim">R4 (+ΔR)</text>

      <!-- Nodes -->
      <circle cx="90" cy="30" r="4" fill="#f8fafc" />
      <text x="90" y="24" class="lbl-bold" text-anchor="middle" fill="#4ade80">V_cc</text>
      <circle cx="90" cy="160" r="4" fill="#f8fafc" />
      <text x="90" y="175" class="lbl-bold" text-anchor="middle" fill="#94a3b8">GND</text>

      <!-- Diff output taps -->
      <circle cx="30" cy="95" r="4" fill="#fbbf24" />
      <circle cx="150" cy="95" r="4" fill="#fbbf24" />
      <line x1="30" y1="95" x2="10" y2="95" class="wire-cos" />
      <line x1="150" y1="95" x2="220" y2="95" class="wire-cos" />
      <text x="230" y="99" class="lbl-bold" fill="#fbbf24">V_cos = V+ - V-</text>
    </g>

    <!-- Bottom Bridge: Sine Bridge -->
    <g transform="translate(50, 240)">
      <text x="90" y="15" class="lbl-bold" fill="#38bdf8">Міст Синуса (V_sin)</text>
      <!-- Diamond Bridge -->
      <line x1="90" y1="30" x2="30" y2="80" class="wire" />
      <line x1="90" y1="30" x2="150" y2="80" class="wire" />
      <line x1="30" y1="110" x2="90" y2="160" class="wire" />
      <line x1="150" y1="110" x2="90" y2="160" class="wire" />

      <!-- Resistors -->
      <rect x="45" y="45" width="20" height="28" class="resistor" transform="rotate(-40 55 59)" />
      <text x="25" y="45" class="lbl-dim">R5 (+ΔR)</text>
      <rect x="115" y="45" width="20" height="28" class="resistor" transform="rotate(40 125 59)" />
      <text x="135" y="45" class="lbl-dim">R6 (-ΔR)</text>
      <rect x="45" y="115" width="20" height="28" class="resistor" transform="rotate(40 55 129)" />
      <text x="25" y="145" class="lbl-dim">R7 (-ΔR)</text>
      <rect x="115" y="115" width="20" height="28" class="resistor" transform="rotate(-40 125 129)" />
      <text x="135" y="145" class="lbl-dim">R8 (+ΔR)</text>

      <circle cx="90" cy="30" r="4" fill="#f8fafc" />
      <text x="90" y="24" class="lbl-bold" text-anchor="middle" fill="#4ade80">V_cc</text>
      <circle cx="90" cy="160" r="4" fill="#f8fafc" />
      <text x="90" y="175" class="lbl-bold" text-anchor="middle" fill="#94a3b8">GND</text>

      <circle cx="30" cy="95" r="4" fill="#38bdf8" />
      <circle cx="150" cy="95" r="4" fill="#38bdf8" />
      <line x1="30" y1="95" x2="10" y2="95" class="wire-sin" />
      <line x1="150" y1="95" x2="220" y2="95" class="wire-sin" />
      <text x="230" y="99" class="lbl-bold" fill="#38bdf8">V_sin = V+ - V-</text>
    </g>
  </g>

  <!-- Right: Quadrature Waveforms & Angle Calculation -->
  <g transform="translate(490, 80)">
    <rect width="400" height="430" class="panel" />
    <text x="20" y="28" class="h2">2. Квадратурні сигнали та atan2</text>

    <!-- Waveforms Graph -->
    <g transform="translate(25, 45)">
      <!-- Axes -->
      <line x1="35" y1="90" x2="350" y2="90" class="axis" />
      <line x1="35" y1="15" x2="35" y2="165" class="axis" />
      <text x="355" y="94" class="lbl-dim">θ</text>
      <text x="20" y="15" class="lbl-dim">V</text>

      <!-- Zero, Peak levels -->
      <line x1="35" y1="30" x2="350" y2="30" class="grid" />
      <line x1="35" y1="150" x2="350" y2="150" class="grid" />
      <text x="28" y="34" class="lbl-dim" text-anchor="end">+V_0</text>
      <text x="28" y="94" class="lbl-dim" text-anchor="end">0</text>
      <text x="28" y="154" class="lbl-dim" text-anchor="end">-V_0</text>

      <!-- Grid vertical (0, 90, 180, 270, 360) -->
      <line x1="110" y1="20" x2="110" y2="165" class="grid" />
      <line x1="185" y1="20" x2="185" y2="165" class="grid" />
      <line x1="260" y1="20" x2="260" y2="165" class="grid" />
      <line x1="335" y1="20" x2="335" y2="165" class="grid" />

      <text x="35" y="180" class="lbl-dim" text-anchor="middle">0°</text>
      <text x="110" y="180" class="lbl-dim" text-anchor="middle">90°</text>
      <text x="185" y="180" class="lbl-dim" text-anchor="middle">180°</text>
      <text x="260" y="180" class="lbl-dim" text-anchor="middle">270°</text>
      <text x="335" y="180" class="lbl-dim" text-anchor="middle">360°</text>

      <!-- V_cos: starts at +V0 (y=30), 0 at 90° (y=90), -V0 at 180° (y=150), 0 at 270° (y=90), +V0 at 360° (y=30) -->
      <path d="M 35 30 Q 72.5 30 110 90 T 185 150 Q 222.5 150 260 90 T 335 30" fill="none" stroke="#fbbf24" stroke-width="2.5" />

      <!-- V_sin: starts at 0 (y=90), +V0 at 90° (y=30), 0 at 180° (y=90), -V0 at 270° (y=150), 0 at 360° (y=90) -->
      <path d="M 35 90 Q 72.5 30 110 30 T 185 90 Q 222.5 150 260 150 T 335 90" fill="none" stroke="#38bdf8" stroke-width="2.5" />

      <!-- Legend -->
      <line x1="70" y1="5" x2="95" y2="5" stroke="#fbbf24" stroke-width="2.5" />
      <text x="100" y="9" class="lbl-bold" fill="#fbbf24">V_cos (Косинус)</text>
      <line x1="210" y1="5" x2="235" y2="5" stroke="#38bdf8" stroke-width="2.5" />
      <text x="240" y="9" class="lbl-bold" fill="#38bdf8">V_sin (Синус)</text>
    </g>

    <!-- Mathematical summary -->
    <rect x="20" y="245" width="360" height="165" class="panel-sub" />
    <text x="30" y="268" class="lbl-bold" fill="#38bdf8">Розрахунок кута повороту вала:</text>
    <text x="30" y="292" class="lbl-code">θ = atan2(V_sin, V_cos)</text>
    <text x="30" y="318" class="lbl">1. <tspan fill="#4ade80">Інваріантність до амплітуди:</tspan> Зміна зазору вала або послаблення магніту пропорційно змінює V_0 в обох каналах — відношення не змінюється!</text>
    <text x="30" y="358" class="lbl">2. <tspan fill="#fbbf24">Однозначність 360°:</tspan> Знаки V_sin і V_cos точно вказують поточний квадрант I–IV.</text>
    <text x="30" y="390" class="lbl">3. <tspan fill="#f43f5e">Компенсація синфазного дрейфу:</tspan> Повний міст Вітстона усуває температурний дрейф R_0.</text>
  </g>
</svg>