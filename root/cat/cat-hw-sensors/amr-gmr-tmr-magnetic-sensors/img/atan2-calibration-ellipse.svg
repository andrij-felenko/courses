<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .panel-sub { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
      .lbl { font-family: system-ui, sans-serif; font-size: 12px; fill: #f8fafc; }
      .lbl-bold { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .lbl-dim { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .lbl-code { font-family: monospace, monospace; font-size: 11px; fill: #38bdf8; }
      
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #334155; stroke-dasharray: 4,4; stroke-width: 1; }
      .curve-uncal { fill: none; stroke: #f43f5e; stroke-width: 3; }
      .curve-cal { fill: none; stroke: #4ade80; stroke-width: 3; }
      .arrow { stroke-width: 2; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title Block -->
  <text x="30" y="38" class="title">Калібрування квадратурних сигналів на площині Лісажу</text>
  <text x="30" y="60" class="subtitle">Усунення асиметрії мостів: зсуву нуля (офсету), амплітудного дисбалансу та неортогональності фаз</text>

  <!-- Left: Uncalibrated Lissajous Ellipse -->
  <g transform="translate(30, 80)">
    <rect width="415" height="300" class="panel" />
    <text x="20" y="28" class="h2">1. Реальний сигнал: Спотворений еліпс</text>

    <g transform="translate(205, 155)">
      <!-- Axes (Origin 0,0) -->
      <line x1="-150" y1="0" x2="150" y2="0" class="axis" />
      <line x1="0" y1="-110" x2="0" y2="110" class="axis" />
      <text x="155" y="4" class="lbl-dim">V_cos</text>
      <text x="4" y="-105" class="lbl-dim">V_sin</text>
      <circle cx="0" cy="0" r="3" fill="#64748b" />
      <text x="-15" y="-8" class="lbl-dim">(0,0)</text>

      <!-- Deformed, tilted, shifted ellipse -->
      <!-- Center at (+30, -25), rx=105, ry=75, rotate 15 deg -->
      <g transform="translate(35, -25) rotate(-15)">
        <ellipse cx="0" cy="0" rx="100" ry="65" class="curve-uncal" />
        <!-- Ellipse center dot -->
        <circle cx="0" cy="0" r="4" fill="#f43f5e" />
      </g>

      <!-- Offset vector from (0,0) to center -->
      <line x1="0" y1="0" x2="35" y2="-25" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-red)" />
      <text x="45" y="-30" class="lbl-bold" fill="#f43f5e">Зсув (V_off_c, V_off_s)</text>

      <!-- Phase tilt and amplitude mismatch notes -->
      <text x="-140" y="90" class="lbl-dim" fill="#f43f5e">• Амплітуди: A_c ≠ A_s (еліпс)</text>
      <text x="-140" y="105" class="lbl-dim" fill="#f43f5e">• Фазовий зсув: ϕ ≠ 90° (нахил осей)</text>
    </g>

    <rect x="20" y="240" width="375" height="45" class="panel-sub" />
    <text x="30" y="258" class="lbl">Наслідок:</text>
    <text x="30" y="274" class="lbl" fill="#f43f5e">Гармонійна кутова похибка розрахунку atan2 сягає ±1°...±3°!</text>
  </g>

  <!-- Right: Calibrated Unit Circle -->
  <g transform="translate(475, 80)">
    <rect width="415" height="300" class="panel" />
    <text x="20" y="28" class="h2">2. Після калібрування: Ідеальне коло</text>

    <g transform="translate(205, 155)">
      <!-- Axes -->
      <line x1="-150" y1="0" x2="150" y2="0" class="axis" />
      <line x1="0" y1="-110" x2="0" y2="110" class="axis" />
      <text x="155" y="4" class="lbl-dim">V_c</text>
      <text x="4" y="-105" class="lbl-dim">V_s</text>

      <!-- Unit circle with R=85 centered at 0,0 -->
      <circle cx="0" cy="0" r="85" class="curve-cal" />
      <circle cx="0" cy="0" r="4" fill="#4ade80" />
      <text x="-25" y="-8" class="lbl-bold" fill="#4ade80">(0,0)</text>

      <!-- Radius vector to angle theta -->
      <line x1="0" y1="0" x2="60" y2="-60" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)" />
      <text x="68" y="-62" class="lbl-bold" fill="#38bdf8">θ_cal</text>

      <!-- Angle arc -->
      <path d="M 30 0 A 30 30 0 0 0 21 -21" fill="none" stroke="#fbbf24" stroke-width="2" />
      <text x="35" y="-12" class="lbl-bold" fill="#fbbf24">θ</text>

      <text x="-140" y="90" class="lbl-dim" fill="#4ade80">• Центр суміщено з (0,0)</text>
      <text x="-140" y="105" class="lbl-dim" fill="#4ade80">• Одиничні амплітуди: A_c = A_s = 1.0</text>
    </g>

    <rect x="20" y="240" width="375" height="45" class="panel-sub" />
    <text x="30" y="258" class="lbl">Результат:</text>
    <text x="30" y="274" class="lbl" fill="#4ade80">Точність визначення кута вала зростає до ±0.05°...±0.1°!</text>
  </g>

  <!-- Bottom: Calibration Transformation Matrix -->
  <g transform="translate(30, 395)">
    <rect width="860" height="120" class="panel" />
    <text x="25" y="26" class="lbl-bold" fill="#38bdf8">Алгоритм нормалізації та усунення неортогональності:</text>

    <g transform="translate(25, 45)">
      <text x="0" y="18" class="lbl-code">1. V_c = (U_cos - V_off_c) / A_c</text>
      <text x="0" y="38" class="lbl-code">2. V_s_raw = (U_sin - V_off_s) / A_s</text>
      <text x="0" y="58" class="lbl-code">3. V_s = (V_s_raw - V_c · sin(ϕ_err)) / cos(ϕ_err)</text>
    </g>

    <g transform="translate(480, 45)">
      <text x="0" y="18" class="lbl"><tspan fill="#fbbf24">Метод найменших квадратів (Least Squares):</tspan> знаходження 5 коефіцієнтів</text>
      <text x="0" y="38" class="lbl">еліпса A·x² + B·x·y + C·y² + D·x + E·y + 1 = 0 за один тестовий оберт.</text>
      <text x="0" y="58" class="lbl"><tspan fill="#38bdf8">Динамічне автокалібрування:</tspan> фоновий пошук Min/Max при кожному русі.</text>
    </g>
  </g>
</svg>