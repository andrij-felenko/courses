<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad3)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Конструкція еталонного платинового термометра SPRT</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Безмеханічне кріплення спіралі високої чистоти Pt (99.999%), кварцова колба та 4-провідне з'єднання</text>

  <!-- SPRT Diagram Canvas -->
  <g transform="translate(40, 110)">
    <!-- Outer Sheath (Quartz tube) -->
    <rect x="0" y="40" width="550" height="80" rx="40" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="275" y="25" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Оптична кварцова оболонка високої чистоти (Fused Silica Sheath)</text>

    <!-- Sensing Coil at the tip (Strain-Free Platinum Coil) -->
    <g transform="translate(30, 60)">
      <!-- Cruciform Quartz Cross support -->
      <line x1="0" y1="20" x2="140" y2="20" stroke="#8b949e" stroke-width="3"/>
      <line x1="70" y1="0" x2="70" y2="40" stroke="#8b949e" stroke-width="3"/>

      <!-- Platinum Coil Wound on cross -->
      <path d="M 10 20 Q 20 0, 30 20 T 50 20 T 70 20 T 90 20 T 110 20 T 130 20" 
            fill="none" stroke="#e3b341" stroke-width="4"/>
      <text x="70" y="55" fill="#e3b341" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Безмеханічна платинова спіраль</text>
      <text x="70" y="68" fill="#8b949e" font-family="monospace" font-size="9" text-anchor="middle">R(TPW) = 25.5 Ω (або 0.25 Ω для HTSP)</text>
    </g>

    <!-- 4 Internal Platinum/Gold Leads -->
    <g transform="translate(180, 55)" stroke="#bc8cff" stroke-width="2">
      <line x1="0" y1="10" x2="350" y2="10"/>
      <line x1="0" y1="20" x2="350" y2="20"/>
      <line x1="0" y1="30" x2="350" y2="30"/>
      <line x1="0" y1="40" x2="350" y2="40"/>
    </g>
    <text x="350" y="110" fill="#bc8cff" font-family="sans-serif" font-size="10" text-anchor="middle">4 внутрішні платинові проводи (I+, V+, V−, I−)</text>

    <!-- Hermetic Seal Head -->
    <rect x="540" y="30" width="70" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="575" y="80" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">Герметична</text>
    <text x="575" y="95" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">головка</text>

    <!-- 4 External Connecting Terminals -->
    <circle cx="630" cy="50" r="5" fill="#f85149"/>
    <text x="645" y="54" fill="#f85149" font-family="monospace" font-size="10">I+ (Струм)</text>

    <circle cx="630" cy="75" r="5" fill="#58a6ff"/>
    <text x="645" y="79" fill="#58a6ff" font-family="monospace" font-size="10">V+ (Потенціал)</text>

    <circle cx="630" cy="100" r="5" fill="#58a6ff"/>
    <text x="645" y="104" fill="#58a6ff" font-family="monospace" font-size="10">V− (Потенціал)</text>

    <circle cx="630" cy="125" r="5" fill="#3fb950"/>
    <text x="645" y="129" fill="#3fb950" font-family="monospace" font-size="10">I− (Струм)</text>
  </g>

  <!-- Technical Acceptance Criteria (IEC 60751 & ITS-90) -->
  <g transform="translate(40, 290)">
    <rect width="770" height="185" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#58a6ff" font-family="system-ui" font-size="14" font-weight="bold">Суворі критерії чистоти платини для SPRT за стандартом ITS-90:</text>

    <!-- Criterion 1: Gallium point -->
    <rect x="25" y="45" width="350" height="55" rx="4" fill="#1c2128" stroke="#7ee787" stroke-width="1"/>
    <text x="35" y="65" fill="#7ee787" font-family="monospace" font-size="11" font-weight="bold">W(29.7646 °C) ≥ 1.11807</text>
    <text x="35" y="85" fill="#8b949e" font-family="sans-serif" font-size="10">Відношення опору в точці плавлення галію (Ga MP)</text>

    <!-- Criterion 2: Mercury point -->
    <rect x="395" y="45" width="350" height="55" rx="4" fill="#1c2128" stroke="#7ee787" stroke-width="1"/>
    <text x="405" y="65" fill="#7ee787" font-family="monospace" font-size="11" font-weight="bold">W(-38.8344 °C) ≤ 0.844235</text>
    <text x="405" y="85" fill="#8b949e" font-family="sans-serif" font-size="10">Відношення опору в потрійній точці ртуті (Hg TP)</text>

    <!-- Criterion 3: Silver point for HTSPRT -->
    <rect x="25" y="110" width="720" height="55" rx="4" fill="#1c2128" stroke="#e3b341" stroke-width="1"/>
    <text x="35" y="130" fill="#e3b341" font-family="monospace" font-size="11" font-weight="bold">W(961.78 °C) ≥ 4.2844  (для високотемпературних HTSPRT)</text>
    <text x="35" y="150" fill="#f0f6fc" font-family="sans-serif" font-size="10">Якщо термометр не задовольняє цим нерівностям, наявність домішок не дозволяє застосовувати його як еталон ITS-90!</text>
  </g>
</svg>