<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad2)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Реперні фіксовані точки шкали ITS-90 (Defining Fixed Points)</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Фазові рівноваги чистих речовин: потрійні точки (TP), точки плавлення (MP) та затвердіння (FP)</text>

  <!-- Left: Fixed Point Ladder Column -->
  <g transform="translate(40, 100)">
    <!-- Vertical scale rail -->
    <line x1="80" y1="20" x2="80" y2="380" stroke="#58a6ff" stroke-width="4"/>

    <!-- Point 1: Cu (FP) -->
    <circle cx="80" cy="30" r="6" fill="#f85149"/>
    <text x="95" y="34" fill="#f85149" font-family="monospace" font-size="11" font-weight="bold">1357.77 K (1084.62 °C) — Затвердіння міді (Cu FP)</text>

    <!-- Point 2: Au (FP) -->
    <circle cx="80" cy="70" r="6" fill="#e3b341"/>
    <text x="95" y="74" fill="#e3b341" font-family="monospace" font-size="11" font-weight="bold">1337.33 K (1064.18 °C) — Затвердіння золота (Au FP)</text>

    <!-- Point 3: Ag (FP) - Limit of SPRT -->
    <circle cx="80" cy="110" r="6" fill="#bc8cff"/>
    <text x="95" y="114" fill="#bc8cff" font-family="monospace" font-size="11" font-weight="bold">1234.93 K (961.78 °C) — Затвердіння срібла (Ag FP) [Межа SPRT]</text>

    <!-- Point 4: Al (FP) -->
    <circle cx="80" cy="150" r="5" fill="#8b949e"/>
    <text x="95" y="154" fill="#f0f6fc" font-family="monospace" font-size="11">933.473 K (660.323 °C) — Затвердіння алюмінію (Al FP)</text>

    <!-- Point 5: Zn (FP) -->
    <circle cx="80" cy="185" r="5" fill="#8b949e"/>
    <text x="95" y="189" fill="#f0f6fc" font-family="monospace" font-size="11">692.677 K (419.527 °C) — Затвердіння цинку (Zn FP)</text>

    <!-- Point 6: Sn (FP) -->
    <circle cx="80" cy="220" r="5" fill="#8b949e"/>
    <text x="95" y="224" fill="#f0f6fc" font-family="monospace" font-size="11">505.078 K (231.928 °C) — Затвердіння олова (Sn FP)</text>

    <!-- Point 7: In (FP) -->
    <circle cx="80" cy="250" r="5" fill="#8b949e"/>
    <text x="95" y="254" fill="#f0f6fc" font-family="monospace" font-size="11">429.7485 K (156.5985 °C) — Затвердіння індію (In FP)</text>

    <!-- Point 8: Ga (MP) -->
    <circle cx="80" cy="280" r="5" fill="#7ee787"/>
    <text x="95" y="284" fill="#7ee787" font-family="monospace" font-size="11">302.9146 K (29.7646 °C) — Плавлення галію (Ga MP)</text>

    <!-- Point 9: Water TPW (Fundamental Cornerstone) -->
    <circle cx="80" cy="315" r="8" fill="#58a6ff"/>
    <rect x="90" y="303" width="410" height="24" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="98" y="319" fill="#58a6ff" font-family="monospace" font-size="11" font-weight="bold">273.16 K (0.010 °C) — Потрійна точка води (TPW) [Основа R0!]</text>

    <!-- Point 10: Hg (TP) -->
    <circle cx="80" cy="345" r="5" fill="#8b949e"/>
    <text x="95" y="349" fill="#f0f6fc" font-family="monospace" font-size="11">234.3156 K (-38.8344 °C) — Потрійна точка ртуті (Hg TP)</text>

    <!-- Point 11: Ar (TP) & O2 (TP) -->
    <circle cx="80" cy="375" r="5" fill="#58a6ff"/>
    <text x="95" y="379" fill="#f0f6fc" font-family="monospace" font-size="11">83.8058 K (-189.3442 °C) — Потрійна точка аргону (Ar TP)</text>
  </g>

  <!-- Right: Glass Cell Illustration (TPW Sealed Cell) -->
  <g transform="translate(560, 110)">
    <rect width="250" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="125" y="30" fill="#58a6ff" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Ампула потрійної точки води</text>
    <text x="125" y="48" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">(TPW Cell — Стабільність &lt; 0.1 мК)</text>

    <!-- Sealed Borosilicate Cell Drawing -->
    <g transform="translate(65, 70)">
      <!-- Outer Glass Tube -->
      <rect x="0" y="0" width="120" height="250" rx="20" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
      
      <!-- Liquid Water Level -->
      <rect x="5" y="50" width="110" height="190" rx="10" fill="#58a6ff" opacity="0.25"/>

      <!-- Inner Well for Thermometer -->
      <rect x="40" y="0" width="40" height="220" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
      <text x="60" y="100" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Колодязь</text>
      <text x="60" y="112" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">для SPRT</text>

      <!-- Ice Mantle around well -->
      <rect x="30" y="30" width="60" height="180" rx="8" fill="#f0f6fc" opacity="0.3" stroke="#f0f6fc" stroke-dasharray="2,2"/>
      <text x="60" y="160" fill="#f0f6fc" font-family="sans-serif" font-size="8" text-anchor="middle">Льодова сорочка</text>

      <!-- Water Vapor Space at top -->
      <text x="60" y="35" fill="#e3b341" font-family="sans-serif" font-size="9" text-anchor="middle">Пара H2O</text>
    </g>

    <text x="125" y="345" fill="#7ee787" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">3 фази в рівновазі: лід + вода + пара</text>
  </g>
</svg>