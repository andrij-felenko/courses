<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad5)"/>
  <rect x="15" y="15" width="820" height="490" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="30" y="45" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Піраміда метрологічної простежуваності температури (Traceability Chain)</text>
  <text x="30" y="68" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">Від фундаментальної сталої Больцмана k_B (SI 2019) та ITS-90 до робочих промислових сенсорів</text>

  <!-- Traceability Pyramid Blocks -->
  <g transform="translate(125, 105)">
    <!-- Tier 1: Fundamental SI Constant -->
    <polygon points="300,10 200,65 400,65" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
    <text x="300" y="40" fill="#f85149" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">SI Кельвін (2019)</text>
    <text x="300" y="55" fill="#f0f6fc" font-family="monospace" font-size="9" text-anchor="middle">k_B = 1.380649×10^-23 Дж/К</text>

    <!-- Tier 2: Primary National Standards & Fixed Points (NMI: NIST, PTB, Укрметртестстандарт) -->
    <polygon points="190,75 410,75 460,135 140,135" fill="#1c2128" stroke="#e3b341" stroke-width="2"/>
    <text x="300" y="100" fill="#e3b341" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Первинні еталони НМІ (NIST, PTB, NPL)</text>
    <text x="300" y="118" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">Реперні ампули ITS-90 + SPRT вищого розряду (Похибка &lt; 0.1 мК)</text>

    <!-- Tier 3: Secondary Calibration Laboratories -->
    <polygon points="130,145 470,145 520,205 80,205" fill="#1c2128" stroke="#bc8cff" stroke-width="2"/>
    <text x="300" y="170" fill="#bc8cff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Вторинні акредитовані лабораторії (ISO/IEC 17025)</text>
    <text x="300" y="188" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">Вторинні еталони порівняння, калібратори сухого блоку (Похибка 5–20 мК)</text>

    <!-- Tier 4: Working Industrial Sensors -->
    <polygon points="70,215 530,215 580,285 20,285" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
    <text x="300" y="240" fill="#3fb950" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Робочі промислові сенсори (Field Sensors)</text>
    <text x="300" y="260" fill="#f0f6fc" font-family="sans-serif" font-size="10" text-anchor="middle">Промислові RTD (PT100/PT1000 IEC 60751), термопари (Тип K, S, B), термистори</text>
    <text x="300" y="275" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Похибка вимірювання: 0.1 °C .. 2.0 °C</text>
  </g>

  <!-- Summary Traceability Card -->
  <g transform="translate(40, 410)">
    <rect width="770" height="75" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="25" fill="#58a6ff" font-family="system-ui" font-size="12" font-weight="bold">Принцип неперервного ланцюга калібрування:</text>
    <text x="20" y="48" fill="#f0f6fc" font-family="sans-serif" font-size="11">Кожен робочий датчик PT100 на заводі калібрується за вторинним еталоном, який своєю чергою повіряється в НМІ</text>
    <text x="20" y="66" fill="#7ee787" font-family="sans-serif" font-size="11">за реперними ампулами потрійної точки води та затвердіння металів шкали ITS-90.</text>
  </g>
</svg>