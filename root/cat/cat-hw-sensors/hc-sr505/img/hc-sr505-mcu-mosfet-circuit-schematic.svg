<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема автономного контролера освітлення на давачі HC-SR505 та N-MOSFET</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">HC-SR505 будить МК із Deep Sleep через EXTI, а N-MOSFET комутує силовий світлодіод</text>

  <!-- Card 1: Sensor HC-SR505 -->
  <rect x="30" y="70" width="260" height="445" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="38" y="78" width="244" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="160" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Детекція руху (HC-SR505)</text>

  <rect x="42" y="120" width="236" height="155" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="50" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри HC-SR505:</text>
  <text x="50" y="164" font-size="12" fill="#6b7280">• Напруга VCC: 4.5–12 В (3.3 В)</text>
  <text x="50" y="184" font-size="12" fill="#6b7280">• Струм споживання: ~50 мкА</text>
  <text x="50" y="204" font-size="12" fill="#6b7280">• Вихід OUT: 3.3 В (HIGH)</text>
  <text x="50" y="224" font-size="12" fill="#6b7280">• Апаратна затримка: ~8 с</text>
  <text x="50" y="244" font-size="12" fill="#6b7280">• Кут огляду: &lt; 100° (до 3 м)</text>

  <rect x="42" y="288" width="236" height="212" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="50" y="310" font-size="12" font-weight="bold" fill="#27ae60">Розпіновка та вихідний сигнал:</text>
  <text x="50" y="330" font-size="12" fill="#1a1a1a">1: VCC (Живлення +3.7..5 В)</text>
  <text x="50" y="348" font-size="12" font-weight="bold" fill="#2457d6">2: OUT (Сигнал на EXTI МК)</text>
  <text x="50" y="366" font-size="12" fill="#1a1a1a">3: GND (Спільна земля 0 В)</text>

  <line x1="58" y1="450" x2="90" y2="450" stroke="#27ae60" stroke-width="2"/>
  <line x1="90" y1="450" x2="90" y2="415" stroke="#27ae60" stroke-width="2"/>
  <line x1="90" y1="415" x2="210" y2="415" stroke="#27ae60" stroke-width="2"/>
  <line x1="210" y1="415" x2="210" y2="450" stroke="#27ae60" stroke-width="2"/>
  <line x1="210" y1="450" x2="262" y2="450" stroke="#27ae60" stroke-width="2"/>

  <text x="150" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Імпульс 3.3 В (8 с)</text>
  <text x="60" y="470" font-size="12" fill="#6b7280">0 В (сон)</text>
  <text x="212" y="470" font-size="12" fill="#6b7280">0 В (сон)</text>

  <!-- Connection line 1: Sensor OUT to MCU EXTI -->
  <line x1="278" y1="348" x2="310" y2="348" stroke="#2457d6" stroke-width="2"/>
  <line x1="310" y1="348" x2="310" y2="174" stroke="#2457d6" stroke-width="2"/>
  <line x1="310" y1="174" x2="348" y2="174" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="310" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">OUT</text>

  <!-- Card 2: MCU (Deep Sleep & EXTI) -->
  <rect x="330" y="70" width="260" height="445" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="338" y="78" width="244" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="460" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Контролер (Deep Sleep &amp; EXTI)</text>

  <rect x="348" y="120" width="224" height="175" rx="6" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="348" y="120" width="224" height="30" rx="6" fill="#1a1a1a"/>
  <text x="460" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MCU (STM32 / ESP32 / AVR)</text>

  <text x="356" y="174" font-size="12" font-weight="bold" fill="#2457d6">PA0 / EXTI</text>
  <text x="356" y="190" font-size="12" fill="#6b7280">(Вхід від OUT)</text>

  <text x="564" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">PA1 / GATE_CTRL</text>
  <text x="564" y="190" text-anchor="end" font-size="12" fill="#6b7280">(Вихід на MOSFET)</text>

  <rect x="356" y="208" width="208" height="74" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="460" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Режим Deep Sleep (I &lt; 10 мкА)</text>
  <text x="460" y="248" text-anchor="middle" font-size="12" fill="#1a1a1a">Очікування переривання EXTI</text>
  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#1a1a1a">Фронт HIGH → Вихід із сну</text>

  <rect x="348" y="310" width="224" height="190" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="356" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Цикл роботи системи:</text>
  <text x="356" y="354" font-size="12" fill="#6b7280">1. МК переходить у Deep Sleep</text>
  <text x="356" y="374" font-size="12" fill="#6b7280">2. Рух → HC-SR505 дає HIGH</text>
  <text x="356" y="394" font-size="12" fill="#6b7280">3. EXTI пробуджує ядро МК</text>
  <text x="356" y="414" font-size="12" fill="#6b7280">4. МК встановлює GATE_CTRL=1</text>
  <text x="356" y="434" font-size="12" fill="#6b7280">5. MOSFET відкриває LED на ~8 с</text>
  <text x="356" y="454" font-size="12" fill="#6b7280">6. Сигнал спадає → GATE_CTRL=0</text>
  <text x="356" y="474" font-size="12" font-weight="bold" fill="#27ae60">7. Повернення у режим Deep Sleep</text>

  <!-- Connection line 2: MCU GATE_CTRL to MOSFET -->
  <line x1="572" y1="174" x2="610" y2="174" stroke="#27ae60" stroke-width="2"/>
  <line x1="610" y1="174" x2="610" y2="220" stroke="#27ae60" stroke-width="2"/>
  <line x1="610" y1="220" x2="665" y2="220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="610" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">GATE</text>

  <!-- Card 3: N-MOSFET & Power Load -->
  <rect x="630" y="70" width="300" height="445" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="638" y="78" width="284" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="780" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Схема силового ключа N-MOSFET</text>

  <rect x="642" y="120" width="276" height="235" rx="4" fill="white" stroke="#d0d7de"/>

  <!-- Power Rails -->
  <line x1="652" y1="140" x2="908" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="652" y="134" font-size="12" font-weight="bold" fill="#c0392b">+VCC (+3.7V..5V)</text>

  <line x1="652" y1="338" x2="908" y2="338" stroke="#1a1a1a" stroke-width="2"/>
  <text x="652" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0 В)</text>

  <!-- Gate Resistor R_G -->
  <rect x="665" y="211" width="38" height="18" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="703" y1="220" x2="730" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="684" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G = 100 Ω</text>
  <text x="684" y="244" text-anchor="middle" font-size="12" fill="#6b7280">(затворний)</text>

  <!-- Node N1 -->
  <circle cx="730" cy="220" r="3" fill="#1a1a1a"/>

  <!-- Pull-down Resistor R_GS -->
  <line x1="730" y1="220" x2="730" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="721" y="252" width="18" height="38" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="730" y1="290" x2="730" y2="338" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="730" cy="338" r="3" fill="#1a1a1a"/>
  <text x="746" y="267" font-size="12" font-weight="bold" fill="#1a1a1a">R_GS</text>
  <text x="746" y="283" font-size="12" fill="#6b7280">100 кОм</text>

  <!-- Gate Line to MOSFET -->
  <line x1="730" y1="220" x2="770" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="752" y="212" font-size="12" font-weight="bold" fill="#6b7280">G</text>

  <!-- MOSFET Q1 -->
  <line x1="770" y1="205" x2="770" y2="235" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="776" y1="205" x2="776" y2="212" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="776" y1="217" x2="776" y2="223" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="776" y1="228" x2="776" y2="235" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Drain & Source wires -->
  <line x1="776" y1="205" x2="795" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="795" y1="205" x2="795" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="776" y1="235" x2="795" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="795" y1="235" x2="795" y2="338" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="795" cy="338" r="3" fill="#1a1a1a"/>

  <!-- Substrate connection -->
  <polygon points="776,220 784,216 784,224" fill="#1a1a1a"/>
  <line x1="784" y1="220" x2="795" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="803" y="198" font-size="12" font-weight="bold" fill="#6b7280">D</text>
  <text x="803" y="246" font-size="12" font-weight="bold" fill="#6b7280">S</text>

  <text x="815" y="215" font-size="12" font-weight="bold" fill="#2457d6">Q1: N-MOSFET</text>
  <text x="815" y="233" font-size="12" fill="#6b7280">(AO3400A)</text>

  <!-- LED Load -->
  <circle cx="795" cy="140" r="3" fill="#c0392b"/>
  <line x1="795" y1="140" x2="795" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="755" y="152" width="80" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">LED Стрічка</text>

  <!-- Specs note box -->
  <rect x="642" y="370" width="276" height="130" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="654" y="392" font-size="12" font-weight="bold" fill="#27ae60">Правила схемотехніки ключа:</text>
  <text x="654" y="412" font-size="12" fill="#1a1a1a">• V_GS(th) &lt; 1.5 В (Logic Level 3.3 В)</text>
  <text x="654" y="430" font-size="12" fill="#1a1a1a">• R_DS(on) &lt; 30 мОм (мінімальні втрати)</text>
  <text x="654" y="448" font-size="12" fill="#1a1a1a">• R_GS = 100 кОм (захист під час сну)</text>
  <text x="654" y="466" font-size="12" fill="#1a1a1a">• R_G = 100 Ом (гасіння ВЧ-коливань)</text>
  <text x="654" y="486" font-size="12" font-weight="bold" fill="#27ae60">ККД ключа &gt; 98%, струм сну ~0 мкА</text>
</svg>
