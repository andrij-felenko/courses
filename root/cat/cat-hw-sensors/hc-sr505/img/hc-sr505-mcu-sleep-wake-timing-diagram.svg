<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма HC-SR505, МК (Deep Sleep) та MOSFET</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Фронт сигналу давача будить МК через EXTI, а апаратна затримка T_delay утримує підсвічування</text>

  <!-- Головна панель діаграми -->
  <rect x="25" y="68" width="910" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вертикальні лінії часових міток -->
  <!-- t1: Початок руху -->
  <line x1="340" y1="95" x2="340" y2="400" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="340" y="88" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">t₁ (Рух)</text>

  <!-- t_wake: Завершення пробудження МК -->
  <line x1="380" y1="95" x2="380" y2="400" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- t2: Завершення фізичного руху -->
  <line x1="520" y1="95" x2="520" y2="400" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="520" y="88" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">t₂ (Кінець руху)</text>

  <!-- t3: Спад сигналу OUT / Вимкнення -->
  <line x1="770" y1="95" x2="770" y2="400" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="770" y="88" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">t₃ (Спад OUT)</text>

  <!-- Розділювальні горизонтальні лінії між сигналами -->
  <line x1="35" y1="150" x2="890" y2="150" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="35" y1="225" x2="890" y2="225" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="35" y1="300" x2="890" y2="300" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Ліва колонка: Назви сигналів -->
  <!-- Сигнал 1 -->
  <text x="40" y="118" font-size="13" font-weight="700" fill="#1a1a1a">1. Фізичний рух</text>
  <text x="40" y="134" font-size="12" fill="#6b7280">(Об’єкт у зоні PIR)</text>

  <!-- Сигнал 2 -->
  <text x="40" y="190" font-size="13" font-weight="700" fill="#1a1a1a">2. Вихід HC-SR505</text>
  <text x="40" y="206" font-size="12" fill="#6b7280">(Сигнал OUT, 3.3V)</text>

  <!-- Сигнал 3 -->
  <text x="40" y="265" font-size="13" font-weight="700" fill="#1a1a1a">3. Стан МК</text>
  <text x="40" y="281" font-size="12" fill="#6b7280">(Deep Sleep / Active)</text>

  <!-- Сигнал 4 -->
  <text x="40" y="340" font-size="13" font-weight="700" fill="#1a1a1a">4. Ключ MOSFET</text>
  <text x="40" y="356" font-size="12" fill="#6b7280">(Світлодіодна стрічка)</text>

  <!-- СИГНАЛ 1: Фізичний рух -->
  <rect x="340" y="105" width="180" height="35" fill="#eaf0fd" opacity="0.7"/>
  <path d="M 220 140 L 340 140 L 340 105 L 520 105 L 520 140 L 880 140" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="430" y="126" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Рух виявлено</text>
  <text x="280" y="134" font-size="12" fill="#6b7280" text-anchor="middle">Спокій</text>
  <text x="640" y="134" font-size="12" fill="#6b7280" text-anchor="middle">Спокій</text>

  <!-- СИГНАЛ 2: Вихід HC-SR505 (OUT) -->
  <rect x="340" y="175" width="430" height="35" fill="#e9f7ef" opacity="0.7"/>
  <path d="M 220 210 L 340 210 L 340 175 L 770 175 L 770 210 L 880 210" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="280" y="204" font-size="12" fill="#6b7280" text-anchor="middle">0V (LOW)</text>
  <text x="825" y="204" font-size="12" fill="#6b7280" text-anchor="middle">0V (LOW)</text>
  <text x="330" y="167" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">EXTI Rising</text>
  <text x="780" y="167" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">EXTI Falling</text>

  <!-- Інтервал затримки T_delay на імпульсі OUT -->
  <line x1="340" y1="162" x2="770" y2="162" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-left)" marker-end="url(#arr-green)"/>
  <text x="555" y="158" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Апаратна затримка T_delay (≈ 8 с)</text>

  <!-- СИГНАЛ 3: Стан МК -->
  <path d="M 340 285 L 380 250 L 770 250 L 795 285 Z" fill="#eaf0fd" opacity="0.7"/>
  <path d="M 220 285 L 340 285 L 380 250 L 770 250 L 795 285 L 880 285" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="280" y="279" font-size="12" fill="#6b7280" text-anchor="middle">Deep Sleep (~2 µA)</text>
  <text x="575" y="271" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Active Mode (~15 mA)</text>
  <text x="835" y="279" font-size="12" fill="#6b7280" text-anchor="middle">Deep Sleep</text>
  
  <!-- Позначка t_wake між 340 та 380 -->
  <line x1="340" y1="242" x2="380" y2="242" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-left)" marker-end="url(#arr)"/>
  <text x="360" y="237" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">t_wake</text>

  <!-- СИГНАЛ 4: Ключ MOSFET / LED -->
  <rect x="380" y="325" width="390" height="35" fill="#e9f7ef" opacity="0.7"/>
  <path d="M 220 360 L 380 360 L 380 325 L 770 325 L 770 360 L 880 360" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="300" y="354" font-size="12" fill="#6b7280" text-anchor="middle">MOSFET OFF (0 mA)</text>
  <text x="575" y="347" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">MOSFET ON (Підсвічування увімкнено)</text>
  <text x="830" y="354" font-size="12" fill="#6b7280" text-anchor="middle">OFF</text>

  <!-- Інтервал роботи підсвічування під 4 сигналом -->
  <line x1="380" y1="380" x2="770" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr)"/>
  <text x="575" y="396" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Тривалість підсвічування T_light = T_delay - t_wake</text>

  <!-- Вісь часу t -->
  <line x1="220" y1="408" x2="905" y2="408" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="412" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- Пояснювальні картки внизу -->
  <!-- Картка 1 -->
  <rect x="25" y="432" width="290" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="452" font-size="12" font-weight="700" fill="#2457d6">1. Пробудження через EXTI</text>
  <text x="40" y="470" font-size="12" fill="#1a1a1a">Фронт HIGH від HC-SR505 генерує</text>
  <text x="40" y="486" font-size="12" fill="#1a1a1a">переривання та будить МК за t_wake.</text>

  <!-- Картка 2 -->
  <rect x="335" y="432" width="290" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="452" font-size="12" font-weight="700" fill="#27ae60">2. Апаратна утримка T_delay</text>
  <text x="350" y="470" font-size="12" fill="#1a1a1a">Давач самостійно тримає HIGH ~8 с.</text>
  <text x="350" y="486" font-size="12" fill="#1a1a1a">МК не витрачає ресурси на таймери.</text>

  <!-- Картка 3 -->
  <rect x="645" y="432" width="290" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="452" font-size="12" font-weight="700" fill="#c0392b">3. Засинання по спаду</text>
  <text x="660" y="470" font-size="12" fill="#1a1a1a">Спад 0V вимикає MOSFET-ключа</text>
  <text x="660" y="486" font-size="12" fill="#1a1a1a">і повертає МК у режим Deep Sleep.</text>
</svg>
