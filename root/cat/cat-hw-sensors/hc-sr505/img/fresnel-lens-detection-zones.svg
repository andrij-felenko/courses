<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Marker definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуляція ІЧ-потоку мультисегментною лінзою Френеля</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Перетинання чергованих зон чутливості створює змінальний ІЧ-сигнал dФ/dt для PIR-сенсора</text>

  <!-- Left Panel: Spatial Geometry -->
  <rect x="30" y="75" width="470" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Просторове розщеплення зон чутливості</text>

  <!-- Detection Sector Polygons fanning out from (250, 395) to y=150 -->
  <!-- Active Zone A1 -->
  <polygon points="250,395 70,150 130,150" fill="#e9f7ef" opacity="0.75" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Gap Zone G1 -->
  <polygon points="250,395 130,150 190,150" fill="#ffffff" opacity="0.6" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Active Zone A2 -->
  <polygon points="250,395 190,150 250,150" fill="#eaf0fd" opacity="0.85" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Gap Zone G2 -->
  <polygon points="250,395 250,150 310,150" fill="#ffffff" opacity="0.6" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Active Zone A3 -->
  <polygon points="250,395 310,150 370,150" fill="#e9f7ef" opacity="0.75" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Gap Zone G3 -->
  <polygon points="250,395 370,150 430,150" fill="#ffffff" opacity="0.6" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Trajectory line -->
  <line x1="60" y1="132" x2="440" y2="132" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>

  <!-- Target & Velocity Labels -->
  <text x="220" y="116" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ІЧ-джерело (людина)</text>
  <text x="360" y="116" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Траєкторія руху (v →)</text>
  <circle cx="220" cy="132" r="9" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>

  <!-- Zone Names at top of sectors -->
  <text x="100" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">A1</text>
  <text x="160" y="150" font-size="12" fill="#6b7280" text-anchor="middle">G1</text>
  <text x="220" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A2</text>
  <text x="280" y="150" font-size="12" fill="#6b7280" text-anchor="middle">G2</text>
  <text x="340" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">A3</text>
  <text x="400" y="150" font-size="12" fill="#6b7280" text-anchor="middle">G3</text>

  <!-- Delta x spatial period dimension line -->
  <line x1="100" y1="165" x2="220" y2="165" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="160" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Крок зон Δx</text>

  <!-- Distance L dimension line -->
  <line x1="52" y1="132" x2="52" y2="395" stroke="#6b7280" stroke-width="1.2" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="58" y="260" font-size="12" fill="#6b7280" text-anchor="start">Дальність L</text>

  <!-- IR Ray from Target to Sensor Lens -->
  <line x1="220" y1="141" x2="246" y2="385" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="248" y="240" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ІЧ-потік Ф</text>

  <!-- Angular step Delta theta indicator -->
  <path d="M 215,340 A 60,60 0 0,1 235,335" fill="none" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="210" y="330" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δθ</text>

  <!-- Lens Dome & Facets -->
  <path d="M 200,405 C 200,365 300,365 300,405 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="220" y1="400" x2="250" y2="395" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="240" y1="382" x2="250" y2="395" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="260" y1="382" x2="250" y2="395" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="400" x2="250" y2="395" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="250" y="390" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінза Френеля</text>

  <!-- PIR Sensor Package -->
  <rect x="215" y="420" width="70" height="35" rx="4" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="235" y="427" width="30" height="10" rx="1" fill="#c0392b"/>
  <text x="250" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PIR-сенсор</text>
  <text x="250" y="475" font-size="12" fill="#6b7280" text-anchor="middle">(піроелемент)</text>


  <!-- Right Panel: Time Modulation Waveforms -->
  <rect x="515" y="75" width="415" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">2. Часова модуляція сигналу на сенсорі</text>

  <!-- Graph 1: IR Flux -->
  <text x="545" y="122" font-size="13" font-weight="bold" fill="#2457d6">Оптичний потік Ф(t) на кристалі</text>

  <!-- Axes Graph 1 -->
  <line x1="570" y1="220" x2="570" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="220" x2="900" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="562" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Ф</text>
  <text x="900" y="236" font-size="12" fill="#6b7280" text-anchor="end">t</text>

  <!-- Reference level dashed lines -->
  <line x1="570" y1="210" x2="890" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="562" y="214" font-size="12" fill="#6b7280" text-anchor="end">Ф_0</text>
  <line x1="570" y1="155" x2="890" y2="155" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="562" y="159" font-size="12" fill="#2457d6" text-anchor="end">Ф_max</text>

  <!-- Shading under IR flux pulses -->
  <polygon points="600,210 605,155 645,155 650,210" fill="#eaf0fd" opacity="0.8"/>
  <polygon points="700,210 705,155 745,155 750,210" fill="#eaf0fd" opacity="0.8"/>
  <polygon points="800,210 805,155 845,155 850,210" fill="#eaf0fd" opacity="0.8"/>

  <!-- Waveform Graph 1 -->
  <path d="M 570,210 L 600,210 L 605,155 L 645,155 L 650,210 L 700,210 L 705,155 L 745,155 L 750,210 L 800,210 L 805,155 L 845,155 L 850,210 L 880,210" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Period Tm marker -->
  <line x1="625" y1="142" x2="725" y2="142" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="675" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">T_m = Δx / v</text>


  <!-- Graph 2: Pyroelectric Current -->
  <text x="545" y="275" font-size="13" font-weight="bold" fill="#27ae60">Піроелектричний струм I_pir(t) = p·A·(dT/dt)</text>

  <!-- Axes Graph 2 -->
  <line x1="570" y1="430" x2="570" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="365" x2="900" y2="365" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="562" y="293" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I_pir</text>
  <text x="900" y="380" font-size="12" fill="#6b7280" text-anchor="end">t</text>
  <text x="562" y="369" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Waveform Graph 2 -->
  <path d="M 570,365 L 600,365 L 605,310 L 612,365 L 648,365 L 653,420 L 660,365 L 700,365 L 705,310 L 712,365 L 748,365 L 753,420 L 760,365 L 800,365 L 805,310 L 812,365 L 848,365 L 853,420 L 860,365 L 880,365" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Annotations on Graph 2 -->
  <!-- Positive Spike Callout -->
  <line x1="605" y1="310" x2="616" y2="302" stroke="#27ae60" stroke-width="1"/>
  <text x="618" y="302" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">+I_max (Вхід у зону)</text>

  <!-- Negative Spike Callout -->
  <line x1="653" y1="420" x2="664" y2="432" stroke="#c0392b" stroke-width="1"/>
  <text x="666" y="435" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">-I_max (Вихід із зони)</text>

  <!-- Zero Current Annotation -->
  <text x="680" y="390" font-size="12" fill="#6b7280" text-anchor="middle">
    <tspan x="680" dy="0">I = 0</tspan>
    <tspan x="680" dy="14">(T = const)</tspan>
  </text>
  <line x1="680" y1="378" x2="680" y2="368" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-gray)"/>

  <!-- Summary Formula Box -->
  <rect x="535" y="458" width="375" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="722" y="480" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Частота модуляції:  f_m = 1 / T_m = v / Δx</text>

</svg>
