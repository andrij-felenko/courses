<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-right-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-left-red" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-right-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 4 L 8 8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма вихідного сигналу HC-SR505</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Етапи початкової стабілізації (t_init ≈ 15 с) та утримання активного рівня (t_hold ≈ 8 с)</text>

  <!-- Phase Panels -->
  <!-- Phase 1: Stabilization -->
  <rect x="140" y="70" width="240" height="295" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="260" y="88" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ФАЗА 1: СТАБІЛІЗАЦІЯ</text>
  <text x="260" y="103" font-size="11" fill="#c0392b" text-anchor="middle">Початкове самокалібрування</text>
  <line x1="145" y1="118" x2="375" y2="118" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-left-red)" marker-end="url(#arr-right-red)"/>
  <text x="260" y="115" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">t_init ≈ 15 с</text>

  <!-- Phase 2: Standby -->
  <rect x="392" y="70" width="108" height="295" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="446" y="88" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle">ФАЗА 2: СПОКІЙ</text>
  <text x="446" y="103" font-size="11" fill="#6b7280" text-anchor="middle">Очікування руху</text>

  <!-- Phase 3: Active Hold -->
  <rect x="512" y="70" width="228" height="295" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="626" y="88" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ФАЗА 3: УТРИМАННЯ СИГНАЛУ</text>
  <text x="626" y="103" font-size="11" fill="#2457d6" text-anchor="middle">Активний вихід 3.3 В</text>
  <line x1="517" y1="118" x2="735" y2="118" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <text x="626" y="115" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">t_hold ≈ 8 с</text>

  <!-- Phase 4: Return to Standby -->
  <rect x="752" y="70" width="168" height="295" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="836" y="88" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle">ФАЗА 4: СПОКІЙ</text>
  <text x="836" y="103" font-size="11" fill="#6b7280" text-anchor="middle">Готовність</text>

  <!-- Y-Axis Signal Labels (Left) -->
  <text x="128" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_CC (5 В)</text>
  <text x="128" y="188" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">ІК-Рух</text>
  <text x="128" y="200" font-size="11" fill="#6b7280" text-anchor="end">(об'єкт)</text>
  <text x="128" y="255" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">V_OUT</text>
  <text x="128" y="270" font-size="11" fill="#6b7280" text-anchor="end">(GPIO/EXTI)</text>

  <!-- Signal Reference Horizontal Dashed Grid Lines -->
  <line x1="135" y1="235" x2="920" y2="235" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <line x1="135" y1="285" x2="920" y2="285" stroke="#cbd5e1"/>

  <!-- Logic Level Annotations on Left of Grid -->
  <text x="145" y="231" font-size="11" fill="#6b7280" text-anchor="start">3.3 В (HIGH)</text>
  <text x="145" y="281" font-size="11" fill="#6b7280" text-anchor="start">0 В (LOW)</text>

  <!-- Signal Traces -->

  <!-- Signal 1: V_CC -->
  <path d="M 110,150 L 140,150 L 140,135 L 915,135" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="140" cy="135" r="3" fill="#1a1a1a"/>
  <text x="148" y="128" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">Подача живлення V_CC</text>

  <!-- Signal 2: IR Motion Detection -->
  <path d="M 110,195 L 470,195 L 470,180 L 510,180 L 510,195 L 915,195" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="490" y="173" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Виявлення руху</text>

  <!-- Signal 3: V_OUT -->
  <!-- Pre-power baseline -->
  <line x1="110" y1="285" x2="140" y2="285" stroke="#94a3b8" stroke-width="2"/>

  <!-- Phase 1: Fluctuating / False HIGH during warm-up -->
  <path d="M 140,285 L 155,235 L 325,235 L 340,285 L 380,285" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="245" y="225" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Хибний сплеск при включенні</text>
  <text x="245" y="305" font-size="11" fill="#c0392b" text-anchor="middle">Ігнорування МК (t_init ≈ 15 с)</text>

  <!-- Phase 2: Standby LOW -->
  <line x1="380" y1="285" x2="500" y2="285" stroke="#2457d6" stroke-width="2.5"/>
  <text x="446" y="305" font-size="11" fill="#6b7280" text-anchor="middle">LOW (0 В)</text>

  <!-- Phase 3: Active HIGH Pulse -->
  <path d="M 500,285 L 500,235 L 740,235 L 740,285" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="626" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">HIGH (3.3 В)</text>
  <line x1="508" y1="260" x2="732" y2="260" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <text x="626" y="254" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">t_hold ≈ 8 с (затримка)</text>

  <!-- Phase 4: Standby LOW -->
  <line x1="740" y1="285" x2="915" y2="285" stroke="#2457d6" stroke-width="2.5"/>
  <text x="836" y="305" font-size="11" fill="#6b7280" text-anchor="middle">LOW (0 В)</text>

  <!-- EXTI Edge Markers and Callouts -->
  <!-- EXTI Rising Edge (Front) at X=500 -->
  <line x1="500" y1="285" x2="500" y2="317" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="500" cy="235" r="4" fill="#27ae60"/>
  <circle cx="500" cy="285" r="4" fill="#27ae60"/>
  <text x="500" y="330" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">EXTI RISING (Фронт)</text>
  <text x="500" y="343" font-size="11" fill="#27ae60" text-anchor="middle">[Старт обробки руху]</text>

  <!-- EXTI Falling Edge (Fall) at X=740 -->
  <line x1="740" y1="285" x2="740" y2="317" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="740" cy="235" r="4" fill="#c0392b"/>
  <circle cx="740" cy="285" r="4" fill="#c0392b"/>
  <text x="740" y="330" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">EXTI FALLING (Спад)</text>
  <text x="740" y="343" font-size="11" fill="#c0392b" text-anchor="middle">[Скидання активності]</text>

  <!-- Bottom Summary Info Cards -->
  <!-- Card 1: Power-on Delay -->
  <rect x="140" y="377" width="240" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="152" y="395" font-size="12" font-weight="bold" fill="#c0392b">1. Програмне затримування</text>
  <text x="152" y="412" font-size="11" fill="#1a1a1a">• Затримка обробки EXTI на 15 с</text>
  <text x="152" y="427" font-size="11" fill="#6b7280">• Фільтрація перехідних процесів</text>

  <!-- Card 2: EXTI Handling -->
  <rect x="392" y="377" width="250" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="404" y="395" font-size="12" font-weight="bold" fill="#2457d6">2. Обробка EXTI-переривань</text>
  <text x="404" y="412" font-size="11" fill="#1a1a1a">• Rising: Реєстрація події руху</text>
  <text x="404" y="427" font-size="11" fill="#6b7280">• Falling: Повернення в очікування</text>

  <!-- Card 3: MCU Driver State Machine -->
  <rect x="654" y="377" width="266" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="666" y="395" font-size="12" font-weight="bold" fill="#27ae60">3. Драйвер МК та Скінченний автомат</text>
  <text x="666" y="412" font-size="11" fill="#1a1a1a">• Неблокувальні таймери (millis)</text>
  <text x="666" y="427" font-size="11" fill="#6b7280">• Захист від хибних спрацьовувань</text>
</svg>
