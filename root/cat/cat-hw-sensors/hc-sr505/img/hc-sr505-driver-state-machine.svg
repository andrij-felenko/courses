<svg width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-warn" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Скінченний автомат (FSM) драйвера PIR-давача HC-SR505</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Карантин при подачі живлення (~15 с) та неблокувальна обробка подій EXTI і таймера</text>

  <!-- Entry Trigger (Power On) -->
  <circle cx="150" cy="80" r="5" fill="#c0392b"/>
  <line x1="150" y1="85" x2="150" y2="108" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-warn)"/>
  <text x="162" y="97" font-size="11" font-weight="bold" fill="#c0392b">Старт живлення VCC</text>

  <!-- State 1 Card: POWER_ON_INIT (Карантин) -->
  <rect x="40" y="110" width="220" height="250" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="52" y="122" width="196" height="32" rx="4" fill="#c0392b"/>
  <text x="150" y="143" font-size="13" font-weight="bold" fill="white" text-anchor="middle">1. КАРАНТИН ЖИВЛЕННЯ</text>
  <text x="150" y="172" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">STATE_POWER_ON_INIT</text>
  <line x1="52" y1="182" x2="248" y2="182" stroke="#f5c6cb" stroke-width="1"/>

  <text x="54" y="202" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Таймер:</tspan> T_warmup (~15 с)</text>
  <text x="54" y="224" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">EXTI:</tspan> Заблоковано (MUTE)</text>
  <text x="54" y="246" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">OUT:</tspan> Нестабільний / Хибний</text>
  <text x="54" y="268" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Події:</tspan> Не ґенеруються</text>

  <rect x="52" y="295" width="196" height="48" rx="4" fill="white" stroke="#f5c6cb" stroke-width="1"/>
  <text x="150" y="315" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Фільтрація завад</text>
  <text x="150" y="332" font-size="11" fill="#6b7280" text-anchor="middle">піроелемента при старті</text>

  <!-- Transition 1: Quarantine -> IDLE -->
  <line x1="260" y1="235" x2="368" y2="235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="315" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Таймер ~15 с</text>
  <text x="315" y="254" text-anchor="middle" font-size="12" fill="#2457d6">Увімкнення EXTI</text>

  <!-- State 2 Card: IDLE (Очікування) -->
  <rect x="370" y="110" width="220" height="250" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="382" y="122" width="196" height="32" rx="4" fill="#2457d6"/>
  <text x="480" y="143" font-size="13" font-weight="bold" fill="white" text-anchor="middle">2. ОЧІКУВАННЯ РУХУ</text>
  <text x="480" y="172" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">STATE_IDLE</text>
  <line x1="382" y1="182" x2="578" y2="182" stroke="#d0d7de" stroke-width="1"/>

  <text x="384" y="202" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Сигнал OUT:</tspan> LOW (0 V)</text>
  <text x="384" y="224" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">EXTI режим:</tspan> Rising Edge</text>
  <text x="384" y="246" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Стан MCU:</tspan> Сон / Фоновий</text>
  <text x="384" y="268" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Таймери:</tspan> Вимкнено</text>

  <rect x="382" y="295" width="196" height="48" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="315" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Чергування EXTI</text>
  <text x="480" y="332" font-size="11" fill="#6b7280" text-anchor="middle">Мінімальне споживання</text>

  <!-- Transition 2: IDLE -> MOTION (Forward) -->
  <line x1="590" y1="190" x2="698" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="645" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">EXTI Rising</text>
  <text x="645" y="206" text-anchor="middle" font-size="11" fill="#27ae60">OUT: 0 → 1</text>

  <!-- Transition 3: MOTION -> IDLE (Return) -->
  <line x1="700" y1="280" x2="592" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="645" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">EXTI Falling</text>
  <text x="645" y="296" text-anchor="middle" font-size="11" fill="#6b7280">OUT: 1 → 0 (~8 с)</text>

  <!-- State 3 Card: MOTION (Фіксація руху) -->
  <rect x="700" y="110" width="220" height="250" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="712" y="122" width="196" height="32" rx="4" fill="#27ae60"/>
  <text x="810" y="143" font-size="13" font-weight="bold" fill="white" text-anchor="middle">3. ФІКСАЦІЯ РУХУ</text>
  <text x="810" y="172" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">STATE_MOTION</text>
  <line x1="712" y1="182" x2="908" y2="182" stroke="#c3e6cb" stroke-width="1"/>

  <text x="714" y="202" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Сигнал OUT:</tspan> HIGH (3.3 V)</text>
  <text x="714" y="224" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">EXTI режим:</tspan> Falling Edge</text>
  <text x="714" y="246" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Утримання:</tspan> ~8 с (апаратне)</text>
  <text x="714" y="268" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Подія:</tspan> MOTION_START</text>

  <rect x="712" y="295" width="196" height="48" rx="4" fill="white" stroke="#c3e6cb" stroke-width="1"/>
  <text x="810" y="315" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Активна обробка</text>
  <text x="810" y="332" font-size="11" fill="#6b7280" text-anchor="middle">Реакція на присутність</text>

  <!-- Bottom Panel: Principles & Characteristics -->
  <rect x="40" y="385" width="880" height="100" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="407" font-size="13" font-weight="bold" fill="#1a1a1a">Особливості часових характеристик та алгоритму драйвера:</text>

  <!-- Column 1 -->
  <text x="56" y="428" font-size="12" font-weight="bold" fill="#c0392b">• Карантин живлення (~15 с):</text>
  <text x="56" y="446" font-size="12" fill="#6b7280">Ігнорування імпульсів під час</text>
  <text x="56" y="464" font-size="12" fill="#6b7280">прогріву піроелемента HC-SR505</text>

  <!-- Column 2 -->
  <text x="345" y="428" font-size="12" font-weight="bold" fill="#2457d6">• Динамічний EXTI (Rising/Falling):</text>
  <text x="345" y="446" font-size="12" fill="#6b7280">Перемикання тригера EXTI залежно</text>
  <text x="345" y="464" font-size="12" fill="#6b7280">від поточного стану автомата</text>

  <!-- Column 3 -->
  <text x="650" y="428" font-size="12" font-weight="bold" fill="#27ae60">• Апаратне утримання (~8 с):</text>
  <text x="650" y="446" font-size="12" fill="#6b7280">Давач самостійно тримає HIGH,</text>
  <text x="650" y="464" font-size="12" fill="#6b7280">MCU не витрачає ресурси таймера</text>
</svg>
