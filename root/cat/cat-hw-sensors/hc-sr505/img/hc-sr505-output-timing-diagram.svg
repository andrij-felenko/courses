<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма вихідного сигналу HC-SR505</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">При повторному русі під час затримки таймер ~8 с скидається й відраховується наново</text>

  <!-- Головна панель -->
  <rect x="25" y="78" width="910" height="364" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Блоки назв сигналів ліворуч -->
  <!-- Трек 1: Вхід -->
  <rect x="40" y="96" width="160" height="92" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="122" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Фізичний рух</text>
  <text x="120" y="144" font-size="12" fill="#1a1a1a" text-anchor="middle">(Вхідний ІК-сигнал)</text>
  <text x="120" y="167" font-size="12" fill="#6b7280" text-anchor="middle">Детекція PIR</text>

  <!-- Трек 2: Вихід -->
  <rect x="40" y="222" width="160" height="92" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="120" y="248" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихід OUT</text>
  <text x="120" y="270" font-size="12" fill="#1a1a1a" text-anchor="middle">3.3 В (HIGH) / 0 В</text>
  <text x="120" y="293" font-size="12" fill="#6b7280" text-anchor="middle">Цифровий сигнал</text>

  <!-- Вертикальні сітки часу (пунктири) -->
  <!-- t0 = 0 s -->
  <line x1="270" y1="118" x2="270" y2="345" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- t1 = 5 s -->
  <line x1="490" y1="118" x2="490" y2="345" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- t_hypothetical = 8 s (без перезапуску) -->
  <line x1="622" y1="175" x2="622" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- t_end = 13 s -->
  <line x1="842" y1="225" x2="842" y2="345" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ТРЕК 1: Хвильова діаграма руху -->
  <!-- По осі Y біля графіка -->
  <text x="230" y="125" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">HIGH</text>
  <text x="230" y="170" font-size="11" fill="#6b7280" text-anchor="end">LOW</text>
  <line x1="235" y1="110" x2="235" y2="176" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заповнення імпульсів руху -->
  <path d="M 270,165 L 270,125 L 300,125 L 300,165 Z" fill="#eaf0fd"/>
  <path d="M 490,165 L 490,125 L 520,125 L 520,165 Z" fill="#eaf0fd"/>
  <!-- Лінія сигналу руху -->
  <path d="M 240,165 L 270,165 L 270,125 L 300,125 L 300,165 L 490,165 L 490,125 L 520,125 L 520,165 L 880,165" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Підписи імпульсів -->
  <text x="285" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Імпульс 1</text>
  <text x="505" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Імпульс 2</text>

  <!-- РОЗМІРНА ЛІНІЯ 1: Первинна затримка (між треками) -->
  <line x1="270" y1="195" x2="622" y2="195" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="380" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Затримка 1: T_delay = 8 с</text>

  <!-- ТРЕК 2: Вихідний цифровий сигнал OUT -->
  <!-- По осі Y біля графіка -->
  <text x="230" y="250" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">3.3 В</text>
  <text x="230" y="296" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>
  <line x1="235" y1="236" x2="235" y2="302" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заповнення активного виходу HIGH -->
  <path d="M 270,296 L 270,238 L 842,238 L 842,296 Z" fill="#e9f7ef"/>
  <!-- Гіпотетичне падіння сигналу без автоперезапуску (червоний пунктир) -->
  <path d="M 622,238 L 622,296 L 842,296" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Фактична лінія сигналу OUT -->
  <path d="M 240,296 L 270,296 L 270,238 L 842,238 L 842,296 L 880,296" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- РОЗМІРНА ЛІНІЯ 2: Перезапуск затримки (всередині HIGH) -->
  <line x1="490" y1="265" x2="842" y2="265" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>
  <text x="732" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Автоперезапуск: +8 с</text>

  <!-- ОСЬ ЧАСУ -->
  <line x1="240" y1="345" x2="880" y2="345" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="895" y="349" font-size="12" font-weight="bold" fill="#6b7280">t</text>

  <!-- Засічки та часові позначки -->
  <!-- t = 0 -->
  <line x1="270" y1="345" x2="270" y2="351" stroke="#6b7280" stroke-width="1.5"/>
  <text x="270" y="365" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t = 0 с</text>
  <text x="270" y="380" font-size="11" fill="#6b7280" text-anchor="middle">(1-й рух)</text>

  <!-- t = 5 s -->
  <line x1="490" y1="345" x2="490" y2="351" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="365" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t = 5 с</text>
  <text x="490" y="380" font-size="11" fill="#6b7280" text-anchor="middle">(2-й рух)</text>

  <!-- t = 8 s -->
  <line x1="622" y1="345" x2="622" y2="351" stroke="#c0392b" stroke-width="1.5"/>
  <text x="622" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t = 8 с</text>
  <text x="622" y="380" font-size="11" fill="#c0392b" text-anchor="middle">(1-й таймаут)</text>

  <!-- t = 13 s -->
  <line x1="842" y1="345" x2="842" y2="351" stroke="#27ae60" stroke-width="1.5"/>
  <text x="842" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t = 13 с</text>
  <text x="842" y="380" font-size="11" fill="#27ae60" text-anchor="middle">(Вимкнення OUT)</text>

  <!-- Нижній підсумковий блок пояснень (дві картки) -->
  <rect x="40" y="398" width="425" height="32" rx="5" ry="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="252" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold" fill="#2457d6">Автоперезапуск:</tspan> новий рух під час HIGH оновлює таймер 8 с</text>

  <rect x="485" y="398" width="425" height="32" rx="5" ry="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="697" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold" fill="#27ae60">Тривалість HIGH:</tspan> t1 + T_delay = 5 с + 8 с = 13 с</text>
</svg>
