<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <g id="plate">
      <rect x="10" y="10" width="100" height="100" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
      <rect x="0" y="50" width="10" height="20" fill="#1a1a1a"/>
      <rect x="110" y="50" width="10" height="20" fill="#1a1a1a"/>
      <rect x="50" y="0" width="20" height="10" fill="#1a1a1a"/>
      <rect x="50" y="110" width="20" height="10" fill="#1a1a1a"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1120" height="460" fill="white"/>

  <text x="560" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Чопперна стабілізація: квадратурне перемикання фаз</text>
  <text x="560" y="63" text-anchor="middle" font-size="13" fill="#6b7280">ЕРС Холла змінює полярність разом зі струмом, тоді як напруга зсуву залишається незмінною</text>

  <text x="230" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фаза 1 (0°)</text>
  <text x="450" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фаза 2 (90°)</text>
  <text x="670" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фаза 3 (180°)</text>
  <text x="890" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фаза 4 (270°)</text>

  <use href="#plate" x="170" y="130"/>
  <use href="#plate" x="390" y="130"/>
  <use href="#plate" x="610" y="130"/>
  <use href="#plate" x="830" y="130"/>

  <!-- Phase 1 -->
  <line x1="140" y1="190" x2="325" y2="190" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="315" y="180" font-size="14" fill="#2457d6" font-style="italic">I</text>
  <line x1="230" y1="130" x2="230" y2="110" stroke="#27ae60" stroke-width="2"/>
  <line x1="230" y1="250" x2="230" y2="270" stroke="#27ae60" stroke-width="2"/>
  <circle cx="230" cy="110" r="4" fill="#27ae60"/>
  <circle cx="230" cy="270" r="4" fill="#27ae60"/>
  <text x="240" y="115" font-size="12" fill="#27ae60">V<tspan dy="2" font-size="10">out</tspan></text>

  <!-- Phase 2 -->
  <line x1="450" y1="100" x2="450" y2="285" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="460" y="280" font-size="14" fill="#2457d6" font-style="italic">I</text>
  <line x1="390" y1="190" x2="360" y2="190" stroke="#27ae60" stroke-width="2"/>
  <line x1="510" y1="190" x2="540" y2="190" stroke="#27ae60" stroke-width="2"/>
  <circle cx="360" cy="190" r="4" fill="#27ae60"/>
  <circle cx="540" cy="190" r="4" fill="#27ae60"/>
  <text x="550" y="195" font-size="12" fill="#27ae60">V<tspan dy="2" font-size="10">out</tspan></text>

  <!-- Phase 3 -->
  <line x1="760" y1="190" x2="575" y2="190" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="580" y="180" font-size="14" fill="#2457d6" font-style="italic">I</text>
  <line x1="670" y1="250" x2="670" y2="270" stroke="#27ae60" stroke-width="2"/>
  <line x1="670" y1="130" x2="670" y2="110" stroke="#27ae60" stroke-width="2"/>
  <circle cx="670" cy="270" r="4" fill="#27ae60"/>
  <circle cx="670" cy="110" r="4" fill="#27ae60"/>
  <text x="680" y="115" font-size="12" fill="#27ae60">V<tspan dy="2" font-size="10">out</tspan></text>

  <!-- Phase 4 -->
  <line x1="890" y1="285" x2="890" y2="100" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="900" y="120" font-size="14" fill="#2457d6" font-style="italic">I</text>
  <line x1="950" y1="190" x2="980" y2="190" stroke="#27ae60" stroke-width="2"/>
  <line x1="830" y1="190" x2="800" y2="190" stroke="#27ae60" stroke-width="2"/>
  <circle cx="980" cy="190" r="4" fill="#27ae60"/>
  <circle cx="800" cy="190" r="4" fill="#27ae60"/>
  <text x="990" y="195" font-size="12" fill="#27ae60">V<tspan dy="2" font-size="10">out</tspan></text>

  <!-- Signal Graph Baseline and Waveform -->
  <line x1="130" y1="375" x2="980" y2="375" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="125" y="379" font-size="13" fill="#6b7280" text-anchor="end">0 В</text>

  <line x1="130" y1="350" x2="980" y2="350" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <path d="M 130 300 L 340 300 L 340 400 L 560 400 L 560 300 L 780 300 L 780 400 L 980 400" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="985" y="395" font-size="13" fill="#2457d6">V<tspan dy="2" font-size="11">out</tspan></text>

  <!-- Vectors Phase 1 -->
  <line x1="226" y1="375" x2="226" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="234" y1="350" x2="234" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="220" y="365" font-size="13" fill="#c0392b" font-style="italic" text-anchor="end">V<tspan dy="2" font-size="11">off</tspan></text>
  <text x="242" y="325" font-size="13" fill="#27ae60" font-style="italic">V<tspan dy="2" font-size="11">H</tspan></text>

  <!-- Vectors Phase 2 -->
  <line x1="446" y1="375" x2="446" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="454" y1="350" x2="454" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="440" y="365" font-size="13" fill="#c0392b" font-style="italic" text-anchor="end">V<tspan dy="2" font-size="11">off</tspan></text>
  <text x="462" y="390" font-size="13" fill="#27ae60" font-style="italic">−V<tspan dy="2" font-size="11">H</tspan></text>

  <!-- Vectors Phase 3 -->
  <line x1="666" y1="375" x2="666" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="674" y1="350" x2="674" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="660" y="365" font-size="13" fill="#c0392b" font-style="italic" text-anchor="end">V<tspan dy="2" font-size="11">off</tspan></text>
  <text x="682" y="325" font-size="13" fill="#27ae60" font-style="italic">V<tspan dy="2" font-size="11">H</tspan></text>

  <!-- Vectors Phase 4 -->
  <line x1="886" y1="375" x2="886" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="894" y1="350" x2="894" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="880" y="365" font-size="13" fill="#c0392b" font-style="italic" text-anchor="end">V<tspan dy="2" font-size="11">off</tspan></text>
  <text x="902" y="390" font-size="13" fill="#27ae60" font-style="italic">−V<tspan dy="2" font-size="11">H</tspan></text>

  <!-- Equations -->
  <text x="230" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">V<tspan dy="2" font-size="11">out</tspan><tspan dy="-2"> = V</tspan><tspan dy="2" font-size="11">off</tspan><tspan dy="-2"> + V</tspan><tspan dy="2" font-size="11">H</tspan></text>
  <text x="450" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">V<tspan dy="2" font-size="11">out</tspan><tspan dy="-2"> = V</tspan><tspan dy="2" font-size="11">off</tspan><tspan dy="-2"> − V</tspan><tspan dy="2" font-size="11">H</tspan></text>
  <text x="670" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">V<tspan dy="2" font-size="11">out</tspan><tspan dy="-2"> = V</tspan><tspan dy="2" font-size="11">off</tspan><tspan dy="-2"> + V</tspan><tspan dy="2" font-size="11">H</tspan></text>
  <text x="890" y="440" text-anchor="middle" font-size="14" fill="#1a1a1a">V<tspan dy="2" font-size="11">out</tspan><tspan dy="-2"> = V</tspan><tspan dy="2" font-size="11">off</tspan><tspan dy="-2"> − V</tspan><tspan dy="2" font-size="11">H</tspan></text>

</svg>
