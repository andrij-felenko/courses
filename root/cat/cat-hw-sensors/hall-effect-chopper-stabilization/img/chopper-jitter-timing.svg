<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-prob" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-prob-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="460" fill="white"/>

  <text x="520" y="40" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a1a1a">Фазовий джиттер компаратора внаслідок дискретизації чоппування</text>
  <text x="520" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Випадкова затримка перемикання залежить від фази тактового сигналу</text>

  <!-- Сітка: тактові фронти чоппера -->
  <path d="M 200 100 L 200 400 M 300 100 L 300 400 M 400 100 L 400 400 M 500 100 L 500 400 M 600 100 L 600 400 M 700 100 L 700 400 M 800 100 L 800 400" stroke="#d0d7de" stroke-width="1.5" />

  <!-- Лінії ідеального перемикання (без джиттеру) -->
  <path d="M 250 130 L 250 400 M 610 150 L 610 400" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Пороги спрацьовування -->
  <line x1="120" y1="130" x2="850" y2="130" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 4" />
  <text x="110" y="134" text-anchor="end" font-size="13" fill="#1a1a1a">B<tspan dy="2" font-size="10">OP</tspan></text>
  
  <line x1="120" y1="150" x2="850" y2="150" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 4" />
  <text x="110" y="154" text-anchor="end" font-size="13" fill="#1a1a1a">B<tspan dy="2" font-size="10">RP</tspan></text>

  <!-- Аналоговий сигнал магнітного поля B(t) -->
  <path d="M 120 190 L 220 190 L 270 90 L 580 90 L 630 190 L 850 190" stroke="#2457d6" stroke-width="2" fill="none" stroke-linejoin="round" />
  <text x="130" y="210" font-size="13" fill="#2457d6">Магнітне поле B(t)</text>
  
  <circle cx="250" cy="130" r="4" fill="#c0392b" />
  <circle cx="610" cy="150" r="4" fill="#c0392b" />

  <!-- Тактовий сигнал f_chop -->
  <path d="M 120 270 L 200 270 L 200 230 L 250 230 L 250 270 L 300 270 L 300 230 L 350 230 L 350 270 L 400 270 L 400 230 L 450 230 L 450 270 L 500 270 L 500 230 L 550 230 L 550 270 L 600 270 L 600 230 L 650 230 L 650 270 L 700 270 L 700 230 L 750 230 L 750 270 L 800 270 L 800 230 L 850 230" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" />
  <text x="110" y="255" text-anchor="end" font-size="14" fill="#6b7280">f<tspan dy="2" font-size="10">chop</tspan></text>

  <circle cx="300" cy="230" r="3.5" fill="#27ae60" />
  <circle cx="700" cy="230" r="3.5" fill="#27ae60" />

  <!-- Період чоппування -->
  <path d="M 400 205 L 400 225 M 500 205 L 500 225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="215" x2="500" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr-rev)" />
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">T<tspan dy="2" font-size="10">chop</tspan></text>

  <!-- Зв'язок фронту чоппера з виходом -->
  <line x1="300" y1="230" x2="300" y2="330" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="700" y1="230" x2="700" y2="370" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Вихідний сигнал OUT -->
  <path d="M 120 370 L 300 370 L 300 330 L 700 330 L 700 370 L 850 370" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linejoin="round" />
  <text x="110" y="355" text-anchor="end" font-size="14" fill="#1a1a1a">OUT</text>

  <!-- Джиттер 1 -->
  <path d="M 250 380 L 250 400 M 300 380 L 300 400" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="250" y1="390" x2="300" y2="390" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-prob)" marker-start="url(#arr-prob-rev)" />
  <text x="275" y="418" text-anchor="middle" font-size="12" fill="#c0392b">t<tspan dy="2" font-size="10">d1</tspan></text>

  <!-- Джиттер 2 -->
  <path d="M 610 380 L 610 400 M 700 380 L 700 400" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="610" y1="390" x2="700" y2="390" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-prob)" marker-start="url(#arr-prob-rev)" />
  <text x="655" y="418" text-anchor="middle" font-size="12" fill="#c0392b">t<tspan dy="2" font-size="10">d2</tspan></text>

</svg>
