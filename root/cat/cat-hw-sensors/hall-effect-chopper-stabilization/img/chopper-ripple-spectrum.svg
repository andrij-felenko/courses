  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спектр сигналу на виході чопперного давача струму</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Високочастотні завади від чоппера та силового перетворювача вимагають придушення фільтром</text>

  <path d="M 150 370 L 150 210 Q 200 210 250 370 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  
  <path d="M 370 370 Q 385 370 390 350 L 395 190 L 400 90 L 405 190 L 410 350 Q 415 370 430 370" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <path d="M 570 370 Q 585 370 590 350 L 595 240 L 600 140 L 605 240 L 610 350 Q 615 370 630 370" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <path d="M 770 370 Q 785 370 790 350 L 795 290 L 800 240 L 805 290 L 810 350 Q 815 370 830 370" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>

  <path d="M 470 370 Q 485 370 490 350 L 495 240 L 500 110 L 505 240 L 510 350 Q 515 370 530 370" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 670 370 Q 685 370 690 350 L 695 270 L 700 170 L 705 270 L 710 350 Q 715 370 730 370" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <path d="M 150 160 L 250 160 Q 300 160 330 370" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5"/>

  <line x1="150" y1="370" x2="880" y2="370" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <line x1="150" y1="370" x2="150" y2="70" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>

  <text x="890" y="375" font-size="14" fill="#1a1a1a" text-anchor="start">f</text>
  <text x="145" y="55" font-size="14" fill="#1a1a1a" text-anchor="middle">Амплітуда</text>

  <text x="150" y="395" font-size="14" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="400" y="395" font-size="14" fill="#1a1a1a" text-anchor="middle">f<tspan dy="3" font-size="11">chop</tspan></text>
  <text x="500" y="415" font-size="14" fill="#1a1a1a" text-anchor="middle">f<tspan dy="3" font-size="11">pwm</tspan></text>
  <text x="600" y="395" font-size="14" fill="#1a1a1a" text-anchor="middle">3f<tspan dy="3" font-size="11">chop</tspan></text>
  <text x="700" y="415" font-size="14" fill="#1a1a1a" text-anchor="middle">2f<tspan dy="3" font-size="11">pwm</tspan></text>
  <text x="800" y="395" font-size="14" fill="#1a1a1a" text-anchor="middle">5f<tspan dy="3" font-size="11">chop</tspan></text>

  <text x="200" y="190" font-size="14" fill="#27ae60" text-anchor="middle">Корисний</text>
  <text x="200" y="208" font-size="14" fill="#27ae60" text-anchor="middle">сигнал</text>

  <text x="280" y="130" font-size="14" fill="#6b7280" text-anchor="middle">АЧХ фільтра</text>
  <text x="280" y="148" font-size="14" fill="#6b7280" text-anchor="middle">низьких частот</text>

  <text x="340" y="80" font-size="14" fill="#c0392b" text-anchor="end">Піки чопперної</text>
  <text x="340" y="98" font-size="14" fill="#c0392b" text-anchor="end">стабілізації</text>
  <line x1="350" y1="85" x2="395" y2="95" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-prob)"/>

  <text x="530" y="80" font-size="14" fill="#2457d6" text-anchor="start">Імпульсні завади</text>
  <text x="530" y="98" font-size="14" fill="#2457d6" text-anchor="start">перетворювача</text>
  <line x1="520" y1="90" x2="505" y2="105" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-acc)"/>
</svg>
