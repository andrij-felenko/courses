<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Р‘С–Р»Р° РїС–РґРєР»Р°РґРєР° -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Р—Р°РіРѕР»РѕРІРѕРє С– РїС–РґР·Р°РіРѕР»РѕРІРѕРє -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">РђРЅС‚РёР°Р»С–Р°СЃРёРЅРіРѕРІРёР№ С„С–Р»СЊС‚СЂ РґР»СЏ РґР°РІР°С‡Р° РҐРѕР»Р»Р° Р· С‡РѕРїРїРµСЂРЅРѕСЋ СЃС‚Р°Р±С–Р»С–Р·Р°С†С–С”СЋ</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">RC-С„С–Р»СЊС‚СЂ РїСЂРёРіРЅС–С‡СѓС” РІРёСЃРѕРєРѕС‡Р°СЃС‚РѕС‚РЅС– РїСѓР»СЊСЃР°С†С–С— РґРѕ РђР¦Рџ, Р·Р°РїРѕР±С–РіР°СЋС‡Рё С—С…РЅСЊРѕРјСѓ РЅР°РєР»Р°РґР°РЅРЅСЋ РЅР° РєРѕСЂРёСЃРЅРёР№ СЃРёРіРЅР°Р»</text>

  <!-- РЎС…РµРјР° -->
  <!-- Chopper Hall Sensor -->
  <rect x="190" y="80" width="140" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="260" y="115" text-anchor="middle" font-size="13" fill="#1a1a1a">Chopper</text>
  <text x="260" y="135" text-anchor="middle" font-size="13" fill="#1a1a1a">Hall Sensor</text>
  
  <line x1="330" y1="120" x2="390" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" fill="#1a1a1a">V<tspan dy="3" font-size="10">out</tspan></text>

  <!-- RC Filter -->
  <rect x="390" y="80" width="180" height="100" rx="4" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="72" text-anchor="middle" font-size="13" fill="#6b7280">RC Low-Pass Filter</text>
  
  <line x1="390" y1="120" x2="420" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="420" y="112" width="40" height="16" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="105" text-anchor="middle" font-size="13" fill="#1a1a1a">R</text>
  <line x1="460" y1="120" x2="570" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="480" cy="120" r="3" fill="#1a1a1a"/>
  
  <line x1="480" y1="120" x2="480" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="470" y1="140" x2="490" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="470" y1="146" x2="490" y2="146" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="146" x2="480" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- GND Symbol -->
  <line x1="470" y1="165" x2="490" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="474" y1="169" x2="486" y2="169" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="478" y1="173" x2="482" y2="173" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="505" y="150" text-anchor="middle" font-size="13" fill="#1a1a1a">C</text>

  <line x1="570" y1="120" x2="630" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="112" text-anchor="middle" font-size="13" fill="#1a1a1a">V<tspan dy="3" font-size="10">adc</tspan></text>

  <!-- Microcontroller / ADC -->
  <rect x="630" y="80" width="140" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="700" y="115" text-anchor="middle" font-size="13" fill="#1a1a1a">Microcontroller</text>
  <text x="700" y="135" text-anchor="middle" font-size="13" fill="#1a1a1a">ADC</text>

  <!-- Р“СЂР°С„С–РєРё СЃРїРµРєС‚СЂС–РІ -->
  <!-- Р“СЂР°С„С–Рє 1: Р‘РµР· С„С–Р»СЊС‚СЂР° -->
  <text x="270" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Р‘РµР· С„С–Р»СЊС‚СЂР°: РђР»С–Р°СЃРёРЅРі РїСѓР»СЊСЃР°С†С–Р№</text>
  
  <path d="M 100 460 L 100 280" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <path d="M 100 460 L 440 460" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="100" y="265" text-anchor="middle" font-size="12" fill="#1a1a1a">РђРјРїР»С–С‚СѓРґР°</text>
  <text x="440" y="485" text-anchor="middle" font-size="12" fill="#1a1a1a">Р§Р°СЃС‚РѕС‚Р°, <tspan font-style="italic">f</tspan></text>

  <polygon points="100,460 100,340 180,460" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="130" y="440" text-anchor="middle" font-size="12" fill="#2457d6">РЎРёРіРЅР°Р»</text>

  <line x1="250" y1="460" x2="250" y2="310" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="250" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">s</tspan><tspan dy="-3"> / 2</tspan></text>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#6b7280">РњРµР¶Р° РќР°Р№РєРІС–СЃС‚Р°</text>

  <line x1="340" y1="460" x2="340" y2="320" stroke="#6b7280" stroke-width="3"/>
  <text x="340" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">chop</tspan></text>
  <text x="345" y="315" text-anchor="start" font-size="12" fill="#6b7280">РџСѓР»СЊСЃР°С†С–С—</text>

  <line x1="400" y1="460" x2="400" y2="455" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">s</tspan></text>

  <!-- РђР»С–Р°СЃ -->
  <line x1="160" y1="460" x2="160" y2="320" stroke="#c0392b" stroke-width="3"/>
  <path d="M 335 320 Q 250 200 165 320" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="250" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">РђР»С–Р°СЃРёРЅРі</text>

  <!-- Р“СЂР°С„С–Рє 2: Р— С„С–Р»СЊС‚СЂРѕРј -->
  <text x="690" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Р— С„С–Р»СЊС‚СЂРѕРј: РџСѓР»СЊСЃР°С†С–С— РїСЂРёРіРЅС–С‡РµРЅРѕ</text>

  <path d="M 520 460 L 520 280" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <path d="M 520 460 L 860 460" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="520" y="265" text-anchor="middle" font-size="12" fill="#1a1a1a">РђРјРїР»С–С‚СѓРґР°</text>
  <text x="860" y="485" text-anchor="middle" font-size="12" fill="#1a1a1a">Р§Р°СЃС‚РѕС‚Р°, <tspan font-style="italic">f</tspan></text>

  <polygon points="520,460 520,340 600,460" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="550" y="440" text-anchor="middle" font-size="12" fill="#2457d6">РЎРёРіРЅР°Р»</text>

  <!-- RC Filter Curve -->
  <path d="M 520 300 L 590 300 C 630 300, 650 440, 760 450" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="675" y="340" text-anchor="start" font-size="12" fill="#27ae60">РђР§РҐ С„С–Р»СЊС‚СЂР°</text>

  <line x1="590" y1="460" x2="590" y2="455" stroke="#1a1a1a" stroke-width="2"/>
  <text x="590" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">c</tspan></text>

  <line x1="670" y1="460" x2="670" y2="280" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="670" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">s</tspan><tspan dy="-3"> / 2</tspan></text>

  <line x1="760" y1="460" x2="760" y2="450" stroke="#6b7280" stroke-width="3"/>
  <text x="760" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">chop</tspan></text>
  <text x="760" y="440" text-anchor="middle" font-size="12" fill="#6b7280">РџСѓР»СЊСЃР°С†С–С—</text>

  <line x1="820" y1="460" x2="820" y2="455" stroke="#1a1a1a" stroke-width="2"/>
  <text x="820" y="485" text-anchor="middle" font-size="14" fill="#1a1a1a"><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">s</tspan></text>

  <!-- Attenuated Alias -->
  <line x1="580" y1="460" x2="580" y2="450" stroke="#27ae60" stroke-width="3"/>
  <text x="580" y="440" text-anchor="middle" font-size="12" fill="#27ae60">РђР»С–Р°СЃ</text>

  <!-- РџСЂР°РІРёР»Рѕ РІРёР±РѕСЂСѓ -->
  <text x="480" y="540" text-anchor="middle" font-size="14" fill="#1a1a1a">РџСЂР°РІРёР»Рѕ РІРёР±РѕСЂСѓ: <tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">signal</tspan><tspan dy="-3"> &lt; </tspan><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">c</tspan><tspan dy="-3"> &lt; </tspan><tspan font-style="italic">f</tspan><tspan dy="3" font-size="11">s</tspan><tspan dy="-3"> / 2</tspan></text>

</svg>
