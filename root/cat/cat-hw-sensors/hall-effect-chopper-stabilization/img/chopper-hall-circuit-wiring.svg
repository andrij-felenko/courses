  <text x="710" y="335" font-size="14" fill="#1a1a1a">C<tspan dy="4" font-size="11">filter</tspan></text>

  <!-- РўРѕС‡РєРё Р·'С”РґРЅР°РЅСЊ -->
  <circle cx="160" cy="140" r="4" fill="#1a1a1a"/>
  <circle cx="160" cy="380" r="4" fill="#1a1a1a"/>
  <circle cx="315" cy="140" r="4" fill="#1a1a1a"/>
  <circle cx="315" cy="380" r="4" fill="#1a1a1a"/>
  <circle cx="680" cy="260" r="4" fill="#1a1a1a"/>
  <circle cx="680" cy="380" r="4" fill="#1a1a1a"/>

