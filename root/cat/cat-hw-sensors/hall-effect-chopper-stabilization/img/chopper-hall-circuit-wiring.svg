  <text x="363" y="264" font-size="12" text-anchor="end" fill="#6b7280">OUT</text>

  <!-- Р‘Р»РѕРєСѓРІР°Р»СЊРЅРёР№ РєРѕРЅРґРµРЅСЃР°С‚РѕСЂ C_bypass -->
