  <rect x="490" y="105" width="280" height="310" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4" rx="8" />
  <text x="630" y="85" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold">Р—РіР»Р°РґР¶СѓРІР°Р»СЊРЅРёР№ RC-С„С–Р»СЊС‚СЂ</text>
  <text x="630" y="102" font-size="13" text-anchor="middle" fill="#6b7280">РЅР° СЃРёРіРЅР°Р»СЊРЅРѕРјСѓ РІРёС…РѕРґС–</text>

  <!-- РџСЂРѕРІС–РґРЅРёРєРё: РЁРёРЅРё Р¶РёРІР»РµРЅРЅСЏ -->
  <line x1="74" y1="140" x2="896" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="74" y1="380" x2="896" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- РџСЂРѕРІС–РґРЅРёРєРё: РЎРёРіРЅР°Р» -->
