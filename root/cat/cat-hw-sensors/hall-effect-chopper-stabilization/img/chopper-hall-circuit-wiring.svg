<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Р—Р°РіРѕР»РѕРІРѕРє -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">РџС–РґРєР»СЋС‡РµРЅРЅСЏ РґР°РІР°С‡Р° Р· С‡РѕРїРїРµСЂРЅРѕСЋ СЃС‚Р°Р±С–Р»С–Р·Р°С†С–С”СЋ</text>
  <text x="480" y="55" font-size="13" text-anchor="middle" fill="#6b7280">РџСЂР°РІРёР»СЊРЅРµ СЂРѕР·С‚Р°С€СѓРІР°РЅРЅСЏ Р±Р»РѕРєСѓРІР°Р»СЊРЅРѕРіРѕ РєРѕРЅРґРµРЅСЃР°С‚РѕСЂР° С‚Р° Р·РіР»Р°РґР¶СѓРІР°Р»СЊРЅРѕРіРѕ RC-С„С–Р»СЊС‚СЂР°</text>

  <!-- Р—РѕРЅР° Р±Р»РѕРєСѓРІР°Р»СЊРЅРѕРіРѕ РєРѕРЅРґРµРЅСЃР°С‚РѕСЂР° (Р—РµР»РµРЅР°) -->
  <rect x="110" y="105" width="290" height="310" fill="#e9f7ef" rx="8" />
  <rect x="110" y="105" width="290" height="310" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" rx="8" />
  <text x="255" y="85" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">Р‘Р»РѕРєСѓРІР°Р»СЊРЅРёР№ РєРѕРЅРґРµРЅСЃР°С‚РѕСЂ</text>
  <text x="255" y="102" font-size="13" text-anchor="middle" fill="#27ae60">СЏРєРЅР°Р№Р±Р»РёР¶С‡Рµ РґРѕ РґР°РІР°С‡Р°</text>

  <!-- Р—РѕРЅР° RC-С„С–Р»СЊС‚СЂР° (РЎС–СЂР°) -->
