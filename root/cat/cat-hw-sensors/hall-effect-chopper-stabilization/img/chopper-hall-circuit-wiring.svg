  <circle cx="70" cy="380" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="60" y="145" font-size="14" font-weight="bold" text-anchor="end" fill="#1a1a1a">VDD</text>
  <text x="60" y="385" font-size="14" font-weight="bold" text-anchor="end" fill="#1a1a1a">GND</text>

  <!-- РљР»РµРјРё РїСЂР°РІРѕСЂСѓС‡ -->
