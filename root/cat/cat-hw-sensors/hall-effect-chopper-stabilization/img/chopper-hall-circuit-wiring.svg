  <line x1="315" y1="330" x2="315" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- РџС–РґРїРёСЃРё РїС–РЅС–РІ РІСЃРµСЂРµРґРёРЅС– РєРѕСЂРїСѓСЃСѓ -->
