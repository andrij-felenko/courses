  <circle cx="900" cy="260" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="900" cy="380" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="910" y="145" font-size="14" font-weight="bold" fill="#1a1a1a">VDD</text>
  <text x="910" y="265" font-size="14" font-weight="bold" fill="#1a1a1a">V<tspan dy="4" font-size="11">OUT</tspan></text>
  <text x="910" y="385" font-size="14" font-weight="bold" fill="#1a1a1a">GND</text>
</svg>
