<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="12" fill="url(#bg-grad3)"/>

  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    Цифровий тракт децимації: перетворення PDM (1 біт) у PCM (24 біти)
  </text>
  <text x="480" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Апаратний фільтр CIC, компенсаційний КІХ-фільтр (FIR), DC-Cut та зменшення частоти дискретизації
  </text>

  <!-- Flow pipeline -->
  <g transform="translate(30, 80)">
    <!-- Stage 1: PDM Input -->
    <rect x="0" y="20" width="140" height="80" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="2" filter="url(#shadow3)"/>
    <text x="70" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#facc15">PDM Вхід</text>
    <text x="70" y="66" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#ffffff">1 біт</text>
    <text x="70" y="84" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">3.072 МГц</text>

    <!-- Arrow -->
    <path d="M 140 60 L 175 60" stroke="#facc15" stroke-width="2.5" fill="none"/>

    <!-- Stage 2: CIC Decimator -->
    <rect x="175" y="10" width="200" height="100" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" filter="url(#shadow3)"/>
    <text x="275" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CIC Дециматор</text>
    <text x="275" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#e0f2fe">(Каскадний інтегратор-гребінка)</text>
    <text x="275" y="76" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#facc15">Децимація R = 64</text>
    <text x="275" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Фільтр низьких частот без множення</text>

    <!-- Arrow -->
    <path d="M 375 60 L 410 60" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

    <!-- Stage 3: Half-Band FIR Compensation -->
    <rect x="410" y="10" width="190" height="100" rx="6" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="2" filter="url(#shadow3)"/>
    <text x="505" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">FIR Компенсатор</text>
    <text x="505" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a7f3d0">Компенсація завалу АЧХ CIC</text>
    <text x="505" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ffffff">Вирівнювання смуги до 20 кГц</text>
    <text x="505" y="94" text-anchor="middle" font-family="monospace" font-size="11" fill="#facc15">Decimate /2</text>

    <!-- Arrow -->
    <path d="M 600 60 L 635 60" stroke="#34d399" stroke-width="2.5" fill="none"/>

    <!-- Stage 4: High-Pass Filter (DC-Cut) -->
    <rect x="635" y="10" width="150" height="100" rx="6" fill="#ca8a04" fill-opacity="0.3" stroke="#facc15" stroke-width="2" filter="url(#shadow3)"/>
    <text x="710" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#facc15">HPF Фільтр</text>
    <text x="710" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fef3c7">Видалення зміщення DC</text>
    <text x="710" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">fc ≈ 2 .. 5 Гц</text>
    <text x="710" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Захист від кліпінгу</text>

    <!-- Arrow -->
    <path d="M 785 60 L 815 60" stroke="#facc15" stroke-width="2.5" fill="none"/>

    <!-- Stage 5: PCM Output -->
    <rect x="815" y="20" width="85" height="80" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow3)"/>
    <text x="857" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">PCM Вихід</text>
    <text x="857" y="66" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">24 біти</text>
    <text x="857" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff">48 кГц</text>
  </g>

  <!-- Noise Shaping and Spectrum Graph -->
  <g transform="translate(40, 225)">
    <rect width="880" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
      Спектральне перерозподілення шуму (Noise Shaping):
    </text>

    <!-- Spectrum representation -->
    <g transform="translate(60, 45)">
      <!-- Axes -->
      <line x1="0" y1="120" x2="760" y2="120" stroke="#64748b" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#64748b" stroke-width="1.5"/>
      <text x="-10" y="15" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">Шум / Сигнал</text>
      <text x="760" y="135" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">Частота f</text>

      <!-- Audio Band 0..20 kHz -->
      <rect x="0" y="0" width="80" height="120" fill="#059669" fill-opacity="0.2"/>
      <text x="40" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#34d399">Звук 20 кГц</text>

      <!-- Noise curve without shaping (flat) -->
      <line x1="0" y1="70" x2="740" y2="70" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="650" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f87171">Білий шум без модулятора</text>

      <!-- Noise shaped curve: rising steeply -->
      <path d="M 0 115 Q 100 115, 300 90 T 700 10" stroke="#facc15" stroke-width="2.5" fill="none"/>
      <text x="500" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#facc15">
        Шум витіснено в ультразвук (&gt;100 кГц)
      </text>

      <!-- Digital filter cutoff -->
      <line x1="120" y1="0" x2="120" y2="120" stroke="#38bdf8" stroke-width="2"/>
      <text x="125" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">
        Зріз цифрового ФНЧ (CIC)
      </text>
    </g>

    <g transform="translate(60, 195)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        • Сигма-дельта модулятор відсуває енергію шуму квантування далеко за межі 20 кГц, а цифровий фільтр CIC повністю зрізає його,
      </text>
      <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
        забезпечуючи співвідношення сигнал/шум (SNR) понад 64..68 дБ при простому 1-бітному інтерфейсі.
      </text>
    </g>
  </g>
</svg>