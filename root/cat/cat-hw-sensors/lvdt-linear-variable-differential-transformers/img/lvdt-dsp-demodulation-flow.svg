<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потік цифрової обробки сигналів LVDT</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Синхронна дискретизація, I/Q демодуляція, ратіометрія та компенсація дрейфу</text>

  <!-- Flow Stage 1 -->
  <rect x="30" y="80" width="152" height="165" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 30,86 A 6,6 0 0 1 36,80 L 176,80 A 6,6 0 0 1 182,86 L 182,110 L 30,110 Z" fill="#eaf0fd"/>
  <text x="106" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. АЦП-дискретизація</text>
  <text x="106" y="126" font-size="12" fill="#1a1a1a" text-anchor="middle">Синхронний тригер</text>
  <text x="106" y="144" font-size="12" fill="#1a1a1a" text-anchor="middle">від ШІМ/генератора</text>
  <text x="106" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Відліки сигналів:</text>
  <text x="106" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">v₁(t), v₂(t), v_ref(t)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="184" y1="162" x2="212" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Flow Stage 2 -->
  <rect x="217" y="80" width="152" height="165" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 217,86 A 6,6 0 0 1 223,80 L 363,80 A 6,6 0 0 1 369,86 L 369,110 L 217,110 Z" fill="#eaf0fd"/>
  <text x="293" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. I/Q Демодуляція</text>
  <text x="293" y="126" font-size="12" fill="#1a1a1a" text-anchor="middle">Множення на</text>
  <text x="293" y="144" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">sin(ωt) / cos(ωt)</text>
  <text x="293" y="172" font-size="12" fill="#6b7280" text-anchor="middle">ФНЧ фільтрація</text>
  <text x="293" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Амплітуди: A₁, A₂</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="371" y1="162" x2="399" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Flow Stage 3 (Highlighted) -->
  <rect x="404" y="80" width="152" height="165" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 404,86 A 6,6 0 0 1 410,80 L 550,80 A 6,6 0 0 1 556,86 L 556,110 L 404,110 Z" fill="#2457d6"/>
  <text x="480" y="100" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Ратіометрія</text>
  <text x="480" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Відносне ділення:</text>
  <text x="480" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R = (A₁-A₂)/(A₁+A₂)</text>
  <text x="480" y="176" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Компенсація</text>
  <text x="480" y="194" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">дрейфу V₀(t)</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="558" y1="162" x2="586" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Flow Stage 4 -->
  <rect x="591" y="80" width="152" height="165" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 591,86 A 6,6 0 0 1 597,80 L 737,80 A 6,6 0 0 1 743,86 L 743,110 L 591,110 Z" fill="#eaf0fd"/>
  <text x="667" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Лінеаризація</text>
  <text x="667" y="126" font-size="12" fill="#1a1a1a" text-anchor="middle">Зсув нуля: R - R₀</text>
  <text x="667" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Поліном 3-го ст.:</text>
  <text x="667" y="170" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">x = a₃R³ + ... + a₀</text>
  <text x="667" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Термокорекція k_T</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="745" y1="162" x2="773" y2="162" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Flow Stage 5 (Output / OK) -->
  <rect x="778" y="80" width="152" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 778,86 A 6,6 0 0 1 784,80 L 924,80 A 6,6 0 0 1 930,86 L 930,110 L 778,110 Z" fill="#27ae60"/>
  <text x="854" y="100" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5. Вихід і Контроль</text>
  <text x="854" y="126" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Положення x [мм]</text>
  <text x="854" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка суми:</text>
  <text x="854" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A₁ + A₂ ≥ V_min</text>
  <text x="854" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Прапори помилок</text>

  <!-- Bottom Panel Left: Ratiometric Math -->
  <rect x="30" y="270" width="435" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="295" font-size="14" font-weight="bold" fill="#1a1a1a">Математична сутність ратіометричного скасування дрейфу</text>
  <line x1="45" y1="305" x2="450" y2="305" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="325" font-size="12" fill="#6b7280">Амплітуди вторинних обмоток з урахуванням дрейфу V₀(t):</text>
  <text x="45" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">A₁ = V₀(t) · (1 + k · x),    A₂ = V₀(t) · (1 - k · x)</text>
  <text x="45" y="371" font-size="12" fill="#6b7280">Обчислення ратіометричного коефіцієнта R:</text>
  <text x="45" y="391" font-size="12" font-weight="bold" fill="#2457d6">R = (A₁ - A₂) / (A₁ + A₂) = (2 · V₀ · k · x) / (2 · V₀) = k · x</text>
  <rect x="45" y="414" width="405" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="432" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Напруга збудження V₀(t) та її дрейф повністю скорочуються</text>

  <!-- Bottom Panel Right: Diagnostics & Safety -->
  <rect x="495" y="270" width="435" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="295" font-size="14" font-weight="bold" fill="#1a1a1a">Діагностика нештатних станів та апаратних збоїв</text>
  <line x1="510" y1="305" x2="915" y2="305" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="510" y="318" width="115" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="567" y="334" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">A₁ + A₂ &lt; V_min</text>
  <text x="635" y="334" font-size="12" fill="#1a1a1a">Обрив обмотки / втрата збудження</text>

  <rect x="510" y="350" width="115" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="567" y="366" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">|A₁ - A₂| &gt; A_max</text>
  <text x="635" y="366" font-size="12" fill="#1a1a1a">Перекіс ядра / вихід за діапазон</text>

  <rect x="510" y="382" width="115" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="567" y="398" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">A₁ + A₂ ≥ V_min</text>
  <text x="635" y="398" font-size="12" fill="#1a1a1a">Нормальний режим, дані валідні</text>

  <rect x="510" y="414" width="405" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="432" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Автоматична установка прапорця STATUS_OK / FAULT</text>
</svg>
