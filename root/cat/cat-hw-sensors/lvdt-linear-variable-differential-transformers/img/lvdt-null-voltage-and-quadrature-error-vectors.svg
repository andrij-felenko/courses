<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8e44ad"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Складники залишкової нульової напруги LVDT (Null Voltage)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Розклад залишкового сигналу в нульовому положенні осердя на активну, квадратурну та вищі гармоніки</text>

  <!-- Ліва панель: Векторна діаграма -->
  <rect x="30" y="90" width="560" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі координат -->
  <!-- Вісь Re -->
  <line x1="90" y1="360" x2="480" y2="360" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="488" y="354" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Re (0°)</text>
  <text x="488" y="370" font-size="12" fill="#6b7280" text-anchor="start">Синфазна вісь</text>

  <!-- Вісь Im -->
  <line x1="160" y1="375" x2="160" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="160" y="115" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Im (90°)</text>
  <text x="160" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Квадратурна вісь</text>

  <!-- Дуга кута phi_null -->
  <path d="M 215,360 A 55,55 0 0,0 200,323" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="215" y="348" font-size="12" font-weight="bold" fill="#2457d6">φ_null</text>

  <!-- Вектор V_in-phase -->
  <line x1="160" y1="360" x2="360" y2="360" stroke="#2457d6" stroke-width="3.5" marker-end="url(#arr-blue)"/>
  <text x="250" y="385" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_in-phase</text>
  <text x="250" y="402" font-size="12" fill="#6b7280" text-anchor="middle">(активний дисбаланс ΔR, ΔL)</text>

  <!-- Вектор V_quad (на осі) -->
  <line x1="160" y1="360" x2="160" y2="210" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr-red)"/>
  <!-- Паралельний вектор V_quad -->
  <line x1="360" y1="360" x2="360" y2="210" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <!-- Горизонтальна лінія проекції -->
  <line x1="160" y1="210" x2="360" y2="210" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Написи для V_quad -->
  <text x="145" y="275" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">V_quad</text>
  <text x="145" y="291" font-size="12" fill="#6b7280" text-anchor="end">(паразитні C_ps,</text>
  <text x="145" y="306" font-size="12" fill="#6b7280" text-anchor="end">вихрові струми)</text>

  <!-- Вектор V_null,1 (1-ша гармоніка) -->
  <line x1="160" y1="360" x2="360" y2="210" stroke="#2457d6" stroke-width="3.5" marker-end="url(#arr-blue)"/>
  <text x="355" y="318" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">V_null,1</text>
  <text x="355" y="334" font-size="12" fill="#2457d6" text-anchor="end">(1-ша гармоніка)</text>

  <!-- Вектор вищих гармонік V_harm -->
  <line x1="360" y1="210" x2="415" y2="150" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <circle cx="415" cy="150" r="14" fill="none" stroke="#8e44ad" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="435" y="140" font-size="13" font-weight="bold" fill="#8e44ad" text-anchor="start">V_harm (V_3h)</text>
  <text x="435" y="156" font-size="12" fill="#8e44ad" text-anchor="start">3-тя та вищі гармоніки</text>
  <text x="435" y="172" font-size="12" fill="#6b7280" text-anchor="start">(нелінійність B-H осердя)</text>

  <!-- Повний зашковий вектор V_null,total -->
  <line x1="160" y1="360" x2="415" y2="150" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-black)"/>
  <text x="180" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">V_null,total</text>
  <text x="180" y="181" font-size="12" fill="#6b7280" text-anchor="start">(сумарний залишковий вектор)</text>

  <!-- Панель формули внизу діаграми -->
  <rect x="45" y="432" width="530" height="46" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="310" y="450" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рівняння: V_null,total = √(V_in-phase² + V_quad²) + V_harm</text>
  <text x="310" y="466" font-size="12" fill="#6b7280" text-anchor="middle">V_null(t) = V_in-phase · cos(ωt) + V_quad · sin(ωt) + V_3h · sin(3ωt + φ_3)</text>

  <!-- Права картка 1: Фізичні причини -->
  <rect x="610" y="90" width="320" height="188" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 610,98 A 8,8 0 0,1 618,90 L 922,90 A 8,8 0 0,1 930,98 L 930,122 L 610,122 Z" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="625" y="111" font-size="13" font-weight="bold" fill="#2457d6">1. Джерела залишкової напруги</text>

  <circle cx="628" cy="138" r="4" fill="#2457d6"/>
  <text x="640" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">V_in-phase (Синфазна складова):</text>
  <text x="640" y="157" font-size="12" fill="#6b7280">Дисбаланс опорів ΔR та індуктивностей ΔL</text>

  <circle cx="628" cy="184" r="4" fill="#c0392b"/>
  <text x="640" y="188" font-size="12" font-weight="bold" fill="#c0392b">V_quad (Квадратурна складова):</text>
  <text x="640" y="203" font-size="12" fill="#6b7280">Міжобмоточні паразитні ємності C_ps,</text>
  <text x="640" y="218" font-size="12" fill="#6b7280">вихрові струми Фуко в осерді й корпусі</text>

  <circle cx="628" cy="245" r="4" fill="#8e44ad"/>
  <text x="640" y="249" font-size="12" font-weight="bold" fill="#8e44ad">V_harm (Вищі гармоніки):</text>
  <text x="640" y="264" font-size="12" fill="#6b7280">Нелінійність гістерезису B-H осердя (V_3h)</text>

  <!-- Права картка 2: Пригнічення похибки -->
  <rect x="610" y="295" width="320" height="195" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <path d="M 610,303 A 8,8 0 0,1 618,295 L 922,295 A 8,8 0 0,1 930,303 L 930,327 L 610,327 Z" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="625" y="316" font-size="13" font-weight="bold" fill="#1e8449">2. Фільтрація в кондиціонері сигналу</text>

  <path d="M 624,342 L 628,346 L 634,338" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="640" y="344" font-size="12" font-weight="bold" fill="#1a1a1a">Фазочутливий демодулятор (PSD):</text>
  <text x="640" y="359" font-size="12" fill="#6b7280">Синхронізовано з опорною фазою 0°</text>
  <text x="640" y="374" font-size="12" font-weight="bold" fill="#27ae60">V_quad · cos(90°) = 0  (квадратура = 0)</text>

  <path d="M 624,397 L 628,401 L 634,393" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="640" y="399" font-size="12" font-weight="bold" fill="#1a1a1a">Фільтр низьких частот (ФНЧ):</text>
  <text x="640" y="414" font-size="12" fill="#6b7280">Повністю зрізає 3-тю гармоніку V_3h</text>

  <rect x="622" y="430" width="296" height="48" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="770" y="449" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: DC нуль ≈ 0 В</text>
  <text x="770" y="465" font-size="12" fill="#6b7280" text-anchor="middle">(Похибка зведена лише до ΔV_in-phase)</text>
</svg>
