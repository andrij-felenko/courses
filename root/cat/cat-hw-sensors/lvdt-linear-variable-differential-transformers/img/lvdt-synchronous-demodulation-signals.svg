  <text x="165" y="144" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="235" y="144" font-size="11" fill="#6b7280" text-anchor="middle">T/2</text>
  <text x="305" y="144" font-size="11" fill="#6b7280" text-anchor="middle">T</text>
  <text x="375" y="144" font-size="11" fill="#6b7280" text-anchor="middle">3T/2</text>
  <text x="445" y="144" font-size="11" fill="#6b7280" text-anchor="middle">2T</text>

  <!-- Left Vertical Grid Lines -->
