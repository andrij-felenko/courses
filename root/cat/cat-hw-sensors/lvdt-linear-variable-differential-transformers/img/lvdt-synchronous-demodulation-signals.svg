  <!-- Right Channel 4: V_out(t) -->
  <text x="507" y="438" font-size="13" font-weight="bold" fill="#1a1a1a">V_out(t)</text>
  <text x="507" y="456" font-size="11" fill="#6b7280">Сигнал після ФНЧ</text>
  <line x1="630" y1="445" x2="910" y2="445" stroke="#b0b8c0" stroke-dasharray="2,2"/>
  <line x1="630" y1="473" x2="630" y2="417" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
