  <line x1="235" y1="148" x2="235" y2="485" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="305" y1="148" x2="305" y2="485" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
