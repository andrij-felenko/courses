  <path d="M 630 350 C 649.32 375, 680.68 375, 700 350 C 719.32 375, 750.68 375, 770 350 C 789.32 375, 820.68 375, 840 350 C 859.32 375, 890.68 375, 910 350 Z" fill="#c0392b" fill-opacity="0.12"/>
