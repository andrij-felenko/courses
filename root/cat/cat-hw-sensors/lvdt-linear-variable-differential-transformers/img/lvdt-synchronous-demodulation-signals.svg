  <rect x="42" y="95" width="411" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="116" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Позитивне зміщення (x &gt; 0): фаза 0°</text>

