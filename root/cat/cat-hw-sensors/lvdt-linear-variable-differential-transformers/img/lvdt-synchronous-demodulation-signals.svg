  <path d="M 630 180 C 649.32 205, 680.68 205, 700 180 C 719.32 155, 750.68 155, 770 180 C 789.32 205, 820.68 205, 840 180 C 859.32 155, 890.68 155, 910 180" fill="none" stroke="#c0392b" stroke-width="2.5"/>

