  <path d="M 165 180 C 184.32 155, 215.68 155, 235 180 C 254.32 205, 285.68 205, 305 180 C 324.32 155, 355.68 155, 375 180 C 394.32 205, 425.68 205, 445 180" fill="none" stroke="#2457d6" stroke-width="2.5"/>

