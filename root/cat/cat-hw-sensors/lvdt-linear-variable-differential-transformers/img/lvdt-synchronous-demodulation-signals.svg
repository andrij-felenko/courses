  <line x1="840" y1="148" x2="840" y2="485" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="910" y1="148" x2="910" y2="485" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>

