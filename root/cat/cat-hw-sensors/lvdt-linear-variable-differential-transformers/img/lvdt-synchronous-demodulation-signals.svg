  <text x="665" y="232" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">×(+1)</text>
  <text x="735" y="302" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">×(-1)</text>
  <text x="805" y="232" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">×(+1)</text>
  <text x="875" y="302" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">×(-1)</text>

  <!-- Right Channel 3: V_demod(t) -->
