<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Standard black arrow -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Green arrow -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <!-- Red arrow -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механічний монтаж та співвісність осердя LVDT</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Вплив співвісності та межі лінійного ходу на точність і механічну надійність давача</text>

  <!-- PANEL 1: Correct Coaxial Alignment -->
  <g id="correct-mounting">
    <!-- Panel Background Rect -->
    <rect x="20" y="65" width="920" height="230" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

    <!-- Badge Title -->
    <rect x="35" y="77" width="340" height="24" rx="4" fill="#27ae60"/>
    <text x="205" y="93" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1. Правильний монтаж: Ідеальна співвісність</text>

    <!-- Axis line labels & lines -->
    <text x="85" y="146" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вісь симетрії</text>
    <line x1="35" y1="160" x2="140" y2="160" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Outer Housing -->
    <rect x="140" y="115" width="360" height="90" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Inner bore walls -->
    <line x1="140" y1="140" x2="500" y2="140" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="140" y1="180" x2="500" y2="180" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Upper Coils -->
    <rect x="155" y="117" width="80" height="21" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="195" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S₁</text>

    <rect x="280" y="117" width="80" height="21" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="320" y="132" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Обмотка P</text>

    <rect x="405" y="117" width="80" height="21" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="445" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S₂</text>

    <!-- Lower Coils -->
    <rect x="155" y="182" width="80" height="21" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="195" y="197" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S₁</text>

    <rect x="280" y="182" width="80" height="21" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="320" y="197" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Обмотка P</text>

    <rect x="405" y="182" width="80" height="21" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="445" y="197" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S₂</text>

    <!-- Rod Line & Label -->
    <text x="85" y="182" font-size="12" fill="#4b5563" text-anchor="middle">Шток осердя</text>
    <line x1="40" y1="160" x2="250" y2="160" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>

    <!-- Core Rect -->
    <rect x="250" y="148" width="140" height="24" rx="3" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="320" y="164" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Осердя (Core)</text>

    <!-- Axis line right of core (split around air gap text) -->
    <line x1="390" y1="160" x2="415" y2="160" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="475" y1="160" x2="525" y2="160" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Air gap label inside bore -->
    <text x="445" y="164" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">g = g₀</text>

    <!-- Null Position dashed line segments -->
    <line x1="320" y1="97" x2="320" y2="115" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="320" y1="205" x2="320" y2="214" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="320" y1="244" x2="320" y2="254" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="320" y1="272" x2="320" y2="283" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- Linear Range dimension line & labels -->
    <text x="320" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зона лінійності (±x₀)</text>
    <line x1="220" y1="242" x2="420" y2="242" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="205" y="246" font-size="12" fill="#6b7280" text-anchor="end">-x₀</text>
    <text x="435" y="246" font-size="12" fill="#6b7280" text-anchor="start">+x₀</text>
    <text x="320" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Нульове положення (x = 0)</text>

    <!-- Right Summary Box 1 -->
    <rect x="560" y="77" width="355" height="206" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="575" y="98" font-size="13" font-weight="bold" fill="#27ae60">Переваги ідеальної співвісності:</text>

    <circle cx="583" cy="120" r="3" fill="#27ae60"/>
    <text x="595" y="124" font-size="12" fill="#1a1a1a">Рівномірний зазор по колу (g₀ = const)</text>

    <circle cx="583" cy="144" r="3" fill="#27ae60"/>
    <text x="595" y="148" font-size="12" fill="#1a1a1a">Нульове бічне тертя та знос (Fᵣ = 0)</text>

    <circle cx="583" cy="168" r="3" fill="#27ae60"/>
    <text x="595" y="172" font-size="12" fill="#1a1a1a">Сувора лінійність сигналу (Vₒᵤₜ ∝ x)</text>

    <circle cx="583" cy="192" r="3" fill="#27ae60"/>
    <text x="595" y="196" font-size="12" fill="#1a1a1a">Рух строго в межах зони ходу ±x₀</text>

    <circle cx="583" cy="216" r="3" fill="#27ae60"/>
    <text x="595" y="220" font-size="12" fill="#1a1a1a">Відсутність гістерезису й зсуву фази</text>

    <rect x="575" y="236" width="325" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="737" y="257" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Норма: Fᵣ = 0 | g_top = g_bot = g₀</text>
  </g>

  <!-- PANEL 2: Misalignment / Offset & Tilt -->
  <g id="incorrect-mounting">
    <!-- Panel Background Rect -->
    <rect x="20" y="310" width="920" height="230" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

    <!-- Badge Title -->
    <rect x="35" y="315" width="370" height="22" rx="4" fill="#c0392b"/>
    <text x="220" y="330" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2. Неправильний монтаж: Перекіс та радіальний зсув</text>

    <!-- Housing axis center line & label -->
    <text x="85" y="428" font-size="12" fill="#6b7280" text-anchor="middle">Вісь корпусу</text>
    <line x1="40" y1="410" x2="135" y2="410" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="505" y1="410" x2="540" y2="410" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Outer Housing -->
    <rect x="140" y="365" width="360" height="90" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Inner bore walls -->
    <line x1="140" y1="390" x2="500" y2="390" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="140" y1="430" x2="500" y2="430" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Upper Coils -->
    <rect x="155" y="367" width="80" height="21" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="195" y="382" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S₁</text>

    <rect x="280" y="367" width="80" height="21" rx="2" fill="#c0392b" stroke="#991b1b" stroke-width="1.5"/>
    <text x="320" y="382" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Обмотка P</text>

    <rect x="405" y="367" width="80" height="21" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="445" y="382" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S₂</text>

    <!-- Lower Coils -->
    <rect x="155" y="432" width="80" height="21" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="195" y="447" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S₁</text>

    <rect x="280" y="432" width="80" height="21" rx="2" fill="#c0392b" stroke="#991b1b" stroke-width="1.5"/>
    <text x="320" y="447" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Обмотка P</text>

    <rect x="405" y="432" width="80" height="21" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="445" y="447" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S₂</text>

    <!-- Tilted Axis line & Tilt Angle Label -->
    <text x="85" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кут перекосу θ</text>
    <line x1="40" y1="386" x2="245" y2="402" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Tilted Rod Line -->
    <line x1="40" y1="386" x2="250" y2="403" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>

    <!-- Tilted Core Polygon -->
    <polygon points="250,391 390,402 390,426 250,415" fill="#9ca3af" stroke="#c0392b" stroke-width="1.5"/>
    <text x="320" y="413" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Осердя (Перекіс)</text>

    <!-- Mechanical Friction Contact Point -->
    <circle cx="250" cy="391" r="7" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,2"/>
    <circle cx="250" cy="391" r="3" fill="#c0392b"/>

    <!-- Radial force vector Fr -->
    <text x="250" y="352" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Fᵣ (Сила тертя)</text>
    <line x1="250" y1="358" x2="250" y2="381" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

    <!-- Radial offset annotation -->
    <text x="475" y="414" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Зсув Δr</text>
    <line x1="485" y1="394" x2="485" y2="426" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>

    <!-- Asymmetry Label -->
    <text x="320" y="470" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">g₁ ≠ g₂ (асиметрія зазорів)</text>

    <!-- Null Position dashed line segments -->
    <line x1="320" y1="340" x2="320" y2="365" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="320" y1="478" x2="320" y2="493" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="320" y1="508" x2="320" y2="525" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- Out of range / Non-linearity area & limits -->
    <line x1="220" y1="495" x2="420" y2="495" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="220" y1="490" x2="220" y2="500" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="420" y1="490" x2="420" y2="500" stroke="#6b7280" stroke-width="1.5"/>
    <text x="205" y="499" font-size="12" fill="#6b7280" text-anchor="end">-x₀</text>
    <text x="435" y="499" font-size="12" fill="#6b7280" text-anchor="start">+x₀</text>

    <rect x="415" y="508" width="150" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="490" y="523" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Нелінійність (x > x₀)</text>

    <!-- Right Summary Box 2 -->
    <rect x="560" y="322" width="355" height="206" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="575" y="343" font-size="13" font-weight="bold" fill="#c0392b">Наслідки монтажних помилок:</text>

    <circle cx="583" cy="365" r="3" fill="#c0392b"/>
    <text x="595" y="369" font-size="12" fill="#1a1a1a">Виникнення радіальної сили Fᵣ та тертя</text>

    <circle cx="583" cy="389" r="3" fill="#c0392b"/>
    <text x="595" y="393" font-size="12" fill="#1a1a1a">Магнітна асиметрія зазору (g₁ ≠ g₂)</text>

    <circle cx="583" cy="413" r="3" fill="#c0392b"/>
    <text x="595" y="417" font-size="12" fill="#1a1a1a">Викривлення характеристики Vₒᵤₜ(x)</text>

    <circle cx="583" cy="437" r="3" fill="#c0392b"/>
    <text x="595" y="441" font-size="12" fill="#1a1a1a">Прискорений знос штока й гістерезис</text>

    <circle cx="583" cy="461" r="3" fill="#c0392b"/>
    <text x="595" y="465" font-size="12" fill="#1a1a1a">Насичення сигналу при виході за ±x₀</text>

    <rect x="575" y="483" width="325" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="737" y="504" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Помилка: Fᵣ > 0 | Нелінійність | Зсув нуля</text>
  </g>
</svg>
