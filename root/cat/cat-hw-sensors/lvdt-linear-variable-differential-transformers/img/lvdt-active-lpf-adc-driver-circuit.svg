<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Активний ФНЧ Саллена-Кі та каскад узгодження з входом АЦП</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Придушення несучої LVDT та зсув двополюсного сигналу в діапазон АЦП (0…V_REF)</text>

  <!-- PANEL 1: Input Demodulated Signal -->
  <rect x="25" y="75" width="195" height="415" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="122" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Демодульований вхід</text>
  <text x="122" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Від фазочутливої схеми</text>

  <!-- Input Signal Terminal Box -->
  <rect x="40" y="135" width="165" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="122" y="156" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">V_demod</text>
  <text x="122" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">±2.5 В (біполярний)</text>
  <text x="122" y="192" font-size="12" fill="#c0392b" text-anchor="middle">+ залишкова несуча</text>

  <!-- Input Waveform Sub-panel -->
  <rect x="40" y="225" width="165" height="250" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="122" y="245" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Осцилограма на вході</text>

  <!-- Graph grid & labels -->
  <line x1="74" y1="354" x2="195" y2="354" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="74" y1="289" x2="195" y2="289" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="74" y1="419" x2="195" y2="419" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="74" y1="272" x2="74" y2="435" stroke="#6b7280" stroke-width="1"/>
  <text x="70" y="293" font-size="12" fill="#6b7280" text-anchor="end">+2.5 В</text>
  <text x="70" y="358" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
  <text x="70" y="423" font-size="12" fill="#6b7280" text-anchor="end">-2.5 В</text>

  <!-- High-frequency ripple waveform -->
  <path d="M 74,320 L 77,310 L 80,330 L 83,308 L 86,328 L 89,305 L 92,325 L 95,302 L 98,322 L 101,305 L 104,325 L 107,310 L 110,332 L 113,315 L 116,335 L 119,320 L 122,342 L 125,325 L 128,348 L 131,330 L 134,355 L 137,338 L 140,362 L 143,345 L 146,370 L 149,352 L 152,378 L 155,360 L 158,385 L 161,368 L 164,392 L 167,375 L 170,400 L 173,382 L 176,408 L 179,390 L 182,412 L 185,395 L 188,405 L 191,392 L 194,402" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="122" y="456" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пульсації f_carr = 10 кГц</text>

  <!-- Connection wire P1 -> P2 -->
  <line x1="205" y1="172" x2="255" y2="172" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>


  <!-- PANEL 2: 2nd Order Sallen-Key LPF -->
  <rect x="240" y="75" width="380" height="415" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="430" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. ФНЧ Саллена-Кі (2-й порядок)</text>
  <text x="430" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Придушення залишків несучої частоти</text>

  <!-- Circuit Schematic -->
  <line x1="255" y1="180" x2="265" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R1 -->
  <rect x="265" y="172" width="40" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R1 = 16 kΩ</text>

  <line x1="305" y1="180" x2="335" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="335" cy="180" r="3" fill="#1a1a1a"/>

  <!-- Resistor R2 -->
  <rect x="335" y="172" width="40" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="355" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R2 = 16 kΩ</text>

  <line x1="375" y1="180" x2="410" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="410" cy="180" r="3" fill="#1a1a1a"/>

  <!-- Feedback Capacitor C1 -->
  <line x1="335" y1="180" x2="335" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="335" y1="145" x2="400" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C1 plates -->
  <line x1="400" y1="137" x2="400" y2="153" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="406" y1="137" x2="406" y2="153" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="403" y="130" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C1 = 100 nF</text>
  <line x1="406" y1="145" x2="495" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="145" x2="495" y2="192.5" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Ground Capacitor C2 -->
  <line x1="410" y1="180" x2="410" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C2 plates -->
  <line x1="400" y1="220" x2="420" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="226" x2="420" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="392" y="227" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C2 = 50 nF</text>
  <line x1="410" y1="226" x2="410" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C2 Ground symbol -->
  <line x1="400" y1="242" x2="420" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="404" y1="246" x2="416" y2="246" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="408" y1="250" x2="412" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Op-Amp 1 (ОП1) -->
  <line x1="410" y1="180" x2="430" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="430,162 430,223 480,192.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="444" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">+</text>
  <text x="444" y="207" font-size="12" fill="#1a1a1a" text-anchor="middle">−</text>
  <text x="458" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОП1</text>

  <!-- Op-Amp 1 Output & Negative Feedback -->
  <line x1="480" y1="192.5" x2="540" y2="192.5" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="495" cy="192.5" r="3" fill="#1a1a1a"/>
  <line x1="495" y1="192.5" x2="495" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="215" x2="418" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="418" y1="215" x2="418" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="418" y1="205" x2="430" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- V_filt Node -->
  <circle cx="535" cy="192.5" r="4" fill="#27ae60"/>
  <text x="545" y="184" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">V_filt</text>
  <text x="545" y="202" font-size="12" fill="#27ae60" text-anchor="start">±2.5 В (DC)</text>

  <!-- Specs Sub-panel in Panel 2 -->
  <rect x="255" y="270" width="350" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики та результат фільтрації</text>

  <!-- Output Oscillogram box -->
  <rect x="270" y="305" width="145" height="135" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="280" y1="372" x2="405" y2="372" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <path d="M 280,345 Q 320,325 360,380 T 405,400" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="342.5" y="456" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сигнал без пульсацій</text>

  <!-- Calculations & Performance details -->
  <text x="430" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Розрахунок f_c:</text>
  <text x="430" y="340" font-size="12" fill="#1a1a1a">f_c = 1 / (2π √(R1·R2·C1·C2))</text>
  <text x="430" y="358" font-size="12" font-weight="bold" fill="#2457d6">f_c ≈ 100 Гц</text>

  <line x1="430" y1="368" x2="585" y2="368" stroke="#d0d7de"/>

  <text x="430" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">Придушення f_carr:</text>
  <text x="430" y="403" font-size="12" font-weight="bold" fill="#27ae60">Att = -80 дБ на 10 кГц</text>
  <text x="430" y="421" font-size="12" fill="#6b7280">Залишкові пульсації &lt; 0.1 мВ</text>
  <text x="430" y="439" font-size="12" fill="#6b7280">Спадання: -40 дБ/декада</text>

  <!-- Connection wire P2 -> P3 -->
  <line x1="575" y1="192.5" x2="640" y2="192.5" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>


  <!-- PANEL 3: Level Shifter & ADC Driver -->
  <rect x="635" y="75" width="300" height="415" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Зсув рівня та буфер АЦП</text>
  <text x="785" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Узгодження з вхідним діапазоном АЦП</text>

  <!-- V_REF Reference Label -->
  <text x="715" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+3.3 В (V_REF)</text>
  <line x1="715" y1="140" x2="715" y2="146" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R5 (vertical) -->
  <rect x="707" y="146" width="16" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="729" y="163" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R5 = 20 kΩ</text>
  <line x1="715" y1="174" x2="715" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Input Resistor R3 -->
  <line x1="635" y1="195" x2="655" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="655" y="187" width="40" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="675" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R3 = 20 kΩ</text>
  <line x1="695" y1="195" x2="745" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="715" cy="195" r="3" fill="#1a1a1a"/>

  <!-- Resistor R6 (vertical to GND) -->
  <line x1="715" y1="195" x2="715" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="707" y="207" width="16" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="701" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R6 = 20 kΩ</text>
  <line x1="715" y1="235" x2="715" y2="247" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R6 GND -->
  <line x1="705" y1="247" x2="725" y2="247" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="709" y1="251" x2="721" y2="251" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="713" y1="255" x2="717" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Op-Amp 2 (ОП2) -->
  <polygon points="745,177 745,233 795,205" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="757" y="197" font-size="12" fill="#1a1a1a" text-anchor="middle">+</text>
  <text x="757" y="217" font-size="12" fill="#1a1a1a" text-anchor="middle">−</text>
  <text x="772" y="207" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОП2</text>

  <!-- Inverting feedback node N_fb & resistors -->
  <line x1="745" y1="215" x2="730" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="730" cy="215" r="3" fill="#1a1a1a"/>

  <line x1="730" y1="215" x2="730" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="730" cy="230" r="3" fill="#1a1a1a"/>

  <!-- Ground Resistor Rg -->
  <line x1="730" y1="230" x2="730" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="722" y="235" width="16" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="716" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Rg = 20 kΩ</text>
  <line x1="730" y1="263" x2="730" y2="273" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Rg GND -->
  <line x1="720" y1="273" x2="740" y2="273" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="724" y1="277" x2="736" y2="277" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="728" y1="281" x2="732" y2="281" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Feedback Resistor R4 -->
  <line x1="730" y1="230" x2="748" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="748" y="222" width="40" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="768" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R4 = 10 kΩ</text>
  <line x1="788" y1="230" x2="810" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="230" x2="810" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="810" cy="205" r="3" fill="#1a1a1a"/>

  <!-- Output wire to RC filter & ADC -->
  <line x1="795" y1="205" x2="825" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="825" y="197" width="36" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="843" y="185" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_adc = 51 Ω</text>
  <line x1="861" y1="205" x2="890" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="875" cy="205" r="3" fill="#1a1a1a"/>

  <!-- Capacitor C_adc to GND -->
  <line x1="875" y1="205" x2="875" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="865" y1="225" x2="885" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="865" y1="231" x2="885" y2="231" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="875" y1="231" x2="875" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C_adc GND -->
  <line x1="865" y1="245" x2="885" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="869" y1="249" x2="881" y2="249" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="873" y1="253" x2="877" y2="253" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="875" y="268" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C_adc = 1 nF</text>

  <!-- ADC Block -->
  <rect x="890" y="180" width="36" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="908" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">АЦП</text>
  <text x="908" y="218" font-size="12" fill="#2457d6" text-anchor="middle">ADC</text>

  <!-- Specs Sub-panel in Panel 3 -->
  <rect x="647" y="270" width="276" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Математика зсуву та діапазон</text>
  <text x="785" y="312" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_ADC = 1.65 В + 0.5 · V_filt</text>

  <!-- Value Mapping Table -->
  <rect x="660" y="325" width="250" height="90" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="720" y="343" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вхід V_filt</text>
  <text x="845" y="343" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід V_ADC</text>
  <line x1="660" y1="350" x2="910" y2="350" stroke="#d0d7de"/>
  <line x1="780" y1="325" x2="780" y2="415" stroke="#d0d7de"/>

  <text x="720" y="367" font-size="12" fill="#1a1a1a" text-anchor="middle">-2.50 В (мін)</text>
  <text x="845" y="367" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0.40 В</text>

  <text x="720" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">0.00 В (центр)</text>
  <text x="845" y="385" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1.65 В</text>

  <text x="720" y="403" font-size="12" fill="#1a1a1a" text-anchor="middle">+2.50 В (макс)</text>
  <text x="845" y="403" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2.90 В</text>

  <text x="785" y="438" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Повний захист від від'ємного V</text>
  <text x="785" y="456" font-size="12" fill="#6b7280" text-anchor="middle">Запас до меж 0 В та 3.3 В: 0.4 В</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="25" y="502" width="910" height="44" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="528" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронний випрямляч LVDT (±2.5 В)  ►  2-полюсний ФНЧ (придушення несучої)  ►  Зсув рівня (+1.65 В)  ►  АЦП (0.4…2.9 В)</text>
</svg>
