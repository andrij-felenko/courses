<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L4,7 L7,1 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топології підключення LVDT: 4-, 5- та 6-провідні схеми</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Вивід спільної точки (5 wires) та окремих обмоток (6 wires) розширює можливості вимірювання та діагностики</text>

  <!-- PANEL 1: 4-Wire -->
  <g id="panel-4wire">
    <!-- Outer Box -->
    <rect x="20" y="65" width="296" height="475" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Header Card -->
    <rect x="32" y="77" width="272" height="48" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="168" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">4-ПРОВІДНА СХЕМА</text>
    <text x="168" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Внутрішнє послідовно-зустрічне</text>

    <!-- LVDT Housing -->
    <rect x="100" y="138" width="185" height="225" rx="8" fill="#f4f6f8" stroke="#b0b8c0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="108" y="155" font-size="12" font-weight="bold" fill="#6b7280">Корпус LVDT</text>

    <!-- Excitation AC Source -->
    <circle cx="66" cy="240" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 61 240 Q 63.5 235, 66 240 T 71 240" fill="none" stroke="#2457d6" stroke-width="1.5"/>
    <text x="54" y="244" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V_exc</text>
    
    <!-- Primary Excitation Wires -->
    <path d="M 66 230 L 66 180 L 120 180" fill="none" stroke="#2457d6" stroke-width="2"/>
    <path d="M 66 250 L 66 300 L 120 300" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="80" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P₁</text>
    <text x="80" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P₂</text>

    <!-- Primary Coil P -->
    <text x="120" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P</text>
    <path d="M 120 180 A 12 12 0 0 1 120 204 A 12 12 0 0 1 120 228 A 12 12 0 0 1 120 252 A 12 12 0 0 1 120 276 A 12 12 0 0 1 120 300" fill="none" stroke="#2457d6" stroke-width="2.5"/>

    <!-- Ferromagnetic Core -->
    <text x="160" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b5563">Осердя</text>
    <rect x="154" y="200" width="12" height="80" rx="3" fill="#4b5563"/>
    <line x1="160" y1="280" x2="160" y2="315" stroke="#4b5563" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-down)"/>
    <text x="160" y="330" text-anchor="middle" font-size="12" fill="#4b5563">±x</text>

    <!-- Secondary Coils S1 & S2 -->
    <text x="200" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">S₁</text>
    <path d="M 200 180 A 12 12 0 0 0 200 204 A 12 12 0 0 0 200 228" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="207" cy="186" r="3" fill="#1a1a1a"/>

    <text x="200" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">S₂</text>
    <path d="M 200 252 A 12 12 0 0 0 200 276 A 12 12 0 0 0 200 300" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="207" cy="294" r="3" fill="#1a1a1a"/>

    <!-- Internal Series Opposing Wire -->
    <line x1="200" y1="228" x2="200" y2="252" stroke="#0284c7" stroke-width="2"/>
    <text x="214" y="244" font-size="12" fill="#c0392b">Внутрішнє</text>
    <text x="214" y="258" font-size="12" fill="#c0392b">з'єднання</text>

    <!-- Output Wires (2 Secondary Wires) -->
    <line x1="200" y1="180" x2="295" y2="180" stroke="#0284c7" stroke-width="2"/>
    <circle cx="295" cy="180" r="3" fill="#0284c7"/>
    <text x="290" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₁ (OUT+)</text>

    <line x1="200" y1="300" x2="295" y2="300" stroke="#0284c7" stroke-width="2"/>
    <circle cx="295" cy="300" r="3" fill="#0284c7"/>
    <text x="290" y="316" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₂ (OUT-)</text>

    <!-- Cable Shield Line -->
    <line x1="50" y1="346" x2="295" y2="346" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="295" y1="346" x2="295" y2="352" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="288" y1="352" x2="302" y2="352" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="291" y1="355" x2="299" y2="355" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="293" y1="358" x2="297" y2="358" stroke="#6b7280" stroke-width="1.5"/>
    <text x="54" y="342" font-size="12" fill="#6b7280">Екран (Shield)</text>

    <!-- Bottom Summary Cards -->
    <rect x="32" y="370" width="272" height="30" rx="4" fill="#eaf0fd"/>
    <text x="40" y="390" font-size="12" font-weight="bold" fill="#2457d6">Конфігурація:</text>
    <text x="135" y="390" font-size="12" fill="#1a1a1a">4 провідники + Екран</text>

    <text x="40" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Вихідний сигнал / Формула:</text>
    <text x="40" y="440" font-size="13" font-weight="bold" fill="#2457d6">V_out = V_S1 - V_S2</text>
    <text x="40" y="458" font-size="12" fill="#6b7280">Різниця напруг вторинки</text>

    <rect x="32" y="472" width="272" height="53" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="40" y="491" font-size="12" fill="#27ae60">✓ Найпростіший 4-жильний кабель</text>
    <text x="40" y="511" font-size="12" fill="#c0392b">✗ Відсутня діагностика обмоток</text>
  </g>

  <!-- PANEL 2: 5-Wire -->
  <g id="panel-5wire">
    <!-- Outer Box -->
    <rect x="332" y="65" width="296" height="475" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Header Card -->
    <rect x="344" y="77" width="272" height="48" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="480" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">5-ПРОВІДНА СХЕМА</text>
    <text x="480" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Спільна точка вторинних обмоток (CT)</text>

    <!-- LVDT Housing -->
    <rect x="412" y="138" width="185" height="225" rx="8" fill="#f4f6f8" stroke="#b0b8c0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="420" y="155" font-size="12" font-weight="bold" fill="#6b7280">Корпус LVDT</text>

    <!-- Excitation AC Source -->
    <circle cx="378" cy="240" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 373 240 Q 375.5 235, 378 240 T 383 240" fill="none" stroke="#2457d6" stroke-width="1.5"/>
    <text x="366" y="244" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V_exc</text>
    
    <!-- Primary Excitation Wires -->
    <path d="M 378 230 L 378 180 L 432 180" fill="none" stroke="#2457d6" stroke-width="2"/>
    <path d="M 378 250 L 378 300 L 432 300" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="392" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P₁</text>
    <text x="392" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P₂</text>

    <!-- Primary Coil P -->
    <text x="432" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P</text>
    <path d="M 432 180 A 12 12 0 0 1 432 204 A 12 12 0 0 1 432 228 A 12 12 0 0 1 432 252 A 12 12 0 0 1 432 276 A 12 12 0 0 1 432 300" fill="none" stroke="#2457d6" stroke-width="2.5"/>

    <!-- Ferromagnetic Core -->
    <text x="472" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b5563">Осердя</text>
    <rect x="466" y="200" width="12" height="80" rx="3" fill="#4b5563"/>
    <line x1="472" y1="280" x2="472" y2="315" stroke="#4b5563" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-down)"/>
    <text x="472" y="330" text-anchor="middle" font-size="12" fill="#4b5563">±x</text>

    <!-- Secondary Coils S1 & S2 -->
    <text x="512" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">S₁</text>
    <path d="M 512 180 A 12 12 0 0 0 512 204 A 12 12 0 0 0 512 228" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="519" cy="186" r="3" fill="#1a1a1a"/>

    <text x="512" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">S₂</text>
    <path d="M 512 252 A 12 12 0 0 0 512 276 A 12 12 0 0 0 512 300" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="519" cy="294" r="3" fill="#1a1a1a"/>

    <!-- Center Tap (CT) Junction -->
    <path d="M 512 228 L 512 240 L 528 240" fill="none" stroke="#0284c7" stroke-width="2"/>
    <path d="M 512 252 L 512 240 L 528 240" fill="none" stroke="#0284c7" stroke-width="2"/>
    <circle cx="528" cy="240" r="3.5" fill="#27ae60"/>

    <!-- Output Wires (3 Secondary Wires) -->
    <line x1="512" y1="180" x2="607" y2="180" stroke="#0284c7" stroke-width="2"/>
    <circle cx="607" cy="180" r="3" fill="#0284c7"/>
    <text x="602" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₁ (OUT1)</text>

    <line x1="528" y1="240" x2="607" y2="240" stroke="#27ae60" stroke-width="2"/>
    <circle cx="607" cy="240" r="3" fill="#27ae60"/>
    <text x="602" y="234" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">CT (Спільна точка)</text>

    <line x1="512" y1="300" x2="607" y2="300" stroke="#0284c7" stroke-width="2"/>
    <circle cx="607" cy="300" r="3" fill="#0284c7"/>
    <text x="602" y="316" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₂ (OUT2)</text>

    <!-- Cable Shield Line -->
    <line x1="362" y1="346" x2="607" y2="346" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="607" y1="346" x2="607" y2="352" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="600" y1="352" x2="614" y2="352" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="603" y1="355" x2="611" y2="355" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="605" y1="358" x2="609" y2="358" stroke="#6b7280" stroke-width="1.5"/>
    <text x="366" y="342" font-size="12" fill="#6b7280">Екран (Shield)</text>

    <!-- Bottom Summary Cards -->
    <rect x="344" y="370" width="272" height="30" rx="4" fill="#eaf0fd"/>
    <text x="352" y="390" font-size="12" font-weight="bold" fill="#2457d6">Конфігурація:</text>
    <text x="447" y="390" font-size="12" fill="#1a1a1a">5 провідників + Екран</text>

    <text x="352" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Вихідний сигнал / Формула:</text>
    <text x="352" y="440" font-size="13" font-weight="bold" fill="#27ae60">V_diff / V_sum = Ratio</text>
    <text x="352" y="458" font-size="12" fill="#6b7280">Логометричне вимірювання</text>

    <rect x="344" y="472" width="272" height="53" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="352" y="491" font-size="12" fill="#27ae60">✓ Компенсація дрейфу напруги збудження</text>
    <text x="352" y="511" font-size="12" fill="#27ae60">✓ Детекція обриву за (V_S1 + V_S2)</text>
  </g>

  <!-- PANEL 3: 6-Wire -->
  <g id="panel-6wire">
    <!-- Outer Box -->
    <rect x="644" y="65" width="296" height="475" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Header Card -->
    <rect x="656" y="77" width="272" height="48" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="792" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">6-ПРОВІДНА СХЕМА</text>
    <text x="792" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Повна ізоляція всіх виводів</text>

    <!-- LVDT Housing -->
    <rect x="724" y="138" width="185" height="225" rx="8" fill="#f4f6f8" stroke="#b0b8c0" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="732" y="155" font-size="12" font-weight="bold" fill="#6b7280">Корпус LVDT</text>

    <!-- Excitation AC Source -->
    <circle cx="690" cy="240" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 685 240 Q 687.5 235, 690 240 T 695 240" fill="none" stroke="#2457d6" stroke-width="1.5"/>
    <text x="678" y="244" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V_exc</text>
    
    <!-- Primary Excitation Wires -->
    <path d="M 690 230 L 690 180 L 744 180" fill="none" stroke="#2457d6" stroke-width="2"/>
    <path d="M 690 250 L 690 300 L 744 300" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="704" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P₁</text>
    <text x="704" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P₂</text>

    <!-- Primary Coil P -->
    <text x="744" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P</text>
    <path d="M 744 180 A 12 12 0 0 1 744 204 A 12 12 0 0 1 744 228 A 12 12 0 0 1 744 252 A 12 12 0 0 1 744 276 A 12 12 0 0 1 744 300" fill="none" stroke="#2457d6" stroke-width="2.5"/>

    <!-- Ferromagnetic Core -->
    <text x="784" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b5563">Осердя</text>
    <rect x="778" y="200" width="12" height="80" rx="3" fill="#4b5563"/>
    <line x1="784" y1="280" x2="784" y2="315" stroke="#4b5563" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-down)"/>
    <text x="784" y="330" text-anchor="middle" font-size="12" fill="#4b5563">±x</text>

    <!-- Secondary Coils S1 & S2 -->
    <text x="824" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">S₁</text>
    <path d="M 824 180 A 10 10 0 0 0 824 195 A 10 10 0 0 0 824 210" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="831" cy="186" r="3" fill="#1a1a1a"/>

    <text x="824" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#0284c7">S₂</text>
    <path d="M 824 270 A 10 10 0 0 0 824 285 A 10 10 0 0 0 824 300" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="831" cy="294" r="3" fill="#1a1a1a"/>

    <!-- Isolation Label between S1 & S2 -->
    <text x="830" y="238" font-size="12" font-weight="bold" fill="#27ae60">Ізольовані</text>
    <text x="830" y="254" font-size="12" font-weight="bold" fill="#27ae60">обмотки</text>

    <!-- Output Wires (4 Secondary Wires) -->
    <line x1="824" y1="180" x2="919" y2="180" stroke="#0284c7" stroke-width="2"/>
    <circle cx="919" cy="180" r="3" fill="#0284c7"/>
    <text x="914" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₁A</text>

    <line x1="824" y1="210" x2="919" y2="210" stroke="#0284c7" stroke-width="2"/>
    <circle cx="919" cy="210" r="3" fill="#0284c7"/>
    <text x="914" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₁B</text>

    <line x1="824" y1="270" x2="919" y2="270" stroke="#0284c7" stroke-width="2"/>
    <circle cx="919" cy="270" r="3" fill="#0284c7"/>
    <text x="914" y="264" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₂A</text>

    <line x1="824" y1="300" x2="919" y2="300" stroke="#0284c7" stroke-width="2"/>
    <circle cx="919" cy="300" r="3" fill="#0284c7"/>
    <text x="914" y="316" text-anchor="end" font-size="12" font-weight="bold" fill="#0284c7">S₂B</text>

    <!-- Cable Shield Line -->
    <line x1="674" y1="346" x2="919" y2="346" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="919" y1="346" x2="919" y2="352" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="912" y1="352" x2="926" y2="352" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="915" y1="355" x2="923" y2="355" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="917" y1="358" x2="921" y2="358" stroke="#6b7280" stroke-width="1.5"/>
    <text x="678" y="342" font-size="12" fill="#6b7280">Екран (Shield)</text>

    <!-- Bottom Summary Cards -->
    <rect x="656" y="370" width="272" height="30" rx="4" fill="#eaf0fd"/>
    <text x="664" y="390" font-size="12" font-weight="bold" fill="#2457d6">Конфігурація:</text>
    <text x="759" y="390" font-size="12" fill="#1a1a1a">6 провідників + Екран</text>

    <text x="664" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Вихідний сигнал / Формула:</text>
    <text x="664" y="440" font-size="13" font-weight="bold" fill="#2457d6">V_S1 та V_S2 окремо</text>
    <text x="664" y="458" font-size="12" fill="#6b7280">Зовнішнє з'єднання / Дублювання</text>

    <rect x="656" y="472" width="272" height="53" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="664" y="491" font-size="12" fill="#27ae60">✓ Гальванічна розв'язка та гнучкість</text>
    <text x="664" y="511" font-size="12" fill="#27ae60">✓ Резервування та адаптивна сума</text>
  </g>
</svg>
