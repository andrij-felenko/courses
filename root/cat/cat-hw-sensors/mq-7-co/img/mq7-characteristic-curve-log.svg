<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Градуювальна крива MQ-7 у логарифмічних координатах</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">При VH = 1.4 В сенсор високоелективний до CO: залежність Rs/R0 від ppm є лінійною у log-log масштабі</text>

  <!-- Назва осі Y -->
  <text x="100" y="76" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Співвідношення опорів (Rs / R0)</text>

  <!-- Рамка графіка -->
  <rect x="100" y="90" width="500" height="360" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>

  <!-- Дрібна сітка (Minor Grid Lines) -->
  <line x1="151.8" y1="90" x2="151.8" y2="450" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="216.5" y1="90" x2="216.5" y2="450" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="318.5" y1="90" x2="318.5" y2="450" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="383.2" y1="90" x2="383.2" y2="450" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="485.2" y1="90" x2="485.2" y2="450" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="549.8" y1="90" x2="549.8" y2="450" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>

  <line x1="100" y1="144.2" x2="600" y2="144.2" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="100" y1="215.8" x2="600" y2="215.8" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="100" y1="324.2" x2="600" y2="324.2" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="100" y1="395.8" x2="600" y2="395.8" stroke="#f0f3f6" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Основна сітка (Major Grid Lines) -->
  <line x1="266.7" y1="90" x2="266.7" y2="450" stroke="#e1e4e8" stroke-width="1"/>
  <line x1="433.3" y1="90" x2="433.3" y2="450" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Базова лінія Rs/R0 = 1.0 -->
  <line x1="100" y1="270" x2="600" y2="270" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- Засічки та підписи осі Y -->
  <line x1="94" y1="90" x2="100" y2="90" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="94" font-size="12" fill="#1a1a1a" text-anchor="end">10.0</text>

  <line x1="94" y1="144.2" x2="100" y2="144.2" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="148" font-size="12" fill="#6b7280" text-anchor="end">5.0</text>

  <line x1="94" y1="215.8" x2="100" y2="215.8" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="220" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>

  <line x1="94" y1="270" x2="100" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="274" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">1.0</text>

  <line x1="94" y1="324.2" x2="100" y2="324.2" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="328" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>

  <line x1="94" y1="395.8" x2="100" y2="395.8" stroke="#6b7280" stroke-width="1"/>
  <text x="90" y="400" font-size="12" fill="#6b7280" text-anchor="end">0.2</text>

  <line x1="94" y1="450" x2="100" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="454" font-size="12" fill="#1a1a1a" text-anchor="end">0.1</text>

  <!-- Засічки та підписи осі X -->
  <line x1="100" y1="450" x2="100" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">10</text>

  <line x1="216.5" y1="450" x2="216.5" y2="456" stroke="#6b7280" stroke-width="1"/>
  <text x="216.5" y="468" font-size="12" fill="#6b7280" text-anchor="middle">50</text>

  <line x1="266.7" y1="450" x2="266.7" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="266.7" y="468" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">100</text>

  <line x1="383.2" y1="450" x2="383.2" y2="456" stroke="#6b7280" stroke-width="1"/>
  <text x="383.2" y="468" font-size="12" fill="#6b7280" text-anchor="middle">500</text>

  <line x1="433.3" y1="450" x2="433.3" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="433.3" y="468" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1000</text>

  <line x1="600" y1="450" x2="600" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">10000</text>

  <!-- Назва осі X -->
  <text x="350" y="488" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Концентрація газу, C (ppm)</text>

  <!-- Графіки залежностей -->

  <!-- 1. Чисте повітря (Clean Air) -->
  <line x1="100" y1="144.2" x2="600" y2="144.2" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="590" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Чисте повітря (Rs/R0 ≈ 5.0)</text>

  <!-- 2. LPG / CH4 -->
  <path d="M 100 94.1 L 266.7 141.5 L 433.3 152.0 L 535 160" fill="none" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="545" y="164" font-size="12" font-weight="bold" fill="#7f8c8d" text-anchor="start">LPG / CH₄</text>

  <!-- 3. Alcohol -->
  <path d="M 100 98.5 L 266.7 172.0 L 433.3 205.0 L 535 225" fill="none" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="545" y="229" font-size="12" font-weight="bold" fill="#8e44ad" text-anchor="start">Alcohol</text>

  <!-- 4. H2 -->
  <path d="M 100 107.9 L 266.7 215.8 L 433.3 297.0 L 535 350" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="545" y="354" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="start">H₂</text>

  <!-- 5. Трикутник нахилу (Slope Triangle) для CO -->
  <polygon points="266.7,270 433.3,270 433.3,382.5" fill="#eaf0fd" opacity="0.6" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Позначки катетів трикутника -->
  <text x="425" y="284" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Δ lg(C) = 1.0 (декада)</text>
  <text x="442" y="291" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">Δ lg(Rs/R0) = -0.625</text>

  <!-- Картка з формулою у порожній зоні внизу ліворуч -->
  <rect x="120" y="340" width="140" height="68" fill="#ffffff" stroke="#2457d6" stroke-width="1.2" rx="6"/>
  <text x="130" y="357" font-size="12" font-weight="bold" fill="#2457d6">Нахил m ≈ 0.625</text>
  <text x="130" y="375" font-size="11" fill="#1a1a1a">lg(Rs/R0) = -m · lg(C)</text>
  <text x="130" y="393" font-size="10" fill="#6b7280">ppm = 10^[(lg(Rs/R0)-b)/(-m)]</text>

  <!-- 6. Основна градуювальна пряма CO (Чадний газ) -->
  <line x1="100" y1="157.0" x2="535" y2="453.0" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Калібрувальна точка R0 (100 ppm CO, Rs/R0 = 1.0) -->
  <circle cx="266.7" cy="270" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="2"/>
  <rect x="180" y="285" width="76" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="218" y="299" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">R0 (100 ppm)</text>

  <!-- Точка при 1000 ppm CO -->
  <circle cx="433.3" cy="382.5" r="4" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Лейбл прямої CO (розміщений безперешкодно нижче лінії) -->
  <rect x="330" y="415" width="85" height="24" fill="#2457d6" rx="4"/>
  <text x="372.5" y="431" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CO (1.4 В)</text>


  <!-- ПРАВА ІНФОРМАЦІЙНА ПАНЕЛЬ -->

  <!-- Картка 1: Легенда газів -->
  <rect x="630" y="90" width="300" height="146" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="645" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Легенда та селективність</text>

  <line x1="645" y1="130" x2="675" y2="130" stroke="#2457d6" stroke-width="3.5"/>
  <circle cx="660" cy="130" r="3.5" fill="#2457d6"/>
  <text x="685" y="134" font-size="12" font-weight="bold" fill="#2457d6">CO (Чадний газ) — Цільовий</text>

  <line x1="645" y1="152" x2="675" y2="152" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="685" y="156" font-size="12" fill="#1a1a1a">H₂ (Водень) — Супутній</text>

  <line x1="645" y1="174" x2="675" y2="174" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="685" y="178" font-size="12" fill="#1a1a1a">Alcohol (Пари спирту)</text>

  <line x1="645" y1="196" x2="675" y2="196" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="685" y="200" font-size="12" fill="#1a1a1a">LPG, CH₄ (Горючі гази)</text>

  <line x1="645" y1="218" x2="675" y2="218" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="685" y="222" font-size="12" fill="#c0392b">Clean Air (Чисте повітря)</text>


  <!-- Картка 2: Фаза вимірювання -->
  <rect x="630" y="248" width="300" height="94" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="645" y="268" font-size="13" font-weight="bold" fill="#2457d6">Фаза вимірювання (1.4 В)</text>
  <text x="645" y="288" font-size="12" fill="#1a1a1a">• Напруга нагрівача VH = 1.4 В (90 с)</text>
  <text x="645" y="306" font-size="12" fill="#1a1a1a">• Температура Т = 20 °C, вологість 65%</text>
  <text x="645" y="324" font-size="12" fill="#1a1a1a">• R0 = опір при 100 ppm CO (1.4 В)</text>


  <!-- Картка 3: Математична модель -->
  <rect x="630" y="354" width="300" height="96" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="645" y="374" font-size="13" font-weight="bold" fill="#27ae60">Розрахунок концентрації ppm</text>
  <text x="645" y="394" font-size="12" font-weight="bold" fill="#1a1a1a">ppm = 10^[(lg(Rs/R0) - b) / (-m)]</text>
  <text x="645" y="412" font-size="12" fill="#1a1a1a">m ≈ 0.625 (нахил у log-log масштабі)</text>
  <text x="645" y="430" font-size="12" fill="#6b7280">b ≈ 1.25 (константа градуювання)</text>


  <!-- НИЖНЯ ІНФОРМАЦІЙНА СМУГА -->
  <rect x="100" y="508" width="830" height="32" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <circle cx="115" cy="524" r="4.5" fill="#27ae60"/>
  <text x="128" y="528" font-size="12"><tspan font-weight="bold" fill="#27ae60">Висновок: </tspan><tspan fill="#1a1a1a">Висока селективність до CO забезпечується фазою 1.4 В, а лінійність у log-log масштабі спрощує розрахунок ppm.</tspan></text>
</svg>
