<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Градуювальна крива чутливості MQ-7 у логарифмічних координатах</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">У логарифмічній шкалі залежність lg(Rs/R0) від lg(C) є лінійною: lg(Rs/R0) = lg(a) + b · lg(C)</text>

  <!-- Left Main Graph Panel -->
  <rect x="30" y="75" width="540" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graph Plot Inner Area -->
  <rect x="120" y="130" width="410" height="300" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Y-axis Header Label -->
  <text x="45" y="98" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Відносний опір Rs/R0 (шкала lg Rs/R0)</text>

  <!-- Horizontal Grid Lines & Y Ticks -->
  <line x1="120" y1="170" x2="530" y2="170" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="110" y="174" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>

  <line x1="120" y1="230" x2="530" y2="230" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="110" y="234" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="end">1.0</text>

  <line x1="120" y1="290" x2="530" y2="290" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="110" y="294" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>

  <line x1="120" y1="370" x2="530" y2="370" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="110" y="374" font-size="12" fill="#6b7280" text-anchor="end">0.2</text>

  <line x1="120" y1="430" x2="530" y2="430" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="110" y="434" font-size="12" fill="#6b7280" text-anchor="end">0.1</text>

  <!-- Vertical Grid Lines (Segmented to avoid text overlaps) -->
  <line x1="160" y1="130" x2="160" y2="305" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="160" y1="360" x2="160" y2="430" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="160" y="448" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
  <text x="160" y="466" font-size="12" fill="#6b7280" text-anchor="middle">lg C = 1</text>

  <line x1="280" y1="130" x2="280" y2="380" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="280" y1="400" x2="280" y2="430" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="280" y="448" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">100</text>
  <text x="280" y="466" font-size="12" fill="#6b7280" text-anchor="middle">lg C = 2</text>

  <line x1="400" y1="130" x2="400" y2="430" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="400" y="448" font-size="12" fill="#6b7280" text-anchor="middle">1000</text>
  <text x="400" y="466" font-size="12" fill="#6b7280" text-anchor="middle">lg C = 3</text>

  <line x1="520" y1="150" x2="520" y2="312" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="520" y1="350" x2="520" y2="430" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="520" y="448" font-size="12" fill="#6b7280" text-anchor="middle">10000</text>
  <text x="520" y="466" font-size="12" fill="#6b7280" text-anchor="middle">lg C = 4</text>

  <!-- Axis Lines with Arrows -->
  <line x1="120" y1="430" x2="120" y2="118" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="120" y1="430" x2="542" y2="430" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- X-axis Main Label -->
  <text x="325" y="515" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Концентрація чадного газу C, ppm (шкала lg C)</text>

  <!-- Clean Air Reference Line (Rs/R0 baseline) -->
  <line x1="120" y1="150" x2="530" y2="150" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="315" y="144" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Чисте повітря (базовий опір R0)</text>

  <!-- LPG / CH4 Reference Line -->
  <line x1="160" y1="240" x2="520" y2="312" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="395" y="330" font-size="12" fill="#6b7280" text-anchor="start">LPG / CH4 (суміжні гази)</text>

  <!-- CO Sensitivity Curve (Main Accent Line) -->
  <line x1="190" y1="132.5" x2="460" y2="425" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- CO Line Title Badge -->
  <rect x="190" y="105" width="110" height="24" rx="4" fill="#2457d6"/>
  <text x="245" y="121" font-size="12" font-weight="bold" fill="white" text-anchor="middle">CO (Чадний газ)</text>

  <!-- Slope Triangle (Triangulum for b coefficient) -->
  <line x1="280" y1="230" x2="400" y2="230" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="230" x2="400" y2="360" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="340" y="218" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δ lg(C) = 1.0</text>
  <text x="412" y="345" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Δ lg(Rs/R0) = -0.65</text>

  <!-- Slope Badge & Connector Arrow -->
  <rect x="150" y="310" width="120" height="45" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="210" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">b = Δy / Δx = -0.65</text>
  <text x="210" y="344" font-size="12" fill="#1a1a1a" text-anchor="middle">(наклон прямої)</text>
  <line x1="270" y1="330" x2="330" y2="284" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)" stroke-dasharray="3 2"/>

  <!-- Key Calibration Points on CO Line -->
  <!-- Point 1: (100 ppm, 1.0) -->
  <circle cx="280" cy="230" r="6" fill="#2457d6" stroke="white" stroke-width="2"/>
  <text x="290" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">(100 ppm; 1.0)</text>

  <!-- Point 2: (1000 ppm, 0.22) -->
  <circle cx="400" cy="360" r="6" fill="#2457d6" stroke="white" stroke-width="2"/>
  <text x="380" y="395" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">(1000 ppm; 0.22)</text>

  <!-- Right Explanation Panels -->

  <!-- Panel 1: Mathematical Model -->
  <rect x="592" y="75" width="338" height="135" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="606" y="87" width="160" height="24" rx="4" fill="#2457d6"/>
  <text x="614" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="start">1. Математична модель</text>

  <text x="606" y="128" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Фізична степенева залежність:</text>
  <rect x="606" y="136" width="310" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="761" y="156" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Rs / R0 = a · C^b</text>

  <text x="606" y="182" font-size="12" fill="#6b7280" text-anchor="start">Логарифмування обох частин:</text>
  <text x="761" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">lg(Rs / R0) = lg(a) + b · lg(C)</text>

  <!-- Panel 2: Geometric Meaning of Parameters -->
  <rect x="592" y="222" width="338" height="165" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="606" y="234" width="210" height="24" rx="4" fill="#6b7280"/>
  <text x="614" y="250" font-size="12" font-weight="bold" fill="white" text-anchor="start">2. Зміст коефіцієнтів a та b</text>

  <text x="606" y="275" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">• Коефіцієнт нахилу b (b &lt; 0):</text>
  <text x="618" y="292" font-size="12" fill="#6b7280" text-anchor="start">Визначає чутливість. Для CO b ≈ -0.65.</text>
  <text x="618" y="309" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">b = Δ lg(Rs/R0) / Δ lg(C)</text>

  <text x="606" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">• Початковий коефіцієнт a:</text>
  <text x="618" y="350" font-size="12" fill="#6b7280" text-anchor="start">Зсув прямої (значення Rs/R0 при C = 1 ppm).</text>
  <text x="618" y="367" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">lg(a) = lg(Rs/R0) - b · lg(C)</text>

  <!-- Panel 3: Calculation Formula for Microcontroller -->
  <rect x="592" y="399" width="338" height="141" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="606" y="411" width="220" height="24" rx="4" fill="#27ae60"/>
  <text x="614" y="427" font-size="12" font-weight="bold" fill="white" text-anchor="start">3. Формула для мікроконтролера</text>

  <text x="606" y="450" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Обчислення концентрації C (ppm):</text>
  <rect x="606" y="458" width="310" height="34" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="761" y="480" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C = 10 ^ [ (lg(Rs/R0) - lg(a)) / b ]</text>

  <text x="761" y="507" font-size="12" fill="#6b7280" text-anchor="middle">Або еквівалентно: C = ( (Rs/R0) / a ) ^ (1/b)</text>
  <text x="761" y="524" font-size="12" fill="#1a1a1a" text-anchor="middle">Пряма у логарифмах спрощує калібрування</text>
</svg>
