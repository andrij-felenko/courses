<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="white"/>

  <!-- Заголовок -->
  <text x="360" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема силового ключа для нагрівача MQ-7</text>
  <text x="360" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Керування напругою (5 В / 1,4 В) за допомогою ШІМ-сигналу від мікроконтролера</text>

  <!-- MCU -->
  <rect x="20" y="160" width="80" height="120" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="60" y="200" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
  <text x="92" y="225" font-size="13" fill="#1a1a1a" text-anchor="end">PWM</text>

  <!-- Ланцюг затвора -->
  <path d="M 100,220 L 150,220" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <rect x="150" y="212" width="50" height="16" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="175" y="200" font-size="13" fill="#1a1a1a" text-anchor="middle">R1</text>
  <text x="175" y="253" font-size="13" fill="#6b7280" text-anchor="middle">1 кОм</text>
  
  <path d="M 200,220 L 290,220" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <circle cx="240" cy="220" r="3" fill="#1a1a1a"/>
  
  <path d="M 240,220 L 240,250" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <rect x="232" y="250" width="16" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="215" y="270" font-size="13" fill="#1a1a1a" text-anchor="end">R2</text>
  <text x="215" y="290" font-size="13" fill="#6b7280" text-anchor="end">10 кОм</text>
  <path d="M 240,300 L 240,320" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <path d="M 225,320 L 255,320 M 232,325 L 248,325 M 238,330 L 242,330" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- MOSFET -->
  <circle cx="310" cy="220" r="35" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 290,200 L 290,240" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M 300,192 L 300,208 M 300,212 L 300,228 M 300,232 L 300,248" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  
  <path d="M 300,200 L 320,200 L 320,170" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M 300,240 L 320,240 L 320,320" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M 300,220 L 320,220 L 320,240" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <path d="M 300,220 L 312,216 L 312,224 Z" fill="#1a1a1a"/>
  <circle cx="320" cy="240" r="3" fill="#1a1a1a"/>
  
  <path d="M 305,320 L 335,320 M 312,325 L 328,325 M 318,330 L 322,330" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <text x="270" y="195" font-size="12" fill="#6b7280" text-anchor="end">G</text>
  <text x="330" y="175" font-size="12" fill="#6b7280" text-anchor="start">D</text>
  <text x="330" y="265" font-size="12" fill="#6b7280" text-anchor="start">S</text>

  <text x="360" y="220" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1</text>
  <text x="360" y="238" font-size="13" fill="#1a1a1a" text-anchor="start">N-MOSFET</text>
  <text x="360" y="253" font-size="12" fill="#6b7280" text-anchor="start">(IRLZ44N)</text>

  <!-- Нагрівач MQ-7 -->
  <rect x="280" y="100" width="130" height="85" fill="none" stroke="#6b7280" stroke-dasharray="5,5" stroke-width="1.5" rx="4"/>
  <text x="340" y="118" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">MQ-7</text>
  <text x="340" y="135" font-size="12" fill="#1a1a1a" text-anchor="start">Нагрівач</text>
  <text x="340" y="150" font-size="12" fill="#6b7280" text-anchor="start">(33 Ом)</text>

  <rect x="312" y="120" width="16" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 320,120 L 320,94" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <circle cx="320" cy="90" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="75" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+5 В</text>

  <!-- Панель з інформацією про ШІМ -->
  <rect x="450" y="90" width="240" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="465" y="120" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">ШІМ-керування напругою:</text>
  <text x="465" y="145" font-size="13" fill="#1a1a1a" text-anchor="start">• 5 В (ШІМ 100%) — 60 с</text>
  <text x="475" y="165" font-size="12" fill="#6b7280" text-anchor="start">Фаза очищення сенсора</text>
  <text x="465" y="195" font-size="13" fill="#1a1a1a" text-anchor="start">• 1,4 В (ШІМ ~28%) — 90 с</text>
  <text x="475" y="215" font-size="12" fill="#6b7280" text-anchor="start">Фаза вимірювання CO</text>

</svg>
