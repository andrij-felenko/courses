<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність відносного опору MQ-7 від температури та вологості</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Двовимірна сітка поправок компенсує нелінійний дрейф Rs/R0 для точного обчислення CO</text>

  <!-- Left Container: Plot Area -->
  <rect x="40" y="70" width="580" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Y-axis Header / Title -->
  <text x="60" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Коефіцієнт k(T, RH) = Rs / R0</text>

  <!-- Horizontal Grid Lines -->
  <!-- y = 140 (1.6) -->
  <line x1="110" y1="140" x2="160" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="140" x2="355" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="545" y1="140" x2="555" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- y = 194 (1.4) -->
  <line x1="110" y1="194" x2="555" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- y = 248 (1.2) -->
  <line x1="110" y1="248" x2="555" y2="248" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- y = 302 (1.0) -->
  <line x1="110" y1="302" x2="310" y2="302" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="302" x2="355" y2="302" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="302" x2="555" y2="302" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- y = 356 (0.8) -->
  <line x1="110" y1="356" x2="340" y2="356" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="475" y1="356" x2="555" y2="356" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Vertical Grid Lines -->
  <!-- x = 110 (-10°C) -->
  <line x1="110" y1="120" x2="110" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- x = 180 (0°C) -->
  <line x1="180" y1="160" x2="180" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- x = 250 (10°C) -->
  <line x1="250" y1="160" x2="250" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- x = 320 (20°C) -->
  <line x1="320" y1="160" x2="320" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- x = 390 (30°C) -->
  <line x1="390" y1="180" x2="390" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- x = 460 (40°C) -->
  <line x1="460" y1="180" x2="460" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- x = 530 (50°C) -->
  <line x1="530" y1="180" x2="530" y2="410" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Plot Axes Lines -->
  <line x1="110" y1="120" x2="110" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="110" y1="410" x2="530" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Y-axis Tick Marks & Labels -->
  <line x1="105" y1="140" x2="110" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="102" y="144" font-size="12" fill="#1a1a1a" text-anchor="end">1.6</text>

  <line x1="105" y1="194" x2="110" y2="194" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="102" y="198" font-size="12" fill="#1a1a1a" text-anchor="end">1.4</text>

  <line x1="105" y1="248" x2="110" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="102" y="252" font-size="12" fill="#1a1a1a" text-anchor="end">1.2</text>

  <line x1="105" y1="302" x2="110" y2="302" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="102" y="306" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="end">1.0</text>

  <line x1="105" y1="356" x2="110" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="102" y="360" font-size="12" fill="#1a1a1a" text-anchor="end">0.8</text>

  <line x1="105" y1="410" x2="110" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="102" y="414" font-size="12" fill="#1a1a1a" text-anchor="end">0.6</text>

  <!-- X-axis Tick Marks & Labels -->
  <line x1="110" y1="410" x2="110" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">-10°C</text>

  <line x1="180" y1="410" x2="180" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="180" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">0°C</text>

  <line x1="250" y1="410" x2="250" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="250" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">10°C</text>

  <line x1="320" y1="410" x2="320" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="430" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">20°C</text>

  <line x1="390" y1="410" x2="390" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">30°C</text>

  <line x1="460" y1="410" x2="460" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">40°C</text>

  <line x1="530" y1="410" x2="530" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="530" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">50°C</text>

  <!-- X-axis Title -->
  <text x="320" y="460" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температура навколишнього середовища T (°C)</text>

  <!-- Humidity Curves -->
  <!-- 33% RH -->
  <path d="M 110 140 C 210 190, 340 270, 530 356" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <text x="538" y="360" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="start">33% RH</text>

  <!-- 65% RH (Standard Reference) -->
  <path d="M 110 181 C 210 230, 340 320, 530 380" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="538" y="384" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">65% RH</text>

  <!-- 85% RH -->
  <path d="M 110 221 C 210 265, 340 345, 530 396" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="538" y="400" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">85% RH</text>

  <!-- 95% RH -->
  <path d="M 110 248 C 210 290, 340 360, 530 407" fill="none" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="538" y="416" font-size="12" font-weight="bold" fill="#8e44ad" text-anchor="start">95% RH</text>

  <!-- Calibration Point Callout & Base Point -->
  <rect x="165" y="102" width="170" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="250" y="121" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Калібрування 20°C, 65%</text>
  <text x="250" y="139" font-size="12" fill="#1a1a1a" text-anchor="middle">Базова точка: R0 (k = 1.00)</text>
  <line x1="250" y1="152" x2="315" y2="296" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="320" cy="302" r="5" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>

  <!-- Calibration Point Badge -->
  <rect x="326" y="278" width="28" height="18" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="340" y="291" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R0</text>

  <!-- 2D Interpolation Mesh Polygon (Quad k11-k21-k22-k12) -->
  <polygon points="390,332 460,358 460,382 390,362" fill="#2457d6" fill-opacity="0.15" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Mesh Nodes (Circles) -->
  <circle cx="390" cy="332" r="4" fill="#2457d6"/>
  <circle cx="460" cy="358" r="4" fill="#2457d6"/>
  <circle cx="390" cy="362" r="4" fill="#2457d6"/>
  <circle cx="460" cy="382" r="4" fill="#2457d6"/>

  <!-- Node Badges & Connectors -->
  <!-- Node k11 -->
  <rect x="350" y="280" width="28" height="18" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="364" y="293" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">k₁₁</text>
  <line x1="364" y1="298" x2="388" y2="330" stroke="#2457d6" stroke-width="1"/>

  <!-- Node k21 -->
  <rect x="472" y="334" width="28" height="18" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="486" y="347" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">k₂₁</text>
  <line x1="472" y1="347" x2="464" y2="355" stroke="#2457d6" stroke-width="1"/>

  <!-- Node k12 -->
  <rect x="348" y="370" width="28" height="18" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="362" y="383" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">k₁₂</text>
  <line x1="370" y1="375" x2="386" y2="365" stroke="#2457d6" stroke-width="1"/>

  <!-- Node k22 -->
  <rect x="472" y="392" width="28" height="18" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="486" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">k₂₂</text>
  <line x1="472" y1="397" x2="464" y2="385" stroke="#2457d6" stroke-width="1"/>

  <!-- Measured Point P Callout Box -->
  <rect x="360" y="102" width="180" height="68" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="450" y="121" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Виміряна точка P(T, RH)</text>
  <text x="450" y="139" font-size="12" fill="#1a1a1a" text-anchor="middle">T = 35°C, RH = 75%</text>
  <text x="450" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Обчислено k_comp ≈ 0.82</text>
  <line x1="450" y1="170" x2="430" y2="348" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-danger)"/>

  <!-- Measured Point P Dot & Badge -->
  <circle cx="425" cy="358.5" r="6" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <rect x="410" y="342" width="18" height="18" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="419" y="355" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">P</text>

  <!-- Right Container: Algorithm Panel -->
  <rect x="640" y="70" width="280" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Алгоритм компенсації 2D</text>
  <line x1="655" y1="104" x2="905" y2="104" stroke="#d0d7de" stroke-width="1"/>

  <!-- Block 1: Problem / Drift -->
  <rect x="654" y="112" width="252" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="664" y="129" font-size="12" font-weight="bold" fill="#c0392b">1. Джерела похибок (дрейф):</text>
  <text x="664" y="145" font-size="12" fill="#1a1a1a">Коливання T та RH зміщують Rs.</text>
  <text x="664" y="161" font-size="12" fill="#1a1a1a">Без поправки хиба концентрації</text>
  <text x="664" y="177" font-size="12" font-weight="bold" fill="#c0392b">CO сягає від 30% до 50%!</text>

  <!-- Block 2: 2D Bilinear Mesh -->
  <rect x="654" y="198" width="252" height="146" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="664" y="215" font-size="12" font-weight="bold" fill="#2457d6">2. Двовимірна інтерполяція:</text>
  <text x="664" y="231" font-size="12" fill="#1a1a1a">Пошук вузлів сітки T₁, T₂, H₁, H₂</text>
  <text x="664" y="247" font-size="12" fill="#1a1a1a">навколо виміряного P(T, RH).</text>
  <text x="664" y="265" font-size="12" fill="#1a1a1a">Обчислення коефіцієнта:</text>
  <text x="674" y="283" font-size="12" font-weight="bold" fill="#2457d6">k(T, H) = Interp2D(T, RH)</text>
  <text x="664" y="301" font-size="12" fill="#1a1a1a">Точний поправочний коефіцієнт:</text>
  <text x="674" y="319" font-size="12" font-weight="bold" fill="#2457d6">k_comp = k(35°C, 75%) ≈ 0.82</text>
  <text x="664" y="335" font-size="12" fill="#6b7280">(значення з інтерполяційної сітки)</text>

  <!-- Block 3: Formula & Result -->
  <rect x="654" y="356" width="252" height="116" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="664" y="373" font-size="12" font-weight="bold" fill="#27ae60">3. Корекція та розрахунок CO:</text>
  <text x="664" y="391" font-size="12" font-weight="bold" fill="#1a1a1a">Rs_norm = Rs_measured / k_comp</text>
  <text x="664" y="409" font-size="12" fill="#1a1a1a">Підстановка у калібрувальну криву:</text>
  <text x="664" y="427" font-size="12" font-weight="bold" fill="#27ae60">ppm CO = A × (Rs_norm / R0)^b</text>
  <text x="664" y="445" font-size="12" fill="#1a1a1a">де R0 — опір за 20°C / 65% RH</text>
  <text x="664" y="463" font-size="12" font-weight="bold" fill="#27ae60">Результат: точна концентрація CO</text>
</svg>
