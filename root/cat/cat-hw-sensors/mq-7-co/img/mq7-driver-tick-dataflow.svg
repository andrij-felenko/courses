<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потік даних у неблокуючому драйвері MQ-7 (mq7_tick)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Драйвер перемикає 5.0V/1.4V фази, оцифровує V_out та обчислює ppm CO</text>

  <!-- ПАНЕЛЬ 1: Вхід і стан -->
  <rect x="30" y="85" width="205" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="132.5" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Вхід і стан драйвера</text>
  <text x="132.5" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Виклик mq7_tick(&amp;drv, now)</text>

  <!-- Внутрішній блок 1.1: Системний квант -->
  <rect x="42" y="140" width="181" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="132.5" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Поточний час now_ms</text>
  <text x="132.5" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка: now - t_start</text>
  <text x="132.5" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Періодичність: 10..100 мс</text>

  <!-- Внутрішній блок 1.2: Контекст стану -->
  <rect x="42" y="232" width="181" height="135" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="132.5" y="254" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контекст mq7_t</text>
  <text x="52" y="274" font-size="12" fill="#1a1a1a" text-anchor="start">• state: HEAT / MEAS</text>
  <text x="52" y="293" font-size="12" fill="#1a1a1a" text-anchor="start">• t_phase_start: ms</text>
  <text x="52" y="312" font-size="12" fill="#1a1a1a" text-anchor="start">• R_0: базовий опір</text>
  <text x="52" y="331" font-size="12" fill="#1a1a1a" text-anchor="start">• T_env, RH_env</text>
  <text x="52" y="350" font-size="12" fill="#6b7280" text-anchor="start">• raw_adc: зчитування</text>

  <!-- Внутрішній блок 1.3: Діагностика -->
  <rect x="42" y="384" width="181" height="112" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="132.5" y="406" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Вхідна діагностика</text>
  <text x="52" y="426" font-size="12" fill="#1a1a1a" text-anchor="start">• Перевірка живлення</text>
  <text x="52" y="445" font-size="12" fill="#1a1a1a" text-anchor="start">• Перевірка готовності</text>
  <text x="52" y="464" font-size="12" fill="#1a1a1a" text-anchor="start">• Обробка таймауту</text>
  <text x="52" y="483" font-size="12" fill="#c0392b" text-anchor="start">• Захист від збоїв</text>


  <!-- ПАНЕЛЬ 2: Керування фазами (FSM) -->
  <rect x="250" y="85" width="215" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="357.5" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Скінченний автомат</text>
  <text x="357.5" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Цикл нагріву та зчитування</text>

  <!-- Внутрішній блок 2.1: Фаза 1 -->
  <rect x="262" y="140" width="191" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="357.5" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 1: Очищення (60 с)</text>
  <text x="272" y="182" font-size="12" fill="#1a1a1a" text-anchor="start">• V_heat = 5.0 В (PWM 100%)</text>
  <text x="272" y="201" font-size="12" fill="#1a1a1a" text-anchor="start">• Спалювання залишкового CO</text>
  <text x="272" y="220" font-size="12" fill="#6b7280" text-anchor="start">• АЦП вимкнено</text>

  <!-- Стрілка фаза 1 -> фаза 2 -->
  <line x1="357.5" y1="235" x2="357.5" y2="257" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="367" y="249" font-size="12" fill="#6b7280" text-anchor="start">60 с минуло</text>

  <!-- Внутрішній блок 2.2: Фаза 2 -->
  <rect x="262" y="260" width="191" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="357.5" y="282" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза 2: Вимірювання (90 с)</text>
  <text x="272" y="302" font-size="12" fill="#1a1a1a" text-anchor="start">• V_heat = 1.4 В (PWM ~28%)</text>
  <text x="272" y="321" font-size="12" fill="#1a1a1a" text-anchor="start">• Охолодження і адсорбція</text>
  <text x="272" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">• Зчитування АЦП: ТАК</text>
  <text x="272" y="357" font-size="12" fill="#6b7280" text-anchor="start">  (наприкінці фази)</text>

  <!-- Стрілка фаза 2 -> тригер -->
  <line x1="357.5" y1="365" x2="357.5" y2="387" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="367" y="379" font-size="12" fill="#2457d6" text-anchor="start">90 с минуло</text>

  <!-- Внутрішній блок 2.3: Тригер АЦП -->
  <rect x="262" y="390" width="191" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="357.5" y="412" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Фіксація V_out АЦП</text>
  <text x="272" y="431" font-size="12" fill="#1a1a1a" text-anchor="start">• Збереження raw_adc</text>
  <text x="272" y="449" font-size="12" fill="#1a1a1a" text-anchor="start">• Скидання таймера фази</text>
  <text x="272" y="467" font-size="12" fill="#1a1a1a" text-anchor="start">• Перехід до Фази 1</text>
  <text x="272" y="485" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">• Запуск обчислень -&gt;</text>


  <!-- ПАНЕЛЬ 3: Обробка сигналу та математика -->
  <rect x="480" y="85" width="225" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="592.5" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Математичний розрахунок</text>
  <text x="592.5" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення АЦП -&gt; R_s -&gt; ppm</text>

  <!-- Внутрішній блок 3.1: Напруга -->
  <rect x="492" y="140" width="201" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="592.5" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Напруга виходу V_out</text>
  <text x="502" y="182" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">V_out = ADC · V_ref / 4095</text>
  <text x="502" y="201" font-size="12" fill="#6b7280" text-anchor="start">• V_ref = 3.3 В (MCU ADC)</text>
  <text x="502" y="220" font-size="12" fill="#6b7280" text-anchor="start">• 12-біт роздільна здатність</text>

  <!-- Стрілка 3.1 -> 3.2 -->
  <line x1="592.5" y1="235" x2="592.5" y2="252" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Внутрішній блок 3.2: Опір сенсора -->
  <rect x="492" y="255" width="201" height="105" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="592.5" y="277" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Опір сенсора R_s</text>
  <text x="502" y="297" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_s = R_L · (V_cc / V_out - 1)</text>
  <text x="502" y="316" font-size="12" fill="#6b7280" text-anchor="start">• R_L — навантаж. резистор</text>
  <text x="502" y="334" font-size="12" fill="#6b7280" text-anchor="start">• R_s,adj = R_s / f(T, RH)</text>
  <text x="502" y="351" font-size="12" fill="#6b7280" text-anchor="start">  (темп. компенсація)</text>

  <!-- Стрілка 3.2 -> 3.3 -->
  <line x1="592.5" y1="360" x2="592.5" y2="377" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Внутрішній блок 3.3: Концентрація ppm -->
  <rect x="492" y="380" width="201" height="115" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="592.5" y="402" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Концентрація ppm CO</text>
  <text x="502" y="422" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">ratio = R_s,adj / R_0</text>
  <text x="502" y="441" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">ppm = A · (ratio)^B</text>
  <text x="502" y="460" font-size="12" fill="#6b7280" text-anchor="start">• A, B — логарифм. коеф.</text>
  <text x="502" y="478" font-size="12" fill="#6b7280" text-anchor="start">• R_0 — опір калібрування</text>


  <!-- ПАНЕЛЬ 4: Вихідні дані -->
  <rect x="720" y="85" width="210" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="825" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Вихідні дані</text>
  <text x="825" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Структура mq7_result_t</text>

  <!-- Внутрішній блок 4.1: Успіх -->
  <rect x="732" y="140" width="186" height="205" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="825" y="162" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Успішне вимірювання</text>
  <text x="742" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">mq7_result_t:</text>
  <text x="742" y="204" font-size="12" fill="#1a1a1a" text-anchor="start">• status = MQ7_OK</text>
  <text x="742" y="225" font-size="12" fill="#1a1a1a" text-anchor="start">• ppm_co = 14.2</text>
  <text x="742" y="246" font-size="12" fill="#1a1a1a" text-anchor="start">• R_s = 16.8 кОм</text>
  <text x="742" y="267" font-size="12" fill="#1a1a1a" text-anchor="start">• R_0 = 10.0 кОм</text>
  <text x="742" y="288" font-size="12" fill="#1a1a1a" text-anchor="start">• is_ready = true</text>
  <text x="742" y="308" font-size="12" fill="#6b7280" text-anchor="start">• Оновлення додатку</text>
  <text x="742" y="327" font-size="12" fill="#6b7280" text-anchor="start">• Дані актуальні</text>

  <!-- Внутрішній блок 4.2: Помилки -->
  <rect x="732" y="365" width="186" height="130" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="825" y="387" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Аварійні коди</text>
  <text x="742" y="408" font-size="12" fill="#c0392b" text-anchor="start">• ERR_HEATER_OPEN</text>
  <text x="742" y="427" font-size="12" fill="#c0392b" text-anchor="start">• ERR_RANGE_EXCEEDED</text>
  <text x="742" y="446" font-size="12" fill="#c0392b" text-anchor="start">• ERR_UNCALIBRATED</text>
  <text x="742" y="465" font-size="12" fill="#6b7280" text-anchor="start">• is_ready = false</text>
  <text x="742" y="483" font-size="12" fill="#6b7280" text-anchor="start">• Блокування показів</text>


  <!-- МІЖПАНЕЛЬНІ СТРІЛКИ ПОТОКУ ДАНИХ -->

  <!-- 1. З Панелі 1 у Панель 2 (Виклик тіка) -->
  <path d="M 223 177.5 H 259" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 2. З Панелі 2 (Фіксація АЦП) у Панель 3 (Напруга V_out) -->
  <path d="M 453 431 H 472.5 V 187.5 H 489" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- 3. З Панелі 3 (Обчислення ppm) у Панель 4 (Успішна структура) -->
  <path d="M 693 437.5 H 712.5 V 242.5 H 729" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 4. Лінія діагностики/помилок з Панелі 1 у Панель 4 (Аварійний блок) -->
  <path d="M 223 464 H 237.5 V 504 H 712.5 V 465 H 729" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
</svg>
