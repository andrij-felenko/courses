<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розводка виводів сенсора MQ-7 та готового модуля</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Призначення контактів окремого елемента (H-H, A-B) та інтерфейсного модуля (VCC, GND, AOUT, DOUT)</text>

  <!-- Panel 1: Standalone MQ-7 Element -->
  <rect x="30" y="80" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="95" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="116" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Окремий компонент MQ-7 (6 виводів)</text>

  <!-- Box A: Bottom View Diagram -->
  <rect x="45" y="137" width="190" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="155" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вигляд знизу (Contacts)</text>

  <!-- Sensor Pin Outline (Circle) -->
  <circle cx="140" cy="220" r="42" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="140" cy="220" r="28" fill="none" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Pins Diagram A -->
  <circle cx="140" cy="194" r="5" fill="#2457d6"/>
  <text x="140" y="182" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">H1</text>

  <circle cx="140" cy="246" r="5" fill="#2457d6"/>
  <text x="140" y="266" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">H2</text>

  <circle cx="162.5" cy="207" r="5" fill="#1a1a1a"/>
  <text x="185" y="206" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">A1</text>

  <circle cx="162.5" cy="233" r="5" fill="#1a1a1a"/>
  <text x="185" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">A2</text>

  <circle cx="117.5" cy="207" r="5" fill="#1a1a1a"/>
  <text x="95" y="206" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">B1</text>

  <circle cx="117.5" cy="233" r="5" fill="#1a1a1a"/>
  <text x="95" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">B2</text>

  <!-- Box B: Equivalent Schematic -->
  <rect x="245" y="137" width="205" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="347" y="155" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема</text>

  <!-- Terminals Left (A1, A2, B1, B2) -->
  <text x="260" y="179" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">A1</text>
  <line x1="265" y1="175" x2="295" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="260" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">A2</text>
  <line x1="265" y1="195" x2="295" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="295" cy="185" r="3" fill="#1a1a1a"/>

  <text x="260" y="239" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">B1</text>
  <line x1="265" y1="235" x2="295" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="260" y="259" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">B2</text>
  <line x1="265" y1="255" x2="295" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="295" cy="245" r="3" fill="#1a1a1a"/>

  <!-- Resistor Rs (Sensing element) -->
  <line x1="295" y1="185" x2="295" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="289" y="200" width="12" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="284" y1="225" x2="306" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="230" x2="295" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="306" y="219" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Rs</text>

  <!-- Heater Rh -->
  <text x="425" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">H1</text>
  <circle cx="425" cy="175" r="3" fill="#2457d6"/>
  <line x1="425" y1="175" x2="425" y2="200" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M425,200 Q430,205 425,210 Q420,215 425,220 Q430,225 425,230" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="425" y1="230" x2="425" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="425" cy="255" r="3" fill="#2457d6"/>
  <text x="425" y="275" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">H2</text>
  <text x="410" y="219" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Rh (нагрівач)</text>

  <!-- Table Panel 1: Standalone Pin Description -->
  <rect x="45" y="305" width="405" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="45" y="305" width="405" height="26" rx="6" fill="#eaf0fd"/>
  <text x="55" y="322" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Опис контактів елемента MQ-7</text>

  <!-- Row 1 -->
  <rect x="55" y="334" width="45" height="20" rx="3" fill="#2457d6"/>
  <text x="77.5" y="348" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">H, H</text>
  <text x="110" y="344" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Нагрівач:</tspan> Двофазне живлення H-H</text>
  <text x="110" y="358" font-size="12" fill="#6b7280" text-anchor="start">5 В / 60 с (очищення), 1,4 В / 90 с (вимір)</text>

  <!-- Row 2 -->
  <rect x="55" y="372" width="45" height="20" rx="3" fill="#1a1a1a"/>
  <text x="77.5" y="386" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A, A</text>
  <text x="110" y="382" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Електроди A:</tspan> Вхід живлення вимірювання</text>
  <text x="110" y="396" font-size="12" fill="#6b7280" text-anchor="start">З'єднані всередині, подається напруга V_H / V_C</text>

  <!-- Row 3 -->
  <rect x="55" y="410" width="45" height="20" rx="3" fill="#1a1a1a"/>
  <text x="77.5" y="424" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">B, B</text>
  <text x="110" y="420" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Електроди B:</tspan> Вихід на навантаження R_L</text>
  <text x="110" y="434" font-size="12" fill="#6b7280" text-anchor="start">З'єднані всередині, підключаються до АЦП і R_L</text>

  <!-- Row 4 Note -->
  <text x="55" y="460" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="start">✓ Пари A1-A2 та B1-B2 є взаємозамінними</text>


  <!-- Panel 2: MQ-7 Breakout Module -->
  <rect x="495" y="80" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="95" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="116" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Інтерфейсний модуль MQ-7 (4 виводи)</text>

  <!-- Box C: Module Layout Diagram -->
  <rect x="510" y="137" width="405" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Module PCB -->
  <rect x="525" y="150" width="280" height="130" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Sensor MQ-7 on PCB -->
  <circle cx="575" cy="215" r="32" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="575" cy="215" r="22" fill="#f4f6f8" stroke="#6b7280" stroke-dasharray="2,2"/>
  <text x="575" y="219" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MQ-7</text>

  <!-- Potentiometer 10k -->
  <rect x="635" y="165" width="36" height="36" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="653" cy="183" r="11" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="647" y1="183" x2="659" y2="183" stroke="#2457d6" stroke-width="1.5"/>
  <text x="653" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">10k R_L</text>

  <!-- LM393 IC -->
  <rect x="635" y="220" width="46" height="32" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="642" y1="216" x2="642" y2="220" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="650" y1="216" x2="650" y2="220" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="658" y1="216" x2="658" y2="220" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="666" y1="216" x2="666" y2="220" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="642" y1="252" x2="642" y2="256" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="650" y1="252" x2="650" y2="256" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="658" y1="252" x2="658" y2="256" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="666" y1="252" x2="666" y2="256" stroke="#1a1a1a" stroke-width="1"/>
  <text x="658" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LM393</text>

  <!-- Power & DOUT LEDs -->
  <circle cx="715" cy="180" r="5" fill="#27ae60"/>
  <text x="725" y="184" font-size="12" fill="#1a1a1a" text-anchor="start">PWR</text>

  <circle cx="715" cy="225" r="5" fill="#c0392b"/>
  <text x="725" y="229" font-size="12" fill="#1a1a1a" text-anchor="start">DOUT</text>

  <!-- Module Pins Connector -->
  <rect x="790" y="160" width="15" height="110" fill="#1a1a1a" rx="2"/>

  <!-- Pin 1: VCC -->
  <line x1="805" y1="175" x2="840" y2="175" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="845" y="165" width="55" height="20" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="872.5" y="179" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC</text>

  <!-- Pin 2: GND -->
  <line x1="805" y1="200" x2="840" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="845" y="190" width="55" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a"/>
  <text x="872.5" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Pin 3: DOUT -->
  <line x1="805" y1="225" x2="840" y2="225" stroke="#27ae60" stroke-width="2.5"/>
  <rect x="845" y="215" width="55" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="872.5" y="229" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DOUT</text>

  <!-- Pin 4: AOUT -->
  <line x1="805" y1="250" x2="840" y2="250" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="845" y="240" width="55" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="872.5" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AOUT</text>


  <!-- Table Panel 2: Module Pin Description -->
  <rect x="510" y="305" width="405" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="510" y="305" width="405" height="26" rx="6" fill="#eaf0fd"/>
  <text x="520" y="322" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Призначення виводів модуля MQ-7</text>

  <!-- Row 1 -->
  <rect x="520" y="334" width="45" height="20" rx="3" fill="#c0392b"/>
  <text x="542.5" y="348" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VCC</text>
  <text x="575" y="344" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Живлення (+5 В):</tspan> Двофазний цикл нагріву</text>
  <text x="575" y="358" font-size="12" fill="#6b7280" text-anchor="start">Подається 5 В (60 с) та 1,4 В (90 с) через драйвер</text>

  <!-- Row 2 -->
  <rect x="520" y="372" width="45" height="20" rx="3" fill="#1a1a1a"/>
  <text x="542.5" y="386" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>
  <text x="575" y="382" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Спільний провід:</tspan> 0 В (Земля)</text>
  <text x="575" y="396" font-size="12" fill="#6b7280" text-anchor="start">Спільне заземлення з мікроконтролером</text>

  <!-- Row 3 -->
  <rect x="520" y="410" width="45" height="20" rx="3" fill="#27ae60"/>
  <text x="542.5" y="424" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DOUT</text>
  <text x="575" y="420" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Цифровий вихід:</tspan> Логічний рівень (0 / 1)</text>
  <text x="575" y="434" font-size="12" fill="#6b7280" text-anchor="start">Сигнал компаратора LM393 при перевищенні порогу</text>

  <!-- Row 4 -->
  <rect x="520" y="448" width="45" height="20" rx="3" fill="#2457d6"/>
  <text x="542.5" y="462" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AOUT</text>
  <text x="575" y="458" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan font-weight="bold">Аналоговий вихід:</tspan> Напруга V_OUT на АЦП</text>
  <text x="575" y="472" font-size="12" fill="#6b7280" text-anchor="start">Пропорційна концентрації CO під час фази 1,4 В</text>
</svg>
