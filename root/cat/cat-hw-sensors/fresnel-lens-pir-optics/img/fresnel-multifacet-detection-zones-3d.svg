<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="12" fill="url(#bg-grad2)"/>

  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    Багатоярусна структура оптичних променів лінзи Френеля
  </text>
  <text x="480" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">
    Розподіл зон чутливості у горизонтальній та вертикальній площинах для купольної лінзи (8002-2B)
  </text>

  <!-- Left: Horizontal Fan (Top View) -->
  <g transform="translate(40, 80)">
    <rect width="420" height="340" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="210" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Вид зверху (Top View) — Горизонтальний кут 110° .. 120°
    </text>

    <!-- Polar sector diagram -->
    <g transform="translate(210, 270)">
      <!-- Concentric distance rings -->
      <path d="M -60 -35 A 70 70 0 0 1 60 -35" stroke="#334155" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
      <text x="65" y="-30" font-family="monospace" font-size="9" fill="#94a3b8">3 м</text>

      <path d="M -120 -70 A 140 140 0 0 1 120 -70" stroke="#334155" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
      <text x="125" y="-65" font-family="monospace" font-size="9" fill="#94a3b8">5 м</text>

      <path d="M -180 -105 A 210 210 0 0 1 180 -105" stroke="#334155" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
      <text x="175" y="-115" font-family="monospace" font-size="9" fill="#94a3b8">7 м</text>

      <!-- Center sensor position -->
      <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
      <text x="0" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff">PIR</text>

      <!-- Ray beams fan -->
      <!-- Beam 1 -->
      <polygon points="0,0 -160,-120 -130,-140" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <!-- Beam 2 -->
      <polygon points="0,0 -100,-150 -75,-165" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <!-- Beam 3 -->
      <polygon points="0,0 -45,-175 -20,-185" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <!-- Beam 4 -->
      <polygon points="0,0 20,-185 45,-175" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <!-- Beam 5 -->
      <polygon points="0,0 75,-165 100,-150" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <!-- Beam 6 -->
      <polygon points="0,0 130,-140 160,-120" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>

      <!-- Motion path across beams -->
      <path d="M -150 -90 Q 0 -130 150 -90" stroke="#facc15" stroke-width="2.5" fill="none" stroke-dasharray="5,3"/>
      <polygon points="150,-90 140,-98 145,-88" fill="#facc15"/>
      <text x="0" y="-135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#facc15">
        Траєкторія руху людини
      </text>
    </g>

    <text x="20" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">
      • Людина по черзі перетинає активні оптичні промені та сліпі проміжки між ними.
    </text>
    <text x="20" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">
      • Чим більше фасеток у лінзі, тим вища роздільна здатність виявлення повільного руху.
    </text>
  </g>

  <!-- Right: Vertical Multi-Tier View (Side View) -->
  <g transform="translate(500, 80)">
    <rect width="420" height="340" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="210" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      Вид збоку (Side View) — 3 вертикальних яруси зон
    </text>

    <!-- Side diagram -->
    <g transform="translate(50, 60)">
      <!-- Wall and mounting height -->
      <line x1="0" y1="0" x2="0" y2="200" stroke="#64748b" stroke-width="3"/>
      <text x="-10" y="10" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">Монтаж: 2.2 м</text>

      <!-- Ground line -->
      <line x1="0" y1="200" x2="330" y2="200" stroke="#64748b" stroke-width="2"/>
      <text x="320" y="215" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Підлога (Ground)</text>

      <!-- Sensor position on wall -->
      <rect x="0" y="10" width="14" height="24" rx="2" fill="#10b981"/>
      <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#10b981">PIR</text>

      <!-- Tier 1: Far Zone (Дальня зона 5..7 м) -->
      <polygon points="14,20 310,130 310,170" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
      <text x="240" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">
        Дальня зона (7 м)
      </text>

      <!-- Tier 2: Mid Zone (Середня зона 3..5 м) -->
      <polygon points="14,20 200,185 240,200 170,200" fill="#059669" fill-opacity="0.25" stroke="#34d399" stroke-width="1"/>
      <text x="160" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">
        Середня зона (4 м)
      </text>

      <!-- Tier 3: Creep Zone (Ближня зона / захист від підкрадання) -->
      <polygon points="14,20 90,200 50,200" fill="#d97706" fill-opacity="0.25" stroke="#facc15" stroke-width="1"/>
      <text x="65" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#facc15">
        Ближня (1.5 м)
      </text>
    </g>

    <!-- Side View Notes -->
    <g transform="translate(20, 280)">
      <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">
        • <tspan font-weight="600" fill="#facc15">Ближня зона (Creep Zone):</tspan> направлена круто вниз для запобігання
      </text>
      <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">
        непомітному проходженню порушника безпосередньо під датчиком на стіні.
      </text>
    </g>
  </g>

  <!-- Bottom Summary -->
  <g transform="translate(40, 435)">
    <rect width="880" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
      Просторове правило монтажу:
    </text>
    <text x="200" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      PIR-давач має максимальну чутливість при русі людини <tspan font-weight="700" fill="#34d399">поперек</tspan> оптичних променів.
    </text>
    <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      При русі людини строго <tspan font-weight="700" fill="#f87171">в лоб датчику</tspan> (радіально вздовж одного променя) кутова швидкість перетину фасеток близька до нуля, що зменшує чутливість у 3..5 разів.
    </text>
  </g>
</svg>