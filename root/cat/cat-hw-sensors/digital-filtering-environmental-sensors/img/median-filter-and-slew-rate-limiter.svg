<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Нелінійні фільтри: Медіана та обмеження швидкості наростання</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Гарантоване видалення імпульсних викидів без розмивання крутого фронту</text>

  <!-- Comparison of SMA vs Median behavior on Spike -->
  <rect x="40" y="85" width="770" height="210" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Waveform timeline -->
  <line x1="60" y1="240" x2="790" y2="240" stroke="#30363d" stroke-width="1.5"/>

  <!-- Raw signal with spike -->
  <path d="M 70 210 L 220 210 L 230 110 L 240 210 L 400 210 L 410 160 L 580 160 L 780 160" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="230" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">Викид (Spike)</text>

  <!-- SMA response (smears spike into a bump) -->
  <path d="M 70 210 L 210 210 Q 230 150 260 190 L 400 210 Q 420 180 440 160 L 780 160" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="285" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">SMA розмазує викид!</text>

  <!-- Median response (completely ignores spike, sharp step) -->
  <path d="M 70 210 L 410 210 L 415 160 L 780 160" fill="none" stroke="#3fb950" stroke-width="3"/>
  <text x="500" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Медіана повністю ігнорує викид і зберігає фронт</text>

  <!-- Bottom: 3-point Median Algorithm & Slew-Rate Limiter -->
  <rect x="40" y="310" width="370" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">3-точковий медіанний селектор</text>
  <text x="60" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Швидка C-функція без виклику qsort():</text>
  <text x="60" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">int32_t med3(int32_t a, int32_t b, int32_t c) {</text>
  <text x="75" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">  return (a &gt; b) ? ((b &gt; c) ? b : ((a &gt; c) ? c : a))</text>
  <text x="75" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">                 : ((a &gt; c) ? a : ((b &gt; c) ? c : b));</text>
  <text x="60" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">}</text>

  <rect x="440" y="310" width="370" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="625" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#d29922" text-anchor="middle">Дельта-лімітер (Slew Rate Limiter)</text>
  <text x="460" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">Обмеження максимальної швидкості зміни:</text>
  <text x="460" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">int32_t delta = new_val - last_val;</text>
  <text x="460" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">if (delta &gt; MAX_STEP) delta = MAX_STEP;</text>
  <text x="460" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">if (delta &lt; -MAX_STEP) delta = -MAX_STEP;</text>
  <text x="460" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922">last_val += delta;  /* Фізичний бар'єр */</text>
</svg>