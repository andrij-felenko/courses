<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Ковзне середнє на кільцевому буфері зі складністю O(1)</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Інкрементне оновлення акумулятора та поділ через бітовий зсув (N = 2^k)</text>

  <!-- Left: Circular Ring Buffer -->
  <rect x="40" y="85" width="370" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">Кільцевий буфер (Ring Buffer N=8)</text>

  <!-- Slots -->
  <g transform="translate(65, 140)">
    <!-- Slot 0 -->
    <rect x="0" y="0" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="35" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[0]</text>
    <text x="35" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.1</text>

    <!-- Slot 1 -->
    <rect x="80" y="0" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="115" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[1]</text>
    <text x="115" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.3</text>

    <!-- Slot 2 -->
    <rect x="160" y="0" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="195" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[2]</text>
    <text x="195" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.0</text>

    <!-- Slot 3 (Active Head - replacing old value) -->
    <rect x="240" y="0" width="70" height="50" rx="6" fill="#388bfd" opacity="0.3" stroke="#58a6ff" stroke-width="2"/>
    <text x="275" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">[3] HEAD</text>
    <text x="275" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">24.6</text>

    <!-- Slot 4 -->
    <rect x="0" y="70" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="35" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[4]</text>
    <text x="35" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.2</text>

    <!-- Slot 5 -->
    <rect x="80" y="70" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="115" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[5]</text>
    <text x="115" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.4</text>

    <!-- Slot 6 -->
    <rect x="160" y="70" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="195" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[6]</text>
    <text x="195" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.5</text>

    <!-- Slot 7 -->
    <rect x="240" y="70" width="70" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <text x="275" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">[7]</text>
    <text x="275" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">24.3</text>
  </g>

  <rect x="65" y="290" width="320" height="135" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">Магія індексування:</text>
  <text x="80" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">head = (head + 1) &amp; (N - 1);</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Швидка заміна % на &amp; 0x07 (для N=8)</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Немає необхідності зсувати масив у RAM</text>
  <text x="80" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950">• Споживання пам'яті: точно N елементів</text>

  <!-- Right: Incremental Accumulator Math -->
  <rect x="435" y="85" width="375" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">Інкрементний конвеєр O(1)</text>

  <rect x="460" y="140" width="325" height="65" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="622" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">1. Оновлення суми (Акумулятора)</text>
  <text x="622" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">sum = sum - buffer[head] + new_sample;</text>

  <line x1="622" y1="205" x2="622" y2="230" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-gr)"/>

  <rect x="460" y="230" width="325" height="65" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="622" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">2. Збереження нового зразка</text>
  <text x="622" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">buffer[head] = new_sample;</text>

  <line x1="622" y1="295" x2="622" y2="320" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-gr)"/>

  <rect x="460" y="320" width="325" height="65" rx="6" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="622" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">3. Розрахунок середнього без ділення</text>
  <text x="622" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">avg = sum &gt;&gt; 3;  /* для N = 8 = 2^3 */</text>

  <rect x="460" y="400" width="325" height="40" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="622" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79c0ff" text-anchor="middle">Час виконання не залежить від розміру N вікна!</text>

  <defs>
    <marker id="arr-gr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>