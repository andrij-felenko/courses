<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Конвеєр калібрування та компенсації AHT20 і BMP280</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">AHT20 вимагає перевірки CRC8 до масштабного перетворення, а BMP280 — обчислення t_fine для компенсації тиску</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: AHT20 ================= -->
  <rect x="30" y="65" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="90" font-size="15" font-weight="700" fill="#1a1a1a">Сенсор AHT20 (I2C адреса 0x38)</text>

  <!-- Блок 1: Сирі байти I2C -->
  <rect x="50" y="105" width="395" height="58" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="125" font-size="13" font-weight="700" fill="#1a1a1a">1. Сирий кадр I2C (7 байтів payload)</text>
  <text x="65" y="147" font-size="12" fill="#6b7280">[Статус: 1B]  [S_RH: 20 біт]  [S_T: 20 біт]  [CRC8: 1B]</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="247.5" y1="163" x2="247.5" y2="181" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Блок 2: CRC8 перевірка -->
  <rect x="50" y="183" width="395" height="92" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="65" y="203" font-size="13" font-weight="700" fill="#2457d6">2. Перевірка цілісності даних (CRC8)</text>
  <text x="65" y="222" font-size="12" fill="#1a1a1a">Поліном CRC-8: x⁸ + x⁵ + x⁴ + 1 (Init: 0xFF, Poly: 0x31)</text>

  <!-- Варіанти результату CRC8 -->
  <rect x="65" y="234" width="170" height="28" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="150" y="252" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Помилка CRC → Повтор</text>

  <rect x="255" y="234" width="175" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="342.5" y="252" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">CRC OK → Виділення бітів</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="342.5" y1="275" x2="342.5" y2="293" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 3: Розпакування відліків -->
  <rect x="50" y="295" width="395" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="313" font-size="13" font-weight="700" fill="#1a1a1a">3. Розпакування 20-бітних відліків</text>
  <rect x="65" y="322" width="170" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="150" y="342" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">S_RH (20 біт)</text>
  <rect x="255" y="322" width="175" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="342.5" y="342" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">S_T (20 біт)</text>

  <!-- Стрілки 3 -> 4 -->
  <line x1="150" y1="363" x2="150" y2="381" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="342.5" y1="363" x2="342.5" y2="381" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Блок 4: Масштабування AHT20 -->
  <rect x="50" y="383" width="395" height="122" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="65" y="404" font-size="13" font-weight="700" fill="#27ae60">4. Масштабування у фізичні величини</text>
  <text x="65" y="426" font-size="13" fill="#1a1a1a">RH (%) = (S_RH / 2²⁰) × 100%</text>
  <text x="65" y="448" font-size="13" fill="#1a1a1a">T (°C) = (S_T / 2²⁰) × 200 − 50</text>
  <rect x="65" y="460" width="365" height="32" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="247.5" y="481" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вихід AHT20: T (°C) [±0.3°C]  та  RH (%) [±2%]</text>


  <!-- ================= ПРАВА ПАНЕЛЬ: BMP280 ================= -->
  <rect x="495" y="65" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="515" y="90" font-size="15" font-weight="700" fill="#1a1a1a">Сенсор BMP280 (I2C адреса 0x76 / 0x77)</text>

  <!-- Блок 1: Вхідні дані BMP280 -->
  <rect x="515" y="105" width="190" height="58" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="525" y="125" font-size="12" font-weight="700" fill="#1a1a1a">Калібрування EEPROM</text>
  <text x="525" y="147" font-size="12" fill="#6b7280">dig_T1..T3, dig_P1..P9</text>

  <rect x="720" y="105" width="195" height="58" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="730" y="125" font-size="12" font-weight="700" fill="#1a1a1a">Сирі відліки ADC</text>
  <text x="730" y="147" font-size="12" fill="#6b7280">adc_T (20b), adc_P (20b)</text>

  <!-- Стрілки вхід -> Компенсація температури -->
  <line x1="610" y1="163" x2="610" y2="181" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="817.5" y1="163" x2="817.5" y2="181" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Блок 2: Компенсація температури BMP280 -->
  <rect x="515" y="183" width="400" height="102" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="530" y="203" font-size="13" font-weight="700" fill="#2457d6">1. Компенсація температури BMP280</text>
  <text x="530" y="222" font-size="12" fill="#1a1a1a">Вхід: adc_T та коефіцієнти dig_T1, dig_T2, dig_T3</text>
  <text x="530" y="241" font-size="12" fill="#1a1a1a">Розрахунок тонкого значення t_fine (фізична T = t_fine / 5120)</text>
  <rect x="530" y="249" width="370" height="28" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="715" y="267" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вихід: T_bmp (°C)  та  t_fine (для тиску)</text>

  <!-- Стрілка t_fine залежності між етапами 2 та 3 -->
  <line x1="715" y1="285" x2="715" y2="308" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="726" y="300" font-size="12" font-weight="700" fill="#2457d6">Передача t_fine</text>

  <!-- Блок 3: Компенсація тиску BMP280 -->
  <rect x="515" y="310" width="400" height="102" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="530" y="330" font-size="13" font-weight="700" fill="#2457d6">2. Компенсація тиску BMP280</text>
  <text x="530" y="349" font-size="12" fill="#1a1a1a">Вхід: adc_P + коефіцієнти dig_P1..P9  +  t_fine</text>
  <text x="530" y="368" font-size="12" fill="#6b7280">Поліном 2-го порядку усуває температурний дрейф</text>
  <rect x="530" y="376" width="370" height="28" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="715" y="394" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вихід: P (Па / hPa) — компенсований тиск</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="715" y1="412" x2="715" y2="430" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 4: Готові величини BMP280 -->
  <rect x="515" y="432" width="400" height="73" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="530" y="453" font-size="13" font-weight="700" fill="#27ae60">3. Готові фізичні величини BMP280</text>
  <text x="530" y="473" font-size="12" fill="#1a1a1a">T_bmp (°C): компенсація за dig_T (похибка ±0.5°C)</text>
  <text x="530" y="493" font-size="12" fill="#1a1a1a">P (hPa): компенсація за dig_P та t_fine (±1 hPa)</text>
</svg>
