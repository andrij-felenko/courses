<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив самонагріву модуля AHT20 + BMP280 при високій частоті опитування</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Тепловиділення LDO занижує виміряну відносну вологість та завищує температуру відносно реального довкілля</text>

  <!-- Left Panel: Hardware Mechanism -->
  <rect x="25" y="75" width="290" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело тепла на модулі</text>

  <!-- High Polling Frequency Badge -->
  <rect x="50" y="112" width="240" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="128" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Висока частота опитування: f &gt; 1 Hz</text>

  <!-- Module PCB Schematic Box -->
  <rect x="40" y="148" width="260" height="182" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="166" font-size="12" font-weight="bold" fill="#6b7280">Плата модуля (PCB)</text>

  <!-- LDO Regulator Component -->
  <rect x="55" y="180" width="75" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="92.5" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">LDO 3.3V</text>
  <text x="92.5" y="218" font-size="12" fill="#c0392b" text-anchor="middle">P_dis &gt; 0</text>

  <!-- Heat Flow Arrow -->
  <path d="M 130,205 C 145,195 155,215 170,205" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="150" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Тепло Q</text>

  <!-- Sensors on PCB -->
  <!-- AHT20 -->
  <rect x="180" y="175" width="105" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="232.5" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AHT20</text>
  <text x="232.5" y="209" font-size="12" fill="#2457d6" text-anchor="middle">(MEMS RH + T)</text>

  <!-- BMP280 -->
  <rect x="180" y="235" width="105" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="232.5" y="253" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">BMP280</text>
  <text x="232.5" y="269" font-size="12" fill="#2457d6" text-anchor="middle">(П'єзо P + T)</text>

  <!-- I2C Bus Line -->
  <line x1="55" y1="305" x2="285" y2="305" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Спільна шина I2C (0x38, 0x76)</text>

  <!-- Physics Explanation Box -->
  <rect x="40" y="342" width="260" height="124" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">Фізичний механізм помилки:</text>
  <text x="50" y="384" font-size="12" fill="#1a1a1a">1. T_давача зростає через нагрів</text>
  <text x="50" y="406" font-size="12" fill="#1a1a1a">2. P_s(T) — тиск насичення зростає</text>
  <text x="50" y="428" font-size="12" fill="#c0392b" font-weight="bold">3. RH = (P_w / P_s) · 100% падає!</text>
  <text x="50" y="450" font-size="12" fill="#6b7280">P_w (абсолютна пара) = const</text>

  <!-- Right Panel: Graphs -->
  <rect x="330" y="75" width="605" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="632.5" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динаміка спотворення виміряних величин у часі</text>

  <!-- Top Graph: Temperature -->
  <rect x="390" y="122" width="500" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="385" y="115" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">T [°C]</text>
  
  <!-- Gridlines Temp -->
  <line x1="390" y1="137" x2="890" y2="137" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="385" y="141" font-size="12" fill="#6b7280" text-anchor="end">26°C</text>
  
  <line x1="390" y1="177" x2="890" y2="177" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="385" y="181" font-size="12" fill="#6b7280" text-anchor="end">23°C</text>
  
  <line x1="390" y1="217" x2="890" y2="217" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="385" y="221" font-size="12" fill="#6b7280" text-anchor="end">20°C</text>

  <!-- Real Temp Line (Green) -->
  <line x1="390" y1="217" x2="890" y2="217" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="640" y="235" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">T_довкілля = 20.0 °C (реальна стабільна)</text>

  <!-- Measured Temp Curve (Red) -->
  <path d="M 390,217 C 460,157 590,147 890,147" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="610" y="130" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T_давача (нагрів до 25.3 °C)</text>
  <text x="880" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ΔT = +5.3 °C</text>

  <!-- Bottom Graph: Humidity -->
  <rect x="390" y="270" width="500" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="385" y="262" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RH [%]</text>

  <!-- Gridlines Humidity -->
  <line x1="390" y1="285" x2="890" y2="285" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="385" y="289" font-size="12" fill="#6b7280" text-anchor="end">55%</text>

  <line x1="390" y1="325" x2="890" y2="325" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="385" y="329" font-size="12" fill="#6b7280" text-anchor="end">47%</text>

  <line x1="390" y1="365" x2="890" y2="365" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="385" y="369" font-size="12" fill="#6b7280" text-anchor="end">40%</text>

  <!-- Real RH Line (Green) -->
  <line x1="390" y1="285" x2="890" y2="285" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="640" y="280" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RH_довкілля = 55 % (реальна стабільна)</text>

  <!-- Measured RH Curve (Red) -->
  <path d="M 390,285 C 460,355 590,365 890,365" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="610" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RH_давача (хибне падіння до 40 %)</text>
  <text x="880" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ΔRH = -15 %</text>

  <!-- Shared Time X-Axis -->
  <line x1="390" y1="395" x2="895" y2="395" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ticks and Labels -->
  <line x1="390" y1="395" x2="390" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <text x="390" y="414" font-size="12" fill="#6b7280" text-anchor="middle">0 хв</text>

  <line x1="490" y1="395" x2="490" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <text x="490" y="414" font-size="12" fill="#6b7280" text-anchor="middle">2 хв</text>

  <line x1="590" y1="395" x2="590" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <text x="590" y="414" font-size="12" fill="#6b7280" text-anchor="middle">5 хв</text>

  <line x1="740" y1="395" x2="740" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <text x="740" y="414" font-size="12" fill="#6b7280" text-anchor="middle">10 хв</text>

  <line x1="890" y1="395" x2="890" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <text x="890" y="414" font-size="12" fill="#6b7280" text-anchor="middle">15 хв</text>

  <!-- X Axis Title -->
  <text x="640" y="432" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час безперервної роботи t [хвилини]</text>

  <!-- Solution Box -->
  <rect x="345" y="444" width="575" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="632.5" y="461" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рішення: знизити частоту опитування (f ≤ 0.1 Hz) або вносити програму компенсації</text>
</svg>
