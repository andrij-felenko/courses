<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта регістрів та структура даних AHT20 і BMP280</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">BMP280 використовує класичну матрицю регістрів, а AHT20 — командний протокол зі потоковим зчитуванням</text>

  <!-- Left Panel: AHT20 -->
  <rect x="30" y="70" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- AHT20 Header Banner -->
  <rect x="45" y="82" width="405" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="247" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">AHT20 — Командна модель (I2C: 0x38)</text>

  <!-- AHT20 Section 1: Commands & Status -->
  <rect x="45" y="124" width="405" height="120" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="60" y="143" font-size="13" font-weight="bold" fill="#1a1a1a">Команди та байти стану:</text>

  <!-- Row 1: 0x71 -->
  <rect x="60" y="152" width="55" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="87.5" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0x71</text>
  <text x="125" y="167" font-size="12" fill="#1a1a1a">Зчитування стану (Busy / Calibrated)</text>

  <!-- Row 2: 0xAC -->
  <rect x="60" y="180" width="55" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="87.5" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xAC</text>
  <text x="125" y="195" font-size="12" fill="#1a1a1a">Запуск вимірювання [0xAC, 0x33, 0x00]</text>

  <!-- Row 3: 0xBE -->
  <rect x="60" y="208" width="55" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="87.5" y="223" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xBE</text>
  <text x="125" y="223" font-size="12" fill="#1a1a1a">Ініціалізація чипа [0xBE, 0x08, 0x00]</text>

  <!-- AHT20 Section 2: Data Stream -->
  <rect x="45" y="254" width="405" height="198" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="60" y="273" font-size="13" font-weight="bold" fill="#1a1a1a">Послідовність зчитування даних (7 байтів):</text>

  <!-- Byte boxes -->
  <rect x="60" y="284" width="45" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="82.5" y="303" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B0</text>

  <rect x="111" y="284" width="130" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="176" y="303" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">B1, B2, B3[7:4]</text>

  <rect x="247" y="284" width="130" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="312" y="303" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B3[3:0], B4, B5</text>

  <rect x="383" y="284" width="55" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="410.5" y="303" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">B6</text>

  <!-- Data stream description bullet lines -->
  <text x="60" y="334" font-size="12" fill="#1a1a1a">• B0: Статус (Bit 7: Busy, Bit 3: Calibrated)</text>
  <text x="60" y="358" font-size="12" fill="#27ae60">• B1–B3: Вологість S_rh (20 біт)</text>
  <text x="60" y="382" font-size="12" fill="#2457d6">• B3–B5: Температура S_t (20 біт)</text>
  <text x="60" y="406" font-size="12" fill="#c0392b">• B6: Контрольна сума CRC8</text>
  <text x="60" y="430" font-size="12" fill="#6b7280">Формули: RH = (S_rh/2²⁰)×100%, T = (S_t/2²⁰)×200-50</text>

  <!-- Right Panel: BMP280 -->
  <rect x="495" y="70" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- BMP280 Header Banner -->
  <rect x="510" y="82" width="405" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="712" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">BMP280 — Карта регістрів (I2C: 0x76 / 0x77)</text>

  <!-- BMP280 Section 1: Control & Data Registers -->
  <rect x="510" y="124" width="405" height="202" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="525" y="143" font-size="13" font-weight="bold" fill="#1a1a1a">Карта регістрів управління та вимірювань:</text>

  <!-- Row 1: 0xD0 id -->
  <rect x="525" y="152" width="70" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="560" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xD0</text>
  <text x="605" y="167" font-size="12" font-weight="bold" fill="#1a1a1a">id</text>
  <text x="675" y="167" font-size="12" fill="#6b7280">ID чипа (значення 0x58)</text>

  <!-- Row 2: 0xE0 reset -->
  <rect x="525" y="180" width="70" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="560" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xE0</text>
  <text x="605" y="195" font-size="12" font-weight="bold" fill="#1a1a1a">reset</text>
  <text x="675" y="195" font-size="12" fill="#6b7280">Скидання (запис 0xB6)</text>

  <!-- Row 3: 0xF4 ctrl_meas -->
  <rect x="525" y="208" width="70" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="560" y="223" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xF4</text>
  <text x="605" y="223" font-size="12" font-weight="bold" fill="#1a1a1a">ctrl_meas</text>
  <text x="675" y="223" font-size="12" fill="#1a1a1a">Режим роботи, оверсемплінг T і P</text>

  <!-- Row 4: 0xF5 config -->
  <rect x="525" y="236" width="70" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="560" y="251" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xF5</text>
  <text x="605" y="251" font-size="12" font-weight="bold" fill="#1a1a1a">config</text>
  <text x="675" y="251" font-size="12" fill="#1a1a1a">Фільтр IIR та період очікування</text>

  <!-- Row 5: 0xF7..F9 press -->
  <rect x="525" y="264" width="70" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="560" y="279" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0xF7..F9</text>
  <text x="605" y="279" font-size="12" font-weight="bold" fill="#27ae60">press</text>
  <text x="675" y="279" font-size="12" fill="#1a1a1a">press_msb, lsb, xlsb (20 біт P)</text>

  <!-- Row 6: 0xFA..FC temp -->
  <rect x="525" y="292" width="70" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="560" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0xFA..FC</text>
  <text x="605" y="307" font-size="12" font-weight="bold" fill="#2457d6">temp</text>
  <text x="675" y="307" font-size="12" fill="#1a1a1a">temp_msb, lsb, xlsb (20 біт T)</text>

  <!-- BMP280 Section 2: Calibration Coefficients NVM -->
  <rect x="510" y="336" width="405" height="116" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="525" y="355" font-size="13" font-weight="bold" fill="#1a1a1a">Заводські калібрувальні коефіцієнти (NVM):</text>

  <!-- Row 1: 0x88..8D -->
  <rect x="525" y="364" width="70" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="560" y="379" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0x88..8D</text>
  <text x="605" y="379" font-size="12" fill="#1a1a1a">dig_T1 .. dig_T3 (3 × 16 біт для T)</text>

  <!-- Row 2: 0x8E..A1 -->
  <rect x="525" y="392" width="70" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="560" y="407" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0x8E..A1</text>
  <text x="605" y="407" font-size="12" fill="#1a1a1a">dig_P1 .. dig_P9 (9 × 16 біт для P)</text>

  <!-- Bottom note in Section 2 -->
  <text x="525" y="437" font-size="12" fill="#6b7280">Коефіцієнти зчитуються 1 раз під час старту</text>

  <!-- Footer Summary Card -->
  <rect x="30" y="480" width="900" height="58" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="501" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Ключова відмінність обробки даних</text>
  <text x="480" y="522" font-size="12" fill="#1a1a1a" text-anchor="middle">AHT20 віддає готові значення вологості й температури; BMP280 вимагає обчислення компенсації через dig_T та dig_P</text>
</svg>
