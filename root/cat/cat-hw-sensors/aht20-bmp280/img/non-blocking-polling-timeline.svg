<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-left-green" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма неблокувального опитування AHT20 + BMP280</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Запуск вимірювання та зчитування розділені в часі; інтервал &gt; 2 с запобігає самонагріву давачів</text>

  <!-- Головна панель -->
  <rect x="30" y="75" width="900" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ================= TRACK 1: МКУ ================= -->
  <text x="205" y="118" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">Процесор (MCU)</text>
  <text x="205" y="135" font-size="11" fill="#6b7280" text-anchor="end">головний цикл loop()</text>

  <rect x="220" y="90" width="690" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Block 1.1: I2C Start Trigger -->
  <rect x="230" y="98" width="50" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="255" y="127" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Запуск</text>

  <!-- Block 1.2: MCU Free during conversion -->
  <rect x="295" y="98" width="200" height="49" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="395" y="120" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Процесор вільний (без delay)</text>
  <text x="395" y="137" font-size="11" fill="#6b7280" text-anchor="middle">обробка інших задач MCU</text>

  <!-- Block 1.3: I2C Read Data -->
  <rect x="510" y="98" width="60" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="540" y="127" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Зчитати</text>

  <!-- Block 1.4: MCU Free during long pause -->
  <rect x="585" y="98" width="315" height="49" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="742.5" y="120" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Пауза опитування (Δt &gt; 2000 мс)</text>
  <text x="742.5" y="137" font-size="11" fill="#6b7280" text-anchor="middle">процесор виконує основний код</text>

  <!-- ================= TRACK 2: I2C BUS ================= -->
  <text x="205" y="203" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">Шина I2C</text>
  <text x="205" y="220" font-size="11" fill="#6b7280" text-anchor="end">лінії SCL / SDA</text>

  <rect x="220" y="175" width="690" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- I2C Cmd Start -->
  <rect x="230" y="183" width="50" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="255" y="204" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">I2C</text>
  <text x="255" y="220" font-size="11" fill="#2457d6" text-anchor="middle">Start</text>

  <!-- I2C Bus Idle 80ms -->
  <text x="395" y="204" font-size="11" fill="#6b7280" text-anchor="middle">Тиша на шині I2C (~80 мс)</text>
  <line x1="295" y1="218" x2="495" y2="218" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- I2C Read Packet -->
  <rect x="510" y="183" width="60" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="540" y="204" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">I2C Data</text>
  <text x="540" y="220" font-size="11" fill="#2457d6" text-anchor="middle">6 байт</text>

  <!-- I2C Bus Idle Long -->
  <text x="737.5" y="204" font-size="11" fill="#6b7280" text-anchor="middle">Шина вільна для інших пристроїв</text>
  <line x1="585" y1="218" x2="890" y2="218" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ================= TRACK 3: SENSORS ================= -->
  <text x="205" y="288" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">Давачі AHT20/BMP</text>
  <text x="205" y="305" font-size="11" fill="#6b7280" text-anchor="end">стан сенсорів</text>

  <rect x="220" y="260" width="690" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Sensor Start -->
  <rect x="230" y="268" width="50" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="255" y="289" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Прийом</text>
  <text x="255" y="305" font-size="11" fill="#2457d6" text-anchor="middle">команди</text>

  <!-- Sensor ADC Conversion -->
  <rect x="295" y="268" width="200" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="395" y="288" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вимірювання АЦП</text>
  <text x="395" y="305" font-size="11" fill="#6b7280" text-anchor="middle">t_conv ≈ 80 мс</text>

  <!-- Sensor Data Output -->
  <rect x="510" y="268" width="60" height="49" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="540" y="289" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Передача</text>
  <text x="540" y="305" font-size="11" fill="#2457d6" text-anchor="middle">результату</text>

  <!-- Sensor Idle Rest -->
  <rect x="585" y="268" width="315" height="49" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="742.5" y="288" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Очікування (без самонагріву)</text>
  <text x="742.5" y="305" font-size="11" fill="#6b7280" text-anchor="middle">відновлення теплового стану</text>

  <!-- ================= CALLOUTS & TIME AXIS ================= -->
  <!-- Callout 1: Non-blocking conversion wait -->
  <text x="362.5" y="346" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Неблокувальне очікування (~80 мс)</text>
  <line x1="232" y1="355" x2="493" y2="355" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-left-blue)" marker-end="url(#arr-blue)"/>

  <!-- Callout 2: Polling pause -->
  <text x="735" y="346" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Інтервал між опитуваннями (Δt &gt; 2000 мс)</text>
  <line x1="572" y1="355" x2="898" y2="355" stroke="#27ae60" stroke-width="1.2" marker-start="url(#arr-left-green)" marker-end="url(#arr-green)"/>

  <!-- Time Axis -->
  <line x1="220" y1="380" x2="905" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="374" x2="686" y2="386" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="685" y1="374" x2="691" y2="386" stroke="#6b7280" stroke-width="1.5"/>
  <text x="912" y="384" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- Time Ticks & Labels -->
  <line x1="230" y1="328" x2="230" y2="385" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="230" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t = 0</text>

  <line x1="495" y1="328" x2="495" y2="385" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="495" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t ≈ 80 мс</text>

  <line x1="570" y1="328" x2="570" y2="385" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="570" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t ≈ 90 мс</text>

  <line x1="900" y1="328" x2="900" y2="385" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="885" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t &gt; 2000 мс</text>

  <!-- ================= BOTTOM BANNER ================= -->
  <rect x="50" y="415" width="860" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <rect x="65" y="423" width="390" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="260" y="444" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Неблокувальний код (millis): CPU вільний 99.6% часу</text>

  <rect x="475" y="423" width="420" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="685" y="444" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Інтервал Δt &gt; 2 с: виключає самонагрів AHT20 та BMP280</text>
</svg>
