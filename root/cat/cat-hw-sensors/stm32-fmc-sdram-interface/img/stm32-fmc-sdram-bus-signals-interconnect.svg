<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Апаратний інтерфейс FMC до зовнішньої пам'яті SDRAM у STM32
  </text>
  <text x="480" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Схема електричних зв'язків 16/32-бітної шини SDR SDRAM (Bank 5: 0xC0000000, Bank 6: 0xD0000000)
  </text>

  <!-- Left: STM32 FMC Controller -->
  <rect x="40" y="95" width="310" height="415" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="95" width="310" height="34" rx="10" fill="#0284c7"/>
  <text x="195" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Мікроконтролер STM32 (FMC)
  </text>

  <!-- FMC Pins Group -->
  <g transform="translate(60, 145)" font-family="monospace" font-size="11" fill="#e2e8f0">
    <text x="0" y="0" font-weight="700" fill="#38bdf8">Тактування та вибір банку:</text>
    <text x="0" y="20" fill="#cbd5e1">• FMC_SDCLK (Тактовий сигнал до 100 МГц)</text>
    <text x="0" y="38" fill="#cbd5e1">• FMC_SDCKE0 / SDCKE1 (Дозвіл клоку CKE)</text>
    <text x="0" y="56" fill="#cbd5e1">• FMC_SDNE0 / SDNE1 (Chip Select /CS)</text>

    <text x="0" y="90" font-weight="700" fill="#34d399">Командні строби (SDRAM Commands):</text>
    <text x="0" y="110" fill="#cbd5e1">• FMC_SDNRAS (Рядковий строб /RAS)</text>
    <text x="0" y="128" fill="#cbd5e1">• FMC_SDNCAS (Стовпчиковий строб /CAS)</text>
    <text x="0" y="146" fill="#cbd5e1">• FMC_SDNWE  (Строб запису /WE)</text>

    <text x="0" y="180" font-weight="700" fill="#fbbf24">Адресна шина та банки:</text>
    <text x="0" y="200" fill="#cbd5e1">• FMC_A[12:0] (Мультиплексована адреса)</text>
    <text x="0" y="218" fill="#cbd5e1">• FMC_BA[1:0] (Вибір 4 банків пам'яті)</text>

    <text x="0" y="250" font-weight="700" fill="#f472b6">Шина даних та маски:</text>
    <text x="0" y="270" fill="#cbd5e1">• FMC_D[15:0] або D[31:0] (Дані)</text>
    <text x="0" y="288" fill="#cbd5e1">• FMC_NBL[3:0] (Маски байтів DQM0..3)</text>
  </g>

  <rect x="55" y="445" width="280" height="48" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="195" y="465" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
    Адресний простір ядра ARM:
  </text>
  <text x="195" y="482" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">
    Bank 5: 0xC0000000 | Bank 6: 0xD0000000
  </text>

  <!-- Bus Interconnect Lines in Middle -->
  <g transform="translate(350, 160)">
    <!-- Line 1: Clocks -->
    <line x1="0" y1="10" x2="260" y2="10" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
    <text x="130" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">SDCLK, SDCKE, SDNE</text>

    <!-- Line 2: Commands -->
    <line x1="0" y1="80" x2="260" y2="80" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="130" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">RAS, CAS, WE</text>

    <!-- Line 3: Address -->
    <line x1="0" y1="150" x2="260" y2="150" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
    <text x="130" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fbbf24">A[12:0], BA[1:0]</text>

    <!-- Line 4: Bi-directional Data -->
    <line x1="0" y1="220" x2="260" y2="220" stroke="#f472b6" stroke-width="2.5"/>
    <polygon points="5,216 0,220 5,224" fill="#f472b6"/>
    <polygon points="255,216 260,220 255,224" fill="#f472b6"/>
    <text x="130" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f472b6">D[31:0] / D[15:0], DQM[3:0]</text>
  </g>

  <!-- Right: SDRAM Memory Chip (IS42S / MT48LC) -->
  <rect x="610" y="95" width="310" height="415" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="610" y="95" width="310" height="34" rx="10" fill="#059669"/>
  <text x="765" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Мікросхема SDR SDRAM (8..32 МБ)
  </text>

  <!-- SDRAM Internals -->
  <g transform="translate(630, 145)" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">
    <rect x="0" y="0" width="270" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="135" y="22" text-anchor="middle" font-weight="700" fill="#34d399">4 внутрішні банки матриці:</text>
    <text x="135" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">Bank 0 | Bank 1 | Bank 2 | Bank 3</text>
    <text x="135" y="56" text-anchor="middle" font-size="10" fill="#94a3b8">Кожен банк: 4096 рядків x 512 стовпчиків</text>

    <rect x="0" y="80" width="270" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="15" y="102" font-weight="700" fill="#cbd5e1">Керуюча логіка мікросхеми:</text>
    <text x="15" y="122" font-size="10" fill="#94a3b8">• Command Decoder (Дешифратор команд)</text>
    <text x="15" y="140" font-size="10" fill="#94a3b8">• Mode Register (Регістр режимів CAS / Burst)</text>
    <text x="15" y="158" font-size="10" fill="#94a3b8">• Row / Column Address Latches</text>
    <text x="15" y="176" font-size="10" fill="#94a3b8">• Sense Amplifiers &amp; I/O Gating</text>

    <rect x="0" y="215" width="270" height="65" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="135" y="235" text-anchor="middle" font-weight="700" fill="#fbbf24">Вбудований таймер авторегенерації:</text>
    <text x="135" y="253" text-anchor="middle" font-size="10" fill="#cbd5e1">Період регенерації: 64 мс для 4096 рядків</text>
    <text x="135" y="268" text-anchor="middle" font-size="10" fill="#94a3b8">(Кожен рядок оновлюється кожні 15.6 мкс)</text>
  </g>

  <rect x="625" y="445" width="280" height="48" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="765" y="465" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">
    Типові мікросхеми на платах:
  </text>
  <text x="765" y="482" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">
    IS42S16400J / W9825G6KH / MT48LC4M32
  </text>
</svg>