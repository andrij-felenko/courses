<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Карта регістрів та калібрування магнітного енкодера</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Конфігурування Zero Offset, Gain Control та фільтрації через SPI/I2C для калібрування сенсора</text>

  <!-- Left Panel: Host MCU -->
  <rect x="20" y="68" width="175" height="452" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8" ry="8"/>
  <text x="107.5" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Host MCU</text>
  <text x="107.5" y="108" text-anchor="middle" font-size="12" fill="#6b7280">Управляючий контролер</text>

  <!-- Interface Block inside Host MCU -->
  <rect x="30" y="122" width="155" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6" ry="6"/>
  <text x="107.5" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Цифровий шинний</text>
  <text x="107.5" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">інтерфейс</text>
  <text x="107.5" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">SPI Master</text>
  <text x="107.5" y="198" text-anchor="middle" font-size="12" fill="#6b7280">(SCLK, MOSI, MISO, CS)</text>
  <text x="107.5" y="224" text-anchor="middle" font-size="12" fill="#1a1a1a">I2C Master (SDA, SCL)</text>

  <!-- Calibration Algorithm Box inside Host MCU -->
  <rect x="30" y="255" width="155" height="250" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6" ry="6"/>
  <text x="107.5" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Послідовність дій</text>
  <line x1="38" y1="285" x2="177" y2="285" stroke="#d0d7de" stroke-width="1"/>
  <text x="38" y="310" font-size="12" fill="#1a1a1a">1. Читання RAW кута</text>
  <text x="38" y="345" font-size="12" fill="#1a1a1a">2. Запис ZERO_OFFSET</text>
  <text x="38" y="380" font-size="12" fill="#1a1a1a">3. Налаштування AGC</text>
  <text x="38" y="415" font-size="12" fill="#1a1a1a">4. Конфіг FILTER_CFG</text>
  <text x="38" y="450" font-size="12" font-weight="bold" fill="#27ae60">5. Читання ANGLE_OUT</text>
  <text x="38" y="475" font-size="12" fill="#6b7280">(Калібрування готове)</text>

  <!-- Bus Connection: Host MCU to Encoder IC -->
  <line x1="185" y1="180" x2="267" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>
  <text x="235" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SPI / I2C</text>
  <text x="235" y="200" text-anchor="middle" font-size="12" fill="#6b7280">Команди R/W</text>

  <!-- Right Panel: Encoder IC -->
  <rect x="275" y="68" width="665" height="452" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8" ry="8"/>
  <text x="607.5" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Інтегрована схема магнітного енкодера (Encoder IC)</text>

  <!-- Register Map Sub-panel -->
  <rect x="285" y="105" width="645" height="150" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6" ry="6"/>
  <text x="295" y="123" font-size="13" font-weight="bold" fill="#1a1a1a">Карта конфігураційних регістрів (Register Map)</text>

  <!-- Register 1: ZERO_OFFSET -->
  <rect x="295" y="132" width="145" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4" ry="4"/>
  <text x="367.5" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Reg 0x01:0x02</text>
  <text x="367.5" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ZERO_OFFSET</text>
  <text x="367.5" y="184" text-anchor="middle" font-size="12" fill="#6b7280">Зсув нуля (ZPOS)</text>
  <text x="367.5" y="202" text-anchor="middle" font-size="12" fill="#6b7280">12/14-bit значення</text>
  <text x="367.5" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Калібр. позиції</text>

  <!-- Register 2: GAIN_CONTROL -->
  <rect x="455" y="132" width="145" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4" ry="4"/>
  <text x="527.5" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Reg 0x03</text>
  <text x="527.5" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GAIN_CONTROL</text>
  <text x="527.5" y="184" text-anchor="middle" font-size="12" fill="#6b7280">Підсилення (AGC)</text>
  <text x="527.5" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Компенсація B-поля</text>
  <text x="527.5" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Амплітуда поля</text>

  <!-- Register 3: FILTER_CFG -->
  <rect x="615" y="132" width="145" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4" ry="4"/>
  <text x="687.5" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Reg 0x04</text>
  <text x="687.5" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">FILTER_CFG</text>
  <text x="687.5" y="184" text-anchor="middle" font-size="12" fill="#6b7280">Фільтр і затримка</text>
  <text x="687.5" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Смуга / Гістерезис</text>
  <text x="687.5" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Придушення шуму</text>

  <!-- Register 4: ANGLE_OUT -->
  <rect x="775" y="132" width="145" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4" ry="4"/>
  <text x="847.5" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Reg 0x10:0x11</text>
  <text x="847.5" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ANGLE_OUT</text>
  <text x="847.5" y="184" text-anchor="middle" font-size="12" fill="#6b7280">Вихідний кут</text>
  <text x="847.5" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Відкалібрований</text>
  <text x="847.5" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Готові дані</text>

  <!-- Hardware Pipeline Sub-panel -->
  <rect x="285" y="300" width="645" height="210" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6" ry="6"/>
  <text x="295" y="318" font-size="12" font-weight="bold" fill="#1a1a1a">Апаратний цифровий тракт обробки</text>
  <text x="295" y="333" font-size="12" fill="#6b7280">(Hardware Processing Pipeline)</text>

  <!-- Stage 1: Sensor Array -->
  <rect x="295" y="348" width="145" height="150" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="4" ry="4"/>
  <text x="367.5" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Сенсори Холла</text>
  <rect x="307" y="373" width="121" height="42" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="3" ry="3"/>
  <text x="367.5" y="389" text-anchor="middle" font-size="12" fill="#6b7280">Магніт N/S</text>
  <text x="367.5" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Sin / Cos V</text>
  <text x="367.5" y="432" text-anchor="middle" font-size="12" fill="#6b7280">Первинні аналогові</text>
  <text x="367.5" y="448" text-anchor="middle" font-size="12" fill="#6b7280">сигнали поля B</text>
  <text x="367.5" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Sin(θ), Cos(θ)</text>

  <!-- Inter-stage Arrow 1 to 2 -->
  <line x1="440" y1="394" x2="447" y2="394" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Stage 2: AGC Block -->
  <rect x="455" y="348" width="145" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4" ry="4"/>
  <text x="527.5" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Блок AGC</text>
  <rect x="467" y="373" width="121" height="42" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="3" ry="3"/>
  <text x="527.5" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Gain Control</text>
  <text x="527.5" y="405" text-anchor="middle" font-size="12" fill="#6b7280">Нормалізація V</text>
  <text x="527.5" y="432" text-anchor="middle" font-size="12" fill="#6b7280">Автопідсилення</text>
  <text x="527.5" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Стабілізація B-поля</text>
  <text x="527.5" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Нормал. Sin/Cos</text>

  <!-- Inter-stage Arrow 2 to 3 -->
  <line x1="600" y1="394" x2="607" y2="394" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Stage 3: CORDIC & Offset -->
  <rect x="615" y="348" width="145" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4" ry="4"/>
  <text x="687.5" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CORDIC &amp; Offset</text>
  <rect x="623" y="373" width="129" height="42" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="3" ry="3"/>
  <text x="687.5" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">θ = arctan(S/C)</text>
  <text x="687.5" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">α = θ - ZERO_OFFSET</text>
  <text x="687.5" y="432" text-anchor="middle" font-size="12" fill="#6b7280">Обчислення кута</text>
  <text x="687.5" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Віднімання нуля</text>
  <text x="687.5" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Зміщений кут α</text>

  <!-- Inter-stage Arrow 3 to 4 -->
  <line x1="760" y1="394" x2="767" y2="394" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Digital Filter -->
  <rect x="775" y="348" width="145" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4" ry="4"/>
  <text x="847.5" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Цифровий фільтр</text>
  <rect x="785" y="373" width="125" height="42" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="3" ry="3"/>
  <text x="847.5" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Digital FIR/IIR</text>
  <text x="847.5" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Hysteresis Filter</text>
  <text x="847.5" y="432" text-anchor="middle" font-size="12" fill="#6b7280">Фільтрація завад</text>
  <text x="847.5" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Запис в ANGLE</text>
  <text x="847.5" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Кут ANGLE_OUT</text>

  <!-- Control & Data Lines -->
  <!-- 1. ZERO_OFFSET Control Line (Reg 1 to Stage 3) -->
  <path d="M 367.5 252 L 367.5 278 L 687.5 278 L 687.5 340" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>
  <text x="373" y="272" font-size="12" fill="#2457d6">ZPOS[13:0] (Zero Offset)</text>

  <!-- 2. GAIN_CONTROL Control Line (Reg 2 to Stage 2) -->
  <line x1="527.5" y1="252" x2="527.5" y2="340" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>
  <text x="533" y="272" font-size="12" fill="#2457d6">Конфіг. AGC</text>

  <!-- 3. FILTER_CFG Control Line (Reg 3 to Stage 4) -->
  <path d="M 690 252 L 690 292 L 815 292 L 815 340" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-accent)"/>
  <text x="695" y="286" font-size="12" fill="#2457d6">Смуга / Гістерезис</text>

  <!-- 4. Data Flow: Stage 4 Output up to ANGLE_OUT Register -->
  <line x1="890" y1="348" x2="890" y2="260" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="885" y="328" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Запис кута</text>

</svg>
