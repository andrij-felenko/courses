<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a" />
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#1a1a1a" />
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="3.5" refY="1" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,6 L3.5,0 L7,6 Z" fill="#2457d6" />
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="3.5" refY="1" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,6 L3.5,0 L7,6 Z" fill="#27ae60" />
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="540" fill="white" />

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими декодування квадратурного сигналу (x1, x2, x4)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Формування відліків лічильника за перепадами рівнів сигналів на 1 період Te</text>

  <!-- Panel 1: Input Waveforms -->
  <rect x="30" y="75" width="900" height="155" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6" />
  <text x="45" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">Сигнали A і B (зсув фаз 90°):</text>

  <!-- Channel A Label -->
  <text x="45" y="138" font-size="13" font-weight="bold" fill="#2457d6">Канал A</text>
  <!-- Channel B Label -->
  <text x="45" y="188" font-size="13" font-weight="bold" fill="#0284c7">Канал B</text>

  <!-- Period Te dimension line -->
  <line x1="220" y1="106" x2="540" y2="106" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-left)" marker-end="url(#arr)" />
  <text x="380" y="101" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1 електричний період (Te)</text>

  <!-- Waveform Channel A -->
  <path d="M 220 148 L 300 148 L 300 120 L 460 120 L 460 148 L 620 148 L 620 120 L 780 120 L 780 148 L 860 148" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Waveform Channel B -->
  <path d="M 220 198 L 380 198 L 380 170 L 540 170 L 540 198 L 700 198 L 700 170 L 860 170 L 860 198" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Phase Shift 90 deg dimension line -->
  <line x1="300" y1="214" x2="380" y2="214" stroke="#6b7280" stroke-width="1.2" marker-start="url(#arr-left)" marker-end="url(#arr)" />
  <text x="340" y="225" font-size="11" fill="#6b7280" text-anchor="middle">90° (Te/4)</text>

  <!-- Grid edge vertical dashed lines -->
  <line x1="300" y1="106" x2="300" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="380" y1="106" x2="380" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="460" y1="106" x2="460" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="540" y1="106" x2="540" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="620" y1="106" x2="620" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="700" y1="106" x2="700" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="780" y1="106" x2="780" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="860" y1="106" x2="860" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Panel 2: Mode x1 -->
  <rect x="30" y="242" width="900" height="58" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6" />
  <text x="45" y="265" font-size="13" font-weight="bold" fill="#1a1a1a">Режим x1</text>
  <text x="45" y="283" font-size="12" fill="#6b7280">1 відлік / Te (фронт A ↑)</text>
  <!-- x1 Pulses -->
  <line x1="300" y1="285" x2="300" y2="258" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="300" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+1</text>
  <line x1="620" y1="285" x2="620" y2="258" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="620" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+1</text>

  <!-- Panel 3: Mode x2 -->
  <rect x="30" y="312" width="900" height="58" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6" />
  <text x="45" y="335" font-size="13" font-weight="bold" fill="#1a1a1a">Режим x2</text>
  <text x="45" y="353" font-size="12" fill="#6b7280">2 відліки / Te (фронти A ↑↓)</text>
  <!-- x2 Pulses -->
  <line x1="300" y1="355" x2="300" y2="328" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="300" y="324" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+1</text>
  <line x1="460" y1="355" x2="460" y2="328" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="460" y="324" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+1</text>
  <line x1="620" y1="355" x2="620" y2="328" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="620" y="324" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+1</text>
  <line x1="780" y1="355" x2="780" y2="328" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="780" y="324" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+1</text>

  <!-- Panel 4: Mode x4 -->
  <rect x="30" y="382" width="900" height="58" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6" />
  <text x="45" y="405" font-size="13" font-weight="bold" fill="#1a1a1a">Режим x4</text>
  <text x="45" y="423" font-size="12" fill="#6b7280">4 відліки / Te (фронти A i B ↑↓)</text>
  <!-- x4 Pulses -->
  <line x1="300" y1="425" x2="300" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="300" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="380" y1="425" x2="380" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="380" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="460" y1="425" x2="460" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="460" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="540" y1="425" x2="540" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="540" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="620" y1="425" x2="620" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="620" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="700" y1="425" x2="700" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="700" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="780" y1="425" x2="780" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="780" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>
  <line x1="860" y1="425" x2="860" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="860" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+1</text>

  <!-- Panel 5: Summary -->
  <rect x="30" y="452" width="900" height="68" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6" />

  <!-- Subpanel 1 -->
  <rect x="42" y="458" width="276" height="56" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4" />
  <text x="180" y="478" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режим x1 (CPR = PPR)</text>
  <text x="180" y="498" font-size="12" fill="#6b7280" text-anchor="middle">1 імпульс на період диска</text>

  <!-- Subpanel 2 -->
  <rect x="342" y="458" width="276" height="56" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4" />
  <text x="480" y="478" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режим x2 (CPR = 2 × PPR)</text>
  <text x="480" y="498" font-size="12" fill="#6b7280" text-anchor="middle">Подвоєна роздільна здатність</text>

  <!-- Subpanel 3 -->
  <rect x="642" y="458" width="276" height="56" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4" />
  <text x="780" y="478" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Режим x4 (CPR = 4 × PPR)</text>
  <text x="780" y="498" font-size="12" fill="#1a1a1a" text-anchor="middle">Максимальна точність (стандарт)</text>
</svg>
