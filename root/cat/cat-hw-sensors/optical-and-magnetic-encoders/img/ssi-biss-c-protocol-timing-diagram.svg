<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-slate" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми протоколів SSI та BiSS-C</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">BiSS-C доповнює синхронний тактовий сигнал старт-бітами, прапорцями стану та апаратним захистом CRC</text>

  <!-- ==================== ПАНЕЛЬ 1: SSI ==================== -->
  <rect x="30" y="70" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок панелі 1 -->
  <text x="45" y="93" font-size="14" font-weight="bold" fill="#1a1a1a">1. SSI (Synchronous Serial Interface)</text>
  <text x="360" y="93" font-size="12" fill="#6b7280">Безквитанційний протокол без контролю цілісності</text>

  <!-- Назви сигналів -->
  <text x="45" y="138" font-size="13" font-weight="bold" fill="#2457d6">MA (Такти)</text>
  <text x="45" y="193" font-size="13" font-weight="bold" fill="#1a1a1a">SL (Дані)</text>

  <!-- Вертикальні лінії синхронізації SSI (лише між MA та SL) -->
  <line x1="230" y1="120" x2="230" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="270" y1="120" x2="270" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="310" y1="120" x2="310" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="350" y1="120" x2="350" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="390" y1="120" x2="390" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="430" y1="120" x2="430" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="460" y1="120" x2="460" y2="170" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Сигнал MA для SSI -->
  <path d="M 170,120 L 230,120 L 230,150 L 245,150 L 245,120 L 260,120 L 260,150 L 275,150 L 275,120 L 290,120 L 290,150 L 305,150 L 305,120 L 320,120 L 320,150 L 335,150 L 335,120 L 350,120 L 350,150 L 365,150 L 365,120 L 380,120 L 380,150 L 395,150 L 395,120 L 410,120 L 410,150 L 425,150 L 425,120 L 440,120 L 440,150 L 455,150 L 455,120 L 470,120 L 670,120" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Сигнал SL для SSI: Лінії виходу поза блоками -->
  <line x1="170" y1="188" x2="230" y2="188" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="570" y1="188" x2="670" y2="188" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Блок даних SSI -->
  <rect x="230" y="170" width="230" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="270" y1="170" x2="270" y2="206" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="310" y1="170" x2="310" y2="206" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="350" y1="170" x2="350" y2="206" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="390" y1="170" x2="390" y2="206" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="430" y1="170" x2="430" y2="206" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>

  <text x="250" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D_N-1</text>
  <text x="290" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D_N-2</text>
  <text x="330" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">...</text>
  <text x="370" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D1</text>
  <text x="410" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D0</text>
  <text x="445" y="193" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <!-- Блок паузи t_m SSI -->
  <rect x="460" y="170" width="110" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="515" y="193" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза t_m</text>

  <!-- Розмірні стрілки та підписи під SSI -->
  <line x1="230" y1="218" x2="460" y2="218" stroke="#2457d6" stroke-width="1" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="345" y="236" font-size="12" fill="#2457d6" text-anchor="middle">Кадр даних (12–24 біти)</text>

  <line x1="460" y1="218" x2="570" y2="218" stroke="#c0392b" stroke-width="1" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="515" y="236" font-size="12" fill="#c0392b" text-anchor="middle">t_m = 12–20 мкс</text>

  <!-- Картка особливостей SSI -->
  <rect x="710" y="93" width="200" height="175" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="722" y="115" font-size="13" font-weight="bold" fill="#1a1a1a">Особливості SSI:</text>
  <text x="722" y="137" font-size="12" fill="#1a1a1a">• Однонапрямний: MA → SL</text>
  <text x="722" y="159" font-size="12" fill="#1a1a1a">• Без старт/стоп бітів</text>
  <text x="722" y="181" font-size="12" fill="#c0392b">• Відсутній контроль CRC</text>
  <text x="722" y="203" font-size="12" fill="#6b7280">• Пауза t_m між кадрами</text>
  <text x="722" y="225" font-size="12" fill="#6b7280">• Код Ґрея або двійковий</text>
  <text x="722" y="247" font-size="12" fill="#6b7280">• Фіксоване слово даних</text>

  <!-- ==================== ПАНЕЛЬ 2: BiSS-C ==================== -->
  <rect x="30" y="300" width="900" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок панелі 2 -->
  <text x="45" y="323" font-size="14" font-weight="bold" fill="#2457d6">2. BiSS-C (Bidirectional Synchronous Serial - Continuous)</text>
  <text x="500" y="323" font-size="12" fill="#6b7280">Завадостійкий протокол із компенсацією затримки лінії</text>

  <!-- Назви сигналів -->
  <text x="45" y="365" font-size="13" font-weight="bold" fill="#2457d6">MA (Такти)</text>
  <text x="45" y="423" font-size="13" font-weight="bold" fill="#1a1a1a">SL (Дані)</text>

  <!-- Вертикальні лінії синхронізації BiSS-C (лише між MA та SL) -->
  <line x1="200" y1="350" x2="200" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="240" y1="350" x2="240" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="280" y1="350" x2="280" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="320" y1="350" x2="320" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="360" y1="350" x2="360" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="400" y1="350" x2="400" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="440" y1="350" x2="440" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="480" y1="350" x2="480" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="515" y1="350" x2="515" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="550" y1="350" x2="550" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="645" y1="350" x2="645" y2="400" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="1"/>

  <!-- Сигнал MA для BiSS-C -->
  <path d="M 170,350 L 200,350 L 200,375 L 220,375 L 220,350 L 240,350 L 240,375 L 260,375 L 260,350 L 280,350 L 280,375 L 300,375 L 300,350 L 320,350 L 320,375 L 340,375 L 340,350 L 360,350 L 360,375 L 380,375 L 380,350 L 400,350 L 400,375 L 420,375 L 420,350 L 440,350 L 440,375 L 460,375 L 460,350 L 480,350 L 480,375 L 497.5,375 L 497.5,350 L 515,350 L 515,375 L 532.5,375 L 532.5,350 L 550,350 L 550,375 L 565,375 L 565,350 L 580,350 L 580,375 L 595,375 L 595,350 L 610,350 L 610,375 L 625,375 L 625,350 L 645,350 L 705,350" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Сигнал SL для BiSS-C: Блоки полів -->
  <!-- Idle до Ack -->
  <line x1="170" y1="418" x2="200" y2="418" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Ack / Delay -->
  <rect x="200" y="400" width="40" height="36" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="423" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Ack</text>

  <!-- Start -->
  <rect x="240" y="400" width="40" height="36" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="260" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Start</text>

  <!-- CDS -->
  <rect x="280" y="400" width="40" height="36" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="423" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">CDS</text>

  <!-- Data -->
  <rect x="320" y="400" width="160" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="360" y1="400" x2="360" y2="436" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="400" y1="400" x2="400" y2="436" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="440" y1="400" x2="440" y2="436" stroke="#2457d6" stroke-opacity="0.4" stroke-width="1"/>

  <text x="340" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D_N-1</text>
  <text x="380" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D_N-2</text>
  <text x="420" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">...</text>
  <text x="460" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D0</text>

  <!-- Error E -->
  <rect x="480" y="400" width="35" height="36" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="497.5" y="423" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">E</text>

  <!-- Warning W -->
  <rect x="515" y="400" width="35" height="36" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="532.5" y="423" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">W</text>

  <!-- CRC -->
  <rect x="550" y="400" width="95" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="597.5" y="423" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CRC (6 біт)</text>

  <!-- Pause t_m -->
  <rect x="645" y="400" width="60" height="36" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="675" y="423" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_m</text>

  <!-- Idle після кадру -->
  <line x1="705" y1="418" x2="720" y2="418" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Підписи зон під BiSS-C -->
  <line x1="200" y1="448" x2="320" y2="448" stroke="#475569" stroke-width="1" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/>
  <text x="260" y="466" font-size="12" fill="#475569" text-anchor="middle">Синхронізація</text>

  <line x1="320" y1="448" x2="480" y2="448" stroke="#2457d6" stroke-width="1" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="400" y="466" font-size="12" fill="#2457d6" text-anchor="middle">Дані положення</text>

  <line x1="480" y1="448" x2="550" y2="448" stroke="#c0392b" stroke-width="1" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="515" y="466" font-size="12" fill="#c0392b" text-anchor="middle">Стан E/W</text>

  <line x1="550" y1="448" x2="645" y2="448" stroke="#27ae60" stroke-width="1" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="597.5" y="466" font-size="12" fill="#27ae60" text-anchor="middle">Захист CRC</text>

  <line x1="645" y1="448" x2="705" y2="448" stroke="#c0392b" stroke-width="1" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="675" y="466" font-size="12" fill="#c0392b" text-anchor="middle">Пауза t_m</text>

  <!-- Картка переваг BiSS-C -->
  <rect x="710" y="340" width="200" height="185" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="722" y="362" font-size="13" font-weight="bold" fill="#2457d6">Переваги BiSS-C:</text>
  <text x="722" y="384" font-size="12" fill="#1a1a1a">• Виміряння затримки кабелю</text>
  <text x="722" y="406" font-size="12" fill="#1a1a1a">• Біти Start (1) та CDS (0)</text>
  <text x="722" y="428" font-size="12" fill="#27ae60">• Контроль помилок CRC-6/8</text>
  <text x="722" y="450" font-size="12" fill="#c0392b">• Прапорці помилки (E) та W</text>
  <text x="722" y="472" font-size="12" fill="#6b7280">• Канал параметризації CDS</text>
  <text x="722" y="494" font-size="12" fill="#6b7280">• Швидкість до 10 Мбіт/с</text>
</svg>
