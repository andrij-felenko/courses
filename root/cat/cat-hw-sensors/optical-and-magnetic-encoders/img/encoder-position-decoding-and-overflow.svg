<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Marker Definitions for Arrows -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Декодування кадру BiSS-C / SSI та обробка переповнення</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Прийом кадру, перевірка CRC, XOR-конвертація коду Ґрея та усунення розривів лічильника</text>

  <!-- Connector Arrows between Panels -->
  <line x1="312" y1="170" x2="334" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="624" y1="170" x2="646" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== PANEL 1: FRAME & CRC ==================== -->
  <g id="panel-1">
    <rect x="24" y="75" width="288" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="36" y="87" width="264" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="168" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Кадр даних SSI / BiSS-C</text>

    <!-- Bit Sequence Sub-block -->
    <text x="36" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">Послідовність бітів кадру:</text>
    <rect x="36" y="152" width="144" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="108" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дані (код Ґрея)</text>
    <text x="108" y="183" text-anchor="middle" font-size="11" fill="#6b7280">12–24 біти</text>

    <rect x="184" y="152" width="36" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="202" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">E / W</text>

    <rect x="224" y="152" width="76" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="262" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CRC</text>
    <text x="262" y="183" text-anchor="middle" font-size="11" fill="#6b7280">6 бітів</text>

    <!-- CRC Check Sub-block -->
    <rect x="36" y="202" width="264" height="144" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="168" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Перевірка цілісності (CRC)</text>
    <text x="168" y="240" text-anchor="middle" font-size="11" fill="#6b7280">Поліном BiSS-C: P(x) = x⁶ + x + 1 (0x43)</text>

    <rect x="48" y="252" width="240" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="168" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">CRC_обчислено == CRC_кадру?</text>

    <!-- Branch Invalid -->
    <rect x="44" y="292" width="120" height="44" rx="4" fill="#fdecea" stroke="#c0392b"/>
    <text x="104" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Ні: Помилка CRC</text>
    <text x="104" y="324" text-anchor="middle" font-size="11" fill="#c0392b">ігнорувати кадр</text>

    <!-- Branch Valid -->
    <rect x="172" y="292" width="120" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="232" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Так: Кадр дійсний</text>
    <text x="232" y="324" text-anchor="middle" font-size="11" fill="#27ae60">передати на Ґрей</text>

    <!-- Notes Sub-block -->
    <rect x="36" y="360" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="48" y="380" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості SSI / BiSS-C:</text>
    <text x="48" y="402" font-size="11" fill="#6b7280">• Тактування від Master (CLK)</text>
    <text x="48" y="424" font-size="11" fill="#6b7280">• Дані по лінії DATA (MSB first)</text>
    <text x="48" y="446" font-size="11" fill="#6b7280">• SSI: без CRC, можливі завади</text>
    <text x="48" y="468" font-size="11" fill="#6b7280">• BiSS-C: з CRC та бітами E/W</text>
    <text x="48" y="492" font-size="12" font-weight="bold" fill="#27ae60">• Вихід: валідний код Ґрея G</text>
  </g>

  <!-- ==================== PANEL 2: GRAY TO BINARY ==================== -->
  <g id="panel-2">
    <rect x="336" y="75" width="288" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="348" y="87" width="264" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="480" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Декодування коду Ґрея</text>

    <!-- XOR Cascade Diagram Box -->
    <rect x="348" y="130" width="264" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="480" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Схема каскадного XOR (4-біт приклад)</text>

    <!-- Gray Bits (Input) -->
    <rect x="365" y="165" width="30" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="380" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">G₃</text>

    <rect x="430" y="165" width="30" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="445" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">G₂</text>

    <rect x="495" y="165" width="30" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="510" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">G₁</text>

    <rect x="560" y="165" width="30" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="575" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">G₀</text>

    <!-- Binary Bits (Output) -->
    <rect x="365" y="245" width="30" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="380" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">B₃</text>

    <rect x="430" y="245" width="30" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="445" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">B₂</text>

    <rect x="495" y="245" width="30" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="510" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">B₁</text>

    <rect x="560" y="245" width="30" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="575" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">B₀</text>

    <!-- Connections & XOR Gates -->
    <!-- Bit 3 straight down -->
    <line x1="380" y1="189" x2="380" y2="243" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="398" y="214" font-size="11" font-weight="bold" fill="#2457d6">B₃ = G₃</text>

    <!-- Bit 2 XOR -->
    <circle cx="445" cy="215" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="445" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">⊕</text>
    <line x1="445" y1="189" x2="445" y2="204" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <path d="M 380,225 L 415,225 L 434,217" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
    <line x1="445" y1="224" x2="445" y2="243" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Bit 1 XOR -->
    <circle cx="510" cy="215" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="510" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">⊕</text>
    <line x1="510" y1="189" x2="510" y2="204" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <path d="M 445,225 L 480,225 L 499,217" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
    <line x1="510" y1="224" x2="510" y2="243" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Bit 0 XOR -->
    <circle cx="575" cy="215" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="575" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">⊕</text>
    <line x1="575" y1="189" x2="575" y2="204" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <path d="M 510,225 L 545,225 L 564,217" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
    <line x1="575" y1="224" x2="575" y2="243" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- Code Implementation Box -->
    <rect x="348" y="295" width="264" height="230" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="360" y="315" font-size="12" font-weight="bold" fill="#1a1a1a">Алгоритм швидкого перетворення:</text>

    <rect x="358" y="325" width="244" height="120" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="366" y="343" font-size="11" font-family="monospace" fill="#1a1a1a">uint32_t gray_to_bin(uint32_t g) {</text>
    <text x="366" y="361" font-size="11" font-family="monospace" fill="#1a1a1a">    uint32_t b = g;</text>
    <text x="366" y="379" font-size="11" font-family="monospace" fill="#1a1a1a">    b ^= (b &gt;&gt; 1);  b ^= (b &gt;&gt; 2);</text>
    <text x="366" y="397" font-size="11" font-family="monospace" fill="#1a1a1a">    b ^= (b &gt;&gt; 4);  b ^= (b &gt;&gt; 8);</text>
    <text x="366" y="415" font-size="11" font-family="monospace" fill="#1a1a1a">    b ^= (b &gt;&gt; 16); return b;</text>
    <text x="366" y="433" font-size="11" font-family="monospace" fill="#1a1a1a">}</text>

    <text x="360" y="465" font-size="12" fill="#6b7280">• Паралельні зсуви O(log N)</text>
    <text x="360" y="485" font-size="12" fill="#6b7280">• Виконується за 5 системних тактів</text>
    <text x="360" y="505" font-size="12" font-weight="bold" fill="#27ae60">• Вихід: двополярний/абсолютний bin</text>
  </g>

  <!-- ==================== PANEL 3: OVERFLOW & ACCUMULATOR ==================== -->
  <g id="panel-3">
    <rect x="648" y="75" width="288" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="660" y="87" width="264" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="792" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Обробка переповнення (Delta)</text>

    <!-- Delta Logic Box -->
    <rect x="660" y="130" width="264" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="792" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Обчислення різниці (16-біт N = 65536)</text>
    <text x="672" y="170" font-size="12" font-weight="bold" fill="#1a1a1a">Δ = pos_raw - pos_prev</text>

    <rect x="672" y="182" width="240" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="792" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">якщо Δ &lt; -N/2  ⇒  Δ = Δ + N  (+)</text>

    <rect x="672" y="212" width="240" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="792" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">якщо Δ &gt; +N/2  ⇒  Δ = Δ - N  (-)</text>

    <rect x="672" y="242" width="240" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="792" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">pos_total = pos_total + Δ</text>

    <!-- Graph / Rollover Correction Diagram -->
    <rect x="660" y="285" width="264" height="240" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="792" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Усунення розриву лічильника</text>
    <text x="770" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Стрибок 0xFFFF→0</text>

    <!-- Graph Grid Axes -->
    <line x1="710" y1="338" x2="710" y2="462" stroke="#6b7280" stroke-width="1"/>
    <line x1="710" y1="462" x2="905" y2="462" stroke="#6b7280" stroke-width="1"/>

    <text x="705" y="348" text-anchor="end" font-size="11" fill="#6b7280">N-1</text>
    <text x="705" y="465" text-anchor="end" font-size="11" fill="#6b7280">0</text>

    <line x1="710" y1="345" x2="905" y2="345" stroke="#d0d7de" stroke-dasharray="2,2"/>

    <!-- Curves -->
    <!-- Raw sawtooth curve with step jump -->
    <path d="M 710,455 L 770,355" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="770" y1="355" x2="770" y2="455" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 770,455 L 860,385" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Accumulated smooth position line -->
    <path d="M 710,455 L 770,400 L 860,345" fill="none" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Legend -->
    <line x1="672" y1="482" x2="692" y2="482" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="698" y="486" font-size="11" fill="#c0392b">pos_raw (з розривом)</text>

    <line x1="672" y1="504" x2="692" y2="504" stroke="#27ae60" stroke-width="2.5"/>
    <text x="698" y="508" font-size="11" font-weight="bold" fill="#27ae60">pos_total (безперервна)</text>
  </g>
</svg>
