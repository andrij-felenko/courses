<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний інтерфейс RS-422 для енкодерів SSI / BiSS-C</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення сигналів МК у диференційні лінії MA+/MA- та SL+/SL- із TVS-захистом</text>

  <!-- PANEL 1: MICROCONTROLLER -->
  <rect x="30" y="70" width="175" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="70" width="175" height="40" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="117.5" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="117.5" y="108" font-size="12" fill="#6b7280" text-anchor="middle">( Host / Master )</text>

  <!-- MCU MA Clock Section -->
  <rect x="40" y="140" width="155" height="75" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="117.5" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль SPI / PWM</text>
  <text x="117.5" y="176" font-size="11" fill="#6b7280" text-anchor="middle">Генератор CLK</text>
  <rect x="135" y="185" width="55" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="162.5" y="201" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MA_OUT</text>

  <!-- MCU SL Data Section -->
  <rect x="40" y="310" width="155" height="75" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="117.5" y="330" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зсувний регістр</text>
  <text x="117.5" y="346" font-size="11" fill="#6b7280" text-anchor="middle">Приймач даних</text>
  <rect x="135" y="363" width="55" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="162.5" y="379" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SL_IN</text>

  <!-- MCU Spec Box -->
  <rect x="40" y="430" width="155" height="70" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="117.5" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри МК:</text>
  <text x="117.5" y="466" font-size="11" fill="#6b7280" text-anchor="middle">• Рівні: 3.3V CMOS</text>
  <text x="117.5" y="484" font-size="11" fill="#6b7280" text-anchor="middle">• F_max: до 10 МГц</text>


  <!-- PANEL 2: RS-422 INTERFACE MODULE -->
  <rect x="235" y="70" width="490" height="445" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="235" y="70" width="490" height="40" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="94" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль узгодження RS-422</text>
  <text x="480" y="108" font-size="12" fill="#6b7280" text-anchor="middle">( Диференційний трансивер та завадозахист )</text>

  <!-- CHANNEL 1: MASTER CLOCK (MA) -->
  <!-- Line MCU to Tx MA -->
  <line x1="190" y1="197" x2="260" y2="197" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="225" y="186" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MA (TTL)</text>

  <!-- Tx MA IC -->
  <rect x="260" y="160" width="95" height="74" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="268" y="201" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">DI</text>
  <text x="347" y="182" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Y</text>
  <text x="347" y="217" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Z</text>
  <text x="307.5" y="182" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Tx MA</text>
  <text x="307.5" y="198" font-size="11" fill="#6b7280" text-anchor="middle">MAX485/3485</text>

  <!-- Differential Lines MA+ and MA- -->
  <line x1="355" y1="177" x2="755" y2="177" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="355" y1="212" x2="755" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="365" y="166" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">MA+ (Clock +)</text>
  <text x="365" y="226" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">MA- (Clock -)</text>

  <!-- TVS Protection (MA Channel) -->
  <circle cx="625" cy="177" r="3" fill="#27ae60"/>
  <circle cx="625" cy="212" r="3" fill="#27ae60"/>
  <line x1="625" y1="177" x2="625" y2="242" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="625" y1="212" x2="625" y2="242" stroke="#27ae60" stroke-width="1.5"/>

  <rect x="580" y="242" width="90" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="625" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">TVS-діоди</text>
  <text x="625" y="276" font-size="11" fill="#6b7280" text-anchor="middle">ESD-захист</text>

  <line x1="625" y1="288" x2="625" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground Symbol MA TVS -->
  <line x1="615" y1="296" x2="635" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="619" y1="299" x2="631" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="623" y1="302" x2="627" y2="302" stroke="#1a1a1a" stroke-width="1.5"/>


  <!-- CHANNEL 2: SLAVE DATA (SL) -->
  <!-- Differential Lines SL+ and SL- -->
  <line x1="755" y1="355" x2="355" y2="355" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="755" y1="390" x2="355" y2="390" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="715" y="344" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SL+ (Data +)</text>
  <text x="715" y="405" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SL- (Data -)</text>

  <!-- Fail-Safe Biasing Network (SL Channel) -->
  <!-- VCC Bar +3.3V -->
  <text x="395" y="286" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V</text>
  <line x1="387" y1="292" x2="403" y2="292" stroke="#c0392b" stroke-width="2"/>
  <line x1="395" y1="292" x2="395" y2="304" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="389" y="304" width="12" height="24" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="328" x2="395" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="395" cy="355" r="3" fill="#1a1a1a"/>
  <text x="383" y="320" font-size="11" fill="#6b7280" text-anchor="end">R_PU (1 kΩ)</text>

  <!-- Pull-Down Resistor R_PD -->
  <circle cx="395" cy="390" r="3" fill="#1a1a1a"/>
  <line x1="395" y1="390" x2="395" y2="412" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="389" y="412" width="12" height="24" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="436" x2="395" y2="448" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground Symbol R_PD -->
  <line x1="385" y1="448" x2="405" y2="448" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="389" y1="451" x2="401" y2="451" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="393" y1="454" x2="397" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="383" y="428" font-size="11" fill="#6b7280" text-anchor="end">R_PD (1 kΩ)</text>

  <!-- Termination Resistor RT = 120 Ohm -->
  <circle cx="475" cy="355" r="3" fill="#1a1a1a"/>
  <circle cx="475" cy="390" r="3" fill="#1a1a1a"/>
  <line x1="475" y1="355" x2="475" y2="361" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="469" y="361" width="12" height="23" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="475" y1="384" x2="475" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="475" y="344" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RT = 120 Ω</text>

  <!-- TVS Protection (SL Channel) -->
  <circle cx="625" cy="355" r="3" fill="#27ae60"/>
  <circle cx="625" cy="390" r="3" fill="#27ae60"/>
  <line x1="625" y1="355" x2="625" y2="415" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="625" y1="390" x2="625" y2="415" stroke="#27ae60" stroke-width="1.5"/>

  <rect x="580" y="415" width="90" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="625" y="433" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">TVS-діоди</text>
  <text x="625" y="449" font-size="11" fill="#6b7280" text-anchor="middle">ESD-захист</text>

  <line x1="625" y1="461" x2="625" y2="469" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground Symbol SL TVS -->
  <line x1="615" y1="469" x2="635" y2="469" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="619" y1="472" x2="631" y2="472" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="623" y1="475" x2="627" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Rx SL IC -->
  <rect x="260" y="340" width="95" height="74" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="347" y="360" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">A</text>
  <text x="347" y="395" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">B</text>
  <text x="268" y="379" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">RO</text>
  <text x="307.5" y="362" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Rx SL</text>
  <text x="307.5" y="378" font-size="11" fill="#6b7280" text-anchor="middle">MAX3095/3485</text>

  <!-- Line Rx SL to MCU -->
  <line x1="260" y1="375" x2="190" y2="375" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="225" y="365" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SL (TTL)</text>

  <!-- STP Cable Spec Badge -->
  <rect x="340" y="465" width="200" height="40" rx="4" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="440" y="481" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Екранована вита пара (STP)</text>
  <text x="440" y="496" font-size="11" fill="#6b7280" text-anchor="middle">Хвильовий опір Z0 = 120 Ом</text>


  <!-- PANEL 3: ENCODER -->
  <rect x="755" y="70" width="175" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="755" y="70" width="175" height="40" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="842.5" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Абсолютний енкодер</text>
  <text x="842.5" y="108" font-size="12" fill="#6b7280" text-anchor="middle">( SSI / BiSS-C Slave )</text>

  <!-- Encoder MA Receiver + Internal Resistor -->
  <circle cx="770" cy="177" r="3" fill="#1a1a1a"/>
  <circle cx="770" cy="212" r="3" fill="#1a1a1a"/>
  <line x1="770" y1="177" x2="770" y2="183" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="764" y="183" width="12" height="23" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="770" y1="206" x2="770" y2="212" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="770" y="166" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">120 Ω</text>

  <rect x="795" y="160" width="115" height="68" rx="4" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="852.5" y="185" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rx MA</text>
  <text x="852.5" y="201" font-size="11" fill="#6b7280" text-anchor="middle">Приймач CLK</text>

  <!-- Signal flow from Rx MA down to Scale -->
  <line x1="852.5" y1="228" x2="852.5" y2="248" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sensor Optical/Magnetic Scale Block -->
  <rect x="770" y="248" width="145" height="72" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="842.5" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Оптична / Магнітна</text>
  <text x="842.5" y="286" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">шкала енкодера</text>
  <text x="842.5" y="303" font-size="11" fill="#6b7280" text-anchor="middle">(Код Ґрея / CRC)</text>

  <!-- Signal flow from Scale down to Tx SL -->
  <line x1="852.5" y1="320" x2="852.5" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Encoder SL Driver -->
  <rect x="795" y="340" width="115" height="68" rx="4" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="852.5" y="365" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tx SL</text>
  <text x="852.5" y="381" font-size="11" fill="#6b7280" text-anchor="middle">Передавач Data</text>

  <!-- Encoder Spec Box -->
  <rect x="765" y="430" width="155" height="70" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="842.5" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики:</text>
  <text x="842.5" y="466" font-size="11" fill="#6b7280" text-anchor="middle">• Роздільність: 12-24 біт</text>
  <text x="842.5" y="484" font-size="11" fill="#6b7280" text-anchor="middle">• Затримка t_d &lt; 100 нс</text>
</svg>
