  <rect x="710" y="195" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
  <rect x="750" y="195" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
  <rect x="790" y="195" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
