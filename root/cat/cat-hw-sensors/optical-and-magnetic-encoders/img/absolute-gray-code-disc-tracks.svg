  <!-- Підсвітка безпечного переходу 3 -> 4 у коді Ґрея -->
  <rect x="668" y="156" width="84" height="118" rx="4" fill="#e9f7ef" fill-opacity="0.4" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="710" y="282" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Δ = 1 біт</text>

  <!-- Блок пояснення успіху правої панелі -->
  <rect x="510" y="290" width="395" height="125" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="314" font-size="13" font-weight="bold" fill="#27ae60">Перехід 3 → 4 (010₂ → 110₂):</text>
  <text x="525" y="336" font-size="12" fill="#1a1a1a">• Змінюється ЛИШЕ 1 біт (g₂: 0 → 1)</text>
  <text x="525" y="358" font-size="12" fill="#1a1a1a">• При будь-якій неузгодженості датчиків:</text>
  <text x="525" y="380" font-size="12" font-weight="bold" fill="#27ae60">  зчитається 010 (3) або 110 (4)</text>
  <text x="525" y="402" font-size="12" fill="#27ae60">  (Глітчі виключені! Помилка ≤ 1 сектор)</text>

  <!-- НИЖНЯ ПАНЕЛЬ: ПРАКТИЧНИЙ ВИСНОВОК ТА ДЕКОДУВАННЯ -->
  <rect x="40" y="445" width="880" height="75" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="55" y="467" font-size="13" font-weight="bold" fill="#2457d6">Практичне значення та декодування коду Ґрея в МК:</text>
  <text x="55" y="488" font-size="12" fill="#1a1a1a">• Маска диска енкодера виконується в коді Ґрея для запобігання хибним спрацьовуванням при зчитуванні.</text>
  <text x="55" y="508" font-size="12" fill="#6b7280">• Перетворення в двійковий код: B[n-1] = G[n-1], B[i] = B[i+1] ⊕ G[i] (виконується в МК однією XOR-операцією).</text>
</svg>
