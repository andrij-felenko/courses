  <rect x="790" y="165" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
  <rect x="830" y="165" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>

  <text x="570" y="181" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="610" y="181" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="650" y="181" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="690" y="181" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="730" y="181" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="770" y="181" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="810" y="181" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="850" y="181" font-size="12" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Доріжка g1 -->
  <rect x="550" y="195" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="590" y="195" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="630" y="195" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
