  <text x="690" y="211" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="730" y="211" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="770" y="211" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <text x="810" y="211" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
