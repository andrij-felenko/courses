  <!-- Підсвітка критичного переходу 3 -> 4 у двійковому коді -->
  <rect x="213" y="156" width="84" height="118" rx="4" fill="#fdecea" fill-opacity="0.4" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="255" y="282" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Δ = 3 біти!</text>

  <!-- Блок пояснення помилки лівої панелі -->
  <rect x="55" y="290" width="395" height="125" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="70" y="314" font-size="13" font-weight="bold" fill="#c0392b">Перехід 3 → 4 (011₂ → 100₂):</text>
  <text x="70" y="336" font-size="12" fill="#1a1a1a">• Змінюються УСІ 3 біти одночасно</text>
  <text x="70" y="358" font-size="12" fill="#1a1a1a">• При мікронезсуві датчиків виникає глітч:</text>
  <text x="70" y="380" font-size="12" font-weight="bold" fill="#c0392b">  011 → [111 (7) або 000 (0)] → 100</text>
  <text x="70" y="402" font-size="12" fill="#c0392b">  (Величезна стрибкоподібна помилка!)</text>

