<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння двійкового коду та коду Ґрея в абсолютних енкодерах</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Код Ґрея змінює лише один біт між сусідніми секторами, усуваючи зчитувальні глітчі</text>

  <!-- ЛІВА ПАНЕЛЬ: ДВІЙКОВИЙ КОД -->
  <rect x="40" y="80" width="425" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="252" y="108" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Прямий двійковий код (Binary Code)</text>
  <text x="252" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Зміна кількох бітів одночасно (ризик глітчів)</text>

  <!-- Підпис колонок (секторів) у лівій панелі -->
  <text x="115" y="148" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="155" y="148" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
  <text x="195" y="148" font-size="12" fill="#6b7280" text-anchor="middle">2</text>
  <text x="235" y="148" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
  <text x="275" y="148" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
  <text x="315" y="148" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
  <text x="355" y="148" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
  <text x="395" y="148" font-size="12" fill="#6b7280" text-anchor="middle">7</text>

  <!-- Назви доріжок у лівій панелі -->
  <text x="90" y="181" font-size="12" fill="#1a1a1a" text-anchor="end">b₂</text>
  <text x="90" y="211" font-size="12" fill="#1a1a1a" text-anchor="end">b₁</text>
  <text x="90" y="241" font-size="12" fill="#1a1a1a" text-anchor="end">b₀</text>

  <!-- Доріжка b2 (MSB) -->
  <rect x="95" y="165" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="135" y="165" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
