  <text x="650" y="148" font-size="12" fill="#6b7280" text-anchor="middle">2</text>
  <text x="690" y="148" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
  <text x="730" y="148" font-size="12" fill="#6b7280" text-anchor="middle">4</text>
  <text x="770" y="148" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
  <text x="810" y="148" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
  <text x="850" y="148" font-size="12" fill="#6b7280" text-anchor="middle">7</text>

  <!-- Назви доріжок у правій панелі -->
  <text x="545" y="181" font-size="12" fill="#1a1a1a" text-anchor="end">g₂</text>
  <text x="545" y="211" font-size="12" fill="#1a1a1a" text-anchor="end">g₁</text>
  <text x="545" y="241" font-size="12" fill="#1a1a1a" text-anchor="end">g₀</text>

  <!-- Доріжка g2 (MSB) -->
  <rect x="550" y="165" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="590" y="165" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="630" y="165" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
