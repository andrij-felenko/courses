  <rect x="95" y="195" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="135" y="195" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="175" y="195" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
  <rect x="215" y="195" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
  <rect x="255" y="195" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
