  <rect x="630" y="225" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
  <rect x="670" y="225" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="710" y="225" width="40" height="24" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="750" y="225" width="40" height="24" fill="#1a1a1a" stroke="#1a1a1a"/>
