<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Узгодження виходів та екранування кабелів енкодерів</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Підтяжка Open Collector, термінування RS-422 (120 Ом) та одноточкове заземлення екрана PE</text>

  <!-- ==================== PANEL A: Open Collector ==================== -->
  <rect x="30" y="75" width="435" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="98" font-size="14" font-weight="700" fill="#2457d6">а) Вихід Open Collector (NPN / HTL)</text>
  <text x="45" y="116" font-size="12" fill="#6b7280">Підтягувальний резистор R_pull-up до V_CC</text>

  <!-- Encoder Block (A) -->
  <rect x="45" y="132" width="105" height="100" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="97" y="150" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Енкодер</text>
  <text x="97" y="166" font-size="12" fill="#6b7280" text-anchor="middle">(NPN-ключ)</text>
  <!-- NPN Transistor symbol -->
  <line x1="65" y1="195" x2="85" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="183" x2="85" y2="207" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="85" y1="189" x2="105" y2="177" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="201" x2="105" y2="213" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="105" y1="177" x2="105" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="105" y1="170" x2="150" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="105" y1="213" x2="105" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Transistor GND -->
  <line x1="97" y1="225" x2="113" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Receiver Block (A) -->
  <rect x="345" y="132" width="105" height="100" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="397" y="150" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Приймач (PLC)</text>
  <text x="397" y="166" font-size="12" fill="#6b7280" text-anchor="middle">Вхід DIN</text>
  <!-- Optocoupler/Buffer inside Receiver -->
  <rect x="370" y="180" width="55" height="35" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="397" y="202" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">MCU / Opto</text>

  <!-- VCC Line and Pull-Up Resistor -->
  <line x1="245" y1="130" x2="245" y2="145" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="237" y1="130" x2="253" y2="130" stroke="#2457d6" stroke-width="2"/>
  <text x="245" y="124" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">+V_CC (+5V / +24V)</text>

  <!-- Pull-Up Resistor Box -->
  <rect x="237" y="145" width="16" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="260" y="164" font-size="12" font-weight="700" fill="#2457d6">R_pull-up</text>

  <!-- Signal Line from Encoder to PLC -->
  <line x1="150" y1="170" x2="245" y2="170" stroke="#2457d6" stroke-width="2"/>
  <line x1="245" y1="175" x2="245" y2="170" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="245" y1="170" x2="370" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="245" cy="170" r="3" fill="#2457d6"/>
  <text x="200" y="162" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сигнал A</text>

  <!-- Formula Box (A) -->
  <rect x="45" y="240" width="405" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="260" font-size="12" fill="#1a1a1a" text-anchor="middle">R_pull-up = (V_CC - V_OL) / I_sink  (типово 1.0 – 4.7 кОм)</text>


  <!-- ==================== PANEL B: RS-422 Differential ==================== -->
  <rect x="495" y="75" width="435" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="98" font-size="14" font-weight="700" fill="#2457d6">б) Диференційна лінія RS-422 / TTL</text>
  <text x="510" y="116" font-size="12" fill="#6b7280">Термінувальний резистор R_T = 120 Ом на кінці лінії</text>

  <!-- Driver Block (B) -->
  <rect x="510" y="132" width="105" height="100" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="562" y="150" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Драйвер RS-422</text>
  <!-- Driver Symbol (Triangle) -->
  <polygon points="535,168 535,212 575,190" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="575" y1="180" x2="615" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="575" y1="200" x2="615" y2="200" stroke="#c0392b" stroke-width="2"/>

  <!-- Receiver Block (B) -->
  <rect x="810" y="132" width="105" height="100" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="862" y="150" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Приймач RS-422</text>
  <!-- Receiver Symbol (Triangle) -->
  <polygon points="835,168 835,212 875,190" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Differential Lines A+ and A- -->
  <line x1="615" y1="180" x2="770" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="770" y1="180" x2="835" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="615" y1="200" x2="770" y2="200" stroke="#c0392b" stroke-width="2"/>
  <line x1="770" y1="200" x2="835" y2="200" stroke="#c0392b" stroke-width="2"/>

  <text x="645" y="172" font-size="12" font-weight="700" fill="#2457d6">A+</text>
  <text x="645" y="214" font-size="12" font-weight="700" fill="#c0392b">A-</text>

  <!-- Termination Resistor R_T (120 Ohm) -->
  <line x1="770" y1="180" x2="770" y2="186" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="762" y="186" width="16" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="770" y1="204" x2="770" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="770" cy="180" r="3" fill="#2457d6"/>
  <circle cx="770" cy="200" r="3" fill="#c0392b"/>

  <text x="770" y="170" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">R_T = 120 Ом</text>

  <!-- Formula Box (B) -->
  <rect x="510" y="240" width="405" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="260" font-size="12" fill="#1a1a1a" text-anchor="middle">R_T = Z_0 (120 Ом) запобігає відбиттю сигналів у лінії</text>


  <!-- ==================== PANEL C: Shielding & PE Grounding ==================== -->
  <rect x="30" y="295" width="900" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="318" font-size="14" font-weight="700" fill="#2457d6">в) Екранування сигнального кабелю та відведення завад (EMI)</text>
  <text x="45" y="336" font-size="12" fill="#6b7280">Одноточкове з'єднання екрана з PE на боці шафи керування запобігає контурам заземлення</text>

  <!-- Encoder Block (C) -->
  <rect x="45" y="355" width="140" height="130" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="378" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Енкодер</text>
  <text x="115" y="396" font-size="12" fill="#6b7280" text-anchor="middle">Металевий корпус</text>
  <text x="115" y="426" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Екран ізольовано</text>
  <text x="115" y="442" font-size="12" fill="#6b7280" text-anchor="middle">(без контуру GND)</text>

  <!-- Cabinet / PLC Block (C) -->
  <rect x="775" y="355" width="140" height="130" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="845" y="378" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Шафа керування</text>
  <text x="845" y="396" font-size="12" fill="#6b7280" text-anchor="middle">ПЛК / ЧПК / Drive</text>

  <!-- Cable Shield Outer Sleeve -->
  <rect x="185" y="380" width="590" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="480" y="373" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Металевий екран кабелю (Braid Shield, 360°)</text>

  <!-- Inner Conductors -->
  <line x1="185" y1="398" x2="775" y2="398" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="185" y1="412" x2="775" y2="412" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="408" font-size="12" fill="#1a1a1a" text-anchor="middle">Виті пари сигнальних жил (A, /A, B, /B, Z, /Z)</text>

  <!-- Shield Connection to PE at Cabinet Side -->
  <line x1="740" y1="430" x2="740" y2="460" stroke="#27ae60" stroke-width="2"/>
  <circle cx="740" cy="430" r="3" fill="#27ae60"/>

  <!-- PE Ground Symbol -->
  <line x1="728" y1="460" x2="752" y2="460" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="733" y1="464" x2="747" y2="464" stroke="#27ae60" stroke-width="2"/>
  <line x1="737" y1="468" x2="743" y2="468" stroke="#27ae60" stroke-width="1.5"/>

  <text x="760" y="458" font-size="13" font-weight="700" fill="#27ae60">PE (Protective Earth)</text>
  <text x="760" y="474" font-size="12" fill="#27ae60">Одноточкове заземлення 360°</text>

  <!-- EMI Noise Current Arrow -->
  <path d="M 230,442 L 710,442" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>
  <text x="480" y="456" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Струм високочастотних завад I_EMI відводиться в PE</text>
</svg>
