<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідні інтерфейси енкодерів: TTL, HTL та RS-422</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">HTL дає високу амплітуду (24 В), RS-422 придушує синфазні завади диференційною парою (A / Ā)</text>

  <!-- ================= PANEL 1: TTL ================= -->
  <g id="panel-ttl">
    <!-- Container -->
    <rect x="25" y="78" width="290" height="462" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Header Banner -->
    <rect x="35" y="88" width="270" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="170" y="109" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">TTL (5 В, Single-Ended)</text>

    <!-- Card 1: Waveform -->
    <rect x="35" y="130" width="270" height="120" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="45" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал A (0–5 В)</text>
    
    <!-- Voltage levels -->
    <line x1="80" y1="170" x2="280" y2="170" stroke="#d0d7de" stroke-dasharray="3,3"/>
    <line x1="80" y1="220" x2="280" y2="220" stroke="#9ca3af"/>
    <text x="75" y="174" font-size="12" fill="#6b7280" text-anchor="end">5 В</text>
    <text x="75" y="224" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
    
    <!-- Waveform -->
    <path d="M 85,220 L 85,170 L 135,170 L 135,220 L 185,220 L 185,170 L 235,170 L 235,220 L 275,220" fill="none" stroke="#2457d6" stroke-width="2.5"/>
    <text x="240" y="156" font-size="12" font-weight="bold" fill="#2457d6">A = 5 В</text>

    <!-- Card 2: Circuit & Noise -->
    <rect x="35" y="260" width="270" height="120" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="45" y="275" font-size="12" font-weight="bold" fill="#1a1a1a">Схема та завадостійкість</text>
    
    <!-- Driver -->
    <rect x="45" y="288" width="55" height="52" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="72" y="308" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TTL</text>
    <text x="72" y="326" font-size="12" fill="#6b7280" text-anchor="middle">+5 В</text>
    
    <!-- Receiver -->
    <rect x="235" y="288" width="60" height="52" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="265" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">Приймач</text>
    
    <!-- Signal Line -->
    <line x1="100" y1="314" x2="235" y2="314" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="128" y="306" font-size="12" font-weight="bold" fill="#2457d6">Сигнал A</text>
    
    <!-- Noise Arrow -->
    <line x1="205" y1="285" x2="205" y2="308" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="205" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">U_зав</text>

    <!-- Problem Badge -->
    <rect x="45" y="348" width="250" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="170" y="364" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Низька завадостійкість (U_зав)</text>

    <!-- Card 3: Specs -->
    <rect x="35" y="390" width="270" height="138" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="45" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">Напруга живлення:</text>
    <text x="175" y="410" font-size="12" fill="#1a1a1a">5 В DC</text>
    
    <text x="45" y="430" font-size="12" font-weight="bold" fill="#1a1a1a">Рівні сигналів:</text>
    <text x="175" y="430" font-size="12" fill="#1a1a1a">LOW 0V / HIGH 5V</text>
    
    <text x="45" y="450" font-size="12" font-weight="bold" fill="#1a1a1a">Макс. довжина:</text>
    <text x="175" y="450" font-size="12" fill="#1a1a1a">до 5–10 м</text>
    
    <text x="45" y="470" font-size="12" font-weight="bold" fill="#1a1a1a">Тип лінії:</text>
    <text x="175" y="470" font-size="12" fill="#1a1a1a">Однофазна (A, B, Z)</text>
    
    <!-- Status Pill -->
    <rect x="45" y="490" width="250" height="28" rx="4" fill="#fdecea" stroke="#c0392b"/>
    <text x="170" y="508" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ Чутливий до завад і наводок</text>
  </g>

  <!-- ================= PANEL 2: HTL ================= -->
  <g id="panel-htl">
    <!-- Container -->
    <rect x="335" y="78" width="290" height="462" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Header Banner -->
    <rect x="345" y="88" width="270" height="32" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="480" y="109" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">HTL (10–30 В, Push-Pull)</text>

    <!-- Card 1: Waveform -->
    <rect x="345" y="130" width="270" height="120" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="355" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал A (0–24 В)</text>
    
    <!-- Voltage levels -->
    <line x1="390" y1="170" x2="590" y2="170" stroke="#d0d7de" stroke-dasharray="3,3"/>
    <line x1="390" y1="220" x2="590" y2="220" stroke="#9ca3af"/>
    <text x="385" y="174" font-size="12" fill="#6b7280" text-anchor="end">24 В</text>
    <text x="385" y="224" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
    
    <!-- Waveform -->
    <path d="M 395,220 L 395,170 L 445,170 L 445,220 L 495,220 L 495,170 L 545,170 L 545,220 L 585,220" fill="none" stroke="#27ae60" stroke-width="2.5"/>
    <text x="545" y="156" font-size="12" font-weight="bold" fill="#27ae60">A = 24 В</text>

    <!-- Card 2: Circuit & High Threshold -->
    <rect x="345" y="260" width="270" height="120" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="355" y="275" font-size="12" font-weight="bold" fill="#1a1a1a">Високий поріг спрацьовування</text>
    
    <!-- Driver -->
    <rect x="355" y="288" width="55" height="52" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="382" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HTL</text>
    <text x="382" y="326" font-size="12" fill="#6b7280" text-anchor="middle">+24 В</text>
    
    <!-- Receiver -->
    <rect x="545" y="288" width="60" height="52" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="575" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">ПЛК</text>
    <text x="575" y="326" font-size="12" fill="#6b7280" text-anchor="middle">24 В</text>
    
    <!-- Signal Line -->
    <line x1="410" y1="314" x2="545" y2="314" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="477" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сигнал A (24 В)</text>

    <!-- Solution Badge -->
    <rect x="355" y="348" width="250" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="480" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Завади &lt; 5 В ігноруються порогом</text>

    <!-- Card 3: Specs -->
    <rect x="345" y="390" width="270" height="138" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="355" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">Напруга живлення:</text>
    <text x="485" y="410" font-size="12" fill="#1a1a1a">10–30 В DC</text>
    
    <text x="355" y="430" font-size="12" font-weight="bold" fill="#1a1a1a">Рівні сигналів:</text>
    <text x="485" y="430" font-size="12" fill="#1a1a1a">LOW ~0V / HIGH ~24V</text>
    
    <text x="355" y="450" font-size="12" font-weight="bold" fill="#1a1a1a">Макс. довжина:</text>
    <text x="485" y="450" font-size="12" fill="#1a1a1a">до 50–100 м</text>
    
    <text x="355" y="470" font-size="12" font-weight="bold" fill="#1a1a1a">Тип лінії:</text>
    <text x="485" y="470" font-size="12" fill="#1a1a1a">Push-Pull (HTL)</text>
    
    <!-- Status Pill -->
    <rect x="355" y="490" width="250" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="480" y="508" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Пряме підключення до ПЛК</text>
  </g>

  <!-- ================= PANEL 3: RS-422 ================= -->
  <g id="panel-rs422">
    <!-- Container -->
    <rect x="645" y="78" width="290" height="462" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Header Banner -->
    <rect x="655" y="88" width="270" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="790" y="109" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">RS-422 (Диференційний)</text>

    <!-- Card 1: Waveforms -->
    <rect x="655" y="130" width="270" height="120" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="665" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Протифазні сигнали A та Ā</text>
    
    <!-- Voltage levels -->
    <line x1="700" y1="165" x2="880" y2="165" stroke="#d0d7de" stroke-dasharray="3,3"/>
    <line x1="700" y1="215" x2="880" y2="215" stroke="#9ca3af"/>
    <text x="695" y="169" font-size="12" fill="#6b7280" text-anchor="end">5 В</text>
    <text x="695" y="219" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
    
    <!-- Waveform A (Blue) -->
    <path d="M 705,165 L 745,165 L 745,215 L 795,215 L 795,165 L 845,165 L 845,215 L 875,215" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="884" y="169" font-size="12" font-weight="bold" fill="#2457d6">A</text>
    
    <!-- Waveform /A (Red) -->
    <path d="M 705,215 L 745,215 L 745,165 L 795,165 L 795,215 L 845,215 L 845,165 L 875,165" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="884" y="219" font-size="12" font-weight="bold" fill="#c0392b">Ā</text>
    
    <!-- Formula -->
    <text x="790" y="238" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">U_диф = U_A − U_Ā</text>

    <!-- Card 2: Circuit & Common Mode Noise Rejection -->
    <rect x="655" y="260" width="270" height="120" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="665" y="275" font-size="12" font-weight="bold" fill="#1a1a1a">Придушення синфазної завади</text>
    
    <!-- Driver -->
    <rect x="665" y="288" width="55" height="52" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="692" y="308" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RS-422</text>
    <text x="692" y="326" font-size="12" fill="#6b7280" text-anchor="middle">Driver</text>
    
    <!-- Receiver -->
    <rect x="850" y="288" width="65" height="52" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="882" y="308" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Diff. Rx</text>
    <text x="882" y="326" font-size="12" fill="#6b7280" text-anchor="middle">120 Ом</text>
    
    <!-- Differential Lines -->
    <line x1="720" y1="304" x2="850" y2="304" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="726" y="298" font-size="12" font-weight="bold" fill="#2457d6">A</text>
    
    <line x1="720" y1="324" x2="850" y2="324" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="726" y="336" font-size="12" font-weight="bold" fill="#c0392b">Ā</text>

    <!-- Rejection Badge -->
    <rect x="665" y="348" width="250" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="790" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Синфазна завада повністю придушується</text>

    <!-- Card 3: Specs -->
    <rect x="655" y="390" width="270" height="138" rx="4" fill="white" stroke="#d0d7de"/>
    <text x="665" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">Напруга сигналів:</text>
    <text x="795" y="410" font-size="12" fill="#1a1a1a">5 В (Диф.)</text>
    
    <text x="665" y="430" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнальні лінії:</text>
    <text x="795" y="430" font-size="12" fill="#1a1a1a">A, Ā, B, B̄, Z, Z̄</text>
    
    <text x="665" y="450" font-size="12" font-weight="bold" fill="#1a1a1a">Макс. довжина:</text>
    <text x="795" y="450" font-size="12" fill="#1a1a1a">до 1000 м</text>
    
    <text x="665" y="470" font-size="12" font-weight="bold" fill="#1a1a1a">Вимога до лінії:</text>
    <text x="795" y="470" font-size="12" fill="#1a1a1a">Термінатор 120 Ом</text>
    
    <!-- Status Pill -->
    <rect x="655" y="490" width="250" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="780" y="508" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Повне придушення завад (EMI)</text>
  </g>
</svg>
