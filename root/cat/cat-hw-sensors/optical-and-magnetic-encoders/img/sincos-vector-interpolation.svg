<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Векторне коло Sin/Cos енкодера та обчислення кута через atan2</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Геометричний зміст субперіодної інтерполяції та спотворення вектора при неортогональності фаз</text>

  <!-- Left Panel: Ideal Quadrature -->
  <rect x="40" y="75" width="420" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="56" y="90" width="388" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="250" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Ідеальна квадратура (φ = 90°): Точний кут θ</text>

  <!-- Left Axes -->
  <line x1="110" y1="280" x2="390" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="250" y1="375" x2="250" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="400" y="275" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">V_cos</text>
  <text x="250" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">V_sin</text>

  <!-- Left Axis Ticks & Scale Labels -->
  <text x="238" y="296" text-anchor="end" font-size="11" fill="#6b7280">0</text>
  <line x1="170" y1="276" x2="170" y2="284" stroke="#6b7280" stroke-width="1"/>
  <text x="162" y="275" text-anchor="end" font-size="11" fill="#6b7280">-1 В</text>
  <line x1="330" y1="276" x2="330" y2="284" stroke="#6b7280" stroke-width="1"/>
  <text x="338" y="275" text-anchor="start" font-size="11" fill="#6b7280">+1 В</text>
  <line x1="246" y1="200" x2="254" y2="200" stroke="#6b7280" stroke-width="1"/>
  <text x="238" y="196" text-anchor="end" font-size="11" fill="#6b7280">+1 В</text>
  <line x1="246" y1="360" x2="254" y2="360" stroke="#6b7280" stroke-width="1"/>
  <text x="238" y="372" text-anchor="end" font-size="11" fill="#6b7280">-1 В</text>

  <!-- Ideal Circle -->
  <circle cx="250" cy="280" r="80" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Ideal Vector & Point P -->
  <line x1="250" y1="280" x2="298" y2="216" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="298" cy="216" r="4.5" fill="#2457d6"/>
  <text x="306" y="212" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">P</text>

  <!-- Projection Lines & Formulas -->
  <line x1="250" y1="216" x2="298" y2="216" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="312" y="188" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">V_sin = A · sin(θ)</text>
  <line x1="298" y1="280" x2="298" y2="216" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="325" y="350" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">V_cos = A · cos(θ)</text>

  <!-- Angle theta Arc -->
  <path d="M 280,280 A 30,30 0 0,0 268,256" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="272" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">θ</text>

  <!-- Left Panel Bottom Badge -->
  <rect x="56" y="440" width="388" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">θ = atan2( V_sin , V_cos )</text>
  <text x="250" y="482" text-anchor="middle" font-size="12" fill="#6b7280">Абсолютний фазовий кут у межах 1 періоду [0, 2π]</text>

  <!-- Right Panel: Real Errors -->
  <rect x="500" y="75" width="420" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="516" y="90" width="388" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="710" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Реальні похибки (неортогональність φ, зсув нуля)</text>

  <!-- Right Axes -->
  <line x1="570" y1="280" x2="850" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="710" y1="375" x2="710" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="860" y="275" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">V_cos</text>
  <text x="710" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">V_sin</text>

  <!-- Ideal Circle Reference -->
  <circle cx="710" cy="280" r="80" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="800" y="175" text-anchor="start" font-size="12" fill="#27ae60">Ідеальне коло</text>

  <!-- Distorted Trajectory (Ellipse) -->
  <ellipse cx="726" cy="268" rx="92" ry="70" transform="rotate(-20 726 268)" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- DC Offset Vector & Point O' -->
  <line x1="710" y1="280" x2="726" y2="268" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <circle cx="726" cy="268" r="3.5" fill="#c0392b"/>
  <text x="732" y="264" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">O'</text>

  <!-- Ideal Point & Vector Reference -->
  <line x1="710" y1="280" x2="758" y2="216" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <circle cx="758" cy="216" r="4" fill="#27ae60"/>
  <text x="766" y="208" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">P_ideal</text>

  <!-- Real Distorted Point & Vector -->
  <line x1="710" y1="280" x2="748" y2="190" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <circle cx="748" cy="190" r="4.5" fill="#c0392b"/>
  <text x="756" y="172" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">P_real</text>

  <!-- Phase Error Arc & Label -->
  <path d="M 743,236 A 55,55 0 0,0 731.5,229.3" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="744" y="244" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">δθ</text>

  <!-- Right Panel Legend Annotations -->
  <text x="526" y="390" font-size="12" fill="#c0392b">• Еліптичність: неортогональність фаз (φ ≠ 90°)</text>
  <text x="526" y="408" font-size="12" fill="#c0392b">• Зсув центру (O'): постійна складова (DC offset)</text>
  <text x="526" y="426" font-size="12" fill="#c0392b">• δθ: циклічна похибка кута між P_ideal та P_real</text>

  <!-- Right Panel Bottom Badge -->
  <rect x="516" y="440" width="388" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">θ_виміряний = atan2( V_sin , V_cos ) ≠ θ_істиний</text>
  <text x="710" y="482" text-anchor="middle" font-size="12" fill="#6b7280">Виникає циклічна похибка позиціонування δθ(θ)</text>
</svg>
