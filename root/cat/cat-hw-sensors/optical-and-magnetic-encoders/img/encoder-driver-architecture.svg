<svg width="960" height="500" viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Definitions for Arrow Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура драйвера енкодерів: від периферії до API</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Потік даних від апаратних сигналів периферії через ISR та структуру стану до безпечного API</text>

  <!-- Panel 1: Hardware Level -->
  <rect x="25" y="65" width="210" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="130" y="86" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Апаратний рівень</text>
  <text x="130" y="102" font-size="12" fill="#6b7280" text-anchor="middle">(Периферія MCU)</text>

  <!-- Sub-box 1.1 -->
  <rect x="37" y="115" width="186" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="130" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інкрементальний енкодер</text>
  <text x="130" y="153" font-size="12" fill="#6b7280" text-anchor="middle">Канали A, B (сигнали 90°)</text>
  <text x="130" y="173" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">QEI Timer / Counter HW</text>
  <text x="130" y="191" font-size="12" fill="#6b7280" text-anchor="middle">(апаратне квадро-лічення)</text>

  <!-- Sub-box 1.2 -->
  <rect x="37" y="235" width="186" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="130" y="255" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Абсолютний енкодер</text>
  <text x="130" y="273" font-size="12" fill="#6b7280" text-anchor="middle">Протоколи BiSS-C / SSI</text>
  <text x="130" y="293" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI / USART + DMA</text>
  <text x="130" y="311" font-size="12" fill="#6b7280" text-anchor="middle">(послідовна передача кадрів)</text>

  <!-- Sub-box 1.3 -->
  <rect x="37" y="355" width="186" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="130" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Індексний імпульс Z</text>
  <text x="130" y="393" font-size="12" fill="#6b7280" text-anchor="middle">1 імпульс / 1 оберт</text>
  <text x="130" y="413" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">EXTI Line / GPIO Pin</text>
  <text x="130" y="431" font-size="12" fill="#6b7280" text-anchor="middle">(апаратний тригер нуля)</text>

  <!-- Panel 2: Interrupt Handlers (ISR) -->
  <rect x="255" y="65" width="210" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="360" y="86" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Обробники ISR</text>
  <text x="360" y="102" font-size="12" fill="#6b7280" text-anchor="middle">(Переривання &amp; QEI)</text>

  <!-- Sub-box 2.1 -->
  <rect x="267" y="115" width="186" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="360" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TIM_Encoder_IRQHandler()</text>
  <text x="275" y="153" font-size="12" fill="#1a1a1a" text-anchor="start">• Переповнення (Overflow)</text>
  <text x="275" y="171" font-size="12" fill="#1a1a1a" text-anchor="start">• Інкремент rev_count</text>
  <text x="275" y="189" font-size="12" fill="#1a1a1a" text-anchor="start">• Атомарна фіксація</text>
  <text x="275" y="207" font-size="12" fill="#6b7280" text-anchor="start">• Розрахунок dθ/dt</text>

  <!-- Sub-box 2.2 -->
  <rect x="267" y="235" width="186" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="360" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DMA_Rx_IRQHandler()</text>
  <text x="275" y="273" font-size="12" fill="#1a1a1a" text-anchor="start">• Перевірка CRC / Parity</text>
  <text x="275" y="291" font-size="12" fill="#1a1a1a" text-anchor="start">• Декодування Gray Code</text>
  <text x="275" y="309" font-size="12" fill="#1a1a1a" text-anchor="start">• Фіксація raw_ticks</text>
  <text x="275" y="327" font-size="12" fill="#6b7280" text-anchor="start">• Встановлення помилок</text>

  <!-- Sub-box 2.3 -->
  <rect x="267" y="355" width="186" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="360" y="374" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">EXTI_Z_IRQHandler()</text>
  <text x="275" y="393" font-size="12" fill="#1a1a1a" text-anchor="start">• Захват індексу Z</text>
  <text x="275" y="411" font-size="12" fill="#1a1a1a" text-anchor="start">• Скидання CNT / Offset</text>
  <text x="275" y="429" font-size="12" fill="#1a1a1a" text-anchor="start">• Прапорець ZERO_SET</text>
  <text x="275" y="447" font-size="12" fill="#6b7280" text-anchor="start">• Калібрування нуля</text>

  <!-- Panel 3: Driver State Data Structure -->
  <rect x="485" y="65" width="220" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="595" y="86" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Структура стану</text>
  <text x="595" y="102" font-size="12" fill="#6b7280" text-anchor="middle">(Encoder_Handler_t)</text>

  <!-- Nested Struct Container -->
  <rect x="497" y="115" width="196" height="345" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="595" y="137" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">typedef struct {</text>
  <line x1="507" y1="145" x2="683" y2="145" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="509" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">int64_t rev_count;</text>
  <text x="509" y="180" font-size="12" fill="#6b7280" text-anchor="start">// обертів (overflows)</text>

  <text x="509" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">uint32_t raw_ticks;</text>
  <text x="509" y="217" font-size="12" fill="#6b7280" text-anchor="start">// поточний відлік HW</text>

  <text x="509" y="239" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">int32_t zero_offset;</text>
  <text x="509" y="254" font-size="12" fill="#6b7280" text-anchor="start">// зсув нуля в тіках</text>

  <text x="509" y="276" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">float velocity_rad_s;</text>
  <text x="509" y="291" font-size="12" fill="#6b7280" text-anchor="start">// швидкість [рад/с]</text>

  <text x="509" y="313" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">uint32_t status_flags;</text>
  <text x="509" y="328" font-size="12" fill="#6b7280" text-anchor="start">// OK / CRC / ERR прапори</text>

  <text x="595" y="347" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">} Encoder_Handler_t;</text>

  <!-- Thread Safety badge -->
  <rect x="507" y="362" width="176" height="83" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="595" y="382" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">🔒 Атомарний доступ</text>
  <text x="515" y="401" font-size="12" fill="#1a1a1a" text-anchor="start">• Critical Section / Mutex</text>
  <text x="515" y="419" font-size="12" fill="#1a1a1a" text-anchor="start">• Захист від гонитви</text>
  <text x="515" y="437" font-size="12" fill="#6b7280" text-anchor="start">• Lock-free / Atomics</text>

  <!-- Panel 4: Application API Layer -->
  <rect x="725" y="65" width="210" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="830" y="86" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Прикладне API</text>
  <text x="830" y="102" font-size="12" fill="#6b7280" text-anchor="middle">(User Application)</text>

  <!-- Sub-box 4.1 -->
  <rect x="737" y="115" width="186" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="830" y="135" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Encoder_GetPositionRad()</text>
  <text x="830" y="153" font-size="12" fill="#1a1a1a" text-anchor="middle">Кут в радіанах [rad]</text>
  <text x="830" y="173" font-size="12" fill="#6b7280" text-anchor="middle">Облік обертів + нуля</text>
  <text x="830" y="191" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">θ = (rev·N + cnt - zero)·2π/N</text>

  <!-- Sub-box 4.2 -->
  <rect x="737" y="235" width="186" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="830" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Encoder_GetVelocity()</text>
  <text x="830" y="273" font-size="12" fill="#1a1a1a" text-anchor="middle">Швидкість [rad/s]</text>
  <text x="830" y="293" font-size="12" fill="#6b7280" text-anchor="middle">Фільтр шуму (EMA / MA)</text>
  <text x="830" y="311" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ω = Δθ / Δt</text>

  <!-- Sub-box 4.3 -->
  <rect x="737" y="355" width="186" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="830" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Encoder_SetZero()</text>
  <text x="830" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">Встановлення нуля</text>
  <text x="830" y="413" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Encoder_GetStatus()</text>
  <text x="830" y="431" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка CRC / помилок</text>

  <!-- Connecting Lines (Arrows) -->
  <!-- Row 1: Hardware -> ISR -> Data -> API -->
  <line x1="223" y1="167" x2="265" y2="167" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="453" y1="167" x2="495" y2="167" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="693" y1="167" x2="735" y2="167" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Row 2: Hardware -> ISR -> Data -> API -->
  <line x1="223" y1="287" x2="265" y2="287" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="453" y1="287" x2="495" y2="287" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="693" y1="287" x2="735" y2="287" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Row 3: Hardware -> ISR -> Data -> API -->
  <line x1="223" y1="407" x2="265" y2="407" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="453" y1="407" x2="495" y2="407" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="693" y1="407" x2="735" y2="407" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
</svg>
