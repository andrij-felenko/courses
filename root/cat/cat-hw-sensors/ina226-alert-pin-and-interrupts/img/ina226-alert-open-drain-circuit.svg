<svg viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <marker id="arr-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення виводу ALERT (Open-Drain) до мікроконтролера</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Підтягувальний резистор R_pullup, фільтрація та монтажне «АБО» (Wired-OR) для кількох INA226</text>

  <!-- Panel 1: INA226 #1 -->
  <rect x="30" y="80" width="230" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="145" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">INA226 (Модуль #1)</text>
  <text x="145" y="123" font-size="11" fill="#64748b" text-anchor="middle">I2C адреса 0x40</text>

  <!-- Open Drain MOSFET 1 -->
  <rect x="45" y="140" width="200" height="260" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="60" y="160" width="100" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="110" y="185" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Логіка тривоги</text>

  <!-- N-MOSFET Symbol 1 -->
  <line x1="180" y1="210" x2="180" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="160" y1="228" x2="180" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="215" x2="200" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="200" y1="200" x2="240" y2="200" stroke="#c0392b" stroke-width="2"/>
  <line x1="180" y1="240" x2="200" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="255" x2="200" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="140" y="270" font-size="11" font-weight="bold" fill="#c0392b">Open-Drain</text>
  <circle cx="240" cy="200" r="4" fill="#c0392b"/>
  <text x="230" y="190" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">ALERT</text>

  <!-- Panel 2: INA226 #2 (Wired-OR option) -->
  <rect x="280" y="80" width="220" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="390" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">INA226 (Модуль #2)</text>
  <text x="390" y="123" font-size="11" fill="#64748b" text-anchor="middle">I2C адреса 0x41</text>
  <rect x="295" y="140" width="190" height="260" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="390" y="185" font-size="11" fill="#64748b" text-anchor="middle">Каскад відкритого стоку</text>
  <circle cx="480" cy="200" r="4" fill="#c0392b"/>
  <text x="470" y="190" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">ALERT</text>

  <!-- Wired-OR Bus Line -->
  <line x1="240" y1="200" x2="700" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="480" cy="200" r="4" fill="#c0392b"/>

  <!-- Pull-Up Resistor R1 -->
  <line x1="560" y1="110" x2="560" y2="140" stroke="#c0392b" stroke-width="2"/>
  <circle cx="560" cy="110" r="3" fill="#c0392b"/>
  <text x="560" y="100" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">VDD_MCU (+3.3V)</text>
  <rect x="552" y="140" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="575" y="162" font-size="11" font-weight="bold" fill="#1a1a1a">R_pullup (4.7–10 kΩ)</text>
  <line x1="560" y1="176" x2="560" y2="200" stroke="#c0392b" stroke-width="2"/>
  <circle cx="560" cy="200" r="4" fill="#c0392b"/>

  <!-- Noise filter cap C_f -->
  <line x1="620" y1="200" x2="620" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="620" cy="200" r="3" fill="#c0392b"/>
  <line x1="610" y1="240" x2="630" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="610" y1="246" x2="630" y2="246" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="620" y1="246" x2="620" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="620" cy="280" r="3" fill="#1a1a1a"/>
  <text x="640" y="250" font-size="10" font-weight="bold" fill="#1a1a1a">C_f = 100 pF</text>
  <text x="640" y="265" font-size="9" fill="#64748b">Фільтр брязкоту</text>

  <!-- Panel 3: MCU GPIO EXTI -->
  <rect x="700" y="80" width="230" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="815" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="815" y="123" font-size="11" fill="#64748b" text-anchor="middle">STM32 / ESP32 GPIO</text>

  <rect x="715" y="140" width="200" height="260" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <circle cx="700" cy="200" r="4" fill="#2457d6"/>
  <text x="730" y="195" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO (EXTI)</text>
  <text x="730" y="215" font-size="10" fill="#2457d6">Falling Edge Trigger</text>

  <rect x="730" y="240" width="170" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="815" y="260" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Апаратне переривання</text>
  <text x="815" y="278" font-size="10" fill="#1e293b" text-anchor="middle">Реакція &lt; 1 мікросекунди</text>

  <!-- Bottom Wired-OR Summary -->
  <rect x="30" y="435" width="900" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="465" font-size="12" font-weight="bold" fill="#1e293b">ОСОБЛИВОСТІ WIRED-OR:</text>
  <text x="240" y="458" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#c0392b">1. Спільна шина тривоги:</tspan> спрацьовування будь-якого з моніторів притягує єдину лінію до GND</text>
  <text x="240" y="478" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#2457d6">2. Арбітраж SMBus ARA (0x0C):</tspan> опитування дозволяє миттєво ідентифікувати аварійну мікросхему</text>
</svg>