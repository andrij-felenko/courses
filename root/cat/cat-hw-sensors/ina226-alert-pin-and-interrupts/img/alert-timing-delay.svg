<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr-axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова затримка реакції виводу ALERT та розрахунок затримки захисту</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Вплив часу інтеграції t_conv та коефіцієнта усереднення AVG на швидкість спрацьовування</text>

  <!-- Main Chart Box -->
  <rect x="40" y="80" width="880" height="320" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Time Axis -->
  <line x1="80" y1="360" x2="880" y2="360" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <text x="880" y="380" font-size="12" font-weight="bold" fill="#1a1a1a">Час t</text>

  <!-- Event 1: Fault Occurs -->
  <line x1="200" y1="100" x2="200" y2="360" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="200" cy="140" r="5" fill="#c0392b"/>
  <text x="200" y="125" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">t0: Стрибок струму</text>
  <text x="200" y="375" font-size="10" fill="#64748b" text-anchor="middle">t0</text>

  <!-- Event 2: ADC Cycle Finishes -->
  <line x1="580" y1="100" x2="580" y2="360" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="580" cy="200" r="5" fill="#2457d6"/>
  <text x="580" y="125" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">t1: Завершення вибірки АЦП</text>
  <text x="580" y="375" font-size="10" fill="#64748b" text-anchor="middle">t1</text>

  <!-- Event 3: ALERT Pin Pulled Low -->
  <line x1="640" y1="100" x2="640" y2="360" stroke="#c0392b" stroke-width="2"/>
  <circle cx="640" cy="260" r="5" fill="#c0392b"/>
  <text x="640" y="125" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">t2: Спрацьовування ALERT</text>
  <text x="640" y="375" font-size="10" fill="#64748b" text-anchor="middle">t2</text>

  <!-- Event 4: Power Gate Shutdown -->
  <line x1="720" y1="100" x2="720" y2="360" stroke="#15803d" stroke-width="2"/>
  <circle cx="720" cy="320" r="5" fill="#15803d"/>
  <text x="720" y="125" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">t3: Розмикання MOSFET</text>
  <text x="720" y="375" font-size="10" fill="#64748b" text-anchor="middle">t3</text>

  <!-- Signal Traces -->
  <!-- Trace 1: Physical Current -->
  <text x="90" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">I_shunt:</text>
  <path d="M 140 160 L 200 160 L 205 135 L 720 135 L 725 160 L 860 160" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Trace 2: ADC Conversions -->
  <text x="90" y="205" font-size="11" font-weight="bold" fill="#2457d6">Цикл АЦП:</text>
  <rect x="200" y="190" width="380" height="25" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.2"/>
  <text x="390" y="207" font-size="11" font-weight="bold" fill="#4338ca" text-anchor="middle">Період інтеграції T_total = t_conv × AVG (наприклад, 1.1 мс × 16 = 17.6 мс)</text>

  <!-- Trace 3: ALERT Pin -->
  <text x="90" y="265" font-size="11" font-weight="bold" fill="#c0392b">ALERT Pin:</text>
  <path d="M 140 250 L 640 250 L 640 275 L 860 275" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="700" y="270" font-size="10" fill="#c0392b">LOW</text>

  <!-- Trace 4: Power Gate -->
  <text x="90" y="325" font-size="11" font-weight="bold" fill="#15803d">Power Gate:</text>
  <path d="M 140 310 L 720 310 L 720 335 L 860 335" fill="none" stroke="#15803d" stroke-width="2.5"/>
  <text x="750" y="330" font-size="10" fill="#15803d">ВІДКЛЮЧЕНО</text>

  <!-- Bottom Delay Formula Summary -->
  <rect x="40" y="415" width="880" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="445" font-size="12" font-weight="bold" fill="#1e293b">ПОВНА ЗАТРИМКА ЗАХИСТУ:</text>
  <text x="260" y="445" font-size="11" fill="#334155"><tspan font-weight="bold">t_total = t_conv × AVG + t_comp (&lt; 5 µs) + t_mcu_isr (&lt; 1 µs) + t_mosfet_off (&lt; 2 µs)</tspan></text>
</svg>