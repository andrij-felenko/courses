<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура регістру Mask/Enable INA226 (адреса 06h)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">16 розрядів визначають джерело тривоги ALERT, полярність виходу та режим фіксації (Latch)</text>

  <!-- Register Bit Numbers -->
  <g font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">
    <text x="75" y="90">15</text>
    <text x="130" y="90">14</text>
    <text x="185" y="90">13</text>
    <text x="240" y="90">12</text>
    <text x="295" y="90">11</text>
    <text x="350" y="90">10</text>
    <text x="440" y="90">9 … 5</text>
    <text x="535" y="90">4</text>
    <text x="590" y="90">3</text>
    <text x="645" y="90">2</text>
    <text x="700" y="90">1</text>
    <text x="755" y="90">0</text>
  </g>

  <!-- Bit Cells (Y: 96 to 150) -->
  <!-- Bit 15: SOL -->
  <rect x="50" y="96" width="50" height="50" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="75" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">SOL</text>
  <text x="75" y="136" text-anchor="middle" font-size="10" fill="#64748b">Shunt Over</text>

  <!-- Bit 14: SUL -->
  <rect x="105" y="96" width="50" height="50" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">SUL</text>
  <text x="130" y="136" text-anchor="middle" font-size="10" fill="#64748b">Shunt Under</text>

  <!-- Bit 13: BOL -->
  <rect x="160" y="96" width="50" height="50" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="185" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">BOL</text>
  <text x="185" y="136" text-anchor="middle" font-size="10" fill="#64748b">Bus Over</text>

  <!-- Bit 12: BUL -->
  <rect x="215" y="96" width="50" height="50" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="240" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#4338ca">BUL</text>
  <text x="240" y="136" text-anchor="middle" font-size="10" fill="#64748b">Bus Under</text>

  <!-- Bit 11: POL -->
  <rect x="270" y="96" width="50" height="50" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="295" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">POL</text>
  <text x="295" y="136" text-anchor="middle" font-size="10" fill="#64748b">Pwr Over</text>

  <!-- Bit 10: CNVR -->
  <rect x="325" y="96" width="50" height="50" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="350" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">CNVR</text>
  <text x="350" y="136" text-anchor="middle" font-size="10" fill="#64748b">Conv Ready</text>

  <!-- Bits 9..5: Reserved -->
  <rect x="380" y="96" width="120" height="50" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="440" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">Зарезервовано (0)</text>

  <!-- Bit 4: WEN -->
  <rect x="510" y="96" width="50" height="50" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="535" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">WEN</text>
  <text x="535" y="136" text-anchor="middle" font-size="10" fill="#64748b">Wait Enable</text>

  <!-- Bit 3: APOL -->
  <rect x="565" y="96" width="50" height="50" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="590" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">APOL</text>
  <text x="590" y="136" text-anchor="middle" font-size="10" fill="#64748b">Polarity</text>

  <!-- Bit 2: LEN -->
  <rect x="620" y="96" width="50" height="50" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="645" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">LEN</text>
  <text x="645" y="136" text-anchor="middle" font-size="10" fill="#64748b">Latch En</text>

  <!-- Bit 1: APOL/FLAGF -->
  <rect x="675" y="96" width="50" height="50" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="700" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#ef4444">AFF/FLG</text>
  <text x="700" y="136" text-anchor="middle" font-size="10" fill="#64748b">Alert Flag</text>

  <!-- Bit 0: CVRF -->
  <rect x="730" y="96" width="50" height="50" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="755" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444">CVRF</text>
  <text x="755" y="136" text-anchor="middle" font-size="10" fill="#64748b">Conv Flag</text>

  <!-- Detailed Descriptions Section -->
  <rect x="50" y="165" width="860" height="295" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="75" y="190" font-size="13" font-weight="bold" fill="#1e293b">ПРИЗНАЧЕННЯ ГОЛОВНИХ КЕРУЮЧИХ РОЗРЯДІВ:</text>

  <text x="75" y="215" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#c0392b">SOL [15] / SUL [14]:</tspan> Перевищення / заниження падіння напруги на шунті V_SHUNT (захист за струмом Overcurrent/Undercurrent)</text>
  <text x="75" y="240" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#4338ca">BOL [13] / BUL [12]:</tspan> Перенапруга / зниження напруги шини живлення V_BUS (Overvoltage / Undervoltage захист)</text>
  <text x="75" y="265" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#b45309">POL [11]:</tspan> Перевищення максимальної потужності Power Over-Limit (контроль безпечної робочої зони навантаження)</text>
  <text x="75" y="290" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#15803d">CNVR [10]:</tspan> Готовність даних перетворення (Conversion Ready) — формує строб після завершення циклу інтеграції</text>

  <line x1="75" y1="310" x2="880" y2="310" stroke="#e2e8f0"/>

  <text x="75" y="335" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#7c3aed">APOL [3] (Alert Polarity):</tspan> 0 = Active Low (відкритий стік притягує до GND); 1 = Active High (інвертована полярність)</text>
  <text x="75" y="360" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#0284c7">LEN [2] (Latch Enable):</tspan> 0 = Transparent (автоскидання після відновлення норми); 1 = Latch (утримання до читання Mask/Enable 06h)</text>
  <text x="75" y="385" font-size="11" fill="#334155"><tspan font-weight="bold" fill="#ef4444">AFF [1] / CVRF [0]:</tspan> Прапорці події — фіксують факт аварії та завершення перетворення навіть при коротких сплесках</text>
  <text x="75" y="415" font-size="11" font-weight="bold" fill="#2457d6">Апаратне скидання засувки Latch: виконується автоматично при читанні 16-бітного слова з Mask/Enable (0x06).</text>
</svg>