<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Алгоритм апаратно-програмного захисту за перериванням ALERT</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Миттєве апаратне відключення навантаження в ISR та фоновий I2C-аналіз причини аварії</text>

  <!-- Column 1: Fast Hardware ISR (< 1 µs) -->
  <rect x="40" y="80" width="410" height="420" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <rect x="40" y="80" width="410" height="36" rx="8" fill="#fee2e2"/>
  <text x="245" y="104" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Апаратний ISR (Швидкий контур &lt; 1 мкс)</text>

  <!-- Block 1 -->
  <rect x="70" y="130" width="350" height="45" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Спадаючий фронт ALERT на GPIO</text>
  <text x="245" y="167" font-size="10" fill="#64748b" text-anchor="middle">EXTI Trigger (Апаратний вхід контролера)</text>

  <line x1="245" y1="175" x2="245" y2="205" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Block 2: Critical Emergency Action -->
  <rect x="70" y="205" width="350" height="55" rx="6" fill="#c0392b"/>
  <text x="245" y="228" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. НЕГАЙНЕ ВІДКЛЮЧЕННЯ НАВАНТАЖЕННЯ!</text>
  <text x="245" y="247" font-size="11" fill="#fee2e2" text-anchor="middle">GPIO_CLR(POWER_GATE) / Скидання ШІМ привода</text>

  <line x1="245" y1="260" x2="245" y2="295" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Block 3 -->
  <rect x="70" y="295" width="350" height="45" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="316" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">3. Встановлення прапорця події</text>
  <text x="245" y="331" font-size="10" fill="#64748b" text-anchor="middle">alert_event = true, пробудження фонової задачі RTOS</text>

  <line x1="245" y1="340" x2="245" y2="370" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Block 4 -->
  <rect x="70" y="370" width="350" height="45" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="391" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">4. Очищення прапорця EXTI та вихід</text>
  <text x="245" y="406" font-size="10" fill="#64748b" text-anchor="middle">Ніяких важких I2C-транзакцій всередині ISR!</text>

  <line x1="420" y1="392" x2="510" y2="230" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr)"/>

  <!-- Column 2: Background Task (Safe I2C diagnostics) -->
  <rect x="500" y="80" width="420" height="420" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="500" y="80" width="420" height="36" rx="8" fill="#dcfce7"/>
  <text x="710" y="104" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Фонова задача (RTOS Task / Main Loop)</text>

  <!-- Step 1 -->
  <rect x="530" y="130" width="360" height="45" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="710" y="152" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">1. Очікування прапорця alert_event</text>
  <text x="710" y="167" font-size="10" fill="#64748b" text-anchor="middle">Семафор або xTaskNotifyWait</text>

  <line x1="710" y1="175" x2="710" y2="205" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="530" y="205" width="360" height="45" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="710" y="226" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">2. I2C читання Mask/Enable (0x06)</text>
  <text x="710" y="241" font-size="10" fill="#2457d6" text-anchor="middle">Зчитування причини аварії + автоскидання Latch</text>

  <line x1="710" y1="250" x2="710" y2="280" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="530" y="280" width="360" height="55" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="710" y="302" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">3. Аналіз розрядів SOL, SUL, BOL, BUL, POL</text>
  <text x="710" y="318" font-size="10" fill="#64748b" text-anchor="middle">Зчитування струму (0x04) та напруги (0x02) для журналу</text>

  <line x1="710" y1="335" x2="710" y2="365" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="530" y="365" width="360" height="55" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="710" y="386" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">4. Прийняття рішення про перезапуск</text>
  <text x="710" y="403" font-size="10" fill="#64748b" text-anchor="middle">Якщо струм у нормі — плавний рестарт через Soft-Start</text>

  <!-- Step 5 -->
  <text x="710" y="455" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Повне збереження системи без перегріву та вигорання!</text>
</svg>