<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<defs>
  <marker id="ar_flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
  </marker>
</defs>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Архітектура цифрової обробки сигналів ультразвукового витратоміра (DSP)</text>

<!-- Flow Blocks -->
<!-- 1. Piezo Sensors -->
<rect x="30" y="100" width="130" height="100" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="95" y="135" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">П'єзоелементи</text>
<text x="95" y="155" font-size="11" fill="#8b949e" text-anchor="middle">Трансд'юсери</text>
<text x="95" y="175" font-size="11" fill="#f0f6fc" text-anchor="middle">1.0 ... 4.0 МГц</text>

<line x1="160" y1="150" x2="195" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_flow)"/>

<!-- 2. Analog Front-End (AFE) -->
<rect x="195" y="80" width="160" height="140" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="275" y="110" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="middle">Аналоговий тракт</text>
<rect x="215" y="125" width="120" height="35" rx="3" fill="#0d1117" stroke="#388bfd"/>
<text x="275" y="147" font-size="11" fill="#f0f6fc" text-anchor="middle">Комутатор TX / RX</text>
<rect x="215" y="170" width="120" height="35" rx="3" fill="#0d1117" stroke="#388bfd"/>
<text x="275" y="192" font-size="11" fill="#f0f6fc" text-anchor="middle">PGA / Фільтр Смуговий</text>

<line x1="355" y1="150" x2="395" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_flow)"/>

<!-- 3. High Speed TDC / ADC -->
<rect x="395" y="90" width="150" height="120" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
<text x="470" y="120" font-size="14" fill="#d29922" font-weight="700" text-anchor="middle">АЦП / TDC</text>
<text x="470" y="145" font-size="11" fill="#8b949e" text-anchor="middle">Time-to-Digital</text>
<text x="470" y="165" font-size="12" fill="#3fb950" font-weight="700" text-anchor="middle">Роздільна здатність:</text>
<text x="470" y="185" font-size="12" fill="#f0f6fc" text-anchor="middle">&lt; 15–50 пікосекунд</text>

<line x1="545" y1="150" x2="585" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_flow)"/>

<!-- 4. DSP Engine & Cross-Correlation -->
<rect x="585" y="70" width="165" height="160" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<text x="667" y="100" font-size="14" fill="#bc8cff" font-weight="700" text-anchor="middle">Процесор DSP</text>
<text x="667" y="125" font-size="11" fill="#f0f6fc" text-anchor="middle">Взаємна кореляція</text>
<text x="667" y="145" font-size="11" fill="#f0f6fc" text-anchor="middle">Крос-спектральний аналіз</text>
<text x="667" y="165" font-size="11" fill="#8b949e" text-anchor="middle">Розрахунок Δt</text>
<text x="667" y="185" font-size="11" fill="#3fb950" text-anchor="middle">Корекція Рейнольдса Re</text>
<text x="667" y="205" font-size="11" fill="#f0883e" text-anchor="middle">Q = v · S · k_re</text>

<line x1="750" y1="150" x2="790" y2="150" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#ar_flow)"/>

<!-- 5. Industrial Outputs -->
<rect x="790" y="90" width="120" height="120" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="850" y="120" font-size="13" fill="#f85149" font-weight="700" text-anchor="middle">Інтерфейси</text>
<text x="850" y="145" font-size="11" fill="#f0f6fc" text-anchor="middle">4–20 мА / HART</text>
<text x="850" y="165" font-size="11" fill="#f0f6fc" text-anchor="middle">Modbus RTU RS485</text>
<text x="850" y="185" font-size="11" fill="#f0f6fc" text-anchor="middle">Імпульсний вихід</text>

<!-- Bottom Technical Explanation -->
<rect x="30" y="250" width="880" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="60" y="280" font-size="14" fill="#58a6ff" font-weight="700">Ключові алгоритми цифрової обробки ультразвукового потоку:</text>
<text x="60" y="305" font-size="12" fill="#f0f6fc">1. <tspan fill="#3fb950" font-weight="700">Взаємна кореляція сигналів (Cross-Correlation):</tspan> знаходження максимуму R_xy(τ) дозволяє детектувати фазовий зсув навіть при співвідношенні сигнал/шум (SNR) менше 0 dB.</text>
<text x="60" y="335" font-size="12" fill="#f0f6fc">2. <tspan fill="#d29922" font-weight="700">Корекція гідродинамічного профілю (Reynolds Correction):</tspan> перехід від ламінарного профілю до турбулентного змінює коефіцієнт k_re між середньою та осьовою швидкістю від 0.75 до 0.95.</text>
<text x="60" y="365" font-size="12" fill="#f0f6fc">3. <tspan fill="#bc8cff" font-weight="700">Акустичне розпізнавання середовища:</tspan> одночасний розрахунок швидкості звуку c = L / (2 · t_down) ідентифікує тип рідини (нафта, вода, гліколь).</text>
</svg>