<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="920" height="420" fill="#0d1117"/>
<text x="460" y="32" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Заломлення ультразвуку на межах середовищ (Закон Снелліуса)</text>

<!-- Wedge / Transducer -->
<path d="M 120 70 L 320 70 L 320 170 L 120 170 Z" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
<text x="220" y="100" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="middle">Акустичний клин (Плексиглас)</text>
<text x="220" y="125" font-size="12" fill="#8b949e" text-anchor="middle">c_клин ≈ 2700 м/с</text>

<!-- Pipe Wall -->
<rect x="120" y="170" width="380" height="45" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
<text x="310" y="198" font-size="13" fill="#f0f6fc" font-weight="700">Стінка труби (Сталь, c_сталь ≈ 3200 м/с)</text>

<!-- Fluid Inside -->
<rect x="120" y="215" width="380" height="135" fill="#1f3b5c" fill-opacity="0.4" stroke="#388bfd" stroke-width="1.5"/>
<text x="310" y="285" font-size="14" fill="#3fb950" font-weight="700">Рідина (Вода, c_води ≈ 1480 м/с за 20 °C)</text>

<!-- Refracted Beam Lines -->
<!-- In wedge -->
<line x1="170" y1="70" x2="250" y2="170" stroke="#f0883e" stroke-width="3"/>
<!-- In wall -->
<line x1="250" y1="170" x2="290" y2="215" stroke="#f0883e" stroke-width="3"/>
<!-- In fluid -->
<line x1="290" y1="215" x2="430" y2="350" stroke="#f0883e" stroke-width="3"/>

<!-- Angles representation -->
<line x1="250" y1="130" x2="250" y2="210" stroke="#8b949e" stroke-dasharray="3 3"/>
<line x1="290" y1="190" x2="290" y2="270" stroke="#8b949e" stroke-dasharray="3 3"/>

<!-- Formula Block on Right -->
<rect x="540" y="70" width="340" height="280" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="710" y="105" font-size="15" fill="#f0883e" font-weight="700" text-anchor="middle">Закон Снелліуса для акустики</text>

<rect x="560" y="125" width="300" height="60" rx="5" fill="#0d1117" stroke="#f0883e"/>
<text x="710" y="160" font-size="16" fill="#3fb950" font-weight="700" text-anchor="middle">sin(θ_1) / c_1 = sin(θ_2) / c_2 = sin(θ_3) / c_3</text>

<text x="565" y="215" font-size="13" fill="#f0f6fc" font-weight="700">Фізичний зміст заломлення:</text>
<text x="565" y="240" font-size="12" fill="#8b949e">• При вході в рідину швидкість звуку падає</text>
<text x="565" y="260" font-size="12" fill="#8b949e">  (з 3200 м/с до 1480 м/с), кут стає гострішим</text>
<text x="565" y="285" font-size="12" fill="#8b949e">• Точна геометрія розрахунку вимагає знання</text>
<text x="565" y="305" font-size="12" fill="#8b949e">  товщини стінки труби та матеріалу футерування</text>
<text x="565" y="330" font-size="11" fill="#58a6ff">Вбудований DSP автоматично розраховує дистанцію між датчиками</text>

<!-- Bottom note -->
<rect x="120" y="365" width="760" height="30" rx="4" fill="#21262d"/>
<text x="500" y="385" font-size="11" fill="#8b949e" text-anchor="middle">
  Помилка у визначенні товщини стінки труби на 0.5 мм призводить до похибки позиціонування датчиків та збою сигналу
</text>
</svg>