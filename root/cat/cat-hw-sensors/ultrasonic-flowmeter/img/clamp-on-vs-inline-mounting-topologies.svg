<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Топології монтажу накладних сенсорів Clamp-on (V, Z, W методи)</text>

<!-- V-Method (Direct reflection from opposite wall) -->
<rect x="40" y="65" width="270" height="330" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
<text x="175" y="95" font-size="15" fill="#58a6ff" font-weight="700" text-anchor="middle">V-Метод (1 відбиття)</text>

<!-- Pipe section -->
<rect x="70" y="125" width="210" height="110" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="75" y="135" width="200" height="90" fill="#1f3b5c" fill-opacity="0.3"/>

<!-- Transducers on same side -->
<rect x="95" y="110" width="30" height="25" rx="3" fill="#3fb950"/>
<rect x="225" y="110" width="30" height="25" rx="3" fill="#f85149"/>

<!-- V sound beam -->
<line x1="110" y1="135" x2="175" y2="225" stroke="#d29922" stroke-width="2.5"/>
<line x1="175" y1="225" x2="240" y2="135" stroke="#d29922" stroke-width="2.5"/>

<text x="60" y="265" font-size="12" fill="#f0f6fc" font-weight="700">Застосування:</text>
<text x="60" y="285" font-size="11" fill="#8b949e">• Труби малого та середнього Ø</text>
<text x="60" y="302" font-size="11" fill="#8b949e">  (DN25 ... DN300)</text>
<text x="60" y="325" font-size="11" fill="#f0f6fc" font-weight="700">Перевага:</text>
<text x="60" y="342" font-size="11" fill="#8b949e">• Обидва датчики на одному боці</text>
<text x="60" y="360" font-size="11" fill="#8b949e">• Легкий монтаж на рейці</text>

<!-- Z-Method (Direct through-transmission) -->
<rect x="335" y="65" width="270" height="330" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="470" y="95" font-size="15" fill="#3fb950" font-weight="700" text-anchor="middle">Z-Метод (прямий промінь)</text>

<!-- Pipe section -->
<rect x="365" y="125" width="210" height="110" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="370" y="135" width="200" height="90" fill="#1f3b5c" fill-opacity="0.3"/>

<!-- Transducers on opposite sides -->
<rect x="390" y="110" width="30" height="25" rx="3" fill="#3fb950"/>
<rect x="520" y="225" width="30" height="25" rx="3" fill="#f85149"/>

<!-- Z sound beam -->
<line x1="405" y1="135" x2="535" y2="225" stroke="#d29922" stroke-width="2.5"/>

<text x="355" y="265" font-size="12" fill="#f0f6fc" font-weight="700">Застосування:</text>
<text x="355" y="285" font-size="11" fill="#8b949e">• Великі труби (DN300 ... DN5000)</text>
<text x="355" y="302" font-size="11" fill="#8b949e">• Середовища з сильним затуханням</text>
<text x="355" y="325" font-size="11" fill="#f0f6fc" font-weight="700">Перевага:</text>
<text x="355" y="342" font-size="11" fill="#8b949e">• Мінімальний шлях променя</text>
<text x="355" y="360" font-size="11" fill="#8b949e">• Максимальна амплітуда сигналу</text>

<!-- W-Method (Double reflection, small pipes) -->
<rect x="630" y="65" width="270" height="330" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
<text x="765" y="95" font-size="15" fill="#bc8cff" font-weight="700" text-anchor="middle">W-Метод (2 відбиття)</text>

<!-- Pipe section -->
<rect x="660" y="125" width="210" height="110" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="665" y="135" width="200" height="90" fill="#1f3b5c" fill-opacity="0.3"/>

<!-- Transducers on same side -->
<rect x="680" y="110" width="25" height="25" rx="3" fill="#3fb950"/>
<rect x="815" y="110" width="25" height="25" rx="3" fill="#f85149"/>

<!-- W sound beam -->
<line x1="692" y1="135" x2="725" y2="225" stroke="#d29922" stroke-width="2"/>
<line x1="725" y1="225" x2="760" y2="135" stroke="#d29922" stroke-width="2"/>
<line x1="760" y1="135" x2="795" y2="225" stroke="#d29922" stroke-width="2"/>
<line x1="795" y1="225" x2="827" y2="135" stroke="#d29922" stroke-width="2"/>

<text x="650" y="265" font-size="12" fill="#f0f6fc" font-weight="700">Застосування:</text>
<text x="650" y="285" font-size="11" fill="#8b949e">• Тонкі труби (DN15 ... DN50)</text>
<text x="650" y="302" font-size="11" fill="#8b949e">• Де час прольоту занадто малий</text>
<text x="650" y="325" font-size="11" fill="#f0f6fc" font-weight="700">Перевага:</text>
<text x="650" y="342" font-size="11" fill="#8b949e">• Подовження акустичного шляху</text>
<text x="650" y="360" font-size="11" fill="#8b949e">• Вища точність при малих витратах</text>

<!-- Footer -->
<rect x="40" y="402" width="860" height="22" rx="4" fill="#21262d"/>
<text x="470" y="417" font-size="11" fill="#8b949e" text-anchor="middle">Акустичний контакт забезпечується спеціальним гелем (Couplant) або силіконовими подушками</text>
</svg>