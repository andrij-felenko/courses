<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Мультисенсорна матриця: «Електронний ніс» (E-Nose)</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Апаратна структура 4-канальної матриці давачів для розпізнавання сумішей газів</text>

  <!-- Gas Sensor Array on Left -->
  <rect x="40" y="90" width="220" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">Сенсорна матриця</text>

  <!-- Sensor 1: MQ-7 (CO focused) -->
  <rect x="55" y="135" width="190" height="65" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
  <text x="65" y="157" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#f85149">S1: MQ-7 (CO / H2)</text>
  <text x="65" y="175" font-family="monospace" font-size="10" fill="#8b949e">RL1 = 10 кОм</text>
  <text x="65" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Циклічний підігрів 1.4В/5В</text>

  <!-- Sensor 2: MQ-4 (CH4 focused) -->
  <rect x="55" y="215" width="190" height="65" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="65" y="237" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#58a6ff">S2: MQ-4 (Метан CH4)</text>
  <text x="65" y="255" font-family="monospace" font-size="10" fill="#8b949e">RL2 = 20 кОм</text>
  <text x="65" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Постійний підігрів 5В</text>

  <!-- Sensor 3: MQ-135 (Air Quality / NH3 / VOC) -->
  <rect x="55" y="295" width="190" height="65" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="65" y="317" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#3fb950">S3: MQ-135 (NH3 / VOC)</text>
  <text x="65" y="335" font-family="monospace" font-size="10" fill="#8b949e">RL3 = 10 кОм</text>
  <text x="65" y="350" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Широкий спектр ЛОС</text>

  <!-- Sensor 4: TGS 2602 (Toluene / H2S) -->
  <rect x="55" y="375" width="190" height="65" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="65" y="397" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#bc8cff">S4: TGS 2602 (H2S / ЛОС)</text>
  <text x="65" y="415" font-family="monospace" font-size="10" fill="#8b949e">RL4 = 5.1 кОм</text>
  <text x="65" y="430" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Висока чутливість до запахів</text>

  <!-- Signal Bus Lines -->
  <line x1="245" y1="167" x2="330" y2="167" stroke="#f85149" stroke-width="2"/>
  <line x1="245" y1="247" x2="330" y2="247" stroke="#58a6ff" stroke-width="2"/>
  <line x1="245" y1="327" x2="330" y2="327" stroke="#3fb950" stroke-width="2"/>
  <line x1="245" y1="407" x2="330" y2="407" stroke="#bc8cff" stroke-width="2"/>

  <!-- ADS1115 16-bit ADC Block (Center) -->
  <rect x="330" y="140" width="140" height="300" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="400" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">АЦП ADS1115</text>
  <text x="400" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e" text-anchor="middle">16-біт, 4 канали</text>

  <rect x="340" y="210" width="120" height="25" rx="3" fill="#21262d"/>
  <text x="400" y="227" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">PGA: 0..4.096В</text>

  <rect x="340" y="250" width="120" height="25" rx="3" fill="#21262d"/>
  <text x="400" y="267" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">MUX 4:1</text>

  <rect x="340" y="290" width="120" height="25" rx="3" fill="#21262d"/>
  <text x="400" y="307" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">I2C Інтерфейс</text>

  <!-- I2C Bus to MCU -->
  <line x1="470" y1="280" x2="550" y2="280" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="470" y1="310" x2="550" y2="310" stroke="#3fb950" stroke-width="2.5"/>
  <text x="510" y="270" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">I2C Bus</text>

  <!-- Microcontroller / Neural Core Block -->
  <rect x="550" y="90" width="250" height="370" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="675" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Обчислювач (MCU / DSP)</text>
  <text x="675" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e" text-anchor="middle">ESP32-S3 (з апаратним Vector AI)</text>

  <rect x="565" y="165" width="220" height="55" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="575" y="187" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f0f6fc">Вектор опорів: [R1, R2, R3, R4]</text>
  <text x="575" y="205" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Зчитування 4 каналів кожні 100 мс</text>

  <rect x="565" y="230" width="220" height="65" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="575" y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#3fb950">Нормалізація &amp; PCA</text>
  <text x="575" y="270" font-family="monospace" font-size="10" fill="#f0f6fc">X_norm = (R - R0) / R0</text>
  <text x="575" y="285" font-family="monospace" font-size="10" fill="#8b949e">PC1, PC2 = Project(X_norm)</text>

  <rect x="565" y="305" width="220" height="70" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="575" y="327" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#bc8cff">Класифікатор (k-NN / SVM)</text>
  <text x="575" y="347" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">Визначення типу газу:</text>
  <text x="575" y="363" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">"Витік метану" vs "Пари алкоголю"</text>

  <rect x="565" y="385" width="220" height="60" rx="6" fill="#21262d" stroke="#f85149"/>
  <text x="575" y="407" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f85149">Селективна тривога</text>
  <text x="575" y="425" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">Усуває 99.5% хибних спрацьовувань!</text>
</svg>