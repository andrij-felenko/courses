<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Температурна кінетика окиснення газів на поверхні SnO2</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Залежність швидкості каталітичної реакції та чутливості від робочої температури шару</text>

  <!-- Plot Canvas -->
  <rect x="70" y="90" width="480" height="350" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Temperature Zones -->
  <!-- Low Temp Zone (80 - 150 C) -->
  <rect x="130" y="90" width="90" height="350" fill="rgba(88, 166, 255, 0.08)"/>
  <text x="175" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#58a6ff" text-anchor="middle">Зона CO</text>

  <!-- Mid Temp Zone (200 - 300 C) -->
  <rect x="250" y="90" width="110" height="350" fill="rgba(248, 81, 73, 0.08)"/>
  <text x="305" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#f85149" text-anchor="middle">Зона H2 / Етанол</text>

  <!-- High Temp Zone (350 - 450 C) -->
  <rect x="400" y="90" width="120" height="350" fill="rgba(210, 153, 34, 0.08)"/>
  <text x="460" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#d29922" text-anchor="middle">Зона CH4 / СН</text>

  <!-- Grid lines -->
  <line x1="70" y1="160" x2="550" y2="160" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="230" x2="550" y2="230" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="300" x2="550" y2="300" stroke="#21262d" stroke-dasharray="4"/>
  <line x1="70" y1="370" x2="550" y2="370" stroke="#21262d" stroke-dasharray="4"/>

  <!-- Curve: Carbon Monoxide CO (peaks at ~100-120 C with Pt/Pd catalyst) -->
  <path d="M 80,410 C 120,400 150,160 180,150 C 210,160 250,330 350,390 C 450,420 540,430 540,430" fill="none" stroke="#f85149" stroke-width="3"/>
  <circle cx="180" cy="150" r="5" fill="#f85149"/>
  <text x="180" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">Пік CO (~100 °C)</text>

  <!-- Curve: Hydrogen H2 (peaks at ~250 C) -->
  <path d="M 80,420 C 150,400 230,220 280,180 C 330,200 400,320 540,380" fill="none" stroke="#bc8cff" stroke-width="2.5"/>
  <circle cx="280" cy="180" r="4" fill="#bc8cff"/>
  <text x="280" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#bc8cff" text-anchor="middle">Пік H2 (~250 °C)</text>

  <!-- Curve: Ethanol C2H5OH (peaks at ~300 C) -->
  <path d="M 80,430 C 180,420 270,300 330,210 C 390,250 470,340 540,390" fill="none" stroke="#3fb950" stroke-width="2"/>

  <!-- Curve: Methane CH4 (high activation energy, peaks at ~400 C) -->
  <path d="M 80,435 C 220,435 340,420 400,310 C 440,190 470,180 540,240" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <circle cx="470" cy="180" r="5" fill="#58a6ff"/>
  <text x="470" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">Пік CH4 (~400 °C)</text>

  <!-- X axis labels -->
  <text x="90" y="460" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">50 °C</text>
  <text x="175" y="460" font-family="monospace" font-size="11" fill="#58a6ff" font-weight="bold" text-anchor="middle">100 °C</text>
  <text x="260" y="460" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">200 °C</text>
  <text x="350" y="460" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">300 °C</text>
  <text x="460" y="460" font-family="monospace" font-size="11" fill="#d29922" font-weight="bold" text-anchor="middle">400 °C</text>
  <text x="540" y="460" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">500 °C</text>

  <text x="310" y="482" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#8b949e" text-anchor="middle">Температура чутливого шару SnO2, °C</text>
  <text x="40" y="260" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#8b949e" text-anchor="middle" transform="rotate(-90 40 260)">Відносна чутливість S = Rs0 / Rs</text>

  <!-- Explanation Cards -->
  <rect x="570" y="90" width="245" height="350" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="585" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#f0f6fc">Принцип термоселекції:</text>

  <rect x="580" y="135" width="225" height="85" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="590" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f85149">1. Енергія активації (Ea):</text>
  <text x="590" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Молекула метану CH4 має міцний</text>
  <text x="590" y="188" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">C-H зв'язок (439 кДж/моль),</text>
  <text x="590" y="204" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">тому не реагує при низьких Т.</text>

  <rect x="580" y="230" width="225" height="95" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="590" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#58a6ff">2. Модуляція температури:</text>
  <text x="590" y="268" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Змінюючи напругу підігріву VH</text>
  <text x="590" y="284" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">(наприклад, 1.4 В -> 5.0 В),</text>
  <text x="590" y="300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">сенсор розділяє сигнатуру CO</text>
  <text x="590" y="316" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">від фонового метану CH4.</text>

  <rect x="580" y="335" width="225" height="90" rx="6" fill="#21262d" stroke="#3fb950"/>
  <text x="590" y="358" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#3fb950">Практичний висновок:</text>
  <text x="590" y="378" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">Температурний профіль дає змогу</text>
  <text x="590" y="396" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">одному фізичному елементу SnO2</text>
  <text x="590" y="414" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">детектувати різні гази у часі!</text>
</svg>