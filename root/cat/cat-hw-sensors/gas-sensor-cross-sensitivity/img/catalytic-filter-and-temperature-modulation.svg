<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Апаратні фільтри селективності газових сенсорів</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Фізичне відсікання заважаючих газів (спирт, ЛОС, дим) перед надходженням на чутливий шар</text>

  <!-- Cross-section diagram of Sensor with Filter -->
  <rect x="50" y="90" width="460" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Protective Outer Cap -->
  <path d="M 120,420 L 120,170 C 120,130 180,110 280,110 C 380,110 440,130 440,170 L 440,420" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="280" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" fill="#8b949e" text-anchor="middle">Подвійна металева сітка SUS316</text>

  <!-- Gas Inflow Arrows -->
  <line x1="240" y1="75" x2="240" y2="105" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="240" y="70" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">CH4</text>
  <line x1="320" y1="75" x2="320" y2="105" stroke="#f85149" stroke-width="2"/>
  <text x="320" y="70" font-family="monospace" font-size="10" fill="#f85149" text-anchor="middle">C2H5OH</text>

  <!-- Activated Charcoal Filter Layer -->
  <rect x="140" y="160" width="280" height="55" rx="4" fill="#30363d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="280" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Вугільний фільтр / Молекулярне сито</text>
  <text x="280" y="202" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950" text-anchor="middle">Адсорбція полярних молекул (спирти, розчинники)</text>

  <!-- Blocked vs Transmitted molecules -->
  <line x1="240" y1="215" x2="240" y2="280" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="240" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#58a6ff">Проходить CH4</text>

  <line x1="320" y1="215" x2="320" y2="240" stroke="#f85149" stroke-width="2" stroke-dasharray="3"/>
  <circle cx="320" cy="245" r="4" fill="#f85149"/>
  <text x="330" y="248" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f85149">Затримано спирт</text>

  <!-- Sensor Substrate & SnO2 Layer -->
  <rect x="160" y="285" width="240" height="40" rx="4" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="280" y="308" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">Чутливий шар SnO2 + Pd камери</text>

  <!-- Ceramic Base & Heater -->
  <rect x="180" y="325" width="200" height="30" rx="2" fill="#21262d" stroke="#30363d"/>
  <text x="280" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e" text-anchor="middle">Керамічна підкладка Al2O3 + Pt нагрівач</text>

  <!-- Pins -->
  <line x1="210" y1="355" x2="210" y2="445" stroke="#f0f6fc" stroke-width="3"/>
  <line x1="280" y1="355" x2="280" y2="445" stroke="#f0f6fc" stroke-width="3"/>
  <line x1="350" y1="355" x2="350" y2="445" stroke="#f0f6fc" stroke-width="3"/>

  <!-- Right Detail Panels -->
  <rect x="540" y="90" width="265" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="555" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="14" font-weight="bold" fill="#f0f6fc">Типи селективних бар'єрів:</text>

  <rect x="555" y="135" width="235" height="95" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="565" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#3fb950">1. Активоване вугілля</text>
  <text x="565" y="173" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">• Застосовується в TGS 2611-E00</text>
  <text x="565" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">• Затримує молекули розміром > 4 Å</text>
  <text x="565" y="207" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">• Ефективність проти парів алкоголю: >98%</text>
  <text x="565" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#d29922">Ресурс сорбції: 5-7 років у житлових умовах</text>

  <rect x="555" y="240" width="235" height="100" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="565" y="260" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#58a6ff">2. Цеолітні мембрани (ZSM-5)</text>
  <text x="565" y="278" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">• Калібрований розмір пор (3.8 - 4.2 Å)</text>
  <text x="565" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">• Пропускає малі гази (H2: 2.89 Å, CO: 3.76 Å)</text>
  <text x="565" y="312" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">• Відсікає бутан, ізобутан, пари бензину</text>
  <text x="565" y="329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#3fb950">Витримує температури до +500 °C</text>

  <rect x="555" y="350" width="235" height="95" rx="6" fill="#21262d" stroke="#bc8cff"/>
  <text x="565" y="372" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#bc8cff">3. Каталітичні спалювачі</text>
  <text x="565" y="390" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">• Наношари Pt або Pd перед входом</text>
  <text x="565" y="408" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">• Окиснюють CO та етанол до CO2 та H2O</text>
  <text x="565" y="426" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">Залишає тільки важкі алкани для детекції</text>
</svg>