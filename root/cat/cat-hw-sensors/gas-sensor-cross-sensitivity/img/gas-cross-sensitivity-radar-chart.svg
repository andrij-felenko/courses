<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Перехресна чутливість напівпровідникових давачів газу</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Відносний відгук (Rs0/Rs) сенсорів MQ-7, MQ-2 та TGS 2611 на різні типи газів</text>

  <!-- Radar Chart Center at (280, 270), radius 160 -->
  <g transform="translate(280, 270)">
    <!-- Radar rings -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#21262d" stroke-dasharray="3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#21262d" stroke-dasharray="3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#21262d" stroke-dasharray="3"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#30363d" stroke-width="1.5"/>

    <!-- Axis spokes (6 axes: CO, H2, CH4, LPG, Alcohol, NH3) -->
    <!-- 0 deg: top (CO) -->
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#30363d" stroke-width="1.5"/>
    <text x="0" y="-172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#f85149" text-anchor="middle">CO (чадний газ)</text>

    <!-- 60 deg: top-right (H2) -->
    <line x1="0" y1="0" x2="138.56" y2="-80" stroke="#30363d" stroke-width="1.5"/>
    <text x="155" y="-85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#bc8cff" text-anchor="start">H2 (водень)</text>

    <!-- 120 deg: bottom-right (CH4) -->
    <line x1="0" y1="0" x2="138.56" y2="80" stroke="#30363d" stroke-width="1.5"/>
    <text x="155" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="start">CH4 (метан)</text>

    <!-- 180 deg: bottom (LPG / Пропан) -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="#30363d" stroke-width="1.5"/>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">LPG (пропан-бутан)</text>

    <!-- 240 deg: bottom-left (Alcohol / Спирт) -->
    <line x1="0" y1="0" x2="-138.56" y2="80" stroke="#30363d" stroke-width="1.5"/>
    <text x="-150" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="end">C2H5OH (етанол)</text>

    <!-- 300 deg: top-left (NH3 / Аміак) -->
    <line x1="0" y1="0" x2="-138.56" y2="-80" stroke="#30363d" stroke-width="1.5"/>
    <text x="-150" y="-85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#8b949e" text-anchor="end">NH3 (аміак)</text>

    <!-- Profile: MQ-7 (high CO, moderate H2, moderate alcohol, low CH4) -->
    <!-- CO: 155, H2: 125, CH4: 25, LPG: 30, Alcohol: 80, NH3: 20 -->
    <!-- Points: (0, -155), (108.2, -62.5), (21.6, 12.5), (0, 30), (-69.2, 40), (-17.3, -10) -->
    <polygon points="0,-155 108.2,-62.5 21.6,12.5 0,30 -69.2,40 -17.3,-10" fill="rgba(248, 81, 73, 0.25)" stroke="#f85149" stroke-width="2.5"/>

    <!-- Profile: MQ-2 (universal: high LPG, high CH4, high H2, high alcohol, low CO) -->
    <!-- CO: 50, H2: 110, CH4: 130, LPG: 150, Alcohol: 120, NH3: 40 -->
    <polygon points="0,-50 95.2,-55 112.5,65 0,150 -103.9,60 -34.6,-20" fill="rgba(210, 153, 34, 0.2)" stroke="#d29922" stroke-width="2"/>

    <!-- Profile: TGS 2611 (with carbon filter: high CH4, tiny alcohol, tiny CO) -->
    <!-- CO: 15, H2: 40, CH4: 150, LPG: 50, Alcohol: 10, NH3: 10 -->
    <polygon points="0,-15 34.6,-20 129.9,75 0,50 -8.6,5 -8.6,-5" fill="rgba(63, 185, 80, 0.25)" stroke="#3fb950" stroke-width="2.5"/>
  </g>

  <!-- Legend & Analysis Panel -->
  <rect x="540" y="85" width="270" height="375" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="555" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="bold" fill="#f0f6fc">Порівняння сенсорів:</text>

  <rect x="555" y="130" width="240" height="65" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="1"/>
  <text x="565" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#f85149">MQ-7 (Чадний газ):</text>
  <text x="565" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Перехресний відгук: водень H2 та спирт</text>
  <text x="565" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Вимагає циклічного нагріву (1.4 В / 5 В)</text>

  <rect x="555" y="205" width="240" height="65" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="565" y="227" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#d29922">MQ-2 (Універсальний):</text>
  <text x="565" y="245" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Широкий спектр (LPG, метан, дим, спирт)</text>
  <text x="565" y="260" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Нульова селективність без матриці датчиків</text>

  <rect x="555" y="280" width="240" height="65" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="565" y="302" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#3fb950">TGS 2611-E00 (Метан):</text>
  <text x="565" y="320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Вугільний фільтр затримує етанол і ЛОС</text>
  <text x="565" y="335" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Висока вибірковість до CH4</text>

  <rect x="555" y="355" width="240" height="90" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="565" y="375" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#58a6ff">Способи подолання інтерференції:</text>
  <text x="565" y="393" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">1. Температурна селекція каталізатора</text>
  <text x="565" y="410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">2. Фізико-хімічні сорбційні фільтри</text>
  <text x="565" y="427" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f0f6fc">3. Сенсорні матриці + машинне навчання (PCA)</text>
</svg>