<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Полумʼя яскраве в ближньому інфрачервоному — саме там фототранзистор чутливий</text>
<path d="M160 230 C 116 170, 134 80, 160 30 C 186 80, 204 170, 160 230 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<path d="M160 226 C 140 184, 148 120, 160 80 C 172 120, 180 184, 160 226 Z" fill="#fff6d8" stroke="none"/>
<text x="160.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">полумʼя</text>
<text x="160.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">гаряча сажа ≈ 1000–1500 K</text>
<line x1="214.0" y1="120.0" x2="640.0" y2="120.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,4"/>
<line x1="620.0" y1="120.0" x2="646.0" y2="120.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="222.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">трохи видимого світла</text>
<line x1="214.0" y1="164.0" x2="640.0" y2="164.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="620.0" y1="164.0" x2="646.0" y2="164.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="222.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">багато ближнього ІЧ (760–1100 нм)</text>
<line x1="214.0" y1="200.0" x2="640.0" y2="200.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="620.0" y1="200.0" x2="646.0" y2="200.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="214.0" y1="236.0" x2="640.0" y2="236.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="620.0" y1="236.0" x2="646.0" y2="236.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="770.0" y="176.0" width="160.0" height="100.0" rx="12" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="806.0" cy="226.0" r="24.0" fill="#111111" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="806.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чорна лінза</text>
<text x="878.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">YG1006</text>
<text x="878.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">фото-</text>
<text x="878.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">транзистор</text>
<line x1="796.0" y1="276.0" x2="796.0" y2="302.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="822.0" y1="276.0" x2="822.0" y2="302.0" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="744.2" y="329.1" width="211.5" height="57.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">ІЧ падає на перехід →</tspan><tspan x="850.0" dy="13.7">транзистор відкривається дужче →</tspan><tspan x="850.0" dy="13.7">струм крізь нього росте</tspan></text>
<rect x="242.7" y="415.9" width="594.6" height="44.1" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="434.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Чорна лінза глушить видиме, а ближній ІЧ пропускає — давач «сліпий» до кольору, зате бачить жар.</tspan><tspan x="540.0" dy="13.7">Тому так само яскраво для нього світять сонце й лампа розжарення (звідси хибні спрацювання).</tspan></text>
</svg>