<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Спектр мерехтіння полум'я (Flame Flicker) та відсікання завад
  </text>

  <!-- Графік спектра частот -->
  <g transform="translate(60, 90)">
    <rect width="730" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Осі -->
    <line x1="50" y1="280" x2="680" y2="280" stroke="#8b949e" stroke-width="2"/>
    <text x="685" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">f (Гц)</text>
    <line x1="50" y1="280" x2="50" y2="50" stroke="#8b949e" stroke-width="2"/>
    <text x="20" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Амплітуда</text>

    <!-- Постійна складова: Сонце (0 Гц) -->
    <rect x="52" y="70" width="16" height="210" fill="#f0883e" opacity="0.8"/>
    <text x="60" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f0883e">Сонце (0 Гц)</text>

    <!-- Корисний сигнал: Спектр мерехтіння полум'я (1..15 Гц) -->
    <path d="M 80,280 Q 140,90 200,120 T 280,280" fill="none" stroke="#f85149" stroke-width="4"/>
    <rect x="80" y="100" width="200" height="180" fill="#da3633" opacity="0.15"/>
    <text x="180" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f85149">
      Зона полум'я (1–15 Гц)
    </text>
    <text x="180" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">
      Характерне хаотичне мерехтіння
    </text>

    <!-- Завада 1: Люмінесцентні лампи (100 Гц) -->
    <line x1="520" y1="280" x2="520" y2="100" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="520" cy="100" r="4" fill="#58a6ff"/>
    <text x="520" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">Лампи 100 Гц</text>

    <!-- Відмітки частот -->
    <text x="50" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">0</text>
    <text x="120" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">5</text>
    <text x="180" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">10</text>
    <text x="240" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">15</text>
    <text x="520" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">100</text>
  </g>
</svg>