<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-right-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,4 L7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-down-red" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L4,7 L7,1 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-up-green" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,7 L4,1 L7,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Передавальна характеристика біполярного давача Холла SS41F</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Перемикання при зміні полюсів: S-полюс (B &gt; B_OP) вмикає вихід, N-полюс (B &lt; B_RP) вимикає</text>

  <!-- Main Plot Area -->
  
  <!-- Background Hysteresis Box -->
  <rect x="250" y="160" width="240" height="180" fill="#eaf0fd" fill-opacity="0.4" stroke="none"/>

  <!-- Voltage Level Dashed Reference Lines -->
  <line x1="150" y1="160" x2="580" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="150" y1="340" x2="580" y2="340" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Threshold Dashed Vertical Lines -->
  <line x1="250" y1="160" x2="250" y2="385" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="490" y1="160" x2="490" y2="385" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Plot Axes -->
  <!-- X-axis -->
  <line x1="150" y1="380" x2="590" y2="380" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <!-- Y-axis (segmented to avoid crossing text) -->
  <line x1="370" y1="132" x2="370" y2="115" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <line x1="370" y1="152" x2="370" y2="215" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="370" y1="275" x2="370" y2="350" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="370" y1="374" x2="370" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Axis Titles -->
  <text x="370" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вихідна напруга V_OUT</text>
  <text x="595" y="398" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">B (mT)</text>
  <text x="370" y="398" text-anchor="middle" font-size="12" fill="#6b7280">0</text>

  <!-- Y-axis Voltage Level Labels (Far left, clear of lines) -->
  <text x="142" y="155" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">V_CC (HIGH)</text>
  <text x="142" y="172" text-anchor="end" font-size="12" fill="#6b7280">Вихід ВИМКН</text>

  <text x="142" y="335" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">V_SAT (LOW)</text>
  <text x="142" y="352" text-anchor="end" font-size="12" fill="#6b7280">Вихід УВІМК</text>

  <!-- Hysteresis Characteristic Loop Lines -->
  <!-- Top Line (HIGH state, moving right) -->
  <line x1="160" y1="160" x2="330" y2="160" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-right-blue)"/>
  <line x1="330" y1="160" x2="490" y2="160" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-right-blue)"/>

  <!-- Right Transition Line (Switch to LOW at B_OP) -->
  <line x1="490" y1="160" x2="490" y2="260" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-down-red)"/>
  <line x1="490" y1="260" x2="490" y2="340" stroke="#c0392b" stroke-width="3"/>

  <!-- Bottom Line (LOW state, moving left) -->
  <line x1="570" y1="340" x2="410" y2="340" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-left-blue)"/>
  <line x1="410" y1="340" x2="250" y2="340" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-left-blue)"/>

  <!-- Left Transition Line (Switch to HIGH at B_RP) -->
  <line x1="250" y1="340" x2="250" y2="240" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-up-green)"/>
  <line x1="250" y1="240" x2="250" y2="160" stroke="#27ae60" stroke-width="3"/>

  <!-- Labels on Hysteresis Loop -->
  <!-- Top State Text -->
  <text x="370" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Стан: HIGH (закритий)</text>
  <!-- Bottom State Text -->
  <text x="370" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Стан: LOW (відкритий)</text>

  <!-- Left Transition Callout -->
  <text x="240" y="244" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Звільнення</text>
  <text x="240" y="260" text-anchor="end" font-size="12" fill="#27ae60">V_OUT → HIGH</text>

  <!-- Right Transition Callout -->
  <text x="500" y="244" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Спрацьовування</text>
  <text x="500" y="260" text-anchor="start" font-size="12" fill="#c0392b">V_OUT → LOW</text>

  <!-- Central Hysteresis Info Box -->
  <rect x="285" y="215" width="170" height="60" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <line x1="250" y1="245" x2="285" y2="245" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="455" y1="245" x2="490" y2="245" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="370" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Зона гістерезису B_HYS</text>
  <text x="370" y="258" text-anchor="middle" font-size="12" fill="#6b7280">Фіксація стану при B = 0</text>

  <!-- X-axis Threshold Labels -->
  <!-- B_RP Label -->
  <text x="250" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">B_RP</text>
  <text x="250" y="416" text-anchor="middle" font-size="12" fill="#27ae60">-14...-20 mT</text>
  <text x="250" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">(N-полюс)</text>

  <!-- B_OP Label -->
  <text x="490" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">B_OP</text>
  <text x="490" y="416" text-anchor="middle" font-size="12" fill="#c0392b">+14...+20 mT</text>
  <text x="490" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">(S-полюс)</text>

  <!-- Magnet Pole Badges on X-axis -->
  <rect x="165" y="442" width="60" height="22" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="195" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">N (Пн)</text>

  <rect x="505" y="442" width="60" height="22" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="535" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">S (Пд)</text>


  <!-- Right Side Info Panel -->

  <!-- Card 1: Operation Modes -->
  <rect x="630" y="100" width="300" height="185" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="645" y="125" font-size="14" font-weight="bold" fill="#1a1a1a">Режими роботи засувки</text>
  <line x1="645" y1="135" x2="915" y2="135" stroke="#d0d7de" stroke-width="1"/>

  <!-- Mode S -->
  <rect x="645" y="148" width="28" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="659" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">S</text>
  <text x="682" y="162" font-size="13" font-weight="bold" fill="#1a1a1a">B &gt; B_OP (S-полюс)</text>
  <text x="682" y="178" font-size="12" fill="#c0392b">Вихід: LOW (транзистор ON)</text>

  <!-- Mode 0 (Memory) -->
  <rect x="645" y="193" width="28" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="659" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">0</text>
  <text x="682" y="207" font-size="13" font-weight="bold" fill="#1a1a1a">B_RP &lt; B &lt; B_OP</text>
  <text x="682" y="223" font-size="12" fill="#2457d6">Фіксація: стан НЕ змінюється</text>

  <!-- Mode N -->
  <rect x="645" y="238" width="28" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="659" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">N</text>
  <text x="682" y="252" font-size="13" font-weight="bold" fill="#1a1a1a">B &lt; B_RP (N-полюс)</text>
  <text x="682" y="268" font-size="12" fill="#27ae60">Вихід: HIGH (транзистор OFF)</text>

  <!-- Card 2: Integration Features -->
  <rect x="630" y="298" width="300" height="177" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="645" y="323" font-size="14" font-weight="bold" fill="#1a1a1a">Особливості інтеграції</text>
  <line x1="645" y1="333" x2="915" y2="333" stroke="#d0d7de" stroke-width="1"/>

  <!-- Bullet 1 -->
  <text x="645" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">• Вихід з відкритим колектором</text>
  <text x="657" y="368" font-size="12" fill="#6b7280">Потребує зовнішній R_pull-up (1-10 кОм)</text>

  <!-- Bullet 2 -->
  <text x="645" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">• Захист від брязкоту (дребезгу)</text>
  <text x="657" y="408" font-size="12" fill="#6b7280">Ширина B_HYS запобігає завадам</text>

  <!-- Bullet 3 -->
  <text x="645" y="432" font-size="12" font-weight="bold" fill="#1a1a1a">• Типове застосування</text>
  <text x="657" y="448" font-size="12" fill="#6b7280">BLDC двигуни, тахометри, енкодери</text>
</svg>
