<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <!-- Standard dark arrow marker -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Blue right arrow marker -->
    <marker id="arr-right" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <!-- Blue left arrow marker -->
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="#2457d6"/>
    </marker>
    <!-- Vertical double arrow up marker -->
    <marker id="arr-up" markerWidth="8" markerHeight="8" refX="3.5" refY="0" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,7 L3.5,0 L7,7 Z" fill="#2457d6"/>
    </marker>
    <!-- Vertical double arrow down marker -->
    <marker id="arr-down" markerWidth="8" markerHeight="8" refX="3.5" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L3.5,7 L7,0 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Залежність магнітної індукції B(z) від відстані до магніту</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Перетин кривої з порогами B<tspan font-size="10" dy="2">OP</tspan><tspan font-size="13" dy="-2"> та B</tspan><tspan font-size="10" dy="2">RP</tspan><tspan font-size="13" dy="-2"> визначає робочі відстані увімкнення d</tspan><tspan font-size="10" dy="2">OP</tspan><tspan font-size="13" dy="-2"> та вимкнення d</tspan><tspan font-size="10" dy="2">RP</tspan></text>

  <!-- Left Panel: Physical Magnet System -->
  <rect x="30" y="85" width="160" height="355" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="110" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Магнітна система</text>
  
  <text x="110" y="132" text-anchor="middle" font-size="11" fill="#6b7280">Постійний магніт</text>
  
  <!-- Magnet block -->
  <rect x="50" y="140" width="120" height="50" fill="#ffffff" stroke="#6b7280" rx="4"/>
  <rect x="50" y="140" width="60" height="50" fill="#fdecea" rx="4"/>
  <rect x="110" y="140" width="60" height="50" fill="#eaf0fd" rx="4"/>
  <rect x="50" y="140" width="120" height="50" fill="none" stroke="#6b7280" rx="4"/>
  <line x1="110" y1="140" x2="110" y2="190" stroke="#6b7280" stroke-dasharray="2 2"/>
  <text x="80" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">S</text>
  <text x="140" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#2457d6">N</text>

  <!-- SS41F Hall Sensor representation inside panel -->
  <rect x="60" y="240" width="100" height="70" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="110" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">SS41F</text>
  <text x="110" y="280" text-anchor="middle" font-size="11" fill="#6b7280">Давач Холла</text>
  <text x="110" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Біполярний</text>

  <!-- Explanatory summary box in left panel -->
  <rect x="40" y="325" width="140" height="105" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="110" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип дії:</text>
  <text x="110" y="363" text-anchor="middle" font-size="11" fill="#6b7280">При наближенні z↓</text>
  <text x="110" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">B ≥ B<tspan font-size="10" dy="2">OP</tspan><tspan font-size="11" dy="-2"> → ON</tspan></text>
  <text x="110" y="396" text-anchor="middle" font-size="11" fill="#6b7280">При віддаленні z↑</text>
  <text x="110" y="411" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">B ≤ B<tspan font-size="10" dy="2">RP</tspan><tspan font-size="11" dy="-2"> → OFF</tspan></text>

  <!-- Right Panel Container -->
  <rect x="210" y="85" width="720" height="355" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>

  <!-- Plot Background -->
  <rect x="270" y="110" width="630" height="260" fill="#ffffff" stroke="#d0d7de" rx="4"/>

  <!-- Hysteresis Zone Background Shade between d_OP (460) and d_RP (610) -->
  <rect x="460" y="110" width="150" height="260" fill="#eaf0fd" opacity="0.45"/>

  <!-- Threshold Line B_OP (+20 mT) at y=180 -->
  <line x1="270" y1="180" x2="880" y2="180" stroke="#27ae60" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="280" y="170" font-size="13" font-weight="bold" fill="#27ae60">B<tspan font-size="10" dy="2">OP</tspan><tspan font-size="13" dy="-2"> — поріг спрацьовування (+20 мТл)</tspan></text>

  <!-- Threshold Line B_RP (+10 mT) at y=260 -->
  <line x1="270" y1="260" x2="880" y2="260" stroke="#c0392b" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="280" y="278" font-size="13" font-weight="bold" fill="#c0392b">B<tspan font-size="10" dy="2">RP</tspan><tspan font-size="13" dy="-2"> — поріг відпускання (+10 мТл)</tspan></text>

  <!-- Vertical Projections for Operating Distances -->
  <line x1="460" y1="180" x2="460" y2="370" stroke="#27ae60" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="610" y1="260" x2="610" y2="370" stroke="#c0392b" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- B(z) Curve -->
  <path d="M 270 120 C 340 140 400 165 460 180 C 520 195 560 235 610 260 C 670 290 750 325 860 335" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="320" y="135" font-size="14" font-weight="bold" fill="#2457d6">B(z)</text>

  <!-- Intersection Markers -->
  <circle cx="460" cy="180" r="6" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  <circle cx="610" cy="260" r="6" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>

  <!-- Hysteresis Band Box Delta B_HYS -->
  <rect x="735" y="190" width="155" height="60" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <line x1="750" y1="195" x2="750" y2="245" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-up)" marker-end="url(#arr-down)"/>
  <text x="822" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ΔB<tspan font-size="10" dy="2">HYS</tspan><tspan font-size="12" dy="-2"> = B</tspan><tspan font-size="10" dy="2">OP</tspan><tspan font-size="12" dy="-2"> - B</tspan><tspan font-size="10" dy="2">RP</tspan></text>
  <text x="822" y="233" text-anchor="middle" font-size="12" fill="#2457d6">Гістерезис: 10 мТл</text>

  <!-- Delta d Dimension Arrow and Box -->
  <line x1="465" y1="330" x2="605" y2="330" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <rect x="480" y="303" width="110" height="22" fill="#ffffff" stroke="#2457d6" rx="4"/>
  <text x="535" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Δd = d<tspan font-size="10" dy="2">RP</tspan><tspan font-size="11" dy="-2"> - d</tspan><tspan font-size="10" dy="2">OP</tspan></text>

  <!-- Coordinate Axes -->
  <!-- Horizontal Axis z -->
  <line x1="270" y1="370" x2="900" y2="370" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="895" y="395" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">z (відстань, мм)</text>

  <!-- Vertical Axis B -->
  <line x1="270" y1="370" x2="270" y2="105" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">B (індукція, мТл)</text>

  <!-- Axis Ticks & Labels -->
  <!-- z = 0 -->
  <line x1="270" y1="370" x2="270" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="386" text-anchor="middle" font-size="12" fill="#6b7280">0</text>

  <!-- z = d_OP (5 mm) -->
  <line x1="460" y1="370" x2="460" y2="375" stroke="#27ae60" stroke-width="1.5"/>
  <text x="460" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">d<tspan font-size="10" dy="2">OP</tspan></text>
  <text x="460" y="405" text-anchor="middle" font-size="11" fill="#27ae60">(5 мм)</text>

  <!-- z = d_RP (9 mm) -->
  <line x1="610" y1="370" x2="610" y2="375" stroke="#c0392b" stroke-width="1.5"/>
  <text x="610" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">d<tspan font-size="10" dy="2">RP</tspan></text>
  <text x="610" y="405" text-anchor="middle" font-size="11" fill="#c0392b">(9 мм)</text>

  <!-- z = 15 mm -->
  <line x1="830" y1="370" x2="830" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="830" y="386" text-anchor="middle" font-size="12" fill="#6b7280">15</text>

  <!-- Bottom Status Indicator Bar -->
  <rect x="270" y="418" width="180" height="22" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="360" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">УВІМКНЕНО (ON)</text>

  <rect x="465" y="418" width="140" height="22" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="535" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Зона гістерезису</text>

  <rect x="620" y="418" width="260" height="22" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="750" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">ВИМКНЕНО (OFF)</text>
</svg>
