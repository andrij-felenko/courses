<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-start-green" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-start-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив опору R_pull-up на тривалість фронту наростання сигналу</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Малий R_pull-up прискорює заряд C_load до V_IH (короткий фронт t_r), але збільшує струм у стані LOW</text>

  <!-- Panel 1: Circuit Diagram -->
  <rect x="25" y="75" width="255" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="152.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема вихідного каскаду</text>

  <!-- V_CC Rail & Label -->
  <line x1="90" y1="120" x2="150" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <text x="120" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+V_CC (5 В)</text>

  <!-- R_pull-up Resistor -->
  <line x1="120" y1="120" x2="120" y2="135" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="108" y="135" width="24" height="45" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="100" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R_pull-up</text>
  <line x1="120" y1="180" x2="120" y2="215" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Output Node & Line -->
  <circle cx="120" cy="215" r="4" fill="#1a1a1a"/>
  <line x1="120" y1="215" x2="245" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="132" y="206" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Вихід V_out (до МК)</text>

  <!-- Branch Split from Node (120, 215) -->
  <line x1="120" y1="215" x2="120" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="240" x2="185" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="240" x2="85" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="185" y1="240" x2="185" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transistor Block (Left Branch at x=85) -->
  <rect x="45" y="255" width="80" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Hall input -->
  <line x1="32" y1="282" x2="80" y2="282" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="58" y="276" font-size="11" fill="#6b7280" text-anchor="middle">Холл</text>
  <!-- Transistor NPN Symbol -->
  <line x1="80" y1="268" x2="80" y2="296" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="85" y1="255" x2="85" y2="272" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="272" x2="80" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="290" x2="85" y2="292" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="85" y1="292" x2="85" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Emitter wire straight down to ground rail -->
  <line x1="85" y1="315" x2="85" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transistor Labels -->
  <text x="93" y="334" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">Транзистор</text>
  <text x="93" y="347" font-size="10" fill="#6b7280" text-anchor="start">SS41F</text>

  <!-- Parasitic Capacitor C_load (Right Branch at x=185) -->
  <line x1="173" y1="265" x2="197" y2="265" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="173" y1="273" x2="197" y2="273" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="185" y1="273" x2="185" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="203" y="266" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C_load</text>
  <text x="203" y="280" font-size="11" fill="#6b7280" text-anchor="start">(паразитна)</text>

  <!-- Ground Rail -->
  <line x1="85" y1="360" x2="185" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="135" y1="360" x2="135" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="123" y1="370" x2="147" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="128" y1="374" x2="142" y2="374" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="133" y1="378" x2="137" y2="378" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Info Callout Card in Panel 1 -->
  <rect x="35" y="388" width="235" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="152.5" y="403" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Транзистор ВИМКНЕНИЙ (Off)</text>
  <text x="152.5" y="418" font-size="10.5" fill="#1a1a1a" text-anchor="middle">Заряд C_load через R_pull-up: τ = R × C</text>

  <!-- Panel 2: Waveform Graph -->
  <rect x="295" y="75" width="640" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="615" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехідний процес напруги V_out(t) при розмиканні</text>

  <!-- Inner Graph Canvas Background -->
  <rect x="375" y="115" width="540" height="245" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Voltage Threshold Grid Lines -->
  <!-- V_CC Level -->
  <line x1="380" y1="140" x2="445" y2="140" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.2"/>
  <line x1="635" y1="140" x2="915" y2="140" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.2"/>
  <text x="370" y="144" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="end">V_CC (5.0В)</text>

  <!-- V_IH Level -->
  <line x1="380" y1="195" x2="775" y2="195" stroke="#2457d6" stroke-dasharray="5,3" stroke-width="1.5"/>
  <text x="370" y="199" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">V_IH (3.5В)</text>
  <rect x="780" y="183" width="130" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="845" y="199" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Поріг LOGIC 1 (V_IH)</text>

  <!-- V_OL Level -->
  <line x1="380" y1="345" x2="915" y2="345" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="370" y="349" font-size="11" fill="#6b7280" text-anchor="end">V_OL (0.4В)</text>

  <!-- Graph Curves -->
  <!-- Curve 1: Small R_pull-up (Green, Fast) -->
  <path d="M 380,345 L 440,345 C 465,270 495,205 540,195 C 590,165 650,143 915,141" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Curve 2: Large R_pull-up (Red, Slow) -->
  <path d="M 380,345 L 440,345 C 520,295 620,230 740,195 C 790,180 840,170 915,165" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Curve Intersection Dots -->
  <circle cx="540" cy="195" r="4.5" fill="#27ae60"/>
  <circle cx="740" cy="195" r="4.5" fill="#c0392b"/>

  <!-- Vertical Reference Lines for t_0, t_1, t_2 -->
  <line x1="440" y1="195" x2="440" y2="360" stroke="#1a1a1a" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="540" y1="195" x2="540" y2="360" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="740" y1="195" x2="740" y2="360" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2"/>

  <!-- Graph Main Axes -->
  <!-- Y Axis -->
  <line x1="380" y1="360" x2="380" y2="115" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="370" y="110" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_out (В)</text>

  <!-- X Axis -->
  <line x1="380" y1="360" x2="925" y2="360" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="915" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час t</text>

  <!-- X Axis Time Ticks & Labels -->
  <!-- t_0 -->
  <line x1="440" y1="360" x2="440" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="440" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_0</text>
  <text x="440" y="392" font-size="11" fill="#6b7280" text-anchor="middle">Розмикання</text>

  <!-- t_1 -->
  <line x1="540" y1="360" x2="540" y2="365" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="378" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_1</text>
  <text x="540" y="392" font-size="11" fill="#27ae60" text-anchor="middle">V_IH (R_1)</text>

  <!-- t_2 -->
  <line x1="740" y1="360" x2="740" y2="365" stroke="#c0392b" stroke-width="1.5"/>
  <text x="740" y="378" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_2</text>
  <text x="740" y="392" font-size="11" fill="#c0392b" text-anchor="middle">V_IH (R_2)</text>

  <!-- Rise Time Dimension Indicators -->
  <!-- t_r1 dimension line -->
  <line x1="440" y1="240" x2="472" y2="240" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-start-green)"/>
  <line x1="508" y1="240" x2="540" y2="240" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="490" y="244" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">t_r1</text>

  <!-- t_r2 dimension line -->
  <line x1="440" y1="330" x2="555" y2="330" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-start-red)"/>
  <line x1="725" y1="330" x2="740" y2="330" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="640" y="334" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">t_r2 (довгий, затримка Δt)</text>

  <!-- Curve Callout Badges -->
  <!-- Badge 1 (Green) -->
  <rect x="455" y="125" width="170" height="36" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="540" y="140" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">R_pull-up1 = 1 кОм (малий)</text>
  <text x="540" y="154" font-size="11" fill="#1a1a1a" text-anchor="middle">Швидке заряджання C_load</text>

  <!-- Badge 2 (Red) -->
  <rect x="565" y="275" width="162" height="36" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="646" y="290" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">R_pull-up2 = 10 кОм (великий)</text>
  <text x="646" y="304" font-size="11" fill="#1a1a1a" text-anchor="middle">Повільне заряджання C_load</text>

  <!-- Formula / Conclusion Summary Box at Bottom -->
  <rect x="305" y="405" width="620" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="615" y="421" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час наростання t_r ≈ R_pull-up × C_load × ln(V_CC / (V_CC - V_IH))   |   Компроміс: Швидкість vs Споживання</text>
</svg>
