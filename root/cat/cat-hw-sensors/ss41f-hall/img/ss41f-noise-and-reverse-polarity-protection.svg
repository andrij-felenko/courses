<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Схема захисту та фільтрації давача Холла SS41F</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Діод Шотткі захищає від переполюсовки, C1 стабілізує живлення, а RC-фільтр пригнічує завади</text>

  <!-- Power Input Region (Left) -->
  <!-- V_IN Terminal -->
  <text x="65" y="115" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">V_IN (+4.5…24V)</text>
  <circle cx="65" cy="170" r="4" fill="#2457d6"/>

  <!-- GND Terminal -->
  <circle cx="65" cy="370" r="4" fill="#1a1a1a"/>
  <text x="65" y="402" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">GND (0V)</text>

  <!-- Main Power Rails -->
  <!-- Top Power Wire: V_IN -> Schottky Diode D1 -> Sensor VCC -->
  <line x1="69" y1="170" x2="135" y2="170" stroke="#2457d6" stroke-width="2"/>
  
  <!-- Schottky Diode D1 -->
  <!-- Anode wire: 135 to 145, Triangle 145..165, Cathode line 165, wire 165 to 195 -->
  <line x1="135" y1="170" x2="145" y2="170" stroke="#27ae60" stroke-width="2"/>
  <polygon points="145,158 165,170 145,182" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="165" y1="156" x2="165" y2="184" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="165" y1="156" x2="161" y2="156" stroke="#27ae60" stroke-width="2"/>
  <line x1="161" y1="156" x2="161" y2="160" stroke="#27ae60" stroke-width="2"/>
  <line x1="165" y1="184" x2="169" y2="184" stroke="#27ae60" stroke-width="2"/>
  <line x1="169" y1="184" x2="169" y2="180" stroke="#27ae60" stroke-width="2"/>
  <line x1="165" y1="170" x2="195" y2="170" stroke="#27ae60" stroke-width="2"/>
  <text x="155" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">D1 (Шотткі SS14)</text>

  <!-- Wire after D1 to C1 junction & Sensor VCC -->
  <line x1="195" y1="170" x2="310" y2="170" stroke="#2457d6" stroke-width="2"/>
  <circle cx="230" cy="170" r="3" fill="#2457d6"/>

  <!-- Decoupling Capacitor C1 (100nF) -->
  <line x1="230" y1="170" x2="230" y2="252" stroke="#2457d6" stroke-width="2"/>
  <line x1="216" y1="252" x2="244" y2="252" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="216" y1="264" x2="244" y2="264" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="230" y1="264" x2="230" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="230" cy="370" r="3" fill="#1a1a1a"/>
  
  <text x="204" y="254" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a1a">C1 (100 nF)</text>
  <text x="204" y="270" font-size="11" text-anchor="end" fill="#6b7280">кераміка</text>

  <!-- Bottom GND Rail -->
  <line x1="69" y1="370" x2="860" y2="370" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Sensor Box: SS41F (Center) -->
  <rect x="310" y="115" width="240" height="280" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  
  <!-- Header Badge inside SS41F -->
  <rect x="320" y="125" width="220" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="430" y="145" font-size="14" font-weight="700" text-anchor="middle" fill="#2457d6">Давач Холла SS41F</text>

  <!-- Sensor Terminals -->
  <!-- Pin 1: VCC -->
  <text x="322" y="174" font-size="12" font-weight="700" text-anchor="start" fill="#1a1a1a">1: VCC</text>
  
  <!-- Pin 2: GND -->
  <line x1="310" y1="370" x2="430" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="310" cy="370" r="3" fill="#1a1a1a"/>
  <text x="322" y="362" font-size="12" font-weight="700" text-anchor="start" fill="#1a1a1a">2: GND</text>

  <!-- Pin 3: OUT -->
  <text x="538" y="274" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a1a">3: OUT</text>
  <line x1="550" y1="270" x2="640" y2="270" stroke="#2457d6" stroke-width="2"/>

  <!-- Internal Sensor Elements -->
  <!-- Block A: Hall Sensor + Schmitt Trigger -->
  <rect x="330" y="185" width="200" height="52" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="430" y="206" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Елемент Холла + Підсилювач</text>
  <text x="430" y="224" font-size="11" text-anchor="middle" fill="#6b7280">Тригер Шмітта (гістерезис)</text>

  <!-- Connection line inside sensor -->
  <line x1="430" y1="237" x2="430" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Block B: Open-Collector NPN Key -->
  <rect x="330" y="265" width="200" height="52" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="430" y="286" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вихідний NPN-транзистор</text>
  <text x="430" y="304" font-size="11" text-anchor="middle" fill="#6b7280">Відкритий колектор (до 20 мА)</text>


  <!-- Pull-Up & Output RC Filter Region (Right) -->

  <!-- V_LOGIC Terminal -->
  <text x="640" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">+V_LOGIC (+3.3V / +5V)</text>
  <circle cx="640" cy="130" r="4" fill="#2457d6"/>
  <line x1="640" y1="134" x2="640" y2="175" stroke="#2457d6" stroke-width="2"/>

  <!-- Resistor R_pullup (Vertical) -->
  <rect x="630" y="175" width="20" height="50" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="640" y1="225" x2="640" y2="270" stroke="#2457d6" stroke-width="2"/>
  <circle cx="640" cy="270" r="3" fill="#2457d6"/>

  <text x="662" y="194" font-size="12" font-weight="700" text-anchor="start" fill="#1a1a1a">R_pullup</text>
  <text x="662" y="210" font-size="11" text-anchor="start" fill="#6b7280">10 kΩ</text>

  <!-- Output Series Filter Resistor Rf (Horizontal) -->
  <line x1="640" y1="270" x2="665" y2="270" stroke="#2457d6" stroke-width="2"/>
  <rect x="665" y="260" width="50" height="20" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="715" y1="270" x2="760" y2="270" stroke="#2457d6" stroke-width="2"/>

  <text x="690" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Rf = 1 kΩ</text>

  <!-- Filter Capacitor C2 (Vertical to GND) -->
  <circle cx="760" cy="270" r="3" fill="#2457d6"/>
  <line x1="760" y1="270" x2="760" y2="305" stroke="#2457d6" stroke-width="2"/>
  <line x1="746" y1="305" x2="774" y2="305" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="746" y1="317" x2="774" y2="317" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="760" y1="317" x2="760" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="760" cy="370" r="3" fill="#1a1a1a"/>

  <text x="784" y="307" font-size="12" font-weight="700" text-anchor="start" fill="#1a1a1a">C2 = 10 nF</text>
  <text x="784" y="323" font-size="11" text-anchor="start" fill="#6b7280">кераміка</text>

  <!-- Output Wire to MCU -->
  <line x1="760" y1="270" x2="860" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- MCU Box -->
  <rect x="860" y="230" width="90" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="905" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Мікроконтролер</text>
  <text x="905" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вхід GPIO</text>
  <text x="905" y="294" font-size="11" text-anchor="middle" fill="#6b7280">(3.3V / 5V)</text>

  <!-- Bottom Functional Feature Cards -->
  <!-- Card 1: Power Protection -->
  <rect x="40" y="415" width="275" height="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="50" y="423" width="170" height="22" fill="#27ae60" rx="3"/>
  <text x="135" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="white">Захист живлення (D1, C1)</text>
  <text x="52" y="462" font-size="11" text-anchor="start" fill="#1a1a1a">D1 захищає від переполюсовки (-VCC)</text>
  <text x="52" y="480" font-size="11" text-anchor="start" fill="#1a1a1a">C1 (100nF) гасить високочастотні завади</text>

  <!-- Card 2: Open Collector Output -->
  <rect x="342" y="415" width="275" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="352" y="423" width="185" height="22" fill="#2457d6" rx="3"/>
  <text x="444" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="white">Логіка виходу (Відкритий NPN)</text>
  <text x="354" y="462" font-size="11" text-anchor="start" fill="#1a1a1a">При наявності пол. S вихід = LOW (0V)</text>
  <text x="354" y="480" font-size="11" text-anchor="start" fill="#1a1a1a">Без поля вихід = HIGH (через R_pullup)</text>

  <!-- Card 3: RC Output Filter -->
  <rect x="645" y="415" width="275" height="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="655" y="423" width="175" height="22" fill="#27ae60" rx="3"/>
  <text x="742" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="white">Фільтрація сигналу (Rf, C2)</text>
  <text x="657" y="462" font-size="11" text-anchor="start" fill="#1a1a1a">RC-ланцюг пригнічує імпульсні наводки</text>
  <text x="657" y="480" font-size="11" text-anchor="start" fill="#1a1a1a">Захищає вхід MCU від ESD та брязкоту</text>

</svg>
