<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Розпіновка та конструктивні розміри корпусу TO-92 (SS41F)</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Нумерація виводів (1: VCC, 2: GND, 3: Output) відраховується зліва направо при погляді на пласку грань</text>

  <!-- Ліва панель: Вигляд спереду та розміри -->
  <rect x="30" y="75" width="440" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вигляд спереду (габаритні розміри)</text>
  <text x="250" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Пласка грань повернута маркуванням до спостерігача</text>

  <!-- Розмір ширини корпусу -->
  <text x="250" y="130" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">4.5 мм</text>
  <line x1="195" y1="134" x2="305" y2="134" stroke="#6b7280" stroke-width="1"/>
  <line x1="195" y1="130" x2="195" y2="138" stroke="#6b7280" stroke-width="1"/>
  <line x1="305" y1="130" x2="305" y2="138" stroke="#6b7280" stroke-width="1"/>

  <!-- Розмір висоти корпусу -->
  <text x="168" y="191" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">4.1 мм</text>
  <line x1="175" y1="145" x2="175" y2="230" stroke="#6b7280" stroke-width="1"/>
  <line x1="171" y1="145" x2="179" y2="145" stroke="#6b7280" stroke-width="1"/>
  <line x1="171" y1="230" x2="179" y2="230" stroke="#6b7280" stroke-width="1"/>

  <!-- Розмір довжини виводів -->
  <text x="333" y="276" font-size="12" font-weight="700" text-anchor="start" fill="#6b7280">14.5 мм</text>
  <line x1="325" y1="230" x2="325" y2="315" stroke="#6b7280" stroke-width="1"/>
  <line x1="321" y1="230" x2="329" y2="230" stroke="#6b7280" stroke-width="1"/>
  <line x1="321" y1="315" x2="329" y2="315" stroke="#6b7280" stroke-width="1"/>

  <!-- Корпус TO-92 спереду -->
  <path d="M 203 145 L 297 145 C 302 145 305 147 305 152 L 305 224 C 305 228 301 230 297 230 L 203 230 C 199 230 195 228 195 224 L 195 152 C 195 147 198 145 203 145 Z" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="200" y="150" width="100" height="75" rx="3" fill="#3a475a"/>

  <!-- Елемент Холла всередині -->
  <rect x="235" y="165" width="30" height="18" rx="2" fill="#4a5568" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="250" y="178" font-size="12" text-anchor="middle" fill="#e2e8f0">Hall</text>

  <!-- Маркування SS41F -->
  <text x="250" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">SS41F</text>

  <!-- Виводи (ніжки 1, 2, 3) -->
  <rect x="210" y="230" width="10" height="85" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <rect x="245" y="230" width="10" height="85" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <rect x="280" y="230" width="10" height="85" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>

  <!-- Кружечки з номерами виводів -->
  <circle cx="215" cy="333" r="10" fill="#2457d6"/>
  <text x="215" y="337" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>

  <circle cx="250" cy="333" r="10" fill="#475569"/>
  <text x="250" y="337" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>

  <circle cx="285" cy="333" r="10" fill="#27ae60"/>
  <text x="285" y="337" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

  <!-- Крок виводів -->
  <text x="250" y="352" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Крок між виводами: 1.27 мм</text>

  <!-- Блоки з описом ніжок -->
  <rect x="45" y="368" width="125" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Вивід 1: VCC</text>
  <text x="107" y="412" font-size="12" text-anchor="middle" fill="#1a1a1a">Живлення</text>
  <text x="107" y="432" font-size="12" text-anchor="middle" fill="#1a1a1a">+4.5 В ... +24 В</text>

  <rect x="180" y="368" width="125" height="90" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="242" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вивід 2: GND</text>
  <text x="242" y="412" font-size="12" text-anchor="middle" fill="#6b7280">Спільний / Земля</text>
  <text x="242" y="432" font-size="12" text-anchor="middle" fill="#6b7280">0 В</text>

  <rect x="315" y="368" width="140" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="385" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Вивід 3: Output</text>
  <text x="385" y="412" font-size="12" text-anchor="middle" fill="#1a1a1a">Цифровий вихід</text>
  <text x="385" y="432" font-size="12" text-anchor="middle" fill="#1a1a1a">Відкритий кол.</text>

  <!-- Права панель: Вигляд знизу та орієнтація -->
  <rect x="490" y="75" width="440" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Вигляд знизу (профіль зрізу)</text>
  <text x="710" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Форма корпусу та орієнтація ніжок</text>

  <!-- Вказівник на пласку грань -->
  <text x="710" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">ПЛАСКА ГРАНЬ (передній бік)</text>
  <line x1="710" y1="150" x2="710" y2="158" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Профіль корпусу знизу -->
  <path d="M 650 162 L 770 162 L 780 172 A 70 70 0 0 1 640 172 Z" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>

  <!-- Виводи в розрізі -->
  <rect x="658" y="182" width="16" height="14" rx="2" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="666" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>

  <rect x="702" y="182" width="16" height="14" rx="2" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
  <text x="710" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>

  <rect x="746" y="182" width="16" height="14" rx="2" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <text x="754" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

  <!-- Розмір товщини корпусу -->
  <text x="806" y="206" font-size="12" font-weight="700" text-anchor="start" fill="#6b7280">3.1 мм</text>
  <line x1="798" y1="162" x2="798" y2="242" stroke="#6b7280" stroke-width="1"/>
  <line x1="794" y1="162" x2="802" y2="162" stroke="#6b7280" stroke-width="1"/>
  <line x1="794" y1="242" x2="802" y2="242" stroke="#6b7280" stroke-width="1"/>

  <!-- Округлена грань -->
  <text x="710" y="264" font-size="12" text-anchor="middle" fill="#6b7280">Округлена грань (тильний бік)</text>

  <!-- Блок характеристик -->
  <rect x="505" y="285" width="410" height="173" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="308" font-size="13" font-weight="700" fill="#1a1a1a">Конструктивні особливості TO-92 (SS41F):</text>
  <text x="520" y="333" font-size="12" fill="#1a1a1a">• Порядок виводів: 1 — VCC, 2 — GND, 3 — Output</text>
  <text x="520" y="356" font-size="12" fill="#1a1a1a">• Вихід: Відкритий колектор (NPN, потрібен R_pullup)</text>
  <text x="520" y="379" font-size="12" fill="#1a1a1a">• Робоча напруга VCC: від +4.5 В до +24 В DC</text>
  <text x="520" y="402" font-size="12" fill="#1a1a1a">• Орієнтація: маркована грань — передній бік</text>
  <text x="520" y="425" font-size="12" fill="#1a1a1a">• Монтаж: крок ніжок 1.27 мм (TO-92UA)</text>
  <text x="520" y="448" font-size="12" fill="#1a1a1a">• Максимальний струм виходу I_out: 20 мА</text>
</svg>
