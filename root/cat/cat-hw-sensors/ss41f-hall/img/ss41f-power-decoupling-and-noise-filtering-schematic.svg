<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема обв'язки давача SS41F для захисту від завад</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Шунтуючий конденсатор C1 пригнічує завади живлення, а R_pull-up фіксує вихідний рівень</text>

  <!-- Головна панель принципової схеми -->
  <rect x="30" y="85" width="900" height="290" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="110" font-size="14" font-weight="700" fill="#1a1a1a">Принципова схема підключення SS41F</text>

  <!-- Блок роз'єму / МК (ліворуч) -->
  <rect x="50" y="125" width="100" height="235" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="100" y="148" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">Роз'єм / МК</text>

  <circle cx="150" cy="170" r="4" fill="#c0392b"/>
  <text x="140" y="174" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">VCC (+5V)</text>

  <circle cx="150" cy="240" r="4" fill="#2457d6"/>
  <text x="140" y="244" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">OUT (GPIO)</text>

  <circle cx="150" cy="310" r="4" fill="#1a1a1a"/>
  <text x="140" y="314" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">GND (0V)</text>

  <!-- Основні провідники живлення та сигналу -->
  <!-- Лінія VCC (+5V) -->
  <line x1="150" y1="170" x2="730" y2="170" stroke="#c0392b" stroke-width="2"/>

  <!-- Лінія OUT (Signal) з напрямком до МК -->
  <line x1="730" y1="240" x2="157" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Лінія GND (0V) -->
  <line x1="150" y1="310" x2="730" y2="310" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Шунтуючий конденсатор C1 -->
  <!-- Точки з'єднання (вузли) -->
  <circle cx="310" cy="170" r="4" fill="#c0392b"/>
  <line x1="310" y1="170" x2="310" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Обкладки конденсатора -->
  <line x1="295" y1="195" x2="325" y2="195" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="295" y1="205" x2="325" y2="205" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="310" y1="205" x2="310" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="310" cy="310" r="4" fill="#1a1a1a"/>

  <!-- Позначення C1 -->
  <text x="290" y="195" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">C1 (0.1 мкФ)</text>
  <text x="290" y="213" font-size="11" fill="#6b7280" text-anchor="end">Кераміка (100 нФ)</text>
  <text x="290" y="270" font-size="11" font-weight="700" fill="#27ae60" text-anchor="end">Фільтр живлення</text>
  <text x="290" y="286" font-size="11" fill="#6b7280" text-anchor="end">Гасить імпульсні завади</text>

  <!-- Підтягувальний резистор R_pull-up -->
  <circle cx="510" cy="170" r="4" fill="#c0392b"/>
  <line x1="510" y1="170" x2="510" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Прямокутник резистора -->
  <rect x="498" y="190" width="24" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="510" y1="220" x2="510" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="510" cy="240" r="4" fill="#2457d6"/>

  <!-- Позначення R_pull-up -->
  <text x="535" y="195" font-size="13" font-weight="700" fill="#1a1a1a">R_pull-up (10 кОм)</text>
  <text x="535" y="213" font-size="11" fill="#6b7280">Підтяжка до VCC</text>
  <text x="535" y="270" font-size="11" font-weight="700" fill="#2457d6">Фіксація рівня</text>
  <text x="535" y="286" font-size="11" fill="#6b7280">Усуває плаваючий стан</text>

  <!-- Корпус давача SS41F (праворуч) -->
  <rect x="730" y="135" width="140" height="215" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="800" y="158" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">SS41F</text>
  <text x="800" y="174" font-size="11" fill="#6b7280" text-anchor="middle">Давач Холла</text>

  <!-- Виводи SS41F -->
  <text x="742" y="194" font-size="11" font-weight="700" fill="#c0392b">1: VCC</text>
  <text x="742" y="244" font-size="11" font-weight="700" fill="#2457d6">3: OUT</text>
  <text x="742" y="314" font-size="11" font-weight="700" fill="#1a1a1a">2: GND</text>

  <!-- Внутрішні блоки SS41F -->
  <rect x="790" y="190" width="70" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="825" y="211" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Елемент</text>
  <text x="825" y="226" font-size="11" fill="#2457d6" text-anchor="middle">Холла</text>

  <rect x="790" y="260" width="70" height="48" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="825" y="281" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Тригер /</text>
  <text x="825" y="296" font-size="11" fill="#6b7280" text-anchor="middle">NPN ключ</text>

  <!-- Картки з поясненнями функцій елементів (внизу) -->
  <!-- Картка 1: C1 -->
  <rect x="30" y="390" width="435" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="413" font-size="13" font-weight="700" fill="#27ae60">1. Шунтування живлення (C1 = 0.1 мкФ)</text>
  <text x="45" y="435" font-size="12" fill="#1a1a1a">• Розміщується якнайближче до виводів 1 (VCC) та 2 (GND)</text>
  <text x="45" y="455" font-size="12" fill="#1a1a1a">• Поглинає високочастотні імпульсні завади в лінії живлення</text>
  <text x="45" y="475" font-size="12" fill="#1a1a1a">• Запобігає хибним спрацьовуванням тригера Шмітта</text>

  <!-- Картка 2: R_pull-up -->
  <rect x="495" y="390" width="435" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="510" y="413" font-size="13" font-weight="700" fill="#2457d6">2. Підтяжка виходу (R_pull-up = 10 кОм)</text>
  <text x="510" y="435" font-size="12" fill="#1a1a1a">• Формує логічну 1 (VCC), коли внутрішній транзистор закритий</text>
  <text x="510" y="455" font-size="12" fill="#1a1a1a">• Усуває стан «плаваючого входу» (High-Z) мікроконтролера</text>
  <text x="510" y="475" font-size="12" fill="#1a1a1a">• Забезпечує круті фронти сигналів при перемиканні</text>
</svg>
