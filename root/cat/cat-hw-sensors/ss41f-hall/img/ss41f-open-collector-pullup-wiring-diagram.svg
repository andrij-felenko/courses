<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення SS41F з відкритим колектором та R_pull-up</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішній резистор R_pull-up формує чіткі логічні рівні VCC (HIGH) та 0 В (LOW) на вході мікроконтролера</text>

  <!-- ================= PANEL 1: STATE 1 (OFF / HIGH) ================= -->
  <rect x="30" y="75" width="435" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="75" width="435" height="36" rx="8" fill="#eaf0fd"/>
  <rect x="30" y="99" width="435" height="12" fill="#eaf0fd"/>
  <text x="247" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">СТАН 1: Поле відсутнє (Транзистор ВИМКН)</text>

  <!-- Sensor Box 1 -->
  <rect x="50" y="135" width="175" height="205" rx="6" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="125" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач SS41F</text>
  <text x="125" y="173" font-size="12" fill="#6b7280" text-anchor="middle">(Open Collector)</text>

  <!-- Hall Element 1 -->
  <rect x="68" y="195" width="42" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="89" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hall</text>

  <!-- Internal Transistor Symbol 1 (OFF) -->
  <!-- Switch Contacts -->
  <circle cx="190" cy="220" r="3" fill="#1a1a1a"/>
  <circle cx="190" cy="280" r="3" fill="#1a1a1a"/>
  <!-- Open Lever -->
  <line x1="190" y1="280" x2="178" y2="230" stroke="#c0392b" stroke-width="2"/>
  <text x="135" y="247" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ВИМКН</text>
  <text x="135" y="265" font-size="12" fill="#6b7280" text-anchor="middle">(Z-стан)</text>

  <!-- Internal Connections inside Sensor 1 -->
  <line x1="110" y1="208" x2="175" y2="208" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="190" y1="150" x2="190" y2="195" stroke="#6b7280" stroke-width="1"/>
  <line x1="190" y1="280" x2="190" y2="315" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Sensor 1 Terminals -->
  <line x1="190" y1="150" x2="225" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="190" y1="220" x2="225" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="190" y1="315" x2="225" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Pin Labels 1 -->
  <text x="215" y="142" font-size="12" fill="#6b7280" text-anchor="end">VCC</text>
  <text x="215" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT</text>
  <text x="215" y="307" font-size="12" fill="#6b7280" text-anchor="end">GND</text>

  <!-- Power Rails 1 -->
  <line x1="225" y1="150" x2="310" y2="150" stroke="#2457d6" stroke-width="2"/>
  <line x1="225" y1="315" x2="310" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND Symbol 1 -->
  <line x1="300" y1="315" x2="320" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="304" y1="320" x2="316" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="308" y1="325" x2="312" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="340" font-size="12" fill="#6b7280" text-anchor="middle">0V (GND)</text>

  <!-- VCC Label 1 -->
  <text x="267" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+5V (VCC)</text>

  <!-- Pull-Up Resistor 1 -->
  <line x1="310" y1="150" x2="310" y2="170" stroke="#2457d6" stroke-width="2"/>
  <rect x="301" y="170" width="18" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="206" x2="310" y2="220" stroke="#2457d6" stroke-width="2"/>
  <text x="326" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_pull-up</text>
  <text x="326" y="200" font-size="12" fill="#6b7280" text-anchor="start">10 кОм</text>

  <!-- Node 1 & MCU Wire -->
  <line x1="225" y1="220" x2="370" y2="220" stroke="#2457d6" stroke-width="2"/>
  <circle cx="310" cy="220" r="3.5" fill="#2457d6"/>

  <!-- Current Arrow 1 (Through R_pullup to MCU) -->
  <line x1="310" y1="152" x2="310" y2="166" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="325" y1="220" x2="362" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- MCU Box 1 -->
  <rect x="370" y="150" width="80" height="175" rx="6" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="410" y="175" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
  <text x="376" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">GPIO</text>

  <!-- MCU Logic Display 1 -->
  <rect x="378" y="240" width="64" height="65" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="410" y="260" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">HIGH</text>
  <text x="410" y="278" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC</text>
  <text x="410" y="295" font-size="12" fill="#6b7280" text-anchor="middle">(~5 В)</text>

  <!-- Explanation Box 1 -->
  <rect x="42" y="355" width="411" height="125" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="54" y="378" font-size="12" font-weight="bold" fill="#2457d6">1. Вихідний транзистор давача закритий</text>
  <text x="54" y="398" font-size="12" fill="#1a1a1a">2. Струм через відкритий колектор на GND не тече</text>
  <text x="54" y="418" font-size="12" fill="#1a1a1a">3. Резистор R_pull-up утримує потенціал лінії на VCC</text>
  <text x="54" y="445" font-size="13" font-weight="bold" fill="#2457d6">Результат: Вхід MCU фіксує HIGH (VCC)</text>


  <!-- ================= PANEL 2: STATE 2 (ON / LOW) ================= -->
  <rect x="495" y="75" width="435" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="495" y="75" width="435" height="36" rx="8" fill="#e9f7ef"/>
  <rect x="495" y="99" width="435" height="12" fill="#e9f7ef"/>
  <text x="712" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">СТАН 2: Поле B &gt; B_OP (полюс S поруч)</text>

  <!-- Sensor Box 2 -->
  <rect x="515" y="135" width="175" height="205" rx="6" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="590" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач SS41F</text>
  <text x="590" y="173" font-size="12" fill="#6b7280" text-anchor="middle">(Open Collector)</text>

  <!-- Magnet S Icon -->
  <rect x="525" y="195" width="28" height="26" rx="3" fill="#c0392b"/>
  <text x="539" y="212" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S</text>
  <line x1="553" y1="208" x2="568" y2="208" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Hall Element 2 -->
  <rect x="570" y="195" width="42" height="26" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="591" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Hall</text>

  <!-- Internal Transistor Symbol 2 (ON) -->
  <!-- Switch Contacts -->
  <circle cx="655" cy="220" r="3" fill="#1a1a1a"/>
  <circle cx="655" cy="280" r="3" fill="#1a1a1a"/>
  <!-- Closed Lever -->
  <line x1="655" y1="220" x2="655" y2="280" stroke="#27ae60" stroke-width="2.5"/>
  <text x="595" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">УВІМКН</text>
  <text x="595" y="265" font-size="12" fill="#6b7280" text-anchor="middle">(на GND)</text>

  <!-- Internal Connections inside Sensor 2 -->
  <line x1="612" y1="208" x2="640" y2="208" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="655" y1="150" x2="655" y2="195" stroke="#6b7280" stroke-width="1"/>
  <line x1="655" y1="280" x2="655" y2="315" stroke="#27ae60" stroke-width="2"/>

  <!-- Sensor 2 Terminals -->
  <line x1="655" y1="150" x2="690" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="655" y1="220" x2="690" y2="220" stroke="#27ae60" stroke-width="2"/>
  <line x1="655" y1="315" x2="690" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Pin Labels 2 -->
  <text x="680" y="142" font-size="12" fill="#6b7280" text-anchor="end">VCC</text>
  <text x="680" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">OUT</text>
  <text x="680" y="307" font-size="12" fill="#6b7280" text-anchor="end">GND</text>

  <!-- Power Rails 2 -->
  <line x1="690" y1="150" x2="775" y2="150" stroke="#2457d6" stroke-width="2"/>
  <line x1="690" y1="315" x2="775" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND Symbol 2 -->
  <line x1="765" y1="315" x2="785" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="769" y1="320" x2="781" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="773" y1="325" x2="777" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="775" y="340" font-size="12" fill="#6b7280" text-anchor="middle">0V (GND)</text>

  <!-- VCC Label 2 -->
  <text x="732" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+5V (VCC)</text>

  <!-- Pull-Up Resistor 2 -->
  <line x1="775" y1="150" x2="775" y2="170" stroke="#27ae60" stroke-width="2"/>
  <rect x="766" y="170" width="18" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="775" y1="206" x2="775" y2="220" stroke="#27ae60" stroke-width="2"/>
  <text x="791" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_pull-up</text>
  <text x="791" y="200" font-size="12" fill="#6b7280" text-anchor="start">10 кОм</text>

  <!-- Node 2 & MCU Wire -->
  <line x1="690" y1="220" x2="835" y2="220" stroke="#27ae60" stroke-width="2"/>
  <circle cx="775" cy="220" r="3.5" fill="#27ae60"/>

  <!-- Current Arrow 2 (From VCC through R_pullup and into sensor to GND) -->
  <line x1="775" y1="152" x2="775" y2="166" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="760" y1="220" x2="702" y2="220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="655" y1="230" x2="655" y2="270" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- MCU Box 2 -->
  <rect x="835" y="150" width="80" height="175" rx="6" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="875" y="175" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
  <text x="841" y="214" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">GPIO</text>

  <!-- MCU Logic Display 2 -->
  <rect x="843" y="240" width="64" height="65" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="875" y="260" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">LOW</text>
  <text x="875" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GND</text>
  <text x="875" y="295" font-size="12" fill="#6b7280" text-anchor="middle">(~0.4 В)</text>

  <!-- Explanation Box 2 -->
  <rect x="507" y="355" width="411" height="125" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="519" y="378" font-size="12" font-weight="bold" fill="#27ae60">1. Магнітне поле полюса S відкриває транзистор</text>
  <text x="519" y="398" font-size="12" fill="#1a1a1a">2. Струм з VCC через R_pull-up стікає в давач на GND</text>
  <text x="519" y="418" font-size="12" fill="#1a1a1a">3. Напруга на лінії падає до V_CE(sat) ≈ 0.4 В</text>
  <text x="519" y="445" font-size="13" font-weight="bold" fill="#27ae60">Результат: Вхід MCU фіксує LOW (~0.4 В)</text>
</svg>
