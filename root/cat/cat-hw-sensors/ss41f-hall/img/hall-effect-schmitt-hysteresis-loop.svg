<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Петля гістерезису тригера Шмітта в цифровому давачі Холла</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Зона гістерезису ΔB_HYS = B_OP - B_RP блокує брязкіт виходу при шумах магнітного поля</text>

  <!-- Панель 1: Графік залежності V_OUT від B -->
  <rect x="40" y="90" width="580" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Характеристика перемикання V_OUT(B)</text>

  <!-- Затінення зони гістерезису -->
  <rect x="270" y="170" width="180" height="200" fill="#eaf0fd" fill-opacity="0.75" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Сітка / Граничні рівні напруги -->
  <line x1="150" y1="170" x2="570" y2="170" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="142" y="174" font-size="11" fill="#6b7280" text-anchor="end">V_HIGH (V_CC)</text>

  <line x1="150" y1="370" x2="570" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="142" y="374" font-size="11" fill="#6b7280" text-anchor="end">V_LOW (0 В)</text>

  <!-- Осі координат -->
  <!-- Осі Y -->
  <line x1="150" y1="410" x2="150" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="160" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вихідна напруга V_OUT [В]</text>

  <!-- Осі X -->
  <line x1="140" y1="410" x2="570" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="565" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Індукція B [мТл]</text>

  <!-- Проекції порогів B_RP та B_OP -->
  <line x1="270" y1="170" x2="270" y2="410" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="170" x2="450" y2="410" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Засічки та підписи порогів на осі X -->
  <line x1="270" y1="407" x2="270" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="428" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B_RP</text>
  <text x="270" y="442" font-size="11" fill="#6b7280" text-anchor="middle">(Відпускання)</text>

  <line x1="450" y1="407" x2="450" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="428" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B_OP</text>
  <text x="450" y="442" font-size="11" fill="#6b7280" text-anchor="middle">(Спрацьовування)</text>

  <!-- Розмірність гістерезису ΔB_HYS під віссю X -->
  <line x1="270" y1="465" x2="450" y2="465" stroke="#2457d6" stroke-width="1.5"/>
  <polyline points="276,461 270,465 276,469" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <polyline points="444,461 450,465 444,469" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="482" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔB_HYS = B_OP - B_RP (Ширина петлі)</text>

  <!-- Головна петля гістерезису (лінії стану) -->
  <!-- Верхній рівень V_HIGH: зліва до B_OP -->
  <line x1="150" y1="170" x2="450" y2="170" stroke="#2457d6" stroke-width="3"/>

  <!-- Нижні рівні V_LOW: від B_RP праворуч -->
  <line x1="270" y1="370" x2="550" y2="370" stroke="#2457d6" stroke-width="3"/>

  <!-- Вертикальний перехід СПРАЦЬОВУВАННЯ (при B = B_OP): HIGH -> LOW -->
  <line x1="450" y1="170" x2="450" y2="370" stroke="#c0392b" stroke-width="3"/>

  <!-- Вертикальний перехід ЗВІЛЬНЕННЯ (при B = B_RP): LOW -> HIGH -->
  <line x1="270" y1="370" x2="270" y2="170" stroke="#27ae60" stroke-width="3"/>

  <!-- Напрямки руху по петлі (стрілки на лініях) -->
  <!-- Рух праворуч по верхній лінії (збільшення B) -->
  <line x1="330" y1="170" x2="380" y2="170" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Рух вниз при B_OP -->
  <line x1="450" y1="230" x2="450" y2="280" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <!-- Рух ліворуч по нижній лінії (зменшення B) -->
  <line x1="390" y1="370" x2="340" y2="370" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Рух вгору при B_RP -->
  <line x1="270" y1="310" x2="270" y2="260" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Підписи на лініях переходу -->
  <text x="278" y="220" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Звільнення (LOW → HIGH)</text>
  <text x="442" y="320" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">Спрацьовування (HIGH → LOW)</text>

  <!-- Центральний шильдик зони стійкості -->
  <rect x="300" y="252" width="120" height="34" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="360" y="266" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗОНА СТІЙКОСТІ</text>
  <text x="360" y="279" font-size="10" fill="#6b7280" text-anchor="middle">Збереження стану</text>

  <!-- Панель 2: Опис параметрів та принципу -->
  <rect x="640" y="90" width="280" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Параметри та принцип</text>

  <!-- Картка 1: Ширина гістерезису -->
  <rect x="655" y="125" width="250" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="670" y="145" font-size="12" font-weight="bold" fill="#2457d6">Ширина гістерезису</text>
  <text x="670" y="168" font-size="13" font-weight="bold" fill="#1a1a1a">ΔB_HYS = B_OP - B_RP</text>
  <text x="670" y="188" font-size="11" fill="#6b7280">Запобігає пороговому брязкоту</text>

  <!-- Картка 2: B_OP -->
  <rect x="655" y="215" width="250" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="670" y="235" font-size="12" font-weight="bold" fill="#c0392b">B_OP — Поріг спрацьовування</text>
  <text x="670" y="255" font-size="11" fill="#1a1a1a">• Наближення магніту (полюс S)</text>
  <text x="670" y="273" font-size="11" fill="#1a1a1a">• B &gt; B_OP → Вихід = LOW (0 В)</text>

  <!-- Картка 3: B_RP -->
  <rect x="655" y="305" width="250" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="325" font-size="12" font-weight="bold" fill="#27ae60">B_RP — Поріг звільнення</text>
  <text x="670" y="345" font-size="11" fill="#1a1a1a">• Віддалення магніту (або N)</text>
  <text x="670" y="363" font-size="11" fill="#1a1a1a">• B &lt; B_RP → Вихід = HIGH (V_CC)</text>

  <!-- Картка 4: Стійкість до шуму -->
  <rect x="655" y="395" width="250" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="670" y="415" font-size="12" font-weight="bold" fill="#1a1a1a">Стійкість до перешкод</text>
  <text x="670" y="435" font-size="11" fill="#6b7280">• Якщо шум ΔB_шум &lt; ΔB_HYS,</text>
  <text x="670" y="453" font-size="11" fill="#6b7280">  стан виходу не змінюється.</text>
</svg>
