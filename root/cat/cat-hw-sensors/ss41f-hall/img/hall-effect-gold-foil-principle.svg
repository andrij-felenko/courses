<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    
    <!-- Linear Gradients for Metal Foil -->
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="foilSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="foilFrontGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принцип виникнення ефекту Холла в провіднику</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Магнітне поле відхиляє носії заряду до краю тонкої пластини, створюючи поперечну напругу VH</text>

  <!-- Left Main Scheme Area -->
  <rect x="25" y="78" width="570" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Scheme Subtitle Badge -->
  <rect x="40" y="90" width="170" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="125" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">СХЕМА ЕКСПЕРИМЕНТУ</text>

  <!-- Magnetic Field B Badge -->
  <rect x="220" y="90" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="260" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Поле B ↑</text>

  <!-- Magnetic Field Vectors B (Vertical arrows passing upward through plate at x=130 and x=380) -->
  <!-- B Vector 1 (Left, x=130) -->
  <line x1="130" y1="315" x2="130" y2="290" stroke="#2457d6" stroke-width="2"/>
  <line x1="130" y1="290" x2="130" y2="210" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="130" y1="210" x2="130" y2="122" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- B Vector 2 (Right, x=380) -->
  <line x1="380" y1="315" x2="380" y2="290" stroke="#2457d6" stroke-width="2"/>
  <line x1="380" y1="290" x2="380" y2="210" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="380" y1="210" x2="380" y2="122" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 3D Conducting Plate (Gold Foil) -->
  <!-- Top Surface (A: 150,210 -> B: 390,210 -> C: 320,290 -> D: 80,290) -->
  <polygon points="150,210 390,210 320,290 80,290" fill="url(#foilGrad)" stroke="#d97706" stroke-width="1.5"/>

  <!-- Front Thickness Surface (D: 80,290 -> C: 320,290 -> C': 320,308 -> D': 80,308) -->
  <polygon points="80,290 320,290 320,308 80,308" fill="url(#foilFrontGrad)" stroke="#d97706" stroke-width="1.5"/>

  <!-- Side Thickness Surface (C: 320,290 -> B: 390,210 -> B': 390,228 -> C': 320,308) -->
  <polygon points="320,290 390,210 390,228 320,308" fill="url(#foilSideGrad)" stroke="#d97706" stroke-width="1.5"/>

  <!-- Dimension line for thickness d -->
  <line x1="60" y1="290" x2="60" y2="308" stroke="#6b7280" stroke-width="1"/>
  <line x1="55" y1="290" x2="65" y2="290" stroke="#6b7280" stroke-width="1"/>
  <line x1="55" y1="308" x2="65" y2="308" stroke="#6b7280" stroke-width="1"/>
  <text x="50" y="303" text-anchor="end" font-size="12" fill="#6b7280">d</text>

  <!-- Longitudinal Current Wires and Labels -->
  <!-- Incoming Current I (Left Wire) -->
  <line x1="35" y1="250" x2="115" y2="250" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="70" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Струм I</text>

  <!-- Outgoing Current I (Right Wire) -->
  <line x1="365" y1="250" x2="445" y2="250" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="422" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Струм I</text>

  <!-- Accumulation of Positive Charges (+) along Back Edge AB (y=210) -->
  <circle cx="175" cy="198" r="6.5" fill="#c0392b"/>
  <text x="175" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
  <circle cx="215" cy="198" r="6.5" fill="#c0392b"/>
  <text x="215" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
  <circle cx="255" cy="198" r="6.5" fill="#c0392b"/>
  <text x="255" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
  <circle cx="295" cy="198" r="6.5" fill="#c0392b"/>
  <text x="295" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
  <circle cx="335" cy="198" r="6.5" fill="#c0392b"/>
  <text x="335" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>
  <circle cx="370" cy="198" r="6.5" fill="#c0392b"/>
  <text x="370" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+</text>

  <text x="265" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Надлишок позитивного заряду (+)</text>

  <!-- Accumulation of Negative Charges (-) along Front Edge CD (y=290) -->
  <circle cx="105" cy="299" r="6.5" fill="#2457d6"/>
  <text x="105" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">-</text>
  <circle cx="145" cy="299" r="6.5" fill="#2457d6"/>
  <text x="145" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">-</text>
  <circle cx="185" cy="299" r="6.5" fill="#2457d6"/>
  <text x="185" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">-</text>
  <circle cx="225" cy="299" r="6.5" fill="#2457d6"/>
  <text x="225" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">-</text>
  <circle cx="265" cy="299" r="6.5" fill="#2457d6"/>
  <text x="265" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">-</text>
  <circle cx="305" cy="299" r="6.5" fill="#2457d6"/>
  <text x="305" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">-</text>

  <text x="200" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Накопичення електронів (-)</text>

  <!-- Electron Drift Motion Inside Plate -->
  <!-- Vector for drift velocity v_d (electrons moving right to left) -->
  <line x1="310" y1="250" x2="252" y2="250" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="265" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дрейф e⁻ (v_d)</text>

  <!-- Prominent Electron with Lorentz Force Vector -->
  <!-- Electron circle -->
  <circle cx="240" cy="250" r="9" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="240" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">-</text>
  <!-- Lorentz Force Arrow F_L (deflecting electron towards front edge) -->
  <line x1="234" y1="256" x2="200" y2="280" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="190" y="278" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Сила F_L</text>

  <!-- Electric Field E_H Arrow across plate width (from back to front) -->
  <line x1="330" y1="222" x2="305" y2="275" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-dark)"/>
  <text x="300" y="285" text-anchor="end" font-size="12" font-style="italic" fill="#6b7280">Поле E_H</text>

  <!-- Transverse Hall Voltage Measurement Leads -->
  <!-- Positive lead from back edge (+) at (370, 198) to Voltmeter (+) at (450, 185) -->
  <path d="M 370,198 L 425,185 L 450,185" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="442" y="181" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">+</text>

  <!-- Negative lead from front edge (-) at (265, 299) to Voltmeter (-) at (450, 320) -->
  <path d="M 265,299 L 415,320 L 450,320" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="442" y="316" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">-</text>

  <!-- Voltmeter Box -->
  <rect x="450" y="155" width="130" height="195" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <path d="M 450,163 A 8,8 0 0 1 458,155 L 572,155 A 8,8 0 0 1 580,155 L 580,185 L 450,185 Z" fill="#2457d6"/>
  <text x="515" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ВОЛЬТМЕТР</text>

  <!-- Digital Screen -->
  <rect x="462" y="195" width="106" height="42" rx="4" fill="#1a1a1a"/>
  <text x="515" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">0.42 мВ</text>

  <text x="515" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Напруга V_H</text>

  <!-- Signal Note inside Voltmeter -->
  <rect x="458" y="262" width="114" height="78" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="515" y="278" text-anchor="middle" font-size="12" fill="#1a1a1a">Сигнал малий</text>
  <text x="515" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">(мікровольти, мкВ)</text>
  <text x="515" y="314" text-anchor="middle" font-size="11" fill="#6b7280">потребує</text>
  <text x="515" y="328" text-anchor="middle" font-size="11" fill="#6b7280">підсилення</text>

  <!-- Right Side Card: Physics Principles & Formulas -->
  <rect x="610" y="78" width="325" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Card Header -->
  <rect x="625" y="90" width="295" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="772.5" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ФІЗИЧНА ФОРМУЛА ТА ЗМІННІ</text>

  <!-- Main Formula Box -->
  <rect x="625" y="126" width="295" height="52" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="772.5" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">V_H = ( I · B ) / ( n · q · d )</text>
  <text x="772.5" y="167" text-anchor="middle" font-size="11" fill="#6b7280">Поперечна напруга пропорційна I та B</text>

  <!-- Variables Breakdown Box -->
  <rect x="625" y="188" width="295" height="144" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="640" y="208" font-size="12" font-weight="bold" fill="#2457d6">V_H</text>
  <text x="905" y="208" text-anchor="end" font-size="12" fill="#1a1a1a">напруга Холла (вихідний сигнал)</text>

  <text x="640" y="230" font-size="12" font-weight="bold" fill="#1a1a1a">I</text>
  <text x="905" y="230" text-anchor="end" font-size="12" fill="#6b7280">подовжній струм у провіднику</text>

  <text x="640" y="252" font-size="12" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="905" y="252" text-anchor="end" font-size="12" fill="#6b7280">магнітна індукція поля</text>

  <text x="640" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">d</text>
  <text x="905" y="274" text-anchor="end" font-size="12" fill="#6b7280">товщина фольги / пластини</text>

  <text x="640" y="296" font-size="12" font-weight="bold" fill="#1a1a1a">n · q</text>
  <text x="905" y="296" text-anchor="end" font-size="12" fill="#6b7280">концентрація та заряд носіїв</text>

  <text x="640" y="318" font-size="12" font-weight="bold" fill="#c0392b">F_L</text>
  <text x="905" y="318" text-anchor="end" font-size="12" fill="#c0392b">сила Лоренца F_L = q · (v × B)</text>

  <!-- Limitations Note Box -->
  <rect x="625" y="342" width="295" height="82" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="637" y="360" font-size="12" font-weight="bold" fill="#c0392b">Обмеження металевої фольги (1879):</text>
  <text x="637" y="378" font-size="12" fill="#1a1a1a">• Велика концентрація носіїв n у металі</text>
  <text x="637" y="396" font-size="12" fill="#1a1a1a">• Сигнал V_H лише мікровольти (мкВ)</text>
  <text x="637" y="414" font-size="12" fill="#6b7280">• Потребує інтегрального підсилювача</text>

  <!-- Bottom Historical Evolution Panel -->
  <rect x="25" y="450" width="910" height="70" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Left Historical Box -->
  <rect x="40" y="460" width="415" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="478" font-size="12" font-weight="bold" fill="#c0392b">1879 р. — Експеримент Едвіна Холла (Золота фольга)</text>
  <text x="55" y="496" font-size="12" fill="#1a1a1a">Висока n у металі ➔ V_H ~ мкВ (лише лабораторний феномен)</text>

  <!-- Right Historical Box -->
  <rect x="475" y="460" width="445" height="50" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="490" y="478" font-size="12" font-weight="bold" fill="#27ae60">1970–1980-ті — Інтегральний давач Холла (SS41F)</text>
  <text x="490" y="496" font-size="12" fill="#1a1a1a">Кремній (низьке n) + ОУ + тригер Шмітта ➔ цифровий сигнал</text>
</svg>
