<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Перетворення спектра FFT та розрахунок dBSPL для OLED</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Візуалізація зв'язку між бінами Фур'є, акустичним тиском і кадровим буфером</text>

  <!-- ПАНЕЛЬ 1: Частотні біни FFT -->
  <rect x="25" y="75" width="270" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="160" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. Спектральні біни FFT</text>
  <text x="160" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Масив амплітуд |X[k]| (esp-dsp)</text>

  <!-- Підблок 1.1: Параметри -->
  <rect x="38" y="130" width="244" height="62" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="160" y="151" font-size="12" text-anchor="middle" fill="#1a1a1a">Частота дискретизації: f_s = 16 кГц</text>
  <text x="160" y="173" font-size="12" text-anchor="middle" fill="#6b7280">Розмір вибірки: N = 512 семплів</text>

  <!-- Підблок 1.2: Графік бінів -->
  <rect x="38" y="204" width="244" height="170" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="160" y="224" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Амплітуди гармонік |X[k]|</text>

  <path d="M 75 330 L 75 240" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 75 330 L 265 330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="70" y="248" font-size="12" font-weight="bold" text-anchor="end" fill="#6b7280">|X|</text>
  <text x="268" y="342" font-size="12" font-weight="bold" text-anchor="start" fill="#6b7280">f</text>

  <rect x="84" y="315" width="10" height="15" fill="#2457d6" rx="1"/>
  <rect x="98" y="300" width="10" height="30" fill="#2457d6" rx="1"/>
  <rect x="112" y="265" width="10" height="65" fill="#2457d6" rx="1"/>
  <rect x="126" y="285" width="10" height="45" fill="#2457d6" rx="1"/>
  <rect x="140" y="255" width="10" height="75" fill="#2457d6" rx="1"/>
  <rect x="154" y="280" width="10" height="50" fill="#2457d6" rx="1"/>
  <rect x="168" y="305" width="10" height="25" fill="#2457d6" rx="1"/>
  <rect x="182" y="315" width="10" height="15" fill="#2457d6" rx="1"/>
  <text x="202" y="315" font-size="12" fill="#6b7280">...</text>
  <rect x="222" y="320" width="10" height="10" fill="#2457d6" rx="1"/>
  <text x="160" y="360" font-size="12" text-anchor="middle" fill="#6b7280">k = 0, 1, 2 ... 255 (N/2 бінів)</text>

  <!-- Підблок 1.3: Віконна функція -->
  <rect x="38" y="386" width="244" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="160" y="408" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Віконна функція Ханна</text>
  <text x="160" y="430" font-size="12" text-anchor="middle" fill="#1a1a1a">Зменшення спектрального витоку</text>
  <text x="160" y="454" font-size="12" text-anchor="middle" fill="#6b7280">w[n] = 0.5 · (1 - cos(2πn/N))</text>

  <!-- ПАНЕЛЬ 2: Обробка та Мапування -->
  <rect x="340" y="75" width="280" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Обробка та Мапування</text>
  <text x="480" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Паралельний розрахунок даних</text>

  <!-- Підблок 2.1: Гілка A (dBSPL) -->
  <rect x="352" y="130" width="256" height="162" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="480" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Гілка A: Рівень шуму (dBSPL)</text>
  <text x="480" y="172" font-size="12" text-anchor="middle" fill="#1a1a1a">1) P_rms = √( (1/N) · Σ x²[n] )</text>
  <text x="480" y="194" font-size="12" text-anchor="middle" fill="#1a1a1a">2) L_dB = 20 · log₁₀(P_rms / P_ref)</text>
  <text x="480" y="216" font-size="12" text-anchor="middle" fill="#1a1a1a">3) dBSPL = L_dB + C_calib</text>
  <rect x="362" y="228" width="236" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="480" y="247" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Результат: 74.2 dBSPL</text>
  <text x="480" y="266" font-size="12" fill="#6b7280" text-anchor="middle">Форматований рядок тексту</text>

  <!-- Підблок 2.2: Гілка B (Спектрограма) -->
  <rect x="352" y="304" width="256" height="177" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="480" y="324" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Гілка B: Спектрограма</text>
  <text x="480" y="346" font-size="12" text-anchor="middle" fill="#1a1a1a">1) Групування бінів: 256 → 128</text>
  <text x="480" y="368" font-size="12" text-anchor="middle" fill="#1a1a1a">2) H_bar = map(20·log₁₀|X[k]|)</text>
  <rect x="362" y="382" width="236" height="86" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="480" y="402" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Масив висот H[0..127]</text>
  <text x="480" y="424" font-size="12" text-anchor="middle" fill="#1a1a1a">Висота стовпчика: 0..48 px</text>
  <text x="480" y="446" font-size="12" fill="#6b7280" text-anchor="middle">1 стовпчик = 1 px ширини OLED</text>

  <!-- ПАНЕЛЬ 3: Дисплей OLED (128×64) -->
  <rect x="665" y="75" width="270" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="800" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3. Дисплей OLED (128×64)</text>
  <text x="800" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Відображення та кадровий буфер</text>

  <!-- Підблок 3.1: Мокап екрана OLED -->
  <rect x="678" y="130" width="244" height="175" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="692" y="152" font-size="12" font-weight="bold" fill="#ffffff">74.2 dBSPL</text>
  <text x="908" y="152" font-size="12" text-anchor="end" fill="#6b7280">16 kHz</text>
  <line x1="692" y1="162" x2="908" y2="162" stroke="#30363d" stroke-width="1"/>

  <!-- Стовпчики спектра на OLED -->
  <rect x="692" y="265" width="5" height="10" fill="#2457d6"/>
  <rect x="699" y="260" width="5" height="15" fill="#2457d6"/>
  <rect x="706" y="253" width="5" height="22" fill="#2457d6"/>
  <rect x="713" y="240" width="5" height="35" fill="#2457d6"/>
  <rect x="720" y="227" width="5" height="48" fill="#2457d6"/>
  <rect x="727" y="235" width="5" height="40" fill="#2457d6"/>
  <rect x="734" y="247" width="5" height="28" fill="#2457d6"/>
  <rect x="741" y="257" width="5" height="18" fill="#2457d6"/>
  <rect x="748" y="263" width="5" height="12" fill="#2457d6"/>
  <rect x="755" y="265" width="5" height="10" fill="#2457d6"/>
  <rect x="762" y="267" width="5" height="8" fill="#2457d6"/>
  <rect x="769" y="261" width="5" height="14" fill="#2457d6"/>
  <rect x="776" y="250" width="5" height="25" fill="#2457d6"/>
  <rect x="783" y="237" width="5" height="38" fill="#2457d6"/>
  <rect x="790" y="231" width="5" height="44" fill="#2457d6"/>
  <rect x="797" y="243" width="5" height="32" fill="#2457d6"/>
  <rect x="804" y="255" width="5" height="20" fill="#2457d6"/>
  <rect x="811" y="263" width="5" height="12" fill="#2457d6"/>
  <rect x="818" y="267" width="5" height="8" fill="#2457d6"/>
  <rect x="825" y="269" width="5" height="6" fill="#2457d6"/>
  <rect x="832" y="265" width="5" height="10" fill="#2457d6"/>
  <rect x="839" y="259" width="5" height="16" fill="#2457d6"/>
  <rect x="846" y="263" width="5" height="12" fill="#2457d6"/>
  <rect x="853" y="267" width="5" height="8" fill="#2457d6"/>
  <rect x="860" y="269" width="5" height="6" fill="#2457d6"/>
  <rect x="867" y="270" width="5" height="5" fill="#2457d6"/>
  <rect x="874" y="271" width="5" height="4" fill="#2457d6"/>
  <rect x="881" y="271" width="5" height="4" fill="#2457d6"/>
  <rect x="888" y="271" width="5" height="4" fill="#2457d6"/>
  <rect x="895" y="271" width="5" height="4" fill="#2457d6"/>

  <text x="692" y="295" font-size="12" text-anchor="start" fill="#6b7280">0 Гц</text>
  <text x="908" y="295" font-size="12" text-anchor="end" fill="#6b7280">8 кГц (Nyquist)</text>

  <!-- Підблок 3.2: Буфер RAM -->
  <rect x="678" y="340" width="244" height="142" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="800" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Кадровий буфер у RAM</text>
  <text x="800" y="380" font-size="12" text-anchor="middle" fill="#2457d6">uint8_t buffer[1024]</text>
  <text x="800" y="398" font-size="12" fill="#6b7280" text-anchor="middle">8 сторінок × 128 байт</text>
  <rect x="690" y="410" width="220" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="800" y="430" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Оновлення екрана</text>
  <text x="800" y="450" font-size="12" text-anchor="middle" fill="#1a1a1a">Передача по I2C / SPI (DMA)</text>

  <!-- МІЖПАНЕЛЬНІ СТРІЛКИ ТА ЗВ'ЯЗКИ -->
  <path d="M 282 161 L 348 161" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="317.5" y="150" font-size="12" text-anchor="middle" fill="#6b7280">Семпли</text>

  <path d="M 282 345 L 348 345" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="317.5" y="334" font-size="12" text-anchor="middle" fill="#6b7280">|X[k]|</text>

  <path d="M 598 254 H 642.5 V 152 H 670" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="642.5" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">dBSPL</text>

  <path d="M 598 425 H 642.5 V 365 H 670" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="642.5" y="353" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">H[i]</text>

  <path d="M 800 340 V 310" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="808" y="328" font-size="12" font-weight="bold" text-anchor="start" fill="#27ae60">Буфер → OLED</text>
</svg>
