<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передача аудіоданих через I2S в кільцевий DMA-буфер ESP32</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Тактові лінії BCLK і WS керують потоком PCM, а DMA-дескриптори заповнюють буфери без навантаження CPU</text>

  <!-- Panel 1: INMP441 MEMS Microphone -->
  <rect x="30" y="90" width="170" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="118" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">INMP441 MEMS</text>
  <text x="115" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Цифровий мікрофон</text>

  <!-- MEMS Core Block -->
  <rect x="45" y="152" width="140" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="115" y="177" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">24-біт АЦП + ФНЧ</text>
  <text x="115" y="199" font-size="12" fill="#6b7280" text-anchor="middle">PCM аудіопотік</text>

  <!-- Pins inside INMP441 -->
  <!-- BCLK Pin -->
  <text x="95" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Вхід тактування</text>
  <rect x="150" y="248" width="50" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="175" y="264" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">BCLK</text>

  <!-- WS Pin -->
  <text x="95" y="324" font-size="12" fill="#6b7280" text-anchor="middle">Вибір каналу L/R</text>
  <rect x="150" y="308" width="50" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="175" y="324" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">WS</text>

  <!-- SD Pin -->
  <text x="95" y="384" font-size="12" fill="#6b7280" text-anchor="middle">Вихід даних PCM</text>
  <rect x="150" y="368" width="50" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="175" y="384" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SD</text>

  <text x="115" y="440" font-size="12" fill="#6b7280" text-anchor="middle">L/R = GND (Лівий)</text>

  <!-- Middle Section: I2S Bus Connections -->
  <!-- BCLK Bus Line (ESP32 -> INMP441) -->
  <line x1="375" y1="260" x2="200" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="280" y="245" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">BCLK (Такти бітів)</text>
  <text x="280" y="276" font-size="12" fill="#6b7280" text-anchor="middle">1.411 МГц</text>

  <!-- WS Bus Line (ESP32 -> INMP441) -->
  <line x1="375" y1="320" x2="200" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="280" y="305" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">WS (Кадр L/R)</text>
  <text x="280" y="336" font-size="12" fill="#6b7280" text-anchor="middle">44.1 кГц</text>

  <!-- SD Bus Line (INMP441 -> ESP32) -->
  <line x1="200" y1="380" x2="375" y2="380" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="280" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SD (Потік PCM)</text>
  <text x="280" y="396" font-size="12" fill="#6b7280" text-anchor="middle">24 біти / слово</text>

  <!-- Panel 2: ESP32 Microcontroller -->
  <rect x="360" y="90" width="570" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="645" y="116" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32 Мікроконтролер</text>

  <!-- Sub-panel 1: I2S Peripheral -->
  <rect x="375" y="135" width="135" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="442" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2S Периферія</text>
  <text x="442" y="171" font-size="12" fill="#6b7280" text-anchor="middle">(Master Mode)</text>

  <rect x="382" y="185" width="121" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="442" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор тактування</text>
  <text x="442" y="218" font-size="12" fill="#6b7280" text-anchor="middle">BCLK + WS</text>

  <rect x="382" y="240" width="121" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="442" y="257" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I2S Rx FIFO</text>
  <text x="442" y="273" font-size="12" fill="#6b7280" text-anchor="middle">Прийом 32-біт слів</text>

  <text x="442" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Зсувні регістри</text>

  <!-- Arrow I2S FIFO -> DMA Controller -->
  <line x1="510" y1="261" x2="525" y2="261" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Sub-panel 2: DMA Controller -->
  <rect x="525" y="135" width="145" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="597" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2S DMA Контролер</text>
  <text x="597" y="171" font-size="12" fill="#6b7280" text-anchor="middle">(Автоматичний)</text>

  <rect x="535" y="185" width="125" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="597" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дескриптори lldesc_t</text>
  <text x="597" y="218" font-size="12" fill="#6b7280" text-anchor="middle">Вказівник буфера</text>

  <rect x="535" y="240" width="125" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="257" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Авто-перемикання</text>
  <text x="597" y="273" font-size="12" fill="#6b7280" text-anchor="middle">по кільцю буферів</text>

  <text x="597" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Генерить EOF Int</text>

  <!-- Arrow DMA Controller -> Ring Buffer -->
  <line x1="670" y1="261" x2="685" y2="261" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Sub-panel 3: Ring Buffer in SRAM -->
  <rect x="685" y="135" width="230" height="310" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="800" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кільцевий DMA-буфер</text>
  <text x="800" y="171" font-size="12" fill="#6b7280" text-anchor="middle">SRAM (напр. 4 × 1024 байт)</text>

  <!-- Buffer 0: Ready -->
  <rect x="695" y="185" width="155" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="772" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер 0 [ГОТОВИЙ]</text>
  <text x="772" y="218" font-size="12" fill="#27ae60" text-anchor="middle">Очікує запис на SD (CPU)</text>

  <!-- Arrow Buf 0 -> Buf 1 -->
  <line x1="772" y1="229" x2="772" y2="242" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Buffer 1: Active WR -->
  <rect x="695" y="244" width="155" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="772" y="261" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер 1 [АКТИВНИЙ WR]</text>
  <text x="772" y="277" font-size="12" fill="#2457d6" text-anchor="middle">DMA наразі записує сюди</text>

  <!-- Arrow Buf 1 -> Buf 2 -->
  <line x1="772" y1="288" x2="772" y2="301" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Buffer 2: Free -->
  <rect x="695" y="303" width="155" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="772" y="320" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфер 2 [ВІЛЬНИЙ]</text>
  <text x="772" y="336" font-size="12" fill="#6b7280" text-anchor="middle">Очікує черги DMA</text>

  <!-- Arrow Buf 2 -> Buf 3 -->
  <line x1="772" y1="345" x2="772" y2="358" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Buffer 3: Free -->
  <rect x="695" y="360" width="155" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="772" y="377" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфер 3 [ВІЛЬНИЙ]</text>
  <text x="772" y="393" font-size="12" fill="#6b7280" text-anchor="middle">Очікує черги DMA</text>

  <!-- Wrap-around Link (Buf 3 -> Buf 0) -->
  <path d="M 850 381 C 885 381, 885 207, 850 207" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="895" y="298" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">lldesc.next</text>

  <!-- Sub-panel 4: CPU / Write Task -->
  <rect x="375" y="345" width="295" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="522" y="365" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CPU / Задача запису (FreeRTOS Task)</text>
  <text x="522" y="384" font-size="12" fill="#c0392b" text-anchor="middle">1. Прокидається за перериванням EOF</text>
  <text x="522" y="402" font-size="12" fill="#27ae60" text-anchor="middle">2. Читає готовий Буфер 0 → запис на SD</text>
  <text x="522" y="420" font-size="12" fill="#6b7280" text-anchor="middle">3. Під час запису DMA наповнює Буфер 1</text>
  <text x="522" y="437" font-size="12" fill="#1a1a1a" text-anchor="middle">(Повна синхронізація без втрат кадрів)</text>

  <!-- EOF Interrupt Arrow (DMA -> CPU) -->
  <line x1="597" y1="330" x2="597" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="605" y="340" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">EOF Int</text>

  <!-- Read CPU Arrow (Buf 0 -> CPU) -->
  <path d="M 695 207 L 680 207 L 680 370 L 670 370" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="677" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Читання CPU</text>
</svg>
