<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="grad-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Обчислення середньоквадратичного значення RMS аудіосигналу</text>
  <text x="480" y="52" font-size="13" fill="#64748b" text-anchor="middle">Дискретне інтегрування енергії PCM-відліків: піднесення до квадрата, 64-бітне накопичення та вилучення кореня</text>

  <!-- Graph Panel -->
  <g transform="translate(40, 75)">
    <rect width="520" height="375" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="520" height="36" rx="8" fill="#e2e8f0"/>
    <text x="260" y="24" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Енергетичний профіль сигналу: миттєві амплітуди vs RMS</text>

    <!-- Axes -->
    <g transform="translate(50, 45)">
      <!-- Peak Positive / Negative -->
      <line x1="0" y1="30" x2="430" y2="30" stroke="#94a3b8" stroke-dasharray="3,3"/>
      <text x="435" y="34" font-size="10" fill="#64748b">+A_peak</text>

      <line x1="0" y1="130" x2="430" y2="130" stroke="#64748b" stroke-width="1.5"/>
      <text x="435" y="134" font-size="10" font-weight="600" fill="#64748b">0 (Рівень тиші)</text>

      <line x1="0" y1="230" x2="430" y2="230" stroke="#94a3b8" stroke-dasharray="3,3"/>
      <text x="435" y="234" font-size="10" fill="#64748b">-A_peak</text>

      <!-- RMS Level Lines -->
      <line x1="0" y1="70" x2="430" y2="70" stroke="#2563eb" stroke-dasharray="5,3" stroke-width="2"/>
      <text x="15" y="65" font-size="11" font-weight="700" fill="#2563eb">+A_rms = 0.707 * A_peak</text>

      <line x1="0" y1="190" x2="430" y2="190" stroke="#2563eb" stroke-dasharray="5,3" stroke-width="2"/>
      <text x="15" y="205" font-size="11" font-weight="700" fill="#2563eb">-A_rms</text>

      <!-- Shaded Energy Area Under Sine -->
      <path d="M 0,130 Q 50,15 100,130 Q 150,245 200,130 Q 250,15 300,130 Q 350,245 400,130 L 400,130 L 0,130 Z" fill="url(#grad-area)"/>

      <!-- Audio Waveform -->
      <path d="M 0,130 Q 50,15 100,130 Q 150,245 200,130 Q 250,15 300,130 Q 350,245 400,130" fill="none" stroke="#0284c7" stroke-width="2.5"/>

      <!-- Discrete Sample Points -->
      <circle cx="25" cy="73" r="3.5" fill="#2563eb"/>
      <circle cx="50" cy="30" r="3.5" fill="#2563eb"/>
      <circle cx="75" cy="73" r="3.5" fill="#2563eb"/>
      <circle cx="100" cy="130" r="3.5" fill="#2563eb"/>
      <circle cx="125" cy="187" r="3.5" fill="#2563eb"/>
      <circle cx="150" cy="230" r="3.5" fill="#2563eb"/>
      <circle cx="175" cy="187" r="3.5" fill="#2563eb"/>
      <circle cx="200" cy="130" r="3.5" fill="#2563eb"/>

      <!-- Sample bars -->
      <line x1="50" y1="130" x2="50" y2="30" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="50" y="20" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">x[i]</text>
    </g>

    <!-- Legend -->
    <rect x="25" y="305" width="470" height="55" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="35" y="325" font-size="11" font-weight="600" fill="#334155">• Миттєвий тиск x[i]: коливається між додатними та від'ємними значеннями</text>
    <text x="35" y="345" font-size="11" font-weight="600" fill="#2563eb">• Енергія RMS: еквівалентна потужність постійного струму, площа під квадратом хвилі</text>
  </g>

  <!-- Step-by-Step Pipeline Panel -->
  <g transform="translate(585, 75)">
    <rect width="335" height="375" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="335" height="36" rx="8" fill="#e2e8f0"/>
    <text x="167" y="24" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Математичний конвеєр RMS</text>

    <!-- Step 1 -->
    <rect x="20" y="55" width="295" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="30" y="75" font-size="11" font-weight="700" fill="#2563eb">Крок 1: Квадратування відліків</text>
    <text x="30" y="95" font-size="11" fill="#475569">sq[i] = (int64_t)x[i] * x[i]</text>
    <text x="30" y="108" font-size="10" fill="#94a3b8">Усунення знака (всі числа стають &gt; 0)</text>

    <!-- Step 2 -->
    <rect x="20" y="130" width="295" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="30" y="150" font-size="11" font-weight="700" fill="#2563eb">Крок 2: Накопичення в 64-бітну суму</text>
    <text x="30" y="170" font-size="11" fill="#475569">sum_sq += sq[i]  (N відліків)</text>
    <text x="30" y="183" font-size="10" fill="#94a3b8">Захист від переповнення 32-бітного int</text>

    <!-- Step 3 -->
    <rect x="20" y="205" width="295" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="30" y="225" font-size="11" font-weight="700" fill="#2563eb">Крок 3: Усереднення потужності</text>
    <text x="30" y="245" font-size="11" fill="#475569">mean_sq = sum_sq / N</text>
    <text x="30" y="258" font-size="10" fill="#94a3b8">Середня енергія сигналу за часове вікно</text>

    <!-- Step 4 -->
    <rect x="20" y="280" width="295" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="302" font-size="11" font-weight="700" fill="#1d4ed8">Крок 4: Вилучення кореня (RMS)</text>
    <text x="30" y="322" font-size="12" font-weight="700" fill="#0f172a">RMS = sqrt(mean_sq)</text>
    <text x="30" y="340" font-size="11" fill="#2563eb">→ дБ SPL = 120.0 + 20 * log10(RMS)</text>
  </g>
</svg>
