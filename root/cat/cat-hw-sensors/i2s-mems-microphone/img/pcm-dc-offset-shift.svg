<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив постійного зсуву (DC Offset) та його усунення IIR-фільтром</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">DC-зсув зміщує сигнал відносно нуля і спричиняє асиметричне кліпування; фільтрація відновлює динамічний діапазон</text>

  <!-- Left Panel: Before Filter (Problem) -->
  <rect x="25" y="78" width="430" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="92" width="400" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="113" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">ДО ФІЛЬТРАЦІЇ: Сигнал із DC Offset</text>

  <!-- Left Plot Canvas -->
  <rect x="80" y="136" width="350" height="230" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Plot Grid / Boundaries -->
  <line x1="80" y1="165" x2="430" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="72" y="169" font-size="12" fill="#6b7280" text-anchor="end">+A_max</text>

  <line x1="80" y1="205" x2="430" y2="205" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="422" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_DC (зсув)</text>

  <line x1="80" y1="250" x2="430" y2="250" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="72" y="254" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0</text>

  <line x1="80" y1="335" x2="430" y2="335" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="72" y="339" font-size="12" fill="#6b7280" text-anchor="end">-A_max</text>

  <!-- Left Plot DC Arrow -->
  <line x1="100" y1="248" x2="100" y2="209" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="108" y="232" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_DC</text>

  <!-- Left Plot Waveform (Clipped at top) -->
  <path d="M 80,205 C 95,190 105,165 120,165 L 150,165 C 165,165 175,205 190,240 C 200,265 210,265 220,240 C 235,205 245,165 260,165 L 290,165 C 305,165 315,205 330,240 C 340,265 350,265 360,240 C 375,205 385,195 400,205 L 430,205" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Left Plot Callout -->
  <rect x="125" y="138" width="135" height="20" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="192" y="152" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Кліпінг (зрізання)</text>

  <!-- Left Plot Summary Pill -->
  <rect x="80" y="376" width="350" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="255" y="393" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Втрата динамічного діапазону та спотворення</text>

  <!-- Left Panel Footer Notes -->
  <rect x="40" y="414" width="400" height="34" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="427" font-size="11" fill="#1a1a1a" text-anchor="start">• Постійний зсув зміщує сигнал відносно 0</text>
  <text x="50" y="441" font-size="11" fill="#c0392b" text-anchor="start">• Верхній поріг досягається передчасно (кліпінг)</text>

  <!-- Transition Arrow & Pill -->
  <line x1="462" y1="245" x2="498" y2="245" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="462" y="214" width="36" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="229" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">HPF</text>

  <!-- Right Panel: After Filter (Solution) -->
  <rect x="505" y="78" width="430" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="520" y="92" width="400" height="32" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="113" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">ПІСЛЯ ФІЛЬТРАЦІЇ: IIR High-Pass Filter</text>

  <!-- Right Plot Canvas -->
  <rect x="560" y="136" width="350" height="230" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Right Plot Grid / Boundaries -->
  <line x1="560" y1="165" x2="910" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="552" y="169" font-size="12" fill="#6b7280" text-anchor="end">+A_max</text>

  <line x1="560" y1="250" x2="910" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <text x="552" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">0</text>
  <text x="902" y="244" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">y[n] = 0</text>

  <line x1="560" y1="335" x2="910" y2="335" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="552" y="339" font-size="12" fill="#6b7280" text-anchor="end">-A_max</text>

  <!-- Right Plot Waveform (Centered & Clean) -->
  <path d="M 560,250 C 575,230 585,190 600,190 C 615,190 625,230 640,250 C 655,270 665,310 680,310 C 695,310 705,270 720,250 C 735,230 745,190 760,190 C 775,190 785,230 800,250 C 815,270 825,310 840,310 C 855,310 865,270 880,250 L 910,250" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Right Plot Callout -->
  <rect x="630" y="138" width="210" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="735" y="152" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Симетричний динамічний запас</text>

  <!-- Right Plot Formula Box -->
  <rect x="560" y="376" width="350" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="735" y="393" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IIR HPF: y[n] = α · (y[n-1] + x[n] - x[n-1])</text>

  <!-- Right Panel Footer Notes -->
  <rect x="520" y="414" width="400" height="34" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="427" font-size="11" fill="#1a1a1a" text-anchor="start">• Середнє значення сигналу вирівняно до 0</text>
  <text x="530" y="441" font-size="11" fill="#27ae60" text-anchor="start">• Симетричний запас для максимальної амплітуди</text>
</svg>
