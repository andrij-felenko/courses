<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення I2S MEMS-мікрофона до мікроконтролера</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">RC/LC-фільтрація VDD та конфігурація виводу L/R для захисту від завад</text>

  <!-- Left Block: Microcontroller (ESP32) -->
  <rect x="40" y="80" width="200" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Мікроконтролер</text>
  <text x="140" y="123" text-anchor="middle" font-size="12" fill="#6b7280">(ESP32 / Master)</text>

  <!-- MCU Pin Labels -->
  <text x="230" y="149" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">3.3V (VDD)</text>
  <text x="230" y="254" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">GPIO_BCLK</text>
  <text x="230" y="314" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">GPIO_WS</text>
  <text x="230" y="374" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">GPIO_SD</text>
  <text x="230" y="489" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- MCU Pin Terminals -->
  <circle cx="240" cy="145" r="4" fill="#1a1a1a"/>
  <circle cx="240" cy="250" r="4" fill="#2457d6"/>
  <circle cx="240" cy="310" r="4" fill="#2457d6"/>
  <circle cx="240" cy="370" r="4" fill="#2457d6"/>
  <circle cx="240" cy="485" r="4" fill="#1a1a1a"/>

  <!-- Right Block: MEMS Microphone -->
  <rect x="720" y="80" width="200" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="820" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MEMS-мікрофон</text>
  <text x="820" y="123" text-anchor="middle" font-size="12" fill="#6b7280">(INMP441 / Slave)</text>

  <!-- MEMS Pin Labels -->
  <text x="730" y="149" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">VDD</text>
  <text x="730" y="254" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">SCK / BCLK</text>
  <text x="730" y="314" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">WS / LRCK</text>
  <text x="730" y="374" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">SD / DOUT</text>
  <text x="730" y="429" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">L / R</text>
  <text x="730" y="489" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- MEMS Pin Terminals -->
  <circle cx="720" cy="145" r="4" fill="#1a1a1a"/>
  <circle cx="720" cy="250" r="4" fill="#2457d6"/>
  <circle cx="720" cy="310" r="4" fill="#2457d6"/>
  <circle cx="720" cy="370" r="4" fill="#2457d6"/>
  <circle cx="720" cy="425" r="4" fill="#27ae60"/>
  <circle cx="720" cy="485" r="4" fill="#1a1a1a"/>

  <!-- VDD Decoupling Filter Panel -->
  <rect x="255" y="80" width="450" height="135" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="270" y="100" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">Фільтр живлення VDD (RC / LC розв'язка)</text>
  <text x="270" y="116" text-anchor="start" font-size="12" fill="#6b7280">Придушення високочастотних пульсацій 3.3 В</text>

  <!-- VDD Filter Wire: MCU 3.3V to Resistor FB / R_f -->
  <line x1="240" y1="145" x2="295" y2="145" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor / Ferrite Bead Box -->
  <rect x="295" y="137" width="50" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="131" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">FB / R_f (10 Ω)</text>

  <!-- Wire from Resistor to MEMS VDD -->
  <line x1="345" y1="145" x2="720" y2="145" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Capacitor C1 (Bulk 10 µF) -->
  <circle cx="400" cy="145" r="3" fill="#1a1a1a"/>
  <line x1="400" y1="145" x2="400" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="385" y1="156" x2="415" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="385" y1="162" x2="415" y2="162" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="162" x2="400" y2="173" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">C1 (10 µF)</text>
  <text x="400" y="201" text-anchor="middle" font-size="12" fill="#6b7280">тантал / електроліт</text>

  <!-- Capacitor C2 (Ceramic 0.1 µF) -->
  <circle cx="600" cy="145" r="3" fill="#1a1a1a"/>
  <line x1="600" y1="145" x2="600" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="585" y1="156" x2="615" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="585" y1="162" x2="615" y2="162" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="162" x2="600" y2="173" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">C2 (0.1 µF)</text>
  <text x="600" y="201" text-anchor="middle" font-size="12" fill="#6b7280">кераміка low-ESR</text>

  <!-- Filter GND Rail & Symbol -->
  <line x1="400" y1="173" x2="600" y2="173" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="500" y1="173" x2="500" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="490" y1="178" x2="510" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="494" y1="181" x2="506" y2="181" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="497" y1="184" x2="503" y2="184" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Signal Lines -->
  <!-- 1. BCLK Line -->
  <line x1="240" y1="250" x2="720" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">BCLK / SCK (Тактовий сигнал бітів, Master → Slave)</text>

  <!-- 2. WS Line -->
  <line x1="240" y1="310" x2="720" y2="310" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">WS / LRCK (Вибір каналу L/R, f_s = 44.1/48 кГц)</text>

  <!-- 3. SD Line -->
  <line x1="720" y1="370" x2="240" y2="370" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SD / DOUT (Цифрові дані аудіо 24-біт, Slave → Master)</text>

  <!-- L/R Configuration Panel -->
  <rect x="255" y="390" width="420" height="78" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="270" y="408" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Комутація виводу L/R (вибір каналу):</text>
  <text x="270" y="424" text-anchor="start" font-size="12" fill="#1a1a1a">• L/R на GND  → Лівий канал / Slot 0 (підключено на схемі)</text>
  <text x="270" y="440" text-anchor="start" font-size="12" fill="#1a1a1a">• L/R на VDD  → Правий канал / Slot 1</text>
  <text x="270" y="456" text-anchor="start" font-size="12" fill="#6b7280">• Шина SD є спільною для двох мікрофонів (стереопара)</text>

  <!-- Main GND Rail -->
  <line x1="240" y1="485" x2="720" y2="485" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="320" y1="485" x2="320" y2="493" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="493" x2="330" y2="493" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="314" y1="496" x2="326" y2="496" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="317" y1="499" x2="323" y2="499" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Спільна земля (GND)</text>

  <!-- L/R Pin Connection to Main GND Wire -->
  <path d="M 720,425 L 695,425 L 695,485" fill="none" stroke="#27ae60" stroke-width="2"/>
  <circle cx="695" cy="485" r="3" fill="#27ae60"/>
</svg>
