<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Часова верифікація обслуговування DMA-буфера та насичена арифметика</text>
  <text x="480" y="52" font-size="13" fill="#64748b" text-anchor="middle">Запобігання переповненню черги DMA та захист від спотворень wrap-around при додаванні сигналів</text>

  <!-- LEFT PANEL: DMA Timing -->
  <g transform="translate(30, 75)">
    <rect width="435" height="375" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="435" height="40" rx="8" fill="#e2e8f0"/>
    <text x="217" y="25" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">1. Часовий баланс обробки DMA-буфера</text>

    <!-- Buffer Timeline -->
    <text x="20" y="65" font-size="12" font-weight="600" fill="#334155">Фонове заповнення DMA (I2S Hardware):</text>
    
    <!-- Buffer 0 -->
    <rect x="20" y="75" width="190" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="95" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Буфер А (T_buf = 32 мс)</text>

    <!-- Buffer 1 -->
    <rect x="215" y="75" width="190" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="310" y="95" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Буфер Б (T_buf = 32 мс)</text>

    <!-- Normal Case -->
    <text x="20" y="135" font-size="12" font-weight="600" fill="#15803d">Штатний режим (T_proc &lt; T_buf):</text>
    <rect x="20" y="145" width="120" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="80" y="162" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">Обробка (18 мс)</text>
    <rect x="145" y="145" width="65" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="177" y="162" font-size="10" fill="#64748b" text-anchor="middle">Очікування</text>
    <text x="220" y="162" font-size="11" font-weight="700" fill="#16a34a">✓ Стабільний потік</text>

    <!-- Overrun Case -->
    <text x="20" y="200" font-size="12" font-weight="600" fill="#b91c1c">Аварія затримки (T_proc &gt; T_buf):</text>
    <rect x="20" y="210" width="260" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="150" y="227" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Затримка запису SD (48 мс)</text>
    <text x="290" y="227" font-size="11" font-weight="700" fill="#dc2626">✗ Buffer Overrun!</text>

    <!-- Criteria Box -->
    <rect x="20" y="255" width="395" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="35" y="278" font-size="12" font-weight="700" fill="#0f172a">Критерій безперервності потоку:</text>
    <text x="35" y="300" font-size="11" fill="#334155">• Час обробки блоку: T_proc = T_calc + T_io &lt; T_buf</text>
    <text x="35" y="320" font-size="11" fill="#334155">• Запас надійності: Headroom = (T_buf - T_proc) ≥ 30%</text>
    <text x="35" y="340" font-size="11" fill="#334155">• При блокуванні SD &gt; T_buf: втрата семплів, клацання</text>
  </g>

  <!-- RIGHT PANEL: Saturating Arithmetic -->
  <g transform="translate(495, 75)">
    <rect width="435" height="375" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="435" height="40" rx="8" fill="#e2e8f0"/>
    <text x="217" y="25" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">2. Насичена арифметика vs Wrap-Around</text>

    <!-- Graph Axes -->
    <g transform="translate(30, 60)">
      <!-- Limits -->
      <line x1="0" y1="20" x2="375" y2="20" stroke="#ef4444" stroke-dasharray="4,4" stroke-width="1.5"/>
      <text x="380" y="24" font-size="10" font-weight="700" fill="#dc2626">+S_max</text>

      <line x1="0" y1="100" x2="375" y2="100" stroke="#94a3b8" stroke-width="1"/>
      <text x="380" y="104" font-size="10" fill="#64748b">0</text>

      <line x1="0" y1="180" x2="375" y2="180" stroke="#ef4444" stroke-dasharray="4,4" stroke-width="1.5"/>
      <text x="380" y="184" font-size="10" font-weight="700" fill="#dc2626">-S_max</text>

      <!-- Sine without clipping (dashed gray) -->
      <path d="M 0,100 Q 40,-15 80,100 T 160,100 T 240,100 T 320,100" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2,2"/>

      <!-- Wrap-around curve (Red) -->
      <path d="M 0,100 Q 25,25 35,20 L 35,180 Q 55,100 80,100" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <text x="45" y="15" font-size="10" font-weight="700" fill="#dc2626">Wrap-around (інверсія знака!)</text>

      <!-- Saturating curve (Green/Blue) -->
      <path d="M 160,100 Q 185,25 195,20 L 225,20 Q 235,25 240,100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <text x="180" y="15" font-size="10" font-weight="700" fill="#2563eb">Насичення (Clamping)</text>
    </g>

    <!-- Comparison Summary -->
    <rect x="20" y="270" width="395" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="35" y="292" font-size="11" font-weight="700" fill="#dc2626">Без насичення (Стандартне C ціле):</text>
    <text x="35" y="310" font-size="11" fill="#334155">32760 + 20 = -32756 (перехід через 0x7FFF у 0x8000, гучний тріск)</text>
    <text x="35" y="332" font-size="11" font-weight="700" fill="#2563eb">З насиченням (Saturating add):</text>
    <text x="35" y="350" font-size="11" fill="#334155">clamp(32760 + 20, -32768, 32767) = 32767 (м'яке обмеження амплітуди)</text>
  </g>
</svg>
