<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передача аудіоданих I2S у пам'ять ESP32 через DMA</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Периферія I2S записує семпли в кільцевий DMA-буфер у RAM без залучення процесора</text>

  <!-- PANEL 1: MEMS Microphone -->
  <rect x="25" y="85" width="180" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MEMS-мікрофон</text>
  <text x="115" y="130" font-size="12" fill="#6b7280" text-anchor="middle">(напр. INMP441)</text>

  <!-- Acoustic Sensor Element Box -->
  <rect x="40" y="150" width="150" height="125" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="115" cy="182" r="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="115" cy="182" r="6" fill="#2457d6"/>
  <text x="115" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Акустичний давач</text>
  <text x="115" y="236" font-size="12" fill="#6b7280" text-anchor="middle">Sigma-Delta ADC</text>
  <text x="115" y="254" font-size="12" fill="#6b7280" text-anchor="middle">24-bit PCM</text>

  <!-- MEMS Output Signals Section -->
  <text x="110" y="320" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тактування BCLK</text>
  <line x1="180" y1="335" x2="205" y2="335" stroke="#6b7280" stroke-width="1.5"/>

  <text x="110" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вибірка каналу WS</text>
  <line x1="180" y1="390" x2="205" y2="390" stroke="#6b7280" stroke-width="1.5"/>

  <text x="110" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані SD (PCM)</text>
  <line x1="180" y1="445" x2="205" y2="445" stroke="#2457d6" stroke-width="2"/>

  <!-- Interconnecting Lines MEMS -> ESP32 -->
  <line x1="205" y1="335" x2="265" y2="335" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="235" y="323" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">BCLK</text>

  <line x1="205" y1="390" x2="265" y2="390" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="235" y="378" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">WS</text>

  <line x1="205" y1="445" x2="265" y2="445" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="235" y="433" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SD</text>

  <!-- OUTER PANEL: ESP32 Microcontroller -->
  <rect x="265" y="85" width="670" height="440" rx="8" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="280" y="108" font-size="14" font-weight="bold" fill="#2457d6">Мікроконтролер ESP32</text>

  <!-- SUB-PANEL 1: I2S & DMA Peripheral -->
  <rect x="280" y="120" width="205" height="395" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="382" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2S &amp; DMA Периферія</text>

  <!-- I2S RX Controller Box -->
  <rect x="290" y="155" width="185" height="95" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="382" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2S RX Controller</text>
  <text x="382" y="193" font-size="12" fill="#1a1a1a" text-anchor="middle">Зсувний регістр (FIFO)</text>
  <text x="382" y="211" font-size="12" fill="#6b7280" text-anchor="middle">Прийом бітів з SD по BCLK</text>
  <text x="382" y="229" font-size="12" fill="#6b7280" text-anchor="middle">Пакування у 32-bit слова</text>

  <!-- Arrow I2S -> DMA -->
  <line x1="382" y1="250" x2="382" y2="285" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="394" y="271" font-size="12" font-weight="bold" fill="#2457d6">PCM слова</text>

  <!-- DMA Controller Box -->
  <rect x="290" y="285" width="185" height="90" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="382" y="305" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер DMA</text>
  <text x="382" y="323" font-size="12" fill="#6b7280" text-anchor="middle">Автоматичний перенос</text>
  <text x="382" y="341" font-size="12" fill="#6b7280" text-anchor="middle">Без запитів переривань CPU</text>
  <text x="382" y="359" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий доступ до RAM</text>

  <!-- DMA Descriptors Box -->
  <rect x="290" y="390" width="185" height="115" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="382" y="410" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DMA Дескриптори</text>

  <rect x="298" y="418" width="50" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="323" y="434" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Desc0</text>

  <line x1="348" y1="430" x2="356" y2="430" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <rect x="358" y="418" width="50" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="383" y="434" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Desc1</text>

  <line x1="408" y1="430" x2="416" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="418" y="418" width="50" height="24" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="443" y="434" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Desc2</text>

  <text x="382" y="464" font-size="12" fill="#6b7280" text-anchor="middle">Вказують адреси буферів</text>
  <text x="382" y="482" font-size="12" fill="#6b7280" text-anchor="middle">Кільцеве переключення</text>

  <!-- DMA Stream Path (DMA Controller -> RAM Buffer 0) -->
  <path d="M 475,330 L 495,330 L 495,176 L 580,176" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>
  <text x="503" y="250" font-size="12" font-weight="bold" fill="#2457d6">Запис DMA</text>

  <!-- SUB-PANEL 2: SRAM DMA Ring Buffers -->
  <rect x="568" y="120" width="352" height="200" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="744" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оперативна пам'ять (RAM) — Кільцевий DMA-буфер</text>

  <!-- Buffer 0 -->
  <rect x="580" y="155" width="328" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="583" y="158" width="207" height="36" rx="3" fill="#2457d6" opacity="0.18"/>
  <line x1="790" y1="158" x2="790" y2="194" stroke="#2457d6" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="592" y="180" font-size="12" font-weight="bold" fill="#2457d6">Буфер 0: Фоновий запис DMA...</text>
  <text x="896" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Заповнюється</text>

  <!-- Buffer 1 -->
  <rect x="580" y="205" width="328" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="592" y="230" font-size="12" font-weight="bold" fill="#27ae60">Буфер 1: Заповнений</text>
  <text x="896" y="230" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Готовий для CPU</text>

  <!-- Buffer 2 -->
  <rect x="580" y="255" width="328" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="592" y="280" font-size="12" font-weight="bold" fill="#6b7280">Буфер 2: Порожній</text>
  <text x="896" y="280" font-size="12" fill="#6b7280" text-anchor="end">Черга DMA</text>

  <!-- SUB-PANEL 3: CPU Core -->
  <rect x="568" y="350" width="352" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="744" y="369" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Ядро процесора (CPU Core)</text>

  <!-- Application Code Box -->
  <rect x="580" y="377" width="328" height="72" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="744" y="395" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Consolas, monospace">i2s_read(I2S_NUM_0, buf, len, &amp;read, wait);</text>
  <text x="744" y="413" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зчитує повністю готовий Буфер 1</text>
  <text x="744" y="431" font-size="12" fill="#6b7280" text-anchor="middle">Обробка: FFT / Запис на SD / Wi-Fi Stream</text>

  <!-- Performance Banner -->
  <rect x="580" y="457" width="328" height="48" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="744" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ CPU вільний під час запису DMA</text>
  <text x="744" y="492" font-size="12" fill="#1a1a1a" text-anchor="middle">Жодного блокування обчислювального ядра</text>

  <!-- Read Connection CPU -> Buffer 1 (RAM) -->
  <line x1="744" y1="350" x2="744" y2="247" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <text x="756" y="339" font-size="12" font-weight="bold" fill="#27ae60">Зчитування блоку</text>
</svg>
