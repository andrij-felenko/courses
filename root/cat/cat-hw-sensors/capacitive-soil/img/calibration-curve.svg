<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="900" height="420" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#333333"/>
  </marker>
</defs>
<text x="450" y="32" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Калібрувальна характеристика ємнісного давача v1.2</text>

<!-- Coordinate grid and axes -->
<rect x="100" y="70" width="700" height="260" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- Horizontal grid lines -->
<line x1="100" y1="135" x2="800" y2="135" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="100" y1="200" x2="800" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="100" y1="265" x2="800" y2="265" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Vertical grid lines -->
<line x1="275" y1="70" x2="275" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="450" y1="70" x2="450" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="625" y1="70" x2="625" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Left Y-axis labels (Voltage V) -->
<text x="85" y="75" font-size="13" fill="#64748b" text-anchor="end">3.0 В</text>
<text x="85" y="140" font-size="13" fill="#64748b" text-anchor="end">2.2 В</text>
<text x="85" y="205" font-size="13" fill="#64748b" text-anchor="end">1.5 В</text>
<text x="85" y="270" font-size="13" fill="#64748b" text-anchor="end">0.8 В</text>
<text x="85" y="335" font-size="13" fill="#64748b" text-anchor="end">0.0 В</text>
<text x="50" y="200" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle" transform="rotate(-90 50 200)">Напруга AOUT [В]</text>

<!-- Right Y-axis labels (ADC counts 10-bit) -->
<text x="815" y="75" font-size="13" fill="#64748b" text-anchor="start">930</text>
<text x="815" y="140" font-size="13" fill="#64748b" text-anchor="start">680</text>
<text x="815" y="205" font-size="13" fill="#64748b" text-anchor="start">465</text>
<text x="815" y="270" font-size="13" fill="#64748b" text-anchor="start">250</text>
<text x="815" y="335" font-size="13" fill="#64748b" text-anchor="start">0</text>
<text x="860" y="200" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle" transform="rotate(90 860 200)">Код 10-біт АЦП</text>

<!-- X-axis labels (Moisture %) -->
<text x="100" y="355" font-size="14" fill="#64748b" text-anchor="middle">0% (Сухо)</text>
<text x="275" y="355" font-size="14" fill="#64748b" text-anchor="middle">25%</text>
<text x="450" y="355" font-size="14" fill="#64748b" text-anchor="middle">50%</text>
<text x="625" y="355" font-size="14" fill="#64748b" text-anchor="middle">75%</text>
<text x="800" y="355" font-size="14" fill="#64748b" text-anchor="middle">100% (Вода)</text>
<text x="450" y="380" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Відносна вологість ґрунту [%]</text>

<!-- Characteristic curve (falling curve) -->
<path d="M 100 152 Q 350 215 800 248" fill="none" stroke="#2563eb" stroke-width="3.5"/>

<!-- Calibration points -->
<!-- AIR point at 0% -->
<circle cx="100" cy="152" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
<rect x="115" y="105" width="160" height="42" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="195" y="123" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle">Точка AIR (0%)</text>
<text x="195" y="139" font-size="12" fill="#7f1d1d" text-anchor="middle">raw ≈ 610 (≈ 2.0 В)</text>

<!-- WATER point at 100% -->
<circle cx="800" cy="248" r="7" fill="#059669" stroke="#065f46" stroke-width="2"/>
<rect x="625" y="260" width="165" height="42" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text x="707" y="278" font-size="13" fill="#065f46" font-weight="700" text-anchor="middle">Точка WATER (100%)</text>
<text x="707" y="294" font-size="12" fill="#064e3b" text-anchor="middle">raw ≈ 330 (≈ 1.05 В)</text>

<!-- Inversion Note Banner at bottom -->
<rect x="100" y="392" width="700" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="450" y="408" font-size="12" fill="#92400e" font-weight="700" text-anchor="middle">
  Увага: Збільшення вологості знижує напругу! Формула: map(raw, AIR, WATER, 0, 100)
</text>
</svg>