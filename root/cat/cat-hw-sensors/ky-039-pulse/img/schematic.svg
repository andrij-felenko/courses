<text x="470.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Темно → струму мало → S підтягується до +. Вихід S — плавний аналог, читаємо з АЦП.</text>
