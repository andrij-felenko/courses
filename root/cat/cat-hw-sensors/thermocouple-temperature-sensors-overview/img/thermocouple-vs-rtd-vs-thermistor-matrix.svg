<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Порівняльна матриця: Термопара vs RTD vs Термістор vs Кремнієвий IC</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Критерії вибору контактних датчиків температури для вбудованих та промислових систем</text>

  <!-- Таблиця / Матриця порівняння -->
  <g transform="translate(30, 90)">
    <!-- Шапка таблиці -->
    <rect x="0" y="0" width="900" height="40" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="120" y="25" fill="#f0f6fc" font-size="12" font-weight="700">Параметр</text>
    <text x="300" y="25" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">Термопара (TC)</text>
    <text x="480" y="25" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">RTD (Платина PT100)</text>
    <text x="660" y="25" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">Термістор (NTC)</text>
    <text x="820" y="25" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">Кремнієвий IC</text>

    <!-- Рядок 1: Температурний діапазон -->
    <rect x="0" y="44" width="900" height="38" fill="#161b22"/>
    <text x="20" y="68" fill="#c9d1d9" font-size="11" font-weight="600">Діапазон вимірювання</text>
    <text x="300" y="68" fill="#ff7b72" font-size="11" font-weight="700" text-anchor="middle">-270 °C ... +1800 °C</text>
    <text x="480" y="68" fill="#58a6ff" font-size="11" text-anchor="middle">-200 °C ... +600 °C</text>
    <text x="660" y="68" fill="#e3b341" font-size="11" text-anchor="middle">-50 °C ... +150 °C</text>
    <text x="820" y="68" fill="#8b949e" font-size="11" text-anchor="middle">-55 °C ... +125 °C</text>

    <!-- Рядок 2: Точність і стабільність -->
    <rect x="0" y="84" width="900" height="38" fill="#0d1117"/>
    <text x="20" y="108" fill="#c9d1d9" font-size="11" font-weight="600">Точність та повторюваність</text>
    <text x="300" y="108" fill="#8b949e" font-size="11" text-anchor="middle">Помірна (±1.0...2.5 °C)</text>
    <text x="480" y="108" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Найвища (±0.1...0.3 °C)</text>
    <text x="660" y="108" fill="#e3b341" font-size="11" text-anchor="middle">Висока в 0..70°C (±0.2°C)</text>
    <text x="820" y="108" fill="#8b949e" font-size="11" text-anchor="middle">Добра (±0.5 °C)</text>

    <!-- Рядок 3: Лінійність характеристики -->
    <rect x="0" y="124" width="900" height="38" fill="#161b22"/>
    <text x="20" y="148" fill="#c9d1d9" font-size="11" font-weight="600">Лінійність характеристики</text>
    <text x="300" y="148" fill="#8b949e" font-size="11" text-anchor="middle">Нелінійна (поліноми NIST)</text>
    <text x="480" y="148" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Майже лінійна (Каллендар)</text>
    <text x="660" y="148" fill="#ff7b72" font-size="11" text-anchor="middle">Експоненційна (Стейнхарт)</text>
    <text x="820" y="148" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Ідеально лінійна (IC)</text>

    <!-- Рядок 4: Чутливість сигналу -->
    <rect x="0" y="164" width="900" height="38" fill="#0d1117"/>
    <text x="20" y="188" fill="#c9d1d9" font-size="11" font-weight="600">Рівень вихідного сигналу</text>
    <text x="300" y="188" fill="#ff7b72" font-size="11" text-anchor="middle">Дуже малий (10..60 мкВ/°C)</text>
    <text x="480" y="188" fill="#58a6ff" font-size="11" text-anchor="middle">Помірний (~0.385 Ом/°C)</text>
    <text x="660" y="188" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Величезний (-4..-5 %/°C)</text>
    <text x="820" y="188" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Цифровий код / 10 мВ/°C</text>

    <!-- Рядок 5: Швидкодія (Теплова інерція) -->
    <rect x="0" y="204" width="900" height="38" fill="#161b22"/>
    <text x="20" y="228" fill="#c9d1d9" font-size="11" font-weight="600">Швидкодія (час відгуку)</text>
    <text x="300" y="228" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Миттєва (спай &lt; 0.1 с)</text>
    <text x="480" y="228" fill="#8b949e" font-size="11" text-anchor="middle">Середня (1..5 с)</text>
    <text x="660" y="228" fill="#58a6ff" font-size="11" text-anchor="middle">Швидка (крапля &lt; 1 с)</text>
    <text x="820" y="228" fill="#8b949e" font-size="11" text-anchor="middle">Повільна (корпус SOIC)</text>

    <!-- Рядок 6: Механічна стійкість -->
    <rect x="0" y="244" width="900" height="38" fill="#0d1117"/>
    <text x="20" y="268" fill="#c9d1d9" font-size="11" font-weight="600">Стійкість до ударів/вібрацій</text>
    <text x="300" y="268" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Екстремальна (моноліт)</text>
    <text x="480" y="268" fill="#8b949e" font-size="11" text-anchor="middle">Помірна (тендітна платина)</text>
    <text x="660" y="268" fill="#8b949e" font-size="11" text-anchor="middle">Середня (кераміка)</text>
    <text x="820" y="268" fill="#58a6ff" font-size="11" text-anchor="middle">Стандартна SMD</text>

    <!-- Рядок 7: Складність вимірювального кола -->
    <rect x="0" y="284" width="900" height="38" fill="#161b22"/>
    <text x="20" y="308" fill="#c9d1d9" font-size="11" font-weight="600">Вимоги до обв'язки / AFE</text>
    <text x="300" y="308" fill="#ff7b72" font-size="11" text-anchor="middle">CJC датчик + 24-біт АЦП</text>
    <text x="480" y="308" fill="#e3b341" font-size="11" text-anchor="middle">Джерело струму + 4-провід</text>
    <text x="660" y="308" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Простий дільник напруги</text>
    <text x="820" y="308" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">Готовий інтерфейс I2C/1-Wire</text>
  </g>

  <!-- Підсумковий висновок -->
  <g transform="translate(30, 435)">
    <rect width="900" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="25" fill="#58a6ff" font-size="12" font-weight="700">ОСНОВНЕ ПРАВИЛО ВИБОРУ ТЕХНОЛОГІЇ СЕНСОРА:</text>
    <text x="20" y="47" fill="#f0f6fc" font-size="11">
      • Термопара — безальтернативний лідер для екстремальних температур (>600 °C), відкритого полум'я та агресивних умов печей.
    </text>
    <text x="20" y="63" fill="#8b949e" font-size="11">
      • Для діапазону -50..+400 °C із вимогами метрологічної точності еталоном є RTD PT100; для побутового контролю — термістори NTC та цифрові IC.
    </text>
  </g>
</svg>
