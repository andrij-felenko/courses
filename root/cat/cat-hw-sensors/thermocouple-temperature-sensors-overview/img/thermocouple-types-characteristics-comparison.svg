<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Класифікація та характеристики стандартних типів термопар (IEC 60584)</text>
  <text x="480" y="65" fill="#8b949e" font-size="13" text-anchor="middle">Порівняння робочих діапазонів, чутливості (коефіцієнта Зеєбека) та галузей застосування</text>

  <!-- Сітка типів термопар (3 стовпчики по 2 картки) -->
  <g transform="translate(30, 85)">
    <!-- Тип K -->
    <rect x="10" y="0" width="280" height="195" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="10" y="0" width="280" height="32" rx="8" fill="#1f2937"/>
    <circle cx="28" cy="16" r="7" fill="#388bfd"/>
    <text x="42" y="21" fill="#f0f6fc" font-size="14" font-weight="700">Тип K (Хромель – Алюмель)</text>
    
    <text x="25" y="55" fill="#79c0ff" font-size="12" font-weight="600">Діапазон:</text>
    <text x="100" y="55" fill="#f0f6fc" font-size="12">-200 °C ... +1260 °C</text>
    <text x="25" y="75" fill="#79c0ff" font-size="12" font-weight="600">Чутливість:</text>
    <text x="100" y="75" fill="#3fb950" font-size="12" font-weight="700">~41 мкВ/°C (при 0 °C)</text>
    <text x="25" y="95" fill="#79c0ff" font-size="12" font-weight="600">Сплави:</text>
    <text x="100" y="95" fill="#8b949e" font-size="11">Ni-Cr (+) / Ni-Al (-)</text>
    <text x="25" y="115" fill="#79c0ff" font-size="12" font-weight="600">Код IEC:</text>
    <text x="100" y="115" fill="#e3b341" font-size="11">Зелений чохол (+ зел, - біл)</text>
    <text x="25" y="145" fill="#8b949e" font-size="11">Універсальний промисловий стандарт.</text>
    <text x="25" y="162" fill="#8b949e" font-size="11">Окисні та нейтральні середовища.</text>
    <text x="25" y="179" fill="#ff7b72" font-size="10">Уникати відновних сірчистих газів.</text>

    <!-- Тип J -->
    <rect x="310" y="0" width="280" height="195" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="310" y="0" width="280" height="32" rx="8" fill="#1f2937"/>
    <circle cx="328" cy="16" r="7" fill="#d29922"/>
    <text x="342" y="21" fill="#f0f6fc" font-size="14" font-weight="700">Тип J (Залізо – Константан)</text>
    
    <text x="325" y="55" fill="#e3b341" font-size="12" font-weight="600">Діапазон:</text>
    <text x="400" y="55" fill="#f0f6fc" font-size="12">-40 °C ... +750 °C</text>
    <text x="325" y="75" fill="#e3b341" font-size="12" font-weight="600">Чутливість:</text>
    <text x="400" y="75" fill="#3fb950" font-size="12" font-weight="700">~52 мкВ/°C (висока)</text>
    <text x="325" y="95" fill="#e3b341" font-size="12" font-weight="600">Сплави:</text>
    <text x="400" y="95" fill="#8b949e" font-size="11">Fe (+) / Cu-Ni (-)</text>
    <text x="325" y="115" fill="#e3b341" font-size="12" font-weight="600">Код IEC:</text>
    <text x="400" y="115" fill="#8b949e" font-size="11">Чорний чохол (+ чор, - біл)</text>
    <text x="325" y="145" fill="#8b949e" font-size="11">Низька вартість, лиття пластмас,</text>
    <text x="325" y="162" fill="#8b949e" font-size="11">вакуумні печі, відновне середовище.</text>
    <text x="325" y="179" fill="#ff7b72" font-size="10">Залізо швидко іржавіє у волозі.</text>

    <!-- Тип T -->
    <rect x="610" y="0" width="280" height="195" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <rect x="610" y="0" width="280" height="32" rx="8" fill="#1f2937"/>
    <circle cx="628" cy="16" r="7" fill="#2ea043"/>
    <text x="642" y="21" fill="#f0f6fc" font-size="14" font-weight="700">Тип T (Мідь – Константан)</text>
    
    <text x="625" y="55" fill="#56d364" font-size="12" font-weight="600">Діапазон:</text>
    <text x="700" y="55" fill="#f0f6fc" font-size="12">-200 °C ... +350 °C</text>
    <text x="625" y="75" fill="#56d364" font-size="12" font-weight="600">Чутливість:</text>
    <text x="700" y="75" fill="#3fb950" font-size="12" font-weight="700">~43 мкВ/°C</text>
    <text x="625" y="95" fill="#56d364" font-size="12" font-weight="600">Сплави:</text>
    <text x="700" y="95" fill="#8b949e" font-size="11">Cu (+) / Cu-Ni (-)</text>
    <text x="625" y="115" fill="#56d364" font-size="12" font-weight="600">Код IEC:</text>
    <text x="700" y="115" fill="#79c0ff" font-size="11">Коричневий чохол</text>
    <text x="625" y="145" fill="#8b949e" font-size="11">Кріогенні виміри, харчова промисловість,</text>
    <text x="625" y="162" fill="#8b949e" font-size="11">висока повторюваність, вологостійкість.</text>
    <text x="625" y="179" fill="#3fb950" font-size="10">Не утворює паразитної ЕРС з міддю Cu.</text>

    <!-- Тип E -->
    <rect x="10" y="215" width="280" height="195" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="10" y="215" width="280" height="32" rx="8" fill="#1f2937"/>
    <circle cx="28" cy="231" r="7" fill="#a371f7"/>
    <text x="42" y="236" fill="#f0f6fc" font-size="14" font-weight="700">Тип E (Хромель – Константан)</text>
    
    <text x="25" y="270" fill="#d2a8ff" font-size="12" font-weight="600">Діапазон:</text>
    <text x="100" y="270" fill="#f0f6fc" font-size="12">-200 °C ... +900 °C</text>
    <text x="25" y="290" fill="#d2a8ff" font-size="12" font-weight="600">Чутливість:</text>
    <text x="100" y="290" fill="#3fb950" font-size="12" font-weight="700">~68 мкВ/°C (рекордна!)</text>
    <text x="25" y="310" fill="#d2a8ff" font-size="12" font-weight="600">Сплави:</text>
    <text x="100" y="310" fill="#8b949e" font-size="11">Ni-Cr (+) / Cu-Ni (-)</text>
    <text x="25" y="330" fill="#d2a8ff" font-size="12" font-weight="600">Код IEC:</text>
    <text x="100" y="330" fill="#a371f7" font-size="11">Фіолетовий чохол</text>
    <text x="25" y="360" fill="#8b949e" font-size="11">Найвищий вихідний сигнал серед базових.</text>
    <text x="25" y="377" fill="#8b949e" font-size="11">Ідеальний для виміру малих дельт ΔT.</text>
    <text x="25" y="394" fill="#3fb950" font-size="10">Немагнітні провідники (без шуму).</text>

    <!-- Тип N -->
    <rect x="310" y="215" width="280" height="195" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <rect x="310" y="215" width="280" height="32" rx="8" fill="#1f2937"/>
    <circle cx="328" cy="231" r="7" fill="#f0883e"/>
    <text x="342" y="236" fill="#f0f6fc" font-size="14" font-weight="700">Тип N (Нікросил – Нісил)</text>
    
    <text x="325" y="270" fill="#ffa657" font-size="12" font-weight="600">Діапазон:</text>
    <text x="400" y="270" fill="#f0f6fc" font-size="12">-200 °C ... +1300 °C</text>
    <text x="325" y="290" fill="#ffa657" font-size="12" font-weight="600">Чутливість:</text>
    <text x="400" y="290" fill="#3fb950" font-size="12" font-weight="700">~39 мкВ/°C</text>
    <text x="325" y="310" fill="#ffa657" font-size="12" font-weight="600">Сплави:</text>
    <text x="400" y="310" fill="#8b949e" font-size="11">Ni-Cr-Si (+) / Ni-Si (-)</text>
    <text x="325" y="330" fill="#ffa657" font-size="12" font-weight="600">Код IEC:</text>
    <text x="400" y="330" fill="#ffa657" font-size="11">Рожевий чохол</text>
    <text x="325" y="360" fill="#8b949e" font-size="11">Стійкий до високотемпературного</text>
    <text x="325" y="377" fill="#8b949e" font-size="11">зеленого гниття (green rot) типу K.</text>
    <text x="325" y="394" fill="#3fb950" font-size="10">Найвища стабільність при 1000..1200 °C.</text>

    <!-- Тип S / R / B (Шляхетні метали) -->
    <rect x="610" y="215" width="280" height="195" rx="8" fill="#161b22" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="610" y="215" width="280" height="32" rx="8" fill="#1f2937"/>
    <circle cx="628" cy="231" r="7" fill="#ec4899"/>
    <text x="642" y="236" fill="#f0f6fc" font-size="14" font-weight="700">Типи S, R, B (Платина – Родій)</text>
    
    <text x="625" y="270" fill="#f472b6" font-size="12" font-weight="600">Діапазон:</text>
    <text x="700" y="270" fill="#f0f6fc" font-size="12">0 °C ... +1600...+1800 °C</text>
    <text x="625" y="290" fill="#f472b6" font-size="12" font-weight="600">Чутливість:</text>
    <text x="700" y="290" fill="#f85149" font-size="12" font-weight="700">~10...12 мкВ/°C (низька)</text>
    <text x="625" y="310" fill="#f472b6" font-size="12" font-weight="600">Сплави:</text>
    <text x="700" y="310" fill="#8b949e" font-size="11">Pt-Rh (+) / Pt (-)</text>
    <text x="625" y="330" fill="#f472b6" font-size="12" font-weight="600">Код IEC:</text>
    <text x="700" y="330" fill="#f0f6fc" font-size="11">Помаранчевий чохол</text>
    <text x="625" y="360" fill="#8b949e" font-size="11">Металургія, скловаріння, еталонні</text>
    <text x="625" y="377" fill="#8b949e" font-size="11">лабораторії. Хімічно інертні.</text>
    <text x="625" y="394" fill="#ff7b72" font-size="10">Дуже висока ціна, вимагають кераміки.</text>
  </g>
</svg>
