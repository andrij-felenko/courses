<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Архітектура аналогового тракту зчитування термопари (AFE)</text>
  <text x="480" y="66" fill="#8b949e" font-size="13" text-anchor="middle">Ланцюг фільтрації, захисту від завад, детекції обриву та оцифрування (на базі MAX31856 / ADS1118)</text>

  <!-- Схема ланцюга AFE -->
  <g transform="translate(30, 90)">
    <!-- Блок 1: Вхідний захист (ESD / TVS / EMI) -->
    <rect x="10" y="30" width="165" height="260" rx="8" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/>
    <rect x="10" y="30" width="165" height="28" rx="8" fill="#21262d"/>
    <text x="92" y="49" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">1. Захист клем</text>
    
    <!-- Вхідні клеми -->
    <circle cx="25" cy="90" r="6" fill="#e3b341"/>
    <text x="38" y="94" fill="#f0f6fc" font-size="11">T+ (мкВ)</text>
    
    <circle cx="25" cy="210" r="6" fill="#f85149"/>
    <text x="38" y="214" fill="#f0f6fc" font-size="11">T- (мкВ)</text>

    <!-- TVS діоди / Clamps -->
    <line x1="85" y1="90" x2="85" y2="210" stroke="#ff7b72" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="70" y="135" width="30" height="30" rx="4" fill="#2d1619" stroke="#ff7b72" stroke-width="1.2"/>
    <text x="85" y="154" fill="#ff7b72" font-size="9" font-weight="700" text-anchor="middle">TVS</text>

    <text x="92" y="250" fill="#8b949e" font-size="10" text-anchor="middle">Захист від ESD</text>
    <text x="92" y="266" fill="#8b949e" font-size="10" text-anchor="middle">та наведеної напруги</text>

    <!-- Стрілки зв'язку 1 -> 2 -->
    <line x1="175" y1="90" x2="200" y2="90" stroke="#58a6ff" stroke-width="2"/>
    <line x1="175" y1="210" x2="200" y2="210" stroke="#58a6ff" stroke-width="2"/>

    <!-- Блок 2: Диференційний RC-фільтр низьких частот -->
    <rect x="200" y="30" width="175" height="260" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="200" y="30" width="175" height="28" rx="8" fill="#21262d"/>
    <text x="287" y="49" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">2. Фільтр НЧ та Open-Wire</text>

    <!-- Резистори R_filt -->
    <rect x="215" y="83" width="35" height="14" fill="#21262d" stroke="#e3b341" stroke-width="1.2"/>
    <text x="232" y="94" fill="#f0f6fc" font-size="9" text-anchor="middle">1 кОм</text>

    <rect x="215" y="203" width="35" height="14" fill="#21262d" stroke="#e3b341" stroke-width="1.2"/>
    <text x="232" y="214" fill="#f0f6fc" font-size="9" text-anchor="middle">1 кОм</text>

    <!-- Конденсатор C_diff та C_comm -->
    <line x1="285" y1="90" x2="285" y2="210" stroke="#3fb950" stroke-width="2"/>
    <rect x="273" y="140" width="24" height="20" fill="#1c2d1f" stroke="#3fb950" stroke-width="1.2"/>
    <text x="285" y="154" fill="#3fb950" font-size="8" font-weight="700" text-anchor="middle">C_dif</text>

    <text x="287" y="250" fill="#8b949e" font-size="10" text-anchor="middle">Придушення 50/60 Гц</text>
    <text x="287" y="266" fill="#8b949e" font-size="10" text-anchor="middle">Струми перевірки обриву</text>

    <!-- Стрілки зв'язку 2 -> 3 -->
    <line x1="375" y1="90" x2="400" y2="90" stroke="#58a6ff" stroke-width="2"/>
    <line x1="375" y1="210" x2="400" y2="210" stroke="#58a6ff" stroke-width="2"/>

    <!-- Блок 3: PGA + Delta-Sigma 24-біт АЦП -->
    <rect x="400" y="30" width="240" height="260" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="400" y="30" width="240" height="28" rx="8" fill="#21262d"/>
    <text x="520" y="49" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">3. Інструментальний PGA + АЦП</text>

    <!-- Підсилювач PGA -->
    <polygon points="420,70 420,230 490,150" fill="#1f2937" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="445" y="155" fill="#58a6ff" font-size="11" font-weight="700">PGA</text>
    <text x="445" y="170" fill="#8b949e" font-size="9">32x..128x</text>

    <!-- Модулятор Delta-Sigma -->
    <rect x="510" y="115" width="115" height="70" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="567" y="140" fill="#f0f6fc" font-size="11" font-weight="700" text-anchor="middle">ΔΣ АЦП (24 біт)</text>
    <text x="567" y="158" fill="#3fb950" font-size="10" text-anchor="middle">Внутрішній V_ref</text>
    <text x="567" y="173" fill="#8b949e" font-size="9" text-anchor="middle">Режекція 50/60 Гц</text>

    <line x1="490" y1="150" x2="510" y2="150" stroke="#58a6ff" stroke-width="2"/>

    <text x="520" y="245" fill="#8b949e" font-size="10" text-anchor="middle">Дрейф зсуву: менше 0.1 мкВ/°C</text>
    <text x="520" y="262" fill="#8b949e" font-size="10" text-anchor="middle">Роздільна здатність: до 0.0078 °C</text>

    <!-- Стрілки зв'язку 3 -> 4 -->
    <line x1="640" y1="150" x2="665" y2="150" stroke="#58a6ff" stroke-width="2"/>

    <!-- Блок 4: CJC сенсор + DSP лінеаризація + Інтерфейс -->
    <rect x="665" y="30" width="225" height="260" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="665" y="30" width="225" height="28" rx="8" fill="#21262d"/>
    <text x="777" y="49" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">4. Обробка, CJC та SPI</text>

    <!-- Внутрішній термометр CJC -->
    <rect x="680" y="70" width="195" height="42" rx="4" fill="#21262d" stroke="#3fb950" stroke-width="1.2"/>
    <circle cx="695" cy="91" r="5" fill="#3fb950"/>
    <text x="710" y="87" fill="#3fb950" font-size="10" font-weight="700">Сенсор T_cold (CJC)</text>
    <text x="710" y="102" fill="#8b949e" font-size="9">Точність: ±0.15 °C на кристалі</text>

    <!-- DSP ядро / LUT поліноми -->
    <rect x="680" y="125" width="195" height="55" rx="4" fill="#21262d" stroke="#d2a8ff" stroke-width="1.2"/>
    <text x="695" y="145" fill="#f0f6fc" font-size="10" font-weight="700">Апаратний DSP лінеаризатор</text>
    <text x="695" y="160" fill="#8b949e" font-size="9">Таблиці NIST для K, J, N, R, S, T, E</text>
    <text x="695" y="172" fill="#e3b341" font-size="9">Детекція Open/Short FAULT</text>

    <!-- Цифровий інтерфейс -->
    <rect x="680" y="195" width="195" height="75" rx="4" fill="#1f2937" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="777" y="215" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle">Шина SPI / I2C</text>
    <text x="777" y="235" fill="#f0f6fc" font-size="10" text-anchor="middle">SCLK, MOSI, MISO, CS, FAULT</text>
    <text x="777" y="253" fill="#3fb950" font-size="10" text-anchor="middle">Готове значення температури в °C</text>
  </g>

  <!-- Блок рекомендацій трасування друкованої плати (PCB Layout) -->
  <g transform="translate(30, 400)">
    <rect width="895" height="105" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="25" fill="#58a6ff" font-size="12" font-weight="700">ПРАВИЛА ТРАСУВАННЯ ПЛАТИ ДЛЯ ТЕРМОПАРНИХ AFE:</text>
    <text x="25" y="47" fill="#f0f6fc" font-size="11">
      • Ізотермічний полігон: розміщуйте сенсор CJC безпосередньо між контактами клемника без теплових бар'єрів.
    </text>
    <text x="25" y="67" fill="#f0f6fc" font-size="11">
      • Диференціальні пари: доріжки T+ і T- проводяться паралельно, однакової довжини, симетрично до фільтрів і мікросхеми.
    </text>
    <text x="25" y="87" fill="#8b949e" font-size="11">
      • Заземлення: захисний екран кабелю термопари заземлюється строго в одній точці, уникаючи паразитної земляної петлі.
    </text>
  </g>
</svg>
