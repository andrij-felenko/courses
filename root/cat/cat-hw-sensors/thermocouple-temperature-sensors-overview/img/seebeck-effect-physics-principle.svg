<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <!-- Фон -->
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Заголовок -->
  <text x="480" y="45" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Фізичний принцип термоелектричного ефекту Зеєбека</text>
  <text x="480" y="70" fill="#8b949e" font-size="13" text-anchor="middle">Виникнення термо-ЕРС внаслідок дифузії вільних електронів уздовж градієнта температури двох різнорідних металів</text>

  <!-- Схема термопари -->
  <g transform="translate(60, 95)">
    <!-- Робочий спай (Hot Junction) -->
    <circle cx="120" cy="180" r="14" fill="#f85149" stroke="#ff7b72" stroke-width="2"/>
    <text x="120" y="215" fill="#f85149" font-size="13" font-weight="700" text-anchor="middle">Гарячий спай (T_hot)</text>
    <text x="120" y="235" fill="#8b949e" font-size="11" text-anchor="middle">Робоча зона вимірювання</text>

    <!-- Символічний вогонь/нагрів -->
    <path d="M 120 160 Q 110 140 120 125 Q 130 140 120 160 Z" fill="#d29922" fill-opacity="0.8"/>
    <text x="120" y="115" fill="#d29922" font-size="12" font-weight="600" text-anchor="middle">Джерело тепла</text>

    <!-- Провідник А (Верхній) -->
    <path d="M 120 180 C 240 80, 500 80, 640 120" fill="none" stroke="#58a6ff" stroke-width="5"/>
    <text x="380" y="75" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">Провідник А (Метал A, коефіцієнт Зеєбека S_A)</text>
    <text x="380" y="95" fill="#8b949e" font-size="11" text-anchor="middle">Дифузія гарячих електронів до холодного кінця</text>

    <!-- Стрілки дифузії електронів зверху -->
    <path d="M 280 115 L 340 102" stroke="#ffffff" stroke-width="2" marker-end="url(#arr-white)"/>
    <path d="M 440 92 L 500 98" stroke="#ffffff" stroke-width="2" marker-end="url(#arr-white)"/>

    <!-- Провідник B (Нижній) -->
    <path d="M 120 180 C 240 280, 500 280, 640 240" fill="none" stroke="#3fb950" stroke-width="5"/>
    <text x="380" y="285" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">Провідник B (Метал B, коефіцієнт Зеєбека S_B)</text>
    <text x="380" y="305" fill="#8b949e" font-size="11" text-anchor="middle">Відмінна густина та рухливість вільних носіїв</text>

    <!-- Холодний спай (Cold Junction / Reference) -->
    <rect x="630" y="90" width="180" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="720" y="115" fill="#79c0ff" font-size="12" font-weight="600" text-anchor="middle">Холодні кінці (T_cold)</text>
    <text x="720" y="132" fill="#8b949e" font-size="10" text-anchor="middle">Опорна ізотермічна зона</text>

    <!-- Клеми -->
    <circle cx="640" cy="150" r="6" fill="#58a6ff"/>
    <text x="655" y="154" fill="#c9d1d9" font-size="11">+</text>

    <circle cx="640" cy="210" r="6" fill="#3fb950"/>
    <text x="655" y="214" fill="#c9d1d9" font-size="11">-</text>

    <!-- Вольтметр -->
    <circle cx="740" cy="180" r="26" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="740" y="186" fill="#f0f6fc" font-size="14" font-weight="700" text-anchor="middle">мкВ</text>
    
    <path d="M 640 150 L 714 180" stroke="#58a6ff" stroke-width="2"/>
    <path d="M 640 210 L 714 180" stroke="#3fb950" stroke-width="2"/>
  </g>

  <!-- Математичний блок та формули -->
  <g transform="translate(60, 420)">
    <rect width="840" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="25" y="28" fill="#58a6ff" font-size="13" font-weight="700">МАТЕМАТИЧНЕ РІВНЯННЯ ТЕРМО-ЕРС ЗЕЄБЕКА:</text>
    <text x="25" y="52" fill="#f0f6fc" font-size="13" font-family="Consolas, monospace">
      V_EMF = ∫[T_cold..T_hot] (S_A(T) - S_B(T)) dT ≈ S_AB × (T_hot - T_cold)
    </text>
    <text x="25" y="72" fill="#8b949e" font-size="11">
      де S_AB = (S_A - S_B) — диференційний коефіцієнт Зеєбека пари металів (типово 10…60 мкВ/°C). Термопара вимірює РІЗНИЦЮ температур.
    </text>
  </g>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-white" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
