<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів DVP-інтерфейсу сенсора OV3640</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Стробування PCLK та маркери VSYNC/HREF регламентують зчитування YUV422 й потоку JPEG</text>

  <!-- PANEL 1: YUV422 Mode -->
  <rect x="20" y="70" width="920" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="35" y="86" font-size="13" font-weight="bold" fill="#2457d6">1. Нестиснений режим YUV422 (Стробування кожного пікселя на PCLK)</text>

  <!-- Signal Labels -->
  <text x="135" y="125" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="135" y="165" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="135" y="205" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="135" y="252" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">D[9:0]</text>

  <!-- VSYNC Waveform -->
  <path d="M150,112 L210,112 L210,132 L910,132" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="180" y="104" text-anchor="middle" font-size="12" fill="#6b7280">VBLANK (Гасіння)</text>
  <text x="560" y="124" text-anchor="middle" font-size="12" fill="#2457d6">Активний кадр (Active Frame)</text>

  <!-- HREF Waveform -->
  <path d="M150,172 L230,172 L230,152 L570,152 L570,172 L630,172 L630,152 L900,152" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="186" text-anchor="middle" font-size="12" fill="#6b7280">HBLANK</text>
  <text x="400" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Рядок N (t_LINE)</text>
  <text x="600" y="186" text-anchor="middle" font-size="12" fill="#6b7280">HBLANK</text>
  <text x="765" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Рядок N+1</text>

  <!-- PCLK Waveform -->
  <path d="M150,212 L165,212 L165,197 L202.5,197 L202.5,212 L240,212 L240,197 L277.5,197 L277.5,212 L315,212 L315,197 L352.5,197 L352.5,212 L390,212 L390,197 L427.5,197 L427.5,212 L465,212 L465,197 L502.5,197 L502.5,212 L540,212 L540,197 L577.5,197 L577.5,212 L615,212 L615,197 L652.5,197 L652.5,212 L690,212 L690,197 L727.5,197 L727.5,212 L765,212 L765,197 L802.5,197 L802.5,212 L840,212 L840,197 L877.5,197 L877.5,212 L900,212" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- PCLK Strobing Dashed Lines -->
  <line x1="240" y1="205" x2="240" y2="242" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="315" y1="205" x2="315" y2="242" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="390" y1="205" x2="390" y2="242" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="465" y1="205" x2="465" y2="242" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="540" y1="205" x2="540" y2="242" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>

  <!-- D[9:0] Bus Waveform - Line 1 -->
  <line x1="150" y1="252" x2="240" y2="252" stroke="#d0d7de" stroke-width="2"/>
  <polygon points="240,252 246,242 309,242 315,252 309,262 246,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="277.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Y0</text>

  <polygon points="315,252 321,242 384,242 390,252 384,262 321,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">U0</text>

  <polygon points="390,252 396,242 459,242 465,252 459,262 396,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="427.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Y1</text>

  <polygon points="465,252 471,242 534,242 540,252 534,262 471,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="502.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V0</text>

  <polygon points="540,252 546,242 564,242 570,252 564,262 546,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="555" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Y2...</text>

  <line x1="570" y1="252" x2="630" y2="252" stroke="#d0d7de" stroke-width="2"/>

  <!-- D[9:0] Bus Waveform - Line 2 -->
  <polygon points="630,252 636,242 699,242 705,252 699,262 636,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="667.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Y0</text>

  <polygon points="705,252 711,242 774,242 780,252 774,262 711,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="742.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">U0</text>

  <polygon points="780,252 786,242 849,242 855,252 849,262 786,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="817.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Y1</text>

  <polygon points="855,252 861,242 894,242 900,252 894,262 861,262" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="877.5" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V0...</text>

  <!-- Dimension Bracket & Subtext -->
  <path d="M240,266 L240,270 L390,270 L390,266" fill="none" stroke="#2457d6" stroke-width="1"/>
  <text x="315" y="280" text-anchor="middle" font-size="12" fill="#2457d6">Піксель 0 (Y0 + U0)</text>


  <!-- PANEL 2: JPEG Mode -->
  <rect x="20" y="305" width="920" height="220" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="35" y="321" font-size="13" font-weight="bold" fill="#27ae60">2. Режим стисненого потоку JPEG (Детекція маркерів SOI / EOI та байтів потоку)</text>

  <!-- Signal Labels -->
  <text x="135" y="360" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="135" y="400" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="135" y="440" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="135" y="487" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">D[9:0]</text>

  <!-- VSYNC Waveform -->
  <path d="M150,347 L210,347 L210,367 L910,367" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="180" y="339" text-anchor="middle" font-size="12" fill="#6b7280">VBLANK (Гасіння)</text>
  <text x="560" y="359" text-anchor="middle" font-size="12" fill="#27ae60">Кадр JPEG (Compressed Frame)</text>

  <!-- HREF Waveform -->
  <path d="M150,407 L230,407 L230,387 L550,387 L550,407 L610,407 L610,387 L870,387 L870,407 L910,407" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="421" text-anchor="middle" font-size="12" fill="#6b7280">HBLANK</text>
  <text x="390" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пакет 1 (JPEG Data)</text>
  <text x="580" y="421" text-anchor="middle" font-size="12" fill="#6b7280">HBLANK</text>
  <text x="740" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пакет 2 (JPEG Data)</text>

  <!-- PCLK Waveform -->
  <path d="M150,447 L165,447 L165,432 L202.5,432 L202.5,447 L240,447 L240,432 L277.5,432 L277.5,447 L315,447 L315,432 L352.5,432 L352.5,447 L390,447 L390,432 L427.5,432 L427.5,447 L465,447 L465,432 L502.5,432 L502.5,447 L540,447 L540,432 L577.5,432 L577.5,447 L615,447 L615,432 L652.5,432 L652.5,447 L690,447 L690,432 L727.5,432 L727.5,447 L765,447 L765,432 L802.5,432 L802.5,447 L840,447 L840,432 L877.5,432 L877.5,447 L900,447" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- PCLK Strobing Dashed Lines -->
  <line x1="230" y1="440" x2="230" y2="477" stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="325" y1="440" x2="325" y2="477" stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="740" y1="440" x2="740" y2="477" stroke="#c0392b" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>
  <line x1="835" y1="440" x2="835" y2="477" stroke="#c0392b" stroke-dasharray="2,2" stroke-width="1" opacity="0.6"/>

  <!-- D[9:0] Bus Waveform - Packet 1 -->
  <line x1="150" y1="487" x2="230" y2="487" stroke="#d0d7de" stroke-width="2"/>

  <!-- SOI Cell -->
  <polygon points="230,487 236,477 319,477 325,487 319,497 236,497" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="277.5" y="491" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">0xFFD8 (SOI)</text>
  <line x1="277.5" y1="507" x2="277.5" y2="500" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="277.5" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Маркер початку кадру</text>

  <!-- Header Cell -->
  <polygon points="325,487 331,477 434,477 440,487 434,497 331,497" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="382.5" y="491" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">JPEG Header</text>

  <!-- Payload 1 Cell -->
  <polygon points="440,487 446,477 544,477 550,487 544,497 446,497" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="495" y="491" text-anchor="middle" font-size="12" fill="#1a1a1a">Payload Data...</text>

  <line x1="550" y1="487" x2="610" y2="487" stroke="#d0d7de" stroke-width="2"/>

  <!-- D[9:0] Bus Waveform - Packet 2 -->
  <!-- Payload N Cell -->
  <polygon points="610,487 616,477 734,477 740,487 734,497 616,497" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="675" y="491" text-anchor="middle" font-size="12" fill="#1a1a1a">Payload Data...</text>

  <!-- EOI Cell -->
  <polygon points="740,487 746,477 829,477 835,487 829,497 746,497" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="787.5" y="491" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">0xFFD9 (EOI)</text>
  <line x1="787.5" y1="507" x2="787.5" y2="500" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="787.5" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Маркер кінця кадру</text>

  <!-- Pad Cell -->
  <polygon points="835,487 841,477 864,477 870,487 864,497 841,497" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="852.5" y="491" text-anchor="middle" font-size="12" fill="#6b7280">Pad</text>

</svg>
