<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 7,1 L 0,4 L 7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1 L 7,4 L 0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray-left" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 6,1 L 0,3.5 L 6,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-gray-right" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1 L 6,3.5 L 0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1,0 L 4,7 L 7,0 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма паралельного інтерфейсу DVP (OV3640)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Співвідношення сигналів VSYNC, HREF, PCLK та фіксація байтів D[7:0]</text>

  <!-- Panel 1: Frame and Line Synchronization -->
  <rect x="30" y="70" width="900" height="175" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">1. Синхронізація кадрів і рядків (VSYNC/HREF)</text>

  <!-- Panel 1 Signal Labels -->
  <text x="115" y="132" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="115" y="182" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="115" y="233" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>

  <!-- t_FRAME Dimension Line & Label -->
  <line x1="160" y1="105" x2="810" y2="105" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <text x="550" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_FRAME (Тривалість кадру)</text>

  <!-- VSYNC Waveform -->
  <path d="M 135,140 L 160,140 L 160,118 L 810,118 L 810,140 L 895,140" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="160" y="153" text-anchor="middle" font-size="11" fill="#6b7280">Фронт VSYNC</text>
  <text x="810" y="153" text-anchor="middle" font-size="11" fill="#6b7280">Спад VSYNC</text>

  <!-- HREF Waveform -->
  <path d="M 135,192 L 190,192 L 190,168 L 330,168 L 330,192 L 370,192 L 370,168 L 510,168 L 510,192 L 550,192 L 550,168 L 690,168 L 690,192 L 895,192" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- HREF Row Labels -->
  <text x="260" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Рядок 1</text>
  <text x="440" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Рядок 2</text>
  <text x="620" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Рядок N</text>

  <!-- Row and Blanking Dimension Lines -->
  <line x1="190" y1="204" x2="330" y2="204" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray-left)" marker-end="url(#arr-gray-right)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#6b7280">t_LINE</text>

  <line x1="330" y1="204" x2="370" y2="204" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray-left)" marker-end="url(#arr-gray-right)"/>
  <text x="350" y="216" text-anchor="middle" font-size="11" fill="#6b7280">t_HBLANK</text>

  <!-- PCLK Overview Bursts -->
  <path d="M 135,238 L 190,238 M 190,238 L 190,228 L 200,228 L 200,238 L 210,238 L 210,228 L 220,228 L 220,238 L 230,238 L 230,228 L 240,228 L 240,238 L 250,238 L 250,228 L 260,228 L 260,238 L 270,238 L 270,228 L 280,228 L 280,238 L 290,238 L 290,228 L 300,228 L 300,238 L 310,238 L 310,228 L 320,228 L 320,238 L 330,238 M 330,238 L 370,238 M 370,238 L 370,228 L 380,228 L 380,238 L 390,238 L 390,228 L 400,228 L 400,238 L 410,238 L 410,228 L 420,228 L 420,238 L 430,238 L 430,228 L 440,228 L 440,238 L 450,238 L 450,228 L 460,228 L 460,238 L 470,238 L 470,228 L 480,228 L 480,238 L 490,238 L 490,228 L 500,228 L 500,238 L 510,238 M 510,238 L 550,238 M 550,238 L 550,228 L 560,228 L 560,238 L 570,238 L 570,228 L 580,228 L 580,238 L 590,238 L 590,228 L 600,228 L 600,238 L 610,238 L 610,228 L 620,228 L 620,238 L 630,238 L 630,228 L 640,228 L 640,238 L 650,238 L 650,228 L 660,228 L 660,238 L 670,238 L 670,228 L 680,228 L 680,238 L 690,238 M 690,238 L 895,238" stroke="#6b7280" stroke-width="1.2" fill="none"/>

  <!-- Panel 2: Pixel Clock & Data Sampling Detail -->
  <rect x="30" y="255" width="900" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="275" font-size="14" font-weight="bold" fill="#1a1a1a">2. Тактування та стробування даних D[7:0] за тактами PCLK</text>

  <!-- Panel 2 Signal Labels -->
  <text x="115" y="308" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="115" y="355" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="115" y="418" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">D[7:0]</text>

  <!-- Strobe Note -->
  <text x="600" y="295" font-size="12" font-weight="bold" fill="#27ae60">▲ Засувка байта в DCMI за наростаючим фронтом PCLK</text>

  <!-- HREF Detailed Line -->
  <path d="M 135,308 L 895,308" stroke="#2457d6" stroke-width="2"/>

  <!-- t_PCLK Dimension Line -->
  <line x1="310" y1="330" x2="450" y2="330" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray-left)" marker-end="url(#arr-gray-right)"/>
  <text x="380" y="324" text-anchor="middle" font-size="11" fill="#6b7280">t_PCLK</text>

  <!-- PCLK Detailed Waveform -->
  <path d="M 135,368 L 170,368 L 170,340 L 240,340 L 240,368 L 310,368 L 310,340 L 380,340 L 380,368 L 450,368 L 450,340 L 520,340 L 520,368 L 590,368 L 590,340 L 660,340 L 660,368 L 730,368 L 730,340 L 800,340 L 800,368 L 895,368" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Sampling Vertical Dashed Lines & Arrow Indicators -->
  <line x1="310" y1="340" x2="310" y2="402" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green-down)"/>
  <line x1="450" y1="340" x2="450" y2="402" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green-down)"/>
  <line x1="590" y1="340" x2="590" y2="402" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green-down)"/>
  <line x1="730" y1="340" x2="730" y2="402" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green-down)"/>

  <!-- Data Bus D[7:0] Hexagonal Polygons -->
  <!-- Byte 0 (Y0) -->
  <polygon points="135,402 234,402 246,414 234,426 135,426" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="185" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Y0 (Luma)</text>

  <!-- Byte 1 (U0) -->
  <polygon points="246,414 258,402 374,402 386,414 374,426 258,426" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="316" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">U0 (Cb)</text>

  <!-- Byte 2 (Y1) -->
  <polygon points="386,414 398,402 514,402 526,414 514,426 398,426" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="456" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Y1 (Luma)</text>

  <!-- Byte 3 (V0) -->
  <polygon points="526,414 538,402 654,402 666,414 654,426 538,426" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="596" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V0 (Cr)</text>

  <!-- Byte 4 (Y2) -->
  <polygon points="666,414 678,402 794,402 806,414 794,426 678,426" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="736" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Y2 (Luma)</text>

  <!-- Byte 5 (...) -->
  <polygon points="806,414 818,402 895,402 895,426 818,426" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="855" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">...</text>

  <!-- Format Note at bottom -->
  <text x="480" y="450" text-anchor="middle" font-size="12" fill="#6b7280">Формат YUV422: кожні два такти PCLK передають один повний піксель (Y0+U0, потім Y1+V0)</text>
</svg>
