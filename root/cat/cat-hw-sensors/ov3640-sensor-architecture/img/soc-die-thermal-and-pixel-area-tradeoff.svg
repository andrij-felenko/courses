<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <defs>
    <!-- Градієнти -->
    <linearGradient id="grad-red" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arr-main" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#374151"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Заголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Компроміс інтеграції CMOS SoC: Темновий струм vs Коефіцієнт заповнення</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Вплив площі кристала під цифровий ISP/JPEG на локальний нагрів та чутливість піксельної матриці</text>

  <!-- Зони оптимізації фоном -->
  <!-- Зона RAW -->
  <rect x="140" y="90" width="220" height="340" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="115" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Зона сенсорів RAW</text>
  <text x="250" y="133" font-size="11" fill="#64748b" text-anchor="middle">Максимальна чутливість, нульовий нагрів</text>

  <!-- Зона SoC компромісу -->
  <rect x="360" y="90" width="260" height="340" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="490" y="115" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Зона оптимуму SoC (OV3640)</text>
  <text x="490" y="133" font-size="11" fill="#166534" text-anchor="middle">Баланс автономності та тепловиділення</text>

  <!-- Зона перегріву -->
  <rect x="620" y="90" width="220" height="340" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="730" y="115" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Зона деградації SNR</text>
  <text x="730" y="133" font-size="11" fill="#991b1b" text-anchor="middle">Перегрів матриці, дрібний піксель</text>

  <!-- Сітка координат -->
  <g stroke="#e5e7eb" stroke-dasharray="4,4" stroke-width="1">
    <line x1="140" y1="160" x2="840" y2="160"/>
    <line x1="140" y1="230" x2="840" y2="230"/>
    <line x1="140" y1="300" x2="840" y2="300"/>
    <line x1="140" y1="370" x2="840" y2="370"/>
    <line x1="280" y1="90" x2="280" y2="430"/>
    <line x1="420" y1="90" x2="420" y2="430"/>
    <line x1="560" y1="90" x2="560" y2="430"/>
    <line x1="700" y1="90" x2="700" y2="430"/>
  </g>

  <!-- Осі -->
  <!-- Вісь X -->
  <line x1="130" y1="430" x2="855" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="490" y="468" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Частка площі кристала під цифрові блоки ISP / JPEG (%)</text>
  <text x="140" y="448" font-size="11" fill="#4b5563" text-anchor="middle">0% (RAW)</text>
  <text x="280" y="448" font-size="11" fill="#4b5563" text-anchor="middle">15%</text>
  <text x="420" y="448" font-size="11" fill="#4b5563" text-anchor="middle">30% (OV2640)</text>
  <text x="560" y="448" font-size="11" fill="#4b5563" text-anchor="middle">45% (OV3640)</text>
  <text x="700" y="448" font-size="11" fill="#4b5563" text-anchor="middle">60%</text>
  <text x="840" y="448" font-size="11" fill="#4b5563" text-anchor="middle">75% (Full SoC)</text>

  <!-- Ліва вісь Y: Темновий струм (Червона) -->
  <line x1="140" y1="440" x2="140" y2="80" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="90" y="75" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Темновий струм I_d</text>
  <text x="130" y="434" font-size="10" fill="#dc2626" text-anchor="end">1x (I_0)</text>
  <text x="130" y="374" font-size="10" fill="#dc2626" text-anchor="end">2x</text>
  <text x="130" y="304" font-size="10" fill="#dc2626" text-anchor="end">4x</text>
  <text x="130" y="234" font-size="10" fill="#dc2626" text-anchor="end">8x</text>
  <text x="130" y="164" font-size="10" fill="#dc2626" text-anchor="end">16x</text>

  <!-- Права вісь Y: Коефіцієнт заповнення / SNR (Синя) -->
  <line x1="840" y1="440" x2="840" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="880" y="75" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">Коефіцієнт Fill Factor (%)</text>
  <text x="850" y="434" font-size="10" fill="#2563eb" text-anchor="start">10%</text>
  <text x="850" y="374" font-size="10" fill="#2563eb" text-anchor="start">25%</text>
  <text x="850" y="304" font-size="10" fill="#2563eb" text-anchor="start">40%</text>
  <text x="850" y="234" font-size="10" fill="#2563eb" text-anchor="start">55%</text>
  <text x="850" y="164" font-size="10" fill="#2563eb" text-anchor="start">70%</text>

  <!-- Крива 1: Темновий струм (експонента вгору) -->
  <!-- Y від 420 (x=140) через 410 (x=280), 380 (x=420), 320 (x=560), 220 (x=700), 120 (x=840) -->
  <path d="M 140,420 C 280,415 420,385 560,320 C 660,260 760,170 840,120" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="560" cy="320" r="5" fill="#dc2626"/>
  <text x="575" y="315" font-size="12" font-weight="bold" fill="#dc2626">I_d (OV3640) ≈ 3.5x I_0</text>

  <!-- Крива 2: Fill Factor / SNR (спад вниз) -->
  <!-- Y від 150 (x=140) через 180 (x=280), 240 (x=420), 300 (x=560), 360 (x=700), 410 (x=840) -->
  <path d="M 140,150 C 280,180 420,240 560,300 C 680,350 770,390 840,410" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="560" cy="300" r="5" fill="#2563eb"/>
  <text x="440" y="285" font-size="12" font-weight="bold" fill="#2563eb">Fill Factor (OV3640) ≈ 42%</text>

  <!-- Точка перетину / балансу -->
  <circle cx="560" cy="310" r="8" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="3,3"/>
  <line x1="560" y1="320" x2="560" y2="430" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Легенда внизу -->
  <rect x="250" y="480" width="460" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="270" y1="496" x2="300" y2="496" stroke="#dc2626" stroke-width="3"/>
  <text x="310" y="500" font-size="12" fill="#1f2937">Темновий струм I_d (локальне тепло)</text>
  <line x1="510" y1="496" x2="540" y2="496" stroke="#2563eb" stroke-width="3"/>
  <text x="550" y="500" font-size="12" fill="#1f2937">Коефіцієнт заповнення (світлосила)</text>
</svg>
