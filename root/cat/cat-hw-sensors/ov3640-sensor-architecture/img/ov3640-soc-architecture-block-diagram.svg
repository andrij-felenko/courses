<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions for Arrow Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура SoC-сенсора OV3640</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Інтеграція аналогової матриці, АЦП, ISP та JPEG-кодера на єдиному кристалі</text>

  <!-- Main SoC Silicon Substrate Container -->
  <rect x="20" y="70" width="705" height="445" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="35" y="92" font-size="13" font-weight="bold" fill="#6b7280">КРИСТАЛ SENSOR SOC (OMNIVISION OV3640)</text>

  <!-- Domain A: Analog Domain -->
  <rect x="35" y="125" width="170" height="375" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="45" y="145" font-size="13" font-weight="bold" fill="#1a1a1a">Аналоговий домен</text>

  <!-- Block A.1: Pixel Array -->
  <rect x="43" y="160" width="154" height="132" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Матриця пікселів</text>
  <text x="120" y="195" text-anchor="middle" font-size="12" fill="#6b7280">2048 × 1536 (3.1 МП)</text>

  <!-- Bayer Grid Visual (R, Gr, Gb, B) -->
  <rect x="95" y="208" width="22" height="22" rx="3" fill="#e74c3c"/>
  <text x="106" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="white">R</text>
  <rect x="123" y="208" width="22" height="22" rx="3" fill="#2ecc71"/>
  <text x="134" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Gr</text>
  <rect x="95" y="234" width="22" height="22" rx="3" fill="#2ecc71"/>
  <text x="106" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Gb</text>
  <rect x="123" y="234" width="22" height="22" rx="3" fill="#3498db"/>
  <text x="134" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">B</text>

  <text x="120" y="278" text-anchor="middle" font-size="12" fill="#6b7280">Масив пікселів Bayer</text>

  <!-- Arrow Pixel Array -> AFE -->
  <line x1="75" y1="292" x2="75" y2="325" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="85" y="312" font-size="12" fill="#2457d6">Аналоговий сигнал</text>

  <!-- Block A.2: Analog Front-End & ADC -->
  <rect x="43" y="325" width="154" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Аналоговий блок AFE</text>
  <text x="49" y="368" font-size="12" fill="#1a1a1a">• Підсилювач (PGA)</text>
  <text x="49" y="392" font-size="12" fill="#1a1a1a">• 10-біт АЦП-масив</text>
  <text x="49" y="416" font-size="12" fill="#1a1a1a">• Рівень чорного BLC</text>
  <text x="49" y="440" font-size="12" fill="#1a1a1a">• Подвійна вибірка CDS</text>
  <text x="49" y="464" font-size="12" fill="#1a1a1a">• Синхронізація такту</text>

  <!-- Arrow Domain A -> Domain B -->
  <line x1="197" y1="392" x2="285" y2="392" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="241" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">10-біт Raw</text>

  <!-- Domain B: Digital Processing Domain (ISP & JPEG) -->
  <rect x="275" y="125" width="295" height="375" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="145" font-size="13" font-weight="bold" fill="#2457d6">Цифровий домен (ISP &amp; JPEG)</text>

  <!-- Block B.1: ISP Core -->
  <rect x="285" y="160" width="130" height="330" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Блок ISP</text>
  <text x="291" y="200" font-size="12" fill="#1a1a1a">• Демозаїка Bayer</text>
  <text x="291" y="222" font-size="12" fill="#1a1a1a">• Баланс білого AWB</text>
  <text x="291" y="244" font-size="12" fill="#1a1a1a">• Автоекспозиція</text>
  <text x="291" y="266" font-size="12" fill="#1a1a1a">• Гама-корекція</text>
  <text x="291" y="288" font-size="12" fill="#1a1a1a">• Шумозаглушення</text>
  <text x="291" y="310" font-size="12" fill="#1a1a1a">• Lens Shading</text>
  <text x="291" y="332" font-size="12" fill="#1a1a1a">• Масштабування</text>
  <text x="291" y="354" font-size="12" fill="#1a1a1a">• Чіткість кадру</text>
  <text x="291" y="376" font-size="12" fill="#1a1a1a">• Колірна матриця</text>
  <text x="291" y="398" font-size="12" fill="#1a1a1a">• Перетворювач YUV</text>
  <text x="291" y="420" font-size="12" fill="#1a1a1a">• Корекція битих п.</text>

  <!-- Arrow ISP -> JPEG -->
  <line x1="415" y1="266" x2="445" y2="266" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="430" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">YUV</text>

  <!-- Block B.2: JPEG Encoder & FIFO -->
  <rect x="445" y="160" width="120" height="330" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Кодер JPEG &amp; FIFO</text>
  <text x="451" y="202" font-size="12" fill="#1a1a1a">• Апаратне DCT</text>
  <text x="451" y="224" font-size="12" fill="#1a1a1a">• Квантування</text>
  <text x="451" y="246" font-size="12" fill="#1a1a1a">• Код Гаффмана</text>
  <text x="451" y="268" font-size="12" fill="#1a1a1a">• Буфер FIFO</text>
  <text x="451" y="290" font-size="12" fill="#1a1a1a">• Потік кадрів</text>
  <text x="451" y="312" font-size="12" fill="#1a1a1a">• Бітрейт-контроль</text>

  <!-- Highlight Box: Benefit of JPEG Integration -->
  <rect x="451" y="330" width="110" height="150" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="457" y="348" font-size="12" font-weight="bold" fill="#27ae60">Оптимізація:</text>
  <text x="457" y="370" font-size="12" fill="#1a1a1a">• Стиснення</text>
  <text x="457" y="390" font-size="12" fill="#1a1a1a">  10–20×</text>
  <text x="457" y="412" font-size="12" fill="#1a1a1a">• Економія шини</text>
  <text x="457" y="434" font-size="12" fill="#1a1a1a">• Развантаження</text>
  <text x="457" y="456" font-size="12" font-weight="bold" fill="#27ae60">  ОЗП хоста!</text>

  <!-- Arrow Domain B -> Domain C -->
  <line x1="565" y1="230" x2="610" y2="230" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="588" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">JPEG</text>

  <!-- Domain C: Digital Output Interface -->
  <rect x="610" y="125" width="105" height="375" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="662" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вивід та SCCB</text>

  <!-- Block C.1: DVP & Control Interface -->
  <rect x="615" y="160" width="95" height="330" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="662" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Паралельний DVP</text>
  <text x="620" y="202" font-size="12" fill="#1a1a1a">• DVP 8/10 біт</text>
  <text x="620" y="224" font-size="12" fill="#1a1a1a">• Строб VSYNC</text>
  <text x="620" y="246" font-size="12" fill="#1a1a1a">• Строб HREF</text>
  <text x="620" y="268" font-size="12" fill="#1a1a1a">• Такти PCLK</text>

  <line x1="620" y1="286" x2="705" y2="286" stroke="#d0d7de" stroke-width="1"/>
  <text x="662" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шина SCCB (I²C)</text>
  <text x="620" y="330" font-size="12" fill="#6b7280">• Налаштування</text>
  <text x="620" y="350" font-size="12" fill="#6b7280">  регістрів</text>
  <text x="620" y="370" font-size="12" fill="#6b7280">• Режими ISP</text>

  <!-- Connections to Host System -->
  <!-- Data Stream (JPEG) -->
  <line x1="710" y1="202" x2="768" y2="202" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="739" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">JPEG</text>

  <!-- SCCB Control Bus -->
  <line x1="768" y1="360" x2="710" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="739" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SCCB</text>

  <!-- Block D: External Host System -->
  <rect x="760" y="70" width="180" height="445" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="850" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Хост-система</text>
  <text x="850" y="110" text-anchor="middle" font-size="12" fill="#6b7280">(Мікроконтролер / SoC)</text>

  <!-- Sub-block D.1: Compressed Stream Receiver -->
  <rect x="768" y="160" width="164" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="850" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Прийом кадру JPEG</text>
  <text x="774" y="200" font-size="12" fill="#1a1a1a">• Вхід з шини DVP</text>
  <text x="774" y="222" font-size="12" fill="#1a1a1a">• Низька частота PCLK</text>
  <text x="774" y="244" font-size="12" fill="#1a1a1a">• Мінімальний ОЗП</text>
  <text x="774" y="266" font-size="12" font-weight="bold" fill="#27ae60">• Прямий запис Flash</text>

  <!-- Sub-block D.2: SCCB Master Controller -->
  <rect x="768" y="310" width="164" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Контролер SCCB Master</text>
  <text x="774" y="354" font-size="12" fill="#1a1a1a">• Ініціалізація SoC</text>
  <text x="774" y="376" font-size="12" fill="#1a1a1a">• Конфігурація ISP</text>
  <text x="774" y="398" font-size="12" fill="#1a1a1a">• Якість стиснення</text>
  <text x="774" y="420" font-size="12" fill="#1a1a1a">• Роздільність кадру</text>
  <text x="774" y="442" font-size="12" fill="#1a1a1a">• Керування AEC/AWB</text>
  <text x="774" y="464" font-size="12" font-weight="bold" fill="#2457d6">• Шина I²C (SCL/SDA)</text>
</svg>
