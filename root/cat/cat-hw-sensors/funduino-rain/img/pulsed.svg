<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпульсне живлення пластини з реверсом полярності</text>
<line x1="90.0" y1="300.0" x2="800.0" y2="300.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="90.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час →</text>
<text x="70.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Постійне живлення VCC (гине за місяці)</text>
<rect x="90.0" y="80.0" width="710.0" height="34.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="445.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">струм крізь вологу тече ЦІЛОДОБОВО → електроліз роз'їдає доріжки</text>
<text x="70.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Імпульсно з GPIO: живлення лише на мить виміру</text>
<line x1="90.0" y1="240.0" x2="800.0" y2="240.0" stroke="#cbd2d9" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="70.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">off</text>
<rect x="160.0" y="200.0" width="26.0" height="40.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="173.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="173.0" y1="240.0" x2="173.0" y2="252.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="330.0" y="200.0" width="26.0" height="40.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="343.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="343.0" y1="240.0" x2="343.0" y2="252.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="500.0" y="200.0" width="26.0" height="40.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="513.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="513.0" y1="240.0" x2="513.0" y2="252.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="670.0" y="200.0" width="26.0" height="40.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="683.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="683.0" y1="240.0" x2="683.0" y2="252.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="173.0" y1="188.0" x2="343.0" y2="188.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="258.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">період (напр. 1/год)</text>
<text x="800.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">+/− чергуються щовиміру (проти анодного роз'їдання)</text>
<rect x="90.0" y="342.0" width="710.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Живимо пластину з ноги МК і вмикаємо лише на 20–50 мс виміру: струм крізь вологу тече</tspan><tspan x="445.0" dy="15.6">частками секунди на годину замість цілодобово — електроліз майже зупинено, заряд збережено.</tspan><tspan x="445.0" dy="15.6">Реверс полярності щовиміру знімає ще й анодне роз'їдання (на партіях давачів: без корозії ~півроку).</tspan></text>
</svg>