<rect x="90.0" y="396.0" width="660.0" height="56.0" rx="6" fill="#fff9e6" stroke="#b8860b" stroke-width="1.5"/><text x="420.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Досить будь-якого одного виходу. DO — готовий біт «дощ/сухо» (поріг крутить тример);</tspan><tspan x="420.0" dy="13.0">AO — сира напруга, щоб самому судити про силу дощу через АЦП. Живлення — 3.3 чи 5 В під логіку вашої плати.</tspan></text>
