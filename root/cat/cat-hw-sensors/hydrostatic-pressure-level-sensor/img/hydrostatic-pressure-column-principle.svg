<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="920" height="440" fill="#0d1117"/>
<defs>
  <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
  </marker>
  <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
  </marker>
</defs>
<text x="460" y="32" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Фізичний принцип гідростатичного вимірювання рівня рідини</text>

<!-- Tank representation -->
<rect x="70" y="70" width="360" height="320" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<!-- Liquid inside tank -->
<rect x="75" y="140" width="350" height="245" rx="4" fill="#1f3b5c" fill-opacity="0.6" stroke="#388bfd" stroke-width="1.5"/>

<!-- Atmospheric Pressure Arrows P_atm -->
<path d="M 160 85 L 160 125" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ar1)"/>
<path d="M 250 85 L 250 125" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ar1)"/>
<path d="M 340 85 L 340 125" stroke="#f0883e" stroke-width="2.5" marker-end="url(#ar1)"/>
<text x="250" y="80" font-size="13" fill="#f0883e" font-weight="700" text-anchor="middle">Атмосферний тиск P_атм (згори)</text>

<!-- Submerged probe at bottom -->
<rect x="230" y="340" width="40" height="42" rx="4" fill="#30363d" stroke="#58a6ff" stroke-width="2"/>
<circle cx="250" cy="365" r="8" fill="#3fb950"/>
<!-- Cable going up -->
<path d="M 250 340 L 250 70 L 480 70 L 480 200" fill="none" stroke="#8b949e" stroke-width="4"/>

<!-- Height dimension h -->
<line x1="50" y1="140" x2="50" y2="365" stroke="#3fb950" stroke-width="2"/>
<line x1="42" y1="140" x2="58" y2="140" stroke="#3fb950" stroke-width="2"/>
<line x1="42" y1="365" x2="58" y2="365" stroke="#3fb950" stroke-width="2"/>
<text x="35" y="260" font-size="16" fill="#3fb950" font-weight="700" text-anchor="middle" transform="rotate(-90 35 260)">Висота h</text>

<!-- Formula and explanation block right -->
<rect x="470" y="70" width="410" height="320" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="675" y="105" font-size="16" fill="#58a6ff" font-weight="700" text-anchor="middle">Закон Паскаля та рівняння гідростатики</text>

<rect x="495" y="125" width="360" height="60" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
<text x="675" y="152" font-size="17" fill="#3fb950" font-weight="700" text-anchor="middle">P_заг = P_атм + ρ · g · h</text>
<text x="675" y="174" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="middle">h = ΔP / (ρ · g) = (P_заг − P_атм) / (ρ · g)</text>

<!-- Legend items -->
<text x="510" y="215" font-size="13" fill="#f0f6fc">
  <tspan fill="#3fb950" font-weight="700">h</tspan> — поточна висота стовпа рідини над мембраною [м]
</text>
<text x="510" y="242" font-size="13" fill="#f0f6fc">
  <tspan fill="#58a6ff" font-weight="700">ρ (ро)</tspan> — густина рідини (вода ≈ 1000 кг/м³, нафта ≈ 850)
</text>
<text x="510" y="269" font-size="13" fill="#f0f6fc">
  <tspan fill="#d29922" font-weight="700">g</tspan> — прискорення вільного падіння (g ≈ 9.80665 м/с²)
</text>
<text x="510" y="296" font-size="13" fill="#f0f6fc">
  <tspan fill="#f0883e" font-weight="700">ΔP</tspan> — диференційний гідростатичний тиск [Па]
</text>

<!-- Ventilation Tube note -->
<rect x="495" y="325" width="360" height="50" rx="5" fill="#21262d" stroke="#f0883e" stroke-width="1.2"/>
<text x="675" y="346" font-size="12" fill="#f0883e" font-weight="700" text-anchor="middle">Автоматична компенсація P_атм:</text>
<text x="675" y="364" font-size="11" fill="#8b949e" text-anchor="middle">Капілярна дихальна трубка в кабелі підводить P_атм до тильного боку мембрани</text>

<!-- Bottom note -->
<text x="460" y="420" font-size="12" fill="#8b949e" text-anchor="middle">Гідростатичний тиск залежить строго від висоти та густини й не залежить від форми чи об'єму резервуара</text>
</svg>