<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="920" height="420" fill="#0d1117"/>
<text x="460" y="32" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Температурна компенсація густини рідини ρ(T)</text>

<!-- Graph area on left -->
<rect x="60" y="70" width="400" height="280" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="6"/>
<line x1="120" y1="120" x2="420" y2="120" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="180" x2="420" y2="180" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="240" x2="420" y2="240" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="120" y1="300" x2="420" y2="300" stroke="#21262d" stroke-dasharray="3 3"/>

<!-- Axes -->
<line x1="120" y1="70" x2="120" y2="310" stroke="#8b949e" stroke-width="2"/>
<line x1="120" y1="310" x2="440" y2="310" stroke="#8b949e" stroke-width="2"/>

<!-- Y-axis labels Density kg/m3 -->
<text x="110" y="115" font-size="12" fill="#8b949e" text-anchor="end">1000</text>
<text x="110" y="175" font-size="12" fill="#8b949e" text-anchor="end">990</text>
<text x="110" y="235" font-size="12" fill="#8b949e" text-anchor="end">980</text>
<text x="110" y="295" font-size="12" fill="#8b949e" text-anchor="end">970</text>
<text x="70" y="190" font-size="13" fill="#58a6ff" font-weight="700" transform="rotate(-90 70 190)" text-anchor="middle">Густина ρ [кг/м³]</text>

<!-- X-axis labels Temperature degC -->
<text x="120" y="330" font-size="12" fill="#8b949e" text-anchor="middle">0°C</text>
<text x="200" y="330" font-size="12" fill="#8b949e" text-anchor="middle">20°C</text>
<text x="280" y="330" font-size="12" fill="#8b949e" text-anchor="middle">40°C</text>
<text x="360" y="330" font-size="12" fill="#8b949e" text-anchor="middle">60°C</text>
<text x="420" y="330" font-size="12" fill="#8b949e" text-anchor="middle">80°C</text>
<text x="280" y="350" font-size="13" fill="#f0883e" font-weight="700" text-anchor="middle">Температура води T [°C]</text>

<!-- Density curve: peak at 4 degC then drops -->
<path d="M 120 114 Q 136 112 160 114 Q 240 125 320 155 Q 400 205 430 250" fill="none" stroke="#58a6ff" stroke-width="3"/>

<!-- Explanation right -->
<rect x="490" y="70" width="380" height="280" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="680" y="105" font-size="15" fill="#3fb950" font-weight="700" text-anchor="middle">Математична модель корекції</text>

<rect x="510" y="125" width="340" height="75" rx="5" fill="#0d1117" stroke="#238636"/>
<text x="680" y="150" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">Поліноміальна апроксимація Тільтона:</text>
<text x="680" y="172" font-size="12" fill="#f0f6fc" text-anchor="middle">ρ(T) = ρ_0 · [1 − β · (T − T_0)]</text>
<text x="680" y="190" font-size="11" fill="#8b949e" text-anchor="middle">де β ≈ 0.00021 1/°C (коефіцієнт об'ємного розширення)</text>

<text x="515" y="230" font-size="13" fill="#f0883e" font-weight="700">Вплив температури на похибку:</text>
<text x="515" y="255" font-size="12" fill="#f0f6fc">• Нагрів води з 10 °C до 60 °C зменшує густину на ~1.6%</text>
<text x="515" y="280" font-size="12" fill="#f0f6fc">• Без термокомпенсації датчик покаже на 16 см менше</text>
<text x="515" y="300" font-size="12" fill="#f0f6fc">  на стовпі висотою 10 метрів!</text>
<text x="515" y="330" font-size="12" fill="#58a6ff">• Вбудований терморезистор PT100/NTC усуває цю похибку</text>

<!-- Footer -->
<rect x="60" y="370" width="810" height="30" rx="4" fill="#21262d" stroke="#30363d"/>
<text x="465" y="390" font-size="12" fill="#8b949e" text-anchor="middle">
  Справжній гідростатичний рівень вимагає спільного розрахунку: h = P_гідро / (ρ(T) · g)
</text>
</svg>