<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<defs>
  <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
  </marker>
</defs>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Конструктивний розріз занурювального п'єзорезистивного зонда</text>

<!-- Probe Body (Horizontal Cutaway View) -->
<!-- Stainless Housing -->
<rect x="60" y="90" width="520" height="260" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
<text x="160" y="115" font-size="13" fill="#8b949e" font-weight="700">Корпус: Нержавіюча сталь AISI 316L (IP68)</text>

<!-- Left Protection Nose Cap -->
<path d="M 60 140 L 20 170 L 20 270 L 60 300 Z" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
<circle cx="35" cy="190" r="5" fill="#0d1117"/>
<circle cx="35" cy="220" r="5" fill="#0d1117"/>
<circle cx="35" cy="250" r="5" fill="#0d1117"/>
<text x="40" y="325" font-size="11" fill="#58a6ff" text-anchor="middle">Перфорований захисний ковпак</text>

<!-- Isolating Diaphragm 316L -->
<line x1="85" y1="145" x2="85" y2="295" stroke="#f0883e" stroke-width="4"/>
<text x="85" y="130" font-size="11" fill="#f0883e" text-anchor="middle">Мембрана 316L</text>

<!-- Silicone Oil Chamber -->
<rect x="90" y="150" width="70" height="140" fill="#d29922" fill-opacity="0.3" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="125" y="225" font-size="11" fill="#d29922" text-anchor="middle">Кремній-органічне мастило</text>

<!-- Silicon Piezoresistive Die -->
<rect x="165" y="175" width="40" height="90" rx="3" fill="#238636" stroke="#3fb950" stroke-width="2"/>
<text x="185" y="215" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">MEMS</text>
<text x="185" y="235" font-size="10" fill="#ffffff" text-anchor="middle">міст</text>

<!-- Internal Signal Conditioning ASIC / Amplifier -->
<rect x="240" y="160" width="130" height="120" rx="6" fill="#1f242c" stroke="#58a6ff" stroke-width="1.8"/>
<text x="305" y="195" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="middle">Підсилювач / ЦАП</text>
<text x="305" y="220" font-size="12" fill="#f0f6fc" text-anchor="middle">Перетворювач V -> I</text>
<text x="305" y="245" font-size="12" fill="#3fb950" font-weight="700" text-anchor="middle">Вихід: 4–20 мА</text>

<!-- Cable Gland & Seals -->
<rect x="420" y="180" width="70" height="80" rx="4" fill="#30363d" stroke="#f85149" stroke-width="2"/>
<text x="455" y="225" font-size="11" fill="#f85149" font-weight="700" text-anchor="middle">Подвійний O-Ring</text>

<!-- Vented Cable on the right -->
<rect x="490" y="195" width="130" height="50" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<!-- Atmospheric Reference Capillary Tube inside cable -->
<line x1="185" y1="200" x2="620" y2="200" stroke="#f0883e" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="370" y1="220" x2="620" y2="220" stroke="#3fb950" stroke-width="2"/>
<line x1="370" y1="230" x2="620" y2="230" stroke="#58a6ff" stroke-width="2"/>

<!-- Callout annotations on the right -->
<rect x="640" y="90" width="270" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="775" y="120" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="middle">Специфікація кабелю</text>

<text x="655" y="155" font-size="12" fill="#f0883e" font-weight="700">1. Вентиляційний капіляр:</text>
<text x="670" y="175" font-size="11" fill="#8b949e">Поліетиленова трубка Ø 1.2 мм для барометричної компенсації.</text>

<text x="655" y="205" font-size="12" fill="#58a6ff" font-weight="700">2. Силовий корд:</text>
<text x="670" y="225" font-size="11" fill="#8b949e">Кевларова нитка (Kevlar) витримує натяг до 200–500 Н.</text>

<text x="655" y="255" font-size="12" fill="#3fb950" font-weight="700">3. Оболонка кабелю:</text>
<text x="670" y="275" font-size="11" fill="#8b949e">Поліуретан (PUR) або фторопласт (FEP / PTFE) стійкий до агресії.</text>

<!-- Footer -->
<rect x="60" y="375" width="850" height="30" rx="5" fill="#21262d" stroke="#30363d"/>
<text x="485" y="395" font-size="12" fill="#f0f6fc" text-anchor="middle">
  Мембрана передає гідростатичний тиск крізь мастило на п'єзорезистори, а трубка забезпечує опорний P_атм
</text>
</svg>