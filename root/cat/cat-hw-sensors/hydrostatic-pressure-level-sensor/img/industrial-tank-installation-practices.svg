<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Правила та практика монтажу занурювальних зондів</text>

<!-- Tank outline on left -->
<rect x="50" y="70" width="340" height="320" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="55" y="130" width="330" height="255" rx="4" fill="#1f3b5c" fill-opacity="0.4"/>

<!-- Stilling Well (Заспокійлива труба) -->
<rect x="150" y="100" width="50" height="280" fill="#21262d" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
<text x="175" y="90" font-size="11" fill="#58a6ff" font-weight="700" text-anchor="middle">Заспокійлива труба</text>

<!-- Submerged probe inside stilling well -->
<rect x="160" y="330" width="30" height="40" rx="4" fill="#30363d" stroke="#3fb950" stroke-width="2"/>
<!-- Cable going up -->
<line x1="175" y1="330" x2="175" y2="70" stroke="#f0883e" stroke-width="3"/>

<!-- Bottom Clearance (50-100mm) -->
<line x1="210" y1="370" x2="210" y2="385" stroke="#f85149" stroke-width="2"/>
<text x="215" y="380" font-size="11" fill="#f85149" text-anchor="start">Зазор 50–100 мм від дна (захист від мулу)</text>

<!-- Top Cable Clamp & Junction Box -->
<rect x="145" y="55" width="60" height="20" rx="3" fill="#d29922"/>
<text x="175" y="50" font-size="10" fill="#d29922" text-anchor="middle">Кабельний затискач</text>

<!-- Junction Box with Breather Filter -->
<rect x="250" y="45" width="120" height="60" rx="5" fill="#21262d" stroke="#f0883e" stroke-width="1.8"/>
<text x="310" y="68" font-size="11" fill="#f0883e" font-weight="700" text-anchor="middle">Клемна коробка</text>
<text x="310" y="86" font-size="10" fill="#3fb950" text-anchor="middle">Патрон із силікагелем</text>

<!-- Right Side: Checklist and Best Practices -->
<rect x="420" y="70" width="480" height="320" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="660" y="100" font-size="15" fill="#58a6ff" font-weight="700" text-anchor="middle">Чек-лист інженерного монтажу</text>

<text x="440" y="135" font-size="13" fill="#3fb950" font-weight="700">1. Захист від турбулентності та хвиль:</text>
<text x="460" y="155" font-size="12" fill="#8b949e">У відкритих водоймах або резервуарах із мішалками зонд монтують</text>
<text x="460" y="172" font-size="12" fill="#8b949e">всередині перфорованої сталевої або пластикової труби (DN50/DN80).</text>

<text x="440" y="200" font-size="13" fill="#f0883e" font-weight="700">2. Осушення компенсаційної трубки:</text>
<text x="460" y="220" font-size="12" fill="#8b949e">Капілярну трубку в коробці не можна запаювати чи перетискати!</text>
<text x="460" y="237" font-size="12" fill="#8b949e">Обов'язковий фільтр із силікагелем для захисту від вологи (IP67).</text>

<text x="440" y="265" font-size="13" fill="#58a6ff" font-weight="700">3. Фіксація кабелю без зминання:</text>
<text x="460" y="285" font-size="12" fill="#8b949e">Використовуйте спеціальний клиновий або пелюстковий затискач.</text>
<text x="460" y="302" font-size="12" fill="#8b949e">Перетискання кабелю блокує внутрішній повітряний канал!</text>

<text x="440" y="330" font-size="13" fill="#f85149" font-weight="700">4. Захист від замулювання:</text>
<text x="460" y="350" font-size="12" fill="#8b949e">Зонд ніколи не кладуть на саме дно; мінімальний відступ 5–10 см.</text>

<!-- Footer -->
<rect x="50" y="398" width="850" height="24" rx="4" fill="#21262d"/>
<text x="475" y="415" font-size="11" fill="#8b949e" text-anchor="middle">Правильний монтаж гарантує точність 0.1–0.25% та безперебійну роботу понад 5–10 років</text>
</svg>