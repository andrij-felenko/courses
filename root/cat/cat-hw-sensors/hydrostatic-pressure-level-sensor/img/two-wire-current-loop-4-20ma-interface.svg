<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="920" height="420" fill="#0d1117"/>
<defs>
  <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
  </marker>
</defs>
<text x="460" y="32" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Схема підключення двопровідної струмової петлі 4–20 мА</text>

<!-- Left Block: Submersible Probe (Current Sink / Modulator) -->
<rect x="50" y="80" width="240" height="280" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="170" y="110" font-size="15" fill="#58a6ff" font-weight="700" text-anchor="middle">Занурювальний зонд</text>
<text x="170" y="130" font-size="12" fill="#8b949e" text-anchor="middle">(Двопровідний датчик тиску)</text>

<rect x="80" y="160" width="180" height="100" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="170" y="195" font-size="13" fill="#f0f6fc" text-anchor="middle">Модулятор струму</text>
<text x="170" y="220" font-size="16" fill="#3fb950" font-weight="700" text-anchor="middle">I_loop = 4...20 мА</text>
<text x="170" y="242" font-size="11" fill="#8b949e" text-anchor="middle">4 мА = 0% | 20 мА = 100%</text>

<circle cx="280" cy="180" r="7" fill="#f85149"/>
<text x="250" y="175" font-size="12" fill="#f85149" font-weight="700">V+</text>
<circle cx="280" cy="270" r="7" fill="#58a6ff"/>
<text x="250" y="265" font-size="12" fill="#58a6ff" font-weight="700">V−</text>

<!-- Center Lines: Long Industrial Cable (up to 1000m) -->
<line x1="280" y1="180" x2="620" y2="180" stroke="#f85149" stroke-width="3" marker-end="url(#ar3)"/>
<text x="450" y="170" font-size="13" fill="#f85149" font-weight="700" text-anchor="middle">Лінія живлення (+24 В) / Струм I_loop</text>

<line x1="620" y1="270" x2="280" y2="270" stroke="#58a6ff" stroke-width="3" marker-end="url(#ar3)"/>
<text x="450" y="295" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="middle">Поворотна лінія петлі / Сигнал</text>

<!-- Right Block: Controller Cabinet & Measurement Circuit -->
<rect x="620" y="80" width="260" height="280" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="750" y="110" font-size="15" fill="#f0f6fc" font-weight="700" text-anchor="middle">Шафа автоматики / MCU</text>

<!-- 24V DC Power Supply -->
<rect x="650" y="135" width="200" height="50" rx="4" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
<text x="750" y="165" font-size="14" fill="#f85149" font-weight="700" text-anchor="middle">Блок живлення 24 В DC</text>

<!-- Precision Shunt Resistor 250 Ohm -->
<rect x="690" y="225" width="120" height="60" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.8"/>
<text x="750" y="248" font-size="13" fill="#3fb950" font-weight="700" text-anchor="middle">R_шунт = 250.0 Ом</text>
<text x="750" y="268" font-size="11" fill="#8b949e" text-anchor="middle">0.1%, ТКС &lt; 15 ppm/°C</text>

<!-- ADC Input connections -->
<line x1="750" y1="225" x2="750" y2="210" stroke="#3fb950" stroke-width="2"/>
<line x1="750" y1="285" x2="750" y2="300" stroke="#58a6ff" stroke-width="2"/>

<circle cx="840" cy="255" r="6" fill="#58a6ff"/>
<text x="830" y="235" font-size="12" fill="#58a6ff" font-weight="700" text-anchor="end">Вхід АЦП: 1–5 В</text>
<text x="830" y="330" font-size="11" fill="#8b949e" text-anchor="end">4 мА · 250 Ом = 1.0 В</text>
<text x="830" y="348" font-size="11" fill="#8b949e" text-anchor="end">20 мА · 250 Ом = 5.0 В</text>

<!-- Bottom note banner -->
<rect x="50" y="375" width="830" height="28" rx="4" fill="#21262d" stroke="#30363d"/>
<text x="465" y="394" font-size="12" fill="#f0f6fc" text-anchor="middle">
  Перевага струмової петлі: повна нечутливість до опору кабелю довжиною до 1000 м та діагностика обриву лінії (струм &lt; 3.6 мА)
</text>
</svg>