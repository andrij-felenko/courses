<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Характеристика R(T) платинових RTD та зони рівняння CVD</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Розмежування діапазонів: квадратичний Callendar (T ≥ 0°C) та поліном 4-го ступеня Van Dusen (T &lt; 0°C)</text>

  <!-- Plot frame -->
  <rect x="50" y="80" width="750" height="260" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Zero axes -->
  <line x1="230" y1="90" x2="230" y2="330" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="230" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle">0 °C</text>

  <line x1="60" y1="280" x2="780" y2="280" stroke="#30363d" stroke-width="1"/>
  <text x="770" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">T (°C)</text>

  <!-- Curve: -200°C to +850°C -->
  <!-- Left cryogenic zone (T < 0°C): cyan/blue -->
  <path d="M 80 300 Q 150 290 230 250" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <!-- Right zone (T >= 0°C): green -->
  <path d="M 230 250 Q 450 170 760 110" fill="none" stroke="#3fb950" stroke-width="3"/>

  <!-- R0 point at 0°C -->
  <circle cx="230" cy="250" r="5" fill="#f85149"/>
  <text x="215" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149" text-anchor="end">R₀ (100.00 Ом)</text>

  <!-- Points on curve -->
  <!-- -200°C: 18.52 Ohm -->
  <circle cx="80" cy="300" r="4" fill="#58a6ff"/>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">-200 °C (18.5 Ом)</text>

  <!-- +850°C: 390.48 Ohm -->
  <circle cx="760" cy="110" r="4" fill="#3fb950"/>
  <text x="730" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">+850 °C (390.5 Ом)</text>

  <!-- Two formula cards below -->
  <rect x="50" y="355" width="365" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="232" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">Зона T &lt; 0 °C (Ван Дюзен, 1925)</text>
  <text x="70" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">R(T) = R₀ [1 + A·T + B·T² + C·(T - 100)·T³]</text>
  <text x="70" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">A = 3.9083×10⁻³ °C⁻¹;  B = -5.775×10⁻⁷ °C⁻²</text>
  <text x="70" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#79c0ff">C = -4.183×10⁻¹² °C⁻⁴ (кріогенний член)</text>

  <rect x="435" y="355" width="365" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="617" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">Зона T ≥ 0 °C (Каллендар, 1887)</text>
  <text x="455" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">R(T) = R₀ [1 + A·T + B·T²]</text>
  <text x="455" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Квадратична парабола зі спадною крутизною</text>
  <text x="455" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">Аналітичний розв'язок через корінь дискримінанта</text>
</svg>