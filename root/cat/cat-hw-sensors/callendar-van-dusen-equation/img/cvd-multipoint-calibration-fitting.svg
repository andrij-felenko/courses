<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Індивідуальне калібрування сенсора: підгонка R₀, A, B, C</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Усунення індивідуального технологічного розкиду за реперними точками фазових рівноваг</text>

  <!-- Left: Fixed Points Setup -->
  <rect x="40" y="85" width="370" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">Вимірювання в реперних точках</text>

  <rect x="60" y="135" width="330" height="65" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="75" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">Точка 1: Потрійна точка води TPW</text>
  <text x="75" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">T₁ = +0.010 °C → Визначає точне R₀</text>

  <rect x="60" y="210" width="330" height="65" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="75" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Точка 2: Плавлення галію Ga / Кипіння води</text>
  <text x="75" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">T₂ = +29.7646 °C або 100.0 °C → Разом дають A</text>

  <rect x="60" y="285" width="330" height="65" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="75" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d29922">Точка 3: Затвердіння цинку Zn</text>
  <text x="75" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">T₃ = +419.527 °C → Визначає коефіцієнт B</text>

  <rect x="60" y="360" width="330" height="65" rx="6" fill="#21262d" stroke="#bc8cff" stroke-width="1"/>
  <text x="75" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#bc8cff">Точка 4 (Опціонально): Кипіння азоту LN₂</text>
  <text x="75" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9">T₄ = -195.798 °C → Визначає коефіцієнт C</text>

  <!-- Right: Linear Equations Solver (Vandermonde) -->
  <rect x="435" y="85" width="375" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">Система лінійних рівнянь</text>

  <rect x="455" y="135" width="335" height="110" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1.5"/>
  <text x="470" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Матрична форма для зони T &gt; 0 °C:</text>
  <text x="470" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">| T₂   T₂² |   | A |   | (R₂ / R₀ - 1) |</text>
  <text x="470" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">| T₃   T₃² | · | B | = | (R₃ / R₀ - 1) |</text>
  <text x="470" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787">Розв'язок методом Крамера за 2 калібрувальні точки</text>

  <rect x="455" y="260" width="335" height="165" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="470" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Результат калібрування:</text>
  <text x="470" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Похибка сенсора зменшується з ±0.3 °C (клас B)</text>
  <text x="470" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">  до неймовірних ±0.015 °C у всьому діапазоні!</text>
  <text x="470" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Індивідуальні A, B прошиваються в EEPROM</text>
  <text x="470" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Компенсуються похибки партій платинового дроту</text>
  <text x="470" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79c0ff">Стандарт IEC 60751 / ASTM E1137</text>
</svg>