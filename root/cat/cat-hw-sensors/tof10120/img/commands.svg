<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">UART-команди: питаєш рядком, модуль відповідає рядком</text>
<text x="470.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">МК шле у ніжку RXD модуля  →</text>
<rect x="230.0" y="80.0" width="88.0" height="62.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="274.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">s</text>
<text x="274.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">set</text>
<rect x="326.0" y="80.0" width="88.0" height="62.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="370.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<text x="370.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">№ параметра</text>
<rect x="422.0" y="80.0" width="88.0" height="62.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="466.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">-</text>
<text x="466.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">роздільник</text>
<rect x="518.0" y="80.0" width="88.0" height="62.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="562.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="562.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">значення</text>
<rect x="614.0" y="80.0" width="88.0" height="62.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="658.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">#</text>
<text x="658.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">кінець</text>
<text x="470.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«s3-1#» = встав режим 1 (сира, миттєва відстань)</text>
<line x1="470.0" y1="182.0" x2="470.0" y2="212.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">модуль повертає у ніжку TXD:  ok</text>
<rect x="60.0" y="300.0" width="400.0" height="44.0" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="74.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">r6#</text>
<text x="178.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">→ L=0748</text>
<text x="270.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">прочитати відстань (мм)</text>
<rect x="60.0" y="356.0" width="400.0" height="44.0" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="74.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">s3-1#</text>
<text x="178.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">→ ok</text>
<text x="270.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">0 = згладжена · 1 = сира</text>
<rect x="60.0" y="412.0" width="400.0" height="44.0" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="74.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">s5-1#</text>
<text x="178.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">→ ok</text>
<text x="270.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">0 = сам шле · 1 = лише на запит</text>
<rect x="480.0" y="300.0" width="400.0" height="44.0" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="494.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">s1+05#</text>
<text x="600.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">→ ok</text>
<text x="690.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">зсув +5 мм (юстування нуля)</text>
<rect x="480.0" y="356.0" width="400.0" height="44.0" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="494.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">s2-500#</text>
<text x="600.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">→ ok</text>
<text x="690.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">інтервал видачі 500 мс</text>
<rect x="480.0" y="412.0" width="400.0" height="44.0" rx="7" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="494.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">s7-085#</text>
<text x="600.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">→ ok</text>
<text x="690.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">нова I2C-адреса (тут 0x55)</text>
</svg>