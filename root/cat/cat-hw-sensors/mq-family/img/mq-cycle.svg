<rect x="105.0" y="364.8" width="609.9" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Гаряча фаза «чистить» поверхню й ловить горючі гази; у холоднішій фазі краще читається CO.</tspan><tspan x="410.0" dy="15.0">Тому просто подати 5 В і читати AO — замало: нагрівачем треба керувати за розкладом.</tspan></text>
