<rect x="154.1" y="468.4" width="591.7" height="67.2" rx="6" fill="#fff8e6" stroke="#d6a419" stroke-width="1.5"/><text x="450.0" y="490.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Зелене — увімкнув на 5 В і читай. Червоне (MQ-7, MQ-9) — нагрівач треба гойдати між</tspan><tspan x="450.0" dy="15.6">гарячою й холодною фазою за розкладом: чадний газ читається лише в холоднішій.</tspan><tspan x="450.0" dy="15.6">MQ-135 — не «вимірювач CO₂»: без калібрування це розмита суміш газів.</tspan></text>
