<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6px; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .comp-wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .comp-body { fill: #334155; stroke: #38bdf8; stroke-width: 2; }
      .opamp { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
      .resistor { fill: #334155; stroke: #fbbf24; stroke-width: 1.5; }
      .switch { stroke: #f43f5e; stroke-width: 2.5; stroke-linecap: round; }
      .state-box { fill: #0f172a; stroke: #64748b; stroke-width: 1; rx: 4px; }
      .dot { fill: #38bdf8; }
    </style>
  </defs>

  <rect width="880" height="520" class="bg" />

  <!-- Titles -->
  <text x="440" y="28" text-anchor="middle" class="title">Аналоговий синхронний демодулятор з перемиканням коефіцієнта підсилення (+1 / -1)</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Схемотехніка на прецизійному операційному підсилювачі та аналогових ключах (MOSFET / CMOS)</text>

  <!-- Left: Schematic Circuit -->
  <rect x="30" y="70" width="540" height="425" class="panel" />
  <text x="50" y="95" class="lbl-bold" fill="#38bdf8">Принципова схема демодулятора (+1 / -1)</text>

  <!-- V_in entry point -->
  <circle cx="65" cy="200" r="4" class="dot" />
  <text x="55" y="185" class="lbl-bold" fill="#fbbf24">V_in(t)</text>
  <text x="50" y="220" class="subtitle">(від LVDT)</text>
  <line x1="65" y1="200" x2="110" y2="200" class="comp-wire" />

  <!-- Node split after input: up to R1, down to Switch/Non-inverting -->
  <circle cx="110" cy="200" r="4" class="dot" />
  <line x1="110" y1="200" x2="110" y2="150" class="comp-wire" />
  <line x1="110" y1="150" x2="160" y2="150" class="comp-wire" />

  <line x1="110" y1="200" x2="110" y2="280" class="comp-wire" />
  <line x1="110" y1="280" x2="160" y2="280" class="comp-wire" />

  <!-- R1 (upper branch, inverting path) -->
  <rect x="160" y="142" width="50" height="16" class="resistor" />
  <text x="185" y="135" text-anchor="middle" class="lbl-bold">R1</text>
  <text x="185" y="172" text-anchor="middle" class="subtitle">10 кОм (0.1%)</text>
  <line x1="210" y1="150" x2="270" y2="150" class="comp-wire" />

  <!-- R3 (lower branch, non-inverting path to opamp+) -->
  <rect x="160" y="272" width="50" height="16" class="resistor" />
  <text x="185" y="265" text-anchor="middle" class="lbl-bold">R3</text>
  <text x="185" y="302" text-anchor="middle" class="subtitle">10 кОм (0.1%)</text>
  <line x1="210" y1="280" x2="270" y2="280" class="comp-wire" />

  <!-- Node at inverting input (opamp -) -->
  <circle cx="270" cy="150" r="4" class="dot" />
  <line x1="270" y1="150" x2="310" y2="150" class="comp-wire" />
  <line x1="310" y1="150" x2="310" y2="190" class="comp-wire" />
  <line x1="310" y1="190" x2="340" y2="190" class="comp-wire" />

  <!-- Feedback branch with R_f (R2) -->
  <line x1="270" y1="150" x2="270" y2="110" class="comp-wire" />
  <line x1="270" y1="110" x2="330" y2="110" class="comp-wire" />
  <rect x="330" y="102" width="50" height="16" class="resistor" />
  <text x="355" y="95" text-anchor="middle" class="lbl-bold">R2 (R_f)</text>
  <text x="355" y="132" text-anchor="middle" class="subtitle">10 кОм (0.1%)</text>
  <line x1="380" y1="110" x2="450" y2="110" class="comp-wire" />
  <line x1="450" y1="110" x2="450" y2="200" class="comp-wire" />

  <!-- Node at non-inverting input (opamp +) -->
  <circle cx="270" cy="280" r="4" class="dot" />
  <line x1="270" y1="280" x2="340" y2="280" class="comp-wire" />

  <!-- Switch S1 (MOSFET/CMOS) from opamp(+) to GND -->
  <line x1="270" y1="280" x2="270" y2="330" class="comp-wire" />
  <circle cx="270" cy="330" r="3" fill="#cbd5e1" />
  <line x1="270" y1="330" x2="295" y2="355" class="switch" />
  <circle cx="270" cy="370" r="3" fill="#cbd5e1" />
  <line x1="270" y1="370" x2="270" y2="395" class="comp-wire" />
  <!-- GND symbol -->
  <line x1="255" y1="395" x2="285" y2="395" class="comp-wire" />
  <line x1="260" y1="400" x2="280" y2="400" class="comp-wire" />
  <line x1="267" y1="405" x2="273" y2="405" class="comp-wire" />
  <text x="305" y="350" class="lbl-bold" fill="#f43f5e">SW1 (MOSFET)</text>
  <text x="305" y="366" class="subtitle">ADG419 / CD4053</text>

  <!-- Opamp Triangle -->
  <polygon points="340,170 340,300 440,235" class="opamp" />
  <text x="350" y="195" class="lbl-bold" font-size="16">-</text>
  <text x="350" y="285" class="lbl-bold" font-size="16">+</text>
  <text x="385" y="240" text-anchor="middle" class="lbl-bold" fill="#38bdf8">ОП</text>
  <text x="385" y="255" text-anchor="middle" class="subtitle">OP07 / TL072</text>

  <!-- Opamp Output -->
  <line x1="440" y1="235" x2="450" y2="235" class="comp-wire" />
  <circle cx="450" cy="235" r="4" class="dot" />
  <line x1="450" y1="235" x2="520" y2="235" class="comp-wire" />
  <circle cx="520" cy="235" r="4" class="dot" />
  <text x="500" y="220" class="lbl-bold" fill="#10b981">V_out(t)</text>
  <text x="490" y="260" class="subtitle">(до ФНЧ)</text>

  <!-- Reference Control Signal Block -->
  <rect x="50" y="380" width="160" height="75" class="box" />
  <text x="60" y="402" class="lbl-bold" fill="#a855f7">Опорний сигнал</text>
  <text x="60" y="420" class="subtitle">V_ref_ctrl (меандр 0/5 В)</text>
  <text x="60" y="438" class="subtitle">Синхронізований з несучою</text>
  <path d="M 210 415 L 250 415 L 250 355 L 265 355" class="comp-wire" stroke-dasharray="3,3" stroke="#a855f7" />

  <!-- Right: Operational Modes & Math Formulas -->
  <rect x="590" y="70" width="260" height="425" class="panel" />
  <text x="605" y="95" class="lbl-bold" fill="#38bdf8">Принцип роботи схеми</text>

  <!-- Mode 1: SW1 Open -->
  <rect x="605" y="115" width="230" height="130" class="state-box" />
  <text x="615" y="135" class="lbl-bold" fill="#10b981">Режим 1: SW1 РОЗІМКНЕНО</text>
  <text x="615" y="152" class="subtitle">Опорний напівперіод (+)</text>
  <text x="615" y="170" class="lbl">• V(+) = V_in (струм у вхід ОП = 0)</text>
  <text x="615" y="186" class="lbl">• V(-) = V(+) = V_in</text>
  <text x="615" y="202" class="lbl">• Струм через R1: (V_in - V_in)/R1 = 0</text>
  <text x="615" y="220" class="lbl-bold" fill="#10b981">→ K = +1 : V_out = +V_in</text>
  <text x="615" y="236" class="subtitle">(Неінвертувальний повторювач)</text>

  <!-- Mode 2: SW1 Closed -->
  <rect x="605" y="260" width="230" height="130" class="state-box" />
  <text x="615" y="280" class="lbl-bold" fill="#f43f5e">Режим 2: SW1 ЗАМКНЕНО</text>
  <text x="615" y="297" class="subtitle">Опорний напівперіод (-)</text>
  <text x="615" y="315" class="lbl">• Вхід (+) з'єднано з GND: V(+) = 0 В</text>
  <text x="615" y="331" class="lbl">• Віртуальна земля на V(-) = 0 В</text>
  <text x="615" y="347" class="lbl">• Схема стає класичним інвертором</text>
  <text x="615" y="365" class="lbl-bold" fill="#f43f5e">→ K = -R2/R1 = -1 : V_out = -V_in</text>
  <text x="615" y="381" class="subtitle">(Інвертувальний підсилювач)</text>

  <!-- Bottom Math Summary -->
  <rect x="605" y="405" width="230" height="75" class="box" />
  <text x="615" y="425" class="lbl-bold" fill="#fbbf24">Математична функція:</text>
  <text x="615" y="445" class="lbl">V_out(t) = V_in(t) · sgn(V_ref(t))</text>
  <text x="615" y="465" class="subtitle">Повне двопівперіодне випрямлення</text>
</svg>