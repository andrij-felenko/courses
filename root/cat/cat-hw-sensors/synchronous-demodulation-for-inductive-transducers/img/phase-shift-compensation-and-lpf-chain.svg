<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 6px; }
      .box-filter { fill: #1e293b; stroke: #10b981; stroke-width: 1.5; rx: 6px; }
      .box-psd { fill: #1e293b; stroke: #f43f5e; stroke-width: 1.5; rx: 6px; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8px; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
      .lbl-bold { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; }
      .wire { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .wire-accent { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .wire-green { stroke: #10b981; stroke-width: 2.5; fill: none; }
      .dot { fill: #38bdf8; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="880" height="500" class="bg" />

  <text x="440" y="28" text-anchor="middle" class="title">Тракт компенсації фазового зсуву та вихідної фільтрації</text>
  <text x="440" y="48" text-anchor="middle" class="subtitle">Усунення асинхронності між струмом збудження й сигналом вторинних обмоток та згладжування пульсацій 2·f_c</text>

  <!-- Input Sources -->
  <g transform="translate(40, 80)">
    <rect x="0" y="10" width="130" height="60" class="box" />
    <text x="65" y="33" text-anchor="middle" class="lbl-bold">Опорний генератор</text>
    <text x="65" y="52" text-anchor="middle" class="subtitle">u_ref = sin(ω_c t)</text>
    <line x1="130" y1="40" x2="190" y2="40" class="wire-accent" marker-end="url(#arr-blue)" />

    <rect x="0" y="170" width="130" height="65" class="box" style="stroke: #fbbf24;" />
    <text x="65" y="193" text-anchor="middle" class="lbl-bold" fill="#fbbf24">Давач LVDT/RVDT</text>
    <text x="65" y="210" text-anchor="middle" class="subtitle">u_out = x·sin(ω_c t + φ)</text>
    <text x="65" y="225" text-anchor="middle" class="subtitle" fill="#f59e0b">Зсув фази: φ(R, L, C)</text>
    <line x1="130" y1="200" x2="390" y2="200" class="wire" marker-end="url(#arr)" />
  </g>

  <!-- Phase Compensation Section (Top branch) -->
  <g transform="translate(230, 80)">
    <rect x="0" y="0" width="160" height="80" class="box" />
    <text x="80" y="24" text-anchor="middle" class="lbl-bold">Активний фазообертач</text>
    <text x="80" y="42" text-anchor="middle" class="subtitle">All-Pass Filter (ОП + RC)</text>
    <text x="80" y="60" text-anchor="middle" class="lbl" fill="#38bdf8">Δφ = -2·arctan(ω·R·C)</text>
    <text x="80" y="74" text-anchor="middle" class="subtitle">Регулювання фази: 0°...180°</text>
    <line x1="160" y1="40" x2="200" y2="40" class="wire-accent" marker-end="url(#arr-blue)" />

    <rect x="200" y="0" width="150" height="80" class="box" />
    <text x="275" y="24" text-anchor="middle" class="lbl-bold">Детектор нуля (ZCD)</text>
    <text x="275" y="42" text-anchor="middle" class="subtitle">Прецизійний компаратор</text>
    <text x="275" y="60" text-anchor="middle" class="lbl" fill="#a855f7">Формування меандру</text>
    <text x="275" y="74" text-anchor="middle" class="subtitle">Строго в фазі з виходом</text>

    <path d="M 275 80 L 275 160" class="wire-accent" marker-end="url(#arr-blue)" />
  </g>

  <!-- Multiplier / PSD Stage -->
  <g transform="translate(430, 240)">
    <rect x="0" y="0" width="160" height="85" class="box-psd" />
    <text x="80" y="25" text-anchor="middle" class="lbl-bold" fill="#f43f5e">Фазочутливий детектор</text>
    <text x="80" y="43" text-anchor="middle" class="subtitle">Синхронний демодулятор</text>
    <text x="80" y="61" text-anchor="middle" class="lbl">u_mult = u_out · sgn(ref)</text>
    <text x="80" y="77" text-anchor="middle" class="subtitle" fill="#f43f5e">Пульсації: 2·f_c (10 кГц)</text>
    <line x1="160" y1="42" x2="210" y2="42" class="wire-green" marker-end="url(#arr-green)" />
  </g>

  <!-- Low Pass Filter Stage -->
  <g transform="translate(640, 240)">
    <rect x="0" y="0" width="180" height="85" class="box-filter" />
    <text x="90" y="25" text-anchor="middle" class="lbl-bold" fill="#10b981">Активний ФНЧ 2-го пор.</text>
    <text x="90" y="43" text-anchor="middle" class="subtitle">Саллена-Кея (Баттерворт)</text>
    <text x="90" y="61" text-anchor="middle" class="lbl">f_cut = 100 Гц &lt;&lt; 2·f_c</text>
    <text x="90" y="77" text-anchor="middle" class="subtitle">Пригнічення: &gt; 45 дБ</text>
    <line x1="180" y1="42" x2="220" y2="42" class="wire-green" marker-end="url(#arr-green)" />
  </g>

  <!-- Final DC Output -->
  <circle cx="860" cy="282" r="4" fill="#10b981" />
  <text x="850" y="265" class="lbl-bold" fill="#10b981">U_out(x)</text>
  <text x="840" y="310" class="subtitle">До АЦП / МК</text>

  <!-- Bottom Detailed Insights Panel -->
  <rect x="40" y="360" width="800" height="115" class="panel" />
  <text x="60" y="385" class="lbl-bold" fill="#38bdf8">Критичні інженерні правила фазової компенсації та фільтрації:</text>
  <text x="60" y="408" class="lbl">• <tspan fill="#fbbf24">Втрата чутливості від фазового зсуву:</tspan> U_out ~ cos(Δφ). При некомпенсованому зсуві Δφ = 30° сигнал падає на 13.4%, а при Δφ = 90° вихід зникає повністю!</text>
  <text x="60" y="428" class="lbl">• <tspan fill="#38bdf8">Температурна стабільність:</tspan> Зміна температури міді змінює опір R обмоток та викликає дрейф фази. Активне автопідлаштування (PLL) повністю усуває цей дрейф.</text>
  <text x="60" y="448" class="lbl">• <tspan fill="#10b981">Компроміс швидкодії ФНЧ:</tspan> Частота зрізу обирається з умови f_mech &lt;&lt; f_cut &lt;&lt; 2·f_c. Надто низька f_cut створює затримку контуру керування (фазовий лаг).</text>
</svg>