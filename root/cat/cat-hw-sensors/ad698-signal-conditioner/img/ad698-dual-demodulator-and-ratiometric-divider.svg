<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структурна схема аналогових каналів AD698</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Апаратне перетворення змінних напруг вторинних обмоток у постійну раціометричну величину</text>

  <rect x="190" y="90" width="570" height="330" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="475" y="115" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">Монолітна мікросхема AD698</text>

  <!-- Channel A -->
  <text x="160" y="155" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Вхід A (A - B)</text>
  <text x="160" y="175" font-size="12" fill="#6b7280" text-anchor="end">Змінна напруга</text>
  <line x1="80" y1="160" x2="210" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="130" width="120" height="60" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="280" y="155" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхідний диф.</text>
  <text x="280" y="175" font-size="12" fill="#1a1a1a" text-anchor="middle">підсилювач A</text>

  <line x1="340" y1="160" x2="380" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="390" y="130" width="120" height="60" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="155" font-size="12" fill="#1a1a1a" text-anchor="middle">Синхронний</text>
  <text x="450" y="175" font-size="12" fill="#1a1a1a" text-anchor="middle">демодулятор A</text>

  <path d="M510,160 L670,160 L670,210" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="150" font-size="12" fill="#1a1a1a" text-anchor="middle">Постійна A</text>

  <!-- Channel B -->
  <text x="160" y="355" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Вхід B (A + B)</text>
  <text x="160" y="375" font-size="12" fill="#6b7280" text-anchor="end">Змінна напруга</text>
  <line x1="80" y1="360" x2="210" y2="360" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="220" y="330" width="120" height="60" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="280" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхідний диф.</text>
  <text x="280" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">підсилювач B</text>

  <line x1="340" y1="360" x2="380" y2="360" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="390" y="330" width="120" height="60" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">Синхронний</text>
  <text x="450" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">демодулятор B</text>

  <path d="M510,360 L670,360 L670,310" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="590" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Постійна B</text>

  <!-- Oscillator -->
  <rect x="390" y="230" width="120" height="60" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="255" font-size="12" fill="#1a1a1a" text-anchor="middle">Опорний</text>
  <text x="450" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle">генератор</text>
  
  <line x1="450" y1="230" x2="450" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="290" x2="450" y2="320" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <text x="460" y="215" font-size="12" fill="#6b7280" text-anchor="start">Несуча</text>
  <text x="460" y="315" font-size="12" fill="#6b7280" text-anchor="start">Несуча</text>

  <!-- Divider -->
  <rect x="610" y="220" width="120" height="80" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="670" y="255" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналоговий</text>
  <text x="670" y="275" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">дільник A / B</text>

  <!-- Output -->
  <line x1="730" y1="260" x2="810" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="820" y="255" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вихідний сигнал</text>
  <text x="820" y="275" font-size="12" fill="#6b7280" text-anchor="start">Постійна напруга</text>

</svg>
