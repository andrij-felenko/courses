  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Похибки класичного амплітудного демодулятора LVDT</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Дрейф опору котушок та ємність кабелю викликають зміну вихідної напруги навіть при нерухомому осерді</text>

  <rect x="30" y="100" width="280" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
