  <path d="M 776 270 L 780 270 L 780 330 L 450 330 M 420 330 L 290 330" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="150" y="140" width="140" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="220" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Генератор</text>
  <text x="220" y="185" font-size="13" text-anchor="middle" fill="#1a1a1a">V_EXC · sin(ωt)</text>

  <rect x="190" y="230" width="100" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="240" y="248" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Детектор</text>
  <text x="240" y="263" font-size="13" text-anchor="middle" fill="#1a1a1a">|V_A|</text>

  <rect x="190" y="310" width="100" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
