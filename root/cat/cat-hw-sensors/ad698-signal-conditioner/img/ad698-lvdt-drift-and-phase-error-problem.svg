  <text x="435" y="240" font-size="12" text-anchor="middle" fill="#6b7280">R_W</text>
  <rect x="420" y="285" width="30" height="10" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="420" y="325" width="30" height="10" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>

  <path d="M 490 150 L 490 165 M 485 165 L 495 165 M 485 175 L 495 175 M 490 175 L 490 190" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="490" cy="150" r="2.5" fill="#1a1a1a"/>
  <circle cx="490" cy="190" r="2.5" fill="#1a1a1a"/>
  <text x="500" y="173" font-size="12" fill="#6b7280">C_C</text>

  <path d="M 490 250 L 490 265 M 485 265 L 495 265 M 485 275 L 495 275 M 490 275 L 490 290" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="490" cy="250" r="2.5" fill="#1a1a1a"/>
  <circle cx="490" cy="290" r="2.5" fill="#1a1a1a"/>
  <text x="500" y="273" font-size="12" fill="#6b7280">C_C</text>

  <path d="M 530 290 L 530 305 M 525 305 L 535 305 M 525 315 L 535 315 M 530 315 L 530 330" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="530" cy="290" r="2.5" fill="#1a1a1a"/>
  <circle cx="530" cy="330" r="2.5" fill="#1a1a1a"/>
  <text x="540" y="313" font-size="12" fill="#6b7280">C_C</text>

  <text x="460" y="145" font-size="12" fill="#1a1a1a">EX+</text>
  <text x="460" y="185" font-size="12" fill="#1a1a1a">EX-</text>
  <text x="460" y="245" font-size="12" fill="#1a1a1a">VA</text>
  <text x="460" y="305" font-size="12" fill="#1a1a1a">SEC_GND</text>
  <text x="460" y="325" font-size="12" fill="#1a1a1a">VB</text>

  <rect x="690" y="140" width="16" height="60" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="698" y="215" font-size="12" text-anchor="middle" fill="#1a1a1a">L_P, R_P</text>

  <rect x="760" y="130" width="16" height="60" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="792" y="165" font-size="12" text-anchor="middle" fill="#1a1a1a">L_SA</text>
  <rect x="760" y="210" width="16" height="60" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="792" y="245" font-size="12" text-anchor="middle" fill="#1a1a1a">L_SB</text>

  <rect x="725" y="160" width="16" height="80" rx="2" fill="#6b7280"/>
  <path d="M 733 145 L 733 130 M 728 135 L 733 130 L 738 135 M 733 255 L 733 270 M 728 265 L 733 270 L 738 265" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <text x="733" y="120" font-size="12" text-anchor="middle" fill="#6b7280">Переміщення</text>

  <rect x="50" y="370" width="240" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="390" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Похибка (дрейф чутливості):</text>
  <text x="170" y="410" font-size="13" fill="#1a1a1a" text-anchor="middle">V_OUT прямо залежить від V_EXC</text>
  <text x="170" y="425" font-size="13" fill="#1a1a1a" text-anchor="middle">та втрат амплітуди в лінії</text>

  <rect x="350" y="370" width="240" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="470" y="390" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Вплив довгого кабелю:</text>
  <text x="470" y="410" font-size="13" fill="#1a1a1a" text-anchor="middle">Ємність шунтує сигнал,</text>
  <text x="470" y="425" font-size="13" fill="#1a1a1a" text-anchor="middle">спричиняючи спад амплітуди</text>

  <rect x="640" y="370" width="270" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="775" y="390" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Температурний дрейф LVDT:</text>
  <text x="775" y="410" font-size="13" fill="#1a1a1a" text-anchor="middle">R_P(T) = R_P0 (1 + α·ΔT)</text>
  <text x="775" y="425" font-size="13" fill="#1a1a1a" text-anchor="middle">Нагрів зменшує струм збудження</text>

</svg>
