  <rect x="330" y="100" width="280" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="470" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b7280">Довгий з'єднувальний кабель</text>

  <rect x="630" y="100" width="290" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="775" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b7280">Датчик LVDT (віддалено)</text>

