  <path d="M 190 330 L 150 330" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 90 290 L 45 290" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="65" y="282" font-size="13" text-anchor="middle" fill="#1a1a1a">V_OUT</text>

