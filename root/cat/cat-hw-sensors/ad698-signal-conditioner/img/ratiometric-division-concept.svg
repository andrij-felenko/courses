<svg viewBox="0 0 840 360" width="840" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="840" height="360" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="420" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Концепція раціометричного ділення</text>
  <text x="420" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Перетворення змінних напруг на відношення постійних усуває залежність від амплітуди збудження</text>

  <!-- Signal A -->
  <rect x="40" y="100" width="180" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="130" y="128" font-size="14" text-anchor="middle" fill="#1a1a1a">Змінний сигнал A</text>
  <text x="130" y="148" font-size="12" text-anchor="middle" fill="#6b7280">(від вторинної обмотки)</text>

  <line x1="220" y1="130" x2="280" y2="130" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Demod A -->
  <rect x="290" y="100" width="160" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="128" font-size="14" text-anchor="middle" fill="#1a1a1a">Демодулятор A</text>
  <text x="370" y="148" font-size="12" text-anchor="middle" fill="#6b7280">та фільтр</text>

  <line x1="450" y1="130" x2="570" y2="130" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="120" font-size="14" font-style="italic" text-anchor="middle" fill="#1a1a1a">V<tspan baseline-shift="sub" font-size="10">A(dc)</tspan></text>
  <text x="510" y="150" font-size="12" text-anchor="middle" fill="#6b7280">(чисельник)</text>

  <!-- Signal B -->
  <rect x="40" y="200" width="180" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="130" y="228" font-size="14" text-anchor="middle" fill="#1a1a1a">Змінний сигнал B</text>
  <text x="130" y="248" font-size="12" text-anchor="middle" fill="#6b7280">(опорний / збудження)</text>

  <line x1="220" y1="230" x2="280" y2="230" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Demod B -->
  <rect x="290" y="200" width="160" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="228" font-size="14" text-anchor="middle" fill="#1a1a1a">Демодулятор B</text>
  <text x="370" y="248" font-size="12" text-anchor="middle" fill="#6b7280">та фільтр</text>

  <line x1="450" y1="230" x2="570" y2="230" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="220" font-size="14" font-style="italic" text-anchor="middle" fill="#1a1a1a">V<tspan baseline-shift="sub" font-size="10">B(dc)</tspan></text>
  <text x="510" y="250" font-size="12" text-anchor="middle" fill="#6b7280">(знаменник)</text>

  <!-- Divider -->
  <rect x="580" y="110" width="120" height="140" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="640" y="175" font-size="14" text-anchor="middle" fill="#1a1a1a">Блок ділення</text>
  <text x="640" y="195" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle" fill="#27ae60">A / B</text>

  <!-- Output -->
  <line x1="700" y1="180" x2="780" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="740" y="170" font-size="14" font-style="italic" font-weight="bold" text-anchor="middle" fill="#1a1a1a">V<tspan baseline-shift="sub" font-size="10">out</tspan></text>

</svg>
