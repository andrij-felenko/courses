<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двополюсний активний ФНЧ та компенсація фази в AD698</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Схема на внутрішніх ОП для пригнічення пульсацій несучої та узгодження фаз</text>

  <!-- Left block: Phase Compensation -->
  <rect x="60" y="110" width="280" height="260" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="200" y="140" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фазова компенсація</text>
  <text x="200" y="160" font-size="12" fill="#6b7280" text-anchor="middle">(узгодження фаз)</text>
  
  <line x1="80" y1="240" x2="140" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="80" y="230" font-size="12" fill="#1a1a1a">Від LVDT</text>
  
  <line x1="140" y1="225" x2="140" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="148" y1="225" x2="148" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="148" y1="240" x2="220" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="144" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">C_comp</text>
  
  <circle cx="220" cy="240" r="4" fill="#1a1a1a"/>
  <line x1="220" y1="240" x2="220" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="210" y="270" width="20" height="40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="220" y1="310" x2="220" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Ground -->
  <line x1="205" y1="330" x2="235" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="212" y1="335" x2="228" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="217" y1="340" x2="223" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <text x="240" y="295" font-size="12" fill="#1a1a1a">R_comp</text>

  <line x1="220" y1="240" x2="310" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="230" y="230" font-size="12" fill="#1a1a1a">До демодулятора</text>

  <path d="M 310 240 L 370 240" stroke="#2457d6" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Right block: Active Low-Pass Filter -->
  <rect x="370" y="110" width="560" height="260" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="650" y="140" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Активний ФНЧ 2-го порядку (Sallen-Key)</text>
  <text x="650" y="160" font-size="12" fill="#6b7280" text-anchor="middle">(пригнічення пульсацій несучої)</text>

  <line x1="390" y1="240" x2="500" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="390" y="230" font-size="12" fill="#1a1a1a">Від демодулятора</text>

  <!-- R1 -->
  <rect x="500" y="230" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="520" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">R1</text>
  
  <line x1="540" y1="240" x2="580" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="560" cy="240" r="4" fill="#1a1a1a"/>

  <!-- C1 feedback -->
  <line x1="560" y1="240" x2="560" y2="213" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="545" y1="213" x2="575" y2="213" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="545" y1="207" x2="575" y2="207" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="207" x2="560" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="535" y="215" font-size="12" fill="#1a1a1a" text-anchor="end">C1</text>
  
  <line x1="560" y1="180" x2="820" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="180" x2="820" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- R2 -->
  <rect x="580" y="230" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">R2</text>

  <line x1="620" y1="240" x2="700" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- C2 -->
  <circle cx="650" cy="240" r="4" fill="#1a1a1a"/>
  <line x1="650" y1="240" x2="650" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="635" y1="280" x2="665" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="635" y1="286" x2="665" y2="286" stroke="#1a1a1a" stroke-width="2"/>
  <text x="625" y="285" font-size="12" fill="#1a1a1a" text-anchor="end">C2</text>
  <line x1="650" y1="286" x2="650" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- C2 Ground -->
  <line x1="635" y1="310" x2="665" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="642" y1="315" x2="658" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="647" y1="320" x2="653" y2="320" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Op-Amp -->
  <polygon points="700,200 700,280 790,240" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="715" y="235" font-size="16" fill="#1a1a1a">+</text>
  <text x="715" y="265" font-size="16" fill="#1a1a1a">-</text>
  <text x="725" y="245" font-size="12" fill="#6b7280">ОП</text>
  
  <!-- Output -->
  <line x1="790" y1="240" x2="900" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="830" y="230" font-size="12" fill="#1a1a1a">До АЦП</text>
  <circle cx="820" cy="240" r="4" fill="#1a1a1a"/>

  <!-- Inverting feedback -->
  <line x1="820" y1="240" x2="820" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="340" x2="680" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="340" x2="680" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="255" x2="700" y2="255" stroke="#1a1a1a" stroke-width="2"/>

</svg>
