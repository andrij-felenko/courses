<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Схемотехніка I2C VCM-драйвера та придушення резонансного дзвону
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Архітектура інтегральних мікросхем DW9714 / DRV201 та формування S-кривої струму
  </text>

  <!-- Left: IC Block Diagram -->
  <rect x="40" y="90" width="410" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="90" width="410" height="34" rx="10" fill="#0284c7"/>
  <text x="245" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Архітектура VCM Driver IC (I2C 10-бітний ЦАП)
  </text>

  <!-- I2C Bus Block -->
  <rect x="60" y="145" width="130" height="70" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="125" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Шина I2C</text>
  <text x="125" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">SCL / SDA (400 кГц)</text>

  <line x1="190" y1="180" x2="225" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Logic & Anti-Ringing Digital Filter -->
  <rect x="230" y="145" width="190" height="70" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="325" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Anti-Ringing Filter</text>
  <text x="325" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">S-Curve / Двокроковий імпульс</text>
  <text x="325" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Програмована затримка Ts</text>

  <!-- Connect Filter down to 10-bit DAC -->
  <path d="M 325 215 L 325 245" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 10-bit DAC -->
  <rect x="230" y="250" width="190" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="325" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">10-бітний ЦАП</text>
  <text x="325" y="295" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">1024 рівні струму</text>

  <!-- Connect DAC down to Op-Amp Current Source -->
  <path d="M 325 310 L 325 335" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Linear Current Source & Coil Pins -->
  <rect x="60" y="340" width="360" height="130" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">
    Лінійне джерело постійного струму (Sink/Source)
  </text>
  <text x="75" y="395" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Діапазон струму: I_out = 0 .. 100 мА (крок ~98 мкА)</text>
  <text x="75" y="418" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Підключення котушки VCM: клеми OUT+ та OUT-</text>
  <text x="75" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0">• Вбудований захист від зворотного викиду індуктивності</text>
  <text x="75" y="460" font-family="monospace" font-size="10" fill="#38bdf8">Опір котушки R_vcm ≈ 20..30 Ом, L ≈ 1..2 мГн</text>

  <!-- Right: Step Response Comparison Graphs -->
  <rect x="490" y="90" width="430" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="490" y="90" width="430" height="34" rx="10" fill="#4338ca"/>
  <text x="705" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Порівняння перехідних процесів VCM
  </text>

  <!-- Graph 1: Undamped Step (Severe Ringing) -->
  <g transform="translate(510, 140)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">
      1. Звичайний стрибок струму (Undamped Step):
    </text>
    <!-- Axis -->
    <line x1="20" y1="100" x2="380" y2="100" stroke="#64748b" stroke-width="1"/>
    <line x1="20" y1="100" x2="20" y2="30" stroke="#64748b" stroke-width="1"/>
    <!-- Target Level Dash -->
    <line x1="20" y1="55" x2="380" y2="55" stroke="#475569" stroke-dasharray="3" stroke-width="1"/>
    <!-- Oscillating Curve -->
    <path d="M 20 100 L 40 100 L 60 35 L 90 75 L 120 45 L 150 63 L 180 52 L 220 55 L 370 55" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="80" y="30" font-family="monospace" font-size="10" fill="#f43f5e">Дзвін f0 ≈ 80 Гц</text>
    <text x="300" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Заспокоєння: 60..100 мс</text>
  </g>

  <!-- Graph 2: Advanced S-Curve Anti-Ringing Mode -->
  <g transform="translate(510, 275)">
    <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">
      2. Профільований струм драйвера (Anti-Ringing Mode):
    </text>
    <!-- Axis -->
    <line x1="20" y1="100" x2="380" y2="100" stroke="#64748b" stroke-width="1"/>
    <line x1="20" y1="100" x2="20" y2="30" stroke="#64748b" stroke-width="1"/>
    <!-- Target Level Dash -->
    <line x1="20" y1="55" x2="380" y2="55" stroke="#475569" stroke-dasharray="3" stroke-width="1"/>
    <!-- Smooth Aperiodic Curve -->
    <path d="M 20 100 L 40 100 Q 60 98 80 75 Q 100 55 125 55 L 370 55" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="260" y="45" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">
      Швидке зведення: 10..15 мс
    </text>
  </g>

  <!-- Bottom Note -->
  <rect x="510" y="415" width="390" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="525" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
    Метод Anti-Ringing подає імпульс половинної амплітуди
  </text>
  <text x="525" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">
    із затримкою T_delay = 1 / (2 * f0), повністю гасячи фазу коливання.
  </text>
</svg>