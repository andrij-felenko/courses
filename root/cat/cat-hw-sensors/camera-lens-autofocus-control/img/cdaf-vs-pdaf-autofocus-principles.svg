<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    Алгоритми фокусування: Контрастний (CDAF) проти Фазового (PDAF)
  </text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Метод сходження на пагорб яскравості (Hill-Climbing) та прямий вимір розсіювання фази
  </text>

  <!-- Left: Contrast Detection Autofocus (CDAF) -->
  <rect x="40" y="90" width="425" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="90" width="425" height="34" rx="10" fill="#0369a1"/>
  <text x="252" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    1. Контрастний автофокус (CDAF)
  </text>

  <!-- CDAF Curve -->
  <g transform="translate(60, 140)">
    <!-- Axes -->
    <line x1="40" y1="160" x2="360" y2="160" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="40" y2="20" stroke="#64748b" stroke-width="1.5"/>
    <text x="200" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Положення лінзи VCM (Z-вісь)</text>
    <text x="25" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" transform="rotate(-90 25 90)">Контраст</text>

    <!-- Gaussian-like Peak Curve -->
    <path d="M 50 150 Q 150 145 200 45 Q 250 145 350 150" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Hill Climbing Points and Search Arrows -->
    <circle cx="90" cy="148" r="4" fill="#f59e0b"/>
    <circle cx="140" cy="120" r="4" fill="#f59e0b"/>
    <circle cx="180" cy="65" r="4" fill="#f59e0b"/>
    <circle cx="200" cy="45" r="5" fill="#10b981"/>
    <circle cx="230" cy="85" r="4" fill="#f43f5e"/>

    <!-- Overshoot hunting arrow -->
    <path d="M 90 135 L 130 112" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 140 105 L 175 58" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 180 50 L 198 40" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 205 45 L 225 78" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- Return Arrow -->
    <path d="M 230 95 Q 215 110 202 55" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3"/>

    <text x="200" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Пік чіткості</text>
  </g>

  <!-- CDAF Description -->
  <rect x="60" y="340" width="385" height="135" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="75" y="362" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Особливості роботи CDAF:</text>
  <text x="75" y="382" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Фільтр просторових градієнтів (Tenengrad / Sobel).</text>
  <text x="75" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Не знає напрямку фокусу (потребує пробного руху).</text>
  <text x="75" y="418" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Потребує проходження піку для його виявлення (Overshoot),</text>
  <text x="75" y="436" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">  через що виникає помітне дихання фокусу (Hunting).</text>
  <text x="75" y="456" font-family="monospace" font-size="11" fill="#f87171">Час зведення: 200..600 мс (повільно)</text>

  <!-- Right: Phase Detection Autofocus (PDAF) -->
  <rect x="495" y="90" width="425" height="400" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="495" y="90" width="425" height="34" rx="10" fill="#047857"/>
  <text x="707" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    2. Фазовий автофокус (PDAF / 2PD)
  </text>

  <!-- PDAF Optical Split Diagram -->
  <g transform="translate(515, 140)">
    <!-- Micro Lens and Split Pixels -->
    <rect x="40" y="30" width="130" height="90" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Мікролінза</text>

    <!-- Left / Right Photodiode Split -->
    <rect x="55" y="70" width="45" height="40" fill="#0284c7"/>
    <text x="77" y="95" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">L</text>
    <rect x="105" y="70" width="45" height="40" fill="#d97706"/>
    <text x="127" y="95" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">R</text>

    <!-- Phase Shift Waveforms on Right -->
    <rect x="200" y="20" width="170" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="285" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Зсув сигналів L та R:</text>
    <!-- Wave L -->
    <path d="M 215 85 Q 235 55 255 85 Q 275 115 295 85 Q 315 55 335 85" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Wave R shifted -->
    <path d="M 235 85 Q 255 55 275 85 Q 295 115 315 85 Q 335 55 355 85" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3"/>

    <!-- Disparity Delta X -->
    <line x1="255" y1="48" x2="275" y2="48" stroke="#ec4899" stroke-width="1.8"/>
    <text x="265" y="44" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ec4899">Δx (Фаза)</text>
    <text x="285" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Δx &gt; 0: фронт, Δx &lt; 0: бек-фокус</text>
  </g>

  <!-- PDAF Description -->
  <rect x="515" y="340" width="385" height="135" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="530" y="362" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Особливості роботи PDAF:</text>
  <text x="530" y="382" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Миттєво обчислює величину і знак дефокусування.</text>
  <text x="530" y="400" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Привід VCM переміщується в цільову точку за 1 рух.</text>
  <text x="530" y="418" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Повна відсутність візуального дихання фокусу.</text>
  <text x="530" y="436" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Знижує чутливість в умовах слабкого освітлення (&lt; 5 люкс).</text>
  <text x="530" y="456" font-family="monospace" font-size="11" fill="#34d399">Час зведення: 15..40 мс (миттєво)</text>
</svg>