<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція структури MEMS-давачів тиску Bosch</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Перехід від п'єзорезистивного вимірювання (BMP180) до ємнісної структури в LGA (BMP280)</text>

  <!-- LEFT PANEL: BMP180 -->
  <rect x="25" y="78" width="440" height="432" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Header Badge -->
  <rect x="40" y="92" width="410" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="114" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">BMP180: П'єзорезистор + Керамічний LCC-7</text>

  <!-- Atmospheric Pressure Arrow -->
  <text x="245" y="144" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Атмосферний тиск (P)</text>
  <line x1="245" y1="150" x2="245" y2="173" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Metal Cap Lid -->
  <path d="M 65 310 L 65 175 L 210 175 L 210 185 L 280 185 L 280 175 L 425 175 L 425 310" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- Protective Gel Layer -->
  <rect x="67" y="185" width="356" height="57" fill="#ffedd5" opacity="0.75"/>

  <!-- Callouts for Gel & Piezoresistors inside panel -->
  <text x="160" y="206" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">П'єзорезистори</text>
  <line x1="175" y1="212" x2="198" y2="238" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <text x="330" y="206" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Захисний гель</text>
  <line x1="330" y1="212" x2="330" y2="226" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Piezoresistor Elements on Diaphragm Surface -->
  <rect x="198" y="242" width="18" height="6" rx="2" fill="#c0392b" stroke="#7f1d1d" stroke-width="1"/>
  <rect x="274" y="242" width="18" height="6" rx="2" fill="#c0392b" stroke="#7f1d1d" stroke-width="1"/>

  <!-- Silicon Die -->
  <rect x="115" y="248" width="260" height="62" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

  <!-- Etched Cavity inside silicon -->
  <polygon points="175,310 200,260 290,260 315,310" fill="#f4f6f8" stroke="#475569" stroke-width="1.5"/>
  <text x="245" y="278" font-size="12" fill="#475569" text-anchor="middle"><tspan x="245" dy="0">Травлена</tspan><tspan x="245" dy="14">порожнина</tspan></text>

  <!-- Wire Bonds -->
  <path d="M 125 248 C 125 228 75 240 75 310" fill="none" stroke="#d97706" stroke-width="2"/>
  <path d="M 365 248 C 365 228 415 240 415 310" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Ceramic Substrate -->
  <rect x="55" y="310" width="380" height="30" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="245" y="330" font-size="12" fill="#334155" text-anchor="middle">Керамічна основа LCC-7 (3.6 × 3.8 мм)</text>

  <!-- Substrate Contacts (LCC Pins) -->
  <rect x="75" y="340" width="25" height="6" fill="#d97706"/>
  <rect x="125" y="340" width="25" height="6" fill="#d97706"/>
  <rect x="175" y="340" width="25" height="6" fill="#d97706"/>
  <rect x="232" y="340" width="26" height="6" fill="#d97706"/>
  <rect x="290" y="340" width="25" height="6" fill="#d97706"/>
  <rect x="340" y="340" width="25" height="6" fill="#d97706"/>
  <rect x="390" y="340" width="25" height="6" fill="#d97706"/>

  <!-- BMP180 Summary Card (Drawbacks) -->
  <rect x="40" y="358" width="410" height="122" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="358" width="410" height="26" rx="6" fill="#fdecea"/>
  <text x="52" y="376" font-size="12" font-weight="bold" fill="#c0392b">Особливості п'єзорезистивної схеми (BMP180):</text>
  <text x="52" y="400" font-size="12" fill="#1a1a1a">• Високий струм моста (~12 мкА) → швидкий розряд батареї</text>
  <text x="52" y="420" font-size="12" fill="#1a1a1a">• Дрейф від температурного розширення силіконового гелю</text>
  <text x="52" y="440" font-size="12" fill="#1a1a1a">• Потреба в складній індивідуальній калібровці моста</text>
  <text x="52" y="460" font-size="12" fill="#1a1a1a">• Велика площа корпусу: 13.7 мм² (метало-кераміка)</text>

  <!-- RIGHT PANEL: BMP280 -->
  <rect x="495" y="78" width="440" height="432" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Right Header Badge -->
  <rect x="510" y="92" width="410" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="114" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">BMP280: Ємнісний сенсор + LGA-8</text>

  <!-- Atmospheric Pressure Arrow -->
  <text x="715" y="144" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Атмосферний тиск (P)</text>
  <line x1="715" y1="150" x2="715" y2="173" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Metal Cap Lid -->
  <path d="M 535 310 L 535 175 L 680 175 L 680 185 L 750 185 L 750 175 L 895 175 L 895 310" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- Callouts for Moving Membrane & Vacuum Cavity -->
  <text x="610" y="206" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Рухома мембрана</text>
  <line x1="620" y1="212" x2="655" y2="248" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="820" y="206" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Вакуумна камера</text>
  <line x1="810" y1="212" x2="780" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Silicon Die with ASIC & MEMS -->
  <rect x="580" y="240" width="270" height="70" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

  <!-- Integrated ASIC Block -->
  <rect x="590" y="248" width="45" height="54" rx="3" fill="#475569" stroke="#334155"/>
  <text x="612" y="280" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ASIC</text>

  <!-- Vacuum Reference Cavity -->
  <rect x="650" y="262" width="185" height="36" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="742" y="284" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">C(P) = ε·S / d (Вакуум)</text>

  <!-- Fixed Bottom Electrode -->
  <rect x="660" y="291" width="165" height="4" rx="1" fill="#2563eb"/>

  <!-- Moving Top Membrane (blue curved flexible silicon) -->
  <path d="M 650 252 Q 742 260 835 252 L 835 260 Q 742 268 650 260 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>

  <!-- Substrate (LGA Base) -->
  <rect x="530" y="310" width="370" height="30" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="715" y="330" font-size="12" fill="#94a3b8" text-anchor="middle">LGA-8 корпус (2.0 × 2.5 × 0.95 мм)</text>

  <!-- LGA Contact Pads -->
  <rect x="545" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="590" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="635" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="680" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="725" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="770" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="815" y="340" width="22" height="6" fill="#d97706"/>
  <rect x="860" y="340" width="22" height="6" fill="#d97706"/>

  <!-- BMP280 Summary Card (Advantages) -->
  <rect x="510" y="358" width="410" height="122" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="510" y="358" width="410" height="26" rx="6" fill="#e9f7ef"/>
  <text x="522" y="376" font-size="12" font-weight="bold" fill="#27ae60">Переваги ємнісної схеми (BMP280):</text>
  <text x="522" y="400" font-size="12" fill="#1a1a1a">• Ультранизьке споживання (2.7 мкА @ 1 Гц)</text>
  <text x="522" y="420" font-size="12" fill="#1a1a1a">• Відсутність гелю → висока термостабільність</text>
  <text x="522" y="440" font-size="12" fill="#1a1a1a">• Вбудований IIR-фільтр та передискретизація</text>
  <text x="522" y="460" font-size="12" fill="#1a1a1a">• Зменшення площі на 63% (всього 5.0 мм²)</text>
</svg>
