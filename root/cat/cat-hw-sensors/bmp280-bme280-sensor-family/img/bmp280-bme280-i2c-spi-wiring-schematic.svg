<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема електричного підключення BMP280 / BME280</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Конфігурація шин I²C та SPI, вибір адреси через SDO/CSB та узгодження рівнів 3.3V/5V</text>

  <!-- PANEL 1: I2C Interface -->
  <g id="panel-i2c">
    <rect x="30" y="70" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="247" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Інтерфейс I²C (Живлення 5V через Конвертер Рівнів)</text>

    <!-- MCU Block (5V) -->
    <rect x="45" y="112" width="105" height="240" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="97" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
    <text x="97" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">(5V Логіка)</text>

    <text x="142" y="174" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="end">5V</text>
    <text x="142" y="209" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>
    <text x="142" y="244" font-size="12" fill="#2457d6" text-anchor="end">SDA</text>
    <text x="142" y="279" font-size="12" fill="#8b5cf6" text-anchor="end">SCL</text>

    <!-- Level Shifter Block (LLC) -->
    <rect x="195" y="112" width="105" height="240" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="247" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LLC Конвертер</text>
    <text x="247" y="148" font-size="12" fill="#6b7280" text-anchor="middle">(5V ↔ 3.3V)</text>

    <text x="202" y="174" font-size="12" fill="#c0392b" text-anchor="start">HV</text>
    <text x="202" y="209" font-size="12" fill="#1a1a1a" text-anchor="start">GND</text>
    <text x="202" y="244" font-size="12" fill="#2457d6" text-anchor="start">HV1</text>
    <text x="202" y="279" font-size="12" fill="#8b5cf6" text-anchor="start">HV2</text>

    <text x="293" y="174" font-size="12" fill="#27ae60" text-anchor="end">LV</text>
    <text x="293" y="209" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>
    <text x="293" y="244" font-size="12" fill="#2457d6" text-anchor="end">LV1</text>
    <text x="293" y="279" font-size="12" fill="#8b5cf6" text-anchor="end">LV2</text>

    <!-- Sensor Block (3.3V Max) -->
    <rect x="345" y="112" width="105" height="240" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="397" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BMP / BME280</text>
    <text x="397" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">(3.3V Max)</text>

    <text x="352" y="174" font-size="12" fill="#27ae60" text-anchor="start">VDD</text>
    <text x="352" y="209" font-size="12" fill="#1a1a1a" text-anchor="start">GND</text>
    <text x="352" y="244" font-size="12" fill="#2457d6" text-anchor="start">SDI</text>
    <text x="352" y="279" font-size="12" fill="#8b5cf6" text-anchor="start">SCK</text>
    <text x="352" y="309" font-size="12" fill="#27ae60" text-anchor="start">CSB</text>
    <text x="352" y="334" font-size="12" fill="#6b7280" text-anchor="start">SDO</text>

    <!-- Wiring MCU to LLC -->
    <line x1="150" y1="170" x2="195" y2="170" stroke="#c0392b" stroke-width="2"/>
    <line x1="150" y1="205" x2="195" y2="205" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="150" y1="240" x2="195" y2="240" stroke="#2457d6" stroke-width="2"/>
    <line x1="150" y1="275" x2="195" y2="275" stroke="#8b5cf6" stroke-width="2"/>

    <text x="172" y="232" font-size="12" fill="#2457d6" text-anchor="middle">SDA</text>
    <text x="172" y="267" font-size="12" fill="#8b5cf6" text-anchor="middle">SCL</text>

    <!-- Wiring LLC to Sensor -->
    <line x1="300" y1="170" x2="345" y2="170" stroke="#27ae60" stroke-width="2"/>
    <line x1="300" y1="205" x2="345" y2="205" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="300" y1="240" x2="345" y2="240" stroke="#2457d6" stroke-width="2"/>
    <line x1="300" y1="275" x2="345" y2="275" stroke="#8b5cf6" stroke-width="2"/>

    <!-- CSB & SDO connections -->
    <!-- CSB tied to 3.3V VDD -->
    <path d="M 345 305 L 325 305 L 325 170" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="325" cy="170" r="3" fill="#27ae60"/>

    <text x="318" y="301" font-size="12" fill="#27ae60" text-anchor="end">CSB=1 (I²C)</text>

    <!-- SDO address selection -->
    <path d="M 345 330 L 330 330 L 330 348" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="325" y="352" font-size="12" fill="#6b7280" text-anchor="end">SDO=0/1</text>

    <!-- Lower Callout / Note Box I2C -->
    <rect x="45" y="365" width="405" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="57" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості підключення I²C:</text>
    <text x="57" y="405" font-size="12" fill="#1a1a1a">• CSB → 3.3V (VDD): вибір режиму I²C (CSB=High)</text>
    <text x="57" y="425" font-size="12" fill="#1a1a1a">• SDO → GND = 0x76 (default) | SDO → 3.3V = 0x77</text>
    <text x="57" y="445" font-size="12" fill="#1a1a1a">• Pull-up резистори 4.7 кОм на SDA/SCL до 3.3V</text>
    <text x="57" y="465" font-size="12" fill="#c0392b" font-weight="bold">• LLC (Level Shifter) захищає 3.3V давач від 5V MCU</text>
    <text x="57" y="485" font-size="12" fill="#c0392b">• Максимальна напруга живлення VDD / VDDIO ≤ 3.6V</text>
  </g>

  <!-- PANEL 2: SPI Interface -->
  <g id="panel-spi">
    <rect x="495" y="70" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="712" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Інтерфейс SPI (4-провідний / 3-провідний, 3.3V)</text>

    <!-- MCU Block (3.3V) -->
    <rect x="515" y="112" width="135" height="240" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="582" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
    <text x="582" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">(3.3V Логіка)</text>

    <text x="642" y="174" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="end">3.3V (VCC)</text>
    <text x="642" y="204" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>
    <text x="642" y="234" font-size="12" fill="#d97706" font-weight="bold" text-anchor="end">GPIO (CS)</text>
    <text x="642" y="264" font-size="12" fill="#8b5cf6" text-anchor="end">SCK (Clock)</text>
    <text x="642" y="294" font-size="12" fill="#2457d6" text-anchor="end">MOSI (SDI)</text>
    <text x="642" y="324" font-size="12" fill="#27ae60" text-anchor="end">MISO (SDO)</text>

    <!-- Sensor Block (SPI Mode) -->
    <rect x="775" y="112" width="140" height="240" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="845" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BMP / BME280</text>
    <text x="845" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(Режим SPI)</text>

    <text x="783" y="174" font-size="12" fill="#27ae60" text-anchor="start">VDD / VDDIO</text>
    <text x="783" y="204" font-size="12" fill="#1a1a1a" text-anchor="start">GND</text>
    <text x="783" y="234" font-size="12" fill="#d97706" font-weight="bold" text-anchor="start">CSB (Select)</text>
    <text x="783" y="264" font-size="12" fill="#8b5cf6" text-anchor="start">SCK (SCL)</text>
    <text x="783" y="294" font-size="12" fill="#2457d6" text-anchor="start">SDI (MOSI)</text>
    <text x="783" y="324" font-size="12" fill="#27ae60" text-anchor="start">SDO (MISO)</text>

    <!-- Wiring MCU to Sensor SPI -->
    <line x1="650" y1="170" x2="775" y2="170" stroke="#27ae60" stroke-width="2"/>
    <line x1="650" y1="200" x2="775" y2="200" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="650" y1="230" x2="775" y2="230" stroke="#d97706" stroke-width="2" marker-end="url(#arr-dark)"/>
    <line x1="650" y1="260" x2="775" y2="260" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-dark)"/>
    <line x1="650" y1="290" x2="775" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="775" y1="320" x2="650" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

    <text x="712" y="162" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">3.3V</text>
    <text x="712" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">GND</text>
    <text x="712" y="222" font-size="12" fill="#d97706" font-weight="bold" text-anchor="middle">CSB (Chip Select)</text>
    <text x="712" y="252" font-size="12" fill="#8b5cf6" text-anchor="middle">SCK (ТАКТ)</text>
    <text x="712" y="282" font-size="12" fill="#2457d6" text-anchor="middle">SDI (MOSI)</text>
    <text x="712" y="312" font-size="12" fill="#27ae60" text-anchor="middle">SDO (MISO)</text>

    <!-- Lower Callout / Note Box SPI -->
    <rect x="510" y="365" width="405" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="522" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості підключення SPI:</text>
    <text x="522" y="405" font-size="12" fill="#1a1a1a">• CSB → GPIO MCU: низький рівень (0V) вибирає чип</text>
    <text x="522" y="425" font-size="12" fill="#1a1a1a">• 4-wire SPI: CSB, SCK, SDI (MOSI), SDO (MISO)</text>
    <text x="522" y="445" font-size="12" fill="#1a1a1a">• 3-wire SPI: SDO не підключається, SDI двонапрямлена</text>
    <text x="522" y="465" font-size="12" fill="#27ae60" font-weight="bold">• Висока швидкість обміну (до 10 МГц SPI Clock)</text>
    <text x="522" y="485" font-size="12" fill="#6b7280">• Пряме 3.3V підключення без подтягуючих резисторів</text>
  </g>
</svg>
