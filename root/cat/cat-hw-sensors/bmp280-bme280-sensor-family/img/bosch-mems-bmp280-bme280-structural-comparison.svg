<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Структурне порівняння MEMS-чипів Bosch BMP280 та BME280</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">BME280 розширює барометричний BMP280 додаванням ємнісного сенсора вологості</text>

  <!-- PANEL 1: BMP280 (LEFT) -->
  <rect x="35" y="80" width="430" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="47" y="92" width="406" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="114" font-size="15" font-weight="bold" text-anchor="middle" fill="#2457d6">BMP280: Сенсор тиску та температури</text>

  <!-- BMP280 MEMS Cell Container -->
  <rect x="47" y="136" width="406" height="174" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">MEMS-сенсори BMP280</text>

  <!-- BMP280 Pressure Sensor Box -->
  <rect x="60" y="168" width="224" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="172" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Детектор тиску (P)</text>
  <line x1="172" y1="191" x2="172" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="162" y="204" font-size="11" text-anchor="end" fill="#2457d6">P_atm</text>
  <rect x="94" y="214" width="16" height="7" fill="#c0392b" rx="1"/>
  <rect x="234" y="214" width="16" height="7" fill="#c0392b" rx="1"/>
  <text x="102" y="209" font-size="11" text-anchor="middle" fill="#c0392b">R_p</text>
  <text x="242" y="209" font-size="11" text-anchor="middle" fill="#c0392b">R_p</text>
  <path d="M 76,221 Q 172,228 268,221" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="80" y="224" width="184" height="40" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="172" y="249" font-size="11" text-anchor="middle" fill="#6b7280">Вакуумна камера (P₀)</text>
  <text x="172" y="284" font-size="11" text-anchor="middle" fill="#2457d6">Міст Уітстона (ΔR/R)</text>

  <!-- BMP280 Temp Sensor Box -->
  <rect x="296" y="168" width="145" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="368" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Сенсор Temp (T)</text>
  <circle cx="368" cy="224" r="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="368" y="228" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">ΔV_be</text>
  <text x="368" y="260" font-size="11" text-anchor="middle" fill="#6b7280">P-N перехід</text>
  <text x="368" y="275" font-size="11" text-anchor="middle" fill="#6b7280">(Bandgap T)</text>

  <!-- BMP280 ASIC Container -->
  <rect x="47" y="332" width="406" height="124" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="368" y="347" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Обробка сигналів &amp; ASIC</text>

  <!-- BMP280 MUX / ADC Box -->
  <rect x="60" y="356" width="115" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="117" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">MUX / 20-bit</text>
  <text x="117" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">ΣΔ АЦП</text>
  <text x="117" y="405" font-size="10" text-anchor="middle" fill="#6b7280">2 канали (P, T)</text>

  <!-- BMP280 DSP / Calibration Box -->
  <rect x="190" y="356" width="130" height="60" rx="4" fill="#f4f6f8" stroke="#94a3b8"/>
  <text x="255" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IIR-фільтр</text>
  <text x="255" y="390" font-size="11" text-anchor="middle" fill="#1a1a1a">OTP-калібрування</text>
  <text x="255" y="405" font-size="10" text-anchor="middle" fill="#6b7280">Коефіцієнти NVM</text>

  <!-- BMP280 Interface Box -->
  <rect x="335" y="356" width="106" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="388" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Інтерфейс</text>
  <text x="388" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">I2C / SPI</text>
  <text x="388" y="405" font-size="10" text-anchor="middle" fill="#6b7280">SDA, SCL, CSB</text>

  <!-- Signal Lines BMP280 -->
  <path d="M 172,298 L 172,318 L 95,318 L 95,356" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 368,298 L 368,324 L 140,324 L 140,356" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="175" y1="386" x2="190" y2="386" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="320" y1="386" x2="335" y2="386" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BMP280 Summary Bar -->
  <rect x="47" y="464" width="406" height="28" rx="4" fill="#e2e8f0"/>
  <text x="250" y="482" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">Вимірює: Тиск (P) та Температуру (T)</text>


  <!-- PANEL 2: BME280 (RIGHT) -->
  <rect x="495" y="80" width="430" height="420" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="507" y="92" width="406" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="114" font-size="15" font-weight="bold" text-anchor="middle" fill="#27ae60">BME280: Тиск, Вологість та Температура</text>

  <!-- BME280 MEMS Cell Container -->
  <rect x="507" y="136" width="406" height="174" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">MEMS-сенсори BME280 (+ Ємнісний H)</text>

  <!-- BME280 Pressure Sensor Box -->
  <rect x="520" y="168" width="122" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="581" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Тиск (P)</text>
  <line x1="581" y1="191" x2="581" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="571" y="204" font-size="11" text-anchor="end" fill="#2457d6">P_atm</text>
  <path d="M 528,221 Q 581,228 634,221" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="531" y="224" width="100" height="40" rx="2" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="581" y="249" font-size="11" text-anchor="middle" fill="#6b7280">Вакуум P₀</text>

  <!-- BME280 Humidity Sensor Box (Highlighted Green) -->
  <rect x="649" y="168" width="142" height="130" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="655" y="172" width="130" height="18" rx="2" fill="#27ae60"/>
  <text x="720" y="185" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Вологість (H) ★</text>
  <rect x="661" y="204" width="118" height="5" fill="#94a3b8" rx="1"/>
  <rect x="661" y="242" width="118" height="5" fill="#94a3b8" rx="1"/>
  <rect x="661" y="209" width="118" height="33" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="3 2"/>
  <text x="720" y="229" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">C_RH (Полімер)</text>
  <text x="720" y="261" font-size="11" text-anchor="middle" fill="#27ae60">H₂O адсорбція</text>
  <text x="720" y="276" font-size="11" text-anchor="middle" fill="#6b7280">ΔC ~ відносна H</text>

  <!-- BME280 Temp Sensor Box -->
  <rect x="798" y="168" width="100" height="130" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="848" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Temp (T)</text>
  <circle cx="848" cy="224" r="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="848" y="228" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">ΔV_be</text>
  <text x="848" y="260" font-size="11" text-anchor="middle" fill="#6b7280">P-N пер.</text>
  <text x="848" y="275" font-size="11" text-anchor="middle" fill="#6b7280">Bandgap</text>

  <!-- BME280 ASIC Container -->
  <rect x="507" y="332" width="406" height="124" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="828" y="347" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Обробка сигналів &amp; ASIC</text>

  <!-- BME280 MUX / ADC Box -->
  <rect x="520" y="356" width="115" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="577" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">MUX / 20-bit</text>
  <text x="577" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">ΣΔ АЦП</text>
  <text x="577" y="405" font-size="10" text-anchor="middle" fill="#27ae60">3 канали: P, T, H</text>

  <!-- BME280 DSP / Calibration Box -->
  <rect x="650" y="356" width="130" height="60" rx="4" fill="#f4f6f8" stroke="#94a3b8"/>
  <text x="715" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IIR-фільтр</text>
  <text x="715" y="390" font-size="11" text-anchor="middle" fill="#1a1a1a">OTP-калібрування</text>
  <text x="715" y="405" font-size="10" text-anchor="middle" fill="#6b7280">Розширене NVM (P/T/H)</text>

  <!-- BME280 Interface Box -->
  <rect x="795" y="356" width="106" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="848" y="375" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Інтерфейс</text>
  <text x="848" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">I2C / SPI</text>
  <text x="848" y="405" font-size="10" text-anchor="middle" fill="#6b7280">SDA, SCL, CSB</text>

  <!-- Signal Lines BME280 -->
  <path d="M 581,298 L 581,318 L 540,318 L 540,356" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 720,298 L 720,322 L 577,322 L 577,356" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 848,298 L 848,326 L 614,326 L 614,356" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="635" y1="386" x2="650" y2="386" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="780" y1="386" x2="795" y2="386" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BME280 Status Tag -->
  <rect x="507" y="464" width="406" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="710" y="482" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Вимірює: Тиск (P), Вологість (H) та Температуру (T)</text>
</svg>
