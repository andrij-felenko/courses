<line x1="340.0" y1="171.0" x2="410.0" y2="217.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="488.2" y="76.1" width="167.6" height="55.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="572.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="572.0" dy="0.0">HMC5883L (Honeywell)</tspan><tspan x="572.0" dy="13.7">адреса I²C 0x1E</tspan><tspan x="572.0" dy="13.7">знято з виробництва ~2020</tspan></text>
