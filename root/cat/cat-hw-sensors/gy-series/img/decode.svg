<rect x="235.8" y="354.3" width="428.4" height="63.4" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">ЩО РОБИТИ: не вір шовкографії — запусти I²C-сканер.</tspan><tspan x="450.0" dy="15.0">Відповів 0x1E — це справжній HMC; відповів 0x0D — це QMC-клон,</tspan><tspan x="450.0" dy="15.0">і бібліотеку та адресу треба брати під QMC.</tspan></text>
