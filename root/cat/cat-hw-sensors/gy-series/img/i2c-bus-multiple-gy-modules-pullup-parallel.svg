<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралельне з'єднання вбудованих підтяжок I2C у модулях GY-серії</text>

  <!-- Rail: 3.3V -->
  <line x1="80" y1="70" x2="880" y2="70" stroke="#c0392b" stroke-width="2.5"/>
  <text x="70" y="75" font-size="12" fill="#c0392b" font-weight="700" text-anchor="end">VDD (3.3 В)</text>

  <!-- Rail: SDA -->
  <line x1="80" y1="180" x2="880" y2="180" stroke="#2980b9" stroke-width="2.5"/>
  <text x="70" y="185" font-size="12" fill="#2980b9" font-weight="700" text-anchor="end">SDA</text>

  <!-- Rail: SCL -->
  <line x1="80" y1="210" x2="880" y2="210" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="70" y="215" font-size="12" fill="#8e44ad" font-weight="700" text-anchor="end">SCL</text>

  <!-- Microcontroller Block -->
  <rect x="90" y="250" width="130" height="150" rx="8" fill="#eef2f8" stroke="#2457d6" stroke-width="2"/>
  <text x="155" y="280" font-size="12" fill="#2457d6" font-weight="700" text-anchor="middle">Мікроконтролер</text>
  <text x="155" y="300" font-size="10" fill="#555" text-anchor="middle">Master I2C</text>
  <circle cx="155" cy="180" r="4" fill="#2980b9"/>
  <circle cx="175" cy="210" r="4" fill="#8e44ad"/>
  <line x1="155" y1="180" x2="155" y2="250" stroke="#2980b9" stroke-width="1.8"/>
  <line x1="175" y1="210" x2="175" y2="250" stroke="#8e44ad" stroke-width="1.8"/>
  <text x="145" y="240" font-size="9" fill="#2980b9" text-anchor="end">SDA</text>
  <text x="185" y="240" font-size="9" fill="#8e44ad" text-anchor="start">SCL</text>

  <!-- Module 1: GY-521 -->
  <rect x="260" y="250" width="130" height="150" rx="8" fill="#fdfbf7" stroke="#27ae60" stroke-width="2"/>
  <text x="325" y="278" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Модуль 1 (GY-521)</text>
  <text x="325" y="296" font-size="9" fill="#666" text-anchor="middle">MPU-6050</text>
  <circle cx="310" cy="70" r="4" fill="#c0392b"/>
  <line x1="310" y1="70" x2="310" y2="105" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="303" y="105" width="14" height="28" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="325" y="123" font-size="9" fill="#1a1a1a">R1 (4.7 кОм)</text>
  <line x1="310" y1="133" x2="310" y2="180" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="310" cy="180" r="4" fill="#2980b9"/>
  <line x1="310" y1="180" x2="310" y2="250" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="335" y1="210" x2="335" y2="250" stroke="#8e44ad" stroke-width="1.5"/>
  <circle cx="335" cy="210" r="4" fill="#8e44ad"/>

  <!-- Module 2: GY-BMP280 -->
  <rect x="420" y="250" width="130" height="150" rx="8" fill="#fdfbf7" stroke="#27ae60" stroke-width="2"/>
  <text x="485" y="278" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Модуль 2 (GY-280)</text>
  <text x="485" y="296" font-size="9" fill="#666" text-anchor="middle">BMP280</text>
  <circle cx="470" cy="70" r="4" fill="#c0392b"/>
  <line x1="470" y1="70" x2="470" y2="105" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="463" y="105" width="14" height="28" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="485" y="123" font-size="9" fill="#1a1a1a">R2 (4.7 кОм)</text>
  <line x1="470" y1="133" x2="470" y2="180" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="470" cy="180" r="4" fill="#2980b9"/>
  <line x1="470" y1="180" x2="470" y2="250" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="495" y1="210" x2="495" y2="250" stroke="#8e44ad" stroke-width="1.5"/>
  <circle cx="495" cy="210" r="4" fill="#8e44ad"/>

  <!-- Module 3: GY-68 -->
  <rect x="580" y="250" width="130" height="150" rx="8" fill="#fdfbf7" stroke="#27ae60" stroke-width="2"/>
  <text x="645" y="278" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Модуль 3 (GY-68)</text>
  <text x="645" y="296" font-size="9" fill="#666" text-anchor="middle">BMP180</text>
  <circle cx="630" cy="70" r="4" fill="#c0392b"/>
  <line x1="630" y1="70" x2="630" y2="105" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="623" y="105" width="14" height="28" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="645" y="123" font-size="9" fill="#1a1a1a">R3 (4.7 кОм)</text>
  <line x1="630" y1="133" x2="630" y2="180" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="630" cy="180" r="4" fill="#2980b9"/>
  <line x1="630" y1="180" x2="630" y2="250" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="655" y1="210" x2="655" y2="250" stroke="#8e44ad" stroke-width="1.5"/>
  <circle cx="655" cy="210" r="4" fill="#8e44ad"/>

  <!-- Module 4: GY-271 -->
  <rect x="740" y="250" width="130" height="150" rx="8" fill="#fdfbf7" stroke="#27ae60" stroke-width="2"/>
  <text x="805" y="278" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Модуль 4 (GY-271)</text>
  <text x="805" y="296" font-size="9" fill="#666" text-anchor="middle">HMC5883L</text>
  <circle cx="790" cy="70" r="4" fill="#c0392b"/>
  <line x1="790" y1="70" x2="790" y2="105" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="783" y="105" width="14" height="28" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="805" y="123" font-size="9" fill="#1a1a1a">R4 (4.7 кОм)</text>
  <line x1="790" y1="133" x2="790" y2="180" stroke="#2980b9" stroke-width="1.5"/>
  <circle cx="790" cy="180" r="4" fill="#2980b9"/>
  <line x1="790" y1="180" x2="790" y2="250" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="815" y1="210" x2="815" y2="250" stroke="#8e44ad" stroke-width="1.5"/>
  <circle cx="815" cy="210" r="4" fill="#8e44ad"/>

  <!-- Bottom calculation banner -->
  <rect x="90" y="425" width="780" height="75" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="480" y="450" font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">
    Проблема: R_eq = 4.7 кОм / 4 = 1.175 кОм  (занадто малий результуючий опір шини)
  </text>
  <text x="480" y="470" font-size="9.5" fill="#1a1a1a" text-anchor="middle">
    Струм навантаження I = 3.3 В / 1.175 кОм ≈ 2.8 мА (наближається до межі 3 мА за стандартом I2C).
  </text>
  <text x="480" y="488" font-size="9.5" fill="#27ae60" font-weight="700" text-anchor="middle">
    Рішення: демонтувати резистори підтяжки з трьох модулів, залишивши лише одну пару 4.7 кОм на всій шині.
  </text>
</svg>
