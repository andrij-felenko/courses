<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">GY-модулі не однакові за живленням: три класи, які треба розрізняти</text>
<rect x="44.0" y="78.0" width="280.0" height="350.0" rx="13" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="184.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="184.0" dy="0.0">3.3 В — тільки</tspan></text>
<line x1="62.0" y1="148.0" x2="306.0" y2="148.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="184.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="184.0" dy="0.0">нема регулятора,</tspan><tspan x="184.0" dy="14.2">нема зсуву рівнів</tspan></text>
<text x="184.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">VCC = 3.3 В (макс 3.6)</text>
<text x="184.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">5 В спалить чип</text>
<text x="184.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">лог. виводи 3.3 В</text>
<text x="184.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">з 5-В МК — потрібен</text>
<text x="184.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зовнішній зсув рівнів</text>
<rect x="118.1" y="390.0" width="131.8" height="24.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="184.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="184.0" dy="0.0">напр. GY-BMP280-3.3</tspan></text>
<rect x="350.0" y="78.0" width="280.0" height="350.0" rx="13" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="490.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">5 В-сумісний</tspan><tspan x="490.0" dy="16.1">(повний)</tspan></text>
<line x1="368.0" y1="148.0" x2="612.0" y2="148.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="490.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">є LDO 3.3 В +</tspan><tspan x="490.0" dy="14.2">MOSFET-зсув на шині</tspan></text>
<text x="490.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">VCC = 3.3…5 В</text>
<text x="490.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">живи 5 В сміливо</text>
<text x="490.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виводи терплять 5 В</text>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">готовий до 5-В МК</text>
<text x="490.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(Arduino Uno) прямо</text>
<rect x="421.0" y="390.0" width="138.0" height="24.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">напр. GY-63 (MS5611)</tspan></text>
<rect x="656.0" y="78.0" width="280.0" height="350.0" rx="13" fill="#eef2f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="796.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="796.0" dy="0.0">з регулятором,</tspan><tspan x="796.0" dy="16.1">без зсуву</tspan></text>
<line x1="674.0" y1="148.0" x2="918.0" y2="148.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="796.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="796.0" dy="0.0">є LDO 3.3 В,</tspan><tspan x="796.0" dy="14.2">АЛЕ виводи 3.3 В</tspan></text>
<text x="796.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">VCC = 3.3…5 В</text>
<text x="796.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">живи 5 В — чип цілий</text>
<text x="796.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виводи лише 3.3 В!</text>
<text x="796.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">SCL/SDA з 5-В МК —</text>
<text x="796.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">радше зсув рівнів</text>
<rect x="717.7" y="390.0" width="156.6" height="24.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="796.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="796.0" dy="0.0">напр. GY-521 (MPU-6050)</tspan></text>
<rect x="228.2" y="463.2" width="523.6" height="61.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="483.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">ЗОЛОТЕ ПРАВИЛО: «живити 5 В» ≠ «5-вольтова логіка».</tspan><tspan x="490.0" dy="14.3">Наявність регулятора рятує ЧИП від 5 В на VCC, але виводи SDA/SCL/OUT можуть</tspan><tspan x="490.0" dy="14.3">лишатися 3.3-вольтовими — перевіряй саме їх, перш ніж чіпати 5-В мікроконтролер.</tspan></text>
</svg>