<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Конструктивні типи корпусів: SMD проти вивідних із PTFE</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Порівняння поверхневого монтажу (AHT20/21) та захищеного штирового модуля (AHT15/25)</text>

  <!-- Left: SMD DFN Package (AHT20/21) -->
  <rect x="40" y="85" width="370" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">SMD DFN-6 (AHT20 / AHT21)</text>

  <!-- Chip body representation -->
  <rect x="135" y="140" width="180" height="150" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="225" cy="215" r="30" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="225" cy="215" r="16" fill="#388bfd" opacity="0.4"/>
  <text x="225" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">Вхід пари</text>

  <!-- SMD Pads -->
  <rect x="115" y="160" width="18" height="20" rx="2" fill="#d29922"/>
  <rect x="115" y="200" width="18" height="20" rx="2" fill="#d29922"/>
  <rect x="115" y="240" width="18" height="20" rx="2" fill="#d29922"/>
  <rect x="317" y="160" width="18" height="20" rx="2" fill="#d29922"/>
  <rect x="317" y="200" width="18" height="20" rx="2" fill="#d29922"/>
  <rect x="317" y="240" width="18" height="20" rx="2" fill="#d29922"/>

  <!-- Info block -->
  <rect x="65" y="310" width="320" height="120" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">• Габарити: 3.0 x 3.0 x 1.0 мм</text>
  <text x="80" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Монтаж: Автоматизований SMD Reflow</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Час відгуку: τ₆₃% ≈ 8 секунд</text>
  <text x="80" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f85149">• Чутливий до флюсу та рідкої води</text>

  <!-- Right: Pin-through PTFE Module (AHT15/25) -->
  <rect x="435" y="85" width="375" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="622" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">Захищений модуль (AHT15 / AHT25)</text>

  <!-- Module body representation -->
  <rect x="525" y="140" width="195" height="110" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <!-- PTFE Membrane overlay -->
  <rect x="555" y="165" width="135" height="60" rx="4" fill="#1f242c" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="622" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">Водовідштовхувальна</text>
  <text x="622" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">мембрана ePTFE</text>

  <!-- 4 through-hole pins -->
  <line x1="560" y1="250" x2="560" y2="295" stroke="#d29922" stroke-width="3"/>
  <line x1="600" y1="250" x2="600" y2="295" stroke="#d29922" stroke-width="3"/>
  <line x1="640" y1="250" x2="640" y2="295" stroke="#d29922" stroke-width="3"/>
  <line x1="680" y1="250" x2="680" y2="295" stroke="#d29922" stroke-width="3"/>
  <text x="622" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">VDD | SDA | GND | SCL</text>

  <!-- Info block -->
  <rect x="460" y="315" width="325" height="115" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="475" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">• Клас захисту: IP67 (не боїться конденсату)</text>
  <text x="475" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Пропускає гази H₂O, затримує бруд та пил</text>
  <text x="475" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Зручне підключення кабелем або роз'ємом</text>
  <text x="475" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">• Ідеально для теплиць, вулиці та вентиляції</text>
</svg>