<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Внутрішня архітектура ASIC та конвеєр обробки AHT</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Апаратне калібрування на кристалі: пряма видача лінеаризованих 20-бітних даних</text>

  <!-- Main ASIC Box -->
  <rect x="40" y="85" width="770" height="260" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left: Sensing elements -->
  <rect x="65" y="115" width="190" height="90" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="160" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">МЕМС-комірка вологості</text>
  <text x="160" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Ємнісний полімерний сенсор</text>
  <text x="160" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">ΔC ~ відносна вологість</text>

  <rect x="65" y="230" width="190" height="90" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="160" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">Термодавач Bandgap</text>
  <text x="160" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Кремнієвий p-n перехід PTAT</text>
  <text x="160" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">Висока лінійність ΔV_be</text>

  <!-- Middle: ADC and DSP Trimming engine -->
  <line x1="255" y1="160" x2="310" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-aht)"/>
  <line x1="255" y1="275" x2="310" y2="220" stroke="#d29922" stroke-width="2" marker-end="url(#arr-aht)"/>

  <rect x="315" y="140" width="220" height="150" rx="8" fill="#1f242c" stroke="#3fb950" stroke-width="2"/>
  <text x="425" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">Вбудований цифровий процесор</text>
  <text x="425" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">1. Швидкісний сигма-дельта АЦП</text>
  <text x="425" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">2. OTP / NVM калібрувальна таблиця</text>
  <text x="425" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#7ee787" text-anchor="middle">3. Апаратний розрахунок DSP</text>
  <text x="425" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Повна компенсація нелінійності</text>

  <!-- Right: 20-bit Output registers and I2C -->
  <line x1="535" y1="215" x2="590" y2="215" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-aht)"/>

  <rect x="595" y="140" width="190" height="150" rx="8" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="690" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#bc8cff" text-anchor="middle">I2C Інтерфейс (0x38)</text>
  <text x="690" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">20-біт код RH</text>
  <text x="690" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">20-біт код Temp</text>
  <text x="690" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f0f6fc" text-anchor="middle">CRC-8 (AHT20/21/30)</text>
  <text x="690" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79c0ff" text-anchor="middle">Регістр статусу</text>

  <!-- Bottom: Linear Math Simplicity -->
  <rect x="40" y="360" width="770" height="95" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="425" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">Перевага архітектури AHT для розробника:</text>
  <text x="425" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc" text-anchor="middle">RH [%] = ((double)raw_H / 1048576.0) * 100.0;</text>
  <text x="425" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc" text-anchor="middle">T [°C] = ((double)raw_T / 1048576.0) * 200.0 - 50.0;</text>

  <defs>
    <marker id="arr-aht" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>