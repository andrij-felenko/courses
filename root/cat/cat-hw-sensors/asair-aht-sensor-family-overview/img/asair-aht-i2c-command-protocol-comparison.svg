<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Протокол I2C: відмінності AHT10 проти AHT20/AHT21/AHT30</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Команди ініціалізації, тригери вимірювання та структура пакетів із CRC-8</text>

  <!-- Left: AHT10 Protocol -->
  <rect x="40" y="85" width="370" height="365" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="225" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">Покоління 1: AHT10</text>

  <rect x="60" y="135" width="330" height="70" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="75" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">Команда ініціалізації:</text>
  <text x="75" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">0xE1, 0x08, 0x00</text>

  <rect x="60" y="215" width="330" height="70" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="75" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#58a6ff">Тригер вимірювання:</text>
  <text x="75" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">0xAC, 0x33, 0x00 (пауза 75 мс)</text>

  <rect x="60" y="295" width="330" height="90" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="75" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f85149">Формат відповіді (6 байтів):</text>
  <text x="75" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">[0] Статус | [1..2] Волога | [3] Змішаний</text>
  <text x="75" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">[4..5] Температура | БЕЗ CRC</text>

  <text x="225" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Вразливий до шумів на довгих лініях зв'язку</text>

  <!-- Right: AHT20/21/30 Protocol -->
  <rect x="435" y="85" width="375" height="365" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="622" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#3fb950" text-anchor="middle">Покоління 2: AHT20 / AHT21 / AHT30</text>

  <rect x="455" y="135" width="335" height="70" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="470" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Команда ініціалізації:</text>
  <text x="470" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#7ee787">0xBE, 0x08, 0x00 (Soft Reset: 0xBA)</text>

  <rect x="455" y="215" width="335" height="70" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="470" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Тригер вимірювання:</text>
  <text x="470" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#f0f6fc">0xAC, 0x33, 0x00 (пауза 80 мс)</text>

  <rect x="455" y="295" width="335" height="90" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1.5"/>
  <text x="470" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#3fb950">Формат відповіді (7 байтів з CRC8):</text>
  <text x="470" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9">[0] Статус | [1..2] Волога | [3] Змішаний</text>
  <text x="470" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">[4..5] Температура | [6] CRC-8 (Поліном 0x31)</text>

  <text x="622" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">100% захист від перешкод та бітових колізій</text>
</svg>