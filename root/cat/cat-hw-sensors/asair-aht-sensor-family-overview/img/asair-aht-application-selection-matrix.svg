<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Матриця вибору сенсора ASAIR під різні галузі</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Рекомендації інженера: умови середовища, форм-фактор та захист від вологи</text>

  <!-- 3 Application Columns -->
  <!-- Col 1: Smart Home / Consumer -->
  <rect x="40" y="85" width="245" height="365" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="40" y="85" width="245" height="35" rx="8" fill="#21262d"/>
  <text x="162" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">Розумний дім та побут</text>

  <rect x="55" y="135" width="215" height="50" rx="6" fill="#1f242c" stroke="#58a6ff" stroke-width="1"/>
  <text x="162" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">AHT20 / AHT21</text>

  <text x="55" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Переваги:</text>
  <text x="55" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Живлення 2.0 .. 5.5 В</text>
  <text x="55" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Пряме підключення до Arduino</text>
  <text x="55" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Мінімальна собівартість ($0.6-$0.9)</text>
  <text x="55" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Вбудований CRC-8</text>

  <rect x="55" y="330" width="215" height="100" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="65" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#79c0ff">Застосування:</text>
  <text x="65" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Кімнатні термостати</text>
  <text x="65" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Метеостанції Zigbee / ESP32</text>
  <text x="65" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Зволожувачі та очищувачі</text>

  <!-- Col 2: Agriculture & Industrial -->
  <rect x="302" y="85" width="245" height="365" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="302" y="85" width="245" height="35" rx="8" fill="#238636"/>
  <text x="424" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Агросектор та промисловість</text>

  <rect x="317" y="135" width="215" height="50" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1"/>
  <text x="424" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">AHT15 / AHT25</text>

  <text x="317" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Переваги:</text>
  <text x="317" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Водонепроникна мембрана IP67</text>
  <text x="317" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Захист від пилу, роси та бруду</text>
  <text x="317" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Штировий рознімний монтаж</text>
  <text x="317" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Стійкість до агресивних парів</text>

  <rect x="317" y="330" width="215" height="100" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="327" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7ee787">Застосування:</text>
  <text x="327" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Теплиці та гідропоніка</text>
  <text x="327" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Овочесховища та інкубатори</text>
  <text x="327" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Вентиляційні шахти HVAC</text>

  <!-- Col 3: Wearable & Ultra-Low-Power -->
  <rect x="565" y="85" width="245" height="365" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="565" y="85" width="245" height="35" rx="8" fill="#21262d"/>
  <text x="687" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#bc8cff" text-anchor="middle">Портативні IoT пристрої</text>

  <rect x="580" y="135" width="215" height="50" rx="6" fill="#1f242c" stroke="#bc8cff" stroke-width="1"/>
  <text x="687" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#bc8cff" text-anchor="middle">AHT30</text>

  <text x="580" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f0f6fc">Переваги:</text>
  <text x="580" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Мініатюрні розміри 2x2 мм</text>
  <text x="580" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Мінімальна теплова інерція</text>
  <text x="580" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Струм сну 0.25 мкА</text>
  <text x="580" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">• Швидкий старт вимірювання</text>

  <rect x="580" y="330" width="215" height="100" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#bc8cff">Застосування:</text>
  <text x="590" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Носимі фітнес-трекери</text>
  <text x="590" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Автономні маячки BLE / LoRaWAN</text>
  <text x="590" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e">• Тонкі смарт-картки та трекери вантажів</text>
</svg>