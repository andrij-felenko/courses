<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <text x="425" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Еволюція та модельний ряд сенсорів ASAIR AHT</text>
  <text x="425" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Розвиток від базового AHT10 до захищених AHT15/25 та ультракомпактного AHT30</text>

  <!-- Timeline axis -->
  <line x1="60" y1="210" x2="790" y2="210" stroke="#30363d" stroke-width="3"/>

  <!-- Model 1: AHT10 -->
  <circle cx="100" cy="210" r="14" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="100" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">1</text>
  <rect x="35" y="90" width="130" height="95" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">AHT10</text>
  <text x="100" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">DFN 3x3 мм</text>
  <text x="100" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">1.8 .. 3.6 В</text>
  <text x="100" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f85149" text-anchor="middle">Без CRC, 6 байт</text>

  <!-- Model 2: AHT15 -->
  <circle cx="230" cy="210" r="14" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="230" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">2</text>
  <rect x="165" y="235" width="130" height="95" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="230" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">AHT15</text>
  <text x="230" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Штировий модуль</text>
  <text x="230" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Мембрана PTFE</text>
  <text x="230" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">IP67 від пилу/води</text>

  <!-- Model 3: AHT20 -->
  <circle cx="370" cy="210" r="14" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="370" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">3</text>
  <rect x="305" y="90" width="130" height="95" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="370" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">AHT20</text>
  <text x="370" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">SMD DFN-6</text>
  <text x="370" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">2.0 .. 5.5 В (5V OK)</text>
  <text x="370" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">Додано CRC-8</text>

  <!-- Model 4: AHT21 -->
  <circle cx="510" cy="210" r="14" fill="#21262d" stroke="#bc8cff" stroke-width="2"/>
  <text x="510" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">4</text>
  <rect x="445" y="235" width="130" height="95" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">AHT21 / AHT21B</text>
  <text x="510" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Низький профіль</text>
  <text x="510" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">3x3x0.8 мм</text>
  <text x="510" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">Підвищена точність</text>

  <!-- Model 5: AHT25 -->
  <circle cx="640" cy="210" r="14" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="640" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d29922" text-anchor="middle">5</text>
  <rect x="575" y="90" width="130" height="95" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="640" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">AHT25</text>
  <text x="640" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Штировий модуль</text>
  <text x="640" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Крок 1.27 мм</text>
  <text x="640" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">AHT20 ядро + IP67</text>

  <!-- Model 6: AHT30 -->
  <circle cx="760" cy="210" r="14" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="760" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">6</text>
  <rect x="695" y="235" width="125" height="95" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="757" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">AHT30</text>
  <text x="757" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c9d1d9" text-anchor="middle">Ультракомпакт</text>
  <text x="757" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">2.0 x 2.0 мм</text>
  <text x="757" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">Нове покоління</text>

  <!-- Bottom Summary Bar -->
  <rect x="40" y="355" width="770" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">Ключові спільні характеристики родини AHT:</text>
  <text x="60" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Інтерфейс: I2C (фіксована адреса 0x38, частота Standard 100 кГц / Fast 400 кГц)</text>
  <text x="60" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">• Роздільна здатність: 20 біт на вологість та 20 біт на температуру</text>
  <text x="60" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3fb950">• Вбудована апаратна калібровка: прямолінійна формула RH = (raw_H / 2²⁰) * 100%</text>
</svg>