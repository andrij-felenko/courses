<path d="M 155.0 188.0 A 92 92 0 0 1 240.0 166.0" fill="none" stroke="#c3cad1" stroke-width="7" stroke-linecap="round"/>
<text x="210.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b3138" text-anchor="middle" font-weight="700">суцільний метал</text>
<text x="210.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">флюс треба мазати ОКРЕМО</tspan><tspan x="210.0" dy="13.1">(годиться для дроту, лудіння бака)</tspan></text>
