<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розріз монтажного припою-дроту: флюс СХОВАНИЙ усередині металу</text>
<rect x="60.0" y="100.0" width="300.0" height="300.0" rx="12" fill="#fafbfc" stroke="#6b7280" stroke-width="1.6"/>
