<text x="812.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6420" text-anchor="start" font-weight="700"><tspan x="812.0" dy="0.0">канали</tspan><tspan x="812.0" dy="13.7">флюсу</tspan></text>
<text x="690.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b3138" text-anchor="middle" font-weight="700">метал</text>
<rect x="74.0" y="447.9" width="792.1" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Той самий сплав, але справа крізь пруток проходять тонкі канали каніфолі. Торкнув гарячий шов — серцевина плавиться ПЕРШОЮ,</tspan><tspan x="470.0" dy="13.7">знімає окис, і слідом натікає метал. Ось чому монтажним дротом паяють БЕЗ окремого флюсу, а суцільним — треба мазати флюс самому.</tspan></text>
