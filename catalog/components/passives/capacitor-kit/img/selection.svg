<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дістати з набору під задачу</text>
<rect x="40.0" y="78.0" width="230.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Заспокоїти живлення</tspan><tspan x="155.0" dy="18.2">біля мікросхеми</tspan></text>
<line x1="280.0" y1="117.0" x2="340.0" y2="117.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="375.0" y="86.2" width="360.0" height="35.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="108.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">керамічний 100 нФ (104)</tspan></text>
<text x="555.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">малий, швидкий, поруч із ніжкою VCC</text>
<rect x="40.0" y="186.0" width="230.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Задати час / фільтр</tspan><tspan x="155.0" dy="18.2">(RC, генератор)</tspan></text>
<line x1="280.0" y1="225.0" x2="340.0" y2="225.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="375.0" y="185.5" width="360.0" height="53.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="555.0" y="207.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">плівковий або керамічний,</tspan><tspan x="555.0" dy="17.6">точний номінал</tspan></text>
<text x="555.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стабільний, неполярний, ±5 %</text>
<rect x="40.0" y="294.0" width="230.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Згладити просадку,</tspan><tspan x="155.0" dy="18.2">запас енергії</tspan></text>
<line x1="280.0" y1="333.0" x2="340.0" y2="333.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="375.0" y="302.2" width="360.0" height="35.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">електролітичний 100–1000 мкФ</tspan></text>
<text x="555.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">полярний! запас напруги ×1.5–2</text>
</svg>