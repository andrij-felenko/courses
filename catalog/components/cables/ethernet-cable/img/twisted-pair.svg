<text x="265.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">зовнішня завада (наведення) — в обидві жили ОДНАКОВО</text>
<rect x="560.0" y="96.0" width="260.0" height="150.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.9"/>
<text x="690.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">приймач бере A − B</text>
<text x="690.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">сигнал:  +s − (−s) = 2s</text>
<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">завада:  +z − (+z) = 0</text>
<text x="690.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">корисне подвоюється,</text>
<text x="690.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">спільна завада гине</text>
<line x1="476.0" y1="150.0" x2="554.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="3.6" y="314.5" width="872.7" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">скрутка дає рівність: обидві жили по черзі бувають ближчою до джерела завади, тож наводка на них ЗРІВНЮЄТЬСЯ — тому віднімання її вбиває</tspan></text>
<rect x="154.1" y="376.5" width="571.8" height="31.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="395.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">більше витків на метр → щільніше зрівнювання → вища категорія кабелю тримає вищу частоту</tspan></text>
<rect x="116.5" y="430.5" width="647.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="449.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">чотири такі пари в одній оболонці, кожна зі СВОЇМ кроком скрутки — щоб пари не наводили одна на одну</tspan></text>
</svg>