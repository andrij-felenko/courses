<text x="250.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">100BASE-TX (100 Мбіт)</text>
<text x="250.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пари 2 і 3 працюють, 1 і 4 — вільні</text>
<text x="250.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e8630a" text-anchor="middle">пін 1,2  →  передавання (TX)</text>
<text x="250.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8b3f" text-anchor="middle">пін 3,6  →  приймання (RX)</text>
<text x="250.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тому старий лінк живе навіть на 2 парах</text>
<rect x="470.0" y="380.0" width="360.0" height="150.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="650.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1000BASE-T (1 Гбіт)</text>
<text x="650.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">усі 4 пари, кожна в ОБИДВА боки водночас</text>
<text x="650.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4 пари × 250 Мбіт = 1000 Мбіт</text>
<text x="650.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дуплекс на одній парі — гібридна схема</text>
<text x="650.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">тому для гігабіта потрібні ВСІ 8 жил цілі</text>
