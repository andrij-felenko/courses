<text x="974.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">OUT</text>
<rect x="190.2" y="320.2" width="659.5" height="59.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Фотодіод ловить світло; підсилювач і АРП піднімають кволий струм до робочого рівня; смуговий фільтр</tspan><tspan x="520.0" dy="14.3">пропускає ЛИШЕ ~38 кГц (усе інше — сонце, лампи — відсіює); демодулятор здирає несучу й лишає обвідну;</tspan><tspan x="520.0" dy="14.3">вихідний ключ віддає чистий рівень. На OUT — уже готовий цифровий сигнал, читати звичайним GPIO.</tspan></text>
</svg>