<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два життя модуля з боку коду: міст (EN low) vs AT (EN high)</text>
<rect x="30.0" y="66.0" width="350.0" height="288.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="205.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">EN = low → прозорий міст</text>
<rect x="56.0" y="92.0" width="298.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/><text x="205.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">робоча швидкість (типово 9600)</tspan></text>
<rect x="56.0" y="150.0" width="130.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="121.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="121.0" dy="0.0">ваш байт</tspan><tspan x="121.0" dy="14.3">у RXD</tspan></text>
<line x1="186.0" y1="178.0" x2="250.0" y2="178.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="250.0" y="150.0" width="104.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="302.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="302.0" dy="0.0">летить</tspan><tspan x="302.0" dy="14.3">по радіо</tspan></text>
<rect x="56.0" y="232.0" width="298.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="205.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">жодних команд: код лише</tspan><tspan x="205.0" dy="14.3">читає й пише байти</tspan></text>
<rect x="56.0" y="296.0" width="298.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="205.0" y="319.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">STATE = 1 ⟺ напарник з'єднаний</tspan></text>
<rect x="420.0" y="66.0" width="350.0" height="288.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="595.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">EN = high на старті → режим AT</text>
<rect x="446.0" y="92.0" width="298.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/><text x="595.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">командна швидкість HC-05: 38400 (фікс.)</tspan></text>
<rect x="446.0" y="150.0" width="150.0" height="54.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="521.0" y="173.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="521.0" dy="0.0">скетч шле</tspan><tspan x="521.0" dy="13.7">AT+NAME=Robot\r\n</tspan></text>
<line x1="596.0" y1="177.0" x2="660.0" y2="177.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="660.0" y="150.0" width="84.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="702.0" y="173.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">модуль:</tspan><tspan x="702.0" dy="13.7">OK\r\n</tspan></text>
<rect x="446.0" y="230.0" width="298.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="595.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">код читає до \r\n і звіряє:</tspan><tspan x="595.0" dy="13.7">&quot;OK&quot; → успіх, &quot;ERROR&quot; → ні</tspan></text>
<rect x="446.0" y="296.0" width="298.0" height="40.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.2"/><text x="595.0" y="319.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">NAME · PSWD · UART · ROLE</tspan></text>
</svg>