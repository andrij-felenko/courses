<rect x="462.0" y="200.0" width="256.0" height="80.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.2"/><text x="590.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">дальність: сотні метрів — км</tspan><tspan x="590.0" dy="14.3">пік TX: до ~115 мА</tspan><tspan x="590.0" dy="14.3">живлення: треба 100–220 мкФ!</tspan><tspan x="590.0" dy="14.3">більша, гріється сильніше</tspan></text>
