<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл шифрування: auth підіймає CRYPTO1, StopCrypto1 його опускає</text>
<rect x="40.0" y="99.0" width="128.0" height="62.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.8"/><text x="104.0" y="127.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">PICC_ReadCardSerial</tspan><tspan x="104.0" dy="11.7">є UID</tspan></text>
<rect x="210.0" y="99.0" width="128.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="274.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="274.0" dy="0.0">PCD_Authenticate</tspan><tspan x="274.0" dy="14.3">CRYPTO1 ↑</tspan></text>
<rect x="380.0" y="99.0" width="128.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="444.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="444.0" dy="0.0">MIFARE_Read /</tspan><tspan x="444.0" dy="14.3">Write</tspan><tspan x="444.0" dy="14.3">дані течуть</tspan></text>
<rect x="560.0" y="99.0" width="128.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="624.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="624.0" dy="0.0">PCD_StopCrypto1</tspan><tspan x="624.0" dy="14.3">CRYPTO1 ↓</tspan></text>
<line x1="168.0" y1="130.0" x2="210.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="338.0" y1="130.0" x2="380.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="508.0" y1="130.0" x2="560.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="624.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">далі PICC_HaltA()</text>
<rect x="274.0" y="65.0" width="350.0" height="20.0" rx="4" fill="#fdf6ec" stroke="#d68910" stroke-width="1.0"/>
<text x="449.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle">поки CRYPTO1 піднятий — читач зайнятий</text>
<rect x="40.0" y="201.0" width="720.0" height="40.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Забув StopCrypto1 — CRYPTO1 лишається піднятим, і НАСТУПНА мітка не читається (мовчазний «плаваючий» баг). Викликай його ЗАВЖДИ, навіть після невдалого читання.</tspan></text>
</svg>