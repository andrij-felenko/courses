<text x="190.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">крила загорнулись досередини,</text>
<text x="190.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">обняли жилу — щільно й рівномірно</text>
<text x="190.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">✓ добре</text>
<line x1="450.0" y1="80.0" x2="450.0" y2="400.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плоска губка → «млинець»</text>
<rect x="560.0" y="130.0" width="260.0" height="34.0" rx="3" fill="#c9ced6" stroke="#5a6270" stroke-width="2.0"/>
