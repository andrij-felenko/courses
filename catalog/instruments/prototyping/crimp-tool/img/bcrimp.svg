<circle cx="190.0" cy="214.0" r="4.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.0"/>
<circle cx="198.0" cy="220.0" r="4.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.0"/>
<circle cx="186.0" cy="228.0" r="4.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.0"/>
