<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заливка ESP-01S у часі: три фази й рівень GPIO0</text>
<rect x="60.0" y="70.0" width="250.0" height="120.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="185.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1 · Вхід у завантажувач</text>
<text x="185.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">GPIO0 → земля,</tspan><tspan x="185.0" dy="14.3">коротко RST → земля</tspan><tspan x="185.0" dy="14.3">й відпустити</tspan></text>
<rect x="330.0" y="70.0" width="230.0" height="120.0" rx="10" fill="#eef2f7" stroke="#2457d6" stroke-width="1.8"/>
<text x="445.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2 · esptool пише флеш</text>
<text x="445.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">esptool write_flash</tspan><tspan x="445.0" dy="14.3">0x0 firmware.bin</tspan><tspan x="445.0" dy="14.3">@ 115200 бод</tspan></text>
<rect x="580.0" y="70.0" width="220.0" height="120.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="690.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3 · Запуск прошивки</text>
<text x="690.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">GPIO0 вільно,</tspan><tspan x="690.0" dy="14.3">ще одне RST →</tspan><tspan x="690.0" dy="14.3">чип біжить код</tspan></text>
<line x1="50.0" y1="236.0" x2="830.0" y2="236.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="830.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<text x="40.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">GPIO0</text>
<line x1="60.0" y1="306.0" x2="560.0" y2="306.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="310.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">0 (на землі)</text>
<line x1="560.0" y1="306.0" x2="560.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="4,3"/>
<line x1="560.0" y1="270.0" x2="800.0" y2="270.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="680.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">1 (вільно)</text>
</svg>