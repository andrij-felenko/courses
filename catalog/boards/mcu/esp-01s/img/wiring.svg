<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прошивка ESP-01S: UART + окреме живлення</text>
<rect x="50.0" y="120.0" width="160.0" height="100.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/><text x="130.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">USB-UART</tspan><tspan x="130.0" dy="15.6">перехідник</tspan><tspan x="130.0" dy="15.6">(на 3.3 В!)</tspan></text>
<rect x="590.0" y="110.0" width="180.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="680.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">ESP-01S</tspan><tspan x="680.0" dy="14.3">пік Wi-Fi ≈ 300 мА</tspan><tspan x="680.0" dy="14.3">(короткі сплески)</tspan></text>
<text x="400.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">TX перехідника → RX плати</text>
<line x1="210.0" y1="132.0" x2="590.0" y2="132.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="590.0" y1="160.0" x2="210.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">TX плати → RX перехідника</text>
<rect x="320.0" y="380.0" width="190.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="415.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">окреме 3.3 В</tspan><tspan x="415.0" dy="14.3">(≥ 500 мА, напр. AMS1117)</tspan></text>
<text x="430.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">VCC + CH_PD → 3.3 В</text>
<line x1="415.0" y1="380.0" x2="415.0" y2="300.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="415.0" y1="300.0" x2="660.0" y2="300.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="660.0" y1="300.0" x2="660.0" y2="230.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="660.0" y1="300.0" x2="720.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="720.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">‖</text>
<line x1="720.0" y1="296.0" x2="720.0" y2="316.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="720.0" y1="316.0" x2="660.0" y2="316.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="736.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="736.0" dy="0.0">10–100 мкФ</tspan><tspan x="736.0" dy="13.0">біля VCC</tspan></text>
<line x1="130.0" y1="220.0" x2="130.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="130.0" y1="340.0" x2="680.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="680.0" y1="340.0" x2="680.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="230.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">спільна земля всіх трьох</text>
</svg>