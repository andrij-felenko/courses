<text x="440.0" y="188.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<line x1="350.0" y1="185.0" x2="371.0" y2="185.0" stroke="#1a1a1a" stroke-width="2.0"/>
