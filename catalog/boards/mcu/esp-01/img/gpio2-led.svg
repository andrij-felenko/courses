<line x1="478.0" y1="350.0" x2="478.0" y2="370.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="478.0" y1="360.0" x2="510.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="510.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">GPIO2</text>
<rect x="560.0" y="96.0" width="380.0" height="200.0" rx="6" fill="#f7fafc" stroke="#1a1a1a" stroke-width="1.4"/><text x="750.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">У класичного ESP-01 бортового світлодіода на GPIO2 НЕМА —</tspan><tspan x="750.0" dy="14.3">синій висить на TX (GPIO1). Тому «блимати GPIO2»</tspan><tspan x="750.0" dy="14.3">означає поставити СВІЙ, зовнішній світлодіод.</tspan><tspan x="750.0" dy="14.3">У ESP-01S бортовий LED уже на GPIO2, і він</tspan><tspan x="750.0" dy="14.3">активно-низький: LOW = світить, HIGH = гасне.</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">Резистор R ≈ 220–470 Ом обмежує струм.</tspan><tspan x="750.0" dy="14.3">GPIO2 мусить бути ВИСОКИМ у момент старту —</tspan><tspan x="750.0" dy="14.3">спосіб B (катод на GPIO2) гарантує це сам собою.</tspan></text>
<rect x="213.7" y="432.8" width="552.7" height="30.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="451.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">напрям діода задає полярність: анод на GPIO2 → HIGH світить; катод на GPIO2 → LOW світить</tspan></text>
</svg>