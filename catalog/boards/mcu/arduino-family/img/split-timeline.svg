<circle cx="150.0" cy="456.0" r="7.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="130.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">2017</text>
<rect x="189.0" y="433.9" width="470.0" height="44.1" rx="6" fill="#f7f9fb" stroke="#27ae60" stroke-width="1.5"/><text x="424.0" y="452.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="424.0" dy="0.0">липень: BCMI (Банці, Куартьєльєс,</tspan><tspan x="424.0" dy="13.7">Мелліс, Іго) викуповує 100% Arduino AG</tspan></text>
<circle cx="150.0" cy="528.0" r="7.0" fill="#1a1a1a" stroke="#ffffff" stroke-width="2.0"/>
<text x="130.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">нині</text>
<rect x="189.0" y="505.9" width="470.0" height="44.1" rx="6" fill="#f7f9fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="424.0" y="524.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="424.0" dy="0.0">одна компанія, один бренд;</tspan><tspan x="424.0" dy="13.7">відкриті ліцензії лишились — клони живуть</tspan></text>
