<rect x="189.0" y="73.9" width="470.0" height="44.1" rx="6" fill="#f7f9fb" stroke="#27ae60" stroke-width="1.5"/><text x="424.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="424.0" dy="0.0">IDII, Іврея: пʼятеро роблять Arduino;</tspan><tspan x="424.0" dy="13.7">схеми й код одразу відкриті</tspan></text>
<circle cx="150.0" cy="168.0" r="7.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
