<rect x="189.0" y="289.9" width="470.0" height="44.1" rx="6" fill="#f7f9fb" stroke="#c0392b" stroke-width="1.5"/><text x="424.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="424.0" dy="0.0">січень: Arduino LLC судиться з Arduino SRL ·</tspan><tspan x="424.0" dy="13.7">поза США LLC торгує під іменем «Genuino»</tspan></text>
