<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкрите залізо: де межа дозволеного</text>
<rect x="70.0" y="74.0" width="400.0" height="250.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="270.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ВІЛЬНО — під ліцензією</text>
<circle cx="104.0" cy="136.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="104.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓</text>
<text x="126.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">узяти схему й розводку плати (файли Eagle)</text>
<circle cx="104.0" cy="178.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="104.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓</text>
<text x="126.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">виготовити свою плату 1-в-1</text>
<circle cx="104.0" cy="220.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="104.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓</text>
<text x="126.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">продавати її, змінювати, вбудовувати</text>
<circle cx="104.0" cy="262.0" r="9.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="104.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓</text>
<text x="126.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">узяти код IDE та бібліотек, форкнути</text>
<rect x="490.0" y="74.0" width="380.0" height="250.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="680.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">НЕ МОЖНА — це торгова марка</text>
<circle cx="524.0" cy="136.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="524.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="546.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">назвати свою плату «Arduino»</text>
<circle cx="524.0" cy="178.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="524.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="546.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ставити на неї логотип-нескінченність (∞)</text>
<circle cx="524.0" cy="220.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="524.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="546.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">видавати клон за офіційний виріб</text>
<circle cx="524.0" cy="262.0" r="9.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="524.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="546.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">торгувати під чужим брендом</text>
<rect x="221.7" y="340.5" width="496.5" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">тому клони звуться «Arduino-compatible / для Arduino», а не просто «Arduino»</tspan></text>
</svg>