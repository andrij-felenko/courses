<line x1="755.0" y1="245.0" x2="755.0" y2="255.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="802.5" y1="245.0" x2="802.5" y2="255.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="185.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1002</text>
<text x="300.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">1004</text>
<text x="755.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1014</text>
<rect x="185.0" y="296.0" width="570.0" height="22.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="470.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">фактично тримає північ Італії ~12 років</text>
<line x1="185.0" y1="239.0" x2="185.0" y2="134.7" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="120.8" y="96.0" width="128.3" height="38.7" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="185.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Коронація в Павії</text>
<text x="185.0" y="124.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1002 · король Італії</text>
<circle cx="185.0" cy="250.0" r="6.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<line x1="755.0" y1="239.0" x2="755.0" y2="134.7" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="706.7" y="96.0" width="96.6" height="38.7" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="755.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Зречення 1014</text>
<text x="755.0" y="124.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">іде в монастир</text>
<circle cx="755.0" cy="250.0" r="6.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/>
<line x1="280.0" y1="261.0" x2="280.0" y2="360.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="205.0" y="360.0" width="150.0" height="38.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="280.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Приходить Генріх II</text>
<text x="280.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">палить Павію, король сам</text>
<circle cx="280.0" cy="250.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<circle cx="802.5" cy="250.0" r="5.0" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.6"/>
<text x="808.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">†1015</text>
<rect x="86.9" y="432.5" width="766.1" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="451.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">виграв битву проти намісника, та програв корону самому імператору — «гідний невдаха», якого Іврея памʼятає тисячу років</tspan></text>
</svg>