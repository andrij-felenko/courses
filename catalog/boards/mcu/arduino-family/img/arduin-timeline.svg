<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ардуїн Іврейський: дуга короля-невдахи (1002–1015)</text>
<line x1="90.0" y1="250.0" x2="850.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="848.0" y1="250.0" x2="860.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="185.0" y1="245.0" x2="185.0" y2="255.0" stroke="#1a1a1a" stroke-width="1.6"/>
