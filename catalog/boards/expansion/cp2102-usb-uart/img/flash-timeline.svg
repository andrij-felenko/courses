<text x="315.8" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="315.8" dy="0.0">2. Скинути плату</tspan></text>
<text x="315.8" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="315.8" dy="0.0">кнопкою RESET або</tspan><tspan x="315.8" dy="14.3">зняти-подати живлення;</tspan><tspan x="315.8" dy="14.3">чип бачить BOOT0=1</tspan><tspan x="315.8" dy="14.3">і йде в завантажувач</tspan></text>
