<text x="692.8" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="692.8" dy="0.0">повернути вибір</tspan><tspan x="692.8" dy="14.3">до низького й</tspan><tspan x="692.8" dy="14.3">рестарт — тепер</tspan><tspan x="692.8" dy="14.3">стартує ВАШ код</tspan></text>
