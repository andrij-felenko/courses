<text x="127.2" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="127.2" dy="0.0">притиснути ніжку</tspan><tspan x="127.2" dy="14.3">вибору до високого</tspan><tspan x="127.2" dy="14.3">(перемичка / дріт)</tspan></text>
