<text x="504.2" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle"><tspan x="504.2" dy="0.0">на ПК: stm32flash</tspan><tspan x="504.2" dy="14.3">-w firmware.bin</tspan><tspan x="504.2" dy="14.3">порт і швидкість;</tspan><tspan x="504.2" dy="14.3">чип пише флеш</tspan></text>
