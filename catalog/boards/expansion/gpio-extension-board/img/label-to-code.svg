<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Надпис на штирі = число в коді = зсув лінії в ядрі — коли шлейф не розвернуто</text>
<rect x="40.0" y="70.0" width="220.0" height="108.0" rx="10" fill="#eef6ef" stroke="#1a1a1a" stroke-width="1.9"/>
<text x="150.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">надпис на платі</text>
<text x="150.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">GPIO17</text>
<text x="150.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">те, що читаєш очима</text>
<rect x="320.0" y="70.0" width="220.0" height="108.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="430.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">число в коді</text>
<text x="430.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2457d6" text-anchor="middle" font-weight="700">17</text>
<text x="430.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">LED_LINE = 17</text>
<rect x="600.0" y="70.0" width="220.0" height="108.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.9"/>
<text x="710.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зсув лінії чипа</text>
<text x="710.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#27ae60" text-anchor="middle" font-weight="700">offset 17</text>
<text x="710.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">gpiochip0, лінія 17</text>
<line x1="260.0" y1="124.0" x2="320.0" y2="124.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="540.0" y1="124.0" x2="600.0" y2="124.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="370.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">=</text>
<text x="650.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">=</text>
<rect x="32.0" y="218.0" width="236.0" height="66.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="150.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">фізичний штир на гребінці</text>
<text x="150.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">№ 11 — ІНШЕ число, у код НЕ йде</text>
<line x1="108.0" y1="178.0" x2="108.0" y2="218.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="150.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">не плутати з</text>
<rect x="300.0" y="218.0" width="400.0" height="66.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="500.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">перевір ще до коду:</text>
<text x="500.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">gpioset gpiochip0 17=1   →  штир GPIO17 має ожити</text>
<rect x="119.0" y="328.5" width="621.9" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="347.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">розвернений шлейф РОЗРИВАЄ цей ланцюг: надпис лишається GPIO17, а фізично під ним уже інша лінія</tspan></text>
</svg>