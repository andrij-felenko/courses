<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя демона під systemd: сигнали, вихід, рестарт</text>
<rect x="60.0" y="90.0" width="200.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="160.0" y="115.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ПРАЦЮЄ</tspan><tspan x="160.0" dy="15.6">головний цикл, WATCHDOG=1</tspan><tspan x="160.0" dy="15.6">раз на пів-періоду</tspan></text>
<rect x="350.0" y="90.0" width="200.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="450.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">ЗУПИНЯЄТЬСЯ</tspan><tspan x="450.0" dy="14.3">ловить SIGTERM,</tspan><tspan x="450.0" dy="14.3">дописує, закриває, виходить 0</tspan></text>
<rect x="640.0" y="90.0" width="200.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="740.0" y="115.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">ЗУПИНЕНО</tspan><tspan x="740.0" dy="15.6">systemctl бачить</tspan><tspan x="740.0" dy="15.6">чистий вихід</tspan></text>
<line x1="260.0" y1="127.0" x2="350.0" y2="127.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="305.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">SIGTERM</text>
<text x="305.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(systemctl stop)</text>
<line x1="550.0" y1="127.0" x2="640.0" y2="127.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="250.0" width="200.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="160.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ВПАВ</tspan><tspan x="160.0" dy="15.6">баг, SIGKILL, вихід ≠ 0</tspan><tspan x="160.0" dy="15.6">без попередження</tspan></text>
<line x1="160.0" y1="164.0" x2="160.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="168.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">аварія</text>
<rect x="350.0" y="250.0" width="330.0" height="60.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="2.0"/><text x="515.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">systemd: Restart=on-failure</tspan><tspan x="515.0" dy="15.6">чекає RestartSec, піднімає знову</tspan></text>
<line x1="260.0" y1="280.0" x2="350.0" y2="280.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="280.0" x2="770.0" y2="280.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="770.0" y1="280.0" x2="770.0" y2="188.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="770.0" y1="188.0" x2="220.0" y2="188.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="220.0" y1="188.0" x2="220.0" y2="164.0" stroke="#b8860b" stroke-width="2.0"/>
<text x="690.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">автопідйом</text>
<rect x="620.0" y="340.0" width="260.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="750.0" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">не вийшов за TimeoutStopSec (90 с) →</tspan><tspan x="750.0" dy="14.3">systemd б'є SIGKILL — обірве брудно</tspan></text>
</svg>