<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві мікросхеми Pi 5: обчислення в BCM2712, порти в RP1</text>
<rect x="60.0" y="70.0" width="300.0" height="250.0" rx="12" fill="#eef2f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">BCM2712</text>
<text x="210.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">процесор (16 нм)</text>
<text x="82.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 4 × Cortex-A76 @ 2.4 ГГц</text>
<text x="82.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• L2 512 кБ/ядро · L3 2 МБ</text>
<text x="82.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• GPU VideoCore VII @ 800 МГц</text>
<text x="82.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• контролер LPDDR4X-4267</text>
<text x="82.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 2 × HDMI (4Kp60)</text>
<rect x="560.0" y="70.0" width="240.0" height="250.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="680.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">RP1</text>
<text x="680.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">південний міст (порти)</text>
<text x="578.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 2 × USB 3.0 · 2 × USB 2.0</text>
<text x="578.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Gigabit Ethernet</text>
<text x="578.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 40-пін GPIO (3.3 В)</text>
<text x="578.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• UART · SPI · I²C · I²S · PWM</text>
<text x="578.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 2 × MIPI (камера/дисплей)</text>
<line x1="360.0" y1="195.0" x2="560.0" y2="195.0" stroke="#c0392b" stroke-width="3.0"/>
<rect x="404.4" y="142.9" width="111.1" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="161.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">PCIe ×4</tspan><tspan x="460.0" dy="13.7">внутрішня шина</tspan></text>
<rect x="115.0" y="360.0" width="190.0" height="40.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="210.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">роз'єм PCIe 2.0 ×1</text>
<line x1="210.0" y1="320.0" x2="210.0" y2="360.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="276.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">1 лінія назовні</text>
<rect x="111.8" y="432.8" width="636.5" height="30.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="451.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">усе, що встромляється в порти, йде через RP1; роз'єм PCIe — пряма лінія від BCM2712 до SSD/прискорювача</tspan></text>
</svg>