<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині Pixhawk 6C: мозок (FMU) рахує, м'язи (IO) керують виходами</text>
<rect x="40.0" y="56.0" width="820.0" height="430.0" rx="14" fill="#fafbfc" stroke="#6b7280" stroke-width="1.6"/>
<text x="170.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">плата Pixhawk 6C</text>
<rect x="70.0" y="111.0" width="220.0" height="200.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="180.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Давачі (на нагріві)</text>
<text x="84.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ICM-42688-P  — акселерометр+гіро</text>
<text x="84.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">BMI055/088   — другий акс.+гіро</text>
<text x="84.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">IST8310      — магнітометр</text>
<text x="84.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">MS5611       — барометр (тиск)</text>
<text x="180.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">два IMU — резервування</text>
<rect x="340.0" y="111.0" width="240.0" height="130.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="460.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">FMU  —  головний процесор</text>
<text x="460.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">STM32H743</text>
<text x="460.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cortex-M7 · 480 МГц</text>
<text x="460.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2 МБ Flash · 1 МБ RAM</text>
<text x="460.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">читає давачі, оцінює стан, рахує керування</text>
<rect x="340.0" y="276.0" width="240.0" height="120.0" rx="10" fill="#fdf0e6" stroke="#c0392b" stroke-width="2.0"/>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">IO  —  процесор виходів</text>
<text x="460.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">STM32F103</text>
<text x="460.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cortex-M3 · 72 МГц</text>
<text x="460.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">жене PWM на мотори, ловить RC,</text>
<text x="460.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">тримає керування при збої FMU</text>
<line x1="290.0" y1="201.0" x2="340.0" y2="171.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="315.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">SPI / I²C</text>
<line x1="460.0" y1="241.0" x2="460.0" y2="276.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="504.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">команди</text>
<rect x="710.0" y="302.0" width="128.0" height="68.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="774.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">16 × PWM</text>
<text x="774.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мотори (ESC)</text>
<text x="774.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">серва</text>
<line x1="580.0" y1="336.0" x2="710.0" y2="336.0" stroke="#c0392b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="710.0" y="410.0" width="128.0" height="44.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="774.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">RC-приймач</text>
<text x="774.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SBUS / DSM / PPM</text>
<line x1="710.0" y1="430.0" x2="580.0" y2="378.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="136.0" width="128.0" height="80.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="774.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GPS · телеметрія</text>
<text x="774.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">CAN · I²C · USB</text>
<text x="774.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">живлення (POWER)</text>
<text x="774.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">через JST-GH</text>
<line x1="580.0" y1="176.0" x2="710.0" y2="176.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="146.7" y="503.9" width="606.5" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="522.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">поділ праці: важкі обчислення — на швидкому FMU; примітивні, але критичні виходи — на окремому IO,</tspan><tspan x="450.0" dy="13.7">щоб мотори й ручне керування жили навіть коли головний процесор спіткнувся</tspan></text>
</svg>