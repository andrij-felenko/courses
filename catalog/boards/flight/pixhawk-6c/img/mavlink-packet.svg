<rect x="123.8" y="404.5" width="732.5" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">уся «розмова» з дроном — потік таких кадрів. MAVLink 1 (0xFE) не має полів прапорців і підпису й шле весь</tspan><tspan x="490.0" dy="13.0">хвіст payload; MAVLink 2 (0xFD) додав їх і обрізає нульові байти з кінця. Бібліотека, що чекає іншу магію, кадру НЕ побачить.</tspan></text>
