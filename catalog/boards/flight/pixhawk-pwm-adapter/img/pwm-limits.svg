<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпечні межі ширини імпульсу: 1000 · 1500 · 2000 мкс</text>
<line x1="110.0" y1="150.0" x2="830.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="130.0" y1="138.0" x2="130.0" y2="162.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="130.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1000 мкс</text>
<text x="130.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">MIN</text>
<text x="130.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повний реверс / нуль газу</text>
<line x1="470.0" y1="138.0" x2="470.0" y2="162.0" stroke="#6b7280" stroke-width="2.4"/>
<text x="470.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1500 мкс</text>
<text x="470.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TRIM</text>
<text x="470.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">нейтраль серва</text>
<line x1="810.0" y1="138.0" x2="810.0" y2="162.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="810.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2000 мкс</text>
<text x="810.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">MAX</text>
<text x="810.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повний хід / повний газ</text>
