<rect x="130.0" y="147.0" width="680.0" height="6.0" rx="6" fill="#dfe6ef" stroke="none" stroke-width="0.0"/>
<rect x="143.8" y="249.1" width="312.4" height="41.9" rx="6" fill="#eef0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">реверс серва НЕ від'ємна ширина: 1000 і 2000 —</tspan><tspan x="300.0" dy="12.3">ті самі краї, лише міняються місцями (SERVOn_REVERSED)</tspan></text>
<rect x="501.9" y="249.1" width="296.2" height="41.9" rx="6" fill="#fdf0e6" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">ширше за 1000…2000 — на свій ризик: серво впреться</tspan><tspan x="650.0" dy="12.3">в упор і гріється, ESC може не зловити калібрування</tspan></text>
<rect x="172.2" y="376.5" width="595.7" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">1 мс = «мало», 2 мс = «багато», 1.5 мс = «посередині» — цей діапазон розуміють майже всі серва й ESC.</tspan><tspan x="470.0" dy="13.0">MIN/MAX/TRIM лишай у цих межах; калібрування ESC саме «показує» йому, де 1000, а де 2000.</tspan></text>
