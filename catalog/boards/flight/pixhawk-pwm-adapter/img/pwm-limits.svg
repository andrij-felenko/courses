<line x1="334.0" y1="144.0" x2="334.0" y2="156.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="402.0" y1="144.0" x2="402.0" y2="156.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="538.0" y1="144.0" x2="538.0" y2="156.0" stroke="#6b7280" stroke-width="1.0"/>
