<text x="88.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">MAIN3</text>
<text x="154.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→</text>
<text x="172.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">IO_CH3</text>
<text x="88.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">…</text>
<text x="154.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→</text>
<text x="172.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">…</text>
<text x="340.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">AUX → FMU</text>
<text x="270.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">AUX1</text>
<text x="336.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→</text>
<text x="354.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">FMU_CH1</text>
<text x="270.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">AUX2</text>
<text x="336.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→</text>
<text x="354.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">FMU_CH2</text>
<text x="270.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">AUX3</text>
<text x="336.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→</text>
<text x="354.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">FMU_CH3</text>
<text x="270.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">…</text>
<text x="336.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→</text>
<text x="354.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">…</text>
<line x1="255.0" y1="162.0" x2="255.0" y2="298.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="255.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">функцію на вихід кладе PWM_MAIN_FUNCn /</text>
<text x="255.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">PWM_AUX_FUNCn (напр. FUNC3 = Motor 2)</text>
<rect x="134.0" y="389.1" width="242.0" height="41.9" rx="6" fill="#fdf0e6" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">AUX (FMU) — з меншою затримкою: мотори</tspan><tspan x="255.0" dy="12.3">радять вішати саме на нього, а не на MAIN</tspan></text>
<rect x="490.0" y="66.0" width="430.0" height="420.0" rx="12" fill="#f3f8f3" stroke="#27ae60" stroke-width="1.8"/>
<text x="705.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ArduPilot: наскрізним номером</text>
<text x="705.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">виходи 1…N, кожен — свій набір SERVOn_*</text>
<rect x="514.0" y="144.0" width="382.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">SERVOn_FUNCTION</text>
<text x="690.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">що це за вихід (мотор, елерон, вимк.)</text>
<rect x="514.0" y="184.0" width="382.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">SERVOn_MIN</text>
<text x="690.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">нижня межа ширини, мкс (напр. 1000)</text>
<rect x="514.0" y="224.0" width="382.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">SERVOn_MAX</text>
<text x="690.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">верхня межа ширини, мкс (напр. 2000)</text>
<rect x="514.0" y="264.0" width="382.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">SERVOn_TRIM</text>
<text x="690.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">нейтраль / центр, мкс (напр. 1500)</text>
<rect x="514.0" y="304.0" width="382.0" height="32.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="530.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">SERVOn_REVERSED</text>
<text x="690.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">0/1 — перевернути напрям ходу</text>
<rect x="581.3" y="401.1" width="247.4" height="41.9" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="419.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">вхід (RCn_*) і вихід (SERVOn_*) — РІЗНІ:</tspan><tspan x="705.0" dy="12.3">межі, реверс і трим окремі для того й того</tspan></text>
<rect x="193.6" y="504.5" width="572.9" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="523.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">фізична гребінка адаптера — одна; змінюється лише, як прошивка її НАЗИВАЄ й де кладе межі ширини.</tspan><tspan x="480.0" dy="13.0">Плутанина I/O↔FMU у PX4 = поїхали номери каналів; у ArduPilot вихід і межі задає свій SERVOn_*.</tspan></text>
</svg>