<rect x="160.8" y="387.9" width="618.5" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Підтяжка вже на платі → пін як INPUT (не INPUT_PULLUP). Полярність (спокій «0» чи «1») звір виміром.</tspan><tspan x="470.0" dy="13.7">Живлення бери під логіку плати: рівень на S дорівнює VCC, тож 5 В б'є по 3.3-вольтовому входу.</tspan></text>
