<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок = повний обхід кільця (CLK,DT): CW і CCW ідуть кільцем у протилежні боки</text>
