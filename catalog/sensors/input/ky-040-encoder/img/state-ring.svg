<path d="M525.4 414.6 Q544.5 358.7 600.4 339.6" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="0.0" y="0.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"></text>
<path d="M604.6 264.6 Q548.7 245.5 529.6 189.6" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="0.0" y="0.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"></text>
<text x="758.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">за годинниковою (CW):</text>
<text x="758.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">11 → 01 → 00 → 10 → 11</text>
<text x="222.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">проти (CCW):</text>
<text x="222.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">11 → 10 → 00 → 01 → 11</text>
<circle cx="490.0" cy="150.0" r="46.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="490.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">11</text>
<text x="490.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">спокій</text>
<text x="490.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">(фіксатор)</text>
<circle cx="640.0" cy="300.0" r="46.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="640.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">01</text>
<text x="640.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">CLK впав</text>
<text x="640.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">перший</text>
<circle cx="490.0" cy="450.0" r="46.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="490.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">00</text>
<text x="490.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">обидва</text>
<text x="490.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">притиснуті</text>
<circle cx="340.0" cy="300.0" r="46.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
<text x="340.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">10</text>
<text x="340.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">DT впав</text>
<text x="340.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">перший</text>
<text x="490.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">повернулись у 11 → зарахувати +1 (CW) або −1 (CCW)</text>
<rect x="169.6" y="477.4" width="640.7" height="45.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="496.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">(CLK,DT) — двобітне число. Сусідні стани різняться РІВНО одним бітом (код Грея):</tspan><tspan x="490.0" dy="14.3">стрибок «через клітину» (напр. 11→00) неможливий чистим обертом — це брязкіт, автомат його ігнорує.</tspan></text>
<rect x="201.7" y="547.9" width="576.6" height="44.1" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="490.0" y="566.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Брязкіт лише смикає код туди-сюди між двома сусідніми станами — обхід кільця не завершується,</tspan><tspan x="490.0" dy="13.7">тож зайвого кроку не буде. Дебаунс тут «вбудований» у саму структуру переходів.</tspan></text>
</svg>