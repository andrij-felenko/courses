<rect x="206.7" y="407.4" width="546.7" height="45.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Обидві доріжки видають однакові прямокутники — різниця лише у ЗСУВІ на чверть кроку.</tspan><tspan x="480.0" dy="14.3">Спіймав спадний край CLK і глянув на DT: DT = «1» → за годинником; DT = «0» → проти.</tspan></text>
<rect x="260.5" y="482.9" width="438.9" height="44.1" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="501.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Швидше крутиш — частіше прямокутники, але їхній ПОРЯДОК не змінюється:</tspan><tspan x="480.0" dy="13.7">напрям читається зі зсуву фаз, а не зі швидкості.</tspan></text>
