<text x="46.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">з'єднує свій рядок з веденим</text>
<text x="46.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">«0» стовпця → рядок падає в «0».</text>
<text x="46.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Перепад на рядку ловить</text>
<text x="46.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">вартове переривання (PCINT)</text>
<text x="46.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">і будить процесор зі сну.</text>
<rect x="30.0" y="362.0" width="280.0" height="96.0" rx="10" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/>
<text x="46.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Під час сканування — навпаки:</text>
<text x="46.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">стовпці ведуться по одному.</text>
<text x="46.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Тут же — усі разом, щоб зловити</text>
<text x="46.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">будь-яку клавішу.</text>
<text x="480.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прокинувшись, процесор перемикається у звичайне сканування — щоб дізнатися, ЯКА саме клавіша впала.</text>
