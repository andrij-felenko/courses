<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Примара: три кнопки в кутах прямокутника вдають четверту (без діодів)</text>
<line x1="140.0" y1="100.0" x2="430.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="128.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Row0</text>
<line x1="140.0" y1="250.0" x2="430.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="128.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Row1</text>
<line x1="210.0" y1="30.0" x2="210.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="210.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Col0</text>
<line x1="360.0" y1="30.0" x2="360.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Col1</text>
<text x="210.0" y="4.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">LOW (скан)</text>
<circle cx="210.0" cy="100.0" r="7.0" fill="#d5f0e0" stroke="#27ae60" stroke-width="2.4"/>
<text x="222.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">натиснуто</text>
<circle cx="360.0" cy="100.0" r="7.0" fill="#d5f0e0" stroke="#27ae60" stroke-width="2.4"/>
<text x="372.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">натиснуто</text>
<circle cx="210.0" cy="250.0" r="7.0" fill="#d5f0e0" stroke="#27ae60" stroke-width="2.4"/>
<text x="222.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">натиснуто</text>
<circle cx="360.0" cy="250.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="372.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">ПРИМАРА (не натиснута,
а виглядає як натиснута)</text>
<line x1="210.0" y1="100.0" x2="360.0" y2="100.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="100.0" x2="360.0" y2="250.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="170.7" y="441.1" width="558.6" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">LOW зі скан-стовпця біжить через натиснуту (0,0) у Row0, по Row0 — у натиснуту (0,1),</tspan><tspan x="450.0" dy="13.7">звідти в Col1 — і Col1 бачить LOW, наче натиснули (1,1). Мінімум для примари — ТРИ кнопки.</tspan><tspan x="450.0" dy="13.7">Ліки: діод послідовно з кожною кнопкою — пускає струм лише в один бік, обхід зникає.</tspan></text>
</svg>