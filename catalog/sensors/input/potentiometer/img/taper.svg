<rect x="24.0" y="477.9" width="851.9" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="496.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Однакова доріжка, різний закон нанесення шару: у лінійного «B» кут пропорційний опору; у логарифмічного «A» на</tspan><tspan x="450.0" dy="13.7">півходу набирається лише ~десята частина, а основне — під кінець. Увага: маркування A/B у різних виробників плутане — звіряйся з даташитом.</tspan></text>
