<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод компенсації: невідому ЕРС урівноважують часткою відомої напруги — гальванометр на нулі</text>
<line x1="120.0" y1="158.0" x2="190.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="120.0" y1="158.0" x2="120.0" y2="222.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="106.0" y1="222.0" x2="134.0" y2="222.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="112.0" y1="232.0" x2="128.0" y2="232.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="72.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="700"><tspan x="72.0" dy="0.0">відоме</tspan><tspan x="72.0" dy="13.7">джерело</tspan></text>
<rect x="190.0" y="151.0" width="610.0" height="14.0" rx="6" fill="#f0e6e6" stroke="#8a5a5a" stroke-width="1.8"/>
<text x="495.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a4040" text-anchor="middle">однорідний слайд-дріт: спад напруги ∝ довжині</text>
<line x1="190.0" y1="165.0" x2="190.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="251.0" y1="165.0" x2="251.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="312.0" y1="165.0" x2="312.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="373.0" y1="165.0" x2="373.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="434.0" y1="165.0" x2="434.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="495.0" y1="165.0" x2="495.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="556.0" y1="165.0" x2="556.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="617.0" y1="165.0" x2="617.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="678.0" y1="165.0" x2="678.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="739.0" y1="165.0" x2="739.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="800.0" y1="165.0" x2="800.0" y2="171.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="190.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0</text>
<text x="800.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">весь дріт = вся відома напруга</text>
<line x1="800.0" y1="158.0" x2="844.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="844.0" y1="158.0" x2="844.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="844.0" y1="232.0" x2="120.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="260.0" y1="114.0" x2="390.0" y2="114.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="440.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">постійний струм жене напругу вздовж дроту</text>
<polygon points="556.0,165.0 544.0,190.0 568.0,190.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="534.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700"><tspan x="534.0" dy="0.0">рухомий контакт</tspan><tspan x="534.0" dy="13.0">(совгаєш, доки G = 0)</tspan></text>
<line x1="556.0" y1="190.0" x2="556.0" y2="388.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="556.0" y1="388.0" x2="190.0" y2="388.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="190.0" y1="388.0" x2="190.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="406.0" cy="388.0" r="24.0" fill="#eef2f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="406.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">G</text>
<line x1="406.0" y1="388.0" x2="406.0" y2="374.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="406.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<text x="406.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="406.0" dy="0.0">гальванометр</tspan><tspan x="406.0" dy="13.0">показує НУЛЬ → струму нема</tspan></text>
<line x1="286.0" y1="374.0" x2="286.0" y2="402.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="298.0" y1="380.0" x2="298.0" y2="396.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="288.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="288.0" dy="0.0">невідома</tspan><tspan x="288.0" dy="13.7">ЕРС Eₓ</tspan></text>
<rect x="580.0" y="250.0" width="342.0" height="124.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="751.0" y="281.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="751.0" dy="0.0">Совгаєш контакт, доки напруга на відрізку</tspan><tspan x="751.0" dy="13.7">дроту (частка відомої) точно не зрівняє</tspan><tspan x="751.0" dy="13.7">невідому ЕРС. Тоді G = 0: струм крізь</tspan><tspan x="751.0" dy="13.7">невідоме джерело не тече, і його ЕРС</tspan><tspan x="751.0" dy="13.7">виміряна БЕЗ відбору струму — без</tspan><tspan x="751.0" dy="13.7">спотворення внутрішнім опором джерела.</tspan></text>
<rect x="62.0" y="469.9" width="816.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="488.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Оце і є «potentiometer» у первісному значенні: прилад, що МІРЯЄ потенціал балансом на нуль. Довжина відрізка дроту від лівого</tspan><tspan x="470.0" dy="13.7">кінця до контакту (за рівномірною шкалою) прямо дає невідому напругу — точно саме тому, що в мить балансу давач нічого не навантажує.</tspan></text>
</svg>