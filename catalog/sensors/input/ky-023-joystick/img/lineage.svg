<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія аналогового стика: від 1982 до грибоподібної ручки KY-023</text>
<line x1="90.0" y1="118.0" x2="1130.0" y2="118.0" stroke="#6b7280" stroke-width="2.4"/>
<line x1="1128.0" y1="118.0" x2="1154.0" y2="118.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1150.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">час</text>
<line x1="150.0" y1="110.0" x2="150.0" y2="126.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="150.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1982</text>
<line x1="400.0" y1="110.0" x2="400.0" y2="126.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="400.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1985</text>
<line x1="690.0" y1="110.0" x2="690.0" y2="126.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="690.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1996</text>
<line x1="900.0" y1="110.0" x2="900.0" y2="126.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="900.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1997</text>
<line x1="1090.0" y1="110.0" x2="1090.0" y2="126.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="1090.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">KY-023</text>
<line x1="150.0" y1="126.0" x2="150.0" y2="168.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/><rect x="42.0" y="169.2" width="216.0" height="27.5" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Atari 5200 — НЕ центрується</tspan></text><rect x="42.0" y="200.0" width="216.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="227.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Перший аналог-стик на</tspan><tspan x="150.0" dy="14.3">потенціометрах у домашній</tspan><tspan x="150.0" dy="14.3">консолі. Відпустив ручку —</tspan><tspan x="150.0" dy="14.3">лишилась де є. Гумовий чохол</tspan><tspan x="150.0" dy="14.3">замість пружин, дрейф, масові</tspan><tspan x="150.0" dy="14.3">заміни. Урок «як не треба».</tspan></text>
<line x1="245.0" y1="320.0" x2="150.0" y2="348.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/><rect x="42.0" y="349.2" width="216.0" height="27.5" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Vectrex — самоцентрований</tspan></text><rect x="42.0" y="380.0" width="216.0" height="118.0" rx="6" fill="#eafaef" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Той самий 1982-й, зворотне</tspan><tspan x="150.0" dy="14.3">рішення: пружини вертають</tspan><tspan x="150.0" dy="14.3">ручку в центр. Саме ця</tspan><tspan x="150.0" dy="14.3">пружина-центр і лишилась</tspan><tspan x="150.0" dy="14.3">в усіх дальших стиках,</tspan><tspan x="150.0" dy="14.3">зокрема в KY-023.</tspan></text>
<line x1="400.0" y1="126.0" x2="400.0" y2="226.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/><rect x="281.5" y="227.2" width="237.0" height="27.5" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Sega Space Harrier — флайт-стик</tspan></text><rect x="283.0" y="258.0" width="234.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="285.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Аркада (Ю Судзукі, Sega).</tspan><tspan x="400.0" dy="14.3">Аналоговий флайт-стик: не</tspan><tspan x="400.0" dy="14.3">лише напрямок, а й НАСКІЛЬКИ</tspan><tspan x="400.0" dy="14.3">відхилив — величина натиску</tspan><tspan x="400.0" dy="14.3">керує швидкістю. Аналог</tspan><tspan x="400.0" dy="14.3">довів свою силу.</tspan></text>
<line x1="695.0" y1="126.0" x2="695.0" y2="306.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/><rect x="582.0" y="307.2" width="226.0" height="27.5" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="695.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Sony PS Analog Joystick</tspan></text><rect x="582.0" y="338.0" width="226.0" height="102.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="695.0" y="364.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">SCPH-1110 (1996): великий</tspan><tspan x="695.0" dy="14.3">аналоговий джойстик до</tspan><tspan x="695.0" dy="14.3">PlayStation (плутають із</tspan><tspan x="695.0" dy="14.3">«флайтстиком»). Sony заводить</tspan><tspan x="695.0" dy="14.3">аналог у масову консоль.</tspan></text>
<line x1="905.0" y1="126.0" x2="905.0" y2="204.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/><rect x="788.0" y="205.2" width="234.0" height="27.5" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="905.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">Sony Dual Analog → DualShock</tspan></text><rect x="788.0" y="236.0" width="234.0" height="102.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="905.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">1997: ДВА стики під великі</tspan><tspan x="905.0" dy="14.3">пальці на одному геймпаді.</tspan><tspan x="905.0" dy="14.3">Спершу увігнуті (Dual Analog),</tspan><tspan x="905.0" dy="14.3">тоді гумові опуклі ковпачки</tspan><tspan x="905.0" dy="14.3">(DualShock) — власне «гриб».</tspan></text>
<line x1="1090.0" y1="126.0" x2="1090.0" y2="172.0" stroke="#b8860b" stroke-width="1.8" stroke-dasharray="3,3"/>
<rect x="1012.0" y="168.2" width="156.0" height="59.6" rx="6" fill="#fff5d6" stroke="#b8860b" stroke-width="1.5"/><text x="1090.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5c00" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">KY-023</tspan><tspan x="1090.0" dy="14.3">той самий гриб</tspan><tspan x="1090.0" dy="14.3">на синій платі</tspan></text>
<rect x="980.0" y="232.0" width="220.0" height="96.0" rx="6" fill="#fff5d6" stroke="#b8860b" stroke-width="1.5"/><text x="1090.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">Механізм грибоподібного</tspan><tspan x="1090.0" dy="14.3">стика PlayStation, винесений</tspan><tspan x="1090.0" dy="14.3">як окремий модуль до Arduino:</tspan><tspan x="1090.0" dy="14.3">два потенціометри + кнопка-</tspan><tspan x="1090.0" dy="14.3">натиск на самій ручці.</tspan></text>
<rect x="322.7" y="526.1" width="594.6" height="57.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Дві ідеї 1982-го — «аналог напрямку» (обидва) і «пружина-центр» (Vectrex) — злилися;</tspan><tspan x="620.0" dy="13.7">аркада додала «величину відхилення», Sony звела два стики під пальці й одягла їх у гумовий гриб.</tspan><tspan x="620.0" dy="13.7">KY-023 — цей самий гриб, винесений на синю плату.</tspan></text>
</svg>