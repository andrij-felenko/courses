<rect x="186.4" y="344.0" width="527.3" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="362.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Кожну плавну вісь зводимо порогом до −1/0/+1; дві такі трійки дають решітку 3×3 — центр</tspan><tspan x="450.0" dy="13.0">= спокій, боки = 4 прямі напрямки, кути = 4 діагоналі. Ширший поріг = ширший хрест спокою</tspan><tspan x="450.0" dy="13.0">(важче зачепити напрямок випадково), вужчий = чутливіше й тремкіше на межі секторів.</tspan></text>
