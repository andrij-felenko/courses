<rect x="113.8" y="483.9" width="672.4" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="502.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">X і Y — звичайні дільники напруги: кінці смужки на + і −, повзунок віддає напругу за положенням (спокій ≈ ½).</tspan><tspan x="450.0" dy="13.7">Кнопка SW — гола, замикає лише на землю; підтяжки на модулі немає, тож вмикай внутрішню (INPUT_PULLUP).</tspan></text>
