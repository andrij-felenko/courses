<line x1="686.0" y1="276.0" x2="720.0" y2="276.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="720.0" y1="276.0" x2="720.0" y2="290.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="720.0" y1="290.0" x2="326.0" y2="290.0" stroke="#2457d6" stroke-width="2.2"/>
<rect x="143.7" y="391.1" width="612.5" height="57.8" rx="6" fill="#fff8e6" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Один вивід кнопки — на GPIO, протилежний (по діагоналі) — на GND. Живлення й землі кнопці НЕ треба.</tspan><tspan x="450.0" dy="13.7">Вмикаємо внутрішню підтяжку (INPUT_PULLUP): у спокої пін тримається у «1» (HIGH),</tspan><tspan x="450.0" dy="13.7">натиск замикає його на землю → пін падає в «0» (LOW). Отже: натиснуто = LOW, відпущено = HIGH.</tspan></text>
</svg>