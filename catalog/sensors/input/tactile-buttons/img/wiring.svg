<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення: кнопка між GPIO і GND, внутрішня підтяжка → натиск = LOW</text>
