<rect x="186.1" y="400.2" width="527.9" height="59.6" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Усередині 1–2 вже спаяні між собою, і 3–4 теж. Кнопка замикає ліву пару з правою.</tspan><tspan x="450.0" dy="14.3">БЕЗПЕЧНО брати по діагоналі (напр. 1 і 3): ці дві точно з різних пар.</tspan><tspan x="450.0" dy="14.3">Якщо взяти 1 і 2 (одна пара) — коло замкнене ЗАВЖДИ, натиск нічого не змінить.</tspan></text>
