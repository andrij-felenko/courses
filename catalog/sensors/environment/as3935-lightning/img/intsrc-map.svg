<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головна пастка коду: сирі біти регістра 0x03 — це 8/4/1, а getInterruptSrc() віддає 1/2/3</text>
<rect x="70.0" y="84.0" width="330.0" height="288.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="235.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">сирий регістр чіпа 0x03</text>
<text x="235.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">молодші 4 біти INT[3:0]</text>
<rect x="90.0" y="160.0" width="290.0" height="52.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="110.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">0b1000  = 8</text>
<text x="110.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">блискавка (INT_L)</text>
<rect x="90.0" y="226.0" width="290.0" height="52.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="110.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">0b0100  = 4</text>
<text x="110.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">завада (INT_D)</text>
<rect x="90.0" y="292.0" width="290.0" height="52.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="110.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">0b0001  = 1</text>
<text x="110.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">шум зависокий (INT_NH)</text>
<rect x="500.0" y="84.0" width="330.0" height="288.0" rx="12" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/>
<text x="665.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">getInterruptSrc() у DFRobot</text>
<text x="665.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">перекодовує в маленькі числа</text>
<rect x="520.0" y="160.0" width="290.0" height="52.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="540.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">повертає 1</text>
<text x="540.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">блискавка</text>
<rect x="520.0" y="226.0" width="290.0" height="52.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="540.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">повертає 2</text>
<text x="540.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">завада</text>
<rect x="520.0" y="292.0" width="290.0" height="52.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="540.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">повертає 3</text>
<text x="540.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">шум зависокий</text>
<line x1="404.0" y1="186.0" x2="496.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="404.0" y1="252.0" x2="496.0" y2="252.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="404.0" y1="318.0" x2="496.0" y2="318.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">перекодування</text>
<text x="450.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8→1, 4→2, 1→3</text>
<rect x="60.0" y="388.8" width="780.1" height="30.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">тому в скетчі порівнюй саме з 1/2/3 (те, що дає бібліотека), а не з 8/4/1; звірка з 8 «нічого не спіймає», хоч блискавка й була</tspan></text>
</svg>