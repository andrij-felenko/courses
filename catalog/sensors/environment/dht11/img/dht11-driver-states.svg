<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 574.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="574.7" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робить драйвер: п'ять станів від старту до контрольної суми</text>
<rect x="85.0" y="48.0" width="250.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/>
<text x="210.0" y="67.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">СТАРТ ВІД ХОСТА</text>
<text x="210.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">притисни DATA до землі</tspan><tspan x="210.0" dy="13.7">≥ 18 мс, тоді відпусти</tspan></text>
<line x1="210.0" y1="108.0" x2="210.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="140.0" width="250.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.2"/>
<text x="210.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ЧЕКАЙ ВІДПОВІДЬ</text>
<text x="210.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">лови 80 мкс низько +</tspan><tspan x="210.0" dy="13.7">80 мкс високо від давача</tspan></text>
<line x1="210.0" y1="200.0" x2="210.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="232.0" width="250.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="210.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЧИТАЙ 40 БІТІВ</text>
<text x="210.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">на кожен: пропусти 50 мкс</tspan><tspan x="210.0" dy="13.7">низько, зміряй ширину</tspan><tspan x="210.0" dy="13.7">високого імпульсу</tspan></text>
<line x1="210.0" y1="292.0" x2="210.0" y2="324.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="324.0" width="250.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="210.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗБЕРИ 5 БАЙТІВ</text>
<text x="210.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">8 бітів → байт,</tspan><tspan x="210.0" dy="13.7">п'ять байтів у масив</tspan></text>
<line x1="210.0" y1="384.0" x2="210.0" y2="416.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="416.0" width="250.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="210.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ПЕРЕВІР СУМУ</text>
<text x="210.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="210.0" dy="0.0">b0+b1+b2+b3 (нижні 8)</tspan><tspan x="210.0" dy="13.7">== b4 ?</tspan></text>
<line x1="170.0" y1="476.0" x2="90.0" y2="504.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="250.0" y1="476.0" x2="328.0" y2="504.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="18.7" y="509.4" width="126.6" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="82.0" y="528.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a48" text-anchor="middle"><tspan x="82.0" dy="0.0">збіглася:</tspan><tspan x="82.0" dy="14.3">дані цілі, віддай</tspan></text>
<rect x="277.8" y="509.4" width="120.3" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="338.0" y="528.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a5271b" text-anchor="middle"><tspan x="338.0" dy="0.0">не збіглася:</tspan><tspan x="338.0" dy="14.3">відкинь, повтори</tspan></text>
<rect x="470.0" y="48.0" width="262.0" height="196.0" rx="8" fill="#fbfbfd" stroke="#333333" stroke-width="1.4"/>
<text x="601.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило одного біта</text>
<text x="601.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="601.0" dy="0.0">низько 50 мкс — завжди</tspan><tspan x="601.0" dy="13.7">(роздільник, не дані)</tspan></text>
<text x="601.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="601.0" dy="0.0">потім високо:</tspan><tspan x="601.0" dy="15.6">≈26 мкс → біт 0</tspan><tspan x="601.0" dy="15.6">≈70 мкс → біт 1</tspan></text>
<text x="601.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">дивишся на ШИРИНУ,</text>
<text x="601.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">не на рівень лінії</text>
<rect x="470.0" y="256.0" width="262.0" height="100.0" rx="8" fill="#fbfbfd" stroke="#333333" stroke-width="1.4"/>
<text x="601.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пауза між читаннями</text>
<text x="601.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="601.0" dy="0.0">≥ 1 с (краще 2 с):</tspan><tspan x="601.0" dy="14.3">давач міряє повільно,</tspan><tspan x="601.0" dy="14.3">частіше — самі помилки</tspan></text>
</svg>