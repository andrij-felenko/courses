<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт KY-037: мікрофон дає плавний AO, компаратор — цифровий DO</text>
<rect x="40.0" y="140.0" width="150.0" height="90.0" rx="10" fill="#eaf1fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="115.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">електретний</tspan><tspan x="115.0" dy="15.0">мікрофон</tspan><tspan x="115.0" dy="15.0">(CMA-6542PF)</tspan></text>
<rect x="250.0" y="140.0" width="160.0" height="90.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="330.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">підсилення +</tspan><tspan x="330.0" dy="15.0">зсув до ½·+V</tspan><tspan x="330.0" dy="15.0">(робоча точка)</tspan></text>
<rect x="470.0" y="140.0" width="170.0" height="90.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="555.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">компаратор LM393</tspan><tspan x="555.0" dy="15.0">порівнює з порогом</tspan><tspan x="555.0" dy="15.0">(гвинтик)</tspan></text>
<line x1="190.0" y1="185.0" x2="250.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="410.0" y1="185.0" x2="470.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="440.0" cy="185.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="440.0" y1="185.0" x2="440.0" y2="300.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="440.0" y1="300.0" x2="820.0" y2="300.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="824.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">AO</text>
<text x="824.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(аналог)</text>
<text x="448.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">плавна напруга мікрофона: коливається навколо ½·+V</text>
<line x1="640.0" y1="185.0" x2="820.0" y2="185.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="824.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">DO</text>
<text x="824.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(0 / 1)</text>
<text x="648.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">перескок за поріг → цифровий рівень</text>
<rect x="138.8" y="324.2" width="662.4" height="31.5" rx="6" fill="#f4f8f4" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">AO — миттєвий голос мікрофона (треба обробити самому);  DO — уже готове «гучно / тихо» щодо порога</tspan></text>
</svg>