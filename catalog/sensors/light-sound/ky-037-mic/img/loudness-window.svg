<rect x="690.0" y="80.0" width="230.0" height="120.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">СПОСІБ 1 — розмах</tspan><tspan x="805.0" dy="14.3">max−min за вікно.</tspan><tspan x="805.0" dy="14.3">Швидко, ловить піки,</tspan><tspan x="805.0" dy="14.3">чутливий до одного</tspan><tspan x="805.0" dy="14.3">випадкового виплеску.</tspan></text>
<rect x="690.0" y="220.0" width="230.0" height="130.0" rx="6" fill="#eafaef" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">СПОСІБ 2 — RMS</tspan><tspan x="805.0" dy="13.7">σ = √(Σ(vᵢ−серед)² / N).</tspan><tspan x="805.0" dy="13.7">Середнє відхилення від</tspan><tspan x="805.0" dy="13.7">зсуву; стійкіший до</tspan><tspan x="805.0" dy="13.7">одиничного викиду,</tspan><tspan x="805.0" dy="13.7">ближчий до відчуття гучності.</tspan></text>
<rect x="124.6" y="414.5" width="690.9" height="31.0" rx="6" fill="#fff8e6" stroke="#e0b400" stroke-width="1.5"/><text x="470.0" y="433.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Обидва беруть ПАЧКУ відліків за вікно, а не одну точку. Розмах — простіший; RMS — рівніший і менш смиканий.</tspan></text>
