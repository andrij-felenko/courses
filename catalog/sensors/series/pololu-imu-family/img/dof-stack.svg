<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо чотири різні давачі: кожен знає своє, жоден — усе</text>
<text x="180.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Давач</text>
<text x="465.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">що дає</text>
<text x="770.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">чого НЕ вистачає поодинці</text>
<rect x="60.0" y="92.0" width="235.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="177.5" y="121.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="177.5" dy="0.0">Акселерометр</tspan><tspan x="177.5" dy="16.2">(3 осі)</tspan></text>
<rect x="335.0" y="92.0" width="260.0" height="66.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="465.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">де «низ», нахил (бачить тяжіння)</tspan></text>
<rect x="640.0" y="92.0" width="260.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">бреше під час руху й трясіння</tspan></text>
<line x1="299.0" y1="125.0" x2="331.0" y2="125.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="599.0" y1="125.0" x2="636.0" y2="125.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="188.0" width="235.0" height="66.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2.0"/><text x="177.5" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="177.5" dy="0.0">Гіроскоп</tspan><tspan x="177.5" dy="16.2">(3 осі)</tspan></text>
<rect x="335.0" y="188.0" width="260.0" height="66.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="465.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">як швидко тіло обертається</tspan></text>
<rect x="640.0" y="188.0" width="260.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="224.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">кут «пливе» — похибка накопичується</tspan></text>
<line x1="299.0" y1="221.0" x2="331.0" y2="221.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="599.0" y1="221.0" x2="636.0" y2="221.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="284.0" width="235.0" height="66.0" rx="6" fill="#ffffff" stroke="#c77d0a" stroke-width="2.0"/><text x="177.5" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="177.5" dy="0.0">Магнетометр</tspan><tspan x="177.5" dy="16.2">(3 осі)</tspan></text>
<rect x="335.0" y="284.0" width="260.0" height="66.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="465.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">азимут — куди дивиться ніс</tspan></text>
<rect x="640.0" y="284.0" width="260.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">збиває будь-яке залізо й струм поряд</tspan></text>
<line x1="299.0" y1="317.0" x2="331.0" y2="317.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="599.0" y1="317.0" x2="636.0" y2="317.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="380.0" width="235.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="177.5" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="177.5" dy="0.0">Барометр</tspan><tspan x="177.5" dy="16.2">(тиск)</tspan></text>
<rect x="335.0" y="380.0" width="260.0" height="66.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="465.0" y="416.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">висота над рівнем моря</tspan></text>
<rect x="640.0" y="380.0" width="260.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="416.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">тільки AltIMU-10; чутливий до вітру/дверей</tspan></text>
<line x1="299.0" y1="413.0" x2="331.0" y2="413.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="599.0" y1="413.0" x2="636.0" y2="413.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="160.0" y="479.4" width="640.0" height="45.3" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="498.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Саме тому дані ЗЛИВАЮТЬ фільтром: він бере сильний бік кожного давача</tspan><tspan x="480.0" dy="14.3">й гасить слабкий. Модуль лише чесно віддає числа — орієнтацію рахує код МК.</tspan></text>
</svg>