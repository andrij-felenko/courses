<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому «MQ» нічого не «розшифровується»</text>
<rect x="104.0" y="82.5" width="212.0" height="71.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Здається:</tspan><tspan x="210.0" dy="16.2">«MQ» — абревіатура,</tspan><tspan x="210.0" dy="16.2">за буквами — якісь слова</tspan></text>
<rect x="543.0" y="82.5" width="274.0" height="71.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a46" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Насправді:</tspan><tspan x="680.0" dy="16.2">«MQ-» — лише префікс серії.</tspan><tspan x="680.0" dy="16.2">Весь зміст — у числі після нього</tspan></text>
<line x1="320.0" y1="118.0" x2="539.0" y2="118.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="429.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">розшифровки немає</text>
<text x="450.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#1a1a1a" text-anchor="middle" font-weight="700">MQ-135</text>
<line x1="408.0" y1="246.0" x2="250.0" y2="276.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="190.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="190.0" dy="0.0">префікс серії</tspan><tspan x="190.0" dy="13.7">(без слова за буквами)</tspan></text>
<line x1="492.0" y1="246.0" x2="660.0" y2="276.0" stroke="#1e7a46" stroke-width="1.2"/>
<text x="730.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e7a46" text-anchor="middle"><tspan x="730.0" dy="0.0">число — ось воно й каже,</tspan><tspan x="730.0" dy="13.7">під який газ заточено шар</tspan></text>
</svg>