<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки взялася родина MQ: одна ідея, багато виробників</text>
<rect x="77.2" y="81.8" width="165.6" height="96.4" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="160.0" dy="0.0">1968 — Наойосі Тагучі</tspan><tspan x="160.0" dy="15.6">(Японія): перший</tspan><tspan x="160.0" dy="15.6">серійний давач газу</tspan><tspan x="160.0" dy="15.6">на SnO₂ (TGS,</tspan><tspan x="160.0" dy="15.6">фірма Figaro)</tspan></text>
<rect x="344.6" y="89.6" width="170.8" height="80.8" rx="6" fill="#fff8e6" stroke="#d6a419" stroke-width="1.5"/><text x="430.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Спільний принцип:</tspan><tspan x="430.0" dy="15.6">нагріта плівка SnO₂,</tspan><tspan x="430.0" dy="15.6">чий опір падає</tspan><tspan x="430.0" dy="15.6">від горючого газу</tspan></text>
<rect x="630.6" y="81.8" width="158.8" height="96.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a46" text-anchor="middle"><tspan x="710.0" dy="0.0">Китайські MQ</tspan><tspan x="710.0" dy="15.6">(Hanwei, Zhengzhou;</tspan><tspan x="710.0" dy="15.6">нині масово Winsen):</tspan><tspan x="710.0" dy="15.6">дешева родина</tspan><tspan x="710.0" dy="15.6">на тому ж принципі</tspan></text>
<line x1="242.8" y1="130.0" x2="344.6" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="515.4" y1="130.0" x2="630.6" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">той самий</text>
<text x="295.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">фізичний ефект</text>
<text x="570.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">здешевили</text>
<text x="570.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">й розмножили</text>
<rect x="99.9" y="266.4" width="660.1" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">«MQ» — лише префікс серії, не абревіатура-слово. Номер після нього (MQ-2, MQ-7, MQ-135)</tspan><tspan x="430.0" dy="15.6">каже, до якого газу елемент найчутливіший. Плата, обв'язка й код у варіантів майже однакові —</tspan><tspan x="430.0" dy="15.6">різниться склад чутливого шару й температура нагрівача.</tspan></text>
</svg>