<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення HW-038: S→АЦП, −→GND, а «+» краще від цифрової ніжки (вмикати лише на читання)</text>
