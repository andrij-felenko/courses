<rect x="150.0" y="392.0" width="560.0" height="40.0" rx="6" fill="#fff9e6" stroke="#b8860b" stroke-width="1.5"/><text x="430.0" y="401.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">GPIO не живить щуп напряму, а лише ВІДЧИНЯЄ транзистор: слабкий струм бази</tspan><tspan x="430.0" dy="14.3">(через Rбази) вмикає сильніший струм колектора крізь щуп. Так вивід не</tspan><tspan x="430.0" dy="14.3">перевантажується, а щуп живиться повним струмом лише на мілісекунди заміру.</tspan></text>
