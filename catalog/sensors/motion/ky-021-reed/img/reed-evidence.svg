<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одному твердженню віриш, іншому — ні: драбина доказовості</text>
<rect x="120.0" y="80.0" width="640.0" height="82.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="142.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Патент US 2 264 746 (Елвуд, 1941)</text>
<text x="142.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">первинний документ: дата, ім'я, серійний номер, креслення</text>
<rect x="790.0" y="105.5" width="120.0" height="31.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">ФАКТ</tspan></text>
<rect x="120.0" y="170.0" width="640.0" height="82.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="142.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Перша серійна партія Bell, 1940</text>
<text x="142.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">збігається в кількох незалежних джерелах</text>
<rect x="790.0" y="195.5" width="120.0" height="31.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">ФАКТ</tspan></text>
<rect x="120.0" y="260.0" width="640.0" height="82.0" rx="8" fill="#fff7e6" stroke="#c0392b" stroke-width="1.6"/>
<text x="142.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Коваленков придумав магнітний контакт, 1922</text>
<text x="142.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">живе у фаховій літературі; у його ж біографії — ані слова</text>
<rect x="790.0" y="285.5" width="120.0" height="31.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">СПІРНО</tspan></text>
<rect x="120.0" y="350.0" width="640.0" height="82.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="142.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«Авторське свідоцтво СРСР № 466, 1922»</text>
<text x="142.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">рік і тип документа не сходяться з історією таких свідоцтв</text>
<rect x="790.0" y="375.5" width="120.0" height="31.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="394.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">СУМНІВНО</tspan></text>
<rect x="120.0" y="440.0" width="640.0" height="82.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="142.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«Геркон — суто російський винахід»</text>
<text x="142.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">стягує чотирьох різних людей у гасло; перевірки не витримує</text>
<rect x="790.0" y="465.5" width="120.0" height="31.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="484.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">МІФ</tspan></text>
</svg>