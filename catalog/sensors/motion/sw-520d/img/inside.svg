<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині SW-520D: кулька в трубці замикає два контакти або скочується геть</text>
<polygon points="119.6,90.1 368.2,116.3 360.4,189.9 111.8,163.7" fill="#eef1f4" stroke="#5f6368" stroke-width="1.8"/>
<line x1="361.4" y1="123.6" x2="401.2" y2="127.8" stroke="#c8901f" stroke-width="4.0"/>
<line x1="355.3" y1="181.3" x2="395.1" y2="185.5" stroke="#c8901f" stroke-width="4.0"/>
<circle cx="332.5" cy="149.7" r="26.0" fill="#9aa0a6" stroke="#5f6368" stroke-width="1.8"/>
<circle cx="325.5" cy="142.7" r="5.0" fill="#d6d9dc" stroke="none" stroke-width="0.0"/>
<text x="434.1" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">контакт</text>
<text x="434.1" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАМКНЕНО</text>
<text x="240.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">золотий кінець нижче / рівно + струс → кулька на контактах → ON</text>
<polygon points="111.1,369.3 337.7,263.6 368.9,330.7 142.3,436.4" fill="#eef1f4" stroke="#5f6368" stroke-width="1.8"/>
<line x1="335.6" y1="273.4" x2="371.8" y2="256.5" stroke="#c8901f" stroke-width="4.0"/>
<line x1="360.1" y1="326.0" x2="396.4" y2="309.1" stroke="#c8901f" stroke-width="4.0"/>
<circle cx="155.7" cy="389.3" r="26.0" fill="#9aa0a6" stroke="#5f6368" stroke-width="1.8"/>
<circle cx="148.7" cy="382.3" r="5.0" fill="#d6d9dc" stroke="none" stroke-width="0.0"/>
<text x="419.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">розрив</text>
<text x="419.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">РОЗІМКНЕНО</text>
<text x="240.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">нахил золотим кінцем ДОГОРИ (&gt; ~15°) → кулька скотилась → OFF</text>
<rect x="560.0" y="100.0" width="270.0" height="150.0" rx="10" fill="#fafbfc" stroke="#6b7280" stroke-width="1.5"/>
<text x="695.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">що бачить схема</text>
<circle cx="590.0" cy="158.0" r="12.0" fill="#9aa0a6" stroke="#5f6368" stroke-width="1.6"/>
<text x="612.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">металева кулька всередині</text>
<line x1="580.0" y1="190.0" x2="602.0" y2="190.0" stroke="#c8901f" stroke-width="4.0"/>
<text x="612.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">два позолочені контакти</text>
<text x="580.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">ON = кулька перемкнула їх;</text>
<text x="580.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">OFF = скотилась, розрив</text>
<rect x="128.4" y="429.4" width="603.1" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="448.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">це просто механічний вимикач: пружних електронів немає, є лиш металева кулька й сила тяжіння.</tspan><tspan x="430.0" dy="14.3">нахил або поштовх зрушує кульку — контакт то з'являється, то зникає. напрямок несиметричний.</tspan></text>
</svg>