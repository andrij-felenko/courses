<rect x="133.7" y="407.9" width="612.5" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="426.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">delay() зупиняє ВСЮ програму — так не можна в реальному пристрої. натомість: запам'ятали millis()</tspan><tspan x="440.0" dy="13.7">першого фронту → приймаємо подію → доки (millis − t0) &lt; 40 мс, пін НЕ читаємо. loop крутиться далі.</tspan></text>
