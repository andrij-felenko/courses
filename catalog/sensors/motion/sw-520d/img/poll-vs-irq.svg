<rect x="126.7" y="369.9" width="606.5" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="388.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">SW-520D просто смикає пін — байдуже, як його читати. опитування простіше для навчання; переривання</tspan><tspan x="430.0" dy="13.7">потрібне, коли МК має спати на батареї й прокидатися лише від струсу. код обох — у прошивці нижче.</tspan></text>
