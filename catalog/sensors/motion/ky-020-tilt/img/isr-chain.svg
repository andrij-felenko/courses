<rect x="119.8" y="412.9" width="660.4" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="431.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">переривання зривається на КОЖНОМУ фронті — тож брязкучий пін дає бурю хибних; щоб узяти нахил на</tspan><tspan x="450.0" dy="13.7">перериванні, спершу очисти фронт апаратно (RC + тригер Шмітта) або лови в ISR лише факт і гаси час у loop()</tspan></text>
