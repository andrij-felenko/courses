<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від регістрів до фізичних одиниць</text>
<rect x="30.0" y="105.0" width="180.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">два байти</tspan><tspan x="120.0" dy="16.9">OUTX_L + OUTX_H</tspan></text>
<rect x="275.0" y="96.6" width="190.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">16-бітне</tspan><tspan x="370.0" dy="16.9">число зі знаком</tspan><tspan x="370.0" dy="16.9">(−32768…32767)</tspan></text>
<rect x="550.0" y="105.0" width="200.0" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">× чутливість</tspan><tspan x="650.0" dy="16.9">= g, °/с, гаус</tspan></text>
<line x1="212.0" y1="130.0" x2="274.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="466.0" y1="130.0" x2="549.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="243.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">склеїти</text>
<text x="508.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">×</text>
<text x="390.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Напр. акселерометр на ±2 g: 1 LSB = 0.061 мг, тож 16384 → 16384 × 0.000061 ≈ 1.00 g.</text>
</svg>