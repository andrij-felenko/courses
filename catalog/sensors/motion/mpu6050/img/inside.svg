<rect x="40.0" y="425.0" width="700.0" height="34.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="438.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Обидва давачі вимірюються одночасно й оцифровуються на місці.</tspan><tspan x="390.0" dy="15.6">МК читає готові числа по I2C; DMP може сам зливати осі в кути й класти у FIFO.</tspan></text>
