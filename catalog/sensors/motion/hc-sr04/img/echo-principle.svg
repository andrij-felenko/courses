<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модуль міряє ЧАС, а не відстань: луна летить до перешкоди й назад</text>
<rect x="40.0" y="120.0" width="120.0" height="150.0" rx="10" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="80.0" cy="180.0" r="26.0" fill="#dfe6f0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="80.0" cy="180.0" r="12.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="80.0" cy="238.0" r="26.0" fill="#dfe6f0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="80.0" cy="238.0" r="12.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="128.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">T</text>
<text x="128.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">R</text>
<text x="100.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">HC-SR04</text>
<text x="100.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">T — передавач</text>
<text x="100.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">R — приймач</text>
<rect x="720.0" y="100.0" width="60.0" height="200.0" rx="6" fill="#f0ece0" stroke="#6b7280" stroke-width="1.8"/>
<text x="750.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">перешкода</text>
<line x1="168.0" y1="180.0" x2="714.0" y2="180.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="440.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1 · імпульс 40 кГц летить уперед</text>
<text x="440.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">8 хвиль у пачці</text>
<line x1="714.0" y1="238.0" x2="168.0" y2="238.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="440.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2 · відбита луна вертається до R</text>
<rect x="89.1" y="328.2" width="701.7" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">час туди-й-назад t  →  відстань s = t · 340 / 2   (звук ~340 м/с; ділимо на 2 — луна пройшла шлях двічі)</tspan></text>
<rect x="237.5" y="366.2" width="405.0" height="31.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">зручна форма для мікроконтролера:  s(см) = t(мкс) / 58</tspan></text>
</svg>