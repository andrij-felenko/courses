<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині TOF10120: давач Sharp + власний мікроконтролер</text>
<rect x="55.0" y="96.0" width="220.0" height="320.0" rx="12" fill="#fafbfc" stroke="#6b7280" stroke-width="1.7"/>
<text x="165.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">давач Sharp (GP2AP)</text>
<rect x="81.0" y="152.0" width="168.0" height="64.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="165.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">VCSEL-лазер 940 нм</text>
<text x="165.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">невидимий спалах</text>
<rect x="81.0" y="234.0" width="168.0" height="64.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="165.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">матриця SPAD</text>
<text x="165.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лічить окремі фотони</text>
<rect x="81.0" y="316.0" width="168.0" height="68.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="165.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">таймер: час туди й назад</text>
<text x="165.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ сира відстань</text>
<rect x="360.0" y="156.0" width="200.0" height="200.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="1.9"/>
<text x="460.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">власний МК модуля</text>
<text x="460.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">фільтрує й усереднює,</text>
<text x="460.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">перекладає в міліметри,</text>
<text x="460.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тримає налаштування,</text>
<text x="460.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">розуміє ASCII-команди</text>
<line x1="275.0" y1="256.0" x2="360.0" y2="256.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="650.0" y="132.0" width="240.0" height="72.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/>
<text x="770.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">I2C  (адреса 0x52)</text>
<text x="770.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">регістр 0x00 → 2 байти</text>
<text x="770.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">старший · молодший = мм</text>
<rect x="650.0" y="284.0" width="240.0" height="72.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/>
<text x="770.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">UART  9600 8N1</text>
<text x="770.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">текст ASCII: «748mm»</text>
<text x="770.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сам шле + приймає команди</text>
<line x1="560.0" y1="200.0" x2="650.0" y2="168.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="560.0" y1="312.0" x2="650.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="135.5" y="458.2" width="668.9" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">МК ховає фізику: назовні — готові міліметри двома каналами, і UART ще й слухає команди налаштування</tspan></text>
</svg>