<text x="125.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">analogRead</text>
<text x="125.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">рівно за</text>
<text x="125.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">таймером ~50 Гц</text>
<rect x="262.5" y="92.0" width="190.0" height="150.0" rx="10" fill="#f3e8fb" stroke="#8e44ad" stroke-width="2.0"/>
