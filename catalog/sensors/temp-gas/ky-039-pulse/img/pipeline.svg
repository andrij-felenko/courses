<text x="590.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кроки 1–3 очищають хвилю; крок 4 — найтонший (не порахувати шум за удар); крок 5 — арифметика.</text>
