<text x="357.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">середнє —</text>
<text x="357.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«поточний нуль»</text>
<rect x="495.0" y="92.0" width="190.0" height="150.0" rx="10" fill="#fff7e6" stroke="#b8860b" stroke-width="2.0"/>
