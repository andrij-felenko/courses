<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від сирого відліку до пульсу: пʼять кроків обробки в коді</text>
<rect x="30.0" y="92.0" width="190.0" height="150.0" rx="10" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
