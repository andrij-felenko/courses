<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один вимір температури — це три акти діалогу по одному дроту</text>
<rect x="45.0" y="90.0" width="270.0" height="300.0" rx="12" fill="#eef2ff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="180.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Акт 1</tspan><tspan x="180.0" dy="17.6">СКИДАННЯ</tspan></text>
<text x="180.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">майстер тримає</text>
<text x="180.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">лінію низько ≥480 мкс</text>
<text x="180.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ давач відповідає</text>
<text x="180.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">presence-імпульсом</text>
<line x1="318.0" y1="240.0" x2="342.0" y2="240.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="345.0" y="90.0" width="270.0" height="300.0" rx="12" fill="#eaf3fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="480.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Акт 2</tspan><tspan x="480.0" dy="17.6">АДРЕСА (ROM)</tspan></text>
<text x="480.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Skip ROM 0xCC —</text>
<text x="480.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«усім»,</text>
<text x="480.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">або Match ROM 0x55</text>
<text x="480.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">+ 64-бітний код —</text>
<text x="480.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">одному за іменем</text>
<line x1="618.0" y1="240.0" x2="642.0" y2="240.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="645.0" y="90.0" width="270.0" height="300.0" rx="12" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="780.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Акт 3</tspan><tspan x="780.0" dy="17.6">ФУНКЦІЯ</tspan></text>
<text x="780.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Convert T 0x44 —</text>
<text x="780.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«виміряй»;</text>
<text x="780.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">потім знову скидання,</text>
<text x="780.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">адреса, і</text>
<text x="780.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Read Scratchpad 0xBE —</text>
<text x="780.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">забрати 9 байтів</text>
<text x="480.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Кожен акт — це послідовність тайм-слотів на лінії DQ. Спершу скидання будить шину, потім ROM-команда вибирає, з ким говоримо, і аж тоді йде функція (виміряти чи прочитати).</tspan></text>
</svg>