<text x="824.7" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">МАСОВИЙ ВИПУСК</text>
<line x1="137.4" y1="300.0" x2="579.8" y2="300.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="137.4" y1="294.0" x2="137.4" y2="306.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="579.8" y1="294.0" x2="579.8" y2="306.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="358.6" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">≈ століття без практичного приладу</text>
<text x="358.6" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ранні зразки нестабільні й нетехнологічні</text>
<rect x="166.7" y="432.8" width="606.5" height="30.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="451.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">«хтось помітив ефект» ≠ «хтось зробив робочу річ» ≠ «хтось запустив у серію» — це три різні внески</tspan></text>
