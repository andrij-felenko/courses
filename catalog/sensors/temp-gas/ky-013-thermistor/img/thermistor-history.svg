<text x="579.8" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Семюел Рубен</text>
<rect x="514.8" y="192.5" width="130.0" height="39.0" rx="6" fill="#f7f9fc" stroke="#27ae60" stroke-width="1.5"/><text x="579.8" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="579.8" dy="0.0">перший придатний</tspan><tspan x="579.8" dy="13.0">до випуску термістор</tspan></text>
<text x="579.8" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">РОБОЧИЙ ПРИЛАД</text>
