<text x="137.4" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Майкл Фарадей</text>
<rect x="83.8" y="192.5" width="107.2" height="39.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.5"/><text x="137.4" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="137.4" dy="0.0">Ag₂S проводить</tspan><tspan x="137.4" dy="13.0">краще з нагрівом</tspan></text>
<text x="137.4" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">СПОСТЕРЕЖЕННЯ</text>
