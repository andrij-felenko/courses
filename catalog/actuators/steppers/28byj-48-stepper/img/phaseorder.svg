<text x="480.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Магнітно фази згруповані так (не за номером виводу, а за котушкою):</text>
