<rect x="163.7" y="387.9" width="612.5" height="44.1" rx="6" fill="#fdf6ec" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Пасивний зумер пищить від слабкого струму, тож S на невеликому корпусі можна вести прямо на пін МК.</tspan><tspan x="470.0" dy="13.7">Голосніше або від 5 В — між пін і зумер став транзистор-ключ (напр. NPN + резистор на базу).</tspan></text>
