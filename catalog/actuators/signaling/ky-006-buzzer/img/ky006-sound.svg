<rect x="142.8" y="317.9" width="654.4" height="44.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Повторюй перепади 440 разів на секунду — повітря колихнеться 440 разів за секунду: чуєш ноту «ля».</tspan><tspan x="470.0" dy="13.7">Швидше перепади — вищий тон, повільніше — нижчий. Гучність — коло механічного резонансу пластини (≈2 кГц).</tspan></text>
