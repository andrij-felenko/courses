<rect x="178.7" y="387.9" width="582.6" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">R, G, B — на піни з тильдою «~» (апаратний PWM): яскравість кожного кольору задає analogWrite.</tspan><tspan x="470.0" dy="13.7">Спільний «−» — на GND. Резистори на платі вже є, тож 5-вольтові піни підключаються напряму.</tspan></text>
