<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення KY-034: плюс — на крайній S, мінус — на GND; середній штир зайвий</text>
<rect x="70.0" y="96.0" width="250.0" height="210.0" rx="14" fill="#fffdf5" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="195.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">KY-034</text>
<text x="195.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">самограйний RGB-вогник</text>
<circle cx="320.0" cy="188.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="302.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">S</text>
<text x="302.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end">плюс сюди</text>
<circle cx="320.0" cy="233.0" r="6.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<text x="302.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">середній</text>
<text x="302.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end">= мінус, не чіпати</text>
<circle cx="320.0" cy="278.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<text x="302.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">−</text>
<text x="302.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="end">мінус</text>
<rect x="610.0" y="96.0" width="260.0" height="210.0" rx="14" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="740.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">плата (Arduino / ESP32…)</text>
<circle cx="610.0" cy="188.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="626.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">цифровий пін</text>
<text x="626.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">HIGH — світиться, LOW — згас</text>
<text x="626.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">(не підключати)</text>
<circle cx="610.0" cy="278.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<text x="626.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">GND</text>
<text x="626.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="start">земля</text>
<line x1="326.0" y1="188.0" x2="604.0" y2="188.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="326.0" y1="278.0" x2="604.0" y2="278.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="465.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">плюс: на цифровий пін АБО прямо на 3.3–5 В</text>
<rect x="172.7" y="361.9" width="594.6" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="380.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Плюс подаєш на крайній S: прямо на живлення — вогник горить завжди; на цифровий пін —</tspan><tspan x="470.0" dy="13.7">керуєш лише вмиканням (кольором керувати не можна). Середній штир повторює мінус — його лишаємо.</tspan></text>
</svg>