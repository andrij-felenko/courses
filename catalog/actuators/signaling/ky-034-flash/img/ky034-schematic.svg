<rect x="197.3" y="429.4" width="565.5" height="45.3" rx="6" fill="#fffdf5" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="448.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Увесь «мозок» — усередині корпусу LED: власний генератор сам цокає, лічильник перебирає</tspan><tspan x="480.0" dy="14.3">комбінації яскравостей R·G·B. Назовні — лише живлення й земля; входу для команд немає.</tspan></text>
