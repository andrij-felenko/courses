<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від іскри на контакті до діода поперек котушки: як дозріла схема</text>
<line x1="150.0" y1="78.0" x2="150.0" y2="614.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="150.0" cy="122.7" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<text x="132.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">1832</text>
<line x1="157.0" y1="122.7" x2="220.0" y2="122.7" stroke="#2457d6" stroke-width="1.6"/>
<rect x="220.0" y="89.0" width="740.0" height="67.3" rx="8" fill="#fafbfc" stroke="#2457d6" stroke-width="1.6"/>
<text x="234.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Джозеф Генрі бачить іскру</text>
<rect x="228.0" y="115.0" width="724.0" height="37.3" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="590.0" y="137.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Розриваєш коло з котушкою — на контакті скаче іскра. Генрі пояснює її самоіндукцією: явище вже є, ліку ще нема.</tspan></text>
<circle cx="150.0" cy="212.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<text x="132.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">1834</text>
<line x1="157.0" y1="212.0" x2="220.0" y2="212.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="220.0" y="178.3" width="740.0" height="67.3" rx="8" fill="#fafbfc" stroke="#2457d6" stroke-width="1.6"/>
<text x="234.0" y="198.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Фарадей: «додатковий струм»</text>
<rect x="228.0" y="204.3" width="724.0" height="37.3" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="590.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Майкл Фарадей друкує про «extra current at break» — той самий кидок при розмиканні. Проблему названо й описано.</tspan></text>
<circle cx="150.0" cy="301.3" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="132.0" y="305.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">~1900–1920</text>
<line x1="157.0" y1="301.3" x2="220.0" y2="301.3" stroke="#6b7280" stroke-width="1.6"/>
<rect x="220.0" y="267.7" width="740.0" height="67.3" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.6"/>
<text x="234.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Іскру душать конденсатором</text>
<rect x="228.0" y="293.7" width="724.0" height="37.3" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="590.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">У реле й дзвінках поперек КОНТАКТУ ставлять конденсатор чи RC-ланку. Придатного діода поперек котушки ще нема.</tspan></text>
<circle cx="150.0" cy="390.7" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="132.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">1920 · 1933</text>
<line x1="157.0" y1="390.7" x2="220.0" y2="390.7" stroke="#27ae60" stroke-width="1.6"/>
<rect x="220.0" y="357.0" width="740.0" height="67.3" rx="8" fill="#fafbfc" stroke="#27ae60" stroke-width="1.6"/>
<text x="234.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">З'являються тверді випрямлячі</text>
<rect x="228.0" y="383.0" width="724.0" height="37.3" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="590.0" y="405.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Мідно-закисний (1920) і селеновий (1933) дають перший придатний вентиль — тепер є ЩО поставити поперек обмотки.</tspan></text>
<circle cx="150.0" cy="480.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<text x="132.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">~1930 → 1950</text>
<line x1="157.0" y1="480.0" x2="220.0" y2="480.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="220.0" y="446.3" width="740.0" height="67.3" rx="8" fill="#fafbfc" stroke="#c0392b" stroke-width="1.6"/>
<text x="234.0" y="466.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Слово flyback з ЕПТ</text>
<rect x="228.0" y="472.3" width="724.0" height="37.3" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="590.0" y="494.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Схеми зворотного ходу променя (flyback) в осцилографах і ТБ; звідти «flyback» перейде на кидок індуктивності.</tspan></text>
<circle cx="150.0" cy="569.3" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="132.0" y="573.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">кінець 1950-х →</text>
<line x1="157.0" y1="569.3" x2="220.0" y2="569.3" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="220.0" y="535.7" width="740.0" height="67.3" rx="8" fill="#fafbfc" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="234.0" y="555.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Кремнієвий діод — і звичка</text>
<rect x="228.0" y="561.7" width="724.0" height="37.3" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="590.0" y="584.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Дешевий кремнієвий діод робить діод поперек котушки рефлексом схемотехніка. Ніхто не патентує — це загальна практика.</tspan></text>
</svg>