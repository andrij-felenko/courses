<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">«20» — це не діаметр банки: три корпуси в один масштаб</text>
<line x1="70.0" y1="250.0" x2="990.0" y2="250.0" stroke="#e5e7eb" stroke-width="1.0"/>
<circle cx="230.0" cy="217.6" r="32.4" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.4"/>
<text x="230.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">N20</tspan></text>
<line x1="197.6" y1="276.0" x2="262.4" y2="276.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="197.6" y1="271.0" x2="197.6" y2="281.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="262.4" y1="271.0" x2="262.4" y2="281.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="230.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ø 12 мм</text>
<text x="230.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="230.0" dy="0.0">банка ~10–12 мм</tspan><tspan x="230.0" dy="13.7">(тіло моторчика)</tspan></text>
<circle cx="540.0" cy="195.7" r="54.3" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.4"/>
<text x="540.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">«130»</tspan><tspan x="540.0" dy="16.9">(FA-130)</tspan></text>
<line x1="485.7" y1="276.0" x2="594.3" y2="276.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="485.7" y1="271.0" x2="485.7" y2="281.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="594.3" y1="271.0" x2="594.3" y2="281.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="540.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Ø 20 мм</text>
<text x="540.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="540.0" dy="0.0">банка φ20.1 мм</tspan><tspan x="540.0" dy="13.7">— ось ХТО ~20 мм</tspan></text>
<circle cx="850.0" cy="185.2" r="64.8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.4"/>
<text x="850.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">«260»</tspan><tspan x="850.0" dy="16.9">(RE-260)</tspan></text>
<line x1="785.2" y1="276.0" x2="914.8" y2="276.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="785.2" y1="271.0" x2="785.2" y2="281.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="914.8" y1="271.0" x2="914.8" y2="281.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="850.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ø 24 мм</text>
<text x="850.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="850.0" dy="0.0">банка ~24 мм</tspan><tspan x="850.0" dy="13.7">(більша за «N20»)</tspan></text>
<text x="530.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народна версія: «N20 = банка 20 мм». Але банка «N20» удвічі менша,</text>
<text x="530.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">а рівно ~20 мм має зовсім інший мотор — «130». Отже «20» — не міліметри корпусу.</text>
</svg>