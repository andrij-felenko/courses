<line x1="520.0" y1="143.0" x2="560.0" y2="143.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="690.0" y1="143.0" x2="730.0" y2="143.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="300.0" width="110.0" height="58.0" rx="10" fill="#f3e9f8" stroke="#7d3c98" stroke-width="1.8"/>
<text x="785.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">Потенціометр</text>
<text x="785.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">міряє реальний кут</text>
