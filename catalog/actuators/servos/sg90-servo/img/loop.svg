<text x="100.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">імпульс 1..2 мс</text>
<rect x="200.0" y="110.0" width="150.0" height="66.0" rx="10" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/>
