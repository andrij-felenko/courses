<text x="275.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">порівняти й керувати</text>
<rect x="400.0" y="110.0" width="120.0" height="66.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="460.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">DC-мотор</text>
<text x="460.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">швидко, слабко</text>
<rect x="560.0" y="110.0" width="130.0" height="66.0" rx="10" fill="#fff6e5" stroke="#8a6d00" stroke-width="1.8"/>
<text x="625.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Редуктор</text>
<text x="625.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільно, сильно</text>
<rect x="730.0" y="110.0" width="110.0" height="66.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="785.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вал-качалка</text>
<text x="785.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">кут виходу</text>
