<text x="845.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d3c98" text-anchor="start">вал крутить</text>
<line x1="730.0" y1="329.0" x2="275.0" y2="329.0" stroke="#7d3c98" stroke-width="2.0" stroke-dasharray="6,5"/>
<line x1="275.0" y1="329.0" x2="275.0" y2="176.0" stroke="#7d3c98" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="502.5" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d3c98" text-anchor="middle" font-weight="700">зворотний зв'язок: «а де я насправді?»</text>
<rect x="50.0" y="424.2" width="780.0" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">мозок віднімає реальний кут від заданого; є різниця — крутить мотор у бік її зменшення, доки не збіжаться</tspan></text>
</svg>