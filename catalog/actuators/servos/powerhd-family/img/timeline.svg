<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">На який ринок увійшов Power HD: три епохи RC-серва</text>
<line x1="60.0" y1="215.0" x2="872.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="870.0" y1="215.0" x2="888.0" y2="215.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="880.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">час</text>
<circle cx="195.0" cy="215.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="195.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1960-і</text>
<circle cx="468.0" cy="215.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="468.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1970 – 1991</text>
<circle cx="752.0" cy="215.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="752.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2000-і →</text>
<line x1="195.0" y1="208.0" x2="195.0" y2="169.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="66.0" y="87.0" width="258.0" height="82.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.6"/>
<text x="195.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Каліфорнійські піонери</text>
<text x="195.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Orbit, Bonner, Kraft —</text>
<text x="195.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перші пропорційні системи;</text>
<text x="195.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">дорого, дрібними серіями</text>
<line x1="468.0" y1="222.0" x2="468.0" y2="261.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="339.0" y="261.0" width="258.0" height="82.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="468.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Японці + спільний роз'єм</text>
<text x="468.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Futaba (у RC з 1962), JR, Sanwa</text>
<text x="468.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перебирають ринок; близько 1991</text>
<text x="468.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">роз'єм і протокол — сумісні між брендами</text>
<line x1="752.0" y1="208.0" x2="752.0" y2="169.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="623.0" y="87.0" width="258.0" height="82.0" rx="6" fill="#f7f9fc" stroke="#c0392b" stroke-width="1.6"/>
<text x="752.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Китайський масовий вал</text>
<text x="752.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">дешеві «достатньо хороші» серва;</text>
<text x="752.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TowerPro, Hextronic… і Power HD (2005)</text>
<text x="752.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">тиснуть дорогі японські на масі</text>
<rect x="205.6" y="387.9" width="528.7" height="44.1" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Power HD не винайшов нішу — він зайшов у ГОТОВУ: спільний роз'єм JR і протокол 1–2 мс</tspan><tspan x="470.0" dy="13.7">уже були мовою сумісності, тож дешеве серво ставало на місце дорогого без переробки.</tspan></text>
</svg>