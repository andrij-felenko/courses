<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Момент на розі серва: сила на плечі</text>
<circle cx="250.0" cy="300.0" r="13.0" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="250.0" cy="300.0" r="3.2" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="250.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">вісь вала серва</text>
<text x="250.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(центр обертання)</text>
<line x1="250.0" y1="300.0" x2="610.0" y2="300.0" stroke="#1a1a1a" stroke-width="6.0"/>
<circle cx="610.0" cy="300.0" r="6.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="250.0" y1="286.0" x2="250.0" y2="254.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="610.0" y1="286.0" x2="610.0" y2="254.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="250.0" y1="260.0" x2="610.0" y2="260.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="430.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">плече r  (від осі до точки тяги)</text>
<line x1="610.0" y1="308.0" x2="610.0" y2="378.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="616.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">F</text>
<text x="630.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">сила на тязі</text>
<rect x="609.3" y="100.8" width="181.3" height="98.4" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">момент  M = F · r</tspan><tspan x="700.0" dy="15.6"></tspan><tspan x="700.0" dy="15.6">F — сила на тязі (кгс),</tspan><tspan x="700.0" dy="15.6">r — робоче плече (см),</tspan><tspan x="700.0" dy="15.6">M — момент (кг·см)</tspan></text>
<rect x="217.4" y="395.4" width="465.2" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="414.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Та сама сила на вдвічі довшому плечі вимагає вдвічі більшого моменту.</tspan><tspan x="450.0" dy="14.3">Рахуй момент на РОБОЧОМУ плечі своєї тяги — не на паспортному прикладі.</tspan></text>
</svg>