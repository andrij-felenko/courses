<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як народився літій-полімерний акумулятор</text>
<line x1="70.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="908.0" y1="250.0" x2="924.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="930.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час</text>
<circle cx="130.0" cy="250.0" r="9.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="130.0" y1="241.0" x2="130.0" y2="134.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="37.0" y="30.0" width="186.0" height="100.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="130.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1978 · сухий полімер</text>
<text x="130.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="130.0" dy="0.0">Мішель Арман:</tspan><tspan x="130.0" dy="13.4">ідея твердого</tspan><tspan x="130.0" dy="13.4">полімер-електроліту</tspan><tspan x="130.0" dy="13.4">(PEO+Li). Гарний,</tspan><tspan x="130.0" dy="13.4">але надто повільний.</tspan></text>
<circle cx="310.0" cy="250.0" r="9.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="310.0" y1="259.0" x2="310.0" y2="366.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="217.0" y="370.0" width="186.0" height="100.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/>
<text x="310.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1991 · рідкий Li-ion</text>
<text x="310.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="310.0" dy="0.0">Sony (кер. Йосіо Нісі):</tspan><tspan x="310.0" dy="13.4">перша комерційна</tspan><tspan x="310.0" dy="13.4">Li-ion банка —</tspan><tspan x="310.0" dy="13.4">циліндр, рідкий</tspan><tspan x="310.0" dy="13.4">електроліт.</tspan></text>
<circle cx="490.0" cy="250.0" r="9.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="490.0" y1="241.0" x2="490.0" y2="134.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="397.0" y="30.0" width="186.0" height="100.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/>
<text x="490.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1994 · гель у пакетику</text>
<text x="490.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Bellcore (Ґодз,</tspan><tspan x="490.0" dy="13.4">Шмуц, Тараскон):</tspan><tspan x="490.0" dy="13.4">патент на PVDF-гель.</tspan><tspan x="490.0" dy="13.4">Плаский м'який</tspan><tspan x="490.0" dy="13.4">пакетик замість банки.</tspan></text>
<circle cx="670.0" cy="250.0" r="9.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="670.0" y1="259.0" x2="670.0" y2="366.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="577.0" y="370.0" width="186.0" height="100.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/>
<text x="670.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1996 · PLiON</text>
<text x="670.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">Bellcore називає це</tspan><tspan x="670.0" dy="13.4">«plastic Li-ion»</tspan><tspan x="670.0" dy="13.4">(PLiON) — вже не</tspan><tspan x="670.0" dy="13.4">лабораторія, а</tspan><tspan x="670.0" dy="13.4">готова технологія.</tspan></text>
<circle cx="850.0" cy="250.0" r="9.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="850.0" y1="241.0" x2="850.0" y2="134.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="757.0" y="30.0" width="186.0" height="100.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/>
<text x="850.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1999 · у кишені</text>
<text x="850.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="850.0" dy="0.0">Ericsson T28s:</tspan><tspan x="850.0" dy="13.4">перший телефон</tspan><tspan x="850.0" dy="13.4">на LiPo. Ультратонка</tspan><tspan x="850.0" dy="13.4">комірка 500 мА·год</tspan><tspan x="850.0" dy="13.4">робить апарат тонким.</tspan></text>
</svg>