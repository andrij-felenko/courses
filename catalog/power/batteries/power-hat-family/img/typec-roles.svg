<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">try.SRC: за реакцією CC порт стає входом заряду або виходом віддачі</text>
<text x="400.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ролі Type-C: один роз'єм — два напрямки</text>
<rect x="210.0" y="81.2" width="380.0" height="47.6" rx="6" fill="#faf6fc" stroke="#8e44ad" stroke-width="2.0"/><text x="400.0" y="101.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Порт стартує: try.SRC</tspan><tspan x="400.0" dy="15.6">(пробує роль джерела, виставляє Rp)</tspan></text>
<rect x="85.0" y="226.8" width="250.0" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="210.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Бачить CC донизу (Rd):</tspan><tspan x="210.0" dy="15.0">навпроти СПОЖИВАЧ</tspan></text>
<line x1="310.0" y1="130.0" x2="210.0" y2="226.8" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="325.2" width="250.0" height="59.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="210.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">стає SOURCE →</tspan><tspan x="210.0" dy="14.3">зарядник ON, елемент заряджається</tspan><tspan x="210.0" dy="14.3">транслює «до 3 А»</tspan></text>
<line x1="210.0" y1="273.2" x2="210.0" y2="325.2" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="465.0" y="226.8" width="250.0" height="46.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Бачить CC вгору (Rp):</tspan><tspan x="590.0" dy="15.0">навпроти ДЖЕРЕЛО</tspan></text>
<line x1="490.0" y1="130.0" x2="590.0" y2="226.8" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="465.0" y="325.2" width="250.0" height="59.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="590.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">стає SINK →</tspan><tspan x="590.0" dy="14.3">boost ON, плата віддає живлення</tspan><tspan x="590.0" dy="14.3">(або заряджається сама)</tspan></text>
<line x1="590.0" y1="273.2" x2="590.0" y2="325.2" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Напрямок обирають резистори CC, не код</text>
</svg>