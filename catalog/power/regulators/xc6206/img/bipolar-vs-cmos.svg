<rect x="422.0" y="332.0" width="276.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="353.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Dropout ~ 0.25 В (лише R_on · I)</tspan></text>
<text x="380.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Керувати польовим ключем майже не коштує струму — звідси й мікроамперний спокій, і мале падіння.</text>
