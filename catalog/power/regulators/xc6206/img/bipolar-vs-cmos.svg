<text x="560.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Vout</text>
<line x1="440.0" y1="210.0" x2="534.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6 4"/>
