<text x="560.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">CMOS (PMOS)</text>
<text x="560.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">XC6206 · мікропотужний LDO</text>
<line x1="560.0" y1="142.0" x2="560.0" y2="184.0" stroke="#c0392b" stroke-width="2.5"/>
