<text x="200.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">78xx · 1117-клас</text>
<line x1="200.0" y1="142.0" x2="200.0" y2="184.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="200.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Vin</text>
