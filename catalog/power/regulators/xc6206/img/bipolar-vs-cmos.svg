<rect x="62.0" y="290.0" width="276.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="310.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">I_q ~ міліампери (частина струму йде в базу)</tspan></text>
<rect x="62.0" y="332.0" width="276.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="353.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Dropout ~ 1 В (V_насичення + опір)</tspan></text>
