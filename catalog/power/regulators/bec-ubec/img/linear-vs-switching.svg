<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому UBEC імпульсний, а не лінійний</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Та сама задача: з 11.1 В (3S) зробити 5 В для 3 А серв. Куди дінеться зайва потужність?</text>
<rect x="36.0" y="80.0" width="350.0" height="320.0" rx="10" fill="#fbeeee" stroke="#c0392b" stroke-width="1.6"/>
<text x="211.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">Лінійний BEC</text>
<text x="211.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">прохідний транзистор, палить різницю</text>
<line x1="211.0" y1="142.0" x2="211.0" y2="172.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="84.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">11.1 В · 3 А</text>
<rect x="166.0" y="172.0" width="90.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="211.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">Q</text>
<line x1="211.0" y1="228.0" x2="211.0" y2="262.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="84.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">5 В · 3 А</text>
<line x1="256.0" y1="200.0" x2="322.0" y2="200.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">тепло</text>
<rect x="60.0" y="300.0" width="302.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="211.0" y="322.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="211.0" dy="0.0">P_втрат = (11.1 − 5) · 3 = 18.3 Вт у тепло</tspan></text>
<rect x="60.0" y="346.0" width="302.0" height="38.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="211.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="211.0" dy="0.0">ККД = 5 / 11.1 ≈ 45 %. Радіатор гарячий.</tspan></text>
<rect x="434.0" y="80.0" width="350.0" height="320.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="609.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">Імпульсний UBEC</text>
<text x="609.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">buck: ключ + котушка, перекачує заряд</text>
<line x1="609.0" y1="142.0" x2="609.0" y2="172.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="482.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">11.1 В · 1.4 А</text>
<rect x="564.0" y="172.0" width="90.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="609.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">buck</text>
<line x1="609.0" y1="228.0" x2="609.0" y2="262.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="482.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">5 В · 3 А</text>
<line x1="654.0" y1="200.0" x2="706.0" y2="200.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="714.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">мало</text>
<rect x="458.0" y="300.0" width="302.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="609.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="609.0" dy="0.0">Струм на вході ПАДАЄ: 15 Вт на вихід ≈ 1.4 А зверху</tspan></text>
<rect x="458.0" y="346.0" width="302.0" height="38.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="609.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="609.0" dy="0.0">ККД &gt; 90 %. Ледь теплий.</tspan></text>
<text x="410.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Лінійний бере з батареї СТІЛЬКИ Ж струму, скільки віддає, і різницю палить. Імпульсний бере МЕНШЕ струму на вищій напрузі — тому й економний.</text>
</svg>