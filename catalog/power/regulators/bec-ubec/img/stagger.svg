<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стагер: рознести пускові піки серв у часі, щоб їхня сума не просадила шину</text>
<text x="160.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">А. Усі команди одним кадром → піки збіглися</text>
<line x1="160.0" y1="168.0" x2="880.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">струм</text>
<text x="150.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">0</text>
<rect x="273.7" y="146.0" width="170.5" height="22.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<rect x="273.7" y="124.0" width="170.5" height="22.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<rect x="273.7" y="102.0" width="170.5" height="22.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<rect x="273.7" y="80.0" width="170.5" height="22.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="358.9" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">4 серва разом</text>
<line x1="160.0" y1="116.0" x2="880.0" y2="116.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="880.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">межа струму UBEC</text>
<text x="393.7" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">сума ПРОБИЛА межу → просадка, brown-out</text>
<text x="160.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Б. Кожному серву свій такт → піки не збігаються</text>
<line x1="160.0" y1="420.0" x2="880.0" y2="420.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">струм</text>
<text x="150.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">0</text>
<rect x="188.4" y="398.0" width="132.6" height="22.0" rx="3" fill="#fdecea" stroke="#27ae60" stroke-width="1.6"/>
<text x="254.7" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">серво 1</text>
<rect x="358.9" y="398.0" width="132.6" height="22.0" rx="3" fill="#fdecea" stroke="#27ae60" stroke-width="1.6"/>
<text x="425.3" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">серво 2</text>
<rect x="529.5" y="398.0" width="132.6" height="22.0" rx="3" fill="#fdecea" stroke="#27ae60" stroke-width="1.6"/>
<text x="595.8" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">серво 3</text>
<rect x="700.0" y="398.0" width="132.6" height="22.0" rx="3" fill="#fdecea" stroke="#27ae60" stroke-width="1.6"/>
<text x="766.3" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">серво 4</text>
<line x1="160.0" y1="368.0" x2="880.0" y2="368.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="880.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">та сама межа UBEC</text>
<text x="188.4" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">кожен пік сам по собі, під межею</text>
<line x1="188.4" y1="446.0" x2="358.9" y2="446.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="273.7" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">затримка ~90 мс між сервами</text>
<rect x="70.5" y="498.5" width="879.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="517.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Той самий рух і той самий UBEC — контролер лише шле команди не всі за раз, а по черзі, і сумарний струм не збирається в один високий пік.</tspan></text>
</svg>