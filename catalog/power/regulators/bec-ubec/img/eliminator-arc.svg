<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 812" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="812" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дуга слова «battery eliminator»: 1920-ті → провал → BEC</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">«Усувати батарею» = взяти живлення з наявного джерела, а не возити зайве.</text>
<text x="470.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Слово має провал і воскресіння через десятиліття.</text>
<rect x="64.0" y="104.0" width="812.0" height="238.0" rx="12" fill="#eef6ef" stroke="none" stroke-width="0.0"/>
<rect x="64.0" y="354.0" width="812.0" height="132.0" rx="12" fill="#fbeeee" stroke="none" stroke-width="0.0"/>
<rect x="64.0" y="498.0" width="812.0" height="244.0" rx="12" fill="#eef2fb" stroke="none" stroke-width="0.0"/>
<line x1="470.0" y1="100.0" x2="470.0" y2="734.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">час ↓</text>
<text x="470.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ПЕРША ЕПОХА · лампове радіо 1920-х</text>
<text x="470.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОВАЛ · усувати вже нічого</text>
<text x="470.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ДРУГА ЕПОХА · радіомоделі</text>
<circle cx="470.0" cy="196.0" r="6.0" fill="#27ae60" stroke="#fff" stroke-width="2.0"/>
<line x1="464.0" y1="196.0" x2="428.0" y2="196.0" stroke="#27ae60" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="424.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">1920-ті</text>
<text x="424.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end"><tspan x="424.0" dy="0.0">Три батареї A / B / C:</tspan><tspan x="424.0" dy="14.1">накал, анод, сітка.</tspan><tspan x="424.0" dy="14.1">Кислота тече, розетка</tspan><tspan x="424.0" dy="14.1">поруч — та лампа гуде</tspan></text>
<circle cx="470.0" cy="198.0" r="6.0" fill="#27ae60" stroke="#fff" stroke-width="2.0"/>
<line x1="476.0" y1="198.0" x2="512.0" y2="198.0" stroke="#27ae60" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="516.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">~1923–24</text>
<text x="516.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="516.0" dy="0.0">Мак-Каллоу (Westinghouse)</tspan><tspan x="516.0" dy="14.1">показує AC-лампу:</tspan><tspan x="516.0" dy="14.1">можливо, але гуде</tspan></text>
<circle cx="470.0" cy="288.0" r="6.0" fill="#27ae60" stroke="#fff" stroke-width="2.0"/>
<line x1="464.0" y1="288.0" x2="428.0" y2="288.0" stroke="#27ae60" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="424.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">1924–25</text>
<text x="424.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end"><tspan x="424.0" dy="0.0">Роджерс (Торонто,</tspan><tspan x="424.0" dy="14.1">канадець) прибирає гул,</tspan><tspan x="424.0" dy="14.1">патентує; з 08.1925 —</tspan><tspan x="424.0" dy="14.1">«Rogers Batteryless»,</tspan><tspan x="424.0" dy="14.1">1-й мереж. приймач</tspan></text>
<circle cx="470.0" cy="292.0" r="6.0" fill="#27ae60" stroke="#fff" stroke-width="2.0"/>
<line x1="476.0" y1="292.0" x2="512.0" y2="292.0" stroke="#27ae60" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="516.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">~1926</text>
<text x="516.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="516.0" dy="0.0">RCA виводить свою</tspan><tspan x="516.0" dy="14.1">AC-лампу; індустрія</tspan><tspan x="516.0" dy="14.1">рушає слідом</tspan></text>
<circle cx="470.0" cy="424.0" r="6.0" fill="#c0392b" stroke="#fff" stroke-width="2.0"/>
<line x1="464.0" y1="424.0" x2="428.0" y2="424.0" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="424.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">1928–30</text>
<text x="424.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end"><tspan x="424.0" dy="0.0">Усувачі масові (Philco,</tspan><tspan x="424.0" dy="14.1">Galvin → Motorola) —</tspan><tspan x="424.0" dy="14.1">але вже застарівають</tspan></text>
<circle cx="470.0" cy="428.0" r="6.0" fill="#c0392b" stroke="#fff" stroke-width="2.0"/>
<line x1="476.0" y1="428.0" x2="512.0" y2="428.0" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="516.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1930-ті</text>
<text x="516.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="516.0" dy="0.0">Нові приймачі й так</tspan><tspan x="516.0" dy="14.1">без батарей → усувати</tspan><tspan x="516.0" dy="14.1">нічого. Слово вмирає</tspan></text>
<circle cx="470.0" cy="566.0" r="8.0" fill="#fff" stroke="#2457d6" stroke-width="2.5"/>
<rect x="260.0" y="544.0" width="420.0" height="44.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="569.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ТА САМА ФОРМА ЗАДАЧІ: джерело вже на борту — усунь другу батарею</tspan></text>
<circle cx="470.0" cy="628.0" r="6.0" fill="#2457d6" stroke="#fff" stroke-width="2.0"/>
<line x1="464.0" y1="628.0" x2="428.0" y2="628.0" stroke="#2457d6" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="424.0" y="610.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">~1980-ті</text>
<text x="424.0" y="625.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end"><tspan x="424.0" dy="0.0">Модель: тяга + приймач —</tspan><tspan x="424.0" dy="14.1">знову ДВА джерела, як</tspan><tspan x="424.0" dy="14.1">A і B. Комерц. BEC ~сер.80-х</tspan></text>
<circle cx="470.0" cy="632.0" r="6.0" fill="#2457d6" stroke="#fff" stroke-width="2.0"/>
<line x1="476.0" y1="632.0" x2="512.0" y2="632.0" stroke="#2457d6" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="516.0" y="621.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">далі</text>
<text x="516.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="516.0" dy="0.0">BEC спершу в приймачі,</tspan><tspan x="516.0" dy="14.1">потім функцію бере ESC</tspan></text>
<circle cx="470.0" cy="720.0" r="6.0" fill="#2457d6" stroke="#fff" stroke-width="2.0"/>
<line x1="464.0" y1="720.0" x2="428.0" y2="720.0" stroke="#2457d6" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="424.0" y="702.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">UBEC</text>
<text x="424.0" y="717.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end"><tspan x="424.0" dy="0.0">Окрема коробочка;</tspan><tspan x="424.0" dy="14.1">«U» = Universal. Марка</tspan><tspan x="424.0" dy="14.1">стала загальним словом</tspan></text>
<text x="470.0" y="778.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Назва — слід розв'язаної проблеми: чекає, поки задача тієї ж форми</text>
<text x="470.0" y="794.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">випливе в іншому ремеслі, про яке її перші автори й не думали.</text>
</svg>