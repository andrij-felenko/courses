<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підступ півота: нуль чи мале число на діагоналі</text>
<text x="430.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щоб ділити на діагональний елемент (півот), він має бути не нулем — і краще найбільшим</text>
<line x1="430.0" y1="72.0" x2="430.0" y2="332.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="225.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Нуль на діагоналі → переставити рядки</text>
<rect x="125.0" y="118.0" width="90.0" height="68.0" rx="6" fill="none" stroke="#bbb" stroke-width="1.4"/>
<text x="150.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="190.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="150.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="190.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="170.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">на 0 не поділиш!</text>
<line x1="232.0" y1="152.0" x2="292.0" y2="152.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="262.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">переставити</text>
<rect x="335.0" y="118.0" width="90.0" height="68.0" rx="6" fill="none" stroke="#bbb" stroke-width="1.4"/>
<text x="360.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="400.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="360.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="400.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="380.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тепер півот = 3</text>
<text x="665.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ціна й де працює</text>
<rect x="500.0" y="116.0" width="332.0" height="188.0" rx="10" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="518.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Мале число теж зле: ділення на</text>
<text x="530.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">нього роздуває похибки округлення.</text>
<text x="518.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Тому беруть НАЙБІЛЬШИЙ доступний</text>
<text x="530.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">півот (часткове впорядкування).</text>
<text x="518.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• Складність O(N³) — головна ціна</text>
<text x="530.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">розрахунку великого кола.</text>
<text x="518.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Саме це робить SPICE, склавши</text>
<text x="530.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">матрицю кола.</text>
</svg>
