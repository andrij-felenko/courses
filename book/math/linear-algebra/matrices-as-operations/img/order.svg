<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок важить: R·S ≠ S·R (та сама фігура, різний результат)</text>
<line x1="318.0" y1="110.0" x2="460.0" y2="110.0" stroke="#e4e4e4" stroke-width="1.0"/>
<line x1="330.0" y1="20.0" x2="330.0" y2="180.0" stroke="#e4e4e4" stroke-width="1.0"/>
<polygon points="330.0,110.0 360.0,110.0 360.0,80.0 345.0,68.0 330.0,80.0" fill="#27ae60" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="390.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">вихідна фігура</text>
<text x="390.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">одиничний «прапорець»</text>
<line x1="110.0" y1="320.0" x2="250.0" y2="320.0" stroke="#e4e4e4" stroke-width="1.0"/>
<line x1="120.0" y1="260.0" x2="120.0" y2="420.0" stroke="#e4e4e4" stroke-width="1.0"/>
<polygon points="120.0,320.0 158.6,274.0 142.5,260.5 116.8,278.1 103.9,306.5" fill="#cfe3ff" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="300.0" y1="150.0" x2="175.0" y2="250.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="205.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">R·S</text>
<text x="180.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">R·S  (спершу розтяг, тоді поворот)</text>
<text x="180.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">розтягнутий, далі повернутий</text>
<line x1="530.0" y1="320.0" x2="670.0" y2="320.0" stroke="#e4e4e4" stroke-width="1.0"/>
<line x1="540.0" y1="260.0" x2="540.0" y2="420.0" stroke="#e4e4e4" stroke-width="1.0"/>
<polygon points="540.0,320.0 578.6,303.9 532.6,290.4 494.9,293.1 494.0,306.5" fill="#ffd9d2" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="360.0" y1="150.0" x2="545.0" y2="250.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">S·R</text>
<text x="600.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">S·R  (спершу поворот, тоді розтяг)</text>
<text x="600.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повернутий, далі розтягнутий</text>
<text x="380.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3ea8" text-anchor="middle" font-style="italic">Множення матриць читають праворуч-наліво; інша черга — інша геометрія.</text>
</svg>