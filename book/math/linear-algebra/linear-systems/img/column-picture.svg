<rect x="610.9" y="53.4" width="202.1" height="85.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="712.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="712.0" dy="0.0">Ax = b означає:</tspan><tspan x="712.0" dy="16.2">змішати стовпці a₁, a₂</tspan><tspan x="712.0" dy="16.2">з вагами x, y → дістати b</tspan><tspan x="712.0" dy="16.2">тут  2·a₁ + 1·a₂ = b</tspan></text>
