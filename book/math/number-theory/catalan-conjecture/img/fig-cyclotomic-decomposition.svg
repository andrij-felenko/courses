<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Факторизація в круговому полі та ануляція Стікельберґера</text>
<rect x="20.0" y="15.0" width="720.0" height="35.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Алгебраїчний механізм Міхайлеску: факторизація у круговому полі Z[ζₚ]</text>
<rect x="50.0" y="70.0" width="280.0" height="60.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="190.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">Рівняння xᵖ - 1 = y𝑞</text>
<text x="190.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1c7ed6" text-anchor="middle">Розклад у кільці цілих Z[ζₚ]</text>
<line x1="330.0" y1="100.0" x2="430.0" y2="100.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430.0" y="70.0" width="280.0" height="60.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="570.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">(x - 1) ∏ (x - ζʲ) = y𝑞</text>
<text x="570.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle">Добуток p множників у Z[ζₚ]</text>
