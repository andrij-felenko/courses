<line x1="190.0" y1="130.0" x2="190.0" y2="165.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="165.0" width="280.0" height="65.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="190.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle" font-weight="700">Умови Касселса &amp; Віферіха</text>
<text x="190.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">p || y,  p^(q-1) ≡ 1 (mod q²)</text>
<text x="190.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">q || x,  q^(p-1) ≡ 1 (mod p²)</text>
