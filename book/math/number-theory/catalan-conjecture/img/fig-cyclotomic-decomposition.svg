<text x="570.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9c36b5" text-anchor="middle" font-weight="700">Ідеал Стікельберґера S ⊂ Z[G]</text>
<text x="570.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ae3ec9" text-anchor="middle">Ануляція класу ідеалів (x - ζ)</text>
<text x="570.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">(x - ζ) · S = (α)^q (головний ідеал)</text>
