<rect x="140.0" y="265.0" width="480.0" height="55.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="2.0"/>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="700">Оцінка розміру кругових одиниць vs Множники</text>
<text x="380.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e03131" text-anchor="middle" font-weight="700">Векторний простір над F_q не має необхідної вимірності → p &gt; q та q &gt; p (Заперечення)</text>
