<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 475" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="475" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорожня карта доведення гіпотези Каталана</text>
<rect x="20.0" y="15.0" width="720.0" height="35.0" rx="4" fill="#f1f3f5" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Еволюція редукції рівняння Каталана: xᵃ - yᵇ = 1</text>
<rect x="240.0" y="65.0" width="280.0" height="45.0" rx="6" fill="#f8f9fa" stroke="#343a40" stroke-width="1.5"/>
<text x="380.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">Загальне рівняння xᵃ - yᵇ = 1 (a,b ≥ 2)</text>
<text x="380.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">Довільні натуральні показники</text>
<line x1="380.0" y1="110.0" x2="380.0" y2="135.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210.0" y="135.0" width="340.0" height="45.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="380.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">Зведення до простих показників: xᵖ - y𝑞 = 1</text>
<text x="380.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1c7ed6" text-anchor="middle">p, q — прості числа, оскільки u^(m·k) = (u^m)^k</text>
<line x1="300.0" y1="180.0" x2="140.0" y2="215.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380.0" y1="180.0" x2="380.0" y2="215.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460.0" y1="180.0" x2="620.0" y2="215.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="215.0" width="200.0" height="65.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="140.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="700">Ойлер (1738): x² - y³ = 1</text>
<text x="140.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle">Єдиний розв'язок: 3² - 2³ = 1</text>
<text x="140.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">Доведено через Z[i√2]</text>
<rect x="270.0" y="215.0" width="220.0" height="65.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="380.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="700">Лебег (1850): x² - y𝑞 = 1</text>
<text x="380.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle">Немає розв'язків для q ≥ 2</text>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">Квадрат не перевищує степінь</text>
<rect x="520.0" y="215.0" width="200.0" height="65.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="620.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="700">Чао Ко (1965): xᵖ - y² = 1</text>
<text x="620.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle">Немає розв'язків для p ≥ 3</text>
<text x="620.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">Степінь не перевищує квадрат</text>
<line x1="140.0" y1="280.0" x2="380.0" y2="315.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380.0" y1="280.0" x2="380.0" y2="315.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="280.0" x2="380.0" y2="315.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180.0" y="315.0" width="400.0" height="50.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="380.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle" font-weight="700">Головний рубіж: p, q ≥ 3 — непарні прості числа</text>
<text x="380.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d9480f" text-anchor="middle">Касселс (1960): p ділить y, q ділить x (числа x, y гігантські)</text>
<line x1="380.0" y1="365.0" x2="380.0" y2="395.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="160.0" y="395.0" width="440.0" height="55.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="2.0"/>
<text x="380.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="700">Фінал: Преда Міхайлеску (2002)</text>
<text x="380.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e03131" text-anchor="middle" font-weight="700">Кругові поля Q(ζₚ) + Прості Віферіха → p ≡ 1 (mod q) та q ≡ 1 (mod p) — Суперечність!</text>
</svg>