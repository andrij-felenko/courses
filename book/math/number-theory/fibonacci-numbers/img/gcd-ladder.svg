<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">НСД чисел Фібоначчі: спуск по номерах дзеркалить спуск по числах</text>
<text x="193.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">номери — крок Евкліда</text>
<text x="536.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">числа Фібоначчі</text>
<rect x="118.0" y="92.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="193.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="193.0" dy="0.0">gcd(12, 8)</tspan></text>
<rect x="408.0" y="92.0" width="256.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="536.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="536.0" dy="0.0">gcd(F₁₂, F₈) = gcd(144, 21)</tspan></text>
<line x1="268.0" y1="115.0" x2="404.0" y2="115.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<line x1="193.0" y1="138.0" x2="193.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="536.0" y1="138.0" x2="536.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">12 = 1·8 + 4</text>
<rect x="118.0" y="170.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="193.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="193.0" dy="0.0">gcd(8, 4)</tspan></text>
<rect x="408.0" y="170.0" width="256.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="536.0" y="197.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="536.0" dy="0.0">gcd(F₈, F₄) = gcd(21, 3)</tspan></text>
<line x1="268.0" y1="193.0" x2="404.0" y2="193.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<line x1="193.0" y1="216.0" x2="193.0" y2="246.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="536.0" y1="216.0" x2="536.0" y2="246.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">8 = 2·4 + 0</text>
<rect x="118.0" y="248.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="193.0" y="276.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="193.0" dy="0.0">gcd(4, 0)</tspan></text>
<rect x="408.0" y="248.0" width="256.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="536.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="536.0" dy="0.0">gcd(F₄, F₀) = gcd(3, 0)</tspan></text>
<line x1="268.0" y1="271.0" x2="404.0" y2="271.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<line x1="193.0" y1="294.0" x2="193.0" y2="324.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="536.0" y1="294.0" x2="536.0" y2="324.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="118.0" y="326.0" width="150.0" height="46.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="193.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="193.0" dy="0.0">= 4</tspan></text>
<rect x="408.0" y="326.0" width="256.0" height="46.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="536.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="536.0" dy="0.0">= F₄ = 3</tspan></text>
<line x1="268.0" y1="349.0" x2="404.0" y2="349.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="338.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі кроки</text>
<text x="380.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Спуск у номерах і спуск у числах Фібоначчі йдуть у ногу й завершуються разом:</tspan><tspan x="380.0" dy="16.2">gcd(12, 8) = 4,   а   gcd(F₁₂, F₈) = F₄ = 3.</tspan></text>
</svg>