<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр якості трійок ABC</text>
<rect x="20.0" y="12.0" width="720.0" height="32.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Спектр якості q(a,b,c) = log(c) / log(rad(abc)) для взаємно простих трійок</text>
<line x1="50.0" y1="130.0" x2="710.0" y2="130.0" stroke="#495057" stroke-width="2.0"/>
<line x1="690.0" y1="130.0" x2="715.0" y2="130.0" stroke="#495057" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="725.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle" font-weight="700">q</text>
<line x1="270.0" y1="60.0" x2="270.0" y2="175.0" stroke="#e03131" stroke-width="2.0"/>
<text x="270.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="700">Поріг q = 1.0 (c = rad(abc))</text>
<rect x="60.0" y="65.0" width="180.0" height="45.0" rx="4" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.0"/>
<text x="150.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="middle" font-weight="700">Звичайна зона (q &lt; 1)</text>
<text x="150.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">Нескінченна більшість трійок</text>
<rect x="290.0" y="65.0" width="410.0" height="45.0" rx="4" fill="#ffe3e3" stroke="#ffc9c9" stroke-width="1.0"/>
<text x="495.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="700">Зона аномалій / ABC-трійок (q &gt; 1)</text>
<text x="495.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">Рідкісні винятки; при q &gt; 1 + ε їхня кількість скінченна</text>
<circle cx="195.0" cy="130.0" r="4.0" fill="#1c7ed6" stroke="#1864ab" stroke-width="1.5"/>
<line x1="195.0" y1="122.0" x2="195.0" y2="138.0" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="195.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">q ≈ 0.75</text>
<text x="195.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle" font-style="italic">Типове a+b=c</text>
<circle cx="445.0" cy="130.0" r="5.0" fill="#ffe066" stroke="#f59f00" stroke-width="1.5"/>
<line x1="445.0" y1="122.0" x2="445.0" y2="138.0" stroke="#f59f00" stroke-width="1.5"/>
<text x="445.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">q ≈ 1.25</text>
<text x="445.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">1+240000=240001</text>
<circle cx="604.0" cy="130.0" r="5.0" fill="#ff8787" stroke="#e03131" stroke-width="1.5"/>
<line x1="604.0" y1="122.0" x2="604.0" y2="138.0" stroke="#e03131" stroke-width="1.5"/>
<text x="604.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c92a2a" text-anchor="middle" font-weight="700">q ≈ 1.568</text>
<text x="604.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">1+4374=4375</text>
<circle cx="635.0" cy="130.0" r="6.0" fill="#e03131" stroke="#96f2d7" stroke-width="1.5"/>
<line x1="635.0" y1="122.0" x2="635.0" y2="138.0" stroke="#c92a2a" stroke-width="1.5"/>
<text x="635.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c92a2a" text-anchor="middle" font-weight="700">q ≈ 1.630 (Рекорд де Вегера)</text>
<text x="635.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#495057" text-anchor="middle">2 + 3¹⁰·109 = 23⁵</text>
<line x1="635.0" y1="172.0" x2="635.0" y2="185.0" stroke="#c92a2a" stroke-width="1.0"/>
<line x1="70.0" y1="126.0" x2="70.0" y2="134.0" stroke="#343a40" stroke-width="1.0"/>
<text x="70.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#343a40" text-anchor="middle">0.5</text>
<line x1="320.0" y1="126.0" x2="320.0" y2="134.0" stroke="#343a40" stroke-width="1.0"/>
<text x="320.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#343a40" text-anchor="middle">1.0</text>
<line x1="570.0" y1="126.0" x2="570.0" y2="134.0" stroke="#343a40" stroke-width="1.0"/>
<text x="570.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#343a40" text-anchor="middle">1.5</text>
</svg>