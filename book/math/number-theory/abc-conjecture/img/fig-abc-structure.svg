<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія ABC-трійки</text>
<rect x="20.0" y="12.0" width="720.0" height="32.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Анатомія ABC-трійки: 1 + 4374 = 4375 (Решат, 1987)</text>
<rect x="40.0" y="60.0" width="180.0" height="75.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1864ab" text-anchor="middle" font-weight="700">a = 1</text>
<text x="130.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">1 = 1</text>
<text x="130.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c7ed6" text-anchor="middle" font-weight="700">rad(a) = 1</text>
<text x="237.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#495057" text-anchor="middle" font-weight="700">+</text>
<rect x="255.0" y="60.0" width="210.0" height="75.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="360.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1864ab" text-anchor="middle" font-weight="700">b = 4374</text>
<text x="360.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">4374 = 2¹ · 3⁷</text>
<text x="360.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c7ed6" text-anchor="middle" font-weight="700">rad(b) = 2 · 3 = 6</text>
<text x="482.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#495057" text-anchor="middle" font-weight="700">=</text>
<rect x="500.0" y="60.0" width="220.0" height="75.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#f59f00" text-anchor="middle" font-weight="700">c = 4375</text>
<text x="610.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">4375 = 5⁴ · 7¹</text>
<text x="610.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67700" text-anchor="middle" font-weight="700">rad(c) = 5 · 7 = 35</text>
<rect x="40.0" y="160.0" width="680.0" height="85.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="380.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="700">Радикал добутку rad(abc) = rad(1 · 4374 · 4375) = 2 · 3 · 5 · 7 = 210</text>
<text x="200.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">Порівняння: c = 4375  &gt;  rad(abc) = 210</text>
<text x="540.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e03131" text-anchor="middle" font-weight="700">Якість: q(a,b,c) = log(4375) / log(210) ≈ 1.568</text>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle" font-style="italic">Компактний сумарний радикал (210) утворює величезне число c (4375)</text>
</svg>