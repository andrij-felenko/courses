<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємозв'язок характерів через суму Ґаусса</text>
<rect x="10.0" y="10.0" width="780.0" height="430.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="400.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міст між адитивним і мультиплікативним світом: Суми Ґаусса</text>
<text x="400.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Перетворення Фур'є мультиплікативного характеру χ на адитивній групі Z/qZ</text>
<rect x="34.8" y="174.2" width="150.5" height="51.6" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="110.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Вхідний елемент n</tspan><tspan x="110.0" dy="15.6">(n ∈ Z/qZ)</tspan></text>
<line x1="175.0" y1="175.0" x2="260.0" y2="130.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="175.0" y1="225.0" x2="260.0" y2="270.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="252.7" y="96.4" width="254.6" height="67.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Мультиплікативний характер χ(n)</tspan><tspan x="380.0" dy="15.6">Хомоморфізм (Z/qZ)* → C*</tspan><tspan x="380.0" dy="15.6">Переводить множення у фазу</tspan></text>
<rect x="267.6" y="236.4" width="224.9" height="67.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Адитивний характер e_q(a·n)</tspan><tspan x="380.0" dy="15.6">e_q(x) = exp(2πi x / q)</tspan><tspan x="380.0" dy="15.6">Переводить додавання у фазу</tspan></text>
<line x1="500.0" y1="130.0" x2="580.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="270.0" x2="580.0" y2="225.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="579.9" y="166.4" width="180.2" height="67.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Сума Ґаусса g(χ, a)</tspan><tspan x="670.0" dy="15.6">∑_{n} χ(n) · e_q(a·n)</tspan><tspan x="670.0" dy="15.6">Обгортка взаємодії</tspan></text>
<rect x="49.5" y="344.2" width="701.0" height="51.6" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="400.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Фундаментальна властивість привідного характеру: |g(χ)| = √q</tspan><tspan x="400.0" dy="15.6">Сума Ґаусса діє як дискретна спектральна згортка, зсуваючи аргумент: g(χ, a) = χ̄(a) · g(χ)</tspan></text>
</svg>