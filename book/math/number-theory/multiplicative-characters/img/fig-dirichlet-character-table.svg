<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура характерів за складеним модулем 15</text>
<rect x="10.0" y="10.0" width="780.0" height="460.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="400.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура характерів Діріхле за складеним модулем q = 15</text>
<text x="400.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ізоморфізм (Z/15Z)* ≅ (Z/3Z)* × (Z/5Z)* ≅ Z₂ × Z₄ (Порядок φ(15) = 8)</text>
<g transform="translate(0,0)">
<rect x="25.0" y="85.0" width="240.0" height="365.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="145.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Факторизація модулів</text>
<rect x="55.5" y="132.2" width="179.0" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Модуль d = 3</tspan><tspan x="145.0" dy="14.3">(Z/3Z)* ≅ Z₂</tspan><tspan x="145.0" dy="14.3">2 характери (χ₃⁽⁰⁾, χ₃⁽¹⁾)</tspan></text>
<text x="145.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">⊗ (Тензорний добуток)</text>
<rect x="52.4" y="252.2" width="185.3" height="55.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Модуль d = 5</tspan><tspan x="145.0" dy="14.3">(Z/5Z)* ≅ Z₄</tspan><tspan x="145.0" dy="14.3">4 характери (χ₅⁽⁰⁾...χ₅⁽³⁾)</tspan></text>
<line x1="145.0" y1="325.0" x2="145.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="21.1" y="374.4" width="247.9" height="41.3" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Разом: 2 × 4 = 8 характерів</tspan><tspan x="145.0" dy="14.3">χ₁₅(n) = χ₃(n mod 3) · χ₅(n mod 5)</tspan></text>
</g>
<rect x="280.0" y="85.0" width="490.0" height="365.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="525.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація за провідником (Conductor f_χ)</text>
<rect x="295.0" y="135.0" width="100.0" height="30.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="345.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Провідник f_χ</text>
<rect x="400.0" y="135.0" width="120.0" height="30.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Характер</text>
<rect x="525.0" y="135.0" width="230.0" height="30.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивість та тип</text>
<rect x="295.0" y="175.0" width="100.0" height="36.0" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="345.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">f = 1</text>
<rect x="400.0" y="175.0" width="120.0" height="36.0" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">χ₀ (Головний)</text>
<rect x="525.0" y="175.0" width="230.0" height="36.0" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Індукований з 1; χ₀(n)=1 для gcd(n,15)=1</text>
<rect x="295.0" y="217.0" width="100.0" height="36.0" rx="2" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="345.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">f = 3</text>
<rect x="400.0" y="217.0" width="120.0" height="36.0" rx="2" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">χ₁₅⁽³⁾</text>
<rect x="525.0" y="217.0" width="230.0" height="36.0" rx="2" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Індукований з mod 3 (нетривіальний χ₃)</text>
<rect x="295.0" y="259.0" width="100.0" height="36.0" rx="2" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="345.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">f = 5</text>
<rect x="400.0" y="259.0" width="120.0" height="36.0" rx="2" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">χ₁₅⁽⁵,¹⁾, χ₁₅⁽⁵,²⁾...</text>
<rect x="525.0" y="259.0" width="230.0" height="36.0" rx="2" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3 характери, індуковані з mod 5</text>
<rect x="295.0" y="301.0" width="100.0" height="36.0" rx="2" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="345.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">f = 15</text>
<rect x="400.0" y="301.0" width="120.0" height="36.0" rx="2" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">χ₁₅⁽¹⁵,¹⁾, χ₁₅⁽¹⁵,²⁾...</text>
<rect x="525.0" y="301.0" width="230.0" height="36.0" rx="2" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3 первісні (primitive) характери mod 15</text>
<text x="525.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Первісний характер mod q не піднімається з жодного дільника d &lt; q.</text>
<text x="525.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Провідник f_χ — це мінімальний модуль, на якому характер є первісним.</text>
</svg>