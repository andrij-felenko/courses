<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія гіпотези Шпіро</text>
<rect x="20.0" y="12.0" width="720.0" height="32.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Анатомія гіпотези Шпіро: |Δ_E| ≤ C(ε) · N_E^(6 + ε)</text>
<rect x="40.0" y="60.0" width="320.0" height="85.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="200.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="700">Мінімальний дискримінант Δ_E</text>
<text x="200.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Глобальна алгебраїчна складність</text>
<text x="200.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle" font-style="italic">Вимірює сингулярність моделі кривої</text>
<line x1="370.0" y1="102.0" x2="390.0" y2="102.0" stroke="#1c7ed6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="700">≤</text>
<rect x="400.0" y="60.0" width="320.0" height="85.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="560.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67700" text-anchor="middle" font-weight="700">Провідник (Conductor) N_E</text>
<text x="560.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Локальна арифметика поганої редукції</text>
<text x="560.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle" font-style="italic">N_E = ∏ p^(v_p(N_E)),  p | Δ_E</text>
<rect x="40.0" y="160.0" width="680.0" height="85.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="380.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="700">Індекс Шпіро:  σ(E) = log |Δ_E| / log N_E</text>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="700">Гіпотеза стверджує: limsup σ(E) = 6  (для всіх N_E → ∞)</text>
<text x="380.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle" font-style="italic">Локальні дільники N_E строго обмежують глобальний дискримінант Δ_E</text>
</svg>