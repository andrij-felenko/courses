<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Тонеллі-Шенкса: зменшення 2-порядку інваріанта t</text>
<rect x="40.0" y="70.0" width="230.0" height="80.0" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.6"/>
<text x="155.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1976d2" text-anchor="middle" font-weight="700">1. Факторизація</text>
<text x="155.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">p − 1 = 2ˢ · q (q непарне)</text>
<line x1="270.0" y1="110.0" x2="310.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 305 105 L 315 110 L 305 115 Z" fill="#1a1a1a" />
<rect x="315.0" y="70.0" width="230.0" height="80.0" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.6"/>
<text x="430.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#388e3c" text-anchor="middle" font-weight="700">2. Ініціалізація</text>
<text x="430.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">R = a^((q+1)/2), t = a^q (mod p)</text>
<line x1="545.0" y1="110.0" x2="585.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 580 105 L 590 110 L 580 115 Z" fill="#1a1a1a" />
<rect x="590.0" y="70.0" width="210.0" height="80.0" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.6"/>
<text x="695.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#f57c00" text-anchor="middle" font-weight="700">3. Генератор нелишку</text>
<text x="695.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Знайти z: (z/p) = −1</text>
<text x="695.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">c = z^q (mod p)</text>
<line x1="430.0" y1="150.0" x2="430.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 425 180 L 430 190 L 435 180 Z" fill="#1a1a1a" />
<rect x="180.0" y="190.0" width="500.0" height="135.0" rx="10" fill="#f8f9fa" stroke="#27ae60" stroke-width="2.0"/>
<text x="430.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4. Основний цикл коригування інваріанта R² ≡ a · t (mod p)</text>
<text x="430.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#388e3c" text-anchor="middle" font-weight="700">Якщо t ≡ 1 (mod p) ──► Повернути R (розв'язок знайдено!)</text>
<text x="430.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Інакше: знайти найменше m таке, що t^(2ᵐ) ≡ 1 (mod p)</text>
<text x="430.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Оновити: b = c^(2ˢ⁻ᵐ⁻¹), R ⟵ R·b, t ⟵ t·b², c ⟵ b², s ⟵ m</text>
<text x="420.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">На кожній ітерації порядок елемента t у 2-групі суворо зменшується (m &lt; s), що гарантує збіжність за ≤ s кроків</text>
</svg>