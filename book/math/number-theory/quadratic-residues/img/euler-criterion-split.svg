<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гомоморфізм критерію Ейлера: a ↦ a^((p-1)/2) (mod p)</text>
<rect x="60.0" y="70.0" width="330.0" height="160.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="225.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Квадратичні лишки (QR)</text>
<text x="225.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">a^((p-1)/2) ≡ +1 (mod p)</text>
<text x="225.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Символ Лежандра (a/p) = +1</text>
<text x="225.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Утворюють підгрупу індексу 2 в Zₚ*</text>
<rect x="450.0" y="70.0" width="330.0" height="160.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="615.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Квадратичні нелишки (QNR)</text>
<text x="615.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">a^((p-1)/2) ≡ -1 (mod p)</text>
<text x="615.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Символ Лежандра (a/p) = -1</text>
<text x="615.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Суміжний клас підгрупи лишків</text>
<rect x="180.0" y="255.0" width="480.0" height="85.0" rx="8" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.2"/>
<text x="420.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця множення класів (ізоморфізм із групами {+1, -1} ≅ Z₂):</text>
<text x="420.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">QR · QR = QR  (+1 · +1 = +1)     |     QR · QNR = QNR  (+1 · -1 = -1)</text>
<text x="420.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">QNR · QNR = QR  (-1 · -1 = +1)</text>
</svg>