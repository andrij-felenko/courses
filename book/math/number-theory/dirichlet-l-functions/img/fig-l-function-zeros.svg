<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 843.32 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="843.32" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура нулів L-функцій</text>
<rect x="0.0" y="0.0" width="800.0" height="480.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Аналітична структура L-функцій L(s, χ) у комплексній площині s = σ + i·t</text>
<rect x="420.0" y="70.0" width="320.0" height="320.0" rx="6" fill="#ecfdf5" stroke="none" stroke-width="1.5"/>
<rect x="280.0" y="70.0" width="140.0" height="320.0" rx="6" fill="#fefce8" stroke="none" stroke-width="1.5"/>
<rect x="50.0" y="70.0" width="230.0" height="320.0" rx="6" fill="#f8fafc" stroke="none" stroke-width="1.5"/>
<line x1="40.0" y1="240.0" x2="760.0" y2="240.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="410.0" x2="280.0" y2="55.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="765.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start" font-weight="700">σ = Re(s)</text>
<text x="290.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start" font-weight="700">t = Im(s)</text>
<line x1="350.0" y1="70.0" x2="350.0" y2="390.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="350.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">σ = 1/2</text>
<text x="350.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">Критична пряма (УГР / GRH)</text>
<line x1="420.0" y1="70.0" x2="420.0" y2="390.0" stroke="#059669" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">σ = 1</text>
<circle cx="420.0" cy="240.0" r="8.0" fill="#ef4444" stroke="#991b1b" stroke-width="2.0"/>
<text x="432.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="start" font-weight="700">Полюс s=1 (лише для χ₀)</text>
<text x="432.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="start" font-weight="700">L(1, χ) ≠ 0 (для χ ≠ χ₀!)</text>
<circle cx="230.0" cy="240.0" r="5.0" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
<text x="230.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">-2</text>
<circle cx="180.0" cy="240.0" r="5.0" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
<text x="180.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">-4</text>
<circle cx="130.0" cy="240.0" r="5.0" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
<text x="130.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">-6</text>
<text x="180.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Тривіальні нулі (парні χ)</text>
<circle cx="350.0" cy="180.0" r="5.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<circle cx="350.0" cy="130.0" r="5.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<circle cx="350.0" cy="300.0" r="5.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<circle cx="350.0" cy="350.0" r="5.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<text x="360.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="700">Нетривіальні нулі (1/2 + i·t)</text>
<text x="510.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">Область абсолютної
збіжності ряду та
Ейлерового добутку
Re(s) &gt; 1</text>
<text x="315.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Критична смуга
0 &lt; Re(s) &lt; 1</text>
<rect x="37.1" y="436.2" width="725.9" height="31.5" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="400.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Узагальнена гіпотеза Рімана (GRH): усі нетривіальні нулі L(s, χ) лежать чітко на прямій Re(s) = 1/2</tspan></text>
</svg>