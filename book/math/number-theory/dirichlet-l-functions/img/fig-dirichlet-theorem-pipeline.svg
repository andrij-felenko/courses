<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60.3 -10 870.3 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-60.3" y="-10" width="870.3" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналітичний конвеєр теореми Діріхле</text>
<rect x="0.0" y="0.0" width="800.0" height="480.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Аналітичний конвеєр доведення теореми Діріхле про прості числа</text>
<rect x="-2.5" y="50.2" width="245.1" height="59.6" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="120.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1. Задача розподілу</tspan><tspan x="120.0" dy="14.3">Знайти суму ∑_{p ≡ a (mod q)} 1/p</tspan><tspan x="120.0" dy="14.3">Виділити прості числа в a + k·q</tspan></text>
<rect x="233.6" y="50.2" width="292.8" height="59.6" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="380.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">2. Харатери Діріхле</tspan><tspan x="380.0" dy="14.3">Побудувати ортогональний базис χ (mod q)</tspan><tspan x="380.0" dy="14.3">Ортогональність знімає прогресію</tspan></text>
<rect x="497.0" y="50.2" width="286.0" height="59.6" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/><text x="640.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">3. L-ряд та Ейлерів добуток</tspan><tspan x="640.0" dy="14.3">L(s, χ) = ∑ χ(n)/nˢ = ∏ (1 - χ(p)/pˢ)⁻¹</tspan><tspan x="640.0" dy="14.3">Перехід від дільників до простих чисел</tspan></text>
<rect x="534.5" y="200.2" width="211.0" height="59.6" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="640.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">4. Логарифмування ряду</tspan><tspan x="640.0" dy="14.3">ln L(s, χ) ≈ ∑_{p} χ(p)/pˢ</tspan><tspan x="640.0" dy="14.3">Перетворення добутку на суму</tspan></text>
<rect x="220.0" y="200.2" width="320.1" height="59.6" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="392.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">5. Проекція за ортогональністю</tspan><tspan x="392.0" dy="14.3">∑_{χ} χ̄(a) ln L(s, χ) = φ(q) ∑_{p ≡ a} 1/pˢ</tspan><tspan x="392.0" dy="14.3">Виділення суми за потрібним класом</tspan></text>
<rect x="-50.3" y="200.2" width="340.5" height="59.6" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="120.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">6. Ключова умова L(1, χ) ≠ 0</tspan><tspan x="120.0" dy="14.3">Для χ₀: ln L(s, χ₀) ~ ln 1/(s-1) → ∞</tspan><tspan x="120.0" dy="14.3">Для χ ≠ χ₀: L(1, χ) ≠ 0 ⇒ ln L(1, χ) скінченне!</tspan></text>
<line x1="210.0" y1="80.0" x2="290.0" y2="80.0" stroke="#3b82f6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="80.0" x2="550.0" y2="80.0" stroke="#22c55e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="640.0" y1="130.0" x2="640.0" y2="180.0" stroke="#a855f7" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="230.0" x2="470.0" y2="230.0" stroke="#f97316" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="290.0" y1="230.0" x2="210.0" y2="230.0" stroke="#eab308" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="120.0" y1="280.0" x2="120.0" y2="335.0" stroke="#ef4444" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="68.4" y="362.5" width="663.2" height="65.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="383.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ГРАНІЧНИЙ ПЕРЕХІД s → 1⁺:</tspan><tspan x="400.0" dy="16.2">∑_{p ≡ a (mod q)} 1/pˢ = (1 / φ(q)) · ln(1 / (s - 1)) + O(1) → ∞</tspan><tspan x="400.0" dy="16.2">У кожному класі a (mod q) з НСД(a, q) = 1 існує нескінченно багатьох простих чисел!</tspan></text>
</svg>