<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 240" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="240" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міст від ABC до Холла</text>
<rect x="20.0" y="10.0" width="740.0" height="30.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="390.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Виведення гіпотези Холла з гіпотези ABC</text>
<rect x="30.0" y="55.0" width="210.0" height="60.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="135.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="middle" font-weight="700">1. Діофантове рівняння</text>
<text x="135.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle">x³ + k = y²  (k = y² - x³)</text>
<line x1="240.0" y1="85.0" x2="270.0" y2="85.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="275.0" y="55.0" width="220.0" height="60.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="385.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1864ab" text-anchor="middle" font-weight="700">2. Оцінка радикала</text>
<text x="385.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle">rad(x³ · k · y²) ≤ x · y · |k|</text>
<line x1="495.0" y1="85.0" x2="525.0" y2="85.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530.0" y="55.0" width="225.0" height="60.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="642.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9480f" text-anchor="middle" font-weight="700">3. Нерівність ABC</text>
<text x="642.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#212529" text-anchor="middle" font-weight="700">y² &lt; C(ε') · (x · y · |k|)^(1+ε')</text>
<line x1="642.0" y1="115.0" x2="642.0" y2="145.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="390.0" y="150.0" width="365.0" height="60.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="572.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="700">4. Заміна y ≈ x³/² та підстановка</text>
<text x="572.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle">x³/² ≤ C' · (x⁵/² · |k|)^(1+ε')</text>
<line x1="390.0" y1="180.0" x2="270.0" y2="180.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="150.0" width="235.0" height="60.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.0"/>
<text x="147.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">5. Гіпотеза Холла</text>
<text x="147.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">|y² - x³| &gt; C(ε) · x¹/²⁻ᵉ</text>
</svg>