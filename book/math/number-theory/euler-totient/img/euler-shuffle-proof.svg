<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Множення на 3 переставляє вцілілих — і звідси теорема</text>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">вціліли за модулем 10</text>
<text x="470.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">кожного помножили на 3</text>
<rect x="118.0" y="98.5" width="64.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1</tspan></text>
<rect x="385.0" y="100.0" width="170.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="119.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3·1 = 3</tspan></text>
<line x1="186.0" y1="115.0" x2="381.0" y2="115.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="118.0" y="148.5" width="64.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">3</tspan></text>
<rect x="385.0" y="150.0" width="170.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3·3 = 9</tspan></text>
<line x1="186.0" y1="165.0" x2="381.0" y2="165.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="118.0" y="198.5" width="64.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">7</tspan></text>
<rect x="385.0" y="200.0" width="170.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="219.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3·7 = 21 ≡ 1</tspan></text>
<line x1="186.0" y1="215.0" x2="381.0" y2="215.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="118.0" y="248.5" width="64.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">9</tspan></text>
<rect x="385.0" y="250.0" width="170.0" height="30.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="269.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3·9 = 27 ≡ 7</tspan></text>
<line x1="186.0" y1="265.0" x2="381.0" y2="265.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="608.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#6b7280" text-anchor="middle">⇒</text>
<rect x="664.8" y="151.2" width="194.4" height="87.7" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="762.0" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">що вийшло: {3, 9, 1, 7}</tspan><tspan x="762.0" dy="16.9">що було:   {1, 3, 7, 9}</tspan><tspan x="762.0" dy="16.9">той самий набір,</tspan><tspan x="762.0" dy="16.9">лише переставлений</tspan></text>
<text x="460.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">перемножмо всі чотири рядки:</text>
<rect x="264.5" y="362.8" width="391.1" height="74.4" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">(3·1)·(3·3)·(3·7)·(3·9)  ≡  1·3·7·9   (mod 10)</tspan><tspan x="460.0" dy="18.2">3⁴ · (1·3·7·9)  ≡  1·3·7·9   (mod 10)</tspan><tspan x="460.0" dy="18.2">3⁴  ≡  1   (mod 10)</tspan></text>
<text x="460.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">добуток вцілілих взаємно простий з 10 — тож його можна скоротити</text>
</svg>