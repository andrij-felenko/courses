<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">2D префіксні суми: геометрія включень-виключень</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Обчислення суми прямокутника D = P[r2][c2] − P[r1-1][c2] − P[r2][c1-1] + P[r1-1][c1-1]</text>
<rect x="120.0" y="90.0" width="160.0" height="120.0" rx="6" fill="#e8edf8" stroke="#2457d6" stroke-width="1.5"/>
<text x="200.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">A (P[r1-1][c1-1])</text>
<rect x="280.0" y="90.0" width="220.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="390.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">B</text>
<rect x="120.0" y="210.0" width="160.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">C</text>
<rect x="280.0" y="210.0" width="220.0" height="140.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="390.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">D (Шукана сума)</text>
<text x="280.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">c1-1</text>
<text x="500.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">c2</text>
<text x="100.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">r1-1</text>
<text x="100.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">r2</text>
<rect x="540.0" y="90.0" width="280.0" height="260.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="680.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс областей:</text>
<text x="560.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">P[r2][c2] = A + B + C + D</text>
<text x="560.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">− P[r1-1][c2] = −(A + B)</text>
<text x="560.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">− P[r2][c1-1] = −(A + C)</text>
<text x="560.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">+ P[r1-1][c1-1] = + A</text>
<line x1="555.0" y1="270.0" x2="805.0" y2="270.0" stroke="#333333" stroke-width="1.2"/>
<text x="680.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Результат: D</text>
</svg>