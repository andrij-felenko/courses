<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">У масиві з N=6 елементів за модулем m=5 принаймні дві суми P[i] та P[j] збігаються (колізія 1 ≡ 1)</text>
