<text x="675.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Ємність  c</text>
<line x1="535.0" y1="130.0" x2="535.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="170.0" width="240.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="590.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перестановка  π</text>
<rect x="30.0" y="238.0" width="720.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="390.0" y="262.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Стійкість до колізій визначається ємністю c: складність 2^{c/2}. Частина c ніколи не контактує безпосередньо з вхідними чи вихідними даними, захищаючи від атак подовження.</tspan></text>
