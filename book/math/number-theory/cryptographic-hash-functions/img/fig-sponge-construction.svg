<text x="390.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Губчаста архітектура Хеш-функції</text>
<text x="390.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Губчаста архітектура (Sponge Construction) — приклад SHA-3 / Keccak</text>
