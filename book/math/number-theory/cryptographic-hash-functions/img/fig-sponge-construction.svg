<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 794.75 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="794.75" height="300" fill="#ffffff"/>
