<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знаменники чисел Бернуллі за теоремою фон Штаудта — Клаузена</text>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема фон Штаудта — Клаузена: будова знаменників B₂ₖ</text>
<text x="410.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Знаменник B₂ₖ дорівнює добутку простих p, для яких (p − 1) ділить 2k</text>
<rect x="40.0" y="95.0" width="140.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="110.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Число Бернуллі B₂ₖ</text>
<rect x="190.0" y="95.0" width="110.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="245.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Показник 2k</text>
<rect x="310.0" y="95.0" width="280.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="450.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Прості p з умовою (p−1) | 2k</text>
<rect x="600.0" y="95.0" width="180.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="690.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Знаменник den(B₂ₖ)</text>
<rect x="40.0" y="125.0" width="140.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B₂ = ⅙</text>
<rect x="190.0" y="125.0" width="110.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2k = 2</text>
<rect x="310.0" y="125.0" width="280.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">p − 1 | 2 ⇒ p = 2, 3</text>
<rect x="600.0" y="125.0" width="180.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="690.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2 · 3 = 6</text>
<rect x="40.0" y="187.0" width="140.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B₄ = −⅓₀</text>
<rect x="190.0" y="187.0" width="110.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2k = 4</text>
<rect x="310.0" y="187.0" width="280.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">p − 1 | 4 ⇒ p = 2, 3, 5</text>
<rect x="600.0" y="187.0" width="180.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="690.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2 · 3 · 5 = 30</text>
<rect x="40.0" y="249.0" width="140.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B₆ = 1/42</text>
<rect x="190.0" y="249.0" width="110.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2k = 6</text>
<rect x="310.0" y="249.0" width="280.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">p − 1 | 6 ⇒ p = 2, 3, 7</text>
<rect x="600.0" y="249.0" width="180.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="690.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2 · 3 · 7 = 42</text>
<rect x="40.0" y="311.0" width="140.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B₈ = −1/30</text>
<rect x="190.0" y="311.0" width="110.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2k = 8</text>
<rect x="310.0" y="311.0" width="280.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">p − 1 | 8 ⇒ p = 2, 3, 5</text>
<rect x="600.0" y="311.0" width="180.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="690.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2 · 3 · 5 = 30</text>
<rect x="40.0" y="373.0" width="140.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B₁₂ = −691/2730</text>
<rect x="190.0" y="373.0" width="110.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2k = 12</text>
<rect x="310.0" y="373.0" width="280.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="450.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">p − 1 | 12 ⇒ p = 2, 3, 5, 7, 13</text>
<rect x="600.0" y="373.0" width="180.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="690.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2 · 3 · 5 · 7 · 13 = 2730</text>
<rect x="12.7" y="428.1" width="794.6" height="53.9" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Формула Штаудта — Клаузена: B₂ₖ + ∑_{(p−1)|2k} (1/p) є цілим числом.</tspan><tspan x="410.0" dy="16.9">Знаменник завжди вільний від квадратів (без повторів простих множників) і містить 2 та 3 для всіх k ≥ 1.</tspan></text>
</svg>