<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама арифметика за модулем — у різних задачах</text>
<rect x="30.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="140.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">кільцевий буфер</text>
<rect x="46.0" y="118.0" width="188.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="140.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">i = (i + 1) mod N</tspan></text>
<text x="140.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">індекс «загортається»</tspan><tspan x="140.0" dy="14.3">на початок</tspan></text>
<rect x="270.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="380.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">контрольна сума</text>
<rect x="286.0" y="118.0" width="188.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="380.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">s = (s + байт) mod 256</tspan></text>
<text x="380.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">лишок ловить</tspan><tspan x="380.0" dy="14.3">спотворення</tspan></text>
<rect x="510.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">доповняльний код</text>
<rect x="526.0" y="118.0" width="188.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="620.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">−B ≡ 2ⁿ − B (mod 2ⁿ)</tspan></text>
<text x="620.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">віднімання стає</tspan><tspan x="620.0" dy="14.3">додаванням</tspan></text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один апарат лишків, різний модуль m — від кільцевого індексу до знакових чисел</text>
</svg>