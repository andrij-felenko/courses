<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння накладних витрат RSA та Пайє</text>
<text x="500.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння параметрів: RSA проти Пайє (при n = 2048 біт)</text>
<rect x="116.3" y="128.8" width="287.3" height="142.4" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="260.0" y="153.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Криптосистема RSA</tspan><tspan x="260.0" dy="16.9"></tspan><tspan x="260.0" dy="16.9">• Модуль обчислень: n (2048 біт)</tspan><tspan x="260.0" dy="16.9">• Розмір шифротексту: 2048 біт</tspan><tspan x="260.0" dy="16.9">• Піднесення до степеня mod n</tspan><tspan x="260.0" dy="16.9">• Гомоморфізм: Множення E(m₁)·E(m₂)</tspan><tspan x="260.0" dy="16.9">• Швидкість обчислень: Базова</tspan></text>
<rect x="544.5" y="128.8" width="391.1" height="142.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="740.0" y="153.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Криптосистема Пайє</tspan><tspan x="740.0" dy="16.9"></tspan><tspan x="740.0" dy="16.9">• Модуль обчислень: n² (4096 біт)</tspan><tspan x="740.0" dy="16.9">• Розмір шифротексту: 4096 біт (×2 розширення)</tspan><tspan x="740.0" dy="16.9">• Піднесення до степеня mod n² (~4-8× повільніше)</tspan><tspan x="740.0" dy="16.9">• Гомоморфізм: Додавання E(m₁)+E(m₂)</tspan><tspan x="740.0" dy="16.9">• Призначення: Конфіденційні підсумки</tspan></text>
<rect x="144.8" y="357.5" width="710.3" height="55.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="500.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ціна аддитивного гомоморфізму: подвоєння обсягу шифротексту (n → n²) та збільшення</tspan><tspan x="500.0" dy="17.6">обчислювальної складності модульного піднесення до степеня за модулем n².</tspan></text>
</svg>