<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1060 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1060" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="525.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема конвеєра шифрування та розшифрування Пайє</text>
<text x="525.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр операцій: Генерація ключів → Шифрування → Розшифрування</text>
<rect x="74.7" y="94.9" width="230.6" height="150.2" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="190.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Генерація ключів</tspan><tspan x="190.0" dy="16.2">• Обрати прості p, q</tspan><tspan x="190.0" dy="16.2">• Обчислити n = p·q</tspan><tspan x="190.0" dy="16.2">• λ = нск(p−1, q−1)</tspan><tspan x="190.0" dy="16.2">• g = 1 + n</tspan><tspan x="190.0" dy="16.2">• μ = (L(g^λ mod n²))⁻¹ mod n</tspan><tspan x="190.0" dy="16.2">Публічний: (n, g)</tspan><tspan x="190.0" dy="16.2">Приватний: (λ, μ)</tspan></text>
<line x1="340.0" y1="170.0" x2="420.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="446.1" y="111.1" width="187.9" height="117.8" rx="6" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.4"/><text x="540.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">2. Шифрування E(m, r)</tspan><tspan x="540.0" dy="16.2">• Вхід: m ∈ ℤ_n, (n, g)</tspan><tspan x="540.0" dy="16.2">• Випадковий r ∈ ℤ_n*</tspan><tspan x="540.0" dy="16.2">• Обчислити:</tspan><tspan x="540.0" dy="16.2">  c = g^m · r^n mod n²</tspan><tspan x="540.0" dy="16.2">Вихід: шифротекст c</tspan></text>
<line x1="660.0" y1="170.0" x2="740.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="781.8" y="111.1" width="216.4" height="117.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="890.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="890.0" dy="0.0">3. Розшифрування D(c)</tspan><tspan x="890.0" dy="16.2">• Вхід: c, приватний (λ, μ)</tspan><tspan x="890.0" dy="16.2">• u = c^λ mod n²</tspan><tspan x="890.0" dy="16.2">• L(u) = (u − 1) / n</tspan><tspan x="890.0" dy="16.2">• m = L(u) · μ mod n</tspan><tspan x="890.0" dy="16.2">Вихід: повідомлення m</tspan></text>
<rect x="50.6" y="355.5" width="948.7" height="59.1" rx="6" fill="#fbfbfc" stroke="#27ae60" stroke-width="1.6"/><text x="525.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Гомоморфні властивості без розшифрування:</tspan><tspan x="525.0" dy="17.6">Додавання: E(m₁) · E(m₂) mod n² = E(m₁ + m₂ mod n)     |     Скалярний добуток: E(m)^k mod n² = E(k · m mod n)</tspan></text>
</svg>