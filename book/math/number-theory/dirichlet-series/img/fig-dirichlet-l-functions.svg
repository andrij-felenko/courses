<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">L-функції Діріхле</text>
<rect x="0.0" y="0.0" width="800.0" height="420.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Структура L-функцій Діріхле та теорема про прості числа в прогресіях</text>
<rect x="156.3" y="70.0" width="487.5" height="49.9" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="400.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#581c87" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Характер Діріхле χ (mod m)  →  L-ряд L(s, χ) = ∑ χ(n) / nˢ</tspan><tspan x="400.0" dy="16.9">Добуток Ейлера: L(s, χ) = ∏_{p} (1 - χ(p) p⁻ˢ)⁻¹</tspan></text>
<line x1="300.0" y1="140.0" x2="200.0" y2="190.0" stroke="#6b21a8" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="140.0" x2="600.0" y2="190.0" stroke="#6b21a8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="93.3" y="200.6" width="213.4" height="78.8" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="200.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Головний характер χ₀</tspan><tspan x="200.0" dy="15.6">L(s, χ₀) має полюс у s = 1</tspan><tspan x="200.0" dy="15.6">Поведінка аналогічна ζ(s)</tspan><tspan x="200.0" dy="15.6">Дає середню щільність</tspan></text>
<rect x="459.8" y="200.6" width="280.4" height="78.8" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="600.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Неголовні характери χ ≠ χ₀</tspan><tspan x="600.0" dy="15.6">L(s, χ) аналітична у s = 1</tspan><tspan x="600.0" dy="15.6">Ключовий факт: L(1, χ) ≠ 0!</tspan><tspan x="600.0" dy="15.6">Виключає деструктивну інтерференцію</tspan></text>
<line x1="200.0" y1="295.0" x2="340.0" y2="340.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="600.0" y1="295.0" x2="460.0" y2="340.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="10.2" y="340.6" width="779.5" height="48.8" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="361.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Теорема Діріхле (1837): ∑_{p ≡ a (mod m)} 1/p = ∞</tspan><tspan x="400.0" dy="16.2">У будь-якій арифметичній прогресії a + k·m (з НСД(a,m)=1) існує нескінченно багатьох простих чисел</tspan></text>
</svg>