<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Огляд трьох відомих розв'язків рівняння Нагеля-Люнггрена</text>
<rect x="220.0" y="15.0" width="360.0" height="40.0" rx="6" fill="#f8f9fa" stroke="#343a40" stroke-width="1.5"/>
<text x="400.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Три єдині відомі розв'язки рівняння Нагеля–Люнггрена</text>
<line x1="280.0" y1="55.0" x2="140.0" y2="95.0" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400.0" y1="55.0" x2="400.0" y2="95.0" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520.0" y1="55.0" x2="660.0" y2="95.0" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="95.0" width="220.0" height="145.0" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.8"/>
<text x="140.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="700">Розв'язок 1: x = 3, n = 5</text>
<rect x="45.0" y="135.0" width="190.0" height="30.0" rx="4" fill="#ffffff" stroke="#74c0fc" stroke-width="1.0"/>
<text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c7ed6" text-anchor="middle">(3⁵ - 1) / (3 - 1) = 242 / 2 = 121</text>
<text x="140.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0b7285" text-anchor="middle" font-weight="700">Форма степеня: 121 = 11²</text>
<text x="140.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Основа y = 11, показник q = 2 (квадрат)</text>
<text x="140.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Реп'юніт у трійковій системі: 11111₃</text>
<rect x="290.0" y="95.0" width="220.0" height="145.0" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8"/>
<text x="400.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="700">Розв'язок 2: x = 7, n = 4</text>
<rect x="305.0" y="135.0" width="190.0" height="30.0" rx="4" fill="#ffffff" stroke="#8ce99a" stroke-width="1.0"/>
<text x="400.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle">(7⁴ - 1) / (7 - 1) = 2400 / 6 = 400</text>
<text x="400.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">Форма степеня: 400 = 20²</text>
<text x="400.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Основа y = 20, показник q = 2 (квадрат)</text>
<text x="400.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Реп'юніт у сімковій системі: 1111₇</text>
<rect x="550.0" y="95.0" width="220.0" height="145.0" rx="8" fill="#fff9db" stroke="#f59f00" stroke-width="1.8"/>
<text x="660.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67700" text-anchor="middle" font-weight="700">Розв'язок 3: x = 18, n = 3</text>
<rect x="565.0" y="135.0" width="190.0" height="30.0" rx="4" fill="#ffffff" stroke="#ffe066" stroke-width="1.0"/>
<text x="660.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9480f" text-anchor="middle">(18³ - 1) / (18 - 1) = 5831 / 17 = 343</text>
<text x="660.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="700">Форма степеня: 343 = 7³</text>
<text x="660.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Основа y = 7, показник q = 3 (куб)</text>
<text x="660.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Реп'юніт у 18-річній системі: 111₁₈</text>
<rect x="100.0" y="260.0" width="600.0" height="45.0" rx="6" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
<text x="400.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle" font-weight="700">Гіпотеза Нагеля–Люнггрена: інших розв'язків у цілих числах не існує</text>
</svg>