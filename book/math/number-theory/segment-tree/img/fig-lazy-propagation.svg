<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм Lazy Propagation</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип відкладеної пропогації (Lazy Propagation)</text>
<text x="480.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Відкладений прапорець (lazy tag) зберігається у вузлі й проштовхується вниз лише при потребі</text>
<rect x="40.0" y="90.0" width="420.0" height="320.0" rx="10" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="250.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: Встановлення відкладеного прапорця</text>
<text x="250.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Оновлення update(2, 5, +10) повністю накриває [2, 3]</text>
<rect x="200.0" y="175.0" width="100.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="250.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол [2, 3]</text>
<text x="250.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9534f" text-anchor="middle" font-weight="700">lazy = +10</text>
<line x1="230.0" y1="225.0" x2="170.0" y2="275.0" stroke="#333333" stroke-width="1.2"/>
<line x1="270.0" y1="225.0" x2="330.0" y2="275.0" stroke="#333333" stroke-width="1.2"/>
<rect x="120.0" y="275.0" width="100.0" height="45.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.0"/>
<text x="170.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Вузол [2, 2]</text>
<text x="170.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">старі дані</text>
<rect x="280.0" y="275.0" width="100.0" height="45.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.0"/>
<text x="330.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Вузол [3, 3]</text>
<text x="330.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">старі дані</text>
<text x="250.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Діти НЕ оновлюються негайно — економія O(log N)</text>
<rect x="500.0" y="90.0" width="420.0" height="320.0" rx="10" fill="#fcfdfe" stroke="#27ae60" stroke-width="1.5"/>
<text x="710.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 2: Проштовхування вниз (Push Down)</text>
<text x="710.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">При подальшому запиті push(v) передає lazy дітям</text>
<rect x="660.0" y="175.0" width="100.0" height="50.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/>
<text x="710.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол [2, 3]</text>
<text x="710.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">lazy = 0 (скинуто)</text>
<line x1="690.0" y1="225.0" x2="630.0" y2="275.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="730.0" y1="225.0" x2="790.0" y2="275.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="275.0" width="100.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="630.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол [2, 2]</text>
<text x="630.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9534f" text-anchor="middle" font-weight="700">lazy += +10</text>
<rect x="740.0" y="275.0" width="100.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="790.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол [3, 3]</text>
<text x="790.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9534f" text-anchor="middle" font-weight="700">lazy += +10</text>
<text x="710.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Інваріант коректності збережено для всіх піддерев</text>
</svg>