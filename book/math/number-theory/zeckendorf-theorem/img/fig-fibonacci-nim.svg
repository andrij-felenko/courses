<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виграшна стратегія у грі Фібоначчієвий нім</text>
<rect x="10.0" y="10.0" width="760.0" height="290.0" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
<text x="390.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="700">Стратегія виграшу у грі «Фібоначчієвий нім» (купа з N = 11 камінців)</text>
<rect x="240.0" y="55.0" width="300.0" height="55.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="390.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="700">Початкова купа: N = 11 камінців</text>
<text x="390.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Розклад Цекендорфа: 11 = 8 + 3 (F_6 + F_4)</text>
<line x1="390.0" y1="110.0" x2="390.0" y2="140.0" stroke="#2b8a3e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="700">Гравець 1 бере найменший доданок: F_4 = 3 камінці</text>
<rect x="200.0" y="145.0" width="380.0" height="55.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="390.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="700">Лишилося: 8 камінців (число Фібоначчі F_6)</text>
<text x="390.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle">Гравець 2 може взяти не більше 2 × 3 = 6 камінців!</text>
<line x1="390.0" y1="200.0" x2="390.0" y2="230.0" stroke="#c92a2a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle">Гравець 2 мусить взяти від 1 до 6 камінців</text>
<rect x="150.0" y="235.0" width="480.0" height="50.0" rx="6" fill="#fff0f6" stroke="#e64980" stroke-width="1.2"/>
<text x="390.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2255c" text-anchor="middle" font-weight="700">Гравець 2 НЕ може забрати всі 8 камінців за один хід.</text>
<text x="390.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Будь-який його хід розщеплює F_6 і віддає ініціативу Гравцю 1!</text>
</svg>