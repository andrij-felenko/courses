<text x="335.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+4.9 %</text>
<rect x="450.0" y="380.0" width="70.0" height="50.0" rx="0" fill="#fde9c8" stroke="#caa24a" stroke-width="1.4"/>
<text x="485.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">гіга</text>
<text x="485.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+7.4 %</text>
<rect x="600.0" y="364.0" width="70.0" height="66.0" rx="0" fill="#fde9c8" stroke="#caa24a" stroke-width="1.4"/>
<text x="635.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тера</text>
<text x="635.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+10 %</text>
<text x="460.0" y="504.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тому «250 ГБ» диск показується системою як ≈ 232 ГіБ — байти ті самі, лінійка інша</text>
</svg>
