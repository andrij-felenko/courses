</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два «кіло»: десяткове (×1000) і двійкове (×1024)</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пам'ять росте степенями двійки, тож має власні префікси — КіБ/МіБ/ГіБ (IEC); розрив із кіло/мега/гіга накопичується</text>
<rect x="60.0" y="80.0" width="350.0" height="250.0" rx="10" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.6"/>
<rect x="510.0" y="80.0" width="350.0" height="250.0" rx="10" fill="#fbf4f3" stroke="#c0271e" stroke-width="1.6"/>
<text x="235.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ДЕСЯТКОВІ (СІ): крок ×1000</text>
<text x="235.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">диски, швидкості, «маркетингові» байти</text>
<text x="685.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ДВІЙКОВІ (IEC): крок ×1024</text>
<text x="685.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">адреси, RAM, розміри в пам'яті</text>
<text x="75.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">кБ  (kB)</text>
<text x="185.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">10³</text>
<text x="220.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 1 000</text>
<text x="75.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">МБ  (MB)</text>
<text x="185.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">10⁶</text>
<text x="220.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 1 000 000</text>
<text x="75.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ГБ  (GB)</text>
<text x="185.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">10⁹</text>
<text x="220.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 1 000 000 000</text>
<text x="525.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">КіБ (KiB)</text>
<text x="637.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">2¹⁰</text>
<text x="673.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 1 024</text>
<text x="525.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">МіБ (MiB)</text>
<text x="637.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">2²⁰</text>
<text x="673.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 1 048 576</text>
<text x="525.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ГіБ (GiB)</text>
<text x="637.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">2³⁰</text>
<text x="673.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 1 073 741 824</text>
<text x="460.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розрив росте з кожним щаблем (двійкове більше за десяткове):</text>
<rect x="150.0" y="412.0" width="70.0" height="18.0" rx="0" fill="#fde9c8" stroke="#caa24a" stroke-width="1.4"/>
<text x="185.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кіло</text>
<text x="185.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+2.4 %</text>
