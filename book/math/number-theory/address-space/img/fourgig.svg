<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому 32-бітна адреса бачить рівно 4 ГіБ</text>
<rect x="90.0" y="80.0" width="580.0" height="80.0" rx="12" fill="#eef3fc" stroke="#2457d6" stroke-width="2.0"/>
<text x="120.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#2457d6" text-anchor="start" font-weight="700">2³²</text>
<text x="188.1" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="start">=</text>
<text x="216.6" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700">2²</text>
<text x="259.9" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="start">·</text>
<text x="287.3" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="start" font-weight="700">2³⁰</text>
<text x="344.2" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="start">=</text>
<text x="372.8" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="start" font-weight="700">4</text>
<text x="403.6" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="start">×</text>
<text x="429.9" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="start" font-weight="700">1 ГіБ</text>
<text x="514.1" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="start">=</text>
<text x="542.6" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#27ae60" text-anchor="start" font-weight="700">4 ГіБ</text>
<text x="380.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">точно в байтах:</text>
<rect x="200.0" y="226.0" width="360.0" height="46.0" rx="8" fill="#fbeceb" stroke="#c0392b" stroke-width="1.6"/>
<text x="380.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">2³² = 4 294 967 296 байтів</text>
<rect x="30.0" y="312.0" width="226.0" height="100.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="44.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Стеля, не обіцянка</text>
<text x="44.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">32 біти АДРЕСУЮТЬ 4 ГіБ — це</text>
<text x="44.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">максимум; скільки RAM реально</text>
<text x="44.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">стоїть, окреме питання</text>
<rect x="268.0" y="312.0" width="226.0" height="100.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="282.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Звідси перехід на 64 біти</text>
<text x="282.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4 ГіБ стали тісними для ПК → 2⁶⁴</text>
<text x="282.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">це 16 ЕіБ, межа зникла на</text>
<text x="282.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">десятиліття</text>
<rect x="506.0" y="312.0" width="226.0" height="100.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="520.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">На МК межа геть інша</text>
<text x="520.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">адреса там широка, та фізичної</text>
<text x="520.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">SRAM лиш кілобайти — стелю</text>
<text x="520.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ставить залізо, не біти</text>
</svg>