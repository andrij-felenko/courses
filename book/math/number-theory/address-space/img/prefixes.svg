<text x="460.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">гіга</text>
<rect x="555.0" y="344.0" width="70.0" height="66.0" rx="0" fill="#fde9c8" stroke="#caa24a" stroke-width="1.4"/>
<text x="590.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+10 %</text>
<text x="590.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">тера</text>
<text x="380.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">тому диск «250 ГБ» система показує як ≈ 232 ГіБ — байти ті самі, лінійка інша</text>
