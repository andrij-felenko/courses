<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два «кіло»: десяткове (×1000) і двійкове (×1024)</text>
<rect x="60.0" y="80.0" width="300.0" height="220.0" rx="10" fill="#eef3fc" stroke="#2457d6" stroke-width="1.6"/>
<rect x="400.0" y="80.0" width="300.0" height="220.0" rx="10" fill="#fbeceb" stroke="#c0392b" stroke-width="1.6"/>
<text x="210.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">десяткові (СІ): крок ×1000</text>
<text x="210.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">диски, швидкості, маркетингові байти</text>
<text x="550.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">двійкові (IEC): крок ×1024</text>
<text x="550.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">адреси, RAM, розміри в пам'яті</text>
<text x="76.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">кБ  (kB)</text>
<text x="180.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">10³</text>
<text x="220.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">= 1 000</text>
