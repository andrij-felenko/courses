<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адресний простір: одна лінійка, у яку лягають і пам'ять, і пристрої</text>
<rect x="120.0" y="80.0" width="150.0" height="59.4" rx="0" fill="#eef3fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="195.0" y="107.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">ПЗП / Flash</tspan><tspan x="195.0" dy="15.6">(код)</tspan></text>
<rect x="120.0" y="139.4" width="150.0" height="132.0" rx="0" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="195.0" y="203.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">RAM</tspan><tspan x="195.0" dy="15.6">(дані, стек)</tspan></text>
<rect x="120.0" y="271.4" width="150.0" height="46.2" rx="0" fill="#fcfcfc" stroke="#cfcfcf" stroke-width="1.6"/>
<text x="195.0" y="292.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">вільна</tspan><tspan x="195.0" dy="15.6">дірка</tspan></text>
<rect x="120.0" y="317.6" width="150.0" height="92.4" rx="0" fill="#fbeceb" stroke="#c0392b" stroke-width="1.6"/>
<text x="195.0" y="355.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">реєстри</tspan><tspan x="195.0" dy="15.6">периферії</tspan><tspan x="195.0" dy="15.6">(MMIO)</tspan></text>
<text x="108.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0x0000</text>
<text x="108.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0xFFFF…</text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">адреси</text>
<line x1="90.0" y1="80.0" x2="90.0" y2="410.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="386.0" y="89.4" width="248.0" height="81.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Адресний простір — одна суцільна</tspan><tspan x="510.0" dy="16.2">лінійка з 2ᴺ номерів. У неї</tspan><tspan x="510.0" dy="16.2">відображають усе, що процесор</tspan><tspan x="510.0" dy="16.2">адресує: пам'ять І пристрої.</tspan></text>
<rect x="382.4" y="201.2" width="255.1" height="97.5" rx="6" fill="#fbeceb" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="221.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Реєстри периферії живуть</tspan><tspan x="510.0" dy="16.2">за СВОЇМИ адресами в тому ж</tspan><tspan x="510.0" dy="16.2">просторі (memory-mapped):</tspan><tspan x="510.0" dy="16.2">читання комірки = доступ до GPIO,</tspan><tspan x="510.0" dy="16.2">таймера, АЦП — не до пам'яті.</tspan></text>
<rect x="386.0" y="339.5" width="248.0" height="65.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Тому пристрої «з'їдають» частину</tspan><tspan x="510.0" dy="16.2">простору — для RAM лишається</tspan><tspan x="510.0" dy="16.2">менше, ніж уся стеля 2ᴺ.</tspan></text>
</svg>