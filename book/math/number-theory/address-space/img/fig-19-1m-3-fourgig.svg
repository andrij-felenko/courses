<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому 32-бітна адреса бачить рівно 4 ГіБ</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розклад степеня: 2³² = 2² · 2³⁰ = 4 × (1 ГіБ) — звідси «магічне» число 4</text>
<rect x="110.0" y="92.0" width="700.0" height="92.0" rx="12" fill="#f3f6fb" stroke="#1f47b5" stroke-width="2"/>
<text x="138.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">2³²</text>
<text x="205.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="240.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2²</text>
<text x="278.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">·</text>
<text x="295.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">2³⁰</text>
<text x="360.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="395.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">4</text>
<text x="422.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">×</text>
<text x="448.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">1 ГіБ</text>
<text x="580.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">=</text>
<text x="615.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">4 ГіБ</text>
<text x="260.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">= 4</text>
<text x="310.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">= 1 073 741 824 Б</text>
<text x="460.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">точно в байтах:</text>
<rect x="230.0" y="246.0" width="460.0" height="44.0" rx="8" fill="#fbf4f3" stroke="#c0271e" stroke-width="1.6"/>
<text x="460.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2³² = 4 294 967 296 байтів</text>
<rect x="40.0" y="322.0" width="260.0" height="110.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="56.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Стеля, не обіцянка</text>
<text x="56.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">32 біти АДРЕСУЮТЬ 4 ГіБ — це</text>
<text x="56.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">максимум; скільки RAM реально</text>
<text x="56.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стоїть, окреме питання</text>
<rect x="320.0" y="322.0" width="260.0" height="110.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="336.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Звідси перехід на 64 біти</text>
<text x="336.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4 ГіБ стали тісними для ПК → 2⁶⁴</text>
<text x="336.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">це 16 ЕіБ, межа зникла на</text>
<text x="336.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">десятиліття</text>
<rect x="600.0" y="322.0" width="260.0" height="110.0" rx="8" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="616.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">На МК межа геть інша</text>
<text x="616.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">адреса там широка, та фізичної</text>
<text x="616.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">SRAM лиш кілобайти — стелю ставить</text>
<text x="616.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">залізо, не біти</text>
</svg>
