<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація Фіата — Шаміра</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення Фіата — Шаміра: від інтерактивного до NIZK</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Заміна живого перевіряльника детермінованою криптографічною хеш-функцією</text>
<rect x="40.0" y="90.0" width="420.0" height="260.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.3"/>
<text x="250.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерактивний протокол (3 кроки)</text>
<rect x="70.0" y="140.0" width="100.0" height="35.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доводжувач</text>
<rect x="330.0" y="140.0" width="100.0" height="35.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="380.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевіряльник</text>
<line x1="175.0" y1="195.0" x2="325.0" y2="195.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">1. Commitment r</text>
<line x1="325.0" y1="240.0" x2="175.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">2. Random Challenge c</text>
<line x1="175.0" y1="285.0" x2="325.0" y2="285.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">3. Response s</text>
<text x="250.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Потрібен синхронний канал зв'язку</text>
<line x1="470.0" y1="220.0" x2="520.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="495.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хешування</text>
<text x="495.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">c = H(g,y,r)</text>
<rect x="530.0" y="90.0" width="390.0" height="260.0" rx="8" fill="#f0f4fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="725.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Неінтерактивний доказ (NIZK)</text>
<rect x="638.3" y="138.8" width="173.3" height="72.4" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="725.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Доводжувач автономно:</tspan><tspan x="725.0" dy="15.0">1. r = g^k mod p</tspan><tspan x="725.0" dy="15.0">2. c = H(g, y, r) mod q</tspan><tspan x="725.0" dy="15.0">3. s = (k + c · x) mod q</tspan></text>
<line x1="725.0" y1="235.0" x2="725.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="725.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Пакетований доказ π = (r, s)</text>
<rect x="585.9" y="276.3" width="278.2" height="57.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="294.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Перевіряльник перевіряє у будь-який час:</tspan><tspan x="725.0" dy="15.0">c' = H(g, y, r)</tspan><tspan x="725.0" dy="15.0">g^s ≡ r · y^{c'} (mod p)</tspan></text>
</svg>