<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симуляційна гра ZKP</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадигма симуляційного експерименту (Zero-Knowledge Game)</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Нерозрізнюваність реального протоколу від транскрипту штучного симулятора</text>
<rect x="60.0" y="95.0" width="380.0" height="250.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.3"/>
<text x="250.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реальний протокол ⟨P(x), V⟩</text>
<rect x="90.0" y="145.0" width="140.0" height="40.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Prover (знає секрет x)</text>
<rect x="270.0" y="145.0" width="140.0" height="40.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="340.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Verifier V</text>
<line x1="160.0" y1="185.0" x2="340.0" y2="185.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="250.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Транскрипт взаємодії:</text>
<rect x="130.6" y="233.8" width="238.9" height="42.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">T_real = (r, c, s)</tspan><tspan x="250.0" dy="15.0">r = g^k, c = challenge, s = k + cx</tspan></text>
<rect x="455.0" y="180.0" width="50.0" height="50.0" rx="25" fill="#f0f4fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="480.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#2457d6" text-anchor="middle" font-weight="700">≈</text>
<text x="480.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Нерозрізнювані</text>
<rect x="520.0" y="95.0" width="380.0" height="250.0" rx="8" fill="#f0f4fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="710.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Симулятор S(y) без секрету x</text>
<rect x="590.6" y="146.3" width="238.9" height="57.4" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Алгоритм симулятора:</tspan><tspan x="710.0" dy="15.0">1. Обирає випадкові c, s ∈ ℤ_q</tspan><tspan x="710.0" dy="15.0">2. Обчислює r = g^s · y^{-c} mod p</tspan></text>
<rect x="593.8" y="233.8" width="232.3" height="42.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">T_sim = (r, c, s)</tspan><tspan x="710.0" dy="15.0">Задовольняє g^s ≡ r · y^c (mod p)</tspan></text>
</svg>