<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="425.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична інтуїція правила знаків: множення на мінус як поворот на 180°</text>
<rect x="435.0" y="60.0" width="360.0" height="160.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.8"/>
<text x="615.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">(+a) · (+b) = +(a · b)</text>
<text x="615.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Перший квадрант: збереження напрямку</text>
<text x="615.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">Прямий масштаб без зміни орієнтації</text>
<rect x="55.0" y="60.0" width="360.0" height="160.0" rx="6" fill="#fdf2f2" stroke="#d9534f" stroke-width="1.8"/>
<text x="235.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#d9534f" text-anchor="middle" font-weight="700">(-a) · (+b) = -(a · b)</text>
<text x="235.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Другий квадрант: один поворот</text>
<text x="235.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">Один від'ємний множник повертає вектор на 180°</text>
<rect x="55.0" y="240.0" width="360.0" height="160.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.8"/>
<text x="235.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">(-a) · (-b) = +(a · b)</text>
<text x="235.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Третій квадрант: подвійний поворот</text>
<text x="235.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">180° + 180° = 360° (відновлення початкового знаку!)</text>
<rect x="435.0" y="240.0" width="360.0" height="160.0" rx="6" fill="#fdf2f2" stroke="#d9534f" stroke-width="1.8"/>
<text x="615.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#d9534f" text-anchor="middle" font-weight="700">(+a) · (-b) = -(a · b)</text>
<text x="615.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Четвертий квадрант: один поворот</text>
<text x="615.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle">Один від'ємний множник міняє орієнтацію на протилежну</text>
<line x1="45.0" y1="230.0" x2="805.0" y2="230.0" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="425.0" y1="50.0" x2="425.0" y2="410.0" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>