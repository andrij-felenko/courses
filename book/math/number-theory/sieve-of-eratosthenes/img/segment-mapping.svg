<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм відносного адресування у сегментованому решетові</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм відносного адресування та пошуку першого кратного у блоці</text>
<rect x="50.0" y="70.0" width="900.0" height="50.0" rx="6" fill="#e8eefc" stroke="#27ae60" stroke-width="2.0"/><text x="500.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Глобальний інтервал [L, R]  (наприклад, L = 100, R = 150, S = 51)</tspan></text>
<rect x="50.0" y="140.0" width="260.0" height="45.0" rx="6" fill="#f3e8fa" stroke="#6b7280" stroke-width="1.8"/><text x="180.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Базове просте число: p = 7</tspan></text>
<rect x="330.0" y="140.0" width="620.0" height="45.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.8"/><text x="640.0" y="166.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Перше кратне p у [L, R]:  start = max(p², ⌈L / p⌉ · p) = max(49, 15 · 7) = 105</tspan></text>
<rect x="50.0" y="210.0" width="900.0" height="120.0" rx="8" fill="#e6f7ee" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0"></tspan></text>
<text x="500.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Локальний булевий масив mark[0 .. S-1] (розмір S = R - L + 1)</text>
<rect x="80.0" y="255.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="140.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">100 (L)</tspan><tspan x="140.0" dy="15.0">idx = 0</tspan><tspan x="140.0" dy="15.0">ПРОСТЕ</tspan></text>
<rect x="220.0" y="255.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">105 (start)</tspan><tspan x="280.0" dy="15.0">idx = 5</tspan><tspan x="280.0" dy="15.0">СКЛАДЕНЕ</tspan></text>
<rect x="360.0" y="255.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="420.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">112 (start+p)</tspan><tspan x="420.0" dy="15.0">idx = 12</tspan><tspan x="420.0" dy="15.0">СКЛАДЕНЕ</tspan></text>
<rect x="500.0" y="255.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="560.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">119 (start+2p)</tspan><tspan x="560.0" dy="15.0">idx = 19</tspan><tspan x="560.0" dy="15.0">СКЛАДЕНЕ</tspan></text>
<rect x="640.0" y="255.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="700.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">126 (start+3p)</tspan><tspan x="700.0" dy="15.0">idx = 26</tspan><tspan x="700.0" dy="15.0">СКЛАДЕНЕ</tspan></text>
<rect x="780.0" y="255.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="840.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">150 (R)</tspan><tspan x="840.0" dy="15.0">idx = 50</tspan><tspan x="840.0" dy="15.0">ПРОСТЕ</tspan></text>
<rect x="50.0" y="350.0" width="900.0" height="40.0" rx="6" fill="#e8eefc" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Формула адресації у локальному масиві:  local_index = X - L   ⇒   mark[X - L] = false</tspan></text>
<rect x="50.0" y="405.0" width="900.0" height="35.0" rx="6" fill="#f3e8fa" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Для кожного базового простого p викреслюємо елементи з кроком p: local_idx = (start - L), (start - L + p), (start - L + 2p)...</tspan></text>
</svg>