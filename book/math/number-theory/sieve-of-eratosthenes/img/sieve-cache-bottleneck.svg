<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння локальності даних: класичне vs сегментоване решето</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння локальності даних: класичне vs сегментоване решето</text>
<rect x="40.0" y="65.0" width="440.0" height="360.0" rx="8" fill="#fdecea" stroke="#2457d6" stroke-width="2.0"/><text x="260.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0"></tspan></text>
<text x="260.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Класичне решето Ератосфена</text>
<text x="260.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Масив розміром O(N) у DRAM (наприклад, 1–8 ГБ)</text>
<rect x="60.0" y="145.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Суцільний масив is_prime[0 .. N]</tspan></text>
<rect x="70.0" y="215.0" width="60.0" height="35.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.5"/><text x="100.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">i = p</tspan></text>
<rect x="170.0" y="215.0" width="60.0" height="35.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="236.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">i = 2p</tspan></text>
<rect x="270.0" y="215.0" width="60.0" height="35.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="236.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">i = 3p</tspan></text>
<rect x="370.0" y="215.0" width="60.0" height="35.0" rx="6" fill="#fffde6" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="236.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">i = 4p</tspan></text>
<line x1="130.0" y1="232.0" x2="170.0" y2="232.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="230.0" y1="232.0" x2="270.0" y2="232.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="330.0" y1="232.0" x2="370.0" y2="232.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="270.0" width="400.0" height="65.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.2"/><text x="260.0" y="291.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="260.0" dy="0.0">Кроковий стрибок p перевищує розмір L1/L2 кешу.</tspan><tspan x="260.0" dy="15.0">Кожен крок спричиняє Cache Miss і затримку DRAM (100+ нс).</tspan><tspan x="260.0" dy="15.0">CPU застопорюється (Stall) в очікуванні пам'яті.</tspan></text>
<rect x="60.0" y="350.0" width="400.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="260.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Пам'ять: O(N) | Кроків: O(N log log N)</tspan><tspan x="260.0" dy="16.9">Кеш-промахи: O(N log log N)</tspan></text>
<rect x="520.0" y="65.0" width="440.0" height="360.0" rx="8" fill="#e6f7ee" stroke="#c0392b" stroke-width="2.0"/><text x="740.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0"></tspan></text>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Сегментоване решето (Cache-Aware)</text>
<text x="740.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Обробка блоками розміром S ≈ 32 KB (L1 Cache)</text>
<rect x="540.0" y="145.0" width="400.0" height="40.0" rx="6" fill="#e8eefc" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Базові прості числа до √N (у L2 кеші)</tspan></text>
<rect x="540.0" y="200.0" width="400.0" height="55.0" rx="6" fill="#fffde6" stroke="#c0392b" stroke-width="2.0"/><text x="740.0" y="223.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Сегмент [L, R] розміром S</tspan><tspan x="740.0" dy="17.6">(Займає 32 KB — 100% L1 Cache Hit!)</tspan></text>
<rect x="540.0" y="270.0" width="400.0" height="65.0" rx="6" fill="#e6f7ee" stroke="#c0392b" stroke-width="1.2"/><text x="740.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="740.0" dy="0.0">Викреслювання виконується виключно в межах 32 KB.</tspan><tspan x="740.0" dy="16.2">Нуль звернень до DRAM під час просіювання сегмента.</tspan><tspan x="740.0" dy="16.2">Затримка доступу: 1–2 нс (L1 Cache speed).</tspan></text>
<rect x="540.0" y="350.0" width="400.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="740.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Пам'ять: O(√N + S) | Кроків: O(N log log N)</tspan><tspan x="740.0" dy="16.9">Кеш-промахи: O(N / S)</tspan></text>
<rect x="40.0" y="435.0" width="920.0" height="35.0" rx="6" fill="#f3e8fa" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="456.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Результат: При однаковій кількості арифметичних дій сегментоване решето працює у 5–20 разів швидше за рахунок кеш-локальності!</tspan></text>
</svg>