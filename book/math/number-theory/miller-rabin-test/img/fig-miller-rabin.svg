<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13.38 -10 826.76 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-13.38" y="-10" width="826.76" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема піднесення до квадрата у тесті Міллера-Рабіна та виявлення свідка складеності</text>
<circle cx="100.0" cy="200.0" r="30.0" fill="#e0f2fe" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="100.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">a^d</text>
<line x1="130.0" y1="200.0" x2="220.0" y2="200.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="175.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">x^2 mod n</text>
<circle cx="250.0" cy="200.0" r="30.0" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="250.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">a^{2d}</text>
<line x1="280.0" y1="200.0" x2="370.0" y2="200.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="325.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">x^2 mod n</text>
<circle cx="400.0" cy="200.0" r="30.0" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">a^{4d}</text>
<line x1="430.0" y1="200.0" x2="520.0" y2="200.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="475.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">x^2 mod n</text>
<circle cx="550.0" cy="200.0" r="30.0" fill="#fdfdfd" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="550.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">...</text>
<line x1="580.0" y1="200.0" x2="670.0" y2="200.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="700.0" cy="200.0" r="30.0" fill="#fee2e2" stroke="#2457d6" stroke-width="2.0"/>
<text x="700.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">a^{2^s d}</text>
<text x="400.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Якщо ми отримуємо 1 після значення, відмінного від -1, то знайдено нетривіальний корінь з 1.</text>
<text x="400.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Це свідчить про те, що число n - складене (a є свідком складеності).</text>
</svg>