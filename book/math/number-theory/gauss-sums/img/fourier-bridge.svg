<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сума Гаусса як місток між двома арифметичними світами</text>
<rect x="20.0" y="75.0" width="185.0" height="110.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="112.5" y="100.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="112.5" dy="0.0">Мультиплікативна група</tspan><tspan x="112.5" dy="16.9">𝔽ₚ* = {1, 2, ..., p-1}</tspan><tspan x="112.5" dy="16.9"></tspan><tspan x="112.5" dy="16.9">Характер χ(a)</tspan><tspan x="112.5" dy="16.9">(символ Лежандра)</tspan></text>
<rect x="435.0" y="75.0" width="185.0" height="110.0" rx="8" fill="#fff7ed" stroke="#c0392b" stroke-width="1.8"/><text x="527.5" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="527.5" dy="0.0">Адитивна група</tspan><tspan x="527.5" dy="14.3">(𝔽ₚ, +) = {0, 1, ..., p-1}</tspan><tspan x="527.5" dy="14.3"></tspan><tspan x="527.5" dy="14.3">Аддитивний характер</tspan><tspan x="527.5" dy="14.3">ψ(a) = e^(2πi·a/p)</tspan></text>
<line x1="210.0" y1="130.0" x2="430.0" y2="130.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="130.0" x2="210.0" y2="130.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220.0" y="85.0" width="200.0" height="90.0" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2.0"/><text x="320.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Дискретне перетворення Фур'є</tspan><tspan x="320.0" dy="13.0"></tspan><tspan x="320.0" dy="13.0">g(χ) = ∑ χ(a) · e^(2πi·a / p)</tspan></text>
<rect x="30.0" y="215.0" width="580.0" height="65.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="320.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Унітарність і симетрія: |g(χ)|² = p для будь-якого нетривіального характеру</tspan><tspan x="320.0" dy="16.9">Перетворення зберігає норму (аналог рівності Парсеваля)</tspan></text>
</svg>