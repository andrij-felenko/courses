<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Частотна область (параметр 1/t)</text>
<rect x="460.0" y="100.0" width="300.0" height="180.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="610.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Тета-ряд у двоїстому просторі:</tspan><tspan x="610.0" dy="14.3">θ₃(0, e^(-π/t)) = ∑_{k=-∞}^∞ e^(-π k² / t)</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">Фундаментальне тотожність Якобі:</tspan><tspan x="610.0" dy="14.3">θ₃(0, e^(-π t)) = (1/√t) · θ₃(0, e^(-π/t))</tspan><tspan x="610.0" dy="14.3"></tspan><tspan x="610.0" dy="14.3">● При малих t (t ≪ 1):</tspan><tspan x="610.0" dy="14.3">  Параметр 1/t великий! Двоїстий ряд</tspan><tspan x="610.0" dy="14.3">  збігається МИТТЄВО (2-3 члени).</tspan></text>
<text x="610.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Перемасштабовані двоїсті вузли:</text>
