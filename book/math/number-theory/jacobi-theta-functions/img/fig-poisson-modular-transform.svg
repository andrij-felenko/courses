<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Модулярне перетворення τ ↦ -1/τ та формула підсумовування Пуассона</text>
<rect x="25.0" y="55.0" width="360.0" height="380.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="205.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Часова область (параметр t &gt; 0)</text>
<rect x="40.0" y="100.0" width="330.0" height="160.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="205.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Тета-ряд у прямому просторі:</tspan><tspan x="205.0" dy="14.3">θ₃(0, e^(-π t)) = ∑_{n=-∞}^∞ e^(-π n² t)</tspan><tspan x="205.0" dy="14.3"></tspan><tspan x="205.0" dy="14.3">● При великих t (t ≫ 1):</tspan><tspan x="205.0" dy="14.3">  Доданки з n ≠ 0 експоненціально малі.</tspan><tspan x="205.0" dy="14.3">  Достатньо 1-2 членів: 1 + 2·e^(-π t).</tspan><tspan x="205.0" dy="14.3"></tspan><tspan x="205.0" dy="14.3">● При малих t (t ≪ 1):</tspan><tspan x="205.0" dy="14.3">  Збіжність вкрай повільна (тисячі членів).</tspan></text>
<text x="205.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Сума гаусіан у дискретних вузлах ℤ:</text>
