<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 610 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="610" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="300.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура досконалого числа N та мультиплікативність σ(N)</text>
<rect x="198.8" y="60.0" width="202.4" height="40.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">N = 2ᵖ⁻¹(2ᵖ − 1)</tspan></text>
<rect x="67.0" y="162.0" width="165.9" height="36.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">σ(2ᵖ⁻¹) = 2ᵖ − 1</tspan></text>
<rect x="376.2" y="162.0" width="147.7" height="36.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="185.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">σ(2ᵖ − 1) = 2ᵖ</tspan></text>
<rect x="64.3" y="261.0" width="471.4" height="38.0" rx="8" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">σ(N) = σ(2ᵖ⁻¹) · σ(2ᵖ − 1) = (2ᵖ − 1)2ᵖ = 2N</tspan></text>
<line x1="260.0" y1="100.0" x2="150.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="100.0" x2="450.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="150.0" y1="200.0" x2="260.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="200.0" x2="340.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>