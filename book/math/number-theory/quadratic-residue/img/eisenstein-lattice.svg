<text x="150.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">нижче (стовпці):  N = Σ⌊7k/11⌋ = 7    ⇒    (7|11) = (−1)⁷ = −1</text>
<text x="150.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">вище (рядки):     M = Σ⌊11j/7⌋ = 8    ⇒    (11|7) = (−1)⁸ = +1</text>
<text x="150.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">N + M = 15    ⇒    (7|11)(11|7) = (−1)¹⁵ = −1</text>
