<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обчислення символу (30|53) переворотами й зведенням</text>
<rect x="60.0" y="96.0" width="470.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="295.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">(30|53) = (2|53) · (15|53)</tspan></text>
<text x="560.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">винесли двійку:  30 = 2·15</text>
<line x1="295.0" y1="146.0" x2="295.0" y2="162.0" stroke="#cfd4da" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="164.0" width="470.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="295.0" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">(2|53) = −1</tspan></text>
<text x="560.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">бо 53 ≡ 5 (mod 8)</text>
<line x1="295.0" y1="214.0" x2="295.0" y2="230.0" stroke="#cfd4da" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="232.0" width="470.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="295.0" y="261.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">(15|53) = (53|15) = (8|15)</tspan></text>
<text x="560.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">переворот (53 ≡ 1 mod 4)  +  звели 53 mod 15 = 8</text>
<line x1="295.0" y1="282.0" x2="295.0" y2="298.0" stroke="#cfd4da" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="300.0" width="470.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="295.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">(8|15) = (2|15)³ = +1</tspan></text>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">бо 15 ≡ 7 (mod 8),  тож (2|15) = +1</text>
<line x1="295.0" y1="350.0" x2="295.0" y2="366.0" stroke="#cfd4da" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="368.0" width="470.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="295.0" y="397.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">(30|53) = (−1)·(+1) = −1</tspan></text>
<text x="560.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">30 — нелишок:  x² ≡ 30 (mod 53) без розв'язку</text>
<text x="500.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">кілька ділень із остачею, як у пошуку НСД — і жодного піднесення до великого степеня</text>
</svg>