<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадратний корінь за модулем: дві дороги за остачею p mod 4</text>
<rect x="241.6" y="52.5" width="516.9" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">дано просте p і лишок a  —  знайти x:  x² ≡ a (mod p)</tspan></text>
<line x1="500.0" y1="118.0" x2="500.0" y2="452.0" stroke="#d8dce2" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="70.0" y="132.0" width="360.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="250.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">p ≡ 3 (mod 4)   —   одна формула</tspan></text>
<rect x="120.0" y="190.0" width="260.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="220.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">x = a^((p+1)/4)</tspan></text>
<text x="96.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">x² = a^((p+1)/2)</text>
<text x="96.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">     = a^((p−1)/2) · a</text>
<text x="96.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">     = 1 · a = a</text>
<text x="96.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">бо a — лишок:  a^((p−1)/2) ≡ 1</text>
<text x="96.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">→ одне піднесення до степеня</text>
<rect x="560.0" y="132.0" width="380.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="750.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">p ≡ 1 (mod 4)   —   треба працювати</tspan></text>
<text x="584.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">(p+1)/4 — не ціле число</text>
<text x="584.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">p − 1 = Q · 2ˢ,   Q непарне</text>
<text x="584.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">t = a^Q  живе у 2-степеневій вежі</text>
<text x="584.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">гасити t до 1, збираючи корінь R</text>
<rect x="584.0" y="350.0" width="340.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="754.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="754.0" dy="0.0">алгоритм Тонеллі — Шенкса</tspan></text>
<text x="500.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">увесь клопіт — лише у 2-степеневій частині p−1; непарна частина кореня не помічає</text>
</svg>