<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тонеллі — Шенкс: гасіння 2-степеня t сходинками до кореня</text>
<text x="510.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">Тонеллі — Шенкс:  a = 5,  p = 41   (p − 1 = 5·2³,  нелишок-затравка z = 3)</text>
<text x="510.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">старт:  t = a^Q = 5⁵ ≡ 9,   R = a^((Q+1)/2) = 5³ ≡ 2</text>
<line x1="150.0" y1="138.0" x2="150.0" y2="486.0" stroke="#cfd4da" stroke-width="2.0"/>
<text x="150.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">порядок t</text>
<text x="136.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">2² = 4</text>
<circle cx="150.0" cy="170.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<rect x="190.0" y="133.0" width="760.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="214.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">t = 9</text>
<text x="214.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="start" font-weight="700">R = 2</text>
<text x="470.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">R² ≡ a·t :  2² ≡ 4  =  5·9</text>
<text x="136.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">2¹ = 2</text>
<circle cx="150.0" cy="310.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<rect x="190.0" y="273.0" width="760.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="214.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">t = 40</text>
<text x="214.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="start" font-weight="700">R = 35</text>
<text x="470.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">R² ≡ a·t :  35² ≡ 36  =  5·40</text>
<text x="136.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">2⁰ = 1</text>
<circle cx="150.0" cy="450.0" r="6.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<rect x="190.0" y="413.0" width="760.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="214.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">t = 1</text>
<text x="214.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="start" font-weight="700">R = 28</text>
<text x="470.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">R² ≡ a·t :  28² ≡ 5  =  5·1</text>
<text x="470.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">t = 1   ⟹   R² = a   ⟹   корінь x = 28</text>
<line x1="150.0" y1="209.0" x2="150.0" y2="271.0" stroke="#9aa1ab" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="455.1" y="225.8" width="229.7" height="28.5" rx="6" fill="#fbfbfc" stroke="#dfe3e8" stroke-width="1.5"/><text x="570.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="570.0" dy="0.0">×b² на t,  ×b на R    (b = 38)</tspan></text>
<line x1="150.0" y1="349.0" x2="150.0" y2="411.0" stroke="#9aa1ab" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="458.7" y="365.8" width="222.6" height="28.5" rx="6" fill="#fbfbfc" stroke="#dfe3e8" stroke-width="1.5"/><text x="570.0" y="384.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="570.0" dy="0.0">×b² на t,  ×b на R    (b = 9)</tspan></text>
<text x="510.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">кожна сходинка вдвічі меншає порядок t; за S кроків t доходить до 1, а R — до кореня (другий корінь = −R = 13)</text>
</svg>