<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 612" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="612" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">+1 за складеним модулем не доводить, що число — квадрат</text>
<rect x="40.0" y="62.0" width="150.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="90.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">(a|15) =</tspan><tspan x="115.0" dy="16.9">(a|3)·(a|5)</tspan></text>
<rect x="200.0" y="62.0" width="340.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">лишок за mod 3     (a|3) = +1</tspan></text>
<rect x="566.0" y="62.0" width="340.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="736.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="736.0" dy="0.0">нелишок за mod 3     (a|3) = −1</tspan></text>
<rect x="40.0" y="140.0" width="150.0" height="196.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="224.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">лишок</tspan><tspan x="115.0" dy="18.2">за mod 5</tspan><tspan x="115.0" dy="18.2">(a|5) = +1</tspan></text>
<rect x="40.0" y="350.0" width="150.0" height="196.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="434.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">нелишок</tspan><tspan x="115.0" dy="18.2">за mod 5</tspan><tspan x="115.0" dy="18.2">(a|5) = −1</tspan></text>
<rect x="200.0" y="140.0" width="340.0" height="196.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="370.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="700">1,  4</text>
<text x="370.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">(+1)·(+1) = +1</text>
<text x="370.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-style="italic">справжній квадрат</text>
<rect x="566.0" y="140.0" width="340.0" height="196.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="736.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="700">11,  14</text>
<text x="736.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">(−1)·(+1) = −1</text>
<text x="736.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-style="italic">нелишок — символ чесний</text>
<rect x="200.0" y="350.0" width="340.0" height="196.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="370.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="700">7,  13</text>
<text x="370.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">(+1)·(−1) = −1</text>
<text x="370.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-style="italic">нелишок — символ чесний</text>
<rect x="566.0" y="350.0" width="340.0" height="196.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="736.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="34" fill="#1a1a1a" text-anchor="middle" font-weight="700">2,  8</text>
<text x="736.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">(−1)·(−1) = +1</text>
<text x="736.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-style="italic">НЕ квадрат — символ бреше</text>
<text x="470.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">Символ +1 стоїть на діагоналі — там, де знаки однакові: (+)(+) і (−)(−).</tspan><tspan x="470.0" dy="18.2">Та лише «лишок·лишок» — квадрати; «нелишок·нелишок» носить той самий +1 дарма.</tspan></text>
</svg>