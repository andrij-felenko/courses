<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження золотої теореми: пів століття від таблиць до доведення</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="640.0" stroke="#cfd4da" stroke-width="2.0"/>
<text x="224.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">≈1740–83</text>
<rect x="286.0" y="98.0" width="598.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Ейлер (Швейцарія): закон вичитано з таблиць лишків.</tspan><tspan x="585.0" dy="17.6">Довести не зумів; повний виклад надруковано 1783, посмертно.</tspan></text>
<circle cx="250.0" cy="128.0" r="5.5" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="224.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1785</text>
<rect x="286.0" y="174.0" width="598.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="585.0" y="201.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Лежандр (Франція): перше формулювання й назва «закон взаємності».</tspan><tspan x="585.0" dy="17.6">Доведення з дірою — спиралось на недоведене твердження</tspan><tspan x="585.0" dy="17.6">про прості в прогресіях. Символ (a|p) — у трактаті 1798.</tspan></text>
<circle cx="250.0" cy="214.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<text x="224.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1796</text>
<rect x="286.0" y="304.0" width="598.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="585.0" y="331.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Гаусс (Німеччина), 18 років: ПЕРШЕ ПОВНЕ доведення.</tspan><tspan x="585.0" dy="17.6">Роком раніше, 1795, за власним свідченням відкрив закон</tspan><tspan x="585.0" dy="17.6">із таблиць — не знаючи ні Ейлера, ні Лежандра.</tspan></text>
<circle cx="250.0" cy="344.0" r="13.0" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<circle cx="250.0" cy="344.0" r="7.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="224.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1801</text>
<rect x="286.0" y="400.0" width="598.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="585.0" y="427.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">«Арифметичні дослідження» (Disquisitiones Arithmeticae):</tspan><tspan x="585.0" dy="17.6">закон надруковано. Гаусс зве його theorema fundamentale,</tspan><tspan x="585.0" dy="17.6">а приватно — theorema aureum, «золота теорема».</tspan></text>
<circle cx="250.0" cy="440.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="224.0" y="529.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1801–32</text>
<rect x="286.0" y="494.0" width="598.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="585.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Вісім доведень: шість за життя, ще два — у паперах.</tspan><tspan x="585.0" dy="17.6">Щоразу новим методом: Гаусс шукав той, що узагальниться.</tspan></text>
<circle cx="250.0" cy="524.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="224.0" y="613.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">1837</text>
<rect x="286.0" y="578.0" width="598.0" height="60.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="585.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Діріхле доводить теорему про прості в прогресіях —</tspan><tspan x="585.0" dy="17.6">ту саму, що бракувала Лежандрові. Діру закрито через 52 роки.</tspan></text>
<circle cx="250.0" cy="608.0" r="5.5" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/>
<line x1="250.0" y1="256.0" x2="250.0" y2="272.0" stroke="#cfd4da" stroke-width="2.0" stroke-dasharray="3 6"/>
<line x1="250.0" y1="288.0" x2="250.0" y2="302.0" stroke="#cfd4da" stroke-width="2.0" stroke-dasharray="3 6"/>
<rect x="95.9" y="264.8" width="308.1" height="28.5" rx="6" fill="#fbf7e6" stroke="#d8cf9a" stroke-width="1.5"/><text x="250.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a6f36" text-anchor="middle"><tspan x="250.0" dy="0.0">пів століття: бачать, а довести не можуть</tspan></text>
</svg>