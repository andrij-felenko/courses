<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура простих дільників чисел Мерсенна</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура простих дільників q для Mₚ = 2ᵖ − 1 (p — просте)</text>
<rect x="330.0" y="65.0" width="300.0" height="50.0" rx="6" fill="#f3e8fa" stroke="#1a1a1a" stroke-width="2.0"/><text x="480.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Число Мерсенна Mₚ (p — просте)</tspan></text>
<line x1="480.0" y1="115.0" x2="480.0" y2="155.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="100.0" y="160.0" width="760.0" height="110.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="480.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Будь-який простий дільник q числа Mₚ задовольняє дві суворі умови:</tspan><tspan x="480.0" dy="18.2">1) q ≡ 1 (mod 2p)  ⇒  q = 2kp + 1  (для деякого цілого k ≥ 1)</tspan><tspan x="480.0" dy="18.2">2) q ≡ ±1 (mod 8)  ⇒  2 є квадратичним лишком за модулем q</tspan></text>
<line x1="480.0" y1="270.0" x2="480.0" y2="305.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="310.0" width="840.0" height="105.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="480.0" y="349.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Приклад: M₁₁ = 2047 = 23 · 89 (p = 11)</tspan><tspan x="480.0" dy="17.6">- Для q = 23:  23 = 2·1·11 + 1  (k=1)  та  23 ≡ 7 ≡ −1 (mod 8)</tspan><tspan x="480.0" dy="17.6">- Для q = 89:  89 = 2·4·11 + 1  (k=4)  та  89 ≡ 1 (mod 8)</tspan></text>
</svg>