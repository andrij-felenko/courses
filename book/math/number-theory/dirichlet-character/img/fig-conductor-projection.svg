<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="380.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Провідник (conductor) та індукований характер</text>
<text x="400.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зведення індукованого характера χ (mod 12) до первісного характера χ* (mod 3)</text>
<rect x="50.0" y="95.0" width="310.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="205.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Первісний характер χ* (mod 3)</text>
<text x="205.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Провідник d = 3 (найменший модуль)</text>
<rect x="70.0" y="170.0" width="270.0" height="36.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="85.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">n = 1 (mod 3):</text>
<text x="325.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="end" font-weight="700">χ*(1) = 1</text>
<rect x="70.0" y="215.0" width="270.0" height="36.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="85.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">n = 2 (mod 3):</text>
<text x="325.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="end" font-weight="700">χ*(2) = -1</text>
<rect x="70.0" y="260.0" width="270.0" height="36.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="85.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">n = 0 (mod 3):</text>
<text x="325.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="end" font-weight="700">χ*(0) = 0</text>
<line x1="370.0" y1="215.0" x2="430.0" y2="215.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Індукція</text>
<text x="400.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">χ(n) = χ*(n)</text>
<rect x="440.0" y="95.0" width="310.0" height="240.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/>
<text x="595.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">Індукований характер χ (mod 12)</text>
<text x="595.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">Модуль q = 12; φ(12) = 4</text>
<rect x="455.0" y="165.0" width="280.0" height="30.0" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="465.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">n = 1 (mod 12):</text>
<text x="725.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="end" font-weight="700">1 ≡ 1 (mod 3) ⇒ χ(1) = 1</text>
<rect x="455.0" y="203.0" width="280.0" height="30.0" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="465.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">n = 5 (mod 12):</text>
<text x="725.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="end" font-weight="700">5 ≡ 2 (mod 3) ⇒ χ(5) = -1</text>
<rect x="455.0" y="241.0" width="280.0" height="30.0" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="465.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">n = 7 (mod 12):</text>
<text x="725.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="end" font-weight="700">7 ≡ 1 (mod 3) ⇒ χ(7) = 1</text>
<rect x="455.0" y="279.0" width="280.0" height="30.0" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="465.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">n = 11 (mod 12):</text>
<text x="725.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="end" font-weight="700">11 ≡ 2 (mod 3) ⇒ χ(11) = -1</text>
</svg>