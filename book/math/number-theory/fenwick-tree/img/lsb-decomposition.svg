<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебра побітового виділення LSB: i &amp; (-i)</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Операція доповняльного коду -i = (~i) + 1 інвертує старші біти та зберігає наймолодшу одиницю</text>
<text x="60.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Число i = 12:</text>
<rect x="220.0" y="75.0" width="420.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">0 0 0 0   1 1 0 0_2</text>
<text x="60.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Побітове НІ ~i:</text>
<rect x="220.0" y="130.0" width="420.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">1 1 1 1   0 0 1 1_2</text>
<text x="60.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Число -i = (~i) + 1:</text>
<rect x="220.0" y="185.0" width="420.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="430.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1 1 1 1   0 1 0 0_2</text>
<line x1="50.0" y1="238.0" x2="810.0" y2="238.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="60.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Результат i &amp; (-i):</text>
<rect x="220.0" y="260.0" width="420.0" height="36.0" rx="4" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="430.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">0 0 0 0   0 1 0 0_2  =  4</text>
<rect x="456.0" y="263.0" width="65.0" height="30.0" rx="3" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<text x="488.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Єдиний спільний 1-біт (LSB = 4)</text>
</svg>