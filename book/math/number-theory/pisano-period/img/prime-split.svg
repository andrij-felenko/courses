<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація періоду Пізано за модулем простого p</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура періоду Пізано π(p) залежно від квадратичного лишку (5 / p)</text>
<rect x="360.0" y="75.0" width="220.0" height="48.0" rx="8" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просте число p</text>
<line x1="420.0" y1="123.0" x2="180.0" y2="165.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="470.0" y1="123.0" x2="500.0" y2="165.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="520.0" y1="123.0" x2="800.0" y2="165.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="70.0" y="165.0" width="220.0" height="36.0" rx="6" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="180.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">p ≡ 1, 4 (mod 5)</text>
<rect x="390.0" y="165.0" width="220.0" height="36.0" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
<text x="500.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">p ≡ 2, 3 (mod 5)</text>
<rect x="730.0" y="165.0" width="140.0" height="36.0" rx="6" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.2"/>
<text x="800.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">p = 5</text>
<line x1="180.0" y1="201.0" x2="180.0" y2="225.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="500.0" y1="201.0" x2="500.0" y2="225.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="800.0" y1="201.0" x2="800.0" y2="225.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="45.0" y="225.0" width="270.0" height="125.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="180.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">5 є квадратичним лишком</text>
<text x="180.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">√5 існує в полі F_p</text>
<text x="180.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Власні значення φ, ψ ∈ F_p</text>
<text x="180.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">π(p) ділить (p − 1)</text>
<rect x="365.0" y="225.0" width="270.0" height="125.0" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.6"/>
<text x="500.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a16207" text-anchor="middle" font-weight="700">5 не є квадратичним лишком</text>
<text x="500.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">√5 належить розширенню F_p²</text>
<text x="500.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Фробеніус: φ^p ≡ ψ (mod p)</text>
<text x="500.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#a16207" text-anchor="middle" font-weight="700">π(p) ділить 2(p + 1)</text>
<rect x="715.0" y="225.0" width="170.0" height="125.0" rx="8" fill="#fcfcfc" stroke="#333333" stroke-width="1.2"/>
<text x="800.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Вироджений випадок</text>
<text x="800.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">φ ≡ ψ ≡ 3 (mod 5)</text>
<text x="800.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">π(5) = 20</text>
</svg>