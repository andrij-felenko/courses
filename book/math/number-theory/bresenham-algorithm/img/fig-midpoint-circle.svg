<rect x="500.0" y="80.0" width="210.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="605.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Алгоритм кола Брезенгема:</tspan><tspan x="605.0" dy="13.0">• D_initial = 3 - 2R</tspan><tspan x="605.0" dy="13.0">• Якщо D &lt; 0 → E (x+1, y)</tspan><tspan x="605.0" dy="13.0">  ΔD = 4x + 6</tspan><tspan x="605.0" dy="13.0">• Якщо D ≥ 0 → SE (x+1, y-1)</tspan><tspan x="605.0" dy="13.0">  ΔD = 4(x - y) + 10</tspan><tspan x="605.0" dy="13.0">8-бічна дзеркальна симетрія</tspan></text>
