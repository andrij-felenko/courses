<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
<rect width="860" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Двійкове задовге для очей — рятує шістнадцятковий «скоропис»</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">32-бітне число — це 32 нулі й одиниці поспіль; те саме шістнадцятково — лише 8 знаків</text>
<text x="120.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">двійкове (32 біти):</text>
<text x="120.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">1101 1110 1010 1101 1011 1110 1110 1111</text>
<text x="120.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="italic">…спробуй прочитати чи не помилитися</text>
<line x1="430.0" y1="195.0" x2="430.0" y2="225.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="120.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">шістнадцяткове:</text>
<text x="330.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0x DE AD BE EF</text>
<text x="620.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">← ті самі 32 біти, 8 знаків</text>
<text x="430.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0xDEADBEEF — знаменита «налагоджувальна» позначка; одне й те саме число, та читати в рази легше.</text>
</svg>
