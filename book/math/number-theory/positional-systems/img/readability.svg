<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкове задовге для ока — рятує шістнадцяткова</text>
<text x="360.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">двійково — 32 знаки:</text>
<text x="360.0" y="100.0" font-family="Consolas, monospace" font-size="18" fill="#c0392b" text-anchor="middle" letter-spacing="1.5">11011110101011011011111011101111</text>
<text x="360.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">легко збитися й перерахувати</text>
<line x1="360.0" y1="150.0" x2="360.0" y2="178.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">те саме шістнадцятково — 8 знаків:</text>
<text x="360.0" y="230.0" font-family="Consolas, monospace" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700" letter-spacing="2">0xDEADBEEF</text>
</svg>