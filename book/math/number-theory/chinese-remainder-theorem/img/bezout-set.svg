<rect x="60.0" y="402.0" width="790.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="455.0" y="421.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">множина {6u + 15v} — це РІВНО кратні трійки: ні більше, ні менше.</tspan><tspan x="455.0" dy="16.2">Найменше додатне в ній і є НСД — а якщо НСД = 1, то одиниця складається, і з неї виходить обернений.</tspan></text>
