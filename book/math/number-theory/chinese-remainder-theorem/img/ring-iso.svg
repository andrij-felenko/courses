<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гомоморфізм: квадрат замикається</text>
<rect x="135.6" y="103.0" width="158.9" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="215.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">x = 23,   y = 17</tspan></text>
<rect x="628.1" y="93.9" width="123.7" height="52.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="690.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle"><tspan x="690.0" dy="0.0">x → (2, 3, 2)</tspan><tspan x="690.0" dy="18.2">y → (2, 2, 3)</tspan></text>
<rect x="135.6" y="283.0" width="158.9" height="34.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="215.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">x · y = 391 ≡ 76</tspan></text>
<rect x="620.1" y="273.9" width="139.7" height="52.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="690.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="690.0" dy="0.0">(2·2, 3·2, 2·3)</tspan><tspan x="690.0" dy="18.2">≡ (1, 1, 6)</tspan></text>
<line x1="310.4" y1="120.0" x2="612.1" y2="120.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">φ — звести за 3, 5, 7</text>
<line x1="310.4" y1="300.0" x2="604.1" y2="300.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="452.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">φ — те саме зведення</text>
<line x1="215.0" y1="151.0" x2="215.0" y2="269.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">перемножити</text>
<text x="200.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">у ℤ/105</text>
<line x1="690.0" y1="160.1" x2="690.0" y2="259.9" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="706.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перемножити</text>
<text x="706.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">покоординатно</text>
<text x="452.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">обидва шляхи → (1, 1, 6)</text>
<rect x="60.0" y="356.0" width="780.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="450.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Куди не йди — відповідь одна: φ(x·y) = φ(x)·φ(y), і так само для «+» та «−».</tspan><tspan x="450.0" dy="16.2">Ця половина не коштує нічого: зведення за модулем ЗАВЖДИ шанує арифметику, хоч які модулі.</tspan></text>
</svg>