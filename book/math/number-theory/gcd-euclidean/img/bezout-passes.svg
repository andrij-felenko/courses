<text x="88.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   = 462 − 3 · (1071 − 2 · 462)</text>
<text x="88.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   = 1071 · (−3) + 462 · 7</text>
<text x="295.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="295.0" dy="0.0">Підстановка розкриває дужки знизу вгору.</tspan><tspan x="295.0" dy="18.0">Памʼять — увесь ланцюг часток: для чисел на</tspan><tspan x="295.0" dy="18.0">тисячу двійкових розрядів це близько півтори</tspan><tspan x="295.0" dy="18.0">тисячі рядків, потрібних аж наприкінці.</tspan></text>
