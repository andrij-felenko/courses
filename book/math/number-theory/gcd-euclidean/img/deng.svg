<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Дев'ять розділів»: взаємне віднімання й «рівне» число</text>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило: скоротити дріб, не знаючи дільників</text>
<circle cx="80.0" cy="130.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="108.0" y="106.0" width="380.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="298.0" y="134.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">Якщо ОБИДВА можна поділити навпіл — ділимо</tspan></text>
<circle cx="80.0" cy="192.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<rect x="108.0" y="168.0" width="380.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="298.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">Далі: від більшого віднімаємо менше</tspan></text>
<circle cx="80.0" cy="254.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">3</text>
<rect x="108.0" y="230.0" width="380.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="298.0" y="258.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">Повторюємо, доки числа не ЗРІВНЯЮТЬСЯ</tspan></text>
<circle cx="80.0" cy="316.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">4</text>
<rect x="108.0" y="292.0" width="380.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="298.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">Це число — «рівне» (děng). Ділимо на нього</tspan></text>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">12/18 — крок за кроком</text>
<rect x="620.0" y="106.0" width="440.0" height="48.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="840.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">12 і 18 — обидва парні → 6 і 9</tspan></text>
<rect x="620.0" y="168.0" width="440.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="840.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">9 − 6 = 3      → пара (6, 3)</tspan></text>
<rect x="620.0" y="230.0" width="440.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="840.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">6 − 3 = 3      → пара (3, 3)  зрівнялися</tspan></text>
<rect x="620.0" y="292.0" width="440.0" height="48.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="840.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">«рівне» = 3</tspan></text>
<rect x="620.0" y="354.0" width="440.0" height="48.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="840.0" y="382.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">6 / 3 = 2,   9 / 3 = 3   →   2/3</tspan></text>
<text x="620.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">спиняє не нуль, а рівність — так природно, коли лише віднімаєш</text>
<rect x="60.0" y="502.0" width="1000.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/><text x="560.0" y="536.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">«Якщо можна — поділи навпіл»: половинити ОБИДВА (тоді це Евклід зі скороченням)</tspan><tspan x="560.0" dy="18.9">чи ТЕ З НИХ, що парне (тоді це двійковий НСД, перевідкритий 1967-го)?</tspan><tspan x="560.0" dy="18.9">Текст не уточнює — і на цій одній фразі тримається вся суперечка.</tspan></text>
</svg>