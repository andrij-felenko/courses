<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама процедура — дві долі</text>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">21 і 15 — процедура спиняється</text><rect x="60.0" y="104.0" width="420.0" height="48.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="270.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">21 = 1 · 15 + 6</tspan></text><rect x="60.0" y="164.0" width="420.0" height="48.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="270.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">15 = 2 · 6 + 3</tspan></text><rect x="60.0" y="224.0" width="420.0" height="48.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="270.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">6 = 2 · 3 + 0   ← залишку немає</tspan></text>
<rect x="60.0" y="308.0" width="420.0" height="74.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.5"/><text x="270.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">СУМІРНІ</tspan><tspan x="270.0" dy="20.8">спільна міра є, і вона = 3</tspan></text>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">сторона a й діагональ d квадрата — не спиняється</text><rect x="620.0" y="104.0" width="420.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="830.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">d = 1 · a + r₁</tspan></text><rect x="620.0" y="164.0" width="420.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="830.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">a = 2 · r₁ + r₂</tspan></text><rect x="620.0" y="224.0" width="420.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="830.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">r₁ = 2 · r₂ + r₃</tspan></text><rect x="620.0" y="284.0" width="420.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="830.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">r₂ = 2 · r₃ + r₄</tspan></text><rect x="620.0" y="344.0" width="420.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="830.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">…  далі 2, 2, 2 …  без кінця</tspan></text>
<rect x="620.0" y="428.0" width="420.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="830.0" y="460.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">НЕСУМІРНІ</tspan><tspan x="830.0" dy="20.8">спільної міри не існує ЗОВСІМ</tspan></text>
<rect x="60.0" y="506.0" width="980.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="550.0" y="535.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">a : r₁  =  r₁ : r₂  =  r₂ : r₃  =  √2 + 1 ≈ 2.414  —  на кожному щаблі та сама картина, лише менша.</tspan><tspan x="550.0" dy="18.2">Самоподібність не дає процедурі спинитися: частки 1, 2, 2, 2, … тягнуться в нескінченність.</tspan></text>
<rect x="60.0" y="596.0" width="980.0" height="68.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="550.0" y="625.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Греки ганяли цю процедуру не заради НСД, а заради питання «спиниться чи ні».</tspan><tspan x="550.0" dy="18.9">НСД — приз, який дістається тоді, коли відповідь «спиниться».</tspan></text>
</svg>