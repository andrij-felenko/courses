<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто зробив — і чиє ім'я</text>
<text x="40.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">«Тотожність Безу» — про ЦІЛІ числа</text><rect x="70.0" y="88.0" width="200.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="170.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Евклід</tspan><tspan x="170.0" dy="16.9">~300 до н. е.</tspan><tspan x="170.0" dy="16.9">існування</tspan></text><line x1="275.0" y1="134.0" x2="325.0" y2="134.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="330.0" y="88.0" width="200.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="430.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Баше</tspan><tspan x="430.0" dy="16.9">1624</tspan><tspan x="430.0" dy="16.9">усі розв'язки</tspan></text><line x1="535.0" y1="134.0" x2="585.0" y2="134.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="590.0" y="88.0" width="200.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="690.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Безу</tspan><tspan x="690.0" dy="16.9">1779</tspan><tspan x="690.0" dy="16.9">для МНОГОЧЛЕНІВ</tspan></text><line x1="795.0" y1="134.0" x2="845.0" y2="134.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="850.0" y="88.0" width="200.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="950.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Бурбакі</tspan><tspan x="950.0" dy="16.9">1949</tspan><tspan x="950.0" dy="16.9">приліпив ім'я</tspan></text><text x="40.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">Ім'я — на тому, хто розв'язував ІНШУ задачу. Цілочисельний випадок зробили Евклід і Баше.</text>
<text x="40.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">«Теорема Ламе» — межа на кількість кроків</text><rect x="38.0" y="298.0" width="182.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="129.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="129.0" dy="0.0">Рейно</tspan><tspan x="129.0" dy="16.9">1811</tspan><tspan x="129.0" dy="16.9">слабка межа</tspan></text><line x1="225.0" y1="344.0" x2="251.0" y2="344.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="256.0" y="298.0" width="182.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="347.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="347.0" dy="0.0">Леже</tspan><tspan x="347.0" dy="16.9">1837</tspan><tspan x="347.0" dy="16.9">результат знав</tspan></text><line x1="443.0" y1="344.0" x2="469.0" y2="344.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="474.0" y="298.0" width="182.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="565.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Фінк</tspan><tspan x="565.0" dy="16.9">1841</tspan><tspan x="565.0" dy="16.9">повне доведення</tspan></text><line x1="661.0" y1="344.0" x2="687.0" y2="344.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="692.0" y="298.0" width="182.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="783.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="783.0" dy="0.0">Ламе</tspan><tspan x="783.0" dy="16.9">1844</tspan><tspan x="783.0" dy="16.9">ім'я тут</tspan></text><line x1="879.0" y1="344.0" x2="905.0" y2="344.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="910.0" y="298.0" width="182.0" height="92.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.6"/><text x="1001.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1001.0" dy="0.0">Шаллі</tspan><tspan x="1001.0" dy="16.9">1994</tspan><tspan x="1001.0" dy="16.9">розкопав правду</tspan></text><text x="40.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">Ім'я — на четвертому. Перших трьох забули на півтора століття.</text>
<rect x="70.0" y="470.0" width="1020.0" height="76.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="580.0" y="503.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Закон Стіглера (1980): жодне наукове відкриття не назване іменем свого відкривача.</tspan><tspan x="580.0" dy="18.9">Стіглер приписав цей закон Мертонові — щоб закон справдився й на самому собі.</tspan></text>
<rect x="70.0" y="566.0" width="1020.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="580.0" y="592.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Механізм той самий двічі: ім'я чіпляється не до того, хто знайшов ПЕРШИМ,</tspan><tspan x="580.0" dy="18.2">а до того, через кого про це дізналися ВСІ РЕШТА.</tspan></text>
</svg>