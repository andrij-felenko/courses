<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійковий НСД: ділення замінено на зсув, порівняння й віднімання</text>
<rect x="56.0" y="96.0" width="430.0" height="66.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="271.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">НСД(u, 0) = u</tspan></text>
<text x="514.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="514.0" dy="0.0">Нуль ділиться на будь-що, тож обмежує лише u.</tspan><tspan x="514.0" dy="20.2">База: далі йти нема куди.</tspan></text>
<rect x="56.0" y="200.0" width="430.0" height="66.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="271.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">u, v парні:   НСД = 2 · НСД(u/2, v/2)</tspan></text>
<text x="514.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="514.0" dy="0.0">Двійка спільна — вона входить у відповідь.</tspan><tspan x="514.0" dy="20.2">Виносимо її й лічимо, скільки разів винесли.</tspan></text>
<rect x="56.0" y="304.0" width="430.0" height="66.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="271.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">u непарне, v парне:   НСД(u, v) = НСД(u, v/2)</tspan></text>
<text x="514.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="514.0" dy="0.0">Двійка є лише в v, отже спільною бути не може.</tspan><tspan x="514.0" dy="20.2">Викидаємо її задарма — відповідь не змінюється.</tspan></text>
<rect x="56.0" y="408.0" width="430.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="271.0" y="445.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">u, v непарні, u ≤ v:   НСД(u, v) = НСД(u, v − u)</tspan></text>
<text x="514.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="514.0" dy="0.0">Той самий крок Евкліда — віднімання.</tspan><tspan x="514.0" dy="20.2">Різниця двох непарних ПАРНА → одразу спрацює правило вище.</tspan></text>
<rect x="56.0" y="500.0" width="948.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="530.0" y="527.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Жодне правило не шукає дільників: кожне або знімає двійку, або зменшує пару.</tspan></text>
</svg>