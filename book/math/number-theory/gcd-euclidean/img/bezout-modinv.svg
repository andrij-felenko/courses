<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="272.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">НСД(7, 10) = 1 — крок 7 попадає в 1</text><text x="272.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">0 → 7 → 4 → 1: три кроки по 7 і два повні оберти</text><circle cx="272.0" cy="294.0" r="132.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><line x1="260.2" y1="178.2" x2="158.2" y2="318.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="165.5" y1="341.0" x2="330.6" y2="394.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="349.6" y1="380.8" x2="349.6" y2="207.2" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><circle cx="272.0" cy="162.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="272.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><circle cx="349.6" cy="187.2" r="15.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="3.0"/><text x="349.6" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text><circle cx="397.5" cy="253.2" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="397.5" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text><circle cx="397.5" cy="334.8" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="397.5" y="339.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text><circle cx="349.6" cy="400.8" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="349.6" y="405.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text><circle cx="272.0" cy="426.0" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="272.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5</text><circle cx="194.4" cy="400.8" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="194.4" y="405.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">6</text><circle cx="146.5" cy="334.8" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="146.5" y="339.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">7</text><circle cx="146.5" cy="253.2" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="146.5" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">8</text><circle cx="194.4" cy="187.2" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="194.4" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">9</text>
<text x="272.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="272.0" dy="0.0">7 · 3 = 21 = 2 · 10 + 1   →   7 · 3 + 10 · (−2) = 1</tspan><tspan x="272.0" dy="20.2">За модулем 10 оберти зникають: 7 · 3 ≡ 1 (mod 10).</tspan><tspan x="272.0" dy="20.2">Отже обернене до 7 за модулем 10 — це 3.</tspan></text>
<text x="808.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">НСД(6, 9) = 3 — в 1 не попасти ніколи</text><text x="808.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">0 → 6 → 3 → 0: коло замкнулося, оминувши 1</text><circle cx="808.0" cy="294.0" r="132.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><line x1="798.0" y1="179.3" x2="703.7" y2="342.7" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="713.7" y1="360.0" x2="902.3" y2="360.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="912.3" y1="342.7" x2="818.0" y2="179.3" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><circle cx="808.0" cy="162.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="808.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><circle cx="892.8" cy="192.9" r="15.0" fill="#fdecea" stroke="#c0392b" stroke-width="3.0"/><text x="892.8" y="197.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text><circle cx="938.0" cy="271.1" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="938.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text><circle cx="922.3" cy="360.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="922.3" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text><circle cx="853.1" cy="418.0" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="853.1" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">4</text><circle cx="762.9" cy="418.0" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="762.9" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5</text><circle cx="693.7" cy="360.0" r="15.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="693.7" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">6</text><circle cx="678.0" cy="271.1" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="678.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">7</text><circle cx="723.2" cy="192.9" r="15.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="723.2" y="197.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">8</text>
<text x="808.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="808.0" dy="0.0">Крок 6 і модуль 9 обидва кратні 3, тож і 6·x + 9·y кратне 3.</tspan><tspan x="808.0" dy="20.2">Одиниця на 3 не ділиться — такої комбінації не буває.</tspan><tspan x="808.0" dy="20.2">Обернене існує ⟺ НСД(a, m) = 1. Без винятків.</tspan></text>
<line x1="540.0" y1="108.0" x2="540.0" y2="530.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
</svg>