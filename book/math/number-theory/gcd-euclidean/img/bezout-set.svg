<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що можна зібрати з a = 6 і b = 4 самими цілими кроками вперед і назад</text>
<line x1="64.0" y1="196.0" x2="980.0" y2="196.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="90.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="90.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">-4</text>
<circle cx="144.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="144.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">-3</text>
<circle cx="198.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="198.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">-2</text>
<circle cx="252.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="252.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">-1</text>
<circle cx="306.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="306.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<circle cx="360.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="360.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1</text>
<circle cx="414.0" cy="196.0" r="11.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="3.0"/>
<text x="414.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<circle cx="468.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="468.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
<circle cx="522.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="522.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text>
<circle cx="576.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="576.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
<circle cx="630.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="630.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">6</text>
<circle cx="684.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="684.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
<circle cx="738.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="738.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">8</text>
<circle cx="792.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="792.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">9</text>
<circle cx="846.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="846.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">10</text>
<circle cx="900.0" cy="196.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="900.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">11</text>
<circle cx="954.0" cy="196.0" r="9.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="954.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">12</text>
<text x="90.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">6·0 + 4·(−1) = −4</text>
<line x1="90.0" y1="126.0" x2="90.0" y2="174.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="414.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">6·1 + 4·(−1) = 2</text>
<line x1="414.0" y1="126.0" x2="414.0" y2="174.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="846.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">6·1 + 4·1 = 10</text>
<line x1="846.0" y1="126.0" x2="846.0" y2="174.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="414.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">найменше додатне</text>
<text x="530.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Зелене — досяжне (усі парні). Порожнє — недосяжне: непарного з двох парних кроків не скласти.</text>
<text x="530.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Основа: сума й різниця двох комбінацій — знову комбінація тих самих a і b. Множина S замкнена.</text>
<rect x="50.0" y="296.0" width="300.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="200.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 1 · усе в S кратне d</text>
<text x="200.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">d — найменший додатний елемент.</tspan><tspan x="200.0" dy="17.4">Беремо t ∈ S, ділимо: r = t − q·d.</tspan><tspan x="200.0" dy="17.4">Це теж елемент S, але 0 ≤ r &lt; d.</tspan><tspan x="200.0" dy="17.4">Меншого додатного нема → r = 0.</tspan></text>
<rect x="380.0" y="296.0" width="300.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="530.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 2 · d — спільний дільник</text>
<text x="530.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Самі a = a·1 + b·0 та b = a·0 + b·1</tspan><tspan x="530.0" dy="17.4">лежать у S. За кроком 1 d ділить</tspan><tspan x="530.0" dy="17.4">кожен елемент S — отже, ділить</tspan><tspan x="530.0" dy="17.4">і a, і b.</tspan></text>
<rect x="710.0" y="296.0" width="300.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="860.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 3 · d — найбільший</text>
<text x="860.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Спільний дільник c ділить кожну</tspan><tspan x="860.0" dy="17.4">комбінацію a·x + b·y, а значить,</tspan><tspan x="860.0" dy="17.4">і сам d. Дільник не більший за те,</tspan><tspan x="860.0" dy="17.4">що ділить: c ≤ d.</tspan></text>
<rect x="180.0" y="460.0" width="700.0" height="60.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.5"/><text x="530.0" y="497.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">S = { a·x + b·y } = кратні НСД(a, b)</tspan></text>
<text x="530.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Звідси одразу: НСД подається як a·x + b·y, а рівняння a·x + b·y = c розв'язне ⟺ НСД ділить c.</text>
</svg>