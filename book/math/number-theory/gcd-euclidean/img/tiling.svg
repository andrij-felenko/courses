<rect x="406.0" y="386.0" width="66.0" height="66.0" rx="3" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="439.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3×3</text>
