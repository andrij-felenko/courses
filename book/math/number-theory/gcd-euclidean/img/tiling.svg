<text x="505.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3×3</text>
<line x1="76.0" y1="100.0" x2="538.0" y2="100.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="307.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">21</text>
<line x1="50.0" y1="122.0" x2="50.0" y2="452.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="30.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">15</text>
<text x="620.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="start" font-weight="700">21 = 1 · 15 + 6</text>
<text x="626.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">один квадрат 15×15 — лишається смуга 15×6</text>
<text x="620.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="start" font-weight="700">15 = 2 · 6 + 3</text>
<text x="626.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">два квадрати 6×6 — лишається смуга 6×3</text>
<text x="620.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="start" font-weight="700">6 = 2 · 3 + 0</text>
<text x="626.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">два квадрати 3×3 — і залишку немає</text>
<rect x="614.0" y="400.0" width="350.0" height="58.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.5"/><text x="789.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="789.0" dy="0.0">НСД(21, 15) = 3</tspan></text>
<text x="789.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">сторона останнього квадрата</text>
<text x="307.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Частки 1, 2, 2 — це кількості квадратів кожного розміру.</text>
