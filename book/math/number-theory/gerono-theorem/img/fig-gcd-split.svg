<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дихотомія парності для рівняння Жероно</text>
<rect x="10.0" y="10.0" width="780.0" height="40.0" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="400.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="700">Розклад x² - 1 = (x - 1)(x + 1) = yᵇ та дихотомія парності x</text>
<rect x="250.0" y="65.0" width="300.0" height="45.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="400.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="700">x² - 1 = (x - 1)(x + 1) = yᵇ</text>
<line x1="320.0" y1="110.0" x2="200.0" y2="150.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480.0" y1="110.0" x2="600.0" y2="150.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="150.0" width="340.0" height="170.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="200.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="700">Гілка 1: x — парне число</text>
<text x="200.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">НСД(x - 1, x + 1) = 1 (взаємно прості)</text>
<text x="200.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Обоє множників є b-ми степенями:</text>
<text x="200.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="700">x - 1 = uᵇ,   x + 1 = vᵇ</text>
<text x="200.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e03131" text-anchor="middle" font-weight="700">Різниця: vᵇ - uᵇ = 2</text>
<text x="200.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c92a2a" text-anchor="middle" font-weight="700">Для b ≥ 2: vᵇ - uᵇ ≥ 2ᵇ - 1ᵇ ≥ 3 &gt; 2 (суперечність!)</text>
<rect x="430.0" y="150.0" width="340.0" height="170.0" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="600.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">Гілка 2: x — непарне (x = 2k + 1)</text>
<text x="600.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">НСД(x - 1, x + 1) = 2</text>
<text x="600.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Перетворення: k(k + 1) = 2ᵇ⁻² · mᵇ</text>
<text x="600.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Оскільки НСД(k, k + 1) = 1:</text>
<text x="600.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Одне з чисел є степенем, друге — 2 · степінь</text>
<text x="600.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-weight="700">При b = 3 маємо єдиний розв'язок x = 3, y = 2</text>
</svg>