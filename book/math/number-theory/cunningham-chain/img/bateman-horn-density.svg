<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асимптотична щільність ланцюжків Каннінгема</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асимптотична щільність ланцюжків Каннінгема πₖ(x) ~ Cₖ · x / (ln x)ₖ</text>
<rect x="40.0" y="70.0" width="420.0" height="400.0" rx="6" fill="#f3e8fa" stroke="#7e22ce" stroke-width="1.5"/><text x="250.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ГІПОТЕЗА БЕЙТМАНА — ГОРНА ТА КЛАСТЕРИЗАЦІЯ:</tspan><tspan x="250.0" dy="11.7"></tspan><tspan x="250.0" dy="11.7">1. Експоненційне згасання:</tspan><tspan x="250.0" dy="11.7">   Кількість ланцюжків довжини k до межі x пропорційна x / (ln x)ᵏ.</tspan><tspan x="250.0" dy="11.7">   Кожний наступний крок k додає множник 1 / ln x ≈ 1 / 28 для x ≈ 10¹².</tspan><tspan x="250.0" dy="11.7"></tspan><tspan x="250.0" dy="11.7">2. Стала Констант-Множник Cₖ:</tspan><tspan x="250.0" dy="11.7">   Враховує модулярне відсіювання малими простими числами.</tspan><tspan x="250.0" dy="11.7">   C₁ ≈ 1 (Теорема про розподіл простих чисел)</tspan><tspan x="250.0" dy="11.7">   C₂ ≈ 1.32032 (Константа Близнюків / Жермен)</tspan><tspan x="250.0" dy="11.7">   C₃ ≈ 2.8582, C₄ ≈ 4.1511...</tspan><tspan x="250.0" dy="11.7"></tspan><tspan x="250.0" dy="11.7">3. Наслідок для рекордно довгих ланцюжків:</tspan><tspan x="250.0" dy="11.7">   Для k = 17 або k = 19 величина (ln x)ᵏ стає колосальною.</tspan><tspan x="250.0" dy="11.7">   Пошук вимагає чисел x &gt; 10¹⁸ та розподілених обчислень.</tspan></text>
<rect x="480.0" y="70.0" width="480.0" height="40.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="720.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Відносна рідкісність ланцюжків для x = 10¹² (ln x ≈ 27.6)</tspan></text>
<rect x="480.0" y="120.0" width="160.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">k = 1 (Прості числа)</tspan></text>
<rect x="645.0" y="120.0" width="165.0" height="42.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/><text x="727.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">π₁(x) ≈ x / ln x</tspan></text>
<rect x="815.0" y="120.0" width="145.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#6b7280" stroke-width="1.2"/><text x="887.5" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.5" dy="0.0">37 607 912 018</tspan></text>
<rect x="480.0" y="170.0" width="160.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">k = 2 (Пари Жермен)</tspan></text>
<rect x="645.0" y="170.0" width="165.0" height="42.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/><text x="727.5" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">π₂(x) ≈ C₂ · x / (ln x)²</tspan></text>
<rect x="815.0" y="170.0" width="145.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#6b7280" stroke-width="1.2"/><text x="887.5" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.5" dy="0.0">1 740 000 000</tspan></text>
