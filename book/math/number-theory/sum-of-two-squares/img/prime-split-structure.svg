<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація простих чисел за модулем 4</text>
<rect x="226.3" y="32.5" width="187.4" height="35.0" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text x="320.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Прості числа p ∈ ℕ</tspan></text>
<rect x="40.0" y="140.0" width="170.0" height="160.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="125.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">p = 2 (парне просте)</tspan><tspan x="125.0" dy="15.6"></tspan><tspan x="125.0" dy="15.6">2 = 1² + 1²</tspan><tspan x="125.0" dy="15.6"></tspan><tspan x="125.0" dy="15.6">Розгалужене в ℤ[i]:</tspan><tspan x="125.0" dy="15.6">2 = −i·(1 + i)²</tspan></text>
<line x1="260.0" y1="75.0" x2="125.0" y2="140.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="235.0" y="140.0" width="170.0" height="160.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="320.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">p ≡ 1 (mod 4)</tspan><tspan x="320.0" dy="15.6"></tspan><tspan x="320.0" dy="15.6">p = a² + b²</tspan><tspan x="320.0" dy="15.6">(Теорема Ферма)</tspan><tspan x="320.0" dy="15.6"></tspan><tspan x="320.0" dy="15.6">Розкладається в ℤ[i]:</tspan><tspan x="320.0" dy="15.6">p = (a + bi)(a − bi)</tspan></text>
<line x1="320.0" y1="75.0" x2="320.0" y2="140.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="140.0" width="170.0" height="160.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="515.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">p ≡ 3 (mod 4)</tspan><tspan x="515.0" dy="15.6"></tspan><tspan x="515.0" dy="15.6">p ≠ a² + b²</tspan><tspan x="515.0" dy="15.6">(Не є сумою квадратів)</tspan><tspan x="515.0" dy="15.6"></tspan><tspan x="515.0" dy="15.6">Інертне в ℤ[i]:</tspan><tspan x="515.0" dy="15.6">лишається простим</tspan></text>
<line x1="380.0" y1="75.0" x2="515.0" y2="140.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>