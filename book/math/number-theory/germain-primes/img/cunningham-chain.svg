<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюжок Каннінгема першого роду</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюжок Каннінгема першого роду завдовжки 5 (початок p₁ = 2)</text>
<rect x="40.0" y="120.0" width="135.0" height="75.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="107.5" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="107.5" dy="0.0">p₁ = 2</tspan><tspan x="107.5" dy="13.7">Просте (Жермен 1)</tspan></text>
<line x1="175.0" y1="157.5" x2="197.0" y2="157.5" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="197.0" y="120.0" width="135.0" height="75.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="264.5" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="264.5" dy="0.0">p₂ = 5</tspan><tspan x="264.5" dy="13.7">2(2)+1 = 5</tspan><tspan x="264.5" dy="13.7">Просте (Жермен 2)</tspan></text>
<line x1="332.0" y1="157.5" x2="354.0" y2="157.5" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="354.0" y="120.0" width="135.0" height="75.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="421.5" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="421.5" dy="0.0">p₃ = 11</tspan><tspan x="421.5" dy="13.7">2(5)+1 = 11</tspan><tspan x="421.5" dy="13.7">Просте (Жермен 3)</tspan></text>
<line x1="489.0" y1="157.5" x2="511.0" y2="157.5" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="511.0" y="120.0" width="135.0" height="75.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="578.5" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="578.5" dy="0.0">p₄ = 23</tspan><tspan x="578.5" dy="13.7">2(11)+1 = 23</tspan><tspan x="578.5" dy="13.7">Просте (Жермен 4)</tspan></text>
<line x1="646.0" y1="157.5" x2="668.0" y2="157.5" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="668.0" y="120.0" width="135.0" height="75.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="735.5" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.5" dy="0.0">p₅ = 47</tspan><tspan x="735.5" dy="13.7">2(23)+1 = 47</tspan><tspan x="735.5" dy="13.7">Просте (Жермен 5)</tspan></text>
<line x1="803.0" y1="157.5" x2="825.0" y2="157.5" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="825.0" y="120.0" width="135.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="892.5" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="892.5" dy="0.0">p₆ = 95</tspan><tspan x="892.5" dy="13.7">2(47)+1 = 95</tspan><tspan x="892.5" dy="13.7">5 · 19 (Складене!)</tspan></text>
<rect x="700.0" y="225.0" width="260.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="830.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">ОБРИВ ЛАНЦЮЖКА:</tspan><tspan x="830.0" dy="16.9">p₆ = 95 не є простим!</tspan></text>
<line x1="850.0" y1="200.0" x2="850.0" y2="223.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="340.0" width="920.0" height="75.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="500.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ланцюжок Каннінгема першого роду — це послідовність простих чисел (p₁, p₂, ..., pₖ), де pᵢ₊₁ = 2pᵢ + 1.</tspan><tspan x="500.0" dy="15.0">Кожен елемент ланцюжка (крім останнього) є простим числом Софі Жермен, а кожен елемент (крім першого) — безпечним простим числом.</tspan></text>
</svg>