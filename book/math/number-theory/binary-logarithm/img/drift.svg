<rect x="56.2" y="385.2" width="767.6" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">log₂10 = 3.3219…, а 10/3 = 3.3333… — розбіжність лише 0.34 %, тому 2¹⁰ = 1024 так спокусливо звати «тисячею».</tspan><tspan x="440.0" dy="15.6">Та похибка накопичується множенням: на йоті двійкова драбина уже на п'яту частину вища за десяткову.</tspan></text>
