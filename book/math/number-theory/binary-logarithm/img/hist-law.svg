<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="424" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон, який не розрізняє: Ac і log₂ проходять ту саму перевірку</text>
<rect x="0.0" y="0.0" width="900.0" height="424.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<rect x="98.0" y="60.0" width="320.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="258.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">ардхаччхеда Ac (2-адичний порядок)</tspan></text>
<rect x="482.0" y="60.0" width="320.0" height="34.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="642.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="642.0" dy="0.0">двійковий логарифм log₂</tspan></text>
<text x="450.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОДИН І ТОЙ САМИЙ ЗАКОН:   f(m · n)  =  f(m) + f(n)</text>
<text x="258.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Ac(12) = 2</text>
<text x="642.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">log₂12 = 3.5850</text>
<text x="258.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Ac(40) = 3</text>
<text x="642.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">log₂40 = 5.3219</text>
<text x="258.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ac(480) = 5 = 2 + 3   ✔</text>
<text x="642.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">log₂480 = 8.9069 = сума   ✔</text>
<line x1="64.0" y1="258.0" x2="836.0" y2="258.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="450.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">РОЗРІЗНЯЄ ЛИШЕ ПРЯМЕ ПИТАННЯ ПРО ЗНАЧЕННЯ:</text>
<text x="450.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">скільки це для сотні?</text>
<rect x="128.0" y="332.0" width="260.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="258.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">100 → 50 → 25  стоп       2</tspan></text>
<rect x="512.0" y="332.0" width="260.0" height="44.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="642.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="642.0" dy="0.0">log₂100 = 6.6439</tspan></text>
<rect x="121.9" y="370.8" width="656.1" height="34.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Виконаний закон не називає функцію: він їй не портрет, а лише прикмета, спільна з іншими.</tspan></text>
</svg>