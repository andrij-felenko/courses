<circle cx="230.0" cy="421.7" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="280.0" cy="455.0" r="4.5" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="367.5" y="457.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4x + 6y = 9</text>
<text x="600.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Чи проходить пряма через вузол?</text>
<text x="600.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start"><tspan x="600.0" dy="0.0">Зелена  2x + 3y = 12  нанизує вузли</tspan><tspan x="600.0" dy="20.2">(0, 4), (3, 2), (6, 0) — рівним кроком (3, −2).</tspan></text>
<text x="600.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start"><tspan x="600.0" dy="0.0">Червона  4x + 6y = 9  має ТОЙ САМИЙ нахил,</tspan><tspan x="600.0" dy="20.2">але зсунута: 4x + 6y завжди парне, а 9 —</tspan><tspan x="600.0" dy="20.2">непарне, тож вона ковзає між рядами вузлів.</tspan></text>
<rect x="600.0" y="300.0" width="410.0" height="64.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/><text x="805.0" y="337.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Цілі розв'язки є  ⟺  НСД(a, b) ділить c</tspan></text>
<text x="600.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="600.0" dy="0.0">Для 2, 3: НСД = 1 ділить 12 → вузли є.</tspan><tspan x="600.0" dy="20.2">Для 4, 6: НСД = 2 не ділить 9 → жодного.</tspan></text>
