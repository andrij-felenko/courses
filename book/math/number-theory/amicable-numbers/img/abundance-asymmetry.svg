<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 434" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="434" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія надлишковості та недостатності в дружній парі</text>
<text x="500.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія дружньої пари (220, 284) відносно межі досконалості</text>
<rect x="50.0" y="85.0" width="410.0" height="230.0" rx="8" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="255.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0"></tspan></text>
<text x="255.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">a = 220  (менше число)</text>
<text x="255.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Сума всіх дільників: σ(220) = 504</text>
<text x="255.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відношення збагачення: σ(220) / 220 = 2.2909 &gt; 2</text>
<text x="255.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Сума власних дільників s(220) = 284</text>
<rect x="80.0" y="235.0" width="350.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="255.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">НАДЛИШКОВЕ (abundant)</tspan><tspan x="255.0" dy="19.5">s(220) = 284 &gt; 220</tspan></text>
<line x1="500.0" y1="75.0" x2="500.0" y2="325.0" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,6"/>
<rect x="425.0" y="335.0" width="150.0" height="40.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Межа: σ(n)/n = 2</tspan><tspan x="500.0" dy="15.6">(досконале число)</tspan></text>
<rect x="540.0" y="85.0" width="410.0" height="230.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="745.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0"></tspan></text>
<text x="745.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">b = 284  (більше число)</text>
<text x="745.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Сума всіх дільників: σ(284) = 504</text>
<text x="745.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відношення збагачення: σ(284) / 284 = 1.7746 &lt; 2</text>
<text x="745.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Сума власних дільників s(284) = 220</text>
<rect x="570.0" y="235.0" width="350.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="745.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">НЕДОСТАТНЄ (deficient)</tspan><tspan x="745.0" dy="19.5">s(284) = 220 &lt; 284</tspan></text>
<rect x="50.0" y="382.0" width="900.0" height="32.0" rx="6" fill="#fffde6" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="402.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">У будь-якій дружній парі a &lt; b: менше число a завжди надлишкове, а більше b — завжди недостатнє</tspan></text>
</svg>