<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Траєкторії аліквотних послідовностей</text>
<text x="510.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Долі чисел під дією оператора s(n) = σ(n) − n</text>
<rect x="410.0" y="65.0" width="200.0" height="45.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="510.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Початкове число n</tspan></text>
<line x1="510.0" y1="110.0" x2="510.0" y2="150.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="155.0" width="210.0" height="240.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0"></tspan></text>
<text x="145.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Згасання до 1</text>
<text x="145.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">12 → 16 → 15</text>
<text x="145.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">→ 9 → 4 → 3</text>
<text x="145.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">→ 1 → 0</text>
<rect x="55.0" y="300.0" width="180.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="145.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Найпоширеніша доля:</tspan><tspan x="145.0" dy="12.3">послідовність обривається на 0</tspan></text>
<rect x="280.0" y="155.0" width="210.0" height="240.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="385.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0"></tspan></text>
<text x="385.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1-цикл (Досконале)</text>
<text x="385.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">6 ↺ 6</text>
<text x="385.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">s(6) = 6</text>
<rect x="295.0" y="300.0" width="180.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="385.0" y="337.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Нерухома точка:</tspan><tspan x="385.0" dy="11.7">число дорівнює сумі своїх дільників</tspan></text>
<rect x="520.0" y="155.0" width="220.0" height="240.0" rx="6" fill="#f3e8fa" stroke="#7e22ce" stroke-width="2.0"/><text x="630.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0"></tspan></text>
<text x="630.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="700">2-цикл (Дружні числа)</text>
<text x="630.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#7e22ce" text-anchor="middle" font-weight="700">220 ⇄ 284</text>
<text x="630.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">s(220)=284, s(284)=220</text>
<rect x="535.0" y="300.0" width="190.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="630.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Пара взаємного виклику:</tspan><tspan x="630.0" dy="13.7">два числа живлять одне одне</tspan></text>
<rect x="760.0" y="155.0" width="220.0" height="240.0" rx="6" fill="#fffde6" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0"></tspan></text>
<text x="870.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">k-цикл (Компанійські)</text>
<text x="870.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">12496 → 14288</text>
<text x="870.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">→ 15472 → 14536</text>
<text x="870.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">→ 14264 ↺ 12496</text>
<rect x="775.0" y="300.0" width="190.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="870.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Замкнене коло з k ≥ 3:</tspan><tspan x="870.0" dy="16.2">довші орбіти дільників</tspan></text>
<rect x="40.0" y="410.0" width="940.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="436.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Гіпотеза Каталана–Діксона: кожна аліквотна послідовність або завершується на 1, або заходить у 1-, 2- чи k-цикл</tspan></text>
</svg>