<text x="270.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Квадрат + × a</text>
<text x="270.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e7d46" text-anchor="middle">Степінь: 1·2 + 1 = 3</text>
