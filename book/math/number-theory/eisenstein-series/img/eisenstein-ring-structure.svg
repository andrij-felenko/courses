<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Структура кільця модулярних форм 𝕄*(SL(2,ℤ)) = ℂ[E₄, E₆]</text>
<rect x="30.0" y="60.0" width="355.0" height="200.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="207.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Фундаментальні твірні (Generators)</text>
<rect x="45.0" y="100.0" width="155.0" height="145.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="122.5" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="122.5" dy="0.0">E₄(τ)  (Вага 4)</tspan><tspan x="122.5" dy="11.7">E₄ = 1 + 240·∑ σ₃(n)·qⁿ</tspan><tspan x="122.5" dy="11.7">G₄(τ) = (π⁴ / 45)·E₄</tspan><tspan x="122.5" dy="11.7">Нуль у точці τ = e^{2πi/3}</tspan><tspan x="122.5" dy="11.7">простий нуль</tspan></text>
<rect x="215.0" y="100.0" width="155.0" height="145.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="292.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="292.5" dy="0.0">E₆(τ)  (Вага 6)</tspan><tspan x="292.5" dy="13.0">E₆ = 1 - 504·∑ σ₅(n)·qⁿ</tspan><tspan x="292.5" dy="13.0">G₆(τ) = (2π⁶ / 945)·E₆</tspan><tspan x="292.5" dy="13.0">Нуль у точці τ = i</tspan><tspan x="292.5" dy="13.0">простий нуль</tspan></text>
<rect x="415.0" y="60.0" width="355.0" height="200.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="592.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">Градуйоване кільце 𝕄₂ₖ = ℂ · E₄ᵃ E₆ᵇ</text>
<rect x="430.0" y="100.0" width="325.0" height="145.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="592.5" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Базиси модулярних форм за вагою 2k</tspan><tspan x="592.5" dy="14.3">● Вага 0:  ℂ (константи)</tspan><tspan x="592.5" dy="14.3">● Вага 4:  ℂ·E₄       ● Вага 6:  ℂ·E₆</tspan><tspan x="592.5" dy="14.3">● Вага 8:  ℂ·E₄²      ● Вага 10: ℂ·E₄·E₆</tspan><tspan x="592.5" dy="14.3">● Вага 12: ℂ·E₄³ ⊕ ℂ·E₆² = ℂ·E₁₂ ⊕ ℂ·Δ</tspan><tspan x="592.5" dy="14.3">● dim 𝕄₂ₖ = ⌊2k/12⌋ + (1 якщо 2k ≢ 2 mod 12)</tspan></text>
<line x1="207.0" y1="260.0" x2="207.0" y2="285.0" stroke="#3b82f6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="592.0" y1="260.0" x2="592.0" y2="285.0" stroke="#22c55e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="290.0" width="355.0" height="205.0" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="207.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#581c87" text-anchor="middle" font-weight="700">Параболічна форма Δ(τ) (Cusp Form)</text>
<rect x="45.0" y="325.0" width="325.0" height="155.0" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/><text x="207.5" y="363.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="207.5" dy="0.0">Модулярний дискримінант Δ(τ) (Вага 12)</tspan><tspan x="207.5" dy="14.3">Δ(τ) = (E₄³ - E₆²) / 1728</tspan><tspan x="207.5" dy="14.3">● Перший член q-розкладу: Δ(τ) = q + O(q²)</tspan><tspan x="207.5" dy="14.3">● Не має нулів у півплощині ℍ (лише в i∞).</tspan><tspan x="207.5" dy="14.3">● Твірний елемент простору параболічних форм 𝕊₁₂.</tspan><tspan x="207.5" dy="14.3">● Добуток Ейлера: Δ(τ) = q·∏_{n=1}^∞ (1 - qⁿ)²⁴</tspan><tspan x="207.5" dy="14.3">● Коефіцієнти: τ(n) — функція Рамануджана.</tspan></text>
<rect x="415.0" y="290.0" width="355.0" height="205.0" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="592.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c2d12" text-anchor="middle" font-weight="700">Арифметика та інваріанти еліптичних кривих</text>
<rect x="430.0" y="325.0" width="325.0" height="155.0" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/><text x="592.5" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">j-інваріант Клейна та рівняння Вейєрштрасса</tspan><tspan x="592.5" dy="11.7">j(τ) = 1728 · E₄³ / (E₄³ - E₆²) = E₄³ / Δ</tspan><tspan x="592.5" dy="11.7">● Безрозмірна інваріантна функція ваги 0.</tspan><tspan x="592.5" dy="11.7">● Рівняння еліптичної кривої E_τ: y² = 4x³ - g₂x - g₃</tspan><tspan x="592.5" dy="11.7">  де g₂ = 60·G₄(τ), g₃ = 140·G₆(τ).</tspan><tspan x="592.5" dy="11.7">● Дві криві E_τ₁ ≅ E_τ₂ ізоморфні ⇔ j(τ₁) = j(τ₂).</tspan><tspan x="592.5" dy="11.7">● Розклад: j(q) = 1/q + 744 + 196884·q + 21493760·q² + ...</tspan></text>
</svg>