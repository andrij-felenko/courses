<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для яких цілих катетів гіпотенуза теж ціла?</text>
<polygon points="140.0,400.0 324.0,400.0 140.0,262.0" fill="#e8eefc" stroke="#2457d6" stroke-width="2.5"/>
<rect x="140.0" y="384.0" width="16.0" height="16.0" rx="0" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="232.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">4</text>
<text x="116.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">3</text>
<text x="258.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">5</text>
<rect x="72.0" y="452.0" width="400.0" height="60.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/><text x="272.0" y="488.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="272.0" dy="0.0">3² + 4²  =  9 + 16  =  25  =  5²</tspan></text>
<text x="272.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">гіпотенуза лягла рівно на ціле</text>
