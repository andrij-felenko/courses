<text x="668.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="770.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">√2</text>
<rect x="560.0" y="452.0" width="380.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="750.0" y="488.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">1² + 1²  =  2 ,   √2 ≈ 1.4142…</tspan></text>
<text x="750.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-style="italic">гіпотенуза — нескінченний нецілий хвіст</text>
