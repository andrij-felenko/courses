<text x="690.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">перевірка:  (m²−n²)² + (2mn)²  =  (m²+n²)²</text>
