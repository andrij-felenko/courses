<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула Евкліда: з пари (m, n) — уся трійка</text>
<rect x="70.0" y="92.0" width="200.0" height="78.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="170.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">вхід</tspan><tspan x="170.0" dy="16.9">m &gt; n &gt; 0</tspan><tspan x="170.0" dy="16.9">взаємно прості</tspan><tspan x="170.0" dy="16.9">різної парності</tspan></text>
<line x1="276.0" y1="131.0" x2="356.0" y2="131.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="362.0" y="100.0" width="210.0" height="34.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="467.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="467.0" dy="0.0">a = m² − n²</tspan></text>
<rect x="362.0" y="144.0" width="210.0" height="34.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="467.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="467.0" dy="0.0">b = 2mn</tspan></text>
