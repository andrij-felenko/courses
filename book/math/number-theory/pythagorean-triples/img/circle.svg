<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трійки Піфагора — раціональні точки на колі</text>
<line x1="91.0" y1="350.0" x2="569.0" y2="350.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="330.0" y1="111.0" x2="330.0" y2="589.0" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="330.0" cy="350.0" r="205.0" fill="#fbfcfe" stroke="#2457d6" stroke-width="2.0"/>
<text x="555.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">x</text>
<text x="314.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">y</text>
<text x="480.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-style="italic">x² + y² = 1</text>
<circle cx="125.0" cy="350.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="119.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">(−1, 0)</text>
<text x="129.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">старт</text>
<line x1="125.0" y1="350.0" x2="479.2" y2="172.9" stroke="#27ae60" stroke-width="2.2"/>
<circle cx="453.0" cy="186.0" r="7.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.6"/>
<text x="523.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">(3/5, 4/5)</text>
<text x="523.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">трійка (3, 4, 5)</text>
<circle cx="408.8" cy="160.8" r="5.5" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="426.5" cy="169.1" r="5.5" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="312.8" y="154.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">(5/13, 12/13)</text>
<text x="396.5" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">(8/17, 15/17)</text>
<text x="281.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">нахил t = 1/2 = n/m</text>
<text x="690.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start"><tspan x="690.0" dy="0.0">Поділи a² + b² = c²  на  c²:</tspan><tspan x="690.0" dy="22.5">(a/c)² + (b/c)² = 1.</tspan></text>
<text x="690.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="690.0" dy="0.0">Кожна трійка — раціональна точка</tspan><tspan x="690.0" dy="20.2">на одиничному колі, і навпаки:</tspan><tspan x="690.0" dy="20.2">(3, 4, 5) ↔ (3/5, 4/5).</tspan></text>
<text x="690.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start"><tspan x="690.0" dy="0.0">Пряма з раціональним нахилом t = n/m</tspan><tspan x="690.0" dy="20.9">із точки (−1, 0) завжди влучає у ДРУГУ</tspan><tspan x="690.0" dy="20.9">раціональну точку кола — так з однієї</tspan><tspan x="690.0" dy="20.9">точки виводяться геть усі трійки.</tspan></text>
<rect x="690.0" y="452.0" width="320.0" height="60.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="850.0" y="477.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">x = (m²−n²)/(m²+n²)</tspan><tspan x="850.0" dy="18.2">y = 2mn/(m²+n²)</tspan></text>
<text x="690.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">повне виведення — у вставці про раціональні точки</text>
</svg>