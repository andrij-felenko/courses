<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Раціональні точки кола ≅ раціональні числа</text>
<line x1="125.0" y1="350.0" x2="575.0" y2="350.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="340.0" y1="52.0" x2="340.0" y2="555.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="563.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">x</text>
<text x="352.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">вісь параметра t</text>
<circle cx="340.0" cy="350.0" r="175.0" fill="#fbfcfe" stroke="#2457d6" stroke-width="2.0"/>
<text x="445.0" y="465.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-style="italic">x² + y² = 1</text>
<circle cx="165.0" cy="350.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<text x="161.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">N = (−1, 0)</text>
<circle cx="515.0" cy="350.0" r="4.5" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="521.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(1, 0)</text>
<line x1="165.0" y1="350.0" x2="340.0" y2="291.7" stroke="#27ae60" stroke-width="1.8"/>
<line x1="334.0" y1="291.7" x2="346.0" y2="291.7" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="328.0" y="295.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">t = 1/3</text>
<circle cx="480.0" cy="245.0" r="6.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/>
<text x="494.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">(4/5, 3/5)</text>
<line x1="165.0" y1="350.0" x2="340.0" y2="262.5" stroke="#27ae60" stroke-width="1.8"/>
<line x1="334.0" y1="262.5" x2="346.0" y2="262.5" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="328.0" y="266.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">t = 1/2</text>
<circle cx="445.0" cy="210.0" r="6.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/>
<text x="459.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">(3/5, 4/5)</text>
<line x1="165.0" y1="350.0" x2="340.0" y2="87.5" stroke="#27ae60" stroke-width="1.8"/>
<line x1="334.0" y1="87.5" x2="346.0" y2="87.5" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="328.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">t = 3/2</text>
<circle cx="272.7" cy="188.5" r="6.0" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/>
<text x="258.7" y="180.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">(−5/13, 12/13)</text>
<text x="662.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="662.0" dy="0.0">Промінь із N крізь точку кола</tspan><tspan x="662.0" dy="21.0">перетинає вісь y на висоті t —</tspan><tspan x="662.0" dy="21.0">це і є нахил хорди.</tspan></text>
<text x="662.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="662.0" dy="0.0">Раціональна висота t</tspan><tspan x="662.0" dy="21.0">  ↔  раціональна точка кола.</tspan><tspan x="662.0" dy="21.0">Тому їх рівно стільки,</tspan><tspan x="662.0" dy="21.0">скільки раціональних чисел.</tspan></text>
<rect x="662.0" y="372.0" width="372.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="848.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="848.0" dy="0.0">t = 0      ↔   (1, 0)</tspan><tspan x="848.0" dy="16.9">t → ∞    ↔   N = (−1, 0)</tspan><tspan x="848.0" dy="16.9">усі раціональні t</tspan><tspan x="848.0" dy="16.9">  ↔   усі раціональні точки кола</tspan></text>
</svg>