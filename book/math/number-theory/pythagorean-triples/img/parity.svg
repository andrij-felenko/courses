<rect x="84.0" y="262.0" width="430.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="299.0" y="288.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="299.0" dy="0.0">Квадрат ≡ 1 (непарне n)  або  ≡ 0 (парне n).</tspan><tspan x="299.0" dy="18.2">Ніколи не 2 і не 3.</tspan></text>
<text x="600.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Три випадки для катетів a, b</text>
<rect x="600.0" y="134.0" width="452.0" height="40.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="826.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">обидва парні</tspan></text>
<text x="608.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">спільний множник 2 → трійка не примітивна</text>
<rect x="600.0" y="230.0" width="452.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="826.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">обидва непарні</tspan></text>
<text x="608.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">a² + b² ≡ 1 + 1 = 2 (mod 4) — квадратом бути НЕ МОЖЕ</text>
<rect x="600.0" y="326.0" width="452.0" height="40.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="826.0" y="351.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">один парний, один непарний</tspan></text>
<text x="608.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">a² + b² ≡ 1 + 0 = 1 = c² — годиться, c непарне</text>
<rect x="84.0" y="512.0" width="968.0" height="56.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/><text x="568.0" y="545.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="568.0" dy="0.0">У примітивній трійці рівно ОДИН катет парний, другий катет і гіпотенуза — непарні.</tspan></text>
