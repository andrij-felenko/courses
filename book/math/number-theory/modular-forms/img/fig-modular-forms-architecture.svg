<svg xmlns="http://www.w3.org/2000/svg" viewBox="-62.1 -10 924.1 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-62.1" y="-10" width="924.1" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура модулярних форм</text>
<rect x="0.0" y="0.0" width="800.0" height="490.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Архітектура теорії модулярних форм та арифметичний міст</text>
<rect x="55.2" y="54.3" width="269.6" height="61.4" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="190.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1. Верхня півплощина ℍ та Решітки Λ</tspan><tspan x="190.0" dy="15.0">τ ∈ ℍ ⇔ решітка Λ = ℤ + ℤτ ⊂ ℂ</tspan><tspan x="190.0" dy="15.0">Дискретні симетрії групи SL(2,ℤ)</tspan></text>
<rect x="41.0" y="179.3" width="298.1" height="61.4" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="190.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">2. Простір модулярних форм M_k</tspan><tspan x="190.0" dy="15.0">f( (aτ+b)/(cτ+d) ) = (cτ+d)ᵏ f(τ)</tspan><tspan x="190.0" dy="15.0">Кільце M_* = ℂ[E₄, E₆], дискеримінант Δ</tspan></text>
<rect x="-8.9" y="309.3" width="397.9" height="61.4" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/><text x="190.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">3. Оператори Гекке T_p та Ейлерові добутки</tspan><tspan x="190.0" dy="15.0">T_p f = λ_p f ⇒ L(s, f) = ∏ (1 - a_p p⁻ˢ + pᵏ⁻¹⁻²ˢ)⁻¹</tspan><tspan x="190.0" dy="15.0">Зв'язок з рядами Діріхле</tspan></text>
<line x1="190.0" y1="125.0" x2="190.0" y2="170.0" stroke="#3b82f6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="250.0" x2="190.0" y2="295.0" stroke="#22c55e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="457.4" y="54.3" width="305.2" height="61.4" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="610.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">4. Діофантові рівняння та суми квадратів</tspan><tspan x="610.0" dy="15.0">θ(τ) = ∑ q^{n²} ⇒ θ(τ)ᵏ = ∑ r_k(n) qⁿ</tspan><tspan x="610.0" dy="15.0">Точні формули для кількості розв'язків</tspan></text>
<rect x="468.1" y="179.3" width="283.8" height="61.4" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="610.0" y="199.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">5. Еліптичні криві E/ℚ</tspan><tspan x="610.0" dy="15.0">y² = x³ + ax + b (дискримінант D ≠ 0)</tspan><tspan x="610.0" dy="15.0">Число точок #E(𝔽_p) = p + 1 - a_p</tspan></text>
<rect x="443.1" y="309.3" width="333.7" height="61.4" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="610.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">6. Велика теорема Ферма (FLT)</tspan><tspan x="610.0" dy="15.0">aⁿ + bⁿ = cⁿ ⇒ Крива Фрей y² = x(x-aⁿ)(x+bⁿ)</tspan><tspan x="610.0" dy="15.0">Зниження рівня Рібета: S₂(Γ₀(2)) = {0}</tspan></text>
<line x1="610.0" y1="250.0" x2="610.0" y2="295.0" stroke="#eab308" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="345.0" y1="210.0" x2="455.0" y2="210.0" stroke="#059669" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="455.0" y1="210.0" x2="345.0" y2="210.0" stroke="#059669" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="345.0" y="185.0" width="110.0" height="50.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2.0"/>
<text x="400.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">ТЕОРЕМА ПРО</text>
<text x="400.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">МОДУЛЯРНІСТЬ</text>
<line x1="345.0" y1="100.0" x2="455.0" y2="100.0" stroke="#f97316" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="345.0" y1="340.0" x2="455.0" y2="340.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="-52.1" y="429.2" width="904.1" height="31.5" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Фундаментальний результат: Кожна еліптична крива над ℚ є модулярною (Wiles et al.) — це поєднало аналіз і діофантову алгебру</tspan></text>
</svg>