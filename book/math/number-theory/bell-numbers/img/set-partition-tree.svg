<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбиття множини з 4 елементів на блоки</text>
<text x="420.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комбінаторне розбиття множини з n = 4 елементів: B₄ = 15</text>
<text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Класифікація розбиттів {1, 2, 3, 4} за кількістю блоків k (числа Стірлінга S(4, k))</text>
<rect x="40.0" y="100.0" width="175.0" height="50.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="127.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">k = 1 блок</text>
<text x="127.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">S(4,1) = 1</text>
<rect x="40.0" y="165.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="127.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1, 2, 3, 4}</text>
<rect x="235.0" y="100.0" width="175.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="322.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">k = 2 блоки</text>
<text x="322.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">S(4,2) = 7</text>
<rect x="235.0" y="165.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1} {2,3,4}</text>
<rect x="235.0" y="201.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{2} {1,3,4}</text>
<rect x="235.0" y="237.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{3} {1,2,4}</text>
<rect x="235.0" y="273.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{4} {1,2,3}</text>
<rect x="235.0" y="309.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1,2} {3,4}</text>
<rect x="235.0" y="345.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1,3} {2,4}</text>
<rect x="235.0" y="381.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="322.5" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1,4} {2,3}</text>
<rect x="430.0" y="100.0" width="175.0" height="50.0" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<text x="517.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">k = 3 блоки</text>
<text x="517.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">S(4,3) = 6</text>
<rect x="430.0" y="165.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="517.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1,2} {3} {4}</text>
<rect x="430.0" y="201.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="517.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1,3} {2} {4}</text>
<rect x="430.0" y="237.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="517.5" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1,4} {2} {3}</text>
<rect x="430.0" y="273.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="517.5" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{2,3} {1} {4}</text>
<rect x="430.0" y="309.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="517.5" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{2,4} {1} {3}</text>
<rect x="430.0" y="345.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="517.5" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{3,4} {1} {2}</text>
<rect x="625.0" y="100.0" width="175.0" height="50.0" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="712.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">k = 4 блоки</text>
<text x="712.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">S(4,4) = 1</text>
<rect x="625.0" y="165.0" width="175.0" height="30.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="712.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">{1} {2} {3} {4}</text>
<rect x="117.3" y="430.1" width="605.4" height="49.9" rx="6" fill="#fbfbfc" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Загальне число розбиттів дорівнює сумі за всіма можливими кількостями блоків k:</tspan><tspan x="420.0" dy="16.9">B₄ = S(4,1) + S(4,2) + S(4,3) + S(4,4) = 1 + 7 + 6 + 1 = 15 способів.</tspan></text>
</svg>