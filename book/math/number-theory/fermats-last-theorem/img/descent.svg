<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 662" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="662" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="292.1" y="27.8" width="295.7" height="60.5" rx="6" fill="#fdf4f3" stroke="#c0392b" stroke-width="2.0"/><text x="440.0" y="53.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">(x, y, z):   x⁴ + y⁴ = z²</tspan><tspan x="440.0" dy="19.5">z — найменше,   gcd(x, y) = 1</tspan></text>
<rect x="260.4" y="149.9" width="359.2" height="56.2" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="440.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">(x²)² + (y²)² = z²   —   примітивна трійка</tspan><tspan x="440.0" dy="18.2">x² = p² − q²,    y² = 2pq,    z = p² + q²</tspan></text>
<rect x="86.9" y="296.1" width="296.2" height="51.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="235.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">x² + q² = p²   —   знову трійка</tspan><tspan x="235.0" dy="16.9">x = m² − n²,   q = 2mn,   p = m² + n²</tspan></text>
<rect x="525.9" y="296.1" width="244.3" height="51.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="648.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">y² = 4·m·n·p,   попарно прості</tspan><tspan x="648.0" dy="16.9">⇒   m = a²,   n = b²,   p = c²</tspan></text>
<rect x="268.9" y="447.8" width="342.2" height="60.5" rx="6" fill="#f2faf4" stroke="#27ae60" stroke-width="2.0"/><text x="440.0" y="473.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">p = m² + n²   ⇒   c² = a⁴ + b⁴</tspan><tspan x="440.0" dy="19.5">(a, b, c):   a⁴ + b⁴ = c²,   c &lt; z</tspan></text>
<rect x="251.2" y="576.5" width="377.7" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="440.0" y="598.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="440.0" dy="0.0">z &gt; c &gt; c′ &gt; c″ &gt; …   у додатних цілих неможливо</tspan></text>
<line x1="440.0" y1="88.2" x2="440.0" y2="149.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="362.0" y1="206.1" x2="279.0" y2="296.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="518.0" y1="206.1" x2="604.0" y2="296.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="279.0" y1="347.9" x2="362.0" y2="447.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="604.0" y1="347.9" x2="518.0" y2="447.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="508.2" x2="440.0" y2="576.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>