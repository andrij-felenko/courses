<text x="356.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Піфагорійці</tspan><tspan x="356.0" dy="17.6">6 і 28 — образи довершеності</tspan></text>
