<text x="304.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">≈300 до н.е.</text>
<text x="356.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Евклід, «Начала» IX.36</tspan><tspan x="356.0" dy="17.6">правило 2^(p−1)(2ᵖ−1)</tspan></text>
