<text x="304.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1588</text>
<text x="356.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Катальді: 6-те й 7-те числа</tspan><tspan x="356.0" dy="17.6">→ закон «6,8,6,8» мертвий</tspan></text>
