<text x="356.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Нікомах: 4 числа</tspan><tspan x="356.0" dy="17.6">і два «закони» (обидва хибні)</tspan></text>
