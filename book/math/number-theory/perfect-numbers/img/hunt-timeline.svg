<text x="84.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="84.0" dy="0.0">у Європі —</tspan><tspan x="84.0" dy="16.2">≈1450 років</tspan><tspan x="84.0" dy="16.2">без нового</tspan><tspan x="84.0" dy="16.2">числа</tspan></text>
