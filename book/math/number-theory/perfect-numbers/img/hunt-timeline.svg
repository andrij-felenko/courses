<text x="304.0" y="571.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">1644</text>
<text x="356.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Мерсенн: список простих 2ᵖ−1</tspan><tspan x="356.0" dy="17.6">(з п'ятьма помилками)</tspan></text>
<circle cx="330.0" cy="630.0" r="7.5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="304.0" y="635.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">1772</text>
<text x="356.0" y="626.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Ойлер: 8-ме число; обернене</tspan><tspan x="356.0" dy="17.6">доведено — парний випадок закрито</tspan></text>
