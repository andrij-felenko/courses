<text x="356.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Ібн Фаллус (араб. світ)</tspan><tspan x="356.0" dy="17.6">таблиця: 7 правильних чисел</tspan></text>
