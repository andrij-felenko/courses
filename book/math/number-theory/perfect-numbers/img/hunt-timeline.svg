<text x="356.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="356.0" dy="0.0">Регіус друкує 5-те: 33 550 336</tspan><tspan x="356.0" dy="17.6">→ закон «n цифр» мертвий</tspan></text>
