<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сучасне полювання на досконале число (конвеєр GIMPS)</text>
<rect x="150.0" y="64.0" width="380.0" height="58.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">1 · Обрати простий показник p</tspan></text>
<line x1="340.0" y1="122.0" x2="340.0" y2="152.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="93.0" x2="556.0" y2="93.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3"/>
<rect x="560.0" y="72.0" width="348.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="734.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">p мусить бути простим — інакше 2ᵖ − 1 складене</tspan></text>
<rect x="150.0" y="152.0" width="380.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="340.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2 · Пробне ділення</tspan></text>
<line x1="340.0" y1="210.0" x2="340.0" y2="240.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="181.0" x2="556.0" y2="181.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3"/>
