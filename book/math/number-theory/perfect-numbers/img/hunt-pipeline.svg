<rect x="150.0" y="240.0" width="380.0" height="58.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.4"/><text x="340.0" y="272.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">3 · Тест Люка–Лемера / PRP: p − 2 піднесень квадрата mod Mₚ</tspan></text>
<line x1="340.0" y1="298.0" x2="340.0" y2="328.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="269.0" x2="556.0" y2="269.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3"/>
<rect x="560.0" y="248.0" width="348.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="734.0" y="273.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="734.0" dy="0.0">GPU · кожне піднесення — одне ШПФ</tspan></text>
<rect x="150.0" y="328.0" width="380.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="340.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">4 · Перевірка Гербіца під час рахунку</tspan></text>
<line x1="340.0" y1="386.0" x2="340.0" y2="416.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="357.0" x2="556.0" y2="357.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3"/>
<rect x="560.0" y="336.0" width="348.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="734.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">ловить апаратний збій просто на льоту</tspan></text>
<rect x="150.0" y="416.0" width="380.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="340.0" y="450.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">5 · Незалежна повторна перевірка</tspan></text>
<line x1="340.0" y1="474.0" x2="340.0" y2="504.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="445.0" x2="556.0" y2="445.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3"/>
<rect x="560.0" y="424.0" width="348.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="734.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">інше залізо й софт мусять підтвердити</tspan></text>
