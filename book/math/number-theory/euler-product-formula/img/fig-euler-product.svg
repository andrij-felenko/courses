<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 820 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="820" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тотожність та добуток Ейлера</text>
<rect x="0.0" y="0.0" width="800.0" height="400.0" rx="6" fill="#1e293b" stroke="#333333" stroke-width="1.5"/>
<text x="400.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="700">Тотожність та добуток Ейлера для Дзета-функції</text>
<text x="400.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle" font-weight="700">ζ(s) = ∑ (1 / nˢ) = ∏ (1 / (1 - p⁻ˢ))</text>
<rect x="60.0" y="120.0" width="300.0" height="220.0" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2.0"/>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#60a5fa" text-anchor="middle" font-weight="700">Дискретна сума (усі n ∈ ℕ)</text>
<text x="210.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">1 + 1/2ˢ + 1/3ˢ + 1/4ˢ + 1/5ˢ + ...</text>
<text x="210.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Сума за канонічним розкладом:</text>
<text x="210.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle">∑ (p₁ᵃ¹ · p₂ᵃ² ... pₖᵃᵏ)⁻ˢ</text>
<text x="400.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="36" fill="#38bdf8" text-anchor="middle" font-weight="700">=</text>
<rect x="440.0" y="120.0" width="300.0" height="220.0" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2.0"/>
<text x="590.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#34d399" text-anchor="middle" font-weight="700">Нескінченний добуток (p ∈ ℙ)</text>
<text x="590.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">(1 + 1/2ˢ + ...) · (1 + 1/3ˢ + ...)</text>
<text x="590.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Геометричні прогресії множників:</text>
<text x="590.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#10b981" text-anchor="middle" font-weight="700">∏ (1 / (1 - p⁻ˢ))</text>
</svg>