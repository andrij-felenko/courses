<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 610 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="610" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="91.6" y="27.0" width="416.9" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="55.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Extended Euclidean Algorithm: 3⁻¹ mod 7</tspan></text>
<rect x="83.1" y="128.0" width="133.7" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">7 = 2 × 3 + 1</tspan></text>
<rect x="267.2" y="128.0" width="165.7" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">1 = 1 × 7 - 2 × 3</tspan></text>
<line x1="220.0" y1="150.0" x2="280.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="279.1" y="208.9" width="141.7" height="62.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">-2 ≡ 5 (mod 7)</tspan><tspan x="350.0" dy="18.2">Inverse is 5</tspan></text>
<line x1="350.0" y1="180.0" x2="350.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>