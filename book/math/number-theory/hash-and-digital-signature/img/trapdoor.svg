<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однобічна дія з потаємним ходом: легко вперед, важко назад</text>
<rect x="40.0" y="60.0" width="300.0" height="70.0" rx="10" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.8"/>
<text x="190.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">p = 61,  q = 53</text>
<text x="190.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">два прості числа</text>
<line x1="340.0" y1="95.0" x2="430.0" y2="95.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="385.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">×  легко</text>
<rect x="485.0" y="78.0" width="150.0" height="34.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/><text x="560.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6d1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">n = 3233</tspan></text>
<line x1="430.0" y1="165.0" x2="340.0" y2="165.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="385.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">розкласти</text>
<text x="385.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">надважко</text>
<rect x="70.0" y="205.0" width="620.0" height="34.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/><text x="380.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Помножити — легко в один бік; розкласти велике n назад на множники — практично неможливо. Це і є «потаємний хід».</tspan></text>
