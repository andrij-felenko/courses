<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема роботи асиметричної криптосистеми RSA</text>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема роботи асиметричної криптосистеми RSA</text>
<rect x="40.0" y="85.0" width="270.0" height="355.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="175.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Генерація ключів</text>
<rect x="102.0" y="136.6" width="146.0" height="66.8" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="175.0" y="157.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Прості числа p, q</tspan><tspan x="175.0" dy="16.9">N = p · q</tspan><tspan x="175.0" dy="16.9">ϕ(N) = (p-1)(q-1)</tspan></text>
<rect x="56.2" y="226.6" width="237.6" height="66.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="175.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Відкритий ключ (Public Key)</tspan><tspan x="175.0" dy="16.9">K_pub = (N, e)</tspan><tspan x="175.0" dy="16.9">НСД(e, ϕ(N)) = 1</tspan></text>
<rect x="52.2" y="326.6" width="245.7" height="66.8" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.6"/><text x="175.0" y="347.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Приватний ключ (Private Key)</tspan><tspan x="175.0" dy="16.9">K_priv = (N, d)</tspan><tspan x="175.0" dy="16.9">d · e ≡ 1 (mod ϕ(N))</tspan></text>
<rect x="360.0" y="85.0" width="270.0" height="355.0" rx="8" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="495.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Зашифрування (Аліса)</text>
<rect x="414.6" y="145.1" width="160.8" height="49.9" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="495.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Повідомлення: m &lt; N</tspan><tspan x="495.0" dy="16.9">(відкритий текст)</tspan></text>
<rect x="390.3" y="224.6" width="209.4" height="70.8" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/><text x="495.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Обчислення шифротексту:</tspan><tspan x="495.0" dy="16.9">c = mᵉ mod N</tspan><tspan x="495.0" dy="16.9">з використанням (N, e)</tspan></text>
<rect x="425.7" y="335.1" width="138.6" height="49.9" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="495.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Шифротекст c</tspan><tspan x="495.0" dy="16.9">(непрозорі дані)</tspan></text>
<rect x="680.0" y="85.0" width="280.0" height="355.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="820.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Розшифрування (Боб)</text>
<rect x="732.2" y="153.5" width="175.6" height="33.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="820.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Отримано шифротекст c</tspan></text>
<rect x="719.3" y="224.6" width="201.3" height="70.8" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.6"/><text x="820.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Обернення піднесенням:</tspan><tspan x="820.0" dy="16.9">m = cᵈ mod N</tspan><tspan x="820.0" dy="16.9">з використанням (N, d)</tspan></text>
<rect x="713.3" y="335.1" width="213.4" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="820.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Відновлений текст m</tspan><tspan x="820.0" dy="16.9">(початкове повідомлення)</tspan></text>
<line x1="310.0" y1="260.0" x2="360.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="360.0" x2="680.0" y2="170.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="495.0" y1="205.0" x2="495.0" y2="225.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="495.0" y1="298.0" x2="495.0" y2="335.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="820.0" y1="195.0" x2="820.0" y2="225.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="820.0" y1="298.0" x2="820.0" y2="335.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>