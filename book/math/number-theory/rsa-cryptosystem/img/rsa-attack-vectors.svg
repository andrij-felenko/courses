<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектори атак на криптосистему RSA</text>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація векторів атак на криптосистему RSA</text>
<rect x="30.0" y="85.0" width="220.0" height="355.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Факторизація модуля N</text>
<rect x="59.9" y="198.9" width="160.2" height="132.2" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/><text x="140.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">• Алгоритм GNFS</tspan><tspan x="140.0" dy="15.0">  (квадратичне решето)</tspan><tspan x="140.0" dy="15.0">• Метод Ферма</tspan><tspan x="140.0" dy="15.0">  (якщо |p - q| мале)</tspan><tspan x="140.0" dy="15.0">• P-1 Полларда</tspan><tspan x="140.0" dy="15.0">  (якщо p-1 гладке)</tspan><tspan x="140.0" dy="15.0">• Квантовий Шор</tspan><tspan x="140.0" dy="15.0">  (поліноміальний час)</tspan></text>
<rect x="270.0" y="85.0" width="220.0" height="355.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">Малі показники (e, d)</text>
<rect x="283.5" y="198.9" width="193.0" height="132.2" rx="6" fill="#ffffff" stroke="#ffedd5" stroke-width="1.2"/><text x="380.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">• Атака Вінера</tspan><tspan x="380.0" dy="15.0">  (якщо d &lt; N^0.25)</tspan><tspan x="380.0" dy="15.0">• Атака Копперсміта</tspan><tspan x="380.0" dy="15.0">  (теорема про корені)</tspan><tspan x="380.0" dy="15.0">• Трансляція Гостада</tspan><tspan x="380.0" dy="15.0">  (мале e, k отримувачів)</tspan><tspan x="380.0" dy="15.0">• Атака спільного модуля</tspan><tspan x="380.0" dy="15.0">  (однакове N для багатьох)</tspan></text>
<rect x="510.0" y="85.0" width="220.0" height="355.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="620.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ca8a04" text-anchor="middle" font-weight="700">Оракули доповнення</text>
<rect x="530.1" y="198.9" width="179.9" height="132.2" rx="6" fill="#ffffff" stroke="#fef08a" stroke-width="1.2"/><text x="620.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">• Атака Блейхенбахера</tspan><tspan x="620.0" dy="15.0">  (PKCS#1 v1.5 oracle)</tspan><tspan x="620.0" dy="15.0">• Атака Мангера</tspan><tspan x="620.0" dy="15.0">  (помилки в OAEP)</tspan><tspan x="620.0" dy="15.0">• Небезпека сырого RSA</tspan><tspan x="620.0" dy="15.0">  без доповнення:</tspan><tspan x="620.0" dy="15.0">  мультиплікативність</tspan><tspan x="620.0" dy="15.0">  c₁ · c₂ = (m₁m₂)ᵉ mod N</tspan></text>
<rect x="750.0" y="85.0" width="220.0" height="355.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="860.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Побічні канали (Side-Channel)</text>
<rect x="763.5" y="206.4" width="193.0" height="117.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="860.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">• Часові атаки (Timing)</tspan><tspan x="860.0" dy="15.0">  (коригування Монтгомері)</tspan><tspan x="860.0" dy="15.0">• Аналіз потужності</tspan><tspan x="860.0" dy="15.0">  (SPA / DPA витоки)</tspan><tspan x="860.0" dy="15.0">• Помилки CRT (Bellcore)</tspan><tspan x="860.0" dy="15.0">  внесення збою у m_p</tspan><tspan x="860.0" dy="15.0">  дає НСД(m_err - m, N) = q</tspan></text>
</svg>