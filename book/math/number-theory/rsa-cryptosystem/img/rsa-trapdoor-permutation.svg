<rect x="274.1" y="285.6" width="411.9" height="48.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="306.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="480.0" dy="0.0">Обернення БЕЗ таємного входу d: обчислювально неможливо</tspan><tspan x="480.0" dy="16.2">Вимагає факторизації N = p · q (проблема обчислення d)</tspan></text>
<rect x="296.7" y="195.1" width="366.6" height="49.9" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/><text x="480.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">🔑 Таємний вхід (Trapdoor): d ≡ e⁻¹ mod ϕ(N)</tspan><tspan x="480.0" dy="16.9">Зі знанням d обернення легко: m = cᵈ mod N</tspan></text>
