<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одностороння функція з таємним входом RSA</text>
<text x="480.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одностороння функція з таємним входом (Trapdoor Permutation)</text>
<rect x="61.5" y="187.9" width="196.9" height="64.2" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/><text x="160.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Простір повідомлень</tspan><tspan x="160.0" dy="18.2">m ∈ ℤ_N</tspan></text>
<rect x="697.2" y="187.9" width="205.6" height="64.2" rx="6" fill="#fdeded" stroke="#c0392b" stroke-width="1.8"/><text x="800.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Простір шифротекстів</tspan><tspan x="800.0" dy="18.2">c ∈ ℤ_N</tspan></text>
