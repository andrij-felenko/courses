<rect x="314.4" y="115.0" width="331.2" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="480.0" dy="0.0">Прямий напрямок: легко для кожного</tspan><tspan x="480.0" dy="16.9">c = mᵉ mod N  (знаючи відкритий ключ e, N)</tspan></text>
