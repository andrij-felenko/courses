<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація діофантових рівнянь за степенем та геометрією</text>
<rect x="70.0" y="80.0" width="200.0" height="40.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="170.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Лінійні</text>
<rect x="70.0" y="125.0" width="200.0" height="30.0" rx="4" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.0"/>
<text x="170.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Степінь 1</text>
<rect x="70.0" y="160.0" width="200.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ax + by = c</tspan></text>
<rect x="70.0" y="245.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="170.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">НСД(a, b) ділить c</tspan></text>
<rect x="310.0" y="80.0" width="200.0" height="40.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="410.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Квадратичні</text>
<rect x="310.0" y="125.0" width="200.0" height="30.0" rx="4" fill="#e8eefc" stroke="#2457d6" stroke-width="1.0"/>
<text x="410.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Степінь 2</text>
<rect x="310.0" y="160.0" width="200.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">x² - dy² = 1 (Пелль)</tspan><tspan x="410.0" dy="18.2">x² + y² = z² (Піфагор)</tspan></text>
<rect x="310.0" y="245.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="410.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">Коніки, дискримінант,</tspan><tspan x="410.0" dy="16.8">принцип Гассе</tspan></text>
<rect x="550.0" y="80.0" width="200.0" height="40.0" rx="6" fill="#7b1fa2" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="650.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Кубічні / Еліптичні</text>
<rect x="550.0" y="125.0" width="200.0" height="30.0" rx="4" fill="#eef4ff" stroke="#7b1fa2" stroke-width="1.0"/>
<text x="650.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7b1fa2" text-anchor="middle" font-weight="700">Степінь 3</text>
<rect x="550.0" y="160.0" width="200.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="650.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">y² = x³ + ax + b</tspan></text>
<rect x="550.0" y="245.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="650.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">Група раціональних точок,</tspan><tspan x="650.0" dy="16.8">теорема Морделла-Вейля</tspan></text>
<rect x="790.0" y="80.0" width="200.0" height="40.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="890.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Вищі степені</text>
<rect x="790.0" y="125.0" width="200.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="890.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Степінь n ≥ 3</text>
<rect x="790.0" y="160.0" width="200.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="890.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">xⁿ + yⁿ = zⁿ (Ферма)</tspan></text>
<rect x="790.0" y="245.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="890.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="890.0" dy="0.0">Теорема Фальтінгса (g ≥ 2),</tspan><tspan x="890.0" dy="16.8">скінченність розв'язків</tspan></text>
<rect x="70.0" y="375.0" width="920.0" height="140.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="530.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">10-та проблема Гільберта та теорема Матіясевича (MRDP, 1970)</text>
<text x="530.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Не існує єдиного алгоритму, який визначає наявність цілих розв'язків для довільного діофантового рівняння.</tspan><tspan x="530.0" dy="19.5">Загальна задача алгоритмічно нерозв'язна (еквівалентна здатності емулювати будь-яку обчислювану функцію).</tspan></text>
</svg>