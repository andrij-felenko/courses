<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура підйому Девенпорта–Хассе для розширення 𝔽_qˢ / 𝔽_q</text>
<rect x="40.0" y="65.0" width="310.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="55.0" y="80.0" width="280.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="101.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">Базове поле 𝔽_q (характеристика p)</tspan></text>
<rect x="60.0" y="130.0" width="270.0" height="45.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="195.0" dy="0.0">Мультиплікативний характер:</tspan><tspan x="195.0" dy="13.0">χ : 𝔽_q* → ℂ*</tspan></text>
<rect x="60.0" y="190.0" width="270.0" height="45.0" rx="6" fill="#e0e7ff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle"><tspan x="195.0" dy="0.0">Адитивний характер:</tspan><tspan x="195.0" dy="13.0">ψ : 𝔽_q → ℂ*</tspan></text>
<rect x="60.0" y="255.0" width="270.0" height="55.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">Сума Гаусса в 𝔽_q:</tspan><tspan x="195.0" dy="13.0">g(χ, ψ) = ∑_{x ∈ 𝔽_q} χ(x) ψ(x)</tspan><tspan x="195.0" dy="13.0">Модуль: |g(χ, ψ)| = √q</tspan></text>
<rect x="60.0" y="325.0" width="270.0" height="40.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle"><tspan x="195.0" dy="0.0">Базовий степінь:</tspan><tspan x="195.0" dy="13.0">(g(χ, ψ))ˢ (піднесено до s)</tspan></text>
<rect x="410.0" y="65.0" width="310.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="425.0" y="80.0" width="280.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="101.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">Розширене поле 𝔽_qˢ (степінь s)</tspan></text>
<rect x="430.0" y="130.0" width="270.0" height="45.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="565.0" dy="0.0">Піднятий мультиплікативний характер:</tspan><tspan x="565.0" dy="13.0">χ' = χ ∘ Norm_{𝔽_qˢ/𝔽_q}</tspan></text>
<rect x="430.0" y="190.0" width="270.0" height="45.0" rx="6" fill="#e0e7ff" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle"><tspan x="565.0" dy="0.0">Піднятий адитивний характер:</tspan><tspan x="565.0" dy="13.0">ψ' = ψ ∘ Tr_{𝔽_qˢ/𝔽_q}</tspan></text>
<rect x="430.0" y="255.0" width="270.0" height="55.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">Піднята сума Гаусса в 𝔽_qˢ:</tspan><tspan x="565.0" dy="13.0">g(χ', ψ') = ∑_{y ∈ 𝔽_qˢ} χ'(y) ψ'(y)</tspan><tspan x="565.0" dy="13.0">Модуль: |g(χ', ψ')| = (√q)ˢ = qˢ/²</tspan></text>
<rect x="430.0" y="325.0" width="270.0" height="40.0" rx="6" fill="#fecdd3" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9f1239" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">Піднята сума через базову:</tspan><tspan x="565.0" dy="13.0">g(χ', ψ') = (-1)ˢ⁻¹ (g(χ, ψ))ˢ</tspan></text>
<line x1="430.0" y1="152.0" x2="330.0" y2="152.0" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="335.0" y="135.0" width="90.0" height="18.0" rx="6" fill="#eff6ff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="147.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle"><tspan x="380.0" dy="0.0">Norm_{𝔽_qˢ/𝔽_q}</tspan></text>
<line x1="430.0" y1="212.0" x2="330.0" y2="212.0" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="335.0" y="195.0" width="90.0" height="18.0" rx="6" fill="#eef2ff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="207.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle"><tspan x="380.0" dy="0.0">Tr_{𝔽_qˢ/𝔽_q}</tspan></text>
<line x1="330.0" y1="345.0" x2="430.0" y2="345.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="424.0" y1="340.0" x2="430.0" y2="345.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="424.0" y1="350.0" x2="430.0" y2="345.0" stroke="#dc2626" stroke-width="2.0"/>
<rect x="335.0" y="330.0" width="90.0" height="30.0" rx="6" fill="#ffe4e6" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="335.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9f1239" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Множник знаку:</tspan><tspan x="380.0" dy="11.7">(-1)ˢ⁻¹</tspan></text>
</svg>