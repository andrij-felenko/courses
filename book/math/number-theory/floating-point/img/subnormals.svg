<text x="460.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="460.0" dy="0.0">Найменше нормальне число (2^e min) не обривається проваллям у нуль: денормалі підхоплюють</tspan><tspan x="460.0" dy="16.2">ту саму сітку з кроком s і рівномірно доводять її аж до 0 — точність спадає плавно, а не стрибком.</tspan></text>
