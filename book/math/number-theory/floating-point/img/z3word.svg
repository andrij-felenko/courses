<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слово Z3 (1941): перша двійкова рухома кома в залізі</text>
<rect x="150.0" y="112.0" width="56.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="206.0" y="112.0" width="180.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<rect x="386.0" y="112.0" width="336.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<rect x="150.0" y="112.0" width="56.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="178.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">знак</tspan><tspan x="178.0" dy="15.6">1 біт</tspan></text>
<rect x="206.0" y="112.0" width="180.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="296.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="296.0" dy="0.0">порядок</tspan><tspan x="296.0" dy="16.9">7 біт</tspan></text>
<rect x="386.0" y="112.0" width="336.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="554.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="554.0" dy="0.0">мантиса</tspan><tspan x="554.0" dy="16.9">14 біт (збережених)</tspan></text>
<rect x="386.0" y="62.0" width="34.0" height="34.0" rx="5" fill="#fff8e6" stroke="#c0392b" stroke-width="1.6"/>
<text x="403.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1.</text>
<line x1="403.0" y1="98.0" x2="403.0" y2="110.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="432.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="432.0" dy="0.0">провідна 1 нормалізованої мантиси —</tspan><tspan x="432.0" dy="16.2">завжди 1, тому її не зберігають (фактично 15 біт)</tspan></text>
<text x="470.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">значення  =  ± 1.m₁m₂ … m₁₄ × 2ᵉ</tspan><tspan x="470.0" dy="18.2">нормалізовано: 1 ≤ 1.m &lt; 2 ;  порядок e від −64 до +63</tspan></text>
<rect x="150.4" y="277.6" width="255.1" height="48.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="278.0" y="298.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="278.0" dy="0.0">напівлогарифмічна форма</tspan><tspan x="278.0" dy="16.2">(Zuse: «halblogarithmische Form»)</tspan></text>
<rect x="508.4" y="277.6" width="319.2" height="48.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="668.0" y="298.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="668.0" dy="0.0">окремі значення для ±∞ та невизначеності —</tspan><tspan x="668.0" dy="16.2">винятки, що повернуться в IEEE 754</tspan></text>
<text x="470.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Прихована одиниця й особливі значення були вже тут — стандарт закріпить їх лише за 44 роки.</text>
</svg>