<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл власних значень Фробеніуса α_i на колі |α| = √q</text>
<line x1="70.0" y1="200.0" x2="370.0" y2="200.0" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="220.0" y1="60.0" x2="220.0" y2="340.0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="375.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Re</text>
<text x="210.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Im</text>
<circle cx="220.0" cy="200.0" r="110.0" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0" stroke-dasharray="5,3"/>
<text x="315.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">|α| = √q</text>
<line x1="220.0" y1="200.0" x2="297.8" y2="122.2" stroke="#2563eb" stroke-width="1.5"/>
<line x1="220.0" y1="200.0" x2="297.8" y2="277.8" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="297.8" cy="122.2" r="6.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
<circle cx="297.8" cy="277.8" r="6.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="315.8" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">α₁ = √q · e^{iθ}</text>
<text x="315.8" y="282.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">α₂ = ᾱ₁ = √q · e^{-iθ}</text>
<circle cx="330.0" cy="200.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="110.0" cy="200.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="330.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">+√q</text>
<text x="103.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">-√q</text>
<line x1="297.8" y1="122.2" x2="297.8" y2="200.0" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
<circle cx="297.8" cy="200.0" r="4.0" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
<text x="350.8" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">a/2 = Re(α₁)</text>
<rect x="430.0" y="50.0" width="280.0" height="300.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="445.0" y="65.0" width="250.0" height="32.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="84.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Властивості нулів P(t)</tspan></text>
<rect x="445.0" y="110.0" width="250.0" height="48.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">1. Гіпотеза Рімана:</tspan><tspan x="570.0" dy="11.7">|α_i| = √q для i = 1, ..., 2g</tspan><tspan x="570.0" dy="11.7">Нулі Z(s) мають Re(s) = 1/2</tspan></text>
<rect x="445.0" y="170.0" width="250.0" height="48.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle"><tspan x="570.0" dy="0.0">2. Спряження та дуальність:</tspan><tspan x="570.0" dy="11.7">ᾱ_i = q / α_i</tspan><tspan x="570.0" dy="11.7">Пари (α_i, q/α_i) формують P(t)</tspan></text>
<rect x="445.0" y="230.0" width="250.0" height="52.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle"><tspan x="570.0" dy="0.0">3. Слід та Дискримінант (g=1):</tspan><tspan x="570.0" dy="11.7">α₁ + α₂ = a = q + 1 - N₁</tspan><tspan x="570.0" dy="11.7">α₁·α₂ = q</tspan><tspan x="570.0" dy="11.7">Δ = a² - 4q ≤ 0 (уявні корені)</tspan></text>
<rect x="445.0" y="292.0" width="250.0" height="45.0" rx="6" fill="#ffe4e6" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="311.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9f1239" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">4. Формула для N_n:</tspan><tspan x="570.0" dy="11.7">N_n = qⁿ + 1 - (α₁ⁿ + α₂ⁿ)</tspan></text>
</svg>