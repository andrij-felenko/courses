<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один крок тесту Люка–Лемера: квадрат подвоює довжину, згортка стискає назад</text>
<rect x="290.0" y="74.0" width="300.0" height="48.0" rx="6" fill="#e6f6ec" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">sₖ  —  p бітів</tspan></text>
<text x="440.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">n = ⌈p/32⌉ слів по 32 біти</text>
<line x1="440.0" y1="146.0" x2="440.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="466.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">піднести до квадрата</text>
<rect x="140.0" y="200.0" width="600.0" height="48.0" rx="6" fill="#fbeceb" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="229.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">sₖ²  —  2p бітів</tspan></text>
<text x="440.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">2n слів · єдина по-справжньому дорога дія</text>
<line x1="440.0" y1="272.0" x2="440.0" y2="322.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="466.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">згорнути:  верх + низ  (2ᵖ ≡ 1)</text>
<rect x="290.0" y="326.0" width="300.0" height="48.0" rx="6" fill="#eef3fc" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="355.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">остача  —  p бітів</tspan></text>
<text x="440.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">самі додавання · жодного ділення</text>
<line x1="440.0" y1="398.0" x2="440.0" y2="448.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="466.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">− 2  (з поправкою, коли остача 0 чи 1)</text>
<rect x="290.0" y="452.0" width="300.0" height="48.0" rx="6" fill="#e6f6ec" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="481.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">sₖ₊₁  —  p бітів</tspan></text>
<text x="440.0" y="517.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">готове до наступного з p − 2 кроків</text>
<rect x="664.1" y="324.6" width="151.8" height="48.8" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">остача = Mₚ?</tspan><tspan x="740.0" dy="16.2">(усі одиниці) → 0</tspan></text>
</svg>