<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Закон Літтла на всіх рівнях обчислювальної ієрархії</text>
<rect x="30.0" y="55.0" width="400.0" height="170.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="230.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">1. Веб-сервери та пули потоків</text>
<rect x="51.9" y="112.0" width="356.3" height="82.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="230.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• Формула: Concurrent_Requests = Throughput · Latency</tspan><tspan x="230.0" dy="13.0">• Приклад: 10 000 req/s при Latency = 50 ms (0.05 s)</tspan><tspan x="230.0" dy="13.0">• Конкурентність: L = 10 000 · 0.05 = 500 in-flight запитів</tspan><tspan x="230.0" dy="13.0">• Висновок: Пул з'єднань та файлові дескриптори</tspan><tspan x="230.0" dy="13.0">  мусять вміщувати щонайменше 500 одночасних слотів.</tspan></text>
<rect x="450.0" y="55.0" width="400.0" height="170.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="650.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">2. Мережевий стек: TCP Bandwidth-Delay Product</text>
<rect x="497.5" y="112.0" width="305.0" height="82.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="650.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">• Формула: In_Flight_Bytes = Bandwidth · RTT (BDP)</tspan><tspan x="650.0" dy="13.0">• Приклад: 10 Gbit/s канал, RTT = 40 ms (0.04 s)</tspan><tspan x="650.0" dy="13.0">• Буфер у польоті: L = 1.25 GB/s · 0.04 s = 50 MB</tspan><tspan x="650.0" dy="13.0">• Висновок: TCP Window Size мусить бути ≥ 50 MB,</tspan><tspan x="650.0" dy="13.0">  інакше канал простоюватиме в очікуванні ACK.</tspan></text>
<rect x="30.0" y="245.0" width="400.0" height="170.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="230.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700">3. Процесори: Буфер перевпорядкування (ROB)</text>
<rect x="54.7" y="302.0" width="350.6" height="82.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="230.0" y="320.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• Формула: In_Flight_Instructions = IPC · Memory_Latency</tspan><tspan x="230.0" dy="13.0">• Приклад: IPC = 4 інструкції/такт, промах L3 = 200 тактів</tspan><tspan x="230.0" dy="13.0">• Вікно виконання: L = 4 · 200 = 800 інструкцій</tspan><tspan x="230.0" dy="13.0">• Висновок: Щоб приховати затримку звернення до RAM,</tspan><tspan x="230.0" dy="13.0">  процесорний Out-of-Order ROB мусить мати сотні слотів.</tspan></text>
<rect x="450.0" y="245.0" width="400.0" height="170.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="650.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">4. Накопичувачі: Глибина черги NVMe (Queue Depth)</text>
<rect x="460.5" y="302.0" width="379.1" height="82.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="650.0" y="320.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">• Формула: Queue_Depth = IOPS · Storage_Latency</tspan><tspan x="650.0" dy="13.0">• Приклад: NVMe видає 500 000 IOPS при затримці 0.2 ms</tspan><tspan x="650.0" dy="13.0">• Глибина черги: L = 500 000 · 0.0002 s = 100 команд</tspan><tspan x="650.0" dy="13.0">• Висновок: Щоб утилізувати всі паралельні канали флеш-пам'яті,</tspan><tspan x="650.0" dy="13.0">  драйвер мусить підтримувати глибину черги QD ≥ 100.</tspan></text>
</svg>