<rect x="563.3" y="129.4" width="283.3" height="231.2" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="705.0" y="148.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">1. Закон Літтла (L = λ · W):</tspan><tspan x="705.0" dy="14.3">• Лінійно пов'язує СЕРЕДНІ значення.</tspan><tspan x="705.0" dy="14.3">• Якщо затримка W виросла в 10 разів,</tspan><tspan x="705.0" dy="14.3">  кількість заявок L виросте рівно в 10 р.</tspan><tspan x="705.0" dy="14.3"></tspan><tspan x="705.0" dy="14.3">2. Формула М/М/1 (W = 1 / (μ - λ)):</tspan><tspan x="705.0" dy="14.3">• Пояснює, ЧОМУ саме затримка W росте.</tspan><tspan x="705.0" dy="14.3">• При ρ → 1 знаменник (1 - ρ) прямує до 0.</tspan><tspan x="705.0" dy="14.3">• Стохастичні сплески не встигають</tspan><tspan x="705.0" dy="14.3">  розсмоктуватися між надходженнями.</tspan><tspan x="705.0" dy="14.3"></tspan><tspan x="705.0" dy="14.3">Практичне правило архітектури:</tspan><tspan x="705.0" dy="14.3">Сервери розраховують на ρ ≤ 0.7..0.75.</tspan><tspan x="705.0" dy="14.3">Робота при ρ &gt; 0.85 гарантує черговий</tspan><tspan x="705.0" dy="14.3">колапс при найменшому сплеску трафіку.</tspan></text>
</svg>