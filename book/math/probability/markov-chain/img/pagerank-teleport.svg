<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Демпфування робить ланцюг вебу ергодичним</text>
<text x="410.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Із кожної сторінки — або за посиланням, або стрибок навмання</text>
<rect x="94.6" y="89.9" width="110.8" height="56.2" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Звичайна</tspan><tspan x="150.0" dy="18.2">сторінка i</tspan></text>
<rect x="481.3" y="70.6" width="157.4" height="50.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">випадкове посилання</tspan><tspan x="560.0" dy="16.2">зі сторінки i</tspan></text>
<rect x="481.3" y="164.6" width="157.4" height="50.8" rx="6" fill="#fdf3e7" stroke="#d98a00" stroke-width="1.5"/><text x="560.0" y="186.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">будь-яка з усіх N</tspan><tspan x="560.0" dy="16.2">сторінок (телепорт)</tspan></text>
<line x1="205.4" y1="110.0" x2="479.3" y2="96.0" stroke="#5b6472" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="308.4" y="71.8" width="70.0" height="20.5" rx="4" fill="#ffffff" stroke="#d7dbe0" stroke-width="0.8"/><text x="343.4" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="343.4" dy="0.0">d = 0.85</tspan></text>
<line x1="205.4" y1="128.0" x2="479.3" y2="186.0" stroke="#8a93a0" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="292.9" y="165.8" width="101.0" height="20.5" rx="4" fill="#ffffff" stroke="#d7dbe0" stroke-width="0.8"/><text x="343.4" y="180.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="700"><tspan x="343.4" dy="0.0">1 − d = 0.15</tspan></text>
<rect x="90.3" y="271.9" width="119.5" height="56.2" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Тупик</tspan><tspan x="150.0" dy="18.2">(0 виходів)</tspan></text>
<line x1="209.7" y1="300.0" x2="479.3" y2="214.0" stroke="#8a93a0" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="295.0" y="257.8" width="101.0" height="20.5" rx="4" fill="#ffffff" stroke="#d7dbe0" stroke-width="0.8"/><text x="345.5" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="345.5" dy="0.0">завжди (1.0)</tspan></text>
<text x="150.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нема куди йти за посиланням</text>
<rect x="70.0" y="374.0" width="680.0" height="58.0" rx="10" fill="#f7f9fc" stroke="#dfe3e8" stroke-width="1.2"/>
<text x="410.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">G = d · S′ + (1 − d) · (1/N) · J</text>
<text x="410.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">S′ — посилання, нормовані по рядку (рядки-тупики замінено на 1/N);  J — усі одиниці.  Кожен рядок G → сума 1: незвідна й аперіодична.</text>
</svg>