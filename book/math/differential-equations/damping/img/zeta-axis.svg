<rect x="90.0" y="122.0" width="309.1" height="26.0" rx="0" fill="#fbecec" stroke="none" stroke-width="0.0"/>
<rect x="399.1" y="122.0" width="370.9" height="26.0" rx="0" fill="#eef6ef" stroke="none" stroke-width="0.0"/>
<text x="244.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ζ &lt; 1  недогасований (дзвенить)</text>
<text x="584.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ζ &gt; 1  перегасований</text>
<rect x="548.0" y="52.0" width="250.0" height="44.0" rx="8" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.3"/>
<text x="673.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ζ — коефіцієнт демпфування</text>
<text x="673.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Q — добротність = 1/(2ζ)</text>
<line x1="90.0" y1="144.0" x2="90.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="90.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
<text x="90.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">∞</text>
<line x1="151.8" y1="144.0" x2="151.8" y2="156.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="151.8" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">0.2</text>
<text x="151.8" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">2.5</text>
<line x1="244.5" y1="144.0" x2="244.5" y2="156.0" stroke="#c0392b" stroke-width="2.2"/>
<text x="244.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">0.5</text>
<text x="244.5" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">1.0</text>
<line x1="308.5" y1="144.0" x2="308.5" y2="156.0" stroke="#2457d6" stroke-width="2.2"/>
<text x="308.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">0.707</text>
<text x="308.5" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">0.71</text>
<line x1="399.1" y1="144.0" x2="399.1" y2="156.0" stroke="#1a1a1a" stroke-width="2.2"/>
