<text x="399.1" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0.5</text>
<line x1="708.2" y1="144.0" x2="708.2" y2="156.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="708.2" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">2</text>
<text x="708.2" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">0.25</text>
<text x="86.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">Q:</text>
<circle cx="399.1" cy="150.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="399.1" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">↑ критичне: межа дзвону (ζ = 1, Q = 0.5)</text>
<text x="410.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">ζ = 1/√2 ≈ 0.707  →  Q ≈ 0.71: «максимально пласка» межа частотної характеристики</text>
<rect x="60.0" y="288.0" width="700.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.4"/><text x="410.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ζ = 1 / (2Q)          Q = 1 / (2ζ)</tspan></text>
</svg>