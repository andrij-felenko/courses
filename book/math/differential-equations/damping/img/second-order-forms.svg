<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне рівняння другого порядку — кілька втілень</text>
<rect x="262.1" y="57.0" width="295.8" height="46.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/><text x="410.0" y="86.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">x¨ + 2ζω₀·x˙ + ω₀²·x = 0</tspan></text>
<text x="410.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ω₀ = √(k/m) — власна частота     ·     ζ = c / (2√(mk)) — частка критичного демпфування</text>
