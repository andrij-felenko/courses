<line x1="292.0" y1="462.0" x2="236.0" y2="420.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,3"/>
<rect x="556.0" y="92.0" width="322.0" height="292.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.7"/><text x="717.0" y="132.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="717.0" dy="0.0">F — основа нормалі на еліпсоїді</tspan><tspan x="717.0" dy="16.9">P — задана точка, h уздовж нормалі</tspan><tspan x="717.0" dy="16.9">C — центр кривини меридіана:</tspan><tspan x="717.0" dy="16.9">C = ( e²a·cos³β,  −e′²b·sin³β )</tspan><tspan x="717.0" dy="16.9">e²a = 42 698 м,  e′²b = 42 841 м</tspan><tspan x="717.0" dy="16.9"></tspan><tspan x="717.0" dy="16.9">C лежить НА нормалі, тому</tspan><tspan x="717.0" dy="16.9">tan φ = (z + e′²b·sin³β)</tspan><tspan x="717.0" dy="16.9">            ⁄ (p − e²a·cos³β)</tspan><tspan x="717.0" dy="16.9">— рівність точна, не наближена</tspan><tspan x="717.0" dy="16.9"></tspan><tspan x="717.0" dy="16.9">похибка в β совгає C уздовж тієї</tspan><tspan x="717.0" dy="16.9">самої нормалі: напрям CP не</tspan><tspan x="717.0" dy="16.9">міняється в першому порядку</tspan></text>
