<rect x="596.0" y="92.0" width="280.0" height="306.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.7"/><text x="736.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="736.0" dy="0.0">зелена крива — еволюта,</tspan><tspan x="736.0" dy="16.2">сірий пунктир — еліпс ρ = 0:</tspan><tspan x="736.0" dy="16.2">p² + (1−e²)z² = (e²a)²</tspan><tspan x="736.0" dy="16.2"></tspan><tspan x="736.0" dy="16.2">у справжніх числах його півосі</tspan><tspan x="736.0" dy="16.2">42 698 м і 42 841 м — тобто вся</tspan><tspan x="736.0" dy="16.2">область умістилася б у коло</tspan><tspan x="736.0" dy="16.2">радіусом 43 км навколо центра</tspan><tspan x="736.0" dy="16.2">Землі (h ≈ −6 370 км)</tspan><tspan x="736.0" dy="16.2"></tspan><tspan x="736.0" dy="16.2">усередині: чотири нормалі,</tspan><tspan x="736.0" dy="16.2">чотири «широти», жодна не</tspan><tspan x="736.0" dy="16.2">краща за інші — задача не має</tspan><tspan x="736.0" dy="16.2">єдиного розв'язку, і кожен</tspan><tspan x="736.0" dy="16.2">метод віддає свою гілку</tspan></text>
