<text x="484.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">√G·dθ</text>
<text x="575.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">ds² = dr² + G(r,θ)·dθ²</text>
<text x="575.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="575.0" dy="0.0">r — довжина вздовж променя,</tspan><tspan x="575.0" dy="18.2">тож коефіцієнт при dr² дорівнює 1.</tspan></text>
<text x="575.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="575.0" dy="0.0">Промінь перетинає коло під прямим</tspan><tspan x="575.0" dy="18.2">кутом (лема Гауса) — мішаного члена</tspan><tspan x="575.0" dy="18.2">dr·dθ немає, тому F = 0.</tspan></text>
<text x="575.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="575.0" dy="0.0">√G·dθ — ширина віяла на відстані r.</tspan><tspan x="575.0" dy="18.2">Біля p поверхня майже пласка, тож</tspan><tspan x="575.0" dy="18.2">√G → 0  і  (√G)′ → 1  при  r → 0.</tspan></text>
