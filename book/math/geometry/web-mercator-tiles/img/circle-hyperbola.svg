<rect x="100.0" y="492.0" width="700.0" height="78.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="518.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">sec φ = cosh y      tan φ = sinh y      sin φ = tanh y      cos φ = sech y</tspan><tspan x="450.0" dy="16.9">однакові кольори — однакові довжини: пара чисел на обох панелях та сама</tspan><tspan x="450.0" dy="16.9">y = ∫ sec φ dφ        φ = gd(y) = 2·arctan(eʸ) − π/2</tspan></text>
