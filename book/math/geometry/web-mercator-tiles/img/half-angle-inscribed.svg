<rect x="515.0" y="100.0" width="285.0" height="280.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.5"/><text x="657.5" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="657.5" dy="0.0">P на колі під кутом φ,</tspan><tspan x="657.5" dy="16.9">A — нижня точка кола.</tspan><tspan x="657.5" dy="16.9"></tspan><tspan x="657.5" dy="16.9">∠EOP = φ — центральний,</tspan><tspan x="657.5" dy="16.9">∠EAP = φ/2 — вписаний.</tspan><tspan x="657.5" dy="16.9"></tspan><tspan x="657.5" dy="16.9">|OA| = |OE| і OA ⊥ OE,</tspan><tspan x="657.5" dy="16.9">тому AE іде під 45°,</tspan><tspan x="657.5" dy="16.9">а AP — під 45° + φ/2.</tspan><tspan x="657.5" dy="16.9"></tspan><tspan x="657.5" dy="16.9">Катети: AF = cos φ,</tspan><tspan x="657.5" dy="16.9">FP = 1 + sin φ.</tspan><tspan x="657.5" dy="16.9"></tspan><tspan x="657.5" dy="16.9">tan(45° + φ/2) =</tspan><tspan x="657.5" dy="16.9">= (1 + sin φ)/cos φ</tspan></text>
</svg>