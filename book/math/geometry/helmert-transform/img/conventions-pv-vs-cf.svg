<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві геодезичні конвенції: поворот вектора проти повороту осей</text>
<rect x="20.0" y="55.0" width="385.0" height="360.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="212.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Position Vector / Вектор положення</text>
<text x="212.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">EPSG: 9606 (IERS, ISO 19111, активний поворот)</text>
<line x1="150.0" y1="240.0" x2="310.0" y2="240.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">X</text>
<line x1="150.0" y1="240.0" x2="150.0" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="138.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y</text>
<line x1="150.0" y1="240.0" x2="249.7" y2="193.5" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="249.7" cy="193.5" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="264.7" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">P (початкова)</text>
<line x1="150.0" y1="240.0" x2="196.5" y2="140.3" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="196.5" cy="140.3" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="186.5" y="128.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">P' (повернута)</text>
<text x="215.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="middle" font-weight="700">+θ (проти стрілки)</text>
<rect x="35.0" y="310.0" width="355.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="212.5" y="337.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Осі координат нерухомі.</tspan><tspan x="212.5" dy="14.3">Точка P повертається в системі координат.</tspan><tspan x="212.5" dy="14.3">Матриця для малих кутів:</tspan><tspan x="212.5" dy="14.3">R_pv = I + Ω  [позитивні знаки поворотів]</tspan></text>
<rect x="435.0" y="55.0" width="385.0" height="360.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/>
<text x="627.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Coordinate Frame / Осі координат</text>
<text x="627.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">EPSG: 9607 (Bursa-Wolf, пасивний поворот)</text>
<line x1="565.0" y1="240.0" x2="715.0" y2="240.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="725.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">X</text>
<line x1="565.0" y1="240.0" x2="565.0" y2="130.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="565.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Y</text>
<line x1="565.0" y1="240.0" x2="700.9" y2="303.4" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">X'</text>
<line x1="565.0" y1="240.0" x2="518.5" y2="140.3" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="503.5" y="140.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Y'</text>
<circle cx="650.0" cy="165.0" r="5.0" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
<text x="700.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">Точка P нерухома</text>
<rect x="450.0" y="310.0" width="355.0" height="90.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="627.5" y="337.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Точка в просторі нерухома.</tspan><tspan x="627.5" dy="14.3">Повертається сама рамка (осі координат).</tspan><tspan x="627.5" dy="14.3">Матриця для малих кутів:</tspan><tspan x="627.5" dy="14.3">R_cf = R_pv^T = I - Ω  [знаки кутів ПРОТИЛЕЖНІ]</tspan></text>
<rect x="20.0" y="425.0" width="800.0" height="55.0" rx="6" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/><text x="420.0" y="455.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#856404" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Знак кутів (Rx, Ry, Rz) у конвенції Coordinate Frame строго протилежний до Position Vector! Помилка дає зсув ~31 м на 1″ при R ≈ 6371 км.</tspan></text>
</svg>