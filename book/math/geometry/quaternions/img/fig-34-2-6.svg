<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
<rect width="720" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві дрібниці: норма |q| = 1 і подвійне покриття q ≡ −q</text>
<circle cx="232.0" cy="158.0" r="100.0" fill="#fbfbff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="232.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одинична сфера |q| = 1</text>
<line x1="232.0" y1="158.0" x2="308.6" y2="93.7" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<line x1="232.0" y1="158.0" x2="155.4" y2="222.3" stroke="#1f47b5" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#aBlue)"/>
<text x="316.6" y="97.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">q</text>
<text x="147.4" y="218.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">−q</text>
<text x="232.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">q і −q — той самий поворот</text>
<circle cx="275.8" cy="278.3" r="5.0" fill="#c0271e"/>
<line x1="275.8" y1="278.3" x2="266.2" y2="252.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="281.8" y="274.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">похибка</text>
<text x="281.8" y="288.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→ нормуй</text>
<rect x="404.0" y="84.0" width="286.0" height="150.0" rx="8" fill="#f6f4ec" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="420.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">|q| = √(w²+x²+y²+z²) = 1</text>
<text x="420.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">скласти повороти:  q₂ ⊗ q₁</text>
<text x="420.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(не комутує — порядок важливий)</text>
<text x="420.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">повернути вектор:  q · v · q⁻¹</text>
</svg>
