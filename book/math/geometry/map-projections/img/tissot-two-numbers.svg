<text x="465.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проєкція перетворює мале коло на еліпс — і всі властивості карти стають умовами на його півосі</text>
