<text x="772.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">площа ціла, прямий кут зім'ято</text>
<text x="465.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">a·b — у скільки разів роздуто площу;  a = b — кути цілі;  a = b = 1 водночас — неможливо</text>
