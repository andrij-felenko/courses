<text x="600.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">3</text>
<text x="682.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">2…4</text>
<text x="752.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">3</text>
<text x="814.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">+    lo = 3</text>
<text x="600.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">сектор звужено до пари v3, v4</text>
<text x="600.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="600.0" dy="0.0">лишилась одна перевірка — з якого</tspan><tspan x="600.0" dy="18.1">боку ребра v3 → v4 лежить точка:</tspan></text>
<text x="600.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">(v4 − v3) × (0 − v3) = 24 &gt; 0</text>
<text x="600.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="600.0" dy="0.0">зліва від ребра, тобто всередині —</tspan><tspan x="600.0" dy="18.1">початок координат накрито</tspan></text>
