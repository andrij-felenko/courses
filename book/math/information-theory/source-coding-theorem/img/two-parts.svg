<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві частини теореми: пряма й обернена</text>
<line x1="360.0" y1="70.0" x2="360.0" y2="250.0" stroke="#27ae60" stroke-width="2.6"/>
<rect x="331.4" y="44.0" width="57.2" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="360.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">дно H</tspan></text>
<line x1="110.0" y1="150.0" x2="346.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="55.4" y="126.2" width="109.3" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="110.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">ПРЯМА</tspan><tspan x="110.0" dy="15.6">(досяжність)</tspan></text>
<text x="230.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кодуємо типові</text>
<text x="230.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">L → H зверху</text>
<line x1="610.0" y1="150.0" x2="374.0" y2="150.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="555.4" y="126.2" width="109.3" height="47.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="610.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">ОБЕРНЕНА</tspan><tspan x="610.0" dy="15.6">(межа знизу)</tspan></text>
<text x="490.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">місць бракує</text>
<text x="490.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">L ≥ H завжди</text>
<text x="360.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дві частини притискають L до того самого дна H з двох боків — у цьому й уся теорема</text>
</svg>