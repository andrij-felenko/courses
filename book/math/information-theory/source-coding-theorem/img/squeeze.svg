<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затиск середньої довжини: H ≤ L &lt; H + 1</text>
<line x1="70.0" y1="188.0" x2="650.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">біт на символ</text>
<rect x="220.0" y="96.0" width="200.0" height="92.0" rx="6" fill="#eafaf0" stroke="none" stroke-width="0.0"/>
<text x="320.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">коридор оптимального коду</text>
<line x1="220.0" y1="70.0" x2="220.0" y2="194.0" stroke="#2457d6" stroke-width="2.6"/>
<text x="220.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">H — дно (нижче не можна)</text>
<line x1="420.0" y1="96.0" x2="420.0" y2="194.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="420.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">H + 1</text>
<rect x="70.0" y="120.0" width="150.0" height="68.0" rx="6" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<text x="145.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">неможливо</text>
<text x="145.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(втрата)</text>
<circle cx="330.0" cy="188.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="330.0" y1="188.0" x2="330.0" y2="118.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="330.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">L — середня довжина</text>
<text x="350.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">будь-який оптимальний код: H ≤ L &lt; H + 1   —   а блокуванням L/n тиснемо до самого H</text>
</svg>