<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кулі декодування: скільки помилок видно, а скільки виправно</text>
<text x="470.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-style="italic">довкола кожного кодового слова — куля радіуса t; поки кулі не злипаються, помилки до t виправні</text>
