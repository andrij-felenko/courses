<line x1="420.0" y1="103.0" x2="580.0" y2="157.0" stroke="#333333" stroke-width="1.5"/>
<rect x="477.0" y="121.0" width="96.0" height="18.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
