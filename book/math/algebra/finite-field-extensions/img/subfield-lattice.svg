<text x="420.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 елементи (базове поле)</text>
<rect x="670.0" y="245.0" width="150.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="745.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Критерій d | n</text>
<text x="745.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 ∤ 4 ⇒ GF(2^3) ⊈ GF(2^4)</text>
<text x="745.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перетин підполів:</text>
<text x="745.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GF(2^3) ∩ GF(2^4) = GF(2)</text>
<text x="745.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">НСД(3, 4) = 1 ⇒ GF(2^1)</text>
</svg>