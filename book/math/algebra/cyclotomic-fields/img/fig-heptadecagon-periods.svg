<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вежа періодів Гаусса для 17-кутника (1796 рік)</text>
<rect x="242.8" y="40.0" width="334.3" height="49.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">16 примітивних коренів ζ₁₇: сума η = −1</tspan><tspan x="410.0" dy="16.9">[ℚ(ζ₁₇) : ℚ] = 16</tspan></text>
<line x1="340.0" y1="92.0" x2="250.0" y2="138.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480.0" y1="92.0" x2="570.0" y2="138.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">квадратне рівняння 1: y² + y − 4 = 0</text>
<rect x="110.0" y="140.0" width="260.0" height="60.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Період η₁ (8 коренів):</tspan><tspan x="240.0" dy="13.0">ζ + ζ² + ζ⁴ + ζ⁸ + ζ⁹ + ζ¹³ + ζ¹⁵ + ζ¹⁶</tspan></text>
<rect x="450.0" y="140.0" width="260.0" height="60.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Період η₂ (8 коренів):</tspan><tspan x="580.0" dy="13.0">ζ³ + ζ⁵ + ζ⁶ + ζ⁷ + ζ¹⁰ + ζ¹¹ + ζ¹² + ζ¹⁴</tspan></text>
<line x1="240.0" y1="202.0" x2="170.0" y2="248.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="202.0" x2="310.0" y2="248.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="202.0" x2="510.0" y2="248.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="202.0" x2="650.0" y2="248.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">квадратні рівняння 2 (поділ на 4 періоди по 4 доданки)</text>
<rect x="50.0" y="250.0" width="160.0" height="50.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/><text x="130.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">η₁₁ (4 доданки)</tspan><tspan x="130.0" dy="13.0">ζ + ζ⁴ + ζ¹³ + ζ¹⁶</tspan></text>
<rect x="220.0" y="250.0" width="160.0" height="50.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/><text x="300.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">η₁₂ (4 доданки)</tspan><tspan x="300.0" dy="13.0">ζ² + ζ⁸ + ζ⁹ + ζ¹⁵</tspan></text>
<rect x="440.0" y="250.0" width="160.0" height="50.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/><text x="520.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">η₂₁ (4 доданки)</tspan><tspan x="520.0" dy="13.0">ζ³ + ζ⁵ + ζ¹² + ζ¹⁴</tspan></text>
<rect x="610.0" y="250.0" width="160.0" height="50.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/><text x="690.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">η₂₂ (4 доданки)</tspan><tspan x="690.0" dy="13.0">ζ⁶ + ζ⁷ + ζ¹⁰ + ζ¹¹</tspan></text>
<line x1="130.0" y1="302.0" x2="190.0" y2="348.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290.0" y1="302.0" x2="230.0" y2="348.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">квадратне рівняння 3</text>
<rect x="110.0" y="350.0" width="220.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="220.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">η₁₁₁ = ζ¹ + ζ¹⁶ = 2·cos(2π/17)</tspan><tspan x="220.0" dy="13.0">(сума двох спряжених)</tspan></text>
<line x1="332.0" y1="375.0" x2="410.0" y2="375.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="412.0" y="342.0" width="370.0" height="72.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/><text x="597.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="597.0" dy="0.0">Квадратне рівняння 4: x² − (η₁₁₁)·x + 1 = 0</tspan><tspan x="597.0" dy="13.0">→ Отримуємо сам корінь ζ₁₇ = cos(2π/17) + i·sin(2π/17)</tspan><tspan x="597.0" dy="13.0">Висновок: cos(2π/17) виражається через 4 вкладені √</tspan><tspan x="597.0" dy="13.0">⟹ 17-кутник будується циркулем і лінійкою!</tspan></text>
<text x="410.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Ступінь [ℚ(ζ₁₇):ℚ] = 16 = 2⁴ є степенем двійки — це критерій Гаусса — Ванцеля для побудови</text>
</svg>