<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1150" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="575.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">al-jabr і al-muqābala — очима свого часу й нашого</text>
<text x="160.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">як звалося</text>
<text x="520.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">приклад просто з трактату</text>
<text x="930.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">те саме сучасними словами</text>
<rect x="60.0" y="128.9" width="200.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">al-jabr</tspan><tspan x="160.0" dy="18.2">«відновлення»</tspan></text>
<rect x="310.0" y="135.5" width="420.0" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">x² = 40x − 4x²   →   5x² = 40x</tspan></text>
<rect x="770.0" y="136.5" width="320.0" height="37.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="930.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">додати 4x² до обох боків</tspan></text>
<rect x="60.0" y="238.9" width="200.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">al-muqābala</tspan><tspan x="160.0" dy="18.2">«зіставлення»</tspan></text>
<rect x="310.0" y="245.5" width="420.0" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">x² + 5 = 40x + 4x²   →   5 = 40x + 3x²</tspan></text>
<rect x="770.0" y="246.5" width="320.0" height="37.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="930.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">відняти x² від обох боків</tspan></text>
<rect x="282.8" y="348.0" width="584.3" height="44.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.4"/><text x="575.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Два імені — одна дія: зробити те саме з обома боками рівності</tspan></text>
<text x="575.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">окремі імена були потрібні, доки не було від'ємних чисел</text>
</svg>