<rect x="345.0" y="238.1" width="250.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">шукаю m(солі)</tspan><tspan x="470.0" dy="16.9">m(солі) = ω · m(розчину)</tspan></text>
<text x="470.0" y="315.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">відомі частка й розчин</text>
<line x1="470.0" y1="152.5" x2="780.0" y2="228.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="655.0" y="238.1" width="250.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">шукаю m(розчину)</tspan><tspan x="780.0" dy="16.9">m(розчину) = m(солі) / ω</tspan></text>
<text x="780.0" y="315.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">відомі частка й сіль</text>
