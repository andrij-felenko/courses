<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна рівність — три запитання</text>
<rect x="339.7" y="67.5" width="260.6" height="45.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.2"/><text x="470.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">m(солі) = ω · m(розчину)</tspan></text>
<text x="470.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">один зв'язок між трьома величинами</text>
<line x1="470.0" y1="152.5" x2="160.0" y2="228.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="238.1" width="250.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">шукаю ω</tspan><tspan x="160.0" dy="16.9">ω = m(солі) / m(розчину)</tspan></text>
<text x="160.0" y="315.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">відомі обидві маси</text>
