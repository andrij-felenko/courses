<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дію виконують з обома боками рівності</text>
<text x="250.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">шукане НАД рискою — один крок</text>
<text x="730.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">шукане ПІД рискою — два кроки</text>
<line x1="494.0" y1="96.0" x2="494.0" y2="360.0" stroke="#c9ced6" stroke-width="1.2" stroke-dasharray="6 6"/>
<rect x="135.4" y="110.5" width="229.2" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ω = m(солі) / m(розчину)</tspan></text>
<line x1="150.0" y1="161.5" x2="150.0" y2="218.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="172.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">× m(розчину)  —  обидва боки</text>
<rect x="135.4" y="230.5" width="229.2" height="39.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.2"/><text x="250.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">m(солі) = ω · m(розчину)</tspan></text>
<text x="250.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ділення прибрали множенням</text>
<rect x="615.0" y="98.5" width="230.0" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">n = m / M</tspan></text>
<line x1="636.0" y1="147.5" x2="636.0" y2="184.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="658.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">× M  —  обидва боки</text>
<rect x="615.0" y="194.5" width="230.0" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">n · M = m</tspan></text>
<line x1="636.0" y1="243.5" x2="636.0" y2="280.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="658.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">÷ n  —  обидва боки</text>
<rect x="615.0" y="290.5" width="230.0" height="39.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.2"/><text x="730.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">M = m / n</tspan></text>
<text x="730.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">той самий рух, застосований двічі</text>
</svg>