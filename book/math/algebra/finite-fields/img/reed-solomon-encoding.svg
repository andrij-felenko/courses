<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 857.5 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="857.5" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип кодування та виправлення помилок Ріда — Соломона над полем GF(2^8)</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодування та відновлення даних Ріда — Соломона над полем GF(2⁸)</text>
<rect x="43.1" y="65.4" width="193.8" height="59.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Блок даних k байтів</tspan><tspan x="140.0" dy="15.6">(d₀, d₁, ..., d_{k-1})</tspan><tspan x="140.0" dy="15.6">Многочлен: D(x) = ∑ d_i xⁱ</tspan></text>
<rect x="301.8" y="65.4" width="296.4" height="59.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Генераторний многочлен g(x) = ∏ (x - αⁱ)</tspan><tspan x="450.0" dy="15.6">Ділення: x^{2t} · D(x) = q(x)·g(x) + R(x)</tspan><tspan x="450.0" dy="15.6">Контрольні байти: P(x) = R(x) (2t байтів)</tspan></text>
<line x1="245.0" y1="95.0" x2="305.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">D(x)</text>
<rect x="602.8" y="65.4" width="214.4" height="59.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Кодове слово n байтів</tspan><tspan x="710.0" dy="15.6">[ Дані (k) | Перевірка (2t) ]</tspan><tspan x="710.0" dy="15.6">C(x) = D(x)·x^{2t} + R(x)</tspan></text>
<line x1="595.0" y1="95.0" x2="615.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="150.0" x2="710.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="765.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Шум / спотворення
до t байтів</text>
<rect x="650.7" y="230.4" width="118.6" height="59.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Прийняте слово</tspan><tspan x="710.0" dy="15.6">та синдроми S_j</tspan><tspan x="710.0" dy="15.6">S_j = C_rec(αʲ)</tspan></text>
<rect x="264.7" y="222.6" width="330.6" height="74.8" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="430.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Локалізація та оцінка помилок:</tspan><tspan x="430.0" dy="15.6">• Многочлен локаторів Λ(x) (Берлекамп — Мессі)</tspan><tspan x="430.0" dy="15.6">• Знаходження коренів Λ(x) (пошук Чіня)</tspan><tspan x="430.0" dy="15.6">• Обчислення величин помилок (алгоритм Форні)</tspan></text>
<line x1="620.0" y1="260.0" x2="595.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="608.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">S_j ≠ 0</text>
<rect x="46.8" y="230.4" width="166.5" height="59.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">100% відновлені дані</tspan><tspan x="130.0" dy="15.6">(d₀, d₁, ..., d_{k-1})</tspan><tspan x="130.0" dy="15.6">Без жодної втрати</tspan></text>
<line x1="260.0" y1="260.0" x2="235.0" y2="260.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="248.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Виправлено</text>
<rect x="101.6" y="364.4" width="636.7" height="41.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Властивість коду Ріда — Соломона над полем Галуа: досягає теоретичної межі Сінглтона d = n - k + 1,</tspan><tspan x="420.0" dy="14.3">дозволяючи гарантовано виправити до t = (n - k)/2 довільно пошкоджених байтів у блоці.</tspan></text>
</svg>