<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обчислення байтового S-box у шифрі AES через поле Галуа GF(2^8)</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебраїчна побудова AES S-Box над полем GF(2⁸)</text>
<rect x="58.4" y="78.4" width="143.1" height="63.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вхідний байт</tspan><tspan x="130.0" dy="15.6">A ∈ GF(2⁸)</tspan><tspan x="130.0" dy="15.6">(8-бітне значення)</tspan></text>
<line x1="210.0" y1="110.0" x2="270.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A</text>
<rect x="280.0" y="70.6" width="279.9" height="78.8" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="420.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Нелінійне обернення в GF(2⁸):</tspan><tspan x="420.0" dy="15.6">B = A⁻¹ = A²⁵⁴ mod P(x)</tspan><tspan x="420.0" dy="15.6">де P(x) = x⁸ + x⁴ + x³ + x + 1 (0x11B)</tspan><tspan x="420.0" dy="15.6">(для A = 0 визначається 0⁻¹ = 0)</tspan></text>
<line x1="570.0" y1="110.0" x2="630.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">B = A⁻¹</text>
<rect x="665.5" y="86.2" width="108.9" height="47.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Вектор бітів</tspan><tspan x="720.0" dy="15.6">B = (b₀..b₇)ᵀ</tspan></text>
<line x1="720.0" y1="160.0" x2="720.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="302.4" y="230.6" width="355.2" height="78.8" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="480.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">2. Афінне перетворення над GF(2):</tspan><tspan x="480.0" dy="15.6">S = M · B ⊕ c</tspan><tspan x="480.0" dy="15.6">де M — циклічна матриця 8×8, c = 0x63 (01100011₂)</tspan><tspan x="480.0" dy="15.6">Руйнує прості алгебраїчні структури обернення</tspan></text>
<line x1="670.0" y1="270.0" x2="720.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="270.0" x2="230.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="31.1" y="238.4" width="197.8" height="63.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вихідний байт S-Box</tspan><tspan x="130.0" dy="15.6">S(A) ∈ {0..255}</tspan><tspan x="130.0" dy="15.6">(Максимальна нелінійність)</tspan></text>
<rect x="54.6" y="364.4" width="730.8" height="41.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Чому саме GF(2⁸): обернення B = A⁻¹ гарантує максимальну стійкість до лінійного та диференціального криптоаналізу,</tspan><tspan x="420.0" dy="14.3">а афінний зсув M·B ⊕ c захищає від атак на основі чистої алгебраїчної інтерполяції.</tspan></text>
</svg>