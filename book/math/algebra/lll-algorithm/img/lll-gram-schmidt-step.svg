<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний зміст розмірного редукування та умови Ловаса</text>
<rect x="20.0" y="55.0" width="385.0" height="365.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="212.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Розмірне редукування (Size Reduction)</text>
<text x="212.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">|μ_{k,j}| ≤ 1/2 шляхом віднімання q · b_j</text>
<line x1="60.0" y1="240.0" x2="360.0" y2="240.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="340.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">напрямок b*ₖ₋₁</text>
<circle cx="100.0" cy="240.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="90.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<line x1="100.0" y1="240.0" x2="240.0" y2="240.0" stroke="#2457d6" stroke-width="2.5"/>
<circle cx="240.0" cy="240.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">b*ₖ₋₁</text>
<line x1="100.0" y1="240.0" x2="310.0" y2="140.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="310.0" cy="140.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="315.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">bₖ (до редукції)</text>
<line x1="310.0" y1="140.0" x2="310.0" y2="240.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="310.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">μ = 1.5</text>
<line x1="310.0" y1="140.0" x2="170.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">− ⌊1.5⌉ · bₖ₋₁</text>
<line x1="100.0" y1="240.0" x2="170.0" y2="140.0" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="170.0" cy="140.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">bₖ (редукований)</text>
<line x1="170.0" y1="140.0" x2="170.0" y2="240.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="170.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">новий |μ| = 0.5 ≤ 1/2</text>
<rect x="35.0" y="335.0" width="355.0" height="70.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="212.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув вздовж дискретної прямої:</text>
<text x="212.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">bₖ ← bₖ − ⌊μ_{k,j}⌉ · bⱼ</text>
<text x="212.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Коефіцієнт проекції гарантовано потрапляє в [−1/2, 1/2]</text>
<rect x="435.0" y="55.0" width="385.0" height="365.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="627.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Умова Ловаса (Lovász Condition)</text>
<text x="627.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">δ ‖b*ₖ₋₁‖² ≤ ‖b*ₖ + μ b*ₖ₋₁‖²  (для δ = 3/4)</text>
<line x1="490.0" y1="260.0" x2="770.0" y2="260.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="490.0" y1="260.0" x2="490.0" y2="110.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="490.0" cy="260.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="490.0" y1="260.0" x2="650.0" y2="260.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="570.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">‖b*ₖ₋₁‖</text>
<line x1="490.0" y1="260.0" x2="550.0" y2="260.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="525.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">μ b*ₖ₋₁</text>
<line x1="550.0" y1="260.0" x2="550.0" y2="160.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="590.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">‖b*ₖ‖</text>
<line x1="490.0" y1="260.0" x2="550.0" y2="160.0" stroke="#d97706" stroke-width="2.5"/>
<text x="505.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">‖b*ₖ + μ b*ₖ₋₁‖</text>
<rect x="450.0" y="335.0" width="355.0" height="70.0" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.0"/>
<text x="627.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Критерій обміну (Swap):</text>
<text x="627.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Якщо b*ₖ надто малий: ‖b*ₖ‖² &lt; (δ − μ²) ‖b*ₖ₋₁‖²</text>
<text x="627.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">→ Обмін bₖ ↔ bₖ₋₁ та крок назад k ← max(k−1, 2)</text>
</svg>