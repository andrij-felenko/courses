<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65 -55 905 575" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-65" y="-55" width="905" height="575" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричне обґрунтування ділення з остачею в ℤ[i]</text>
<rect x="155.0" y="165.0" width="210.0" height="210.0" rx="6" fill="#fcfcfc" stroke="#cccccc" stroke-width="1.5"/>
<circle cx="155.0" cy="165.0" r="210.0" fill="none" stroke="#dddddd" stroke-width="1.2"/>
<circle cx="155.0" cy="165.0" r="148.5" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.8"/>
<line x1="155.0" y1="165.0" x2="228.5" y2="228.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="228.5" cy="228.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="268.5" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">z = α / β</text>
<text x="161.8" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">|z - q| ≤ 1/√2</text>
<circle cx="260.0" cy="270.0" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="0.0"/>
<text x="268.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">центр (d = 1/√2)</text>
<circle cx="155.0" cy="375.0" r="4.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="127.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">q₀</text>
<circle cx="365.0" cy="375.0" r="4.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="397.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">q₀ + 1</text>
<circle cx="155.0" cy="165.0" r="6.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
<text x="127.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">q₀ + i</text>
<circle cx="365.0" cy="165.0" r="4.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="397.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">q₀ + 1 + i</text>
<rect x="530.0" y="65.0" width="285.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="672.5" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">Алгоритм округлення:</tspan><tspan x="672.5" dy="16.9">1. Обчислюємо z = α / β у ℂ</tspan><tspan x="672.5" dy="16.9">   z = x + yi (дійсні x, y)</tspan><tspan x="672.5" dy="16.9">2. Округлюємо до найближчих цілих:</tspan><tspan x="672.5" dy="16.9">   q = ⌊x + ½⌋ + ⌊y + ½⌋·i ∈ ℤ[i]</tspan></text>
<rect x="530.0" y="205.0" width="285.0" height="145.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="672.5" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">Оцінка відстані:</tspan><tspan x="672.5" dy="16.9">• |x - Re(q)| ≤ ½</tspan><tspan x="672.5" dy="16.9">• |y - Im(q)| ≤ ½</tspan><tspan x="672.5" dy="16.9">• |z - q|² ≤ (½)² + (½)² = ½</tspan><tspan x="672.5" dy="16.9">• |z - q| ≤ 1/√2 ≈ 0.707 &lt; 1</tspan></text>
<rect x="530.0" y="365.0" width="285.0" height="130.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/><text x="672.5" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">Остача r = α - q·β:</tspan><tspan x="672.5" dy="16.9">• N(r) = N(β) · |z - q|²</tspan><tspan x="672.5" dy="16.9">• N(r) ≤ ½ · N(β) &lt; N(β)</tspan><tspan x="672.5" dy="16.9">⇒ Кільце ℤ[i] є евклідовим!</tspan></text>
</svg>