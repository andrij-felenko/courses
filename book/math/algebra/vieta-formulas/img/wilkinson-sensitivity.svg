<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чисельна поведінка: прямий синтез Вієта проти оберненого пошуку коренів</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Обчислення коефіцієнтів за коренями стійке; пошук коренів за коефіцієнтами може бути надчутливим</text>
<rect x="50.0" y="80.0" width="220.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="118.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Задані корені / полюси:</tspan><tspan x="160.0" dy="15.6">r₁, r₂, ..., rₙ</tspan><tspan x="160.0" dy="15.6">(бажана динаміка системи)</tspan></text>
<rect x="330.0" y="80.0" width="220.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Формули Вієта</tspan><tspan x="440.0" dy="14.3">(симетрична згортка):</tspan><tspan x="440.0" dy="14.3">aₖ = (−1)ⁿ⁻ᵏ eₙ₋ₖ(r₁,...,rₙ)</tspan><tspan x="440.0" dy="14.3">Складність: O(n²)</tspan></text>
<rect x="610.0" y="80.0" width="220.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Фізичні коефіцієнти:</tspan><tspan x="720.0" dy="15.6">aₙ, aₙ₋₁, ..., a₀</tspan><tspan x="720.0" dy="15.6">Чисельно СТІЙКИЙ процес</tspan><tspan x="720.0" dy="15.6">(без втрати точності)</tspan></text>
<line x1="275.0" y1="130.0" x2="325.0" y2="130.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="555.0" y1="130.0" x2="605.0" y2="130.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="50.0" y="220.0" width="220.0" height="105.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Збурені коефіцієнти:</tspan><tspan x="160.0" dy="15.6">aₖ + δaₖ</tspan><tspan x="160.0" dy="15.6">(похибка округлення: 2⁻²³)</tspan></text>
<rect x="330.0" y="220.0" width="220.0" height="105.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Чисельний пошук коренів:</tspan><tspan x="440.0" dy="14.3">Многочлен Вілкінсона W(x)</tspan><tspan x="440.0" dy="14.3">W(x) = ∏ (x − k) для k=1..20</tspan><tspan x="440.0" dy="14.3">Погано обумовлена задача</tspan></text>
<rect x="610.0" y="220.0" width="220.0" height="105.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Катастрофічне зміщення:</tspan><tspan x="720.0" dy="14.3">Корені зміщуються на ±3.0</tspan><tspan x="720.0" dy="14.3">або стають комплексними!</tspan><tspan x="720.0" dy="14.3">Погана обумовленість</tspan></text>
<line x1="275.0" y1="272.0" x2="325.0" y2="272.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="555.0" y1="272.0" x2="605.0" y2="272.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>