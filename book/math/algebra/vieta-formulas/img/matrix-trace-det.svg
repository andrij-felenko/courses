<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектральні інваріанти матриці як окремі випадки формул Вієта</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Характеристичний многочлен p(λ) = det(λI − A) пов'язує власні значення λᵢ з коефіцієнтами матриці</text>
<rect x="40.0" y="80.0" width="250.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Квадратна матриця A (n × n)</tspan><tspan x="165.0" dy="15.6">a₁₁  a₁₂  ...  a₁ₙ</tspan><tspan x="165.0" dy="15.6">a₂₁  a₂₂  ...  a₂ₙ</tspan><tspan x="165.0" dy="15.6">...  ...  ...  ...</tspan><tspan x="165.0" dy="15.6">aₙ₁  aₙ₂  ...  aₙₙ</tspan></text>
<rect x="40.0" y="230.0" width="250.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Характеристичний поліном:</tspan><tspan x="165.0" dy="15.6">p(λ) = det(λI − A)</tspan><tspan x="165.0" dy="15.6">= (λ − λ₁)(λ − λ₂)...(λ − λₙ)</tspan><tspan x="165.0" dy="15.6">= λⁿ − c₁ λⁿ⁻¹ + c₂ λⁿ⁻² − ...</tspan></text>
<rect x="330.0" y="80.0" width="240.0" height="130.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Перший коефіцієнт (e₁):</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">c₁ = λ₁ + λ₂ + ... + λₙ</tspan><tspan x="450.0" dy="15.6">= tr(A) = ∑ aᵢᵢ</tspan><tspan x="450.0" dy="15.6">(Слід: сума діагоналі)</tspan></text>
<rect x="330.0" y="230.0" width="240.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Вільний член (eₙ):</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">cₙ = λ₁ · λ₂ · ... · λₙ</tspan><tspan x="450.0" dy="15.6">= det(A)</tspan><tspan x="450.0" dy="15.6">(Визначник: добуток коренів)</tspan></text>
<rect x="610.0" y="80.0" width="230.0" height="130.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="725.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Геометричний зміст сліду:</tspan><tspan x="725.0" dy="14.3"></tspan><tspan x="725.0" dy="14.3">• Швидкість росту об'єму</tspan><tspan x="725.0" dy="14.3">• Дивергенція потоку: div(v)</tspan><tspan x="725.0" dy="14.3">• Сума розтягів по осях</tspan></text>
<rect x="610.0" y="230.0" width="230.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Геометричний зміст визначника:</tspan><tspan x="725.0" dy="14.3"></tspan><tspan x="725.0" dy="14.3">• Масштаб орієнтованого об'єму</tspan><tspan x="725.0" dy="14.3">• Коефіцієнт зміни n-об'єму</tspan><tspan x="725.0" dy="14.3">• det(A) = V_new / V_initial</tspan></text>
<line x1="295.0" y1="145.0" x2="325.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="295.0" y1="290.0" x2="325.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="575.0" y1="145.0" x2="605.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="575.0" y1="290.0" x2="605.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>