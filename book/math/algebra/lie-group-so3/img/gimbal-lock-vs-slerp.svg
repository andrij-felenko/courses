<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карданне заклинювання (Gimbal Lock) проти інтерполяції SLERP</text>
<rect x="40.0" y="60.0" width="350.0" height="355.0" rx="8" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.8"/>
<text x="215.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Кути Ейлера: Карданне заклинювання</text>
<ellipse cx="215" cy="200" rx="75" ry="75" fill="none" stroke="#2457d6" stroke-width="3"/>
<text x="215.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішнє кільце (Курс/Yaw)</text>
<ellipse cx="215" cy="200" rx="55" ry="12" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="295.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Тангаж = 90°</text>
<ellipse cx="215" cy="200" rx="40" ry="40" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="215.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Внутрішнє кільце (Крен/Roll)</text>
<line x1="215.0" y1="105.0" x2="215.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="225.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Осі збіглися!</text>
<rect x="60.0" y="312.1" width="310.0" height="65.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Тангаж θ = ±90° вироджує матрицю:</tspan><tspan x="215.0" dy="14.3">Крен і курс крутять навколо ОДНІЄЇ осі.</tspan><tspan x="215.0" dy="14.3">Втрачено 1 ступінь свободи!</tspan><tspan x="215.0" dy="14.3">Швидкості кутів прямують до ∞.</tspan></text>
<rect x="430.0" y="60.0" width="350.0" height="355.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="605.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Кватерніони: Інтерполяція SLERP на S³</text>
<circle cx="605.0" cy="200.0" r="75.0" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<ellipse cx="605" cy="200" rx="75" ry="22" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
<circle cx="557.0" cy="225.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="650.0" cy="170.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="547.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">q₁</text>
<text x="660.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">q₂</text>
<path d="M 557,225 A 75,75 0 0 1 650,170" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
<text x="597.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">q(t) = Slerp(q₁, q₂, t)</text>
<rect x="450.0" y="304.9" width="310.0" height="80.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Геодезичний рух уздовж великого кола:</tspan><tspan x="605.0" dy="14.3">✔ Стала кутова швидкість (ω = const)</tspan><tspan x="605.0" dy="14.3">✔ Жодних сингулярностей чи заклинювань</tspan><tspan x="605.0" dy="14.3">✔ Найкоротший шлях (вибір знаку q₁·q₂ ≥ 0)</tspan><tspan x="605.0" dy="14.3">Плавний рух камер і маніпуляторів.</tspan></text>
</svg>