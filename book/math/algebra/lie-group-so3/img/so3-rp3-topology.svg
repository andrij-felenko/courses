<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологія SO(3): куля радіуса π з ототожненням антиподів (ℝP³)</text>
<circle cx="230.0" cy="235.0" r="135.0" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<path d="M 95,235 A 135,45 0 0 1 365,235" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M 95,235 A 135,45 0 0 0 365,235" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<circle cx="230.0" cy="235.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="214.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">I (θ=0)</text>
<line x1="230.0" y1="235.0" x2="95.0" y2="235.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="162.5" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">радіус = π</text>
<circle cx="297.0" cy="119.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="163.0" cy="351.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="309.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">+π u</text>
<text x="151.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">−π u ≡ +π u</text>
<path d="M 307,119 C 400,195 400,275 173,351" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="395.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Ототожнено!</text>
<path d="M 230,235 L 294,124" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 166,346 L 228,238" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="275.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Шлях поворотів (360°)</text>
<rect x="470.0" y="65.0" width="320.0" height="345.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальна група π₁(SO(3)) ≅ ℤ₂</text>
<rect x="490.0" y="104.8" width="280.0" height="90.4" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Петля 1: поворот на 360° (2π)</tspan><tspan x="630.0" dy="15.6">• Йде від I до межі +π u</tspan><tspan x="630.0" dy="15.6">• Стрибає в антипод −π u</tspan><tspan x="630.0" dy="15.6">• Повертається в I</tspan><tspan x="630.0" dy="15.6">✖ Не стягується в точку!</tspan></text>
<rect x="490.0" y="224.8" width="280.0" height="90.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Петля 2: поворот на 720° (4π)</tspan><tspan x="630.0" dy="15.6">• Проходить петлю 1 двічі</tspan><tspan x="630.0" dy="15.6">• Утворює подвійну траєкторію</tspan><tspan x="630.0" dy="15.6">✔ Неперервно стягується в точку I!</tspan><tspan x="630.0" dy="15.6">π₁(SO(3)) має рівно 2 класи (ℤ₂)</tspan></text>
<text x="630.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">SO(3) не є однозв'язною!</text>
<text x="630.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Універсальне накриття: SU(2) ≅ S³</text>
</svg>