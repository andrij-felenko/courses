<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Група Лі SO(3) і дотична алгебра Лі so(3)</text>
<path d="90,320 C 120,180 240,160 380,210 C 440,230 420,380 340,400 C 220,430 80,390 90,320" fill="#eef2f7" stroke="#2457d6" stroke-width="2"/>
<text x="350.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Многовид SO(3)</text>
<text x="350.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Rᵀ R = I, det(R) = +1</text>
<polygon points="130,190 L 320,130 L 390,210 L 200,270 Z" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.8" fill-opacity="0.85"/>
<text x="325.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Дотичний простір: алгебра so(3)</text>
<circle cx="220.0" cy="210.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="204.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">I</text>
<line x1="220" y1="210" x2="310" y2="175" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="300.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ω = [ω]ₓ ∈ so(3)</text>
<path d="M 220,210 C 250,235 280,260 305,295" fill="none" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="285.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">R(t) = exp(t Ω)</text>
<path d="M 285,185 C 295,210 290,230 270,245" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="315.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">exp(·)</text>
<rect x="470.0" y="65.0" width="320.0" height="345.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебра Лі та векторний добуток</text>
<rect x="490.0" y="118.2" width="280.0" height="43.6" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="630.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Антисиметричні 3×3 матриці:</tspan><tspan x="630.0" dy="15.6">Ωᵀ = −Ω   (3 ступені свободи)</tspan></text>
<rect x="490.0" y="190.4" width="280.0" height="59.2" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="630.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Ізоморфізм просторів ℝ³ ≅ so(3):</tspan><tspan x="630.0" dy="15.6">ω = (ω₁, ω₂, ω₃)ᵀ  ↦  [ω]ₓ</tspan><tspan x="630.0" dy="15.6">[ω]ₓ v = ω × v</tspan></text>
<rect x="490.0" y="280.4" width="280.0" height="59.2" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Дужка Лі = матричний комутатор:</tspan><tspan x="630.0" dy="15.6">[A, B] = A·B − B·A</tspan><tspan x="630.0" dy="15.6">[[u]ₓ, [v]ₓ] = [u × v]ₓ</tspan></text>
<text x="630.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Базис генераторів: [J_x, J_y] = J_z</text>
</svg>