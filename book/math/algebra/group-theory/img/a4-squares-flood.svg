<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому підгрупа порядку 6 неможлива</text>
<text x="410.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Припустімо |H| = 6.  Тоді індекс [A₄ : H] = 12 / 6 = 2.</text>
<text x="410.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Підгрупа індексу 2 містить квадрат кожного елемента A₄.</text>
