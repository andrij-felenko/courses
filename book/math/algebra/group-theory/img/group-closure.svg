<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Побудова групи з твірних: замикання за операцією</text>
<rect x="40.0" y="78.0" width="214.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="147.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="147.0" dy="0.0">Твірні</tspan><tspan x="147.0" dy="19.5">S = { r, s₁ }</tspan><tspan x="147.0" dy="19.5">2 елементи</tspan></text>
<rect x="326.0" y="78.0" width="234.0" height="128.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="443.0" y="119.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="443.0" dy="0.0">Множимо всі пари,</tspan><tspan x="443.0" dy="18.2">нові — у чергу:</tspan><tspan x="443.0" dy="18.2">r·r = r²,  s₁·r = s₂,</tspan><tspan x="443.0" dy="18.2">r·s₁ = s₃,  s₁·s₁ = e</tspan></text>
<rect x="632.0" y="78.0" width="190.0" height="128.0" rx="6" fill="#e7f7ee" stroke="#1a1a1a" stroke-width="1.5"/><text x="727.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="727.0" dy="0.0">Замкнено:</tspan><tspan x="727.0" dy="19.5">D₃ = { e, r, r²,</tspan><tspan x="727.0" dy="19.5">s₁, s₂, s₃ }</tspan><tspan x="727.0" dy="19.5">|G| = 6</tspan></text>
<line x1="256.0" y1="142.0" x2="322.0" y2="142.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="562.0" y1="142.0" x2="628.0" y2="142.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="430.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="430.0" dy="0.0">closure(S): доки крок множення дає новий елемент — додаємо його;</tspan><tspan x="430.0" dy="16.9">коли жодна пара не виводить за межі — множина замкнена, це група.</tspan></text>
</svg>