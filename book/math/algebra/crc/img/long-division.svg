<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ділення многочленів над GF(2) «стовпчиком» — це і є обчислення CRC</text>
<text x="470.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">на кожному кроці віднімаємо (XOR) зсунутий дільник; жодних переносів і позик — кожен стовпчик сам по собі</text>
<text x="232.0" y="110.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#caa24a" text-anchor="end" font-weight="700">G = 1011</text>
<text x="232.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">(x³+x+1)</text>
<text x="250.0" y="96.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">1010000</text>
<text x="440.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ділене: повідомлення 1010 + три нулі під майбутній лишок</text>
<text x="250.0" y="126.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#c0392b" text-anchor="start" font-weight="700">1011000</text>
<line x1="248.0" y1="132.0" x2="330.0" y2="132.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="440.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">⊕ G, підведений під старшу 1 (позиція x⁶)</text>
<text x="250.0" y="156.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">0001000</text>
<text x="440.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">= проміжок (старша 1 згасла)</text>
<text x="250.0" y="186.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#6b7280" text-anchor="start" font-weight="700">0001000</text>
<text x="440.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">старший біт = 0 ⇒ G не віднімаємо, зсуваємось далі</text>
<text x="250.0" y="216.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#6b7280" text-anchor="start" font-weight="700">0001000</text>
<text x="440.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">знову 0 ⇒ пропуск</text>
<text x="250.0" y="246.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#c0392b" text-anchor="start" font-weight="700">0001011</text>
<line x1="248.0" y1="252.0" x2="330.0" y2="252.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="440.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">⊕ G, підведений під наступну 1 (позиція x³)</text>
<text x="250.0" y="276.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#27ae60" text-anchor="start" font-weight="700">0000011</text>
<text x="440.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">= лишок: коротший за G, ділити більше нічим</text>
<text x="250.0" y="316.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" fill="#27ae60" text-anchor="start" font-weight="700">CRC-3 = 011</text>
<text x="440.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">лишок коротший за дільник — це і є контрольна сума повідомлення 1010</text>
<rect x="600.0" y="88.0" width="312.0" height="360.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="756.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що тут відбувається</text>
<text x="618.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. До повідомлення дописуємо стільки</text>
<text x="618.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   нулів, який степінь у дільника G</text>
<text x="618.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   (тут 3) — це місце під майбутній CRC.</text>
<text x="618.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="618.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Ділимо стовпчиком: де старший біт</text>
<text x="618.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   проміжку = 1 — віднімаємо (XOR) G,</text>
<text x="618.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   зсунутий під цю одиницю; де 0 —</text>
<text x="618.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   просто йдемо до наступного біта.</text>
<text x="618.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="618.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Що лишилось коротше за G — і є</text>
<text x="618.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   лишок R(x). Це й є контрольна сума.</text>
<rect x="618.0" y="374.0" width="276.0" height="60.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="756.0" y="396.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Передаємо: 1010 011</text>
<text x="756.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(повідомлення + лишок замість дописаних нулів)</text>
<rect x="60.0" y="470.0" width="820.0" height="120.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="470.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Ключ до всього: «віднімання» тут — це XOR біт-у-біт</text>
<text x="90.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">У звичайному стовпчику віднімання тягне позики між розрядами. Над GF(2) позик немає: кожен стовпчик —</text>
<text x="90.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">окреме 1−1=0, 1−0=1, 0−1=1 — тобто рівно XOR. Тому весь поділ зводиться до зсувів і XOR, і його легко</text>
<text x="90.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">робить як кілька вентилів у залізі, так і кілька рядків коду на МК (бітовий цикл — це буквально ці кроки).</text>
</svg>