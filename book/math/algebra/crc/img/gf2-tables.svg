<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поле GF(2): уся арифметика — на двох числах {0, 1}</text>
<text x="470.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">додавання — це XOR, множення — це AND; віднімання окремо не існує — воно збігається з додаванням</text>
<text x="166.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Додавання   a + b   (= XOR)</text>
<rect x="54.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.5"/><text x="82.0" y="88.1" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text><rect x="110.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="138.0" y="87.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="166.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="194.0" y="87.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text><rect x="54.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="82.0" y="143.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="54.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="82.0" y="199.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text><rect x="110.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="138.0" y="143.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="166.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="194.0" y="143.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="110.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="138.0" y="199.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="166.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="194.0" y="199.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<text x="466.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Множення   a · b   (= AND)</text>
<rect x="354.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.5"/><text x="382.0" y="88.1" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">·</text><rect x="410.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="438.0" y="87.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="466.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="494.0" y="87.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text><rect x="354.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="382.0" y="143.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="354.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="382.0" y="199.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text><rect x="410.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="438.0" y="143.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="466.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="494.0" y="143.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="410.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="438.0" y="199.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="466.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="494.0" y="199.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="766.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Віднімання   a − b   (те саме!)</text>
<rect x="654.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.5"/><text x="682.0" y="88.1" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">−</text><rect x="710.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="738.0" y="87.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="766.0" y="54.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="794.0" y="87.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text><rect x="654.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="682.0" y="143.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="654.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="682.0" y="199.4" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text><rect x="710.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="738.0" y="143.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><rect x="766.0" y="110.0" width="56.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="794.0" y="143.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="710.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="738.0" y="199.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="766.0" y="166.0" width="56.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/><text x="794.0" y="199.8" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<text x="166.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">↑ та сама таблиця, що й «−» праворуч</text>
<text x="766.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">↑ поклітинно збігається з «+» ліворуч</text>
<rect x="60.0" y="300.0" width="820.0" height="100.0" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="470.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому віднімання не потрібне окремо</text>
<text x="90.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">У звичайних числах a − b = a + (−b), і знак мінус указує «протилежне» число. У GF(2) протилежного шукати</text>
<text x="90.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">не доводиться: з таблиці «+» видно, що 1 + 1 = 0, тобто кожне число САМЕ СОБІ протилежне (−1 = 1, −0 = 0).</text>
<rect x="60.0" y="432.0" width="820.0" height="64.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="470.0" y="458.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">a + a = 0      ⇒      −a = a      ⇒      a − b  =  a + b  =  a ⊕ b</text>
<text x="470.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один знак ⊕ виконує і плюс, і мінус — звідси вся простота арифметики CRC.</text>
</svg>