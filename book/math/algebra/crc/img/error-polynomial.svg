<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="514" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мова многочленів пояснює, ЯКІ помилки CRC гарантовано ловить</text>
<text x="470.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">перешкода додає до кадру свій многочлен помилки E(x); CRC пропустить її лише тоді, коли G(x) ділить E(x)</text>
<rect x="70.0" y="96.0" width="250.0" height="56.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="195.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">передано T(x)</text>
<text x="195.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ділиться на G(x) націло</text>
<text x="360.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="400.0" y="96.0" width="250.0" height="56.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="525.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">помилка E(x)</text>
<text x="525.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">одиниці там, де біти злетіли</text>
<text x="690.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">=</text>
<rect x="720.0" y="96.0" width="190.0" height="56.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="815.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">прийнято R(x)</text>
<text x="815.0" y="140.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">= T(x) + E(x)</text>
<rect x="60.0" y="178.0" width="820.0" height="70.0" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="470.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач ділить R(x) на G(x). Оскільки T(x) ділиться без лишку, лишок дає сама лише E(x):</text>
<text x="470.0" y="230.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">R(x) mod G(x) = E(x) mod G(x)   →   помилка непомітна  ⇔  G(x) ділить E(x)</text>
<rect x="70.0" y="282.0" width="360.0" height="34.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="82.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Клас помилки E(x)</text>
<rect x="430.0" y="282.0" width="250.0" height="34.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="555.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому G(x) її не ділить</text>
<rect x="680.0" y="282.0" width="190.0" height="34.0" rx="6" fill="#faf3e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="775.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантія</text>
<rect x="70.0" y="316.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Будь-який 1 перевернутий біт</text>
<rect x="430.0" y="316.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">E(x) = xⁱ, а дільник має ≥ 2 доданки</text>
<rect x="680.0" y="316.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/>
<text x="775.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">завжди</text>
<rect x="70.0" y="356.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Будь-які 2 перевернуті біти</text>
<rect x="430.0" y="356.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">беруть примітивний G(x) із ≥ 3 доданками</text>
<rect x="680.0" y="356.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/>
<text x="775.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">у межах кадру</text>
<rect x="70.0" y="396.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="420.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Непарне число помилок</text>
<rect x="430.0" y="396.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="420.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">беруть G(x), кратний (x + 1)</text>
<rect x="680.0" y="396.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/>
<text x="775.0" y="420.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">завжди</text>
<rect x="70.0" y="436.0" width="360.0" height="40.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="82.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Серія (burst) завдовжки ≤ степінь G</text>
<rect x="430.0" y="436.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="555.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">коротша за G ⇒ не ділиться на G націло</text>
<rect x="680.0" y="436.0" width="190.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/>
<text x="775.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">завжди</text>
<text x="470.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Саме тому поліноми CRC (CRC-8/16/32) не випадкові: їх добирають так, щоб E(x) найчастіших помилок не ділилось на G(x).</text>
</svg>