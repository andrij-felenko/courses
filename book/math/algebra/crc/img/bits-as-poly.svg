<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біти — це коефіцієнти многочлена над GF(2)</text>
<text x="470.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">позиція біта = степінь x; одиниця означає «доданок є», нуль — «доданка немає»</text>
