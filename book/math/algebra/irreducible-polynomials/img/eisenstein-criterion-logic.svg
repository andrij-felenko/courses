<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
<rect width="100%" height="100%" fill="#ffffff" />
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій Шенемана — Ейзенштейна: умови незвідності над ℤ та ℚ</text>
<text x="400.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">f(x) = aₙ·xⁿ + aₙ₋₁·xⁿ⁻¹ + ... + a₁·x + a₀</text>
<rect x="64.5" y="92.2" width="191.0" height="125.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Старший коефіцієнт aₙ</tspan><tspan x="160.0" dy="15.6"></tspan><tspan x="160.0" dy="15.6">p ∤ aₙ</tspan><tspan x="160.0" dy="15.6">(p НЕ ділить aₙ)</tspan><tspan x="160.0" dy="15.6"></tspan><tspan x="160.0" dy="15.6">Зберігає ступінь n</tspan><tspan x="160.0" dy="15.6">при редукції за модулем p</tspan></text>
<rect x="290.8" y="92.2" width="218.4" height="125.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Проміжні коефіцієнти</tspan><tspan x="400.0" dy="15.6">aₙ₋₁, aₙ₋₂, ..., a₁</tspan><tspan x="400.0" dy="15.6"></tspan><tspan x="400.0" dy="15.6">p | aᵢ (для всіх 0 ≤ i &lt; n)</tspan><tspan x="400.0" dy="15.6">(p ділить усі проміжні)</tspan><tspan x="400.0" dy="15.6"></tspan><tspan x="400.0" dy="15.6">Редукція f(x) ≡ aₙ·xⁿ (mod p)</tspan></text>
<rect x="524.0" y="92.2" width="232.0" height="125.6" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="640.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Вільний член a₀</tspan><tspan x="640.0" dy="15.6"></tspan><tspan x="640.0" dy="15.6">p | a₀  ТА  p² ∤ a₀</tspan><tspan x="640.0" dy="15.6">(p ділить a₀, але p² НЕ ділить)</tspan><tspan x="640.0" dy="15.6"></tspan><tspan x="640.0" dy="15.6">Блокує розклад</tspan><tspan x="640.0" dy="15.6">a₀ = b₀·c₀ за модулем p²</tspan></text>
<line x1="160.0" y1="245.0" x2="300.0" y2="295.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="245.0" x2="400.0" y2="295.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="640.0" y1="245.0" x2="500.0" y2="295.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="53.5" y="306.5" width="693.0" height="37.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ВИСНОВОК: Многочлен f(x) є НЕПРИВІДНИМ над полем раціональних чисел ℚ (і кільцем ℤ)</tspan></text>
</svg>