<rect x="49.1" y="246.2" width="101.8" height="47.6" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="100.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">p₁(x)ᵉ¹</tspan><tspan x="100.0" dy="15.6">Непривідний</tspan></text>
