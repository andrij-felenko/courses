<line x1="140.0" y1="215.0" x2="100.0" y2="238.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="180.0" y1="215.0" x2="220.0" y2="238.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Елементарні дільники (атоми кільця F[x])</text>
<text x="160.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Неможливо розкласти у добуток менших степенів над полем F</text>
