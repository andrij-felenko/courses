<rect x="55.4" y="74.6" width="209.2" height="70.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Складений многочлен f(x)</tspan><tspan x="160.0" dy="16.9">Ступінь deg(f) = n</tspan><tspan x="160.0" dy="16.9">Розкладається на множники</tspan></text>
<line x1="160.0" y1="155.0" x2="160.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
