<line x1="510.0" y1="145.0" x2="450.0" y2="205.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="630.0" y1="145.0" x2="690.0" y2="205.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="347.7" y="212.8" width="204.7" height="94.4" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">p(x) непривідний</tspan><tspan x="450.0" dy="15.6">⬇</tspan><tspan x="450.0" dy="15.6">Ідеал (p(x)) максимальний</tspan><tspan x="450.0" dy="15.6">Фактор є ПОЛЕМ F[x]/(p(x))</tspan><tspan x="450.0" dy="15.6">Кожен елемент має обернений</tspan></text>
<rect x="594.5" y="212.8" width="191.0" height="94.4" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">p(x) складений: a(x)·b(x)</tspan><tspan x="690.0" dy="15.6">⬇</tspan><tspan x="690.0" dy="15.6">Ідеал НЕ максимальний</tspan><tspan x="690.0" dy="15.6">Є ДІЛЬНИКИ НУЛЯ</tspan><tspan x="690.0" dy="15.6">Не є полем (лише кільце)</tspan></text>
<text x="450.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Основа скінченних полів Галуа GF(qⁿ)</text>
<text x="690.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Дільники нуля руйнують ділення</text>
</svg>