<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430">
<rect width="100%" height="100%" fill="#ffffff" />
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр перевірки незвідності Рабіна для f(x) степеня n над полем F_q</text>
<rect x="19.0" y="63.4" width="232.0" height="63.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Вхідні дані:</tspan><tspan x="135.0" dy="15.6">f(x) ∈ F_q[x], deg(f) = n</tspan><tspan x="135.0" dy="15.6">Прості дільники n: p₁, ..., p_k</tspan></text>
<rect x="304.5" y="63.4" width="191.0" height="63.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Крок 1: Перевірка періоду</tspan><tspan x="400.0" dy="15.6">Обчислити x^(qⁿ) mod f(x)</tspan><tspan x="400.0" dy="15.6">Чи дорівнює воно x?</tspan></text>
<line x1="235.0" y1="95.0" x2="295.0" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="140.0" x2="400.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">НІ</text>
<rect x="316.8" y="217.2" width="166.5" height="55.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ЗВІДНИЙ (f має корені</tspan><tspan x="400.0" dy="14.3">поза F_(qⁿ) або ділиться</tspan><tspan x="400.0" dy="14.3">на незвідні d ∤ n)</tspan></text>
<line x1="505.0" y1="95.0" x2="565.0" y2="95.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="583.4" y="58.0" width="233.2" height="73.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="77.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Крок 2: Відсутність дільників</tspan><tspan x="700.0" dy="14.3">Для кожного p_i | n:</tspan><tspan x="700.0" dy="14.3">g_i = НСД(f(x), x^(q^(n/p_i)) - x)</tspan><tspan x="700.0" dy="14.3">Чи всі g_i = 1?</tspan></text>
<line x1="700.0" y1="155.0" x2="700.0" y2="205.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">НІ (g_i ≠ 1)</text>
<rect x="619.9" y="217.2" width="160.2" height="55.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ЗВІДНИЙ</tspan><tspan x="700.0" dy="14.3">Знайдено нетривіальний</tspan><tspan x="700.0" dy="14.3">спільний дільник g_i(x)</tspan></text>
<line x1="815.0" y1="95.0" x2="815.0" y2="350.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="815.0" y1="350.0" x2="560.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК (усі g_i = 1)</text>
<rect x="138.4" y="323.1" width="443.1" height="53.9" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">НЕПРИВІДНИЙ МНОГОЧЛЕН f(x)</tspan><tspan x="360.0" dy="16.9">Гарантовано не має дільників меншого ступеня над F_q</tspan></text>
</svg>