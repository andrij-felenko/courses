<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тотожність Епсилон-Дельта та векторні добутки</text>
<text x="410.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Згортка за спільним індексом i виражає векторний добуток через різницю паралельних і перехресних проєкцій</text>
<rect x="110.0" y="68.0" width="600.0" height="48.0" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="410.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#5b21b6" text-anchor="middle" font-weight="700">∑ᵢ εᵢⱼₖ · εᵢₘₙ = δⱼₘ · δₖₙ − δⱼₙ · δₖₘ</text>
<rect x="60.0" y="135.0" width="330.0" height="195.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="225.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Визначник 2×2 з дельт Кронекера</text>
<line x1="150.0" y1="180.0" x2="150.0" y2="255.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="300.0" y1="180.0" x2="300.0" y2="255.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="190.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">δⱼₘ</text>
<text x="260.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">δⱼₙ</text>
<text x="190.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">δₖₘ</text>
<text x="260.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">δₖₙ</text>
<text x="225.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Головна діагональ: + (δⱼₘ · δₖₙ)</text>
<text x="225.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Побічна діагональ: − (δⱼₙ · δₖₘ)</text>
<rect x="430.0" y="135.0" width="330.0" height="195.0" rx="8" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.2"/>
<text x="595.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Подвійний векторний добуток (BAC-CAB)</text>
<rect x="450.0" y="180.0" width="290.0" height="52.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="595.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">a × (b × c) = b · (a · c) − c · (a · b)</text>
<text x="595.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Зв'язок доданків із символами Кронекера:</text>
<text x="595.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">δⱼₘ · δₖₙ  ⟶  bⱼ · (aₖ · cₖ) = b · (a · c)</text>
<text x="595.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">δⱼₙ · δₖₘ  ⟶  cⱼ · (aₖ · bₖ) = c · (a · b)</text>
</svg>