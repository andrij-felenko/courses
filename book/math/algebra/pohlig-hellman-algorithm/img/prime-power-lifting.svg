<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покрокове відновлення цифр дискретного логарифма у підгрупі порядку pᵉ</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Показник x = z₀ + z₁·p + z₂·p² + … + zₑ₋₁·pᵉ⁻¹  (цифри zⱼ ∈ [0, p-1])</text>
<rect x="45.0" y="103.0" width="170.0" height="73.9" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Крок 0: цифра z₀</tspan><tspan x="130.0" dy="14.3">Піднесення до pᵉ⁻¹</tspan><tspan x="130.0" dy="14.3">(gⁱ)ᵖᵉ⁻¹·ᶻ⁰ = (hⁱ)ᵖᵉ⁻¹</tspan><tspan x="130.0" dy="14.3">Пошук z₀ у групі ⟨γ⟩</tspan></text>
<rect x="291.8" y="103.0" width="156.4" height="73.9" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Крок 1: цифра z₁</tspan><tspan x="370.0" dy="14.3">Ділення на gⁱᶻ⁰</tspan><tspan x="370.0" dy="14.3">Піднесення до pᵉ⁻²</tspan><tspan x="370.0" dy="14.3">Пошук z₁ у групі ⟨γ⟩</tspan></text>
<rect x="525.0" y="103.0" width="170.0" height="73.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Крок e-1: цифра zₑ₋₁</tspan><tspan x="610.0" dy="14.3">Ділення на відомі zⱼ</tspan><tspan x="610.0" dy="14.3">Піднесення до p⁰ = 1</tspan><tspan x="610.0" dy="14.3">Пошук zₑ₋₁ у групі ⟨γ⟩</tspan></text>
<line x1="220.0" y1="140.0" x2="275.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="465.0" y1="140.0" x2="515.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="171.9" y="246.2" width="496.2" height="47.6" rx="6" fill="#faf5ff" stroke="#8e44ad" stroke-width="1.5"/><text x="420.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Незмінна база пошуку: γ = gⁱᵖᵉ⁻¹ (елемент порядку p)</tspan><tspan x="420.0" dy="15.6">Таблиця Baby-Step Giant-Step для бази γ будується лише один раз!</tspan></text>
<line x1="130.0" y1="205.0" x2="300.0" y2="240.0" stroke="#8e44ad" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="370.0" y1="205.0" x2="420.0" y2="240.0" stroke="#8e44ad" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="610.0" y1="205.0" x2="540.0" y2="240.0" stroke="#8e44ad" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кожен крок зводить знаходження однієї p-адичної цифри до задачі розміру p.</text>
<text x="420.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Загальна складність для pᵉ становить O(e · √p) замість непідйомного O(pᵉ/²).</text>
</svg>