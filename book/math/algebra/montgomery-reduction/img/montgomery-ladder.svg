<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від атак за часом: Драбина Монтгомері проти наївного алгоритму</text>
<text x="500.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Усунення розгалужень за таємними бітами ключа для захисту від Simple Power Analysis (SPA)</text>
<rect x="40.0" y="75.0" width="440.0" height="400.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="260.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний Square-and-Multiply (Вразливий)</text>
<rect x="70.0" y="126.2" width="380.0" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Для кожного біта k[i] показника степеня:</tspan><tspan x="260.0" dy="15.6">R = R² mod N (Square)</tspan></text>
<line x1="260.0" y1="180.0" x2="260.0" y2="215.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="213.4" width="380.0" height="63.2" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="260.0" y="233.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Розгалуження if (k[i] == 1):</tspan><tspan x="260.0" dy="15.6">так  →  R = R × A mod N (Multiply)</tspan><tspan x="260.0" dy="15.6">ні   →  пропуск операції</tspan></text>
<line x1="260.0" y1="285.0" x2="260.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="348.1" width="380.0" height="73.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Атака за часом / живленням (SPA):</tspan><tspan x="260.0" dy="14.3">• Біт 0: 1 операція (короткий час, низький струм)</tspan><tspan x="260.0" dy="14.3">• Біт 1: 2 операції (довгий час, високий струм)</tspan><tspan x="260.0" dy="14.3">→ Повний витік таємного ключа!</tspan></text>
<rect x="520.0" y="75.0" width="440.0" height="400.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="740.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Драбина Монтгомері (Константний час)</text>
<rect x="550.0" y="126.2" width="380.0" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Два регістри стану (R₀, R₁):</tspan><tspan x="740.0" dy="15.6">Початково: R₀ = 1, R₁ = A</tspan></text>
<line x1="740.0" y1="180.0" x2="740.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="218.1" width="380.0" height="73.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Для кожного біта k[i] (незалежно від 0 чи 1):</tspan><tspan x="740.0" dy="14.3">якщо k[i] == 0: R₁ = R₀·R₁,  R₀ = R₀²</tspan><tspan x="740.0" dy="14.3">якщо k[i] == 1: R₀ = R₀·R₁,  R₁ = R₁²</tspan><tspan x="740.0" dy="14.3">(Завжди строго 1 множення + 1 піднесення)</tspan></text>
<line x1="740.0" y1="305.0" x2="740.0" y2="340.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="363.1" width="380.0" height="73.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Стійкість до Side-Channel атак:</tspan><tspan x="740.0" dy="14.3">• Однаковий час виконання кожного біта</tspan><tspan x="740.0" dy="14.3">• Однаковий профіль енергоспоживання</tspan><tspan x="740.0" dy="14.3">• Інваріант R₁ - R₀ = A захищає від помилок</tspan></text>
</svg>