<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичне модульне множення проти підходу Монтгомері</text>
<text x="500.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Заміна важкого довгого ділення на побітові зсуви при масових обчисленнях (піднесення до степеня)</text>
<rect x="30.0" y="75.0" width="940.0" height="180.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="60.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Класичний підхід: ділення на кожному кроці</text>
<rect x="70.0" y="135.1" width="120.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вхідні числа</tspan><tspan x="130.0" dy="16.9">A, B</tspan></text>
<line x1="190.0" y1="160.0" x2="240.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250.0" y="135.1" width="140.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Множення цілих</tspan><tspan x="320.0" dy="16.9">T = A × B</tspan></text>
<line x1="390.0" y1="160.0" x2="440.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="128.4" width="200.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Довге ділення на N</tspan><tspan x="560.0" dy="15.6">(T mod N: пошук частки,</tspan><tspan x="560.0" dy="15.6">віднімання з переносом)</tspan></text>
<line x1="660.0" y1="160.0" x2="710.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="135.1" width="160.0" height="49.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Результат кроку</tspan><tspan x="810.0" dy="16.9">C = (A × B) mod N</tspan></text>
<line x1="810.0" y1="205.0" x2="810.0" y2="230.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="810.0" y1="230.0" x2="320.0" y2="230.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="320.0" y1="230.0" x2="320.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Повторюється k разів: кожна операція містить важке довге ділення</text>
<rect x="30.0" y="280.0" width="940.0" height="220.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Підхід Монтгомері: обчислення у видозміненому просторі</text>
<rect x="60.0" y="356.2" width="110.0" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Вхід A, B</tspan><tspan x="115.0" dy="15.6">(числа &lt; N)</tspan></text>
<line x1="170.0" y1="380.0" x2="220.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="343.1" width="150.0" height="73.9" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="305.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Вхідне перетворення</tspan><tspan x="305.0" dy="14.3">(одноразово):</tspan><tspan x="305.0" dy="14.3">ā = A·R mod N</tspan><tspan x="305.0" dy="14.3">b̄ = B·R mod N</tspan></text>
<line x1="380.0" y1="380.0" x2="430.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="455.0" y="343.1" width="240.0" height="73.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Швидка редукція REDC(ā × b̄):</tspan><tspan x="575.0" dy="14.3">1. Множення на сталу N' mod R</tspan><tspan x="575.0" dy="14.3">2. Обнулення молодших бітів</tspan><tspan x="575.0" dy="14.3">3. Зсув праворуч на k бітів (÷ R)</tspan></text>
<line x1="695.0" y1="380.0" x2="745.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="785.0" y="350.2" width="140.0" height="59.6" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="855.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">Вихідне зведення</tspan><tspan x="855.0" dy="14.3">(одноразово):</tspan><tspan x="855.0" dy="14.3">C = REDC(c̄)</tspan></text>
<line x1="575.0" y1="440.0" x2="575.0" y2="465.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="575.0" y1="465.0" x2="490.0" y2="465.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="490.0" y1="465.0" x2="490.0" y2="440.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="490.0" y1="440.0" x2="490.0" y2="425.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Цикл піднесення до степеня: сотні множень без жодного ділення</text>
</svg>