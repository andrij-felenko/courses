<text x="370.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(3, y₃)</text>
<line x1="250.0" y1="235.0" x2="305.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.0" y="315.0" width="130.0" height="40.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="370.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Учасник n</text>
<text x="370.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">(n, yₙ)</text>
<line x1="250.0" y1="235.0" x2="305.0" y2="335.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="590.0" y="160.0" width="210.0" height="150.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="695.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Відновлення</text>
<line x1="600.0" y1="198.0" x2="790.0" y2="198.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="695.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерполяція Лагранжа</text>
<text x="695.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">S = ∑ yᵢ · ℓᵢ(0) mod p</text>
<text x="695.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Потрібно k із n часток</text>
<line x1="435.0" y1="50.0" x2="590.0" y2="235.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="435.0" y1="135.0" x2="590.0" y2="235.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="435.0" y1="335.0" x2="590.0" y2="235.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Будь-які k активних учасників відновлюють секрет S.</text>
<text x="420.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Менше ніж k учасників знають про S не більше, ніж сторонній спостерігач.</text>
</svg>