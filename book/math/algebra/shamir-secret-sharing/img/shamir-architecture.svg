<text x="370.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">(2, y₂)</text>
<line x1="250.0" y1="235.0" x2="305.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.0" y="200.0" width="130.0" height="40.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/>
