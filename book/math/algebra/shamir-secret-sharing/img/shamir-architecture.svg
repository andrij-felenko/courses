<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порогова схема розділення секрету Шаміра (k, n)</text>
<rect x="40.0" y="160.0" width="210.0" height="150.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="145.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дилер (Dealer)</text>
<line x1="50.0" y1="198.0" x2="240.0" y2="198.0" stroke="#333333" stroke-width="1.0"/>
<text x="145.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Секрет S = f(0)</text>
<text x="145.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">f(x) = S + a₁x + ... mod p</text>
<text x="145.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">a₁, ..., aₖ₋₁ ~ CSPRNG</text>
<text x="370.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">•  •  •</text>
<rect x="305.0" y="30.0" width="130.0" height="40.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.6"/>
