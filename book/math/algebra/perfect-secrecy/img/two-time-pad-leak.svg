<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="67.4" y="39.3" width="125.1" height="41.3" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Повідомлення M₁</tspan><tspan x="130.0" dy="14.3">«ATTACK_AT_DAWN»</tspan></text>
<rect x="260.6" y="39.3" width="138.8" height="41.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="330.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Спільний ключ K</tspan><tspan x="330.0" dy="14.3">(випадковий потік)</tspan></text>
<rect x="517.7" y="39.3" width="104.7" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Шифротекст C₁</tspan><tspan x="570.0" dy="14.3">C₁ = M₁ ⊕ K</tspan></text>
<line x1="215.0" y1="60.0" x2="255.0" y2="60.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="405.0" y1="60.0" x2="495.0" y2="60.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="67.4" y="129.3" width="125.1" height="41.3" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Повідомлення M₂</tspan><tspan x="130.0" dy="14.3">«RETREAT_ACROSS»</tspan></text>
<rect x="260.6" y="129.3" width="138.8" height="41.3" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="330.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Спільний ключ K</tspan><tspan x="330.0" dy="14.3">(ПОВТОРНЕ ВЖИТТЯ!)</tspan></text>
<rect x="517.7" y="129.3" width="104.7" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Шифротекст C₂</tspan><tspan x="570.0" dy="14.3">C₂ = M₂ ⊕ K</tspan></text>
<line x1="215.0" y1="150.0" x2="240.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="150.0" x2="495.0" y2="150.0" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="60.0" x2="680.0" y2="60.0" stroke="#dc2626" stroke-width="1.8"/>
<line x1="680.0" y1="60.0" x2="680.0" y2="240.0" stroke="#dc2626" stroke-width="1.8"/>
<line x1="680.0" y1="240.0" x2="660.0" y2="240.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="180.0" x2="570.0" y2="215.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="443.1" y="225.1" width="213.8" height="69.9" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="550.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Криптоаналітик обчислює:</tspan><tspan x="550.0" dy="14.3">C₁ ⊕ C₂ = (M₁ ⊕ K) ⊕ (M₂ ⊕ K)</tspan><tspan x="550.0" dy="14.3">= M₁ ⊕ M₂ ⊕ (K ⊕ K)</tspan><tspan x="550.0" dy="14.3">= M₁ ⊕ M₂</tspan></text>
<rect x="63.8" y="227.5" width="272.5" height="65.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="200.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle"><tspan x="200.0" dy="0.0">Атака Crib Dragging:</tspan><tspan x="200.0" dy="13.0">Підставляємо шаблон «_THE_» або «_AND_»</tspan><tspan x="200.0" dy="13.0">Якщо (M₁ ⊕ M₂) ⊕ «_THE_» дає змістовне слово,</tspan><tspan x="200.0" dy="13.0">розкриваються фрагменти ОБОХ повідомлень!</tspan></text>
<line x1="415.0" y1="260.0" x2="360.0" y2="260.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.7" y="333.5" width="598.5" height="23.0" rx="6" fill="#eafaf1" stroke="#16a34a" stroke-width="1.5"/><text x="380.0" y="348.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Ключ K повністю самознищується (K ⊕ K = 0). Досконала таємність миттєво падає до нуля.</tspan></text>
</svg>