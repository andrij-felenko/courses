<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="16.0" width="820.0" height="38.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Два погляди на напіврешітку: алгебраїчний та порядковий ізоморфізм</tspan></text>
<rect x="30.0" y="75.0" width="370.0" height="325.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<rect x="45.0" y="90.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="112.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Алгебраїчна напіврешітка (S, ⋆)</tspan></text>
<rect x="45.0" y="138.0" width="340.0" height="140.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="215.0" y="171.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">1. Асоціативність:</tspan><tspan x="215.0" dy="16.2">   (a ⋆ b) ⋆ c = a ⋆ (b ⋆ c)</tspan><tspan x="215.0" dy="16.2">2. Комутативність:</tspan><tspan x="215.0" dy="16.2">   a ⋆ b = b ⋆ a</tspan><tspan x="215.0" dy="16.2">3. Ідемпотентність:</tspan><tspan x="215.0" dy="16.2">   a ⋆ a = a</tspan></text>
<rect x="45.0" y="290.0" width="340.0" height="95.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Операція ⋆ є бінарним згортком.</tspan><tspan x="215.0" dy="15.6">Порядок обчислень та повтори</tspan><tspan x="215.0" dy="15.6">аргументів не змінюють результат.</tspan></text>
<rect x="460.0" y="75.0" width="370.0" height="325.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<rect x="475.0" y="90.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="112.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Порядкова напіврешітка (S, ≤)</tspan></text>
<rect x="475.0" y="138.0" width="340.0" height="140.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="645.0" y="182.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">1. Частковий порядок ≤:</tspan><tspan x="645.0" dy="15.0">   рефлексивний, антисиметричний, транзитивний</tspan><tspan x="645.0" dy="15.0">2. Точні грані для будь-якої пари {a, b}:</tspan><tspan x="645.0" dy="15.0">   • Нижня (Meet, ⊓): інфімум inf{a, b}</tspan><tspan x="645.0" dy="15.0">   • Верхня (Join, ⊔): супремум sup{a, b}</tspan></text>
<rect x="475.0" y="290.0" width="340.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Елементи утворюють ієрархію.</tspan><tspan x="645.0" dy="15.6">Будь-які два елементи мають єдину</tspan><tspan x="645.0" dy="15.6">найближчу спільну грань у посеті.</tspan></text>
<rect x="375.0" y="185.0" width="110.0" height="100.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/>
<line x1="365.0" y1="210.0" x2="465.0" y2="210.0" stroke="#e67e22" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="465.0" y1="255.0" x2="365.0" y2="255.0" stroke="#e67e22" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle" font-weight="700">a ≤ b ⇔ a ⋆ b = a</text>
<text x="430.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle" font-weight="700">a ⋆ b = inf{a, b}</text>
<text x="430.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">ІЗОМОРФІЗМ</text>
</svg>