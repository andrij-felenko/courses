<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="14.0" width="840.0" height="36.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="37.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Join-напіврешітка як основа сильної кінцевої узгодженості (CRDT / SEC)</tspan></text>
<rect x="25.0" y="60.0" width="430.0" height="385.0" rx="8" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<rect x="35.0" y="70.0" width="410.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="88.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Простір станів G-Counter: s = ⟨A, B⟩</tspan></text>
<rect x="155.0" y="365.0" width="170.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="387.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Початковий стан ⊥</tspan><tspan x="240.0" dy="15.0">s₀ = ⟨A: 0, B: 0⟩</tspan></text>
<rect x="45.0" y="230.0" width="160.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="125.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">Репліка A (стан s₁)</tspan><tspan x="125.0" dy="15.0">s₁ = ⟨A: 3, B: 1⟩</tspan></text>
<rect x="255.0" y="230.0" width="160.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="335.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">Репліка B (стан s₂)</tspan><tspan x="335.0" dy="15.0">s₂ = ⟨A: 1, B: 4⟩</tspan></text>
<rect x="100.0" y="115.0" width="280.0" height="68.0" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/><text x="240.0" y="137.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Точна верхня межа (LUB, Join ⊔)</tspan><tspan x="240.0" dy="15.6">s₁ ⊔ s₂ = ⟨max(3,1), max(1,4)⟩</tspan><tspan x="240.0" dy="15.6">= ⟨A: 3, B: 4⟩</tspan></text>
<line x1="210.0" y1="365.0" x2="145.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="270.0" y1="365.0" x2="315.0" y2="290.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="145.0" y1="230.0" x2="195.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="315.0" y1="230.0" x2="275.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">s₀ ≤ s₁</text>
<text x="320.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">s₀ ≤ s₂</text>
<text x="140.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">s₁ ≤ s₁⊔s₂</text>
<text x="325.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">s₂ ≤ s₁⊔s₂</text>
<rect x="470.0" y="60.0" width="385.0" height="385.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<rect x="485.0" y="72.0" width="355.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="662.5" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="662.5" dy="0.0">Алгебраїчні гарантії напіврешітки</tspan></text>
<rect x="485.0" y="112.0" width="355.0" height="68.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">1. Комутативність: a ⊔ b = b ⊔ a</text>
<text x="500.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Пакетна стійкість до перестановки.</text>
<text x="500.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Не має значення, яка репліка прийшла першою.</text>
<rect x="485.0" y="188.0" width="355.0" height="68.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2. Асоціативність: (a ⊔ b) ⊔ c = a ⊔ (b ⊔ c)</text>
<text x="500.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Стійкість до довільного групування.</text>
<text x="500.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Батчі та проміжні ретрансляції безпечні.</text>
<rect x="485.0" y="264.0" width="355.0" height="68.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Ідемпотентність: a ⊔ a = a</text>
<text x="500.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Стійкість до дублювання повідомлень.</text>
<text x="500.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Повторні мережеві retry не спотворюють стан.</text>
<rect x="485.0" y="340.0" width="355.0" height="68.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="500.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">4. Монотонність: s ≤ s ⊔ Δs</text>
<text x="500.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Теорема CALM (Монтана / Геллерштейн).</text>
<text x="500.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Стан реплік рухається лише вгору порядком ≤.</text>
</svg>