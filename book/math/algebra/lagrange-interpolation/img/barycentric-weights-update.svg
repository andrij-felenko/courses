<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
<rect x="0.0" y="0.0" width="760.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="87.9" y="8.0" width="584.2" height="34.0" rx="6" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/><text x="380.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Структура обчислень у барицентричній формі Лагранжа другої родини</tspan></text>
<rect x="30.0" y="65.0" width="220.0" height="90.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Попередні ваги wₖ</text>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">wₖ = 1 / ∏ (xₖ - xⱼ)</text>
<text x="140.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Складність: O(n²)</text>
<rect x="270.0" y="65.0" width="220.0" height="90.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="380.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Оцінка P(x) у точці x</text>
<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">P(x) = ∑ [wₖyₖ/(x-xₖ)] / ∑ [wₖ/(x-xₖ)]</text>
<text x="380.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Складність: O(n) на точку!</text>
<rect x="510.0" y="65.0" width="220.0" height="90.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="620.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">3. Додавання вузла xₙ₊₁</text>
<text x="620.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">wₖ′ = wₖ / (xₖ - xₙ₊₁)</text>
<text x="620.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="middle">Складність оновлення: O(n)</text>
<line x1="250.0" y1="110.0" x2="270.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="130.0" x2="490.0" y2="130.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="195.0" width="660.0" height="100.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="380.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Ключова перевага другої барицентричної форми:</tspan><tspan x="380.0" dy="14.3">1. Скорочення спільного множника ω(x) робить чисельну оцінку високостійкою (чисельна стабільність за Гайемом).</tspan><tspan x="380.0" dy="14.3">2. Знаменник суми інваріантний до зсуву значень yₖ, що дозволяє перевикористовувати ваги wₖ для будь-яких наборів даних.</tspan></text>
</svg>