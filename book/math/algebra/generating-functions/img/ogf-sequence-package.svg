<text x="270.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">a₀</text>
<text x="270.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n = 0</text>
<line x1="270.0" y1="122.0" x2="270.0" y2="175.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="3 3"/>
