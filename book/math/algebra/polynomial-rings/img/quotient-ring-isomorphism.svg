<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фактор-кільце K[x]/(f(x)): від поліномів до розширення полів</text>
<rect x="40.0" y="65.0" width="230.0" height="345.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="155.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільце K[x]</text>
<text x="155.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нескінченновимірний простір</text>
<rect x="60.0" y="145.0" width="190.0" height="40.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">g(x) = a₀ + a₁x + a₂x² + ...</text>
<rect x="60.0" y="205.0" width="190.0" height="60.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="155.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Головний ідеал I = (f(x))</text>
<text x="155.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">{ h(x) · f(x) | h(x) ∈ K[x] }</text>
<rect x="60.0" y="285.0" width="190.0" height="45.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Суміжні класи (косети):</text>
<text x="155.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">g(x) + (f(x))</text>
<line x1="280.0" y1="235.0" x2="340.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="310.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">π : mod f(x)</text>
<rect x="350.0" y="65.0" width="220.0" height="345.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="460.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фактор-кільце K[x]/(f(x))</text>
<text x="460.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Канонічні представники: r(x)</text>
<rect x="370.0" y="145.0" width="180.0" height="80.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="460.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">r(x) = c₀ + c₁x + ... + cₙ₋₁xⁿ⁻¹</text>
<text x="460.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">deg(r) &lt; deg(f) = n</text>
<text x="460.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">dim_K = n</text>
<rect x="370.0" y="245.0" width="180.0" height="75.0" rx="4" fill="#fefce8" stroke="#ca8a04" stroke-width="1.0"/>
<text x="460.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Множення в факторі:</text>
<text x="460.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle">(r₁ · r₂) mod f(x)</text>
<text x="460.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">f(x) ≡ 0</text>
<line x1="580.0" y1="190.0" x2="630.0" y2="145.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="280.0" x2="630.0" y2="325.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="632.4" y="110.0" width="185.3" height="69.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="725.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">f(x) — незвідний:</tspan><tspan x="725.0" dy="14.3">(f(x)) — максимальний ідеал</tspan><tspan x="725.0" dy="14.3">K[x]/(f(x)) ≅ K(α) — ПОЛЕ!</tspan><tspan x="725.0" dy="14.3">(Приклад: ℝ[x]/(x²+1) ≅ ℂ)</tspan></text>
<rect x="623.0" y="290.1" width="204.1" height="69.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="725.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">f(x) = g(x)·h(x) — розкладний:</tspan><tspan x="725.0" dy="14.3">(f(x)) не максимальний</tspan><tspan x="725.0" dy="14.3">Є дільники нуля: g·h ≡ 0</tspan><tspan x="725.0" dy="14.3">(Приклад: ℝ[x]/(x²−1) ≅ ℝ × ℝ)</tspan></text>
</svg>