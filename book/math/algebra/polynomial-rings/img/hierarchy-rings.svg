<text x="420.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Однозначний розклад на множники: ℤ[x], K[x₁, ..., xₙ]</text>
