<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема евклідового ділення в K[x]: f(x) = q(x)·g(x) + r(x)</text>
<rect x="88.4" y="73.4" width="143.1" height="63.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Ділене: f(x)</tspan><tspan x="160.0" dy="15.6">степінь deg(f) = n</tspan><tspan x="160.0" dy="15.6">старший член aₙ·xⁿ</tspan></text>
<rect x="574.8" y="73.4" width="170.5" height="63.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Дільник: g(x)</tspan><tspan x="660.0" dy="15.6">степінь deg(g) = m</tspan><tspan x="660.0" dy="15.6">старший член bₘ·xᵐ ≠ 0</tspan></text>
<rect x="278.3" y="173.6" width="263.4" height="82.8" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="410.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ітерація редукції старшого монома:</tspan><tspan x="410.0" dy="15.6">monom = (aₙ / bₘ) · xⁿ⁻ᵐ</tspan><tspan x="410.0" dy="15.6">f₁(x) = f(x) − monom · g(x)</tspan><tspan x="410.0" dy="15.6">Зменшення степеня: deg(f₁) &lt; deg(f)</tspan></text>
<line x1="260.0" y1="105.0" x2="310.0" y2="180.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560.0" y1="105.0" x2="510.0" y2="180.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410.0" y1="275.0" x2="410.0" y2="320.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поки deg(fₖ) ≥ deg(g)</text>
<rect x="113.7" y="333.4" width="252.6" height="63.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Частка: q(x)</tspan><tspan x="240.0" dy="15.6">сума всіх мономиків (aₖ / bₘ)·xᵏ⁻ᵐ</tspan><tspan x="240.0" dy="15.6">deg(q) = deg(f) − deg(g)</tspan></text>
<rect x="474.2" y="333.4" width="211.5" height="63.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Остача: r(x)</tspan><tspan x="580.0" dy="15.6">кінцевий залишок</tspan><tspan x="580.0" dy="15.6">deg(r) &lt; deg(g) або r(x) = 0</tspan></text>
<line x1="360.0" y1="320.0" x2="290.0" y2="335.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460.0" y1="320.0" x2="530.0" y2="335.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>