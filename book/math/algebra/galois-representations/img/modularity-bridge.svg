<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="127.6" y="13.5" width="664.8" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="34.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Теорема модулярності: взаємно однозначна відповідність трьох математичних світів</tspan></text>
<rect x="81.9" y="92.8" width="176.2" height="94.4" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.0"/><text x="170.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">АЛГЕБРАЇЧНА ГЕОМЕТРІЯ</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Еліптична крива E / Q</tspan><tspan x="170.0" dy="15.6">y² = x³ + Ax + B</tspan><tspan x="170.0" dy="15.6">Кондуктор N</tspan></text>
<rect x="62.8" y="193.8" width="214.4" height="102.5" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Кількість точок редукції:</tspan><tspan x="170.0" dy="14.3">#E(F_p) = p + 1 − a_p</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Дефект точок:</tspan><tspan x="170.0" dy="14.3">a_p(E) = p + 1 − #E(F_p)</tspan><tspan x="170.0" dy="14.3">(Нерівність Гассе: |a_p| ≤ 2√p)</tspan></text>
<rect x="360.7" y="92.8" width="198.6" height="94.4" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="2.0"/><text x="460.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">АРИФМЕТИКА ТА АЛГЕБРА</tspan><tspan x="460.0" dy="15.6"></tspan><tspan x="460.0" dy="15.6">Зображення Галуа</tspan><tspan x="460.0" dy="15.6">ρ_{E,ℓ}: G_Q → GL₂(Q_ℓ)</tspan><tspan x="460.0" dy="15.6">Нерозгалужене поза ℓ · N</tspan></text>
<rect x="362.2" y="193.8" width="195.6" height="102.5" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Слід елемента Фробеніуса:</tspan><tspan x="460.0" dy="14.3">Tr(ρ_{E,ℓ}(Frob_p)) = a_p(E)</tspan><tspan x="460.0" dy="14.3"></tspan><tspan x="460.0" dy="14.3">Характеристичний многочлен:</tspan><tspan x="460.0" dy="14.3">det(I − T · ρ(Frob_p)) =</tspan><tspan x="460.0" dy="14.3">= 1 − a_p T + p T²</tspan></text>
<rect x="639.6" y="92.8" width="220.9" height="94.4" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="2.0"/><text x="750.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">КОМПЛЕКСНИЙ АНАЛІЗ</tspan><tspan x="750.0" dy="15.6"></tspan><tspan x="750.0" dy="15.6">Параболічна модулярна форма</tspan><tspan x="750.0" dy="15.6">f(z) ∈ S₂(Γ₀(N))</tspan><tspan x="750.0" dy="15.6">Рівень N, вага 2</tspan></text>
<rect x="646.0" y="193.8" width="208.1" height="102.5" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Ряд Фур'є (q-розклад):</tspan><tspan x="750.0" dy="14.3">f(z) = ∑_{n=1}^∞ a_n(f) qⁿ</tspan><tspan x="750.0" dy="14.3">q = e^{2π i z}</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">Власна форма операторів Гекке:</tspan><tspan x="750.0" dy="14.3">T_p(f) = a_p(f) · f</tspan></text>
<line x1="275.0" y1="140.0" x2="345.0" y2="140.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="345.0" y1="140.0" x2="275.0" y2="140.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="575.0" y1="140.0" x2="645.0" y2="140.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="645.0" y1="140.0" x2="575.0" y2="140.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="140.0" y="340.0" width="640.0" height="95.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.0"/>
<rect x="208.2" y="349.0" width="503.6" height="32.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="460.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">ГОЛОВНА ТОТОЖНІСТЬ МОДУЛЯРНОСТІ:  a_p(E) = Tr(ρ(Frob_p)) = a_p(f)</tspan></text>
<text x="460.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">L-функція кривої E дорівнює L-функції модулярної форми f:</tspan><tspan x="460.0" dy="14.3">L(E, s) = ∑ a_n(E) · n^{-s}  ≡  ∑ a_n(f) · n^{-s} = L(f, s)</tspan></text>
</svg>