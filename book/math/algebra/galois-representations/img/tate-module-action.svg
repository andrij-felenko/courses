<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="119.8" y="13.5" width="600.3" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="34.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Модуль Тейта T_ℓ(E): проєктивна границя точок кручення еліптичної кривої</tspan></text>
<rect x="171.9" y="66.2" width="496.2" height="47.6" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.0"/><text x="420.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Модуль Тейта:  T_ℓ(E) = lim_inv E[ℓⁿ] ≅ Z_ℓ²</tspan><tspan x="420.0" dy="15.6">Раціональний модуль:  V_ℓ(E) = T_ℓ(E) ⊗ Q_ℓ ≅ Q_ℓ²  (2-вимірний)</tspan></text>
<line x1="420.0" y1="125.0" x2="420.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="198.6" y="164.5" width="442.8" height="31.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Кручення порядку ℓ³:   E[ℓ³] ≅ (Z / ℓ³Z)²   [група з ℓ⁶ точок]</tspan></text>
<line x1="420.0" y1="200.0" x2="420.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">множення на ℓ</text>
<rect x="198.6" y="239.5" width="442.8" height="31.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Кручення порядку ℓ²:   E[ℓ²] ≅ (Z / ℓ²Z)²   [група з ℓ⁴ точок]</tspan></text>
<line x1="420.0" y1="275.0" x2="420.0" y2="310.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">множення на ℓ</text>
<rect x="174.7" y="314.5" width="490.6" height="31.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="2.0"/><text x="420.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Кручення порядку ℓ:    E[ℓ] ≅ (Z / ℓZ)²     [група з ℓ² точок над Q̄]</tspan></text>
<rect x="60.0" y="170.0" width="220.0" height="170.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.8"/>
<rect x="78.2" y="179.5" width="183.7" height="31.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Дія автоморфізму σ ∈ G_Q</tspan></text>
<text x="152.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">σ зберігає закон додавання на E:</tspan><tspan x="152.0" dy="13.0">σ(P + Q) = σ(P) + σ(Q)</tspan><tspan x="152.0" dy="13.0"></tspan><tspan x="152.0" dy="13.0">σ комутує з множенням на ℓ:</tspan><tspan x="152.0" dy="13.0">σ(ℓ · P) = ℓ · σ(P)</tspan></text>
<line x1="280.0" y1="255.0" x2="330.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="560.0" y="170.0" width="220.0" height="170.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<rect x="564.5" y="179.5" width="211.0" height="31.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Матриця оператора ρ_{E,ℓ}(σ)</tspan></text>
<text x="682.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">У базисі {P, Q} модуля T_ℓ(E):</tspan><tspan x="682.0" dy="13.0"></tspan><tspan x="682.0" dy="13.0">ρ_{E,ℓ}(σ) = [ a  b ]</tspan><tspan x="682.0" dy="13.0">             [ c  d ]</tspan><tspan x="682.0" dy="13.0">де a, b, c, d ∈ Z_ℓ</tspan></text>
<line x1="510.0" y1="255.0" x2="560.0" y2="255.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="14.4" y="399.5" width="811.1" height="31.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="420.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Спарювання Вейля: e_ℓ(σ P, σ Q) = e_ℓ(P, Q)^{χ_ℓ(σ)}   ==&gt;   Визначник: det(ρ_{E,ℓ}(σ)) = χ_ℓ(σ) (круговий характер)</tspan></text>
</svg>