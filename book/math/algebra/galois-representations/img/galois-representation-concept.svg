<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="107.6" y="13.5" width="664.8" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="34.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Концепція зображення Галуа: перехід від абстрактних симетрій до лінійної алгебри</tspan></text>
<rect x="32.4" y="82.8" width="295.3" height="94.4" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.0"/><text x="180.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Абсолютна група Галуа G_Q = Gal(Q̄/Q)</tspan><tspan x="180.0" dy="15.6"></tspan><tspan x="180.0" dy="15.6">Нескінченна, неабелева,</tspan><tspan x="180.0" dy="15.6">проскінченна група симетрій</tspan><tspan x="180.0" dy="15.6">всіх алгебраїчних чисел</tspan></text>
<rect x="72.8" y="203.1" width="214.4" height="73.9" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="180.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Топологія Крулля</tspan><tspan x="180.0" dy="14.3">(компактна, тотально незв'язна)</tspan><tspan x="180.0" dy="14.3">Базис околів: Gal(Q̄/K)</tspan><tspan x="180.0" dy="14.3">для скінченних K / Q</tspan></text>
<rect x="88.5" y="315.2" width="183.0" height="59.6" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="180.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Елементи: автоморфізми σ</tspan><tspan x="180.0" dy="14.3">Спряжені класи:</tspan><tspan x="180.0" dy="14.3">елементи Фробеніуса Frob_p</tspan></text>
<line x1="310.0" y1="130.0" x2="530.0" y2="130.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="324.8" y="82.3" width="190.5" height="45.3" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.8"/><text x="420.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Неперервний гомоморфізм ρ</tspan><tspan x="420.0" dy="14.3">ρ(σ · τ) = ρ(σ) · ρ(τ)</tspan></text>
<rect x="338.4" y="195.9" width="163.2" height="88.2" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="420.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ЛІНЕАРИЗАЦІЯ ДІЇ</tspan><tspan x="420.0" dy="14.3"></tspan><tspan x="420.0" dy="14.3">Невідомі симетрії σ</tspan><tspan x="420.0" dy="14.3">перетворюються на</tspan><tspan x="420.0" dy="14.3">конкретні матриці M_σ</tspan></text>
<rect x="577.0" y="82.8" width="206.0" height="94.4" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="2.0"/><text x="680.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Група лінійних операторів</tspan><tspan x="680.0" dy="15.6">GL_n(Q_ℓ)  або  GL_n(C)</tspan><tspan x="680.0" dy="15.6"></tspan><tspan x="680.0" dy="15.6">Оборотні матриці n × n</tspan><tspan x="680.0" dy="15.6">над ℓ-адичним полем Q_ℓ</tspan></text>
<rect x="576.0" y="203.1" width="208.1" height="73.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Векторний простір V ≅ Q_ℓⁿ</tspan><tspan x="680.0" dy="14.3"></tspan><tspan x="680.0" dy="14.3">• n = 1: Круговий характер χ_ℓ</tspan><tspan x="680.0" dy="14.3">• n = 2: Модуль Тейта V_ℓ(E)</tspan></text>
<rect x="579.1" y="308.1" width="201.8" height="73.9" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="680.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Лінійні інваріанти оператора:</tspan><tspan x="680.0" dy="14.3">• Слід Tr(ρ(σ))</tspan><tspan x="680.0" dy="14.3">• Визначник det(ρ(σ))</tspan><tspan x="680.0" dy="14.3">• Характеристичний многочлен</tspan></text>
<line x1="530.0" y1="345.0" x2="310.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.2" y="357.0" width="219.5" height="56.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="420.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Сліди матриць Tr(ρ(Frob_p))</tspan><tspan x="420.0" dy="13.0">однозначно відновлюють зображення ρ</tspan><tspan x="420.0" dy="13.0">(Теорема щільності Чеботарьова)</tspan></text>
</svg>