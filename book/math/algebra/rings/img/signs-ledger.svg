<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл праці: де місток-дистрибутивність, а де група за додаванням</text>
<rect x="24.0" y="52.0" width="176.0" height="44.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.6"/><text x="112.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">Наслідок</tspan></text>
<rect x="208.0" y="52.0" width="384.0" height="44.0" rx="6" fill="#f6cfa0" stroke="#e67e22" stroke-width="1.6"/><text x="400.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Крок дистрибутивності (місток)</tspan></text>
<rect x="600.0" y="52.0" width="356.0" height="44.0" rx="6" fill="#b7e6cd" stroke="#27ae60" stroke-width="1.6"/><text x="778.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="778.0" dy="0.0">Крок групи за додаванням</tspan></text>
<rect x="24.0" y="104.0" width="176.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="112.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">a·0 = 0</tspan></text>
<rect x="208.0" y="104.0" width="384.0" height="68.0" rx="6" fill="#fdf1e5" stroke="#e67e22" stroke-width="1.4"/><text x="400.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">0 = 0 + 0, розкрити дужки:</tspan><tspan x="400.0" dy="18.2">a·0 = a·0 + a·0</tspan></text>
<rect x="600.0" y="104.0" width="356.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="778.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">скоротити зайве a·0</tspan><tspan x="778.0" dy="18.2">(лема скорочення)</tspan></text>
<rect x="24.0" y="180.0" width="176.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="112.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">(−a)·b = −(a·b)</tspan></text>
<rect x="208.0" y="180.0" width="384.0" height="68.0" rx="6" fill="#fdf1e5" stroke="#e67e22" stroke-width="1.4"/><text x="400.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">винести спільне ·b:</tspan><tspan x="400.0" dy="18.2">a·b + (−a)·b = 0·b = 0</tspan></text>
<rect x="600.0" y="180.0" width="356.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="778.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">сума = 0 → це −(a·b)</tspan><tspan x="778.0" dy="18.2">(єдиність протилежного)</tspan></text>
<rect x="24.0" y="256.0" width="176.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="112.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">(−a)·(−b) = a·b</tspan></text>
<rect x="208.0" y="256.0" width="384.0" height="68.0" rx="6" fill="#fdf1e5" stroke="#e67e22" stroke-width="1.4"/><text x="400.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">знакова теорема двічі:</tspan><tspan x="400.0" dy="18.2">−(a·(−b)) = −(−(a·b))</tspan></text>
<rect x="600.0" y="256.0" width="356.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="778.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">−(−x) = x при x = a·b</tspan><tspan x="778.0" dy="18.2">(єдиність протилежного)</tspan></text>
<rect x="24.0" y="332.0" width="176.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="112.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">a·(b − c) = a·b − a·c</tspan></text>
<rect x="208.0" y="332.0" width="384.0" height="68.0" rx="6" fill="#fdf1e5" stroke="#e67e22" stroke-width="1.4"/><text x="400.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">b − c = b + (−c), далі</tspan><tspan x="400.0" dy="18.2">ліва дистрибутивність</tspan></text>
<rect x="600.0" y="332.0" width="356.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="778.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="778.0" dy="0.0">a·(−c) = −(a·c)</tspan><tspan x="778.0" dy="18.2">(єдиність протилежного)</tspan></text>
</svg>