<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження поняття кільця: майже 80 років від біди до означення</text>
<line x1="45.0" y1="232.0" x2="1011.0" y2="232.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="1011.0" y1="232.0" x2="1031.0" y2="232.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1039.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час</text>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">≈1846</text>
<line x1="150.0" y1="226.0" x2="150.0" y2="202.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="59.0" y="118.0" width="182.0" height="84.0" rx="7" fill="#eceff1" stroke="#6b7280" stroke-width="2.0"/>
<text x="150.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">КУММЕР</text>
<text x="150.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">«ідеальні числа»:</tspan><tspan x="150.0" dy="15.2">вигадані дільники —</tspan><tspan x="150.0" dy="15.2">рятівна ідея</tspan></text>
<circle cx="150.0" cy="232.0" r="7.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/>
<text x="340.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1871</text>
<line x1="340.0" y1="238.0" x2="340.0" y2="262.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="249.0" y="262.0" width="182.0" height="84.0" rx="7" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="340.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДЕДЕКІНД</text>
<text x="340.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">ідеали як множини</tspan><tspan x="340.0" dy="15.2">+ сам об'єкт</tspan><tspan x="340.0" dy="15.2">(звав «порядок»)</tspan></text>
<circle cx="340.0" cy="232.0" r="7.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="530.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1897</text>
<line x1="530.0" y1="226.0" x2="530.0" y2="202.0" stroke="#c0392b" stroke-width="1.4"/>
<rect x="439.0" y="134.0" width="182.0" height="68.0" rx="7" fill="#fff6e6" stroke="#c0392b" stroke-width="2.0"/>
<text x="530.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГІЛЬБЕРТ</text>
<text x="530.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">слово «Zahlring» —</tspan><tspan x="530.0" dy="15.2">тільки назва</tspan></text>
<circle cx="530.0" cy="232.0" r="7.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="720.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1915 · 1917</text>
<line x1="720.0" y1="238.0" x2="720.0" y2="262.0" stroke="#2457d6" stroke-width="1.4"/>
<rect x="629.0" y="262.0" width="182.0" height="68.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="720.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ФРЕНКЕЛЬ · СОНО</text>
<text x="720.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">перші аксіоми,</tspan><tspan x="720.0" dy="15.2">та задорогі</tspan></text>
<circle cx="720.0" cy="232.0" r="7.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<text x="910.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1921</text>
<line x1="910.0" y1="226.0" x2="910.0" y2="202.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="819.0" y="134.0" width="182.0" height="68.0" rx="7" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="910.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">НЕТЕР</text>
<text x="910.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">аксіоми, які</tspan><tspan x="910.0" dy="15.2">лишилися й досі</tspan></text>
<circle cx="910.0" cy="232.0" r="7.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="530.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Структуру вивчали понад 20 років безіменно — назва Гільберта прийшла аж посередині шляху.</text>
</svg>