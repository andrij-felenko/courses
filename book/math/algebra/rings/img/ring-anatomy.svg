<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільце: два поверхи на спільній множині R</text>
<rect x="40.0" y="62.0" width="350.0" height="58.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="215.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">ДОДАВАННЯ  (R, +)</tspan><tspan x="215.0" dy="22.1">абелева група</tspan></text>
<rect x="40.0" y="132.0" width="350.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="215.0" y="157.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">замкненість:  a + b ∈ R</tspan></text>
<rect x="40.0" y="186.0" width="350.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="215.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">асоціативність:  (a+b)+c = a+(b+c)</tspan></text>
<rect x="40.0" y="240.0" width="350.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="215.0" y="265.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">нейтральний нуль:  a + 0 = a</tspan></text>
<rect x="40.0" y="294.0" width="350.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="215.0" y="319.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">протилежний:  a + (−a) = 0</tspan></text>
<rect x="40.0" y="348.0" width="350.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="215.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">комутативність:  a + b = b + a</tspan></text>
<rect x="470.0" y="62.0" width="350.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="645.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">МНОЖЕННЯ  (R, ·)</tspan><tspan x="645.0" dy="22.1">моноїд</tspan></text>
<rect x="470.0" y="132.0" width="350.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="645.0" y="157.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">замкненість:  a · b ∈ R</tspan></text>
<rect x="470.0" y="186.0" width="350.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="645.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">асоціативність:  (a·b)·c = a·(b·c)</tspan></text>
<rect x="470.0" y="240.0" width="350.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="645.0" y="265.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">одиниця:  a · 1 = 1 · a = a</tspan></text>
<text x="645.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ні комутативності, ні ділення — не вимагаємо</text>
<rect x="40.0" y="426.0" width="780.0" height="56.0" rx="8" fill="#fff6e6" stroke="#c0392b" stroke-width="2.0"/>
<text x="430.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">НЕСУЧА БАЛКА — дистрибутивність</text>
<text x="430.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">a·(b + c) = a·b + a·c        (b + c)·a = b·a + c·a</text>
<line x1="215.0" y1="402.0" x2="215.0" y2="426.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="645.0" y1="282.0" x2="645.0" y2="426.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
</svg>