<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 805.98 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="805.98" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="345.0" height="320.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.0"/>
<text x="192.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підпростір U ⊂ V (dim U = 1)</text>
<text x="192.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Пряма лінія через 0 у площині V</text>
<line x1="40.0" y1="175.0" x2="340.0" y2="175.0" stroke="#e5e7eb" stroke-width="1.0"/>
<line x1="192.0" y1="260.0" x2="192.0" y2="90.0" stroke="#e5e7eb" stroke-width="1.0"/>
<circle cx="192.0" cy="175.0" r="3.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="182.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<line x1="70.0" y1="235.0" x2="314.0" y2="115.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="320.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">U</text>
<line x1="192.0" y1="175.0" x2="262.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="237.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">u ∈ U</text>
<text x="192.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вектори, що лежать уздовж прямої U</text>
<rect x="395.0" y="20.0" width="345.0" height="320.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.0"/>
<text x="567.0" y="43.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анулятор U⁰ ⊂ V* (dim U⁰ = 1)</text>
<text x="567.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ковектори φ, де φ(u) = 0 для всіх u ∈ U</text>
<line x1="435.0" y1="215.0" x2="680.0" y2="95.0" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="4,2"/>
<text x="685.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">φ = 0 (ker φ ⊇ U)</text>
<line x1="415.0" y1="175.0" x2="660.0" y2="55.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="665.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">φ = 1</text>
<rect x="434.8" y="241.3" width="264.3" height="37.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="567.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="567.0" dy="0.0">Теорема про розмірність:</tspan><tspan x="567.0" dy="14.3">dim(U) + dim(U⁰) = 1 + 1 = 2 = dim(V)</tspan></text>
<text x="567.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ковектори зникають на всьому підпросторі U</text>
</svg>