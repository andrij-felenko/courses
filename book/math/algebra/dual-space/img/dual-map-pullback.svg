<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="83.5" y="57.0" width="153.0" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Простір станів V</tspan><tspan x="160.0" dy="16.9">елемент: вектор v</tspan></text>
<rect x="495.3" y="57.0" width="209.4" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Простір цілей W</tspan><tspan x="600.0" dy="16.9">елемент: вектор w = A(v)</tspan></text>
<line x1="265.0" y1="80.0" x2="475.0" y2="80.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="370.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Пряма дія A : V → W</text>
<text x="370.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Переносить вектор: v ↦ A(v)</text>
<rect x="75.4" y="217.1" width="169.1" height="45.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Дуальний простір V*</tspan><tspan x="160.0" dy="16.9">ковектор: A*(ψ)</tspan></text>
<rect x="511.4" y="217.1" width="177.2" height="45.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Дуальний простір W*</tspan><tspan x="600.0" dy="16.9">ковектор-детектор: ψ</tspan></text>
<line x1="475.0" y1="240.0" x2="265.0" y2="240.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="370.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Дуальне відображення A* : W* → V*</text>
<text x="370.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Підтягує вимірювання (pullback): ψ ↦ ψ ∘ A</text>
<line x1="160.0" y1="125.0" x2="160.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,2"/>
<text x="142.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">⟨A*ψ, v⟩</text>
<line x1="600.0" y1="125.0" x2="600.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,2"/>
<text x="582.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">⟨ψ, Av⟩</text>
<text x="370.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">≡ Одне й те саме число: ⟨A*ψ, v⟩ = ⟨ψ, Av⟩</text>
</svg>