<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння обчислювальної складності підходів</text>
<text x="420.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Наївний розрахунок виконує O(n²) операцій, схема Горнера скорочує складність до O(n)</text>
<rect x="40.0" y="80.0" width="360.0" height="300.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Наївний підхід: a₃x³ + a₂x² + a₁x + a₀</text>
<rect x="60.0" y="132.0" width="190.0" height="32.0" rx="4" fill="#fdf1e5" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x³ = x · x · x</text>
<text x="320.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3 множення</text>
<rect x="60.0" y="176.0" width="190.0" height="32.0" rx="4" fill="#fdf1e5" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x² = x · x</text>
<text x="320.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2 множення</text>
<rect x="60.0" y="220.0" width="190.0" height="32.0" rx="4" fill="#fdf1e5" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">a₃·x³, a₂·x², a₁·x</text>
<text x="320.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3 множення</text>
<rect x="60.0" y="264.0" width="190.0" height="32.0" rx="4" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/>
<text x="155.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сума 4 доданків</text>
<text x="320.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3 додавання</text>
<rect x="60.0" y="325.0" width="320.0" height="36.0" rx="6" fill="#fdf1e5" stroke="#2457d6" stroke-width="1.5"/>
<text x="210.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Разом: 8 операцій (n(n+1)/2 mult + n add)</text>
<rect x="440.0" y="80.0" width="360.0" height="300.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Схема Горнера: ((a₃·x + a₂)·x + a₁)·x + a₀</text>
<rect x="460.0" y="140.0" width="210.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.0"/>
<text x="565.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: v₁ = a₃·x + a₂</text>
<text x="725.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1 mult + 1 add</text>
<rect x="460.0" y="192.0" width="210.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.0"/>
<text x="565.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 2: v₂ = v₁·x + a₁</text>
<text x="725.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1 mult + 1 add</text>
<rect x="460.0" y="244.0" width="210.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.0"/>
<text x="565.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 3: P(x) = v₂·x + a₀</text>
<text x="725.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1 mult + 1 add</text>
<rect x="460.0" y="325.0" width="320.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="610.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Разом: 6 операцій (n mult + n add)</text>
</svg>