<rect x="40.0" y="75.0" width="230.0" height="28.0" rx="6" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.2"/>
<text x="155.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e824c" text-anchor="middle" font-weight="700">Орбіти довжини 1: GF(2)</text>
<circle cx="100.0" cy="150.0" r="18.0" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.5"/>
<text x="100.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
