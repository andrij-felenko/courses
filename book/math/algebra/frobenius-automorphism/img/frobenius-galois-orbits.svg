<text x="100.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0² = 0</text>
<circle cx="205.0" cy="150.0" r="18.0" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.5"/>
<text x="205.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
