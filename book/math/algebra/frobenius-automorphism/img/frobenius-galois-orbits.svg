<text x="205.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1² = 1</text>
<text x="155.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e824c" text-anchor="middle" font-weight="700">Фіксоване поле Fix(σ)</text>
