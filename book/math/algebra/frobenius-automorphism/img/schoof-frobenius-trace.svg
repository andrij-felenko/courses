<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Шуфа: Визначення сліду Фробеніуса та кількості точок кривої #E(GF(q))</text>
<text x="420.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Характеристичне рівняння: π²(P) - t·π(P) + q·P = 𝒪 для точок кручення P ∈ E[l]</text>
<rect x="180.0" y="75.0" width="480.0" height="50.0" rx="6" fill="#f5eeff" stroke="#7d3c98" stroke-width="1.5"/>
<text x="420.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="middle" font-weight="700">π² - t · π + q = 0  на кільці ендоморфізмів End(E)</text>
<text x="420.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слід Фробеніуса t пов'язаний із кількістю точок: #E(GF(q)) = q + 1 - t</text>
<rect x="40.0" y="145.0" width="220.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="145.0" width="220.0" height="28.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="150.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Малі прості l ∈ {2, 3, 5, 7, ...}</text>
<text x="50.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Обираємо набір простих чисел:</text>
<text x="50.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">L = {l₁, l₂, ..., lₖ} таких, що:</text>
<text x="50.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">∏ lᵢ &gt; 4·√q  (межа Хассе)</text>
<text x="50.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Многочлени поділу ψₗ(x):</text>
<text x="50.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Корені ψₗ(x) — це точно</text>
<text x="50.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">x-координати точок l-кручення</text>
<text x="50.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">E[l] = {P ∈ E : l·P = 𝒪}</text>
<text x="50.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Степінь ψₗ: deg ≈ (l² - 1)/2</text>
<rect x="280.0" y="145.0" width="280.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="280.0" y="145.0" width="280.0" height="28.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.2"/>
<text x="420.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">2. Символьна перевірка tₗ mod l</text>
<text x="290.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Для кожного можливого τ ∈ [0, l - 1]:</text>
<text x="290.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Обчислюємо дію на точці (x, y):</text>
<rect x="290.0" y="235.0" width="260.0" height="60.0" rx="4" fill="#fef5e7" stroke="#d35400" stroke-width="1.0"/>
<text x="420.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">(x^(q²), y^(q²)) + (q mod l)·(x, y)</text>
<text x="420.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">= τ · (x^q, y^q)  mod (ψₗ(x), y² - f(x))</text>
<text x="290.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Піднесення до степеня q — це</text>
<text x="290.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">автоморфізм Фробеніуса x ↦ x^q.</text>
<text x="290.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Знайдено точний залишок: t ≡ tₗ (mod l)</text>
<rect x="580.0" y="145.0" width="220.0" height="245.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="580.0" y="145.0" width="220.0" height="28.0" rx="6" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.2"/>
<text x="690.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e824c" text-anchor="middle" font-weight="700">3. Відновлення через CRT</text>
<text x="590.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Система конгруенцій:</text>
<text x="600.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">t ≡ t₁ (mod l₁)</text>
<text x="600.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">t ≡ t₂ (mod l₂)</text>
<text x="600.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">...</text>
<text x="600.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">t ≡ tₖ (mod lₖ)</text>
<text x="590.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">За теоремою Хассе |t| ≤ 2·√q,</text>
<text x="590.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">тому розв'язок t єдиний у ℤ!</text>
<rect x="590.0" y="340.0" width="200.0" height="38.0" rx="4" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.5"/>
<text x="690.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e824c" text-anchor="middle" font-weight="700">#E(GF(q)) = q + 1 - t</text>
<line x1="260.0" y1="265.0" x2="280.0" y2="265.0" stroke="#333333" stroke-width="1.5"/>
<polygon points="276.0,261.0 284.0,265.0 276.0,269.0" fill="#333333" stroke="none" stroke-width="1.0"/>
<line x1="560.0" y1="265.0" x2="580.0" y2="265.0" stroke="#333333" stroke-width="1.5"/>
<polygon points="576.0,261.0 584.0,265.0 576.0,269.0" fill="#333333" stroke="none" stroke-width="1.0"/>
</svg>