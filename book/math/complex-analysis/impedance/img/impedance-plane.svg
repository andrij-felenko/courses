<circle cx="370.0" cy="100.0" r="5.5" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="158.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">↑ котушка: X &gt; 0</text>
<text x="158.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">↓ конденсатор: X &lt; 0</text>
<rect x="448.0" y="324.0" width="196.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="546.0" y="349.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="546.0" dy="0.0">Z — стрілка на площині:</tspan><tspan x="546.0" dy="13.0">• довжина |Z| = у скільки разів</tspan><tspan x="546.0" dy="13.0">   напруга більша за струм</tspan><tspan x="546.0" dy="13.0">• кут φ = на скільки струм</tspan><tspan x="546.0" dy="13.0">   зсунутий за фазою</tspan></text>
</svg>