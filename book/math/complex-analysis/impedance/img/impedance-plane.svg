<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпеданс Z = R + jX на комплексній площині</text>
<line x1="130.0" y1="250.0" x2="440.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="170.0" y1="360.0" x2="170.0" y2="20.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="448.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Re</text>
<text x="184.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Im</text>
<text x="448.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(R, тепло)</text>
<text x="184.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(X, фаза)</text>
<line x1="170.0" y1="250.0" x2="370.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="270.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">R  (активний опір)</text>
<line x1="370.0" y1="250.0" x2="370.0" y2="100.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="384.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">X = ω·L</text>
<text x="384.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">(реактивність)</text>
<line x1="170.0" y1="250.0" x2="370.0" y2="100.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="182.1" y="140.5" width="123.7" height="33.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.2"/><text x="244.0" y="161.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="244.0" dy="0.0">|Z| = √(R²+X²)</tspan></text>
<text x="376.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Z = R + jX</text>
<polyline points="222.0,250.0 222.0,248.8 221.9,247.6 221.9,246.4 221.8,245.2 221.7,244.0 221.5,242.9 221.3,241.7 221.1,240.5 220.9,239.3 220.6,238.2 220.3,237.0 220.0,235.8 219.7,234.7 219.3,233.6 218.9,232.4 218.5,231.3 218.1,230.2 217.6,229.1 217.1,228.0 216.6,226.9 216.1,225.9 215.5,224.8 214.9,223.8 214.3,222.8 213.7,221.7 213.0,220.7 212.3,219.8 211.6,218.8" fill="none" stroke="#2457d6" stroke-width="1.6"/>
<text x="242.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-style="italic">φ</text>
<text x="238.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">(зсув фази)</text>
