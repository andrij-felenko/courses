<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три обличчя однієї сили</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">у теорії множин без вибору кожне з трьох тверджень тягне два інші</text>
<path d="M 404.0 190.3 L 352.0 313.7" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M 596.0 190.3 L 648.0 313.7" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M 412.0 352.0 L 588.0 352.0" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="352.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">⟺</text>
<text x="648.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">⟺</text>
<text x="500.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">⟺</text>
<rect x="350.0" y="117.7" width="300.0" height="68.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Аксіома вибору</tspan><tspan x="500.0" dy="17.6">по представнику з кожної</tspan><tspan x="500.0" dy="17.6">непорожньої множини</tspan></text>
<rect x="106.0" y="317.7" width="300.0" height="68.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="256.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="256.0" dy="0.0">Повне впорядкування</tspan><tspan x="256.0" dy="17.6">(Цермело): будь-яку множину</tspan><tspan x="256.0" dy="17.6">вишикувати з найменшим</tspan></text>
<rect x="594.0" y="317.7" width="300.0" height="68.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="744.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="744.0" dy="0.0">Лема Цорна: ланцюги мають</tspan><tspan x="744.0" dy="17.6">межу — отже, є</tspan><tspan x="744.0" dy="17.6">максимальний елемент</tspan></text>
<text x="500.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">прийняти одне з трьох означає прийняти всі три</text>
</svg>