<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому V неможливо приписати довжину</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">зсуви V на всі раціональні q заповнюють [0,1) зліченною кількістю неперетинних копій довжини c</text>
<rect x="92.0" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.3"/>
<text x="133.3" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₀</text>
<rect x="177.6" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf7ef" stroke="#333333" stroke-width="1.3"/>
<text x="218.8" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₁</text>
<rect x="263.1" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.3"/>
<text x="304.4" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₂</text>
<rect x="348.7" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf7ef" stroke="#333333" stroke-width="1.3"/>
<text x="389.9" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₃</text>
<rect x="434.2" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.3"/>
<text x="475.5" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₄</text>
<rect x="519.8" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf7ef" stroke="#333333" stroke-width="1.3"/>
<text x="561.1" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₅</text>
<rect x="605.3" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.3"/>
<text x="646.6" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₆</text>
<rect x="690.9" y="92.0" width="82.6" height="40.0" rx="3" fill="#eaf7ef" stroke="#333333" stroke-width="1.3"/>
<text x="732.2" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V⊕q₇</text>
<text x="798.4" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">…</text>
<text x="88.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="910.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
<text x="500.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">[0, 1) = ⊔ (V ⊕ q),   q ∈ ℚ ∩ [0,1)   —   кожна копія завдовжки  c = m(V)</text>
<text x="500.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 = m([0,1)) = Σ m(V ⊕ q) = c + c + c + …</text>
<rect x="142.0" y="279.9" width="300.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="292.0" y="301.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="292.0" dy="0.0">c = 0</tspan><tspan x="292.0" dy="18.2">0 + 0 + 0 + …  =  0</tspan></text>
<rect x="558.0" y="279.9" width="300.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="708.0" y="301.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="708.0" dy="0.0">c &gt; 0</tspan><tspan x="708.0" dy="18.2">c + c + c + …  =  ∞</tspan></text>
<text x="292.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗  не 1</text>
<text x="708.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗  не 1</text>
<rect x="240.0" y="412.8" width="520.0" height="34.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="435.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">а треба рівно 1  →  такого c немає  →  V невимірна</tspan></text>
</svg>