<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 588" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="588" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лема Цорна добуває базис</text>
<text x="520.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ланцюг лінійно незалежних множин росте включенням; його межа — об'єднання</text>
<rect x="132.0" y="485.0" width="236.0" height="42.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="511.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">∅</tspan></text>
<rect x="132.0" y="405.0" width="236.0" height="42.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="431.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">{v₁}</tspan></text>
<line x1="250.0" y1="485.0" x2="250.0" y2="447.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">⊆</text>
<rect x="132.0" y="325.0" width="236.0" height="42.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="351.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">{v₁, v₂}</tspan></text>
<line x1="250.0" y1="405.0" x2="250.0" y2="367.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">⊆</text>
<rect x="132.0" y="245.0" width="236.0" height="42.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">{v₁, v₂, v₃}</tspan></text>
<line x1="250.0" y1="325.0" x2="250.0" y2="287.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">⊆</text>
<line x1="250.0" y1="245.0" x2="250.0" y2="214.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="start" font-weight="700">⋮</text>
<rect x="85.0" y="143.6" width="330.0" height="48.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">⋃ ланцюга = верхня межа</tspan><tspan x="250.0" dy="16.2">(залежність скінченна ⟹ теж незалежна)</tspan></text>
<line x1="421.0" y1="168.0" x2="560.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.5" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лема Цорна</text>
<rect x="566.0" y="150.0" width="430.0" height="232.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="781.0" y="202.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="781.0" dy="0.0">Є МАКСИМАЛЬНА незалежна множина M.</tspan><tspan x="781.0" dy="16.9"></tspan><tspan x="781.0" dy="16.9">Якби вона не породжувала весь V,</tspan><tspan x="781.0" dy="16.9">до неї можна було б додати ще вектор —</tspan><tspan x="781.0" dy="16.9">і вона лишилася б незалежною,</tspan><tspan x="781.0" dy="16.9">тобто не була б максимальна.</tspan><tspan x="781.0" dy="16.9"></tspan><tspan x="781.0" dy="16.9">Отже M породжує V і незалежна:</tspan><tspan x="781.0" dy="16.9">M — це БАЗИС.</tspan></text>
<rect x="90.0" y="520.0" width="860.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="547.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Той самий рух дає максимальний ідеал у кільці — з умовою «1 ∉ I» замість «немає нової залежності».</tspan></text>
</svg>