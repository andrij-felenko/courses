<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мисливець на бобра: скінченна арена → симулятор → три відра</text>
<rect x="59.4" y="108.2" width="181.2" height="83.7" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">АРЕНА — СКІНЧЕННА</tspan><tspan x="150.0" dy="16.9">усі (4n+4)²ⁿ таблиць</tspan><tspan x="150.0" dy="16.9">n=2: 20 736</tspan><tspan x="150.0" dy="16.9">n=3: 16 777 216</tspan></text>
<line x1="246.6" y1="150.0" x2="289.3" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="297.3" y="116.6" width="205.4" height="66.8" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">СИМУЛЯТОР</tspan><tspan x="400.0" dy="16.9">кожну — з чистої</tspan><tspan x="400.0" dy="16.9">стрічки, стеля C кроків</tspan></text>
<line x1="508.7" y1="138.0" x2="596.8" y2="100.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="604.8" y="67.6" width="190.5" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="88.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">ЗУПИНИЛАСЬ ≤ C</tspan><tspan x="700.0" dy="16.2">кроки й одиниці відомі</tspan></text>
<line x1="801.2" y1="92.0" x2="896.1" y2="92.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="904.1" y="59.5" width="151.8" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="80.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">ЧЕМПІОН</tspan><tspan x="980.0" dy="16.2">max 1 → Σ(n)</tspan><tspan x="980.0" dy="16.2">max кроків → S(n)</tspan></text>
<line x1="508.7" y1="168.0" x2="641.2" y2="244.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="649.2" y="217.4" width="221.5" height="81.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">ЩЕ ПРАЦЮЄ на кроці C</tspan><tspan x="760.0" dy="16.2">спиниться чи ні — НЕВІДОМО</tspan><tspan x="760.0" dy="16.2">без наперед відомого S(n)</tspan><tspan x="760.0" dy="16.2">не класифікувати</tspan></text>
<text x="760.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">це і є стіна зупинки</text>
<rect x="86.7" y="411.5" width="906.6" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="432.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Арену перебрати МОЖНА — вона скінченна.  А долю кожної машини визначити напевно — вже ні: це проблема зупинки.</tspan></text>
</svg>