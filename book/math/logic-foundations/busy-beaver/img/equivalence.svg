<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">S, Σ і зупинка на чистій стрічці — той самий рівень нерозв'язності</text>
<line x1="241.1" y1="196.0" x2="500.6" y2="196.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.6" y1="214.0" x2="241.1" y2="214.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="370.9" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Σ(n) ≤ S(n) &lt; Σ(3n+6)</text>
<text x="370.9" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лінійний зсув аргументу</text>
<line x1="619.4" y1="183.0" x2="915.5" y2="183.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="767.4" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">знаю S(n) → жену машину S(n) кроків</text>
<line x1="915.5" y1="227.0" x2="619.4" y2="227.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="767.4" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">вирішувач → перебір усіх машин, лишаю спинні → S, Σ</text>
<rect x="215.4" y="355.5" width="729.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="580.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Обчислити будь-яку з трьох = розв'язати проблему зупинки.  Усі три однаково нерозв'язні.</tspan></text>
</svg>