<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетрія: перша дія A,0 — одна замість (4n+4)</text>
<rect x="96.6" y="213.9" width="106.8" height="52.2" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="150.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">старт:</tspan><tspan x="150.0" dy="18.2">A бачить 0</tspan></text>
<line x1="209.4" y1="240.0" x2="456.8" y2="96.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="464.8" y="71.6" width="190.5" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">пише 0  → або петля,</tspan><tspan x="560.0" dy="16.2">або тривіальна зупинка</tspan></text>
<line x1="209.4" y1="240.0" x2="476.1" y2="176.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="484.1" y="151.6" width="151.8" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">(1,·,A)  → біжить</tspan><tspan x="560.0" dy="16.2">праворуч ВІЧНО</tspan></text>
<line x1="209.4" y1="240.0" x2="445.1" y2="256.0" stroke="#b9770e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="453.1" y="231.6" width="213.8" height="48.8" rx="6" fill="#fdf3e3" stroke="#b9770e" stroke-width="1.5"/><text x="560.0" y="252.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">(1,·,H)  → стоп за 1 крок</tspan><tspan x="560.0" dy="16.2">(це вже бобер n=1)</tspan></text>
<line x1="209.4" y1="240.0" x2="429.6" y2="352.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="437.6" y="327.6" width="244.8" height="48.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="348.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">(1, R, B)  → канонічний старт</tspan><tspan x="560.0" dy="16.2">ЄДИНИЙ, що лишаємо</tspan></text>
<text x="560.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(1,L,·) ≡ (1,R,·)  — дзеркало L↔R</text>
<line x1="705.0" y1="352.0" x2="721.8" y2="352.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="729.8" y="295.1" width="190.5" height="113.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="315.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">лишилась ОДНА:</tspan><tspan x="825.0" dy="16.2">A,0 = (1,R,B)</tspan><tspan x="825.0" dy="16.2"></tspan><tspan x="825.0" dy="16.2">арену ділимо на (4n+4)</tspan><tspan x="825.0" dy="16.2">n=3: 16 777 216 ÷ 16</tspan><tspan x="825.0" dy="16.2">= 1 048 576</tspan></text>
</svg>