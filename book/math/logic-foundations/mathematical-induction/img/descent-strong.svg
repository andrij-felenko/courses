<text x="472.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СИЛЬНА гіпотеза: P(m) правдиве для ВСІХ m ≤ 12 — отже й для 6</text>
<rect x="76.0" y="376.0" width="415.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="283.5" y="402.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="283.5" dy="0.0">ЗВИЧАЙНА індукція дає лише P(12) —</tspan><tspan x="283.5" dy="16.2">сусіда. Виклик пішов на 6, і про 6</tspan><tspan x="283.5" dy="16.2">вона не каже нічого. Крок стоїть.</tspan></text>
<rect x="519.0" y="376.0" width="415.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="726.5" y="402.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="726.5" dy="0.0">СИЛЬНА індукція дає все нижче за 13.</tspan><tspan x="726.5" dy="16.2">Серед «усього» є й 6 — саме те, що</tspan><tspan x="726.5" dy="16.2">повернув виклик. Крок проходить.</tspan></text>
