<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик стрибає на n//2 — тому потрібна СИЛЬНА гіпотеза</text>
<text x="490.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">power(x, 13) кличе power(x, 6), а не power(x, 12): сусід тут ні до чого</text>
