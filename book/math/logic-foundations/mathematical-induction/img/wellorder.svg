<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому стрибок законний: найменшого порушника бути не може</text>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">якби P десь хибнило, серед хибних був би найменший m — і саме він приводить до суперечності</text>
<line x1="110.0" y1="200.0" x2="800.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="120.0" y="208.0" width="380.0" height="26.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="310.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">тут P правда (порушників немає)</text>
<line x1="150.0" y1="194.0" x2="150.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="150.0" cy="200.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="150.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
<line x1="250.0" y1="194.0" x2="250.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="250.0" cy="200.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="250.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text>
<line x1="350.0" y1="194.0" x2="350.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="350.0" cy="200.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="350.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text>
<line x1="470.0" y1="194.0" x2="470.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="470.0" cy="200.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="470.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">m−1</text>
<line x1="590.0" y1="194.0" x2="590.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="590.0" cy="200.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="590.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">m</text>
<line x1="710.0" y1="194.0" x2="710.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="710.0" cy="200.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="710.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">m+1</text>
<text x="410.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">…</text>
<text x="662.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">найменший, де P хибне</text>
<path d="M 655 150 L 599 194" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 470 164 Q 530 126 590 164" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="524.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">крок:  P(m−1) ⟹ P(m)</text>
<rect x="90.0" y="300.0" width="740.0" height="60.0" rx="10" fill="#f1f8f3" stroke="#27ae60" stroke-width="1.6"/>
<text x="460.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">m ≠ 1 (база дала P(1)); отже m−1 не порушник → P(m−1) правда → кроком P(m) правда.</text>
<text x="460.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Але m — порушник, де P хибне. Суперечність: порушників немає зовсім.</text>
</svg>