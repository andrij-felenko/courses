<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скелет будь-якого доказу індукцією</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ліворуч — роль частини, праворуч — вона ж на прикладі суми 1+2+…+n = n(n+1)/2</text>
<rect x="120.0" y="84.0" width="640.0" height="76.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="142.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">БАЗА</text>
<text x="142.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перевіряємо P(1) прямо</text>
<line x1="450.0" y1="98.0" x2="450.0" y2="146.0" stroke="#d7dbe0" stroke-width="1.3"/>
<text x="470.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1 = 1·2/2 = 1  ✓</text>
<line x1="440.0" y1="162.0" x2="440.0" y2="180.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="182.0" width="640.0" height="76.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="142.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">ПРИПУЩЕННЯ</text>
<text x="142.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">нехай P(k) правда — для довільного k</text>
<line x1="450.0" y1="196.0" x2="450.0" y2="244.0" stroke="#d7dbe0" stroke-width="1.3"/>
<text x="470.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1 + 2 + … + k = k(k+1)/2</text>
<line x1="440.0" y1="260.0" x2="440.0" y2="278.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="280.0" width="640.0" height="76.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="142.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">КРОК</text>
<text x="142.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">звідси виводимо P(k+1)</text>
<line x1="450.0" y1="294.0" x2="450.0" y2="342.0" stroke="#d7dbe0" stroke-width="1.3"/>
<text x="470.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">… + (k+1) = (k+1)(k+2)/2</text>
<line x1="440.0" y1="358.0" x2="440.0" y2="376.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="378.0" width="640.0" height="76.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="142.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">ВИСНОВОК</text>
<text x="142.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">отже P(n) правдиве для всіх n</text>
<line x1="450.0" y1="392.0" x2="450.0" y2="440.0" stroke="#d7dbe0" stroke-width="1.3"/>
<text x="470.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">формула справджується завжди</text>
</svg>