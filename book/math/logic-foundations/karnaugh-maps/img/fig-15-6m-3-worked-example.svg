<text x="598.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">сталі C=1, D=0  →  C·D̄</text>
