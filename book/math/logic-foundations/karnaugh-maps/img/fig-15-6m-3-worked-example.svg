<text x="598.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">сталі A=0, C=0, D=0  →  Ā·C̄·D̄</text>
<line x1="560.0" y1="285.0" x2="920.0" y2="285.0" stroke="#e4e4e4" stroke-width="1.6" stroke-linecap="round"/>
<text x="560.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">F = C·D̄ + Ā·C̄·D̄</text>
<text x="560.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Дві групи → два доданки, дві суми. Усе.</text>
<text x="560.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">А «в лоб» з таблиці було б:</text>
<text x="560.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">ĀB̄C̄D̄ + ĀBC̄D̄ + CD̄(усі 4) — довжелезно</text>
<rect x="554.0" y="300.0" width="372.0" height="26.0" rx="8" fill="none" stroke="#1f8a3b" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="480.0" y="514.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тут накривали ОДИНИЦІ → сума добутків (SOP). Накриєш НУЛІ — дістанеш добуток сум (POS).</text>
