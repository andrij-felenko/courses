<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ділення з остачею: остача — це найменший невід'ємний залишок</text>
<text x="470.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">приклад  a = 17,  b = 5:  беремо всі невід'ємні  17 − 5·k  і серед них найменший</text>
<line x1="120.0" y1="210.0" x2="860.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="252.0" y1="200.0" x2="252.0" y2="220.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="252.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
<circle cx="830.0" cy="210.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="830.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">17</text>
<text x="830.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">k=0</text>
<circle cx="660.0" cy="210.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="660.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">12</text>
<text x="660.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">k=1</text>
<circle cx="490.0" cy="210.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="490.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">7</text>
<text x="490.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">k=2</text>
<circle cx="320.0" cy="210.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="320.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
<text x="320.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">k=3</text>
<circle cx="150.0" cy="210.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="150.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">−3</text>
<text x="150.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">k=4</text>
<text x="320.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">остача r = 2</text>
<path d="M 320.0 258 L 320.0 224" fill="none" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">&lt; 0 — не беремо</text>
<rect x="120.0" y="320.0" width="340.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">S = { 17 − 5·k ≥ 0 } = { 17, 12, 7, 2 }</tspan><tspan x="290.0" dy="16.9"></tspan><tspan x="290.0" dy="16.9">непорожня → має найменший елемент</tspan></text>
<rect x="500.0" y="320.0" width="340.0" height="88.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">найменший r = 2,  при  q = 3:</tspan><tspan x="670.0" dy="16.2">17 = 5·3 + 2,   0 ≤ 2 &lt; 5</tspan><tspan x="670.0" dy="16.2"></tspan><tspan x="670.0" dy="16.2">більший залишок (7) дав би менший (7−5=2)</tspan></text>
</svg>