<circle cx="300.0" cy="118.0" r="23.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="300.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">×</text>
