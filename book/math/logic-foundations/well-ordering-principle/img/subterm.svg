<text x="300.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">внутрішній вузол → рекурсія в дітей;  листок → база, спуск спинився</text>
<rect x="600.0" y="96.0" width="360.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Міра — саме ДЕРЕВО, а «менше» —</tspan><tspan x="780.0" dy="16.9">«бути власним піддеревом».</tspan></text>
<rect x="600.0" y="194.0" width="360.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="230.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Порядок фундований, бо дерево скінченне:</tspan><tspan x="780.0" dy="16.2">ланцюга дедалі менших піддерев</tspan><tspan x="780.0" dy="16.2">без кінця не буває.</tspan></text>
<rect x="600.0" y="306.0" width="360.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Числовий двійник у ℕ — кількість вузлів:</tspan><tspan x="780.0" dy="13.7">eval(×) = 7  →  eval(+) = 3  →  eval(3) = 1  →  лист.</tspan><tspan x="780.0" dy="13.7">Спадає щоразу, дно = листок.</tspan></text>
</svg>