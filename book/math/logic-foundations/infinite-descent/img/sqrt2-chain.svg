<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один крок спуску для √2: з (a, b) виходить менша (b, c)</text>
<text x="480.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">та сама рівність a² = 2b² відроджується як b² = 2c² — тільки з меншим числом</text>
<rect x="60.0" y="110.0" width="190.0" height="96.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="155.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">( a , b )</text>
<text x="155.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">a² = 2 b²</text>
<rect x="330.0" y="84.0" width="300.0" height="156.0" rx="10" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.5"/>
<text x="480.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">крок</text>
<text x="480.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">a²  парне  ⇒  a  парне</text>
<text x="480.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">a = 2c</text>
<text x="480.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">4c² = 2b²</text>
<text x="480.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">b² = 2c²</text>
<rect x="700.0" y="110.0" width="190.0" height="96.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="795.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">( b , c )</text>
<text x="795.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">b² = 2 c²</text>
<line x1="252.0" y1="154.0" x2="324.0" y2="154.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="636.0" y1="154.0" x2="694.0" y2="154.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 800 220 Q 500 278 155 220" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="480.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">b &lt; a  (бо a² = 2b² &gt; b²) — перший компонент строго меншає</text>
<rect x="60.0" y="350.0" width="840.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="480.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Повторюй крок:  a &gt; b &gt; c &gt; d &gt; …  —  нескінченний спадний ланцюг у ℕ, а такого не буває.</tspan><tspan x="480.0" dy="16.9">Отже пари (a, b) з рівністю a² = 2b² не існує зовсім: √2 не записати дробом.</tspan></text>
</svg>