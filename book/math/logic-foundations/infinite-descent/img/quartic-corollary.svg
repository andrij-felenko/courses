<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від трикутника — до великої теореми Ферма для четвертого степеня</text>
<text x="510.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">розв'язок x⁴−y⁴=z² збудував би трикутник із площею-квадратом, якого не буває</text>
<rect x="40.0" y="92.0" width="276.0" height="190.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.7"/><text x="178.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">ПРИПУСТИМО РОЗВ'ЯЗОК</tspan><tspan x="178.0" dy="18.9"></tspan><tspan x="178.0" dy="18.9">x⁴ − y⁴ = z²</tspan><tspan x="178.0" dy="18.9">у ненульових цілих</tspan><tspan x="178.0" dy="18.9">(x &gt; y ≥ 1,  z ≥ 1)</tspan></text>
<rect x="372.0" y="92.0" width="276.0" height="190.0" rx="6" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.7"/><text x="510.0" y="137.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">ЗБУДУЙ ТРИКУТНИК</tspan><tspan x="510.0" dy="18.2"></tspan><tspan x="510.0" dy="18.2">катети  x⁴−y⁴  та  2x²y²,</tspan><tspan x="510.0" dy="18.2">гіпотенуза  x⁴+y⁴</tspan><tspan x="510.0" dy="18.2"></tspan><tspan x="510.0" dy="18.2">площа = (x⁴−y⁴)·x²y²</tspan><tspan x="510.0" dy="18.2">= z²·x²y² = (xyz)² = □</tspan></text>
<rect x="704.0" y="92.0" width="276.0" height="190.0" rx="6" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.7"/><text x="842.0" y="137.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="842.0" dy="0.0">СУПЕРЕЧНІСТЬ</tspan><tspan x="842.0" dy="18.2"></tspan><tspan x="842.0" dy="18.2">але піфагорів трикутник</tspan><tspan x="842.0" dy="18.2">ніколи не має площі-□</tspan><tspan x="842.0" dy="18.2"></tspan><tspan x="842.0" dy="18.2">⇒  x⁴ − y⁴ = z²</tspan><tspan x="842.0" dy="18.2">розв'язків не має</tspan></text>
<line x1="320.0" y1="187.0" x2="368.0" y2="187.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="652.0" y1="187.0" x2="700.0" y2="187.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="322.0" width="940.0" height="92.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="510.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Показник 4 задарма.  Нехай x⁴ + y⁴ = z⁴.  Перенесемо:  z⁴ − y⁴ = x⁴ = (x²)².</tspan><tspan x="510.0" dy="17.6">Тоді трійка (z, y, x²) розв'язує заборонене a⁴ − b⁴ = c² — а воно розв'язків не має.</tspan><tspan x="510.0" dy="17.6">Отже x⁴ + y⁴ = z⁴ неможливе в ненульових цілих: велика теорема Ферма для n = 4 доведена.</tspan></text>
<text x="510.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">той самий спуск, що заборонив квадратну площу, закриває й показник чотири</text>
</svg>