<text x="820.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вниз, у дно</text>
<rect x="30.0" y="350.0" width="940.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="500.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Довели одне — безкоштовно маєте всі три. Тому не питають, що «сильніше»: вибір — питання зручності.</tspan><tspan x="500.0" dy="16.2">Доводите наявність — беріть індукцію; доводите неможливість — беріть спуск; зручно за край — найменший елемент.</tspan></text>
</svg>