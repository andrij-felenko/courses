<text x="330.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">n₂</text>
<rect x="445.0" y="330.0" width="50.0" height="100.0" rx="5" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="470.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">n₃</text>
<rect x="565.0" y="358.0" width="50.0" height="72.0" rx="5" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="590.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">n₄</text>
<rect x="660.0" y="380.0" width="50.0" height="50.0" rx="5" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="685.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">n₅</text>
<text x="255.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">&gt;</text>
<text x="400.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">&gt;</text>
<text x="530.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">&gt;</text>
<text x="637.5" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">&gt;</text>
<text x="745.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<line x1="120.0" y1="430.0" x2="860.0" y2="430.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="490.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">дно натуральних чисел — нижче за 1 сходинок немає</text>
<rect x="700.0" y="312.0" width="250.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="825.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Машина обіцяє ще менший —</tspan><tspan x="825.0" dy="16.2">а під дном його вже нема.</tspan><tspan x="825.0" dy="16.2">Отже входу не було зовсім.</tspan></text>
<path d="M 748 386 Q 720 400 690 424" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
