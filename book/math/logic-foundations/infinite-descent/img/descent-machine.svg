<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машина, що з'їдає власний розв'язок</text>
<text x="490.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">крок робить менший розв'язок · його знову подають на вхід · міри спадають до дна</text>
<rect x="400.0" y="120.0" width="200.0" height="78.0" rx="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="500.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">КРОК</text>
<text x="500.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">розв'язок → менший</text>
<line x1="190.0" y1="159.0" x2="394.0" y2="159.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="115.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">розв'язок</text>
<text x="115.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">міра n</text>
<line x1="606.0" y1="159.0" x2="800.0" y2="159.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="872.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">розв'язок</text>
<text x="872.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">міра &lt; n</text>
<path d="M 790 116 Q 490 34 190 116" fill="none" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="7,4" marker-end="url(#arrow)"/>
<text x="490.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">той самий вихід — знову на вхід, і так без кінця</text>
