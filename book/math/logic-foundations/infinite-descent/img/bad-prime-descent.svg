<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спуск на ствердному: погане 4n+1 родить менше погане 4n+1</text>
<text x="510.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">припустили, що якесь просте 4n+1 — не сума двох квадратів; крок робить менше таке саме — і розбивається об п'ятірку</text>
<rect x="130.0" y="87.0" width="240.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="250.0" y="116.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">p₁ — погане 4n+1</tspan></text>
<rect x="130.0" y="167.0" width="240.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="250.0" y="196.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">p₂ — погане 4n+1</tspan></text>
<rect x="130.0" y="247.0" width="240.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="250.0" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">p₃ — погане 4n+1</tspan></text>
<line x1="250.0" y1="137.0" x2="250.0" y2="165.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="250.0" y1="217.0" x2="250.0" y2="245.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="250.0" y1="297.0" x2="250.0" y2="322.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="250.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<line x1="250.0" y1="352.0" x2="250.0" y2="366.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="90.0" y="368.0" width="320.0" height="46.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">5 = 1² + 2²  —  найменше просте 4n+1,  і воно НЕ погане</tspan></text>
<rect x="90.0" y="424.0" width="320.0" height="15.0" rx="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="250.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">приземлятися нема на що — поганого простого немає</text>
<rect x="560.0" y="96.0" width="430.0" height="352.0" rx="10" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.6"/>
<text x="775.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">один крок: з поганого p — менше погане q</text>
<rect x="580.0" y="150.0" width="62.0" height="68.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="611.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">іскра</text>
<rect x="654.0" y="150.0" width="316.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.2"/><text x="812.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">−1 — квадрат (mod p)  ⇒  p ділить a² + 1 = p·m</tspan><tspan x="812.0" dy="13.7">сума двох ВЗАЄМНО ПРОСТИХ квадратів,  1 ≤ m &lt; p</tspan></text>
<rect x="580.0" y="244.0" width="62.0" height="68.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="611.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">жорна</text>
<rect x="654.0" y="244.0" width="316.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.2"/><text x="812.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">якби всі прості дільники m були сумами двох</tspan><tspan x="812.0" dy="15.0">квадратів — тотожність зробила б і p таким.</tspan><tspan x="812.0" dy="15.0">Отже серед них є погане q</tspan></text>
<rect x="580.0" y="338.0" width="62.0" height="68.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="611.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">фільтр</text>
<rect x="654.0" y="338.0" width="316.0" height="68.0" rx="6" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.2"/><text x="812.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">q ділить a²+1 (взаємно прості) ⇒ q ≠ 4n+3;</tspan><tspan x="812.0" dy="12.3">а q ≤ m &lt; p.  Значить, q — погане 4n+1,  менше за p</tspan></text>
</svg>