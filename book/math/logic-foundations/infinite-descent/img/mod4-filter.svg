<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дешевий фільтр за модулем 4: 4n+3 відпадає, вага лягає на 4n+1</text>
<text x="500.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">квадрат дає остачу лише 0 або 1 — тож сума двох квадратів ніколи не буває ≡ 3 (mod 4)</text>
<rect x="60.0" y="88.0" width="380.0" height="336.0" rx="10" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.6"/>
<text x="250.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">остача суми  a² + b²  (mod 4)</text>
<text x="252.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">b² ≡ 0</text>
<text x="336.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">b² ≡ 1</text>
<text x="162.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">a² ≡ 0</text>
<text x="162.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">a² ≡ 1</text>
<rect x="210.0" y="162.0" width="84.0" height="84.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="252.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<rect x="294.0" y="162.0" width="84.0" height="84.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="336.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<rect x="210.0" y="246.0" width="84.0" height="84.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="252.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<rect x="294.0" y="246.0" width="84.0" height="84.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="336.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="250.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">серед остач — 0, 1, 2.  Трійки немає ніде.</text>
<text x="250.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">отже число ≡ 3 (mod 4) — не сума двох квадратів</text>
<rect x="560.0" y="88.0" width="380.0" height="336.0" rx="10" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.6"/>
<text x="750.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">непарні прості за остачею (mod 4)</text>
<rect x="584.0" y="140.0" width="332.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="169.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">4n+3:  3, 7, 11, 19, 23, 31, …</tspan><tspan x="750.0" dy="16.2">остача 3 — не сума двох квадратів,</tspan><tspan x="750.0" dy="16.2">відпадають задарма, без спуску</tspan></text>
<rect x="584.0" y="236.0" width="332.0" height="82.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="265.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">4n+1:  5, 13, 17, 29, 37, 41, …</tspan><tspan x="750.0" dy="16.2">остача 1 — фільтр не вирішує,</tspan><tspan x="750.0" dy="16.2">саме тут потрібен спуск</tspan></text>
<rect x="584.0" y="332.0" width="332.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="750.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">2 = 1² + 1²  —  єдине парне просте,</tspan><tspan x="750.0" dy="16.2">розкладається одразу</tspan></text>
</svg>