<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чий спуск: одне поняття крізь дві тисячі років</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Евклід ним рахує · Ферма дає ім'я і заявки · Ейлер доводить обіцяне</text>
<line x1="214.0" y1="96.0" x2="214.0" y2="520.0" stroke="#cbd2da" stroke-width="3.2"/>
<text x="214.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">час ↓</text>
<text x="184.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">~300 до н.е.</text>
<circle cx="214.0" cy="125.0" r="8.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.4"/>
<text x="244.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Евклід, «Начала», книга VII, твердження 31</text>
<text x="244.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">спуском показує: кожне складене число має простий дільник — імені методу ще нема</text>
<text x="184.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">1659</text>
<circle cx="214.0" cy="204.0" r="8.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="244.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Лист до П'єра де Каркаві — «науковий заповіт»</text>
<text x="244.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">метод дістає назву descente infinie; заявлено п'ять теорем</text>
<text x="184.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1665</text>
<circle cx="214.0" cy="283.0" r="8.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="244.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ферма помирає в Кастрі</text>
<text x="244.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">майже всі його доведення лишилися усною обіцянкою, без рядка викладу</text>
<text x="184.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1670</text>
<circle cx="214.0" cy="362.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="244.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Син друкує «Арифметику» Діофанта з нотатками батька</text>
<text x="244.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">уціліле єдине повне доведення — площа трикутника не квадрат (Observatio XLV)</text>
<text x="184.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1749</text>
<circle cx="214.0" cy="441.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="244.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ейлер доводить теорему про суму двох квадратів</text>
<text x="244.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тим самим спуском; заявку Ферма вперше замкнено на папері</text>
<text x="184.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1770</text>
<circle cx="214.0" cy="505.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="244.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ейлер закриває показник куба, n = 3</text>
<text x="244.0" y="521.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">метод реконструйовано з уламків і повернуто в живу науку</text>
<text x="450.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">ідея — Евклідова · ім'я — Ферма · доведення — спільні</text>
</svg>