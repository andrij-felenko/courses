<text x="306.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">×2  y₁ пропущено</text>
<text x="626.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">×4  x₂ і y₂ пропущені</text>
<text x="650.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="650.0" dy="0.0">скільки наборів дає 1</tspan><tspan x="650.0" dy="16.9">у піддереві вузла:</tspan><tspan x="650.0" dy="16.9"></tspan><tspan x="650.0" dy="16.9">y₂ →  1</tspan><tspan x="650.0" dy="16.9">x₂ →  1</tspan><tspan x="650.0" dy="16.9">y₁ →  1 + 4 = 5</tspan><tspan x="650.0" dy="16.9">x₁ →  5 + 2 = 7</tspan></text>
<text x="430.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">шляхів до листка «1» — три, а наборів  4 + 1 + 2 = 7</text>
