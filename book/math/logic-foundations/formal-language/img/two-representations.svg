<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="432" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ручки на одній мові</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">L = a* = { ε, a, aa, aaa, … } — одна мова, два способи її тримати</text>
<rect x="40.0" y="82.0" width="430.0" height="256.0" rx="12" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="255.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ПРЕДИКАТ</text>
<text x="255.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">питаємо про ОДНЕ слово</text>
<rect x="70.0" y="144.0" width="370.0" height="40.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/>
<text x="255.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">w  →  ( w ∈ L ? )  →  ✓ або ✗</text>
<text x="96.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">«aa»</text>
<line x1="152.0" y1="212.0" x2="198.0" y2="212.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#ar_27ae60)"/>
<text x="212.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">✓  належить</text>
<text x="96.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">«ab»</text>
<line x1="152.0" y1="238.0" x2="198.0" y2="238.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#ar_c0392b)"/>
<text x="212.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">✗  не належить</text>
<rect x="70.0" y="264.0" width="370.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Відповідає І «так», І «ні».</tspan><tspan x="255.0" dy="15.6">Якщо завжди спиняється — це РОЗВ'ЯЗУВАЧ.</tspan></text>
<rect x="530.0" y="82.0" width="430.0" height="256.0" rx="12" fill="#fbfcfe" stroke="#27ae60" stroke-width="1.8"/>
<text x="745.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ГЕНЕРАТОР</text>
<text x="745.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">просимо НАСТУПНЕ слово</text>
<rect x="548.0" y="150.0" width="66.0" height="34.0" rx="4" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/><text x="581.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ε</text>
<rect x="620.0" y="150.0" width="66.0" height="34.0" rx="4" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/><text x="653.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<rect x="692.0" y="150.0" width="66.0" height="34.0" rx="4" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/><text x="725.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">aa</text>
<rect x="764.0" y="150.0" width="66.0" height="34.0" rx="4" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/><text x="797.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">aaa</text>
<rect x="836.0" y="150.0" width="66.0" height="34.0" rx="4" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/><text x="869.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">aaaa</text>
<text x="916.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start">…</text>
<line x1="548.0" y1="202.0" x2="918.0" y2="202.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#ar_27ae60)"/>
<text x="745.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">по одному, у шортлекс-порядку — далі без кінця</text>
<rect x="560.0" y="244.0" width="372.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="746.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="746.0" dy="0.0">Видає всі слова по черзі.</tspan><tspan x="746.0" dy="15.6">Прямого «ні» про конкретне слово не каже —</tspan><tspan x="746.0" dy="15.6">лише «ось наступне».</tspan></text>
<rect x="40.0" y="356.0" width="920.0" height="60.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="382.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Предикат обводить множину контуром; генератор виписує її вміст по одному. Та сама мова L —</tspan><tspan x="500.0" dy="16.2">а питання, на які кожна ручка відповідає ЛЕГКО, різні: одна вирішує належність, друга лише перелічує.</tspan></text>
</svg>