<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker></defs>
<text x="530.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама дія в чотирьох убраннях</text>
<text x="530.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ліворуч — взірець, праворуч — на що його замінити; більше нічого</text>
<rect x="40.0" y="88.0" width="560.0" height="84.0" rx="10" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<rect x="54.0" y="104.0" width="120.0" height="52.0" rx="7" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/>
<text x="114.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Туе</text>
<text x="114.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1914</text>
<text x="390.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">… a b …   →   … b a …</text>
<text x="390.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">переписати підрядок у рядку</text>
<rect x="40.0" y="188.0" width="560.0" height="84.0" rx="10" fill="#fbfcfe" stroke="#c0392b" stroke-width="1.8"/>
<rect x="54.0" y="204.0" width="120.0" height="52.0" rx="7" fill="#eef2fb" stroke="#c0392b" stroke-width="1.4"/>
<text x="114.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пост</text>
<text x="114.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1943</text>
<text x="390.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">g $   →   $ h</text>
<text x="390.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">продукція — породжує рядок</text>
<rect x="40.0" y="288.0" width="560.0" height="84.0" rx="10" fill="#fbfcfe" stroke="#c0392b" stroke-width="1.8"/>
<rect x="54.0" y="304.0" width="120.0" height="52.0" rx="7" fill="#eef2fb" stroke="#c0392b" stroke-width="1.4"/>
<text x="114.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хомський</text>
<text x="114.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1956</text>
<text x="390.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">S   →   a S b</text>
<text x="390.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">правило граматики</text>
<rect x="40.0" y="388.0" width="560.0" height="84.0" rx="10" fill="#fbfcfe" stroke="#27ae60" stroke-width="1.8"/>
<rect x="54.0" y="404.0" width="120.0" height="52.0" rx="7" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/>
<text x="114.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бекус</text>
<text x="114.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1959</text>
<text x="390.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">⟨вираз⟩ ::= ⟨вираз⟩ + ⟨доданок⟩</text>
<text x="390.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">правило BNF</text>
<rect x="636.0" y="88.0" width="384.0" height="384.0" rx="12" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="828.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Одна дія в дії</text>
<rect x="660.0" y="134.0" width="336.0" height="40.0" rx="6" fill="#eef2fb" stroke="#c9ced6" stroke-width="1.2"/>
<text x="828.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">граматика:   S → a S b     S → ε</tspan></text>
<text x="828.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">S</tspan><tspan x="828.0" dy="22.5">⇒  a S b</tspan><tspan x="828.0" dy="22.5">⇒  a a S b b</tspan><tspan x="828.0" dy="22.5">⇒  a a b b</tspan></text>
<rect x="660.0" y="298.0" width="336.0" height="88.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="828.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="828.0" dy="0.0">Виросло aabb — стільки ж a, скільки b, у такому</tspan><tspan x="828.0" dy="13.0">порядку. Саме такі мови й вимагають драбини</tspan><tspan x="828.0" dy="13.0">класів: скінченному автомату вони не під силу,</tspan><tspan x="828.0" dy="13.0">бо лічити відкриті дужки він не вміє.</tspan></text>
<rect x="40.0" y="482.0" width="980.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="502.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Задача про слово, система-продукція, правило граматики й правило BNF — це те саме переписування в різних убраннях. Хто відкривав опис синтаксису мови програмування — читав правнука задачі Туе.</tspan></text>
</svg>