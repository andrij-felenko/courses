<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операції над мовами: дві зі спадку множин, дві — свої</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">наскрізний приклад над Σ = {a, b}</text>
<rect x="250.0" y="76.0" width="220.0" height="56.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="360.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">A = { a, ab }</text>
<rect x="530.0" y="76.0" width="220.0" height="56.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="640.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">B = { b, ba }</text>
<rect x="30.0" y="168.0" width="223.0" height="268.0" rx="10" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="141.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">A ∪ B</text>
<text x="141.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">зі спадку множин</text>
<rect x="269.0" y="168.0" width="223.0" height="268.0" rx="10" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="380.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">A ∩ B</text>
<text x="380.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">зі спадку множин</text>
<rect x="508.0" y="168.0" width="223.0" height="268.0" rx="10" fill="#fbfcfe" stroke="#c0392b" stroke-width="1.8"/>
<text x="619.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">A · B</text>
<text x="619.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">СКЛЕЙКА — своя</text>
<rect x="747.0" y="168.0" width="223.0" height="268.0" rx="10" fill="#fbfcfe" stroke="#c0392b" stroke-width="1.8"/>
<text x="858.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">A*</text>
<text x="858.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ЗІРКА КЛІНІ — своя</text>
<rect x="46.0" y="244.0" width="191.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="141.5" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">{ a, ab, b, ba }</text>
<text x="141.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="141.5" dy="0.0">Слово в результаті,</tspan><tspan x="141.5" dy="17.2">якщо воно є бодай</tspan><tspan x="141.5" dy="17.2">в одній із двох мов.</tspan><tspan x="141.5" dy="17.2"></tspan><tspan x="141.5" dy="17.2">Просто зсипали разом —</tspan><tspan x="141.5" dy="17.2">нічого нового.</tspan></text>
<rect x="285.0" y="244.0" width="191.0" height="44.0" rx="6" fill="#f0f1f3" stroke="#6b7280" stroke-width="1.6"/>
<text x="380.5" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="700">∅</text>
<text x="380.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.5" dy="0.0">Спільних слів немає.</tspan><tspan x="380.5" dy="17.2"></tspan><tspan x="380.5" dy="17.2">∅ — теж повноцінна</tspan><tspan x="380.5" dy="17.2">мова: підмножина, у якій</tspan><tspan x="380.5" dy="17.2">нема жодного слова.</tspan><tspan x="380.5" dy="17.2"></tspan><tspan x="380.5" dy="17.2">Не плутати з { ε }.</tspan></text>
<rect x="526.0" y="246.0" width="62.0" height="30.0" rx="0" fill="#e9edf3" stroke="#c9ced6" stroke-width="1.0"/><text x="557.0" y="265.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">·</text>
<rect x="588.0" y="246.0" width="62.0" height="30.0" rx="0" fill="#e9edf3" stroke="#c9ced6" stroke-width="1.0"/><text x="619.0" y="265.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">b</text>
<rect x="650.0" y="246.0" width="62.0" height="30.0" rx="0" fill="#e9edf3" stroke="#c9ced6" stroke-width="1.0"/><text x="681.0" y="265.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ba</text>
<rect x="526.0" y="276.0" width="62.0" height="30.0" rx="0" fill="#e9edf3" stroke="#c9ced6" stroke-width="1.0"/><text x="557.0" y="295.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">a</text>
<rect x="588.0" y="276.0" width="62.0" height="30.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="619.0" y="295.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ab</text>
<rect x="650.0" y="276.0" width="62.0" height="30.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="681.0" y="295.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">aba</text>
<rect x="526.0" y="306.0" width="62.0" height="30.0" rx="0" fill="#e9edf3" stroke="#c9ced6" stroke-width="1.0"/><text x="557.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ab</text>
<rect x="588.0" y="306.0" width="62.0" height="30.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="619.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">abb</text>
<rect x="650.0" y="306.0" width="62.0" height="30.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="681.0" y="325.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">abba</text>
<text x="619.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="619.5" dy="0.0">A · B = { u·v : u ∈ A, v ∈ B }</tspan><tspan x="619.5" dy="17.2"></tspan><tspan x="619.5" dy="17.2">кожне слово з A, і за ним</tspan><tspan x="619.5" dy="17.2">кожне слово з B —</tspan><tspan x="619.5" dy="17.2">усі чотири пари склеєні.</tspan></text>
<text x="858.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="858.5" dy="0.0">A⁰ = { ε }</tspan><tspan x="858.5" dy="18.6">A¹ = { a, ab }</tspan><tspan x="858.5" dy="18.6">A² = { aa, aab, aba, abab }</tspan><tspan x="858.5" dy="18.6">A³ = … (8 слів)</tspan></text>
<rect x="763.0" y="336.0" width="191.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="858.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A* = A⁰ ∪ A¹ ∪ A² ∪ …</text>
<text x="858.5" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="858.5" dy="0.0">Будь-скільки склейок поспіль,</tspan><tspan x="858.5" dy="17.2">включно з НУЛЕМ —</tspan><tspan x="858.5" dy="17.2">саме нуль і дає ε.</tspan></text>
<rect x="30.0" y="458.0" width="940.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">∪, ∩ і доповнення дісталися задарма: мова — звичайна множина. А склейка й зірка працюють ЛИШЕ тому,</tspan><tspan x="500.0" dy="16.2">що елементи мови — СЛОВА, які можна дописувати одне до одного; для довільних множин вони позбавлені змісту.</tspan><tspan x="500.0" dy="16.2">Звідси й позначення Σ*: погляньте на алфавіт як на мову з однолітерних слів — тоді його зірка Кліні</tspan><tspan x="500.0" dy="16.2">і є множина всіх скінченних слів над Σ. Збігу немає: це буквально та сама операція.</tspan></text>
</svg>