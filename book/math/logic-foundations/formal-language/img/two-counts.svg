<rect x="30.0" y="400.0" width="1000.0" height="82.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="429.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Багато описів припадає на ту саму мову, тож названих мов щонайбільше стільки ж, скільки описів: ℵ₀.</tspan><tspan x="530.0" dy="16.2">А всіх мов 2^ℵ₀. Різниця 2^ℵ₀ − ℵ₀ = 2^ℵ₀: безіменних не просто більшість — це майже всі мови,</tspan><tspan x="530.0" dy="16.2">і жодну з них не можна пред'явити нарізно — бо вказати на неї означало б її описати.</tspan></text>
