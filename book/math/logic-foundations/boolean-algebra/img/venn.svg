  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама логіка через множини — як і думав Буль про «класи»</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">AND — це перетин, OR — об'єднання, NOT — доповнення (усе поза множиною)</text>
<rect x="50.0" y="90.0" width="250.0" height="200.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="175.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">AND = перет: A · B</text>
<path d="M 175.0,165.1 A 46,46 0 0 1 175.0,234.9 A 46,46 0 0 1 175.0,165.1 Z" fill="#cdeccf" stroke="none"/>
<circle cx="145.0" cy="200.0" r="46.0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="205.0" cy="200.0" r="46.0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="125.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="225.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="175.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тільки спільне</text>
<rect x="315.0" y="90.0" width="250.0" height="200.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="440.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">OR = об'єдн.: A + B</text>
<circle cx="410.0" cy="200.0" r="46.0" fill="#cdeccf" stroke="none" stroke-width="0"/>
<circle cx="470.0" cy="200.0" r="46.0" fill="#cdeccf" stroke="none" stroke-width="0"/>
<circle cx="410.0" cy="200.0" r="46.0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="470.0" cy="200.0" r="46.0" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="390.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="490.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="440.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">усе разом</text>
<rect x="580.0" y="90.0" width="250.0" height="200.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="705.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">NOT = поза: Ā</text>
<rect x="598.0" y="130.0" width="214.0" height="130.0" rx="0" fill="#eafaef" stroke="none" stroke-width="0"/>
<circle cx="705.0" cy="200.0" r="46.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="705.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="620.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ā</text>
<text x="705.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">усе, що НЕ A</text>
</svg>
