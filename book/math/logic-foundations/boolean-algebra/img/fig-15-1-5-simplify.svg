<line x1="186.0" y1="250.0" x2="220.0" y2="226.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="110.0" y1="300.0" x2="220.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="360.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→</text>
<text x="560.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАЛО: просто дріт</text>
<line x1="470.0" y1="250.0" x2="650.0" y2="250.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<text x="462.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<text x="658.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Y = A</text>
<circle cx="470.0" cy="250.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<rect x="70.0" y="360.0" width="740.0" height="40.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Менше вентилів → дешевше, швидше, менше тепла. Оце і є «спростити алгеброю» з історії Шеннона.</text>
</svg>
