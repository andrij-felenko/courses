<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол діаграми — це не «крок обчислення», а окреме звуження функції</text>
<text x="60.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">усі звуження f = a·b + c за префіксами порядку a &lt; b &lt; c</text>
<text x="66.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">нічого не фіксуємо</text>
<rect x="221.0" y="93.5" width="158.0" height="33.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">f = a·b + c</tspan></text>
<text x="66.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">фіксуємо a</text>
<rect x="221.0" y="169.5" width="158.0" height="33.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">f|a=0 = c</tspan></text>
<rect x="393.0" y="169.5" width="158.0" height="33.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.5"/><text x="472.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">f|a=1 = b + c</tspan></text>
<text x="66.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">фіксуємо a, b</text>
<rect x="221.0" y="245.5" width="158.0" height="33.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">f|a=0,b=0 = c</tspan></text>
<rect x="393.0" y="245.5" width="158.0" height="33.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="472.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">f|a=0,b=1 = c</tspan></text>
<rect x="221.0" y="287.5" width="158.0" height="33.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">f|a=1,b=0 = c</tspan></text>
<rect x="393.0" y="287.5" width="158.0" height="33.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="472.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">f|a=1,b=1 = 1</tspan></text>
<text x="66.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">фіксуємо a, b, c</text>
<rect x="221.0" y="359.5" width="158.0" height="33.0" rx="6" fill="#eef1f5" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">константи 0 і 1</tspan></text>
<rect x="60.2" y="438.4" width="423.6" height="63.2" rx="6" fill="#e8f8ee" stroke="#27ae60" stroke-width="1.5"/><text x="272.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="272.0" dy="0.0">Різних ФУНКЦІЙ тут лише п'ять: a·b + c, b + c, c, 1, 0.</tspan><tspan x="272.0" dy="15.6">Решта — повтори: f|a=0,b=0 і f|a=1,b=0 — та сама функція c,</tspan><tspan x="272.0" dy="15.6">бо жодна з них від b не залежить.</tspan></text>
<line x1="556.0" y1="262.0" x2="636.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="596.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кожній —</text>
<text x="596.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">свій вузол</text>
<text x="860.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">діаграма тієї самої функції</text>
<line x1="820.0" y1="149.0" x2="820.0" y2="213.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="834.5" y1="142.3" x2="925.5" y2="219.7" stroke="#333333" stroke-width="1.6"/>
<line x1="921.0" y1="232.0" x2="839.0" y2="232.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="940.0" y1="251.0" x2="940.0" y2="324.0" stroke="#333333" stroke-width="1.6"/>
<line x1="820.0" y1="251.0" x2="820.0" y2="324.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="834.1" y1="244.7" x2="928.1" y2="329.3" stroke="#333333" stroke-width="1.6"/>
<circle cx="820.0" cy="130.0" r="19.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="820.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<circle cx="940.0" cy="232.0" r="19.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="940.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">b</text>
<circle cx="820.0" cy="232.0" r="19.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="820.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">c</text>
<rect x="804.0" y="326.0" width="32.0" height="28.0" rx="4" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.3"/><text x="820.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<rect x="924.0" y="326.0" width="32.0" height="28.0" rx="4" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.3"/><text x="940.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="786.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">a·b + c</text>
<text x="974.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">b + c</text>
<text x="786.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">c</text>
<text x="790.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">0</text>
<text x="970.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">1</text>
<rect x="720.0" y="402.4" width="279.9" height="63.2" rx="6" fill="#e8f8ee" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="422.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">5 різних звужень → 5 вузлів.</tspan><tspan x="860.0" dy="15.6">Вибору немає: менше — злиплися б різні</tspan><tspan x="860.0" dy="15.6">функції, більше — щось лежало б двічі.</tspan></text>
<line x1="742.0" y1="508.0" x2="778.0" y2="508.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4"/><text x="786.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">змінна = 0</text><line x1="910.0" y1="508.0" x2="946.0" y2="508.0" stroke="#333333" stroke-width="1.6"/><text x="954.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">змінна = 1</text>
<rect x="267.2" y="552.2" width="505.6" height="47.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="572.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ось чому діаграма не залежить від формули: звуження — властивість самої</tspan><tspan x="520.0" dy="15.6">функції, а формула про них нічого не знає.</tspan></text>
</svg>