<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два скорочення формально: коли вузол зайвий і коли двоє — одне</text>
<text x="60.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило вилучення — вузол з однаковими гілками</text>
<line x1="156.0" y1="132.0" x2="146.0" y2="212.0" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="180.0" y1="132.0" x2="190.0" y2="212.0" stroke="#333333" stroke-width="1.6"/>
<text x="124.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<text x="212.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1</text>
<circle cx="168.0" cy="116.0" r="19.0" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.7"/><text x="168.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">v</text>
<rect x="142.0" y="211.0" width="52.0" height="34.0" rx="6" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="168.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">w</text>
<text x="168.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">low(v) = high(v) = w</text>
<line x1="258.0" y1="176.0" x2="338.0" y2="176.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="438.0" y1="122.0" x2="438.0" y2="208.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="412.0" y="211.0" width="52.0" height="34.0" rx="6" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="438.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">w</text>
<text x="438.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="438.0" dy="0.0">стрілки, що вели у v,</tspan><tspan x="438.0" dy="15.6">ведуть прямо у w</tspan></text>
<rect x="592.5" y="120.4" width="450.9" height="63.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="818.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="818.0" dy="0.0">Обидва виходи вузла ведуть в одне місце — отже його змінна</tspan><tspan x="818.0" dy="15.6">не впливає на відповідь. Питати про неї марно: вузол викидаємо,</tspan><tspan x="818.0" dy="15.6">а вхідні стрілки ведемо туди, куди він і так показував.</tspan></text>
<line x1="60.0" y1="300.0" x2="1020.0" y2="300.0" stroke="#dfe3e8" stroke-width="1.2"/>
<text x="60.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило злиття — два вузли з тими самими гілками</text>
<line x1="130.0" y1="406.0" x2="150.0" y2="482.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="130.0" y1="406.0" x2="292.0" y2="482.0" stroke="#333333" stroke-width="1.5"/>
<line x1="250.0" y1="406.0" x2="158.0" y2="482.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="250.0" y1="406.0" x2="300.0" y2="482.0" stroke="#333333" stroke-width="1.5"/>
<circle cx="130.0" cy="388.0" r="19.0" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.7"/><text x="130.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">u</text>
<circle cx="250.0" cy="388.0" r="19.0" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.7"/><text x="250.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">v</text>
<circle cx="150.0" cy="498.0" r="18.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="150.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">p</text>
<circle cx="300.0" cy="498.0" r="18.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="300.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">q</text>
<line x1="360.0" y1="443.0" x2="440.0" y2="443.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="542.0" y1="410.0" x2="512.0" y2="482.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="542.0" y1="410.0" x2="572.0" y2="482.0" stroke="#333333" stroke-width="1.5"/>
<circle cx="542.0" cy="388.0" r="23.0" fill="#e8f8ee" stroke="#1a1a1a" stroke-width="1.7"/><text x="542.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">u≡v</text>
<circle cx="510.0" cy="498.0" r="18.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="510.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">p</text>
<circle cx="574.0" cy="498.0" r="18.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.7"/><text x="574.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">q</text>
<text x="300.0" y="543.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">та сама змінна xᵢ, ті самі p і q  ⟹  та сама функція</text>
<rect x="633.6" y="398.4" width="416.7" height="63.2" rx="6" fill="#e8f8ee" stroke="#27ae60" stroke-width="1.5"/><text x="842.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="842.0" dy="0.0">Однакова змінна й однакові діти — отже той самий кофактор,</tspan><tspan x="842.0" dy="15.6">та сама функція. Два примірники зайві: лишаємо один вузол,</tspan><tspan x="842.0" dy="15.6">усі посилання перенаправляємо на нього.</tspan></text>
</svg>