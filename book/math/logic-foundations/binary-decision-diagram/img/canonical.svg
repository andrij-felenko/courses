<rect x="205.9" y="536.2" width="608.2" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Де аналогія ламається: у дробів представника видно оком — поділив на НСД, і по всьому.</tspan><tspan x="510.0" dy="15.6">У функції його не видно ніяк: діаграму треба спершу побудувати, а вона буває завелика.</tspan></text>
