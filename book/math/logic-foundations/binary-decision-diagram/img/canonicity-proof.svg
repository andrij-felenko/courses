<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому скорочена діаграма єдина: вузли в бієкції зі звуженнями функції</text>
<text x="548.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один крок індукції: вузол змушений своїми двома звуженнями</text>
<line x1="252.7" y1="149.7" x2="187.8" y2="273.9" stroke="#333333" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="271.3" y1="149.7" x2="336.2" y2="273.9" stroke="#333333" stroke-width="1.6"/>
<text x="196.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">xᵢ = 0</text>
<text x="330.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">xᵢ = 1</text>
<circle cx="262.0" cy="132.0" r="20.0" fill="#eef4ff" stroke="#1a1a1a" stroke-width="1.7"/><text x="262.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">g</text>
<text x="294.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">рівень i, змінна xᵢ</text>
<circle cx="172.0" cy="304.0" r="30.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="172.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">g₀</text>
<text x="172.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">g|xᵢ=0</text>
<circle cx="352.0" cy="304.0" r="30.0" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="352.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">g₁</text>
<text x="352.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">g|xᵢ=1</text>
<rect x="115.2" y="378.2" width="293.6" height="47.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="262.0" y="398.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">рівні &gt; i: за припущенням індукції</tspan><tspan x="262.0" dy="15.6">кожне звуження вже має свій ЄДИНИЙ вузол</tspan></text>
<line x1="538.0" y1="92.0" x2="538.0" y2="512.0" stroke="#dfe3e8" stroke-width="1.2"/>
<rect x="716.5" y="134.0" width="191.0" height="32.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="812.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">g істотно залежить від xᵢ</tspan></text>
<rect x="752.0" y="200.0" width="120.0" height="32.0" rx="6" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="812.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">⟹   g₀ ≠ g₁</tspan></text>
<rect x="610.5" y="266.0" width="403.0" height="32.0" rx="6" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="812.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">⟹   node(g₀) ≠ node(g₁)   (різні звуження — різні вузли)</tspan></text>
<rect x="624.2" y="332.0" width="375.7" height="32.0" rx="6" fill="#e8f8ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="352.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">⟹   low ≠ high: вузол не зайвий, переживає вилучення</tspan></text>
<rect x="651.5" y="404.4" width="321.0" height="63.2" rx="6" fill="#e8f8ee" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">а правило злиття  ⟹  такий вузол рівно ОДИН.</tspan><tspan x="812.0" dy="15.6">Отже кожному звуженню — свій єдиний вузол,</tspan><tspan x="812.0" dy="15.6">а low і high теж задані звуженнями g₀, g₁.</tspan></text>
<rect x="228.8" y="518.2" width="642.4" height="47.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="538.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Уся діаграма визначена функцією f — її звуженнями, а не записом.</tspan><tspan x="550.0" dy="15.6">Дві скорочені діаграми однієї f збігаються вузол-у-вузол;   |вузли| = число різних звужень.</tspan></text>
</svg>