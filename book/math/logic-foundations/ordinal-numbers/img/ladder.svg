<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина ординалів: наступники й границі</text>
<text x="520.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кожен ординал — або 0, або наступник β+1 (є найбільший менший), або границя (найбільшого меншого немає)</text>
<line x1="70.0" y1="205.0" x2="965.0" y2="205.0" stroke="#1a1a1a" stroke-width="1.7"/>
<line x1="945.0" y1="205.0" x2="978.0" y2="205.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="100.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
<circle cx="150.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="150.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text>
<circle cx="200.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="200.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">2</text>
<circle cx="250.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="250.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="292.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="360.0" cy="205.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="360.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ω</text>
<line x1="360.0" y1="247.0" x2="360.0" y2="218.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="360.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">гранична</text>
<circle cx="422.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="422.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ω+1</text>
<circle cx="486.0" cy="205.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="486.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ω+2</text>
<text x="534.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="610.0" cy="205.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="610.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ω·2</text>
<line x1="610.0" y1="247.0" x2="610.0" y2="218.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="610.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">гранична</text>
<text x="680.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="772.0" cy="205.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="772.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ω²</text>
<line x1="772.0" y1="247.0" x2="772.0" y2="218.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="772.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">гранична</text>
<text x="848.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<text x="910.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ω^ω, ε₀, …</text>
<text x="300.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">щоб дістатися ω, треба зібрати ВСЮ низку 0,1,2,… — «ω−1» не існує</text>
<path d="M 296 136 Q 326 168 350 198" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
<text x="452.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">наступник: +1 крок,</text>
<text x="452.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">найбільший менший — ω</text>
<line x1="460.0" y1="172.0" x2="432.0" y2="198.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Крок уперед завжди дає наступника. Але щоб перескочити за ВСЮ нескінченну низку,</tspan><tspan x="520.0" dy="16.2">потрібен новий сорт числа — границя, яку видно лише «знизу», зібравши все, що менше.</tspan></text>
<circle cx="360.0" cy="370.0" r="6.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="374.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">гранична (попередника нема)</text>
<circle cx="620.0" cy="370.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="634.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">наступник (є найбільший менший)</text>
</svg>