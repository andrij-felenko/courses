<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро доказу: число летить угору, ординал-тінь строго спадає</text>
<text x="590.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">послідовність Ґудстейна від 4 — і поряд її тінь: заміни основу на ω, дістанеш ординал у КНФ, що меншає щокроку</text>
<text x="60.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Число Ґудстейна — натуральне, РОСТЕ вибухово</text>
<rect x="118.0" y="132.5" width="64.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">4</tspan></text>
<rect x="368.0" y="132.5" width="64.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">26</tspan></text>
<rect x="618.0" y="132.5" width="64.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">41</tspan></text>
<rect x="848.0" y="132.5" width="64.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">60</tspan></text>
<line x1="965.0" y1="150.0" x2="1040.0" y2="150.0" stroke="#c0392b" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="1000.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">… пік 3·2⁴⁰²⁶⁵³²¹⁰−1 …</text>
<rect x="1058.0" y="132.5" width="64.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="1090.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">0</tspan></text>
<rect x="150.0" y="222.0" width="890.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="595.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">щокроку тінь робить дві речі:</tspan><tspan x="595.0" dy="16.2">① основа n→n+1 — ординал НЕ змінюється (і там, і там основа стає ω)     ② відняти 1 — ординал строго меншає</tspan></text>
<text x="60.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Ординал-тінь (канторова нормальна форма) — СТРОГО СПАДАЄ</text>
<rect x="118.0" y="355.5" width="64.0" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ω^ω</tspan></text>
<rect x="333.6" y="355.5" width="132.8" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ω²·2 + ω·2 + 2</tspan></text>
<text x="257.8" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">&gt;</text>
<rect x="583.6" y="355.5" width="132.8" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">ω²·2 + ω·2 + 1</tspan></text>
<text x="525.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">&gt;</text>
<rect x="829.7" y="355.5" width="100.6" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">ω²·2 + ω·2</tspan></text>
<text x="773.1" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">&gt;</text>
<line x1="965.0" y1="372.0" x2="1040.0" y2="372.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="1000.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">… усе &lt; ω^ω …</text>
<rect x="1058.0" y="354.5" width="64.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="1090.0" y="377.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">0</tspan></text>
<text x="590.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Число вільне рости хоч до небес. Але тінь — ординал, а ординали не спадають вічно (повне впорядкування):</tspan><tspan x="590.0" dy="16.2">строго спадна низка ординалів завжди скінченна. Тож і кроків скінченно — послідовність мусить дійти 0.</tspan></text>
</svg>