<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама множина, інший порядок — інший ординал</text>
<text x="500.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">перевпорядкуй ℕ як «спершу парні, потім непарні»: розмір той самий, а форма порядку довша</text>
<text x="400.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Натуральний порядок  0, 1, 2, 3, …</text>
<line x1="90.0" y1="152.0" x2="740.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.7"/>
<circle cx="130.0" cy="152.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="130.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
<circle cx="205.0" cy="152.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="205.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
<circle cx="280.0" cy="152.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="280.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text>
<circle cx="355.0" cy="152.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="355.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text>
<circle cx="430.0" cy="152.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="430.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">4</text>
<circle cx="505.0" cy="152.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="505.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5</text>
<text x="580.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<rect x="848.0" y="133.0" width="74.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="885.0" y="158.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">ω</tspan></text>
<text x="95.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">у кожного елемента — скінченно багато попередників</text>
<text x="400.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Те саме, але «спершу всі парні, тоді всі непарні»</text>
<line x1="90.0" y1="330.0" x2="740.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.7"/>
<circle cx="130.0" cy="330.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="130.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
<circle cx="200.0" cy="330.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="200.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text>
<circle cx="270.0" cy="330.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="270.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">4</text>
<circle cx="340.0" cy="330.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="340.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">6</text>
<text x="398.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="512.0" cy="330.0" r="10.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="512.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<circle cx="582.0" cy="330.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="582.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text>
<circle cx="652.0" cy="330.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="652.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">5</text>
<text x="710.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<rect x="848.0" y="311.0" width="74.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="336.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="885.0" dy="0.0">ω·2</tspan></text>
<text x="512.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">перед «1» стоїть ціле ω парних</text>
<line x1="512.0" y1="312.0" x2="512.0" y2="318.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 128.0 348.0 L 128.0 356.0 L 400.0 356.0 L 400.0 348.0" fill="none" stroke="#2457d6" stroke-width="1.5"/>
<text x="264.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">копія ω</text>
<path d="M 500.0 348.0 L 500.0 356.0 L 712.0 356.0 L 712.0 348.0" fill="none" stroke="#2457d6" stroke-width="1.5"/>
<text x="606.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">друга копія ω</text>
<text x="500.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Точок стільки ж — уся ℕ, розмір ℵ₀ (зліченна множина).</tspan><tspan x="500.0" dy="16.2">Змінилася лише ФОРМА порядку: тепер є елемент із нескінченністю попередників.</tspan></text>
</svg>