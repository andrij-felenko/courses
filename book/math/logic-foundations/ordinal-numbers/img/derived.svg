<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як народилося ω: похідні множини, що не кінчаються</text>
<text x="530.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кантор лічив кроки «лишити самі граничні точки». Коли кроки не уриваються, показник тікає за всі скінченні числа.</text>
<text x="72.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Перший рід — похідна кінець кінцем порожніє</text>
<rect x="123.0" y="133.2" width="54.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">P</tspan></text>
<rect x="291.2" y="133.2" width="81.6" height="33.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="332.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="332.0" dy="0.0">P′ = {0}</tspan></text>
<rect x="478.9" y="133.2" width="66.2" height="33.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="512.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="512.0" dy="0.0">P″ = ∅</tspan></text>
<line x1="182.0" y1="150.0" x2="285.2" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="377.8" y1="150.0" x2="472.9" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="512.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">кінець</text>
<text x="612.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">за скінченне число кроків похідна порожніє —</text>
<text x="612.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">показник лишається звичайним натуральним числом.</text>
<text x="72.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">напр.: точки 1, ½, ⅓, ¼, … збігаються до 0, тож P′ = {0}, а наступна похідна вже порожня.</text>
<line x1="72.0" y1="228.0" x2="988.0" y2="228.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<text x="72.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Другий рід — похідна не порожніє НІКОЛИ</text>
<line x1="80.0" y1="340.0" x2="992.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.7"/>
<line x1="972.0" y1="340.0" x2="1006.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<circle cx="115.0" cy="340.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="115.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">P</text>
<circle cx="192.0" cy="340.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="192.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">P′</text>
<circle cx="269.0" cy="340.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="269.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">P″</text>
<circle cx="346.0" cy="340.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="346.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">P‴</text>
<text x="400.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="486.0" cy="340.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="486.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">P^∞</text>
<circle cx="602.0" cy="340.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="602.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">P^(∞+1)</text>
<circle cx="714.0" cy="340.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="714.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">P^(∞+2)</text>
<text x="775.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="872.0" cy="340.0" r="9.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="872.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">P^(∞·2)</text>
<text x="942.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<text x="360.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">показник вискочив за ВСІ скінченні —</text>
<text x="360.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">його довелося ВИГАДАТИ</text>
<path d="M 446 303 Q 460 316 481 331" fill="none" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 456.0 356.0 L 456.0 364.0 L 906.0 364.0 L 906.0 356.0" fill="none" stroke="#27ae60" stroke-width="1.5"/>
<text x="681.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ці показники — майбутні ординали; символ ∞ Кантор 1883 р. переназве на ω</text>
</svg>