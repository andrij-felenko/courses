<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ординал — це множина всіх менших за нього</text>
<text x="520.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">0 = ∅;   наступник  α+1 = α ∪ {α};   «менше» — це «належить»:  α &lt; β  ⟺  α ∈ β</text>
<rect x="70.0" y="96.0" width="130.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">0 = ∅</tspan></text>
<rect x="220.0" y="96.0" width="140.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">1 = {0}</tspan></text>
<line x1="204.0" y1="126.0" x2="214.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="380.0" y="96.0" width="170.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="465.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">2 = {0, 1}</tspan></text>
<line x1="364.0" y1="126.0" x2="374.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570.0" y="96.0" width="200.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="130.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">3 = {0, 1, 2}</tspan></text>
<line x1="554.0" y1="126.0" x2="564.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="774.0" y1="126.0" x2="810.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="828.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="start" font-weight="700">…</text>
<text x="520.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">0 ∈ 1 ∈ 2 ∈ 3 ∈ …    (тобто  0 &lt; 1 &lt; 2 &lt; 3 &lt; …)</text>
<rect x="120.0" y="250.0" width="350.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">ω = {0, 1, 2, 3, …}</tspan><tspan x="295.0" dy="17.6"></tspan><tspan x="295.0" dy="17.6">перша границя:</tspan><tspan x="295.0" dy="17.6">усі скінченні разом</tspan></text>
<line x1="478.0" y1="298.0" x2="556.0" y2="298.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="517.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">α∪{α}</text>
<rect x="564.0" y="250.0" width="380.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="754.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="754.0" dy="0.0">ω+1 = ω ∪ {ω} = {0, 1, 2, …, ω}</tspan><tspan x="754.0" dy="17.6"></tspan><tspan x="754.0" dy="17.6">наступник ω:</tspan><tspan x="754.0" dy="17.6">докинули в множину саме ω</tspan></text>
<text x="520.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наступник — «докинь себе». Границя — об'єднай усе нижче:  ω = 0 ∪ 1 ∪ 2 ∪ …</text>
</svg>