<rect x="723.5" y="406.5" width="113.0" height="35.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">тінь = ω·2</tspan></text>
<text x="540.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гілок побільшало — а ординал-тінь упав:  ω² &gt; ω·2.</text>
<text x="540.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Листок = 0;  вузол з піддеревами β₁ ≥ … ≥ βₖ  →  ω^β₁ + … + ω^βₖ.  Спад той самий, що в Ґудстейна — і так само не довести в PA.</text>
