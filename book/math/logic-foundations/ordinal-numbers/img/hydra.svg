<text x="287.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">голова</text>
<line x1="174.0" y1="189.0" x2="200.0" y2="207.0" stroke="#c0392b" stroke-width="2.4"/>
