<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 486" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="486" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канторова нормальна форма й стеля ε₀</text>
<text x="530.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ординал за основою ω — як число за основою 10; вежа степенів упирається в нерухому точку</text>
<line x1="560.0" y1="82.0" x2="560.0" y2="456.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,5"/>
<text x="70.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Позиційний запис за основою ω</text>
<text x="70.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">2026  =  10³·2 + 10²·0 + 10·2 + 6</text>
<text x="70.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(розряди — степені 10, цифри — скінченні)</text>
<text x="70.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">α  =  ω^ω·2 + ω³·5 + ω·7 + 4</text>
<text x="70.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">показники:  ω &gt; 3 &gt; 1 &gt; 0</text>
<text x="70.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">СТРОГО спадають — інакше молодший розряд</text>
<text x="70.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">всмоктався б:  ω^мале + ω^велике = ω^велике</text>
<text x="70.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">цифри:  2, 5, 7, 4</text>
<text x="70.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">скінченні — бо  ω^β·ω = ω^(β+1)</text>
<rect x="70.0" y="364.0" width="456.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="298.0" y="389.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">нижче ε₀ показники самі менші за α → запис зводиться до скінченного дерева чисел</tspan></text>
<text x="810.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вежа степенів  →  ε₀</text>
<text x="770.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω</text>
<text x="770.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω^ω</text>
<text x="770.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω^ω^ω</text>
<text x="770.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω^ω^ω^ω</text>
<text x="770.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">⋮</text>
<line x1="888.0" y1="436.0" x2="888.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="902.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">sup усієї вежі</text>
<rect x="735.0" y="205.5" width="150.0" height="37.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="229.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">ε₀ = ω^ε₀</tspan></text>
<text x="810.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">перша нерухома точка  α = ω^α</text>
<rect x="660.0" y="130.0" width="300.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">тут запис за основою ω кусає власний хвіст</tspan></text>
</svg>