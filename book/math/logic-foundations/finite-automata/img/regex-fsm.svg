<text x="60.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Алгебра рядків (regex) над алфавітом Σ = {0, 1}</text>
<text x="60.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">три операції — і будь-яка «регулярна» множина рядків:</text>
<rect x="60.0" y="78.0" width="224.0" height="66.0" rx="9" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="74.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">вибір</text>
<text x="74.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">a | b</text>
<text x="152.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">«або a, або b»</text>
<rect x="298.0" y="78.0" width="224.0" height="66.0" rx="9" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="312.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">склейка</text>
<text x="312.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">a · b</text>
<text x="390.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">«a, за ним b»</text>
<rect x="536.0" y="78.0" width="224.0" height="66.0" rx="9" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="550.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">повтор (зірочка)</text>
<text x="550.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">a*</text>
<text x="628.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">«a нуль чи більше разів»</text>
<text x="410.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Наш приклад одним виразом — «десь у потоці стоїть 101»:</text>
<rect x="190.0" y="196.0" width="440.0" height="42.0" rx="9" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">(0|1)*  ·  1 · 0 · 1  ·  (0|1)*</text>
<text x="255.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">будь-що спереду</text>
<text x="410.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ядро 101</text>
