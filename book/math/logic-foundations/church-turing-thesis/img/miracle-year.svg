<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диво-рік обчислюваності: 1934–1937</text>
<line x1="250.0" y1="70.0" x2="250.0" y2="614.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="250.0" y1="292.0" x2="250.0" y2="492.0" stroke="#27ae60" stroke-width="5.0"/>
<text x="222.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1934 · Прінстон</text>
<circle cx="250.0" cy="92.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<rect x="280.0" y="58.0" width="660.0" height="68.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="296.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Черч пропонує λ-визначність — Гедель: «геть незадовільно»</text>
<text x="296.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Гедель означує загальнорекурсивні функції (за ідеєю Ербрана)</text>
<text x="222.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">19 квіт. 1935</text>
<circle cx="250.0" cy="192.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<rect x="280.0" y="158.0" width="660.0" height="68.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="296.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Черч виступає перед AMS + абстракт у Bull. AMS</text>
<text x="296.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перша прилюдна поява майбутньої тези</text>
<text x="222.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1936</text>
<circle cx="250.0" cy="292.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<rect x="280.0" y="258.0" width="660.0" height="68.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="296.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Черч, «Нерозв'язна задача…» (Amer. J. Math., т. 58)</text>
<text x="296.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">знаряддя: λ-числення й загальнорекурсивні функції</text>
<text x="222.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">28 трав. 1936</text>
<circle cx="250.0" cy="392.0" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<rect x="280.0" y="358.0" width="660.0" height="68.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="296.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Тюринг, «Про обчислювані числа» (надійшла до LMS)</text>
<text x="296.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">знаряддя: машина зі стрічкою, голівкою й таблицею</text>
<text x="222.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">7 жовт. 1936</text>
<circle cx="250.0" cy="492.0" r="8.0" fill="#ffffff" stroke="#b9770e" stroke-width="3.0"/>
<rect x="280.0" y="458.0" width="660.0" height="68.0" rx="8" fill="#ffffff" stroke="#b9770e" stroke-width="1.8"/>
<text x="296.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">Пост, «Скінченні комбінаторні процеси» (до JSL)</text>
<text x="296.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">знаряддя: робітник, що ставить і стирає позначки</text>
<text x="222.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1936–37</text>
<circle cx="250.0" cy="592.0" r="8.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<rect x="280.0" y="558.0" width="660.0" height="68.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="296.0" y="584.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Кліні доводить рівності формалізмів</text>
<text x="296.0" y="608.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Тюринг у Прінстоні зводить три означення в одне</text>
</svg>