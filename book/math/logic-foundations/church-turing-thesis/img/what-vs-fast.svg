<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві різні межі: «чи можна» проти «чи швидко»</text>
<circle cx="450.0" cy="285.0" r="190.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<text x="450.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Усе, що взагалі обчислюване</text>
<text x="450.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">= обчислюване машиною Тюринга</text>
<circle cx="450.0" cy="320.0" r="92" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="7,6"/>
<text x="450.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">обчислюване ШВИДКО</text>
<text x="450.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(поліноміальний час)</text>
<text x="450.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">розширена / фізична теза</text>
<rect x="372.3" y="134.8" width="155.5" height="46.5" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">квантовий комп'ютер</tspan><tspan x="450.0" dy="15.0">(алгоритм Шора)</tspan></text>
<line x1="450.0" y1="181.2" x2="450.0" y2="226.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">б'є лише сюди —</text>
<text x="560.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">по межі швидкості</text>
<text x="450.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ОСНОВНА теза — про те, ЩО взагалі обчислюване: майже беззаперечна.</text>
<text x="450.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">РОЗШИРЕНА — про те, що обчислюване ШВИДКО; саме її й випробовує квант.</text>
<text x="450.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Квантова машина не обчислює більшого — лише подекуди швидше: зовнішньої межі не руше.</text>
</svg>