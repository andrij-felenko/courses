<circle cx="632.0" cy="170.0" r="17.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="632.0" y="175.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">4</text>
