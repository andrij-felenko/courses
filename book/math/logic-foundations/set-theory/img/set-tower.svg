<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уся математика з ∅ і ∈</text>
<text x="500.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">одна субстанція (множина) плюс одне відношення (належність) — і більше нічого</text>
<rect x="148.0" y="86.0" width="560.0" height="44.0" rx="10" fill="#fdf3d7" stroke="#b8860b" stroke-width="1.6"/>
<text x="428.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">уся математика: простори, функції, аналіз, геометрія…</text>
<rect x="193.0" y="150.0" width="470.0" height="44.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="428.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ℝ — перерізи або послідовності раціональних</text>
<rect x="228.0" y="214.0" width="400.0" height="44.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="428.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ℤ, ℚ — класи еквівалентних пар</text>
<rect x="183.0" y="278.0" width="490.0" height="44.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="428.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ℕ — ординали фон Неймана:  0 = ∅,  n+1 = n ∪ {n}</text>
<rect x="213.0" y="342.0" width="430.0" height="44.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="428.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">функція = однозначне відношення  ⊆  A × B</text>
<rect x="213.0" y="406.0" width="430.0" height="44.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="428.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">впорядкована пара  (a, b) = { {a}, {a, b} }</text>
<rect x="208.0" y="476.5" width="440.0" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/><text x="428.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="428.0" dy="0.0">порожня множина ∅   ·   належність ∈</tspan></text>
<line x1="428.0" y1="476.0" x2="428.0" y2="450.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="428.0" y1="406.0" x2="428.0" y2="386.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="428.0" y1="342.0" x2="428.0" y2="322.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="428.0" y1="278.0" x2="428.0" y2="258.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="428.0" y1="214.0" x2="428.0" y2="194.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="428.0" y1="150.0" x2="428.0" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="448.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">будується з</text>
<rect x="743.0" y="241.2" width="150.0" height="117.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="818.0" y="262.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="818.0" dy="0.0">жодної</tspan><tspan x="818.0" dy="16.9">нової</tspan><tspan x="818.0" dy="16.9">сутності —</tspan><tspan x="818.0" dy="16.9">тільки</tspan><tspan x="818.0" dy="16.9">множини</tspan><tspan x="818.0" dy="16.9">й  ∈</tspan></text>
</svg>