<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Впорядкована пара: порядок, схований у множинах</text>
<text x="500.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(a, b) = { {a}, {a, b} } — множина порядку не знає, а пара його зберігає</text>
<line x1="500.0" y1="82.0" x2="500.0" y2="456.0" stroke="#dcdfe4" stroke-width="1.3"/>
<text x="258.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова  (1, 2)</text>
<rect x="58.0" y="132.0" width="400.0" height="118.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="74.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#2457d6" text-anchor="start">{</text>
<text x="442.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#2457d6" text-anchor="end">}</text>
<rect x="114.0" y="172.0" width="104.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="166.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="166.0" dy="0.0">{ 1 }</tspan></text>
<rect x="290.0" y="172.0" width="128.0" height="36.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.7"/><text x="354.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="354.0" dy="0.0">{ 1, 2 }</tspan></text>
<text x="166.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">самотній</text>
<text x="354.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">пара</text>
<rect x="88.0" y="283.2" width="340.0" height="33.5" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="258.0" y="304.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">⋂ = { 1 }   →   перший = 1</tspan></text>
<rect x="88.0" y="327.2" width="340.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="258.0" y="348.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">решта з ⋃ = { 2 }   →   другий = 2</tspan></text>
<rect x="88.0" y="383.8" width="340.0" height="32.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="258.0" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="258.0" dy="0.0">порядок читається із самої будови</tspan></text>
<text x="742.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок справді закодовано</text>
<rect x="587.0" y="138.5" width="310.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="742.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">(1, 2) = { {1}, {1, 2} }</tspan></text>
<rect x="587.0" y="182.5" width="310.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="742.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">(2, 1) = { {2}, {1, 2} }</tspan></text>
<rect x="585.5" y="237.2" width="312.9" height="33.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="742.0" y="258.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">різні множини   ⇒   (1, 2) ≠ (2, 1)</tspan></text>
<text x="742.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вироджений випадок  a = b:</text>
<rect x="587.0" y="347.0" width="310.0" height="34.0" rx="6" fill="#fdf3d7" stroke="#b8860b" stroke-width="1.4"/><text x="742.0" y="368.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">(a, a) = { {a}, {a} } = { {a} }</tspan></text>
<text x="742.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">одна множина — теж коректна пара</text>
</svg>