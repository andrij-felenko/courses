<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ґеорґ Кантор: відкриття проти опору</text>
<text x="540.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кожен прорив у теорію нескінченного наражався на люту протидію — а виправдання прийшло по смерті</text>
<line x1="120.0" y1="250.0" x2="960.0" y2="250.0" stroke="#c9ced6" stroke-width="3.0"/>
<circle cx="120.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="120.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1845</text>
<rect x="19.0" y="118.0" width="202.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="120.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Народження в С.-Петербурзі;</tspan><tspan x="120.0" dy="13.7">батько данець, матір — з роду</tspan><tspan x="120.0" dy="13.7">музикантів Бемів</tspan></text>
<circle cx="260.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="260.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1870</text>
<rect x="159.0" y="294.0" width="202.0" height="86.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="260.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Задача Гайне: чи єдиний</tspan><tspan x="260.0" dy="13.7">тригонометричний ряд функції;</tspan><tspan x="260.0" dy="13.7">вихід на множини точок</tspan></text>
<circle cx="400.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="400.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1874</text>
<rect x="299.0" y="118.0" width="202.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="400.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Дійсних БІЛЬШЕ за натуральні —</tspan><tspan x="400.0" dy="13.7">перший доказ незліченності</tspan><tspan x="400.0" dy="13.7">(журнал Крелле)</tspan></text>
<circle cx="540.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="540.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1883</text>
<rect x="439.0" y="294.0" width="202.0" height="86.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="540.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Трансфінітні ординали;</tspan><tspan x="540.0" dy="15.0">«суть математики —</tspan><tspan x="540.0" dy="15.0">у її свободі»</tspan></text>
<circle cx="680.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="680.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1891</text>
<rect x="579.0" y="118.0" width="202.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="680.0" y="150.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Діагональний метод:</tspan><tspan x="680.0" dy="15.0">простий доказ і ціла</tspan><tspan x="680.0" dy="15.0">сходинка нескінченностей</tspan></text>
<circle cx="820.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="820.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1884+</text>
<rect x="719.0" y="294.0" width="202.0" height="86.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="820.0" y="333.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Напади хвороби; смерть</tspan><tspan x="820.0" dy="15.0">сина 1899; шпиталі до кінця</tspan></text>
<circle cx="960.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="960.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1918</text>
<rect x="859.0" y="118.0" width="202.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="960.0" y="157.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Смерть у клініці Галле,</tspan><tspan x="960.0" dy="15.0">у злиднях воєнного часу</tspan></text>
<text x="305.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Люта протидія за життя</text>
<rect x="70.0" y="414.0" width="470.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="305.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Леопольд Кронекер, впливовий берлінець,</tspan><tspan x="305.0" dy="16.9">звав Кантора «розбещувачем молоді»</tspan><tspan x="305.0" dy="16.9">й роками блокував йому кафедру в Берліні —</tspan><tspan x="305.0" dy="16.9">лишивши доживати у провінційному Галле.</tspan></text>
<text x="775.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Пізнє виправдання</text>
<rect x="540.0" y="414.0" width="470.0" height="104.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Давід Гільберт, 1925:</tspan><tspan x="775.0" dy="16.9">«Із раю, що його створив нам Кантор,</tspan><tspan x="775.0" dy="16.9">нас не вижене ніхто».</tspan><tspan x="775.0" dy="16.9">Теорія множин стала основою математики.</tspan></text>
</svg>