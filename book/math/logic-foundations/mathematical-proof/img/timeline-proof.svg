<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження доведення — двадцять п'ять століть</text>
<text x="470.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">синє — кроки, що будували метод; червоне — кризи й межі строгості</text>
<line x1="300.0" y1="92.0" x2="300.0" y2="648.0" stroke="#c4c9d0" stroke-width="2.4"/>
<text x="278.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">бл. 600 до н. е.</text>
<circle cx="300.0" cy="132.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="324.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Фалес</text>
<text x="324.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перші дедуктивні докази (за традицією)</text>
<text x="278.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">V ст. до н. е.</text>
<circle cx="300.0" cy="229.2" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="324.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Піфагорійці</text>
<text x="324.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">криза несумірності: √2 — не дріб</text>
<text x="278.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">бл. 300 до н. е.</text>
<circle cx="300.0" cy="326.4" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="324.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Евклід · «Начала»</text>
<text x="324.0" y="341.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">аксіоматичний зразок: 5+5 засад → 465 тверджень</text>
<text x="278.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">XVII–XIX ст.</text>
<circle cx="300.0" cy="423.6" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="324.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Криза строгості</text>
<text x="324.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">нескінченно малі → ε–δ означення границі</text>
<text x="278.0" y="516.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1900–1920-ті</text>
<circle cx="300.0" cy="520.8" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="324.0" y="516.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Програма Гільберта</text>
<text x="324.0" y="535.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">формалізувати всю математику: несуперечлива + повна</text>
<text x="278.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1931</text>
<circle cx="300.0" cy="618.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="324.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Теореми Геделя</text>
<text x="324.0" y="633.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">неповнота: «доведене» вужче за «правдиве»</text>
</svg>