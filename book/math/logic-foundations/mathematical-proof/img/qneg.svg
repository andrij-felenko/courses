<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="428" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заперечення кванторів — Де Морган для «для всіх» і «існує»</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">¬ міняє ∀ на ∃ (і навпаки) та заганяє «не» всередину</text>
<rect x="180.0" y="80.0" width="250.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="305.0" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">¬ ∀x P(x)</tspan></text>
<text x="480.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#27ae60" text-anchor="middle" font-weight="700">⟺</text>
<rect x="530.0" y="80.0" width="250.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="655.0" y="112.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">∃x ¬P(x)</tspan></text>
<rect x="180.0" y="146.0" width="250.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="305.0" y="178.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">¬ ∃x P(x)</tspan></text>
<text x="480.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#27ae60" text-anchor="middle" font-weight="700">⟺</text>
<rect x="530.0" y="146.0" width="250.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="655.0" y="178.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">∀x ¬P(x)</tspan></text>
<text x="480.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">чому — розгорнімо квантор у скінченну низку:</text>
<rect x="120.0" y="250.0" width="720.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="480.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">∀x P(x)   ≡   P₁ ∧ P₂ ∧ P₃ ∧ … ∧ Pₙ        (∀ — довгий AND)</tspan></text>
<line x1="480.0" y1="296.0" x2="480.0" y2="316.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="576.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-style="italic">¬  (Де Морган: AND ↔ OR)</text>
<rect x="120.0" y="318.0" width="720.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/><text x="480.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">¬P₁ ∨ ¬P₂ ∨ ¬P₃ ∨ … ∨ ¬Pₙ   ≡   ∃x ¬P(x)   (OR «не» — тобто виняток)</tspan></text>
<rect x="120.0" y="376.0" width="720.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="480.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">¬(усі прості непарні)   =   ∃ просте, що НЕ непарне   =   2  ✓</tspan></text>
</svg>