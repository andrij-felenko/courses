<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математика стоїть на явно названому фундаменті</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">аксіоми й означення — унизу без доведення; усе вище зводять доведеннями</text>
<rect x="260.0" y="92.0" width="380.0" height="66.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">ТЕОРЕМИ</tspan><tspan x="450.0" dy="17.6">доведені твердження — готові цеглини</tspan></text>
<rect x="180.0" y="206.0" width="540.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="450.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">ЛЕМИ · раніше доведене</tspan></text>
<rect x="90.0" y="316.0" width="320.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="344.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">АКСІОМИ</tspan><tspan x="250.0" dy="16.9">приймаємо без доведення</tspan><tspan x="250.0" dy="16.9">(правила гри)</tspan></text>
<rect x="490.0" y="316.0" width="320.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="650.0" y="344.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">ОЗНАЧЕННЯ</tspan><tspan x="650.0" dy="16.9">точний зміст слів</tspan><tspan x="650.0" dy="16.9">(що таке «парне» тощо)</tspan></text>
<text x="450.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">фундамент — приймаємо без доведення</text>
<line x1="450.0" y1="312.0" x2="450.0" y2="272.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="516.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">доведення</text>
<line x1="450.0" y1="202.0" x2="450.0" y2="162.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="516.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">доведення</text>
<line x1="852.0" y1="392.0" x2="852.0" y2="98.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="838" y="234" font-size="12" fill="#27ae60" font-style="italic" font-weight="700" text-anchor="middle" transform="rotate(-90 838 234)">певність тече вгору</text>
</svg>