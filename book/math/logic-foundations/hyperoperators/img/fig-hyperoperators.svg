<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія гіпероператорів та тетраційна вежа</text>
<rect x="154.1" y="53.9" width="131.7" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">n=0: Наступник</tspan><tspan x="220.0" dy="18.2">S(a) = a + 1</tspan></text>
<line x1="220.0" y1="108.1" x2="220.0" y2="121.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="118.2" y="123.9" width="203.5" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">n=1: Додавання</tspan><tspan x="220.0" dy="18.2">a + b = a + 1 + ... + 1</tspan></text>
<line x1="220.0" y1="178.1" x2="220.0" y2="191.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="118.2" y="193.9" width="203.5" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">n=2: Множення</tspan><tspan x="220.0" dy="18.2">a × b = a + a + ... + a</tspan></text>
<line x1="220.0" y1="248.1" x2="220.0" y2="261.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="126.2" y="263.9" width="187.6" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">n=3: Степінь</tspan><tspan x="220.0" dy="18.2">a^b = a × a × ... × a</tspan></text>
<line x1="220.0" y1="318.1" x2="220.0" y2="331.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.2" y="333.9" width="179.6" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="355.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">n=4: Тетрація</tspan><tspan x="220.0" dy="18.2">^b a = a^(a^(...^a))</tspan></text>
<line x1="220.0" y1="388.1" x2="220.0" y2="401.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="158.1" y="403.9" width="123.7" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">n=5: Пентація</tspan><tspan x="220.0" dy="18.2">a ↑↑↑ b</tspan></text>
<rect x="511.9" y="103.9" width="176.2" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Тетраційна вежа</tspan><tspan x="600.0" dy="18.2">^4 2 = 2^(2^(2^2))</tspan></text>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="580.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="595.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="605.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="600.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle">= 2 ^ 16</text>
<text x="600.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">= 65536</text>
<line x1="370.0" y1="360.0" x2="500.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>