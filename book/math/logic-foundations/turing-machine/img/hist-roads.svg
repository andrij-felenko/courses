<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири дороги до одного означення обчислення</text>
<rect x="311.2" y="57.6" width="397.6" height="48.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="510.0" y="78.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">«Чи є механічна процедура, що про будь-яке твердження</tspan><tspan x="510.0" dy="16.2">скаже, доказовне воно чи ні?» — Гільберт, 1928</tspan></text>
<line x1="510.0" y1="108.0" x2="510.0" y2="150.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="145.0" y1="150.0" x2="880.0" y2="150.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="145.0" y1="150.0" x2="145.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="35.0" y="178.0" width="220.0" height="222.0" rx="9" fill="#ffffff" stroke="#b9770e" stroke-width="1.8"/>
<text x="50.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">Ербран → Гедель</text>
<text x="50.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">1931 · 1934</text>
<text x="50.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Лист Ербрана до Геделя</text>
<text x="50.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">(7 квітня 1931), а далі —</text>
<text x="50.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">лекції Геделя в Прінстоні.</text>
<text x="50.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Мотив: врятувати доведення</text>
<text x="50.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">несуперечливості</text>
<line x1="50.0" y1="348.0" x2="240.0" y2="348.0" stroke="#dfe3e8" stroke-width="1.2"/>
<text x="145.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">загальнорекурсивні</tspan><tspan x="145.0" dy="15.6">функції</tspan></text>
<line x1="145.0" y1="402.0" x2="145.0" y2="430.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="390.0" y1="150.0" x2="390.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="280.0" y="178.0" width="220.0" height="222.0" rx="9" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="295.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Алонзо Черч</text>
<text x="295.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">1932–1936</text>
<text x="295.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Числення підстановок як</text>
<text x="295.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">підвалина логіки; Кліні й</text>
<text x="295.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Россер довели: вона</text>
<text x="295.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">суперечлива. Уцілів</text>
<text x="295.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">обчислювальний осередок</text>
<line x1="295.0" y1="348.0" x2="485.0" y2="348.0" stroke="#dfe3e8" stroke-width="1.2"/>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">λ-числення</tspan></text>
<line x1="390.0" y1="402.0" x2="390.0" y2="430.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="635.0" y1="150.0" x2="635.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="525.0" y="178.0" width="220.0" height="222.0" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="540.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Алан Тюринг</text>
<text x="540.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">1936</text>
<text x="540.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Аналіз того, що робить</text>
<text x="540.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ЛЮДИНА, коли рахує:</text>
<text x="540.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">папір у клітинку, символи,</text>
<text x="540.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">скінченні «стани розуму»,</text>
<text x="540.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">погляд на одну клітинку</text>
<line x1="540.0" y1="348.0" x2="730.0" y2="348.0" stroke="#dfe3e8" stroke-width="1.2"/>
<text x="635.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">машина зі стрічкою</tspan></text>
<line x1="635.0" y1="402.0" x2="635.0" y2="430.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="880.0" y1="150.0" x2="880.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="770.0" y="178.0" width="220.0" height="222.0" rx="9" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="785.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Еміль Пост</text>
<text x="785.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">1936</text>
<text x="785.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Робітник ходить рядом</text>
<text x="785.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">коробок і ставить/стирає</text>
<text x="785.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">позначки за списком</text>
<text x="785.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">інструкцій. Подав це як</text>
<text x="785.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">гіпотезу для перевірки</text>
<line x1="785.0" y1="348.0" x2="975.0" y2="348.0" stroke="#dfe3e8" stroke-width="1.2"/>
<text x="880.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">«робітник у коробках»</tspan></text>
<line x1="880.0" y1="402.0" x2="880.0" y2="430.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="145.0" y1="430.0" x2="880.0" y2="430.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="510.0" y1="430.0" x2="510.0" y2="443.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="302.5" y="445.1" width="414.9" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">ОДИН І ТОЙ САМИЙ клас обчислюваних функцій</tspan><tspan x="510.0" dy="16.9">(Кліні, 1936; Тюринг, додаток від 28 серпня 1936)</tspan></text>
<text x="510.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Збіг чотирьох доріг — сильний доказ. Але збіг не ПОЯСНЮЄ, чому це саме «механічна процедура»:</text>
<text x="510.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">пояснив лише Тюрингів аналіз людини-обчислювача — тому Гедель прийняв його, а λ-числення відкинув.</text>
</svg>