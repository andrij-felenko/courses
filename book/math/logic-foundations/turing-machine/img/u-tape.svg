<text x="530.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">U не знає про M нічого: усе, що вона робить, — читає клітинки.</text>
<text x="530.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Опис ліворуч від «#» — це програма. Стрічка праворуч від «|» — це дані.</text>
<text x="530.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Обоє — просто символи в клітинках, і U ходить від одних до других.</text>
<text x="530.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Змініть символи ліворуч від «#» — і та сама U стане іншою машиною.</text>
