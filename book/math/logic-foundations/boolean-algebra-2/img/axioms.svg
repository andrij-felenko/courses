<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Аксіоми булевої алгебри (постулати Гантінґтона, 1904)</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усього кілька правил, узятих за дане; решта законів — це вже ТЕОРЕМИ, доведені з них</text>
<text x="250.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">для « + » (АБО)</text>
<text x="620.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">для « · » (І)</text>
<text x="118.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">аксіома</text>
<line x1="625.0" y1="110.0" x2="625.0" y2="392.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<rect x="60.0" y="116.0" width="760.0" height="282.0" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
<rect x="60.0" y="122.0" width="760.0" height="46.0" rx="0" fill="#f6f8f6" stroke="none" stroke-width="0"/>
<text x="74.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Замкненість</text>
<text x="250.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a + b ∈ B</text>
<text x="620.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a · b ∈ B</text>
<text x="74.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Нейтральний</text>
<text x="250.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a + 0 = a</text>
<text x="620.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a · 1 = a</text>
<rect x="60.0" y="214.0" width="760.0" height="46.0" rx="0" fill="#f6f8f6" stroke="none" stroke-width="0"/>
<text x="74.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Комутативність</text>
<text x="250.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a + b = b + a</text>
<text x="620.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a · b = b · a</text>
<text x="74.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Дистрибутивність</text>
<text x="250.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a + (b·c) = (a+b)·(a+c)</text>
<text x="620.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a · (b+c) = a·b + a·c</text>
<rect x="60.0" y="306.0" width="760.0" height="46.0" rx="0" fill="#f6f8f6" stroke="none" stroke-width="0"/>
<text x="74.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Доповнення</text>
<text x="250.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a + ā = 1</text>
<text x="620.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">a · ā = 0</text>
<text x="74.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Два елементи</text>
<text x="250.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">у B є 0 ≠ 1</text>
<text x="620.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(не той самий)</text>
<rect x="60.0" y="408.0" width="760.0" height="44.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="435.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожна аксіома ліворуч має ДВІЙНИКА праворуч: міняємо + ↔ · та 0 ↔ 1 — і одне правило стає іншим.</text>
</svg>
