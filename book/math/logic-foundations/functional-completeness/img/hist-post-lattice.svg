<text x="676.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="676.0" dy="0.0">Він перелічив УСІ класи функцій,</tspan><tspan x="676.0" dy="16.7">замкнені відносно сполучення —</tspan><tspan x="676.0" dy="16.7">їх зліченно багато, і кожен має</tspan><tspan x="676.0" dy="16.7">скінченний базис. Ця мапа зветься</tspan><tspan x="676.0" dy="16.7">решіткою Поста.</tspan></text>
<line x1="676.0" y1="268.0" x2="934.0" y2="268.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="676.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="676.0" dy="0.0">Критерій повноти — просто наслідок:</tspan><tspan x="676.0" dy="16.7">п'ять зелених вузлів — це рівно всі</tspan><tspan x="676.0" dy="16.7">МАКСИМАЛЬНІ класи. Не влізти в</tspan><tspan x="676.0" dy="16.7">жоден із них = збудувати все.</tspan></text>
<rect x="660.0" y="416.0" width="290.0" height="76.0" rx="10" fill="#f4f6f8" stroke="#d5dbe0" stroke-width="1.2"/>
<text x="676.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="676.0" dy="0.0">Annals of Mathematics Studies № 5,</tspan><tspan x="676.0" dy="15.8">Princeton, 1941, 122 с. — літографія</tspan><tspan x="676.0" dy="15.8">з машинопису, у власній нотації.</tspan></text>
