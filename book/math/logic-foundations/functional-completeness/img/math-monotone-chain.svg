<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">куб усіх входів; ребро вгору = підняти один біт з 0 на 1; f задано таблицею</text>
