<circle cx="300.0" cy="350.0" r="28.0" fill="#eef0f2" stroke="#9aa3ab" stroke-width="1.8"/>
<text x="300.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">010</text>
