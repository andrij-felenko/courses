<text x="300.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">f=0</text>
<text x="300.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">β = (1,1,1),   f(β) = 0</text>
<text x="300.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">α = (0,0,0),   f(α) = 1</text>
<text x="126.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">1 падає на 0</text>
<rect x="566.0" y="150.0" width="312.0" height="300.0" rx="10" fill="#f4f6f8" stroke="#d5dbe0" stroke-width="1.4"/>
<text x="584.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="584.0" dy="0.0">α ≤ β, а f(α) = 1 &gt; 0 = f(β):</tspan><tspan x="584.0" dy="17.2">монотонність порушено — але</tspan><tspan x="584.0" dy="17.2">α і β різняться аж у трьох бітах.</tspan></text>
<line x1="584.0" y1="240.0" x2="860.0" y2="240.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="584.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="584.0" dy="0.0">Ідемо ланцюгом, по одному біту:</tspan><tspan x="584.0" dy="17.2">000 → 100 → 110 → 111</tspan><tspan x="584.0" dy="17.2">f :    1  →  1  →  0  →  0</tspan><tspan x="584.0" dy="17.2">Десь 1 мусить упасти на 0 —</tspan><tspan x="584.0" dy="17.2">тут на ребрі 100 → 110.</tspan><tspan x="584.0" dy="17.2">Ці сусіди різняться ЛИШЕ в b.</tspan></text>
<line x1="584.0" y1="376.0" x2="860.0" y2="376.0" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="584.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700"><tspan x="584.0" dy="0.0">Заморозимо решту константами:</tspan><tspan x="584.0" dy="18.4">φ(x) = f(1, x, 0)</tspan><tspan x="584.0" dy="18.4">φ(0) = 1,   φ(1) = 0   ⟹   φ = ¬</tspan></text>
<text x="450.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Будь-який інший ланцюг від α до β теж дав би ¬: падіння мусить статися десь, бо кінці різні.</text>
</svg>