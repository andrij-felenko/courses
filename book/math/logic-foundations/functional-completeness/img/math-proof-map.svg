<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як із п'яти «утікачів» механічно скласти ¬ і ∧</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">доведення достатності — конвеєр із чотирьох лем: що дано → що з цього збирається</text>
<rect x="150.0" y="78.0" width="600.0" height="40.0" rx="10" fill="#f4f6f8" stroke="#c9ced4" stroke-width="1.4"/><text x="450.0" y="102.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Дано: f₀ ∉ T₀,   f₁ ∉ T₁,   f_M ∉ M,   f_S ∉ S,   f_L ∉ L</tspan></text>
<line x1="450.0" y1="118.0" x2="450.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="144.0" width="340.0" height="76.0" rx="10" fill="#eef3fb" stroke="#9fb4d4" stroke-width="1.6"/><text x="450.0" y="169.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Лема 1 · діагональ  f(x, x, …, x)</tspan><tspan x="450.0" dy="16.9">вхід:  f₀ ∉ T₀  і  f₁ ∉ T₁</tspan><tspan x="450.0" dy="16.9">вихід:  ¬   АБО   обидві константи 0 і 1</tspan></text>
<line x1="450.0" y1="220.0" x2="260.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="220.0" x2="640.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="252.0" width="300.0" height="48.0" rx="10" fill="#f4f6f8" stroke="#c9ced4" stroke-width="1.4"/><text x="210.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">випадок A</tspan><tspan x="210.0" dy="16.2">маємо 0 і 1, ¬ ще нема</tspan></text>
<rect x="540.0" y="252.0" width="300.0" height="48.0" rx="10" fill="#f4f6f8" stroke="#c9ced4" stroke-width="1.4"/><text x="690.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">випадок Б</tspan><tspan x="690.0" dy="16.2">маємо ¬, констант ще нема</tspan></text>
<line x1="210.0" y1="300.0" x2="210.0" y2="336.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="300.0" x2="690.0" y2="336.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="338.0" width="300.0" height="76.0" rx="10" fill="#eef3fb" stroke="#9fb4d4" stroke-width="1.6"/><text x="210.0" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Лема 2 · ланцюг у кубі</tspan><tspan x="210.0" dy="16.2">вхід:  f_M ∉ M  +  константи</tspan><tspan x="210.0" dy="16.2">вихід:  ¬</tspan></text>
<rect x="540.0" y="338.0" width="300.0" height="76.0" rx="10" fill="#eef3fb" stroke="#9fb4d4" stroke-width="1.6"/><text x="690.0" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Лема 3 · підстановка за вектором</tspan><tspan x="690.0" dy="16.2">вхід:  f_S ∉ S  +  ¬</tspan><tspan x="690.0" dy="16.2">вихід:  константа (а з ¬ — обидві)</tspan></text>
<line x1="210.0" y1="414.0" x2="370.0" y2="452.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="414.0" x2="530.0" y2="452.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="454.0" width="340.0" height="46.0" rx="10" fill="#eef8f0" stroke="#27ae60" stroke-width="1.8"/><text x="450.0" y="481.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">У БУДЬ-ЯКОМУ разі маємо   ¬,   0,   1</tspan></text>
<line x1="450.0" y1="500.0" x2="450.0" y2="538.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="540.0" width="340.0" height="76.0" rx="10" fill="#eef3fb" stroke="#9fb4d4" stroke-width="1.6"/><text x="450.0" y="566.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Лема 4 · розчеплення полінома</tspan><tspan x="450.0" dy="16.2">вхід:  f_L ∉ L  +  ¬  +  константи</tspan><tspan x="450.0" dy="16.2">вихід:  ∧</tspan></text>
<line x1="450.0" y1="616.0" x2="450.0" y2="648.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="210.0" y="650.0" width="480.0" height="58.0" rx="10" fill="#eef8f0" stroke="#27ae60" stroke-width="1.8"/><text x="450.0" y="675.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">{¬, ∧} — а це вже все: сума добутків</tspan><tspan x="450.0" dy="17.6">дає БУДЬ-ЯКУ булеву функцію.   [F] = P₂</tspan></text>
</svg>