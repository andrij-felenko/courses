<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вежа арифметики: кожна дія — попередня, повторена y разів</text>
<rect x="150.0" y="64.0" width="460.0" height="84.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="380.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Степінь</text>
<text x="380.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">exp(x, y+1) = mul( x, exp(x, y) )</text>
<rect x="150.0" y="194.0" width="460.0" height="84.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="380.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Множення</text>
<text x="380.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">mul(x, y+1) = add( x, mul(x, y) )</text>
<rect x="150.0" y="324.0" width="460.0" height="84.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="380.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Додавання</text>
<text x="380.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">add(x, y+1) = S( add(x, y) )</text>
<rect x="150.0" y="454.0" width="460.0" height="84.0" rx="9" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="380.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">Наступник</text>
<text x="380.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">S(x) = x + 1</text>
<line x1="236.0" y1="190.0" x2="236.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="276.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">×y</text>
<line x1="236.0" y1="320.0" x2="236.0" y2="282.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="276.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">×y</text>
<line x1="236.0" y1="450.0" x2="236.0" y2="412.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="276.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">×y</text>
<text x="380.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">нижче — простіше й повільніше, вище — стрімкіше; функція Аккермана лізе цими щаблями всіма</text>
</svg>