<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наївне дерево: щоб порахувати 2ʸ, обчислювач відвідує ~ (2ʸ)² вузлів</text>
<text x="256.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">exp(2, y) = 2ʸ</text>
