<text x="470.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">exp(2,30): значення ≈ 10⁹, а вузлів уже ≈ 10¹⁸ — стіна не в пам'яті, а в кількості дій</text>
