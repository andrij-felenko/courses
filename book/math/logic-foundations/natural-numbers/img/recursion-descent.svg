<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому рекурсія дає число: спуск до нуля, тоді збірка назад</text>
<text x="460.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">приклад: обчислюємо 3 + 2 самим означенням</text>
<rect x="160.0" y="104.0" width="250.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="285.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">3 + 2  =  S(3 + 1)</text>
<rect x="160.0" y="189.0" width="250.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="285.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">3 + 1  =  S(3 + 0)</text>
<rect x="160.0" y="274.0" width="250.0" height="46.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="285.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">3 + 0  =  3</text>
<line x1="285.0" y1="152.0" x2="285.0" y2="187.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="285.0" y1="237.0" x2="285.0" y2="272.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="92.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="92.0" dy="0.0">спуск:</tspan><tspan x="92.0" dy="15.6">знімаємо</tspan><tspan x="92.0" dy="15.6">наступник</tspan></text>
<text x="285.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">база: додати нуль</text>
<circle cx="700.0" cy="297.0" r="26.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="700.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<circle cx="700.0" cy="198.0" r="26.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="700.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text>
<circle cx="700.0" cy="100.0" r="26.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="700.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">5</text>
<line x1="700.0" y1="269.0" x2="700.0" y2="226.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="700.0" y1="170.0" x2="700.0" y2="128.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="744.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">4 = S(3)</text>
<text x="744.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">5 = S(4)</text>
<text x="700.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">3 + 2 = 5</text>
<line x1="413.0" y1="297.0" x2="671.0" y2="297.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="542.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дно спуску → старт збірки</text>
<rect x="216.6" y="383.1" width="486.8" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="460.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Спуск неминуче впирається в нуль — тож обчислення завершується;</tspan><tspan x="460.0" dy="16.9">а що воно накриє кожне число, гарантує індукція.</tspan></text>
</svg>