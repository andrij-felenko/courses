<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="486" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому номери йдуть навспак: номер рахує обмеження</text>
<text x="490.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Чомський (1959) починає з довільних правил і накладає дедалі тісніші умови</text>
<rect x="32.0" y="90.0" width="196.0" height="148.0" rx="11" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.9"/>
<text x="130.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тип 0</text>
<rect x="52.0" y="140.0" width="156.0" height="34.0" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="130.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">γ → α</text>
<text x="130.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">без обмежень</text>
<rect x="272.0" y="90.0" width="196.0" height="148.0" rx="11" fill="#eef2fb" stroke="#4b5563" stroke-width="1.9"/>
<text x="370.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тип 1</text>
<rect x="292.0" y="140.0" width="156.0" height="34.0" rx="7" fill="#ffffff" stroke="#4b5563" stroke-width="1.3"/>
<text x="370.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">αAβ → αγβ</text>
<text x="370.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="700">+ обмеження 1</text>
<text x="370.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">не вкорочувати</text>
<line x1="384.0" y1="164.0" x2="224.0" y2="164.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ar_1a1a1a)"/>
<rect x="512.0" y="90.0" width="196.0" height="148.0" rx="11" fill="#eaf1ff" stroke="#2457d6" stroke-width="1.9"/>
<text x="610.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тип 2</text>
<rect x="532.0" y="140.0" width="156.0" height="34.0" rx="7" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/>
<text x="610.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">A → α</text>
<text x="610.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">+ обмеження 2</text>
<text x="610.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ліворуч — 1 нетермінал</text>
<line x1="624.0" y1="164.0" x2="464.0" y2="164.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ar_1a1a1a)"/>
<rect x="752.0" y="90.0" width="196.0" height="148.0" rx="11" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/>
<text x="850.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тип 3</text>
<rect x="772.0" y="140.0" width="156.0" height="34.0" rx="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="850.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">A → aB | a</text>
<text x="850.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+ обмеження 3</text>
<text x="850.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">праворуч — a або aB</text>
<line x1="864.0" y1="164.0" x2="704.0" y2="164.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ar_1a1a1a)"/>
<text x="490.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">клас мов, який породжують такі граматики</text>
<rect x="60.0" y="282.0" width="860.0" height="22.0" rx="5" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="490.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">усі перелічувані</text>
<rect x="180.0" y="308.0" width="620.0" height="22.0" rx="5" fill="#eef2fb" stroke="#4b5563" stroke-width="1.5"/>
<text x="490.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">контекстно-залежні</text>
<rect x="290.0" y="334.0" width="400.0" height="22.0" rx="5" fill="#eaf1ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="490.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">контекстно-вільні</text>
<rect x="395.0" y="360.0" width="190.0" height="22.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="490.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">регулярні</text>
<rect x="60.0" y="400.0" width="860.0" height="44.0" rx="6" fill="#fffdf5" stroke="#b7791f" stroke-width="1.5"/><text x="490.0" y="418.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Три обмеження — три сходинки вниз. «Тип 3» означає буквально «граматика, що задовольняє Обмеження 3»,</tspan><tspan x="490.0" dy="15.6">найтісніше з трьох, — тому найбільший номер відповідає НАЙслабшій граматиці.</tspan></text>
</svg>