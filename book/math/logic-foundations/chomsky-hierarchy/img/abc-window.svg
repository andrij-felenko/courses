<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому aⁿbⁿcⁿ не контекстно-вільна: вікно ≤ p не дістає трьох блоків</text>
<text x="490.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">накачувана частина v·x·y вужча за p — а між блоком a і блоком c лежить цілий блок b завдовжки p</text>
<rect x="120.0" y="168.0" width="200.0" height="66.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="400.0" y="168.0" width="200.0" height="66.0" rx="8" fill="#eaf1ff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="680.0" y="168.0" width="200.0" height="66.0" rx="8" fill="#fdf3e0" stroke="#b7791f" stroke-width="1.8"/>
<text x="220.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">a a a … a</text>
<text x="220.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p разів</text>
<text x="500.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">b b b … b</text>
<text x="500.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p разів</text>
<text x="780.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="700">c c c … c</text>
<text x="780.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p разів</text>
<rect x="320.0" y="110.0" width="160.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="400.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">v·x·y</text>
<line x1="320.0" y1="140.0" x2="320.0" y2="168.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="480.0" y1="140.0" x2="480.0" y2="168.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="400.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">лише a і b</text>
<rect x="600.0" y="110.0" width="160.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="680.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">v·x·y</text>
<line x1="600.0" y1="140.0" x2="600.0" y2="168.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="760.0" y1="140.0" x2="760.0" y2="168.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="680.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">або лише b і c</text>
<text x="500.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">відстань від a до c = увесь блок b = p</text>
<line x1="320.0" y1="282.0" x2="680.0" y2="282.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#ar_c0392b)"/>
<line x1="680.0" y1="282.0" x2="320.0" y2="282.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#ar_c0392b)"/>
<text x="500.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">щоб зачепити і a, і c, вікну треба ширина &gt; p — заборонено</text>
<rect x="120.0" y="372.0" width="740.0" height="56.0" rx="6" fill="#fbfcfe" stroke="#1a1a1a" stroke-width="1.5"/><text x="490.0" y="397.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Отже v·y лежить щонайбільше у двох сусідніх блоках. Беремо i = 2: кількість зачеплених літер росте, а третій блок не змінюється —</tspan><tspan x="490.0" dy="11.7">тепер a, b, c уже НЕ порівну  →  слово вилетіло з aⁿbⁿcⁿ.  Лема провалена  →  мова не контекстно-вільна.</tspan></text>
</svg>