<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 614" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="614" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лема про накачування для контекстно-вільних мов</text>
<text x="490.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">високе дерево розбору двічі проходить той самий нетермінал — і кільце між ними качається</text>
<polygon points="322.0,96.0 70.0,462.0 574.0,462.0" fill="#eaf1ff" stroke="#2457d6" stroke-width="1.8"/>
<polygon points="322.0,160.0 162.0,462.0 482.0,462.0" fill="#d3e2ff" stroke="#2457d6" stroke-width="1.7"/>
<polygon points="322.0,266.0 252.0,462.0 392.0,462.0" fill="#b7d0ff" stroke="#2457d6" stroke-width="1.7"/>
<line x1="322.0" y1="96.0" x2="322.0" y2="462.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="4 4"/>
<circle cx="322.0" cy="96.0" r="5.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="322.0" cy="160.0" r="5.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="322.0" cy="266.0" r="5.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="322.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">S</text>
<text x="342.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<text x="342.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<rect x="162.0" y="462.0" width="90.0" height="12.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="392.0" y="462.0" width="90.0" height="12.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<line x1="162.0" y1="462.0" x2="162.0" y2="486.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="252.0" y1="462.0" x2="252.0" y2="486.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="392.0" y1="462.0" x2="392.0" y2="486.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="482.0" y1="462.0" x2="482.0" y2="486.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="116.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">u</text>
<text x="207.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">v</text>
<text x="322.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<text x="437.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">y</text>
<text x="528.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">z</text>
<text x="322.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">s  =  u · v · x · y · z</text>
<text x="322.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">|v·x·y| ≤ p        |v·y| ≥ 1</text>
<rect x="640.0" y="96.0" width="316.0" height="300.0" rx="12" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/>
<text x="798.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Чому кільце качається</text>
<text x="660.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">A ⇒* v A y</text>
<text x="940.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">кільце між двома A</text>
<text x="660.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">A ⇒* x</text>
<text x="940.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">піддерево під нижнім A</text>
<text x="660.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">———————————————</text>
<text x="660.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">A ⇒* vⁱ x yⁱ</text>
<text x="940.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">кільце крутиться i разів</text>
<text x="660.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">S ⇒* u A z</text>
<text x="660.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   ⇒* u vⁱ x yⁱ z ∈ L</text>
<text x="940.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">для кожного i ≥ 0</text>
<line x1="656.0" y1="332.0" x2="940.0" y2="332.0" stroke="#dfe6f2" stroke-width="1.2"/>
<text x="660.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">i = 0 :</text>
<text x="718.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">u x z</text>
<text x="660.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">i = 1 :</text>
<text x="718.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">u v x y z   (вихідне s)</text>
<text x="660.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">i = 2 :</text>
<text x="718.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">u v² x y² z</text>
<rect x="40.0" y="560.0" width="900.0" height="34.0" rx="6" fill="#f6f8fc" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="580.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Нетерміналів скінченно, тож у досить довгому слові якийсь із них на шляху повторюється. Повтор — кільце A ⇒* v A y; крутиш його — і породжуєш ту саму мову з іншими v, y.</tspan></text>
</svg>