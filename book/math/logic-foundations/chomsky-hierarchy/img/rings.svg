<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 648" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="648" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_b7791f" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b7791f"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина не провалюється: кожне включення строге</text>
<text x="470.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у кожній щілині живе мова-свідок — вона є в більшому класі, але не в меншому</text>
<rect x="30.0" y="72.0" width="880.0" height="540.0" rx="14" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="48.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Тип 0 · Рекурсивно-зліченні  —  Машина Тюринга</text>
<rect x="96.0" y="128.0" width="748.0" height="428.0" rx="14" fill="#fffdf5" stroke="#b7791f" stroke-width="2.0"/>
<text x="114.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="start" font-weight="700">Розв'язні (рекурсивні) мови</text>
<rect x="162.0" y="184.0" width="616.0" height="316.0" rx="14" fill="#eef2fb" stroke="#4b5563" stroke-width="2.0"/>
<text x="180.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="start" font-weight="700">Тип 1 · Контекстно-залежні  —  лінійно-обмежений автомат</text>
<rect x="228.0" y="240.0" width="484.0" height="204.0" rx="14" fill="#eaf1ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="246.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Тип 2 · Контекстно-вільні  —  магазинний автомат</text>
<rect x="294.0" y="296.0" width="352.0" height="92.0" rx="14" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="48.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">свідок: «проблема зупинки» — перелічна, але НЕ розв'язна</text>
<text x="114.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b7791f" text-anchor="start">цей поверх номерна ієрархія ПРОПУСКАЄ · свідок: розв'язна мова, що не контекстно-залежна</text>
<text x="180.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">свідок: aⁿbⁿcⁿ  (рівне число a, b, c)</text>
<text x="246.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">свідок: aⁿbⁿ · збалансовані дужки · вкладеність</text>
<text x="470.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Тип 3 · РЕГУЛЯРНІ</text>
<text x="470.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">скінченний автомат · пам'ять = стан</text>
<text x="470.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">a*b* · «містить 101» · будь-який regex</text>
<rect x="628.0" y="456.0" width="286.0" height="76.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="771.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="771.0" dy="0.0">що ширше кільце — то</tspan><tspan x="771.0" dy="15.4">більше пам'яті в машини;</tspan><tspan x="771.0" dy="15.4">свідок доводить, що межа реальна</tspan></text>
<rect x="30.0" y="556.0" width="880.0" height="72.0" rx="6" fill="#fbfcfe" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="588.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Включення строгі: Тип 3 ⊊ Тип 2 ⊊ Тип 1 ⊊ розв'язні ⊊ Тип 0. Стрілка «регулярна ⇒ ширший клас»</tspan><tspan x="470.0" dy="15.6">йде лише вниз — угору не повертає. Тому знайдений свідок у щілині — не приклад, а ДОКАЗ межі.</tspan></text>
</svg>