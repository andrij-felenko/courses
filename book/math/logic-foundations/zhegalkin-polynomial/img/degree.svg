<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Степінь полінома: лінійне проти нелінійного</text>
<line x1="80.0" y1="300.0" x2="840.0" y2="300.0" stroke="#c8ccd2" stroke-width="2.0"/>
<text x="140.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">степінь 0</text>
<rect x="45.0" y="102.0" width="190.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">0</tspan><tspan x="140.0" dy="20.8">1</tspan></text>
<text x="140.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">сталі</text>
<text x="340.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">степінь 1</text>
<rect x="245.0" y="102.0" width="190.0" height="96.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="340.0" y="134.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">a</tspan><tspan x="340.0" dy="20.8">a ⊕ b</tspan><tspan x="340.0" dy="20.8">a ⊕ b ⊕ 1</tspan></text>
<text x="340.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">ЛІНІЙНІ / афінні</text>
<text x="560.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">степінь 2</text>
<rect x="465.0" y="102.0" width="190.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">a·b   (AND)</tspan><tspan x="560.0" dy="20.8">a·b ⊕ b·c ⊕ a·c</tspan></text>
<text x="560.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">нелінійні</text>
<text x="780.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">степінь 3</text>
<rect x="685.0" y="102.0" width="190.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">a·b·c</tspan></text>
<text x="780.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">…</text>
<text x="450.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">XOR — степінь 1 (лінійна); AND — степінь 2. Що вищий степінь, то «нелінійніша» функція.</text>
</svg>