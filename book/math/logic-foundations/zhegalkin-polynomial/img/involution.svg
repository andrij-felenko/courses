<text x="450.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">M[A][S] = 1, коли S ⊆ A.   f = M·c (таблиця з коефіцієнтів),   c = M·f (коефіцієнти з таблиці) — той самий M.</text>
<text x="450.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">M² = I  ⟹  прогін удруге повертає вихідне: перетворення Мебіуса над GF(2) — інволюція.</text>
