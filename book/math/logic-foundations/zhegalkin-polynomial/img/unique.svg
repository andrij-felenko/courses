<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому форма ЄДИНА (для n = 2)</text>
<text x="430.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">усі 2ⁿ = 4 можливі мономи (підмножини змінних):</text>
<rect x="95.0" y="93.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="123.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1</tspan></text>
<rect x="275.0" y="93.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="123.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">a</tspan></text>
<rect x="455.0" y="93.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="123.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">b</tspan></text>
<rect x="635.0" y="93.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="123.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">a·b</tspan></text>
<text x="430.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">кожному — свій коефіцієнт 0 або 1:</text>
<rect x="95.0" y="191.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="221.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">0</tspan></text>
<rect x="275.0" y="191.0" width="150.0" height="46.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="350.0" y="221.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">1</tspan></text>
<rect x="455.0" y="191.0" width="150.0" height="46.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="530.0" y="221.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">1</tspan></text>
<rect x="635.0" y="191.0" width="150.0" height="46.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="710.0" y="221.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">1</tspan></text>
<rect x="195.0" y="275.0" width="470.0" height="50.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="430.0" y="306.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">0·1 ⊕ 1·a ⊕ 1·b ⊕ 1·a·b  =  a ⊕ b ⊕ a·b</tspan></text>
<rect x="70.0" y="362.0" width="720.0" height="60.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="387.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">4 коефіцієнти по 2 значення = 2⁴ = 16 наборів = стільки ж, скільки</tspan><tspan x="430.0" dy="19.5">булевих функцій двох змінних (2^(2ⁿ)) → відповідність один-до-одного</tspan></text>
</svg>