<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конструктивне ітеративне наближення нерухомих точок</text>
<rect x="79.2" y="40.0" width="221.5" height="49.9" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="190.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Висхідна ітерація Кліні</tspan><tspan x="190.0" dy="16.9">від найменшого елемента ⊥</tspan></text>
<rect x="48.3" y="104.5" width="283.3" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">x₀ = ⊥  —  базовий стан (немає інформації)</tspan></text>
<line x1="190.0" y1="134.0" x2="190.0" y2="150.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="54.6" y="148.5" width="270.8" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">x₁ = f(⊥)  —  перший крок трансформатора</tspan></text>
<line x1="190.0" y1="178.0" x2="190.0" y2="194.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="76.5" y="192.5" width="226.9" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="211.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">x₂ = f²(⊥)  —  накопичення фактів</tspan></text>
<line x1="190.0" y1="222.0" x2="190.0" y2="238.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.9" y="236.5" width="258.3" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="190.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">...  —  ітерації монотонного зростання</tspan></text>
<line x1="190.0" y1="266.0" x2="190.0" y2="282.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="43.6" y="280.5" width="292.8" height="31.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="190.0" y="299.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">x* = lfp(f)  —  стабілізація: f(x*) = x*</tspan></text>
<rect x="375.2" y="40.0" width="229.6" height="49.9" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="490.0" y="61.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Спадна двоїста ітерація</tspan><tspan x="490.0" dy="16.9">від найбільшого елемента ⊤</tspan></text>
<rect x="364.0" y="104.5" width="252.0" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="490.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">y₀ = ⊤  —  максимальна невизначеність</tspan></text>
<line x1="490.0" y1="134.0" x2="490.0" y2="150.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="348.3" y="148.5" width="283.3" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="490.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">y₁ = f(⊤)  —  відсікання неможливих станів</tspan></text>
<line x1="490.0" y1="178.0" x2="490.0" y2="194.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335.8" y="192.5" width="308.4" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="490.0" y="211.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">y₂ = f²(⊤)  —  уточнення безпечного інваріанта</tspan></text>
<line x1="490.0" y1="222.0" x2="490.0" y2="238.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="364.0" y="236.5" width="252.0" height="31.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="490.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">...  —  ітерації монотонного спадання</tspan></text>
<line x1="490.0" y1="266.0" x2="490.0" y2="282.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="343.6" y="280.5" width="292.8" height="31.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="490.0" y="299.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">y* = gfp(f)  —  стабілізація: f(y*) = y*</tspan></text>
</svg>