<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виделка першої теореми — і чому латка не рятує</text>
<rect x="371.4" y="57.5" width="277.1" height="41.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="510.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">G  ⟺  «G не доводиться в F»</tspan></text>
<line x1="510.0" y1="98.5" x2="300.0" y2="148.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="98.5" x2="720.0" y2="148.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="204.2" y="154.8" width="161.5" height="34.5" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="285.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Припустімо:  F ⊢ G</tspan></text>
<line x1="285.0" y1="189.2" x2="285.0" y2="236.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="188.8" y="242.3" width="192.4" height="63.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="285.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">G каже «мене не доводять».</tspan><tspan x="285.0" dy="15.0">Отже F довела хибне</tspan><tspan x="285.0" dy="15.0">про власну арифметику.</tspan></text>
<line x1="285.0" y1="305.7" x2="285.0" y2="352.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="208.5" y="359.5" width="153.0" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">F суперечлива  ✗</tspan></text>
<rect x="650.4" y="154.8" width="169.2" height="34.5" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="735.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Припустімо:  F ⊢ ¬G</tspan></text>
<line x1="735.0" y1="189.2" x2="735.0" y2="236.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="632.2" y="242.3" width="205.5" height="63.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="735.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">«доведення G існує» — та для</tspan><tspan x="735.0" dy="15.0">кожного y = 0, 1, 2, … F</tspan><tspan x="735.0" dy="15.0">визнає: «це не воно».</tspan></text>
<line x1="735.0" y1="305.7" x2="735.0" y2="352.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="650.5" y="359.5" width="169.1" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">F ω-суперечлива  ✗</tspan></text>
<line x1="285.0" y1="398.0" x2="470.0" y2="438.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="735.0" y1="398.0" x2="550.0" y2="438.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="372.4" y="434.5" width="275.1" height="55.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Отже, ні G, ні ¬G — F мовчить.</tspan><tspan x="510.0" dy="17.6">А ми ззовні бачимо: G істинне.</tspan></text>
<line x1="40.0" y1="522.0" x2="980.0" y2="522.0" stroke="#dfe3e8" stroke-width="1.4"/>
<text x="44.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Спроба порятунку — і чому вона безкінечна:</text>
<rect x="111.4" y="579.8" width="107.2" height="48.5" rx="6" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="165.0" y="600.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">додаймо G</tspan><tspan x="165.0" dy="15.0">аксіомою до F</tspan></text>
<rect x="379.7" y="579.8" width="100.7" height="48.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="600.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">нова система</tspan><tspan x="430.0" dy="15.0">F′ = F + {G}</tspan></text>
<rect x="644.3" y="572.3" width="251.4" height="63.4" rx="6" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="770.0" y="593.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">інший список аксіом → інша</tspan><tspan x="770.0" dy="15.0">нумерація → своє нове</tspan><tspan x="770.0" dy="15.0">речення Геделя G′, недоказовне в F′</tspan></text>
<line x1="222.6" y1="604.0" x2="375.7" y2="604.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="484.3" y1="604.0" x2="640.3" y2="604.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="666.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Дірку залатано — поруч зяє наступна. Кожна латка приносить своє G.</text>
</svg>