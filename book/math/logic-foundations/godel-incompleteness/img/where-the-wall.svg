<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де стоїть стіна неповноти</text>
<text x="510.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">усе вирішує один значок — множення</text>
<rect x="60.0" y="84.0" width="550.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="78.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ZFC — аксіоматика теорії множин</text>
<text x="78.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">звичний фундамент усієї математики</text>
<text x="594.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">неповна</text>
<rect x="60.0" y="142.0" width="550.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="78.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Арифметика Пеано (PA)</text>
<text x="78.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">натуральні числа з індукцією</text>
<text x="594.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">неповна</text>
<rect x="60.0" y="200.0" width="550.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="78.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Арифметика Робінсона Q</text>
<text x="78.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">зовсім слабка, навіть без індукції</text>
<text x="594.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">неповна · нерозв'язна</text>
<rect x="60.0" y="264.0" width="550.0" height="44.0" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="335.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">◄  тут до додавання доклали МНОЖЕННЯ  ×  ►</text>
<rect x="60.0" y="322.0" width="550.0" height="50.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="78.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Арифметика Пресбургера</text>
<text x="78.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">+, &lt;, індукція — але БЕЗ множення</text>
<text x="594.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">повна · розв'язна</text>
<rect x="60.0" y="380.0" width="550.0" height="50.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="78.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Логіка предикатів 1-го порядку</text>
<text x="78.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">чиста логіка без арифметики</text>
<text x="594.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">повна (Гедель, 1929)</text>
<rect x="60.0" y="438.0" width="550.0" height="50.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="78.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Числення висловлювань</text>
<text x="78.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">лише зв'язки ¬ ∧ ∨ →</text>
<text x="594.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">повна · розв'язна</text>
<line x1="44.0" y1="480.0" x2="44.0" y2="92.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="30.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сила системи росте</text>
<text x="510.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приберіть множення — і Пресбургер спокійно повний і розв'язний.</text>
<text x="510.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Уся драма Геделя вміщається в один значок «×».</text>
<rect x="648.0" y="150.0" width="340.0" height="240.0" rx="10" fill="#f2f3f5" stroke="#b9770e" stroke-width="1.8"/>
<text x="668.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="start" font-weight="700">Третя умова — і виняток</text>
<text x="668.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Істинна арифметика — усі істини про ℕ —</text>
<text x="668.0" y="222.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ПОВНА: кожне твердження про числа</text>
<text x="668.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">в ній або є, або спростоване.</text>
<text x="668.0" y="259.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="668.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Але її не можна ефективно аксіома-</text>
<text x="668.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">тизувати: список її «аксіом» неможливо</text>
<text x="668.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">задати механічно.</text>
<text x="668.0" y="333.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"></text>
<text x="668.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Порушено умову ②, тож теорема</text>
<text x="668.0" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Геделя її просто не стосується.</text>
</svg>