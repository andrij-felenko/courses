<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 792" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="792" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тридцять років розбігу і два дні</text>
<text x="530.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">від тріщини в основах математики до надгробка з викликом долі</text>
<line x1="530.0" y1="74.0" x2="530.0" y2="768.0" stroke="#c8ccd2" stroke-width="2.6"/>
<circle cx="530.0" cy="110.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<line x1="610.0" y1="110.0" x2="537.0" y2="110.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="610.0" y="69.8" width="300.0" height="80.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">1902 · Тріщина в основі</tspan><tspan x="760.0" dy="15.0">Рассел пише Фреге: множина всіх множин,</tspan><tspan x="760.0" dy="15.0">які не містять себе, суперечлива.</tspan><tspan x="760.0" dy="15.0">«Арифметика хитається».</tspan></text>
<circle cx="530.0" cy="206.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<line x1="450.0" y1="206.0" x2="523.0" y2="206.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="150.0" y="165.8" width="300.0" height="80.4" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="187.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">1925 · Ліки Гільберта</tspan><tspan x="300.0" dy="15.0">«Нікому не вигнати нас із раю Кантора».</tspan><tspan x="300.0" dy="15.0">Врятувати математику фінітним</tspan><tspan x="300.0" dy="15.0">доведенням несуперечливості.</tspan></text>
<circle cx="530.0" cy="302.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<line x1="610.0" y1="302.0" x2="537.0" y2="302.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="610.0" y="261.8" width="300.0" height="80.4" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="760.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">1928 · Три бажання оформлено</tspan><tspan x="760.0" dy="15.0">Гільберт і Аккерман ставлять</tspan><tspan x="760.0" dy="15.0">Entscheidungsproblem; того ж року</tspan><tspan x="760.0" dy="15.0">Брауера виганяють — «війна жаб і мишей».</tspan></text>
<rect x="423.3" y="356.0" width="213.4" height="32.0" rx="14" fill="#fef7e6" stroke="#b9770e" stroke-width="1.5"/><text x="530.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Кенігсберг · вересень 1930</tspan></text>
<circle cx="530.0" cy="470.0" r="8.0" fill="#b9770e" stroke="#b9770e" stroke-width="1.0"/>
<line x1="368.2" y1="470.0" x2="522.0" y2="470.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="698.4" y1="470.0" x2="538.0" y2="470.0" stroke="#b9770e" stroke-width="1.6"/>
<line x1="530.0" y1="388.0" x2="530.0" y2="462.0" stroke="#b9770e" stroke-width="1.6" stroke-dasharray="3,3"/>
<rect x="127.8" y="422.4" width="240.3" height="95.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="248.0" y="444.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="248.0" dy="0.0">7 вересня · круглий стіл</tspan><tspan x="248.0" dy="15.0">Гедель кидає тиху репліку: у</tspan><tspan x="248.0" dy="15.0">несуперечливій системі є істинне,</tspan><tspan x="248.0" dy="15.0">але недоказовне твердження.</tspan><tspan x="248.0" dy="15.0">Почув лише фон Нейман.</tspan></text>
<rect x="698.4" y="422.4" width="227.2" height="95.3" rx="6" fill="#fef7e6" stroke="#b9770e" stroke-width="1.5"/><text x="812.0" y="444.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="812.0" dy="0.0">8 вересня · промова в радіоефір</tspan><tspan x="812.0" dy="15.0">Гільберт: «Wir müssen wissen.</tspan><tspan x="812.0" dy="15.0">Wir werden wissen».</tspan><tspan x="812.0" dy="15.0">Він ще не знає, що напередодні</tspan><tspan x="812.0" dy="15.0">його програму вже спростовано.</tspan></text>
<circle cx="530.0" cy="576.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<line x1="450.0" y1="576.0" x2="523.0" y2="576.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="150.0" y="535.8" width="300.0" height="80.4" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="557.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">листопад 1930 · поступка</tspan><tspan x="300.0" dy="15.0">Фон Нейман виводить другу теорему</tspan><tspan x="300.0" dy="15.0">(лист 20.XI) — та Гедель здав рукопис</tspan><tspan x="300.0" dy="15.0">17.XI. Першість визнано за Геделем.</tspan></text>
<circle cx="530.0" cy="664.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<line x1="610.0" y1="664.0" x2="537.0" y2="664.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="610.0" y="631.3" width="300.0" height="65.4" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="760.0" y="653.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">1931 · надруковано</tspan><tspan x="760.0" dy="15.0">Стаття виходить у «Monatshefte».</tspan><tspan x="760.0" dy="15.0">Криза стала теоремою.</tspan></text>
<circle cx="530.0" cy="724.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="450.0" y1="724.0" x2="523.0" y2="724.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="150.0" y="691.3" width="300.0" height="65.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="713.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">1943 · надгробок у Геттінгені</tspan><tspan x="300.0" dy="15.0">На камені — ті самі слова.</tspan><tspan x="300.0" dy="15.0">Виклик пережив власне спростування.</tspan></text>
</svg>