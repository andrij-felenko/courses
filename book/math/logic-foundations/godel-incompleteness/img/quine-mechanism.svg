<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка квайна: один рядок — дві ролі</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">чому копія не мусить містити саму себе</text>
<rect x="264.4" y="79.2" width="371.2" height="41.5" rx="6" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">рядок  s   =   « s = %r \n print(s % s) »</tspan></text>
<text x="450.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">шаблон-дані: програма без власного значення</text>
<line x1="410.0" y1="152.0" x2="235.0" y2="202.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490.0" y1="152.0" x2="665.0" y2="202.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="142.3" y="208.6" width="185.3" height="86.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">РОЛЬ 1 — КОД</tspan><tspan x="235.0" dy="15.6"></tspan><tspan x="235.0" dy="15.6">увесь текст шаблону</tspan><tspan x="235.0" dy="15.6">виконується як програма</tspan></text>
<rect x="582.6" y="208.6" width="164.8" height="86.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">РОЛЬ 2 — ДАНІ</tspan><tspan x="665.0" dy="15.6"></tspan><tspan x="665.0" dy="15.6">%r → repr(s):</tspan><tspan x="665.0" dy="15.6">s у лапках, дослівно</tspan></text>
<line x1="235.0" y1="298.0" x2="416.0" y2="368.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="665.0" y1="298.0" x2="484.0" y2="368.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405.0" y="368.0" width="90.0" height="48.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">s % s</tspan></text>
<text x="450.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">діру %r затикаємо копією s — обидві ролі сходяться</text>
<line x1="450.0" y1="446.0" x2="450.0" y2="480.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="266.7" y="483.0" width="366.5" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="508.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">вивід  =  сама програма   (байт у байт)</tspan></text>
</svg>