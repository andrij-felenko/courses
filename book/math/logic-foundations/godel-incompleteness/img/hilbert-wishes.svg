<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 606" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="606" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програма Гільберта: три бажання і три «ні»</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1928 — що математика мала засвідчити сама про себе</text>
<rect x="30.0" y="80.0" width="290.0" height="120.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="175.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Повнота</text>
<text x="48.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кожне твердження — або</text>
<text x="48.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">доводиться, або спросто-</text>
<text x="48.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">вується; жодне не зависає</text>
<line x1="175.0" y1="202.0" x2="175.0" y2="244.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="355.0" y="80.0" width="290.0" height="120.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="500.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Несуперечливість</text>
<text x="373.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">з F не виводяться разом</text>
<text x="373.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">A і ¬A — і це доведено</text>
<text x="373.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">фінітними засобами</text>
<line x1="500.0" y1="202.0" x2="500.0" y2="244.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="80.0" width="290.0" height="120.0" rx="10" fill="#ffffff" stroke="#b9770e" stroke-width="2.0"/>
<text x="825.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="middle" font-weight="700">Розв'язність</text>
<text x="698.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">є механічна процедура, що</text>
<text x="698.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">про кожне твердження скаже:</text>
<text x="698.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">доказовне воно чи ні</text>
<line x1="825.0" y1="202.0" x2="825.0" y2="244.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="246.0" width="290.0" height="120.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="175.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Перша теорема · 1931</text>
<text x="48.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">існує істинне речення, яке</text>
<text x="48.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">не доводиться й не спросто-</text>
<text x="48.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">вується — F неповна</text>
<rect x="122.1" y="352.0" width="105.8" height="28.0" rx="14" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="175.0" y="370.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ні — Гедель</text>
<rect x="355.0" y="246.0" width="290.0" height="120.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="500.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Друга теорема · 1931</text>
<text x="373.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">F не може довести</text>
<text x="373.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">власної несуперечливості</text>
<text x="373.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">своїми ж засобами</text>
<rect x="447.1" y="352.0" width="105.8" height="28.0" rx="14" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="500.0" y="370.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ні — Гедель</text>
<rect x="680.0" y="246.0" width="290.0" height="120.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="825.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Entscheidungsproblem · 1936</text>
<text x="698.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">такого алгоритму немає:</text>
<text x="698.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">доказовність неможливо</text>
<text x="698.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">розв'язати механічно</text>
<rect x="746.0" y="352.0" width="157.9" height="28.0" rx="14" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="825.0" y="370.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ні — Черч і Тюринг</text>
<rect x="30.0" y="420.0" width="940.0" height="150.0" rx="12" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.6"/>
<text x="500.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Але виделка влучає ЛИШЕ в систему, яка водночас:</text>
<rect x="129.9" y="484.0" width="140.2" height="28.0" rx="14" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="200.0" y="502.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">① несуперечлива</text>
<rect x="383.4" y="484.0" width="233.2" height="28.0" rx="14" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="500.0" y="502.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">② механічно аксіоматизована</text>
<rect x="691.1" y="484.0" width="217.8" height="28.0" rx="14" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="800.0" y="502.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">③ вміщає арифметику (з ×)</text>
<text x="500.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">приберіть будь-яку з трьох умов — і теорема більше не діє</text>
</svg>