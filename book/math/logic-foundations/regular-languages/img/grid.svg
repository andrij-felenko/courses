<rect x="80.0" y="356.0" width="620.0" height="110.0" rx="6" fill="#fbfcfe" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="391.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Недосяжні — рівно ті чотири пари, що самі собі суперечать: B ще «поч» (не прочитано</tspan><tspan x="390.0" dy="15.6">жодного символу), а A вже зібрав частину збігу. Так не буває — «поч» живе лише до</tspan><tspan x="390.0" dy="15.6">першого символу, коли A конче в 0. Лінива побудова (обхід від стартової пари) таких</tspan><tspan x="390.0" dy="15.6">клітин навіть не створює: 11 замість 15. Приймальна клітина — рівно одна.</tspan></text>
