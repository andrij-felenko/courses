<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лема про накачування — це гра на чотири ходи</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нерегулярність доводять ЗАПЕРЕЧЕННЯМ леми:   ∀p  ∃s  ∀(x, y, z)  ∃i</text>
<rect x="30.0" y="74.0" width="940.0" height="30.0" rx="6" fill="#fbfcfe" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">правило простеньке: квантор ∀ — хід СУПЕРНИКА (мусиш побити всі варіанти) · квантор ∃ — ТВІЙ хід (досить одного вдалого)</tspan></text>
<rect x="30.0" y="116.0" width="940.0" height="84.0" rx="10" fill="#fff6f5" stroke="#c0392b" stroke-width="1.6"/>
<rect x="42.0" y="128.0" width="148.0" height="60.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="116.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">∀p</text>
<text x="116.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">СУПЕРНИК</text>
<text x="206.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">обирає довжину накачування  p ≥ 1</text>
<rect x="636.0" y="126.0" width="322.0" height="64.0" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="797.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="797.0" dy="0.0">Ти цього p НЕ бачиш.</tspan><tspan x="797.0" dy="15.5">Доведення мусить годитися</tspan><tspan x="797.0" dy="15.5">для БУДЬ-ЯКОГО p.</tspan></text>
<rect x="30.0" y="212.0" width="940.0" height="84.0" rx="10" fill="#f2fbf6" stroke="#27ae60" stroke-width="1.6"/>
<rect x="42.0" y="224.0" width="148.0" height="60.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="116.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">∃s</text>
<text x="116.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТИ</text>
<text x="206.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">обираєш ОДНЕ слово  s ∈ L,  |s| ≥ p</text>
<rect x="636.0" y="222.0" width="322.0" height="64.0" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="797.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="797.0" dy="0.0">ТВІЙ ХІД — і головний.</tspan><tspan x="797.0" dy="15.5">s вільно будувати З p:</tspan><tspan x="797.0" dy="15.5">напр. s = 0ᵖ10ᵖ.</tspan></text>
<rect x="30.0" y="308.0" width="940.0" height="84.0" rx="10" fill="#fff6f5" stroke="#c0392b" stroke-width="1.6"/>
<rect x="42.0" y="320.0" width="148.0" height="60.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="116.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">∀(x, y, z)</text>
<text x="116.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">СУПЕРНИК</text>
<text x="206.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ріже  s = x · y · z :   |y| ≥ 1,   |xy| ≤ p</text>
<rect x="636.0" y="318.0" width="322.0" height="64.0" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="797.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="797.0" dy="0.0">Мусиш побити ВСІ розрізи.</tspan><tspan x="797.0" dy="15.5">Зате |xy| ≤ p прибиває y</tspan><tspan x="797.0" dy="15.5">у перші p символів — подарунок.</tspan></text>
<rect x="30.0" y="404.0" width="940.0" height="84.0" rx="10" fill="#f2fbf6" stroke="#27ae60" stroke-width="1.6"/>
<rect x="42.0" y="416.0" width="148.0" height="60.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="116.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">∃i</text>
<text x="116.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТИ</text>
<text x="206.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">обираєш кратність  i ≥ 0</text>
<rect x="636.0" y="414.0" width="322.0" height="64.0" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="797.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="797.0" dy="0.0">ТВІЙ ХІД. Виграв, якщо</tspan><tspan x="797.0" dy="15.5">x · yⁱ · z ∉ L. Годиться</tspan><tspan x="797.0" dy="15.5">й i = 0 — «здути» цикл.</tspan></text>
<rect x="30.0" y="508.0" width="940.0" height="60.0" rx="6" fill="#fffdf5" stroke="#b7791f" stroke-width="1.5"/><text x="500.0" y="534.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Твоя свобода — рівно два ходи: слово s і кратність i. Розріз обирає СУПЕРНИК —</tspan><tspan x="500.0" dy="16.2">тому «нехай y складається з нулів» без посилання на |xy| ≤ p доведенням не є.</tspan></text>
</svg>