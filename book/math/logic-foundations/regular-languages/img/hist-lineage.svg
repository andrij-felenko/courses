<rect x="50.0" y="172.0" width="360.0" height="62.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Еміль Пост · 1943</tspan><tspan x="230.0" dy="15.0">канонічні системи: правила-«продукції»</tspan></text>
<rect x="50.0" y="260.0" width="360.0" height="62.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Еміль Пост · 1947</tspan><tspan x="230.0" dy="15.0">напів-туе правила = Тип 0 за 12 років до назви</tspan></text>
<rect x="50.0" y="348.0" width="360.0" height="62.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="230.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Пол Розенблум · 1950</tspan><tspan x="230.0" dy="15.0">підручник: прикласти системи Поста до мови</tspan></text>
<rect x="50.0" y="436.0" width="360.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="463.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Ноам Чомський · 1956 → 1959</tspan><tspan x="230.0" dy="15.0">три моделі → Обмеження 1, 2, 3 → Типи 0–3</tspan></text>
