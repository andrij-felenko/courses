<rect x="460.0" y="296.0" width="480.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Стівен Кліні · 1951 — RAND RM-704</tspan><tspan x="700.0" dy="15.0">над нервовими сітками МакКаллока й Піттса (1943)</tspan><tspan x="700.0" dy="15.0">назвав ці множини «регулярними подіями»</tspan><tspan x="700.0" dy="15.0">і одразу попросив кращого слова; 1956 — Automata Studies</tspan></text>
