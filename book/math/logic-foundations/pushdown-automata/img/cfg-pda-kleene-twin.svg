<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійник теореми Кліні — і в чому рівно один поверх різниці</text>
<rect x="40.0" y="60.0" width="900.0" height="190.0" rx="10" fill="#f7f9fc" stroke="#c8d2e0" stroke-width="1.8"/><text x="58.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ЩАБЕЛЬ 1 · РЕГУЛЯРНІ</text><rect x="120.0" y="115.0" width="160.0" height="49.9" rx="6" fill="#ffffff" stroke="#c8d2e0" stroke-width="1.6"/><text x="200.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Регулярний вираз</tspan><tspan x="200.0" dy="16.9">(a|b)*ab</tspan></text><rect x="710.0" y="115.0" width="160.0" height="49.9" rx="6" fill="#ffffff" stroke="#c8d2e0" stroke-width="1.6"/><text x="790.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Скінченний</tspan><tspan x="790.0" dy="16.9">автомат</tspan></text><line x1="295.0" y1="122.0" x2="690.0" y2="122.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="492.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">гаджет на кожен оператор, склейка через ε</text><line x1="690.0" y1="160.0" x2="295.0" y2="160.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="492.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Rᵏ(i, j):  пара станів  +  СТЕЛЯ k</text><text x="492.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">теорема Кліні</text><text x="58.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">рівняння лінійні:  X = A·X ∪ B  ⟹  X = A*·B  (Арден) — розв'язок є, і це і є зірка</text><text x="58.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стек зайвий: на ньому завжди рівно одна змінна, а одна комірка це і є стан</text>
<rect x="40.0" y="268.0" width="900.0" height="190.0" rx="10" fill="#f3fbf6" stroke="#27ae60" stroke-width="1.8"/><text x="58.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ЩАБЕЛЬ 2 · КОНТЕКСТНО-ВІЛЬНІ</text><rect x="120.0" y="323.1" width="160.0" height="49.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="200.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">КВ-граматика</tspan><tspan x="200.0" dy="16.9">S → ( S ) S | ε</tspan></text><rect x="710.0" y="323.1" width="160.0" height="49.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="790.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Магазинний</tspan><tspan x="790.0" dy="16.9">автомат</tspan></text><line x1="295.0" y1="330.0" x2="690.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/><text x="492.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">правило = розгортання, термінал = звірка</text><line x1="690.0" y1="368.0" x2="295.0" y2="368.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><text x="492.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">[q X p]:  пара станів  +  символ стека X</text><text x="492.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">наша теорема</text><text x="58.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">рівняння квадратні:  S = ( S ) S ∪ ε  ⟹  розв'язку в {∪, ·, *} нема — граматика й є відповідь</text><text x="58.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стек без стелі: рекурсія епізодів не спадає до бази за скінченне число щаблів</text>
<text x="490.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Будова доведення та сама — аж до квадратичного роздуву по станах. Різниця одна: там третій індекс має стелю, тут — ні.</text>
</svg>