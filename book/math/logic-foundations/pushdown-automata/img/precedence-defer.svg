<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли відкладений оператор нарешті спрацьовує</text>
<text x="510.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">два вирази з тих самих чотирьох лексем — і протилежна доля першого оператора</text>
<rect x="45.0" y="88.0" width="440.0" height="424.0" rx="10" fill="#fcfdfe" stroke="#dfe4ea" stroke-width="1.5"/>
<text x="265.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 + 3 * 4</text>
<text x="265.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">читаємо *  —  на стеку чекає +</text>
<rect x="69.0" y="172.0" width="392.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#cfd6df" stroke-width="1.4"/><text x="265.0" y="193.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">пріоритет( * ) = 2   &gt;   пріоритет( + ) = 1</tspan></text>
<rect x="69.0" y="216.0" width="392.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="265.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">сильніше → + ЧЕКАЄ далі, кладемо * зверху</tspan></text>
<line x1="195.0" y1="400.0" x2="335.0" y2="400.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="237.0" y="370.0" width="56.0" height="30.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="265.0" y="389.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">+</tspan></text><rect x="237.0" y="340.0" width="56.0" height="30.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="265.0" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">*</tspan></text>
<text x="265.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стек операторів</text>
<text x="265.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">наприкінці знімаємо зверху вниз:</tspan><tspan x="265.0" dy="16.2">спершу 3 * 4 = 12,   тоді 2 + 12 = 14</tspan></text>
<text x="265.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 + 3 * 4  =  14</text>
<rect x="535.0" y="88.0" width="440.0" height="424.0" rx="10" fill="#fcfdfe" stroke="#dfe4ea" stroke-width="1.5"/>
<text x="755.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 * 3 + 4</text>
<text x="755.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">читаємо +  —  на стеку чекає *</text>
<rect x="559.0" y="172.0" width="392.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#cfd6df" stroke-width="1.4"/><text x="755.0" y="193.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">пріоритет( + ) = 1   ≤   пріоритет( * ) = 2</tspan></text>
<rect x="559.0" y="216.0" width="392.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="755.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">не сильніше → * СПРАЦЬОВУЄ негайно: 2 * 3 = 6</tspan></text>
<line x1="685.0" y1="400.0" x2="825.0" y2="400.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="727.0" y="370.0" width="56.0" height="30.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="755.0" y="389.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">+</tspan></text>
<text x="755.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стек операторів</text>
<text x="755.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">* уже зійшов зі стека,</tspan><tspan x="755.0" dy="16.2">лишилося 6 + 4 = 10</tspan></text>
<text x="755.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 * 3 + 4  =  10</text>
</svg>