<text x="540.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">«Кіт, якого пес налякав, утік.» — підрядне речення розриває головне навпіл</text>
