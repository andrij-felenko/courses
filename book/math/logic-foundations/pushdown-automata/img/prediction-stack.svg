<text x="540.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Друге передбачення відклали останнім — і вернулися до нього першим. Ця нерівність у часі, а не якийсь вибір інженера, і є LIFO.</text>
