<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Кожен стовпець має рівно 2 позначки «X» — немає EPI!</text>
<rect x="430.0" y="55.0" width="380.0" height="310.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="620.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Алгебраїчне розкриття за Патріком</text>
<rect x="445.0" y="95.0" width="350.0" height="60.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="455.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Умова покриття кожного стовпця (КНФ):</text>
<text x="455.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">P = (P₁+P₆)(P₁+P₂)(P₂+P₃)(P₃+P₄)(P₄+P₅)(P₅+P₆)</text>
<rect x="445.0" y="165.0" width="350.0" height="75.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="455.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Розкриття дужок і поглинання (X + XY = X):</text>
<text x="455.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(P₁+P₆)(P₁+P₂) = P₁ + P₂·P₆</text>
<text x="455.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(P₂+P₃)(P₃+P₄) = P₃ + P₂·P₄</text>
<text x="455.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(P₄+P₅)(P₅+P₆) = P₅ + P₄·P₆</text>
<rect x="445.0" y="250.0" width="350.0" height="95.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="455.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. ДНФ усіх можливих мінімальних покриттів:</text>
<text x="455.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">P = P₁·P₃·P₅ + P₂·P₄·P₆ + (доданки з 4+ імплікантів)</text>
<text x="455.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Два рівноцінні мінімуми по 3 доданки:</text>
<text x="455.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Варіант A: P₁ + P₃ + P₅   • Варіант B: P₂ + P₄ + P₆</text>
</svg>