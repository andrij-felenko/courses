<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">3-SAT: розбиття довгої клаузи й межа «два проти трьох»</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">рівно три літерали в клаузі — і вся складність SAT лишається</text>
<rect x="296.6" y="74.5" width="306.7" height="43.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/><text x="450.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">(ℓ₁ ∨ ℓ₂ ∨ ℓ₃ ∨ ℓ₄ ∨ ℓ₅)</tspan></text>
<line x1="450.0" y1="117.5" x2="450.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">доточуємо свіжі y₁, y₂</text>
<rect x="114.9" y="172.5" width="150.2" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="190.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">(ℓ₁ ∨ ℓ₂ ∨ y₁)</tspan></text>
<rect x="370.2" y="172.5" width="159.5" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">(¬y₁ ∨ ℓ₃ ∨ y₂)</tspan></text>
<rect x="630.2" y="172.5" width="159.5" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="710.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">(¬y₂ ∨ ℓ₄ ∨ ℓ₅)</tspan></text>
<text x="320.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">∧</text>
<text x="580.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">∧</text>
<text x="450.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">y — «естафета»: без жодного істинного ℓ ланцюг падає в суперечність; один істинний ℓ — і його досить</text>
<text x="450.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">чому три, а не два</text>
<rect x="70.0" y="322.0" width="360.0" height="96.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="349.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">2-клауза  (a ∨ b)</tspan><tspan x="250.0" dy="16.9">= вимушена імплікація  ¬a ⇒ b</tspan><tspan x="250.0" dy="16.9">розкручується детерміновано</tspan><tspan x="250.0" dy="16.9">→ 2-SAT за лінійний час (у P)</tspan></text>
<rect x="470.0" y="322.0" width="360.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="349.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">3-клауза  (a ∨ b ∨ c)</tspan><tspan x="650.0" dy="16.9">= ¬a ⇒ (b ∨ c)</tspan><tspan x="650.0" dy="16.9">наслідок — диз'юнкція → гілкування</tspan><tspan x="650.0" dy="16.9">→ повертається 2ⁿ-вибух (NP-повна)</tspan></text>
</svg>