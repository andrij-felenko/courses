<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рецепт RMS: квадрат → середнє → корінь</text>
<rect x="24.0" y="81.0" width="150.0" height="78.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="24.0" y="81.0" width="150.0" height="22.0" rx="8" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="99.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">1. КВАДРАТ</text>
<text x="99.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="99.0" dy="0.0">x  →  x²</tspan><tspan x="99.0" dy="13.8">знак зник,</tspan><tspan x="99.0" dy="13.8">великі — важчі</tspan></text>
<rect x="212.0" y="81.0" width="150.0" height="78.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="212.0" y="81.0" width="150.0" height="22.0" rx="8" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="287.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">2. СЕРЕДНЄ</text>
<text x="287.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="287.0" dy="0.0">усереднити</tspan><tspan x="287.0" dy="13.8">x² за період</tspan><tspan x="287.0" dy="13.8">(або за вибіркою)</tspan></text>
<rect x="400.0" y="81.0" width="150.0" height="78.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="400.0" y="81.0" width="150.0" height="22.0" rx="8" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="475.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">3. КОРІНЬ</text>
<text x="475.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">√ середнього</tspan><tspan x="475.0" dy="13.8">повертає</tspan><tspan x="475.0" dy="13.8">одиниці x</tspan></text>
<line x1="178.0" y1="120.0" x2="208.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="366.0" y1="120.0" x2="396.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">RMS = √( середнє( x² ) )</text>
<text x="330.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">читається справа наліво: спершу квадрат, потім середнє, наприкінці корінь</text>
</svg>