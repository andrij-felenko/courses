<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один вузол: помножити те, що прийшло згори, на власну чутливість</text>
<circle cx="360.0" cy="165.0" r="46.0" fill="#eef6ff" stroke="#2457d6" stroke-width="2.5"/>
<text x="360.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">операція</text>
<text x="360.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">y = f(x)</text>
<line x1="120.0" y1="125.0" x2="314.0" y2="125.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">вперед:  x  →</text>
<line x1="406.0" y1="125.0" x2="600.0" y2="125.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="590.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">→  y</text>
<line x1="600.0" y1="211.0" x2="406.0" y2="211.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="501.8" y="218.1" width="116.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="239.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="560.0" dy="0.0">прийшов згори</tspan><tspan x="560.0" dy="16.9">∂E/∂y</tspan></text>
<line x1="314.0" y1="211.0" x2="120.0" y2="211.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="123.0" y="218.1" width="94.1" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="239.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="170.0" dy="0.0">пішов униз</tspan><tspan x="170.0" dy="16.9">∂E/∂x</tspan></text>
<rect x="273.4" y="48.0" width="173.1" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="69.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">локальна чутливість</tspan><tspan x="360.0" dy="16.9">∂y/∂x</tspan></text>
<line x1="360.0" y1="99.0" x2="360.0" y2="119.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="76.0" y="289.5" width="568.1" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">∂E/∂x  =  ∂E/∂y · ∂y/∂x     (те, що прийшло) × (локальна чутливість)</tspan></text>
</svg>