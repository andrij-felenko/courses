<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа аугментації: ярлик мусить лишитися правдою</text>
<rect x="30.0" y="52.0" width="320.0" height="280.0" rx="10" fill="#f2fbf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="200.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">✓ ярлик зберігається</text>
<rect x="60.0" y="118.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">«6», нахилена на 10°</tspan></text>
<line x1="255.0" y1="140.0" x2="285.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= «6»</text>
<rect x="60.0" y="184.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">знак STOP, віддзеркалений</tspan></text>
<line x1="255.0" y1="206.0" x2="285.0" y2="206.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= STOP</text>
<rect x="60.0" y="250.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="276.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">кіт удень / у сутінках</tspan></text>
<line x1="255.0" y1="272.0" x2="285.0" y2="272.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= кіт</text>
<rect x="370.0" y="52.0" width="320.0" height="280.0" rx="10" fill="#fdf2f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="530.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">✗ ярлик стає брехнею</text>
<rect x="400.0" y="118.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">«6», перевернута</tspan></text>
<line x1="595.0" y1="140.0" x2="625.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">→ «9»</text>
<rect x="400.0" y="184.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">літера «b», дзеркало</tspan></text>
<line x1="595.0" y1="206.0" x2="625.0" y2="206.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">→ «d»</text>
<rect x="400.0" y="250.0" width="190.0" height="44.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="276.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">родимка, розтягнута</tspan></text>
<line x1="595.0" y1="272.0" x2="625.0" y2="272.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">→ інша форма</text>
</svg>