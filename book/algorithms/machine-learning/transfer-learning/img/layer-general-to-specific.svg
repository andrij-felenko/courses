<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Углиб мережі ознаки йдуть від загальних до вузько-своїх</text>
<rect x="70.0" y="120.0" width="128.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="134.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">шар 1–2</text>
<text x="134.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="134.0" dy="0.0">краї, плями,</tspan><tspan x="134.0" dy="15.0">кольори</tspan></text>
<text x="134.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАГАЛЬНЕ</text>
<rect x="240.0" y="120.0" width="128.0" height="96.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="304.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">середина</text>
<text x="304.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="304.0" dy="0.0">кути, текстури,</tspan><tspan x="304.0" dy="15.0">частини</tspan></text>
<text x="304.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">радше загальне</text>
<rect x="410.0" y="120.0" width="128.0" height="96.0" rx="6" fill="#fff3e0" stroke="#c9a227" stroke-width="2.0"/>
<text x="474.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c9a227" text-anchor="middle" font-weight="700">шар N−1</text>
<text x="474.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="474.0" dy="0.0">морди, колеса,</tspan><tspan x="474.0" dy="15.0">цілі деталі</tspan></text>
<text x="474.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c9a227" text-anchor="middle" font-weight="700">радше своє</text>
<rect x="580.0" y="120.0" width="128.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="644.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">голова</text>
<text x="644.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="644.0" dy="0.0">класи саме</tspan><tspan x="644.0" dy="15.0">того набору</tspan></text>
<text x="644.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ВУЗЬКО СВОЄ</text>
<line x1="205.0" y1="168.0" x2="233.0" y2="168.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="375.0" y1="168.0" x2="403.0" y2="168.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="545.0" y1="168.0" x2="573.0" y2="168.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">◀ можна лишати як є (заморозити)          треба переучувати ▶</text>
<rect x="4.6" y="356.0" width="710.8" height="32.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="360.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">тому переносять НИЗ (краї, текстури — придатні будь-де), а верх і голову вчать заново під свою задачу</tspan></text>
</svg>