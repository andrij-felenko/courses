<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві дороги до моделі: з нуля на дрібних даних чи від чужого навченого</text>
<line x1="170.2" y1="108.0" x2="269.3" y2="108.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="410.7" y1="108.0" x2="495.6" y2="108.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="74.8" y="83.2" width="90.4" height="49.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">мало даних</tspan><tspan x="120.0" dy="15.6">(200 фото)</tspan></text>
<rect x="274.3" y="83.2" width="131.4" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">порожня мережа</tspan><tspan x="340.0" dy="15.6">(ваги випадкові)</tspan></text>
<rect x="500.6" y="83.2" width="118.7" height="49.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">СЛАБКА модель</tspan><tspan x="560.0" dy="15.6">(переучиться)</tspan></text>
<text x="120.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">З НУЛЯ</text>
<line x1="183.9" y1="258.0" x2="277.7" y2="258.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="412.3" y1="258.0" x2="500.6" y2="258.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="61.1" y="225.4" width="117.8" height="65.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="120.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">чужа мережа,</tspan><tspan x="120.0" dy="15.6">навчена на</tspan><tspan x="120.0" dy="15.6">мільйонах фото</tspan></text>
<rect x="282.7" y="225.4" width="124.6" height="65.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="345.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">лишити готові</tspan><tspan x="345.0" dy="15.6">ознаки, доучити</tspan><tspan x="345.0" dy="15.6">тонку верхівку</tspan></text>
<rect x="505.6" y="225.4" width="118.7" height="65.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">СИЛЬНА модель</tspan><tspan x="565.0" dy="15.6">з тих самих</tspan><tspan x="565.0" dy="15.6">200 фото</tspan></text>
<text x="120.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПЕРЕНЕСЕННЯ</text>
<rect x="134.5" y="340.0" width="450.9" height="32.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="360.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">ті самі дрібні дані: з нуля мережа тоне, з чужих ознак — злітає</tspan></text>
</svg>