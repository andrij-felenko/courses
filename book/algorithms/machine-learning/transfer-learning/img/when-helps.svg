<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли перенесення виграє, а коли б'є в спину</text>
<rect x="40.0" y="66.0" width="300.0" height="210.0" rx="6" fill="#f2faf5" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">✓ ПОМАГАЄ</text>
<text x="60.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  задача СХОЖА на джерело</text>
<text x="60.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  (фото → фото)</text>
<text x="60.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  твоїх даних МАЛО</text>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  верх доучуєш малим кроком</text>
<rect x="380.0" y="66.0" width="300.0" height="210.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="530.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✗ ШКОДИТЬ (від'ємне перенесення)</text>
<text x="400.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  джерело ЧУЖЕ задачі</text>
<text x="400.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  (фото → звук, ЕКГ)</text>
<text x="400.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  великий крок стирає ознаки</text>
<text x="400.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">•  своїх даних досить на з нуля</text>
<rect x="4.6" y="318.0" width="710.8" height="32.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="360.0" y="338.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перенесення — не завжди добро: чуже джерело чи завеликий крок роблять модель ГІРШОЮ за навчену з нуля</tspan></text>
</svg>