<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадрат не обирають — він випадає з форми шуму</text>
<rect x="130.0" y="74.0" width="520.0" height="74.0" rx="9" fill="#fbfdff" stroke="#0ea5e9" stroke-width="1.8"/>
<text x="390.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0ea5e9" text-anchor="middle" font-weight="700">1.  форма шуму: дзвін</text>
<text x="390.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">p(e) = (стала) · exp( −e² / 2σ² )</text>
<text x="390.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">квадрат сидить у показнику</text>
<line x1="390.0" y1="151.0" x2="390.0" y2="174.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="177.0" width="520.0" height="74.0" rx="9" fill="#fbfdff" stroke="#0ea5e9" stroke-width="1.8"/>
<text x="390.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0ea5e9" text-anchor="middle" font-weight="700">2.  правдоподібність усіх даних</text>
<text x="390.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">L = ∏ᵢ (стала) · exp( −eᵢ² / 2σ² )</text>
<text x="390.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">незалежні приклади → добуток</text>
<line x1="390.0" y1="254.0" x2="390.0" y2="277.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="280.0" width="520.0" height="74.0" rx="9" fill="#fbfdff" stroke="#e08a1e" stroke-width="1.8"/>
<text x="390.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">3.  логарифм: добуток → сума</text>
<text x="390.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">log L = (стала) − 1/2σ² · Σ eᵢ²</text>
<text x="390.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">log витяг квадрат з-під exp</text>
<line x1="390.0" y1="357.0" x2="390.0" y2="380.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="130.0" y="383.0" width="520.0" height="74.0" rx="9" fill="#fbfdff" stroke="#27ae60" stroke-width="1.8"/>
<text x="390.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4.  мінус перевертає напрям</text>
<text x="390.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">макс log L  ⇔  мін Σ eᵢ²  =  MSE</text>
<text x="390.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">MSE не обрано — вона випала</text>
</svg>