<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три віхи дистиляції: ідея (2006) → назва (2014) → канон (2015)</text>
<line x1="60.0" y1="118.0" x2="840.0" y2="118.0" stroke="#6b7280" stroke-width="2.4"/>
<line x1="838.0" y1="118.0" x2="842.0" y2="118.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<circle cx="153.6" cy="118.0" r="8.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.4"/>
<text x="153.6" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">2006</text>
<rect x="35.6" y="138.0" width="236.0" height="214.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<line x1="153.6" y1="126.0" x2="153.6" y2="138.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="153.6" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Стиснення ансамблю</text>
<text x="153.6" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="153.6" dy="0.0">Корнелл: Бучілуе,</tspan><tspan x="153.6" dy="13.2">Каруана, Нікулеску-Мізіл.</tspan><tspan x="153.6" dy="13.2">«Model Compression», KDD.</tspan><tspan x="153.6" dy="13.2">Учитель-ансамбль → мала</tspan><tspan x="153.6" dy="13.2">мережа (~1000× менша),</tspan><tspan x="153.6" dy="13.2">вчиться на ВІДПОВІДЯХ,</tspan><tspan x="153.6" dy="13.2">а не на мітках.</tspan><tspan x="153.6" dy="13.2">Ще без назви й теорії.</tspan></text>
<circle cx="450.0" cy="118.0" r="8.0" fill="#8e44ad" stroke="#ffffff" stroke-width="2.4"/>
<text x="450.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#8e44ad" text-anchor="middle" font-weight="700">2014</text>
<rect x="332.0" y="138.0" width="236.0" height="214.0" rx="8" fill="#f4f6f8" stroke="#8e44ad" stroke-width="1.6"/>
<line x1="450.0" y1="126.0" x2="450.0" y2="138.0" stroke="#8e44ad" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="450.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">«Темне знання»</text>
<text x="450.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Гінтон, доповідь у TTIC.</tspan><tspan x="450.0" dy="13.2">Дрібні ймовірності —</tspan><tspan x="450.0" dy="13.2">не шум, а мапа схожостей</tspan><tspan x="450.0" dy="13.2">між класами.</tspan><tspan x="450.0" dy="13.2">Ключ: ГРІТИ softmax</tspan><tspan x="450.0" dy="13.2">температурою, щоб її</tspan><tspan x="450.0" dy="13.2">висвітлити.</tspan><tspan x="450.0" dy="13.2">З'явилась НАЗВА ідеї.</tspan></text>
<circle cx="730.8" cy="118.0" r="8.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.4"/>
<text x="730.8" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">2015</text>
<rect x="612.8" y="138.0" width="236.0" height="214.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<line x1="730.8" y1="126.0" x2="730.8" y2="138.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="730.8" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Формалізація</text>
<text x="730.8" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.8" dy="0.0">Гінтон, Віньялс, Дін.</tspan><tspan x="730.8" dy="13.2">«Distilling the Knowledge»</tspan><tspan x="730.8" dy="13.2">(arXiv:1503.02531).</tspan><tspan x="730.8" dy="13.2">М'які цілі, дві втрати,</tspan><tspan x="730.8" dy="13.2">множник T².</tspan><tspan x="730.8" dy="13.2">Демо: MNIST + бойова</tspan><tspan x="730.8" dy="13.2">голосова система.</tspan><tspan x="730.8" dy="13.2">Назва «ДИСТИЛЯЦІЯ».</tspan></text>
</svg>