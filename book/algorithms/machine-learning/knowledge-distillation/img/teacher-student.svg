<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дистиляція: малий учень копіює м'які мітки великого вчителя</text>
<rect x="60.0" y="92.0" width="150.0" height="150.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="135.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">УЧИТЕЛЬ</text>
<text x="135.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">велика точна</text>
<text x="135.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">мережа</text>
<text x="135.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">мільйони ваг</text>
<text x="135.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повільна,</text>
<text x="135.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">важка</text>
<line x1="84.0" y1="208.0" x2="84.0" y2="230.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="114.0" y1="208.0" x2="114.0" y2="230.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="144.0" y1="208.0" x2="144.0" y2="230.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="174.0" y1="208.0" x2="174.0" y2="230.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="218.0" y1="167.0" x2="368.0" y2="167.0" stroke="#8e44ad" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="293.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">м'які мітки</text>
<text x="293.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8e44ad" text-anchor="middle">(розподіл ймовірностей)</text>
<rect x="376.0" y="120.0" width="110.0" height="96.0" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="431.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">УЧЕНЬ</text>
<text x="431.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">мала</text>
<text x="431.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">мережа</text>
<text x="431.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у рази менша</text>
<line x1="414.0" y1="198.0" x2="414.0" y2="210.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="448.0" y1="198.0" x2="448.0" y2="210.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="60.0" y="296.0" width="150.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c9d2dc" stroke-width="1.2"/><text x="135.0" y="312.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">ті самі дані</tspan><tspan x="135.0" dy="13.7">(без нових міток)</tspan></text>
<line x1="135.0" y1="292.0" x2="135.0" y2="246.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="516.0" y="118.0" width="264.0" height="118.0" rx="6" fill="#fffaf0" stroke="#8e44ad" stroke-width="1.4"/><text x="648.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">Учень не вчиться з нуля на</tspan><tspan x="648.0" dy="13.7">«правильних відповідях».</tspan><tspan x="648.0" dy="13.7">Він копіює ВЕСЬ розподіл</tspan><tspan x="648.0" dy="13.7">упевненості вчителя — і тому</tspan><tspan x="648.0" dy="13.7">за меншого розміру виходить</tspan><tspan x="648.0" dy="13.7">майже такий самий точний,</tspan><tspan x="648.0" dy="13.7">як великий учитель.</tspan></text>
</svg>