<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Переворот: замість правил — приклади</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">класичне: дані + ПРАВИЛА → відповіді; машинне навчання: дані + ВІДПОВІДІ (приклади) → правило (модель)</text>
<rect x="50" y="108" width="400" height="250" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="250" y="132" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">КЛАСИЧНЕ ПРОГРАМУВАННЯ</text>
<rect x="78" y="162" width="116" height="38" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="136" y="186" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">дані</text>
<rect x="78" y="210" width="116" height="42" rx="7" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="136" y="228" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛА</text>
<text x="136" y="243" font-size="7.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(пише людина)</text>
<line x1="198" y1="206" x2="240" y2="206" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="246" y="185" width="78" height="42" rx="7" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="285" y="210" font-size="9" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">машина</text>
<line x1="328" y1="206" x2="368" y2="206" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="372" y="185" width="70" height="42" rx="7" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="407" y="210" font-size="8.6" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">відповіді</text>
<text x="250" y="296" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">людина пише ПРАВИЛО, машина його виконує</text>
<text x="250" y="324" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">добре, коли правило можна сформулювати</text>
<rect x="510" y="108" width="400" height="250" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="710" y="132" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">МАШИННЕ НАВЧАННЯ</text>
<rect x="536" y="162" width="112" height="38" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="592" y="186" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">дані</text>
<rect x="536" y="210" width="112" height="42" rx="7" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="592" y="228" font-size="9.3" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ВІДПОВІДІ</text>
<text x="592" y="243" font-size="7.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(приклади)</text>
<line x1="652" y1="206" x2="690" y2="206" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="694" y="184" width="78" height="44" rx="7" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="733" y="202" font-size="9" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">машина</text>
<text x="733" y="216" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="normal" font-style="normal">вчиться</text>
<line x1="776" y1="206" x2="814" y2="206" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="818" y="184" width="84" height="44" rx="7" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="860" y="202" font-size="8.4" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ПРАВИЛО</text>
<text x="860" y="217" font-size="7.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(модель)</text>
<text x="710" y="296" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">людина дає ПРИКЛАДИ, машина виводить правило</text>
<text x="710" y="324" font-size="9" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">рятує, коли правило сформулювати НЕ вийде</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Те, що було ВХОДОМ (правила), стає ВИХОДОМ: машина пише правило сама, дивлячись на приклади.</text>
</svg>
