<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому приходять зими — і чому цього разу інакше</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зима = забагато обіцянок → замало результату → обвал грошей; а злет 2012-го дали три речі, яких бракувало</text>
<rect x="50" y="104" width="410" height="304" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="255" y="128" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ЦИКЛ РОЗЧАРУВАННЯ</text>
<rect x="80" y="158" width="350" height="34" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#475569" stroke-width="1.2"/>
<text x="255" y="180" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">надмірні обіцянки («скоро як людина»)</text>
<line x1="255" y1="192" x2="255" y2="204" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="80" y="204" width="350" height="34" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#475569" stroke-width="1.2"/>
<text x="255" y="226" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">шумиха, потік грошей</text>
<line x1="255" y1="238" x2="255" y2="250" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="80" y="250" width="350" height="34" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#475569" stroke-width="1.2"/>
<text x="255" y="272" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">результат не дотягує</text>
<line x1="255" y1="284" x2="255" y2="296" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="80" y="296" width="350" height="34" rx="7" fill="#f4f4f5" fill-opacity="1.0" stroke="#475569" stroke-width="1.2"/>
<text x="255" y="318" font-size="9.4" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">розчарування, недовіра</text>
<line x1="255" y1="330" x2="255" y2="342" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="80" y="342" width="350" height="34" rx="7" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="255" y="364" font-size="9.4" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">обвал фінансування → ЗИМА</text>
<rect x="500" y="104" width="410" height="304" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="705" y="128" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ЧОМУ 2012-Й — ІНШИЙ</text>
<text x="705" y="156" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">ідея (нейромережі) була та сама —</text>
<text x="705" y="172" font-size="9.6" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">нарешті зійшлися УМОВИ:</text>
<rect x="525" y="196" width="360" height="46" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="545" y="216" font-size="10.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">ДАНІ</text>
<text x="545" y="233" font-size="8.6" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">ImageNet: мільйони мічених фото</text>
<rect x="525" y="252" width="360" height="46" rx="8" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="545" y="272" font-size="10.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">ОБЧИСЛЕННЯ</text>
<text x="545" y="289" font-size="8.6" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">GPU: тисячі ядер для згорток</text>
<rect x="525" y="308" width="360" height="46" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="545" y="328" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">ГЛИБИНА</text>
<text x="545" y="345" font-size="8.6" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">багато шарів + кращі прийоми</text>
<text x="705" y="392" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="italic">не нова ідея — нові умови</text>
</svg>
