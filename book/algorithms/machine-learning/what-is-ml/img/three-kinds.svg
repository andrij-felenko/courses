<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Три роди навчання</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">з учителем (приклади з відповідями); без учителя (без відповідей → структура); з підкріпленням (спроба + винагорода)</text>
<rect x="50" y="108" width="270" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<rect x="50" y="108" width="270" height="40" rx="11" fill="#1f4ed8" fill-opacity="0.15" stroke="none" stroke-width="1.6"/>
<text x="185" y="128" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">З УЧИТЕЛЕМ</text>
<text x="185" y="143" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">supervised</text>
<text x="70" y="178" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">приклади З відповідями</text>
<text x="70" y="204" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(кіт / пес — підписані)</text>
<text x="70" y="230" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ вчить вхід → вихід</text>
<text x="70" y="256" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">класифікація, регресія</text>
<text x="70" y="282" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">★ наші детектори (49.7)</text>
<rect x="340" y="108" width="270" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<rect x="340" y="108" width="270" height="40" rx="11" fill="#d98a00" fill-opacity="0.15" stroke="none" stroke-width="1.6"/>
<text x="475" y="128" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">БЕЗ УЧИТЕЛЯ</text>
<text x="475" y="143" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">unsupervised</text>
<text x="360" y="178" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">приклади БЕЗ відповідей</text>
<text x="360" y="204" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ знайти структуру сам</text>
<text x="360" y="230" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">групувати схоже,</text>
<text x="360" y="256" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ловити аномалії</text>
<text x="360" y="282" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(напр. дивну поведінку)</text>
<rect x="630" y="108" width="270" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<rect x="630" y="108" width="270" height="40" rx="11" fill="#0a8f3c" fill-opacity="0.15" stroke="none" stroke-width="1.6"/>
<text x="765" y="128" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">З ПІДКРІПЛЕННЯМ</text>
<text x="765" y="143" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">reinforcement</text>
<text x="650" y="178" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">діяти → винагорода / кара</text>
<text x="650" y="204" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ покращити стратегію</text>
<text x="650" y="230" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вчитися спробами</text>
<text x="650" y="256" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(летіти, балансувати)</text>
<text x="650" y="282" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">як шашки Семюела</text>
<text x="480.0" y="456" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Для нашого дрона головне — навчання З УЧИТЕЛЕМ: підписані приклади вчать модель упізнавати ціль.</text>
</svg>
