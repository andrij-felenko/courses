<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Похибка: одне число «наскільки модель помиляється»</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">порівнюємо передбачення моделі з правильними відповідями; різниця згортається в ОДНЕ число — похибку; мета — зробити її малою</text>
<text x="108" y="142" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">приклад</text>
<text x="250" y="142" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">модель каже</text>
<text x="400" y="142" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">правильно</text>
<text x="540" y="142" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">промах</text>
<text x="108" y="178" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">кіт?</text>
<text x="250" y="178" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">0.2</text>
<text x="400" y="178" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">1.0</text>
<text x="540" y="178" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">великий</text>
<line x1="100" y1="188" x2="600" y2="188" stroke="#eef0f2" stroke-width="0.8" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="108" y="214" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">пес?</text>
<text x="250" y="214" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">0.9</text>
<text x="400" y="214" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">1.0</text>
<text x="540" y="214" font-size="9.5" fill="#94a3b8" text-anchor="start" font-weight="bold" font-style="normal">малий</text>
<line x1="100" y1="224" x2="600" y2="224" stroke="#eef0f2" stroke-width="0.8" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="108" y="250" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">кіт?</text>
<text x="250" y="250" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">0.7</text>
<text x="400" y="250" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">0.0</text>
<text x="540" y="250" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">великий</text>
<line x1="100" y1="260" x2="600" y2="260" stroke="#eef0f2" stroke-width="0.8" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="108" y="286" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">пес?</text>
<text x="250" y="286" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">0.85</text>
<text x="400" y="286" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">1.0</text>
<text x="540" y="286" font-size="9.5" fill="#94a3b8" text-anchor="start" font-weight="bold" font-style="normal">малий</text>
<line x1="100" y1="296" x2="600" y2="296" stroke="#eef0f2" stroke-width="0.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="616" y1="228" x2="676" y2="228" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="648" y="216" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">згорнути</text>
<rect x="688" y="192" width="212" height="72" rx="11" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="794" y="218" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ПОХИБКА</text>
<text x="794" y="244" font-size="16" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">= 0.83</text>
<text x="794" y="286" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">велика → дуже неправильно</text>
<rect x="688" y="308" width="212" height="40" rx="9" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="794" y="333" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">мета навчання: → 0</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Похибка (функція втрат) стискає всі промахи в одне число. Уся наука навчання — зробити це число якомога меншим.</text>
</svg>
