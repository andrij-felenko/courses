<text x="480" y="382" font-size="10.2" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Темп навчання (розмір кроку) — ключова ручка тренування: замалий гає час, завеликий руйнує спуск.</text>
<text x="480" y="402" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Тому його підбирають — це «гіперпараметр», який задають ДО навчання.</text>
