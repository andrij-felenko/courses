<rect x="589.0" y="258.0" width="250.0" height="38.0" rx="6" fill="#ffffff" stroke="#d7dde5" stroke-width="1.0"/><text x="714.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="714.0" dy="0.0">стала: N доданків,</tspan><tspan x="714.0" dy="12.3">рахується раз наперед</tspan></text>
