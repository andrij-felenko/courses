<rect x="230.0" y="66.0" width="420.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="440.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Σ qᵥ·qₓ   — серце: int8 × int8, копичиться в int32-акумулятор</tspan></text>
