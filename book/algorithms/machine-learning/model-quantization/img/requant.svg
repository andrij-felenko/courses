<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 348" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="348" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реквантування як цілий fixed-point: M0·2⁻ⁿ, подвоєне множення, округлений зсув</text>
<text x="56.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Офлайн, раз при збірці</text>
<rect x="56.0" y="52.0" width="430.0" height="40.0" rx="6" fill="#e9f8ef" stroke="#27ae60" stroke-width="1.4"/><text x="271.0" y="68.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">M = s_w · s_x / s_вих   (0 &lt; M &lt; 1)</tspan><tspan x="271.0" dy="15.0">розклад: M = M0 · 2⁻ⁿ,  M0 ∈ [0.5, 1)</tspan></text>
<text x="56.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">M0 зберігають як ціле Q31 (int32), n — маленьке ціле. Жодного float у рантаймі.</text>
<line x1="271.0" y1="92.0" x2="271.0" y2="143.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="56.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Крок 1 — подвоєне множення у старші біти</text>
<rect x="56.0" y="150.0" width="430.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="271.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">t = VQRDMULH(acc, M0)  =  округл( acc · M0 · 2 / 2³² )</tspan></text>
<text x="56.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">int64-добуток, +2³⁰ на округлення, старші 32 біти; сатурація лише на acc = M0 = INT32_MIN.</text>
<line x1="271.0" y1="190.0" x2="271.0" y2="241.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="56.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Крок 2 — округлений правий зсув на n</text>
<rect x="56.0" y="248.0" width="430.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="271.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="271.0" dy="0.0">y = round( t / 2ⁿ ) + z_вих,   далі clamp у [−128, 127]</tspan></text>
<text x="56.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">≫ додає +1, якщо відкинутий залишок &gt; половини кроку — інакше зсув систематично занижує.</text>
</svg>