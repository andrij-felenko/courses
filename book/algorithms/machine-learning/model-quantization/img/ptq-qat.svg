<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два шляхи: PTQ (після навчання) і QAT (з навчанням)</text>
<text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">PTQ — квантування після навчання</text>
<rect x="40.0" y="73.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="115.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">навчена модель</tspan><tspan x="115.0" dy="13.0">float32</tspan></text>
<rect x="216.0" y="73.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="291.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="291.0" dy="0.0">калібрування:</tspan><tspan x="291.0" dy="13.0">зміряти діапазони</tspan></text>
<line x1="192.0" y1="96.0" x2="214.0" y2="96.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="392.0" y="73.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="467.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="467.0" dy="0.0">клацнути ваги</tspan><tspan x="467.0" dy="13.0">й активації в int8</tspan></text>
<line x1="368.0" y1="96.0" x2="390.0" y2="96.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="568.0" y="73.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="643.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="643.0" dy="0.0">готова int8-</tspan><tspan x="643.0" dy="13.0">модель</tspan></text>
<line x1="544.0" y1="96.0" x2="566.0" y2="96.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">швидко (хвилини), без перенавчання; трохи втрачає точності</text>
<text x="40.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">QAT — навчання з урахуванням квантування</text>
<rect x="40.0" y="213.0" width="150.0" height="46.0" rx="6" fill="#f3e8fb" stroke="#8e44ad" stroke-width="1.3"/><text x="115.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">навчати з «псевдо-</tspan><tspan x="115.0" dy="13.0">квантуванням»</tspan></text>
<rect x="216.0" y="213.0" width="150.0" height="46.0" rx="6" fill="#f3e8fb" stroke="#8e44ad" stroke-width="1.3"/><text x="291.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="291.0" dy="0.0">мережа компенсує</tspan><tspan x="291.0" dy="13.0">округлення</tspan></text>
<line x1="192.0" y1="236.0" x2="214.0" y2="236.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="392.0" y="213.0" width="150.0" height="46.0" rx="6" fill="#f3e8fb" stroke="#8e44ad" stroke-width="1.3"/><text x="467.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="467.0" dy="0.0">клацнути в int8</tspan><tspan x="467.0" dy="13.0">(вже пристосовану)</tspan></text>
<line x1="368.0" y1="236.0" x2="390.0" y2="236.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="568.0" y="213.0" width="150.0" height="46.0" rx="6" fill="#f3e8fb" stroke="#8e44ad" stroke-width="1.3"/><text x="643.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="643.0" dy="0.0">готова int8-</tspan><tspan x="643.0" dy="13.0">модель, точніша</tspan></text>
<line x1="544.0" y1="236.0" x2="566.0" y2="236.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">довше (треба тренувати), але тримає точність навіть на 4 чи 2 бітах</text>
</svg>