<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт int8-виводу одного шару: 8 біт → int32-акумулятор → назад у int8</text>
<rect x="34.0" y="70.0" width="112.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="90.0" y="85.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">int8 вага</tspan><tspan x="90.0" dy="14.3">q_w</tspan></text>
<text x="90.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 байт</text>
<rect x="34.0" y="156.0" width="112.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="90.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">int8 актив.</tspan><tspan x="90.0" dy="14.3">q_x</tspan></text>
<text x="90.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 байт</text>
<line x1="146.0" y1="89.0" x2="180.0" y2="114.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="146.0" y1="175.0" x2="180.0" y2="136.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="236.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">(q_x − z_x) × q_w</text>
<rect x="180.0" y="146.0" width="112.0" height="38.0" rx="6" fill="#e9f8ef" stroke="#27ae60" stroke-width="1.4"/><text x="236.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="236.0" dy="0.0">доданок</tspan><tspan x="236.0" dy="14.3">int32</tspan></text>
<text x="236.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">розширено до 32 біт</text>
<line x1="292.0" y1="165.0" x2="330.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="106.0" width="156.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="408.0" y="128.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="408.0" dy="0.0">int32-акумулятор</tspan><tspan x="408.0" dy="14.3">Σ (q_x−z_x)·q_w</tspan></text>
<text x="408.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сума по всіх входах — тут чатує переповнення</text>
<line x1="486.0" y1="132.0" x2="526.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="506.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">× M0, ≫ n</text>
<rect x="526.0" y="102.0" width="164.0" height="60.0" rx="6" fill="#e9f8ef" stroke="#27ae60" stroke-width="1.4"/><text x="608.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="608.0" dy="0.0">реквантування</tspan><tspan x="608.0" dy="14.3">×M0, округл.</tspan><tspan x="608.0" dy="14.3">≫ n, + z_вих</tspan></text>
<text x="608.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">цілий fixed-point, без float</text>
<line x1="690.0" y1="132.0" x2="716.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="703.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">clamp</text>
<rect x="716.0" y="113.0" width="92.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="762.0" y="128.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="762.0" dy="0.0">int8</tspan><tspan x="762.0" dy="14.3">вихід</tspan></text>
<text x="762.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 байт</text>
<rect x="34.0" y="278.0" width="832.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#c9d2dc" stroke-width="1.2"/><text x="450.0" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Синє — 8 біт (вага, активація, вихід). Червоне й зелене — 32 біти. Уся вага множення тримається в int32-акумуляторі.</tspan><tspan x="450.0" dy="12.3">Єдина дробова величина — добуток масштабів — заздалегідь перетворена на цілий множник M0 і зсув n, тож float у гарячому циклі не з'являється.</tspan></text>
</svg>