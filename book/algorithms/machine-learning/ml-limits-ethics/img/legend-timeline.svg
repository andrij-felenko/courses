<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як здогад зі знаком питання став переказом із крапкою</text>
<text x="124.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">початок 1960-х</text>
<rect x="24.0" y="76.0" width="200.0" height="152.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="124.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">Едвард Фредкін на</tspan><tspan x="124.0" dy="15.6">конференції в Лос-</tspan><tspan x="124.0" dy="15.6">Анджелесі припускає:</tspan><tspan x="124.0" dy="15.6">а раптом мережа ловить</tspan><tspan x="124.0" dy="15.6">яскравість знімка?</tspan></text>
<line x1="230.0" y1="152.0" x2="262.0" y2="152.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="368.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">тоді ж</text>
<rect x="268.0" y="76.0" width="200.0" height="152.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="368.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="368.0" dy="0.0">Армію влаштовує</tspan><tspan x="368.0" dy="15.6">результат, роботу</tspan><tspan x="368.0" dy="15.6">засекречують.</tspan><tspan x="368.0" dy="15.6">Здогад не перевіряє</tspan><tspan x="368.0" dy="15.6">ніхто.</tspan></text>
<line x1="474.0" y1="152.0" x2="506.0" y2="152.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="612.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1991–92</text>
<rect x="512.0" y="76.0" width="200.0" height="152.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="612.0" y="132.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Перші знайдені</tspan><tspan x="612.0" dy="15.6">розповіді: серія BBC</tspan><tspan x="612.0" dy="15.6">і стаття Дрейфусів.</tspan><tspan x="612.0" dy="15.6">Джерел не названо.</tspan></text>
<line x1="718.0" y1="152.0" x2="750.0" y2="152.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="856.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1998 і далі</text>
<rect x="756.0" y="76.0" width="200.0" height="152.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="856.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="856.0" dy="0.0">Вебверсія: 200 знімків,</tspan><tspan x="856.0" dy="15.6">показ у Пентагоні,</tspan><tspan x="856.0" dy="15.6">хмарний і сонячний</tspan><tspan x="856.0" dy="15.6">день. Знак питання</tspan><tspan x="856.0" dy="15.6">зник.</tspan></text>
<text x="120.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">здогад зі знаком питання</text>
<text x="490.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">≈ 30 років переказування</text>
<text x="860.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">переказ із крапкою</text>
<line x1="120.0" y1="270.0" x2="860.0" y2="270.0" stroke="#c9ccd3" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="24.0" y="300.0" width="932.0" height="104.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="331.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Що справді робили: Лавін Канал і Ніл Рендолл (Philco-Ford, 1962–63) розпізнавали</tspan><tspan x="490.0" dy="16.9">танки на аерознімках. Фрагменти вирізали з одного високо знятого кадру — той самий</tspan><tspan x="490.0" dy="16.9">день, та сама плівка, те саме світло, а яскравість прибирали лапласіаном.</tspan><tspan x="490.0" dy="16.9">Описаної пастки в тих даних статися не могло.</tspan></text>
</svg>