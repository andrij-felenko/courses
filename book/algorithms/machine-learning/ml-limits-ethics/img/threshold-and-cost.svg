<text x="300.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">поріг</text>
<text x="196.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">без події</text>
<text x="382.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">з подією</text>
<text x="238.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пропуски</text>
<text x="374.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">хибні тривоги</text>
<text x="524.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">оцінка моделі →</text>
<rect x="548.0" y="76.0" width="216.0" height="92.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="656.0" y="102.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">Поріг не є властивістю</tspan><tspan x="656.0" dy="15.6">моделі: вона дає лише</tspan><tspan x="656.0" dy="15.6">число. Де його різати —</tspan><tspan x="656.0" dy="15.6">питання ціни помилки.</tspan></text>
<rect x="548.0" y="196.0" width="216.0" height="116.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="656.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="656.0" dy="0.0">У фотоальбомі дорожча</tspan><tspan x="656.0" dy="15.6">хибна тривога.</tspan><tspan x="656.0" dy="15.6">У сортуванні пацієнтів —</tspan><tspan x="656.0" dy="15.6">пропуск. Модель та сама,</tspan><tspan x="656.0" dy="15.6">поріг — різний.</tspan></text>
<rect x="70.0" y="348.0" width="450.0" height="44.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="295.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Що рідкісніша подія, то більша частка тривог хибна</tspan><tspan x="295.0" dy="15.6">навіть за бездоганної моделі</tspan></text>
</svg>