<rect x="118.0" y="156.0" width="74.0" height="52.0" rx="6" fill="#e9f7ec" stroke="#27ae60" stroke-width="1.4"/>
<text x="155.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">трава</text>
