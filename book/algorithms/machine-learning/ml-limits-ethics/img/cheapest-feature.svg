<text x="240.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сніг</text>
<rect x="288.0" y="82.0" width="74.0" height="52.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="325.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сніг</text>
