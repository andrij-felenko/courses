<rect x="58.0" y="236.0" width="306.0" height="74.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="211.0" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="211.0" dy="0.0">«сніг» і «вовк» тут — те саме:</tspan><tspan x="211.0" dy="15.6">обидві ознаки ділять приклади</tspan><tspan x="211.0" dy="15.6">бездоганно, вибрати нема з чого</tspan></text>
<line x1="396.0" y1="62.0" x2="396.0" y2="316.0" stroke="#d5d9e0" stroke-width="1.2"/>
<text x="590.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Новий приклад</text>
<rect x="540.0" y="86.0" width="100.0" height="54.0" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="590.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сніг</text>
<text x="590.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">хаскі — але на снігу</text>
<line x1="590.0" y1="172.0" x2="590.0" y2="196.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="523.6" y="199.5" width="132.8" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">модель: «вовк»</tspan></text>
<rect x="436.0" y="250.0" width="306.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#c9ccd3" stroke-width="1.5"/><text x="589.0" y="271.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="589.0" dy="0.0">ознаки розійшлися вперше —</tspan><tspan x="589.0" dy="15.6">і відповідь дала та з них,</tspan><tspan x="589.0" dy="15.6">яку було дешевше знайти</tspan></text>
<rect x="58.0" y="340.0" width="684.0" height="54.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="400.0" y="363.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">На тестовому наборі, зібраному тим самим способом, супутник теж збігається з міткою —</tspan><tspan x="400.0" dy="16.9">тож метрика лишається високою і про підміну не повідомляє</tspan></text>
</svg>