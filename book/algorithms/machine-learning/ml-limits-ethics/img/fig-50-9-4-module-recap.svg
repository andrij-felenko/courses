<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Куди ти прийшов: весь Модуль 7</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">від сирого кадру до навченої моделі, що бачить, розуміє й діє на апараті — відповідально</text>
<rect x="50" y="116" width="280" height="178" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<rect x="50" y="116" width="280" height="42" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="190" y="137" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ВІДЕО</text>
<text x="190" y="151" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Розділи 47–48</text>
<text x="70" y="186" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">зняти кадр (сенсор)</text>
<text x="70" y="210" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ стиснути (DCT, кодеки)</text>
<text x="70" y="234" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ доправити (радіо/мережа)</text>
<text x="340" y="205" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<rect x="350" y="116" width="280" height="178" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<rect x="350" y="116" width="280" height="42" rx="10" fill="#d98a00" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="490" y="137" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ЗОР</text>
<text x="490" y="151" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Розділ 49</text>
<text x="370" y="186" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">піксель → межі → об'єкти</text>
<text x="370" y="210" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ детектор (класика/нейро)</text>
<text x="370" y="234" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ трекінг → керування</text>
<text x="640" y="205" font-size="22" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<rect x="650" y="116" width="280" height="178" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<rect x="650" y="116" width="280" height="42" rx="10" fill="#0a8f3c" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="790" y="137" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">НАВЧАННЯ</text>
<text x="790" y="151" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Розділ 50</text>
<text x="670" y="186" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вчитися з даних → тренувати</text>
<text x="670" y="210" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ CNN → стиснути (TinyML)</text>
<text x="670" y="234" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ запустити на пристрої</text>
<rect x="80" y="318" width="800" height="78" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="480" y="346" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">Машина навчилася БАЧИТИ, РОЗУМІТИ й ДІЯТИ</text>
<text x="480" y="372" font-size="9.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">від світла на сенсорі — до рішення, що замикає керування апаратом. Тепер — користуйся цим мудро.</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це й була мета Модуля 7: дати апарату очі — і розум, щоб ними скористатися.</text>
</svg>
