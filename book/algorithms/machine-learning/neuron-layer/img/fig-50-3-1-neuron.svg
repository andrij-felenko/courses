<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Штучний нейрон: зважена сума плюс «вмикач»</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">входи множаться на ваги, додаються (+ зсув), результат проходить крізь активацію → вихід; ваги — те, що мережа ВИВЧАЄ</text>
<line x1="126" y1="168" x2="330" y2="228" stroke="#1f4ed8" stroke-width="1.6" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="224.0" y="193.0" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">w₁</text>
<line x1="126" y1="228" x2="330" y2="228" stroke="#1f4ed8" stroke-width="1.6" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="224.0" y="223.0" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">w₂</text>
<line x1="126" y1="288" x2="330" y2="228" stroke="#1f4ed8" stroke-width="1.6" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="224.0" y="253.0" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">w₃</text>
<circle cx="108" cy="168" r="18" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="108" y="173" font-size="11" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">x₁</text>
<circle cx="108" cy="228" r="18" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="108" y="233" font-size="11" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">x₂</text>
<circle cx="108" cy="288" r="18" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="108" y="293" font-size="11" fill="white" text-anchor="middle" font-weight="normal" font-style="normal">x₃</text>
<circle cx="360" cy="228" r="30" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360" y="236" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Σ</text>
<text x="360" y="280" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">+ зсув b</text>
<line x1="390" y1="228" x2="446" y2="228" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="450" y="196" width="92" height="64" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<line x1="460" y1="246" x2="496" y2="246" stroke="#0a8f3c" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="496" y1="246" x2="532" y2="212" stroke="#0a8f3c" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="496" y="270" font-size="8.4" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">активація</text>
<line x1="544" y1="228" x2="596" y2="228" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="622" cy="228" r="23" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="622" y="232" font-size="8.4" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">вихід</text>
<rect x="680" y="150" width="230" height="150" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="795" y="174" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">навіяно живим нейроном:</text>
<text x="702" y="198" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• дендрити → входи</text>
<text x="702" y="217" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• тіло клітини → сума</text>
<text x="702" y="236" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• аксон → вихід</text>
<text x="702" y="255" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Та насправді це —</text>
<text x="702" y="274" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">просто арифметика.</text>
<rect x="120" y="328" width="720" height="52" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<text x="480" y="360" font-size="14" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">вихід = активація( w₁·x₁ + w₂·x₂ + w₃·x₃ + b )</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Один нейрон — це зважена сума входів, пропущена крізь активацію. Уся «магія» — у вагах, що їх мережа ВИВЧАЄ.</text>
</svg>
