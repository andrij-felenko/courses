<text x="700" y="368" font-size="9" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">активація ГНЕ межу → складні візерунки</text>
<text x="480.0" y="456" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Активація — це нелінійність. Без неї мережа вміє лише прямі межі (XOR з 50.0 не взяти); з нею — будь-які.</text>
