<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Тихий тріумф у роки «зими»: пошта й чеки</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">задовго до AlexNet, у самісіньку «зиму ШІ», CNN Лекуна щодня читала поштові індекси й банківські чеки</text>
<rect x="70" y="120" width="380" height="150" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="260" y="146" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ПОШТА: індекси на конвертах</text>
<text x="94" y="174" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• сортування листів за рукописним</text>
<text x="94" y="196" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  поштовим індексом (US Postal);</text>
<text x="94" y="218" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• перша реальна робота нейромережі,</text>
<text x="94" y="240" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  навченої зворотним поширенням (1989).</text>
<rect x="510" y="120" width="380" height="150" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="146" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">БАНКИ: суми на чеках</text>
<text x="534" y="174" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• читання рукописних сум на чеках</text>
<text x="534" y="196" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  у банкоматах і банках (LeNet);</text>
<text x="534" y="218" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• за словами Лекуна, наприкінці 1990-х —</text>
<text x="534" y="240" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  чимала частка всіх чеків у США.</text>
<rect x="70" y="296" width="820" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="110" y1="324" x2="850" y2="324" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="150" cy="324" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="150" y="308" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1989</text>
<text x="150" y="319" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">індекси</text>
<circle cx="340" cy="324" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="308" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1998</text>
<text x="340" y="319" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">LeNet-5</text>
<circle cx="560" cy="324" r="5" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="560" y="316" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">роки «зими»</text>
<circle cx="820" cy="324" r="5" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="820" y="308" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">2012</text>
<text x="820" y="319" font-size="7.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">AlexNet</text>
<text x="480" y="378" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">CNN заробляла на життя ще за 20+ років до тріумфу AlexNet — тихо, у роки, коли в нейромережі мало хто вірив.</text>
<text x="480" y="400" font-size="9.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">А набір рукописних цифр MNIST Лекуна став головною «лінійкою» машинного навчання на десятиліття.</text>
<text x="480.0" y="448" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Детектор, що нині на твоєму дроні впізнає ціль, — прямий нащадок цього скромного читача поштових індексів.</text>
</svg>
