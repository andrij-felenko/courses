<rect x="440" y="178.0" width="56" height="56" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="445" y="181.0" width="56" height="56" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="450" y="184.0" width="56" height="56" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="455" y="187.0" width="56" height="56" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<text x="472.0" y="280" font-size="8.8" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">згортка</text>
<text x="472.0" y="294" font-size="8.8" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">+пулінг</text>
<line x1="514" y1="200" x2="614" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="620" y="160" width="120" height="80" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="680" y="280" font-size="8.8" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">повноз'єднані</text>
<line x1="740" y1="200" x2="794" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="800" y="160" width="120" height="80" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="860" y="280" font-size="8.8" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">вихід:</text>
<text x="860" y="294" font-size="8.8" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">клас / рамки</text>
<text x="140" y="150" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">мапи меншають, та їх БІЛЬШЕ (глибше)</text>
<rect x="60" y="320" width="840" height="98" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="344" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ієрархія ознак: що глибше — то складніше</text>
<text x="200" y="372" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">перші шари</text>
<text x="200" y="390" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">КРАЇ, плями</text>
<text x="340.0" y="384" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<text x="480" y="372" font-size="9.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">середні</text>
<text x="480" y="390" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">форми, частини</text>
<text x="620.0" y="384" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">→</text>
<text x="760" y="372" font-size="9.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">глибокі</text>
<text x="760" y="390" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">цілі об'єкти</text>
<text x="480" y="410" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це і є детектор з 49.7, відкритий зсередини — рукотворна луна зорової кори (Г'юбел–Візел).</text>
