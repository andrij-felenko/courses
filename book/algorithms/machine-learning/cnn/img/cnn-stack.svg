<rect x="245" y="169.0" width="80" height="80" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="250" y="172.0" width="80" height="80" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="255" y="175.0" width="80" height="80" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<text x="284.0" y="280" font-size="8.8" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">згортка+ReLU</text>
<text x="284.0" y="294" font-size="8.8" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">+пулінг</text>
