  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Стос CNN: від країв до об'єктів</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">згортка → ReLU → пулінг, і так багато разів: мапи меншають і глибшають; перші шари — краї, глибші — об'єкти; наприкінці повноз'єднані → відповідь</text>
<rect x="40" y="150.0" width="100" height="100" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="45" y="153.0" width="100" height="100" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
