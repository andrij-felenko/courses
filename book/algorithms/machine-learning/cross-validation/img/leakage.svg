<rect x="18.7" y="305.5" width="682.6" height="29.0" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/><text x="360.0" y="323.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">будь-яка підготовка (норма, відбір ознак) живе ВСЕРЕДИНІ навчального блоку — інакше «іспит» уже підглянуто</tspan></text>
