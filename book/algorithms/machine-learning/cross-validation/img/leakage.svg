<rect x="505.7" y="63.5" width="88.5" height="29.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">ПРАВИЛЬНО</tspan></text>
<rect x="420.0" y="118.0" width="260.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="135.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">поділити</tspan><tspan x="550.0" dy="15.6">навч. | іспит</tspan></text>
<line x1="550.0" y1="160.0" x2="550.0" y2="176.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
