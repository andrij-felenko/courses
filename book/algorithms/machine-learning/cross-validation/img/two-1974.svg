<rect x="400.0" y="132.0" width="260.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">кут: ЗРОБИТИ передбачення (ціль)</tspan><tspan x="530.0" dy="14.3">дозволяє загальніші розбиття</tspan></text>
