<rect x="93.3" y="242.0" width="533.4" height="32.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">та сама ідея: повторне використання вибірки → КРОС-ВАЛІДАЦІЯ як МЕТОД</tspan></text>
