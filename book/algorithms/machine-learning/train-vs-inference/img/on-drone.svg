<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що це означає для апарата: возиш заморожену модель</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">на борт ставлять ГОТОВУ модель; апарат лише робить вивід щокадру; щоб покращити — перенавчають у хмарі й перевстановлюють</text>
<rect x="300" y="108" width="360" height="78" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="480" y="132" font-size="10.5" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">ХМАРА / ДАТА-ЦЕНТР — НАВЧАННЯ</text>
<text x="480" y="154" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">гори даних + GPU підганяють ваги</text>
<text x="480" y="172" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">→ виходить навчена модель (файл ваг)</text>
<line x1="480" y1="188" x2="480" y2="226" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="560" y="210" font-size="8.6" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">розгорнути модель</text>
<rect x="300" y="228" width="360" height="92" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="480" y="252" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">АПАРАТ — ВИВІД ЩОКАДРУ</text>
<text x="480" y="274" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">заморожена модель: прохід уперед на кадрі</text>
<text x="480" y="292" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">у польоті НЕ вчиться — лише застосовує</text>
<text x="480" y="310" font-size="8.5" fill="#15803d" text-anchor="middle" font-weight="normal" font-style="normal">(і вивід теж коштує — оптимізуй, 50.7)</text>
<line x1="300" y1="274" x2="190" y2="274" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="190" y1="274" x2="190" y2="147" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="190" y1="147" x2="298" y2="147" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="150" y="212" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">щоб</text>
<text x="150" y="226" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">покращити:</text>
<text x="150" y="244" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зібрати нові</text>
<text x="150" y="256" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дані →</text>
<text x="150" y="270" font-size="8" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">перенавчити</text>
<rect x="120" y="340" width="720" height="64" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="362" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Модель = заморожене знання</text>
<text x="150" y="382" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• статична після навчання: щоб змінити поведінку — перенавчають у хмарі й перевстановлюють (повільний цикл);</text>
<text x="150" y="401" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• дані лишаються в хмарі — на борт їде ЛИШЕ модель (ваги), а не приклади, на яких училися.</text>
<text x="480.0" y="458" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому збій моделі не «полагодити на льоту»: це не баг у коді, а межі того, на чому її навчили.</text>
</svg>
