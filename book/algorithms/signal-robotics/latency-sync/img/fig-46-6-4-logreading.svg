<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Не гадай «що зламалось» — спитай лог: EKF сам показує, чия несподіванка стрибнула й коли. Це й є діагностика поєднання.</text>
