<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Кожен вимір — застарілий: затримка псує поєднання</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">поки GPS-фікс долетів, апарат уже зрушив; вставити його як «тепер» — зіпсувати оцінку</text>
<line x1="90" y1="230" x2="870" y2="230" stroke="#e5e7eb" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="372" y1="212" x2="628" y2="212" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="500.0" y="204" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">за час Δt апарат проїхав сюди →</text>
<circle cx="360" cy="230" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="360" y="260" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">GPS каже: «тут»</text>
<text x="360" y="277" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(але це було Δt тому)</text>
<circle cx="640" cy="230" r="11" fill="#1f4ed8" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="640" y="206" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">апарат ЗАРАЗ</text>
<line x1="628" y1="244" x2="374" y2="244" stroke="#cc0000" stroke-width="2.2" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="500.0" y="264" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">наївно вставити «як тепер» → оцінку тягне НАЗАД (хибно)</text>
<text x="480.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Найгірший винуватець — GPS: його фікс описує, де ти був ~десяту секунди тому, поки сигнал оброблявся.</text>
<text x="480.0" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Вставиш застарілий вимір як свіжий — і позиція засмикається, «забовтається», а то й піде по колу.</text>
</svg>
