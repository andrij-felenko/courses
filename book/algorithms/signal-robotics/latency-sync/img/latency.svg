<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен вимір застарілий: затримка псує поєднання</text>
<line x1="70.0" y1="170.0" x2="650.0" y2="170.0" stroke="#e5e7eb" stroke-width="2.0"/>
<text x="650.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">рух апарата →</text>
<line x1="262.0" y1="152.0" x2="458.0" y2="152.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="360.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">за Δt апарат проїхав сюди</text>
<circle cx="250.0" cy="170.0" r="9.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="250.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">GPS каже «тут»</text>
<text x="250.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(а це було Δt тому)</text>
<circle cx="470.0" cy="170.0" r="11.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="470.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">апарат зараз</text>
<line x1="456.0" y1="186.0" x2="264.0" y2="186.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="360.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">вставити «як тепер» → тягне оцінку НАЗАД</text>
<text x="360.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">GPS — найзатриманіший: фікс описує, де апарат був десяту частку секунди тому.</text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Вставиш застарілий відлік як свіжий — позиція засмикається, а в утриманні піде по колу.</text>
</svg>