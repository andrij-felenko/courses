<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бонуси поєднання: менше шуму й більше стійкості</text>
<rect x="50.0" y="64.0" width="290.0" height="120.0" rx="10" fill="#eef7ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="195.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">менше шуму</text>
<text x="195.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">незалежні джерела</text>
<text x="195.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усереднюються → чистіше</text>
<rect x="380.0" y="64.0" width="290.0" height="120.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="525.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">більше стійкості</text>
<text x="525.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один збоїть (завада, удар)</text>
<text x="525.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">інші тримають оцінку</text>
<text x="360.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кілька давачів — не лише точніше, а й надійніше: система переживає відмову одного</text>
