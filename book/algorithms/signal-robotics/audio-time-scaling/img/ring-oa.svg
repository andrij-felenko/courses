<rect x="262.8" y="15.6" width="156.6" height="37.0" rx="6" fill="#fff7f0" stroke="#c0392b" stroke-width="1.4"/><text x="341.1" y="31.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="341.1" dy="0.0">курсор запису</tspan><tspan x="341.1" dy="13.0">(+= новий кадр × вікно)</tspan></text>
<rect x="57.7" y="154.5" width="150.4" height="37.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="132.9" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.9" dy="0.0">готово → віддати</tspan><tspan x="132.9" dy="13.0">(на Hₛ позаду курсора)</tspan></text>
<rect x="212.0" y="167.5" width="76.0" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="250.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">перекриття</tspan><tspan x="250.0" dy="13.0">(додаємо)</tspan></text>
<rect x="70.2" y="267.5" width="99.5" height="37.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="120.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">попереду — нулі</tspan><tspan x="120.0" dy="13.0">(ще не писали)</tspan></text>
<text x="470.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Правило кільця:</text>
<text x="470.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• пишемо кадр += вікно·відлік</text>
<text x="470.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  (накладаємо на хвіст)</text>
<text x="470.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• курсор іде вперед на Hₛ</text>
<text x="470.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• усе, що на Hₛ позаду —</text>
<text x="470.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  уже не зміниться → drain</text>
<text x="470.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• маска (&amp; (N−1)) замикає</text>
<text x="470.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  індекс у кільце, N = 2ᵏ</text>
</svg>