<text x="360.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">складніший фільтр = каскад біквадів (вихід одного → вхід наступного)</text>
