<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тримати курс на лінію: цілитися в точку наперед</text>
<path d="M 80 320 C 300 200, 560 200, 880 130" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="2,0"/>
<text x="150.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">заданий шлях</text>
<polygon points="265.9,272.2 323.0,253.6 334.1,287.8 277.0,306.4" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
<line x1="328.5" y1="270.7" x2="343.7" y2="265.8" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<circle cx="640.0" cy="188.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="640.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">точка огляду
(наперед на L)</text>
<circle cx="300.0" cy="280.0" r="352.2" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="290.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">L — відстань огляду</text>
<line x1="300.0" y1="280.0" x2="640.0" y2="188.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="300.0" y1="280.0" x2="442.7" y2="233.6" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4,4"/>
<path d="M 343.7 265.8 A 46 46 0 0 0 344.4 268.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="392.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">кут α → кут керма</text>
<rect x="70.0" y="356.0" width="800.0" height="50.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="2.0"/><text x="470.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Курс тримають, цілячись у точку НАПЕРЕД на шляху (на відстані огляду L), а не в найближчу.</tspan><tspan x="470.0" dy="16.9">Кут між носом і напрямом на цю точку задає поворот; більший L — плавніше, менший — точніше.</tspan></text>
</svg>