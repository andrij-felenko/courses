<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Боком не поїдеш: неголономна в'язь ровера</text>
<rect x="184.0" y="180.0" width="52.0" height="80.0" rx="9" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="210.0" y1="180.0" x2="210.0" y2="154.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="174.0" y="180.0" width="12.0" height="28.0" rx="3" fill="#3a3f45" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="174.0" y="232.0" width="12.0" height="28.0" rx="3" fill="#3a3f45" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="234.0" y="180.0" width="12.0" height="28.0" rx="3" fill="#3a3f45" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="234.0" y="232.0" width="12.0" height="28.0" rx="3" fill="#3a3f45" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="560.0" cy="220.0" r="9.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="560.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ціль</text>
<line x1="240.0" y1="220.0" x2="548.0" y2="220.0" stroke="#c0392b" stroke-width="3.0" stroke-dasharray="7,6"/>
<line x1="359.0" y1="194.0" x2="411.0" y2="246.0" stroke="#c0392b" stroke-width="4.0"/>
<line x1="359.0" y1="246.0" x2="411.0" y2="194.0" stroke="#c0392b" stroke-width="4.0"/>
<text x="385.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">боком — НЕ можна</text>
<text x="385.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">колесо не ковзає вбік</text>
<path d="M 210.0 180.0 C 240.0 70.0, 530.0 70.0, 560.0 208.0" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="385.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">дугою — можна</text>
<text x="385.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">виїхати вперед, повернути, під'їхати</text>
<rect x="70.0" y="362.0" width="800.0" height="52.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="2.0"/><text x="470.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Неголономна в'язь: ровер миттєво рухається лише вздовж свого носа й повертає.</tspan><tspan x="470.0" dy="16.9">Дістатися точки збоку можна тільки об'їздом-дугою — це формує всю навігацію ровера.</tspan></text>
</svg>