<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 488" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="488" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінець шляху: коло огляду більше нічого не перетинає</text>
<line x1="130.0" y1="300.0" x2="560.0" y2="250.0" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="130.0" cy="300.0" r="4.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<circle cx="560.0" cy="250.0" r="10.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="588.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">кінець шляху
(остання точка)</text>
<circle cx="430.0" cy="268.0" r="200.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="250.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">коло огляду L</text>
<line x1="430.0" y1="268.0" x2="560.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="495.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">до фінішу 131 &lt; L: коло вже нікуди не перетинає шлях</text>
<polygon points="398.0,253.8 457.6,246.5 462.0,282.2 402.4,289.5" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
<line x1="459.8" y1="264.3" x2="477.6" y2="262.2" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="426.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ровер</text>
<rect x="60.0" y="338.0" width="820.0" height="62.0" rx="6" fill="#fff4ec" stroke="#c0392b" stroke-width="2.0"/><text x="470.0" y="350.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Коли до останньої точки ближче за L, коло огляду вже не перетинає жодного відрізка —</tspan><tspan x="470.0" dy="16.2">уся решта шляху всередині кола. Тоді ціллю беруть саму кінцеву вершину, а на підході</tspan><tspan x="470.0" dy="16.2">гасять швидкість і зупиняються; без цього ровер кружляв би довкола недосяжної точки.</tspan></text>
</svg>