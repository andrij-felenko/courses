<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знайти точку огляду: перетин кола огляду з відрізком шляху</text>
<line x1="150.0" y1="205.0" x2="830.0" y2="165.0" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="150.0" cy="205.0" r="4.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<circle cx="830.0" cy="165.0" r="4.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="158.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">заданий шлях (відрізок ламаної)</text>
<circle cx="380.0" cy="320.0" r="175.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,5"/>
<line x1="380.0" y1="320.0" x2="491.3" y2="184.9" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="443.6" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="700" font-style="italic">L</text>
<line x1="380.0" y1="320.0" x2="253.7" y2="198.9" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,3"/>
<circle cx="253.7" cy="198.9" r="8.0" fill="#e5e7eb" stroke="#6b7280" stroke-width="2.0"/>
<text x="253.7" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">корінь позаду
(відкинути)</text>
<circle cx="491.3" cy="184.9" r="9.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="505.3" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">точка огляду
(корінь ПОПЕРЕДУ за рухом)</text>
<line x1="218.0" y1="201.0" x2="354.0" y2="193.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="286.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">напрям руху вздовж шляху</text>
<polygon points="348.8,304.1 408.7,300.0 411.2,335.9 351.3,340.0" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2"/>
<line x1="409.9" y1="317.9" x2="427.9" y2="316.7" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ровер</text>
<rect x="60.0" y="414.0" width="820.0" height="46.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="2.0"/><text x="470.0" y="433.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Точку огляду шукають як перетин кола радіуса L із відрізком ламаної (квадратне рівняння),</tspan><tspan x="470.0" dy="16.2">а з двох коренів беруть той, що ПОПЕРЕДУ за напрямом руху — інакше ровер поїхав би назад по шляху.</tspan></text>
</svg>