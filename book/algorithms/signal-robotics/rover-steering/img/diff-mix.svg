<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікс бажання → колеса: v і ω розкладаються на два борти</text>
<text x="150.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">БАЖАННЯ</text>
<line x1="150.0" y1="150.0" x2="150.0" y2="100.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="166.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">v — уперед
(лінійна швидкість)</text>
<path d="M 184.0 236.0 A 34 34 0 1 1 144.0 280.0" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="166.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">ω — розворот
(кутова швидкість)</text>
<line x1="300.0" y1="200.0" x2="400.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="350.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">розклад</text>
<rect x="600.0" y="120.0" width="80.0" height="160.0" rx="10" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="640.0" y1="120.0" x2="640.0" y2="92.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ніс</text>
<rect x="580.0" y="170.0" width="20.0" height="60.0" rx="4" fill="#3a3f45" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="680.0" y="170.0" width="20.0" height="60.0" rx="4" fill="#3a3f45" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="570.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ліве</text>
<text x="710.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">праве</text>
<text x="570.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">v − ω·b</text>
<text x="710.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">v + ω·b</text>
<rect x="70.0" y="320.0" width="800.0" height="66.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="470.0" y="340.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">v_лів = v − ω·b        v_прав = v + ω·b        (b — піввідстань між колесами)</tspan><tspan x="470.0" dy="16.9">спільне v — обом порівну (їдьмо вперед); ω — «+» одному колесу, «−» іншому (розворот).</tspan><tspan x="470.0" dy="16.9">Це той самий мікшер, що й у дрона, лише вихід — швидкості коліс, а не оберти гвинтів.</tspan></text>
</svg>