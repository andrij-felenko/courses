<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">SPIRE, 1953: переліт наосліп через континент</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">інерціальна система Дрейпера провела бомбардувальник через усю країну — без орієнтирів</text>
<rect x="120" y="150" width="720" height="150" rx="24" fill="#eef2ff" fill-opacity="1.0" stroke="#c7d2fe" stroke-width="1.6"/>
<text x="480" y="142" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">США — від океану до океану (~3700 км)</text>
<line x1="788" y1="225" x2="660" y2="198" stroke="#1f4ed8" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="660" y1="198" x2="540" y2="242" stroke="#1f4ed8" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="540" y1="242" x2="420" y2="206" stroke="#1f4ed8" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="420" y1="206" x2="194" y2="225" stroke="#1f4ed8" stroke-width="2.6" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="540" y="228" font-size="18" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">✈</text>
<circle cx="800" cy="225" r="9" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="800" y="205" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">СТАРТ</text>
<text x="800" y="253" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Бедфорд,</text>
<text x="800" y="267" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Массачусетс</text>
<circle cx="180" cy="225" r="9" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="180" y="205" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ФІНІШ</text>
<text x="180" y="253" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Лос-</text>
<text x="180" y="267" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Анджелес</text>
<rect x="300" y="330" width="360" height="66" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="318" y="354" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Пілот вивів на курс — і передав керування системі.</text>
<text x="318" y="369" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">SPIRE (~1200 кг) сама вела апарат 12.5 год.</text>
<text x="318" y="384" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Док Дрейпер летів на борту, щоб довести: працює.</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Перший переліт через континент, де курс тримала тільки інерціальна навігація — без зір, радіо й землі.</text>
</svg>
