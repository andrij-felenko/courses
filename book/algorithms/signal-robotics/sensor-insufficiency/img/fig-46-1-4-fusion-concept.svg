<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Фьюжн: багато недосконалих → одна довірена оцінка</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">контролер не вибирає «найкращий» давач, а зводить усі покази в один стан апарата</text>
<rect x="70" y="108" width="150" height="46" rx="9" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="145" y="136" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">IMU</text>
<line x1="224" y1="131" x2="386" y2="222" stroke="#1f4ed8" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="70" y="170" width="150" height="46" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="145" y="198" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">GPS</text>
<line x1="224" y1="193" x2="386" y2="222" stroke="#0a8f3c" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="70" y="232" width="150" height="46" rx="9" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.7"/>
<text x="145" y="260" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">барометр</text>
<line x1="224" y1="255" x2="386" y2="222" stroke="#d98a00" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="70" y="294" width="150" height="46" rx="9" fill="white" fill-opacity="1.0" stroke="#9333ea" stroke-width="1.7"/>
<text x="145" y="322" font-size="13" fill="#9333ea" text-anchor="middle" font-weight="bold" font-style="normal">магнітометр</text>
<line x1="224" y1="317" x2="386" y2="222" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="390" y="150" width="180" height="150" rx="16" fill="#eef2ff" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="480" y="205" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ФЬЮЖН</text>
<text x="480" y="230" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(оцінювач стану,</text>
<text x="480" y="246" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">напр. фільтр Калмана)</text>
<line x1="572" y1="225" x2="700" y2="225" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="702" y="150" width="196" height="150" rx="14" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<text x="800" y="180" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">СТАН АПАРАТА</text>
<text x="720" y="210" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• положення</text>
<text x="720" y="236" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• швидкість</text>
<text x="720" y="262" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• орієнтація (нахил, курс)</text>
<text x="480.0" y="424" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Одна оцінка, якій можна довіряти, — складена з багатьох, жодному з яких не можна вірити наодинці.</text>
</svg>
