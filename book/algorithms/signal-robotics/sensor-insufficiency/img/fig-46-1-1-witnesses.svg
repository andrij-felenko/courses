<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Кожен давач — свідок зі своєю вадою</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">у кожного є що сказати — і в кожного свій сліпий кут; нікому самому довіряти не можна</text>
<rect x="60" y="90" width="410" height="150" rx="12" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.0"/>
<text x="78" y="120" font-size="14" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">IMU (гіро + акселерометр)</text>
<line x1="78" y1="132" x2="452" y2="132" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="80" y="164" font-size="15" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="104" y="164" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">швидкий, миттєвий, самодостатній</text>
<text x="80" y="200" font-size="15" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="104" y="200" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ДРЕЙФУЄ — похибка росте щосекунди</text>
<rect x="490" y="90" width="410" height="150" rx="12" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<text x="508" y="120" font-size="14" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">GNSS (GPS)</text>
<line x1="508" y1="132" x2="882" y2="132" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="510" y="164" font-size="15" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="534" y="164" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">абсолютна позиція, без дрейфу</text>
<text x="510" y="200" font-size="15" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="534" y="200" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">повільний, шумний, пропадає (дах, глушилка)</text>
<rect x="60" y="280" width="410" height="150" rx="12" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.0"/>
<text x="78" y="310" font-size="14" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">Барометр</text>
<line x1="78" y1="322" x2="452" y2="322" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="80" y="354" font-size="15" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="104" y="354" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">висота будь-де, дешево</text>
<text x="80" y="390" font-size="15" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="104" y="390" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">шумить і «пливе» з погодою та вітром</text>
<rect x="490" y="280" width="410" height="150" rx="12" fill="white" fill-opacity="1.0" stroke="#9333ea" stroke-width="2.0"/>
<text x="508" y="310" font-size="14" fill="#9333ea" text-anchor="start" font-weight="bold" font-style="normal">Магнітометр</text>
<line x1="508" y1="322" x2="882" y2="322" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="510" y="354" font-size="15" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="534" y="354" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">курс — де північ</text>
<text x="510" y="390" font-size="15" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="534" y="390" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">кривлять мотори, струми, залізо</text>
<text x="480.0" y="454" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Покладешся на одного — успадкуєш усі його вади. Рятує лише поєднання багатьох.</text>
</svg>
