<rect x="218.4" y="281.1" width="323.2" height="61.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Пілот вивів на курс — і передав керування системі.</tspan><tspan x="380.0" dy="13.7">SPIRE (~1.4 т) сама вела апарат майже 13 год.</tspan><tspan x="380.0" dy="13.7">Док Дрейпер летів на борту, щоб довести: працює.</tspan></text>
