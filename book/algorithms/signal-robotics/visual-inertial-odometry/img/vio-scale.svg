<text x="275.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Той самий візерунок точок пасує будь-якому масштабу —</text>
<text x="275.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">камера не може обрати, який правильний.</text>
<rect x="490.0" y="130.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">IMU знає прискорення в м/с² — а це реальні метри. Він і задає єдиний правильний масштаб.</tspan></text>
