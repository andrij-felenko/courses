<rect x="40.0" y="116.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/><text x="190.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">не дрейфує на текстурі</tspan></text>
<rect x="380.0" y="116.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/><text x="530.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">дрейф росте з часом</tspan></text>
<rect x="40.0" y="164.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/><text x="190.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">бачить масштаб? НІ</tspan></text>
<rect x="380.0" y="164.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/><text x="530.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">дає метричний масштаб</tspan></text>
<rect x="40.0" y="212.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/><text x="190.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">повільна, ~30 Гц</tspan></text>
<rect x="380.0" y="212.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/><text x="530.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">швидка, ~1000 Гц</tspan></text>
<rect x="40.0" y="260.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/><text x="190.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">сліпне на розмитті/пітьмі</tspan></text>
<rect x="380.0" y="260.0" width="300.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/><text x="530.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">працює завжди</tspan></text>
