<text x="360.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">П дає нуль тяги при нульовій помилці; без І апарат просів би, поки помилка знову не зросте</text>
