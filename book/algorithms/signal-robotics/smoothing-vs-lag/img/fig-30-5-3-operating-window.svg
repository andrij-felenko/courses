<text x="340.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо смуги перекриваються — простий фільтр безсилий, треба хитріше</text>
