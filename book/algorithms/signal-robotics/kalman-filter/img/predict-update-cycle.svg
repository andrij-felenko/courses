<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два кроки по колу: передбачити, тоді виправити</text>
<rect x="70.0" y="119.0" width="210.0" height="86.0" rx="6" fill="#eef2fc" stroke="#2457d6" stroke-width="2.0"/><text x="175.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">ПЕРЕДБАЧЕННЯ</tspan><tspan x="175.0" dy="15.6">(predict)</tspan><tspan x="175.0" dy="15.6">модель штовхає оцінку,</tspan><tspan x="175.0" dy="15.6">невпевненість росте</tspan></text>
<rect x="420.0" y="119.0" width="210.0" height="86.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="525.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">ОНОВЛЕННЯ</tspan><tspan x="525.0" dy="15.6">(update)</tspan><tspan x="525.0" dy="15.6">вимір виправляє оцінку,</tspan><tspan x="525.0" dy="15.6">невпевненість падає</tspan></text>
<path d="M 274 144 C 310 84, 390 84, 426 144" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 426 180 C 390 240, 310 240, 274 180" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="350.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">проміж вимірами</text>
<text x="350.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на кожному вимірі</text>
<text x="350.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">десятки разів на секунду</text>
</svg>