<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінка — це точка ПЛЮС її коваріація (хмара)</text>
<g transform="translate(230.0 195.0) rotate(-18.0)"><ellipse cx="0" cy="0" rx="52.0" ry="38.0" fill="#27ae60" fill-opacity="0.16" stroke="#27ae60" stroke-width="2.4"/></g>
<circle cx="230.0" cy="195.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="230.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">мала коваріація</text>
<text x="230.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">оцінці можна вірити</text>
<g transform="translate(545.0 195.0) rotate(-18.0)"><ellipse cx="0" cy="0" rx="105.0" ry="78.0" fill="#c0392b" fill-opacity="0.10" stroke="#c0392b" stroke-width="2.4"/></g>
<circle cx="545.0" cy="195.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="545.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">велика коваріація</text>
<text x="545.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">оцінка розмита</text>
<text x="380.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">фільтр завжди знає не лише «де я», а й «наскільки я певен»</text>
</svg>