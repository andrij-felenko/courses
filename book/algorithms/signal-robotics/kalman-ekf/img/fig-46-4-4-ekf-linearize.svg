<text x="480.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Фільтр Калмана любить прямі, а світ кривий. EKF щокроку випрямляє криву дотичною в точці оцінки —</text>
<text x="480.0" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">той самий трюк, що повів «Аполлон» до Місяця. Працює, поки оцінка близька до правди (далі дотична бреше).</text>
