<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Фільтр Калмана: два кроки, що крутяться по колу</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ПЕРЕДБАЧ (хмара росте, + шум руху Q) → ОНОВИ виміром (хмара меншає через K) → знову</text>
