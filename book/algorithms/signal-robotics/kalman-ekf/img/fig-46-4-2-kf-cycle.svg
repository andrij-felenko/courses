<text x="480" y="230" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">виправлений стан</text>
<text x="480" y="254" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ у наступний цикл</text>
<rect x="300" y="332" width="360" height="50" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">цикл крутиться сотні разів на секунду</text>
