<text x="480.0" y="466" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це і весь фільтр Калмана: передбач (хмара росте) — онови виміром (хмара меншає), знов і знов, оптимально.</text>
