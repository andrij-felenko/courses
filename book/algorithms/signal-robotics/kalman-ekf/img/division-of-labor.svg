<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чотири давачі, один стан: хто що дає</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">IMU веде передбачення, а баро, GNSS і магнітометр осаджують його дрейф — кожен у своїй частині</text>
<rect x="360" y="175" width="240" height="130" rx="14" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.2"/>
<text x="480" y="202" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ОЦІНКА СТАНУ</text>
<text x="386" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• крен, тангаж (нахил)</text>
<text x="386" y="245" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• курс (yaw)</text>
<text x="386" y="264" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• висота</text>
<text x="386" y="283" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• положення, швидкість</text>
<rect x="70" y="200" width="180" height="84" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.0"/>
<text x="160" y="228" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">IMU</text>
<text x="160" y="248" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">гіро + акселерометр</text>
<text x="160" y="266" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">→ ПЕРЕДБАЧЕННЯ всього</text>
<line x1="252" y1="242" x2="358" y2="242" stroke="#1f4ed8" stroke-width="3.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="305" y="232" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">веде</text>
<text x="650" y="150" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">корекції осаджують дрейф</text>
<line x1="698" y1="127" x2="604" y2="240" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="700" y="95" width="200" height="64" rx="11" fill="white" fill-opacity="1.0" stroke="#9333ea" stroke-width="1.8"/>
<text x="800" y="122" font-size="12.5" fill="#9333ea" text-anchor="middle" font-weight="bold" font-style="normal">Магнітометр</text>
<text x="800" y="142" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ курс (yaw)</text>
<line x1="698" y1="217" x2="604" y2="240" stroke="#d98a00" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="700" y="185" width="200" height="64" rx="11" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="800" y="212" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Барометр</text>
<text x="800" y="232" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ висота</text>
<line x1="698" y1="307" x2="604" y2="240" stroke="#0a8f3c" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="0.8" stroke-linecap="round"/>
<rect x="700" y="275" width="200" height="64" rx="11" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="800" y="302" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">GNSS</text>
<text x="800" y="322" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ положення, швидкість</text>
<text x="480.0" y="454" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">IMU дає швидку, гладку, та дрейфливу основу; решта — рідкі, зате стабільні «якорі» для своїх частин стану.</text>
</svg>
