<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Якобіан — це матриця нахилів, нею EKF несе хмару крізь криву</text>
<rect x="40.0" y="125.0" width="180.0" height="100.0" rx="6" fill="#eef2fc" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">нелінійна модель</tspan><tspan x="130.0" dy="15.6">x' = f(x)</tspan><tspan x="130.0" dy="15.6">z = h(x)</tspan></text>
<line x1="220.0" y1="175.0" x2="300.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="302.0" y="125.0" width="196.0" height="100.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">у точці оцінки беремо</tspan><tspan x="400.0" dy="15.6">ЧАСТИННІ ПОХІДНІ</tspan><tspan x="400.0" dy="15.6">(матриці F, H)</tspan></text>
<line x1="498.0" y1="175.0" x2="578.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="125.0" width="200.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">далі — звичайний Калман:</tspan><tspan x="680.0" dy="15.6">F·P·Fᵀ переносить хмару,</tspan><tspan x="680.0" dy="15.6">H дає підсилення K</tspan></text>
<text x="410.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">F, H перелічують щокроку заново — бо нахил кривої свій у кожній точці</text>
</svg>