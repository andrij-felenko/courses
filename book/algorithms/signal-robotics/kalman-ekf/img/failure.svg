<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Коли давач відпав: поєднання деградує плавно</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">GPS зник — горизонталь попливла, та нахил, курс і висота тримаються; апарат міняє режим</text>
<text x="220" y="108" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">усе гаразд</text>
<rect x="70" y="135" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="86" y="165" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">нахил (крен/тангаж)</text>
<text x="354" y="165" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<rect x="70" y="197" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="86" y="227" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">курс</text>
<text x="354" y="227" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<rect x="70" y="259" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="86" y="289" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">висота</text>
<text x="354" y="289" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<rect x="70" y="321" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="86" y="351" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">гориз. положення</text>
<text x="354" y="351" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<text x="740" y="108" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">GPS пропав</text>
<rect x="590" y="135" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="606" y="165" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">нахил (крен/тангаж)</text>
<text x="874" y="165" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<rect x="590" y="197" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="606" y="227" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">курс</text>
<text x="874" y="227" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<rect x="590" y="259" width="300" height="50" rx="9" fill="#0a8f3c" fill-opacity="0.13" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="606" y="289" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">висота</text>
<text x="874" y="289" font-size="10.5" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">✓ прив'язано</text>
<rect x="590" y="321" width="300" height="50" rx="9" fill="#cc0000" fill-opacity="0.13" stroke="#cc0000" stroke-width="1.6"/>
<text x="606" y="351" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">гориз. положення</text>
<text x="874" y="351" font-size="10.5" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">✗ дрейфує</text>
<line x1="388" y1="240" x2="580" y2="240" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="485" y="230" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">GPS зник</text>
<text x="485" y="256" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тільки горизонталь</text>
<text x="485" y="270" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">втрачає прив'язку</text>
<text x="480.0" y="430" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Решта стану тримається своїми корекціями (accel, компас, баро) — апарат не «сліпо падає»: ручний летить далі, автономний саджає (EKF-failsafe).</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому при втраті GPS контролер сам переходить у режим без позиції (утримання висоти) — деградація сходинкою, не обвалом (44.7).</text>
</svg>
