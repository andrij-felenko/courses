<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Хто що утримує: передбачення й прив'язка</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кожну величину штовхає вперед IMU, а прив'язує до правди свій коректор</text>
<text x="250" y="108" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">ВЕЛИЧИНА</text>
<text x="520" y="108" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">передбачає</text>
<text x="760" y="108" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">прив'язує (корегує)</text>
<rect x="70" y="130" width="820" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="250" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">крен, тангаж (нахил)</text>
<text x="520" y="167" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">IMU (гіро)</text>
<rect x="640" y="140" width="240" height="42" rx="8" fill="#d98a00" fill-opacity="0.14" stroke="none" stroke-width="1.6"/>
<text x="760" y="167" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">акселерометр (гравітація)</text>
<rect x="70" y="204" width="820" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="250" y="241" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">курс (yaw)</text>
<text x="520" y="241" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">IMU (гіро)</text>
<rect x="640" y="214" width="240" height="42" rx="8" fill="#9333ea" fill-opacity="0.14" stroke="none" stroke-width="1.6"/>
<text x="760" y="241" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="bold" font-style="normal">магнітометр — єдиний!</text>
<rect x="70" y="278" width="820" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="250" y="315" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">висота</text>
<text x="520" y="315" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">IMU (аксел.)</text>
<rect x="640" y="288" width="240" height="42" rx="8" fill="#1f4ed8" fill-opacity="0.14" stroke="none" stroke-width="1.6"/>
<text x="760" y="315" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">барометр (+ GNSS)</text>
<rect x="70" y="352" width="820" height="62" rx="9" fill="white" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="250" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">гориз. положення, швидк.</text>
<text x="520" y="389" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">IMU (аксел.)</text>
<rect x="640" y="362" width="240" height="42" rx="8" fill="#0a8f3c" fill-opacity="0.14" stroke="none" stroke-width="1.6"/>
<text x="760" y="389" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">GNSS — єдиний!</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Два вузькі місця: курс тримає лише магнітометр, горизонтальну позицію — лише GNSS. Відпаде — нема ким замінити.</text>
</svg>
