<rect x="19.5" y="428.8" width="921.0" height="34.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="450.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">один мотор = ДВА важелі: вертикальна тяга (нагору) і момент рискання (від реакції осі). На цьому стоїть увесь мікшер</tspan></text>
