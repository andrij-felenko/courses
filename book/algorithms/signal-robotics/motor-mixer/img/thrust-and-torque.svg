<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один мотор тягне І крутить: тяга вгору + реактивний момент</text>
<line x1="440.0" y1="250.0" x2="440.0" y2="320.0" stroke="#6b7280" stroke-width="6.0"/>
