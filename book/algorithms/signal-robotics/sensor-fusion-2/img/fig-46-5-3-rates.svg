<text x="480.0" y="410" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">EKF передбачає на кожному тику IMU (густо), а як прилетить відлік баро, компаса чи GPS — робить корекцію.</text>
<text x="480.0" y="426" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому оцінка завжди свіжа й гладка (темп IMU), та водночас прив'язана до правди (рідкі, але стабільні корекції).</text>
