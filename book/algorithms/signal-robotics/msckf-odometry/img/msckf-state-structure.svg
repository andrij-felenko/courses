<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура вектора стану: класичний EKF-SLAM проти MSCKF</text>
<rect x="40.0" y="60.0" width="360.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Класичний EKF-SLAM (стан росте з картою)</tspan></text>
<rect x="40.0" y="110.0" width="360.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Поточний стан IMU (поза, швидкість, зсуви: 15)</tspan></text>
<rect x="40.0" y="152.0" width="360.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3D-орієнтир #1 (X₁, Y₁, Z₁)</tspan></text>
<rect x="40.0" y="192.0" width="360.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3D-орієнтир #2 (X₂, Y₂, Z₂)</tspan></text>
<rect x="40.0" y="232.0" width="360.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="220.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">... сотні 3D-орієнтирів (M × 3) ...</tspan></text>
<rect x="40.0" y="278.0" width="360.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Розмір стану: 15 + 3M</tspan><tspan x="220.0" dy="13.0">Коваріація P: (15+3M) × (15+3M)  →  O(M³) обчислень</tspan></text>
<rect x="440.0" y="60.0" width="360.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">MSCKF (стан не залежить від кількості точок)</tspan></text>
<rect x="440.0" y="110.0" width="360.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Поточний стан IMU (поза, швидкість, зсуви: 15)</tspan></text>
<rect x="440.0" y="152.0" width="360.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Клонована поза камери t[k-N+1] (p, q: 6)</tspan></text>
<rect x="440.0" y="192.0" width="360.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Клонована поза камери t[k-1] (p, q: 6)</tspan></text>
<rect x="440.0" y="232.0" width="360.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Клонована поза камери t[k] (p, q: 6)</tspan></text>
<rect x="440.0" y="278.0" width="360.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Розмір стану: 15 + 6N  (сталий, N ~ 10...30)</tspan><tspan x="620.0" dy="14.3">Орієнтири усуваються проєкцією  →  O(N³) обчислень</tspan></text>
<text x="420.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">В EKF-SLAM складність росте від кількості точок світу; в MSCKF — фіксована вікном поз камери.</text>
</svg>