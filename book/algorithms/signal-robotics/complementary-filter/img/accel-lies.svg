<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Слабке місце: тривале прискорення обманює акселерометр</text>
<rect x="144.0" y="80.0" width="92.0" height="30.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="190.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спокій</text>
<circle cx="190.0" cy="110.0" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="190.0" y1="110.0" x2="190.0" y2="180.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="180.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700" font-style="italic">g</text>
<text x="190.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">«низ» правильний (чисте g)</text>
<rect x="484.0" y="80.0" width="92.0" height="30.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="530.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тривалий розгін</text>
<circle cx="530.0" cy="110.0" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="530.0" y1="110.0" x2="530.0" y2="180.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="520.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700" font-style="italic">g</text>
<line x1="530.0" y1="110.0" x2="586.0" y2="110.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="590.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">a</text>
<line x1="530.0" y1="110.0" x2="586.0" y2="180.0" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="592.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">g + a</text>
<text x="530.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">«низ» відхилився → кут бреше</text>
<line x1="360.0" y1="60.0" x2="360.0" y2="250.0" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="360.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">короткі поштовхи ФНЧ згладжує; тривале прискорення фільтр від нахилу не відрізнить</text>
</svg>