<rect x="540.0" y="45.0" width="190.0" height="130.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="1.4"/>
<text x="635.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Зважування та OLA</text>
<text x="635.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Множення на вікно w[n]</text>
<text x="635.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Накладання у вихідний буфер</text>
