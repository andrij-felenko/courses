<line x1="50.0" y1="280.0" x2="710.0" y2="280.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="50.0" y="255.0" width="360.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="230.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Алгоритмічна затримка заглядання вперед: N + Δ</text>
<text x="230.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">~25–35 мс (залежно від вибору N і Δ)</text>
<rect x="410.0" y="255.0" width="300.0" height="40.0" rx="3" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="560.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Крок видачі блоків: Hs відліків</text>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">~10–15 мс між викликами wsola_step()</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Загальна затримка конвеєра: T_lat = (N + Δ) / fs — час очікування нових відліків перед обробкою</text>
</svg>