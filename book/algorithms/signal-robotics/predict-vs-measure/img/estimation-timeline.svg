<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від пакета Гаусса до рекурсивної петлі Калмана — сто шістдесят років дороги</text>
<rect x="40" y="66" width="239.0" height="252" rx="10" fill="#2457d6" fill-opacity="0.10"/>
<rect x="279.0" y="66" width="637.0" height="252" rx="10" fill="#c0392b" fill-opacity="0.10"/>
