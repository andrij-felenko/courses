<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Після поєднання певність зростає — і цикл замикається</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зведена оцінка вужча за обидві вхідні; вона ж — стан для наступного передбачення</text>
<text x="280" y="78" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">дві широкі хмари → одна вузька</text>
<circle cx="150" cy="165" r="44" fill="#1f4ed8" fill-opacity="0.16" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="150" y="169" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">перед.</text>
<circle cx="246" cy="165" r="40" fill="#0a8f3c" fill-opacity="0.16" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="246" y="169" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">вимір</text>
<line x1="304" y1="165" x2="376" y2="165" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="340" y="153" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">поєднання</text>
<circle cx="430" cy="165" r="22" fill="#cc0000" fill-opacity="0.24" stroke="#cc0000" stroke-width="1.8"/>
<text x="430" y="169" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">СПЛАВ</text>
<text x="430" y="218" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">вужче за обидві!</text>
<line x1="545" y1="95" x2="545" y2="300" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="4,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="745" y="78" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">і цикл замикається</text>
<rect x="615" y="120" width="120" height="54" rx="10" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.7"/>
<text x="675" y="146" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕДБАЧ</text>
<text x="675" y="163" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(46.2)</text>
<rect x="755" y="120" width="120" height="54" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="815" y="146" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">КОРЕКЦІЯ</text>
<text x="815" y="163" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(46.3)</text>
<line x1="737" y1="147" x2="753" y2="147" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="815" y1="176" x2="815" y2="226" stroke="#6b7280" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="815" y1="226" x2="675" y2="226" stroke="#6b7280" stroke-width="1.8" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="675" y1="226" x2="675" y2="178" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="745" y="246" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">тісніший стан → у наступне передбачення</text>
<text x="480.0" y="428" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Кожен оберт «передбач → виправ» робить оцінку трохи певнішою — так апарат і тримає певне відчуття себе.</text>
</svg>
