<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декодер відтворює той самий словник синхронно</text>
<rect x="40.0" y="56.0" width="300.0" height="240.0" rx="6" fill="#f6f8fa" stroke="#2457d6" stroke-width="1.6"/>
<rect x="400.0" y="56.0" width="300.0" height="240.0" rx="6" fill="#f6f8fa" stroke="#27ae60" stroke-width="1.6"/>
<text x="190.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">КОДУВАЛЬНИК</text>
<text x="550.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ДЕКОДЕР</text>
<text x="58.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">бачить A·B → додає  2 = AB</text>
<text x="418.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прийняв 1 → додає  2 = AB</text>
<text x="58.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">бачить B·A → додає  3 = BA</text>
<text x="418.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прийняв 2 → додає  3 = BA</text>
<text x="58.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">бачить AB·A → додає 4 = ABA</text>
<text x="418.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">прийняв 4 → додає  4 = ABA</text>
<text x="370.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">0  1  2  4</text>
<text x="370.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">лише номери в каналі</text>
<line x1="345.0" y1="200.0" x2="398.0" y2="200.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="370.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">однаковий словник по обидва боки — а в каналі жодного рядка таблиці</text>
</svg>