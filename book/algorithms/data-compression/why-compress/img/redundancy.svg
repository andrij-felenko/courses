<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три роди надлишку, що його полює стиснення</text>
<rect x="36.0" y="70.0" width="200.0" height="180.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="136.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">просторовий</text>
<text x="136.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="136.0" dy="0.0">сусідні точки</tspan><tspan x="136.0" dy="14.3">кадру — схожі</tspan></text>
<line x1="56.0" y1="174.0" x2="216.0" y2="174.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="136.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">опиши пляму,</tspan><tspan x="136.0" dy="14.3">не кожну точку</tspan></text>
<rect x="260.0" y="70.0" width="200.0" height="180.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="360.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">часовий</text>
<text x="360.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">сусідні кадри —</tspan><tspan x="360.0" dy="14.3">майже однакові</tspan></text>
<line x1="280.0" y1="174.0" x2="440.0" y2="174.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="360.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">шли лише те,</tspan><tspan x="360.0" dy="14.3">що змінилося</tspan></text>
<rect x="484.0" y="70.0" width="200.0" height="180.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.8"/>
<text x="584.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a5fb0" text-anchor="middle" font-weight="700">перцептивний</text>
<text x="584.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="584.0" dy="0.0">око не бачить</tspan><tspan x="584.0" dy="14.3">дрібниць</tspan></text>
<line x1="504.0" y1="174.0" x2="664.0" y2="174.0" stroke="#8a5fb0" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="584.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5fb0" text-anchor="middle" font-weight="700"><tspan x="584.0" dy="0.0">викинь те, чого</tspan><tspan x="584.0" dy="14.3">не помітно</tspan></text>
</svg>