<text x="102" y="150" font-size="9" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">низькі</text>
<text x="102" y="366" font-size="9" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">↓ високі</text>
<circle cx="140" cy="162" r="16" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.2"/>
<text x="170" y="166" font-size="10" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">← тут уся «суть»</text>
<text x="275.0" y="312" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">майже нулі</text>
