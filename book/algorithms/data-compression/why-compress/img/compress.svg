<text x="745" y="120" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">лишаємо кілька великих чисел →</text>
<rect x="620" y="140" width="110" height="110" rx="4" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="675" y="200" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">оригінал</text>
<text x="745" y="200" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">≈</text>
<rect x="760" y="140" width="110" height="110" rx="4" fill="#dbeafe" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="815" y="198" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">відновлено</text>
<text x="815" y="213" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">з кількох чисел</text>
<rect x="620" y="280" width="250" height="72" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="745" y="306" font-size="10.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">було 64 числа → стало кілька</text>
<text x="745" y="326" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">і око майже не бачить різниці</text>
<text x="745" y="343" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(бо викинули лише дрібне)</text>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Це й є стиснення «з утратами»: відкидаємо ті частоти, яких природа дає мало, а око й не помічає.</text>
