<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="230" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр стиску з утратами: губимо лише на квантуванні</text>
<rect x="40.0" y="80.0" width="150.0" height="60.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="115.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">трансформація</tspan><tspan x="115.0" dy="14.3">(DCT)</tspan></text>
<text x="115.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="115.0" dy="0.0">перекласти в</tspan><tspan x="115.0" dy="11.7">«частоти»</tspan></text>
<rect x="236.0" y="80.0" width="150.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="311.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="311.0" dy="0.0">квантування</tspan></text>
<text x="311.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="311.0" dy="0.0">тут і тільки тут</tspan><tspan x="311.0" dy="11.7">губимо — викидаємо</tspan><tspan x="311.0" dy="11.7">непомітне</tspan></text>
<line x1="192.0" y1="110.0" x2="234.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="432.0" y="80.0" width="150.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="507.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="507.0" dy="0.0">ентропійне</tspan><tspan x="507.0" dy="14.3">кодування</tspan></text>
<text x="507.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="507.0" dy="0.0">пакуємо решту</tspan><tspan x="507.0" dy="11.7">без утрат</tspan></text>
<line x1="388.0" y1="110.0" x2="430.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="370.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">оборотні кроки нічого не втрачають; уся «втрата з утратами» — в одному квантуванні</text>
</svg>