<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ентропія H — непереборна підлога стиску без утрат</text>
<line x1="90.0" y1="210.0" x2="640.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="640.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">біт на символ</text>
<line x1="160.0" y1="70.0" x2="160.0" y2="216.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="160.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">H — ентропія (межа)</text>
<rect x="90.0" y="80.0" width="70.0" height="130.0" rx="6" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<text x="125.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">не можна</text>
<text x="125.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(без утрат)</text>
<circle cx="390.0" cy="110.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="400.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">наївний фікс. код</text>
<line x1="386.0" y1="110.0" x2="166.0" y2="110.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<circle cx="310.0" cy="140.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="320.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">Гаффман (&lt; H+1)</text>
<line x1="306.0" y1="140.0" x2="166.0" y2="140.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<circle cx="230.0" cy="170.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="240.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">арифметичне ≈ H</text>
<line x1="226.0" y1="170.0" x2="166.0" y2="170.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стискати можна аж до H, та не нижче: під H інформація вже зникає</text>
</svg>