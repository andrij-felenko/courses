<text x="200.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">+ бачить далекі повтори</tspan><tspan x="200.0" dy="15.6">+ кращий стиск</tspan><tspan x="200.0" dy="15.6">− більше пам'яті</tspan><tspan x="200.0" dy="15.6">− повільніший пошук</tspan></text>
