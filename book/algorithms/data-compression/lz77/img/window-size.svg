<text x="560.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">+ менше пам'яті</tspan><tspan x="560.0" dy="15.6">+ швидший пошук</tspan><tspan x="560.0" dy="15.6">− не дістає далеких</tspan><tspan x="560.0" dy="15.6">   повторів — гірший стиск</tspan></text>
