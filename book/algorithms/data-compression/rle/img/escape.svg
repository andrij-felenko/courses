<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прапорець-перемикач: повтор або «сирі» байти (як у PackBits)</text>
<rect x="307.6" y="53.5" width="124.8" height="33.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="370.0" y="74.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">керівний байт</tspan></text>
<line x1="338.8" y1="86.5" x2="200.0" y2="176.2" stroke="#6b7280" stroke-width="1.4"/>
<rect x="141.6" y="176.2" width="116.7" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="200.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">лічильник ≥ 0</tspan><tspan x="200.0" dy="15.6">→ повтор</tspan></text>
<text x="200.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">«далі 1 байт,</tspan><tspan x="200.0" dy="13.0">повтори 12 разів»</tspan></text>
<line x1="401.2" y1="86.5" x2="540.0" y2="176.2" stroke="#6b7280" stroke-width="1.4"/>
<rect x="470.5" y="176.2" width="139.0" height="47.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="540.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">прапорець «сирі»</tspan><tspan x="540.0" dy="15.6">→ копіюй як є</tspan></text>
<text x="540.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">«далі 5 байтів,</tspan><tspan x="540.0" dy="13.0">бери дослівно»</tspan></text>
<text x="370.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">сирий режим обмежує роздування: несхоже не множиться на лічильники</text>
</svg>