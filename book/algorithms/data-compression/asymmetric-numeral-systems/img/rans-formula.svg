<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">rANS: кодер і декодер — точні взаємно-обернені дії над x</text>
<text x="360.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">кодер C: додає символ s до стану</text>
<rect x="110.0" y="74.0" width="500.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">x' = (x / freq_s)·total + (x mod freq_s) + cum_s</tspan></text>
<rect x="151.3" y="138.5" width="37.3" height="43.0" rx="6" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">x</tspan></text>
<rect x="526.7" y="138.5" width="46.6" height="43.0" rx="6" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="1.6"/><text x="550.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">x'</tspan></text>
<line x1="200.0" y1="150.0" x2="520.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">C(s, x)</text>
<line x1="520.0" y1="178.0" x2="200.0" y2="178.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">D(x') = (s, x)</text>
<text x="360.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">декодер D: дістає символ s і відновлює попередній стан</text>
<rect x="110.0" y="258.0" width="500.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="360.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">s = symbol(x' mod total);   x = freq_s·(x' / total) + (x' mod total) − cum_s</tspan></text>
</svg>