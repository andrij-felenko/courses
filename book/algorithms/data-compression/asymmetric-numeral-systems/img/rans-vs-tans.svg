<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два різновиди ANS: формула (rANS) і таблиця-автомат (tANS)</text>
<rect x="50.0" y="70.0" width="300.0" height="190.0" rx="6" fill="#fbfbfd" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">rANS (range)</text>
<rect x="68.0" y="114.0" width="264.0" height="46.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/><text x="200.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">x ← (x / freq)·total + (x mod freq) + cum</tspan></text>
<text x="68.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• формула з множенням і діленням</text>
<text x="68.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• будь-які частоти, гнучко</text>
<text x="68.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• одне ділення в гарячому циклі</text>
