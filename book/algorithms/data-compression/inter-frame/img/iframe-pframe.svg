<text x="316" y="320" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="316" y="268.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зміна</text>
<line x1="348" y1="314" x2="382" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="384" y="262.5" width="60" height="37.5" rx="4" fill="#1f4ed8" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="414" y="320" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="414" y="254.5" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зміна</text>
<line x1="446" y1="314" x2="480" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="482" y="279.0" width="60" height="21.000000000000004" rx="4" fill="#1f4ed8" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="512" y="320" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="512" y="271.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зміна</text>
<line x1="544" y1="314" x2="578" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="580" y="270.0" width="60" height="30.0" rx="4" fill="#1f4ed8" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="610" y="320" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="610" y="262.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зміна</text>
<line x1="642" y1="314" x2="676" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="678" y="150.0" width="60" height="150.0" rx="4" fill="#0a8f3c" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="708" y="320" font-size="15" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">I</text>
<text x="708" y="142.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">повний</text>
<line x1="740" y1="314" x2="774" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="776" y="273.0" width="60" height="27.0" rx="4" fill="#1f4ed8" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="806" y="320" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="806" y="265.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зміна</text>
<text x="120" y="346" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">↑ опора (велика)</text>
<text x="414" y="346" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">P крихітні (лише різниці)</text>
<rect x="150" y="360" width="660" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="384" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">I-кадр — самодостатній (як JPEG), великий. P-кадри спираються на попередній — крихітні.</text>
<text x="480" y="403" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Бітрейт «стрибає» на кожному I-кадрі — звідси й поштовхи затримки на вузькому каналі.</text>
</svg>
