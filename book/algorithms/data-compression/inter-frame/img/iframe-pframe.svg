<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">I-кадри й P-кадри: опорний знімок плюс зміни</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">I — повний кадр (як JPEG); P — лише зміна від попереднього (крихітний); послідовність I-P-P-P…</text>
<text x="433.0" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">група кадрів (GOP): I-P-P-P-…-I</text>
<rect x="90" y="150.0" width="60" height="150.0" rx="4" fill="#0a8f3c" fill-opacity="0.7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="120" y="320" font-size="15" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">I</text>
<text x="120" y="142.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">повний</text>
<line x1="152" y1="314" x2="186" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
