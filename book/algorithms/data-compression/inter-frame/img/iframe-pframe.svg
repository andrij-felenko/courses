<text x="218" y="259.0" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зміна</text>
<line x1="250" y1="314" x2="284" y2="314" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
