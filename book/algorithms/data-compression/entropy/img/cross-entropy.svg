<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехресна ентропія: ціна неточної моделі</text>
<line x1="90.0" y1="200.0" x2="650.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="650.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">біт на символ</text>
<line x1="240.0" y1="70.0" x2="240.0" y2="206.0" stroke="#27ae60" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="240.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">H — справжнє дно</text>
<line x1="410.0" y1="90.0" x2="410.0" y2="206.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="410.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">за чужою моделлю q</text>
<rect x="240.0" y="120.0" width="170.0" height="80.0" rx="6" fill="#fdecea" stroke="none" stroke-width="0.0"/>
<text x="325.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">змарновано</text>
<text x="325.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(розбіжність)</text>
<rect x="90.0" y="120.0" width="150.0" height="80.0" rx="6" fill="#eafaf0" stroke="none" stroke-width="0.0"/>
<text x="165.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">зміст</text>
<text x="360.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">що далі твоя модель q від правди p — то більше зайвих бітів понад дно H</text>
</svg>