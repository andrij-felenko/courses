<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Три апарати — три кути трикутника</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">гонка тягне за затримку, далекобій — за бітрейт/дальність, кінозйомка — за якість; кожен жертвує рештою</text>
<rect x="40" y="120" width="280" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.0"/>
<rect x="40" y="120" width="280" height="38" rx="10" fill="#cc0000" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="180.0" y="144" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ГОНОЧНИЙ FPV</text>
<text x="180.0" y="180" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">цар — ЗАТРИМКА (&lt;30 мс)</text>
<text x="60" y="210" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• миттєвість понад усе</text>
<text x="60" y="234" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• жертва: чіткість, дальність</text>
<text x="60" y="258" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• intra-важко, малий буфер</text>
<text x="60" y="282" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• аналог або DJI low-latency</text>
<text x="60" y="306" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (720p120, &lt;28 мс)</text>
<rect x="340" y="120" width="280" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.0"/>
<rect x="340" y="120" width="280" height="38" rx="10" fill="#1f4ed8" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="480.0" y="144" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ДАЛЕКОБІЙ / HD-лінк</text>
<text x="480.0" y="180" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">тиск — БІТРЕЙТ / ДАЛЬНІСТЬ</text>
<text x="360" y="210" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• канал вузький на відстані</text>
<text x="360" y="234" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• тисне сильно (H.265)</text>
<text x="360" y="258" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• терпить десятки мс лагу</text>
<text x="360" y="282" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• якість — під залишок смуги</text>
<text x="360" y="306" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• приклад: HD-FPV на дальності</text>
<rect x="640" y="120" width="280" height="300" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.0"/>
<rect x="640" y="120" width="280" height="38" rx="10" fill="#0a8f3c" fill-opacity="0.16" stroke="none" stroke-width="1.6"/>
<text x="780.0" y="144" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">КІНОЗЙОМКА / ЗАПИС</text>
<text x="780.0" y="180" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">цар — ЯКІСТЬ</text>
<text x="660" y="210" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• не наживо → лаг байдужий</text>
<text x="660" y="234" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• B-кадри, великий буфер</text>
<text x="660" y="258" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• VBR, високий бітрейт</text>
<text x="660" y="282" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• макс. деталь і колір</text>
<text x="660" y="306" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• пишемо на картку (48.4)</text>
<text x="480.0" y="454" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Той самий кодек, різні налаштування: «найкращого» нема — є налаштований під місію апарата.</text>
</svg>
