<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три апарати — три кути трикутника</text>
<rect x="20.0" y="70.0" width="220.0" height="224.0" rx="12" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<rect x="20" y="70" width="220" height="34" rx="10" fill="#c0392b" fill-opacity="0.15"/>
<text x="130.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ГОНОЧНИЙ FPV</text>
<text x="130.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">цар — ЗАТРИМКА</text>
<text x="34.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• миттєвість понад усе</text>
<text x="34.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• жертва: чіткість, дальність</text>
<text x="34.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• intra-важко, малий буфер</text>
<text x="34.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• low-latency (720p120, &lt;28 мс)</text>
<rect x="250.0" y="70.0" width="220.0" height="224.0" rx="12" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<rect x="250" y="70" width="220" height="34" rx="10" fill="#2457d6" fill-opacity="0.15"/>
<text x="360.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ДАЛЕКОБІЙ / HD</text>
<text x="360.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">тиск — БІТРЕЙТ</text>
<text x="264.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• канал вузький на відстані</text>
<text x="264.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• тисне сильно (H.265)</text>
<text x="264.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• терпить десятки мс лагу</text>
<text x="264.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• якість — під залишок смуги</text>
<rect x="480.0" y="70.0" width="220.0" height="224.0" rx="12" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<rect x="480" y="70" width="220" height="34" rx="10" fill="#27ae60" fill-opacity="0.15"/>
<text x="590.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАПИС / КІНО</text>
<text x="590.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">цар — ЯКІСТЬ</text>
<text x="494.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• не наживо → лаг байдужий</text>
<text x="494.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• B-кадри, великий буфер</text>
<text x="494.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• VBR, високий бітрейт</text>
<text x="494.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• макс. деталь і колір</text>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий кодек — різні налаштування: «найкращого» нема, є налаштований під місію</text>
</svg>