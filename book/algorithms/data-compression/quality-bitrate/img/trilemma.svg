<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник компромісу: задай дві ручки — третя визначиться</text>
<polygon points="230,80 90,300 370,300" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="230.0" cy="80.0" r="6.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.3"/>
<circle cx="90.0" cy="300.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.3"/>
<circle cx="370.0" cy="300.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="230.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЯКІСТЬ</text>
<text x="86.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">БІТРЕЙТ</text>
<text x="374.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАТРИМКА</text>
<text x="230.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">обери 2 —</tspan><tspan x="230.0" dy="14.3">третя слідом</tspan></text>
<rect x="430.0" y="70.0" width="250.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="555.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">правило трьох ручок</text>
<circle cx="446.0" cy="120.0" r="5.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="458.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Хочеш ЯКІСТЬ?</text>
<text x="458.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">плати бітрейтом або затримкою</text>
<circle cx="446.0" cy="170.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="458.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Канал тисне БІТРЕЙТ?</text>
<text x="458.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ріж якість або копи буфер (лаг)</text>
<circle cx="446.0" cy="220.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="458.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Мала ЗАТРИМКА?</text>
<text x="458.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">стиск гірший → якість чи біти</text>
<rect x="444.0" y="270.0" width="222.0" height="42.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<text x="555.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Найчастіше канал ЗАДАЄ бітрейт —</tspan><tspan x="555.0" dy="11.7">лишається торг якість ↔ затримка</tspan></text>
</svg>