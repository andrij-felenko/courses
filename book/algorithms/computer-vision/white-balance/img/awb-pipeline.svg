<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де стоїть автобаланс: у лінійному світлі, до тонової кривої</text>
<rect x="40.0" y="96.0" width="132.0" height="74.0" rx="8" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="1.3"/>
