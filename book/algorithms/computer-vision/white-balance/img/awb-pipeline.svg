<text x="106.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="106.0" dy="0.0">L·ρ,</tspan><tspan x="106.0" dy="11.7">один канал</tspan></text>
<line x1="176.0" y1="133.0" x2="198.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="202.0" y="96.0" width="132.0" height="74.0" rx="8" fill="#dbe4f0" stroke="#1a1a1a" stroke-width="1.3"/>
