<text x="268.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="268.0" dy="0.0">повний RGB,</tspan><tspan x="268.0" dy="11.7">ще лінійний</tspan></text>
<line x1="338.0" y1="133.0" x2="360.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="364.0" y="96.0" width="132.0" height="74.0" rx="8" fill="#f6d9a8" stroke="#c0392b" stroke-width="2.4"/>
<text x="430.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">БАЛАНС</tspan><tspan x="430.0" dy="15.6">БІЛОГО</tspan></text>
<text x="430.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="430.0" dy="0.0">×g на канал,</tspan><tspan x="430.0" dy="11.7">тут і тільки тут</tspan></text>
<line x1="500.0" y1="133.0" x2="522.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="526.0" y="96.0" width="132.0" height="74.0" rx="8" fill="#dcefdc" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="592.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="592.0" dy="0.0">тонова</tspan><tspan x="592.0" dy="15.6">крива / γ</tspan></text>
<text x="592.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="592.0" dy="0.0">стиск у 8 біт,</tspan><tspan x="592.0" dy="11.7">нелінійно</tspan></text>
<line x1="662.0" y1="133.0" x2="684.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="688.0" y="96.0" width="132.0" height="74.0" rx="8" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="754.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="754.0" dy="0.0">JPEG</tspan></text>
<text x="754.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="754.0" dy="0.0">колір</tspan><tspan x="754.0" dy="11.7">вже вбудований</tspan></text>
<line x1="40.0" y1="76.0" x2="526.0" y2="76.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="283.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">лінійне світло: піксель ∝ L·ρ</text>
<rect x="40.0" y="246.0" width="780.0" height="66.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.4"/><text x="430.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Коефіцієнти множать сам сигнал світла, тож ставити їх треба ДО тонової кривої (гами), поки</tspan><tspan x="430.0" dy="14.3">піксель ще пропорційний L·ρ. Після кривої шкала вже стиснена нелінійно — те саме множення дасть</tspan><tspan x="430.0" dy="14.3">інший, спотворений відтінок. І лише на повному RGB: до демозаїки окремих каналів ще нема.</tspan></text>
</svg>