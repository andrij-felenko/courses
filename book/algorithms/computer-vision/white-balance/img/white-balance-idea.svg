<rect x="55.0" y="358.0" width="750.0" height="52.0" rx="6" fill="#f0f9f4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="386.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Ключ: сіре/біле має давати рівні R=G=B. Світло перекошує канали — множимо кожен на свій коефіцієнт, щоб нейтраль знову стала нейтральною. Це і є весь баланс білого.</tspan></text>
