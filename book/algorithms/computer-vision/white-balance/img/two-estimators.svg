<rect x="60.0" y="300.0" width="340.0" height="116.0" rx="6" fill="#fdf3f0" stroke="#c0392b" stroke-width="1.3"/><text x="230.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Дешево, один прохід. Але хибиться, коли сцена НЕ сіра в середньому: велике червоне тло, зелене поле, синє небо на весь кадр — воно вважає той колір «перекосом світла» й вибілює його в сіре. Мало кольорів — теж хиба.</tspan></text>
<rect x="440.0" y="50.0" width="380.0" height="380.0" rx="10" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.2"/>
