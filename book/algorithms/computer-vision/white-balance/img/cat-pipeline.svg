<text x="312.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">g_R g_G g_B</text>
<text x="312.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">три коефіцієнти прямо в RGB</text>
<line x1="372.0" y1="110.0" x2="452.0" y2="110.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
