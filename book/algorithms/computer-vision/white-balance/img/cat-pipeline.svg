<text x="520.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R=G=B, нейтраль</text>
<rect x="600.0" y="68.0" width="250.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.3"/><text x="725.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Працює, бо фільтри Баєра доволі вузькі — діагональ у самому RGB уже добра. Три множення на піксель, жодного змішування каналів.</tspan></text>
<line x1="46.0" y1="190.0" x2="854.0" y2="190.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
