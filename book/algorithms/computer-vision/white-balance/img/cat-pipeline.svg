<text x="700.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">назад у RGB</text>
<line x1="746.0" y1="292.0" x2="800.0" y2="292.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
