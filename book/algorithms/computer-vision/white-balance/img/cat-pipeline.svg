<rect x="830.0" y="271.0" width="16.0" height="51.0" rx="2" fill="#3aa856" stroke="#1a1a1a" stroke-width="0.8"/>
<rect x="852.0" y="271.0" width="16.0" height="51.0" rx="2" fill="#3b6fd6" stroke="#1a1a1a" stroke-width="0.8"/>
<rect x="46.0" y="358.0" width="808.0" height="56.0" rx="6" fill="#f7f4fb" stroke="#8a4fd6" stroke-width="1.4"/><text x="450.0" y="388.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Разом M⁻¹ · D · M — повна матриця 3×3 за формою, але вся залежність від лампи сидить у трьох числах діагоналі D. Стала пара M / M⁻¹ (лише сенсор) розводить чутливості так, щоб не перекривалися, — і діагональ фон Кріса знову точна.</tspan></text>
