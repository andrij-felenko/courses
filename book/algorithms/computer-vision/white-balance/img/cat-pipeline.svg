<text x="548.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">діагональ тут</text>
<text x="548.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">фон Кріс: 3 числа</text>
<line x1="594.0" y1="292.0" x2="646.0" y2="292.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="654.0" y="267.0" width="92.0" height="50.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/>
