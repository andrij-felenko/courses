<rect x="40.0" y="316.0" width="740.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Проба відношення (Lowe): збіг приймають лише коли найближчий опис помітно ближчий за ДРУГИЙ-за-близькістю (d₁/d₂ &lt; ≈0.8).</tspan><tspan x="410.0" dy="13.0">Якщо перший і другий майже однакові — окіл не унікальний (візерунок, що повторюється), і пару відкидають.</tspan></text>
