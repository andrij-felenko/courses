<rect x="40.0" y="350.0" width="740.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Навіть по пробі відношення частина пар — хибні. RANSAC питає: чи є ЄДИНИЙ геометричний зсув сцени,</tspan><tspan x="410.0" dy="13.0">з яким згодна більшість пар? Ті, що згодні (паралельні зелені), лишаються; поодинокі бунтарі (пунктир) — викиди.</tspan></text>
