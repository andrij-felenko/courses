<rect x="40.0" y="328.0" width="740.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Зіставлення знаходить на двох знімках ОДНІ Й ТІ САМІ фізичні місця й з'єднує їх у пари (зелене).</tspan><tspan x="410.0" dy="13.0">Кожна пара каже: «ось цей куточок стіни тут — і він же там». Що не має відповідника — лишається без пари.</tspan></text>
