<rect x="46.0" y="336.0" width="698.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="395.0" y="356.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">До ПРАВИЛЬНОГО сусіда відстань мала (лівий вузький горб); до найкращого ВИПАДКОВОГО — велика (правий широкий).</tspan><tspan x="395.0" dy="11.7">Проба відношення d₁/d₂ питає: найближчий кандидат — з лівого горба (мале d₁ на тлі великого d₂) чи з правого (обидва великі)?</tspan></text>
