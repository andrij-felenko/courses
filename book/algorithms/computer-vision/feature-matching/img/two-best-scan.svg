<rect x="44.0" y="300.0" width="732.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="319.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">За прохід ведемо два рекорди. Новий кандидат, кращий за best, СТАЄ best, а старий best з'їжджає в second (крок 1→2).</tspan><tspan x="410.0" dy="11.7">Кандидат, гірший за обидва, не міняє нічого. Підсумок best=12, second=47 — виразний відрив, і проба відношення (12 &lt; 0.8·47) приймає збіг.</tspan></text>
