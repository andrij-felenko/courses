<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">За кольором: маска → пляма → центр і рамка</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">поріг у HSV (49.1) лишає лиш потрібний тон → чиста маска (49.5) → знаходимо білу пляму, її площу, центр і рамку</text>
<rect x="40" y="150" width="180" height="130" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="58" y="166" width="34" height="30" rx="8" fill="#2563eb" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="190" cy="250" r="18" fill="#16a34a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="132" cy="214" r="30" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="130" y="300" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">кадр</text>
<line x1="222" y1="215" x2="268" y2="215" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="270" y="150" width="180" height="130" rx="8" fill="#0a0d12" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="362" cy="214" r="30" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="294" y="170" width="7" height="7" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="420" y="256" width="6" height="6" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="360" y="300" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">HSV-поріг → маска</text>
<line x1="452" y1="215" x2="498" y2="215" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="500" y="150" width="180" height="130" rx="8" fill="#0a0d12" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="592" cy="214" r="30" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="590" y="300" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">морфологія (49.5)</text>
<line x1="682" y1="215" x2="728" y2="215" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="730" y="150" width="180" height="130" rx="8" fill="#0a0d12" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="822" cy="214" r="30" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="792" y="184" width="60" height="60" rx="8" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2"/>
<line x1="815" y1="214" x2="829" y2="214" stroke="#cc0000" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="822" y1="207" x2="822" y2="221" stroke="#cc0000" stroke-width="2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="820" y="300" font-size="9.3" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">пляма: центр + рамка</text>
<rect x="730" y="318" width="190" height="86" rx="10" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="825" y="340" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">що дістаємо:</text>
<text x="745" y="358" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• центр (cx, cy)</text>
<text x="745" y="373" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• площа (скільки пікселів)</text>
<text x="745" y="388" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• габаритна рамка</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Колір — найдешевший сигнал: поріг у HSV, чистка маски, і пляма видає центр та рамка цілі. Тягне навіть МК.</text>
