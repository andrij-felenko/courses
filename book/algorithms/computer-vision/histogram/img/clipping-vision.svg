<text x="80" y="316" font-size="9" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">0 (тіні)</text>
<text x="440" y="316" font-size="9" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">255 (світла)</text>
<text x="260" y="348" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">піки на краях = тони «прилипли»</text>
<text x="260" y="366" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">деталі за межами втрачено НАЗАВЖДИ</text>
<text x="260" y="382" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(недо-/переекспозиція)</text>
<rect x="490" y="100" width="420" height="300" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="124" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ЧОМУ ЦЕ ВАЖЛИВО ДЛЯ ЗОРУ</text>
<rect x="520" y="150" width="110" height="90" rx="8" fill="#23262e" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="556" y="182" width="40" height="30" rx="8" fill="#2b2f38" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="575" y="252" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">темний, плаский</text>
<text x="575" y="266" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кадр → ціль не видно</text>
<line x1="642" y1="195" x2="686" y2="195" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="664" y="184" font-size="9" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">вирівняти</text>
<rect x="700" y="150" width="110" height="90" rx="8" fill="#3b4250" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="736" y="182" width="40" height="30" rx="8" fill="#f59e0b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="732" y="178" width="48" height="38" rx="8" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2"/>
<text x="755" y="252" font-size="8.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">контраст піднято →</text>
<text x="755" y="266" font-size="8.5" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">межі й ціль проявились</text>
<text x="700" y="318" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">тому кадр часто нормалізують ПЕРЕД</text>
<text x="700" y="334" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">розпізнаванням — щоб світло не збивало</text>
<text x="700" y="350" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">детектор</text>
<text x="480.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Гістограма — і діагноз (чи не обрізано тони), і ліки (нормалізуй перед зором). Обрізане ж не повернути.</text>
