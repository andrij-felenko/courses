<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Обрізання тонів — і чому гістограма важлива для зору</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">значення за межами 0…255 «прилипають» і деталі гинуть; а рівний тон робить розпізнавання стійким до світла</text>
