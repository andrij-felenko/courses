<rect x="70.0" y="396.0" width="580.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Що рідша решітка каналу, то вужча його зона Найквіста — і то нижча частота, на якій</tspan><tspan x="360.0" dy="13.0">деталь уже не відрізнити від хибної (aliasing). У зеленого зона ширша, тож муар у ньому пізніший.</tspan></text>
