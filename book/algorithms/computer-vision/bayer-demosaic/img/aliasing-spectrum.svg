<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому муар неминучий: копії спектра накладаються</text>
<text x="170.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f9d4d" text-anchor="middle" font-weight="700">зелене (густа решітка)</text>
<line x1="92.0" y1="150.0" x2="248.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="170.0" y1="80.0" x2="170.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.1"/>
<circle cx="170.0" cy="128.0" r="22.0" fill="#1f9d4d" stroke="none" stroke-width="0.0"/>
<circle cx="169.0" cy="128.0" r="48.0" fill="#1f9d4d" stroke="none" stroke-width="0.0"/>
<circle cx="169.0" cy="128.0" r="48.0" fill="#1f9d4d" fill-opacity="0.30" stroke="none"/>
<circle cx="171.0" cy="128.0" r="48.0" fill="#1f9d4d" stroke="none" stroke-width="0.0"/>
<circle cx="171.0" cy="128.0" r="48.0" fill="#1f9d4d" fill-opacity="0.30" stroke="none"/>
<text x="170.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">копії на кроці решітки</text>
<text x="170.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">копії далеко → перекриття мале</text>
<text x="420.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#cc2c20" text-anchor="middle" font-weight="700">червоне / синє (рідка)</text>
<line x1="342.0" y1="150.0" x2="498.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="420.0" y1="80.0" x2="420.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.1"/>
<circle cx="420.0" cy="128.0" r="22.0" fill="#cc2c20" stroke="none" stroke-width="0.0"/>
<circle cx="419.0" cy="128.0" r="30.0" fill="#cc2c20" stroke="none" stroke-width="0.0"/>
<circle cx="419.0" cy="128.0" r="30.0" fill="#cc2c20" fill-opacity="0.30" stroke="none"/>
<circle cx="421.0" cy="128.0" r="30.0" fill="#cc2c20" stroke="none" stroke-width="0.0"/>
<circle cx="421.0" cy="128.0" r="30.0" fill="#cc2c20" fill-opacity="0.30" stroke="none"/>
<text x="420.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">копії на кроці решітки</text>
<text x="420.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">копії близько → перекриття є</text>
<text x="610.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">перекриття = aliasing</text>
<circle cx="600.0" cy="128.0" r="26.0" fill="#2457d6" stroke="none" stroke-width="0.0"/>
<circle cx="628.0" cy="128.0" r="26.0" fill="#cc2c20" fill-opacity="0.35" stroke="none"/>
<circle cx="628.0" cy="128.0" r="26.0" fill="none" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="614.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тут частоти</text>
<text x="614.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">складаються</text>
<rect x="70.0" y="250.0" width="580.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Дискретизація тиражує спектр сцени копіями на вузлах решітки каналу. Де копія сусіда</tspan><tspan x="360.0" dy="15.0">залазить у базову смугу, висока частота сцени стає НЕВІДРІЗНЕННОЮ від низької —</tspan><tspan x="360.0" dy="15.0">у кадрі вона проступає хвилями (муар). Рідша решітка R/B ставить копії ближче, тож</tspan><tspan x="360.0" dy="15.0">складаються вони раніше. AA-фільтр (легке оптичне розмиття) зрізає верхні частоти ще</tspan><tspan x="360.0" dy="15.0">до сенсора — щоб накладатися вже не було чому.</tspan></text>
</svg>