<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">AHD: два буфери, вибір попіксельно за однорідністю в Lab</text>
<rect x="60.0" y="96.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="120.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">сира</tspan><tspan x="120.0" dy="15.6">мозаїка</tspan><tspan x="120.0" dy="15.6">RGGB</tspan></text>
<line x1="182.0" y1="112.0" x2="232.0" y2="84.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="182.0" y1="140.0" x2="232.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="234.0" y="60.0" width="158.0" height="48.0" rx="6" fill="#fdecea" stroke="#cc2c20" stroke-width="1.5"/><text x="313.0" y="80.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="313.0" dy="0.0">буфер H</tspan><tspan x="313.0" dy="14.3">(лише горизонталь)</tspan></text>
<rect x="234.0" y="150.0" width="158.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="313.0" y="170.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="313.0" dy="0.0">буфер V</tspan><tspan x="313.0" dy="14.3">(лише вертикаль)</tspan></text>
<line x1="394.0" y1="84.0" x2="436.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="394.0" y1="174.0" x2="436.0" y2="148.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="438.0" y="100.0" width="170.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="523.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="523.0" dy="0.0">перевести в Lab,</tspan><tspan x="523.0" dy="13.7">зміряти однорідність</tspan><tspan x="523.0" dy="13.7">околу для H і для V</tspan></text>
<line x1="610.0" y1="128.0" x2="638.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="170.0" width="116.0" height="54.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="658.0" y="193.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="658.0" dy="0.0">лишити</tspan><tspan x="658.0" dy="14.3">однорідніший</tspan></text>
<text x="658.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">піксель</text>
<rect x="60.0" y="250.0" width="600.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Замість одного компромісного напряму AHD інтерполює кадр ДВІЧІ — окремо по горизонталі</tspan><tspan x="360.0" dy="13.7">(буфер H) і по вертикалі (буфер V). Тоді для кожного пікселя дивиться, у якому з двох</tspan><tspan x="360.0" dy="13.7">варіантів сусідство однорідніше за кольором у перцептивному просторі Lab: різкий край,</tspan><tspan x="360.0" dy="13.7">перетятий упоперек, дає рвані стрибки кольору (низька однорідність), а вздовж — гладко.</tspan><tspan x="360.0" dy="13.7">Лишаємо локально гладший варіант. Звідси менше і «застібки», і хибного кольору на діагоналях.</tspan></text>
</svg>