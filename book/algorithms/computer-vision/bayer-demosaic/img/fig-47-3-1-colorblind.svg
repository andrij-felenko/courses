<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Піксель сліпий до кольору — то дамо йому фільтр</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відерце лічить усі фотони підряд (лише яскравість); щоб бачити колір, над пікселем ставлять скельце</text>
<text x="200" y="112" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">БЕЗ фільтра</text>
<line x1="165" y1="140" x2="160" y2="184" stroke="#cc0000" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="200" y1="140" x2="195" y2="184" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="235" y1="140" x2="230" y2="184" stroke="#1f4ed8" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="150" y="190" width="100" height="70" rx="4" fill="#9ca3af" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="200" y="232" font-size="10.5" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">усе світло</text>
<text x="200" y="286" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">міряє лише ЯСКРАВІСТЬ</text>
<text x="200" y="302" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(сірий — колір невідомий)</text>
<text x="640" y="112" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">З кольоровим фільтром над пікселем</text>
<line x1="454" y1="150" x2="454" y2="178" stroke="#cc0000" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="470" y1="150" x2="470" y2="178" stroke="#16a34a" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="486" y1="150" x2="486" y2="178" stroke="#1f4ed8" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<rect x="430" y="180" width="80" height="15" rx="8" fill="#cc0000" fill-opacity="0.55" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="530" y="192" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">фільтр</text>
<line x1="470" y1="197" x2="470" y2="214" stroke="#cc0000" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="438" y="216" width="64" height="56" rx="4" fill="#cc0000" fill-opacity="0.35" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="470" y="252" font-size="15" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">R</text>
<line x1="604" y1="150" x2="604" y2="178" stroke="#cc0000" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="620" y1="150" x2="620" y2="178" stroke="#16a34a" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="636" y1="150" x2="636" y2="178" stroke="#1f4ed8" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<rect x="580" y="180" width="80" height="15" rx="8" fill="#16a34a" fill-opacity="0.55" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="680" y="192" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">фільтр</text>
<line x1="620" y1="197" x2="620" y2="214" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="588" y="216" width="64" height="56" rx="4" fill="#16a34a" fill-opacity="0.35" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="620" y="252" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold" font-style="normal">G</text>
<line x1="754" y1="150" x2="754" y2="178" stroke="#cc0000" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="770" y1="150" x2="770" y2="178" stroke="#16a34a" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<line x1="786" y1="150" x2="786" y2="178" stroke="#1f4ed8" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
<rect x="730" y="180" width="80" height="15" rx="8" fill="#1f4ed8" fill-opacity="0.55" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="830" y="192" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">фільтр</text>
<line x1="770" y1="197" x2="770" y2="214" stroke="#1f4ed8" stroke-width="2.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="738" y="216" width="64" height="56" rx="4" fill="#1f4ed8" fill-opacity="0.35" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="770" y="252" font-size="15" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="640" y="300" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кожен ловить лише СВІЙ колір → міряє його яскравість</text>
<text x="480.0" y="426" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Фільтр пропускає тільки свою смугу: червоний — лише червоне світло, і так далі. Так піксель стає «кольоровим».</text>
</svg>
