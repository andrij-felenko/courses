<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Градієнтно-коригована інтерполяція: уздовж краю, не впоперек</text>
<circle cx="200.0" cy="150.0" r="16.0" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="182.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">?</text>
<circle cx="200.0" cy="98.0" r="13.0" fill="#1f9d4d" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="200.0" cy="202.0" r="13.0" fill="#1f9d4d" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="148.0" cy="150.0" r="13.0" fill="#1f9d4d" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="252.0" cy="150.0" r="13.0" fill="#1f9d4d" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="148.0" y1="150.0" x2="252.0" y2="150.0" stroke="#cc2c20" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="200.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ΔV = |верх − низ|</text>
<line x1="200.0" y1="98.0" x2="200.0" y2="202.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="200.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#cc2c20" text-anchor="middle" font-weight="700">ΔH = |ліво − право|</text>
<rect x="430.0" y="70.0" width="230.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="545.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">порахувати ΔH і ΔV</tspan></text>
<line x1="545.0" y1="110.0" x2="545.0" y2="134.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<polygon points="545.0,134.0 640.0,160.0 545.0,186.0 450.0,160.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="545.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ΔH &lt; ΔV ?</text>
<line x1="460.0" y1="174.0" x2="410.0" y2="212.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="402.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">так</text>
<line x1="630.0" y1="174.0" x2="680.0" y2="212.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="686.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ні</text>
<rect x="310.0" y="216.0" width="175.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="397.5" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="397.5" dy="0.0">край горизонтальний:</tspan><tspan x="397.5" dy="13.7">брати ліво+право</tspan><tspan x="397.5" dy="13.7">(вага → горизонталі)</tspan></text>
<rect x="510.0" y="216.0" width="175.0" height="56.0" rx="6" fill="#fdecea" stroke="#cc2c20" stroke-width="1.5"/><text x="597.5" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="597.5" dy="0.0">край вертикальний:</tspan><tspan x="597.5" dy="13.7">брати верх+низ</tspan><tspan x="597.5" dy="13.7">(вага → вертикалі)</tspan></text>
<rect x="70.0" y="332.0" width="580.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Замість сліпого середнього чотирьох сусідів зважуємо їх ОБЕРНЕНО до градієнта в кожному</tspan><tspan x="360.0" dy="14.3">напрямі: де перепад малий (уздовж краю) — вага більша, де великий (упоперек) — менша.</tspan><tspan x="360.0" dy="14.3">Так інтерполяція не «перестрибує» різку межу, і «застібка» на контурах майже зникає.</tspan></text>
</svg>