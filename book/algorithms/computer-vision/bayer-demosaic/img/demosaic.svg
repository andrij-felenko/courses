<text x="360.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">У сирій мозаїці кожна точка має лише одну складову; демозаїка інтерполює дві відсутні з сусідів.</text>
<text x="360.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">На виході — повноколірний кадр, де в кожному пікселі є R, G і B. Але дві з трьох — обчислена гадка.</text>
