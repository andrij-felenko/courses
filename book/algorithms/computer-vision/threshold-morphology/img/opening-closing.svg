<text x="450.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Спершу поріг ріже кадр на чорне-біле, тоді морфологія прибирає цятки й латає дірки — і маска готова до пошуку об'єктів.</text>
