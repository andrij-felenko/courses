<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ерозія і дилатація: стиснути й розростити</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">структурний елемент ковзає маскою: ерозія стискає біле (геть дрібні цятки), дилатація розростає (латає дірки)</text>
<text x="150" y="116" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">структурний елемент</text>
<rect x="99" y="132" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="116.0" y="154.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="133" y="132" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="150.0" y="154.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="167" y="132" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="184.0" y="154.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="99" y="166" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="116.0" y="188.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="133" y="166" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="150.0" y="188.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="167" y="166" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="184.0" y="188.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="99" y="200" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="116.0" y="222.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="133" y="200" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="150.0" y="222.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="167" y="200" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="184.0" y="222.44" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="150" y="258" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">окіл «сусідства» (3×3)</text>
<text x="560" y="116" font-size="9.4" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ЕРОЗІЯ: біле лишається, лиш якщо ВСІ сусіди білі → стискає, з'їдає цятки</text>
<rect x="330" y="134" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="405" cy="186" r="34" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="346" y="148" width="8" height="8" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="452" y="216" width="7" height="7" rx="8" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="405" y="252" font-size="8.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">до (з цятками)</text>
<line x1="486" y1="186" x2="522" y2="186" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="532" y="134" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="607" cy="186" r="27" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="607" y="252" font-size="8.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">після (менше, чисто)</text>
<text x="560" y="296" font-size="9.4" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ДИЛАТАЦІЯ: біле, якщо ХОЧ ОДИН сусід білий → розростає, латає дірки</text>
<rect x="330" y="314" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="405" cy="366" r="34" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="405" cy="366" r="11" fill="#0f172a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="405" y="432" font-size="8.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">до (з діркою)</text>
<line x1="486" y1="366" x2="522" y2="366" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="532" y="314" width="150" height="104" rx="8" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="607" cy="366" r="41" fill="white" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="607" y="432" font-size="8.3" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">після (більше, цілісно)</text>
<rect x="710" y="150" width="210" height="250" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="815" y="174" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">запам'ятай</text>
<text x="728" y="200" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ерозія — «з'їдає» край</text>
<text x="728" y="222" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  білого: дрібне зникає,</text>
<text x="728" y="244" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  тонке рветься, тіла</text>
<text x="728" y="266" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  роз'єднуються;</text>
<text x="728" y="288" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• дилатація — «нарощує»</text>
<text x="728" y="310" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  край: дірки й щілини</text>
<text x="728" y="332" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  затягуються, тіла</text>
<text x="728" y="354" font-size="9.3" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  зливаються.</text>
</svg>
