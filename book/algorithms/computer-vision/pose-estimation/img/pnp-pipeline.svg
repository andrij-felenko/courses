<rect x="524.0" y="84.0" width="176.0" height="104.0" rx="6" fill="#fbfbfd" stroke="#c0392b" stroke-width="1.8"/><text x="612.0" y="124.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Ґаусс–Ньютон</tspan><tspan x="612.0" dy="15.6">мін. похибки</tspan><tspan x="612.0" dy="15.6">перепроєкції</tspan></text>
