<text x="284.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">↺ багато випадкових трійок</text>
<rect x="24.0" y="232.0" width="812.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/><text x="430.0" y="247.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Мінімальна розв'язка в циклі RANSAC відсіює викиди й дає грубу позу; нелінійне уточнення на всіх inliers доводить її до найменшої піксельної похибки.</tspan></text>
