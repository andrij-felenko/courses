<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Різкість: підкреслити перепади</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ядро різкості підсилює центр і віднімає сусідів (0 −1 0 / −1 5 −1 / 0 −1 0) — підкреслює межі (а заразом і шум)</text>
<text x="150" y="116" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ядро різкості 3×3</text>
<rect x="99" y="134" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="116.0" y="156.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<rect x="133" y="134" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="150.0" y="156.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">-1</text>
<rect x="167" y="134" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="184.0" y="156.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<rect x="99" y="168" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="116.0" y="190.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">-1</text>
<rect x="133" y="168" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="150.0" y="190.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<rect x="167" y="168" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="184.0" y="190.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">-1</text>
<rect x="99" y="202" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="116.0" y="224.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<rect x="133" y="202" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="150.0" y="224.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">-1</text>
<rect x="167" y="202" width="34" height="34" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="184.0" y="224.44" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<text x="150" y="256" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">центр +5, сусіди −1: підсилити те,</text>
<text x="150" y="270" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">чим піксель різниться від околу</text>
<text x="150" y="296" font-size="8.6" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">= оригінал + (оригінал − розмите)</text>
<rect x="380" y="150" width="500" height="210" rx="8" fill="#fbfbfd" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="380" y1="360" x2="880" y2="360" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="380" y1="360" x2="380" y2="150" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="630" y="380" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">положення впоперек межі →</text>
<text x="384" y="146" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">↑ яскравість</text>
<polyline points="390,330 450,328 510,322 560,300 620,250 680,205 740,178 810,170 870,168" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.4" stroke-linejoin="round"/>
<text x="470" y="318" font-size="9.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">м'який перепад</text>
<polyline points="390,332 470,330 540,344 575,300 615,168 650,150 700,178 810,168 870,166" fill="none" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="540" cy="344" r="4" fill="#cc0000" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="540" y="362" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">недоліт</text>
<circle cx="650" cy="150" r="4" fill="#cc0000" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="665" y="142" font-size="9" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">переліт («німб»)</text>
<text x="760" y="200" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">після різкості:</text>
<text x="760" y="214" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">крутіше + німби</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Різкість додає пікселю його ж відмінність від сусідів — тож межі «вистрілюють». Так само підсилюється й шум.</text>
</svg>
