<text x="480" y="312" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ціна згортки — і як її збити</text>
<text x="92" y="336" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• наївно: ядро k×k → k² множень-додавань на КОЖЕН піксель (3×3=9, 5×5=25, 7×7=49), та ще × W×H пікселів;</text>
<text x="92" y="359" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• гаусове ядро РОЗДІЛЮВАНЕ: окремо прохід рядками + прохід стовпцями → 2k замість k² (для 5×5: 10 проти 25);</text>
<text x="92" y="382" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• край кадру: ядро звисає за межу, тож пікселі доповнюють — повторити край / дзеркало / обрізати рамку.</text>
<text x="480.0" y="458" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Згортка — двигун усієї просторової обробки (і нейромереж, 49.7). На МК рятують малі та розділювані ядра.</text>
