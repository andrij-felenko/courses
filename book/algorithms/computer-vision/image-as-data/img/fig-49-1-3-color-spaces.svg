<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Колірні простори: різні способи записати той самий колір</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">RGB — як у сенсора й екрана; HSV — окремо тон/насиченість/яскравість; YUV — яскравість + колірність</text>
<text x="480.0" y="84" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">той самий піксель</text>
<rect x="442" y="92" width="76" height="24" rx="5" fill="rgb(240,140,20)" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="480.0" y="134" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">…записаний трьома способами:</text>
<rect x="70" y="156" width="270" height="208" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="205.0" y="182" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">RGB</text>
<text x="96" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">R</text>
<text x="314" y="210" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">240</text>
<text x="96" y="238" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">G</text>
<text x="314" y="238" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">140</text>
<text x="96" y="266" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">B</text>
<text x="314" y="266" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="bold" font-style="normal">20</text>
<line x1="88" y1="302" x2="322" y2="302" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="90" y="320" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">адитивний; як сенсор і екран.</text>
<text x="90" y="334" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Яскравість «розмазана» по всіх</text>
<text x="90" y="348" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">трьох — погано шукати колір.</text>
<rect x="360" y="156" width="270" height="208" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="495.0" y="182" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">HSV</text>
<text x="386" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">H тон</text>
<text x="604" y="210" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">32°</text>
<text x="386" y="238" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">S насич.</text>
<text x="604" y="238" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">92%</text>
<text x="386" y="266" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">V яскр.</text>
<text x="604" y="266" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="bold" font-style="normal">94%</text>
<line x1="378" y1="302" x2="612" y2="302" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="380" y="320" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">тон ОКРЕМО від яскравості →</text>
<text x="380" y="334" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">знайти колір легко й стійко до</text>
<text x="380" y="348" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">світла. Найкраще для зору!</text>
<rect x="650" y="156" width="270" height="208" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.9"/>
<text x="785.0" y="182" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">YUV / YCbCr</text>
<text x="676" y="210" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Y яскр.</text>
<text x="894" y="210" font-size="11" fill="#d98a00" text-anchor="end" font-weight="bold" font-style="normal">178</text>
<text x="676" y="238" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">U / Cb</text>
<text x="894" y="238" font-size="11" fill="#d98a00" text-anchor="end" font-weight="bold" font-style="normal">−60</text>
<text x="676" y="266" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">V / Cr</text>
<text x="894" y="266" font-size="11" fill="#d98a00" text-anchor="end" font-weight="bold" font-style="normal">+70</text>
<line x1="668" y1="302" x2="902" y2="302" stroke="#e5e7eb" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="670" y="320" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">яскравість окремо від кольору →</text>
<text x="670" y="334" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">відео й JPEG (47.3, 48.2);</text>
<text x="670" y="348" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">око бачить Y докладніше.</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Колір не міняється — міняється ЗАПИС. Обирай простір так, щоб задача стала легкою: HSV для кольору, сіре для форми.</text>
</svg>
