<text x="110.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• «глибина» 8 біт → значення 0…255 на канал; буває 10–12 біт (ширший діапазон).</text>
