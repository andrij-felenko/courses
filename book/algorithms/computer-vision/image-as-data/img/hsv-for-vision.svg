<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому для зору беруть HSV, а не RGB</text>
<rect x="60.0" y="110.0" width="400.0" height="250.0" rx="12" fill="#fef2f2" stroke="#cc0000" stroke-width="1.8"/>
<text x="260.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="700">у RGB — важко</text>
<circle cx="150" cy="196" r="30" fill="rgb(250,150,40)" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="150.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">яскраве світло</text>
<text x="150.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">R250 G150 B40</text>
<circle cx="360" cy="196" r="30" fill="rgb(120,70,18)" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="360.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тьмяне світло</text>
<text x="360.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">R120 G70 B18</text>
<text x="260.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="700">усі три числа поповзли!</text>
<text x="260.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">«помаранчевий» — рухома ціль у 3D,</text>
<text x="260.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">яку важко задати порогом</text>
<rect x="500.0" y="110.0" width="400.0" height="250.0" rx="12" fill="#eafaef" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">у HSV — легко</text>
<circle cx="590" cy="196" r="30" fill="rgb(250,150,40)" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="590.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">яскраве</text>
<text x="590.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">H32° S84 V98</text>
<circle cx="810" cy="196" r="30" fill="rgb(120,70,18)" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="810.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тьмяне</text>
<text x="810.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">H32° S85 V47</text>
<text x="700.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">тон H майже не змінився!</text>
<text x="700.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">«помаранчевий» = смужка тону 20–40°</text>
<text x="700.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ один поріг, стійко до світла</text>
