<text x="700.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">Тому колір шукають у HSV: тон тримається попри світло. RGB→HSV, узяв смужку тону — і ось ціль.</text>
