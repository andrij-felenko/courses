<rect x="246.0" y="116.0" width="44.0" height="34.0" rx="2" fill="#334155" stroke="white" stroke-width="0.8"/><text x="268.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">Y2</text>
<rect x="290.0" y="116.0" width="44.0" height="34.0" rx="2" fill="#1f4ed8" stroke="white" stroke-width="0.8"/><text x="312.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">U2</text>
