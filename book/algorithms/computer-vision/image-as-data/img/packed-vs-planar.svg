<rect x="290.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#cc0000" stroke="white" stroke-width="0.8"/><text x="312.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">V2</text>
<rect x="334.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#1f4ed8" stroke="white" stroke-width="0.8"/><text x="356.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">U3</text>
<rect x="378.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#cc0000" stroke="white" stroke-width="0.8"/><text x="400.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">V3</text>
<text x="436.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">… W·H/2 байтів</text>
<rect x="70.0" y="470.0" width="840.0" height="52.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="490.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Packed: усе впереміш в одному буфері — зручно копіювати. Planar: Y окремо — зручно взяти саму яскравість (сіре) без розбору колірності.</text>
<text x="490.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4:2:2 проріджує колір лише по горизонталі; 4:2:0 — і по горизонталі, і по вертикалі (удвічі менше колірних байтів).</text>
</svg>