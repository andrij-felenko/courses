<rect x="378.0" y="116.0" width="44.0" height="34.0" rx="2" fill="#cc0000" stroke="white" stroke-width="0.8"/><text x="400.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">V2</text>
<line x1="70.0" y1="158.0" x2="246.0" y2="158.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="158.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пікселі 0,1 ділять U0,V0</text>
<line x1="246.0" y1="158.0" x2="422.0" y2="158.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="334.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">пікселі 2,3 ділять U2,V2</text>
<text x="70.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">адреса пікселя x:  base + y·stride + (x &amp; ~1)·2   (крок по 4 байти на пару)</text>
<text x="70.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">NV12 — planar 4:2:0 (дві площини)</text>
<text x="70.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">спершу вся площина Y (W×H), потім напівплощина UV (W×H/2), U/V чергуються</text>
<text x="70.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">площина Y (яскравість, повна роздільність)</text>
