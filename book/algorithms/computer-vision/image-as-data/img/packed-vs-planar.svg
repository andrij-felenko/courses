<rect x="290.0" y="320.0" width="44.0" height="34.0" rx="2" fill="#334155" stroke="white" stroke-width="0.8"/><text x="312.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">Y5</text>
<rect x="334.0" y="320.0" width="44.0" height="34.0" rx="2" fill="#334155" stroke="white" stroke-width="0.8"/><text x="356.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">Y6</text>
<rect x="378.0" y="320.0" width="44.0" height="34.0" rx="2" fill="#334155" stroke="white" stroke-width="0.8"/><text x="400.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">Y7</text>
<text x="436.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">… W·H байтів</text>
<text x="70.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f4ed8" text-anchor="start">напівплощина UV (одна пара на 2×2 блок, чергується)</text>
<rect x="70.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#1f4ed8" stroke="white" stroke-width="0.8"/><text x="92.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">U0</text>
<rect x="114.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#cc0000" stroke="white" stroke-width="0.8"/><text x="136.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">V0</text>
<rect x="158.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#1f4ed8" stroke="white" stroke-width="0.8"/><text x="180.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">U1</text>
<rect x="202.0" y="380.0" width="44.0" height="34.0" rx="2" fill="#cc0000" stroke="white" stroke-width="0.8"/><text x="224.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">V1</text>
