<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пам'ять буфера камери: YUYV (packed) vs NV12 (planar)</text>
<text x="70.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">YUYV — packed 4:2:2 (один потік)</text>
<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2 пікселі = 4 байти; U/V — одні на пару (по горизонталі)</text>
<rect x="70.0" y="116.0" width="44.0" height="34.0" rx="2" fill="#334155" stroke="white" stroke-width="0.8"/><text x="92.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">Y0</text>
<rect x="114.0" y="116.0" width="44.0" height="34.0" rx="2" fill="#1f4ed8" stroke="white" stroke-width="0.8"/><text x="136.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">U0</text>
<rect x="158.0" y="116.0" width="44.0" height="34.0" rx="2" fill="#334155" stroke="white" stroke-width="0.8"/><text x="180.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">Y1</text>
