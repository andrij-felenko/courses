<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Літо 1966-го: «розв'яжемо зір за канікули»</text>
<rect x="80.0" y="110.0" width="300.0" height="180.0" rx="6" fill="#fffef7" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="80" y="110" width="300" height="32" rx="6" fill="#fff5e6"/>
<text x="230.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">MIT · Project MAC · AI Group</text>
<text x="100.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">THE SUMMER VISION PROJECT</text>
<text x="100.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Seymour Papert · 7 липня 1966</text>
<text x="100.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Мета: за літо зробити систему,</text>
<text x="100.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">що поділить кадр на об'єкти</text>
<text x="100.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">й тло — і назве прості тіла.</text>
<text x="100.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Координує Джеральд Сассмен</text>
<text x="100.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">(студент) з гуртом студентів.</text>
<line x1="398.0" y1="200.0" x2="466.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="700">а насправді…</text>
<line x1="500.0" y1="200.0" x2="900.0" y2="200.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="520" cy="200" r="5" fill="#0a8f3c" stroke="#1a1a1a" stroke-width="1"/>
<text x="520.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0a8f3c" text-anchor="middle" font-weight="700">1966</text>
<text x="520.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0a8f3c" text-anchor="middle" font-weight="700">літо</text>
<circle cx="640" cy="200" r="5" fill="#d98a00" stroke="#1a1a1a" stroke-width="1"/>
<text x="640.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="700">1980-ті</text>
<circle cx="770" cy="200" r="5" fill="#d98a00" stroke="#1a1a1a" stroke-width="1"/>
<text x="770.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="700">2010-ті</text>
<circle cx="885" cy="200" r="5" fill="#cc0000" stroke="#1a1a1a" stroke-width="1"/>
<text x="885.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="700">досі</text>
<text x="700.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">те, що думали зробити за літо,</text>
<text x="700.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">будують і досі — це ціла наука</text>
<rect x="80.0" y="320.0" width="800.0" height="92.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому ця історія — на початку розділу про машинне бачення?</text>
<text x="118.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Бо це найвідоміший урок про те, що «очевидне» для людини буває страшенно важким для машини.</text>
<text x="118.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Саме з цього невдалого літа й виріс увесь напрям, ази якого ми пройдемо в цьому розділі.</text>
</svg>