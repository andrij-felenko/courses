<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колірні простори: різні способи записати той самий колір</text>
<text x="480.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">той самий піксель</text>
<rect x="442" y="92" width="76" height="24" rx="5" fill="rgb(240,140,20)" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="480.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">…записаний трьома способами:</text>
<rect x="70.0" y="156.0" width="270.0" height="208.0" rx="12" fill="#f4f6f8" stroke="#1f4ed8" stroke-width="1.9"/>
<text x="205.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="700">RGB</text>
<text x="96.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">R</text>
<text x="314.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="700">240</text>
<text x="96.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">G</text>
<text x="314.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="700">140</text>
<text x="96.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">B</text>
<text x="314.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f4ed8" text-anchor="end" font-weight="700">20</text>
<line x1="88.0" y1="302.0" x2="322.0" y2="302.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="90.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">адитивний; як сенсор і екран.</text>
<text x="90.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Яскравість «розмазана» по всіх</text>
<text x="90.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">трьох — погано шукати колір.</text>
<rect x="360.0" y="156.0" width="270.0" height="208.0" rx="12" fill="#f4f6f8" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="495.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="700">HSV</text>
<text x="386.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">H тон</text>
<text x="604.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="700">32°</text>
<text x="386.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">S насич.</text>
<text x="604.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="700">92%</text>
<text x="386.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">V яскр.</text>
<text x="604.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0a8f3c" text-anchor="end" font-weight="700">94%</text>
<line x1="378.0" y1="302.0" x2="612.0" y2="302.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">тон ОКРЕМО від яскравості →</text>
<text x="380.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">знайти колір легко й стійко до</text>
<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">світла. Найкраще для зору!</text>
<rect x="650.0" y="156.0" width="270.0" height="208.0" rx="12" fill="#f4f6f8" stroke="#d98a00" stroke-width="1.9"/>
<text x="785.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="700">YUV / YCbCr</text>
<text x="676.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Y яскр.</text>
<text x="894.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="end" font-weight="700">178</text>
<text x="676.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">U / Cb</text>
<text x="894.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="end" font-weight="700">−60</text>
<text x="676.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">V / Cr</text>
<text x="894.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="end" font-weight="700">+70</text>
<line x1="668.0" y1="302.0" x2="902.0" y2="302.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="670.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">яскравість окремо від кольору →</text>
<text x="670.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">відео й JPEG;</text>
<text x="670.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">око бачить Y докладніше.</text>
<text x="480.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Колір не міняється — міняється ЗАПИС. Обирай простір так, щоб задача стала легкою: HSV для кольору, сіре для форми.</text>
