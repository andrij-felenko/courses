<text x="480.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожна стрілка тут — окрема велика задача (і кожна стала окремою темою цього розділу).</text>
<text x="480.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Команда думала пройти весь ланцюг за літо. Перша ж ланка — «де об'єкт, а де тло» — виявилась проваллям.</text>
