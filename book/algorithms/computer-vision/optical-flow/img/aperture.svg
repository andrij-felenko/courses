<text x="560.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="700">уздовж краю — невідомо</text>
<rect x="150.0" y="360.0" width="520.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Iₓ·u + Iᵧ·v + Iₜ = 0   —   одне рівняння, два невідомих (u, v)</tspan></text>
