<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві школи оптичного потоку: спільне коріння 1981 → розхід → злиття</text>
<rect x="288.2" y="41.6" width="283.5" height="48.8" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.6"/><text x="430.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">проблема апертури, 1981:</tspan><tspan x="430.0" dy="16.2">одне рівняння в'язі — дві невідомі</tspan></text>
<line x1="390.0" y1="90.4" x2="215.0" y2="174.3" stroke="#6b7280" stroke-width="1.6"/>
<line x1="470.0" y1="90.4" x2="645.0" y2="174.3" stroke="#6b7280" stroke-width="1.6"/>
<rect x="60.0" y="174.3" width="310.0" height="61.4" rx="6" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="194.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Лукас — Канаде (LK)</tspan><tspan x="215.0" dy="15.0">локальне вікно · найменші квадрати</tspan><tspan x="215.0" dy="15.0">розріджено, у надійних кутах</tspan></text>
<rect x="490.0" y="174.3" width="310.0" height="61.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="194.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Горн — Шанк (HS)</tspan><tspan x="645.0" dy="15.0">глобальна гладкість · варіаційно</tspan><tspan x="645.0" dy="15.0">густо, вектор у кожному пікселі</tspan></text>
<text x="215.0" y="257.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">друге рівняння ← сусіди в латці</text>
<text x="645.0" y="257.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">друге рівняння ← штраф за негладкість</text>
<line x1="215.0" y1="269.7" x2="330.0" y2="357.3" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="645.0" y1="269.7" x2="530.0" y2="357.3" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="160.0" y="357.3" width="540.0" height="61.4" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="430.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">злиття (2000-ні): дані як у LK + гладкість як у HS</tspan><tspan x="430.0" dy="15.0">Bruhn 2005: «Lucas/Kanade meets Horn/Schunck»</tspan><tspan x="430.0" dy="15.0">локальна надійність + густе поле в одному функціоналі</tspan></text>
