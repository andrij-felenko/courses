<text x="347.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="347.5" dy="0.0">Марк Фіала, 2004–05</tspan><tspan x="347.5" dy="13.1">(NRC Канади)</tspan><tspan x="347.5" dy="13.1"></tspan><tspan x="347.5" dy="13.1">перше ЦИФРОВЕ кодування:</tspan><tspan x="347.5" dy="13.1">ID як число з контрольними</tspan><tspan x="347.5" dy="13.1">бітами; рамку шукають</tspan><tspan x="347.5" dy="13.1">по краях, не порогом</tspan></text>
<rect x="282.5" y="315.5" width="130.0" height="65.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.3"/><text x="347.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="347.5" dy="0.0">ДОДАВ: строге</tspan><tspan x="347.5" dy="13.0">виправлення помилок;</tspan><tspan x="347.5" dy="13.0">чисельно малий</tspan><tspan x="347.5" dy="13.0">хибний спрацьовок</tspan></text>
