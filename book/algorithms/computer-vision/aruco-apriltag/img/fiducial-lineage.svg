<text x="767.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="767.5" dy="0.0">Гаррідо-Хурадо та ін.,</tspan><tspan x="767.5" dy="13.1">2014 (Ун-т Кордови)</tspan><tspan x="767.5" dy="13.1"></tspan><tspan x="767.5" dy="13.1">словники ГЕНЕРУЮТЬ під</tspan><tspan x="767.5" dy="13.1">замовлення: стільки міток</tspan><tspan x="767.5" dy="13.1">і така завадостійкість,</tspan><tspan x="767.5" dy="13.1">як треба</tspan></text>
