<text x="582.5" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">AprilTag</text>
<text x="582.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">Едвін Олсон, 2011</tspan><tspan x="582.5" dy="13.1">(лаб. APRIL, Мічиган)</tspan><tspan x="582.5" dy="13.1">v2 — Ван і Олсон, 2016</tspan><tspan x="582.5" dy="13.1"></tspan><tspan x="582.5" dy="13.1">наголос на РОБОТОТЕХНІЦІ:</tspan><tspan x="582.5" dy="13.1">ловить далеко, крізь</tspan><tspan x="582.5" dy="13.1">розмиття, перекриття,</tspan><tspan x="582.5" dy="13.1">спотворення об'єктива</tspan></text>
<rect x="520.4" y="315.5" width="124.3" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="582.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">ДОДАВ: дальність</tspan><tspan x="582.5" dy="13.0">і стійкість у полі;</tspan><tspan x="582.5" dy="13.0">відкритий код і</tspan><tspan x="582.5" dy="13.0">набори тегів</tspan></text>
