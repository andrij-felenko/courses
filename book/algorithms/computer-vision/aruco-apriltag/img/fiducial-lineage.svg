<text x="132.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Като й Біллінґгерст, 1999</tspan><tspan x="132.5" dy="13.1">(HIT Lab, Вашингтон)</tspan><tspan x="132.5" dy="13.1"></tspan><tspan x="132.5" dy="13.1">перша масова система:</tspan><tspan x="132.5" dy="13.1">квадратна рамка +</tspan><tspan x="132.5" dy="13.1">зіставлення картинки</tspan><tspan x="132.5" dy="13.1">з бібліотекою (кореляція)</tspan></text>
<rect x="64.7" y="315.5" width="135.7" height="65.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="132.5" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">БЕНТЕЖИЛО: мітки</tspan><tspan x="132.5" dy="13.0">плутались між собою й</tspan><tspan x="132.5" dy="13.0">з фоном; поріг гуляв</tspan><tspan x="132.5" dy="13.0">від світла</tspan></text>
