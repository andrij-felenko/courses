<text x="578.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">← удвічі менше рядків</text>
<rect x="60.0" y="338.0" width="600.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="358.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">YUYV кладе все підряд одним потоком — зручно тягти по одному дроту (USB-камера), піксель</tspan><tspan x="360.0" dy="15.0">дістаєш одразу, але U та V повторюються в кожному парному рядку. NV12 тримає яскравість</tspan><tspan x="360.0" dy="15.0">окремою суцільною площиною (готово для кодека й GPU, часто просто «дивишся» на Y як на</tspan><tspan x="360.0" dy="15.0">сіре зображення), а колір — окремою вдвічі меншою півплощиною. Обидва несуть ті самі</tspan><tspan x="360.0" dy="15.0">числа Y,U,V — різниця лише в порядку й у тому, як часто взято колір.</tspan></text>
