<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що видає нейромережа-детектор: рамки, клас, упевненість</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кадр → навчені згортки (49.3, але ваги вивчені, не рукотворні) → список: рамка + клас + упевненість</text>
<text x="150" y="118" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">вхід: кадр</text>
<rect x="70" y="132" width="160" height="130" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="118" cy="180" r="8" fill="#94a3b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="111" y="190" width="14" height="40" rx="8" fill="#94a3b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="158" y="210" width="50" height="26" rx="8" fill="#64748b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="170" cy="238" r="6" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<circle cx="198" cy="238" r="6" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<line x1="238" y1="197" x2="286" y2="197" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="420" y="118" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">навчені згортки (CNN)</text>
<rect x="300" y="150" width="22" height="104" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="332" y="150" width="22" height="95" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="364" y="150" width="22" height="86" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="396" y="150" width="22" height="77" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="428" y="150" width="22" height="68" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="420" y="272" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ядра ВИВЧЕНІ під час навчання</text>
<text x="420" y="286" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(а не рукотворні, як Собель)</text>
<line x1="470" y1="197" x2="524" y2="197" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="720" y="118" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">вихід: рамки + клас + упевненість</text>
<rect x="560" y="132" width="320" height="130" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="612" cy="182" r="8" fill="#94a3b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="605" y="192" width="14" height="40" rx="8" fill="#94a3b8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="596" y="170" width="40" height="66" rx="8" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2"/>
<text x="616" y="164" font-size="8" fill="#22c55e" text-anchor="middle" font-weight="bold" font-style="normal">людина 0.94</text>
<rect x="720" y="208" width="50" height="26" rx="8" fill="#64748b" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="712" y="200" width="66" height="42" rx="8" fill="none" fill-opacity="1.0" stroke="#d98a00" stroke-width="2"/>
<text x="745" y="194" font-size="8" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">авто 0.88</text>
<rect x="110" y="300" width="740" height="96" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="480" y="324" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Детектор повертає СПИСОК знахідок</text>
<text x="140" y="348" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• де — габаритна рамка; що — клас (людина, авто, …); наскільки певен — упевненість 0…1;</text>
<text x="140" y="369" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• усередині — стос ЗГОРТОК (49.3), але їхні ядра не придумані рукою, а вивчені на прикладах;</text>
<text x="140" y="390" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• поріг упевненості відсікає слабкі здогади (напр., лишити тільки ≥ 0.5).</text>
</svg>
