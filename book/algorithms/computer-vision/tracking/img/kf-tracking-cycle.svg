<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Калман для бокс-трекера: predict ⇄ update</text>
<rect x="188.3" y="84.2" width="123.5" height="67.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">PREDICT</tspan><tspan x="250.0" dy="14.3">x ← F·x</tspan><tspan x="250.0" dy="14.3">P ← F·P·Fᵀ + Q</tspan></text>
<rect x="427.8" y="84.2" width="164.4" height="67.6" rx="6" fill="#e8f3ec" stroke="#27ae60" stroke-width="2.0"/><text x="510.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">UPDATE</tspan><tspan x="510.0" dy="14.3">K = P·Hᵀ(H·P·Hᵀ+R)⁻¹</tspan><tspan x="510.0" dy="14.3">x ← x + K(z − H·x)</tspan></text>
<line x1="313.7" y1="110.0" x2="425.8" y2="110.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">є вимір z (детекція)</text>
<line x1="425.8" y1="126.0" x2="313.7" y2="126.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">наступний кадр</text>
<text x="250.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">невпевненість P росте</text>
<text x="510.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">невпевненість P падає</text>
<rect x="75.8" y="90.0" width="88.4" height="56.0" rx="6" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.4"/><text x="120.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">стан x =</tspan><tspan x="120.0" dy="13.0">[x y vx vy</tspan><tspan x="120.0" dy="13.0"> w h vw vh]ᵀ</tspan></text>
<line x1="176.0" y1="118.0" x2="186.3" y2="118.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="196.0" width="680.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="380.0" y="212.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Калман крутить два кроки. PREDICT зсуває бокс за моделлю руху (F) і роздуває невпевненість P (+ шум Q).</tspan><tspan x="380.0" dy="13.0">UPDATE, коли є детекція z, стягує оцінку до неї, важачи прогноз і вимір за їхньою певністю (K, R).</tspan><tspan x="380.0" dy="13.0">Сліпий кадр — лише predict, і P росте, аж доки ціль не виринула.</tspan></text>
</svg>