<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Втрата й перезахоплення: коли довіряти прогнозу, а коли шукати заново</text>
<text x="105.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ведемо</text>
<rect x="30.0" y="96.0" width="150.0" height="120.0" rx="8" fill="#0f172a" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="297.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="700">збіг слабкий</text>
<rect x="222.0" y="96.0" width="150.0" height="120.0" rx="8" fill="#0f172a" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="489.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">тримаємось на прогнозі</text>
<rect x="414.0" y="96.0" width="150.0" height="120.0" rx="8" fill="#0f172a" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="681.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">перезахопили</text>
<rect x="606.0" y="96.0" width="150.0" height="120.0" rx="8" fill="#0f172a" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="105.0" cy="156.0" r="13.0" fill="#e08a1e" stroke="none" stroke-width="0.0"/>
<rect x="87.0" y="138.0" width="36.0" height="36.0" rx="3" fill="none" stroke="#27ae60" stroke-width="2.2"/>
<rect x="287.0" y="112.0" width="32.0" height="88.0" rx="3" fill="#334155" stroke="none" stroke-width="0.0"/>
<text x="303.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="start">перешкода</text>
<rect x="273" y="132" width="48" height="48" rx="4" fill="none" stroke="#d98a00" stroke-width="2" stroke-dasharray="5,3"/>
<text x="297.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#d98a00" text-anchor="middle" font-weight="700">?</text>
<circle cx="489" cy="156" r="12" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3"/>
<rect x="443" y="116" width="92" height="80" rx="6" fill="none" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="489.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">вікно росте</text>
<circle cx="699.0" cy="164.0" r="13.0" fill="#e08a1e" stroke="none" stroke-width="0.0"/>
<rect x="681.0" y="146.0" width="36.0" height="36.0" rx="3" fill="none" stroke="#27ae60" stroke-width="2.4"/>
<text x="681.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">детектор знайшов</text>
<line x1="182.0" y1="156.0" x2="218.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="374.0" y1="156.0" x2="410.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="566.0" y1="156.0" x2="602.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="40.0" y="250.0" width="740.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Поки збіг певний — ведемо легко. Слабшає — кілька кадрів тримаємось на прогнозі (вікно росте),</tspan><tspan x="410.0" dy="13.0">а як зайшло задалеко — кличемо детектор і перезахоплюємо. Так короткий зрив (перешкода, змаз) не</tspan><tspan x="410.0" dy="13.0">руйнує трек, а довга втрата не лишає його блукати наосліп.</tspan></text>
</svg>