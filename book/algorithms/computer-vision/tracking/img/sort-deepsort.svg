<rect x="623.9" y="259.1" width="97.2" height="37.9" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/><text x="672.5" y="275.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">Hungarian +</tspan><tspan x="672.5" dy="12.3">пам'ять вигляду</tspan></text>
<rect x="40.0" y="352.0" width="740.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="410.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">SORT — це Калман + Hungarian + IoU у двох сотнях рядків. DeepSORT додає лиш одне: пам'ять про ТЕ, ЯК ціль виглядає,</tspan><tspan x="410.0" dy="12.3">тож після довгої оклюзії впізнає її за виглядом і повертає той самий номер — там, де гола IoU вже безсила.</tspan></text>
