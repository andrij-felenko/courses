<rect x="101.6" y="259.1" width="91.8" height="37.9" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/><text x="147.5" y="275.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">Калман:</tspan><tspan x="147.5" dy="12.3">прогноз боксів</tspan></text>
<line x1="195.4" y1="278.0" x2="274.6" y2="278.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="271.2" y="259.1" width="102.6" height="37.9" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="322.5" y="275.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="322.5" dy="0.0">+ ознака вигляду</tspan><tspan x="322.5" dy="12.3">(embedding)</tspan></text>
<line x1="375.8" y1="278.0" x2="444.2" y2="278.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="438.1" y="259.1" width="118.9" height="37.9" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="497.5" y="275.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="497.5" dy="0.0">вартість = відстань</tspan><tspan x="497.5" dy="12.3">вигляду ⊕ IoU</tspan></text>
