<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Спрощення логічного шару за лемою про перемикання Гастада (Switching Lemma)</text>
<rect x="30.0" y="60.0" width="820.0" height="100.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="440.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">До застосування випадкового обмеження ρ ∈ Rₚ:</text>
<rect x="180.3" y="96.2" width="519.3" height="47.6" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="440.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">k-DNF формула f = T₁ ∨ T₂ ∨ ... ∨ Tₘ  (кожен терм Tᵢ має валентність ≤ k)</tspan><tspan x="440.0" dy="15.6">Складний шар гейтів OR над AND з багатьма високовалентними входами</tspan></text>
<line x1="440.0" y1="170.0" x2="440.0" y2="230.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="222.0" y="170.2" width="436.0" height="59.6" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="440.0" y="177.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Випадкове обмеження ρ ∈ Rₚ:</tspan><tspan x="440.0" dy="14.3">Кожна змінна xᵢ зафіксовується в 0 або 1 з імовірністю 1 - p,</tspan><tspan x="440.0" dy="14.3">і залишається вільною з імовірністю p = n^{-1/(d-1)}</tspan></text>
<rect x="30.0" y="240.0" width="820.0" height="150.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="440.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Після застосування обмеження f|ₚ:</text>
<rect x="91.5" y="291.2" width="697.0" height="47.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">З імовірністю ≥ 1 - (5·p·k)ʳ функція f|ₚ еквівалентна Дереву Рішень глибини ≤ r (або r-CNF)</tspan><tspan x="440.0" dy="15.6">Зменшення глибини схемного шару:  d ↦ d - 1  без зростання розміру!</tspan></text>
</svg>