<rect x="581.5" y="168.9" width="177.0" height="82.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Статичні аналізатори</tspan><tspan x="670.0" dy="14.3">(Abstract Interpretation)</tspan><tspan x="670.0" dy="14.3">• Надійні (не пропускають)</tspan><tspan x="670.0" dy="14.3">• Завжди завершуються</tspan><tspan x="670.0" dy="14.3">✗ Є хибні тривоги</tspan></text>
<rect x="161.5" y="168.9" width="177.0" height="82.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Динамічне тестування</tspan><tspan x="250.0" dy="14.3">(Fuzzing / Testing)</tspan><tspan x="250.0" dy="14.3">• Повні (якщо знайшов — є)</tspan><tspan x="250.0" dy="14.3">• Завжди завершуються</tspan><tspan x="250.0" dy="14.3">✗ Можуть пропустити баг</tspan></text>
