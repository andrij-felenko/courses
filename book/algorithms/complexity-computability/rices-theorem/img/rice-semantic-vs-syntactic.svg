<rect x="475.4" y="352.6" width="349.2" height="44.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="371.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">НЕРОЗВ'ЯЗНІ (Теорема Райса) ✗</tspan><tspan x="650.0" dy="16.2">(жоден алгоритм не вирішить для всіх кодів)</tspan></text>
<text x="440.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Вододіл: синтаксис — про те, ЯК написаний код; семантика — про те, ЩО він обчислює.</text>
