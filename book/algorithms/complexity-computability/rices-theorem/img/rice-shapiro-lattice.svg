<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Райса–Шапіро: напіврозв'язність через скінченні підфункції</text>
<rect x="252.7" y="55.0" width="374.6" height="49.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Повна обчислювана функція f ∈ P</tspan><tspan x="440.0" dy="16.9">(нескінченний графік: f(0), f(1), f(2), ...)</tspan></text>
<line x1="440.0" y1="110.0" x2="440.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="197.5" y="167.5" width="485.0" height="65.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Скінченна підфункція θ ⊆ f</tspan><tspan x="440.0" dy="16.2">(визначена лише на скінченній множині точок {x_1, ..., x_k})</tspan><tspan x="440.0" dy="16.2">де θ ТАКОЖ має властивість P (θ ∈ P)</tspan></text>
<line x1="370.0" y1="240.0" x2="270.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="510.0" y1="240.0" x2="610.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="63.1" y="296.8" width="333.7" height="76.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">1. Компактність (Коректність):</tspan><tspan x="230.0" dy="15.0">Якщо f ∈ P, то існує скінченна θ ⊆ f,</tspan><tspan x="230.0" dy="15.0">яка вже гарантує θ ∈ P.</tspan><tspan x="230.0" dy="15.0">(Властивість проявляється за скінченний час)</tspan></text>
<rect x="497.4" y="296.8" width="305.2" height="76.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">2. Монотонність:</tspan><tspan x="650.0" dy="15.0">Якщо скінченна θ ∈ P і θ ⊆ g,</tspan><tspan x="650.0" dy="15.0">то будь-яке її розширення g ТАКОЖ g ∈ P.</tspan><tspan x="650.0" dy="15.0">(Додавання значень не може зруйнувати P)</tspan></text>
<rect x="89.0" y="408.8" width="702.0" height="32.5" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="440.0" y="429.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">I_P є напіврозв'язною (Σ₁)  ⟺  P визначається перелічуваною сім'єю скінченних підфункцій</tspan></text>
</svg>