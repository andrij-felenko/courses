<rect x="213.2" y="78.0" width="74.5" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="287.8" y="78.0" width="149.0" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<text x="160.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">звільнено</text>
<text x="306.4" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Σ = 7</text>
<line x1="436.8" y1="70.0" x2="436.8" y2="174.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="176.0" y="132.0" width="596.0" height="34.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="474.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">запит 16</text>
<text x="160.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">новий блок</text>
<text x="786.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">не влазить</text>
<rect x="176.0" y="184.0" width="596.0" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="474.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="474.0" dy="0.0">звільнено 7 &lt; 16 — новий блок у стару діру не лягає: верхня межа купи тільки росте</tspan></text>
<text x="156.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">коефіцієнт × 1.5   (звільнені блоки 1, 2, 3, 4, 6, 9, 13)</text>
<rect x="176.0" y="304.0" width="15.7" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="191.7" y="304.0" width="31.4" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="223.1" y="304.0" width="47.1" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="270.1" y="304.0" width="62.7" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="332.8" y="304.0" width="94.1" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="426.9" y="304.0" width="141.2" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<rect x="568.1" y="304.0" width="203.9" height="34.0" rx="2" fill="#e3e8ee" stroke="#aab4c0" stroke-width="1.1"/>
<text x="160.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">звільнено</text>
<text x="474.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Σ = 38</text>
<line x1="772.0" y1="296.0" x2="772.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="176.0" y="358.0" width="439.2" height="34.0" rx="2" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="395.6" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">запит 28</text>
<text x="160.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">новий блок</text>
<text x="786.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">влазить у діру</text>
<rect x="176.0" y="410.0" width="596.0" height="28.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="474.0" y="427.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="474.0" dy="0.0">звільнено 38 ≥ 28 — новий блок лягає у стару діру: пам'ять перевикористано, купа не росте</tspan></text>
<rect x="56.0" y="500.0" width="788.0" height="44.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="450.0" y="524.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">поріг — золотий переріз φ = (1+√5)/2 ≈ 1.618.  Коеф. ≤ φ → звільнене доганяє наступний запит (перевикористання); коеф. &gt; φ (як 2) → ніколи. Живий блок, з якого копіюємо, у діру не рахується — тому межа саме φ, а не 2.</tspan></text>
</svg>