<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три відповіді на «скільки коштує операція»</text>
<rect x="180.0" y="62.0" width="246.0" height="58.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="303.0" y="86.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="303.0" dy="0.0">Найгірший</tspan><tspan x="303.0" dy="18.2">на операцію</tspan></text>
<rect x="432.0" y="62.0" width="246.0" height="58.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="555.0" y="86.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Середній</tspan><tspan x="555.0" dy="18.2">випадок</tspan></text>
<rect x="684.0" y="62.0" width="254.0" height="58.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="811.0" y="95.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="811.0" dy="0.0">Амортизований</tspan></text>
<rect x="22.0" y="132.0" width="150.0" height="84.0" rx="6" fill="#f7f9fb" stroke="#dfe4ea" stroke-width="1.5"/><text x="97.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="97.0" dy="0.0">усереднює</tspan><tspan x="97.0" dy="15.6">по…</tspan></text>
<rect x="180.0" y="132.0" width="246.0" height="84.0" rx="6" fill="#eef2f8" stroke="#cdd6e0" stroke-width="1.5"/><text x="303.0" y="162.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="303.0" dy="0.0">нічого:</tspan><tspan x="303.0" dy="16.2">максимум однієї</tspan><tspan x="303.0" dy="16.2">операції</tspan></text>
<rect x="432.0" y="132.0" width="246.0" height="84.0" rx="6" fill="#eef2f8" stroke="#cdd6e0" stroke-width="1.5"/><text x="555.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">розподілу входів</tspan><tspan x="555.0" dy="16.2">(є ймовірність)</tspan></text>
<rect x="684.0" y="132.0" width="254.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="811.0" y="162.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="811.0" dy="0.0">операціях однієї</tspan><tspan x="811.0" dy="16.2">найгіршої</tspan><tspan x="811.0" dy="16.2">послідовності</tspan></text>
<rect x="22.0" y="226.0" width="150.0" height="84.0" rx="6" fill="#f7f9fb" stroke="#dfe4ea" stroke-width="1.5"/><text x="97.0" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="97.0" dy="0.0">межа для</tspan><tspan x="97.0" dy="15.6">масиву</tspan></text>
<rect x="180.0" y="226.0" width="246.0" height="84.0" rx="6" fill="#eef2f8" stroke="#cdd6e0" stroke-width="1.5"/><text x="303.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="303.0" dy="0.0">O(n) на додаток</tspan><tspan x="303.0" dy="16.2">→ O(n²) на n</tspan></text>
<rect x="432.0" y="226.0" width="246.0" height="84.0" rx="6" fill="#f2f4f7" stroke="#cdd6e0" stroke-width="1.5"/><text x="555.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="555.0" dy="0.0">— (не про це)</tspan></text>
<rect x="684.0" y="226.0" width="254.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="811.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="811.0" dy="0.0">O(1) на додаток</tspan><tspan x="811.0" dy="16.2">→ O(n) на n</tspan></text>
<rect x="22.0" y="320.0" width="150.0" height="84.0" rx="6" fill="#f7f9fb" stroke="#dfe4ea" stroke-width="1.5"/><text x="97.0" y="358.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="97.0" dy="0.0">зловмисник</tspan><tspan x="97.0" dy="15.6">зламає?</tspan></text>
<rect x="180.0" y="320.0" width="246.0" height="84.0" rx="6" fill="#eef2f8" stroke="#cdd6e0" stroke-width="1.5"/><text x="303.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="303.0" dy="0.0">ні, та надто</tspan><tspan x="303.0" dy="16.2">песимістично</tspan></text>
<rect x="432.0" y="320.0" width="246.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">ТАК: лихі дані</tspan><tspan x="555.0" dy="16.2">валять оцінку</tspan></text>
<rect x="684.0" y="320.0" width="254.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="811.0" y="358.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="811.0" dy="0.0">НІ: тримається</tspan><tspan x="811.0" dy="16.2">для кожного входу</tspan></text>
<rect x="22.0" y="414.0" width="150.0" height="84.0" rx="6" fill="#f7f9fb" stroke="#dfe4ea" stroke-width="1.5"/><text x="97.0" y="452.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="97.0" dy="0.0">тип</tspan><tspan x="97.0" dy="15.6">обіцянки</tspan></text>
<rect x="180.0" y="414.0" width="246.0" height="84.0" rx="6" fill="#eef2f8" stroke="#cdd6e0" stroke-width="1.5"/><text x="303.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="303.0" dy="0.0">гарантія,</tspan><tspan x="303.0" dy="16.2">але слабка</tspan></text>
<rect x="432.0" y="414.0" width="246.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">ставка на</tspan><tspan x="555.0" dy="16.2">ймовірність</tspan></text>
<rect x="684.0" y="414.0" width="254.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="811.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="811.0" dy="0.0">детермінована</tspan><tspan x="811.0" dy="16.2">гарантія, тісна</tspan></text>
<rect x="22.0" y="512.0" width="916.0" height="34.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="480.0" y="533.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">обидва кажуть «в середньому», та амортизований — про найгіршу послідовність без ймовірності, а не про типовий вхід</tspan></text>
</svg>