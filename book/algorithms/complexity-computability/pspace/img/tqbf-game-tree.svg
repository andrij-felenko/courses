<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="420.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево гри TQBF: ∃x₁ ∀x₂ ∃x₃ ... (Оцінка в поліномній пам'яті)</text>
<rect x="339.9" y="58.2" width="180.2" height="43.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="430.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Гравець ∃ (x₁)</tspan><tspan x="430.0" dy="15.6">Обирає гілку з TRUE (OR)</tspan></text>
<rect x="155.0" y="151.3" width="170.0" height="37.3" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="240.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Гравець ∀ (x₂=0)</tspan><tspan x="240.0" dy="14.3">Мусить дати TRUE (AND)</tspan></text>
<rect x="535.0" y="151.3" width="170.0" height="37.3" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="620.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Гравець ∀ (x₂=1)</tspan><tspan x="620.0" dy="14.3">Мусить дати TRUE (AND)</tspan></text>
<line x1="370.0" y1="105.0" x2="270.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x₁ = 0</text>
<line x1="490.0" y1="105.0" x2="590.0" y2="145.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">x₁ = 1</text>
<rect x="95.0" y="248.5" width="110.0" height="23.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="263.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">x₃=0: TRUE</tspan></text>
<rect x="275.0" y="248.5" width="110.0" height="23.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="330.0" y="263.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">x₃=1: FALSE</tspan></text>
<rect x="475.0" y="248.5" width="110.0" height="23.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="530.0" y="263.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">x₃=0: FALSE</tspan></text>
<rect x="655.0" y="248.5" width="110.0" height="23.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="710.0" y="263.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">x₃=1: TRUE</tspan></text>
<line x1="210.0" y1="195.0" x2="170.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270.0" y1="195.0" x2="310.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="195.0" x2="550.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="650.0" y1="195.0" x2="690.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="780.0" height="90.0" rx="8" fill="#eef2ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="430.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="700">Чому це потребує лише поліномної пам'яті O(n):</text>
<text x="430.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Пошук у глибину (DFS) зберігає в пам'яті лише один поточний шлях від кореня до листка.</text>
<text x="430.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Глибина дерева = n змінних → Пам'ять O(n), хоча кількість листків = 2ⁿ (час O(2ⁿ)).</text>
</svg>