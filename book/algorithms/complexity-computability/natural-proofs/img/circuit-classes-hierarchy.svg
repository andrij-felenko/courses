<text x="480.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">P/poly (Схеми поліноміального розміру) — Мета: довести NP ⊈ P/poly</text>
