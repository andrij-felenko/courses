<text x="480.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Натуральні доведення ПРАЦЮЮТЬ тут, бо AC⁰ та AC⁰[p] не здатні обчислити PRG!</text>
