<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт Разборова–Рудіча: Натуральна властивість ламає PRG</text>
<rect x="10.0" y="10.0" width="940.0" height="460.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="40.0" y="80.0" width="260.0" height="170.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.0"/>
<text x="170.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Псевдовипадковий генератор G</text>
<text x="170.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Коротке зерно s (nᵉ біт)</text>
<line x1="55.0" y1="145.0" x2="285.0" y2="145.0" stroke="#dc2626" stroke-width="1.0"/>
<rect x="55.0" y="155.0" width="230.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="178.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Генерує псевдовипадкову</tspan><tspan x="170.0" dy="15.6">функцію f_G з коротким кодом.</tspan><tspan x="170.0" dy="15.6">Складність f_G &lt; S(n).</tspan><tspan x="170.0" dy="15.6">Отже: f_G ∉ Cₙ (за корисністю)!</tspan></text>
<rect x="660.0" y="80.0" width="260.0" height="170.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2.0"/>
<text x="790.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="700">Справжній хаос R ∈ Fₙ</text>
<text x="790.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Випадкова таблиця 2ⁿ біт</text>
<line x1="675.0" y1="145.0" x2="905.0" y2="145.0" stroke="#059669" stroke-width="1.0"/>
<rect x="675.0" y="155.0" width="230.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="178.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Справді випадкова функція R</tspan><tspan x="790.0" dy="15.6">має високу складність.</tspan><tspan x="790.0" dy="15.6">За умовою великості:</tspan><tspan x="790.0" dy="15.6">Pr[ R ∈ Cₙ ] ≥ 1 / poly(n).</tspan></text>
<rect x="330.0" y="280.0" width="300.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="480.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Розрізнювач D(f) на базі Cₙ</text>
<text x="480.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Час роботи poly(2ⁿ) — Конструктивність</text>
<line x1="345.0" y1="338.0" x2="615.0" y2="338.0" stroke="#2563eb" stroke-width="1.0"/>
<rect x="345.0" y="345.0" width="270.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">D(f) = 1, якщо f ∈ Cₙ</tspan><tspan x="480.0" dy="15.6">D(f) = 0, якщо f ∉ Cₙ</tspan><tspan x="480.0" dy="15.6">• D(f_G) = 0 завжди!</tspan><tspan x="480.0" dy="15.6">• D(R) = 1 з ймовірністю ≥ 1/poly(n)</tspan></text>
<line x1="170.0" y1="250.0" x2="370.0" y2="280.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">f_G</text>
<line x1="790.0" y1="250.0" x2="590.0" y2="280.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="710.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">R</text>
</svg>