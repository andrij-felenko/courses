<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три складові натуральної властивості Cₙ ⊆ Fₙ проти схем S(n)</text>
<rect x="10.0" y="10.0" width="940.0" height="400.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="40.0" y="70.0" width="280.0" height="260.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="180.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">1. Конструктивність</text>
<text x="180.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(Constructiveness)</text>
<line x1="55.0" y1="138.0" x2="305.0" y2="138.0" stroke="#2563eb" stroke-width="1.0"/>
<rect x="55.0" y="150.0" width="250.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Перевірка належності f ∈ Cₙ</tspan><tspan x="180.0" dy="16.9">виконується ефективно:</tspan><tspan x="180.0" dy="16.9">алгоритм з урахуванням</tspan><tspan x="180.0" dy="16.9">таблиці істинності 2ⁿ біт</tspan><tspan x="180.0" dy="16.9">працює за поліноміальний</tspan><tspan x="180.0" dy="16.9">час poly(2ⁿ) = 2⁰⁽ⁿ⁾.</tspan></text>
<rect x="340.0" y="70.0" width="280.0" height="260.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2.0"/>
<text x="480.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#059669" text-anchor="middle" font-weight="700">2. Великість</text>
<text x="480.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(Largeness)</text>
<line x1="355.0" y1="138.0" x2="605.0" y2="138.0" stroke="#059669" stroke-width="1.0"/>
<rect x="355.0" y="150.0" width="250.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Властивість Cₙ притаманна</tspan><tspan x="480.0" dy="16.9">великій частці функцій:</tspan><tspan x="480.0" dy="16.9">випадкова функція R ∈ Fₙ</tspan><tspan x="480.0" dy="16.9">задовольняє Cₙ з ймовірністю</tspan><tspan x="480.0" dy="16.9">Pr[R ∈ Cₙ] ≥ 1 / poly(n)</tspan><tspan x="480.0" dy="16.9">(або ≥ 2⁻ᶜⁿ).</tspan></text>
<rect x="640.0" y="70.0" width="280.0" height="260.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<text x="780.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700">3. Корисність</text>
<text x="780.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(Usefulness)</text>
<line x1="655.0" y1="138.0" x2="905.0" y2="138.0" stroke="#d97706" stroke-width="1.0"/>
<rect x="655.0" y="150.0" width="250.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Кожна функція f ∈ Cₙ</tspan><tspan x="780.0" dy="16.9">вимагає великої складності:</tspan><tspan x="780.0" dy="16.9">CircuitSize(f) &gt; S(n).</tspan><tspan x="780.0" dy="16.9">Якщо f ∈ Cₙ, її не можна</tspan><tspan x="780.0" dy="16.9">обчислити схемою розміру</tspan><tspan x="780.0" dy="16.9">меншого за S(n).</tspan></text>
<rect x="149.6" y="350.5" width="660.8" height="29.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="480.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Висновок: Натуральне доведення будує критерій Cₙ для доведення складності &gt; S(n)</tspan></text>
</svg>