<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="990" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="495.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обернене питання: скільки треба, щоб вистачило на k кроків</text>
<rect x="24.0" y="56.0" width="420.0" height="452.0" rx="10" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="234.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будуємо найдешевший прогін НАЗАД</text>
<rect x="74.0" y="442.0" width="132.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">дно: v = 0</tspan></text>
<rect x="74.0" y="372.0" width="132.0" height="40.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="396.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">W(1)</tspan></text>
<rect x="74.0" y="302.0" width="132.0" height="40.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">W(2)</tspan></text>
<rect x="74.0" y="232.0" width="132.0" height="40.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="256.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">W(3)</tspan></text>
<rect x="74.0" y="162.0" width="132.0" height="40.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="186.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">W(4)</tspan></text>
<line x1="240.0" y1="470.0" x2="240.0" y2="176.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="256.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">кожна сходинка —</text>
<text x="256.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">найдешевший крок назад</text>
<text x="256.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">W(k) — найменший старт,</text>
<text x="256.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">з якого ще можливо k кроків</text>
<rect x="464.0" y="56.0" width="502.0" height="452.0" rx="10" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="715.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий механізм — три різні межі</text>
<text x="554.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">закон спуску</text>
<text x="706.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">драбина W(k)</text>
<text x="870.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">межа на кроки</text>
<rect x="478.0" y="140.0" width="152.0" height="66.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="554.0" y="169.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="554.0" dy="0.0">лічильник</tspan><tspan x="554.0" dy="15.6">v′ = v − 1</tspan></text>
<rect x="638.0" y="140.0" width="136.0" height="66.0" rx="6" fill="#ffffff" stroke="#c2cad4" stroke-width="1.5"/><text x="706.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="706.0" dy="0.0">W(k) = k</tspan></text>
<rect x="786.0" y="140.0" width="168.0" height="66.0" rx="6" fill="#ffffff" stroke="#c2cad4" stroke-width="1.5"/><text x="870.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">k ≤ v₀</tspan></text>
<line x1="777.0" y1="173.0" x2="781.0" y2="173.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="478.0" y="240.0" width="152.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="554.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="554.0" dy="0.0">двійковий пошук</tspan><tspan x="554.0" dy="15.6">v′ ≤ ⌊v/2⌋</tspan></text>
<rect x="638.0" y="240.0" width="136.0" height="66.0" rx="6" fill="#ffffff" stroke="#c2cad4" stroke-width="1.5"/><text x="706.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="706.0" dy="0.0">W(k) = 2ᵏ⁻¹</tspan></text>
<rect x="786.0" y="240.0" width="168.0" height="66.0" rx="6" fill="#ffffff" stroke="#c2cad4" stroke-width="1.5"/><text x="870.0" y="277.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">k ≤ ⌊log₂ v₀⌋ + 1</tspan></text>
<line x1="777.0" y1="273.0" x2="781.0" y2="273.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="478.0" y="340.0" width="152.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="554.0" y="369.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="554.0" dy="0.0">Евклід</tspan><tspan x="554.0" dy="15.6">b′ = a mod b</tspan></text>
<rect x="638.0" y="340.0" width="136.0" height="66.0" rx="6" fill="#ffffff" stroke="#c2cad4" stroke-width="1.5"/><text x="706.0" y="377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="706.0" dy="0.0">W(k) = Fₖ₊₁</tspan></text>
<rect x="786.0" y="340.0" width="168.0" height="66.0" rx="6" fill="#ffffff" stroke="#c2cad4" stroke-width="1.5"/><text x="870.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">k ≤ logφ(√5·b₀) − 1</tspan></text>
<line x1="777.0" y1="373.0" x2="781.0" y2="373.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="715.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">W росте — тож межа на кроки це просто ОБЕРНЕНА до W</text>
<text x="715.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лінійна W → лінійна межа · подвоєння → логарифм · Фібоначчі → логарифм за φ</text>
<rect x="24.0" y="520.0" width="942.0" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="540.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">v₀ &lt; W(k)  ⟹  кроків менше за k.   Не «як швидко падає», а «на скільки вистачить»</tspan></text>
</svg>