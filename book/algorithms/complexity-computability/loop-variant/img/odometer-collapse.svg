<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="950" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="475.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Згортка одометра: пара стає одним числом</text>
<rect x="356.6" y="51.0" width="236.8" height="46.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="475.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">N = (r + 1)·x + y</tspan></text>
<text x="475.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">r — на скільки щонайбільше підскакує y за крок, що з'їдає одиницю x</text>
<rect x="60.0" y="146.0" width="390.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">y падає, x стоїть</tspan><tspan x="255.0" dy="16.9">ΔN ≤ −1</tspan></text>
<rect x="500.0" y="146.0" width="390.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="695.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">x падає на 1, y підскакує на ≤ r</tspan><tspan x="695.0" dy="16.9">ΔN ≤ −(r + 1) + r = −1</tspan></text>
<text x="475.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">обидві гілки — крок униз щонайменше на 1, тож N це звичайний варіант у ℕ</text>
<text x="475.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сортувальна станція, n токенів — уся якість межі сидить у вазі:</text>
<rect x="60.0" y="330.0" width="390.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="367.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">доливу не знаємо → беремо найгірший</tspan><tspan x="255.0" dy="16.9">r = n:   N ≤ (n + 1)·n</tspan><tspan x="255.0" dy="16.9">КВАДРАТ</tspan></text>
<rect x="500.0" y="330.0" width="390.0" height="100.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="367.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">читання кладе на стек ≤ 1 → r = 1</tspan><tspan x="695.0" dy="16.9">N ≤ 2n</tspan><tspan x="695.0" dy="16.9">ЛІНІЯ</tspan></text>
<line x1="450.0" y1="380.0" x2="496.0" y2="380.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="456.0" width="830.0" height="34.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="475.0" y="477.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">вага r замість r+1 — і спуск ламається:  (3, 0) → (2, 1) дає  1·3+0 = 3 → 1·2+1 = 3</tspan></text>
<text x="475.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">словниковий варіант доводить ЗУПИНКУ; вагу підбираєш, щоб дістати МЕЖУ</text>
</svg>