<text x="660.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Ребра B(2, 2) стають вершинами в B(2, 3)</text>
<rect x="531.9" y="143.5" width="36.1" height="33.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="550.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">00</tspan></text>
