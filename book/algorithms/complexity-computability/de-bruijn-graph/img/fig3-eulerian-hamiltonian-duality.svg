<rect x="95.9" y="265.2" width="258.3" height="59.6" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Задача: Знайти Ейлерів цикл</tspan><tspan x="225.0" dy="14.3">(пройти кожне з 4-х ребер по 1 разу).</tspan><tspan x="225.0" dy="14.3">Обчислювально ПРОСТО: O(|E|) = O(kⁿ⁻¹)</tspan></text>
