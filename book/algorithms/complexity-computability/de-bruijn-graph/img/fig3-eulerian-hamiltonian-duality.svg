<rect x="515.2" y="273.1" width="289.6" height="73.9" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="660.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Задача: Знайти Гамільтонів цикл</tspan><tspan x="660.0" dy="14.3">(пройти кожну з 4-х вершин по 1 разу).</tspan><tspan x="660.0" dy="14.3">NP-повна у загальному випадку, але завдяки</tspan><tspan x="660.0" dy="14.3">двоїстісті з B(2,2) розв'язується за O(kⁿ)!</tspan></text>
