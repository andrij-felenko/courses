<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="440.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Схема рекурсивного доведення Ердеша — Секереша: R(r, s) ≤ R(r-1, s) + R(r, s-1)</text>
<circle cx="440.0" cy="80.0" r="22.0" fill="#fff6e5" stroke="#e08a1e" stroke-width="3.0"/>
<text x="440.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">v</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">Довільна вершина в Kₙ (де n = R(r-1, s) + R(r, s-1))</text>
<rect x="60.0" y="190.0" width="340.0" height="200.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.0"/>
<text x="230.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Множина червоних сусідів V_R</text>
<text x="230.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">|V_R| ≥ R(r-1, s)</text>
<rect x="126.0" y="268.8" width="208.1" height="102.5" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="230.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">За визначенням числа Рамсея:</tspan><tspan x="230.0" dy="14.3">V_R містить або:</tspan><tspan x="230.0" dy="14.3">• Червоний K_{r-1} → разом з v</tspan><tspan x="230.0" dy="14.3">  утворює Червоний K_r!</tspan><tspan x="230.0" dy="14.3">• Синій K_s → вже є шуканим</tspan><tspan x="230.0" dy="14.3">  синім графом!</tspan></text>
<rect x="480.0" y="190.0" width="340.0" height="200.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="2.0"/>
<text x="650.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Множина синіх сусідів V_B</text>
<text x="650.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">|V_B| ≥ R(r, s-1)</text>
<rect x="546.0" y="268.8" width="208.1" height="102.5" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="650.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">За визначенням числа Рамсея:</tspan><tspan x="650.0" dy="14.3">V_B містить або:</tspan><tspan x="650.0" dy="14.3">• Червоний K_r → вже є шуканим</tspan><tspan x="650.0" dy="14.3">  червоним графом!</tspan><tspan x="650.0" dy="14.3">• Синій K_{s-1} → разом з v</tspan><tspan x="650.0" dy="14.3">  утворює Синій K_s!</tspan></text>
<line x1="425.0" y1="95.0" x2="230.0" y2="190.0" stroke="#dc2626" stroke-width="3.0"/>
<text x="300.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Червоні ребра</text>
<line x1="455.0" y1="95.0" x2="650.0" y2="190.0" stroke="#2563eb" stroke-width="3.0"/>
<text x="560.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Сині ребра</text>
<text x="440.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Принцип Діріхле: n - 1 = |V_R| + |V_B| ≥ R(r-1, s) + R(r, s-1) - 1</text>
</svg>