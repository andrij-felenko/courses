<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 665" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="665" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина шкал: де множення законне, а де ні</text>
<text x="150.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Шкала</text>
<text x="375.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Що справді фіксує</text>
<text x="660.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Допустиме перетворення</text>
<text x="970.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Що на ній законно рахувати</text>
<line x1="50.0" y1="76.0" x2="1120.0" y2="76.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="50.0" y="92.0" width="1070.0" height="108.0" rx="8" fill="#effaf7" stroke="#0f766e" stroke-width="2.0"/>
<line x1="250.0" y1="100.0" x2="250.0" y2="192.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="500.0" y1="100.0" x2="500.0" y2="192.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="820.0" y1="100.0" x2="820.0" y2="192.0" stroke="#d8dde3" stroke-width="1.0"/>
<text x="150.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="700">Відношень</text>
<text x="375.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="375.0" dy="0.0">рівність відношень;</tspan><tspan x="375.0" dy="15.6">є справжній нуль</tspan></text>
<text x="660.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">φ(x) = a·x,  a &gt; 0</tspan></text>
<text x="970.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="970.0" dy="0.0">усе: + − × ÷,</tspan><tspan x="970.0" dy="15.6">середнє, «удвічі більше»</tspan></text>
<rect x="50.0" y="212.0" width="1070.0" height="108.0" rx="8" fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.1"/>
<line x1="250.0" y1="220.0" x2="250.0" y2="312.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="500.0" y1="220.0" x2="500.0" y2="312.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="820.0" y1="220.0" x2="820.0" y2="312.0" stroke="#d8dde3" stroke-width="1.0"/>
<text x="150.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтервальна</text>
<text x="375.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="375.0" dy="0.0">рівність різниць;</tspan><tspan x="375.0" dy="15.6">нуль умовний</tspan></text>
<text x="660.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">φ(x) = a·x + b</tspan></text>
<text x="970.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="970.0" dy="0.0">різниці, середнє;</tspan><tspan x="970.0" dy="15.6">× вже НЕ має сенсу</tspan></text>
<rect x="50.0" y="332.0" width="1070.0" height="108.0" rx="8" fill="#f7f4ff" stroke="#7c3aed" stroke-width="2.0"/>
<line x1="250.0" y1="340.0" x2="250.0" y2="432.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="500.0" y1="340.0" x2="500.0" y2="432.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="820.0" y1="340.0" x2="820.0" y2="432.0" stroke="#d8dde3" stroke-width="1.0"/>
<text x="150.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700">Порядкова</text>
<text x="375.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="375.0" dy="0.0">лише порядок:</tspan><tspan x="375.0" dy="15.6">більше / менше</tspan></text>
<text x="660.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">будь-яка зростна φ</tspan></text>
<text x="970.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="970.0" dy="0.0">медіана, ранги;</tspan><tspan x="970.0" dy="15.6">ані +, ані ×</tspan></text>
<rect x="50.0" y="452.0" width="1070.0" height="108.0" rx="8" fill="#f4f6f8" stroke="#d8dde3" stroke-width="1.1"/>
<line x1="250.0" y1="460.0" x2="250.0" y2="552.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="500.0" y1="460.0" x2="500.0" y2="552.0" stroke="#d8dde3" stroke-width="1.0"/>
<line x1="820.0" y1="460.0" x2="820.0" y2="552.0" stroke="#d8dde3" stroke-width="1.0"/>
<text x="150.0" y="511.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">Називна</text>
<text x="375.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="375.0" dy="0.0">лише тотожність:</tspan><tspan x="375.0" dy="15.6">те саме / інше</tspan></text>
<text x="660.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">будь-яка взаємно</tspan><tspan x="660.0" dy="16.2">однозначна φ</tspan></text>
<text x="970.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="970.0" dy="0.0">тільки «скільки штук»</tspan></text>
<line x1="1146.0" y1="146.0" x2="1162.0" y2="146.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="1162.0" y1="146.0" x2="1162.0" y2="386.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="1146.0" y1="386.0" x2="1162.0" y2="386.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="1154.0" y1="380.0" x2="1154.0" y2="152.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="585.0" y="598.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">S, O, D живуть на ПОРЯДКОВІЙ шкалі — фіолетовий рядок. Множення стає законним аж на шкалі ВІДНОШЕНЬ — зеленій.</tspan><tspan x="585.0" dy="19.5">RPN = S · O · D мовчки перестрибує два щаблі, яких ранги не заслужили: щоб множити, треба знати «у скільки разів»,</tspan><tspan x="585.0" dy="19.5">а ранг знає лише «більше чи менше».</tspan></text>
</svg>