<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві черги на тих самих даних: добуток проти таблиці</text>
<text x="305.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="700">черга за голим RPN</text>
<text x="875.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">черга за пріоритетом дій</text>
<rect x="70.0" y="110.0" width="470.0" height="92.0" rx="8" fill="#fdf3e2" stroke="#b7791f" stroke-width="1.8"/>
<circle cx="100.0" cy="156.0" r="17.0" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/>
<text x="100.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="700">1</text>
<text x="130.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">показано стару ціну з кешу</text>
<text x="130.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">S=4  O=6  D=10</text>
<text x="524.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="end" font-weight="700">RPN 240</text>
<rect x="70.0" y="224.0" width="470.0" height="92.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="100.0" cy="270.0" r="17.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="100.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">2</text>
<text x="130.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">суму списано двічі</text>
<text x="130.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">S=9  O=2  D=8</text>
<text x="524.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="end" font-weight="700">RPN 144</text>
<rect x="70.0" y="338.0" width="470.0" height="92.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="100.0" cy="384.0" r="17.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="100.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">3</text>
<text x="130.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">відповідь не прийшла за таймаут</text>
<text x="130.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">S=6  O=5  D=3</text>
<text x="524.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="700">RPN 90</text>
<rect x="640.0" y="110.0" width="470.0" height="92.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="670.0" cy="156.0" r="17.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="670.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<text x="700.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">суму списано двічі</text>
<text x="700.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тяжкість 9: довіра, повернення</text>
<text x="1094.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="end" font-weight="700">AP  H</text>
<rect x="640.0" y="224.0" width="470.0" height="92.0" rx="8" fill="#fdf3e2" stroke="#b7791f" stroke-width="1.8"/>
<circle cx="670.0" cy="270.0" r="17.0" fill="#ffffff" stroke="#b7791f" stroke-width="1.8"/>
<text x="670.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="700">2</text>
<text x="700.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">показано стару ціну з кешу</text>
<text x="700.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тяжкість 4: втрата маржі</text>
<text x="1094.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="end" font-weight="700">AP  M</text>
<rect x="640.0" y="338.0" width="470.0" height="92.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="670.0" cy="384.0" r="17.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="670.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">3</text>
<text x="700.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">відповідь не прийшла за таймаут</text>
<text x="700.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тяжкість 6: продаж утрачено</text>
<text x="1094.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="700">AP  L</text>
<line x1="548.0" y1="156.0" x2="630.0" y2="270.0" stroke="#b7791f" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="548.0" y1="270.0" x2="630.0" y2="156.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="548.0" y1="384.0" x2="630.0" y2="384.0" stroke="#c9ced6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="590.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Ті самі три рядки, два різні впорядкування. Ліворуч добуток підняв «застарілу ціну» нагору: вона часта (O=6) і зовсім невидима (D=10),</tspan><tspan x="590.0" dy="18.8">і 4·6·10 = 240 перебиває 9·2·8 = 144. Праворуч пошук у таблиці бачить тяжкість 9 і ставить «подвійне списання» першим — незалежно від того,</tspan><tspan x="590.0" dy="18.8">яке там рідкісне (O=2) і як погано ловиться. Перші два місця міняються, і саме ця заміна — уся користь інструмента.</tspan><tspan x="590.0" dy="18.8">Третій рядок не зрушив: за обома правилами він останній, тільки RPN каже «90», а таблиця каже прямо — «дій не вимагаємо».</tspan></text>
</svg>