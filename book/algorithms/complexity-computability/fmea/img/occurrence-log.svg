<text x="530.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Той самий крок «+2» на шкалі рангів означає ×100 внизу і ×5 угорі — розбіжність у 20 разів. Отже ранг O — навіть не інтервальна шкала:</tspan><tspan x="530.0" dy="18.8">рівні відрізки на ній НЕ дорівнюють рівним відрізкам у реальності. Числа взято з власної таблиці стандарту, де O=2 — це «1 на мільйон», а O=10 — «1 на 10».</tspan><tspan x="530.0" dy="18.8">Вісім кроків рангу вкривають п'ять порядків величини — тому «O» ближче до логарифма частоти, ніж до самої частоти.</tspan></text>
