<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">RPN=60 однаково сумісний із S=1 і S=10</text>
<circle cx="190.0" cy="240.0" r="66.0" fill="#f7f4ff" stroke="#7c3aed" stroke-width="2.4"/>
<text x="190.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">RPN</text>
<text x="190.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#7c3aed" text-anchor="middle" font-weight="700">60</text>
<text x="190.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">24 різні трійки</text>
<text x="190.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дають це саме число</text>
<rect x="420.0" y="78.0" width="640.0" height="68.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="260.0" y1="240.0" x2="412.0" y2="112.0" stroke="#c9ced6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="436.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">S=10</text>
<text x="436.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">O=6  D=1</text>
<text x="526.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">шкода людині</text>
<text x="526.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">часто, але ловиться миттєво</text>
<text x="1044.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">10·6·1 = 60</text>
<rect x="420.0" y="164.0" width="640.0" height="68.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="260.0" y1="240.0" x2="412.0" y2="198.0" stroke="#c9ced6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="436.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">S=10</text>
<text x="436.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">O=1  D=6</text>
<text x="526.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">шкода людині</text>
<text x="526.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рідко, ловиться так собі</text>
<text x="1044.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">10·1·6 = 60</text>
<rect x="420.0" y="250.0" width="640.0" height="68.0" rx="8" fill="#fdf3e2" stroke="#b7791f" stroke-width="1.8"/>
<line x1="260.0" y1="240.0" x2="412.0" y2="284.0" stroke="#c9ced6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="436.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="start" font-weight="700">S=6</text>
<text x="436.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">O=2  D=5</text>
<text x="526.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">втрата функції</text>
<text x="526.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рідко, контроль середній</text>
<text x="1044.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">6·2·5 = 60</text>
<rect x="420.0" y="336.0" width="640.0" height="68.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="260.0" y1="240.0" x2="412.0" y2="370.0" stroke="#c9ced6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="436.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">S=3</text>
<text x="436.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">O=4  D=5</text>
<text x="526.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">дрібна прикрість</text>
<text x="526.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">нечасто, контроль середній</text>
<text x="1044.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">3·4·5 = 60</text>
<rect x="420.0" y="422.0" width="640.0" height="68.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<line x1="260.0" y1="240.0" x2="412.0" y2="456.0" stroke="#c9ced6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="436.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="start" font-weight="700">S=1</text>
<text x="436.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">O=6  D=10</text>
<text x="526.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">жодного ефекту</text>
<text x="526.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">часто й зовсім невидиме</text>
<text x="1044.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">1·6·10 = 60</text>
<line x1="394.0" y1="78.0" x2="394.0" y2="490.0" stroke="#7c3aed" stroke-width="2.0"/>
<line x1="394.0" y1="78.0" x2="404.0" y2="78.0" stroke="#7c3aed" stroke-width="2.0"/>
<line x1="394.0" y1="490.0" x2="404.0" y2="490.0" stroke="#7c3aed" stroke-width="2.0"/>
<text x="560.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Одне й те саме «RPN = 60» однаково сумісне з відмовою, якої ніхто не помітить (S=1), і з тією, що калічить людину (S=10).</tspan><tspan x="560.0" dy="18.8">Число не приховує тяжкість — воно її СТИРАЄ: за добутком неможливо відновити, з яких множників він склався.</tspan><tspan x="560.0" dy="18.8">Те саме з числами зі списку крамниці: RPN=144 дають і {2,8,9}, і {4,6,6}, а RPN=240 — і {4,6,10}, і {3,8,10}, де S=10.</tspan><tspan x="560.0" dy="18.8">Сортуючи за RPN, команда впорядковує саме те, що втратило сенс під час множення.</tspan></text>
</svg>