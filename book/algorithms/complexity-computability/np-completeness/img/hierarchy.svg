<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг класів: P ⊆ NP ⊆ PSPACE ⊆ EXPTIME</text>
<rect x="40.0" y="66.0" width="860.0" height="434.0" rx="18" fill="#fbfcfd" stroke="#6b7280" stroke-width="2.0"/>
<rect x="112.0" y="128.0" width="716.0" height="320.0" rx="16" fill="#f4f6f8" stroke="#8a93a0" stroke-width="2.0"/>
<rect x="196.0" y="190.0" width="548.0" height="214.0" rx="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<rect x="310.0" y="250.0" width="320.0" height="108.0" rx="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="470.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">EXPTIME — розв'язне за час 2^poly(n)</text>
<text x="470.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#5a6472" text-anchor="middle" font-weight="700">PSPACE — поліномна пам'ять</text>
<text x="470.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">NP — свідок перевіряється за поліном</text>
<text x="470.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">P — розв'язне за поліном</tspan><tspan x="470.0" dy="18.2">(сортування, найкоротший шлях)</tspan></text>
<text x="470.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">SAT, розфарбування, комівояжер — NP-повні</text>
<text x="470.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5a6472" text-anchor="middle">QBF — істинність кванторної булевої формули</text>
<text x="470.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">будь-яка NP-задача грубим перебором усіх свідків</text>
<rect x="-1.4" y="526.5" width="942.8" height="37.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="470.0" y="549.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Усі включення доведені. Теорема ієрархії за часом дає P ⊊ EXPTIME — тож бодай один ⊆ строгий, лише невідомо котрий</tspan></text>
</svg>