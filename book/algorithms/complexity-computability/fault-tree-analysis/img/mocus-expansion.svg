<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">MOCUS: розгортання дерева в матрицю перерізів</text>
<text x="540.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рядок матриці — набір відмов, що разом валять систему; згори вниз розкриваємо вентилі</text>
<text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">старт: вершина</text><rect x="96.0" y="184.0" width="128.0" height="44.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="160.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">TOP</text>
<text x="535.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">АБО → 2 рядки</text><rect x="471.0" y="184.0" width="128.0" height="44.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="535.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">POWER</text><rect x="471.0" y="246.0" width="128.0" height="44.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="535.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">PUMPS</text>
<text x="910.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">І → ширший рядок</text><rect x="846.0" y="184.0" width="128.0" height="44.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="910.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">POWER</text><rect x="846.0" y="246.0" width="128.0" height="44.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="910.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A · B</text>
<line x1="255.0" y1="202.0" x2="430.0" y2="202.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="342.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="342.0" dy="0.0">вентиль АБО</tspan><tspan x="342.0" dy="15.6">МНОЖИТЬ рядки</tspan></text>
<text x="342.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TOP = POWER ∨ PUMPS</text>
<line x1="632.0" y1="202.0" x2="805.0" y2="202.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="718.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="718.0" dy="0.0">вентиль І</tspan><tspan x="718.0" dy="15.6">ДОПИСУЄ стовпці</tspan></text>
<text x="718.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">PUMPS = A ∧ B</text>
<rect x="141.1" y="338.0" width="797.8" height="36.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="540.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">усі елементи базові → перерізи знайдено.  Поглинання прибирає надмножинні:  {A} ⊂ {A, B}  ⟹  {A, B} геть</tspan></text>
<line x1="50.0" y1="404.0" x2="1030.0" y2="404.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="540.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Чому число перерізів вибухає</text>
<text x="270.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">добуток сум — n резервованих пар:</tspan><tspan x="270.0" dy="17.4">TOP = (a₁∨b₁) ∧ (a₂∨b₂) ∧ … ∧ (aₙ∨bₙ)</tspan><tspan x="270.0" dy="17.4"></tspan><tspan x="270.0" dy="17.4">кожна пара незалежно дає a або b —</tspan><tspan x="270.0" dy="17.4">тож рядків 2·2·…·2 = 2ⁿ, по одному</tspan><tspan x="270.0" dy="17.4">на кожен вибір гілок.</tspan></text>
<rect x="576.0" y="589.0" width="48.0" height="7.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="600.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2¹</text>
<text x="600.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n=1</text>
<rect x="648.0" y="582.0" width="48.0" height="14.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="672.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2²</text>
<text x="672.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n=2</text>
<rect x="720.0" y="568.0" width="48.0" height="28.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="744.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2³</text>
<text x="744.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n=3</text>
<rect x="792.0" y="540.0" width="48.0" height="56.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="816.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2⁴</text>
<text x="816.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n=4</text>
<rect x="864.0" y="484.0" width="48.0" height="112.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="888.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2⁵</text>
<text x="888.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n=5</text>
<rect x="936.0" y="372.0" width="48.0" height="224.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="960.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2⁶</text>
<text x="960.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n=6</text>
<text x="780.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">рядків = 2ⁿ</text>
</svg>