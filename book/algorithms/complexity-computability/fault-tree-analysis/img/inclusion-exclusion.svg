<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="250.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перекровні перерізи → експонента доданків</text>
<circle cx="235.0" cy="210.0" r="92.0" fill="#c0392b" fill-opacity="0.26" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="360.0" cy="210.0" r="92.0" fill="#2457d6" fill-opacity="0.26" stroke="#2457d6" stroke-width="2.2"/>
<circle cx="297.0" cy="298.0" r="92.0" fill="#27ae60" fill-opacity="0.26" stroke="#27ae60" stroke-width="2.2"/>
<text x="185.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">C₁</text>
<text x="410.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">C₂</text>
<text x="297.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">C₃</text>
<line x1="150.0" y1="452.0" x2="285.0" y2="250.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="34.4" y="453.5" width="231.2" height="29.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="150.0" y="471.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">спільні базові події → перетин ≠ 0</tspan></text>
<text x="505.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">P(C₁ ∨ C₂ ∨ C₃) =</text>
<text x="505.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="start" font-weight="700">+</text>
<text x="545.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">(P₁ + P₂ + P₃)</text>
<text x="762.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">← 3 одинарні</text>
<text x="505.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="start" font-weight="700">−</text>
<text x="545.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">(P₁₂ + P₁₃ + P₂₃)</text>
<text x="762.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">← 3 парні</text>
<text x="505.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="start" font-weight="700">+</text>
<text x="545.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">P₁₂₃</text>
<text x="762.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">← 1 потрійний</text>
<rect x="555.1" y="288.5" width="269.9" height="33.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.4"/><text x="690.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">3 + 3 + 1 = 7 = 2³ − 1 доданків</tspan></text>
<text x="690.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">для m перерізів:</text>
<rect x="537.5" y="394.5" width="305.0" height="41.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="690.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">2ᵐ − 1 доданків  →  експонента</tspan></text>
</svg>