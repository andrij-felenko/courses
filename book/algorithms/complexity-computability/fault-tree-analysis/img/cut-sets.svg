<rect x="211.4" y="33.0" width="397.2" height="38.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/><text x="410.0" y="56.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ВТРАТА = ЖИВЛЕННЯ  ∨  (НАСОС A  ∧  НАСОС B)</tspan></text>
<text x="410.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">найменші набори відмов, що валять систему:</text>
<rect x="70.0" y="120.0" width="300.0" height="196.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="220.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переріз 1</text>
<rect x="174.8" y="179.0" width="90.5" height="34.0" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.9"/><text x="220.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЖИВЛЕННЯ</text>
<text x="220.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">порядок 1 — валить САМ</tspan><tspan x="220.0" dy="16.9">єдина точка відмови</tspan></text>
<text x="220.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">одна поломка = кінець</text>
<rect x="450.0" y="120.0" width="300.0" height="196.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="600.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переріз 2</text>
<rect x="514.8" y="179.0" width="82.4" height="34.0" rx="9" fill="#ffffff" stroke="#2457d6" stroke-width="1.9"/><text x="556.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">НАСОС A</text>
<rect x="604.8" y="179.0" width="82.4" height="34.0" rx="9" fill="#ffffff" stroke="#2457d6" stroke-width="1.9"/><text x="646.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">НАСОС B</text>
<text x="600.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">порядок 2 — потрібні</tspan><tspan x="600.0" dy="16.9">ОБИДВІ поломки разом</tspan></text>
<text x="600.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">переживе будь-яку одну</text>
<text x="410.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перерізи = прості імпліканти булевої функції; порядок найменшого — це міра крихкості</text>
