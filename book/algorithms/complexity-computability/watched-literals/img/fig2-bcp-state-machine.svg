<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Переходи станів диз'юнкта в алгоритмі Unit Propagation (BCP)</text>
<rect x="97.0" y="80.6" width="206.0" height="78.8" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="200.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">АКТИВНИЙ ДИЗ'ЮНКТ</tspan><tspan x="200.0" dy="15.6">Обидва спостережувані</tspan><tspan x="200.0" dy="15.6">літерали w₁, w₂ ∉ {FALSE}</tspan><tspan x="200.0" dy="15.6">Інваріант 2WL виконується</tspan></text>
<rect x="565.8" y="80.6" width="228.3" height="78.8" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="680.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">ПЕРЕНОС ПОКАЖЧИКА</tspan><tspan x="680.0" dy="15.6">Один з літералів wᵢ := FALSE</tspan><tspan x="680.0" dy="15.6">Знайдено новий не-хибний L'</tspan><tspan x="680.0" dy="15.6">wᵢ ↦ L' (без поширення)</tspan></text>
<rect x="67.2" y="280.6" width="265.5" height="78.8" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="200.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ОДИНИЧНИЙ ДИЗ'ЮНКТ (Unit)</tspan><tspan x="200.0" dy="15.6">w₁ := FALSE, а w₂ неприсвоєний</tspan><tspan x="200.0" dy="15.6">Немає заміни для w₁!</tspan><tspan x="200.0" dy="15.6">Обов'язкове присвоєння w₂ := TRUE</tspan></text>
<rect x="565.8" y="280.6" width="228.3" height="78.8" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="680.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">КОНФЛІКТ (Conflict)</tspan><tspan x="680.0" dy="15.6">Обидва w₁, w₂ := FALSE</tspan><tspan x="680.0" dy="15.6">Немає кандидату для заміни!</tspan><tspan x="680.0" dy="15.6">Повернення CDCL та виведення</tspan></text>
