<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 955 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="955" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="171.7" y="12.5" width="596.6" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Порівняння Слабкого (Weak) та Сильного (Strong) Фіата — Шаміра</tspan></text>
<rect x="25.0" y="75.0" width="440.0" height="380.0" rx="10" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/>
<text x="245.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700">Слабкий Фіат — Шамір (Weak FS)</text>
<text x="245.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">ВРАЗЛИВІСТЬ: контекст x випущено з хешу!</text>
<rect x="127.3" y="146.1" width="235.5" height="57.8" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Обчислення виклику:</tspan><tspan x="245.0" dy="13.7">β = H(α)</tspan><tspan x="245.0" dy="13.7">(не залежить від твердження x або m)</tspan></text>
<line x1="245.0" y1="212.0" x2="245.0" y2="245.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="112.5" y="250.5" width="265.1" height="69.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Атака підробки (Forgery Attack):</tspan><tspan x="245.0" dy="13.0">1. Атакуючий фіксує виклик β = H(α)</tspan><tspan x="245.0" dy="13.0">2. Підбирає твердження x' під пару (α, γ)</tspan><tspan x="245.0" dy="13.0">3. Генерує підроблений доказ для чужої теми</tspan></text>
<line x1="245.0" y1="345.0" x2="245.0" y2="375.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="127.6" y="387.9" width="234.8" height="44.1" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">РЕЗУЛЬТАТ: Повна підробка доказів</tspan><tspan x="245.0" dy="13.7">та підписів для чужих контекстів</tspan></text>
<rect x="495.0" y="75.0" width="440.0" height="380.0" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
<text x="715.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">Сильний Фіат — Шамір (Strong FS)</text>
<text x="715.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">БЕЗПЕЧНО: контекст x та зобов'язання α в хеші</text>
<rect x="588.3" y="146.1" width="253.4" height="57.8" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="715.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Обчислення виклику:</tspan><tspan x="715.0" dy="13.7">β = H(x || α)  або  β = H(m || α)</tspan><tspan x="715.0" dy="13.7">(криптографічна прив'язка до контексту)</tspan></text>
<line x1="715.0" y1="212.0" x2="715.0" y2="245.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="608.1" y="250.5" width="213.8" height="69.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="715.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Захист від підробки:</tspan><tspan x="715.0" dy="13.0">Будь-яка зміна x' або m' змінює β'</tspan><tspan x="715.0" dy="13.0">Атакуючий не може підібрати γ без</tspan><tspan x="715.0" dy="13.0">знання секретного свідка w</tspan></text>
<line x1="715.0" y1="345.0" x2="715.0" y2="375.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="591.1" y="387.9" width="247.8" height="44.1" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="715.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">РЕЗУЛЬТАТ: Доведена обґрунтованість</tspan><tspan x="715.0" dy="13.7">у моделі випадкового оракула (ROM)</tspan></text>
</svg>