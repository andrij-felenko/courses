<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Розфарбування [X]ⁿ та умови монохроматичності підмножин H ⊆ X</text>
<rect x="30.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="225.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Класична скінченна теорема Рамсея</text>
<rect x="58.2" y="107.3" width="333.5" height="45.3" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Параметри: n (розмірність), m (поріг), c (кольори)</tspan><tspan x="225.0" dy="14.3">Вхідна множина: X = {1, 2, ..., N}</tspan></text>
<rect x="61.6" y="180.2" width="326.9" height="59.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="225.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Гарантована монохроматична підмножина H ⊆ X:</tspan><tspan x="225.0" dy="14.3">1. Однорідне забарвлення: K([H]ⁿ) = {колір k}</tspan><tspan x="225.0" dy="14.3">2. Вимога розміру: |H| ≥ m</tspan></text>
<rect x="52.0" y="268.1" width="346.0" height="73.9" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Оцінка порогу N:</tspan><tspan x="225.0" dy="14.3">• n=2: N ≤ 2^{2m} (експоненціальна)</tspan><tspan x="225.0" dy="14.3">• Загальне n: вежа експонент (примітивно-рекурсивна)</tspan><tspan x="225.0" dy="14.3">• Довідність: Виводжувана у PA!</tspan></text>
<rect x="460.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="655.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="700">Підсилений принцип Паріса — Гаррінгтона</text>
<rect x="488.2" y="107.3" width="333.5" height="45.3" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="655.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Параметри: n (розмірність), m (поріг), c (кольори)</tspan><tspan x="655.0" dy="14.3">Вхідна множина: X = {1, 2, ..., N}</tspan></text>
<rect x="477.9" y="178.1" width="354.2" height="73.9" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="655.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Монохроматична підмножина H ⊆ X додатково ВЕЛИКА:</tspan><tspan x="655.0" dy="14.3">1. Однорідне забарвлення: K([H]ⁿ) = {колір k}</tspan><tspan x="655.0" dy="14.3">2. Вимога розміру: |H| ≥ m</tspan><tspan x="655.0" dy="14.3">3. Умова великої множини: |H| ≥ min(H)</tspan></text>
<rect x="522.7" y="273.1" width="264.5" height="73.9" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="655.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Оцінка порогу N = PH(n, m, c):</tspan><tspan x="655.0" dy="14.3">• n=2: Рівень функції Аккермана F_ω(m)</tspan><tspan x="655.0" dy="14.3">• n&gt;2: Скок до рівня F_{ω^{n-1}}(m)</tspan><tspan x="655.0" dy="14.3">• Невиводжуваність: НЕВиводжувана у PA!</tspan></text>
</svg>