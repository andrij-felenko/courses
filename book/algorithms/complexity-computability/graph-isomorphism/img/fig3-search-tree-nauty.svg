(гірший канонічний код)</text>
<rect x="401.7" y="245.9" width="496.5" height="88.2" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="650.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Основні етапи Nauty:</tspan><tspan x="650.0" dy="14.3">1. Вибір цільового осередку (Target Cell Selection).</tspan><tspan x="650.0" dy="14.3">2. Індивідуалізація (фіксація вершини) та ущільнення WL.</tspan><tspan x="650.0" dy="14.3">3. Обчислення канонічного підпису на листках дерева.</tspan><tspan x="650.0" dy="14.3">4. Виявлення автоморфізмів для геометричного відсікання гілок дерева пошуку.</tspan></text>
<text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-style="italic">Завдяки генераторам групи автоморфізмів Aut(G) дерево пошуку скорочується з O(n!) до декількох кроків.</text>
