<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Обчислювальний статус задачі Graph Isomorphism (GI)</text>
<rect x="40.0" y="60.0" width="420.0" height="310.0" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="250.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Клас NP (НЕДЕТЕРМІНОВАНИЙ ПОЛІНОМ)</text>
<rect x="60.0" y="100.0" width="170.0" height="250.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="145.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">NP-повні задачі
(SAT, TSP, 3-Color)</text>
<rect x="260.0" y="220.0" width="180.0" height="130.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="350.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Клас P (Поліном)
Shortest Path, Matching</text>
<rect x="260.0" y="100.0" width="180.0" height="100.0" rx="8" fill="#fff6e5" stroke="#d97706" stroke-width="2.0"/>
<text x="350.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Спеціальний клас GI
(Graph Isomorphism)</text>
<text x="350.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">Проміжна складність
(NP ∩ co-AM)</text>
<rect x="495.0" y="104.5" width="350.0" height="220.9" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="670.0" y="125.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Верхні та нижні межі складності GI:</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">• Квазіполіноміальний верхній час (Бабай, 2015):</tspan><tspan x="670.0" dy="14.3">  T(n) = exp(O((log n)ᶜ)) = 2^(O((log n)ᶜ))</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">• Інтерактивні докази:</tspan><tspan x="670.0" dy="14.3">  GNI (Graph Non-Isomorphism) ∈ IP = PSPACE</tspan><tspan x="670.0" dy="14.3">  GNI ∈ co-AM ⇒ GI не може бути NP-повною,</tspan><tspan x="670.0" dy="14.3">  якщо поліноміальна ієрархія PH не колапсує до Σ₂ᵖ.</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">• Спеціальні класи графа в P:</tspan><tspan x="670.0" dy="14.3">  - Дерева: O(n)</tspan><tspan x="670.0" dy="14.3">  - Планарні графи: O(n)</tspan><tspan x="670.0" dy="14.3">  - Обмежений степінь: O(nᵖ) (Luks, 1982)</tspan></text>
<text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-style="italic">Сьогодні GI вважається яскравим прикладом проблеми 'NP-проміжної' складності (теорема Ладнера).</text>
</svg>