<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскад хвилі дедукції (Unit Propagation) за час O(N)</text>
<rect x="15.4" y="76.6" width="189.3" height="66.8" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="110.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Крок 0: Факти</tspan><tspan x="110.0" dy="16.9">A = 1, D = 1</tspan><tspan x="110.0" dy="16.9">(У чергу активізації)</tspan></text>
<rect x="257.3" y="60.4" width="125.4" height="59.2" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="320.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Правило 1: A → B</tspan><tspan x="320.0" dy="15.6">Оскільки A = 1,</tspan><tspan x="320.0" dy="15.6">знаходимо B = 1</tspan></text>
<rect x="459.9" y="80.4" width="180.2" height="59.2" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="550.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Правило 2: (B ∧ D) → C</tspan><tspan x="550.0" dy="15.6">Оскільки B = 1 та D = 1,</tspan><tspan x="550.0" dy="15.6">знаходимо C = 1</tspan></text>
<rect x="637.6" y="212.6" width="164.8" height="74.8" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="720.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Обмеження:</tspan><tspan x="720.0" dy="15.6">(C ∧ A) → ⊥</tspan><tspan x="720.0" dy="15.6">C=1, A=1 ⇒ ⊥!</tspan><tspan x="720.0" dy="15.6">Суперечність (UNSAT)</tspan></text>
<rect x="259.8" y="238.4" width="280.4" height="63.2" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Якщо суперечностей немає:</tspan><tspan x="400.0" dy="15.6">Усі неактивовані змінні := 0</tspan><tspan x="400.0" dy="15.6">(Отримуємо єдину МІНІМАЛЬНУ модель)</tspan></text>
<line x1="190.0" y1="110.0" x2="250.0" y2="90.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="390.0" y1="90.0" x2="460.0" y2="105.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="130.0" x2="460.0" y2="125.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="640.0" y1="110.0" x2="680.0" y2="200.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="640.0" y1="120.0" x2="520.0" y2="230.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="325.0" width="720.0" height="40.0" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="410.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Кожен літерал переглядається максимум 1-2 рази ⇒ Часова складність O(N)</text>
</svg>