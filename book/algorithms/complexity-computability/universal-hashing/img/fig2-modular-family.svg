<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="340.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Двоетапне відображення модульного універсального сімейства Hₚ,ₘ</text>
<rect x="25.4" y="146.2" width="109.3" height="47.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="80.0" y="166.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">Вхідний ключ</tspan><tspan x="80.0" dy="15.6">x ∈ U</tspan></text>
<line x1="135.0" y1="170.0" x2="210.0" y2="170.0" stroke="#2563eb" stroke-width="2.0"/>
<rect x="210.9" y="140.2" width="238.2" height="59.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="330.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Крок 1: Афінне перетворення у Zₚ</tspan><tspan x="330.0" dy="14.3">y = (a · x + b) mod p</tspan><tspan x="330.0" dy="14.3">a ∈ {1,...,p-1}, b ∈ {0,...,p-1}</tspan></text>
<line x1="450.0" y1="170.0" x2="520.0" y2="170.0" stroke="#7e22ce" stroke-width="2.0"/>
<rect x="538.2" y="140.2" width="183.7" height="59.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="630.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Крок 2: Зменшення модулю</tspan><tspan x="630.0" dy="14.3">h(x) = y mod m</tspan><tspan x="630.0" dy="14.3">m бакетів хеш-таблиці</tspan></text>
<line x1="740.0" y1="170.0" x2="790.0" y2="170.0" stroke="#e08a1e" stroke-width="2.0"/>
<rect x="792.7" y="147.3" width="74.6" height="45.3" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="830.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Індекс</tspan><tspan x="830.0" dy="14.3">[0..m-1]</tspan></text>
<rect x="226.2" y="243.1" width="427.5" height="73.9" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="440.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Властивості конструкції:</tspan><tspan x="440.0" dy="14.3">1. p — просте число, p &gt; |U| (розмір універсуму ключів)</tspan><tspan x="440.0" dy="14.3">2. a, b обираються випадково й рівномірно з Zₚ (a ≠ 0)</tspan><tspan x="440.0" dy="14.3">3. Вірогідність колізії для будь-яких x ≠ y: P[h(x) = h(y)] &lt; 1/m</tspan></text>
</svg>