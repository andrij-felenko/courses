<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія класів складності та теорема Тоди</text>
<rect x="40.0" y="50.0" width="960.0" height="410.0" rx="18" fill="#f8fafc" stroke="#6b7280" stroke-width="2.0"/>
<rect x="100.0" y="100.0" width="840.0" height="320.0" rx="16" fill="#f3f0fd" stroke="#6b46c1" stroke-width="2.4"/>
<rect x="160.0" y="150.0" width="720.0" height="230.0" rx="14" fill="#edf2f7" stroke="#4a5568" stroke-width="2.0"/>
<rect x="240.0" y="200.0" width="560.0" height="140.0" rx="12" fill="#eaf0fd" stroke="#2b6cb0" stroke-width="2.2"/>
<rect x="370.0" y="245.0" width="300.0" height="65.0" rx="10" fill="#e9f7ef" stroke="#276749" stroke-width="2.4"/>
<text x="520.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">PSPACE — поліноміальна пам'ять</text>
<text x="520.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b46c1" text-anchor="middle" font-weight="700">P^(⊕P) = P^(#P) — поліноміальний час з оракулом парності ⊕P</text>
<text x="520.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="700">PH — поліноміальна ієрархія (NP ⊆ Σ₂P ⊆ Π₂P ⊆ Σ₃P ⋯)</text>
<text x="520.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="700">NP — існування свідка (чи &gt; 0)</text>
<text x="520.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#276749" text-anchor="middle" font-weight="700">P — детермінований поліноміальний час</text>
<rect x="308.5" y="333.5" width="423.0" height="33.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="520.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">⊕P-оракул поглинає весь PH за теоремою Тоди (1989)</tspan></text>
<rect x="81.7" y="485.9" width="876.6" height="58.2" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="520.0" y="510.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Теорема Тоди доводить, що P^(⊕P) містить усю поліноміальну ієрархію PH.</tspan><tspan x="520.0" dy="18.2">Питання парності (mod 2) має достатню алгебраїчну силу, щоб згорнути довільну кількість кванторів.</tspan></text>
</svg>