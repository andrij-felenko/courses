<rect x="829.6" y="50.8" width="200.7" height="58.5" rx="6" fill="#e9f7ef" stroke="#276749" stroke-width="2.4"/><text x="930.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">Нова формула Φ'</tspan><tspan x="930.0" dy="19.5">(РІВНО 1 розв'язок)</tspan></text>
<rect x="810.0" y="140.0" width="240.0" height="180.0" rx="12" fill="#f7fafc" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="920.0" cy="220.0" r="10.0" fill="#276749" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="930.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#276749" text-anchor="middle" font-weight="700">1 розв'язок = НЕПАРНА кількість!</text>
<rect x="27.5" y="455.9" width="1085.0" height="58.2" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="570.0" y="480.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Лема Валіанта–Вазірані: додавання m випадкових лінійних рівнянь над GF(2) з високою ймовірністю залишає рівно 1 розв'язок.</tspan><tspan x="570.0" dy="18.2">Оскільки 1 — непарне число, оракул парності ⊕P відрізняє 1 від 0, розв'язуючи задачі існування (NP).</tspan></text>
</svg>