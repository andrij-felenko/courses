<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="181.7" y="12.5" width="596.6" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Мікроархітектурний канал витоку: хронологія атаки Flush+Reload</tspan></text>
<rect x="25.0" y="70.0" width="285.0" height="375.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="71.7" y="86.0" width="190.6" height="24.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="167.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.0" dy="0.0">Крок 1: Очищення (Flush)</tspan></text>
<text x="167.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Атакуючий витісняє лінію</text>
<rect x="74.4" y="163.5" width="185.3" height="43.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="167.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Атакуючий виконує інструкцію:</tspan><tspan x="167.0" dy="13.0">clflush(&amp;T_table[line_idx])</tspan></text>
<rect x="54.4" y="240.5" width="225.2" height="69.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="167.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Стан кеш-ієрархії L1 / L2 / L3:</tspan><tspan x="167.0" dy="13.0">Цільова лінія гарантовано</tspan><tspan x="167.0" dy="13.0">видалена з усіх рівнів кешу.</tspan><tspan x="167.0" dy="13.0">Будь-який доступ викличе Cache Miss.</tspan></text>
<rect x="73.1" y="354.1" width="187.9" height="41.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="167.0" y="372.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Очікування жертви:</tspan><tspan x="167.0" dy="12.3">Атакуючий віддає квант часу CPU</tspan></text>
<rect x="335.0" y="70.0" width="285.0" height="375.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="381.7" y="86.0" width="190.6" height="24.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="477.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="477.0" dy="0.0">Крок 2: Виконання жертви</tspan></text>
<text x="477.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Криптографічна операція</text>
<rect x="375.8" y="157.0" width="202.4" height="56.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="477.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Жертва шифрує блок даних:</tspan><tspan x="477.0" dy="13.0">Виконує доступ до таблиці T-box:</tspan><tspan x="477.0" dy="13.0">y = T_table[k ⊕ p]</tspan></text>
<rect x="334.5" y="240.6" width="285.1" height="78.9" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="477.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="477.0" dy="0.0">Зміна мікроархітектурного стану:</tspan><tspan x="477.0" dy="12.3">• Якщо (k ⊕ p) потрапляє в line_idx,</tspan><tspan x="477.0" dy="12.3">  рядок завантажується в кеш L1/L3</tspan><tspan x="477.0" dy="12.3">• Якщо жертва не зверталась до рядка,</tspan><tspan x="477.0" dy="12.3">  він залишається в оперативній пам'яті (RAM)</tspan></text>
<rect x="377.7" y="359.1" width="198.7" height="41.9" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="477.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Побічний ефект:</tspan><tspan x="477.0" dy="12.3">Секретний ключ k змінює стан кешу</tspan></text>
<rect x="645.0" y="70.0" width="285.0" height="375.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="662.0" y="86.0" width="250.1" height="24.0" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/><text x="787.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="787.0" dy="0.0">Крок 3: Перезавантаження й замір</tspan></text>
<text x="787.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Вимірювання часу доступу</text>
<rect x="695.8" y="156.7" width="182.4" height="66.6" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="787.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="787.0" dy="0.0">Атакуючий заміряє час доступу:</tspan><tspan x="787.0" dy="12.3">t_start = __rdtsc();</tspan><tspan x="787.0" dy="12.3">volatile uint32_t val = *addr;</tspan><tspan x="787.0" dy="12.3">t_delta = __rdtsc() - t_start;</tspan></text>
<rect x="650.4" y="250.6" width="273.3" height="78.9" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="787.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="787.0" dy="0.0">Класифікація за порогом T_th:</tspan><tspan x="787.0" dy="12.3">• t_delta &lt; 80 циклів (Cache Hit):</tspan><tspan x="787.0" dy="12.3">  Жертва зверталась до рядка → k ⊕ p = line</tspan><tspan x="787.0" dy="12.3">• t_delta &gt; 200 циклів (Cache Miss):</tspan><tspan x="787.0" dy="12.3">  Жертва не зверталась до рядка</tspan></text>
<rect x="677.8" y="363.5" width="218.4" height="43.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="787.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="787.0" dy="0.0">Результат:</tspan><tspan x="787.0" dy="13.0">Повне відновлення байтів ключа k</tspan></text>
</svg>