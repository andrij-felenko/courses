<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="195.6" y="12.5" width="568.7" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Математичний конвеєр кореляційного аналізу потужності (CPA)</tspan></text>
<rect x="25.0" y="65.0" width="910.0" height="160.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="140.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Етап 1: Фізичний збір трас</text>
<rect x="63.0" y="117.0" width="134.0" height="56.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="130.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Відкриті вхідні дані</tspan><tspan x="130.0" dy="13.0">m₁, m₂, ..., m_N</tspan><tspan x="130.0" dy="13.0">(Відомі вектори)</tspan></text>
<line x1="210.0" y1="145.0" x2="270.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Шифрування</text>
<rect x="284.5" y="117.0" width="191.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Криптографічний пристрій</tspan><tspan x="380.0" dy="13.0">AES / RSA (невідомий ключ k*)</tspan><tspan x="380.0" dy="13.0">Резистор R_shunt на лінії V_dd</tspan></text>
<line x1="490.0" y1="145.0" x2="550.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Осцилограф</text>
<rect x="621.7" y="117.0" width="236.6" height="56.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="740.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Матриця фізичних трас струму T[N × M]</tspan><tspan x="740.0" dy="13.0">N запитів, M часових відліків на трасу</tspan><tspan x="740.0" dy="13.0">T_i(t) = P_device(t) + Шум(t)</tspan></text>
<rect x="25.0" y="245.0" width="435.0" height="235.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="242.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Етап 2: Гіпотетична модель витоку H</text>
<rect x="86.7" y="298.5" width="310.7" height="43.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="242.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Перебір гіпотез байта ключа: k_g ∈ {0, 1, ..., 255}</tspan><tspan x="242.0" dy="13.0">Проміжне значення: v_{i, k_g} = Sbox(m_i ⊕ k_g)</tspan></text>
<rect x="83.2" y="367.0" width="317.6" height="56.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="242.0" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="242.0" dy="0.0">Модель ваги Геммінґа (Hamming Weight):</tspan><tspan x="242.0" dy="13.0">H_{i, k_g} = HW(v_{i, k_g}) = ∑ бітів v_{i, k_g}</tspan><tspan x="242.0" dy="13.0">Матриця прогнозів H розміром [N × 256]</tspan></text>
<rect x="480.0" y="245.0" width="455.0" height="235.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="707.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Етап 3: Обчислення кореляції Пірсона та пік</text>
<rect x="557.4" y="298.5" width="299.3" height="43.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="707.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="707.0" dy="0.0">Коефіцієнт кореляції Пірсона ρ(k_g, t):</tspan><tspan x="707.0" dy="13.0">ρ = Cov(H_{k_g}, T(t)) / [ σ(H_{k_g}) · σ(T(t)) ]</tspan></text>
<rect x="520.3" y="366.7" width="373.4" height="66.6" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="707.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="707.0" dy="0.0">Ідентифікація істинного ключа k*:</tspan><tspan x="707.0" dy="12.3">• Для k_g = k* виникає гострий пік |ρ| &gt;&gt; 0 на моменті S-box</tspan><tspan x="707.0" dy="12.3">• Для хибних k_g ≠ k* кореляція залишається в шумі |ρ| ≈ 0</tspan><tspan x="707.0" dy="12.3">k* = argmax_{k_g} max_t |ρ(k_g, t)|</tspan></text>
</svg>