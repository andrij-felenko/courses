<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 863.1 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="863.1" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Лінійний порядок нестандартної моделі арифметики: ℕ + ℤ × ℚ</text>
<rect x="32.8" y="133.8" width="214.4" height="102.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="140.0" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Стандартний сегмент ℕ</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">0, 1, 2, 3, 4, ..., n, n+1, ...</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">Скінченні натуральні числа</tspan><tspan x="140.0" dy="14.3">(Ізоморфно стандартній моделі)</tspan></text>
<line x1="270.0" y1="75.0" x2="270.0" y2="295.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="270.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Зовнішня межа (невиражувана)</text>
<text x="550.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Нестандартний сегмент M \ ℕ (Блоки ℤ × ℚ)</text>
<rect x="271.6" y="127.0" width="196.7" height="56.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="370.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Блок H:</tspan><tspan x="370.0" dy="13.0">..., H-2, H-1, H, H+1, H+2, ...</tspan><tspan x="370.0" dy="13.0">(Нескінченне число H)</tspan></text>
<rect x="460.2" y="127.0" width="179.6" height="56.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="550.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Блок 2H або H²:</tspan><tspan x="550.0" dy="13.0">..., 2H-1, 2H, 2H+1, ...</tspan><tspan x="550.0" dy="13.0">(Більший нестандартний блок)</tspan></text>
<rect x="660.1" y="127.0" width="139.7" height="56.0" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="730.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Блок H/2 або ⌊√H⌋:</tspan><tspan x="730.0" dy="13.0">..., K-1, K, K+1, ...</tspan><tspan x="730.0" dy="13.0">(Проміжний блок)</tspan></text>
<rect x="257.0" y="244.5" width="586.1" height="31.0" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="550.0" y="263.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Порядок між блоками є щільним, без найменшого та найбільшого елемента (ізоморфно ℚ)</tspan></text>
</svg>