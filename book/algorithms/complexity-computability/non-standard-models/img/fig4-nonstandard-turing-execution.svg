<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Траєкторія обчислення нестандартної машини Тюринга</text>
<rect x="81.0" y="118.8" width="157.9" height="102.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="160.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Стандартні кроки k ∈ ℕ</tspan><tspan x="160.0" dy="14.3"></tspan><tspan x="160.0" dy="14.3">Кроки: 0, 1, 2, ..., n</tspan><tspan x="160.0" dy="14.3"></tspan><tspan x="160.0" dy="14.3">Скінченні конфігурації</tspan><tspan x="160.0" dy="14.3">стрічки та станів M</tspan></text>
<line x1="280.0" y1="170.0" x2="340.0" y2="170.0" stroke="#16a34a" stroke-width="2.0"/>
<text x="310.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Зовнішній світ ℕ</text>
<rect x="375.0" y="118.8" width="389.9" height="102.5" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="570.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Нестандартний гіпер-час H ∈ M \ ℕ</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Кроки: ..., H-2, H-1, H, H+1, ...</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Машина вважається такою, що зупинилася в M за H кроків,</tspan><tspan x="570.0" dy="14.3">хоч для стандартного спостерігача це нескінченне обчислення</tspan></text>
<rect x="58.8" y="289.5" width="722.5" height="31.0" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Нестандартний доказ суперечності 0=1 відповідає нестандартній машині Тюринга, що зупинилася за H кроків</tspan></text>
</svg>