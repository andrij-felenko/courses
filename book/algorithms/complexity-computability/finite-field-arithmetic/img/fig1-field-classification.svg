<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Алгебраїчна ієрархія структур та місце скінченних полів Галуа GF(q)</text>
<rect x="8.3" y="60.2" width="283.3" height="59.6" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="150.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Групи (Group)</tspan><tspan x="150.0" dy="14.3">Адитивна (G, +) чи Мультиплікативна (G, ·)</tspan><tspan x="150.0" dy="14.3">Замикання, асоціативність, 0/1, обернений</tspan></text>
<rect x="307.7" y="53.0" width="264.5" height="73.9" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="440.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Кільця (Ring)</tspan><tspan x="440.0" dy="14.3">Дві операції (+, ·)</tspan><tspan x="440.0" dy="14.3">(R, +) — абелева група, (R, ·) — моноід</tspan><tspan x="440.0" dy="14.3">Дистрибутивність: a·(b+c) = a·b + a·c</tspan></text>
<line x1="240.0" y1="90.0" x2="330.0" y2="90.0" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="270.1" y="150.2" width="339.8" height="59.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="440.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Комутативні кільця та кільця modulo n</tspan><tspan x="440.0" dy="14.3">Z_n (цілі числа mod n), GF(p)[x] (многочлени)</tspan><tspan x="440.0" dy="14.3">Якщо n складене — є дільники нуля (2 · 4 = 0 mod 8)</tspan></text>
<line x1="440.0" y1="125.0" x2="440.0" y2="155.0" stroke="#e08a1e" stroke-width="1.5"/>
<rect x="223.1" y="230.2" width="433.8" height="59.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="440.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Алгебраїчні поля (Field)</tspan><tspan x="440.0" dy="14.3">Всі елементи крім 0 утворюють мультиплікативну абелеву групу</tspan><tspan x="440.0" dy="14.3">Довільний елемент a ≠ 0 має унікальний обернений a⁻¹ (a · a⁻¹ = 1)</tspan></text>
<line x1="440.0" y1="215.0" x2="440.0" y2="235.0" stroke="#2563eb" stroke-width="1.5"/>
<rect x="120.9" y="313.1" width="238.2" height="73.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="240.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Прості поля GF(p)</tspan><tspan x="240.0" dy="14.3">Розмір p — просте число</tspan><tspan x="240.0" dy="14.3">Елементи: Z_p = {0, 1, ..., p-1}</tspan><tspan x="240.0" dy="14.3">Арифметика modulo p</tspan></text>
<rect x="490.2" y="313.1" width="299.6" height="73.9" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="640.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Поля розширення GF(pᵐ)</tspan><tspan x="640.0" dy="14.3">Розмір q = pᵐ (p — характеристика, m ≥ 1)</tspan><tspan x="640.0" dy="14.3">Фактор-кільце GF(p)[x] / (f(x))</tspan><tspan x="640.0" dy="14.3">f(x) — незвідний многочлен степеня m</tspan></text>
<line x1="370.0" y1="290.0" x2="240.0" y2="320.0" stroke="#16a34a" stroke-width="1.5"/>
<line x1="510.0" y1="290.0" x2="640.0" y2="320.0" stroke="#7e22ce" stroke-width="1.5"/>
</svg>