<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="370.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Геометрія критичної пари: Накладання правил l₁ → r₁ та l₂ → r₂ у підтермі</text>
<rect x="300.0" y="65.0" width="280.0" height="115.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="440.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Уніфікований терм:  t = l₁μ</text>
<rect x="360.0" y="108.0" width="160.0" height="56.0" rx="5" fill="#ffffff" stroke="#e08a1e" stroke-width="1.2"/>
<text x="440.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Підтерм t|ₚ = l₁|ₚμ</text>
<text x="440.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">= l₂μ  (найзагальніший уніфікатор μ)</text>
<line x1="340.0" y1="185.0" x2="170.0" y2="245.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Редукція кореня: l₁ → r₁</text>
<rect x="40.0" y="250.0" width="260.0" height="75.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="170.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Лівий результат:  r₁μ</text>
<text x="170.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Пряма заміна всього виразу</text>
<line x1="540.0" y1="185.0" x2="710.0" y2="245.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="670.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">Редукція у підтермі: l₂ → r₂</text>
<rect x="580.0" y="250.0" width="260.0" height="75.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="710.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Правий результат:  (l₁μ)[r₂μ]ₚ</text>
<text x="710.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Локальна заміна в піддереві p</text>
<rect x="300.0" y="335.0" width="280.0" height="32.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="440.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Критична пара: ⟨ r₁μ,  (l₁μ)[r₂μ]ₚ ⟩</text>
<line x1="300.0" y1="287.0" x2="440.0" y2="335.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="580.0" y1="287.0" x2="440.0" y2="335.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>