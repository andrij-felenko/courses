<rect x="523.4" y="114.3" width="323.2" height="41.3" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="685.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">1. Номер діагоналі:  w = x + y</tspan><tspan x="685.0" dy="14.3">Всі пари (x, y) на одній лінії мають сталу суму w</tspan></text>
<rect x="548.5" y="187.2" width="273.1" height="55.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="685.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">2. База діагоналі (трикутне число):</tspan><tspan x="685.0" dy="14.3">T(w) = w·(w + 1) / 2</tspan><tspan x="685.0" dy="14.3">Кількість точок у попередніх w діагоналях</tspan></text>
<rect x="564.1" y="277.2" width="241.7" height="55.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="685.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">3. Зсув всередині діагоналі:  y</tspan><tspan x="685.0" dy="14.3">Рух від (w, 0) вгору-вліво до (0, w)</tspan><tspan x="685.0" dy="14.3">π(x, y) = T(x + y) + y</tspan></text>
<rect x="554.7" y="377.2" width="260.5" height="55.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="685.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Повна формула Кантора:</tspan><tspan x="685.0" dy="14.3">π(x, y) = ((x + y)·(x + y + 1)) / 2 + y</tspan><tspan x="685.0" dy="14.3">Бієкція без пропусків і дублікатів</tspan></text>
