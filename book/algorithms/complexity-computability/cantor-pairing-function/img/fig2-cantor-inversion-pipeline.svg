<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Конвеєр аналітичного декодування Кантора: z ↦ (x, y)</text>
<rect x="47.6" y="75.0" width="124.8" height="49.9" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="110.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Вхідний номер</tspan><tspan x="110.0" dy="16.9">z ∈ ℕ₀</tspan></text>
<line x1="180.0" y1="100.0" x2="230.0" y2="100.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="244.0" y="68.4" width="232.0" height="63.2" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="360.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Крок 1: Знаходження діагоналі w</tspan><tspan x="360.0" dy="15.6">w² + w - 2z ≤ 0</tspan><tspan x="360.0" dy="15.6">w = ⌊ (√(8z + 1) - 1) / 2 ⌋</tspan></text>
<line x1="490.0" y1="100.0" x2="540.0" y2="100.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="557.1" y="68.4" width="245.7" height="63.2" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="680.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Крок 2: Трикутна база t</tspan><tspan x="680.0" dy="15.6">t = w·(w + 1) / 2</tspan><tspan x="680.0" dy="15.6">Початок діагоналі w у просторі ℕ₀</tspan></text>
<line x1="680.0" y1="150.0" x2="680.0" y2="190.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="553.7" y="218.4" width="252.6" height="63.2" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="680.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Крок 3: Виділення координат</tspan><tspan x="680.0" dy="15.6">y = z - t  (зсув по вертикалі)</tspan><tspan x="680.0" dy="15.6">x = w - y  (горизонтальна позиція)</tspan></text>
<line x1="540.0" y1="250.0" x2="480.0" y2="250.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="237.3" y="225.1" width="205.4" height="49.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="340.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Вихідна пара координат</tspan><tspan x="340.0" dy="16.9">(x, y) = (w - y, z - t)</tspan></text>
<rect x="30.0" y="310.0" width="820.0" height="85.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Числовий приклад декодування: z = 13</text>
<text x="440.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">1. 8z + 1 = 105 → √105 ≈ 10.246 → w = ⌊(10.246 - 1)/2⌋ = ⌊4.623⌋ = 4   |   2. t = 4·5/2 = 10   |   3. y = 13 - 10 = 3,  x = 4 - 3 = 1 → (1, 3)</text>
</svg>