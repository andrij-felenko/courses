<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260"><defs>  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />  </marker></defs><rect x="0.0" y="0.0" width="760.0" height="260.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр спарювання Ате: Цикл Міллера + Фінальне піднесення</text><rect x="35.5" y="96.6" width="108.9" height="66.8" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">Вхідні точки</tspan><tspan x="90.0" dy="16.9">P ∈ G1</tspan><tspan x="90.0" dy="16.9">Q ∈ G2</tspan></text><line x1="150.0" y1="130.0" x2="190.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="202.8" y="86.2" width="194.4" height="87.7" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Фаза 1: Цикл Міллера</tspan><tspan x="300.0" dy="16.9">Обчислення f_{T,Q}(P)</tspan><tspan x="300.0" dy="16.9">ітерацій s (64-bit NAF)</tspan><tspan x="300.0" dy="16.9">f ∈ F_{p^{12}}*</tspan></text><line x1="410.0" y1="130.0" x2="450.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="454.3" y="86.2" width="231.5" height="87.7" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Фаза 2: Фінальне піднесення</tspan><tspan x="570.0" dy="16.9">f_final = f^( (p^{12}-1)/r )</tspan><tspan x="570.0" dy="16.9">Проста + Важка частина</tspan><tspan x="570.0" dy="16.9">f_final ∈ Gt</tspan></text><line x1="690.0" y1="130.0" x2="725.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><text x="380.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Фінальне піднесення усуває класи еквівалентності та зводить результат до канонічного кореня з 1</text></svg>