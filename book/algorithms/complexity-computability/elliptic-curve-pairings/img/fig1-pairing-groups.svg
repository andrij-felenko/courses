<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"><defs>  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />  </marker></defs><rect x="0.0" y="0.0" width="760.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тригрупова структура білінійного спарювання e: G1 × G2 → Gt</text><rect x="34.3" y="74.6" width="231.5" height="70.8" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Група G1 = E(F_p)[r]</tspan><tspan x="150.0" dy="16.9">Адитивна група точок над F_p</tspan><tspan x="150.0" dy="16.9">[a]P ∈ G1 (48 байтів)</tspan></text><rect x="41.7" y="194.6" width="216.7" height="70.8" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="150.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Група G2 = E'(F_{p^2})[r]</tspan><tspan x="150.0" dy="16.9">Адитивна група над F_{p^2}</tspan><tspan x="150.0" dy="16.9">[b]Q ∈ G2 (96 байтів)</tspan></text><rect x="481.1" y="132.6" width="257.7" height="74.8" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="157.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Група Gt = μ_r ⊂ F_{p^{12}}*</tspan><tspan x="610.0" dy="16.9">Мультиплікативна група</tspan><tspan x="610.0" dy="16.9">e(P, Q)^(a·b) ∈ Gt (576 байтів)</tspan></text><line x1="280.0" y1="110.0" x2="460.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="280.0" y1="230.0" x2="460.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><circle cx="460.0" cy="170.0" r="24.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="460.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">e</text><line x1="484.0" y1="170.0" x2="510.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="340.0" y="40.0" width="240.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">e([a]P, [b]Q) = e(P, Q)^(a·b)</text></svg>