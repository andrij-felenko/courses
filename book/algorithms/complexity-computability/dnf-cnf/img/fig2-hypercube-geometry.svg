<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична дуальність у булевому гіперкубі {0,1}³</text>
<rect x="25.0" y="45.0" width="380.0" height="295.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="215.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">ДНФ: Покриття істинних наборів (1-точок)</text>
<rect x="69.1" y="97.2" width="291.9" height="55.6" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="215.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">• Кожен кон'юнкт фіксує k змінних</tspan><tspan x="215.0" dy="14.3">• Утворює грань/підкуб розмірності (n - k)</tspan><tspan x="215.0" dy="14.3">• ДНФ = об'єднання підкубів (Union of Cubes)</tspan></text>
<rect x="70.6" y="182.2" width="288.8" height="55.6" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="215.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Приклад: F = (x₁ ∧ x₂) ∨ (¬x₁ ∧ x₃)</tspan><tspan x="215.0" dy="14.3">• Term (x₁ ∧ x₂): ребро (1,1,0)-(1,1,1)</tspan><tspan x="215.0" dy="14.3">• Term (¬x₁ ∧ x₃): ребро (0,0,1)-(0,1,1)</tspan></text>
<text x="215.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Оптимізація: Мінімізація склеюванням (карт Карно)</text>
<text x="215.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Поєднання суміжних граней зменшує кількість літералів</text>
<rect x="435.0" y="45.0" width="380.0" height="295.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="625.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">КНФ: Відсікання хибних наборів (0-точок)</text>
<rect x="475.9" y="97.2" width="298.1" height="55.6" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="625.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">• Кожен диз'юнкт блокує підкуб хибності</tspan><tspan x="625.0" dy="14.3">• Утворює гіперплощину-обмеження (Constraint)</tspan><tspan x="625.0" dy="14.3">• КНФ = перетин допустимих півпросторів</tspan></text>
<rect x="456.7" y="182.2" width="336.5" height="55.6" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="625.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Приклад: F = (x₁ ∨ x₂) ∧ (¬x₂ ∨ ¬x₃)</tspan><tspan x="625.0" dy="14.3">• Clause (x₁ ∨ x₂): забороняє вершину (0,0,*)</tspan><tspan x="625.0" dy="14.3">• Clause (¬x₂ ∨ ¬x₃): забороняє вершину (*,1,1)</tspan></text>
<text x="625.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Оптимізація: Простір пошуку SAT-розв'язувача</text>
<text x="625.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Послідовне звуження допустимого підпростору вершин</text>
</svg>