<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи зведення булевих виразів до КНФ / ДНФ</text>
<rect x="25.0" y="45.0" width="380.0" height="295.0" rx="8" fill="#fffbeab0" stroke="#d97706" stroke-width="1.5"/>
<text x="215.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Класичне алгебраїчне перетворення</text>
<rect x="53.4" y="107.2" width="323.2" height="55.6" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.0"/><text x="215.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">1. Усунення імплікації (→) та еквівалентності (≡)</tspan><tspan x="215.0" dy="14.3">2. Закони Де Моргана (перенесення ¬ до змінних)</tspan><tspan x="215.0" dy="14.3">3. Закони дистрибутивності (розкриття дужок)</tspan></text>
<rect x="33.1" y="199.3" width="363.8" height="41.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="215.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Властивість: Еквівалентність за семантикою (F ≡ F')</tspan><tspan x="215.0" dy="14.3">Ціна: Експоненційний роздув розміру O(2ⁿ)</tspan></text>
<text x="215.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Застосування: Невелика кількість змінних (n ≤ 15)</text>
<text x="215.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">та аналітичні математичні виведення</text>
<rect x="435.0" y="45.0" width="380.0" height="295.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="625.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">Перетворення Цейтіна (Tseytin Encoding)</text>
<rect x="479.1" y="107.2" width="291.9" height="55.6" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/><text x="625.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">1. Побудова синтаксичного дерева AST</tspan><tspan x="625.0" dy="14.3">2. Введення допоміжних змінних xᵢ для вузлів</tspan><tspan x="625.0" dy="14.3">3. Локальне кодування кожної операції у КНФ</tspan></text>
<rect x="439.7" y="199.3" width="370.6" height="41.3" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="625.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Властивість: Рівновиконуваність (Equisatisfiability)</tspan><tspan x="625.0" dy="14.3">Перевага: Строго лінійний розмір O(N)</tspan></text>
<text x="625.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">Застосування: Промислові SAT-розв'язувачі (MiniSAT, Z3)</text>
<text x="625.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">та системи верифікації з мільйонами змінних</text>
</svg>