<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія напіврозв'язності: зупинка гарантована лише для належних елементів</text>
<rect x="10.0" y="10.0" width="820.0" height="320.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія напіврозв'язності (Semi-decidability)</text>
