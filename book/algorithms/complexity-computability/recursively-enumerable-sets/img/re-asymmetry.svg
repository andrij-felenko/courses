<text x="220.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Випадок 1: x ∈ S (належить)</text>
<rect x="141.2" y="131.8" width="157.7" height="46.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="220.0" y="151.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Напіввирішувач M(x)</tspan><tspan x="220.0" dy="15.0">Виконує обчислення...</tspan></text>
<line x1="220.0" y1="185.0" x2="220.0" y2="225.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="81.7" y="231.8" width="276.7" height="46.5" rx="6" fill="#e7f6e9" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">ЗУПИНКА: Вихід 1 («ТАК»)</tspan><tspan x="220.0" dy="15.0">Відповідь отримана за скінченний час</tspan></text>
<rect x="440.0" y="75.0" width="360.0" height="230.0" rx="6" fill="#faf4f4" stroke="#c0392b" stroke-width="1.5"/>
<text x="620.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Випадок 2: x ∉ S (не належить)</text>
<rect x="541.2" y="131.8" width="157.7" height="46.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="620.0" y="151.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Напіввирішувач M(x)</tspan><tspan x="620.0" dy="15.0">Виконує обчислення...</tspan></text>
<line x1="620.0" y1="185.0" x2="620.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.3" y="231.8" width="319.5" height="46.5" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="251.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">НЕСКІНЧЕННИЙ ЦИКЛ (∞)</tspan><tspan x="620.0" dy="15.0">Або відмова (Ні) / Зависання без відповіді</tspan></text>
</svg>