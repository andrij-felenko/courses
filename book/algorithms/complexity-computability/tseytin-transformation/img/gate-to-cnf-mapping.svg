<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="660.0" height="340.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="340.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальне кодування логічних елементів у диз'юнкти КНФ</text>
<text x="340.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Кожен вентиль еквівалентний тотожності p ↔ f(q, r) і дає 2-4 диз'юнкти</text>
<rect x="69.2" y="95.0" width="101.5" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="120.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Вентиль AND</tspan><tspan x="120.0" dy="16.9">p ↔ (q ∧ r)</tspan></text>
<rect x="62.1" y="180.6" width="115.8" height="78.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Диз'юнкти КНФ:</tspan><tspan x="120.0" dy="15.6">(¬p ∨ q)</tspan><tspan x="120.0" dy="15.6">(¬p ∨ r)</tspan><tspan x="120.0" dy="15.6">(p ∨ ¬q ∨ ¬r)</tspan></text>
<rect x="289.2" y="95.0" width="101.5" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="340.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Вентиль OR</tspan><tspan x="340.0" dy="16.9">p ↔ (q ∨ r)</tspan></text>
<rect x="282.1" y="180.6" width="115.8" height="78.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Диз'юнкти КНФ:</tspan><tspan x="340.0" dy="15.6">(p ∨ ¬q)</tspan><tspan x="340.0" dy="15.6">(p ∨ ¬r)</tspan><tspan x="340.0" dy="15.6">(¬p ∨ q ∨ r)</tspan></text>
<rect x="509.2" y="95.0" width="101.5" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="560.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Вентиль XOR</tspan><tspan x="560.0" dy="16.9">p ↔ (q ⊕ r)</tspan></text>
<rect x="502.1" y="172.8" width="115.8" height="94.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Диз'юнкти КНФ:</tspan><tspan x="560.0" dy="15.6">(¬p ∨ ¬q ∨ ¬r)</tspan><tspan x="560.0" dy="15.6">(¬p ∨ q ∨ r)</tspan><tspan x="560.0" dy="15.6">(p ∨ ¬q ∨ r)</tspan><tspan x="560.0" dy="15.6">(p ∨ q ∨ ¬r)</tspan></text>
<text x="340.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Загальний розмір КНФ = Кон'юнкція КНФ-блоків усіх вентилів + Одиничний диз'юнкт кореня (x_root)</text>
</svg>