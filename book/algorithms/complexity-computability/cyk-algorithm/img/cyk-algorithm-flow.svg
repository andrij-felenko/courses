<text x="450.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Об'єднання P[k,i] x P[l-k,i+k]</text>
<text x="450.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">для правил A -&gt; BC</text>
<rect x="585.0" y="55.0" width="170.0" height="130.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="670.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">4. Перевірка та AST</text>
<line x1="595.0" y1="95.0" x2="745.0" y2="95.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="670.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">S in P[n, 1] ? Відновлення</text>
<text x="670.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">дерева за вказівниками</text>
