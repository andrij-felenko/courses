<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">BPP проти PP: обмежений зазор проти порогового підрахунку</text>
<line x1="570.0" y1="50.0" x2="570.0" y2="390.0" stroke="#d5dbe2" stroke-width="2.0" stroke-dasharray="7 7"/>
<rect x="172.9" y="54.0" width="254.2" height="42.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="300.0" y="80.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Клас BPP: обмежена хиба</tspan></text>
<rect x="698.0" y="54.0" width="283.9" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="840.0" y="80.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Клас PP: необмежений поріг</tspan></text>
<line x1="120.0" y1="310.0" x2="480.0" y2="310.0" stroke="#333" stroke-width="2.0"/>
<rect x="140.0" y="290.0" width="100.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="190.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">x ∉ L: ≤ 1/3</tspan></text>
<rect x="340.0" y="290.0" width="100.0" height="40.0" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="390.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">x ∈ L: ≥ 2/3</tspan></text>
<line x1="240.0" y1="260.0" x2="335.0" y2="260.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">зазор ε ≥ 1/poly(n)</tspan></text>
<text x="300.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Мажоритарне голосування зменшує</tspan><tspan x="300.0" dy="16.9">хибу до 2⁻ᵏ за поліноміальний час</tspan></text>
<line x1="660.0" y1="310.0" x2="1020.0" y2="310.0" stroke="#333" stroke-width="2.0"/>
<line x1="840.0" y1="230.0" x2="840.0" y2="340.0" stroke="#e74c3c" stroke-width="2.0" stroke-dasharray="4 4"/>
<text x="840.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e74c3c" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">поріг = 1/2</tspan></text>
<rect x="670.0" y="290.0" width="165.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="752.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="752.0" dy="0.0">x ∉ L: ≤ 1/2</tspan></text>
<rect x="845.0" y="290.0" width="165.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="927.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="927.0" dy="0.0">x ∈ L: &gt; 1/2</tspan></text>
<text x="840.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Зазор може бути ε = 2⁻ᵖ⁽ⁿ⁾ —</tspan><tspan x="840.0" dy="16.9">ампліфікація вимагає O(2²ᵖ⁽ⁿ⁾) випробувань</tspan></text>
<rect x="43.9" y="424.0" width="1052.2" height="42.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="570.0" y="449.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">BPP — практична ймовірність з ампліфікацією. PP — точний підрахунок більшості гілок, недосяжний для фізичного аналізу.</tspan></text>
</svg>