<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="460.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Дерево Кліні: Обчислюване нескінченне бінарне дерево без обчислюваних гілок</text>
<rect x="140.4" y="43.0" width="559.2" height="73.9" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="420.0" y="62.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Властивість дерева Tₖ ⊂ 2^{&lt;ω}:</tspan><tspan x="420.0" dy="14.3">1. Належність вершини σ ∈ Tₖ є обчислювальною (рекурсивна множина слів)</tspan><tspan x="420.0" dy="14.3">2. Множина вершин нескінченна (|Tₖ| = ∞) ⇒ За Лемою Кеніґа ∃ нескінченна гілка f ∈ 2^ω</tspan><tspan x="420.0" dy="14.3">3. ЖОДНА нескінченна гілка f НЕ є обчислювальною функцією! (f ∉ Δ₁⁰, f ∈ Δ₂⁰)</tspan></text>
<rect x="50.0" y="160.0" width="740.0" height="280.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="420.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Блокування обчислювальних кандидатів алгоритмом Кліні</text>
<rect x="113.1" y="218.5" width="173.9" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="200.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Алгоритм φₑ₁</tspan><tspan x="200.0" dy="13.0">(Обчислювальний кандидат 1)</tspan></text>
<line x1="200.0" y1="268.0" x2="200.0" y2="310.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="3,3"/>
<rect x="127.3" y="307.0" width="145.4" height="56.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="200.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Відтинання на кроці s:</tspan><tspan x="200.0" dy="13.0">Tₖ примусово блокує σ</tspan><tspan x="200.0" dy="13.0">з збігом φₑ₁(n)</tspan></text>
<rect x="333.1" y="218.5" width="173.9" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="420.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Алгоритм φₑ₂</tspan><tspan x="420.0" dy="13.0">(Обчислювальний кандидат 2)</tspan></text>
<line x1="420.0" y1="268.0" x2="420.0" y2="310.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="3,3"/>
<rect x="327.4" y="307.0" width="185.3" height="56.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="420.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Відтинання на кроці s':</tspan><tspan x="420.0" dy="13.0">Кодування двох r.e. A, B</tspan><tspan x="420.0" dy="13.0">(A ∩ B = ∅, невідокремлювані)</tspan></text>
<rect x="564.5" y="218.5" width="151.1" height="43.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="640.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Необчислювальна гілка f</tspan><tspan x="640.0" dy="13.0">(Оракул 0' / Стрибок K)</tspan></text>
<line x1="640.0" y1="268.0" x2="640.0" y2="310.0" stroke="#16a34a" stroke-width="2.5"/>
<rect x="567.3" y="307.0" width="145.4" height="56.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="640.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Існує за Лемою Кеніґа!</tspan><tspan x="640.0" dy="13.0">f ∤ φₑ для всіх e</tspan><tspan x="640.0" dy="13.0">Належить класу Δ₂⁰</tspan></text>
<text x="420.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">Слабка Лема Кеніґа (WKL) доводить існування нескінченної гілки, але не гарантує її алгоритмічну побудову.</text>
</svg>