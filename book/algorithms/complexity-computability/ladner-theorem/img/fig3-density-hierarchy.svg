<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="171.8" y="16.5" width="536.5" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="440.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Властивість щільності: вставити мову C між A та B</tspan></text>
<rect x="280.1" y="95.0" width="319.8" height="30.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="440.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Верхня мова B ∈ NP (наприклад, SAT)</tspan></text>
<rect x="334.5" y="203.9" width="211.0" height="52.2" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="440.0" y="225.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Побудована мова C ∈ NP</tspan><tspan x="440.0" dy="18.2">(A &lt;_p C &lt;_p B)</tspan></text>
<rect x="228.0" y="335.0" width="424.0" height="30.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="440.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Нижня мова A ∈ NP (наприклад, порожня мова у P)</tspan></text>
<line x1="440.0" y1="320.0" x2="440.0" y2="275.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">A ≤_p C (і C ≰_p A)</text>
<line x1="440.0" y1="185.0" x2="440.0" y2="140.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">C ≤_p B (і B ≰_p C)</text>
<rect x="640.0" y="150.0" width="210.0" height="160.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="745.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle"><tspan x="745.0" dy="0.0">Процес можна повторювати</tspan><tspan x="745.0" dy="15.6">нескінченно:</tspan><tspan x="745.0" dy="15.6">між A і C → нова мова D</tspan><tspan x="745.0" dy="15.6">між C і B → нова мова E</tspan><tspan x="745.0" dy="15.6">Утворюється щільне</tspan><tspan x="745.0" dy="15.6">частково впорядковане дерево</tspan></text>
</svg>