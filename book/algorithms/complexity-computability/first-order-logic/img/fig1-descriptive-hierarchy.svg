<rect x="460.0" y="186.0" width="340.0" height="28.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="630.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">NL (НЕДЕТ. LOGSPACE)</tspan></text>
