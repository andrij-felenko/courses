<rect x="460.0" y="286.0" width="340.0" height="28.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="630.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">NP (Теорема Фагіна, 1974)</tspan></text>
<line x1="385.0" y1="300.0" x2="455.0" y2="300.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="336.0" width="340.0" height="28.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="210.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">FO + PFP (Часткова нерухома точка)</tspan></text>
<rect x="460.0" y="336.0" width="340.0" height="28.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="630.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">PSPACE (Поліноміальна пам'ять)</tspan></text>
<line x1="385.0" y1="350.0" x2="455.0" y2="350.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="386.0" width="340.0" height="28.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="210.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">SO (Повна логіка 2-го порядку)</tspan></text>
<rect x="460.0" y="386.0" width="340.0" height="28.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="630.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">PH (Поліноміальна ієрархія)</tspan></text>
<line x1="385.0" y1="400.0" x2="455.0" y2="400.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Примітка: Усі еквівалентності для L, NL, P, PSPACE вимагають наявності порядку &lt; на вхідній структурі.</text>
