<rect x="460.0" y="86.0" width="340.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="630.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">AC⁰ (Схеми константної глибини)</tspan></text>
<line x1="385.0" y1="100.0" x2="455.0" y2="100.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
