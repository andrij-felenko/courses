<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="800.0" height="340.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Обчислення найменшої нерухомої точки (LFP) для монотонного оператора</text>
<rect x="22.5" y="123.0" width="135.0" height="73.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="90.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Крок 0</tspan><tspan x="90.0" dy="14.3">R⁽⁰⁾ = ∅</tspan><tspan x="90.0" dy="14.3"></tspan><tspan x="90.0" dy="14.3">Початковий стан</tspan></text>
<line x1="159.5" y1="160.0" x2="185.0" y2="160.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="182.5" y="123.0" width="135.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Крок 1</tspan><tspan x="250.0" dy="14.3">R⁽¹⁾ = F(R⁽⁰⁾)</tspan><tspan x="250.0" dy="14.3"></tspan><tspan x="250.0" dy="14.3">Ребра довжиною 1</tspan></text>
<line x1="319.5" y1="160.0" x2="345.0" y2="160.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="338.6" y="123.0" width="142.8" height="73.9" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="410.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Крок 2</tspan><tspan x="410.0" dy="14.3">R⁽²⁾ = F(R⁽¹⁾)</tspan><tspan x="410.0" dy="14.3"></tspan><tspan x="410.0" dy="14.3">Шляхи довжиною ≤ 2</tspan></text>
<line x1="483.4" y1="160.0" x2="505.0" y2="160.0" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="491.8" y="123.0" width="156.4" height="73.9" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="570.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Крок k</tspan><tspan x="570.0" dy="14.3">R⁽ᵏ⁺¹⁾ = R⁽ᵏ⁾</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Нерухома точка R⁽∞⁾!</tspan></text>
<line x1="650.2" y1="160.0" x2="665.0" y2="160.0" stroke="#e08a1e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="662.5" y="123.0" width="135.0" height="73.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="730.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Фінал</tspan><tspan x="730.0" dy="14.3">Поліном за О(n²)</tspan><tspan x="730.0" dy="14.3"></tspan><tspan x="730.0" dy="14.3">Замикання в P</tspan></text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Монотонність забезпечує R⁽⁰⁾ ⊆ R⁽¹⁾ ⊆ R⁽²⁾ ⊆ ... ⊆ R⁽ᵏ⁾ = R⁽∞⁾ (Теорема Тарського — Кнастера).</text>
<text x="410.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Кількість ітерацій k ≤ nᵏ, що гарантує обчислення за поліноміальний час у класі P.</text>
</svg>