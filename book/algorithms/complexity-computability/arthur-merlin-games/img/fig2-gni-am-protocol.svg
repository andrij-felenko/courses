<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="164.9" y="16.5" width="610.2" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Інтерактивний AM-протокол для неізоморфізму графів (GNI)</tspan></text>
<rect x="226.2" y="72.5" width="487.5" height="25.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Вхідні дані: графи G₀ та G₁ з одинаковою кількістю вершин n</tspan></text>
<rect x="50.0" y="130.0" width="390.0" height="140.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="245.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Крок 1: Артур (Випадковий виклик)</text>
<text x="245.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle"><tspan x="245.0" dy="0.0">1. Обирає монетку b ∈ {0, 1} випадково</tspan><tspan x="245.0" dy="15.6">2. Обирає випадкову перестановку π ∈ Sₙ</tspan><tspan x="245.0" dy="15.6">3. Будує граф H = π(G_b)</tspan><tspan x="245.0" dy="15.6">4. Надсилає H Мерліну</tspan></text>
<line x1="440.0" y1="200.0" x2="490.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Граф H</text>
<rect x="500.0" y="130.0" width="390.0" height="140.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="695.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="700">Крок 2: Мерлін (Обчислення)</text>
<text x="695.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c2d12" text-anchor="middle"><tspan x="695.0" dy="0.0">1. Отримує граф H від Артура</tspan><tspan x="695.0" dy="15.6">2. Використовує нескінченні ресурси,</tspan><tspan x="695.0" dy="15.6">   щоб визначити, чи H ≅ G₀ чи H ≅ G₁</tspan><tspan x="695.0" dy="15.6">3. Відсилає відповідь b' ∈ {0, 1}</tspan></text>
<line x1="490.0" y1="240.0" x2="440.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Індекс b'</text>
<rect x="170.0" y="310.0" width="600.0" height="140.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="470.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Крок 3: Вердикт Артура (Прийняття рішення)</text>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">Артур приймає доказ тоді і тільки тоді, коли b' == b</text>
<rect x="190.0" y="385.0" width="270.0" height="50.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.0"/>
<text x="325.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">Якщо G₀ ≇ G₁: Pr[Accept] = 1.0</text>
<text x="325.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle" font-style="italic">(Графи неізоморфні, Мерлін не помиляється)</text>
<rect x="480.0" y="385.0" width="270.0" height="50.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
<text x="615.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Якщо G₀ ≅ G₁: Pr[Accept] = 0.5</text>
<text x="615.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-style="italic">(Графи ізоморфні, H ≅ G₀ ≅ G₁, вгадування)</text>
</svg>