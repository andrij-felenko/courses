<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38.9 -10 838.9 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-38.9" y="-10" width="838.9" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація кривих Вейєрштрасса за j-інваріантом та геометрія твістів</text>
<rect x="1.8" y="51.2" width="466.4" height="47.6" rx="6" fill="#e8f4fc" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="71.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Еліптична крива E/K:  y² + a₁xy + a₃y = x³ + a₂x² + a₄x + a₆</tspan><tspan x="235.0" dy="15.6">Дискримінант Δ ≠ 0   ⇒   j(E) = c₄³ / Δ</tspan></text>
<line x1="235.0" y1="105.0" x2="110.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="235.0" y1="105.0" x2="235.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="235.0" y1="105.0" x2="360.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="33.0" y="162.9" width="153.9" height="84.2" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="103.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="103.0" dy="0.0">j = 0  (c₄ = 0, A = 0)</tspan><tspan x="103.0" dy="14.3">y² = x³ + B</tspan><tspan x="103.0" dy="14.3">Aut(E) ≅ ℤ / 6ℤ</tspan><tspan x="103.0" dy="14.3">Твісти: d ∈ K* / (K*)⁶</tspan><tspan x="103.0" dy="14.3">Шестикратний твіст</tspan></text>
<rect x="148.6" y="162.9" width="172.8" height="84.2" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">j = 1728  (c₆ = 0, B = 0)</tspan><tspan x="235.0" dy="14.3">y² = x³ + Ax</tspan><tspan x="235.0" dy="14.3">Aut(E) ≅ ℤ / 4ℤ</tspan><tspan x="235.0" dy="14.3">Твісти: d ∈ K* / (K*)⁴</tspan><tspan x="235.0" dy="14.3">Чотирикратний твіст</tspan></text>
<rect x="281.8" y="162.9" width="166.5" height="84.2" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="372.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="372.0" dy="0.0">Загальний: j ∉ {0, 1728}</tspan><tspan x="372.0" dy="14.3">y² = x³ + Ax + B</tspan><tspan x="372.0" dy="14.3">Aut(E) ≅ ℤ / 2ℤ  (±1)</tspan><tspan x="372.0" dy="14.3">Твісти: d ∈ K* / (K*)²</tspan><tspan x="372.0" dy="14.3">Квадратичний твіст</tspan></text>
<rect x="-28.9" y="315.2" width="527.9" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="235.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Алгоритмічне відновлення кривої за інваріантом j₀ ∈ K:</tspan><tspan x="235.0" dy="14.3">● Якщо j₀ ∉ {0, 1728}: A = 3·j₀·(1728 − j₀),  B = 2·j₀·(1728 − j₀)²  ⇒  j(E) = j₀</tspan><tspan x="235.0" dy="14.3">● Якщо j₀ = 0: y² = x³ + 1;   Якщо j₀ = 1728: y² = x³ + x</tspan></text>
<rect x="468.9" y="135.9" width="302.1" height="188.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Головна теорема ізоморфізму:</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">1. Над алгебраїчним замиканням K̄:</tspan><tspan x="620.0" dy="14.3">   E₁ ≅ E₂ над K̄   ⟺   j(E₁) = j(E₂)</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">2. Над основним полем K:</tspan><tspan x="620.0" dy="14.3">   j(E₁) = j(E₂)   ⟺   E₂ є твістом E₁</tspan><tspan x="620.0" dy="14.3">   (ізоморфні над розширенням K(d¹/ⁿ))</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">3. Legendre Form: y² = x(x − 1)(x − λ)</tspan><tspan x="620.0" dy="14.3">   j(λ) = 256 · (λ² − λ + 1)³ / (λ²(λ − 1)²)</tspan><tspan x="620.0" dy="14.3">   Дія групи S₆ над коренями λ дає те саме j.</tspan></text>
</svg>