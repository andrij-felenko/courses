<rect x="459.6" y="78.8" width="270.8" height="102.5" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Структура графа ізогеній Pizer:</tspan><tspan x="595.0" dy="14.3">● Вершини: класи надсингулярних</tspan><tspan x="595.0" dy="14.3">  кривих над 𝔽_p² (за j-інваріантом).</tspan><tspan x="595.0" dy="14.3">● Кількість вершин: ≈ ⌊p / 12⌋ + ε.</tspan><tspan x="595.0" dy="14.3">● Ребра: ℓ-ізогенії (степінь k = ℓ + 1).</tspan><tspan x="595.0" dy="14.3">● Рівняння ребер: Φ_ℓ(j₁, j₂) = 0.</tspan></text>
<rect x="453.3" y="238.8" width="283.3" height="102.5" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="258.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Криптографічне значення (CSIDH / SQISign):</tspan><tspan x="595.0" dy="14.3">● Граф Рамануджана: зазор λ₁ ≤ 2√ℓ.</tspan><tspan x="595.0" dy="14.3">● Швидке перемішування (O(log p) кроків).</tspan><tspan x="595.0" dy="14.3">● Задача пошуку шляху між j_A та j_B</tspan><tspan x="595.0" dy="14.3">  є постквантово стійкою (немає BQP).</tspan><tspan x="595.0" dy="14.3">● j-інваріант є публічним ключем.</tspan></text>
