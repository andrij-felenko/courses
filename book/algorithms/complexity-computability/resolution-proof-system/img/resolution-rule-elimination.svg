<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="660.0" height="340.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="340.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило резолюції: Елімінація комплементарної змінної</text>
<text x="340.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Вивід резольвенти з двох початкових диз'юнктів за змінною x</text>
<rect x="68.9" y="95.0" width="242.3" height="49.9" rx="6" fill="#eef6ff" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Диз'юнкт C₁ = A ∨ x</tspan><tspan x="190.0" dy="16.9">(містить позитивний літерал x)</tspan></text>
<rect x="365.1" y="95.0" width="249.7" height="49.9" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="490.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Диз'юнкт C₂ = B ∨ ¬x</tspan><tspan x="490.0" dy="16.9">(містить негативний літерал ¬x)</tspan></text>
<line x1="210.0" y1="165.0" x2="300.0" y2="230.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="165.0" x2="380.0" y2="230.0" stroke="#e11d48" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="273.6" y="174.5" width="132.9" height="31.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.0"/><text x="340.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Елімінація {x, ¬x}</tspan></text>
<rect x="225.8" y="248.9" width="228.3" height="52.2" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/><text x="340.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Резольвента C = A ∨ B</tspan><tspan x="340.0" dy="18.2">(диз'юнкт без змінної x)</tspan></text>
<text x="340.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Якщо C₁ і C₂ істинні, то при x=0 істинне A, а при x=1 істинне B. Отже, A ∨ B істинне завжди.</text>
</svg>