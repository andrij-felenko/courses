<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод подвоєння: відношення часів прямо називає клас</text>
<rect x="328.6" y="40.5" width="302.7" height="39.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.5"/><text x="480.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">b = log₂( T(2n) / T(n) )</tspan></text>
<text x="480.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">заміряй час на n, 2n, 4n…  —  і читай клас із відношення сусідніх часів</text>
<rect x="34.0" y="122.0" width="118.0" height="58.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.5"/><text x="93.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">T(2n)/T(n)</tspan></text>
<rect x="160.0" y="122.0" width="96.0" height="58.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.5"/><text x="208.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">b</tspan></text>
<rect x="264.0" y="122.0" width="176.0" height="58.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.5"/><text x="352.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="352.0" dy="0.0">клас</tspan></text>
<rect x="448.0" y="122.0" width="472.0" height="58.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.5"/><text x="684.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">як це читати</tspan></text>
<rect x="34.0" y="180.0" width="118.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="93.0" y="213.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">≈ 1</tspan></text>
<rect x="160.0" y="180.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="208.0" y="213.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">0</tspan></text>
<rect x="264.0" y="180.0" width="176.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="276.0" y1="209.0" x2="298.0" y2="209.0" stroke="#2457d6" stroke-width="3.4"/>
<text x="308.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">O(1) або O(log n)</text>
<rect x="448.0" y="180.0" width="472.0" height="58.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="684.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">стала не росте зовсім;</tspan><tspan x="684.0" dy="16.2">логарифм додає лише крихту</tspan></text>
<rect x="34.0" y="238.0" width="118.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="93.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">≈ 2</tspan></text>
<rect x="160.0" y="238.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="208.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">1</tspan></text>
<rect x="264.0" y="238.0" width="176.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="276.0" y1="267.0" x2="298.0" y2="267.0" stroke="#0e9aa7" stroke-width="3.4"/>
<text x="308.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(n)</text>
<rect x="448.0" y="238.0" width="472.0" height="58.0" rx="6" fill="#eef2f8" stroke="#aab4c0" stroke-width="1.5"/><text x="684.0" y="263.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">лінійний прохід —</tspan><tspan x="684.0" dy="16.2">час масштабується чесно</tspan></text>
<rect x="34.0" y="296.0" width="118.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="93.0" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">≈ 3</tspan></text>
<rect x="160.0" y="296.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="208.0" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">≈ 1.58</tspan></text>
<rect x="264.0" y="296.0" width="176.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="276.0" y1="325.0" x2="298.0" y2="325.0" stroke="#8e44ad" stroke-width="3.4"/>
<text x="308.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">між O(n) і O(n²)</text>
<rect x="448.0" y="296.0" width="472.0" height="58.0" rx="6" fill="#eef2f8" stroke="#aab4c0" stroke-width="1.5"/><text x="684.0" y="321.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">поділяй-і-володарюй нижче квадрата</tspan><tspan x="684.0" dy="16.2">(множення Карацуби)</tspan></text>
<rect x="34.0" y="354.0" width="118.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="93.0" y="387.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">≈ 4</tspan></text>
<rect x="160.0" y="354.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="208.0" y="387.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">2</tspan></text>
<rect x="264.0" y="354.0" width="176.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="276.0" y1="383.0" x2="298.0" y2="383.0" stroke="#e08a1e" stroke-width="3.4"/>
<text x="308.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(n²)</text>
<rect x="448.0" y="354.0" width="472.0" height="58.0" rx="6" fill="#fdf2e6" stroke="#e08a1e" stroke-width="1.5"/><text x="684.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">вкладений цикл: кожне</tspan><tspan x="684.0" dy="16.2">подвоєння вчетверо дорожче</tspan></text>
<rect x="34.0" y="412.0" width="118.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="93.0" y="445.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">≈ 8</tspan></text>
<rect x="160.0" y="412.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="208.0" y="445.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">3</tspan></text>
<rect x="264.0" y="412.0" width="176.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="276.0" y1="441.0" x2="298.0" y2="441.0" stroke="#e08a1e" stroke-width="3.4"/>
<text x="308.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(n³)</text>
<rect x="448.0" y="412.0" width="472.0" height="58.0" rx="6" fill="#fdf2e6" stroke="#e08a1e" stroke-width="1.5"/><text x="684.0" y="437.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">три вкладені цикли (ThreeSum):</tspan><tspan x="684.0" dy="16.2">подвоєння — увосьмеро</tspan></text>
<rect x="34.0" y="470.0" width="118.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="93.0" y="503.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="93.0" dy="0.0">вибухає</tspan></text>
<rect x="160.0" y="470.0" width="96.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.5"/><text x="208.0" y="503.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="208.0" dy="0.0">—</tspan></text>
<rect x="264.0" y="470.0" width="176.0" height="58.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="276.0" y1="499.0" x2="298.0" y2="499.0" stroke="#c0392b" stroke-width="3.4"/>
<text x="308.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">не степінь</text>
<rect x="448.0" y="470.0" width="472.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="684.0" y="495.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="684.0" dy="0.0">відношення не стоїть на місці —</tspan><tspan x="684.0" dy="16.2">це вже експонента O(2ⁿ)</tspan></text>
</svg>