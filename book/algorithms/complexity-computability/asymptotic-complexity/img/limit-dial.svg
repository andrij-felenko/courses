<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди прямує f/g — той символ і чинний</text>
<line x1="78.0" y1="74.0" x2="822.0" y2="74.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="794.0" y1="74.0" x2="828.0" y2="74.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="64.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">0</text>
<text x="834.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">∞</text>
<text x="450.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">границя відношення   f(n) / g(n)   при  n → ∞</text>
<line x1="326.0" y1="67.0" x2="326.0" y2="81.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="574.0" y1="67.0" x2="574.0" y2="81.0" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="78.0" cy="74.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.6"/>
<circle cx="450.0" cy="74.0" r="5.5" fill="#27ae60" stroke="#ffffff" stroke-width="1.6"/>
<circle cx="822.0" cy="74.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.6"/>
<rect x="40.0" y="108.0" width="250.0" height="208.0" rx="10" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="165.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">lim  =  0</text>
<text x="165.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">f = o(g)</text>
<text x="165.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">строго менший порядок</text>
<rect x="58.0" y="212.0" width="214.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#dfe4ea" stroke-width="1.5"/><text x="165.0" y="230.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">звідси й f = O(g)</tspan><tspan x="165.0" dy="15.6">але не Θ, не Ω</tspan></text>
<text x="165.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">n = o(n²)</text>
<rect x="325.0" y="108.0" width="250.0" height="208.0" rx="10" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="450.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0  &lt;  lim  &lt;  ∞</text>
<text x="450.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#27ae60" text-anchor="middle" font-weight="700">f = Θ(g)</text>
<text x="450.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий порядок</text>
<rect x="343.0" y="212.0" width="214.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#dfe4ea" stroke-width="1.5"/><text x="450.0" y="230.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">звідси й O(g), і Ω(g)</tspan><tspan x="450.0" dy="15.6">точна двобічна межа</tspan></text>
<text x="450.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3n²+5n+7 = Θ(n²)</text>
<rect x="610.0" y="108.0" width="250.0" height="208.0" rx="10" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="735.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">lim  =  ∞</text>
<text x="735.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">f = ω(g)</text>
<text x="735.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">строго більший порядок</text>
<rect x="628.0" y="212.0" width="214.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#dfe4ea" stroke-width="1.5"/><text x="735.0" y="230.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">звідси й f = Ω(g)</tspan><tspan x="735.0" dy="15.6">але не Θ, не O</tspan></text>
<text x="735.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2ⁿ = ω(nᵏ)</text>
</svg>