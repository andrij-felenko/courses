<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="460.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Процес діагоналізації та граничний перехід до ординалу Γ₀</text>
<rect x="247.7" y="54.0" width="64.6" height="32.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="280.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">α₀ = 0</tspan></text>
<rect x="402.3" y="54.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Стартова точка</tspan></text>
<rect x="624.4" y="55.0" width="111.2" height="30.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="680.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Нульовий ординал</tspan></text>
<line x1="280.0" y1="90.0" x2="280.0" y2="122.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="210.5" y="110.0" width="139.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="280.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">α₁ = φ(0, 0) = 1</tspan></text>
<rect x="429.5" y="110.5" width="60.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Крок 1</tspan></text>
<rect x="601.6" y="111.0" width="156.8" height="30.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="680.0" y="129.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Значення функції ω^0 = 1</tspan></text>
<line x1="280.0" y1="146.0" x2="280.0" y2="178.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="206.8" y="166.0" width="146.5" height="32.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="280.0" y="186.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">α₂ = φ(1, 0) = ε₀</tspan></text>
<rect x="429.5" y="166.5" width="60.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Крок 2</tspan></text>
<rect x="573.1" y="167.0" width="213.8" height="30.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="680.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Найменша нерухома точка експоненти</tspan></text>
<line x1="280.0" y1="202.0" x2="280.0" y2="234.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
