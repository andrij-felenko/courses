<rect x="429.5" y="222.5" width="60.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Крок 3</tspan></text>
<rect x="519.0" y="223.0" width="322.1" height="30.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="680.0" y="241.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Індекс ординала підноситься у власний перший аргумент</tspan></text>
<line x1="280.0" y1="258.0" x2="280.0" y2="290.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="199.3" y="278.0" width="161.4" height="32.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="280.0" y="298.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">α₄ = φ(φ(ε₀, 0), 0)</tspan></text>
<rect x="429.5" y="278.5" width="60.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="297.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Крок 4</tspan></text>
<rect x="553.1" y="279.0" width="253.7" height="30.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="680.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Багаторазове діагональне самозастосування</tspan></text>
<text x="280.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">⋮ (трансфінітна ітерація α_{n+1} = φ(α_n, 0))</text>
<rect x="196.3" y="370.5" width="487.5" height="33.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="440.0" y="391.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Γ₀ = sup { α₀, α₁, α₂, α₃, ... } = min { α | φ(α, 0) = α }</tspan></text>
<text x="440.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Ординал Фефермана — Шютте: межа предикативного аналізу та систем переписування термів</text>
</svg>