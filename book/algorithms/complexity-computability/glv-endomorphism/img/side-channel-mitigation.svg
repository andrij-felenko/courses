<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320"><defs>  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />  </marker></defs><rect x="0.0" y="0.0" width="800.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від таймінг-атак у GLV: уразлива vs константна реалізація</text><rect x="40.0" y="60.0" width="340.0" height="230.0" rx="8" fill="#fff5f5" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Уразлива декомпозиція (Вразливість)</text><rect x="42.7" y="110.6" width="334.6" height="78.8" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">• Ділення з округленням в розгалуженні if/else</tspan><tspan x="210.0" dy="15.6">• РІЗНА довжина бітів k₁, k₂ залежно від k</tspan><tspan x="210.0" dy="15.6">• Витік секретного скаляра через таймінг</tspan><tspan x="210.0" dy="15.6">• Атаки за енергоспоживанням (SPA/DPA)</tspan></text><rect x="60.0" y="220.0" width="300.0" height="50.0" rx="4" fill="#fee2e2" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Час виконання залежить від значення k!</text><rect x="420.0" y="60.0" width="340.0" height="230.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Захищена константна декомпозиція</text><rect x="426.1" y="110.6" width="327.8" height="78.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">• Фіксована точність (Fixed-point arithmetic)</tspan><tspan x="590.0" dy="15.6">• Безрозгалужені маски та побітові зсуви</tspan><tspan x="590.0" dy="15.6">• Нормалізація скалярів k₁, k₂ до 128 біт</tspan><tspan x="590.0" dy="15.6">• Рівномірний профіль виконання й пам'яті</tspan></text><rect x="440.0" y="220.0" width="300.0" height="50.0" rx="4" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Час виконання строгий і сталий T = const!</text></svg>