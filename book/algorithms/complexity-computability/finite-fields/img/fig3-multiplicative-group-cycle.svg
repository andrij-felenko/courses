<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Циклічна мультиплікативна група GF(2³)★ породжена примітивним α (f(x) = x³ + x + 1)</text>
<rect x="291.4" y="78.5" width="57.2" height="43.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="320.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">α⁰ = 1</tspan><tspan x="320.0" dy="13.0">[001]</tspan></text>
<line x1="320.0" y1="105.0" x2="417.7" y2="152.1" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="393.0" y="127.4" width="57.2" height="43.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="421.6" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="421.6" dy="0.0">α¹ = x</tspan><tspan x="421.6" dy="13.0">[010]</tspan></text>
<line x1="417.7" y1="152.1" x2="441.9" y2="257.8" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="415.0" y="237.4" width="63.4" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="446.7" y="255.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="446.7" dy="0.0">α² = x²</tspan><tspan x="446.7" dy="13.0">[100]</tspan></text>
<line x1="441.9" y1="257.8" x2="374.2" y2="342.6" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="341.6" y="325.6" width="69.6" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="376.4" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="376.4" dy="0.0">α³ = x+1</tspan><tspan x="376.4" dy="13.0">[011]</tspan></text>
<line x1="374.2" y1="342.6" x2="265.8" y2="342.6" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="225.7" y="325.6" width="75.8" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="263.6" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="263.6" dy="0.0">α⁴ = x²+x</tspan><tspan x="263.6" dy="13.0">[110]</tspan></text>
<line x1="265.8" y1="342.6" x2="198.1" y2="257.8" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="149.2" y="237.4" width="88.2" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="193.3" y="255.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="193.3" dy="0.0">α⁵ = x²+x+1</tspan><tspan x="193.3" dy="13.0">[111]</tspan></text>
<line x1="198.1" y1="257.8" x2="222.3" y2="152.1" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="180.5" y="127.4" width="75.8" height="43.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="218.4" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="218.4" dy="0.0">α⁶ = x²+1</tspan><tspan x="218.4" dy="13.0">[101]</tspan></text>
<line x1="222.3" y1="152.1" x2="320.0" y2="105.0" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="545.8" y="133.0" width="308.4" height="174.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="700.0" y="152.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Правило степенів α в GF(2³):</tspan><tspan x="700.0" dy="14.3">f(α) = α³ + α + 1 = 0  ⇒  α³ = α + 1</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">• α⁰ = 1  [001]</tspan><tspan x="700.0" dy="14.3">• α¹ = x  [010]</tspan><tspan x="700.0" dy="14.3">• α² = x²  [100]</tspan><tspan x="700.0" dy="14.3">• α³ = x + 1  [011]</tspan><tspan x="700.0" dy="14.3">• α⁴ = x² + x  [110]</tspan><tspan x="700.0" dy="14.3">• α⁵ = x³ + x² = x² + x + 1  [111]</tspan><tspan x="700.0" dy="14.3">• α⁶ = x³ + x² + x = x² + 1  [101]</tspan><tspan x="700.0" dy="14.3">• α⁷ = α · α⁶ = x³ + x = 1  [001] (Замикання!)</tspan></text>
</svg>