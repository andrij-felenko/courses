<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Конструкція поля GF(2ᵐ) та векторно-поліноміальне представлення</text>
<rect x="84.6" y="70.2" width="270.8" height="59.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="220.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Незвідний многочлен f(x) степеня m</tspan><tspan x="220.0" dy="14.3">GF(2)[x] / (f(x))</tspan><tspan x="220.0" dy="14.3">Приклад AES: f(x) = x⁸ + x⁴ + x³ + x + 1</tspan></text>
<rect x="524.6" y="70.2" width="270.8" height="59.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="660.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Арифметичні операції в GF(2ᵐ)</tspan><tspan x="660.0" dy="14.3">Додавання: A(x) + B(x) mod 2  ⇒  XOR (^)</tspan><tspan x="660.0" dy="14.3">Множення: (A(x) · B(x)) mod f(x)</tspan></text>
<rect x="60.0" y="170.0" width="760.0" height="210.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="440.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Три еквівалентні форми представлення елемента A ∈ GF(2ᵐ)</text>
<rect x="89.7" y="230.2" width="220.6" height="59.6" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="200.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. Поліноміальна форма</tspan><tspan x="200.0" dy="14.3">A(x) = aₘ₋₁xᵐ⁻¹ + ... + a₁x + a₀</tspan><tspan x="200.0" dy="14.3">aᵢ ∈ {0, 1}</tspan></text>
<rect x="307.7" y="230.2" width="264.5" height="59.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">2. Бітовий вектор (Integer)</tspan><tspan x="440.0" dy="14.3">a = (aₘ₋₁, aₘ₋₂, ..., a₁, a₀)₂</tspan><tspan x="440.0" dy="14.3">m-бітне слово в пам'яті (uint8, uint32)</tspan></text>
<rect x="585.4" y="230.2" width="189.3" height="59.6" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="680.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">3. Мультиплікативна форма</tspan><tspan x="680.0" dy="14.3">A = αᵏ (k ∈ {0, ..., 2ᵐ-2})</tspan><tspan x="680.0" dy="14.3">α — корінь f(x), α²ᵐ⁻¹ = 1</tspan></text>
<line x1="290.0" y1="260.0" x2="330.0" y2="260.0" stroke="#64748b" stroke-width="1.5"/>
<line x1="545.0" y1="260.0" x2="580.0" y2="260.0" stroke="#64748b" stroke-width="1.5"/>
<text x="440.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-style="italic">Додавання виконується за 1 такт CPU через побітовий XOR (без переносу розрядів)
Множення вимагає множення без переносу (clmul) та редукції за модулем f(x)</text>
</svg>