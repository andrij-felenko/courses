<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код Ґрея: інкрементне оновлення рядкових сум у формулі Райзера</text>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">обхід підмножин стовпців у порядку коду Ґрея — між сусідами перемикається рівно один стовпець</text>
<rect x="178.5" y="113.8" width="243.0" height="76.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="300.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">S = {c₀, c₂}</tspan><tspan x="300.0" dy="18.2">маска [1 0 1]</tspan><tspan x="300.0" dy="18.2">rowsumᵢ = A[i,0] + A[i,2]</tspan></text>
<line x1="415.0" y1="152.0" x2="805.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="610.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">код Ґрея → перемкнути стовпець c₁</text>
<rect x="813.2" y="113.8" width="173.6" height="76.4" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="900.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">S = {c₀, c₁, c₂}</tspan><tspan x="900.0" dy="18.2">маска [1 1 1]</tspan><tspan x="900.0" dy="18.2">rowsumᵢ += A[i,1]</tspan></text>
<text x="600.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">один стовпець змінився → оновити n сум за O(n), а не перераховувати всі за O(n²)</text>
<text x="600.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">усі 2³ = 8 підмножин стовпців {c₀, c₁, c₂}, кожна — на один стовпець від сусідньої</text>
