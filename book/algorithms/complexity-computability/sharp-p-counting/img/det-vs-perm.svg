<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Визначник і перманента: уся різниця — знак sgn(σ)</text>
<line x1="570.0" y1="60.0" x2="570.0" y2="330.0" stroke="#d5dbe2" stroke-width="2.0" stroke-dasharray="7 7"/>
<rect x="202.7" y="61.0" width="194.6" height="42.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="300.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Визначник   det A</tspan></text>
<rect x="732.8" y="61.0" width="214.5" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="840.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Перманента   perm A</tspan></text>
<rect x="119.6" y="137.5" width="360.8" height="41.0" rx="6" fill="#ffffff" stroke="#c7ced6" stroke-width="1.6"/><text x="300.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">det A  =  Σσ  sgn(σ) · ∏ᵢ a[i, σ(i)]</tspan></text>
<rect x="696.8" y="137.5" width="286.4" height="41.0" rx="6" fill="#ffffff" stroke="#c7ced6" stroke-width="1.6"/><text x="840.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">perm A  =  Σσ  ∏ᵢ a[i, σ(i)]</tspan></text>
<text x="300.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">є множник знаку sgn(σ) = ±1 —</tspan><tspan x="300.0" dy="16.9">він дає структуру для методу Гаусса</tspan></text>
<text x="840.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">того самого множника вже немає —</tspan><tspan x="840.0" dy="16.9">жодної структури, лишається сума по n!</tspan></text>
<rect x="184.7" y="279.5" width="230.6" height="41.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="300.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">O(n³) — легко (клас P)</tspan></text>
<rect x="715.4" y="279.5" width="249.2" height="41.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="840.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">#P-повна (Валіант, 1979)</tspan></text>
<rect x="39.5" y="384.0" width="1060.9" height="42.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="570.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Та сама сума по всіх n! перестановках σ. Прибрали єдиний множник — знак sgn(σ) — і O(n³)-задача обернулася на #P-повну.</tspan></text>
</svg>