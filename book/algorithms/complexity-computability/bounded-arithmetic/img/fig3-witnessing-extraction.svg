<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Басса про свідків: Синтез поліноміальної програми</text>
<rect x="44.3" y="80.2" width="231.4" height="59.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="160.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Формальне доведення в S₂¹:</tspan><tspan x="160.0" dy="14.3">S₂¹ ⊢ ∀x ∃y A(x, y)</tspan><tspan x="160.0" dy="14.3">(де A ∈ Σ₁ᵇ — обмежена формула)</tspan></text>
<line x1="285.0" y1="110.0" x2="360.0" y2="110.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="349.7" y="80.2" width="340.5" height="59.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="520.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Секвенційне числення LKB:</tspan><tspan x="520.0" dy="14.3">Усунення вільних перетинів (Cut-Elimination)</tspan><tspan x="520.0" dy="14.3">Дерево виводу містить лише формули підструктури</tspan></text>
<line x1="520.0" y1="155.0" x2="520.0" y2="205.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.5" y="214.0" width="379.1" height="82.0" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="520.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Предикат свідка Wit_A(w, x):</tspan><tspan x="520.0" dy="13.0">Для кожного правила виводу будується поліноміальний комбінатор:</tspan><tspan x="520.0" dy="13.0">• Аксіоми BASIC ➔ пряме обчислення за O(1)</tspan><tspan x="520.0" dy="13.0">• Логічні зв'язки ➔ проекції пари Кантора π₁, π₂</tspan><tspan x="520.0" dy="13.0">• Правило PIND ➔ поліноміальний цикл довжини |x|</tspan></text>
<line x1="355.0" y1="255.0" x2="280.0" y2="255.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="57.9" y="218.1" width="204.1" height="73.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="160.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Екстрагований алгоритм:</tspan><tspan x="160.0" dy="14.3">Функція f(x) ∈ FP</tspan><tspan x="160.0" dy="14.3">Час роботи: T(n) = O(|x|^c)</tspan><tspan x="160.0" dy="14.3">Гарантія: ℕ ⊨ A(x, f(x))</tspan></text>
<rect x="40.0" y="360.0" width="800.0" height="105.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Практичний наслідок для комп'ютерних наук та верифікації</text>
<text x="440.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">1. Доведення існування розв'язку в слабкій арифметиці S₂¹ автоматично генерує коректний алгоритм поліноміального часу.</text>
<text x="440.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">2. Якщо теорему про нижню оцінку схем (наприклад, P ≠ NP) вдасться довести в S₂¹, то це породить алгоритми атак.</text>
<text x="440.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">3. Обмежена арифметика задає формальні межі того, які теореми складності можна довести методами поліноміального аналізу.</text>
</svg>