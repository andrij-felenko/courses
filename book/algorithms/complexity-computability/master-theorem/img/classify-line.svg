<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікатор: де лежить d відносно c* = log_b a</text>
<rect x="283.8" y="48.5" width="392.5" height="67.0" rx="6" fill="#f7f9ff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="70.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">d ≈ c* — плаваючій комі не вірю.</tspan><tspan x="480.0" dy="16.2">Перевіряю ЦІЛЕ рівняння  b^d = a:</tspan><tspan x="480.0" dy="16.2">= a → баланс  Θ(n^c* · log n)      ≠ a → поза межами</tspan></text>
