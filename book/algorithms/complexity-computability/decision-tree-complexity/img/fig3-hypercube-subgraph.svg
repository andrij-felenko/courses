вершину зі ступенем:

Δ(H) ≥ √n</text>
<text x="710.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-style="italic">Для n=3:
2³⁻¹ + 1 = 5 вершин.
Максимальний ступінь
Δ(H) ≥ √3 ≈ 1.73 (тобто 2).</text>
<text x="710.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Максимальний ступінь Δ(H)
