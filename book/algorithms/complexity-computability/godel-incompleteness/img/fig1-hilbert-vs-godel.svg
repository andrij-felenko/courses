<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Формалізм Гільберта (1900) проти Теорем Ґеделя (1931)</text>
<rect x="30.0" y="60.0" width="395.0" height="330.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="227.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Програма Давида Гільберта (1900–1928)</text>
<rect x="135.5" y="125.0" width="183.0" height="24.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="227.0" y="141.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="227.0" dy="0.0">1. Повнота (Completeness)</tspan></text>
<text x="227.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Кожне істинне твердження T має доведення: A ⊢ T</text>
<rect x="108.1" y="200.0" width="237.7" height="24.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="227.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="227.0" dy="0.0">2. Несуперечливість (Consistency)</tspan></text>
<text x="227.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Теорія не здатна вивести суперечність: A ⊬ (0 = 1)</text>
<rect x="91.0" y="275.0" width="271.9" height="24.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="227.0" y="291.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="227.0" dy="0.0">3. Розв'язність (Entscheidungsproblem)</tspan></text>
<text x="227.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Існує алгоритм перевірки довідності будь-якої формули</text>
<rect x="455.0" y="60.0" width="395.0" height="330.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="652.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Реальність: Теореми Ґеделя (1931)</text>
<rect x="557.1" y="125.0" width="189.8" height="24.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="652.0" y="141.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="652.0" dy="0.0">1-ша Теорема про неповноту</tspan></text>
<text x="652.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Існують істинні арифметичні речення G, недоведені у F</text>
<rect x="557.1" y="200.0" width="189.8" height="24.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="652.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="652.0" dy="0.0">2-га Теорема про неповноту</tspan></text>
<text x="652.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Сумісність теорії Consis(F) не доводиться засобами F</text>
<rect x="570.8" y="275.0" width="162.5" height="24.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="652.0" y="291.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="652.0" dy="0.0">Алгоритмічний наслідок</tspan></text>
<text x="652.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Проблема зупинки Тюринга нерозв'язна; верифікатор обмежений</text>
</svg>