<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Конструкція діагонального підставлення (Лема про нерухому точку)</text>
<rect x="40.0" y="70.0" width="360.0" height="140.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="220.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Предикат P(v) з вільною змінною v</text>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Приклад: ¬Prov(v) (недовідність)</text>
<text x="220.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Предикат описує властивість номеру формули v</text>
<rect x="480.0" y="70.0" width="360.0" height="140.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="660.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Функція діагоналізації sub(x)</text>
<text x="660.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">sub(┌A(v)┐) = ┌A(┌A(v)┐)┐</text>
<text x="660.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Підставляє номер формули замість її вільної змінної</text>
<line x1="220.0" y1="210.0" x2="360.0" y2="250.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="210.0" x2="520.0" y2="250.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="250.0" width="400.0" height="70.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="440.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Діагоналізована формула D(v) ≡ P(sub(v))</text>
<text x="440.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Фіксуємо її Ґеделів номер: d = ┌D(v)┐</text>
<line x1="440.0" y1="320.0" x2="440.0" y2="350.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="276.4" y="362.4" width="327.2" height="45.3" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Речення Ґеделя: G ≡ D(d) ≡ P(sub(d))</tspan><tspan x="440.0" dy="14.3">Отже: PA ⊢ G ↔ P(┌G┐)    ⇒    PA ⊢ G ↔ ¬Prov(┌G┐)</tspan></text>
</svg>