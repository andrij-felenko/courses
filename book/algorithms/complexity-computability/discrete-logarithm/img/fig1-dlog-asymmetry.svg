<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Обчислювальна асиметрія: Одностороння функція дискретного логарифма</text>
<rect x="40.6" y="96.2" width="238.9" height="47.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="160.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Основа g, експонента x, модуль p</tspan><tspan x="160.0" dy="15.6">Вхідні дані (x)</tspan></text>
<rect x="264.9" y="88.4" width="310.2" height="63.2" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="420.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Модульне піднесення gˣ mod p</tspan><tspan x="420.0" dy="15.6">Швидке піднесення (Square-and-Multiply)</tspan><tspan x="420.0" dy="15.6">Час: O(log x) кроків</tspan></text>
<rect x="594.8" y="96.2" width="170.5" height="47.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="680.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Результат y ≡ gˣ mod p</tspan><tspan x="680.0" dy="15.6">Вихідне значення (y)</tspan></text>
<line x1="265.0" y1="120.0" x2="305.0" y2="120.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="535.0" y1="120.0" x2="595.0" y2="120.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Прямий напрямок: ЛЕГКО (Поліноміальний час)</text>
<line x1="595.0" y1="240.0" x2="535.0" y2="240.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="305.0" y1="240.0" x2="265.0" y2="240.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="611.9" y="216.2" width="136.3" height="47.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="680.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Дано y, g, p</tspan><tspan x="680.0" dy="15.6">Відоме значення y</tspan></text>
<rect x="216.6" y="208.4" width="406.9" height="63.2" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="420.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Дискретне логарифмування x = log_g y</tspan><tspan x="420.0" dy="15.6">Пошук експоненти x у скінченній групі</tspan><tspan x="420.0" dy="15.6">Час: O(√N) або Lₚ[1/3, c] (Експонента/Субекспонента)</tspan></text>
<rect x="85.0" y="216.2" width="150.0" height="47.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="160.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Шукана експонента x</tspan><tspan x="160.0" dy="15.6">Невідомий секрет x</tspan></text>
<text x="420.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Зворотний напрямок: ВАЖКО (Класично складна задача)</text>
<text x="420.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Асиметрія між O(log x) та O(√N) утворює основу криптографії з відкритим ключем (DH, ElGamal, ECC)</text>
</svg>