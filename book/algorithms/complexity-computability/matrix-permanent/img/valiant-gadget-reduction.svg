<rect x="349.8" y="25.0" width="480.3" height="40.0" rx="6" fill="#eef2f7" stroke="#4a6572" stroke-width="2.0"/><text x="590.0" y="50.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Зведення Валіанта (1979): 3SAT ⟶ 0/1-перманент</tspan></text>
