<text x="795.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7f8c8d" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">заміна ваг</tspan><tspan x="795.0" dy="15.6">0/1-елементами</tspan></text>
<rect x="59.5" y="394.0" width="1060.9" height="42.0" rx="6" fill="#f4f6f8" stroke="#b0bec5" stroke-width="1.8"/><text x="590.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Валіант довів: число покриттів циклами у побудованому графі дорівнює perm(A), що вимірює число виконуючих наборів 3SAT.</tspan></text>
