<text x="180.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2b5b84" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Булева формула 3SAT</tspan><tspan x="180.0" dy="19.5">φ = C₁ ∧ C₂ ∧ ... ∧ Cₘ</tspan></text>
<text x="180.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle"><tspan x="180.0" dy="0.0">• Змінні x₁, x₂, ..., xₙ</tspan><tspan x="180.0" dy="16.9">• Клози Cⱼ = (l₁ ∨ l₂ ∨ l₃)</tspan><tspan x="180.0" dy="16.9">• Питання: N(φ) &gt; 0?</tspan></text>
<rect x="460.0" y="120.0" width="260.0" height="220.0" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="2.0"/>
<text x="590.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#e08a1e" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Зважений граф G</tspan><tspan x="590.0" dy="19.5">Гаджети змінових і клозів</tspan></text>
<text x="590.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle"><tspan x="590.0" dy="0.0">• Гаджет змінної (2 цикли)</tspan><tspan x="590.0" dy="16.9">• Гаджет клозу (3 входи)</tspan><tspan x="590.0" dy="16.9">• Перехідні фільтри (-1, 2)</tspan></text>
<rect x="870.0" y="120.0" width="260.0" height="220.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="1000.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">0/1 Матриця суміжності A</tspan><tspan x="1000.0" dy="19.5">Розбиття вершин та mod M</tspan></text>
<text x="1000.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle"><tspan x="1000.0" dy="0.0">• Розщеплення вершин</tspan><tspan x="1000.0" dy="16.9">• perm(A) mod M = N(φ)·k</tspan><tspan x="1000.0" dy="16.9">• Точний підрахунок</tspan></text>
