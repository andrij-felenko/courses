<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула Райзера: включення-виключення та код Ґрея</text>
<rect x="285.0" y="25.0" width="510.1" height="40.0" rx="6" fill="#eef2f7" stroke="#4a6572" stroke-width="2.0"/><text x="540.0" y="50.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Формула Райзера: включення-виключення та код Ґрея</tspan></text>
<rect x="60.0" y="105.0" width="460.0" height="230.0" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2.0"/>
<text x="290.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2980b9" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">Суми по підмножинах стовпців S ⊆ {1, ..., n}</tspan></text>
<text x="290.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle"><tspan x="290.0" dy="0.0">• Розгляд усіх 2ⁿ підмножин стовпців S</tspan><tspan x="290.0" dy="16.9">• Сума рядків P(S) = ∏ᵢ (∑ⱼ∈S a[i,j])</tspan><tspan x="290.0" dy="16.9">• Знакозмінний коефіцієнт (-1)|S| відсіває небієктивні відображення</tspan><tspan x="290.0" dy="16.9">• Залишається точно n! трансверсалей = perm(A)</tspan></text>
<rect x="560.0" y="105.0" width="460.0" height="230.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="790.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Оптимізація кодом Ґрея: з O(2ⁿ·n) до O(2ⁿ)</tspan></text>
<text x="790.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle"><tspan x="790.0" dy="0.0">• Послідовність підмножин змінюється лише на 1 біт</tspan><tspan x="790.0" dy="16.9">• Оновлення векторів суми рядків за O(1) додавання/віднімання</tspan><tspan x="790.0" dy="16.9">• Загальна складність O(2ⁿ n) скорочується до O(2ⁿ)</tspan><tspan x="790.0" dy="16.9">• Практична межа: n ≈ 30...40 замість n = 12</tspan></text>
<line x1="520.0" y1="220.0" x2="560.0" y2="220.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="70.3" y="394.0" width="939.4" height="42.0" rx="6" fill="#f4f6f8" stroke="#b0bec5" stroke-width="1.8"/><text x="540.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Формула Райзера замінює n! перестановок сумуванням по 2ⁿ підмножинах. Код Ґрея робить кожен крок за O(1).</tspan></text>
</svg>