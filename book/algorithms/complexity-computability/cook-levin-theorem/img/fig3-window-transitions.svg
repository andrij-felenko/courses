<text x="525.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">c</text>
<rect x="626.5" y="137.7" width="187.0" height="104.6" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="720.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Локальне правило:</tspan><tspan x="720.0" dy="16.9">Комірка j у момент t+1</tspan><tspan x="720.0" dy="16.9">залежить ТІЛЬКИ від</tspan><tspan x="720.0" dy="16.9">комірок j-1, j, j+1</tspan><tspan x="720.0" dy="16.9">у момент t.</tspan></text>
