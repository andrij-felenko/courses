<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="500.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Спектр функцій повільнозростаючої ієрархії G_α(n) та порівняння з F_α(n)</text>
<line x1="50.0" y1="83.0" x2="50.0" y2="113.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="122.8" y="49.0" width="94.4" height="32.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="170.0" y="69.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_k(n) = k</tspan></text>
<rect x="318.9" y="49.5" width="122.3" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="68.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Константний (k)</tspan></text>
<rect x="546.5" y="49.5" width="226.9" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="68.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Інкремент на скінченних ординалах</tspan></text>
<line x1="50.0" y1="133.0" x2="50.0" y2="163.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="122.8" y="99.0" width="94.4" height="32.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="170.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_ω(n) = n</tspan></text>
<rect x="325.7" y="99.5" width="108.7" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Лінійний ріст</tspan></text>
<rect x="512.1" y="99.5" width="295.9" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Тотожна функція (базовий трансфінітний крок)</tspan></text>
<line x1="50.0" y1="183.0" x2="50.0" y2="213.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="100.5" y="149.0" width="139.0" height="32.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="170.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_{ω·k}(n) = k·n</tspan></text>
<rect x="312.0" y="149.5" width="135.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="168.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Лінійно-скалярний</tspan></text>
<rect x="530.9" y="149.5" width="258.3" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="168.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Масштабування аргументу коефіцієнтом k</tspan></text>
<line x1="50.0" y1="233.0" x2="50.0" y2="263.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="107.9" y="199.0" width="124.2" height="32.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="170.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_{ω²}(n) = n²</tspan></text>
<rect x="312.0" y="199.5" width="135.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Квадратичний ріст</tspan></text>
<rect x="562.2" y="199.5" width="195.6" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Діагоналізація добутку омеги</tspan></text>
<line x1="50.0" y1="283.0" x2="50.0" y2="313.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="100.5" y="249.0" width="139.0" height="32.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="170.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_{ω^k}(n) = n^k</tspan></text>
<rect x="322.3" y="249.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Поліноміальний</tspan></text>
<rect x="515.2" y="249.5" width="289.6" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Повний спектр довільних поліномів степеня k</tspan></text>
<line x1="50.0" y1="333.0" x2="50.0" y2="363.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="104.2" y="299.0" width="131.6" height="32.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="170.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_{ω^ω}(n) = nⁿ</tspan></text>
<rect x="298.4" y="299.5" width="163.2" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Суперекспоненціальний</tspan></text>
<rect x="546.5" y="299.5" width="226.9" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Степінь з основою та показником n</tspan></text>
<line x1="50.0" y1="383.0" x2="50.0" y2="413.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="93.0" y="349.0" width="153.9" height="32.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="170.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_{ε₀}(n) = n ↑↑ n</tspan></text>
<rect x="301.8" y="349.5" width="156.4" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="368.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Тетрація (рівень F₃)</tspan></text>
<rect x="512.1" y="349.5" width="295.9" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="368.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Вежа степенів висоти n (швидкість Аккермана)</tspan></text>
<rect x="67.0" y="399.0" width="206.0" height="32.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">G_{ψ(Ω^ω)}(n) ≈ F_{ε₀}(n)</tspan></text>
<rect x="315.4" y="399.5" width="129.1" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="380.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Межа PA (колапс)</tspan></text>
<rect x="505.8" y="399.5" width="308.4" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="660.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Повне наздоганяння FGH через колапсні ординали</tspan></text>
<line x1="25.0" y1="390.0" x2="855.0" y2="390.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="730.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Збіг зі швидкозростаючою F_{ε₀}</text>
</svg>