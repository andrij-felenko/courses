<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Алгебраїчний гомоморфізм обчислення G_α(n): підстановка ω ↦ n</text>
<rect x="30.0" y="60.0" width="390.0" height="350.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="225.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Ординал у формі Кантора: α = ω³·2 + ω²·5 + 7</text>
<rect x="185.2" y="109.0" width="79.5" height="32.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Сума (+)</tspan></text>
<rect x="52.3" y="179.5" width="115.5" height="31.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="110.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Доданок ω³ · 2</tspan></text>
<rect x="167.3" y="179.5" width="115.5" height="31.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="225.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Доданок ω² · 5</tspan></text>
<rect x="295.5" y="179.5" width="89.0" height="31.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="340.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Константа 7</tspan></text>
<line x1="200.0" y1="140.0" x2="120.0" y2="180.0" stroke="#2563eb" stroke-width="1.5"/>
<line x1="225.0" y1="140.0" x2="225.0" y2="180.0" stroke="#2563eb" stroke-width="1.5"/>
<line x1="250.0" y1="140.0" x2="330.0" y2="180.0" stroke="#2563eb" stroke-width="1.5"/>
<rect x="48.7" y="250.0" width="122.6" height="30.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="110.0" y="268.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Показник 3, коеф 2</tspan></text>
<rect x="163.7" y="250.0" width="122.6" height="30.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="225.0" y="268.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Показник 2, коеф 5</tspan></text>
<line x1="110.0" y1="212.0" x2="110.0" y2="250.0" stroke="#7e22ce" stroke-width="1.5"/>
<line x1="225.0" y1="212.0" x2="225.0" y2="250.0" stroke="#0d9488" stroke-width="1.5"/>
<rect x="75.5" y="325.0" width="299.0" height="30.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="343.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Правило гомоморфізму: G_α(n) = Eval(α, ω ↦ n)</tspan></text>
<rect x="450.0" y="60.0" width="400.0" height="350.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Числова оцінка полінома для аргументу n = 4</text>
<text x="470.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">1. Заміна бази ω на аргумент n: ω ↦ 4</text>
<text x="470.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">2. Обчислення першого доданка: 4³ · 2 = 64 · 2 = 128</text>
<text x="470.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">3. Обчислення другого доданка: 4² · 5 = 16 · 5 = 80</text>
<text x="470.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">4. Скінченний вільний член: 7</text>
<text x="470.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">5. Підсумовування: 128 + 80 + 7 = 215</text>
<text x="470.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">6. Результат: G_{ω³·2 + ω²·5 + 7}(4) = 215</text>
<rect x="496.8" y="344.5" width="306.4" height="31.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="650.0" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Алгебраїчний поліном: P(n) = 2n³ + 5n² + 7</tspan></text>
</svg>