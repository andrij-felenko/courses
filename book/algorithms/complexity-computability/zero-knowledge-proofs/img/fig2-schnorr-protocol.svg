<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="80.6" y="16.5" width="778.9" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Інтерактивний Sigma-протокол Шнорра (Proof of Knowledge of Discrete Log)</tspan></text>
<rect x="132.9" y="70.0" width="674.2" height="24.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="86.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Спільний вхід: група G порядку q з генератором g. Публічний ключ Y = g^x mod p. Секрет: x</tspan></text>
<rect x="50.0" y="120.0" width="240.0" height="330.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="170.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c2d12" text-anchor="middle" font-weight="700">Доводжувач (Prover P)</text>
<text x="170.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c2d12" text-anchor="middle"><tspan x="170.0" dy="0.0">Знає секретний ключ x</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">1. Генерує r ∈_R Z_q</tspan><tspan x="170.0" dy="14.3">2. Обчислює R = g^r mod p</tspan><tspan x="170.0" dy="14.3">   (Зобов'язання / Commitment)</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">3. Отримує виклик e від V</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">4. Обчислює відповідь:</tspan><tspan x="170.0" dy="14.3">   s = (r + e · x) mod q</tspan><tspan x="170.0" dy="14.3">   (Відповідь / Response)</tspan></text>
<line x1="300.0" y1="210.0" x2="630.0" y2="210.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">1. Зобов'язання R = g^r mod p</text>
<line x1="630.0" y1="280.0" x2="300.0" y2="280.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">2. Випадковий виклик e ∈_R Z_q</text>
<line x1="300.0" y1="350.0" x2="630.0" y2="350.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">3. Відповідь s = r + e · x mod q</text>
<rect x="640.0" y="120.0" width="250.0" height="330.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="765.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Верифікатор (Verifier V)</text>
<text x="765.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle"><tspan x="765.0" dy="0.0">Знає лише публічний ключ Y</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">1. Чекає на R від P</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">2. Обирає випадковий</tspan><tspan x="765.0" dy="14.3">   виклик e ∈_R Z_q</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">3. Отримує відповідь s</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">4. Перевіряє тотожність:</tspan><tspan x="765.0" dy="14.3">   g^s ≡ R · Y^e mod p</tspan></text>
<rect x="210.1" y="403.5" width="509.9" height="23.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="465.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">Рівність верифікації: g^s = g^(r + e·x) = g^r · (g^x)^e = R · Y^e (mod p)</tspan></text>
</svg>