<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення періоду неперервними дробами</text>
<rect x="20.0" y="20.0" width="920.0" height="400.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="56.1" y="50.2" width="227.8" height="39.6" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="170.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Виміряне квантове значення y</tspan><tspan x="170.0" dy="15.6">(розрядність 2n біт, Q = 2²ⁿ)</tspan></text>
<line x1="295.0" y1="70.0" x2="355.0" y2="70.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="341.5" y="50.2" width="317.0" height="39.6" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/><text x="500.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Фазовий дріб θ = y / Q ∈ [0, 1)</tspan><tspan x="500.0" dy="15.6">θ ≈ s / r з похибкою |θ - s/r| &lt; 1 / (2Q)</tspan></text>
<line x1="500.0" y1="100.0" x2="500.0" y2="135.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="293.6" y="143.2" width="412.7" height="43.6" rx="6" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.5"/><text x="500.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Розклад у неперервний дріб (Continued Fraction Expansion):</tspan><tspan x="500.0" dy="15.6">θ = [a₀; a₁, a₂, a₃, ..., aₘ] = a₀ + 1/(a₁ + 1/(a₂ + ...))</tspan></text>
<line x1="500.0" y1="200.0" x2="500.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="84.7" y="255.2" width="190.6" height="39.6" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="180.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Підхідні дроби pₖ / qₖ:</tspan><tspan x="180.0" dy="15.6">p₀/q₀, p₁/q₁, p₂/q₂, ...</tspan></text>
<line x1="310.0" y1="275.0" x2="370.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="308.5" y="255.2" width="503.0" height="39.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Теорема Лежандра гарантує:</tspan><tspan x="560.0" dy="15.6">Якщо |θ - s/r| &lt; 1/(2r²), то s/r є одним із підхідних дробів pₖ/qₖ</tspan></text>
<line x1="560.0" y1="310.0" x2="560.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="325.1" y="353.2" width="469.8" height="43.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="371.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Кандидат у період: r' = qₖ. Перевірка: чи a^(qₖ) ≡ 1 (mod N)?</tspan><tspan x="560.0" dy="15.6">Якщо так — період r знайдено!</tspan></text>
</svg>