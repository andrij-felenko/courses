<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Редукція факторизації до пошуку періоду</text>
<rect x="10.0" y="10.0" width="940.0" height="520.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="235.9" y="38.0" width="488.2" height="24.0" rx="6" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.5"/><text x="480.0" y="54.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Вхід: непарне складене число N (наприклад, модуль RSA N = p · q)</tspan></text>
<line x1="480.0" y1="72.0" x2="480.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="296.4" y="109.0" width="367.1" height="22.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="480.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">1. Обрати випадкове число a ∈ {2, 3, ..., N - 1}</tspan></text>
<line x1="480.0" y1="140.0" x2="480.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="308.8" y="179.5" width="342.3" height="21.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="480.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Перевірити d = НСД(a, N) класичним алгоритмом Евкліда</tspan></text>
<line x1="670.0" y1="190.0" x2="830.0" y2="190.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="830.0" y1="190.0" x2="830.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="767.0" y="325.2" width="125.9" height="49.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Якщо d &gt; 1:</tspan><tspan x="830.0" dy="14.3">Випадковий успіх!</tspan><tspan x="830.0" dy="14.3">Дільник знайдено</tspan></text>
<line x1="830.0" y1="390.0" x2="830.0" y2="450.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="212.0" x2="480.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="291.7" y="255.2" width="376.6" height="39.6" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2.0"/><text x="480.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. Квантовий процесор (QPU):</tspan><tspan x="480.0" dy="15.6">Знайти найменший період r функції f(x) = aˣ mod N</tspan></text>
<line x1="480.0" y1="305.0" x2="480.0" y2="335.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="304.5" y="347.4" width="351.0" height="35.3" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="480.0" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">3. Перевірка придатності r:</tspan><tspan x="480.0" dy="14.3">Чи r парне (r mod 2 == 0) ТА a^(r/2) ≢ -1 (mod N)?</tspan></text>
<line x1="240.0" y1="365.0" x2="80.0" y2="365.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="80.0" y1="365.0" x2="80.0" y2="120.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="80.0" y1="120.0" x2="280.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="54.7" y="224.5" width="150.6" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">НІ (імовірність &lt; 1/2):</tspan><tspan x="130.0" dy="13.0">Обрати інше a</tspan></text>
<line x1="480.0" y1="395.0" x2="480.0" y2="440.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="272.1" y="454.2" width="415.8" height="41.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="480.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ТАК! Обчислити нетривіальні дільники:</tspan><tspan x="480.0" dy="15.6">p = НСД(a^(r/2) - 1, N)   та   q = НСД(a^(r/2) + 1, N)</tspan></text>
<line x1="830.0" y1="450.0" x2="700.0" y2="475.0" stroke="#27ae60" stroke-width="1.5"/>
</svg>