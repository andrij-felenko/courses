<svg xmlns="http://www.w3.org/2000/svg" width="900" height="466" viewBox="0 0 900 466">
<rect width="900" height="466" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь досади: машина БАЧИЛА помилку, але у вихідні просто кидала задачу</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Bell Model V зупинялася на помилці й кліпала лампами — та лиш доки поряд був оператор, що міг утрутитися</text>
<rect x="60.0" y="88.0" width="360.0" height="300.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="240.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Будні: поряд оператор</text>
<line x1="110.0" y1="150.0" x2="360.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="120.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">лічба йде…</text>
<circle cx="250.0" cy="150.0" r="9.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="250.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">!</text>
<text x="250.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">помилка → СТОП, кліпають лампи</text>
<text x="240.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оператор бачить, зупиняє,</text>
<text x="240.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">виправляє й запускає далі</text>
<rect x="150.0" y="254.0" width="180.0" height="40.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="240.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">робота врятована</text>
<text x="240.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">людина = «жива корекція помилок»</text>
<text x="240.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">але людина потрібна ПОРЯД і ЗАВЖДИ</text>
<rect x="480.0" y="88.0" width="360.0" height="300.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="660.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Вихідні: у залі нікого</text>
<line x1="530.0" y1="150.0" x2="780.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="540.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">лічба йде…</text>
<circle cx="670.0" cy="150.0" r="9.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="670.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">!</text>
<text x="660.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">та сама помилка — а втручатися нікому</text>
<text x="660.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">машина не вміє виправити сама,</text>
<text x="660.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тож просто КИДАЄ задачу й бере наступну</text>
<rect x="570.0" y="254.0" width="180.0" height="40.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="660.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">результат — у смітник</text>
<text x="660.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">у понеділок Геммінг бачив:</text>
<text x="660.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два вихідні лічби — змарновано дарма</text>
<rect x="60.0" y="404.0" width="780.0" height="50.0" rx="10" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="450.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й народилося питання: машина ВЖЕ знає, що десь є помилка (вона ж зупиняється) —</text>
<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">то чому б їй не знати ще й ДЕ ця помилка, і не виправити її без жодної людини в залі?</text>
</svg>
