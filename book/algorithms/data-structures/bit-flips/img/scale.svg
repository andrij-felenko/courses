<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Масштаб проблеми: рідкісна подія × величезний потік = постійні помилки</text>
<text x="440.0" y="57.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ймовірність помилки на біт (BER) мала, але бітів — мільярди щосекунди</text>
<text x="70.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Середовище</text>
<text x="290.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Частота помилки</text>
<text x="470.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Потік / обсяг</text>
<text x="650.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Що це означає</text>
<line x1="60.0" y1="96.0" x2="830.0" y2="96.0" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round"/>
<rect x="60.0" y="108.0" width="770.0" height="52.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="70.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#7a3da8" text-anchor="start" font-weight="bold" font-style="normal">Тиха кімната, RAM</text>
<text x="290.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 fit/Мбіт</text>
<text x="470.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сервер на 64 ГБ</text>
<text x="650.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ кілька збоїв на рік</text>
<text x="650.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<rect x="60.0" y="172.0" width="770.0" height="52.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="70.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">UART, довгий шлейф</text>
<text x="290.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">BER 10⁻⁶</text>
<text x="470.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1 Мбіт/с потік</text>
<text x="650.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ 1 битий біт за секунду</text>
<text x="650.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<rect x="60.0" y="236.0" width="770.0" height="52.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="70.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Радіо на межі</text>
<text x="290.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">BER 10⁻³</text>
<text x="470.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кадр 256 байт</text>
<text x="650.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ 2 биті біти в кадрі</text>
<text x="650.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<rect x="60.0" y="300.0" width="770.0" height="52.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="70.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Зношена NAND</text>
<text x="290.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">10⁻² на комірку</text>
<text x="470.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сторінка 16 кбіт</text>
<text x="650.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сотні бітів — без ECC мертва</text>
<text x="650.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="440.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Одна помилка на мільйон бітів здається дрібницею — поки не згадаєш, що мільйон бітів пролітає за частку секунди.</text>
</svg>
