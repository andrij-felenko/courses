<rect x="341.7" y="295.5" width="96.6" height="29.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/><text x="390.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Literal: 3</tspan></text>
