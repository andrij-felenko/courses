<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тридцять років: що додавав кожен крок</text>
<text x="66.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">рік · хто · де</text>
<text x="380.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">що додав</text>
<text x="774.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">чого ще бракувало</text>
<rect x="52.0" y="96.0" width="1036.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#d5d9de" stroke-width="1.4"/>
<text x="66.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1854 · Джордж Буль</text>
<text x="380.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">тотожність: f = ¬x·f₀ + x·f₁</text>
<text x="774.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">це алгебра, а не структура даних</text>
<rect x="52.0" y="164.0" width="1036.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#d5d9de" stroke-width="1.4"/>
<text x="66.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1937 · Клод Шеннон · MIT</text>
<text x="380.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">булева алгебра ↔ релейні схеми</text>
<text x="774.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">функція живе як формула</text>
<rect x="52.0" y="232.0" width="1036.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#d5d9de" stroke-width="1.4"/>
<text x="66.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1959 · Ч. Лі · Bell Labs</text>
<text x="380.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">форма: ланцюг умовних переходів</text>
<text x="774.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ні порядку, ні скорочень</text>
<rect x="52.0" y="300.0" width="1036.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#d5d9de" stroke-width="1.4"/>
<text x="66.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1976 · Бут (Гент) · Убар (Таллінн)</text>
<text x="380.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">машина-виконавець; графи для тестів</text>
<text x="774.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кожен під свою задачу</text>
<rect x="52.0" y="368.0" width="1036.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#d5d9de" stroke-width="1.4"/>
<text x="66.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1978 · Ш. Акерс · GE</text>
<text x="380.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">діаграма і сама назва «BDD»</text>
<text x="774.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">на одну функцію — багато діаграм</text>
<rect x="52.0" y="436.0" width="1036.0" height="58.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.4"/>
<text x="66.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">1986 · Рендел Брайант</text>
<text x="380.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">порядок + скорочення = канонічність</text>
<text x="774.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">ціна: вибір порядку; множення</text>
<rect x="52.0" y="504.0" width="1036.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="66.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1990 · Берч · Кларк · Макміллан</text>
<text x="380.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">10²⁰ станів: символьна перевірка</text>
<text x="774.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">нічого — канон уже був</text>
<text x="570.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Форма з'явилася 1959-го, назва — 1978-го. Бракувало не механізму, а запитання, заради якого варто щось заборонити.</text>
</svg>