<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="990" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="495.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">make_node — горловина, крізь яку народжується кожен вузол</text>
<line x1="612.0" y1="56.0" x2="612.0" y2="500.0" stroke="#d5d9de" stroke-width="1.4" stroke-dasharray="6,5"/>
