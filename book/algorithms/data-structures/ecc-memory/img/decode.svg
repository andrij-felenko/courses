<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SECDED у трьох рядках: ціле · виправити один · виявити два</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рішення декодера: синдром s і загальна парність g — разом</text>
<text x="470.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">s = XOR номерів позицій з одиницею  ·  g = парність усіх 72 бітів</text>
<rect x="64.0" y="111.5" width="64.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="96.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="96.0" dy="0.0">s = 0</tspan></text>
<rect x="144.0" y="111.5" width="64.0" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="176.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="176.0" dy="0.0">g = 0</tspan></text>
<line x1="260.0" y1="128.0" x2="318.0" y2="128.0" stroke="#6b7280" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="520.0" y="100.6" width="280.0" height="54.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="660.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">СЛОВО ЦІЛЕ</tspan><tspan x="660.0" dy="16.2">віддати дані як є</tspan></text>
<rect x="64.0" y="207.5" width="64.0" height="33.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/><text x="96.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="96.0" dy="0.0">g = 1</tspan></text>
<line x1="180.0" y1="224.0" x2="238.0" y2="224.0" stroke="#6b7280" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="520.0" y="196.6" width="280.0" height="54.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="660.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">ВИПРАВИТИ позицію s</tspan><tspan x="660.0" dy="16.2">перекинути біт s і віддати</tspan></text>
<rect x="64.0" y="303.5" width="64.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/><text x="96.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="96.0" dy="0.0">s ≠ 0</tspan></text>
<rect x="144.0" y="303.5" width="64.0" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/><text x="176.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="176.0" dy="0.0">g = 0</tspan></text>
<line x1="260.0" y1="320.0" x2="318.0" y2="320.0" stroke="#6b7280" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="520.0" y="292.6" width="280.0" height="54.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="660.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">ПОДВІЙНА ПОМИЛКА</tspan><tspan x="660.0" dy="16.2">тривога — дані не довіряти</tspan></text>
</svg>