<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях одного запису крізь симулятор: звідки беруться зайві записи</text>
<text x="250.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головний шлях: ftl_write()</text>
<text x="750.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підпрограма: gc_run()</text>
<rect x="80.0" y="84.0" width="340.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ftl_write(lpn, data)</tspan></text>
<line x1="250.0" y1="136.0" x2="250.0" y2="160.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="160.0" width="340.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">while (freetop &lt;= GC_LOW)</tspan><tspan x="250.0" dy="15.6">gc_run();</tspan></text>
<line x1="250.0" y1="212.0" x2="250.0" y2="236.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="236.0" width="340.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="258.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">old = map[lpn]</tspan><tspan x="250.0" dy="15.6">⚠ читати ТІЛЬКИ після gc_run()</tspan></text>
<line x1="250.0" y1="288.0" x2="250.0" y2="312.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="312.0" width="340.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">new = alloc_page()</tspan><tspan x="250.0" dy="15.6">(може зняти блок із пулу)</tspan></text>
<line x1="250.0" y1="364.0" x2="250.0" y2="388.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="388.0" width="340.0" height="52.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="410.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">flash_program(new, data)</tspan><tspan x="250.0" dy="15.6">host_w++    flash_w++</tspan></text>
<line x1="250.0" y1="440.0" x2="250.0" y2="464.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="464.0" width="340.0" height="52.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="494.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">map[lpn] = new</tspan></text>
<line x1="250.0" y1="516.0" x2="250.0" y2="540.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="80.0" y="540.0" width="340.0" height="52.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="562.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="250.0" dy="0.0">pstate[old] = P_INVALID</tspan><tspan x="250.0" dy="15.6">invalid_cnt[old / PPB]++</tspan></text>
<rect x="560.0" y="160.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">v = pick_victim()</tspan><tspan x="750.0" dy="14.3">блок із найбільшим invalid_cnt</tspan></text>
<line x1="750.0" y1="212.0" x2="750.0" y2="236.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="236.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="258.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">для кожної ЧИННОЇ сторінки блоку:</tspan><tspan x="750.0" dy="14.3">dst = alloc_page();  map[powner]=dst</tspan></text>
<line x1="750.0" y1="288.0" x2="750.0" y2="312.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="312.0" width="380.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="334.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">flash_w++    gc_copies++</tspan><tspan x="750.0" dy="14.3">⚠ записи, яких хост НЕ просив</tspan></text>
<line x1="750.0" y1="364.0" x2="750.0" y2="388.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="388.0" width="380.0" height="52.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="410.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">стерти весь блок v</tspan><tspan x="750.0" dy="14.3">erase_cnt[v]++</tspan></text>
<line x1="750.0" y1="440.0" x2="750.0" y2="464.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="464.0" width="380.0" height="52.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="486.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">push_free(v)</tspan><tspan x="750.0" dy="14.3">блок повертається в пул</tspan></text>
<line x1="420.0" y1="186.0" x2="558.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="489.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">пул майже порожній</text>
<polyline points="558,490 500,490 500,262 424,262" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="560.0" y="528.0" width="380.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">WA = flash_w / host_w</tspan><tspan x="750.0" dy="15.6">чисельник росте у ДВОХ місцях: тут і в gc_run()</tspan></text>
