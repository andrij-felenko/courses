<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди переїхав FTL: назва й алгоритм лишилися, місце змінилося</text>
<rect x="136.5" y="59.0" width="237.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="80.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">1992–1996: розум на хості</tspan></text>
<rect x="593.5" y="59.0" width="263.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="80.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Сьогодні: розум у контролері</tspan></text>
<line x1="490.0" y1="108.0" x2="490.0" y2="176.0" stroke="#d8dee4" stroke-width="1.2"/>
<line x1="490.0" y1="226.0" x2="490.0" y2="372.0" stroke="#d8dee4" stroke-width="1.2"/>
<rect x="85.0" y="108.0" width="340.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">DOS + FAT</tspan></text>
<line x1="255.0" y1="154.0" x2="255.0" y2="172.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="85.0" y="174.0" width="340.0" height="50.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Драйвер FTL (TrueFFS) на хості</tspan></text>
<line x1="255.0" y1="226.0" x2="255.0" y2="244.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="85.0" y="246.0" width="340.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Лінійна NOR-картка:</tspan><tspan x="255.0" dy="15.6">самі мікросхеми, без розуму</tspan></text>
<text x="255.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Картка дурна, чужа й дешева.</text>
<text x="255.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Брехню веде програма на комп'ютері.</text>
<rect x="555.0" y="108.0" width="340.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">ОС + файлова система</tspan></text>
<line x1="725.0" y1="154.0" x2="725.0" y2="172.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="555.0" y="174.0" width="340.0" height="50.0" rx="6" fill="#e8f5ee" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Контролер: прошивка з FTL</tspan></text>
<line x1="725.0" y1="226.0" x2="725.0" y2="244.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="555.0" y="246.0" width="340.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">NAND-мікросхеми</tspan><tspan x="725.0" dy="15.6">всередині коробки</tspan></text>
<text x="725.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Носій ззовні — звичайний диск.</text>
<text x="725.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Брехню веде він сам, хост не знає.</text>
<text x="490.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">переїхав</text>
<line x1="429.0" y1="202.0" x2="551.0" y2="202.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="392.0" width="800.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="415.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Місце програло: розум переїхав усередину носія — туди, куди його від початку клала кремнієва школа.</tspan><tspan x="490.0" dy="15.6">Алгоритм переміг: у тому контролері працює дисципліна, яку склала системна.</tspan></text>
</svg>