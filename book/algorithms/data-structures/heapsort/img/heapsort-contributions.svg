<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три подарунки, одна назва — і 33 роки до діла</text>
<rect x="70.0" y="64.0" width="740.0" height="96.0" rx="8" fill="#eef2fb" stroke="#333333" stroke-width="1.4"/>
<rect x="70.0" y="64.0" width="8.0" height="96.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="148.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#2457d6" text-anchor="middle" font-weight="700">1964</text>
<text x="148.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джон Вільямс</text>
<text x="148.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">британець</text>
<line x1="226.0" y1="80.0" x2="226.0" y2="144.0" stroke="#333333" stroke-width="1.0"/>
<text x="246.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="start" font-weight="700">Ідея + структура</text>
<text x="246.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="246.0" dy="0.0">Купа сортує на місці; O(n log n) гарантовано.</tspan><tspan x="246.0" dy="16.2">Та будував купу згори — зайві O(n log n).</tspan></text>
<rect x="70.0" y="172.0" width="740.0" height="96.0" rx="8" fill="#eaf7f0" stroke="#333333" stroke-width="1.4"/>
<rect x="70.0" y="172.0" width="8.0" height="96.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="148.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#27ae60" text-anchor="middle" font-weight="700">1964</text>
<text x="148.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роберт Флойд</text>
<text x="148.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">американець</text>
<line x1="226.0" y1="188.0" x2="226.0" y2="252.0" stroke="#333333" stroke-width="1.0"/>
<text x="246.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="start" font-weight="700">Ефективна форма на місці</text>
<text x="246.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="246.0" dy="0.0">Побудова знизу за O(n); чистий спуск на місці.</tspan><tspan x="246.0" dy="16.2">Форма, якою heapsort пишуть досі. З його treesort.</tspan></text>
<rect x="70.0" y="280.0" width="740.0" height="96.0" rx="8" fill="#fbf4e6" stroke="#333333" stroke-width="1.4"/>
<rect x="70.0" y="280.0" width="8.0" height="96.0" rx="0" fill="#c98a17" stroke="#c98a17" stroke-width="0.0"/>
<text x="148.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#c98a17" text-anchor="middle" font-weight="700">1997</text>
<text x="148.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Девід Массер</text>
<text x="148.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">американець</text>
<line x1="226.0" y1="296.0" x2="226.0" y2="360.0" stroke="#333333" stroke-width="1.0"/>
<text x="246.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c98a17" text-anchor="start" font-weight="700">Гібрид — і справжня робота</text>
<text x="246.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="246.0" dy="0.0">introsort: quicksort для швидкості + heapsort-запобіжник.</tspan><tspan x="246.0" dy="16.2">Лежить у std::sort — і майже ніколи не спрацьовує.</tspan></text>
<rect x="70.0" y="392.0" width="740.0" height="48.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="440.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">«heapsort», який ти запускаєш = ідея Вільямса + форма Флойда,</tspan><tspan x="440.0" dy="17.6">а introsort (1997) дав цій формі роботу — усередині std::sort</tspan></text>
</svg>