<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зважена вибірка з резервуара: метод випадкових ключів та мін-купа</text>
<rect x="15.0" y="45.0" width="360.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="195.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Потік із вагами (A-Res / A-ExpJ)</text>
<rect x="32.5" y="96.3" width="325.0" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Елемент e[1]: вага w[1]=10</tspan><tspan x="195.0" dy="14.3">Ключ r[1] = -ln(u[1]) / 10 = 0.042</tspan></text>
<rect x="32.5" y="161.3" width="325.0" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Елемент e[2]: вага w[2]=2</tspan><tspan x="195.0" dy="14.3">Ключ r[2] = -ln(u[2]) / 2  = 0.693</tspan></text>
<rect x="32.5" y="226.3" width="325.0" height="37.3" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Новий e[i]: вага w[i]=50</tspan><tspan x="195.0" dy="14.3">Ключ r[i] = -ln(u[i]) / 50 = 0.015</tspan></text>
<text x="195.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">u ~ Uniform(0, 1), більша вага → менший r[i]</text>
<line x1="380.0" y1="190.0" x2="435.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="407.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">r[i]</text>
<rect x="445.0" y="45.0" width="360.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="625.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Резервуар як мін-купа (розмір k=3)</text>
<rect x="485.0" y="101.3" width="280.0" height="37.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Корінь (мінімум): r = 0.693 (e[2])</tspan><tspan x="625.0" dy="14.3">Найгірший кандидат у вибірці</tspan></text>
<line x1="580.0" y1="145.0" x2="535.0" y2="185.0" stroke="#333333" stroke-width="1.5"/>
<line x1="670.0" y1="145.0" x2="715.0" y2="185.0" stroke="#333333" stroke-width="1.5"/>
<rect x="457.5" y="196.3" width="125.0" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">r = 0.150</tspan><tspan x="520.0" dy="14.3">(елемент e[7])</tspan></text>
<rect x="667.5" y="196.3" width="125.0" height="37.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">r = 0.042</tspan><tspan x="730.0" dy="14.3">(елемент e[1])</tspan></text>
<rect x="470.0" y="276.4" width="310.0" height="37.3" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Якщо r[новий] &lt; r[корінь]:</tspan><tspan x="625.0" dy="14.3">Видалити корінь, вставити новий за O(log k)</tspan></text>
</svg>