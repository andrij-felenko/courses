<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм заміни слота в алгоритмі вибірки з резервуара (Algorithm R)</text>
<rect x="15.0" y="45.0" width="230.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="265.0" y="45.0" width="260.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="545.0" y="45.0" width="260.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="130.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний потік даних</text>
<text x="395.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рішення на кроці n+1</text>
<text x="675.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резервуар (розмір k=3)</text>
<rect x="35.0" y="100.5" width="190.0" height="29.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">x[1] ... x[n]</tspan></text>
<rect x="35.0" y="160.5" width="190.0" height="29.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Новий елемент x[n+1]</tspan></text>
<rect x="35.0" y="220.5" width="190.0" height="29.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Наступні x[n+2] ...</tspan></text>
<text x="130.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повна довжина N невідома</text>
<line x1="225.0" y1="175.0" x2="280.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="295.0" y="100.2" width="200.0" height="39.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Генерація індексу:</tspan><tspan x="395.0" dy="15.6">j = RandInt(1, n+1)</tspan></text>
<line x1="395.0" y1="148.0" x2="395.0" y2="175.0" stroke="#333333" stroke-width="1.5"/>
<line x1="330.0" y1="175.0" x2="460.0" y2="175.0" stroke="#333333" stroke-width="1.5"/>
<line x1="460.0" y1="175.0" x2="460.0" y2="205.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="406.3" y="214.2" width="107.5" height="51.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">j ≤ k</tspan><tspan x="460.0" dy="14.3">Шанс: k/(n+1)</tspan><tspan x="460.0" dy="14.3">Запис у R[j-1]</tspan></text>
<line x1="330.0" y1="175.0" x2="330.0" y2="205.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="266.0" y="214.2" width="127.9" height="51.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">j &gt; k</tspan><tspan x="330.0" dy="14.3">Шанс: 1 - k/(n+1)</tspan><tspan x="330.0" dy="14.3">Пропуск</tspan></text>
<text x="395.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Збереження: P = n/(n+1)</text>
<line x1="515.0" y1="240.0" x2="560.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="565.0" y="111.0" width="220.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Слот R[0]: x[17]</tspan></text>
<rect x="562.8" y="171.0" width="224.3" height="28.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Слот R[1]: x[n+1] (замінено)</tspan></text>
<rect x="565.0" y="231.0" width="220.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Слот R[2]: x[42]</tspan></text>
<text x="675.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Для кожного: P(в резервуарі) = k/(n+1)</text>
</svg>