<rect x="40.0" y="260.0" width="370.0" height="95.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="225.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Слабкий хеш (наприклад, sum(bytes)):</tspan><tspan x="225.0" dy="14.3"></tspan><tspan x="225.0" dy="14.3">• Зміна 1 біта вхідних даних змінює лише 1-2 біти виходу</tspan><tspan x="225.0" dy="14.3">• Результат скупчується, колізії високі</tspan></text>
<rect x="450.0" y="260.0" width="370.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="635.0" y="291.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Якісний хеш (Murmur3 / xxHash / Wyhash):</tspan><tspan x="635.0" dy="13.0"></tspan><tspan x="635.0" dy="13.0">• Кожен вхідний біт інвертує кожен вихідний біт із P = 50%</tspan><tspan x="635.0" dy="13.0">• Проходить тести SMHasher, відсутні масиви колізій</tspan></text>
