<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий підмасив: класичний випадок проти циклічного обгортання</text>
<rect x="30.0" y="118.0" width="360.0" height="114.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Випадок 1: Лінійний підмасив (без переходу)</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">• Оптимальний підмасив лежить суцільно всередині:</tspan><tspan x="210.0" dy="15.6">  [ ... |  МАКСИМУМ  | ... ]</tspan><tspan x="210.0" dy="15.6">• Знаходиться звичайним 1D Кадане</tspan><tspan x="210.0" dy="15.6">• Результат: max_kadane</tspan></text>
<text x="210.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Варіант А: Звичайний максимум</text>
<rect x="430.0" y="118.0" width="360.0" height="114.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="610.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Випадок 2: Циклічне обгортання через краї</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">• Максимум складається з префікса й суфікса:</tspan><tspan x="610.0" dy="15.6">  [ МАКС_1 |  МІНІМУМ  | МАКС_2 ]</tspan><tspan x="610.0" dy="15.6">• Еквівалент: total_sum − min_kadane</tspan><tspan x="610.0" dy="15.6">• Вирізаємо серцевину з мінімальною сумою</tspan></text>
<text x="610.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b7950b" text-anchor="middle" font-weight="700">Варіант Б: Циклічний максимум</text>
<rect x="50.0" y="295.0" width="720.0" height="48.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="410.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Критичний крайовий випадок: Усі елементи масиву від'ємні!</text>
<text x="410.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Якщо total_sum == min_kadane (порожній залишок), відповіддю є max_kadane, а не 0</text>
</svg>