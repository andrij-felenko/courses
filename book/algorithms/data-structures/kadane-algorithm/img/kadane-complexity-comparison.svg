<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція складності задачі про максимальний підмасив</text>
<rect x="9.9" y="128.0" width="270.2" height="114.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Наївний перебір O(N³)</tspan><tspan x="145.0" dy="15.6">3 вкладені цикли:</tspan><tspan x="145.0" dy="15.6">• початок i від 0 до N-1</tspan><tspan x="145.0" dy="15.6">• кінець j від i до N-1</tspan><tspan x="145.0" dy="15.6">• підсумовування k від i до j</tspan><tspan x="145.0" dy="15.6">Обчислення з нуля для кожного [i..j]</tspan></text>
<text x="145.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний алгоритм</text>
<text x="145.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Час: O(N³) | Пам'ять: O(1)</text>
<line x1="265.0" y1="185.0" x2="305.0" y2="185.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="295.0" y="128.0" width="230.0" height="114.0" rx="6" fill="#fbf8e8" stroke="#d4ac0d" stroke-width="1.5"/><text x="410.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Префіксні суми O(N²)</tspan><tspan x="410.0" dy="15.6">2 вкладені цикли:</tspan><tspan x="410.0" dy="15.6">• масив префіксів P[k]</tspan><tspan x="410.0" dy="15.6">• сума [i..j] = P[j+1] - P[i]</tspan><tspan x="410.0" dy="15.6">• обчислення суми за O(1)</tspan><tspan x="410.0" dy="15.6">Перебір N(N+1)/2 пар індексів</tspan></text>
<text x="410.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b7950b" text-anchor="middle" font-weight="700">Префіксна оптимізація</text>
<text x="410.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7950b" text-anchor="middle" font-weight="700">Час: O(N²) | Пам'ять: O(N)</text>
<line x1="530.0" y1="185.0" x2="570.0" y2="185.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="543.3" y="128.0" width="263.4" height="114.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Алгоритм Кадане O(N)</tspan><tspan x="675.0" dy="15.6">1 лінійний прохід:</tspan><tspan x="675.0" dy="15.6">• динамічний стан на кроці i</tspan><tspan x="675.0" dy="15.6">• S[i] = max(A[i], S[i-1] + A[i])</tspan><tspan x="675.0" dy="15.6">• оновлення глобального max</tspan><tspan x="675.0" dy="15.6">Скидання при від'ємному накопиченні</tspan></text>
<text x="675.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Динамічне програмування</text>
<text x="675.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Час: O(N) | Пам'ять: O(1)</text>
</svg>