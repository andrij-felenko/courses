<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Apply: комбінуємо дві діаграми розкладом за спільною змінною</text>
<rect x="305.8" y="62.2" width="408.4" height="39.5" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">(f ∧ g)  =  ¬x·(f₀ ∧ g₀)  +  x·(f₁ ∧ g₁)</tspan></text>
<text x="510.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">розклали обидві за верхньою змінною x — і так само рекурсивно на кофакторах</text>
<line x1="500.0" y1="194.0" x2="336.0" y2="272.0" stroke="#2457d6" stroke-width="1.7" stroke-dasharray="5,4"/>
<line x1="520.0" y1="194.0" x2="684.0" y2="272.0" stroke="#1a1a1a" stroke-width="1.9"/>
<line x1="316.0" y1="304.0" x2="222.0" y2="384.0" stroke="#2457d6" stroke-width="1.7" stroke-dasharray="5,4"/>
<line x1="336.0" y1="304.0" x2="408.0" y2="384.0" stroke="#1a1a1a" stroke-width="1.9"/>
<line x1="684.0" y1="304.0" x2="612.0" y2="384.0" stroke="#2457d6" stroke-width="1.7" stroke-dasharray="5,4"/>
<line x1="704.0" y1="304.0" x2="798.0" y2="384.0" stroke="#1a1a1a" stroke-width="1.9"/>
<rect x="475.9" y="162.2" width="68.2" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">(f, g)</tspan></text>
<rect x="283.5" y="272.2" width="85.0" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="326.0" y="292.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="326.0" dy="0.0">(f₀, g₀)</tspan></text>
<rect x="651.5" y="272.2" width="85.0" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="694.0" y="292.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="694.0" dy="0.0">(f₁, g₁)</tspan></text>
<rect x="179.9" y="384.2" width="68.2" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="214.0" y="404.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="214.0" dy="0.0">(p, q)</tspan></text>
<rect x="381.9" y="384.2" width="68.2" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="416.0" y="404.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="416.0" dy="0.0">(r, s)</tspan></text>
<rect x="569.9" y="384.2" width="68.2" height="31.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="604.0" y="404.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="604.0" dy="0.0">(r, s)</tspan></text>
<rect x="771.9" y="384.2" width="68.2" height="31.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="806.0" y="404.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="806.0" dy="0.0">(u, v)</tspan></text>
<line x1="556.0" y1="400.0" x2="464.0" y2="400.0" stroke="#8e44ad" stroke-width="2.0" stroke-dasharray="6,4"/>
<polygon points="464.0,400.0 476.0,395.0 476.0,405.0" fill="#8e44ad"/>
<text x="510.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">кеш: та сама пара — не рахуємо вдруге</text>
<rect x="133.2" y="447.2" width="161.6" height="45.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="214.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="214.0" dy="0.0">термінал:</tspan><tspan x="214.0" dy="15.6">0 ∧ g = 0,  1 ∧ g = g</tspan></text>
<rect x="626.0" y="445.6" width="268.0" height="48.8" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="466.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">різних пар — щонайбільше |f|·|g|</tspan><tspan x="760.0" dy="16.2">→ стільки ж і роботи</tspan></text>
<text x="510.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Наївно розклад дав би дерево на 2ⁿ листків; кеш пар (f,g) робить його лінійним за розміром обох діаграм.</text>
</svg>