<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канонічність: різні записи однієї функції злипаються в одну діаграму</text>
<text x="196.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Три записи «більшості з a, b, c»</text>
<rect x="114.2" y="128.5" width="163.5" height="39.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="196.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="196.0" dy="0.0">a·b + b·c + a·c</tspan></text>
<rect x="114.2" y="194.5" width="163.5" height="39.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="196.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="196.0" dy="0.0">a·b + c·(a + b)</tspan></text>
<rect x="105.0" y="260.5" width="182.1" height="39.0" rx="6" fill="#f0f7f1" stroke="#27ae60" stroke-width="1.5"/><text x="196.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="196.0" dy="0.0">(a+b)·(b+c)·(a+c)</tspan></text>
<text x="196.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">різні формули — одна функція</text>
<text x="196.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">порівняти їх як тексти — марно</text>
<line x1="322.0" y1="232.0" x2="452.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
