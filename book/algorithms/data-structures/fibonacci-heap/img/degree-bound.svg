<rect x="70.0" y="524.0" width="840.0" height="82.0" rx="6" fill="#f0f5ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="562.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Коли yᵢ приєднали до x, діти y₁…yᵢ₋₁ вже висіли на x ⇒ степінь x тоді був ≥ i−1. Зв'язують лише рівних за степенем ⇒ deg(yᵢ) = deg(x) ≥ i−1; відтоді yᵢ втратив щонайбільше одну дитину ⇒ deg(yᵢ) ≥ i−2.</tspan><tspan x="490.0" dy="10.4">Тому мінімум вузлів: sₖ ≥ 1 + s₀ + s₀ + s₁ + s₂ + … + sₖ₋₂.</tspan></text>
