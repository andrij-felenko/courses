<text x="622.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Випадок B: Ортогональні вектори (θ = 90°)</text>
<line x1="495.0" y1="217.0" x2="775.0" y2="217.0" stroke="#b0b0b0" stroke-width="1.0" marker-end="url(#arrow)"/>
