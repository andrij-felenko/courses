<polyline points="539.2,212.3 534.5,198.0 520.3,202.8" fill="none" stroke="#d97706" stroke-width="1.5"/>
<text x="540.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">90°</text>
<rect x="455.0" y="247.0" width="335.0" height="95.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
