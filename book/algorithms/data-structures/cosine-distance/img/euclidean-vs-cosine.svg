<line x1="135.0" y1="167.0" x2="220.0" y2="82.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="142.5" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">d_E = 4.24</text>
