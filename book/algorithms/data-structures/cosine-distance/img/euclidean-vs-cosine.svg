<rect x="0.0" y="0.0" width="840.0" height="390.0" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння Евклідової та Косинусної відстані при зміні масштабу</text>
