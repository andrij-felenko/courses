<text x="217.5" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Евклідова відстань d_E(u, v) = 4.24 (велика)</text>
<text x="217.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Косинусна схожість cos(θ) = 1.0 (збіг)</text>
<text x="217.5" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Косинусна відстань d_cos(u, v) = 0.0 (збіг)</text>
