<text x="622.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Косинусна схожість cos(θ) = 0.0 (немає зв'язку)</text>
<text x="622.5" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Косинусна відстань d_cos(u, w) = 1.0 (ортогонально)</text>
<text x="420.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Евклідова відстань чутлива до абсолютного розміру об'єкта, тоді як косинусна оцінює лише семантичний напрямок.</text>
