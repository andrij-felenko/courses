<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема гістерезисного керування місткістю</text>
<rect x="50.0" y="60.0" width="840.0" height="340.0" rx="10" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.3"/>
<rect x="117.2" y="203.1" width="225.5" height="53.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Місткість = C</tspan><tspan x="230.0" dy="16.9">(Заповнення: N елементів)</tspan></text>
<rect x="605.3" y="203.1" width="209.4" height="53.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Місткість = 2C</tspan><tspan x="710.0" dy="16.9">(Розширення при N == C)</tspan></text>
<line x1="350.0" y1="200.0" x2="590.0" y2="200.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вставка (push): N сягає C  →  Розширення вдвічі (× 2)</text>
<line x1="590.0" y1="280.0" x2="350.0" y2="280.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вилучення (pop): N падає до C/4  →  Стиснення вдвічі (÷ 2)</text>
<rect x="310.0" y="340.0" width="320.0" height="34.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.3"/>
<text x="470.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буферна зона гістерезису (захист від Anti-Thrashing)</text>
<rect x="90.0" y="424.0" width="760.0" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="443.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Гістерезис запобігає частим реалокаціям при почерговому додаванні та видаленні елементів на межі місткості</tspan></text>
</svg>