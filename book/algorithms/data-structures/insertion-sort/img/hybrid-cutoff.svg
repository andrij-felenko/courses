<text x="165.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700">Insertion Sort</text>
<line x1="90.0" y1="280.0" x2="90.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="90.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<line x1="165.0" y1="280.0" x2="165.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="165.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">16</text>
<line x1="240.0" y1="280.0" x2="240.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="240.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">32</text>
