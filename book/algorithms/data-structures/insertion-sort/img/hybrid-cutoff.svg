<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поріг перемикання алгоритмів у гібридних сортуваннях</text>
<line x1="90.0" y1="280.0" x2="470.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.8"/>
