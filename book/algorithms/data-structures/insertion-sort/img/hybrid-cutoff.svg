<text x="390.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">64</text>
<line x1="240.0" y1="280.0" x2="240.0" y2="100.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="240.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пороговий перетин N ≈ 16..32</text>
<polyline points="90.0,275.0 105.0,272.3 120.0,268.5 135.0,263.8 150.0,258.1 165.0,251.4 180.0,243.7 195.0,235.0 210.0,225.3 225.0,214.7 240.0,203.0 255.0,190.4 270.0,176.7 285.0,162.1 300.0,146.5 315.0,129.9 330.0,112.3 345.0,95.0 360.0,95.0 375.0,95.0 390.0,95.0 405.0,95.0" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
<text x="350.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700">Insertion Sort (O(N²))</text>
<polyline points="90.0,235.0 105.0,229.2 120.0,223.2 135.0,217.1 150.0,210.8 165.0,204.2 180.0,197.6 195.0,190.7 210.0,183.6 225.0,176.4 240.0,169.0 255.0,161.4 270.0,153.6 285.0,145.7 300.0,137.6 315.0,129.2 330.0,120.8 345.0,112.1 360.0,103.2 375.0,95.0 390.0,95.0 405.0,95.0" fill="none" stroke="#2457d6" stroke-width="2.5"/>
<text x="380.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Quicksort (O(N log N))</text>
<rect x="500.0" y="65.0" width="290.0" height="245.0" rx="6" fill="#f8f9fa" stroke="#cfd8dc" stroke-width="1.5"/><text x="645.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Чому гібридні сортування перемикаються:</tspan><tspan x="645.0" dy="11.7"></tspan><tspan x="645.0" dy="11.7">1. Нульовий оверхед виклику:</tspan><tspan x="645.0" dy="11.7">   Quicksort/Mergesort витрачають 30–50 нс</tspan><tspan x="645.0" dy="11.7">   на створення стекового кадру рекурсії.</tspan><tspan x="645.0" dy="11.7"></tspan><tspan x="645.0" dy="11.7">2. Кеш-локальність L1:</tspan><tspan x="645.0" dy="11.7">   Підмасив із 16–32 чисел (64–128 байтів)</tspan><tspan x="645.0" dy="11.7">   повністю вміщується в 1–2 кеш-лінії CPU.</tspan><tspan x="645.0" dy="11.7"></tspan><tspan x="645.0" dy="11.7">3. Відсутність branch mispredictions:</tspan><tspan x="645.0" dy="11.7">   На малих впорядкованих відрізках процесор</tspan><tspan x="645.0" dy="11.7">   передбачає переходи з точністю &gt;98%.</tspan><tspan x="645.0" dy="11.7"></tspan><tspan x="645.0" dy="11.7">Використовується в: Timsort, std::sort (Introsort).</tspan></text>
</svg>