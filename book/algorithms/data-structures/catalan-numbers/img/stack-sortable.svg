<text x="80.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">• Перестановка посортовна одним стеком ⇔ вона НЕ містить підпослідовності типу 2-3-1.</text>
<text x="80.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">• Для елемента 1 попереду стоїть більший елемент 3, який передує меншому 2 у виході.</text>
<text x="80.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">• Кількість посортовних одним стеком перестановок довжини n дорівнює точно Cₙ.</text>
