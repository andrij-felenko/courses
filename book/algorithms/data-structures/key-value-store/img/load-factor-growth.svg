<rect x="18.0" y="352.0" width="480.0" height="60.0" rx="6" fill="#f7f8fa" stroke="#27ae60" stroke-width="1.6"/><text x="258.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">копіювань разом: 1+2+4+8+16+32 = 63 &lt; 2n</tspan><tspan x="258.0" dy="16.9">останнє важить більше за всі попередні разом</tspan></text>
