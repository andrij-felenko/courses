<rect x="522.0" y="352.0" width="480.0" height="60.0" rx="6" fill="#f7f8fa" stroke="#c0392b" stroke-width="1.6"/><text x="762.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">копіювань разом: 8+16+…+56 = 224  ≈  n²/(2c)</tspan><tspan x="762.0" dy="16.9">жодне не мале — сума росте квадратично</tspan></text>
<rect x="50.0" y="428.0" width="920.0" height="54.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="510.0" y="451.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Обидві таблиці дійшли до n = 64. Подвоєння: 63 копіювання. Приріст на 8: 224 — і розрив росте разом з n:</tspan><tspan x="510.0" dy="15.6">при n = 10⁶ подвоєння дає ≈ 10⁶ копіювань, а приріст на 1000 — ≈ 5·10⁸: у 500 разів більше.</tspan></text>
