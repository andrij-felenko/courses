<line x1="354.0" y1="414.0" x2="466.0" y2="314.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="921.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">власне Dynamo</text>
<rect x="762.0" y="150.0" width="318.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#b7791f" stroke-width="1.8"/><text x="921.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="921.0" dy="0.0">своє: нещільний кворум,</tspan><tspan x="921.0" dy="15.6">підказана передача (hinted handoff),</tspan><tspan x="921.0" dy="15.6">віртуальні вузли</tspan></text>
<rect x="762.0" y="300.0" width="318.0" height="90.0" rx="6" fill="#fff6e0" stroke="#b7791f" stroke-width="1.8"/><text x="921.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="921.0" dy="0.0">і головне — це працювало</tspan><tspan x="921.0" dy="15.6">на бойових замовленнях</tspan><tspan x="921.0" dy="15.6">і про це надрукували статтю</tspan></text>
<line x1="694.0" y1="240.0" x2="758.0" y2="206.0" stroke="#b7791f" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="694.0" y1="290.0" x2="758.0" y2="345.0" stroke="#b7791f" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="460.0" width="1040.0" height="74.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="560.0" y="485.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Жодна з п'яти частин ліворуч не Amazonова, а найстаршій тут майже тридцять років.</tspan><tspan x="560.0" dy="15.6">Внесок Dynamo — не примітив, а система: дібрати частини під одну вимогу «ніколи не казати ні»,</tspan><tspan x="560.0" dy="15.6">змусити їх працювати разом на живому кошику покупця — і розповісти про це вголос.</tspan></text>
