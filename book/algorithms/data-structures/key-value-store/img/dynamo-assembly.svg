<rect x="40.0" y="148.0" width="310.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1979 · Дерева Меркла</tspan><tspan x="195.0" dy="15.6">Ральф Меркл, патент США</tspan></text>
<rect x="40.0" y="226.0" width="310.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1987 · Gossip / anti-entropy</tspan><tspan x="195.0" dy="15.6">Demers та ін., PODC, Xerox PARC</tspan></text>
<rect x="40.0" y="304.0" width="310.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1988 · Векторні годинники</tspan><tspan x="195.0" dy="15.6">Фідж і Маттерн, незалежно один від одного</tspan></text>
<rect x="40.0" y="382.0" width="310.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="410.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1997 · Консистентне хешування</tspan><tspan x="195.0" dy="15.6">Каргер, Леман, Лейтон, Левін та ін., STOC</tspan></text>
