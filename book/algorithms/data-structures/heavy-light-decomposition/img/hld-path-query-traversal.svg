<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покрокова декомпозиція запиту на шляху між вершинами u=8 та v=11</text>
<rect x="60.0" y="100.0" width="270.0" height="240.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.0"/>
<text x="195.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d4ac0d" text-anchor="middle" font-weight="700">Крок 1: Обробка вершини u=8</text>
<line x1="75.0" y1="142.0" x2="315.0" y2="142.0" stroke="#d4ac0d" stroke-width="1.0"/>
<rect x="72.0" y="152.0" width="246.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="195.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">head[8] = 4 (глибина голови = 2)</tspan><tspan x="195.0" dy="15.6">head[11] = 3 (глибина голови = 1)</tspan></text>
<rect x="72.0" y="220.0" width="246.0" height="105.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.5"/><text x="195.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">u глибше за v за головою:</tspan><tspan x="195.0" dy="13.0">1. Запит відрізка [pos[4]..pos[8]]</tspan><tspan x="195.0" dy="13.0">   у Segment Tree: [6..7]</tspan><tspan x="195.0" dy="13.0">2. Стрибок u = parent[4] = 2</tspan></text>
<rect x="345.0" y="100.0" width="270.0" height="240.0" rx="8" fill="#e8f8f5" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 2: Обробка вершини v=11</text>
<line x1="360.0" y1="142.0" x2="600.0" y2="142.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="357.0" y="152.0" width="246.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="480.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">u = 2 (head[2] = 1, depth=0)</tspan><tspan x="480.0" dy="15.6">v = 11 (head[11] = 3, depth=1)</tspan></text>
<rect x="357.0" y="220.0" width="246.0" height="105.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">v глибше за u за головою:</tspan><tspan x="480.0" dy="13.0">1. Запит відрізка [pos[3]..pos[11]]</tspan><tspan x="480.0" dy="13.0">   у Segment Tree: [8..10]</tspan><tspan x="480.0" dy="13.0">2. Стрибок v = parent[3] = 1</tspan></text>
<rect x="630.0" y="100.0" width="270.0" height="240.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="765.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Крок 3: Фінал на спільному ланцюгу</text>
<line x1="645.0" y1="142.0" x2="885.0" y2="142.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="642.0" y="152.0" width="246.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="765.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">u = 2, v = 1</tspan><tspan x="765.0" dy="15.6">head[u] == head[v] == 1 (LCA = 1)</tspan></text>
<rect x="642.0" y="220.0" width="246.0" height="105.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="765.0" y="256.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">Обидві вершини в одному ланцюгу:</tspan><tspan x="765.0" dy="13.0">1. Запит відрізка [pos[1]..pos[2]]</tspan><tspan x="765.0" dy="13.0">   у Segment Tree: [0..1]</tspan><tspan x="765.0" dy="13.0">2. Алгоритм завершено!</tspan></text>
<line x1="330.0" y1="220.0" x2="345.0" y2="220.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="615.0" y1="220.0" x2="630.0" y2="220.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="370.0" width="840.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="401.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Підсумок: Шлях 8 ~ 11 довжиною 5 ребер розбито на 3 запити до дерева відрізків: [6..7] + [8..10] + [0..1].</tspan><tspan x="480.0" dy="15.6">Загальна складність запиту = O(кількість ланцюгів · час запиту Segment Tree) = O(log N · log N) = O(log² N).</tspan></text>
</svg>