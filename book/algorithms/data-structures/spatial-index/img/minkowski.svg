<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири доданки формули — чотири шматки роздутої коробки</text>
<rect x="110.0" y="260.0" width="75.0" height="60.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<rect x="110.0" y="95.0" width="75.0" height="165.0" rx="0" fill="#e8effb" stroke="#2457d6" stroke-width="1.2"/>
<rect x="185.0" y="260.0" width="215.0" height="60.0" rx="0" fill="#e8effb" stroke="#2457d6" stroke-width="1.2"/>
<rect x="185.0" y="95.0" width="215.0" height="165.0" rx="0" fill="#e6f7ec" stroke="#27ae60" stroke-width="2.2"/>
<rect x="110.0" y="95.0" width="290.0" height="225.0" rx="0" fill="none" stroke="#2457d6" stroke-width="2.4" stroke-dasharray="7,5"/>
<rect x="110.0" y="20.0" width="55.0" height="44.0" rx="0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="110.0" cy="64.0" r="3.4" fill="#c0392b" stroke="#c0392b" stroke-width="0.6"/>
<text x="180.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">вікно запиту qw × qh</text>
<text x="292.5" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">коробка R:  w × h</text>
<text x="292.5" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">w·h</text>
<text x="147.5" y="177.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">h·qw</text>
<text x="292.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">w·qh</text>
<text x="147.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">qw·qh</text>
<text x="147.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">qw</text>
<text x="292.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">w</text>
<text x="98.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">qh</text>
<text x="414.0" y="181.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">h</text>
<text x="255.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">рамка — усі положення кута вікна, за яких воно зачіпає R</text>
<text x="255.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">її площа = (w + qw)(h + qh)</text>
<rect x="557.4" y="95.0" width="205.2" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">(w + qw)(h + qh) =</tspan><tspan x="660.0" dy="16.9">w·h + h·qw + w·qh + qw·qh</tspan></text>
<rect x="538.9" y="185.1" width="242.3" height="49.9" rx="6" fill="#e6f7ec" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">w·h — площа коробки: єдине, що</tspan><tspan x="660.0" dy="16.9">лишається при точковому запиті</tspan></text>
<rect x="524.0" y="267.1" width="271.9" height="49.9" rx="6" fill="#e8effb" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">h·qw + w·qh — за квадратного вікна</tspan><tspan x="660.0" dy="16.9">це q·(w + h), тобто півпериметр</tspan></text>
<rect x="531.4" y="349.1" width="257.1" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="370.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">qw·qh — площа вікна: від коробки</tspan><tspan x="660.0" dy="16.9">не залежить узагалі</tspan></text>
</svg>