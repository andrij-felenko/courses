<text x="625.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">diag = D[i-1, j-1]</text>
<line x1="625.0" y1="210.0" x2="702.0" y2="176.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="265.0" width="330.0" height="105.0" rx="4" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.0"/>
<text x="625.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження діагоналі перед перезаписом:</text>
<text x="625.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">temp = dp[j];</text>
<text x="625.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">dp[j] = min(dp[j]+1, dp[j-1]+1, diag+cost);</text>
<text x="625.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">diag = temp;  // стає діагоналлю для j+1</text>
