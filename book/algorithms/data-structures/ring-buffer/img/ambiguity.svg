<rect x="149.9" y="94.9" width="30.0" height="30.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<line x1="230.0" y1="25.0" x2="230.0" y2="62.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="17.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">head = tail</text>
<text x="230.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">порожньо</text>
<rect x="655.0" y="68.0" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="720.1" y="94.9" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="747.0" y="160.0" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="720.1" y="225.1" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="655.0" y="252.0" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="589.9" y="225.1" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="563.0" y="160.0" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<rect x="589.9" y="94.9" width="30.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
