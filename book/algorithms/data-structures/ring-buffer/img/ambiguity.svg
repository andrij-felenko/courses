<text x="670.0" y="17.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">head = tail</text>
<text x="670.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">повно</text>
<text x="450.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#6b7280" text-anchor="middle" font-weight="700">= ?</text>
<text x="450.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">індекси однакові</text>
<text x="450.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">стани різні</text>
<text x="450.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи розрізнити:</text>
<rect x="37.0" y="348.0" width="258.0" height="138.0" rx="8" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.6"/>
<text x="166.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1 · Жертва комірки</text>
<line x1="53.0" y1="382.0" x2="279.0" y2="382.0" stroke="#e2e6ea" stroke-width="1.0"/>
<text x="166.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="166.0" dy="0.0">Повним звемо на крок раніше:</tspan><tspan x="166.0" dy="13.4">(head + 1) &amp; (N−1) == tail.</tspan><tspan x="166.0" dy="13.4"></tspan><tspan x="166.0" dy="13.4">head == tail — лише порожньо.</tspan><tspan x="166.0" dy="13.4">Ціна: місткість падає до N−1.</tspan></text>
<rect x="321.0" y="348.0" width="258.0" height="138.0" rx="8" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="450.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 · Лічильник size</text>
<line x1="337.0" y1="382.0" x2="563.0" y2="382.0" stroke="#e2e6ea" stroke-width="1.0"/>
<text x="450.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Окрема змінна рахує елементи.</tspan><tspan x="450.0" dy="13.4">size == 0 — порожньо,</tspan><tspan x="450.0" dy="13.4">size == N — повно.</tspan><tspan x="450.0" dy="13.4"></tspan><tspan x="450.0" dy="13.4">Місткість повна, але змінну</tspan><tspan x="450.0" dy="13.4">пишуть обидві сторони.</tspan></text>
<rect x="605.0" y="348.0" width="258.0" height="138.0" rx="8" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.6"/>
<text x="734.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3 · Монотонні індекси</text>
<line x1="621.0" y1="382.0" x2="847.0" y2="382.0" stroke="#e2e6ea" stroke-width="1.0"/>
<text x="734.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">Індекси не загортаються.</tspan><tspan x="734.0" dy="13.4">size = head − tail.</tspan><tspan x="734.0" dy="13.4">Адреса: pos &amp; (N−1).</tspan><tspan x="734.0" dy="13.4"></tspan><tspan x="734.0" dy="13.4">Спільних записів немає —</tspan><tspan x="734.0" dy="13.4">дружньо до lock-free.</tspan></text>
</svg>