<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хибне спільне: логічно змінні різні, фізично — один рядок кеша</text>
<text x="240.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Як буває: head і tail — сусіди</text>
<text x="240.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обидва лягли в ОДИН рядок кеша</text>
<rect x="55.3" y="107.8" width="129.4" height="44.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Ядро 1 — виробник</tspan><tspan x="120.0" dy="15.0">пише head</tspan></text>
<rect x="285.3" y="107.8" width="129.4" height="44.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Ядро 2 — споживач</tspan><tspan x="350.0" dy="15.0">пише tail</tspan></text>
<rect x="40.0" y="215.0" width="400.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<rect x="52.0" y="228.0" width="54.0" height="32.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="79.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">head</text>
<rect x="110.0" y="228.0" width="54.0" height="32.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="137.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">tail</text>
<text x="310.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">решта рядка — 56 Б</text>
<line x1="120.0" y1="156.0" x2="79.0" y2="224.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="350.0" y1="156.0" x2="137.0" y2="224.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">один рядок кеша, 64 Б — і head, і tail у ньому</text>
<text x="240.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Змінні різні — рядок один. Запис head робить увесь</tspan><tspan x="240.0" dy="17.2">рядок недійсним у кеші сусіда: наступне читання tail —</tspan><tspan x="240.0" dy="17.2">промах. Рядок пінг-понгує між ядрами на КОЖНІЙ операції,</tspan><tspan x="240.0" dy="17.2">хоча жодної спільної змінної тут насправді нема.</tspan></text>
<text x="740.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Як треба: alignas(64)</text>
<text x="740.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кожен покажчик — у власному рядку</text>
<rect x="555.3" y="107.8" width="129.4" height="44.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ядро 1 — виробник</tspan><tspan x="620.0" dy="15.0">пише head</tspan></text>
<rect x="785.3" y="107.8" width="129.4" height="44.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="850.0" y="126.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Ядро 2 — споживач</tspan><tspan x="850.0" dy="15.0">пише tail</tspan></text>
<rect x="535.0" y="215.0" width="190.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<rect x="546.0" y="228.0" width="54.0" height="32.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="573.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">head</text>
<text x="665.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">паддинг</text>
<rect x="755.0" y="215.0" width="190.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<rect x="766.0" y="228.0" width="54.0" height="32.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="793.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">tail</text>
<text x="885.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">паддинг</text>
<line x1="620.0" y1="156.0" x2="590.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="850.0" y1="156.0" x2="830.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="630.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">рядок №1 — лише head</text>
<text x="850.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">рядок №2 — лише tail</text>
<text x="740.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Ядра більше не зачіпають рядка одне одного: кожне</tspan><tspan x="740.0" dy="17.2">тримає свій у власному кеші й ганяє його без завад.</tspan><tspan x="740.0" dy="17.2">Ціна — паддинг (тут 128 Б замість 8); зиск на гарячому</tspan><tspan x="740.0" dy="17.2">шляху добре помітний.</tspan></text>
<line x1="490.0" y1="45.0" x2="490.0" y2="420.0" stroke="#d8dde3" stroke-width="1.4" stroke-dasharray="6 5"/>
</svg>