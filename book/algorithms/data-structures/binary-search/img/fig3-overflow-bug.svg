<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переповнення при обчисленні середини діапазону</text>
<rect x="49.3" y="26.5" width="361.4" height="226.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="230.0" y="51.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Некоректний розрахунок:</tspan><tspan x="230.0" dy="16.9"></tspan><tspan x="230.0" dy="16.9">low = 1,500,000,000</tspan><tspan x="230.0" dy="16.9">high = 1,000,000,000</tspan><tspan x="230.0" dy="16.9"></tspan><tspan x="230.0" dy="16.9">low + high = 2,500,000,000</tspan><tspan x="230.0" dy="16.9">(&gt; INT_MAX = 2,147,483,647!)</tspan><tspan x="230.0" dy="16.9"></tspan><tspan x="230.0" dy="16.9">Переповнення 32-біт signed int:</tspan><tspan x="230.0" dy="16.9">low + high = -1,794,967,296</tspan><tspan x="230.0" dy="16.9">mid = -897,483,648  ❌</tspan><tspan x="230.0" dy="16.9">Призводить до ArrayIndexOutOfBoundsException!</tspan></text>
<rect x="470.0" y="26.5" width="279.9" height="226.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="610.0" y="51.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Безпечний розрахунок:</tspan><tspan x="610.0" dy="16.9"></tspan><tspan x="610.0" dy="16.9">low = 1,500,000,000</tspan><tspan x="610.0" dy="16.9">high = 1,000,000,000</tspan><tspan x="610.0" dy="16.9"></tspan><tspan x="610.0" dy="16.9">high - low = 500,000,000</tspan><tspan x="610.0" dy="16.9">(high - low) / 2 = 250,000,000</tspan><tspan x="610.0" dy="16.9"></tspan><tspan x="610.0" dy="16.9">low + (high - low) / 2:</tspan><tspan x="610.0" dy="16.9">= 1,500,000,000 + 250,000,000</tspan><tspan x="610.0" dy="16.9">mid = 1,750,000,000  ✓</tspan><tspan x="610.0" dy="16.9">Ніколи не переповнює діапазон int!</tspan></text>
<text x="420.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баг Джонса (2006): чому (low + high) / 2 небезпечний у мовах зі скінченними цілими типами</text>
</svg>