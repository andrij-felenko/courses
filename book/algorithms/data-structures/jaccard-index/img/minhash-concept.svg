<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип оцінювання схожості Жаккара через MinHash</text>
<rect x="30.0" y="60.0" width="780.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="60.0" y="90.0" width="220.0" height="130.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="170.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідні множини</text>
<text x="170.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">Множина A = {s₁, s₃, s₅, s₇}</tspan><tspan x="170.0" dy="15.6">Множина B = {s₁, s₃, s₆, s₈}</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Точний J(A, B) = 2 / 6 = 0.333</tspan></text>
<rect x="310.0" y="90.0" width="220.0" height="130.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">MinHash Сигнатури (K=4)</text>
<text x="420.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="420.0" dy="0.0">Sig(A) = [h₁(A), h₂(A), h₃(A), h₄(A)]</tspan><tspan x="420.0" dy="15.6">Sig(B) = [h₁(B), h₂(B), h₃(B), h₄(B)]</tspan><tspan x="420.0" dy="15.6"></tspan><tspan x="420.0" dy="15.6">Компактний вектор k хешів</tspan></text>
<line x1="280.0" y1="155.0" x2="310.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="560.0" y="90.0" width="220.0" height="130.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="670.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Оцінка схожості</text>
<text x="670.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">P(h_k(A) == h_k(B)) = J(A, B)</tspan><tspan x="670.0" dy="15.6"></tspan><tspan x="670.0" dy="15.6">J_approx = (Збіги в Sig) / K</tspan><tspan x="670.0" dy="15.6">Оцінка за O(K) операцій</tspan></text>
<line x1="530.0" y1="155.0" x2="560.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="240.0" width="720.0" height="120.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм перестановки та мінімального значення</text>
<rect x="80.0" y="280.0" width="210.0" height="65.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="185.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Хешування елементів</text>
<text x="185.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">h_k(x) = (a·x + b) mod p</text>
<rect x="315.0" y="280.0" width="210.0" height="65.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="420.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Пошук мінімуму</text>
<text x="420.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">h_k(A) = min_{x ∈ A} h_k(x)</text>
<rect x="550.0" y="280.0" width="210.0" height="65.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">3. Порівняння сигнатур</text>
<text x="655.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Поелементний збіг цілих чисел</text>
</svg>