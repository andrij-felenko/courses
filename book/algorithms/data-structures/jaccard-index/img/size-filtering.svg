<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмірний фільтр схожості Жаккара з порогом τ</text>
<rect x="30.0" y="60.0" width="780.0" height="310.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ось розмірів кандидатів |B| для опитувальної множини |A|</text>
<rect x="60.0" y="160.0" width="720.0" height="40.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="60.0" y="160.0" width="180.0" height="40.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="150.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Відсіювання (|B| &lt; τ·|A|)</text>
<rect x="240.0" y="160.0" width="360.0" height="40.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="420.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Допустиме вікно [ τ·|A| ,  |A| / τ ]</text>
<rect x="600.0" y="160.0" width="180.0" height="40.0" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="690.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Відсіювання (|B| &gt; |A|/τ)</text>
<line x1="240.0" y1="138.0" x2="240.0" y2="158.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="240.0" y1="202.0" x2="240.0" y2="222.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="240.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ніжня межа: τ·|A|</text>
<line x1="420.0" y1="138.0" x2="420.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3,3"/>
<line x1="420.0" y1="202.0" x2="420.0" y2="222.0" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="3,3"/>
<text x="420.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опитувальна |A|</text>
<line x1="600.0" y1="138.0" x2="600.0" y2="158.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="600.0" y1="202.0" x2="600.0" y2="222.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Верхня межа: |A| / τ</text>
<rect x="60.0" y="245.0" width="340.0" height="100.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="230.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математична необхідність</text>
<text x="230.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="230.0" dy="0.0">Якщо |B| поза межами, то навіть при</tspan><tspan x="230.0" dy="15.6">повній перекритності J(A, B) &lt; τ.</tspan><tspan x="230.0" dy="15.6">Перевірка за O(1) відсіює &gt; 90% пар.</tspan></text>
<rect x="440.0" y="245.0" width="340.0" height="100.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="610.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Префіксний фільтр</text>
<text x="610.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">Для відсортованої множини A достатньо</tspan><tspan x="610.0" dy="15.6">перевірити перші (|A| - ⌈τ·|A|⌉ + 1)</tspan><tspan x="610.0" dy="15.6">елементів в інвертованому індексі.</tspan></text>
</svg>