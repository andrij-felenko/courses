<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний зміст індексу Жаккара J(A, B)</text>
<rect x="30.0" y="60.0" width="375.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="217.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діаграма Венна множин A та B</text>
<circle cx="175.0" cy="220.0" r="90.0" fill="#2457d6" fill-opacity="0.25" stroke="#2457d6" stroke-width="2.5"/>
<circle cx="260.0" cy="220.0" r="90.0" fill="#27ae60" fill-opacity="0.25" stroke="#27ae60" stroke-width="2.5"/>
<text x="130.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e40af" text-anchor="middle" font-weight="700">A \ B</text>
<text x="217.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="700">A ∩ B</text>
<text x="305.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="700">B \ A</text>
<text x="130.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Множина A</text>
<text x="305.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Множина B</text>
<rect x="435.0" y="60.0" width="375.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="622.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формули метрики</text>
<rect x="460.0" y="120.0" width="325.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="622.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Перетин |A ∩ B|</text>
<text x="622.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Спільні елементи обох множин</text>
<rect x="460.0" y="205.0" width="325.0" height="70.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="622.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">Об'єднання |A ∪ B| = |A| + |B| - |A ∩ B|</text>
<text x="622.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Усі унікальні елементи разом</text>
<rect x="460.0" y="290.0" width="325.0" height="80.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="622.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">J(A, B) = |A ∩ B| / |A ∪ B|</text>
<text x="622.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відстань Жаккара: d_J(A, B) = 1 - J(A, B)</text>
</svg>