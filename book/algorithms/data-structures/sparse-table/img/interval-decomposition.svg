<text x="628.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ST[0][6]=3</text>
<rect x="673.0" y="130.0" width="78.0" height="32.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="712.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ST[0][7]=12</text>
<text x="70.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">j = 1 (len=2):</text>
<rect x="85.0" y="195.0" width="162.0" height="32.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<text x="166.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ST[1][0] = min(7, 2) = 2</text>
<rect x="253.0" y="195.0" width="162.0" height="32.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<text x="334.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ST[1][2] = min(3, 0) = 0</text>
<rect x="421.0" y="195.0" width="162.0" height="32.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<text x="502.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ST[1][4] = min(5, 10) = 5</text>
<rect x="589.0" y="195.0" width="162.0" height="32.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<text x="670.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ST[1][6] = min(3, 12) = 3</text>
<text x="70.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7950b" text-anchor="end" font-weight="700">j = 2 (len=4):</text>
<rect x="85.0" y="260.0" width="330.0" height="32.0" rx="4" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.3"/>
<text x="250.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle" font-weight="700">ST[2][0] = min(ST[1][0], ST[1][2]) = 0</text>
<rect x="421.0" y="260.0" width="330.0" height="32.0" rx="4" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.3"/>
<text x="586.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle" font-weight="700">ST[2][4] = min(ST[1][4], ST[1][6]) = 3</text>
<text x="70.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">j = 3 (len=8):</text>
<rect x="85.0" y="325.0" width="666.0" height="34.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="418.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ST[3][0] = min(ST[2][0], ST[2][4]) = min(0, 3) = 0</text>
<rect x="30.0" y="385.0" width="800.0" height="75.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="430.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівняння динамічного програмування:  ST[j][i] = min( ST[j - 1][i],  ST[j - 1][i + 2^(j - 1)] )</text>
<text x="430.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен блок довжини 2^j обчислюється об'єднанням двох суміжних блоків довжини 2^(j-1) за O(1)</text>
