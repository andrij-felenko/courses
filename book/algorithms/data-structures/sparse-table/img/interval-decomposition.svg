<rect x="421.0" y="130.0" width="78.0" height="32.0" rx="4" fill="#eef6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="460.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ST[0][4]=5</text>
