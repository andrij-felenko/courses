<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив організації вимірів масиву на кеш-локальність процесора</text>
<rect x="30.0" y="60.0" width="375.0" height="335.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/>
<text x="217.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Оптимально: ST[j][i] (рівні в рядках)</text>
<text x="217.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Рівень j займає неперервний блок у пам'яті</text>
<rect x="50.0" y="130.0" width="335.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="60.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Рівень j=0:</text>
<text x="145.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ST[0][0]   ST[0][1]   ST[0][2] ... ST[0][N-1]</text>
<rect x="50.0" y="172.0" width="335.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="60.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Рівень j=1:</text>
<text x="145.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ST[1][0]   ST[1][1]   ST[1][2] ... ST[1][N-1]</text>
<rect x="50.0" y="214.0" width="335.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="60.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Рівень j=2:</text>
<text x="145.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ST[2][0]   ST[2][1]   ST[2][2] ... ST[2][N-1]</text>
<rect x="50.0" y="270.0" width="335.0" height="110.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="217.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги для процесорного кешу:</text>
<text x="60.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Лінійне завантаження кеш-ліній (64 байти)</text>
<text x="60.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ефективна робота апаратного Prefetcher L1/L2</text>
<text x="60.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запит RMQ зчитує лише з 1 фіксованого рядка j=k</text>
<text x="60.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Прискорення побудови у 2.5–4.2 рази</text>
<rect x="435.0" y="60.0" width="375.0" height="335.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/>
<text x="622.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Неоптимально: ST[i][j] (індекси в рядках)</text>
<text x="622.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Елементи одного рівня розкидані з кроком K</text>
<rect x="455.0" y="130.0" width="335.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="465.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Вузол i=0:</text>
<text x="545.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ST[0][0]   ST[0][1]   ST[0][2] ... ST[0][K-1]</text>
<rect x="455.0" y="172.0" width="335.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="465.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Вузол i=1:</text>
<text x="545.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ST[1][0]   ST[1][1]   ST[1][2] ... ST[1][K-1]</text>
<rect x="455.0" y="214.0" width="335.0" height="30.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="465.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Вузол i=2:</text>
<text x="545.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ST[2][0]   ST[2][1]   ST[2][2] ... ST[2][K-1]</text>
<rect x="455.0" y="270.0" width="335.0" height="110.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="622.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Проблеми з пам'яттю:</text>
<text x="465.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Stride-доступ із кроком K = log₂(N) слів</text>
<text x="465.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Постійні промахи кешу (L1/L2 Cache Misses)</text>
<text x="465.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Знецінення кеш-ліній: з 64 байтів береться 4</text>
<text x="465.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Просідання throughput при N &gt; 100 000</text>
</svg>