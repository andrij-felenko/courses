<rect x="184.0" y="66.0" width="460.0" height="54.0" rx="6" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<text x="187.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">L = 2</text>
<text x="643.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">R = 8</text>
<text x="418.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довжина відрізка = R - L + 1 = 7,   k = ⌊log₂(7)⌋ = 2   (2^k = 4)</text>
<rect x="187.0" y="150.0" width="260.0" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="310.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Лівий блок: [L .. L + 2^k - 1] = [2 .. 5]</text>
<text x="317.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ST[2][2] = min(7, 1, 8, 2) = 1</text>
<rect x="385.0" y="210.0" width="260.0" height="38.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="527.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Правий блок: [R - 2^k + 1 .. R] = [5 .. 8]</text>
<text x="515.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ST[2][5] = min(2, 14, 10, 5) = 2</text>
<rect x="385.0" y="150.0" width="62.0" height="98.0" rx="4" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<text x="416.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Перекриття (i=5)</text>
<rect x="30.0" y="305.0" width="780.0" height="75.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="420.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">RMQ(L, R) = min( ST[k][L],  ST[k][R - 2^k + 1] ) = min( ST[2][2],  ST[2][5] ) = min(1, 2) = 1</text>
<text x="420.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ідемпотентність min(x, x) = x гарантує правильність результату навіть при повторному врахуванні елементів перекриття</text>
</svg>