<text x="420.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Індексація розрідженого вузла HAMT через popcount</text>
<text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Бітова мапа вузла вказує наявні гілки; popcount маскованої частини визначає точний індекс</text>
<rect x="40.0" y="95.0" width="760.0" height="65.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="60.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="start" font-weight="700">1. Фрагмент хешу ключа на поточному рівні дерева</text>
<text x="60.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5 бітів дають номер гілки k ∈ [0..31]: k = (hash &gt;&gt; shift) &amp; 0x1F = 11 (двійкове 01011)</text>
<rect x="40.0" y="175.0" width="760.0" height="120.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="60.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. 32-бітна мапа зайнятих слотів вузла (bitmap)</text>
