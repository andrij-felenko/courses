<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три місця, де живлення може зникнути, — і що вирішить скан</text>
<rect x="56.0" y="52.0" width="210.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="78.0" cy="81.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="78.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="98.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="98.0" dy="0.0">беремо з пулу</tspan><tspan x="98.0" dy="14.3">найменш зношений PB40</tspan></text>
<line x1="266.0" y1="81.0" x2="302.0" y2="81.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="302.0" y="52.0" width="210.0" height="58.0" rx="6" fill="#d9f0df" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="324.0" cy="81.0" r="11.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="324.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
<text x="344.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="344.0" dy="0.0">пишемо дані,</tspan><tspan x="344.0" dy="14.3">тоді КОМІТ, seq=8</tspan></text>
<line x1="512.0" y1="81.0" x2="548.0" y2="81.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="548.0" y="52.0" width="210.0" height="58.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="570.0" cy="81.0" r="11.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="570.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">3</text>
<text x="590.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="590.0" dy="0.0">map[5] = PB40</tspan><tspan x="590.0" dy="14.3">— лише в RAM</tspan></text>
<line x1="758.0" y1="81.0" x2="794.0" y2="81.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="794.0" y="52.0" width="210.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="816.0" cy="81.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="816.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">4</text>
<text x="836.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="836.0" dy="0.0">стираємо старий</tspan><tspan x="836.0" dy="14.3">PB13 → у пул</tspan></text>
<rect x="145.0" y="146.0" width="280.0" height="40.0" rx="6" fill="#fdf6e0" stroke="#c99a2e" stroke-width="1.8"/><text x="285.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">зрив на кроці 2</tspan></text>
<rect x="447.0" y="146.0" width="280.0" height="40.0" rx="6" fill="#d9f0df" stroke="#27ae60" stroke-width="1.8"/><text x="587.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="587.0" dy="0.0">зрив між 2 і 4</tspan></text>
<rect x="749.0" y="146.0" width="280.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="889.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="889.0" dy="0.0">зрив на кроці 4</tspan></text>
<text x="132.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">у флеші лишилось</text>
<rect x="145.0" y="194.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/><text x="285.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">PB40: EC-заголовок є,</tspan><tspan x="285.0" dy="15.6">КОМІТУ немає.</tspan><tspan x="285.0" dy="15.6">PB13: цілий, seq=7</tspan></text>
<rect x="447.0" y="194.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="587.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="587.0" dy="0.0">PB40: коміт seq=8,</tspan><tspan x="587.0" dy="15.6">PB13: коміт seq=7 —</tspan><tspan x="587.0" dy="15.6">обидва звуться LBA 5</tspan></text>
<rect x="749.0" y="194.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="889.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="889.0" dy="0.0">PB13: стертий, але</tspan><tspan x="889.0" dy="15.6">EC-заголовка немає —</tspan><tspan x="889.0" dy="15.6">лічильник утрачено</tspan></text>
<text x="132.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">скан при старті</text>
<rect x="145.0" y="284.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/><text x="285.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">коміту нема → блок</tspan><tspan x="285.0" dy="15.6">порожній → у пул;</tspan><tspan x="285.0" dy="15.6">LBA 5 лишається за PB13</tspan></text>
<rect x="447.0" y="284.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="587.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="587.0" dy="0.0">seq 8 &gt; 7 → map[5] = PB40;</tspan><tspan x="587.0" dy="15.6">PB13 → стерти, у пул</tspan></text>
<rect x="749.0" y="284.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="889.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="889.0" dy="0.0">ставимо середній EC,</tspan><tspan x="889.0" dy="15.6">стерти ще раз → у пул</tspan></text>
<text x="132.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">наслідок</text>
<rect x="145.0" y="374.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#c99a2e" stroke-width="1.2"/><text x="285.0" y="402.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">утрачено лише новий запис,</tspan><tspan x="285.0" dy="15.6">старі дані цілі</tspan></text>
<rect x="447.0" y="374.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="587.0" y="410.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="587.0" dy="0.0">новий запис уцілів</tspan></text>
<rect x="749.0" y="374.0" width="280.0" height="64.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="889.0" y="402.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="889.0" dy="0.0">дані цілі, лічильник</tspan><tspan x="889.0" dy="15.6">трохи неточний</tspan></text>
<rect x="237.3" y="456.2" width="585.4" height="47.6" rx="6" fill="#fdf6e0" stroke="#c99a2e" stroke-width="1.5"/><text x="530.0" y="476.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Таблиці у флеші немає — її щоразу відновлює скан.</tspan><tspan x="530.0" dy="15.6">Тому «атомарний запис таблиці» й не потрібен: суддя — seq у коміт-заголовку.</tspan></text>
</svg>