<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2 КБ</text>
<line x1="630.0" y1="196.0" x2="630.0" y2="206.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="630.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">126 КБ</text>
<line x1="820.0" y1="196.0" x2="820.0" y2="206.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="820.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">128 КБ</text>
<rect x="39.8" y="249.3" width="190.5" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="135.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">стирання щойно сталося —</tspan><tspan x="135.0" dy="14.3">лічильник у флеші НЕГАЙНО</tspan></text>
<rect x="321.3" y="249.3" width="197.3" height="45.3" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.4"/><text x="420.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">дані йдуть сторінка за</tspan><tspan x="420.0" dy="14.3">сторінкою, зсув лише росте</tspan></text>
<rect x="619.5" y="249.3" width="211.0" height="45.3" rx="6" fill="#d9f0df" stroke="#27ae60" stroke-width="1.4"/><text x="725.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">КОМІТ: LBA + seq + CRC.</tspan><tspan x="725.0" dy="14.3">До цього рядка блок — сміття</tspan></text>
<rect x="141.6" y="317.4" width="596.8" height="45.3" rx="6" fill="#fdf6e0" stroke="#c99a2e" stroke-width="1.5"/><text x="440.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Заголовків два, і це не примха: лічильник стирань мусить лягти у флеш одразу після стирання,</tspan><tspan x="440.0" dy="14.3">а право на LBA — аж коли дані цілком записані. Одним заголовком ці два моменти не звести.</tspan></text>
</svg>