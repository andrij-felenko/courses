<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка блоку: лічильник — на початку, коміт — у самому кінці</text>
<text x="440.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">порядок програмування — лише вперед за зсувом</text>
<line x1="60.0" y1="80.0" x2="820.0" y2="80.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="135.0" cy="106.0" r="11.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="135.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="60.0" y="130.0" width="150.0" height="66.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="135.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">EC-заголовок</tspan><tspan x="135.0" dy="15.6">сторінка 0</tspan></text>
<circle cx="420.0" cy="106.0" r="11.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="420.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
