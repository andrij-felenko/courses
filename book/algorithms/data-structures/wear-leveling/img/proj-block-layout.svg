<text x="420.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">корисні дані</tspan><tspan x="420.0" dy="15.6">сторінки 1…62</tspan></text>
<circle cx="725.0" cy="106.0" r="11.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="725.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3</text>
<rect x="630.0" y="130.0" width="190.0" height="66.0" rx="5" fill="#d9f0df" stroke="#27ae60" stroke-width="2.0"/>
<text x="725.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">COMMIT-заголовок</tspan><tspan x="725.0" dy="15.6">сторінка 63</tspan></text>
<line x1="60.0" y1="196.0" x2="60.0" y2="206.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
