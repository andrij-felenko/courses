<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де саме ховається важкість: розріжемо задачу двома ножами</text>
<rect x="310.0" y="76.0" width="390.0" height="64.0" rx="6" fill="#eef2f7" stroke="#c7ced6" stroke-width="2.0"/><text x="505.0" y="103.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">ОБЛАСТЬ НЕПЕРЕРВНА</tspan><tspan x="505.0" dy="19.5">координати — дійсні числа</tspan></text>
<rect x="720.0" y="76.0" width="390.0" height="64.0" rx="6" fill="#eef2f7" stroke="#c7ced6" stroke-width="2.0"/><text x="915.0" y="103.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">ОБЛАСТЬ ДИСКРЕТНА</tspan><tspan x="915.0" dy="19.5">перестановка по слотах</tspan></text>
<rect x="40.0" y="156.0" width="250.0" height="196.0" rx="6" fill="#eef2f7" stroke="#c7ced6" stroke-width="2.0"/><text x="165.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ЦІНА ЛІНІЙНА</tspan><tspan x="165.0" dy="18.2"></tspan><tspan x="165.0" dy="18.2">блок коштує</tspan><tspan x="165.0" dy="18.2">сам по собі</tspan><tspan x="165.0" dy="18.2"></tspan><tspan x="165.0" dy="18.2">Σ c(i, π(i))</tspan></text>
<rect x="40.0" y="368.0" width="250.0" height="196.0" rx="6" fill="#eef2f7" stroke="#c7ced6" stroke-width="2.0"/><text x="165.0" y="434.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ЦІНА КВАДРАТИЧНА</tspan><tspan x="165.0" dy="18.2"></tspan><tspan x="165.0" dy="18.2">коштує ПАРА блоків</tspan><tspan x="165.0" dy="18.2"></tspan><tspan x="165.0" dy="18.2">Σ f(i,j)·d(π(i),π(j))</tspan></text>
<rect x="310.0" y="156.0" width="390.0" height="196.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="505.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">Лінійне програмування</tspan><tspan x="505.0" dy="18.2"></tspan><tspan x="505.0" dy="18.2">мінімум — у вершині</tspan><tspan x="505.0" dy="18.2">многогранника</tspan><tspan x="505.0" dy="18.2"></tspan><tspan x="505.0" dy="18.2">симплекс — ЛЕГКО</tspan></text>
<rect x="720.0" y="156.0" width="390.0" height="196.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="915.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">Лінійна задача про призначення</tspan><tspan x="915.0" dy="18.2"></tspan><tspan x="915.0" dy="18.2">вершини Біркгофа = перестановки,</tspan><tspan x="915.0" dy="18.2">тож ЛП сама дає цілу відповідь</tspan><tspan x="915.0" dy="18.2"></tspan><tspan x="915.0" dy="18.2">угорський метод O(n³) — ЛЕГКО</tspan></text>
<rect x="310.0" y="368.0" width="390.0" height="196.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="505.0" y="425.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">Аналітичне розміщення</tspan><tspan x="505.0" dy="18.2"></tspan><tspan x="505.0" dy="18.2">градієнт = 0 → L·x = b</tspan><tspan x="505.0" dy="18.2">розріджений лапласіан</tspan><tspan x="505.0" dy="18.2"></tspan><tspan x="505.0" dy="18.2">майже лінійний час — ЛЕГКО</tspan></text>
<rect x="720.0" y="368.0" width="390.0" height="196.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="3.4"/><text x="915.0" y="425.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="915.0" dy="0.0">РОЗМІЩЕННЯ = QAP</tspan><tspan x="915.0" dy="18.2"></tspan><tspan x="915.0" dy="18.2">NP-ВАЖКЕ</tspan><tspan x="915.0" dy="18.2"></tspan><tspan x="915.0" dy="18.2">ні швидкого точного,</tspan><tspan x="915.0" dy="18.2">ні дешевої гарантії</tspan></text>
<rect x="128.2" y="588.5" width="883.6" height="43.0" rx="6" fill="#eef2f7" stroke="#c7ced6" stroke-width="2.0"/><text x="570.0" y="615.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Жоден інгредієнт сам по собі не важкий — важкий їхній ДОБУТОК: зв'язані пари НА перестановці</tspan></text>
