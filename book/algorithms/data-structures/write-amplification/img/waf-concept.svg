<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концепція підсилення запису (Write Amplification Factor)</text>
<rect x="40.0" y="60.0" width="200.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Застосунок / Хост</tspan><tspan x="140.0" dy="16.9">(Host Write)</tspan><tspan x="140.0" dy="16.9">4 KB Data</tspan></text>
<line x1="240.0" y1="110.0" x2="310.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">Логічний запис</text>
<rect x="310.0" y="60.0" width="220.0" height="120.0" rx="6" fill="#fbf2e9" stroke="#e67e22" stroke-width="1.5"/><text x="420.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Система зберігання</tspan><tspan x="420.0" dy="14.3">(FTL / LSM Compaction / WAL)</tspan><tspan x="420.0" dy="14.3">Множення записів</tspan></text>
<line x1="530.0" y1="90.0" x2="600.0" y2="70.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="530.0" y1="110.0" x2="600.0" y2="110.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="530.0" y1="130.0" x2="600.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="50.0" width="160.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Фізичний носій</tspan><tspan x="680.0" dy="13.0">(NAND Flash / Disk)</tspan><tspan x="680.0" dy="13.0">16 KB WAL + 20 KB GC</tspan><tspan x="680.0" dy="13.0">= 36 KB Physical Write</tspan></text>
<rect x="80.0" y="230.0" width="640.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Формула підсилення запису (Write Amplification Factor):</tspan><tspan x="400.0" dy="16.9"></tspan><tspan x="400.0" dy="16.9">WAF = (Фізичний обсяг запису на носій) / (Логічний обсяг запису від хоста)</tspan><tspan x="400.0" dy="16.9"></tspan><tspan x="400.0" dy="16.9">Приклад: WAF = 36 KB / 4 KB = 9.0 (на 1 KB даних пишеться 9 KB на диск)</tspan></text>
</svg>