<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм збирання сміття (Garbage Collection) у FTL</text>
<text x="180.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блок джерела A (Erase Block)</text>
<rect x="60.0" y="80.0" width="240.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Сторінка 1: Валідні дані X</tspan></text>
<rect x="60.0" y="130.0" width="240.0" height="40.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Сторінка 2: ЗАСТАРІЛІ дані</tspan></text>
<rect x="60.0" y="180.0" width="240.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Сторінка 3: Валідні дані Y</tspan></text>
<rect x="60.0" y="230.0" width="240.0" height="40.0" rx="6" fill="#fef9e7" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Сторінка 4: ЗАСТАРІЛІ дані</tspan></text>
<line x1="300.0" y1="100.0" x2="380.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="300.0" y1="200.0" x2="380.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="380.0" y="110.0" width="160.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Буфер FTL GC</tspan><tspan x="460.0" dy="15.6">Копіювання лише</tspan><tspan x="460.0" dy="15.6">валідних (X, Y)</tspan></text>
<line x1="540.0" y1="150.0" x2="600.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач Блок B</text>
<rect x="590.0" y="80.0" width="200.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Сторінка 1: Валідні X</tspan></text>
<rect x="590.0" y="130.0" width="200.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Сторінка 2: Валідні Y</tspan></text>
<rect x="590.0" y="180.0" width="200.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Сторінка 3: Нові дані Z</tspan></text>
<rect x="590.0" y="230.0" width="200.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="253.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Сторінка 4: Вільна</tspan></text>
<line x1="180.0" y1="280.0" x2="180.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="330.0" width="200.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Очищення Блоку A</tspan><tspan x="180.0" dy="14.3">PHYSICAL ERASE (BLOCK)</tspan></text>
<rect x="330.0" y="330.0" width="460.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="348.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Ампліфікація в FTL:</tspan><tspan x="560.0" dy="11.7">Запис 1 нової сторінки (Z) вимагає перенесення 2 живих (X,Y) + стирання блоку.</tspan><tspan x="560.0" dy="11.7">WAF = (2 перенесені + 1 нова) / 1 нова = 3.0</tspan></text>
</svg>