<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсилення запису при ущільненні (Compaction) у LSM-дереві</text>
<rect x="40.0" y="60.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">MemTable (RAM)</tspan><tspan x="110.0" dy="14.3">Запис: WAF = 0</tspan></text>
<line x1="180.0" y1="85.0" x2="230.0" y2="85.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="60.0" width="150.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">L0 SSTables (Disk)</tspan><tspan x="305.0" dy="14.3">Flush з RAM</tspan></text>
<line x1="380.0" y1="85.0" x2="430.0" y2="85.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="430.0" y="60.0" width="160.0" height="50.0" rx="6" fill="#fbf2e9" stroke="#e67e22" stroke-width="1.5"/><text x="510.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">L1 SSTables (10 MB)</tspan><tspan x="510.0" dy="14.3">Leveled Compaction</tspan></text>
<line x1="590.0" y1="85.0" x2="640.0" y2="85.0" stroke="#e67e22" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="60.0" width="150.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">L2 SSTables (100 MB)</tspan><tspan x="715.0" dy="13.0">Далі L3... LN</tspan></text>
<rect x="60.0" y="150.0" width="700.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="162.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Процес Leveled Compaction між L1 та L2:</tspan><tspan x="410.0" dy="15.6"></tspan><tspan x="410.0" dy="15.6">1. Вибір 1 SSTable з L1 (наприклад, 10 MB).</tspan><tspan x="410.0" dy="15.6">2. Пошук перекритих за ключами SSTables в L2 (типово 10 SSTables по 10 MB = 100 MB).</tspan><tspan x="410.0" dy="15.6">3. Зчитування 110 MB -&gt; Сортування й злиття (Merge Sort) -&gt; Запис 110 MB нових SSTables у L2.</tspan><tspan x="410.0" dy="15.6"></tspan><tspan x="410.0" dy="15.6">WAF для 1 рівня Compaction ≈ 10x. Для L рівнів WAF ≈ L × T.</tspan></text>
<rect x="120.0" y="285.0" width="580.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Порівняння підходів WAF:</tspan><tspan x="410.0" dy="11.7">- B-Tree (In-place): WAF високий при випадковому записі (Random IO), малий при послідовному.</tspan><tspan x="410.0" dy="11.7">- LSM-Tree (Leveled): WAF передбачуваний L × T (типово 10..30), оптимізований для запису.</tspan><tspan x="410.0" dy="11.7">- LSM-Tree (Size-Tiered): WAF менший (4..8), але висока ампліфікація простору (Space Amplification).</tspan></text>
</svg>