<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Раннє переливання руйнує порядок: новіші лягають поверх старіших</text>
<rect x="150.0" y="34.0" width="600.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Стан:  вихідний = [B]  (зверху B — за FIFO наступний),   вхідний = [C, D]</tspan></text>
<line x1="450.0" y1="108.0" x2="450.0" y2="404.0" stroke="#d8dde3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="240.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно</text>
<text x="240.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вихідний непорожній → НЕ переливаємо</text>
<text x="240.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вихідний</text>
<rect x="192.0" y="232.0" width="96.0" height="46.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="240.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<rect x="122.0" y="336.0" width="236.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">pop → B  ✓</tspan><tspan x="240.0" dy="16.2">обслужили найстаріший</tspan></text>
<text x="655.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка</text>
<text x="655.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">перелили попри непорожній вихідний</text>
<text x="655.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вихідний (зіпсутий)</text>
<rect x="607.0" y="196.0" width="96.0" height="46.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="655.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<rect x="607.0" y="242.0" width="96.0" height="46.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="655.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">D</text>
<rect x="607.0" y="288.0" width="96.0" height="46.0" rx="5" fill="#f3d9d4" stroke="#c0392b" stroke-width="1.7"/>
<text x="655.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="715.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">← B застряг унизу</text>
<rect x="533.0" y="396.0" width="244.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="417.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">pop → C  ✗</tspan><tspan x="655.0" dy="16.2">видали C, а мали B</tspan></text>
<text x="450.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Переливати можна ЛИШЕ коли вихідний стек порожній —</tspan><tspan x="450.0" dy="17.2">інакше новіші елементи лягають поверх старіших, і FIFO ламається.</tspan></text>
</svg>