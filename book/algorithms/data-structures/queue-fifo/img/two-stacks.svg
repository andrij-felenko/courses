<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга з двох стеків: двічі перевернути — те саме, що не перевертати</text>
<text x="200.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Вхідний стек</text>
<text x="200.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кладемо сюди</text>
<rect x="167.0" y="168.0" width="66.0" height="38.0" rx="5" fill="#eafaf0" stroke="#2457d6" stroke-width="1.6"/>
<text x="200.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<rect x="167.0" y="210.0" width="66.0" height="38.0" rx="5" fill="#eafaf0" stroke="#2457d6" stroke-width="1.6"/>
<text x="200.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<rect x="167.0" y="252.0" width="66.0" height="38.0" rx="5" fill="#eafaf0" stroke="#2457d6" stroke-width="1.6"/>
<text x="200.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<line x1="200.0" y1="126.0" x2="200.0" y2="162.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">пхаємо A, B, C</text>
<text x="200.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зверху C — останній</text>
<text x="700.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний стек</text>
<text x="700.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">знімаємо звідси</text>
<rect x="667.0" y="168.0" width="66.0" height="38.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="700.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<rect x="667.0" y="210.0" width="66.0" height="38.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="700.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<rect x="667.0" y="252.0" width="66.0" height="38.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="700.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<line x1="700.0" y1="162.0" x2="700.0" y2="126.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">знімаємо A першим</text>
<text x="700.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зверху A — найстаріший</text>
<text x="450.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">переливаємо</text>
<text x="450.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">по одному: C, B, A</text>
<line x1="259.0" y1="230.0" x2="641.0" y2="230.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="450.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Стек перевертає порядок. Вхідний тримає C, B, A догори дриґом.</tspan><tspan x="450.0" dy="17.2">Переливання — це друге перевертання: воно скасовує перше,</tspan><tspan x="450.0" dy="17.2">і у вихідному найстаріший A опиняється зверху.</tspan><tspan x="450.0" dy="17.2">Виходять A, B, C — рівно в тому порядку, в якому зайшли.</tspan></text>
</svg>