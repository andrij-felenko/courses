<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга віддає елементи як прийшли, стек — задом наперед</text>
<line x1="465.0" y1="58.0" x2="465.0" y2="404.0" stroke="#d8dde3" stroke-width="1.4" stroke-dasharray="6 5"/>
