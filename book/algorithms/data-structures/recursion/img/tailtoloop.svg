<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три правила: хвостова рекурсія переписується на цикл дослівно</text>
<text x="250.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Рекурсія (хвостовий виклик)</text>
<text x="750.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Цикл</text>
<text x="500.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Параметри → змінні циклу</text>
<rect x="60.0" y="78.0" width="380.0" height="108.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="250.0" y="127.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">def list_sum(node, acc=0):</tspan><tspan x="250.0" dy="17.6">параметр acc = стан обчислення</tspan></text>
<rect x="560.0" y="78.0" width="380.0" height="108.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="750.0" y="127.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">def list_sum(node):</tspan><tspan x="750.0" dy="17.6">acc = 0      ← та сама роль</tspan></text>
<line x1="442.0" y1="132.0" x2="483.0" y2="132.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="517.0" y1="132.0" x2="558.0" y2="132.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="500.0" cy="132.0" r="16.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<text x="500.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="500.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">База → умова виходу</text>
<rect x="60.0" y="220.0" width="380.0" height="108.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="250.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">if node is None:</tspan><tspan x="250.0" dy="17.6">return acc            (база)</tspan></text>
<rect x="560.0" y="220.0" width="380.0" height="108.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="750.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">while node is not None:</tspan><tspan x="750.0" dy="17.6">...          return acc</tspan></text>
<line x1="442.0" y1="274.0" x2="483.0" y2="274.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="517.0" y1="274.0" x2="558.0" y2="274.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="500.0" cy="274.0" r="16.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<text x="500.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
<text x="500.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Хвостовий виклик → переприсвоєння</text>
<rect x="60.0" y="362.0" width="380.0" height="108.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="250.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">return list_sum(</tspan><tspan x="250.0" dy="17.6">  node.next, acc + node.value)</tspan></text>
<rect x="560.0" y="362.0" width="380.0" height="108.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="750.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">acc = acc + node.value</tspan><tspan x="750.0" dy="17.6">node = node.next   (новий виток)</tspan></text>
<line x1="442.0" y1="416.0" x2="483.0" y2="416.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="517.0" y1="416.0" x2="558.0" y2="416.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="500.0" cy="416.0" r="16.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="500.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">3</text>
<text x="500.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Стек не потрібен: на виринанні робити нема чого — кадр перевикористовується</text>
</svg>