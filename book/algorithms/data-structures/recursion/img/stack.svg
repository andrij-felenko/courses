<text x="188.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">= 3 · fact(2)</text>
<line x1="225.0" y1="268.0" x2="225.0" y2="290.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
