<text x="78.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">fact(4)</text>
<text x="188.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">= 4 · fact(3)</text>
<line x1="225.0" y1="176.0" x2="225.0" y2="198.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
