<text x="188.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">= 1   (база — стоп)</text>
<text x="225.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">далі викликати нема кого — розвертаємось</text>
<line x1="470.0" y1="96.0" x2="470.0" y2="520.0" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="713.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Виринання: значення повертаються догори</text>
<text x="713.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кожне відкладене множення нарешті рахується</text>
