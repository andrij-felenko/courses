<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">База зупиняє, крок меншає — без обох рекурсія не завершиться</text>
<text x="480.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будь-яка рекурсія стоїть на двох речах</text>
<rect x="60.0" y="84.0" width="396.0" height="92.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="80.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">БАЗА</text>
<text x="258.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">випадок, який розвʼязуємо прямо,</tspan><tspan x="258.0" dy="15.5">без звертання до себе:  fact(1) = 1</tspan></text>
<rect x="504.0" y="84.0" width="396.0" height="92.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="524.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">КРОК</text>
<text x="702.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">зводимо задачу до меншого себе,</tspan><tspan x="702.0" dy="15.5">ближче до бази:  fact(n) = n · fact(n−1)</tspan></text>
<text x="255.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Добре: щокроку ближче до бази — доходить</text>
<rect x="70.0" y="268.0" width="96.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="118.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">fact(4)</text>
<line x1="118.0" y1="303.0" x2="209.3" y2="306.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="161.3" y="308.0" width="96.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="209.3" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">fact(3)</text>
<line x1="209.3" y1="343.0" x2="300.7" y2="346.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="252.7" y="348.0" width="96.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="300.7" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">fact(2)</text>
<line x1="300.7" y1="383.0" x2="392.0" y2="386.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="344.0" y="388.0" width="96.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="392.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">fact(1) = 1</text>
<text x="255.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">стос порожніє, відповідь готова</text>
<text x="715.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Погано: крок не меншає — база недосяжна</text>
<rect x="530.0" y="268.0" width="96.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="578.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">f(4)</text>
<line x1="578.0" y1="303.0" x2="669.3" y2="306.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="621.3" y="308.0" width="96.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="669.3" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">f(4)</text>
<line x1="669.3" y1="343.0" x2="760.7" y2="346.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="712.7" y="348.0" width="96.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="760.7" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">f(4)</text>
<line x1="760.7" y1="383.0" x2="852.0" y2="386.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="804.0" y="388.0" width="96.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="852.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">f(4) …</text>
<text x="715.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">стос росте без упину → переповнення стека</text>
<line x1="480.0" y1="224.0" x2="480.0" y2="512.0" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="5 5"/>
</svg>