<text x="510.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">T(n) = T(n−1) + T(n−2) + O(1)</text>
