<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прокляття розмірності: зникнення об'єму вписаної сфери та концентрація міжточкових відстаней</text>
<rect x="50.0" y="60.0" width="240.0" height="240.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<circle cx="170.0" cy="180.0" r="120.0" fill="#e8effb" stroke="#2457d6" stroke-width="1.8"/>
<text x="170.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2D: Площина</text>
<rect x="105.3" y="156.2" width="129.4" height="47.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">V_сфери / V_куба</tspan><tspan x="170.0" dy="15.6">= π / 4 ≈ 78.5%</tspan></text>
<rect x="85.9" y="265.0" width="168.2" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="283.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Кути займають 21.5% об'єму</tspan></text>
<rect x="350.0" y="60.0" width="240.0" height="240.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<circle cx="470.0" cy="180.0" r="120.0" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="470.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3D: Простір</text>
<rect x="405.3" y="156.2" width="129.4" height="47.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">V_сфери / V_куба</tspan><tspan x="470.0" dy="15.6">= π / 6 ≈ 52.4%</tspan></text>
<rect x="385.9" y="265.0" width="168.2" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="283.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Кути займають 47.6% об'єму</tspan></text>
<rect x="650.0" y="60.0" width="240.0" height="240.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<circle cx="770.0" cy="180.0" r="22.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="770.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">d = 100: Гіперпростір</text>
<rect x="695.2" y="200.2" width="149.6" height="59.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">V_сфери / V_куба</tspan><tspan x="770.0" dy="14.3">≈ 1.86 · 10⁻⁷⁰ → 0</tspan><tspan x="770.0" dy="14.3">Кути займають ~100%</tspan></text>
<rect x="680.2" y="265.0" width="179.6" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="283.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Вся маса — у тонкій оболонці</tspan></text>
<rect x="37.1" y="358.4" width="845.8" height="63.2" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Концентрація відстаней (Beyer et al.):</tspan><tspan x="460.0" dy="15.6">lim_{d → ∞} (d_max - d_min) / d_min = 0</tspan><tspan x="460.0" dy="15.6">Усі точки стають однаково віддаленими від запиту — радіус пошуку накриває весь простір, відсікання падає до 0%.</tspan></text>
</svg>