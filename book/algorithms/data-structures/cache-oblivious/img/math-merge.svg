<text x="290.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">кеш M</text>
<text x="98.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">вхідні</text>
<text x="98.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">доріжки</text>
<rect x="170.0" y="122.0" width="180.0" height="24.0" rx="3" fill="#eef4ff" stroke="#333333" stroke-width="1.0"/>
<text x="260.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">буфер = 1 блок (B елементів)</text>
<line x1="102.0" y1="134.0" x2="166.0" y2="134.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="170.0" y="156.0" width="180.0" height="24.0" rx="3" fill="#eef4ff" stroke="#333333" stroke-width="1.0"/>
<text x="260.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">буфер = 1 блок (B елементів)</text>
<line x1="102.0" y1="168.0" x2="166.0" y2="168.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="170.0" y="190.0" width="180.0" height="24.0" rx="3" fill="#eef4ff" stroke="#333333" stroke-width="1.0"/>
<text x="260.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">буфер = 1 блок (B елементів)</text>
<line x1="102.0" y1="202.0" x2="166.0" y2="202.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="170.0" y="224.0" width="180.0" height="24.0" rx="3" fill="#eef4ff" stroke="#333333" stroke-width="1.0"/>
<text x="260.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">буфер = 1 блок (B елементів)</text>
<line x1="102.0" y1="236.0" x2="166.0" y2="236.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="260.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">⋮</text>
<text x="290.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">усього M/B буферів — по одному на доріжку</text>
<line x1="290.0" y1="330.0" x2="290.0" y2="360.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="290.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">злита доріжка — довша в M/B разів</text>
<text x="668.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки таких проходів</text>
<rect x="480.0" y="82.0" width="380.0" height="244.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="670.0" y="133.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">За прохід кількість доріжок ділиться</tspan><tspan x="670.0" dy="15.0">на M/B — стільки буферів по B</tspan><tspan x="670.0" dy="15.0">влазить у кеш M.</tspan><tspan x="670.0" dy="15.0"></tspan><tspan x="670.0" dy="15.0">на старті:  N/B доріжок (по 1 блоку)</tspan><tspan x="670.0" dy="15.0">після k проходів:  (N/B) / (M/B)^k</tspan><tspan x="670.0" dy="15.0">лишилась одна  →  k = log_{M/B}(N/B)</tspan><tspan x="670.0" dy="15.0"></tspan><tspan x="670.0" dy="15.0">один прохід читає й пише все:  Θ(N/B)</tspan><tspan x="670.0" dy="15.0"></tspan><tspan x="670.0" dy="15.0">разом:  Θ( (N/B) · log_{M/B}(N/B) )</tspan></text>
</svg>