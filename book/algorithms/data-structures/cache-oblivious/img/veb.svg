<rect x="70.0" y="330.0" width="700.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Знайдеться рівень рекурсії, де трикутники завбільшки з блок B — кожен лягає в одну лінію.</tspan><tspan x="420.0" dy="14.3">Шлях корінь→листок перетинає ланцюжок таких трикутників, за кожен — один промах:</tspan><tspan x="420.0" dy="14.3">усього O(log_B N) промахів, як у B-дерева, але жодного B у побудові розкладки немає.</tspan></text>
