<rect x="716.0" y="92.0" width="150.0" height="218.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="791.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">Виміряно</tspan><tspan x="791.0" dy="13.7">симулятором</tspan><tspan x="791.0" dy="13.7">з тексту.</tspan><tspan x="791.0" dy="13.7"></tspan><tspan x="791.0" dy="13.7">N = 128,</tspan><tspan x="791.0" dy="13.7">лінія = 8 double.</tspan><tspan x="791.0" dy="13.7"></tspan><tspan x="791.0" dy="13.7">Кеш ×4  →</tspan><tspan x="791.0" dy="13.7">промахів ÷2</tspan><tspan x="791.0" dy="13.7">РІВНО:</tspan><tspan x="791.0" dy="13.7">65 536 → 32 768.</tspan><tspan x="791.0" dy="13.7">Це і є 1/√M.</tspan><tspan x="791.0" dy="13.7"></tspan><tspan x="791.0" dy="13.7">Жодного M</tspan><tspan x="791.0" dy="13.7">у коді рекурсії.</tspan></text>
<rect x="70.0" y="420.0" width="740.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="447.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Наївний тримається, поки в кеші є місце на стовпець B, — і провалюється вдев'ятеро, щойно його нема.</tspan><tspan x="440.0" dy="14.3">Де саме лежить обрив, вирішують M і B, яких код не знає. Рекурсія обриву не має взагалі: вона спадає</tspan><tspan x="440.0" dy="14.3">рівно як 1/√M на кожній машині — і на 4 КБ виграє в наївного 36 разів, нічого про кеш не питаючи.</tspan></text>
