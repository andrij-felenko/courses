<text x="330.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">кожен вузол на різі вже влазить у кеш</text>
<rect x="100.0" y="354.0" width="620.0" height="36.0" rx="6" fill="#f0f7f2" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="375.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="410.0" dy="0.0">нижче різу — дані вже в кеші: нових промахів немає</tspan></text>
<rect x="60.0" y="406.0" width="760.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="440.0" y="435.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">рівень різу i:    3·(N/2ⁱ)² ≈ M   →   2ⁱ ≈ N·√3 / √M</tspan><tspan x="440.0" dy="15.0">вузлів на різі:   8ⁱ = (2ⁱ)³ ≈ 3√3 · N³ / (M·√M)</tspan><tspan x="440.0" dy="15.0">ціна вузла:       принести його 3M елементів = Θ(M / B) блоків</tspan><tspan x="440.0" dy="15.0">разом:            Θ(N³ / (M·√M)) · Θ(M / B) = Θ(N³ / (B·√M))</tspan></text>
</svg>