<text x="100.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">РІЗ — рівень i, де підзадача вперше влізла в кеш:  3·(N/2ⁱ)² ≤ M</text>
