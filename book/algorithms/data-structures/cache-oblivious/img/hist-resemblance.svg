<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схожість між деревом ван Емде Боаса й розкладкою — і межі цієї схожості</text>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схожість, за яку дали ім'я, — і де вона ламається</text>
<line x1="470.0" y1="52.0" x2="470.0" y2="306.0" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="250.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Стратифіковане дерево ван Емде Боаса, 1975</text>
<text x="250.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ділить ВСЕСВІТ ключів 1…n</text>
<rect x="62.0" y="106.0" width="376.0" height="30.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="156.0" y1="106.0" x2="156.0" y2="136.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="250.0" y1="106.0" x2="250.0" y2="136.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="344.0" y1="106.0" x2="344.0" y2="136.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="109.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">√n</text>
<text x="203.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">√n</text>
<text x="297.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">√n</text>
<text x="391.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">√n</text>
<text x="250.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">√n блоків по √n ключів — і так рекурсивно вглиб</text>
<line x1="250.0" y1="164.0" x2="250.0" y2="186.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120.0" y="190.0" width="260.0" height="34.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="250.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">+ службова структура: де є ключі</text>
<text x="250.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">міра: ЧАС, O(log log n)</text>
<text x="250.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">про кеші й блоки — ані слова</text>
<text x="700.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Розкладка: Прокоп 1999, названа 2000</text>
<text x="700.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ділить ВИСОТУ дерева h навпіл</text>
<line x1="700.0" y1="118.0" x2="650.0" y2="156.0" stroke="#333333" stroke-width="1.2"/>
<line x1="700.0" y1="118.0" x2="750.0" y2="156.0" stroke="#333333" stroke-width="1.2"/>
<line x1="650.0" y1="156.0" x2="618.0" y2="196.0" stroke="#333333" stroke-width="1.2"/>
<line x1="650.0" y1="156.0" x2="682.0" y2="196.0" stroke="#333333" stroke-width="1.2"/>
<line x1="750.0" y1="156.0" x2="718.0" y2="196.0" stroke="#333333" stroke-width="1.2"/>
<line x1="750.0" y1="156.0" x2="782.0" y2="196.0" stroke="#333333" stroke-width="1.2"/>
<line x1="578.0" y1="176.0" x2="822.0" y2="176.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="826.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">розріз h/2</text>
<circle cx="700.0" cy="118.0" r="11.0" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="650.0" cy="156.0" r="11.0" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="750.0" cy="156.0" r="11.0" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="618.0" cy="196.0" r="10.0" fill="#f8e6e2" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="682.0" cy="196.0" r="10.0" fill="#f8e6e2" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="718.0" cy="196.0" r="10.0" fill="#f8e6e2" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="782.0" cy="196.0" r="10.0" fill="#f8e6e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="700.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">шматки лягають у пам'ять суцільно, і так вглиб</text>
<text x="700.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">міра: ПРОМАХИ, O(log_B N)</text>
<text x="700.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">саме дерево — звичайне, інший лише ПОРЯДОК</text>
<rect x="50.0" y="322.0" width="840.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="66.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">СПІЛЬНЕ — сама форма:</text>
<text x="66.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">рекурсивний поділ навпіл дає шматки завбільшки ≈ √цілого, тож рекурсія проходить УСІ масштаби одразу.</text>
<rect x="50.0" y="398.0" width="840.0" height="128.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="66.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">ЛАМАЄТЬСЯ — на всьому іншому:</text>
<text x="66.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">· різні об'єкти поділу: всесвіт ключів  ↔  висота дерева;</text>
<text x="66.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">· різна міра вартості: час виконання  ↔  пересилання блоків;</text>
<text x="66.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">· дерево ван Емде Боаса — структура зі службовими вказівниками, розкладка ж — лише порядок вузлів у пам'яті.</text>
<text x="66.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-style="italic">Бендер, Демейн і Фарах-Колтон написали це просто у зносці — її майже ніколи не цитують.</text>
</svg>