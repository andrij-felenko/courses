<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 852" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="852" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки: як міряли кеш, хто такий ван Емде Боас і що зробили в MIT</text>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки, що зійшлися лише назвою</text>
<rect x="112.0" y="50.0" width="16.0" height="12.0" rx="2" fill="#eef3fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="136.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">як навчилися МІРЯТИ кеш</text>
<rect x="294.5" y="50.0" width="16.0" height="12.0" rx="2" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="318.5" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">нитка ван Емде Боаса</text>
<rect x="460.8" y="50.0" width="16.0" height="12.0" rx="2" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="484.8" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">нитка MIT</text>
<line x1="100.0" y1="92.0" x2="100.0" y2="812.0" stroke="#c7ccd2" stroke-width="1.6"/>
<text x="88.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1969</text>
<circle cx="100.0" cy="126.0" r="5.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<rect x="112.0" y="100.0" width="580.0" height="54.0" rx="5" fill="#eef3fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="124.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Синглтон: поділ навпіл поліпшує локальність</text>
<text x="124.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">давно відома річ — але ще не теорія, а спостереження</text>
<text x="88.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1975</text>
<circle cx="100.0" cy="192.0" r="5.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.2"/>
<rect x="112.0" y="166.0" width="580.0" height="54.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="124.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">ван Емде Боас: стратифіковані дерева</text>
<text x="124.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">O(log log n) на всесвіті 1…n; про кеші — ані слова</text>
<text x="88.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1976</text>
<circle cx="100.0" cy="258.0" r="5.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.2"/>
<rect x="112.0" y="232.0" width="580.0" height="54.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="124.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Каас і Зейлстра: реалізація і спільна стаття</text>
<text x="124.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">структуру доводить до пуття команда, не одна людина</text>
<text x="88.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1981</text>
<circle cx="100.0" cy="324.0" r="5.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<rect x="112.0" y="298.0" width="580.0" height="54.0" rx="5" fill="#eef3fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="124.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Гонг і Кунг: червоно-синя камінцева гра</text>
<text x="124.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">нижні оцінки на обмін із повільною пам'яттю</text>
<text x="88.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1988</text>
<circle cx="100.0" cy="390.0" r="5.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<rect x="112.0" y="364.0" width="580.0" height="54.0" rx="5" fill="#eef3fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="124.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Аґарвал і Віттер: модель із B і M</text>
<text x="124.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">точна міра з'явилась — але алгоритми в ній ЗНАЮТЬ B і M</text>
<text x="88.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1994</text>
<circle cx="100.0" cy="456.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<rect x="112.0" y="430.0" width="580.0" height="54.0" rx="5" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="124.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Група MIT помічає: рекурсивне множення матриць</text>
<text x="124.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">кеш-оптимальне БЕЗ жодного підбору. Назви ще немає</text>
<text x="88.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1996</text>
<circle cx="100.0" cy="522.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<rect x="112.0" y="496.0" width="580.0" height="54.0" rx="5" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="124.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Блумофе та ін., SPAA (Падуя): алгоритм у друку</text>
<text x="124.0" y="537.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">надрукований — але кеш-незалежності там не досліджують</text>
<text x="88.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1997</text>
<circle cx="100.0" cy="588.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<rect x="112.0" y="562.0" width="580.0" height="54.0" rx="5" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="124.0" y="584.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Група ухвалює термін «cache-oblivious»</text>
<text x="124.0" y="603.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">спостереження нарешті стає програмою досліджень</text>
<text x="88.0" y="658.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1999</text>
<circle cx="100.0" cy="654.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<rect x="112.0" y="628.0" width="580.0" height="54.0" rx="5" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="124.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Прокоп: магістерська MIT (21.05) → FOCS (Нью-Йорк, 17–19.10)</text>
<text x="124.0" y="669.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">модель ideal-cache; розкладка — 2 сторінки в «майбутній роботі»</text>
<text x="88.0" y="724.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">2000</text>
<circle cx="100.0" cy="720.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<rect x="112.0" y="694.0" width="580.0" height="54.0" rx="5" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="124.0" y="716.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Бендер, Демейн, Фарах-Колтон, FOCS: динамічні дерева</text>
<text x="124.0" y="735.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">і саме вони НАЗИВАЮТЬ розкладку іменем ван Емде Боаса</text>
<text x="88.0" y="790.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">2012</text>
<circle cx="100.0" cy="786.0" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.2"/>
<rect x="112.0" y="760.0" width="580.0" height="54.0" rx="5" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/>
<text x="124.0" y="782.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">TALG 8(1):4 — журнальна версія, через 13 років</text>
<text x="124.0" y="801.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">заразом виправлено формулу Штрассена з версії 1999 р.</text>
<line x1="692.0" y1="193.0" x2="752.0" y2="193.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="752.0" y1="193.0" x2="752.0" y2="721.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="752.0" y1="721.0" x2="696.0" y2="721.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="766.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">лише НАЗВА —</text>
<text x="766.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">за СХОЖІСТЮ</text>
<text x="766.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">форми, через</text>
<text x="766.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">25 років, і</text>
<text x="766.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">не від автора</text>
</svg>