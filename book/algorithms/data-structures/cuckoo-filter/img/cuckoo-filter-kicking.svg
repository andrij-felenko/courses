<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадне витіснення відбитків (Kicking) під час вставки</text>
<text x="170.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: Вставка нового відбитка</text>
<text x="170.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">x має f = 0x4B, цілиться в T[1]</text>
<rect x="65.0" y="105.0" width="218.0" height="40.0" rx="4" fill="#f4faf6" stroke="#c0392b" stroke-width="2.0"/><text x="51.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">[1]</text><rect x="70.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="96.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x11</text><rect x="122.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="148.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x82</text><rect x="174.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="200.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x33</text><rect x="226.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="252.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x44</text>
<text x="170.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Кошик T[1] повністю заповнений!</text>
<text x="170.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обираємо жертву: слот 2 (0x82)</text>
<line x1="285.0" y1="125.0" x2="335.0" y2="125.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 2: Заміна та виселення</text>
<text x="460.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x4B займає слот, 0x82 витіснено</text>
<rect x="355.0" y="105.0" width="218.0" height="40.0" rx="4" fill="#f4faf6" stroke="#27ae60" stroke-width="2.0"/><text x="341.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">[1]</text><rect x="360.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="386.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x11</text><rect x="412.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="438.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x4B</text><rect x="464.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="490.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x33</text><rect x="516.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="542.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x44</text>
<text x="460.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обчислення альтернативи для 0x82:</text>
<text x="460.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">i_alt = 1 ⊕ hash(0x82) = 4</text>
<line x1="575.0" y1="125.0" x2="625.0" y2="125.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="750.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 3: Поселення у кошику T[4]</text>
<text x="750.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Перевірка кошика T[4] на наявність місця</text>
<rect x="645.0" y="105.0" width="218.0" height="40.0" rx="4" fill="#f4faf6" stroke="#c0392b" stroke-width="2.0"/><text x="631.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">[4]</text><rect x="650.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="676.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x7A</text><rect x="702.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="728.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0x9F</text><rect x="754.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="780.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">—</text><rect x="806.0" y="109.0" width="52.0" height="32.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="832.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">—</text>
<text x="750.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Знайдено вільний слот 3!</text>
<text x="750.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0x82 записується в T[4][2] → Успіх</text>
<rect x="40.0" y="235.0" width="860.0" height="160.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="470.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові властивості каскадного витіснення (Kicking Walk)</text>
<text x="60.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. Без збереження вихідного ключа: переміщення можливе завдяки XOR-симетрії i_alt = i_curr ⊕ hash(f).</text>
<text x="60.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. Обмеження блукання: лічильник MAX_KICKS (зазвичай 500) запобігає зацикленню при переповненні.</text>
<text x="60.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. Високий коефіцієнт заповнення: кошики розміром b = 4 дозволяють досягати понад 95% заповнення таблиці.</text>
<text x="60.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4. Амортизована складність: понад 98% вставок знаходять вільне місце без жодного витіснення (O(1)).</text>
</svg>