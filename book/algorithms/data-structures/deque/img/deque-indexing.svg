<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворанговий пошук елемента за індексом i (O(1))</text>
<rect x="60.0" y="70.0" width="320.0" height="70.0" rx="6" fill="#f0f4ff" stroke="#27ae60" stroke-width="1.5"/>
<text x="80.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 1: Номер блоку в Карті</text>
<text x="80.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">map_index = head_map + (offset / BLOCK_SIZE)</text>
<rect x="440.0" y="70.0" width="320.0" height="70.0" rx="6" fill="#eafaf0" stroke="#c0392b" stroke-width="1.5"/>
<text x="460.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 2: Зміщення всередині Блоку</text>
<text x="460.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">elem_index = offset % BLOCK_SIZE</text>
<line x1="382.0" y1="105.0" x2="438.0" y2="105.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="200.0" y="175.0" width="420.0" height="55.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="220.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Результат: 2 зчитування пам'яті (Map -&gt; Block -&gt; Elem)</text>
</svg>