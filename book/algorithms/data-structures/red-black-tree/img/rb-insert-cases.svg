<line x1="330.0" y1="290.0" x2="310.0" y2="320.0" stroke="#dc2626" stroke-width="2.0"/>
<circle cx="350.0" cy="265.0" r="14.0" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="350.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">G</text>
<circle cx="330.0" cy="290.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
