<text x="110.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
<line x1="200.0" y1="290.0" x2="270.0" y2="290.0" stroke="#2563eb" stroke-width="2.0"/>
<polygon points="270.0,290.0 260.0,285.0 260.0,295.0" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="235.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Left-Rotate(P)</text>
<text x="350.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Зведення до Випадку 3 (Line):</text>
