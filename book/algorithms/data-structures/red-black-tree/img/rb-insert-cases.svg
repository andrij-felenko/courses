<circle cx="150.0" cy="145.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">U</text>
