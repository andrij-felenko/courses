<text x="70.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
<line x1="200.0" y1="140.0" x2="270.0" y2="140.0" stroke="#2563eb" stroke-width="2.0"/>
<polygon points="270.0,140.0 260.0,135.0 260.0,145.0" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="235.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Recolor</text>
<text x="350.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Після перефарбування:</text>
