<circle cx="90.0" cy="445.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
<text x="90.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">P</text>
<circle cx="150.0" cy="445.0" r="14.0" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="150.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">U</text>
<circle cx="70.0" cy="475.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
<text x="70.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
<line x1="200.0" y1="445.0" x2="270.0" y2="445.0" stroke="#059669" stroke-width="2.0"/>
<polygon points="270.0,445.0 260.0,440.0 260.0,450.0" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="235.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">Right-Rotate(G)</text>
<text x="235.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">+ Recolor</text>
<text x="350.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Фінальний збалансований стан:</text>
<line x1="350.0" y1="420.0" x2="320.0" y2="445.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="350.0" y1="420.0" x2="380.0" y2="445.0" stroke="#dc2626" stroke-width="2.0"/>
<circle cx="350.0" cy="420.0" r="14.0" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="350.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">P</text>
<circle cx="320.0" cy="445.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
<text x="320.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
<circle cx="380.0" cy="445.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
<text x="380.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">G</text>
<text x="460.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start">P стає чорним коренем піддерева,</text>
<text x="460.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">G та N — його червоними дітьми. Дерево повністю збалансоване!</text>
