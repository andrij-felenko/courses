<text x="40.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Випадок 3: Дядько U чорний, N — зовнішній племінник (Line) → Поворот G + Перефарбування</text>
<text x="120.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">До повороту G:</text>
