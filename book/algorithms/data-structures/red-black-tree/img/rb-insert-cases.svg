<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 842.34 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="842.34" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="800.0" height="500.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення інваріантів після вставки нової червоної вершини N</text>
<rect x="25.0" y="60.0" width="770.0" height="130.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="40.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Випадок 1: Дядько U червоний (Red Uncle) → Перефарбування (Recoloring)</text>
<text x="120.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">До балансування:</text>
<line x1="120.0" y1="120.0" x2="90.0" y2="145.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="120.0" y1="120.0" x2="150.0" y2="145.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="90.0" y1="145.0" x2="70.0" y2="170.0" stroke="#dc2626" stroke-width="2.0"/>
<circle cx="120.0" cy="120.0" r="14.0" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="120.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">G</text>
