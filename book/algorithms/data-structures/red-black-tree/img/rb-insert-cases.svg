<circle cx="380.0" cy="145.0" r="14.0" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="380.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">U</text>
<circle cx="300.0" cy="170.0" r="14.0" fill="#dc2626" stroke="#991b1b" stroke-width="2.0"/>
<text x="300.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
<text x="450.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start">P та U стають чорними, G стає червоним.</text>
<text x="450.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">Конфлікт переноситься на рівень G (перевірка вище).</text>
