<text x="40.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Випадок 2: Дядько U чорний, N — внутрішній племінник (Zig-Zag) → Поворот навколо P</text>
<text x="120.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">До повороту P:</text>
