<rect x="40.0" y="270.0" width="880.0" height="145.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="480.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Механізм Skip Pointers (стрибкових покажчиків):</tspan><tspan x="480.0" dy="15.0">1. Якщо поточний DocID у списку A (наприклад, 45) більший за максимальний DocID блоку B (28),</tspan><tspan x="480.0" dy="15.0">   весь блок з усіма проміжними значеннями пропускається без побайтового декодування.</tspan><tspan x="480.0" dy="15.0">2. Сканується лише той блок, максимальний ідентифікатор якого не менший за шуканий (Блок 1, max 52).</tspan><tspan x="480.0" dy="15.0">Складність перетину скорочується з O(|A| + |B|) до O(|A| · log(|B|/|A|)).</tspan></text>
</svg>