<line x1="190.0" y1="110.0" x2="134.0" y2="148.0" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="190.0" y1="110.0" x2="218.0" y2="148.0" stroke="#94a3b8" stroke-width="1.8"/>
