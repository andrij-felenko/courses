<text x="50.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">A</text>
<circle cx="78.0" cy="186.0" r="15.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="78.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">x</text>
<rect x="91.0" y="214.0" width="30.0" height="20.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="106.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">B</text>
<circle cx="134.0" cy="148.0" r="15.0" fill="#eef6ff" stroke="#2457d6" stroke-width="2.2"/>
<text x="134.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">p</text>
<rect x="147.0" y="176.0" width="30.0" height="20.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="162.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">C</text>
<circle cx="190.0" cy="110.0" r="15.0" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
<text x="190.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">g</text>
<rect x="203.0" y="138.0" width="30.0" height="20.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="218.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">D</text>
<text x="190.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">r(g) = r'(x) [розмір всього піддерева]</text>
<text x="190.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потенціал: Φ = r(x) + r(p) + r(g)</text>
<line x1="345.0" y1="175.0" x2="455.0" y2="175.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Zig-Zig</text>
<text x="400.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ΔΦ = Φ' - Φ</text>
<text x="610.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Стан після повороту: r'(g) + r'(p) &lt; 2r'(x)</text>
<line x1="498.0" y1="110.0" x2="470.0" y2="148.0" stroke="#94a3b8" stroke-width="1.8"/>
<line x1="498.0" y1="110.0" x2="554.0" y2="148.0" stroke="#94a3b8" stroke-width="1.8"/>
