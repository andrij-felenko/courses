<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язання розбіжностей за допомогою версійних векторів</text>
<rect x="0.0" y="0.0" width="960.0" height="430.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Версійні вектори в розподіленому сховищі: паралельні записи та злиття</text>
<rect x="40.0" y="70.0" width="200.0" height="70.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="94.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Базовий стан:</tspan><tspan x="140.0" dy="15.0">кошик = [&quot;книга&quot;]</tspan><tspan x="140.0" dy="15.0">вектор = {A: 1}</tspan></text>
<line x1="240.0" y1="95.0" x2="340.0" y2="65.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="240.0" y1="115.0" x2="340.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="35.0" width="230.0" height="65.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="455.0" y="57.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Клієнт 1 пише на вузол A:</tspan><tspan x="455.0" dy="14.3">кошик = [&quot;книга&quot;, &quot;олівець&quot;]</tspan><tspan x="455.0" dy="14.3">вектор = {A: 2, B: 0}</tspan></text>
<rect x="340.0" y="115.0" width="230.0" height="65.0" rx="6" fill="#edf2ff" stroke="#2457d6" stroke-width="1.5"/><text x="455.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Клієнт 2 пише на вузол B:</tspan><tspan x="455.0" dy="14.3">кошик = [&quot;книга&quot;, &quot;зошит&quot;]</tspan><tspan x="455.0" dy="14.3">вектор = {A: 1, B: 1}</tspan></text>
<line x1="570.0" y1="65.0" x2="660.0" y2="95.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="145.0" x2="660.0" y2="115.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="60.0" width="260.0" height="90.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="790.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Читання сховища:</tspan><tspan x="790.0" dy="14.3">Вектори {A:2, B:0} та {A:1, B:1}</tspan><tspan x="790.0" dy="14.3">НЕПОРІВНЯННІ (конфлікт!).</tspan><tspan x="790.0" dy="14.3">Сховище повертає обидва двійники:</tspan><tspan x="790.0" dy="14.3">siblings = [v₁, v₂]</tspan></text>
<line x1="790.0" y1="150.0" x2="790.0" y2="200.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="200.0" y="210.0" width="580.0" height="80.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Розв'язання на рівні застосунку (Application-level Merge):</tspan><tspan x="490.0" dy="15.0">Застосунок бере об'єднання кошиків: [&quot;книга&quot;, &quot;олівець&quot;, &quot;зошит&quot;]</tspan><tspan x="490.0" dy="15.0">Новий версійний вектор об'єднує предків та інкрементує координатора:</tspan><tspan x="490.0" dy="15.0">{A: 2, B: 1} → запис на A → {A: 3, B: 1}</tspan></text>
<rect x="120.0" y="315.0" width="720.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Властивість домінування:</tspan><tspan x="480.0" dy="15.6">Новий вектор {A: 3, B: 1} строго більший за {A: 2, B: 0} та {A: 1, B: 1}.</tspan><tspan x="480.0" dy="15.6">При наступних читаннях двійників більше немає — стан повністю узгоджений!</tspan></text>
</svg>