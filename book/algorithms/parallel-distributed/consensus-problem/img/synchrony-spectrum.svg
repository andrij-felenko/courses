<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр моделей синхронності</text>
<rect x="0.0" y="0.0" width="960.0" height="440.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр моделей синхронності та теоретична межа консенсусу</text>
<rect x="40.0" y="75.0" width="270.0" height="320.0" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="40.0" y="75.0" width="270.0" height="6.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="175.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Синхронна модель</text>
<rect x="50.0" y="123.0" width="250.0" height="54.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="175.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">Відома верхня межа затримки Δ.</tspan><tspan x="175.0" dy="15.0">Годинники синхронізовані.</tspan></text>
<rect x="50.0" y="187.0" width="250.0" height="108.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="175.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Консенсус розв'язний детерміновано</tspan><tspan x="175.0" dy="14.3">навіть за f збоїв за f+1 раундів.</tspan><tspan x="175.0" dy="14.3">Тайм-аут точно виявляє збій вузла.</tspan></text>
<rect x="50.0" y="305.0" width="250.0" height="76.0" rx="6" fill="#f6f8fa" stroke="#c3c8d0" stroke-width="1.5"/><text x="175.0" y="339.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Практика: локальні шини, авіоніка,</tspan><tspan x="175.0" dy="15.0">жорсткий реальний час.</tspan></text>
<rect x="345.0" y="75.0" width="270.0" height="320.0" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="345.0" y="75.0" width="270.0" height="6.0" rx="3" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="480.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Частково синхронна (DLS)</text>
<rect x="355.0" y="123.0" width="250.0" height="54.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="480.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">Асинхронний хаос до часу GST;</tspan><tspan x="480.0" dy="15.0">після GST затримки обмежені Δ.</tspan></text>
<rect x="355.0" y="187.0" width="250.0" height="108.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="480.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Безпека (Safety) гарантована завжди.</tspan><tspan x="480.0" dy="13.0">Живість (Liveness) гарантована</tspan><tspan x="480.0" dy="13.0">після стабілізації мережі (GST).</tspan></text>
<rect x="355.0" y="305.0" width="250.0" height="76.0" rx="6" fill="#f6f8fa" stroke="#c3c8d0" stroke-width="1.5"/><text x="480.0" y="339.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Практика: Paxos, Raft, Zab, etcd,</tspan><tspan x="480.0" dy="15.0">ZooKeeper, сучасні СУБД.</tspan></text>
<rect x="650.0" y="75.0" width="270.0" height="320.0" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="650.0" y="75.0" width="270.0" height="6.0" rx="3" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="785.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Асинхронна модель</text>
<rect x="660.0" y="123.0" width="250.0" height="54.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/><text x="785.0" y="147.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="785.0" dy="0.0">Затримки повідомлень довільні.</tspan><tspan x="785.0" dy="12.3">Годинники дрейфують, збій невідрізнимий.</tspan></text>
<rect x="660.0" y="187.0" width="250.0" height="108.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="785.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Теорема FLP (1985):</tspan><tspan x="785.0" dy="11.7">Детермінований консенсус неможливий</tspan><tspan x="785.0" dy="11.7">навіть при f = 1 збої аварійної зупинки.</tspan></text>
<rect x="660.0" y="305.0" width="250.0" height="76.0" rx="6" fill="#f6f8fa" stroke="#c3c8d0" stroke-width="1.5"/><text x="785.0" y="339.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Вихід: рандомізація (Ben-Or),</tspan><tspan x="785.0" dy="15.0">евристичні детектори збоїв (◇S).</tspan></text>
</svg>