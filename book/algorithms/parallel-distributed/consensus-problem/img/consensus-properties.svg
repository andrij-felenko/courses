<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості розподіленого консенсусу</text>
<rect x="0.0" y="0.0" width="960.0" height="380.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три обов'язкові вимоги задачі розподіленого консенсусу</text>
<rect x="26.5" y="65.0" width="285.0" height="280.0" rx="10" fill="#fbfcfd" stroke="#d2d7df" stroke-width="1.5"/>
<rect x="26.5" y="65.0" width="285.0" height="8.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="169.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Узгодженість (Agreement)</text>
<text x="169.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Одностайність рішення</text>
<line x1="41.5" y1="133.0" x2="296.5" y2="133.0" stroke="#e5e9f0" stroke-width="1.2"/>
<rect x="38.5" y="143.0" width="261.0" height="102.0" rx="6" fill="#ffffff" stroke="#e6ebf1" stroke-width="1.5"/><text x="169.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="169.0" dy="0.0">Жодні два коректні вузли не можуть</tspan><tspan x="169.0" dy="15.6">прийняти різні рішення.</tspan><tspan x="169.0" dy="15.6">Формально: якщо p вирішив v,</tspan><tspan x="169.0" dy="15.6">а q вирішив u, то v = u.</tspan></text>
<rect x="38.5" y="255.0" width="261.0" height="76.0" rx="6" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.5"/><text x="169.0" y="290.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="169.0" dy="0.0">Без неї: розкол на табори (split-brain),</tspan><tspan x="169.0" dy="12.3">суперечливі стани реплік.</tspan></text>
<rect x="337.5" y="65.0" width="285.0" height="280.0" rx="10" fill="#fbfcfd" stroke="#d2d7df" stroke-width="1.5"/>
<rect x="337.5" y="65.0" width="285.0" height="8.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="480.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Слушність (Validity)</text>
<text x="480.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Змістовність вибору</text>
<line x1="352.5" y1="133.0" x2="607.5" y2="133.0" stroke="#e5e9f0" stroke-width="1.2"/>
<rect x="349.5" y="143.0" width="261.0" height="102.0" rx="6" fill="#ffffff" stroke="#e6ebf1" stroke-width="1.5"/><text x="480.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Прийняте значення мусить бути</tspan><tspan x="480.0" dy="15.6">запропоноване бодай одним вузлом.</tspan><tspan x="480.0" dy="15.6">Виключає тривіальні алгоритми,</tspan><tspan x="480.0" dy="15.6">де вузли завжди повертають 0.</tspan></text>
<rect x="349.5" y="255.0" width="261.0" height="76.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="289.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Без неї: фальшивий консенсус,</tspan><tspan x="480.0" dy="15.0">система ігнорує реальні запити.</tspan></text>
<rect x="648.5" y="65.0" width="285.0" height="280.0" rx="10" fill="#fbfcfd" stroke="#d2d7df" stroke-width="1.5"/>
<rect x="648.5" y="65.0" width="285.0" height="8.0" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="791.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Завершуваність (Termination)</text>
<text x="791.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Гарантія живості</text>
<line x1="663.5" y1="133.0" x2="918.5" y2="133.0" stroke="#e5e9f0" stroke-width="1.2"/>
<rect x="660.5" y="143.0" width="261.0" height="102.0" rx="6" fill="#ffffff" stroke="#e6ebf1" stroke-width="1.5"/><text x="791.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">Кожен коректний вузол рано чи пізно</tspan><tspan x="791.0" dy="15.6">зобов'язаний прийняти рішення.</tspan><tspan x="791.0" dy="15.6">Процес не може зависнути</tspan><tspan x="791.0" dy="15.6">в очікуванні назавжди.</tspan></text>
<rect x="660.5" y="255.0" width="261.0" height="76.0" rx="6" fill="#f7f9fd" stroke="#2457d6" stroke-width="1.5"/><text x="791.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="791.0" dy="0.0">Без неї: вічний deadlock, система</tspan><tspan x="791.0" dy="13.7">блокується під час збоїв (як у 2PC).</tspan></text>
</svg>