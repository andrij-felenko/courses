<text x="450.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">додавання перемагає: новий тег a₂ переживає видалення, що його не бачило</text>
