<rect x="56.0" y="322.0" width="360.0" height="58.0" rx="6" fill="#f7f8fa" stroke="#c7ced6" stroke-width="1.5"/><text x="236.0" y="347.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="236.0" dy="0.0">канал може губити, дублювати й переставляти —</tspan><tspan x="236.0" dy="15.6">досить, щоб пакет КОЛИСЬ дійшов</tspan></text>
