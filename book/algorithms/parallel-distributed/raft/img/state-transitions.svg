<rect x="390.0" y="140.0" width="220.0" height="100.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="500.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">КАНДИДАТ (Candidate)</tspan><tspan x="500.0" dy="11.7"></tspan><tspan x="500.0" dy="11.7">Інкрементує терм, голосує за себе,</tspan><tspan x="500.0" dy="11.7">надсилає RequestVote усім</tspan></text>
