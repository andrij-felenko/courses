<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка Raft під час розділення мережі та узгодження після зцілення</text>
<rect x="30.0" y="70.0" width="420.0" height="350.0" rx="10" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ізольована меншість (2 вузли з 5)</text>
<rect x="60.0" y="125.0" width="160.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">S1 (Старий Лідер, T1)</tspan></text>
<rect x="260.0" y="125.0" width="160.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">S2 (Фоловер, T1)</tspan></text>
<rect x="50.0" y="200.0" width="380.0" height="100.0" rx="6" fill="#ffffff" stroke="#f5c6cb" stroke-width="1.5"/><text x="240.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">• Клієнт шле запис W1 на S1.</tspan><tspan x="240.0" dy="13.0">• S1 додає W1 у свій лог і шле AppendEntries на S2.</tspan><tspan x="240.0" dy="13.0">• Разом є 2 копії. Але кворум вимагає 3 (5/2 + 1)!</tspan><tspan x="240.0" dy="13.0">• S1 НЕ МОЖЕ зафіксувати W1 і не відповідає успіхом клієнту.</tspan></text>
<rect x="101.7" y="331.8" width="276.7" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="351.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Стан: записи висять незафіксованими,</tspan><tspan x="240.0" dy="15.0">відсутній прогрес</tspan></text>
<line x1="480.0" y1="50.0" x2="480.0" y2="195.0" stroke="#c0392b" stroke-width="3.0" stroke-dasharray="8,5"/>
<rect x="432.5" y="215.2" width="95.0" height="59.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">МЕРЕЖЕВИЙ</tspan><tspan x="480.0" dy="14.3">РОЗКОЛ</tspan><tspan x="480.0" dy="14.3">(Partition)</tspan></text>
<line x1="480.0" y1="295.0" x2="480.0" y2="430.0" stroke="#c0392b" stroke-width="3.0" stroke-dasharray="8,5"/>
<rect x="510.0" y="70.0" width="420.0" height="350.0" rx="10" fill="#f9fbf9" stroke="#27ae60" stroke-width="1.5"/>
<text x="720.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Активна більшість (3 вузли з 5)</text>
<rect x="530.0" y="125.0" width="120.0" height="50.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">S3 (Лідер, T2)</tspan></text>
<rect x="660.0" y="125.0" width="120.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">S4 (Фоловер, T2)</tspan></text>
<rect x="790.0" y="125.0" width="120.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">S5 (Фоловер, T2)</tspan></text>
<rect x="530.0" y="200.0" width="380.0" height="100.0" rx="6" fill="#ffffff" stroke="#c3e6cb" stroke-width="1.5"/><text x="720.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">• S3 обирається лідером у новому термі 2 (3 голоси).</tspan><tspan x="720.0" dy="14.3">• Клієнт шле запис W2 на S3.</tspan><tspan x="720.0" dy="14.3">• S3 реплікує W2 на S4 та S5 (кворум 3/3 зібрано!).</tspan><tspan x="720.0" dy="14.3">• S3 фіксує W2 (commitIndex зростає) і звітує успіх.</tspan></text>
<rect x="570.2" y="325.2" width="299.6" height="59.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Зцілення мережі:</tspan><tspan x="720.0" dy="14.3">S1 бачить терм 2 → стає фоловером;</tspan><tspan x="720.0" dy="14.3">незафіксований W1 на S1 замінюється на W2</tspan></text>
</svg>