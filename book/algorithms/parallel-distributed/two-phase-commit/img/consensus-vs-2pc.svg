<text x="480.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Сучасне вирішення (Spanner / CockroachDB / TiDB): 2PC поверх Raft-груп</text>
