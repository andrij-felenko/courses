<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відмінність 2PC від алгоритмів консенсусу та їхній сучасний синтез</text>
<rect x="20.0" y="20.0" width="300.0" height="195.0" rx="8" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.4"/>
<text x="170.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2PC: Атомарний коміт (100% вузлів)</text>
<text x="170.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Мета: неподільність операції між різними даними</text>
<rect x="65.0" y="90.0" width="70.0" height="45.0" rx="6" fill="#eef8f0" stroke="#27ae60" stroke-width="1.5"/><text x="100.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Вузол 1</tspan><tspan x="100.0" dy="13.0">OK</tspan></text>
<rect x="150.0" y="90.0" width="70.0" height="45.0" rx="6" fill="#eef8f0" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Вузол 2</tspan><tspan x="185.0" dy="13.0">OK</tspan></text>
<rect x="235.0" y="90.0" width="70.0" height="45.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Вузол 3</tspan><tspan x="270.0" dy="13.0">ЗБІЙ</tspan></text>
<rect x="40.0" y="155.0" width="260.0" height="48.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.2"/>
<text x="170.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Правило: Потрібні ВСІ (N з N)</text>
<text x="170.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1 збій = вся транзакція скасовується/блокується</text>
<rect x="340.0" y="20.0" width="300.0" height="195.0" rx="8" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.4"/>
<text x="490.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Raft/Paxos: Консенсус (Більшість)</text>
<text x="490.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Мета: висока доступність копій тих самих даних</text>
<rect x="385.0" y="90.0" width="70.0" height="45.0" rx="6" fill="#eef8f0" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Репліка 1</tspan><tspan x="420.0" dy="11.7">OK</tspan></text>
<rect x="470.0" y="90.0" width="70.0" height="45.0" rx="6" fill="#eef8f0" stroke="#27ae60" stroke-width="1.5"/><text x="505.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">Репліка 2</tspan><tspan x="505.0" dy="11.7">OK</tspan></text>
<rect x="555.0" y="90.0" width="70.0" height="45.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="109.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Репліка 3</tspan><tspan x="590.0" dy="11.7">ЗБІЙ</tspan></text>
<rect x="360.0" y="155.0" width="260.0" height="48.0" rx="6" fill="#eef8f0" stroke="#27ae60" stroke-width="1.2"/>
<text x="490.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Правило: Достатньо більшості (2 з 3)</text>
<text x="490.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1 збій = система ПРОДОВЖУЄ писати без затримок</text>
<rect x="660.0" y="20.0" width="280.0" height="195.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="800.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому 2PC ≠ Консенсус</text>
<text x="800.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• 2PC вимагає 100% згоди</text>
<text x="800.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">  бо кожен вузол володіє СВОЇМИ</text>
<text x="800.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">  унікальними даними (шардом)</text>
<text x="800.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Raft вимагає лише більшості</text>
<text x="800.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">  бо всі вузли дублюють ТОЙ САМИЙ</text>
<text x="800.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">  журнал подій (реплікація)</text>
