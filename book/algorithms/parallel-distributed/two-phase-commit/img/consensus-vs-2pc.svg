<text x="245.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Шард 1: Рахунки А-К (Raft-група з 3 реплік)</text>
