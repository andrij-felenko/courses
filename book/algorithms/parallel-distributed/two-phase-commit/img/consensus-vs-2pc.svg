<rect x="190.0" y="312.0" width="105.0" height="34.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="242.5" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="242.5" dy="0.0">Фоловер 1</tspan></text>
<rect x="310.0" y="312.0" width="105.0" height="34.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="362.5" y="325.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="362.5" dy="0.0">Фоловер 2</tspan></text>
<text x="245.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Падіння лідера вирішується виборами Raft за мілісекунди</text>
<rect x="520.0" y="275.0" width="390.0" height="115.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="715.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Шард 2: Рахунки Л-Я (Raft-група з 3 реплік)</text>
<rect x="540.0" y="312.0" width="105.0" height="34.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="592.5" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="592.5" dy="0.0">Лідер (Raft)</tspan></text>
<rect x="660.0" y="312.0" width="105.0" height="34.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="712.5" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="712.5" dy="0.0">Фоловер 1</tspan></text>
<rect x="780.0" y="312.0" width="105.0" height="34.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="832.5" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="832.5" dy="0.0">Фоловер 2</tspan></text>
<text x="715.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Учасник 2PC ніколи не вмирає: група Raft завжди доступна</text>
<line x1="175.0" y1="329.0" x2="540.0" y2="329.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="540.0" y1="335.0" x2="175.0" y2="335.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="422.9" y="320.5" width="114.3" height="23.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="480.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2PC між шардами</tspan></text>
<text x="480.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Синтез: Raft захищає від збоїв заліза, а 2PC забезпечує атомарність між різними таблицями/шардами.</text>
