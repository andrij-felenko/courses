<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення часткового порядку на тотальний через кортежі (L, PID)</text>
<rect x="20.0" y="16.0" width="440.0" height="40.0" rx="6" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.5"/><text x="240.0" y="40.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Частковий порядок причинності (Poset DAG)</tspan></text>
<rect x="20.0" y="66.0" width="440.0" height="360.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<line x1="100.0" y1="165.0" x2="100.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="165.0" x2="360.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="120.0" y1="280.0" x2="210.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="280.0" x2="250.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="160.0" y1="140.0" x2="300.0" y2="140.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="230.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">a || b (непорівнянні)</text>
<rect x="48.1" y="128.2" width="103.8" height="23.5" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">a: (1, Node A)</tspan></text>
<rect x="308.1" y="128.2" width="103.8" height="23.5" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">b: (1, Node B)</tspan></text>
<rect x="48.1" y="248.2" width="103.8" height="23.5" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">c: (2, Node A)</tspan></text>
<rect x="308.1" y="248.2" width="103.8" height="23.5" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">d: (2, Node B)</tspan></text>
<rect x="178.1" y="348.2" width="103.8" height="23.5" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">e: (3, Node B)</tspan></text>
<rect x="500.0" y="16.0" width="440.0" height="40.0" rx="6" fill="#fbfdff" stroke="#dfe4ea" stroke-width="1.5"/><text x="720.0" y="40.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Тотальний порядок через розв'язання нічиїх (L, PID)</tspan></text>
<rect x="500.0" y="66.0" width="440.0" height="360.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="520.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Правило порівняння: (L_1, PID_1) &lt; (L_2, PID_2)</text>
<rect x="520.0" y="130.0" width="400.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">1. Подія a  →  (L=1, PID=A)  [найменший L, PID A &lt; B]</tspan></text>
<line x1="720.0" y1="174.0" x2="720.0" y2="184.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="185.0" width="400.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="210.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">2. Подія b  →  (L=1, PID=B)  [той самий L=1, але PID B &gt; A]</tspan></text>
<line x1="720.0" y1="229.0" x2="720.0" y2="239.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="240.0" width="400.0" height="44.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">3. Подія c  →  (L=2, PID=A)  [більший L=2, PID A &lt; B]</tspan></text>
<line x1="720.0" y1="284.0" x2="720.0" y2="294.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="295.0" width="400.0" height="44.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">4. Подія d  →  (L=2, PID=B)  [той самий L=2, PID B &gt; A]</tspan></text>
<line x1="720.0" y1="339.0" x2="720.0" y2="349.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="350.0" width="400.0" height="44.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">5. Подія e  →  (L=3, PID=B)  [найбільший L=3]</tspan></text>
</svg>