<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема відліку до нескінченності при обриві зв'язку</text>
<line x1="162.0" y1="120.0" x2="358.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.2"/><circle cx="260.0" cy="120.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="260.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<line x1="402.0" y1="120.0" x2="598.0" y2="120.0" stroke="#e74c3c" stroke-width="2.2" stroke-dasharray="4 4"/>
<line x1="490.0" y1="110.0" x2="510.0" y2="130.0" stroke="#e74c3c" stroke-width="3.0"/>
<line x1="490.0" y1="130.0" x2="510.0" y2="110.0" stroke="#e74c3c" stroke-width="3.0"/>
<text x="500.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle" font-weight="700">ОБРИВ</text>
<circle cx="140.0" cy="120.0" r="22.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="140.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text><text x="140.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">d(C)=2</text>
<circle cx="380.0" cy="120.0" r="22.0" fill="#fdeae8" stroke="#e74c3c" stroke-width="2.0"/><text x="380.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text><text x="380.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e74c3c" text-anchor="middle" font-weight="700">d(C)=1</text>
<circle cx="620.0" cy="120.0" r="22.0" fill="#f4f6f8" stroke="#9aa3af" stroke-width="2.0"/><text x="620.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text><text x="620.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa3af" text-anchor="middle" font-weight="700">d(C)=0</text>
<rect x="45.8" y="229.4" width="668.4" height="81.2" rx="6" fill="#fdeae8" stroke="#e74c3c" stroke-width="1.5"/><text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1. Лінк B–C падає. B втрачає прямий шлях до C (d_B(C) = ∞).</tspan><tspan x="380.0" dy="16.2">2. B бачить, що A пропонує d_A(C) = 2, і вважає: «піду до C через A!» → d_B(C) = 2 + 1 = 3.</tspan><tspan x="380.0" dy="16.2">3. A отримує від B новий вектор d_B(C) = 3 і оновлює свій шлях: d_A(C) = 3 + 1 = 4.</tspan><tspan x="380.0" dy="16.2">4. Зациклення продовжується: 4 → 5 → 6 ... до максимуму (в RIP: ∞ = 16 hops).</tspan></text>
</svg>