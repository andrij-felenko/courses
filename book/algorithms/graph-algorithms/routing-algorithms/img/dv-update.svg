<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дистанційно-векторне оновлення за рівнянням Беллмана–Форда</text>
<line x1="162.0" y1="140.0" x2="358.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.2"/><circle cx="260.0" cy="140.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="260.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<line x1="402.0" y1="140.0" x2="598.0" y2="140.0" stroke="#2980b9" stroke-width="2.5"/><circle cx="500.0" cy="140.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="500.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<circle cx="140.0" cy="140.0" r="22.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="140.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="380.0" cy="140.0" r="22.0" fill="#fdf0dd" stroke="#e08a1e" stroke-width="2.0"/><text x="380.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<circle cx="620.0" cy="140.0" r="22.0" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.0"/><text x="620.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<line x1="590.0" y1="95.0" x2="410.0" y2="95.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">вектор від C: {C:0, D:4}</text>
<rect x="156.3" y="219.4" width="447.5" height="81.2" rx="6" fill="#fff7ee" stroke="#e08a1e" stroke-width="1.5"/><text x="380.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Вузол B обчислює нові відстані через C (вага ребра B–C = 3):</tspan><tspan x="380.0" dy="16.2">• d(B → C) = min(поточна, 3 + 0) = 3</tspan><tspan x="380.0" dy="16.2">• d(B → D) = min(∞, 3 + 4) = 7   [оновлено!]</tspan><tspan x="380.0" dy="16.2">Рівняння Беллмана–Форда: d_B(X) = min_v (c(B,v) + d_v(X))</tspan></text>
</svg>