<rect x="31.2" y="316.2" width="717.7" height="47.6" rx="6" fill="#fff7ee" stroke="#e08a1e" stroke-width="1.5"/><text x="390.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Доповнюючий шлях P почергово містить ребра поза M та з M, починаючись і кінчаючись у вільних вершинах.</tspan><tspan x="390.0" dy="15.6">Операція симетричної різниці M' = M ⊕ P міняє роли ребер і збільшує розмір |M'| = |M| + 1.</tspan></text>
