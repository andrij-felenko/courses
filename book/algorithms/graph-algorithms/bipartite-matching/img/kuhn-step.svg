<circle cx="420.0" cy="300.0" r="20.0" fill="#fef3e6" stroke="#e08a1e" stroke-width="2.0"/><text x="420.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">v_3</text>
<text x="640.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масив match[] (для V)</text>
<rect x="582.1" y="83.4" width="115.8" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">match[v₁] = u₁</tspan><tspan x="640.0" dy="15.6">match[v₂] = u₂</tspan><tspan x="640.0" dy="15.6">match[v₃] = ∅</tspan></text>
<text x="640.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Хід DFS(u₃)</text>
<rect x="525.1" y="229.3" width="229.8" height="91.3" rx="6" fill="#fff7ee" stroke="#e08a1e" stroke-width="1.5"/><text x="640.0" y="249.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">1. u₃ бачить v₁ (зайнята u₁)</tspan><tspan x="640.0" dy="15.0">2. DFS іде до u₁ = match[v₁]</tspan><tspan x="640.0" dy="15.0">3. u₁ перенаправляється на v₂</tspan><tspan x="640.0" dy="15.0">4. v₂ зайнята u₂ -&gt; u₂ іде на v₃</tspan><tspan x="640.0" dy="15.0">5. v₃ вільна! Успіх!</tspan></text>
<rect x="58.3" y="376.2" width="683.5" height="47.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Алгоритм Куна для кожної вершини u ∈ U шукає доповнюючий шлях через DFS.</tspan><tspan x="400.0" dy="15.6">Якщо сусід v ∈ V уже зайнятий, DFS рекурсивно намагається перенаправити match[v] на іншу вершину.</tspan></text>
</svg>