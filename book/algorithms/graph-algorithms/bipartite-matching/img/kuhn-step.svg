<line x1="200.0" y1="100.0" x2="400.0" y2="100.0" stroke="#27ae60" stroke-width="3.2"/>
<line x1="200.0" y1="200.0" x2="400.0" y2="200.0" stroke="#27ae60" stroke-width="3.2"/>
<line x1="195.4" y1="287.2" x2="404.6" y2="112.8" stroke="#e08a1e" stroke-width="3.2"/>
<line x1="198.5" y1="292.3" x2="401.5" y2="207.7" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="198.5" y1="207.7" x2="401.5" y2="292.3" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="180.0" cy="100.0" r="20.0" fill="#eaf2fd" stroke="#2457d6" stroke-width="2.0"/><text x="180.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">u_1</text>
<circle cx="180.0" cy="200.0" r="20.0" fill="#eaf2fd" stroke="#2457d6" stroke-width="2.0"/><text x="180.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">u_2</text>
<circle cx="180.0" cy="300.0" r="20.0" fill="#fdebd0" stroke="#e08a1e" stroke-width="2.0"/><text x="180.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">u_3</text>
<circle cx="420.0" cy="100.0" r="20.0" fill="#fef3e6" stroke="#e08a1e" stroke-width="2.0"/><text x="420.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">v_1</text>
