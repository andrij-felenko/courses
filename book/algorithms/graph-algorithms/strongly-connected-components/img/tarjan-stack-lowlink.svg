<rect x="-57.5" y="306.2" width="875.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#334155" stroke-width="1.5"/><text x="380.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Зворотне ребро (2 → 0) оновлює low[2] := min(low[2], tin[0]) = 1. Значення low транслюється вгору деревом.</tspan><tspan x="380.0" dy="15.6">Коли DFS повертається у вершину u з low[u] == tin[u], вона є коренем SCC: усі вершини вище неї у стеку скидаються в одну SCC.</tspan></text>
