<svg xmlns="http://www.w3.org/2000/svg" viewBox="-68.1 -10 896.1 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-68.1" y="-10" width="896.1" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конденсація графа в орієнтований ациклічний граф (DAG)</text>
<text x="380.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф конденсації G^SCC є орієнтованим безконтурним графом (DAG)</text>
<rect x="80.0" y="80.0" width="160.0" height="110.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.0"/>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="700">Мета-вершина C₁</text>
<text x="160.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">SCC = {A, B, C}</text>
<text x="160.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вхідний ступінь = 0</text>
<rect x="300.0" y="80.0" width="160.0" height="110.0" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="380.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="700">Мета-вершина C₂</text>
<text x="380.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">SCC = {D, E}</text>
<text x="380.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вхідний = 1, вихідний = 1</text>
<rect x="520.0" y="80.0" width="160.0" height="110.0" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
<text x="600.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="700">Мета-вершина C₃</text>
<text x="600.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">SCC = {F, G, H}</text>
<text x="600.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вихідний ступінь = 0</text>
<line x1="240.0" y1="135.0" x2="300.0" y2="135.0" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="270.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">e₁</text>
<line x1="460.0" y1="135.0" x2="520.0" y2="135.0" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="490.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">e₂</text>
<rect x="-58.1" y="228.1" width="876.1" height="53.9" rx="6" fill="#f4f6f8" stroke="#334155" stroke-width="1.5"/><text x="380.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Заміна кожної компоненти сильної зв'язаності на одну мета-вершину утворює конденсований граф G^SCC.</tspan><tspan x="380.0" dy="16.9">Він НЕ містить орієнтованих циклів (є DAG): це дозволяє топологічно сортувати компоненти й обробляти граф пошарово.</tspan></text>
</svg>