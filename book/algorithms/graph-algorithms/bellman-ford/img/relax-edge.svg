<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послаблення ребра з від'ємною вагою</text>
<line x1="162.0" y1="130.0" x2="558.0" y2="130.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="558.0,130.0 548.0,134.0 548.0,126.0" fill="#c0392b" stroke="none"/><circle cx="360.0" cy="144.0" r="11.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="360.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">-3</text>
<circle cx="140.0" cy="130.0" r="22.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="140.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">u</text><text x="140.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">d[u] = 5</text>
<circle cx="580.0" cy="130.0" r="22.0" fill="#fff7ee" stroke="#e08a1e" stroke-width="2.0"/><text x="580.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">v</text><text x="580.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700">d[v] = 8</text>
<text x="360.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">орієнтоване ребро з від'ємною вагою w = −3</text>
<rect x="160.6" y="190.1" width="398.8" height="49.9" rx="6" fill="#fff7ee" stroke="#e08a1e" stroke-width="1.5"/><text x="360.0" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">перевірка послаблення:  d[u] + w = 5 + (−3) = 2</tspan><tspan x="360.0" dy="16.9">2 &lt; 8  →  оновлюємо d[v] := 2</tspan></text>
