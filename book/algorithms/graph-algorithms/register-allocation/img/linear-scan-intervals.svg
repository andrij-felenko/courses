<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Linear Scan (K = 2 physical registers)</text>
<rect x="120.0" y="50.0" width="160.0" height="22.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="130.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">x: [20,180] → R0</text>
<rect x="160.0" y="85.0" width="220.0" height="22.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="170.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">y: [60,280] → R1</text>
<rect x="240.0" y="120.0" width="240.0" height="22.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="250.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">z: [140,380] → Spill [rsp+8]</text>
<rect x="320.0" y="155.0" width="220.0" height="22.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="330.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">w: [220,440] → R0</text>
<rect x="420.0" y="190.0" width="200.0" height="22.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="430.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">t: [320,520] → R1</text>
<line x1="250.0" y1="45.0" x2="250.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="250.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Позиція сканування t=150</text>
<rect x="11.5" y="244.3" width="737.0" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">В точці t=150 активні x, y та z. Оскільки K=2, інтервал z з найдовшим залишком [140,380] скидається в стек (Spill).</tspan><tspan x="380.0" dy="14.3">Складність O(N log N) замість O(N²) — ідеально для JIT-компіляторів (V8, JVM HotSpot C1).</tspan></text>
</svg>