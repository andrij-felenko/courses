<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл регістрів у SSA-формі: Хордальні графи</text>
<text x="200.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загальний IR (Довільний граф)</text>
<rect x="70.9" y="100.2" width="258.3" height="59.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="200.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Цикли C_n без хорд (n ≥ 4)</tspan><tspan x="200.0" dy="14.3">Граф інтерференції може бути будь-яким</tspan><tspan x="200.0" dy="14.3">Розфарбування NP-повне (Chaitin 1981)</tspan></text>
<line x1="340.0" y1="130.0" x2="410.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="375.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">SSA Transformation</text>
<text x="560.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SSA-форма (Хордальний граф)</text>
<rect x="427.7" y="93.0" width="264.5" height="73.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Кожен цикл довжиною ≥ 4 має хорду</tspan><tspan x="560.0" dy="14.3">Інтервальний / Хордальний граф</tspan><tspan x="560.0" dy="14.3">Розфарбування за O(|V| + |E|) через PEO</tspan><tspan x="560.0" dy="14.3">(Hack 2006, Pereyron et al.)</tspan></text>
<rect x="39.7" y="239.3" width="680.6" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">В SSA-формі кожна змінна призначається строго один раз. Діапазони життєвості утворюють дерево вкладеності,</tspan><tspan x="380.0" dy="14.3">що робить граф інтерференції хордальним і дозволяє точне розфарбування за поліноміальний час.</tspan></text>
</svg>