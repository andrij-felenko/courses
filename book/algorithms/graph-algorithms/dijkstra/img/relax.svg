<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок послаблення: сусід пропонує коротший шлях</text>
<line x1="172.0" y1="150.0" x2="518.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4"/><circle cx="345.0" cy="150.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="345.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<circle cx="150.0" cy="150.0" r="22.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">u</text><text x="150.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">d[u] = 7</text>
<circle cx="540.0" cy="150.0" r="22.0" fill="#f4f6f8" stroke="#9aa3af" stroke-width="2.0"/><text x="540.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">v</text><text x="540.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa3af" text-anchor="middle" font-weight="700">d[v] = 12</text>
<text x="345.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вага ребра  w = 3</text>
<rect x="165.7" y="207.1" width="358.5" height="49.9" rx="6" fill="#fff7ee" stroke="#e08a1e" stroke-width="1.5"/><text x="345.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">новий шлях через u:  d[u] + w = 7 + 3 = 10</tspan><tspan x="345.0" dy="16.9">10 &lt; 12  →  збиваємо  d[v] := 10</tspan></text>
</svg>