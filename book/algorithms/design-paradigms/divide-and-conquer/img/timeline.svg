<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 678" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="812" height="678" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="214.0" y1="108.0" x2="214.0" y2="608.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="186.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">давнина</text>
<circle cx="214.0" cy="108.0" r="8.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.5"/>
<line x1="222.0" y1="108.0" x2="252.0" y2="108.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="252.0" y="70.0" width="536.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="268.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">«Divide et impera»</text>
<text x="268.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="268.0" dy="0.0">Гасло війни й влади. Приписують Філіпові II й Цезарю —</tspan><tspan x="268.0" dy="16.2">та в античних джерелах слогана нема (пізніша латина).</tspan></text>
<text x="186.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1805</text>
<circle cx="214.0" cy="208.0" r="8.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<line x1="222.0" y1="208.0" x2="252.0" y2="208.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="252.0" y="170.0" width="536.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="268.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Карл Фрідріх Ґаусс · німець</text>
<text x="268.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="268.0" dy="0.0">Поділ у розрахунку орбіт астероїдів — ідея ШПФ за 160</tspan><tspan x="268.0" dy="16.2">років до самої ШПФ. Рукопис лишився неопублікованим.</tspan></text>
<text x="186.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1945</text>
<circle cx="214.0" cy="308.0" r="8.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.5"/>
<line x1="222.0" y1="308.0" x2="252.0" y2="308.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="252.0" y="270.0" width="536.0" height="76.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="268.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Джон фон Нейман · угор.-амер.</text>
<text x="268.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="268.0" dy="0.0">Сортування злиттям — одна з перших програм,</tspan><tspan x="268.0" dy="16.2">продуманих саме під комп'ютер (машина EDVAC).</tspan></text>
<text x="186.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1960</text>
<circle cx="214.0" cy="408.0" r="8.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
<line x1="222.0" y1="408.0" x2="252.0" y2="408.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="252.0" y="370.0" width="536.0" height="76.0" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.6"/>
<text x="268.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Анатолій Карацуба · росіянин</text>
<text x="268.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="268.0" dy="0.0">За тиждень спростував гіпотезу Колмогорова:</tspan><tspan x="268.0" dy="16.2">множення за n^log₂3 ≈ n^1.58, а не за n².</tspan></text>
<text x="186.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1965</text>
<circle cx="214.0" cy="508.0" r="8.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.5"/>
<line x1="222.0" y1="508.0" x2="252.0" y2="508.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="252.0" y="470.0" width="536.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="268.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Кулі й Тьюкі · американці</text>
<text x="268.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="268.0" dy="0.0">Швидке перетворення Фур'є за n·log n замість n².</tspan><tspan x="268.0" dy="16.2">Той самий поділ, що й у Ґаусса, — аж тепер визнаний.</tspan></text>
<text x="186.0" y="613.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1969</text>
<circle cx="214.0" cy="608.0" r="8.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.5"/>
<line x1="222.0" y1="608.0" x2="252.0" y2="608.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="252.0" y="570.0" width="536.0" height="76.0" rx="6" fill="#fff3e0" stroke="#c0392b" stroke-width="1.6"/>
<text x="268.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Фолькер Штрассен · німець</text>
<text x="268.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="268.0" dy="0.0">Множення матриць за n^log₂7 ≈ n^2.81, а не n³:</tspan><tspan x="268.0" dy="16.2">«метод Ґаусса не оптимальний».</tspan></text>
</svg>