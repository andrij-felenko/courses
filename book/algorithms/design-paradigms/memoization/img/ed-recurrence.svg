<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="470.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="430.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна клітина — вибір із трьох сусідів</text>
<rect x="150.0" y="96.0" width="96.0" height="96.0" rx="10" fill="#f8fafc" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="198.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dp[i−1,j−1]</text>
<rect x="246.0" y="96.0" width="96.0" height="96.0" rx="10" fill="#f8fafc" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="294.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dp[i−1,j]</text>
<rect x="150.0" y="192.0" width="96.0" height="96.0" rx="10" fill="#f8fafc" stroke="#c9cfd8" stroke-width="1.6"/>
<text x="198.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">dp[i,j−1]</text>
<rect x="246.0" y="192.0" width="96.0" height="96.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.6"/>
<text x="294.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">dp[i,j]</text>
<line x1="294.0" y1="174.0" x2="294.0" y2="210.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="228.0" y1="240.0" x2="264.0" y2="240.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="224.0" y1="170.0" x2="268.0" y2="214.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="386.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">dp[i,j] — найдешевша з трьох:</text>
<text x="386.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="start" font-weight="700">↓</text>
<text x="420.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">dp[i−1,j] + 1</text>
<text x="420.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">видалити A[i]</text>
<text x="386.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="start" font-weight="700">→</text>
<text x="420.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">dp[i,j−1] + 1</text>
<text x="420.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">вставити B[j]</text>
<text x="386.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#b45309" text-anchor="start" font-weight="700">↘</text>
<text x="420.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">dp[i−1,j−1] + c</text>
<text x="420.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">замінити A[i] → B[j]</text>
<text x="386.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a43" text-anchor="start" font-weight="700">c = 0, якщо A[i] = B[j];   c = 1, якщо різні</text>
<rect x="146.5" y="410.5" width="566.9" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">База:  dp[0,j] = j  (вставити весь B)      dp[i,0] = i  (видалити весь A)</tspan></text>
</svg>