<rect x="0.0" y="0.0" width="1000.0" height="726.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм працював піввіку — під іншою назвою</text>
<rect x="40.0" y="62.0" width="400.0" height="34.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.7"/><text x="240.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">МЕХАНІЗМ — річ уже працює</tspan></text>
<rect x="560.0" y="62.0" width="400.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="760.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">НАЗВА «back pressure» — слово живе деінде</tspan></text>
<line x1="470.0" y1="106.0" x2="470.0" y2="606.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="530.0" y1="106.0" x2="530.0" y2="606.0" stroke="#c0392b" stroke-width="3.0"/>
