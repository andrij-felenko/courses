<line x1="530.0" y1="154.0" x2="560.0" y2="154.0" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="530.0" cy="154.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.8"/>
<rect x="40.0" y="206.0" width="400.0" height="58.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1963 · телетайп ASR-33</tspan><tspan x="240.0" dy="16.9">Ctrl-S спиняє зчитувач перфострічки — це XOFF</tspan></text>
<line x1="440.0" y1="235.0" x2="470.0" y2="235.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="470.0" cy="235.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.8"/>
<rect x="40.0" y="278.0" width="400.0" height="58.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="303.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1973 · конвеєр Unix</tspan><tspan x="240.0" dy="16.9">на повному буфері (4 КБ) письменник засинає</tspan></text>
<line x1="440.0" y1="307.0" x2="470.0" y2="307.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="470.0" cy="307.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.8"/>
<rect x="40.0" y="350.0" width="400.0" height="58.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1974 · RFC 675 (TCP)</tspan><tspan x="240.0" dy="16.9">«вікно = 0» спиняє відправника</tspan></text>
<line x1="440.0" y1="379.0" x2="470.0" y2="379.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="470.0" cy="379.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.8"/>
<rect x="40.0" y="422.0" width="400.0" height="76.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.6"/><text x="240.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1997 · Ethernet 802.3x</tspan><tspan x="240.0" dy="16.9">кадр PAUSE спиняє порт — і зветься</tspan><tspan x="240.0" dy="16.9">«керуванням потоком»</tspan></text>
<line x1="440.0" y1="460.0" x2="470.0" y2="460.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="470.0" cy="460.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.8"/>
<rect x="560.0" y="422.0" width="400.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="760.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">1990-ті · комутатори Ethernet</tspan><tspan x="760.0" dy="16.9">«backpressure» = навмисна колізія,</tspan><tspan x="760.0" dy="16.9">щоб заткнути відправника</tspan></text>
<line x1="530.0" y1="460.0" x2="560.0" y2="460.0" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="530.0" cy="460.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.8"/>
<rect x="560.0" y="512.0" width="400.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="760.0" y="537.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">2003 · теорія мереж</tspan><tspan x="760.0" dy="16.9">Нілі називає «backpressure» алгоритм</tspan><tspan x="760.0" dy="16.9">Тассіуласа й Ефремідеса (1992)</tspan></text>
<line x1="530.0" y1="550.0" x2="560.0" y2="550.0" stroke="#c0392b" stroke-width="1.8"/>
