<rect x="60.0" y="640.0" width="880.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="667.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">2013–2015 · Reactive Streams — тут назва нарешті прикріплюється до механізму</tspan><tspan x="500.0" dy="18.2">1.0.0 — 30 квітня 2015 · JDK 9 (вересень 2017) — java.util.concurrent.Flow</tspan></text>
