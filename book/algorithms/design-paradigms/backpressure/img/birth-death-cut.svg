<rect x="98.5" y="311.5" width="403.1" height="57.1" rx="6" fill="#f7f7f9" stroke="#1a1a1a" stroke-width="1.6"/><text x="300.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Крізь будь-який переріз потік угору = потік униз:</tspan><tspan x="300.0" dy="17.6">λ · pₙ  =  μ · pₙ₊₁     →     pₙ₊₁ = ρ · pₙ</tspan></text>
<rect x="519.2" y="311.5" width="441.5" height="57.1" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="740.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Отже pₙ = ρⁿ · p₀, а сума ймовірностей = 1:</tspan><tspan x="740.0" dy="17.6">p₀ · (1 + ρ + ρ² + …) = 1  —  збігається ЛИШЕ за ρ &lt; 1</tspan></text>
<text x="500.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Стабільність — не додаткове припущення, а умова, за якої розв'язок узагалі існує</text>
