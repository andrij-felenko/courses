<rect x="85.7" y="272.7" width="364.6" height="74.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.7"/><text x="268.0" y="297.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="268.0" dy="0.0">Сума СКІНЧЕННА — нормується за будь-якого ρ,</tspan><tspan x="268.0" dy="17.6">навіть за ρ &gt; 1:</tspan><tspan x="268.0" dy="17.6">pₙ = ρⁿ · (1 − ρ) / (1 − ρ^(K+1))</tspan></text>
<rect x="545.3" y="272.7" width="341.5" height="74.6" rx="6" fill="#f2f6fc" stroke="#2457d6" stroke-width="1.7"/><text x="716.0" y="297.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="716.0" dy="0.0">Фактичний темп сам падає під μ:</tspan><tspan x="716.0" dy="17.6">λ_еф = λ · (1 − p_K) = μ · (1 − p₀)  ≤  μ</tspan><tspan x="716.0" dy="17.6">Стеля затримки:  W ≤ K / μ</tspan></text>
<rect x="224.4" y="403.7" width="551.3" height="76.6" rx="6" fill="#f7f7f9" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">λ = 1000/с,  μ = 100/с  (ρ = 10 — безнадійно нестабільно),  K = 10:</tspan><tspan x="500.0" dy="17.6">p_K = 0.90  →  λ_еф = 1000 · 0.10 = 100 = μ   ·   W ≤ 10/100 = 0.1 с</tspan><tspan x="500.0" dy="17.6">Місткість буфера K — це і є бюджет затримки</tspan></text>
