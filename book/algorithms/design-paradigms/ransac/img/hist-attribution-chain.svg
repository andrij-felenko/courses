<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="596" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг першостей навколо RANSAC: на кожній ланці когось забули</text>
<line x1="132.0" y1="68.0" x2="132.0" y2="516.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="112.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">≈1615 · 1617</text>
<circle cx="132.0" cy="84.0" r="6.5" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<text x="158.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Віллеброрд Снелліус розв'язує зворотну засічку</tspan><tspan x="158.0" dy="14.3">й друкує її в «Eratosthenes Batavus»</tspan></text>
<text x="112.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1692</text>
<circle cx="132.0" cy="136.0" r="6.5" fill="#c0392b" stroke="#c0392b" stroke-width="2.2"/>
<text x="158.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Лоран Потено переказує той самий розв'язок —</tspan><tspan x="158.0" dy="14.3">і задача назавжди дістає ЙОГО ім'я</tspan></text>
<text x="112.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1805 · 1809</text>
<circle cx="132.0" cy="188.0" r="6.5" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<text x="158.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Лежандр друкує найменші квадрати; Гаусс заявляє,</tspan><tspan x="158.0" dy="14.3">що мав їх від 1795 — суперечка про першість</tspan></text>
<text x="112.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1841</text>
<circle cx="132.0" cy="240.0" r="6.5" fill="#27ae60" stroke="#27ae60" stroke-width="2.2"/>
<text x="158.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Йоганн Ґрунерт зводить P3P до рівняння 4-го степеня</tspan><tspan x="158.0" dy="14.3">(≤ 4 розв'язки) — у статті «Потенотова задача»</tspan></text>
<text x="112.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1945</text>
<circle cx="132.0" cy="292.0" r="6.5" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<text x="158.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Ерл Черч дає ітеративний метод — саме він стає каноном</tspan><tspan x="158.0" dy="14.3">американської фотограмметрії</tspan></text>
<text x="112.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1978</text>
<circle cx="132.0" cy="344.0" r="6.5" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<text x="158.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">SRI Road Expert: знімок проти бази даних —</tspan><tspan x="158.0" dy="14.3">і перші грубі похибки просто від корелятора</tspan></text>
<text x="112.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1981</text>
<circle cx="132.0" cy="396.0" r="6.5" fill="#7c3aed" stroke="#7c3aed" stroke-width="2.2"/>
<text x="158.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Фішлер і Боллс: RANSAC. «Чинна фотограмметрична</tspan><tspan x="158.0" dy="14.3">література не дає аналітичного розв'язку, крім методу Черча»</tspan></text>
<text x="112.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">1994</text>
<circle cx="132.0" cy="448.0" r="6.5" fill="#27ae60" stroke="#27ae60" stroke-width="2.2"/>
<text x="158.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">Гаралік зі співавторами зшивають нитку назад:</tspan><tspan x="158.0" dy="14.3">перший розв'язок P3P — Ґрунертів, 1841</tspan></text>
<text x="112.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">2006</text>
<circle cx="132.0" cy="500.0" r="6.5" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<text x="158.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="158.0" dy="0.0">CVPR: воркшоп «25 років RANSAC» —</tspan><tspan x="158.0" dy="14.3">у методу день народження</tspan></text>
<rect x="40.0" y="534.0" width="820.0" height="44.0" rx="6" fill="#f2f6ff" stroke="#2457d6" stroke-width="1.4"/><text x="450.0" y="552.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Забуття тут — не збіг, а норма: результат живий, поки його несе якийсь живий канон,</tspan><tspan x="450.0" dy="14.3">а канони обмежені мовою, фахом і десятиліттям.</tspan></text>
</svg>