<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
<rect width="920" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три рівні реалізації: від контролера до готового модуля</text>
<rect x="35.0" y="70.0" width="270.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="170.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Контролер + зовнішні MOSFET</text>
<line x1="55.0" y1="114.0" x2="285.0" y2="114.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="53.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ключі окремо, контролер ними керує</text>
<text x="53.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ будь-яка потужність, гнучко, дешеві ключі</text>
<text x="53.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">− найбільше роботи й місця, складна розводка</text>
<rect x="330.0" y="70.0" width="270.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="465.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Інтегрований switcher</text>
<line x1="350.0" y1="114.0" x2="580.0" y2="114.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="348.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ключі ВСЕРЕДИНІ чипа</text>
<text x="348.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ просто, компактно, мало деталей</text>
<text x="348.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">− стеля за струмом (кілька ампер)</text>
<rect x="625.0" y="70.0" width="270.0" height="250.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="760.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Готовий power-модуль</text>
<line x1="645.0" y1="114.0" x2="875.0" y2="114.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="643.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">контролер + ключі + котушка в корпусі</text>
<text x="643.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">+ найпростіше й найшвидше, мала площа</text>
<text x="643.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">− найдорожче, менш гнучко</text>
<line x1="60.0" y1="345.0" x2="860.0" y2="345.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="460.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більше інтеграції → простіше, але дорожче й менш гнучко →</text>
</svg>
