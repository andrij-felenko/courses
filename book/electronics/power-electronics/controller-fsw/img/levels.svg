<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні: від контролера до готового модуля</text>
<rect x="35.0" y="40.0" width="270.0" height="230.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="170.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Контролер + зовнішні MOSFET</text>
<line x1="53.0" y1="82.0" x2="287.0" y2="82.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="53.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ключі окремо, контролер ними керує</text>
<text x="53.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">+ будь-яка потужність, гнучко, дешеві ключі</text>
<text x="53.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− найбільше роботи й місця, складне розведення</text>
<rect x="330.0" y="40.0" width="270.0" height="230.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="465.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Інтегрований switcher</text>
<line x1="348.0" y1="82.0" x2="582.0" y2="82.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="348.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ключі всередині чипа</text>
<text x="348.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">+ просто, компактно, мало деталей</text>
<text x="348.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− стеля за струмом (кілька ампер)</text>
<rect x="625.0" y="40.0" width="270.0" height="230.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<text x="760.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">Готовий power-модуль</text>
<line x1="643.0" y1="82.0" x2="877.0" y2="82.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="643.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">контролер, ключі й котушка в корпусі</text>
<text x="643.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">+ найпростіше й найшвидше, мала площа</text>
<text x="643.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">− найдорожче, менш гнучко</text>
<line x1="60.0" y1="300.0" x2="850.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="455.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">більше інтеграції → простіше, але дорожче й менш гнучко</text>
</svg>