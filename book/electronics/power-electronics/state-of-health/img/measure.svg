<text x="606.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">ΔU</text>
<text x="642.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">навантаження +ΔI</text>
<text x="660.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">R = ΔU / ΔI  →  порівняй з новим</text>
<rect x="125.8" y="395.9" width="648.4" height="44.1" rx="6" fill="#f3eef6" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="414.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">ємнісний SoH міряють ЕТАЛОННИМ РОЗРЯДОМ (точно, але треба повний цикл від повної до порожньої);</tspan><tspan x="450.0" dy="13.7">резистивний — НАВАНТАЖУВАЛЬНИМ СТРИБКОМ R=ΔU/ΔI проти нового опору (швидко, за секунди, без розряджання).</tspan></text>
</svg>