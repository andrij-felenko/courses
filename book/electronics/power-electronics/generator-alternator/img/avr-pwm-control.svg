<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контур автоматичного регулювання напруги (AVR) методом ШІМ-струму збудження</text>
<rect x="30.0" y="45.0" width="220.0" height="360.0" rx="8" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генератор</text>
<rect x="50.0" y="105.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
<text x="140.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Обмотка збудження</text>
<text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">L_field (200 мГн, 3 Ом)</text>
<rect x="50.0" y="205.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="140.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Статор + Випрямляч</text>
<text x="140.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 фази → 14.4 В DC</text>
<text x="140.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Змінні оберти двигуна:</text>
<text x="140.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RPM = 800 .. 6000 об/хв</text>
<text x="140.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навантаження: 5 .. 180 А</text>
<line x1="230.0" y1="240.0" x2="290.0" y2="240.0" stroke="#d35400" stroke-width="2.5"/>
<line x1="290.0" y1="240.0" x2="320.0" y2="240.0" stroke="#d35400" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="275.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">V_out</text>
<rect x="320.0" y="45.0" width="300.0" height="360.0" rx="8" fill="#fdfefe" stroke="#8e44ad" stroke-width="1.8"/>
<text x="470.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="middle" font-weight="700">Регулятор напруги (AVR / VR)</text>
<rect x="340.0" y="105.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.2"/>
<text x="400.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Дільник напруги</text>
<text x="400.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">та NTC-термокомпенсація</text>
<rect x="480.0" y="105.0" width="120.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.2"/>
<text x="540.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Опора V_ref</text>
<text x="540.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Bandgap (2.5 В)</text>
<line x1="400.0" y1="165.0" x2="430.0" y2="205.0" stroke="#333333" stroke-width="1.5"/>
<line x1="540.0" y1="165.0" x2="510.0" y2="205.0" stroke="#333333" stroke-width="1.5"/>
<rect x="410.0" y="205.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Помилка / PID</text>
<text x="470.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ΔV = V_ref − V_sense</text>
<line x1="470.0" y1="265.0" x2="470.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="295.0" width="240.0" height="85.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ШІМ-генератор + Gate Driver</text>
<text x="470.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Силовий MOSFET (Low-side або High-side)</text>
<text x="470.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Частота f_pwm = 200..500 Гц, Duty D = 0..100%</text>
<line x1="470.0" y1="380.0" x2="470.0" y2="400.0" stroke="#8e44ad" stroke-width="2.0"/>
<line x1="470.0" y1="400.0" x2="260.0" y2="400.0" stroke="#8e44ad" stroke-width="2.0"/>
<line x1="260.0" y1="400.0" x2="260.0" y2="140.0" stroke="#8e44ad" stroke-width="2.0"/>
<line x1="260.0" y1="140.0" x2="230.0" y2="140.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">I_field_avg = D · (V_bat / R_field)</text>
<rect x="640.0" y="45.0" width="170.0" height="360.0" rx="8" fill="#fbfcfd" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="725.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реакція AVR</text>
<rect x="655.0" y="105.0" width="140.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="725.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Навантаження ↑</text>
<text x="725.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">або RPM ↓ (холості):</text>
<text x="725.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V_out просідає ↓</text>
<text x="725.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">AVR: ШІМ Duty ↑ (до 100%)</text>
<text x="725.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">I_field ↑ → V_out = 14.4 В</text>
<rect x="655.0" y="245.0" width="140.0" height="120.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="725.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Скидання струму ↓</text>
<text x="725.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">або RPM ↑ (високі):</text>
<text x="725.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">V_out зростає ↑</text>
<text x="725.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">AVR: ШІМ Duty ↓ (до 5%)</text>
<text x="725.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">I_field ↓ → V_out = 14.4 В</text>
<rect x="76.6" y="436.5" width="686.9" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="420.0" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">AVR змінює середній струм збудження через ШІМ-ключ, підтримуючи 14.4 В незалежно від обертів і навантаження</tspan></text>
</svg>