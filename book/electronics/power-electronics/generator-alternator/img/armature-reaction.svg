<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реакція якоря синхронного генератора за різного характеру навантаження</text>
<rect x="30.0" y="45.0" width="240.0" height="350.0" rx="8" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/>
<text x="150.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Активне навантаження (R, cos φ = 1)</text>
<text x="150.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поперечна реакція якоря</text>
<circle cx="150.0" cy="165.0" r="45.0" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.2"/>
<line x1="150.0" y1="165.0" x2="150.0" y2="125.0" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="170.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Φ_rot</text>
<line x1="150.0" y1="165.0" x2="190.0" y2="165.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="195.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Φ_arm</text>
<line x1="150.0" y1="165.0" x2="185.0" y2="130.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="195.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Φ_рез</text>
<text x="150.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Струм у фазі з ЕРС.</text>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поле статора зсунуте на 90° ел.</text>
<text x="150.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Викривляє результуюче поле,</text>
<text x="150.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">підсилює насичення зубців,</text>
<text x="150.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">незначно знижує вихідну ЕРС.</text>
<text x="150.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Синхронний реактанс: X_s</text>
<rect x="300.0" y="45.0" width="240.0" height="350.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="420.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Індуктивне навантаження (L, cos φ &lt; 1)</text>
<text x="420.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поздовжньо-розмагнічувальна дія</text>
<circle cx="420.0" cy="165.0" r="45.0" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.2"/>
<line x1="420.0" y1="165.0" x2="420.0" y2="125.0" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Φ_rot</text>
<line x1="420.0" y1="165.0" x2="420.0" y2="200.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Φ_arm (↓)</text>
<line x1="415.0" y1="165.0" x2="415.0" y2="145.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="395.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Φ_рез ↓</text>
<text x="420.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Струм відстає від ЕРС на 90°.</text>
<text x="420.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поле статора спрямоване строго</text>
<text x="420.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ПРОТИ основного поля ротора.</text>
<text x="420.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сильно послаблює магнітний потік,</text>
<text x="420.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">викликає різку просадку напруги.</text>
<text x="420.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Синхронний реактанс: X_s</text>
<rect x="570.0" y="45.0" width="240.0" height="350.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="690.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ємнісне навантаження (C, cos φ &lt; 1)</text>
<text x="690.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поздовжньо-підмагнічувальна дія</text>
<circle cx="690.0" cy="165.0" r="45.0" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.2"/>
<line x1="690.0" y1="165.0" x2="690.0" y2="125.0" stroke="#8e44ad" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="710.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Φ_rot</text>
<line x1="695.0" y1="165.0" x2="695.0" y2="135.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="715.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Φ_arm (↑)</text>
<line x1="685.0" y1="165.0" x2="685.0" y2="110.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="660.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Φ_рез ↑↑</text>
<text x="690.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Струм випереджає ЕРС на 90°.</text>
<text x="690.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Поле статора спрямоване РАЗОМ</text>
<text x="690.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">із основним полем ротора.</text>
<text x="690.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Підсилює результуючий потік,</text>
<text x="690.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">може викликати самозбудження.</text>
<text x="690.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Синхронний реактанс: X_s</text>
<rect x="89.1" y="411.5" width="661.8" height="27.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.2"/><text x="420.0" y="428.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Струм навантаження статора створює власне поле, яке розмагнічує генератор при індуктивному навантаженні</tspan></text>
</svg>