<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електромеханічний принцип трифазного синхронного генератора</text>
<rect x="30.0" y="45.0" width="340.0" height="370.0" rx="8" fill="#fbf9fe" stroke="#8e44ad" stroke-width="1.5"/>
<text x="200.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="middle" font-weight="700">Ротор: джерело магнітного поля</text>
<rect x="60.0" y="105.0" width="280.0" height="110.0" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.2"/>
<text x="200.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмотка збудження (L_field, R_field)</text>
<text x="200.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Постійний струм збудження I_field = 1..5 А</text>
<text x="200.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Живлення через контактні кільця й щітки</text>
<text x="200.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(або безщітковий обертовий випрямляч)</text>
<rect x="80.0" y="235.0" width="110.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="135.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Полюс N</text>
<text x="135.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Магнітний потік Φ</text>
<rect x="210.0" y="235.0" width="110.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="265.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Полюс S</text>
<text x="265.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Замикання потоку</text>
<line x1="140.0" y1="340.0" x2="260.0" y2="340.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Обертання з кутовою швидкістю ω (RPM)</text>
<text x="200.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">f_ел = (p · n) / 60  [Гц]</text>
<line x1="370.0" y1="230.0" x2="440.0" y2="230.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="405.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">dΦ/dt</text>
<rect x="440.0" y="45.0" width="350.0" height="370.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="615.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Нерухомий статор: три фази на 120°</text>
<rect x="470.0" y="105.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="615.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза A (0° ел.)</text>
<text x="615.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">e_A(t) = E_max · sin(ωt)</text>
<rect x="470.0" y="195.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="615.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза B (−120° ел.)</text>
<text x="615.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">e_B(t) = E_max · sin(ωt − 120°)</text>
<rect x="470.0" y="285.0" width="290.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="615.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза C (−240° / +120° ел.)</text>
<text x="615.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">e_C(t) = E_max · sin(ωt − 240°)</text>
<text x="615.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сумарна миттєва потужність постійна: p(t) = 3 · V_ph · I_ph</text>
<rect x="82.2" y="436.5" width="655.5" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="410.0" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Обертове поле ротора наводить 3 синусоїдні ЕРС у нерухомих обмотках статора без іскріння й комутаторів</tspan></text>
</svg>