<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння лімітів живлення USB 2.0 та USB BC 1.2</text>
<rect x="30.0" y="45.0" width="335.0" height="255.0" rx="10" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<rect x="395.0" y="45.0" width="335.0" height="255.0" rx="10" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="197.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичний USB 2.0 (2000 р.)</text>
<text x="562.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">USB Battery Charging 1.2 (2010 р.)</text>
<rect x="55.0" y="95.0" width="285.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="197.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">Лише 100 мА до опитування (енумерації)</tspan><tspan x="197.5" dy="13.0">Максимум 500 мА після дозволу хоста</tspan></text>
<rect x="55.0" y="147.0" width="285.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="197.5" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="197.5" dy="0.0">Потрібен активний хост-контролер</tspan><tspan x="197.5" dy="13.0">Без процесора струм заблоковано</tspan></text>
<rect x="55.0" y="199.0" width="285.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="197.5" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">Стеля потужності: 5 В × 0.5 А = 2.5 Вт</tspan><tspan x="197.5" dy="13.0">Батарея 3000 мА·год заряджається &gt; 6 год</tspan></text>
<rect x="55.0" y="251.0" width="285.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="197.5" y="272.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="197.5" dy="0.0">У режимі сну (Suspend): лише 2.5 мА</tspan></text>
<rect x="420.0" y="95.0" width="285.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="562.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="562.5" dy="0.0">До 1.5 А (7.5 Вт) на звичайному роз'ємі</tspan><tspan x="562.5" dy="13.0">Заряджання втричі швидше (≈ 2 год)</tspan></text>
<rect x="420.0" y="147.0" width="285.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="562.5" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="562.5" dy="0.0">Апаратний автодетект через лінії D+/D−</tspan><tspan x="562.5" dy="13.0">Хост-контролер і стек USB НЕ потрібні</tspan></text>
<rect x="420.0" y="199.0" width="285.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="562.5" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="562.5" dy="0.0">Три стандартизовані порти: SDP, CDP, DCP</tspan><tspan x="562.5" dy="13.0">Безпечне визначення навантажувальної здатності</tspan></text>
<rect x="420.0" y="251.0" width="285.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="562.5" y="272.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="562.5" dy="0.0">Струм до 1.5 А навіть без передачі даних</tspan></text>
<rect x="93.0" y="311.5" width="574.0" height="27.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.2"/><text x="380.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">BC 1.2 розширив 5-вольтове живлення USB від 2.5 Вт до 7.5 Вт без зміни кабелів і роз'ємів</tspan></text>
</svg>