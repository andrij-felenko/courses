<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 867.5 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="867.5" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність станів Primary та Secondary Detection у протоколі BC 1.2</text>
<rect x="30.0" y="45.0" width="210.0" height="75.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.4"/><text x="135.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Поява VBUS (&gt; 4.4 В)</tspan><tspan x="135.0" dy="13.0">Детект контакту даних (DCD)</tspan><tspan x="135.0" dy="13.0">Струм I_DP_SRC = 10 мкА на D+</tspan><tspan x="135.0" dy="13.0">(або таймаут до 900 мс)</tspan></text>
<line x1="240.0" y1="82.0" x2="275.0" y2="82.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="275.0" y="45.0" width="215.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/><text x="382.5" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="382.5" dy="0.0">2. Primary Detection</tspan><tspan x="382.5" dy="13.0">Подача V_DP_SRC (0.6 В) на D+</tspan><tspan x="382.5" dy="13.0">Вимірювання V_DM на D−</tspan><tspan x="382.5" dy="13.0">Порівняння з V_DAT_REF (0.4 В)</tspan></text>
<line x1="382.0" y1="120.0" x2="382.0" y2="175.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">V_DM &lt; 0.4 В</text>
<rect x="275.0" y="175.0" width="215.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.4"/><text x="382.5" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="382.5" dy="0.0">Порт: SDP (Standard)</tspan><tspan x="382.5" dy="13.0">Звичайний хост USB</tspan><tspan x="382.5" dy="13.0">Ліміт: 100 мА / 500 мА</tspan><tspan x="382.5" dy="13.0">Потрібна енумерація USB</tspan></text>
<line x1="490.0" y1="82.0" x2="525.0" y2="82.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="508.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">V_DM &gt; 0.4 В</text>
<rect x="525.0" y="45.0" width="210.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/><text x="630.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. Secondary Detection</tspan><tspan x="630.0" dy="13.0">Подача V_DM_SRC (0.6 В) на D−</tspan><tspan x="630.0" dy="13.0">Вимірювання V_DP на D+</tspan><tspan x="630.0" dy="13.0">Порівняння з V_DAT_REF (0.4 В)</tspan></text>
<line x1="580.0" y1="120.0" x2="580.0" y2="275.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">V_DP &lt; 0.4 В
(активна відповідь знята)</text>
<rect x="490.0" y="275.0" width="115.0" height="90.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/><text x="547.5" y="304.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="547.5" dy="0.0">Порт: CDP</tspan><tspan x="547.5" dy="12.3">Charging Port</tspan><tspan x="547.5" dy="12.3">Струм: 1.5 А</tspan><tspan x="547.5" dy="12.3">+ дані USB 2.0</tspan></text>
<line x1="680.0" y1="120.0" x2="680.0" y2="275.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="690.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">V_DP &gt; 0.4 В
(перемичка R ≤ 200 Ом)</text>
<rect x="625.0" y="275.0" width="115.0" height="90.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/><text x="682.5" y="305.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="682.5" dy="0.0">Порт: DCP</tspan><tspan x="682.5" dy="11.7">Dedicated Charger</tspan><tspan x="682.5" dy="11.7">Струм: 1.5 А</tspan><tspan x="682.5" dy="11.7">Лише зарядка</tspan></text>
<rect x="117.5" y="394.0" width="525.0" height="22.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="408.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Автомат BC 1.2 за 2 етапи тестування напругою 0.6 В однозначно класифікує SDP, CDP або DCP</tspan></text>
</svg>