<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип функціонування контролера порту з авто-детектом</text>
<rect x="60.0" y="45.0" width="640.0" height="245.0" rx="10" fill="#fafaf9" stroke="#2457d6" stroke-width="1.6"/>
<text x="380.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Контролер порту з авто-детектом (наприклад TPS2511 / CHY100)</text>
<rect x="90.0" y="95.0" width="170.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="175.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Силовий ключ VBUS</tspan><tspan x="175.0" dy="11.7">Обмеження струму (2.1 А)</tspan><tspan x="175.0" dy="11.7">Захист від КЗ та перегріву</tspan><tspan x="175.0" dy="11.7">(Power Switch)</tspan></text>
<rect x="290.0" y="95.0" width="180.0" height="75.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="380.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Сенсор сигнатур D+/D−</tspan><tspan x="380.0" dy="11.7">Аналогові компаратори</tspan><tspan x="380.0" dy="11.7">Детект імпедансу та напруг</tspan><tspan x="380.0" dy="11.7">клієнтського пристрою</tspan></text>
<rect x="500.0" y="95.0" width="170.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="585.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Матриця комутації:</tspan><tspan x="585.0" dy="11.7">• Режим BC 1.2 DCP (коротке)</tspan><tspan x="585.0" dy="11.7">• Дільники Apple 2.4A / 1A</tspan><tspan x="585.0" dy="11.7">• Дільник Samsung 2.0A</tspan></text>
<line x1="260.0" y1="132.0" x2="290.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470.0" y1="132.0" x2="500.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180.0" y="195.0" width="400.0" height="75.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Динамічна поведінка:</tspan><tspan x="380.0" dy="11.7">1. За замовчуванням виставляє перемичку BC 1.2 DCP</tspan><tspan x="380.0" dy="11.7">2. Якщо підключено iPhone/iPad — миттєво підключає дільники 2.7 В / 2.7 В</tspan><tspan x="380.0" dy="11.7">3. Якщо підключено Samsung — перемикає на 1.2 В / 1.2 В</tspan></text>
<rect x="103.2" y="304.0" width="553.5" height="22.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.2"/><text x="380.0" y="318.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Мікросхеми автодетекту емулюють потрібний профіль зарядки для будь-якого підключеного смартфона</tspan></text>
</svg>