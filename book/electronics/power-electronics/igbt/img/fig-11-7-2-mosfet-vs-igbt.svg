<line x1="263.8" y1="221.7" x2="263.8" y2="290.0" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="263.8" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e0a32e" text-anchor="middle" font-weight="bold" font-style="normal">межа</text>
<text x="176.9" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">← тут вигідніший MOSFET</text>
<text x="456.9" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тут вигідніший IGBT →</text>
<rect x="120.0" y="56.0" width="300.0" height="44.0" rx="6" fill="#eef2f6" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="270.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">груба межа: десь сотні В і кА·А струму,</text>
<text x="270.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">плюс MOSFET любить вищі частоти</text>
<text x="380.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">На малих напругах і високих частотах виграє MOSFET (малий Rds(on), швидке перемикання). На сотнях вольт і великих струмах — IGBT: його спад майже не росте зі струмом.</text>
