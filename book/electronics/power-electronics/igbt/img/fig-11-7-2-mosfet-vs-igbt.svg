<text x="380.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де межа: спад напруги від струму, MOSFET проти IGBT</text>
<line x1="90.0" y1="290.0" x2="90.0" y2="46.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="90.0" y1="290.0" x2="664.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="668.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">струм I</text>
<text x="84.0" y="40.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">спад напруги U(on)</text>
<path d="M 90.0,290.0 L 650.0,70.0" fill="none" stroke="#1f47b5" stroke-width="2.8"/>
<text x="644.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">MOSFET: U = I·Rds(on)</text>
<text x="482.0" y="118.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">круто росте з I</text>
