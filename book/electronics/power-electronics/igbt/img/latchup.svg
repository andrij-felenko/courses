<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схований PNPN усередині IGBT: корисний PNP і паразитний NPN</text>
<text x="220.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переріз: ті самі чотири шари</text>
<rect x="70.0" y="70.0" width="300.0" height="22.0" rx="6" fill="#dfe6ef" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">затвор (MOS) — керує каналом</text>
<rect x="70.0" y="70.0" width="60.0" height="22.0" rx="6" fill="#e9eefb" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="100.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">n+</text>
<rect x="310.0" y="70.0" width="60.0" height="22.0" rx="6" fill="#e9eefb" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="340.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">n+</text>
<rect x="70.0" y="92.0" width="300.0" height="38.0" rx="6" fill="#fbecec" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="220.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">p (тіло)</text>
<rect x="70.0" y="130.0" width="300.0" height="48.0" rx="6" fill="#e9eefb" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="220.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">n− (дрейф, тримає напругу)</text>
<rect x="70.0" y="178.0" width="300.0" height="28.0" rx="6" fill="#fbecec" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="220.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">p+ (анод) — нове проти MOSFET</text>
<rect x="70.0" y="206.0" width="300.0" height="22.0" rx="6" fill="#dfe6ef" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="220.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">колектор</text>
<text x="220.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Чотири шари n+/p/n−/p+ — це схований PNPN-тиристор</text>
<text x="660.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що це насправді:</text>
<rect x="490.0" y="84.0" width="120.0" height="50.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="550.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">MOSFET</text>
<text x="550.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">(керує затвор)</text>
<rect x="700.0" y="84.0" width="120.0" height="50.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="760.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">PNP</text>
<text x="760.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(корисний)</text>
<rect x="700.0" y="170.0" width="120.0" height="50.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="760.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">NPN</text>
<text x="760.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">паразит!</text>
<line x1="610.0" y1="109.0" x2="700.0" y2="109.0" stroke="#27ae60" stroke-width="2.0"/><polygon points="700.0,109.0 693.0,113.2 693.0,104.8" fill="#27ae60"/>
<text x="655.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">вмикає</text>
<line x1="752.0" y1="134.0" x2="752.0" y2="170.0" stroke="#c0392b" stroke-width="2.4"/><polygon points="752.0,170.0 747.8,163.0 756.2,163.0" fill="#c0392b"/>
<line x1="768.0" y1="170.0" x2="768.0" y2="136.0" stroke="#2457d6" stroke-width="2.4"/><polygon points="768.0,136.0 772.2,143.0 763.8,143.0" fill="#2457d6"/>
<text x="828.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">взаємний</text>
<text x="828.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">підкач —</text>
<text x="828.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">защіпка</text>
<rect x="490.0" y="240.0" width="360.0" height="96.0" rx="8" fill="#fbf3df" stroke="#caa24a" stroke-width="2.0"/>
<text x="670.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">За великого струму NPN «прокидається»:</text>
<text x="670.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">PNP і NPN живлять один одного, защіпка</text>
<text x="670.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">замикається — затвор уже нічим не керує.</text>
<text x="670.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Рецепт (Накаґава, 1984): не дати NPN увімкнутись.</text>
</svg>