<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння часових форм струму в режимах ШІМ, DCM, PFM та Burst Mode</text>
<rect x="20.0" y="45.0" width="800.0" height="115.0" rx="6" fill="#fcfdfe" stroke="#d0d5dd" stroke-width="1.2"/>
