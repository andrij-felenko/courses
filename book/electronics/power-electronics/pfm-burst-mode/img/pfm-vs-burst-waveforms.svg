<polyline points="520.0,363.0 550.0,325.0 590.0,363.0" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<polyline points="730.0,363.0 760.0,325.0 800.0,363.0" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<text x="210.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">← Змінний період T_sw(Івих) →</text>
<text x="115.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">t_on=const</text>
<rect x="20.0" y="420.0" width="800.0" height="115.0" rx="6" fill="#fcfdfe" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="35.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">4. Режим пачки / Burst Mode (серія імпульсів + глибокий сон)</text>
<text x="785.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Пачка з 5-15 імпульсів підзаряджає C_out, далі контролер засинає на мілісекунди (I_q = 2 мкА)</text>
