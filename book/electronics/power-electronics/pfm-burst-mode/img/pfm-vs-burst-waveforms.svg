<rect x="230.0" y="444.0" width="300.0" height="48.0" rx="4" fill="#f3e8ff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="380.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Режим глибокого сну (Sleep Window)</text>
<text x="380.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ключі вимкнено, I_q = 1..5 мкА, розряд C_out</text>
