<text x="35.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3. ЧІМ / COT-PFM (фіксований t_on, змінна пауза)</text>
<text x="785.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Одиничні імпульси фіксованої тривалості t_on, частота падає пропорційно навантаженню</text>
