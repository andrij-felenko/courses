<text x="35.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start" font-weight="700">2. Діодна емуляція DEM / DCM (блокування зворотного струму)</text>
<text x="785.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Нижній ключ вимикається при I_L=0, котушка розмикається (дзвін Hi-Z)</text>
