<text x="785.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Неперервний струм котушки, фіксований період T_sw, високі втрати на холостому ході</text>
<line x1="80.0" y1="113.0" x2="780.0" y2="113.0" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="65.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0 A</text>
<text x="790.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">I_L</text>
<polyline points="100.0,101.0 145.0,77.0 210.0,101.0 210.0,101.0 255.0,77.0 320.0,101.0 320.0,101.0 365.0,77.0 430.0,101.0 430.0,101.0 475.0,77.0 540.0,101.0 540.0,101.0 585.0,77.0 650.0,101.0 650.0,101.0 695.0,77.0 760.0,101.0" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<text x="220.0" y="71.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Струм завжди вище нуля (CCM)</text>
