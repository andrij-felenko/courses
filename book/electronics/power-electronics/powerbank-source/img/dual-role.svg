<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворольовість: той самий порт і бере, і дає</text>
<rect x="50.0" y="64.0" width="380.0" height="150.0" rx="12" fill="#fbfbf8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="240.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">DRP: чергує Rp ↔ Rd</text>
<rect x="95.0" y="116.0" width="110.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="150.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Rp (даю)</tspan></text>
<text x="240.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">↔</text>
<rect x="275.0" y="116.0" width="110.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="330.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Rd (беру)</tspan></text>
<text x="240.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">поки не вирішать, хто кому джерело</text>
<rect x="490.0" y="64.0" width="380.0" height="150.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="680.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">PD power-role swap</text>
<text x="680.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ролі міняються без перетикання</text>
<rect x="520.0" y="128.0" width="130.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="585.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">був споживач</tspan><tspan x="585.0" dy="13.0">(брав)</tspan></text>
<line x1="650.0" y1="152.0" x2="706.0" y2="152.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="708.0" y="128.0" width="130.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="773.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="773.0" dy="0.0">став джерело</tspan><tspan x="773.0" dy="13.0">(дає)</tspan></text>
<rect x="120.0" y="246.0" width="680.0" height="92.0" rx="12" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="460.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад: ноутбук</text>
<text x="460.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">спершу сам заряджається від доку (споживач) →</text>
<text x="460.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тоді тим самим кабелем живить телефон (джерело): роль помінялась по PD, дріт не чіпали</text>
<rect x="123.8" y="356.8" width="672.4" height="30.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="460.0" y="375.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Дворольовий порт корисний скрізь, де пристрій то бере, то віддає — ноутбук, павербанк, телефон із периферією.</tspan></text>
</svg>