<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевертаємо роль: від споживача до джерела</text>
<line x1="450.0" y1="56.0" x2="450.0" y2="300.0" stroke="#d7d7d7" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="225.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Досі: пристрій БЕРЕ</text>
<rect x="85.0" y="108.0" width="110.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="140.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">джерело</tspan><tspan x="140.0" dy="14.3">(Rp)</tspan></text>
<rect x="320.0" y="108.0" width="120.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="380.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">наш пристрій</tspan><tspan x="380.0" dy="14.3">Rd · бере</tspan></text>
<line x1="195.0" y1="140.0" x2="318.0" y2="140.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="256.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">VBUS →</text>
<text x="225.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вішає Rd, просить, споживає</text>
<text x="675.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Тепер: пристрій ДАЄ</text>
<rect x="525.0" y="108.0" width="124.0" height="64.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="587.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="587.0" dy="0.0">наш пристрій</tspan><tspan x="587.0" dy="14.3">Rp · живить</tspan></text>
<rect x="770.0" y="108.0" width="110.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="825.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">споживач</tspan><tspan x="825.0" dy="14.3">(Rd)</tspan></text>
<line x1="649.0" y1="140.0" x2="768.0" y2="140.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="708.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">VBUS →</text>
<text x="675.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вішає Rp, дає 5 В, у PD відповідає як джерело</text>
<rect x="152.7" y="255.3" width="594.6" height="49.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Щоб давати живлення, пристрій бере дзеркальну роль: підтяжка Rp замість Rd,</tspan><tspan x="450.0" dy="14.3">сам виставляє 5 В на VBUS, а схоче PD — відповідає меню профілів. Інший бік тієї ж розмови.</tspan></text>
</svg>