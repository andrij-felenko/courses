<line x1="180.0" y1="275.0" x2="248.0" y2="275.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="250.0" y="248.0" width="130.0" height="56.0" rx="8" fill="#fbfbf8" stroke="#1b1b1b" stroke-width="2"/>
<text x="315.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вузол</text>
<text x="315.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">power path</text>
<line x1="380.0" y1="262.0" x2="468.0" y2="240.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="470.0" y="214.0" width="120.0" height="48.0" rx="8" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="530.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">система</text>
<text x="530.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">працює одразу</text>
<line x1="380.0" y1="290.0" x2="468.0" y2="322.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<rect x="470.0" y="300.0" width="120.0" height="48.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="530.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">батарея</text>
<text x="530.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заряд залишком</text>
<text x="710.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">мертва / відсутня батарея —</text>
<text x="710.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пристрій усе одно вмикається</text>
<text x="710.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(батарея = буфер, не єдиний шлях)</text>
<rect x="70.0" y="412.0" width="800.0" height="26.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Розв'язавши «вхід → систему» й «вхід → батарею», дістаємо миттєвий старт навіть із розрядженою батареєю і чистий перехід на батарею, коли USB прибрали.</text>
</svg>
