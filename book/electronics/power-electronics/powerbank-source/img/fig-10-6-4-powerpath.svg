<text x="444.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">система</text>
<text x="700.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">мертва батарея →</text>
<text x="700.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">система не стартує</text>
<rect x="50.0" y="192.0" width="850.0" height="208.0" rx="12" fill="#f1f8f2" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="80.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Power path: вузол годує систему НАПРЯМУ, а батарею заряджає окремо</text>
<rect x="90.0" y="250.0" width="90.0" height="50.0" rx="8" fill="#fff" stroke="#caa24a" stroke-width="1.8"/>
