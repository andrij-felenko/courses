<rect x="490.0" y="286.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="510.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗ помпа на проміжну напругу</text>
<line x1="510.0" y1="330.0" x2="880.0" y2="330.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="510.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">палить, як лінійний; узгодь кратність</text>
