<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗ boost «захистить» вихід</text>
<line x1="70.0" y1="114.0" x2="440.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="70.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ні — він прозорий для КЗ; додай роз'єднувач</text>
<rect x="490.0" y="70.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="510.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗ charge pump на реальний струм</text>
<line x1="510.0" y1="114.0" x2="880.0" y2="114.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="510.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ні — це мА; для потужності бери котушку</text>
<rect x="50.0" y="178.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="70.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗ мережа без ізоляції</text>
<line x1="70.0" y1="222.0" x2="440.0" y2="222.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="70.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">смертельно — для 230 В лише flyback/ізольовані</text>
<rect x="490.0" y="178.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="510.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗ котушка boost під вихідний струм</text>
<line x1="510.0" y1="222.0" x2="880.0" y2="222.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="510.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ні — рахуй під ВХІДНИЙ (більший) струм</text>
<rect x="50.0" y="286.0" width="410.0" height="92.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="70.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗ flyback без снабера</text>
<line x1="70.0" y1="330.0" x2="440.0" y2="330.0" stroke="#e4e4e4" stroke-width="1.0"/>
