<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві межі за струмом: Isat і Irms</text>
<rect x="30.0" y="56.0" width="405.0" height="250.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="232.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Isat — магнітна межа</text>
<rect x="48.0" y="106.0" width="369.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="232.5" y="130.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="232.5" dy="0.0">миттєва: обмежує ПІК</tspan></text>
<rect x="48.0" y="156.0" width="369.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="232.5" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">перевищив на мить →</tspan><tspan x="232.5" dy="16.9">осердя насичується,</tspan><tspan x="232.5" dy="16.9">L обвалюється,</tspan><tspan x="232.5" dy="16.9">струм стрибає</tspan></text>
<rect x="465.0" y="56.0" width="405.0" height="250.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="667.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Irms — теплова межа</text>
<rect x="483.0" y="106.0" width="369.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="667.5" y="130.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="667.5" dy="0.0">тривала: обмежує СЕРЕДНІЙ RMS-струм</tspan></text>
<rect x="483.0" y="156.0" width="369.0" height="120.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="667.5" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="667.5" dy="0.0">перевищив надовго →</tspan><tspan x="667.5" dy="16.9">перегрів на DCR,</tspan><tspan x="667.5" dy="16.9">мідь і осердя гріються,</tspan><tspan x="667.5" dy="16.9">до відмови</tspan></text>
<text x="450.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">пік</text>
<text x="450.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">vs</text>
<text x="450.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">середнє</text>
<rect x="30.0" y="322.0" width="840.0" height="44.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">обидві мусять виконуватись — їх легко сплутати</tspan></text>
