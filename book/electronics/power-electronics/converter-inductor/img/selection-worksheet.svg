<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок котушки покроково (buck 5 В → 3.3 В, 2 А)</text>
<rect x="90.0" y="66.0" width="330.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">1) D = 3.3/5 = 0.66</tspan></text>
<rect x="90.0" y="178.0" width="330.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="255.0" y="222.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">2) ΔIціль = 0.35·2 = 0.7 А</tspan></text>
<rect x="90.0" y="290.0" width="330.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">3) L ≈ 3.2 → беремо 3.3 мкГ</tspan><tspan x="255.0" dy="16.9">(реальна ΔI ≈ 0.68 А, 34 %)</tspan></text>
<rect x="515.0" y="66.0" width="330.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="102.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">4) Iпік = 2 + 0.68/2 ≈ 2.34 А</tspan><tspan x="680.0" dy="16.9">→ Isat ≥ 3.0, беремо ≥ 3.3 А</tspan></text>
<rect x="515.0" y="178.0" width="330.0" height="80.0" rx="6" fill="#fdf3e3" stroke="#b9770e" stroke-width="1.5"/><text x="680.0" y="222.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">5) Irms ≥ 2.5 А</tspan></text>
<rect x="515.0" y="290.0" width="330.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="680.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">6) DCR ≈ 30 мОм</tspan><tspan x="680.0" dy="16.9">Pмідь = 2²·0.03 = 0.12 Вт</tspan></text>
