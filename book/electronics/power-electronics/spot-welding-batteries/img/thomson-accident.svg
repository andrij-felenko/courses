<text x="580.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">тут опір найбільший</text>
<text x="580.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">→ увесь жар сюди → сплав</text>
<text x="505.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">грубі кінці, що лише торкаються</text>
<rect x="66.1" y="326.2" width="587.7" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Q = I² · R · t.  Струм скрізь однаковий, а опір R на нещільному стику — найбільший.</tspan><tspan x="360.0" dy="15.6">Тому весь жар сідає туди й плавить метал. Томсон побачив у цьому спосіб.</tspan></text>
