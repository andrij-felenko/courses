<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях струму: тепло — там, де опір найбільший</text>
<rect x="286.0" y="70.0" width="28.0" height="46.0" rx="4" fill="#b5651d" stroke="#333333" stroke-width="1.4"/>
<rect x="406.0" y="70.0" width="28.0" height="46.0" rx="4" fill="#b5651d" stroke="#333333" stroke-width="1.4"/>
<text x="360.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">два електроди поруч</text>
<rect x="230.0" y="130.0" width="260.0" height="16.0" rx="3" fill="#d8dee5" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">нікелева стрічка</text>
<rect x="210.0" y="170.0" width="300.0" height="120.0" rx="8" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/>
<text x="360.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">корпус комірки</text>
<circle cx="300.0" cy="146.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="420.0" cy="146.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<line x1="300.0" y1="116.0" x2="300.0" y2="130.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="300.0" y1="150.0" x2="300.0" y2="174.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="300.0" y1="178.0" x2="420.0" y2="178.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="420.0" y1="174.0" x2="420.0" y2="150.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="420.0" y1="130.0" x2="420.0" y2="116.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="97.5" y="120.4" width="104.9" height="59.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="150.0" dy="0.0">тут опір</tspan><tspan x="150.0" dy="15.6">найбільший →</tspan><tspan x="150.0" dy="15.6">тут і плавить</tspan></text>
<rect x="80.0" y="311.2" width="560.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Обидва електроди — з ОДНОГО боку. Струм не йде наскрізь крізь комірку,</tspan><tspan x="360.0" dy="15.6">а «пірнає» у корпус під першим і виходить під другим. Комірка не в колі.</tspan></text>
