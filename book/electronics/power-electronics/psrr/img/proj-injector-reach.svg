<rect x="724.0" y="78.0" width="214.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="831.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="831.0" dy="0.0">Стеля — 50 Ω генератора</tspan><tspan x="831.0" dy="14.3">і Cin. Вище кількох сотень</tspan><tspan x="831.0" dy="14.3">кГц дешевий інжектор</tspan><tspan x="831.0" dy="14.3">видихається</tspan></text>
<rect x="724.0" y="190.0" width="214.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="831.0" y="220.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="831.0" dy="0.0">Але це НЕ біда: калібрувати</tspan><tspan x="831.0" dy="14.3">інжектор не треба —</tspan><tspan x="831.0" dy="14.3">ми міряємо і вхід теж,</tspan><tspan x="831.0" dy="14.3">а відношення його з'їдає</tspan></text>
<rect x="96.0" y="470.0" width="842.0" height="62.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="517.0" y="497.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="517.0" dy="0.0">Генератор на 10 Vpp через Cc = 100 µF і Rs = 10 Ω. Найдужче інжекція б'є коло кілогерца; нижче її ріже Cc, вище — Cin.</tspan><tspan x="517.0" dy="15.0">Там, де PSRR найглибший (низи), брижів удосталь; де інжекції обмаль (верхи), там і придушення мале — і це рятує</tspan></text>
