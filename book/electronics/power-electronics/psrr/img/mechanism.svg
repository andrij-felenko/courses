<text x="150.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">2. підсилення петлі скінченне й падає з частотою</text>
<text x="390.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Придушення тримається на петлі; його межу ставлять сталість еталона й запас петльового підсилення</text>
