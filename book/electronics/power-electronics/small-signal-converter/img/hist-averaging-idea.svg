<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідея усереднення за станами: зважити дві схеми ключа в одну</text>
<rect x="60.0" y="70.0" width="210.0" height="90.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="165.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ключ ВІДКРИТИЙ (частка D)</text>
<text x="165.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ẋ = A₁·x + b₁·u</text>
<rect x="60.0" y="180.0" width="210.0" height="90.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ключ ЗАКРИТИЙ (частка 1−D)</text>
<text x="165.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ẋ = A₂·x + b₂·u</text>
<line x1="270.0" y1="115.0" x2="360.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="270.0" y1="225.0" x2="360.0" y2="190.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="400.0" cy="170.0" r="34.0" fill="#fff8e6" stroke="#b8860b" stroke-width="2.2"/>
<text x="400.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">зважити</text>
<text x="400.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D·(…)+(1−D)·(…)</text>
<text x="320.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">×D</text>
<text x="320.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">×(1−D)</text>
<line x1="434.0" y1="170.0" x2="540.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="540.0" y="120.0" width="300.0" height="100.0" rx="12" fill="#fdf4e3" stroke="#b8860b" stroke-width="2.2"/>
<text x="690.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">ОДНА усереднена модель</text>
<text x="690.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ẋ = A·x + b·u</text>
<text x="690.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">A = D·A₁ + (1−D)·A₂</text>
<text x="450.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Дві розривні схеми ключа зливаються в одну гладку систему — яку вже можна лінеаризувати й малювати як Боде.</text>
</svg>