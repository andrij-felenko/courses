<text x="683.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">A = D·A₁ + D′·A₂     B = D·B₁ + D′·B₂</text>
<text x="683.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">У buck змінюється лише те, ЗВІДКИ живиться котушка —</text>
<text x="683.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">тож різниця фаз сидить у вхідному стовпчику B.</text>
