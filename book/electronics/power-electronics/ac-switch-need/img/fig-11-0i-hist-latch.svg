<text x="764.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">імпульс на затвор</text>
<text x="764.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">(одна іскра — і все)</text>
<text x="450.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">Кожен транзистор живить базу іншого: відкрився один — відкрив другий — той ще дужче відкрив перший. Раз спалахнувши, защіпка тримається сама.</text>
