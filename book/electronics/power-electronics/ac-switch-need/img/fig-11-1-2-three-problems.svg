<text x="450.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пік ±325 В;</text>
<text x="450.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Vds(max) ключа —</text>
<text x="450.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">десятки вольт →</text>
<text x="450.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">миттєвий пробій</text>
<rect x="610.0" y="60.0" width="260.0" height="168.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
