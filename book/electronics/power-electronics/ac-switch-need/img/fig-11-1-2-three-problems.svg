<text x="160.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">синусоїда йде</text>
<text x="160.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">в обидва боки;</text>
<text x="160.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перехід проводить</text>
<text x="160.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лише в один</text>
<rect x="320.0" y="60.0" width="260.0" height="168.0" rx="10" fill="#ffffff" stroke="#e0a32e" stroke-width="1.8"/>
