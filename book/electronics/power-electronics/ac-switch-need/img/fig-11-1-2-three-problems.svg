<text x="440.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три причини, чому транзистор із §2.6/§2.7 не стане в розетку</text>
<rect x="30.0" y="60.0" width="260.0" height="168.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
