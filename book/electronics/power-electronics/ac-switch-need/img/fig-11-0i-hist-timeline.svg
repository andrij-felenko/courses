<text x="430.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Bell Labs:</text>
<text x="430.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">PNPN-перемикач</text>
<text x="430.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(Молл, Танненбаум,</text>
<text x="430.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Голді, Голоняк)</text>
<circle cx="560.0" cy="250.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<line x1="560.0" y1="256.0" x2="560.0" y2="270.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="560.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1957</text>
<text x="560.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">GE, Клайд (NY):</text>
<text x="560.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ третій вивід (затвор)</text>
<text x="560.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">SCR — Голл, Гутцвіллер</text>
<text x="560.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перші 2 шт., липень</text>
<circle cx="760.0" cy="250.0" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<line x1="760.0" y1="244.0" x2="760.0" y2="238.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="760.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">&gt;1960-ті</text>
<text x="760.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тиристор витісняє</text>
<text x="760.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тиратрон; IEC робить</text>
<text x="760.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«thyristor» = thyratron</text>
<text x="760.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">+ transistor</text>
<text x="450.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">Назва thyristor зшила обидві ери: «thyra» (грец. «брама/двері») від тиратрона + «-tor» від transistor</text>
