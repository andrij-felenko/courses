<text x="300.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9a7a1e" text-anchor="middle" font-weight="bold" font-style="normal">~1928</text>
<text x="300.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тиратрон Галла (GE):</text>
<text x="300.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сітка вмикає дугу —</text>
<text x="300.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перший кер. ключ сили</text>
<circle cx="430.0" cy="250.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<line x1="430.0" y1="244.0" x2="430.0" y2="238.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
