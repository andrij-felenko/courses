<text x="250.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#9a7a1e" text-anchor="middle" font-weight="bold" font-style="normal">ЕРА ГАЗОВИХ ЛАМП  (скло, розжарений катод, ртуть)</text>
<text x="650.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ЕРА КРЕМНІЮ  (твердотільні ключі)</text>
