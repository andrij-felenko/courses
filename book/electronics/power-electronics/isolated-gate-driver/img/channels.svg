<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три канали через бар'єр: та сама задача, різна фізика</text>
<line x1="390.0" y1="55.0" x2="390.0" y2="410.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 5"/>
<text x="390.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">бар'єр ізоляції</text>
<text x="195.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">вхід (логіка)</text>
<text x="585.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">вихід (плаваючий затвор)</text>
<rect x="60.0" y="94.0" width="200.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">світлодіод → фотоприймач</tspan></text>
<rect x="520.0" y="94.0" width="200.0" height="52.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Оптопара</tspan></text>
<line x1="268.0" y1="120.0" x2="512.0" y2="120.0" stroke="#b8860b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">світло крізь прозорий гель</text>
<rect x="60.0" y="202.0" width="200.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">імпульс струму в котушці</tspan></text>
<rect x="520.0" y="202.0" width="200.0" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="232.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Трансформатор</tspan></text>
<line x1="268.0" y1="228.0" x2="512.0" y2="228.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">магнітне поле крізь виток</text>
<rect x="60.0" y="310.0" width="200.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">модульований фронт</tspan></text>
<rect x="520.0" y="310.0" width="200.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="340.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Цифровий ізолятор</tspan></text>
<line x1="268.0" y1="336.0" x2="512.0" y2="336.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">ємність / мікро-котушка в чипі</text>
