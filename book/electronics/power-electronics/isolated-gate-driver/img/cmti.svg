<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться вимога CMTI</text>
<rect x="40.0" y="150.0" width="150.0" height="80.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Логіка</tspan><tspan x="115.0" dy="16.9">земля A</tspan><tspan x="115.0" dy="16.9">(нерухома)</tspan></text>
<rect x="530.0" y="150.0" width="150.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Драйвер</tspan><tspan x="605.0" dy="16.9">земля B</tspan><tspan x="605.0" dy="16.9">(«літає»)</tspan></text>
<line x1="346.0" y1="90.0" x2="346.0" y2="290.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="374.0" y1="90.0" x2="374.0" y2="290.0" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="360.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cio (паразитна ємність бар'єра)</text>
<line x1="400.0" y1="190.0" x2="320.0" y2="190.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">i = Cio · dV/dt</text>
<line x1="605.0" y1="230.0" x2="605.0" y2="320.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="605.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">земля B стрибає
на сотні В за наносекунди</text>
<line x1="605.0" y1="320.0" x2="605.0" y2="292.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="300.0" width="250.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">цей струм намагається</tspan><tspan x="165.0" dy="14.3">хибно ворухнути вихід —</tspan><tspan x="165.0" dy="14.3">CMTI каже, скільки dV/dt стерпить</tspan></text>
