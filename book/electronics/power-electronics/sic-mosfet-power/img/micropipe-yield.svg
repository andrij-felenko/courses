<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="476" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама пластина: діод уже можна продавати, MOSFET — ще ні</text>
<rect x="344.0" y="56.0" width="270.0" height="62.0" rx="6" fill="#eef1f4" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="479.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="479.0" dy="0.0">Діод Шотткі</tspan><tspan x="479.0" dy="18.2">кристал ≈ 1 мм²</tspan></text>
<rect x="614.0" y="56.0" width="270.0" height="62.0" rx="6" fill="#eef1f4" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="749.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="749.0" dy="0.0">MOSFET</tspan><tspan x="749.0" dy="18.2">кристал ≈ 25 мм²</tspan></text>
<text x="34.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700"><tspan x="34.0" dy="0.0">Густина мікротрубок</tspan><tspan x="34.0" dy="16.9">у пластині</tspan></text>
<text x="34.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">≥ 100 /см²</text>
<text x="34.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перші комерційні пластини, 1991</text>
<rect x="350.0" y="124.0" width="258.0" height="54.0" rx="6" fill="#fff4e0" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="479.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#a06000" text-anchor="middle" font-weight="700">37 %</text>
<rect x="620.0" y="124.0" width="258.0" height="54.0" rx="6" fill="#fdecea" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="749.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 0</text>
<text x="34.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ 20 /см²</text>
<text x="34.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кінець 1990-х</text>
<rect x="350.0" y="190.0" width="258.0" height="54.0" rx="6" fill="#eafaf1" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="479.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">82 %</text>
<rect x="620.0" y="190.0" width="258.0" height="54.0" rx="6" fill="#fdecea" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="749.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">0.7 %</text>
<text x="34.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ 1 /см²</text>
<text x="34.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">початок 2000-х</text>
<rect x="350.0" y="256.0" width="258.0" height="54.0" rx="6" fill="#eafaf1" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="479.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">99 %</text>
<rect x="620.0" y="256.0" width="258.0" height="54.0" rx="6" fill="#eafaf1" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="749.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">78 %</text>
<text x="34.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ 0.1 /см² і менше</text>
<text x="34.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">після ZMP, 2007</text>
<rect x="350.0" y="322.0" width="258.0" height="54.0" rx="6" fill="#eafaf1" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="479.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">99.9 %</text>
<rect x="620.0" y="322.0" width="258.0" height="54.0" rx="6" fill="#eafaf1" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="749.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">97 %</text>
<text x="450.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихід придатних кристалів:   Y = e^(−D·A)</text>
<text x="450.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">D — густина мікротрубок, A — площа кристала. Один наскрізний канал —</text>
<text x="450.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">і прилад пробитий; на великому кристалі влучає майже напевно.</text>
</svg>