<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки куб: один степінь від товщини, два від легування</text>
<rect x="320.0" y="52.0" width="260.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="79.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">поле міцніше в 10 разів</tspan></text>
<text x="450.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">при ТІЙ САМІЙ напрузі BV</text>
<line x1="430.0" y1="124.0" x2="250.0" y2="168.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="124.0" x2="650.0" y2="168.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="100.0" y="172.0" width="300.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="250.0" y="210.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">шар тонший у 10 разів</tspan><tspan x="250.0" dy="16.9">d = 2·BV / Ec</tspan></text>
<rect x="100.0" y="274.0" width="300.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="250.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">менший опір: ÷ 10</tspan></text>
<text x="250.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">один степінь Ec</text>
<rect x="500.0" y="172.0" width="300.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="650.0" y="210.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">легування густіше у 100 разів</tspan><tspan x="650.0" dy="16.9">Nd = ε·Ec² / (2·q·BV)</tspan></text>
<rect x="500.0" y="274.0" width="300.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="650.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">менший опір: ÷ 100</tspan></text>
<text x="650.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">два степені Ec</text>
<text x="650.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">бо BV — площа трикутника:</text>
<text x="650.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">і висота, і основа несуть поле</text>
<text x="250.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">бо напруга — поле × товщина</text>
