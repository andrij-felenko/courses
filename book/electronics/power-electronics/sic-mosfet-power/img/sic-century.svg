<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 856" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="856" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сто років карбіду кремнію: фізику знали з 1907-го, кристал — аж наприкінці</text>
<rect x="24.0" y="66.0" width="170.0" height="234.0" rx="8" fill="#eef1f4" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="109.0" y="179.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="109.0" dy="0.0">Матеріал є,</tspan><tspan x="109.0" dy="16.9">приладу нема</tspan></text>
<rect x="24.0" y="410.0" width="170.0" height="240.0" rx="8" fill="#eef1f4" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="109.0" y="517.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="109.0" dy="0.0">Учаться</tspan><tspan x="109.0" dy="16.9">вирощувати</tspan><tspan x="109.0" dy="16.9">кристал</tspan></text>
<rect x="24.0" y="650.0" width="170.0" height="174.0" rx="8" fill="#eef1f4" stroke="#dfe4ea" stroke-width="1.0"/>
<text x="109.0" y="741.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="109.0" dy="0.0">Прилади</tspan></text>
<line x1="310.0" y1="66.0" x2="310.0" y2="300.0" stroke="#6b7280" stroke-width="2.5"/>
<line x1="310.0" y1="410.0" x2="310.0" y2="824.0" stroke="#6b7280" stroke-width="2.5"/>
<circle cx="310.0" cy="90.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1891</text>
<text x="345.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Ачесон плавить глину з коксом, шукаючи діамант.</tspan><tspan x="345.0" dy="18.2">Дістає карборунд — найтвердіший абразив свого часу.</tspan></text>
<circle cx="310.0" cy="152.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1906</text>
<text x="345.0" y="147.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Патент Данвуді: карборундовий детектор.</tspan><tspan x="345.0" dy="18.2">Карбід кремнію — перший напівпровідник у продажу.</tspan></text>
<circle cx="310.0" cy="214.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1907</text>
<text x="345.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Раунд: 10 В на кристал — і той світиться.</tspan><tspan x="345.0" dy="18.2">Два абзаци в Electrical World, без пояснення.</tspan></text>
<circle cx="310.0" cy="276.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1927</text>
<text x="345.0" y="271.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Лосєв дослідив те свічення й пояснив його квантово.</tspan><tspan x="345.0" dy="18.2">Сорок три праці; лист Айнштайнові.</tspan></text>
<rect x="240.0" y="300.0" width="580.0" height="110.0" rx="8" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/>
<text x="530.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Півстоліття без кристала</text>
<text x="530.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">Кремній тягнеться з розплаву (Чохральський, 1916).</tspan><tspan x="530.0" dy="16.9">Карбід кремнію розплаву не має: за ~2700 °C він сублімує.</tspan><tspan x="530.0" dy="16.9">Нема розплаву — нема булі, пластини, промисловості.</tspan></text>
<circle cx="310.0" cy="442.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1955</text>
<text x="345.0" y="437.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Лелі (Philips): сублімація дає чисті пластинки —</tspan><tspan x="345.0" dy="18.2">випадкового розміру й перемішаних політипів.</tspan></text>
<circle cx="310.0" cy="502.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1978</text>
<text x="345.0" y="497.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Таїров і Цвєтков (ЛЕТІ, Ленінград): затравка.</tspan><tspan x="345.0" dy="18.2">Сублімація на зерно → буля заданого політипу.</tspan></text>
<circle cx="310.0" cy="562.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="567.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1987</text>
<text x="345.0" y="557.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Палмор (NCSU): перший SiC-MOSFET у лабораторії.</tspan><tspan x="345.0" dy="18.2">Засновано Cree.</tspan></text>
<circle cx="310.0" cy="620.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="282.0" y="625.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1991</text>
<text x="345.0" y="615.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Cree: перші комерційні SiC-пластини.</tspan><tspan x="345.0" dy="18.2">Мікротрубок ≥100 на см² — приладу не збудувати.</tspan></text>
<circle cx="310.0" cy="682.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="282.0" y="687.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">2001</text>
<text x="345.0" y="677.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Infineon: перший комерційний діод Шотткі.</tspan><tspan x="345.0" dy="18.2">Ні затвора, ні оксиду, кристал ≈1 мм² — терпить дефекти.</tspan></text>
<circle cx="310.0" cy="742.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="282.0" y="747.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">2007</text>
<text x="345.0" y="746.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">Cree: 100-мм пластина без мікротрубок (ZMP).</tspan></text>
<circle cx="310.0" cy="794.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.5"/>
<text x="282.0" y="799.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">2010–11</text>
<text x="345.0" y="789.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="345.0" dy="0.0">ROHM: масове виробництво MOSFET (2010).</tspan><tspan x="345.0" dy="18.2">Cree: перший «повністю кваліфікований» (2011).</tspan></text>
</svg>