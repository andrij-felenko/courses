<text x="730.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">клапан OFF</text>
<text x="470.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">неперекривні фази гарантують: коли сусід підіймається, клапан уже жорстко замкнено — назад нічого не тече</text>
<text x="470.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ціна — трохи менше часу на власне передавання заряду за період</text>
