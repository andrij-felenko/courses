<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пік струму — не те, що працює: діючий струм балансу</text>
<text x="255.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">А. Балансир умикається лиш у вікні</text>
<line x1="70.0" y1="330.0" x2="440.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="70.0" y1="330.0" x2="70.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="62.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">I</text>
<rect x="124.0" y="95.0" width="22.0" height="235.0" rx="2" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<rect x="244.0" y="95.0" width="22.0" height="235.0" rx="2" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<rect x="364.0" y="95.0" width="22.0" height="235.0" rx="2" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<text x="135.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I_б = 60 мА</text>
<text x="255.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">вікно</text>
<text x="375.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">~30 хв</text>
<line x1="70.0" y1="306.0" x2="440.0" y2="306.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="7,4"/>
<text x="436.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">I_еф = I_б·D</text>
<text x="255.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">час (цикли заряду) →</text>
<text x="255.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(висота не в масштабі)</text>
<text x="725.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Б. I_еф проти розкиду витоку (в масштабі)</text>
<line x1="560.0" y1="300.0" x2="890.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="560.0" y1="300.0" x2="560.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="560.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.0</text>
<line x1="725.0" y1="300.0" x2="725.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="725.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.5</text>
<line x1="890.0" y1="300.0" x2="890.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="890.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1.0</text>
<text x="725.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">струм, мА</text>
<rect x="560.0" y="120.0" width="273.9" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.7"/>
<text x="564.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">I_еф ≈ 0.83 мА  (вікно 30 хв/добу)</text>
<rect x="560.0" y="200.0" width="20.5" height="34.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.7"/>
<text x="590.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">розкид витоку ΔI ≈ 0.06 мА</text>
<text x="725.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">перекрито ≈ ×13 → тримати легко</text>
<rect x="33.0" y="389.5" width="853.9" height="31.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">діючий струм I_еф = I_б·D — це усереднений пік; тримати вирівняний пакет проти саморозряду легко, бо розкид витоку лише мікроамперний</tspan></text>
</svg>