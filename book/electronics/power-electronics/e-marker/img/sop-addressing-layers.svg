<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія адресації пакетів USB PD: SOP, SOP' та SOP''</text>
<rect x="40.0" y="60.0" width="170.0" height="230.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/>
<text x="125.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">DFP / Хост</text>
<text x="125.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Порт-партнер</text>
<text x="125.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Генератор пакетів:</text>
<text x="125.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">• SOP (до Sink)</text>
<text x="125.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle" font-weight="700">• SOP' (до Штекера 1)</text>
<text x="125.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c026d3" text-anchor="middle" font-weight="700">• SOP'' (до Штекера 2)</text>
<text x="125.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">Подає VCONN (5 В)</text>
<rect x="250.0" y="90.0" width="150.0" height="170.0" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="2.0"/>
<text x="325.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">Штекер 1 (Ближній)</text>
<rect x="265.0" y="130.0" width="120.0" height="45.0" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="325.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle" font-weight="700">E-Marker 1</text>
<text x="325.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">Адреса: SOP'</text>
<text x="325.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Sync-1 Sync-1</text>
<text x="325.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle" font-weight="700">Sync-1 Sync-2</text>
<text x="325.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Живиться від VCONN</text>
<rect x="440.0" y="90.0" width="150.0" height="170.0" rx="6" fill="#fdf4ff" stroke="#d946ef" stroke-width="2.0"/>
<text x="515.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#86198f" text-anchor="middle" font-weight="700">Штекер 2 (Дальній)</text>
<rect x="455.0" y="130.0" width="120.0" height="45.0" rx="4" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
<text x="515.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#701a75" text-anchor="middle" font-weight="700">E-Marker 2</text>
<text x="515.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a21caf" text-anchor="middle" font-weight="700">Адреса: SOP''</text>
<text x="515.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Sync-1 Sync-1</text>
<text x="515.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c026d3" text-anchor="middle" font-weight="700">Sync-3 Sync-3</text>
<text x="515.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Опціональний чип)</text>
<rect x="630.0" y="60.0" width="150.0" height="230.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="705.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">UFP / Пристрій</text>
<text x="705.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Порт-партнер (Sink)</text>
<text x="705.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Приймає пакети:</text>
<text x="705.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Тільки SOP</text>
<text x="705.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Sync-1 Sync-1</text>
<text x="705.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Sync-1 Sync-1</text>
<text x="705.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Ігнорує SOP'/SOP''</text>
<line x1="210.0" y1="75.0" x2="630.0" y2="75.0" stroke="#0284c7" stroke-width="3.0"/>
<text x="420.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">Спільна фізична лінія CC (напівдуплекс BMC 300 кбіт/с)</text>
<line x1="325.0" y1="75.0" x2="325.0" y2="90.0" stroke="#0284c7" stroke-width="2.0"/>
<line x1="515.0" y1="75.0" x2="515.0" y2="90.0" stroke="#0284c7" stroke-width="2.0"/>
<rect x="40.0" y="305.0" width="740.0" height="45.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Преамбула (64 біти) однакова для всіх. Тип адресата задається 4 символами K-code Start-of-Packet:</text>
<text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">SOP: [Sync-1, Sync-1, Sync-1, Sync-1]  |  SOP': [Sync-1, Sync-1, Sync-1, Sync-2]  |  SOP'': [Sync-1, Sync-1, Sync-3, Sync-3]</text>
</svg>