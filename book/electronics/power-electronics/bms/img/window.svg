<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 393.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="393.5" fill="#ffffff"/>
