<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист: останній рубіж проти чотирьох загроз</text>
<rect x="325.0" y="152.0" width="170.0" height="96.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="410.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">комірка</text>
<text x="410.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+ ЗАХИСТ</text>
<text x="410.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(відрубує на межі)</text>
<rect x="35.0" y="71.0" width="230.0" height="78.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.8"/>
<text x="150.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Перезаряд</text>
<text x="150.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">OVP: V &gt; ~4.3 В</tspan><tspan x="150.0" dy="13.0">осідання літію, пожежа</tspan></text>
<line x1="265.0" y1="120.0" x2="320.0" y2="170.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="555.0" y="71.0" width="230.0" height="78.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="670.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Глибокий розряд</text>
<text x="670.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">UVP: V &lt; ~2.5 В</tspan><tspan x="670.0" dy="13.0">розчиняється мідь, смерть</tspan></text>
<line x1="555.0" y1="120.0" x2="500.0" y2="170.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="261.0" width="230.0" height="78.0" rx="6" fill="#fbf3e0" stroke="#b8860b" stroke-width="1.8"/>
<text x="150.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">Надструм</text>
<text x="150.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">OCP: забагато ампер</tspan><tspan x="150.0" dy="13.0">джоулеве тепло</tspan></text>
<line x1="265.0" y1="290.0" x2="320.0" y2="230.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="555.0" y="261.0" width="230.0" height="78.0" rx="6" fill="#f3eaf7" stroke="#7d3c98" stroke-width="1.8"/>
<text x="670.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d3c98" text-anchor="middle" font-weight="700">Коротке замикання</text>
<text x="670.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">SCP: миттєвий стрибок</tspan><tspan x="670.0" dy="13.0">обрив умить</tspan></text>
<line x1="555.0" y1="290.0" x2="500.0" y2="230.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="36.3" y="344.5" width="747.3" height="31.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">у нормі захист мовчить; вийшла напруга чи струм за межі — аварійно відрубує комірку. Це не зарядник, а остання сітка</tspan></text>
</svg>