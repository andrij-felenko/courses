<text x="110.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Q_H</text>
<text x="110.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ON (провідний)</text>
<circle cx="110.0" cy="260.0" r="4.0" fill="#1a1a1a" stroke="#333333" stroke-width="1.5"/>
<line x1="110.0" y1="260.0" x2="200.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0"/>
