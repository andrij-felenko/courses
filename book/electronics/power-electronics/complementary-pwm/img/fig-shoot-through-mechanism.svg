<text x="640.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Навантаження</text>
<rect x="485.0" y="320.0" width="50.0" height="60.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="510.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Q_L</text>
<text x="510.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ще провідний!</text>
<path d="M 510,105 L 510,415" stroke="#c0392b" stroke-width="4" fill="none"/>
<polygon points="510,418 504,404 516,404" fill="#c0392b"/>
<text x="675.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Прямий наскрізний шлях</text>
<text x="675.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_пік = V_bus / (2·R_ds)</text>
<text x="675.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Струм: сотні ампер!</text>
<rect x="570.0" y="315.0" width="215.0" height="85.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="677.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідки наскрізного струму:</text>
<text x="677.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Миттєвий перегрів кристала</text>
<text x="677.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Стрибок dV/dt та защіпка</text>
<text x="677.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Тепловий пробій і вибух</text>
