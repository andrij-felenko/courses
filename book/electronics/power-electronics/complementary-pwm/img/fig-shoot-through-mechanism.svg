<text x="555.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">+V_bus</text>
<line x1="480.0" y1="415.0" x2="540.0" y2="415.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="555.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">GND (0 В)</text>
