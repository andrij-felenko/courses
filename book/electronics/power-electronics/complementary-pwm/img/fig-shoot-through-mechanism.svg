<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Штатний режим: один ключ увімкнений</text>
<line x1="110.0" y1="105.0" x2="110.0" y2="415.0" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="80.0" y1="105.0" x2="140.0" y2="105.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="155.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">+V_bus</text>
<line x1="80.0" y1="415.0" x2="140.0" y2="415.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="155.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">GND (0 В)</text>
