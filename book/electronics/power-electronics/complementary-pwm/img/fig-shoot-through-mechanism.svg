<text x="240.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навантаження</text>
<rect x="85.0" y="320.0" width="50.0" height="60.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="110.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Q_L</text>
<text x="110.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">OFF (закритий)</text>
<path d="M 110,105 L 110,260 L 200,260" stroke="#27ae60" stroke-width="2.5" fill="none" stroke-dasharray="5,3"/>
<text x="270.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Струм іде в навантаження</text>
<text x="270.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">I_вих = I_нав</text>
<text x="270.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Втрати: лише I² · R_ds(on)</text>
