<rect x="-5.0" y="381.0" width="770.1" height="22.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="380.0" y="395.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">PR_Swap міняє напрямок живлення без втрати USB з'єднання. DR_Swap міняє ролі даних (DFP ↔ UFP), а VCONN_Swap передає живлення кабелю.</tspan></text>
