<rect x="74.8" y="377.5" width="610.5" height="35.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="380.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Квитування GoodCRC відбувається виключно на рівні протоколу (PHY/Protocol Layer).</tspan><tspan x="380.0" dy="13.0">Якщо після nRetryCount (2 повтори, 3 спроби) GoodCRC не отримано — ініціюється Soft_Reset або Hard_Reset.</tspan></text>
