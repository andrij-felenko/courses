<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">PESC '77: дві доповіді підряд в одному томі</text>
<rect x="60.0" y="56.0" width="880.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">IEEE Power Electronics Specialists Conference · Пало-Альто, Каліфорнія · 14–16 червня 1977</tspan></text>
<rect x="60.0" y="118.0" width="420.0" height="300.0" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="2.0"/><text x="84.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">с. 156–159</text><text x="84.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Р. П. Мессі · Е. К. Снайдер</text><text x="84.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">«High voltage single-ended</text><text x="84.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">DC-DC converter»</text><line x1="84.0" y1="240.0" x2="456.0" y2="240.0" stroke="#d8dde3" stroke-width="1.4"/><text x="84.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">замовлення промисловості</text><text x="84.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1800 В · 130 Вт · ККД 82 %</text><text x="84.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">на 25 % дешевше за двотактний</text><text x="84.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">трансформаторний, один ключ</text><text x="84.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">мало деталей у силовому тракті</text>
<rect x="520.0" y="118.0" width="420.0" height="300.0" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="2.0"/><text x="544.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">с. 160–179</text><text x="544.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">С. Ћук · Р. Д. Мідлбрук</text><text x="544.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">«A new optimum topology switching</text><text x="544.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">DC-to-DC converter»</text><line x1="544.0" y1="240.0" x2="916.0" y2="240.0" stroke="#d8dde3" stroke-width="1.4"/><text x="544.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">докторська робота в Caltech</text><text x="544.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">непульсуючий струм з обох боків</text><text x="544.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">четверта фундаментальна топологія</text><text x="544.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">патент US 4 184 197 (28.09.1977)</text><text x="544.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">енергію переносить конденсатор</text>
<line x1="270.0" y1="424.0" x2="270.0" y2="448.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="730.0" y1="424.0" x2="730.0" y2="448.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="110.0" y="452.0" width="320.0" height="42.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="477.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">SEPIC — вихід ДОДАТНИЙ</tspan></text>
<rect x="570.0" y="452.0" width="320.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="477.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Ћук — вихід ВІД'ЄМНИЙ</tspan></text>
<rect x="60.0" y="512.0" width="880.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="526.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Обидві схеми з одного кореня: енергію на вихід переносить послідовний конденсатор, а не котушка.</tspan><tspan x="500.0" dy="15.6">Мессі й Снайдера вело здешевлення конкретного виробу, Ћука з Мідлбруком — пошук найкращої топології;</tspan><tspan x="500.0" dy="15.6">звідси й різні за походженням назви — абревіатура з заголовка доповіді проти прізвища автора.</tspan></text>
</svg>