<rect x="706.0" y="320.0" width="250.0" height="152.0" rx="6" fill="#fbfcfd" stroke="#c8ccd2" stroke-width="1.5"/><text x="831.0" y="358.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="831.0" dy="0.0">ОБЕРНЕНО</tspan><tspan x="831.0" dy="16.9">D = M / (1 + M)</tspan><tspan x="831.0" dy="16.9"></tspan><tspan x="831.0" dy="16.9">M = 1  →  D = 0.50</tspan><tspan x="831.0" dy="16.9">M = 3  →  D = 0.75</tspan><tspan x="831.0" dy="16.9">M = 9  →  D = 0.90</tspan></text>
<rect x="24.0" y="550.0" width="932.0" height="52.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="572.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Крива перетинає одиницю рівно при D = 0.5 — це вісь, довкола якої SEPIC переходить зі зниження на підвищення.</tspan><tspan x="490.0" dy="15.6">Праворуч вона задирається: біля D = 0.9 зсув заповнення на 0.01 додає до виходу цілий Vвх.</tspan></text>
