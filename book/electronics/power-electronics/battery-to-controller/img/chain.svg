<rect x="373.0" y="92.0" width="144.0" height="66.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/><text x="445.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">Регулятор</tspan><tspan x="445.0" dy="18.2">→ 3.3 В</tspan></text>
<rect x="548.0" y="92.0" width="144.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="620.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Контролер</tspan><tspan x="620.0" dy="18.2">3.3 В ±5%</tspan></text>
<line x1="167.0" y1="125.0" x2="198.0" y2="125.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="182.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">енергія</text>
<line x1="342.0" y1="125.0" x2="373.0" y2="125.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="357.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">той самий струм</text>
<line x1="517.0" y1="125.0" x2="548.0" y2="125.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="532.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рівні 3.3 В</text>
<text x="95.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="95.0" dy="0.0">джерело: напруга</tspan><tspan x="95.0" dy="14.3">повзе з розрядом</tspan></text>
<text x="270.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">рве коло за межами</tspan><tspan x="270.0" dy="14.3">безпечного вікна</tspan></text>
<text x="445.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="445.0" dy="0.0">тримає вихід сталим,</tspan><tspan x="445.0" dy="14.3">куди б не пішов вхід</tspan></text>
<text x="620.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">живиться тим, що</tspan><tspan x="620.0" dy="14.3">дав регулятор</tspan></text>
<text x="360.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">напруга вздовж дороги</text>
