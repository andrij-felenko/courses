<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорога від комірки до контролера: чотири ланки</text>
<rect x="23.0" y="92.0" width="144.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="95.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">Комірка</tspan><tspan x="95.0" dy="18.2">3.0–4.2 В</tspan></text>
