<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як АЦП виміряти власне живлення: наївно vs перевернуто</text>
<line x1="360.0" y1="46.0" x2="360.0" y2="280.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="180.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївно: вхід = живлення</text>
<rect x="60.0" y="92.0" width="110.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="115.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">вхід АЦП:</tspan><tspan x="115.0" dy="15.6">живлення</tspan></text>
<rect x="190.0" y="92.0" width="110.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">опорна АЦП:</tspan><tspan x="245.0" dy="15.6">живлення</tspan></text>
<text x="180.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">вхід / опорна = 1</text>
<rect x="50.0" y="182.0" width="260.0" height="74.0" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.4"/><text x="180.0" y="207.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">→ АЦП завжди дає 1023.</tspan><tspan x="180.0" dy="15.6">Шкала пливе разом із входом,</tspan><tspan x="180.0" dy="15.6">тож просідання НЕ ВИДНО. Сліпо.</tspan></text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Перевернуто: вхід = еталон</text>
<rect x="420.0" y="92.0" width="110.0" height="48.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="475.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">вхід АЦП:</tspan><tspan x="475.0" dy="15.6">еталон 1.1 В</tspan></text>
<rect x="550.0" y="92.0" width="110.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">опорна АЦП:</tspan><tspan x="605.0" dy="15.6">живлення</tspan></text>
<text x="540.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1.1 / живлення → змінюється</text>
<rect x="410.0" y="182.0" width="260.0" height="74.0" rx="6" fill="#eefcf3" stroke="#27ae60" stroke-width="1.4"/><text x="540.0" y="207.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">→ еталон нерухомий, живлення</tspan><tspan x="540.0" dy="15.6">рухається — кожен мілівольт</tspan><tspan x="540.0" dy="15.6">просідання ВИДНО в цифрі.</tspan></text>
</svg>