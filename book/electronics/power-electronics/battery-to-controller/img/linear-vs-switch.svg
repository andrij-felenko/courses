<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скинути 4.0 В до 3.3 В: два шляхи</text>
<text x="180.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Лінійний (LDO)</text>
<rect x="50.0" y="96.0" width="60.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="80.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">4.0 В</text>
<circle cx="180.0" cy="113.0" r="20.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="180.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кран</text>
<line x1="110.0" y1="113.0" x2="160.0" y2="113.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="200.0" y1="113.0" x2="250.0" y2="113.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="96.0" width="60.0" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="280.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">3.3 В</text>
<line x1="180.0" y1="93.0" x2="180.0" y2="60.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">0.7 В × I → тепло</text>
<text x="180.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">струм на вході = струм на виході</text>
<rect x="40.0" y="180.0" width="280.0" height="96.0" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.4"/><text x="180.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">ККД ≈ 3.3 / 4.0 ≈ 82%.</tspan><tspan x="180.0" dy="16.9">Просто й тихо, але вся різниця</tspan><tspan x="180.0" dy="16.9">напруг згоряє в теплі.</tspan><tspan x="180.0" dy="16.9">Чим більший розрив вхід–вихід,</tspan><tspan x="180.0" dy="16.9">тим гірше.</tspan></text>
<text x="540.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Імпульсний (buck)</text>
<rect x="410.0" y="96.0" width="60.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="440.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">4.0 В</text>
<text x="512.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle">⇄</text>
<text x="512.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ключ</text>
<text x="558.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">котушка</text>
<line x1="470.0" y1="113.0" x2="496.0" y2="113.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="532.0" y1="113.0" x2="610.0" y2="113.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="610.0" y="96.0" width="60.0" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="640.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">3.3 В</text>
<text x="540.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">менший струм на вході, більший на виході</text>
<rect x="400.0" y="180.0" width="280.0" height="96.0" rx="6" fill="#eefcf3" stroke="#27ae60" stroke-width="1.4"/><text x="540.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ККД 90–96%.</tspan><tspan x="540.0" dy="16.9">Не палить різницю, а перекачує</tspan><tspan x="540.0" dy="16.9">енергію порціями: менше з батареї,</tspan><tspan x="540.0" dy="16.9">більше в навантаження.</tspan><tspan x="540.0" dy="16.9">Ціна — шум і складність.</tspan></text>
<line x1="360.0" y1="44.0" x2="360.0" y2="288.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
</svg>