<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова послідовність переговорів Power Delivery (Source ↔ Sink)</text>
<rect x="184.5" y="50.2" width="131.0" height="39.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Джерело живлення</tspan><tspan x="250.0" dy="15.6">(Source / DFP)</tspan></text>
<rect x="564.5" y="50.2" width="131.0" height="39.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Приймач живлення</tspan><tspan x="630.0" dy="15.6">(Sink / UFP)</tspan></text>
<line x1="250.0" y1="91.0" x2="250.0" y2="480.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="630.0" y1="91.0" x2="630.0" y2="480.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="240.6" y="96.5" width="398.7" height="21.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="440.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">1. З'єднання Type-C (Rd виявлено на CC) → VBUS = 5 В (vSafe5V)</tspan></text>
<line x1="255.0" y1="160.0" x2="625.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Source_Capabilities [PDO1: 5V@3A, PDO2: 9V@3A, PDO3: 20V@3.25A...]</text>
<rect x="693.7" y="192.0" width="112.6" height="46.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="750.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Аналіз списку PDO:</tspan><tspan x="750.0" dy="13.0">вибір найкращого</tspan><tspan x="750.0" dy="13.0">профілю (ККД, I²R)</tspan></text>
<line x1="625.0" y1="225.0" x2="255.0" y2="225.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Request [Pos=3 (20V), OperI=3.0A, MaxI=3.25A, GiveBack=0]</text>
<line x1="255.0" y1="285.0" x2="625.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Accept (запит на 20 В схвалено джерелом)</text>
<rect x="68.0" y="322.0" width="124.0" height="46.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Плавне підняття VBUS</tspan><tspan x="130.0" dy="13.0">(30–150 мВ/мкс):</tspan><tspan x="130.0" dy="13.0">5 В → 20 В</tspan></text>
<rect x="676.6" y="322.0" width="146.8" height="46.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Ключ VBUS розімкнено</tspan><tspan x="750.0" dy="13.0">(навантаження відсічене,</tspan><tspan x="750.0" dy="13.0">струм &lt; 2.5 Вт)</tspan></text>
<line x1="255.0" y1="405.0" x2="625.0" y2="405.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PS_RDY (Power Supply Ready: 20 В стабілізовано)</text>
<rect x="672.4" y="441.4" width="155.2" height="37.3" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="456.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Замикання ключа VBUS</tspan><tspan x="750.0" dy="14.3">(живлення схеми 20 В)</tspan></text>
<rect x="48.1" y="437.0" width="163.9" height="46.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="450.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Альтернативні відповіді:</tspan><tspan x="130.0" dy="13.0">• Reject (профіль зайнятий)</tspan><tspan x="130.0" dy="13.0">• Wait (джерело балансує)</tspan></text>
</svg>