<rect x="68.6" y="373.5" width="682.9" height="23.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.2"/><text x="410.0" y="388.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">У насосних системах раптове вимкнення спричиняє закриття зворотного клапана й руйнівний гідроудар у трубах.</tspan></text>
<rect x="88.4" y="404.5" width="643.3" height="21.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="410.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Режим Soft Stop поступово знижує напругу, сповільнюючи водяний стовп без гідравлічних сплесків тиску.</tspan></text>
