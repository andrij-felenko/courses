<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель складалася поетапно — і не однією людиною</text>
<line x1="60.0" y1="120.0" x2="700.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="696.0" y1="120.0" x2="710.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="708.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<circle cx="150.0" cy="120.0" r="6.0" fill="#8a6d0b" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="150.0" y1="120.0" x2="150.0" y2="86.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6d0b" text-anchor="middle" font-weight="700">1899</text>
<text x="150.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Е. Варбург</tspan></text>
<text x="150.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">дифузійний елемент</tspan><tspan x="150.0" dy="13.7">(45°) — з рівняння</tspan><tspan x="150.0" dy="13.7">дифузії, ще до</tspan><tspan x="150.0" dy="13.7">теорії кінетики</tspan></text>
<circle cx="330.0" cy="120.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="330.0" y1="120.0" x2="330.0" y2="86.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="330.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1940</text>
<text x="330.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Долін · Ершлер</tspan><tspan x="330.0" dy="14.3">· Фрумкін (СРСР)</tspan></text>
<text x="330.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="330.0" dy="0.0">та сама схема</tspan><tspan x="330.0" dy="13.7">Rs · Cdl · Rct+W —</tspan><tspan x="330.0" dy="13.7">війна поховала</tspan><tspan x="330.0" dy="13.7">роботу на Заході</tspan></text>
<circle cx="470.0" cy="120.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="470.0" y1="120.0" x2="470.0" y2="86.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="470.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1947</text>
<text x="470.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Дж. Рендлс</tspan><tspan x="470.0" dy="14.3">(Британія)</tspan></text>
<text x="470.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">схема під кінетику</tspan><tspan x="470.0" dy="13.7">швидких реакцій;</tspan><tspan x="470.0" dy="13.7">звідси й ім'я</tspan></text>
<circle cx="630.0" cy="120.0" r="6.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="630.0" y1="120.0" x2="630.0" y2="86.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="630.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">сьогодні</text>
<text x="630.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">EIS</tspan></text>
<text x="630.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="630.0" dy="0.0">діагностика й</tspan><tspan x="630.0" dy="13.7">сортування</tspan><tspan x="630.0" dy="13.7">батарей: Rs, Rct,</tspan><tspan x="630.0" dy="13.7">дифузія окремо</tspan></text>
<line x1="330.0" y1="300.0" x2="470.0" y2="300.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="330.0" y1="300.0" x2="330.0" y2="292.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="470.0" y1="300.0" x2="470.0" y2="292.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="400.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">незалежно → строго «схема Рендлса–Ершлера»</text>
</svg>