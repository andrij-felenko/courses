<rect x="570.0" y="105.0" width="130.0" height="90.0" rx="6" fill="#f7cfc8" stroke="#c0392b" stroke-width="1.5"/><text x="635.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a1f13" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">підпалює</tspan><tspan x="635.0" dy="15.6">сусідні</tspan><tspan x="635.0" dy="15.6">комірки</tspan></text>
