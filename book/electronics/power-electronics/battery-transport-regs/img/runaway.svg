<rect x="110.0" y="228.0" width="500.0" height="54.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Халон гасить, перериваючи горіння киснем ззовні.</tspan><tspan x="360.0" dy="16.9">Тут кисень народжується ВСЕРЕДИНІ — гасити нема чого перервати.</tspan></text>
