<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево рішень щодо вибору архітектури регулятора напруги</text>
<rect x="131.9" y="33.5" width="576.1" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="54.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Визначення діапазону вхідної напруги: V_in_min...V_in_max проти V_out</tspan></text>
<line x1="240.0" y1="70.0" x2="160.0" y2="120.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420.0" y1="70.0" x2="420.0" y2="120.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="600.0" y1="70.0" x2="680.0" y2="120.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="175.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_in &gt; V_out</text>
<text x="485.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">V_in ≈ V_out</text>
<text x="665.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_in &lt; V_out</text>
<rect x="49.7" y="122.3" width="220.6" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Пониження напруги</tspan><tspan x="160.0" dy="14.3">(V_in − V_out) та профіль струму</tspan></text>
<rect x="294.0" y="122.3" width="252.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Діапазон перекриття</tspan><tspan x="420.0" dy="14.3">(наприклад Li-ion 3.0..4.2 В → 3.3 В)</tspan></text>
<rect x="560.3" y="122.3" width="239.4" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Підвищення напруги</tspan><tspan x="680.0" dy="14.3">(наприклад 1.5 В батарейка → 3.3 В)</tspan></text>
<line x1="110.0" y1="172.0" x2="85.0" y2="235.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="210.0" y1="172.0" x2="235.0" y2="235.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="27.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Малий ΔV / Сон 99%</text>
<text x="215.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">Великий ΔV / Струм &gt;50 мА</text>
<rect x="20.0" y="240.0" width="170.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="105.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">LDO (лінійний)</tspan><tspan x="105.0" dy="11.7">• Наднизький Iq (0.5..2 мкА)</tspan><tspan x="105.0" dy="11.7">• Чисте живлення без шуму</tspan><tspan x="105.0" dy="11.7">• Простий і компактний</tspan><tspan x="105.0" dy="11.7">• Втрати: (Vin−Vout)·I</tspan></text>
<rect x="210.0" y="240.0" width="170.0" height="115.0" rx="6" fill="#e8f4f8" stroke="#2457d6" stroke-width="1.5"/><text x="295.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Buck (Step-Down)</tspan><tspan x="295.0" dy="13.0">• Високий ККД (до 95%)</tspan><tspan x="295.0" dy="13.0">• Обов'язковий PFM для сну</tspan><tspan x="295.0" dy="13.0">• Потребує L + C фільтр</tspan><tspan x="295.0" dy="13.0">• Пульсації комутації</tspan></text>
<line x1="420.0" y1="172.0" x2="420.0" y2="235.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="400.0" y="240.0" width="190.0" height="115.0" rx="6" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.5"/><text x="495.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">4-Switch Buck-Boost</tspan><tspan x="495.0" dy="13.0">• Стабільні 3.3 В весь розряд</tspan><tspan x="495.0" dy="13.0">• 4 MOSFET-ключі</tspan><tspan x="495.0" dy="13.0">• Складніше керування</tspan><tspan x="495.0" dy="13.0">• Альтернатива: Buck + LDO</tspan></text>
<line x1="680.0" y1="172.0" x2="680.0" y2="235.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="610.0" y="240.0" width="210.0" height="115.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Boost (Step-Up)</tspan><tspan x="715.0" dy="13.0">• Працює до повного розряду</tspan><tspan x="715.0" dy="13.0">• Піковий струм ключа Iout/(1−D)</tspan><tspan x="715.0" dy="13.0">• Струм к.з. через індуктивність</tspan><tspan x="715.0" dy="13.0">• True-Shutdown розмикання</tspan></text>
<rect x="20.0" y="375.0" width="800.0" height="100.0" rx="6" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="420.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерії компромісу в системному бюджеті:</text>
<text x="420.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1. Співвідношення часу Сон / Активність (Duty Cycle)  —  2. Допустимий рівень пульсацій живлення АЦП/радіо</text>
<text x="420.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">3. Тепловий бюджет кристала (P_loss · θ_JA)  —  4. Габарити друкованої плати та вартість компонентів</text>
</svg>