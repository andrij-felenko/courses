<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два кінці одного десятиліття: Місяць і кишеня</text>
<rect x="55.0" y="74.0" width="330.0" height="252.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="220.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Місяць: GaAs</text>
<text x="81.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="81.0" dy="0.0">• кіловати на орбіту</tspan><tspan x="81.0" dy="21.0">• виживає в радіації</tspan><tspan x="81.0" dy="21.0">• «Луноход» 1970-73</tspan><tspan x="81.0" dy="21.0">• станція «Мир» 1986</tspan><tspan x="81.0" dy="21.0">• ціна — байдужа</tspan></text>
<rect x="455.0" y="74.0" width="330.0" height="252.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="620.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Кишеня: аморфний Si</text>
<text x="481.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="481.0" dy="0.0">• мілівати в руці</tspan><tspan x="481.0" dy="21.0">• живе на слабкому світлі</tspan><tspan x="481.0" dy="21.0">• Sanyo «Amorton» ~1980</tspan><tspan x="481.0" dy="21.0">• калькулятори, годинники</tspan><tspan x="481.0" dy="21.0">• важить лише дешевизна</tspan></text>
<text x="420.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">проти</text>
<text x="420.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">різна нестача  →  діаметрально різний матеріал</text>
</svg>