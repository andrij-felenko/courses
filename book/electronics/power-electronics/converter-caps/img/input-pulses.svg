<text x="74.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">I</text>
<text x="720.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<line x1="90.0" y1="210.0" x2="720.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6,4"/>
