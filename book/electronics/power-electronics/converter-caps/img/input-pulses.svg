<text x="405.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">повний струм біжить імпульсами; різницю до середнього віддає кондер</text>
<rect x="265.3" y="338.1" width="279.3" height="83.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="405.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">вхідний кондер несе RMS-струм</tspan><tspan x="405.0" dy="16.9">Iвх(rms) = Iнаван·√(D(1−D))</tspan><tspan x="405.0" dy="16.9">максимум при D = 0.5  →  0.5·Iнаван</tspan><tspan x="405.0" dy="16.9">і цей струм гріє його через ESR</tspan></text>
