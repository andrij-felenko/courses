<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типи конденсаторів: сильна й слабка сторона кожного</text>
<rect x="60.0" y="70.0" width="700.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<text x="80.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Кераміка (MLCC)</text>
<text x="300.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">+  крихітний ESR і розмір, дешева</text>
<text x="300.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">−  просідає під напругою (DC-bias)</text>
<rect x="60.0" y="148.0" width="700.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="80.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Полімерний</text>
<text x="300.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">+  малий стабільний ESR, не висихає</text>
<text x="300.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">−  дорожчий</text>
<rect x="60.0" y="226.0" width="700.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="80.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Електроліт</text>
<text x="300.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">+  велика ємність дешево</text>
<text x="300.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">−  великий ESR, старіння, висихання</text>
<rect x="60.0" y="304.0" width="700.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="80.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Тантал</text>
<text x="300.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">+  компактний за ємністю</text>
<text x="300.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">−  горить при перенапрузі — запас</text>
<text x="410.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">часто комбінують: об'ємний (електроліт/полімер) + кераміка поряд</text>
</svg>