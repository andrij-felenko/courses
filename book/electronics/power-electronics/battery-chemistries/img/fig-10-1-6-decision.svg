<text x="125.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↓</text>
<text x="125.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дрон, носиме, мобільне</text>
<text x="125.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(ціна — захист, обережність)</text>
<rect x="285.0" y="70.0" width="150.0" height="250.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="360.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Довге життя</text>
<text x="360.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">й безпека</text>
<line x1="303.0" y1="138.0" x2="417.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="360.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">LiFePO4</text>
<text x="360.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">↓</text>
<text x="360.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стаціонар, сонце, робот</text>
<text x="360.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(пласка крива — SoC важче)</text>
<rect x="520.0" y="70.0" width="150.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="595.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дешево, безпечно,</text>
<text x="595.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">готові «пальчики»</text>
<line x1="538.0" y1="138.0" x2="652.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="595.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">NiMH</text>
<text x="595.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">↓</text>
<text x="595.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">прості пристрої, іграшки</text>
<text x="595.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(мала енергія, 1.2 В)</text>
<rect x="755.0" y="70.0" width="150.0" height="250.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="830.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дешева енергія</text>
<text x="830.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+ пусковий струм</text>
<line x1="773.0" y1="138.0" x2="887.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="830.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Свинець</text>
<text x="830.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">↓</text>
<text x="830.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">авто, ДБЖ, стаціонар</text>
<text x="830.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(важко; боїться розряду)</text>
<rect x="70.0" y="366.0" width="800.0" height="32.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Немає «найкращої» хімії — є найкраща під задачу. Зважують чотири осі: енергія на вагу, цикли (ціна за весь термін), безпека й температура.</text>
<text x="470.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">А далі в розділі — як саме заряджати обрану хімію, чесно оцінювати її залишок і захищати від відмов.</text>
</svg>
