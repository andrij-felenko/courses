<text x="125.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">мінімум ваги</text>
<line x1="68.0" y1="138.0" x2="182.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
