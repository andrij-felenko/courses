<rect x="618.2" y="122.5" width="123.6" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">N-MOSFET</tspan><tspan x="680.0" dy="13.0">R_ds(on) = 1.5 мОм</tspan></text>
