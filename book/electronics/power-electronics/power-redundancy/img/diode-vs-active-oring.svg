<rect x="90.2" y="211.6" width="289.6" height="116.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="230.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Втрати потужності на діоді:</tspan><tspan x="235.0" dy="14.3">P_loss = I · V_F = 40 A · 0.45 В = 18.0 Вт</tspan><tspan x="235.0" dy="14.3"></tspan><tspan x="235.0" dy="14.3">Наслідки:</tspan><tspan x="235.0" dy="14.3">• Величезний масивний радіатор</tspan><tspan x="235.0" dy="14.3">• Ризик теплового розгону (струм витоку I_R</tspan><tspan x="235.0" dy="14.3">  експоненційно зростає з температурою)</tspan></text>
<text x="705.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Активний Active ORing (N-MOSFET)</text>
