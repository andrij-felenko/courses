<rect x="547.7" y="246.6" width="314.7" height="116.8" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Втрати потужності на MOSFET:</tspan><tspan x="705.0" dy="14.3">P_loss = I² · R_ds(on) = 40² · 0.0015 = 2.4 Вт</tspan><tspan x="705.0" dy="14.3"></tspan><tspan x="705.0" dy="14.3">Переваги:</tspan><tspan x="705.0" dy="14.3">• Економія 15.6 Вт тепла на кожен канал!</tspan><tspan x="705.0" dy="14.3">• Падіння напруги всього 60 мВ проти 450 мВ</tspan><tspan x="705.0" dy="14.3">• Швидке блокування зворотного струму (&lt;200 нс)</tspan></text>
