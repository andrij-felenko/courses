<rect x="93.1" y="327.5" width="283.9" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Принцип: штучний опір R_droop = ΔV / ΔI.</tspan><tspan x="235.0" dy="13.0">• Плюси: немає ліній зв'язку між блоками.</tspan><tspan x="235.0" dy="13.0">• Мінуси: напруга шини падає під навантаженням;</tspan><tspan x="235.0" dy="13.0">  похибка розподілу залежить від різниці V_ref.</tspan></text>
