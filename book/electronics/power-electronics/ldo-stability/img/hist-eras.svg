<line x1="635.0" y1="327.0" x2="637.5" y2="327.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="830.0" y="278.0" width="190.0" height="98.0" rx="7" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="925.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">2006</text><text x="925.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">TI AN-1482: «ceramic-</tspan><tspan x="925.0" dy="16.2">stable» стає нормою</tspan></text>
<line x1="827.5" y1="327.0" x2="830.0" y2="327.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="540.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Обидві ери починаються не з ідеї схемотехніка, а з того, що стало дешево лежати на складі.</text>
