<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Полюс виходу LDO їде з навантаженням</text>
<line x1="90.0" y1="200.0" x2="840.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="840.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-style="italic">частота (лог)</text>
<line x1="130.0" y1="108.0" x2="750.0" y2="108.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">росте струм навантаження  →  полюс виходу їде вправо</text>
<line x1="195.0" y1="192.0" x2="195.0" y2="208.0" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="195.0" cy="200.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="195.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">легке</text>
<text x="195.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">1 мА</text>
<text x="195.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">≈ 48 Гц</text>
<line x1="390.0" y1="192.0" x2="390.0" y2="208.0" stroke="#b8860b" stroke-width="2.0"/>
<circle cx="390.0" cy="200.0" r="6.0" fill="#b8860b" stroke="#b8860b" stroke-width="1.5"/>
<text x="390.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">середнє</text>
<text x="390.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle">50 мА</text>
<text x="390.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">≈ 2.4 кГц</text>
<line x1="585.0" y1="192.0" x2="585.0" y2="208.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="585.0" cy="200.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="585.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">важке</text>
<text x="585.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">0.5 А</text>
<text x="585.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 24 кГц</text>
<line x1="690.0" y1="192.0" x2="690.0" y2="208.0" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="690.0" cy="200.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">полюс підсил.</text>
<text x="690.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">майже сталий</text>
<rect x="120.2" y="272.0" width="689.6" height="32.0" rx="6" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/><text x="465.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">Стійкий на одному струмі — може дзвеніти на іншому: перевіряй увесь діапазон навантаження.</tspan></text>
</svg>