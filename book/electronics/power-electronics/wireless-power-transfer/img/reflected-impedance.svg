<rect x="79.7" y="262.2" width="310.7" height="55.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Вторинний контур має власний повний імпеданс:</tspan><tspan x="235.0" dy="14.3">Z₂ = R₂ + R_нав + j·(ωL₂ − 1/(ωC₂))</tspan><tspan x="235.0" dy="14.3">На резонансі ω₀: Im(Z₂) = 0  ⇒  Z₂ = R₂ + R_нав</tspan></text>
