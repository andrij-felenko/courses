<rect x="510.7" y="228.8" width="358.6" height="102.5" rx="6" fill="#fefde8" stroke="#f1c40f" stroke-width="1.5"/><text x="690.0" y="248.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Z_відб = (ω·M)² / Z₂</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">Якщо вторинний контур у чистому резонансі:</tspan><tspan x="690.0" dy="14.3">Z_відб = (ω·M)² / (R₂ + R_нав)   [суто активний опір!]</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">Зміна R_нав або M миттєво змінює струм первинної L₁!</tspan></text>
