<rect x="550.0" y="160.0" width="290.0" height="260.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="695.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Золоті правила PCB:</tspan><tspan x="695.0" dy="14.3">1. 4-провідне підключення Кельвіна</tspan><tspan x="695.0" dy="14.3">(безпосередньо на контактні майданчики).</tspan><tspan x="695.0" dy="14.3">2. Трасування диференційною парою</tspan><tspan x="695.0" dy="14.3">на внутрішньому шарі між двома GND.</tspan><tspan x="695.0" dy="14.3">3. R_s та C_s ставлять біля ніжок чипа,</tspan><tspan x="695.0" dy="14.3">а не біля галасливої котушки!</tspan><tspan x="695.0" dy="14.3">4. NTC монтують упритул до корпусу</tspan><tspan x="695.0" dy="14.3">найгарячішої фази.</tspan></text>
