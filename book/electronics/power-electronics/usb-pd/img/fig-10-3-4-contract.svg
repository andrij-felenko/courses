  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Контракт PD: до згоди — лише 5 В</text>
<rect x="60.0" y="80.0" width="360.0" height="200.0" rx="12" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.8"/>
<text x="240.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ДО контракту</text>
<text x="240.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на VBUS — лише безпечні 5 В</text>
<text x="240.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(хоч би що могло джерело)</text>
<text x="240.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">5 В</text>
<text x="240.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пристрій ще не просив більше</text>
<line x1="430.0" y1="180.0" x2="480.0" y2="180.0" stroke="#1f8a3b" stroke-width="2.6" marker-end="url(#aGreen)"/>
<text x="455.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">запит+згода</text>
<rect x="490.0" y="80.0" width="360.0" height="200.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="670.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПІСЛЯ контракту</text>
<text x="670.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">узгоджені напруга + макс. струм</text>
<text x="670.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">напр. 20 В · 5 А</text>
<text x="670.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">можна переукласти будь-коли</text>
<rect x="70.0" y="320.0" width="740.0" height="28.0" rx="8" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.5"/>
<text x="440.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Це і є вбудована безпека: висока напруга з'являється ЛИШЕ після того, як пристрій явно її попросив</text>
<text x="440.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і джерело погодилося. Інакше дешевий 5-вольтовий пристрій згорів би від 20 В «про всяк випадок».</text>
