<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому ключів два: діод тіла й зустрічне ввімкнення</text>
<text x="380.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">у нормі обидва ключі відкриті — струм тече в обидва боки вільно</text>
<rect x="266.0" y="104.0" width="68.0" height="52.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.8"/><text x="300.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a07a20" text-anchor="middle" font-weight="700">ключ</text><text x="300.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a07a20" text-anchor="middle">розряду</text><path d="M291.0,162.0 L291.0,178.0 L309.0,170.0 Z" fill="none" stroke="#6b7280" stroke-width="1.6"/><line x1="309.0" y1="162.0" x2="309.0" y2="178.0" stroke="#6b7280" stroke-width="1.6"/><text x="300.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">діод ↦</text>
<rect x="426.0" y="104.0" width="68.0" height="52.0" rx="6" fill="#fff7e6" stroke="#caa24a" stroke-width="1.8"/><text x="460.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a07a20" text-anchor="middle" font-weight="700">ключ</text><text x="460.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a07a20" text-anchor="middle">заряду</text><path d="M469.0,162.0 L469.0,178.0 L451.0,170.0 Z" fill="none" stroke="#6b7280" stroke-width="1.6"/><line x1="451.0" y1="162.0" x2="451.0" y2="178.0" stroke="#6b7280" stroke-width="1.6"/><text x="460.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">діод ↤</text>
<line x1="210.0" y1="130.0" x2="266.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="334.0" y1="130.0" x2="426.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="494.0" y1="130.0" x2="560.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="200.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">комірка</text>
<text x="570.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">вихід</text>
<rect x="120.0" y="210.0" width="520.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="380.0" y="242.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Один ключ не перекриває коло: закритий, він блокує струм лише в один бік,</tspan><tspan x="380.0" dy="13.0">а назад струм проходить крізь власний діод тіла (body diode) — наче ключа нема.</tspan><tspan x="380.0" dy="13.0">Розв'язок: два ключі «спина до спини», їхні діоди дивляться НАЗУСТРІЧ.</tspan><tspan x="380.0" dy="13.0">Закрив ключ розряду → його діод блокує розряд; закрив ключ заряду → блокує заряд.</tspan><tspan x="380.0" dy="13.0">Тому окремий ключ на кожен напрямок: заряд і розряд рубаються незалежно.</tspan></text>
</svg>