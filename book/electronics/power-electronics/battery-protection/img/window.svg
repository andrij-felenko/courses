<rect x="342.0" y="80.0" width="460.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="572.0" y="99.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="572.0" dy="0.0">ВИЩЕ: літій осідає металом на аноді (плакування),</tspan><tspan x="572.0" dy="11.7">газ і розклад електроліту — незворотно, аж до дендритів</tspan></text>
