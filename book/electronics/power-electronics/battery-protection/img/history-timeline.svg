<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три хвилі, якими приборкали норов літію</text>
<rect x="30.0" y="74.0" width="236.0" height="152.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="148.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">1989 — металевий літій ГОРИТЬ</tspan><tspan x="148.0" dy="14.3">Moli Energy / NTT: телефон на</tspan><tspan x="148.0" dy="14.3">комірці Molicel загорівся,</tspan><tspan x="148.0" dy="14.3">≈10 000 апаратів відкликано.</tspan><tspan x="148.0" dy="14.3">Дендрити металу колють</tspan><tspan x="148.0" dy="14.3">сепаратор → коротке → вогонь.</tspan></text>
<rect x="288.0" y="74.0" width="236.0" height="152.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="406.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="406.0" dy="0.0">1991 — Sony: вуглецевий анод</tspan><tspan x="406.0" dy="14.3">прибирає МЕТАЛ. Літій сидить</tspan><tspan x="406.0" dy="14.3">усередині графіту як іон —</tspan><tspan x="406.0" dy="14.3">звідси «літій-іонна». Небезпека</tspan><tspan x="406.0" dy="14.3">щезає в РОБОЧОМУ вікні, та</tspan><tspan x="406.0" dy="14.3">лишається на його краях.</tspan></text>
<rect x="546.0" y="74.0" width="236.0" height="152.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="664.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="664.0" dy="0.0">1993–1995 — захисна МІКРОСХЕМА</tspan><tspan x="664.0" dy="14.3">(Seiko Instruments; Ricoh RS5VG).</tspan><tspan x="664.0" dy="14.3">Аналоговий автономний сторож</tspan><tspan x="664.0" dy="14.3">стереже краї вікна: перезаряд,</tspan><tspan x="664.0" dy="14.3">переглибокий розряд, надструм —</tspan><tspan x="664.0" dy="14.3">живиться від самої комірки.</tspan></text>
<line x1="268.0" y1="150.0" x2="286.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="526.0" y1="150.0" x2="544.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="277.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">змінити хімію</text>
<text x="535.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">додати сторожа</text>
<rect x="30.0" y="238.0" width="752.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="406.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="406.0" dy="0.0">Літій прибрав хімічний запобіжник нікелевих акумуляторів (кисневу рекомбінацію) — і його роль</tspan><tspan x="406.0" dy="13.0">довелося відбудувати заново, з кремнію та двох зустрічних ключів, при кожній комірці.</tspan></text>
</svg>