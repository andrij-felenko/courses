<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ШІМ-димінг boost-драйвера: котушка не встигає за коротким імпульсом</text>
<text x="62.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">EN (ШІМ)</text>
<line x1="70.0" y1="90.0" x2="690.0" y2="90.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="110.0" y1="90.0" x2="110.0" y2="64.0" stroke="#2457d6" stroke-width="2.0"/>
