<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
<rect width="940" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Падіння на дроті: 5 В виходять, 4.2 В доходять</text>
<rect x="60.0" y="110.0" width="130.0" height="80.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="125.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">зарядка</text>
<text x="125.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">5.0 В</text>
<line x1="190.0" y1="135.0" x2="740.0" y2="135.0" stroke="#b5763a" stroke-width="3" stroke-linecap="round"/>
<line x1="190.0" y1="165.0" x2="740.0" y2="165.0" stroke="#b5763a" stroke-width="3" stroke-linecap="round"/>
<rect x="420.0" y="116.0" width="70.0" height="36.0" rx="4" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="455.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">R кабелю</text>
<text x="455.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">R = 2×Rдроту + Rконтактів</text>
<line x1="290.0" y1="150.0" x2="350.0" y2="150.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="320.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I →</text>
<rect x="740.0" y="110.0" width="140.0" height="80.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="810.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій</text>
<text x="810.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">4.2 В</text>
<rect x="120.0" y="240.0" width="700.0" height="112.0" rx="12" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="460.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ΔV = I × R   (закон Ома, §1.3)</text>
<text x="460.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тонкий/довгий шнур при 3 А: ΔV ≈ 0.8 В → на пристрої 4.2 В (заряд гальмує)</text>
<text x="460.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">та сама потужність вищою напругою (PD 9 В): струм менший → і падіння менше</text>
<text x="460.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ось чому PD воліє підняти напругу, а не струм (теми 10.3.3–4)</text>
<rect x="70.0" y="386.0" width="800.0" height="22.0" rx="8" fill="#fff7e6" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Половину «не заряджає» в полі дає саме падіння на дешевому тонкому шнурі — деталь розрахунку у 🧮-вставці про падіння на кабелі</text>
</svg>
