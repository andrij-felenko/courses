<rect x="560.0" y="150.0" width="372.0" height="180.0" rx="6" fill="#f6f9fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="746.0" y="176.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">Чому саме boost:</tspan><tspan x="746.0" dy="15.0">• котушка стоїть на ВХОДІ →</tspan><tspan x="746.0" dy="15.0">   вхідний струм безперервний,</tspan><tspan x="746.0" dy="15.0">   його легко тримати синусоїдним;</tspan><tspan x="746.0" dy="15.0">• шина 400 В вища за пік мережі</tspan><tspan x="746.0" dy="15.0">   (~375 В), а boost тільки й уміє,</tspan><tspan x="746.0" dy="15.0">   що ПІДВИЩУВАТИ — це якраз те;</tspan><tspan x="746.0" dy="15.0">• buck не дотягне до 400 В,</tspan><tspan x="746.0" dy="15.0">   buck-boost рве вхідний струм</tspan><tspan x="746.0" dy="15.0">   і напружує ключ на Vвх+Vвих.</tspan></text>
</svg>