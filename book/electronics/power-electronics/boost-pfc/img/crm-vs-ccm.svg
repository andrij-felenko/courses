<rect x="70.0" y="396.0" width="820.0" height="58.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="416.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">CrM: кожен такт стартує, щойно струм спав до нуля; середнє саме лягає на синусоїду — контролер простий, окремо мірити струм не конче.</tspan><tspan x="480.0" dy="11.1">Але трикутник удвічі вищий за своє середнє (пік = 2× avg), тож пікові й діючі струми високі, а частота гуляє в такт мережі — важче фільтрувати завади.</tspan><tspan x="480.0" dy="11.1">CCM: струм лише злегка колишеться, пік/RMS низькі, частота стала — але середнє САМО на синусоїду не ляже, тож потрібна активна струмова петля.</tspan></text>
</svg>