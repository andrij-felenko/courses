<rect x="70.0" y="372.0" width="780.0" height="46.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="391.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">ΔV (розмах) = P_вих/(ω·C·V_шини): обернено пропорційний ємності — подвоїш C, удвічі менша пульсація.</tspan><tspan x="460.0" dy="13.7">Завжди на подвоєній частоті мережі й зсунута на чверть періоду відносно пульсації потужності (напруга — інтеграл струму).</tspan></text>
