<text x="370.7" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Vmp × Imp = реальна P</text>
<rect x="70.0" y="376.0" width="760.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">MPP лежить трохи нижче Voc і трохи нижче Isc — у точці (Vmp, Imp). Її прямокутник Vmp×Imp і є реальна максимальна потужність.</text>
<text x="450.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Наскільки він заповнює ідеальний Voc×Isc — це «коефіцієнт заповнення» (fill factor): що крива «квадратніша», то він ближчий до 1.</text>
