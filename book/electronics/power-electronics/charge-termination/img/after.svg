<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Після «повної»: літій зупиняють, Ni/Pb підживлюють</text>
<rect x="60.0" y="60.0" width="320.0" height="262.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Li-ion / LiFePO4</text>
<text x="78.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="78.0" dy="0.0">струм у CV впав &lt; C/10 → СТОП</tspan></text>
<text x="78.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="78.0" dy="0.0">далі струм НЕ подаємо взагалі</tspan></text>
<text x="78.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="78.0" dy="0.0">напруга сама просіла від</tspan><tspan x="78.0" dy="15.0">саморозряду?</tspan></text>
<text x="78.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="78.0" dy="0.0">→ перезапустити цикл наново</tspan><tspan x="78.0" dy="15.0">(top-off), а не «доливати»</tspan></text>
<text x="220.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">тримати повну під напругою = старіння/осідання</text>
<rect x="400.0" y="60.0" width="320.0" height="262.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="560.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">NiMH / NiCd / свинець</text>
<text x="418.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="418.0" dy="0.0">спіймали кінець (−ΔV/dT/dt/float)</tspan></text>
<text x="418.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="418.0" dy="0.0">переходимо на МАЛИЙ підзаряд</tspan></text>
<text x="418.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="418.0" dy="0.0">trickle (Ni) / float (Pb):</tspan><tspan x="418.0" dy="15.0">тече весь час</tspan></text>
<text x="418.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="418.0" dy="0.0">компенсує саморозряд —</tspan><tspan x="418.0" dy="15.0">для цих хімій це нормально</tspan></text>
<text x="560.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">той самий підзаряд у літії = пошкодження</text>
</svg>