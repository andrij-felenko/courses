<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">−ΔV і dT/dt — дві грані однієї події в мить повноти</text>
<rect x="230.0" y="70.0" width="360.0" height="52.0" rx="8" fill="#fff6e6" stroke="#b9770e" stroke-width="1.8"/>
<text x="410.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">комірка повна → надлишок струму йде не в реакцію,</tspan></text>
<text x="410.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">а на кисень, що рекомбінує на аноді (ЕКЗОТЕРМІЧНО)</tspan></text>
<line x1="410.0" y1="122.0" x2="410.0" y2="164.0" stroke="#b9770e" stroke-width="1.8"/>
<rect x="318.2" y="172.0" width="183.7" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">комірка різко гріється</tspan></text>
<line x1="318.2" y1="188.0" x2="300.0" y2="266.0" stroke="#c0392b" stroke-width="2.2"/>
<rect x="208.0" y="276.8" width="184.0" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">dT/dt угору</tspan><tspan x="300.0" dy="15.0">(ПРЯМИЙ наслідок тепла)</tspan></text>
<text x="300.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">сильний, чіткий сигнал</text>
<line x1="501.8" y1="188.0" x2="520.0" y2="266.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="524.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="524.0" dy="0.0">ЕРС має ВІД'ЄМНИЙ</tspan><tspan x="524.0" dy="13.0">темп. коефіцієнт</tspan></text>
<rect x="442.3" y="276.8" width="155.5" height="46.5" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">−ΔV: напруга осідає</tspan><tspan x="520.0" dy="15.0">(ПОБІЧНИЙ наслідок)</tspan></text>
<text x="520.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">слабкий на NiMH — губиться</text>
<rect x="112.7" y="356.8" width="594.6" height="30.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="375.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">тепло первинне; напруга падає лише як його тінь — тому dT/dt переживає перехід на NiMH, а −ΔV ні</tspan></text>
</svg>