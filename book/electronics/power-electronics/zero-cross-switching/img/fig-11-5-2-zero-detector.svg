<text x="400.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Оптопара на змінному вході спалахує двічі за період — рівно в переходах нуля. Ці імпульси дають МК точку відліку для фази й синхронну комутацію.</text>
