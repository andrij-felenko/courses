<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли контракту не дали: дерево безпечних відкатів</text>
<rect x="250.0" y="44.0" width="220.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="360.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Просимо свій профіль</tspan><tspan x="360.0" dy="14.3">(напр. 12 В)</tspan></text>
<rect x="455.0" y="154.0" width="230.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="570.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Контракт дано</tspan><tspan x="570.0" dy="14.3">→ вмикаємо навантаження</tspan></text>
<line x1="360.0" y1="96.0" x2="570.0" y2="154.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="495.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<rect x="25.0" y="154.0" width="250.0" height="52.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Запасний профіль</tspan><tspan x="150.0" dy="14.3">(9 чи 15 В) — працюємо обмежено</tspan></text>
<line x1="360.0" y1="96.0" x2="150.0" y2="154.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="225.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ні</text>
<rect x="25.0" y="264.0" width="250.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="150.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Нема й того →</tspan><tspan x="150.0" dy="14.3">лишаємось на 5 В,</tspan><tspan x="150.0" dy="14.3">навантаження ВИМКНЕНЕ</tspan></text>
<line x1="150.0" y1="206.0" x2="150.0" y2="262.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">теж ні</text>
<text x="360.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">залізне правило: живлення на навантаження — ЛИШЕ за дійсним контрактом (power-good)</text>
</svg>