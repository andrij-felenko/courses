<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дає розум: МК міняє контракт PD за умовами на ходу</text>
<rect x="105.0" y="93.5" width="90.0" height="33.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/><text x="150.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">МК</tspan></text>
<rect x="80.0" y="204.5" width="140.0" height="31.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">PD-контролер</tspan></text>
<line x1="150.0" y1="134.0" x2="150.0" y2="196.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">I²C</text>
<text x="150.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">читає меню,
командує профілем</text>
<rect x="330.0" y="86.0" width="380.0" height="48.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">холодно, треба швидко</tspan><tspan x="520.0" dy="14.3">→ 20 В, максимум потужності</tspan></text>
<line x1="195.0" y1="110.0" x2="328.0" y2="110.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="330.0" y="151.0" width="380.0" height="48.0" rx="6" fill="#fafafa" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">вузол перегрівся</tspan><tspan x="520.0" dy="14.3">→ 15 В, менше гріти перетворювач</tspan></text>
<line x1="195.0" y1="110.0" x2="328.0" y2="175.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="330.0" y="216.0" width="380.0" height="48.0" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">заряджає батарею</tspan><tspan x="520.0" dy="14.3">→ APDO/PPS, веде напругу за коміркою</tspan></text>
<line x1="195.0" y1="110.0" x2="328.0" y2="240.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="330.0" y="281.0" width="380.0" height="48.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">споживання впало</tspan><tspan x="520.0" dy="14.3">→ перепогоджує дрібніший контракт</tspan></text>
<line x1="195.0" y1="110.0" x2="328.0" y2="305.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>