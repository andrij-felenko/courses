<text x="400.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Напрямок — діагоналлю, швидкість — ШІМ</text>
