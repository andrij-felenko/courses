<text x="200.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">напрямок: яка діагональ</text>
<text x="200.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Q1+Q4 → вперед</text>
<text x="200.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Q2+Q3 → назад</text>
<circle cx="200.0" cy="180.0" r="32.0" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="200.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">M</text>
