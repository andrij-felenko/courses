<text x="734.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">30% → повільно</text>
<text x="580.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">що більша частка «увімкнено» — то вища</text>
<text x="580.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">середня напруга й швидкість мотора</text>
<text x="400.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Швидко вмикаючи й вимикаючи діагональ (ШІМ), регулюють середню напругу — отже, і швидкість, не гріючи нічого.</text>
