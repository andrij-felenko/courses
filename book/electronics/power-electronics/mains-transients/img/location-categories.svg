<circle cx="150.0" cy="150.0" r="20.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="150.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">C</text>
<text x="150.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">ввід ззовні</tspan></text>
<text x="150.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лічильник, ввідний щит</text>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">найбільша енергія</text>
<line x1="370.0" y1="90.0" x2="370.0" y2="210.0" stroke="#e08e0b" stroke-width="1.0" stroke-dasharray="4 4"/>
<circle cx="370.0" cy="150.0" r="20.0" fill="#ffffff" stroke="#e08e0b" stroke-width="2.4"/>
<text x="370.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#e08e0b" text-anchor="middle" font-weight="700">B</text>
<text x="370.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">фідери, короткі</tspan><tspan x="370.0" dy="13.0">відгалуження</tspan></text>
<text x="370.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">≈ до 10 м від вводу</text>
<text x="370.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08e0b" text-anchor="middle" font-weight="700">середня</text>
<line x1="590.0" y1="90.0" x2="590.0" y2="210.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 4"/>
