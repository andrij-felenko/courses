<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зони розташування: A / B / C за відстанню від вводу</text>
<line x1="60.0" y1="150.0" x2="660.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="60.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">від блискавки / мережі</text>
<line x1="70.0" y1="72.0" x2="150.0" y2="72.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
