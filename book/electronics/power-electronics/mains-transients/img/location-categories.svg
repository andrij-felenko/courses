<text x="590.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">A</text>
<text x="590.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">розетки, довгі</tspan><tspan x="590.0" dy="13.0">відгалуження</tspan></text>
<text x="590.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">далеко від вводу</text>
<text x="590.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">найменша</text>
<line x1="150.0" y1="32.0" x2="660.0" y2="32.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="6 3"/>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">стеля 6 кВ — пробій ізоляційних проміжків проводки</text>
