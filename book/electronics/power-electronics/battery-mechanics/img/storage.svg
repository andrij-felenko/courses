<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Літій поза пристроєм: три фази, три правила</text>
<text x="120.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">зберігати</text>
<rect x="18.0" y="119.3" width="204.0" height="45.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="120.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">≈50% заряду, прохолодно,</tspan><tspan x="120.0" dy="14.3">у вогнетривкій ємності</tspan></text>
<text x="120.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="120.0" dy="0.0">подалі від металу:</tspan><tspan x="120.0" dy="13.0">монета чи ключ закоротить!</tspan></text>
<text x="360.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">перевозити</text>
<rect x="258.0" y="119.3" width="204.0" height="45.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="360.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">низький заряд, у межах</tspan><tspan x="360.0" dy="14.3">за ват-годинами</tspan></text>
<text x="360.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="360.0" dy="0.0">авіа — суворі норми;</tspan><tspan x="360.0" dy="13.0">пошкоджені везти не можна</tspan></text>
<text x="600.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">утилізувати</text>
<rect x="498.0" y="119.3" width="204.0" height="45.3" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/><text x="600.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">лише в пункти прийому</tspan><tspan x="600.0" dy="14.3">батарей</tspan></text>
<text x="600.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="600.0" dy="0.0">ніколи в смітник:</tspan><tspan x="600.0" dy="13.0">пожежа у відходах</tspan></text>
<text x="360.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">заряджений літій носить енергію скрізь — і на полиці, і у валізі, і в смітті</text>
</svg>