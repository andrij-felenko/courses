<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три правила конектора (порушив — біда)</text>
<text x="120.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">полярність</text>
<rect x="20.0" y="120.2" width="200.0" height="59.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="120.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">ключований роз'єм —</tspan><tspan x="120.0" dy="14.3">фізично не вставити</tspan><tspan x="120.0" dy="14.3">навпаки</tspan></text>
<text x="120.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="120.0" dy="0.0">переполюсування</tspan><tspan x="120.0" dy="13.0">губить пристрій</tspan></text>
<text x="360.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">струм за піком</text>
<rect x="260.0" y="127.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="360.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">добирати під ПІКОВИЙ</tspan><tspan x="360.0" dy="14.3">струм, не середній</tspan></text>
<text x="360.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="360.0" dy="0.0">тонкий роз'єм гріється</tspan><tspan x="360.0" dy="13.0">й просідає під піком</tspan></text>
<text x="600.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">не закоротити</text>
<rect x="500.0" y="127.3" width="200.0" height="45.3" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/><text x="600.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ізолювати виводи,</tspan><tspan x="600.0" dy="14.3">фіксувати дроти</tspan></text>
<text x="600.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="600.0" dy="0.0">голий вивід об метал —</tspan><tspan x="600.0" dy="13.0">коротке, ризик пожежі</tspan></text>
</svg>