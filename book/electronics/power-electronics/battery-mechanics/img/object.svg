<rect x="475.0" y="244.2" width="190.0" height="59.6" rx="6" fill="#ffffff" stroke="#8a5fb0" stroke-width="1.8"/><text x="570.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5fb0" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">потребує конектора</tspan><tspan x="570.0" dy="14.3">полярність, струм,</tspan><tspan x="570.0" dy="14.3">не закоротити</tspan></text>
