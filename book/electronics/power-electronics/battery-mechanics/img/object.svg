<text x="360.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">комірка</text>
<line x1="245.0" y1="125.8" x2="304.0" y2="158.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="55.0" y="66.2" width="190.0" height="59.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">має вагу й об'єм</tspan><tspan x="150.0" dy="14.3">тримати, не</tspan><tspan x="150.0" dy="14.3">навантажуючи виводи</tspan></text>
<line x1="475.0" y1="125.8" x2="416.0" y2="158.0" stroke="#6b7280" stroke-width="1.5"/>
