<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка при відмові: проєктувати на «безпечно згоріти»</text>
<rect x="30.0" y="67.0" width="132.0" height="50.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/><text x="96.0" y="88.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="96.0" dy="0.0">ушкодження /</tspan><tspan x="96.0" dy="14.3">перегрів</tspan></text>
<rect x="212.7" y="67.0" width="132.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="278.7" y="88.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="278.7" dy="0.0">вихід газу</tspan><tspan x="278.7" dy="14.3">(venting)</tspan></text>
<line x1="162.0" y1="92.0" x2="210.7" y2="92.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="395.3" y="67.0" width="132.0" height="50.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="461.3" y="88.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="461.3" dy="0.0">тепловий</tspan><tspan x="461.3" dy="14.3">розгін</tspan></text>
<line x1="344.7" y1="92.0" x2="393.3" y2="92.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="578.0" y="67.0" width="132.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a5fb0" stroke-width="1.8"/><text x="644.0" y="88.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5fb0" text-anchor="middle" font-weight="700"><tspan x="644.0" dy="0.0">займання,</tspan><tspan x="644.0" dy="14.3">каскад</tspan></text>
<line x1="527.3" y1="92.0" x2="576.0" y2="92.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="370.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">завдання конструкції — розірвати ланцюг або локалізувати наслідки:</text>
<rect x="99.0" y="178.0" width="14.0" height="14.0" rx="3" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="117.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">шлях для газу</text>
<text x="99.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="99.0" dy="0.0">вентиляція, не</tspan><tspan x="99.0" dy="11.7">герметичний короб</tspan></text>
<rect x="269.0" y="178.0" width="14.0" height="14.0" rx="3" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="287.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">розділяти комірки</text>
<text x="269.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="269.0" dy="0.0">щоб розгін не</tspan><tspan x="269.0" dy="11.7">передався сусіднім</tspan></text>
<rect x="439.0" y="178.0" width="14.0" height="14.0" rx="3" fill="#b8860b" stroke="#b8860b" stroke-width="0.0"/>
<text x="457.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">без горючого поруч</text>
<text x="439.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="439.0" dy="0.0">матеріали, що не</tspan><tspan x="439.0" dy="11.7">підтримують горіння</tspan></text>
<rect x="609.0" y="178.0" width="14.0" height="14.0" rx="3" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="627.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">не затискати</text>
<text x="609.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="609.0" dy="0.0">тиск на надуту</tspan><tspan x="609.0" dy="11.7">комірку — прискорювач</tspan></text>
<text x="370.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">відмова однієї комірки має лишитися локальним інцидентом, а не пожежею виробу</text>
</svg>