<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поведінка при відмові: проєктувати на «безпечно згоріти»</text>
<rect x="80.0" y="80.0" width="150.0" height="56.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="155.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">ушкодження /</text>
<text x="155.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">перегрів</text>
<line x1="230.0" y1="108.0" x2="285.0" y2="108.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="290.0" y="80.0" width="150.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="365.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вихід газу</text>
<text x="365.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">(venting)</text>
<line x1="440.0" y1="108.0" x2="495.0" y2="108.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="80.0" width="150.0" height="56.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="575.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тепловий</text>
<text x="575.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">розгін</text>
<line x1="650.0" y1="108.0" x2="705.0" y2="108.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="710.0" y="80.0" width="150.0" height="56.0" rx="8" fill="#ffffff" stroke="#9b59b6" stroke-width="1.8"/>
<text x="785.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9b59b6" text-anchor="middle" font-weight="bold" font-style="normal">займання</text>
<text x="785.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9b59b6" text-anchor="middle" font-weight="bold" font-style="normal">/ каскад</text>
<text x="470.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Завдання конструкції — РОЗІРВАТИ цей ланцюг або хоча б локалізувати наслідки:</text>
<rect x="80.0" y="184.0" width="22.0" height="22.0" rx="4" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="116.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Шлях для газу</text>
<text x="116.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вентиляція, а не герметичний короб під тиском</text>
<rect x="80.0" y="226.0" width="22.0" height="22.0" rx="4" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="116.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Розділяти комірки</text>
<text x="116.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">щоб розгін однієї не підпалив сусідні</text>
<rect x="80.0" y="268.0" width="22.0" height="22.0" rx="4" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="116.0" y="279.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Без горючого поруч</text>
<text x="116.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">жодного палива впритул до комірки</text>
<rect x="80.0" y="310.0" width="22.0" height="22.0" rx="4" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="116.0" y="321.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Не затискати</text>
<text x="116.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тиск на надуту комірку — прискорювач</text>
<rect x="70.0" y="370.0" width="800.0" height="20.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Відмова однієї комірки не має ставати катастрофою: дати газу вийти, розвести комірки, прибрати горюче — щоб «згоріло безпечно».</text>
</svg>
