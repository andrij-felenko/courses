<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Надутий LiPo: причина і чіткий алгоритм</text>
<path d="M90,106 Q150,72 210,106 L210,194 Q150,228 90,194 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="150.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">газ усередині</text>
<text x="150.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">електроліт розклався →</tspan><tspan x="150.0" dy="13.0">виділив горючий газ</tspan><tspan x="150.0" dy="13.0">(перезаряд, перегрів, прокол,</tspan><tspan x="150.0" dy="13.0">глибокий розряд, старість)</tspan></text>
<text x="150.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">чому надувається</text>
<text x="475.2" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">що робити</text>
<circle cx="379.2" cy="104.0" r="12.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="379.2" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="401.2" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="401.2" dy="0.0">припинити заряд</tspan><tspan x="401.2" dy="12.5">і використання</tspan></text>
<circle cx="379.2" cy="154.0" r="12.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="379.2" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="401.2" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="401.2" dy="0.0">ізолювати у</tspan><tspan x="401.2" dy="12.5">вогнетривкій ємності</tspan></text>
<circle cx="379.2" cy="204.0" r="12.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="379.2" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="401.2" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700"><tspan x="401.2" dy="0.0">НЕ проколювати,</tspan><tspan x="401.2" dy="12.5">не тиснути, не «здувати»</tspan></text>
<circle cx="379.2" cy="254.0" r="12.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="379.2" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="401.2" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="401.2" dy="0.0">здати на утилізацію</tspan></text>
</svg>