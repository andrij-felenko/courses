<rect x="120.6" y="80.0" width="18.0" height="12.0" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="314.0" y="106.0" width="92.0" height="96.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="344.0" y="94.0" width="12.0" height="14.0" rx="2" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="366.0" y="94.0" width="12.0" height="14.0" rx="2" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="590.4" cy="146.0" r="40.0" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.8"/>
<circle cx="590.4" cy="146.0" r="24.0" fill="#ffffff" stroke="#b8860b" stroke-width="1.2"/>
<text x="129.6" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">циліндрична</text>
<text x="360.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">пакетна (LiPo)</text>
<text x="590.4" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">монетна</text>
<text x="129.6" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="129.6" dy="0.0">пружинний тримач: гірший</tspan><tspan x="129.6" dy="13.5">контакт (росте Rвн); або</tspan><tspan x="129.6" dy="13.5">приварені смужки — надійніше</tspan></text>
<text x="360.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">м'яка, без корпусу: берегти</tspan><tspan x="360.0" dy="13.5">від проколу й тиску, не тягти</tspan><tspan x="360.0" dy="13.5">за виводи, лишити роздуття</tspan></text>
<text x="590.4" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.4" dy="0.0">пружний контакт у гнізді;</tspan><tspan x="590.4" dy="13.5">головна пастка — переплутана</tspan><tspan x="590.4" dy="13.5">полярність</tspan></text>
</svg>