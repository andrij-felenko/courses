<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Батарея — це ще й фізичний об'єкт</text>
<rect x="410.0" y="165.0" width="120.0" height="90.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<rect x="455.0" y="152.0" width="30.0" height="14.0" rx="4" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">комірка</text>
<rect x="70.0" y="95.0" width="210.0" height="66.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="175.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Має вагу й об'єм</text>
<text x="175.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тримати, не навантажувати виводи</text>
<rect x="660.0" y="95.0" width="210.0" height="66.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="765.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Надувається</text>
<text x="765.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лишити місце на роздуття</text>
<rect x="70.0" y="285.0" width="210.0" height="66.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="175.0" y="311.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Проколюється / тисне</text>
<text x="175.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">захист від механіки → інакше пожежа</text>
<rect x="660.0" y="285.0" width="210.0" height="66.0" rx="10" fill="#ffffff" stroke="#9b59b6" stroke-width="1.8"/>
<text x="765.0" y="311.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#9b59b6" text-anchor="middle" font-weight="bold" font-style="normal">Потребує конектора</text>
<text x="765.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">полярність, струм, не закоротити</text>
<line x1="280.0" y1="128.0" x2="408.0" y2="178.0" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="660.0" y1="128.0" x2="532.0" y2="178.0" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="280.0" y1="318.0" x2="408.0" y2="242.0" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#aInk)"/>
<line x1="660.0" y1="318.0" x2="532.0" y2="242.0" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#aInk)"/>
<rect x="70.0" y="370.0" width="800.0" height="20.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Електрика — лише половина справи. Батарея масивна, здатна надутись, боїться проколу й тиску, і її треба надійно тримати та під'єднувати.</text>
</svg>
