  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стрибок навантаження «на пальцях»: глибина провалу й дзвін</text>
<text x="84.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Iнаван</text>
<line x1="100.0" y1="128.0" x2="320.0" y2="128.0" stroke="#b5763a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="320.0" y1="128.0" x2="320.0" y2="98.0" stroke="#b5763a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="320.0" y1="98.0" x2="820.0" y2="98.0" stroke="#b5763a" stroke-width="2.4" stroke-linecap="round"/>
<text x="230.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0.5 А</text>
<text x="560.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">3 А (ΔIнаван = 2.5 А)</text>
<text x="84.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Vвих</text>
<line x1="100.0" y1="250.0" x2="820.0" y2="250.0" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6,4" stroke-linecap="round"/>
<text x="826.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ціль</text>
<polyline points="100.0,250.0 320.0,250.0 322.0,266.0 340.0,320.0 360.0,290.0 380.0,314.0 400.0,298.0 420.0,308.0 445.0,302.0 475.0,305.0 560.0,258.0 820.0,250.0" fill="none" stroke="#1f47b5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="322.0" y1="250.0" x2="322.0" y2="266.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<text x="300.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">ESR-крок = ΔI·ESR</text>
<line x1="345.0" y1="250.0" x2="345.0" y2="320.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="355.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">провал ≈ ΔI·ESR + ΔI·tвідгук/C</text>
<text x="430.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дзвін: лічи цикли → запас стійкості (без Боде)</text>
<rect x="560.0" y="180.0" width="250.0" height="100.0" rx="8" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="685.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лічба «на пальцях»:</text>
<text x="575.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0 циклів → добрий запас ✓</text>
<text x="575.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">1–2 цикли → на межі</text>
<text x="575.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">не вгаває → нестійко ✗</text>
<rect x="70.0" y="400.0" width="760.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="450.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Глибина провалу — це число для ТЗ (ESR-крок + просадка C за час відгуку). Кількість циклів дзвону —</text>
<text x="450.0" y="431.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">замість запасу фази: чим менше дзвону, тим більший запас стійкості. Усе видно оком на осцилографі.</text>
</svg>
