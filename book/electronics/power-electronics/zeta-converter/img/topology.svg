<rect x="50.0" y="375.0" width="860.0" height="52.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="398.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Zeta є дуалом SEPIC: вихідна котушка L2 увімкнена послідовно з виходом (як у знижувачі Buck), забезпечуючи неперервний вихідний струм і наднизькі пульсації напруги на навантаженні.</tspan><tspan x="480.0" dy="11.7">Проміжний конденсатор Cc ізолює постійний струм між портами та заряджений до напруги V_Cc = Vвих.</tspan></text>
