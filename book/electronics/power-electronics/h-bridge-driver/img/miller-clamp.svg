в обхід R_g (&lt; 0.5 Ом)</text>
<rect x="488.5" y="357.5" width="257.1" height="35.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="617.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="617.0" dy="0.0">V_gs надійно утримується біля 0 В (&lt; 0.8 В)</tspan><tspan x="617.0" dy="13.0">Паразитне відмикання повністю блоковано</tspan></text>
