<rect x="116.3" y="347.5" width="211.5" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="222.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">Ключ LS самочинно ПРИВІДКРИВАЄТЬСЯ</tspan><tspan x="222.0" dy="13.0">під час увімкнення верхнього ключа!</tspan></text>
