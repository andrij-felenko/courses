<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однакове середнє — різний нагрів: гріє RMS, не середнє</text>
<rect x="40.0" y="60.0" width="380.0" height="300.0" rx="12" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Гладкий струм: рівно 2 А</text>
<line x1="80.0" y1="250.0" x2="380.0" y2="250.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="80.0" y1="182.0" x2="380.0" y2="182.0" stroke="#2457d6" stroke-width="2.8"/>
<line x1="80.0" y1="250.0" x2="80.0" y2="182.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="230.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">i = 2 А весь час</text>
<rect x="138.5" y="297.1" width="183.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">сер = 2 А    RMS = 2 А</tspan><tspan x="230.0" dy="16.9">нагрів ∝ 2² = 4</tspan></text>
<rect x="440.0" y="60.0" width="380.0" height="300.0" rx="12" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/>
<text x="630.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Імпульси: 4 А половину часу</text>
<line x1="480.0" y1="250.0" x2="780.0" y2="250.0" stroke="#6b7280" stroke-width="1.2"/>
<polyline points="480.0,250.0 480.0,114.0 555.0,114.0 555.0,250.0 630.0,250.0 630.0,250.0 630.0,114.0 705.0,114.0 705.0,250.0 780.0,250.0" fill="none" stroke="#c0392b" stroke-width="2.8"/>
<line x1="480.0" y1="182.0" x2="780.0" y2="182.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="776.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">те саме середнє 2 А</text>
<text x="517.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4 А</text>
<rect x="512.6" y="297.1" width="234.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">сер = 2 А    RMS = 2.83 А</tspan><tspan x="630.0" dy="16.9">нагрів ∝ 2.83² = 8  — удвічі!</tspan></text>
</svg>