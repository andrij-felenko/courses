<rect x="101.6" y="379.8" width="696.9" height="32.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="400.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">IL(rms) = √(I² + ΔI²/12)   —   перехресний член 2·I·⟨a⟩ = 0, тож катети складаються під коренем</tspan></text>
