<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вольт-секундний баланс: підйом за «ВКЛ» = спад за «ВИКЛ»</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">струм котушки щоперіод повертається до себе — звідси й Vвих = Vвх·D, і розмах ΔI</text>
<rect x="90.0" y="120.0" width="96.0" height="240.0" rx="0" fill="#eafaef" stroke="none" stroke-width="0.0"/>
<rect x="186.0" y="120.0" width="144.0" height="240.0" rx="0" fill="#fdf3e0" stroke="none" stroke-width="0.0"/>
<rect x="330.0" y="120.0" width="96.0" height="240.0" rx="0" fill="#eafaef" stroke="none" stroke-width="0.0"/>
<rect x="426.0" y="120.0" width="144.0" height="240.0" rx="0" fill="#fdf3e0" stroke="none" stroke-width="0.0"/>
<text x="138.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="700">ВКЛ</text>
<text x="258.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="700">ВИКЛ</text>
<line x1="90.0" y1="360.0" x2="612.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="612.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">час</text>
<line x1="90.0" y1="360.0" x2="90.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="84.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">iл</text>
<line x1="90.0" y1="200.0" x2="578.0" y2="200.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="90.0" y1="300.0" x2="578.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="90.0" y1="250.0" x2="570.0" y2="250.0" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="96.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0a8f3c" text-anchor="start">середнє = Iвих</text>
<polyline points="90.0,300.0 186.0,200.0 330.0,300.0 426.0,200.0 570.0,300.0" fill="none" stroke="#d98a00" stroke-width="2.8" stroke-linejoin="round"/>
<text x="134.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="700">+(Vвх−Vвих)/L</text>
<text x="264.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d98a00" text-anchor="middle" font-weight="700">−Vвих/L</text>
<text x="138.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">D·T</text>
<text x="258.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(1−D)·T</text>
<line x1="580.0" y1="200.0" x2="580.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="576.0" y1="200.0" x2="584.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="576.0" y1="300.0" x2="584.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="588.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">ΔI</text>
<rect x="648.0" y="150.0" width="268.0" height="150.0" rx="11" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="782.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щоб хвиля повторювалась:</text>
<text x="782.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">підйом = спад</text>
<text x="782.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(Vвх−Vвих)·D·T = Vвих·(1−D)·T</text>
<rect x="682.0" y="242.0" width="200.0" height="38.0" rx="8" fill="#eafaef" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="782.0" y="267.0" font-family="Consolas, monospace" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Vвих = Vвх × D</text>
<rect x="648.0" y="322.0" width="268.0" height="72.0" rx="11" fill="#f4f6f8" stroke="#d98a00" stroke-width="1.3"/>
<text x="782.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="700">Висота трикутника (розмах):</text>
<text x="782.0" y="372" font-family="Consolas, monospace" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ΔI = (Vвх−Vвих)·D·T / L</text>
<text x="470.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Одна умова — періодичність — дає одразу два числа: коефіцієнт перетворення і пульсацію струму.</text>
</svg>