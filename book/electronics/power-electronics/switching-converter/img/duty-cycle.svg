<text x="589.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Vвих 12 В</text>
<rect x="120.0" y="360.0" width="720.0" height="76.0" rx="12" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="140.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Зворотний зв'язок:</text>
<text x="140.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">виміряти Vвих → порівняти з ціллю → підкрутити D → знову виміряти  (тримає вихід рівним, хоч би як стрибав вхід чи струм)</text>
<text x="480.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Без зворотного зв'язку це був би просто «різак»; із ним — точний стабілізатор напруги.</text>
</svg>