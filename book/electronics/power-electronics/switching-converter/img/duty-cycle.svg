<text x="70" y="284" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">D = 0.75</text>
<line x1="180.0" y1="306.0" x2="480.0" y2="306.0" stroke="#6b7280" stroke-width="1.0"/>
