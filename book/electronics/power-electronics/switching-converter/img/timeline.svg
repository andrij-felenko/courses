<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпульсне живлення: довга низка, у якій Apple — пізній вузол</text>
<text x="460.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">перемикання струму існувало за десятиліття до 1977-го; справжній тригер — дешевий швидкий транзистор</text>
<line x1="232.0" y1="96.0" x2="232.0" y2="870.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="232.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1930-ті</text>
<text x="258.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Вібратор у радіоприймачі</text>
<text x="258.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Механічний переривач кришить 6 В на пульсації → трансформатор → B+ для ламп</text>
<circle cx="232.0" cy="191.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1958</text>
<text x="258.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">IBM 704 · Pioneer Magnetics</text>
<text x="258.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Перші комутаційні регулятори — ще на тиратронах (лампах)</text>
<circle cx="232.0" cy="264.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1959</text>
<text x="258.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">General Electric</text>
<text x="258.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Опублікована рання схема напівпровідникового стабілізатора-перемикача</text>
<circle cx="232.0" cy="337.0" r="8.5" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="210.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1962</text>
<text x="258.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Telstar · Minuteman</text>
<text x="258.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Космос і ракети: кожен грам дорогий → ефективність важливіша за простоту</text>
<circle cx="232.0" cy="410.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1966–67</text>
<text x="258.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Tektronix · RO Associates</text>
<text x="258.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Портативний осцилограф; перший 20-кГц імпульсний БЖ як готовий товар</text>
<circle cx="232.0" cy="483.0" r="8.5" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="210.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">кін. 1960-х</text>
<text x="258.0" y="479.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Швидкі високовольтні транзистори</text>
<text x="258.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Motorola, SSPI, Siemens-Edison-Swan: дешевий ключ — ОСЬ де справжня революція</text>
<circle cx="232.0" cy="556.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="561.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1969–71</text>
<text x="258.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">DEC PDP-11/20 · HP 2100A</text>
<text x="258.0" y="571.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Імпульсне живлення входить у серійні міні-комп'ютери</text>
<circle cx="232.0" cy="629.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1975</text>
<text x="258.0" y="625.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">IBM 5100 · HP 2640A</text>
<text x="258.0" y="644.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Імпульсні БЖ — уже ~8% ринку, за два роки до Apple II</text>
<circle cx="232.0" cy="702.0" r="8.5" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="210.0" y="707.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1976</text>
<text x="258.0" y="698.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">SG1524 (Р. Маммано)</text>
<text x="258.0" y="717.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Перша мікросхема ШІМ-керування — оце справді змінює зручність розробки</text>
<circle cx="232.0" cy="775.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="210.0" y="780.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1976</text>
<text x="258.0" y="771.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Boschert, 80 Вт</text>
<text x="258.0" y="790.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Безвентиляторний flyback у серії — той самий клас, що буде в Apple</text>
<circle cx="232.0" cy="848.0" r="11.0" fill="#ffffff" stroke="#caa24a" stroke-width="3.2"/>
<circle cx="232.0" cy="848.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0.0"/>
<text x="210.0" y="853.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1977</text>
<text x="258.0" y="844.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Apple II · Род Голт</text>
<text x="258.0" y="863.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">Акуратний 38-Вт flyback. Гарний інженерно — але ПІЗНІЙ у низці, не її початок</text>
<circle cx="82.0" cy="896.0" r="8.5" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="98.0" y="900.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ключовий поштовх</text>
<circle cx="252.0" cy="896.0" r="11.0" fill="#ffffff" stroke="#caa24a" stroke-width="3.2"/>
<circle cx="252.0" cy="896.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0.0"/>
<text x="270.0" y="900.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">вузол, який міф видає за «початок»</text>
<text x="460.0" y="924.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">«Кожен комп'ютер копіює дизайн Голта» — міф: і топології, і ринок існували задовго до Apple II</text>
</svg>