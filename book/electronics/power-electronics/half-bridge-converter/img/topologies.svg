<rect x="557.7" y="257.4" width="224.6" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Захист осердя</tspan><tspan x="670.0" dy="14.3">Потребує симетрії або DC-блока</tspan></text>
<rect x="540.6" y="322.4" width="258.7" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Діапазон потужності</tspan><tspan x="670.0" dy="14.3">&gt; 1000 Вт (кіловати та десятки кВт)</tspan></text>
<rect x="60.0" y="395.0" width="720.0" height="65.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="420.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Золота середина: напівміст дає повне використання сердечника і стрес ключів лише Vin,</text>
