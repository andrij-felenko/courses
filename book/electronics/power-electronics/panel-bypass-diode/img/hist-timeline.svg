<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гаряча пляма: від здогаду до пункту специфікації</text>
<line x1="214.0" y1="100.0" x2="214.0" y2="650.0" stroke="#c9ced6" stroke-width="3.0"/>
<text x="192.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="end" font-weight="700">1971</text>
<circle cx="214.0" cy="100.0" r="9.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<line x1="224.0" y1="100.0" x2="240.0" y2="100.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="246.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Здогад у космічній програмі</text>
<text x="246.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">Ганс Раушенбах (TRW) друкує аналіз затінених масивів:</text>
<text x="246.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">затінений елемент іде у зворотне зміщення й гріється —</text>
<text x="246.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">і пропонує вмикати захисні діоди на групи елементів.</text>
<text x="192.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#3a4652" text-anchor="end" font-weight="700">1975</text>
<circle cx="214.0" cy="210.0" r="9.0" fill="#3a4652" stroke="#ffffff" stroke-width="2.0"/>
<line x1="224.0" y1="210.0" x2="240.0" y2="210.0" stroke="#3a4652" stroke-width="2.4"/>
<text x="246.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Панель сходить на землю: проєкт JPL</text>
<text x="246.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">Дешеві кремнієві модулі для дахів і полів. Починаються</text>
<text x="246.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">«блокові» держзакупівлі — щораз суворіші вимоги до модуля.</text>
<text x="192.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#3a4652" text-anchor="end" font-weight="700">1978</text>
<circle cx="214.0" cy="320.0" r="9.0" fill="#3a4652" stroke="#ffffff" stroke-width="2.0"/>
<line x1="224.0" y1="320.0" x2="240.0" y2="320.0" stroke="#3a4652" stroke-width="2.4"/>
<text x="246.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Блок IV</text>
<text x="246.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">Специфікація вже випробовує град, вологу, теплові цикли —</text>
<text x="246.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">але гарячої плями в переліку тестів іще нема.</text>
<text x="192.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="end" font-weight="700">1980</text>
<circle cx="214.0" cy="430.0" r="9.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<line x1="224.0" y1="430.0" x2="240.0" y2="430.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="246.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Лабораторний тест (Ґонзалес і Вівер, JPL)</text>
<text x="246.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">На 14-й конференції PVSC показано, як виміряти,</text>
<text x="246.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">чи витримає модуль зворотний нагрів затіненого елемента.</text>
<text x="192.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="end" font-weight="700">1981</text>
<circle cx="214.0" cy="540.0" r="9.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<line x1="224.0" y1="540.0" x2="240.0" y2="540.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="246.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Блок V: гаряча пляма — обов'язкове випробування</text>
<text x="246.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">Щоб пройти тест, доводиться вбудовувати байпасні</text>
<text x="246.0" y="559.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">діоди в кожен модуль. Хитрість стає стандартом.</text>
<text x="192.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="end" font-weight="700">1986</text>
<circle cx="214.0" cy="650.0" r="9.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/>
<line x1="224.0" y1="650.0" x2="240.0" y2="650.0" stroke="#6b7280" stroke-width="2.4"/>
<text x="246.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Спадок: напрацювання → стандарт IEC 61215</text>
<text x="246.0" y="652.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">Програму закривають; її тести лягають в основу</text>
<text x="246.0" y="669.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5560" text-anchor="start">міжнародної кваліфікації модулів, чинної й досі.</text>
</svg>