<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дільник 2:1: половинить напругу, подвоює струм</text>
<rect x="60.0" y="96.0" width="200.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Адаптер PPS</tspan><tspan x="160.0" dy="19.5">9 В · 5 А</tspan><tspan x="160.0" dy="19.5">= 45 Вт</tspan></text>
<line x1="260.0" y1="144.0" x2="336.0" y2="144.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="298.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5 А</text>
<rect x="336.0" y="86.0" width="224.0" height="116.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="448.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="448.0" dy="0.0">Дільник 2:1</tspan><tspan x="448.0" dy="19.5">перемикані</tspan><tspan x="448.0" dy="19.5">конденсатори · ≈ 99 %</tspan></text>
<line x1="560.0" y1="144.0" x2="636.0" y2="144.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="598.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">10 А</text>
<rect x="636.0" y="96.0" width="204.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="738.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="738.0" dy="0.0">Комірка</tspan><tspan x="738.0" dy="19.5">4.5 В · 10 А</tspan><tspan x="738.0" dy="19.5">= 45 Вт</tspan></text>
<text x="450.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Напруга ÷ 2, струм × 2 — та сама потужність, але грів майже нульовий: без котушки, ключі на ~50 %.</text>
<text x="450.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Крок PPS 20 мВ на вході → 10 мВ на комірці — досить тонко, щоб утримати CV-коліно.</text>
</svg>