<rect x="475.0" y="350.0" width="395.0" height="135.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.5"/><text x="672.5" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="672.5" dy="0.0">• D1 відкривається і фіксує вузол SW2 на потенціалі 0 В (GND).</tspan><tspan x="672.5" dy="11.7">• Струм i_L1 тече через C1 і D1 у землю, дозаряджаючи C1 енергією з входу.</tspan><tspan x="672.5" dy="11.7">• Напруга на SW1 злітає до V_C1 = Vвх + |Vвих|.</tspan><tspan x="672.5" dy="11.7">• Котушка L2 замикається через D1 і підтримує струм у навантаженні.</tspan></text>
