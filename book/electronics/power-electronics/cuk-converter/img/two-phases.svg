<rect x="30.0" y="350.0" width="395.0" height="135.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.5"/><text x="227.5" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">• L1 підключена прямо до Vвх: струм i_L1 зростає зі швидкістю +Vвх / L1.</tspan><tspan x="227.5" dy="11.7">• Ліва обкладка C1 сідає на GND: права обкладка падає до −(Vвх + |Vвих|).</tspan><tspan x="227.5" dy="11.7">• D1 закритий зворотною напругою V_D = −(Vвх + |Vвих|).</tspan><tspan x="227.5" dy="11.7">• C1 розряджається в L2 і навантаження: струм i_L2 зростає.</tspan></text>
