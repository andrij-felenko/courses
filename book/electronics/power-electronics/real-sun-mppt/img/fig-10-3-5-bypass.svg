<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Поруч із групою комірок ставлять діод. Поки комірка освітлена — діод закритий, не заважає. Затінилася — на ній</text>
<text x="470.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">з'являється зворотна напруга, діод ВІДКРИВАЄТЬСЯ й пускає струм в обхід неї. Ряд тече далі (мінус ця група), а не глухне зовсім —</text>
<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і заразом зникає «гаряча пляма»: затінена комірка більше не палиться чужим струмом. Тому реальні панелі мають bypass-діоди.</text>
