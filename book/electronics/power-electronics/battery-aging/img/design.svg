<text x="272.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="290.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Бери батарею БІЛЬШУ — щоб і на 80% EoL вистачало</text>
<text x="272.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="290.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Заряджай нижче (4.1 В) — життя в рази довше</text>
<text x="272.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="290.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Циклюй серединою, не «0–100%»</text>
<text x="272.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="290.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тримай прохолодно; уникай «спека + повна»</text>
<text x="272.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="290.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Зберігай на ~50%, не повною</text>
<text x="272.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">•</text>
<text x="290.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Передбач ЗАМІНУ батареї в конструкції</text>
<rect x="103.7" y="367.9" width="612.5" height="44.1" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="386.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">деградація неминуча — її ПЛАНУЮТЬ: запас ємності на кінець життя, лагідний режим, доступ до заміни.</tspan><tspan x="410.0" dy="13.7">здоров'я (SoH) тим часом стежить за двома знаками — спадом ємності та зростанням Rвн.</tspan></text>
