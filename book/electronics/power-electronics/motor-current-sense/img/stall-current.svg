<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мотор диктує малий шунт: пусковий струм у рази більший за робочий</text>
<text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робочий струм</text>
<rect x="70.0" y="96.0" width="90.0" height="26.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="115.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2 A</text>
<text x="430.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пусковий (застряг ротор)</text>
<rect x="300.0" y="96.0" width="360.0" height="26.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="480.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">20 A і більше</text>
<rect x="70.0" y="160.0" width="280.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="217.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Шунт мусить пережити ПІК струму без перегріву й без насичення входу підсилювача.</tspan><tspan x="210.0" dy="10.4">P = I²·R гріє з квадратом струму — на піку в 10× тепло в 100×.</tspan></text>
<rect x="380.0" y="160.0" width="280.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="217.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Тому беруть шунт у міліомах: 5 мΩ при 20 A дає 100 мВ (влазить у вхід)</tspan><tspan x="520.0" dy="10.4">і 2 Вт тепла (терпимо), а при 2 A — лише 10 мВ і 20 мВт.</tspan></text>
<text x="360.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Опір шунта підбирають під ПІК, а не під робочий струм — інакше вхід «зашкалить» на пуску</text>
</svg>