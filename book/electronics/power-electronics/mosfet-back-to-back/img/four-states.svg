<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що робить пара в чотирьох ситуаціях</text>
<rect x="40.0" y="58.0" width="640.0" height="50.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Увімкнено, струм уперед</text>
<text x="60.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">обидва канали відкриті — падіння на 2·Rds(on), діоди ні до чого</text>
<rect x="40.0" y="116.0" width="640.0" height="50.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Увімкнено, струм назад</text>
<text x="60.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">обидва канали відкриті — струм так само йде каналами, теж 2·Rds(on)</text>
<rect x="40.0" y="174.0" width="640.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Вимкнено, тиснемо з боку A</text>
<text x="60.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">діод Q1 хоче пустити, але канал і діод Q2 стоять поперек — глухо</text>
<rect x="40.0" y="232.0" width="640.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Вимкнено, тиснемо з боку B</text>
<text x="60.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">тепер поперек стоїть Q1 — знову глухо; блокує в обидва боки</text>
</svg>