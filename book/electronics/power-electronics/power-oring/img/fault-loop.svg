<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аварійне замикання входу: хто дає заряд і хто обмежує струм</text>
<line x1="515.0" y1="52.0" x2="515.0" y2="444.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 6"/>
<text x="280.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контур аварії</text>
<line x1="190.0" y1="180.0" x2="440.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="190.0" y1="400.0" x2="440.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="440.0" y1="180.0" x2="440.0" y2="213.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="440.0" y1="257.0" x2="440.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="440.0" y1="350.0" x2="440.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="190.0" y1="180.0" x2="190.0" y2="280.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="190.0" y1="300.0" x2="190.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="165.0" y1="280.0" x2="215.0" y2="280.0" stroke="#2457d6" stroke-width="3.4"/>
<line x1="165.0" y1="300.0" x2="215.0" y2="300.0" stroke="#2457d6" stroke-width="3.4"/>
<text x="155.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">C_шини</text>
<text x="155.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">470 мкФ</text>
<rect x="400.0" y="213.0" width="80.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="440.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">клапан</text>
<rect x="400.0" y="310.0" width="80.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="440.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">L</text>
<rect x="271.8" y="221.5" width="116.3" height="27.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="330.0" dy="0.0">R_DS(on) = 2 мОм</tspan></text>
<rect x="287.5" y="316.5" width="85.0" height="27.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="330.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="330.0" dy="0.0">L = 100 нГн</tspan></text>
<circle cx="440.0" cy="400.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="431.0" y1="391.0" x2="449.0" y2="409.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="431.0" y1="409.0" x2="449.0" y2="391.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="428.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вхід замкнуло → 0 В</text>
<line x1="225.0" y1="160.0" x2="425.0" y2="160.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="325.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">зворотний струм i(t)</text>
<text x="300.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">шина 12 В</text>
<text x="315.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зворотний шлях</text>
<text x="755.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що обмежує кидок</text>
<rect x="545.0" y="90.0" width="420.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="119.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">✗  Наївно, за законом Ома:</tspan><tspan x="755.0" dy="16.9">I = V₀ / R_DS(on) = 12 / 0.002 = 6000 А</tspan><tspan x="755.0" dy="16.9">Нісенітниця: струм не виникає миттєво.</tspan></text>
<rect x="545.0" y="192.0" width="420.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="221.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">✓  Насправді тримає індуктивність контуру:</tspan><tspan x="755.0" dy="16.9">di/dt = V₀ / L = 12 / 100 нГн = 120 А/мкс</tspan><tspan x="755.0" dy="16.9">За 207 нс сліпоти струм устигає до 24.8 А.</tspan></text>
<rect x="545.0" y="294.0" width="420.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="755.0" y="325.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">Дві сталі цього контуру:</tspan><tspan x="755.0" dy="16.9">T₀ = √(L·C) = 6.9 мкс — годинник аварії</tspan><tspan x="755.0" dy="16.9">Z₀ = √(L/C) = 14.6 мОм — хвильовий опір</tspan><tspan x="755.0" dy="16.9">Якби клапан не зачинився: V₀/Z₀ = 823 А</tspan></text>
<rect x="60.0" y="454.0" width="880.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="475.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">R_DS(on) зворотного кидка не тримає — його тримає індуктивність контуру. Клапану лишається встигнути зачинитися.</tspan></text>
</svg>