<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час сліпоти клапана й ціна цього часу для шини</text>
<text x="500.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет сліпоти:  t_сліп = t_поріг + t_компаратора + t_затвора</text>
<rect x="90.0" y="112.0" width="165.4" height="40.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="172.7" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">42 нс</text>
<text x="172.7" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">поріг</text>
<rect x="255.4" y="112.0" width="595.1" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="553.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">150 нс</text>
<text x="553.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">компаратор</text>
<rect x="850.5" y="112.0" width="59.5" height="40.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="880.2" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">15 нс</text>
<text x="880.2" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">затвор</text>
<line x1="172.7" y1="152.0" x2="220.0" y2="186.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="90.0" y="186.0" width="260.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">t_поріг = L · I_поріг / V₀</tspan><tspan x="220.0" dy="15.6">I_поріг = 10 мВ / 2 мОм = 5 А</tspan><tspan x="220.0" dy="15.6">100 нГн · 5 / 12 = 42 нс</tspan></text>
<line x1="553.0" y1="152.0" x2="500.0" y2="186.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="370.0" y="186.0" width="260.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">t_компаратора</tspan><tspan x="500.0" dy="15.6">чиста затримка мікросхеми,</tspan><tspan x="500.0" dy="15.6">нічим не скоротити: ≈ 150 нс</tspan></text>
<line x1="880.2" y1="152.0" x2="780.0" y2="186.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="650.0" y="186.0" width="260.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">t_затвора = Q_g / I_sink</tspan><tspan x="780.0" dy="15.6">30 нКл / 2 А</tspan><tspan x="780.0" dy="15.6">= 15 нс</tspan></text>
<text x="420.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки заряду насправді йде з шини</text>
<line x1="150.0" y1="470.0" x2="700.0" y2="470.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="150.0" y1="470.0" x2="150.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">час →</text>
<text x="140.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">|i_зв|</text>
<rect x="150.0" y="329.4" width="394.6" height="140.6" rx="0" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<line x1="150.0" y1="329.4" x2="544.6" y2="329.4" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<path d="M150.0 470.0 L544.6 329.4 L544.6 470.0 z" fill="#c0392b" fill-opacity="0.20" stroke="#c0392b" stroke-width="2.6"/>
<line x1="544.6" y1="329.4" x2="576.6" y2="470.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="544.6" y1="470.0" x2="544.6" y2="315.4" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="544.6" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">t_сліп = 207 нс</text>
<text x="552.6" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">24.8 А</text>
<rect x="720.0" y="300.0" width="260.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="850.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Прямокутник — оцінка «I · t»:</tspan><tspan x="850.0" dy="15.6">Q = 24.8 А · 207 нс = 5.1 мкКл</tspan><tspan x="850.0" dy="15.6">ΔV = 10.9 мВ — безпечна стеля</tspan></text>
<rect x="720.0" y="398.0" width="260.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">Трикутник — насправді:</tspan><tspan x="850.0" dy="14.3">Q = ½ · 24.8 А · 207 нс = 2.6 мкКл</tspan><tspan x="850.0" dy="14.3">ΔV = Q / C_шини = 5.5 мВ</tspan></text>
<rect x="60.0" y="524.0" width="880.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="544.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Три чверті бюджету з'їдає затримка компаратора, а не затвор. Струм росте від нуля — заряд під трикутником удвічі менший за оцінку «I · t».</tspan></text>
</svg>