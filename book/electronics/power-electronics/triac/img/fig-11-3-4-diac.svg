<text x="400.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так RC задає кут запуску, а DIAC робить фронт різким і однаковим для обох полярностей — це класична схема димера.</text>
