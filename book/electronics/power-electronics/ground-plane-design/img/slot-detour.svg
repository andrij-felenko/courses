<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розріз у площині роздуває зворотний контур</text>
<rect x="110.0" y="118.0" width="540.0" height="214.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.3"/>
<text x="120.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">площина землі (вид згори)</text>
<rect x="372" y="118" width="16" height="144" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="398.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">розріз</text>
<line x1="150.0" y1="175.0" x2="610.0" y2="175.0" stroke="#b5763a" stroke-width="6.0"/>
<text x="150.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">доріжка (прямий струм →)</text>
<line x1="160.0" y1="198.0" x2="600.0" y2="198.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="150.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">як було б без розрізу — прямо під доріжкою</text>
<line x1="600.0" y1="212.0" x2="392.0" y2="212.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="392.0" y1="212.0" x2="392.0" y2="288.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="392.0" y1="288.0" x2="356.0" y2="288.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="356.0" y1="288.0" x2="356.0" y2="212.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="356.0" y1="212.0" x2="160.0" y2="212.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="232.0" y1="212.0" x2="176.0" y2="212.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="356" y="212" width="36" height="76" fill="#c0392b" fill-opacity="0.16"/>
<text x="230.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">зворот мусить обходити щілину</text>
<text x="374.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">зайва площа</text>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Обхід роздуває контур: площа росте → індуктивність, викид, випромінювання.</text>
</svg>