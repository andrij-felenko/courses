<text x="538.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="538.0" dy="0.0">На вимиканні енергія витоку не має куди</tspan><tspan x="538.0" dy="15.0">перейти в парну обмотку — б'є викидом</tspan><tspan x="538.0" dy="15.0">напруги на ключі. Рятує снабер.</tspan></text>
