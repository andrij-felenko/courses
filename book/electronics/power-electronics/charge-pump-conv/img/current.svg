<text x="440.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен цикл переносить пакет Q = Cf·ΔV; за секунду таких пакетів f</text>
<rect x="70.0" y="320.0" width="740.0" height="56.0" rx="6" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.5"/><text x="440.0" y="344.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Більше струму → потрібен більший Cf або вища частота f, а обидва мають стелю.</tspan><tspan x="440.0" dy="15.6">Тому зарядний насос — для малих струмів (міліампери — сотні мА), не для потужності.</tspan></text>
