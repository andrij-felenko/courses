<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм насоса — це заряд, перенесений пакетами</text>
<line x1="0.0" y1="0.0" x2="0.0" y2="0.0" stroke="#ffffff" stroke-width="1.5"/>
<rect x="70.0" y="50.0" width="740.0" height="34.0" rx="6" fill="#f6f6f6" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="71.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Iвих = Q · f = Cf · ΔV · f   (заряд пакета × кількість пакетів за секунду)</tspan></text>
