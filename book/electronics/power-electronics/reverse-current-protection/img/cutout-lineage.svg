<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1360" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від електромеханічного реле до вбудованого діодного випрямляча</text>
<rect x="210.0" y="34.0" width="940.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="56.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Естафета однобічного клапана: та сама робота —</tspan><tspan x="680.0" dy="18.2">«пускати вперед, тримати назад» — переходить від пружини до кремнію.</tspan></text>
<line x1="80.0" y1="252.0" x2="1300.0" y2="252.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1300.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">час →</text>
<circle cx="170.0" cy="252.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="170.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1880-і–1910-і</text>
<text x="170.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">DC-станції</text>
<line x1="170.0" y1="260.0" x2="170.0" y2="292.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="54.0" y="296.0" width="232.0" height="116.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Батарея «плаває» на шині поряд</tspan><tspan x="170.0" dy="15.6">із динамо. Реле зворотного</tspan><tspan x="170.0" dy="15.6">струму від'єднує її, коли</tspan><tspan x="170.0" dy="15.6">динамо слабшає — щоб вона</tspan><tspan x="170.0" dy="15.6">не крутила його мотором.</tspan></text>
<circle cx="430.0" cy="252.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="430.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1912+</text>
<text x="430.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Автомобіль</text>
<line x1="430.0" y1="260.0" x2="430.0" y2="292.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="314.0" y="296.0" width="232.0" height="116.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="430.0" y="334.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Самопуск Кеттерінга → у</tspan><tspan x="430.0" dy="15.6">кожному авто батарея й динамо.</tspan><tspan x="430.0" dy="15.6">Те саме реле зворотного</tspan><tspan x="430.0" dy="15.6">струму, тепер серійне.</tspan></text>
<circle cx="690.0" cy="252.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="690.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1930-і+</text>
<text x="690.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Три-блоковий регулятор</text>
<line x1="690.0" y1="260.0" x2="690.0" y2="292.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="574.0" y="296.0" width="232.0" height="116.0" rx="6" fill="#eef1f6" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="334.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Регулятор напруги, обмежувач</tspan><tspan x="690.0" dy="15.6">струму й реле зворотного</tspan><tspan x="690.0" dy="15.6">струму в одній коробці:</tspan><tspan x="690.0" dy="15.6">Lucas, Delco-Remy, Bosch.</tspan></text>
<circle cx="950.0" cy="252.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="950.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">~1960-і</text>
<text x="950.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Кремнієвий діод</text>
<line x1="950.0" y1="260.0" x2="950.0" y2="292.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="834.0" y="296.0" width="232.0" height="116.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Один блокувальний діод у</tspan><tspan x="950.0" dy="15.6">розрив дроту — та сама</tspan><tspan x="950.0" dy="15.6">однобічність, але без</tspan><tspan x="950.0" dy="15.6">контактів, що підгоряли</tspan><tspan x="950.0" dy="15.6">й розладнувалися.</tspan></text>
<circle cx="1210.0" cy="252.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="1210.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1960+</text>
<text x="1210.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Генератор змінного струму</text>
<line x1="1210.0" y1="260.0" x2="1210.0" y2="292.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="1094.0" y="296.0" width="232.0" height="116.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1210.0" y="334.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1210.0" dy="0.0">Діодний міст-випрямляч</tspan><tspan x="1210.0" dy="15.6">потрібен усе одно — і він</tspan><tspan x="1210.0" dy="15.6">блокує реверс вбудовано.</tspan><tspan x="1210.0" dy="15.6">Окреме реле зникає само.</tspan></text>
</svg>