<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як контролер читає знак струму: V_ds на відкритому ключі й від'ємний поріг</text>
<line x1="160.0" y1="300.0" x2="722.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="718.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">струм I →</text>
<line x1="430.0" y1="458.5" x2="430.0" y2="143.5" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">V_ds</text>
<text x="581.2" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">+ прямий (норма)</text>
<text x="274.6" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">− реверс</text>
<rect x="325.0" y="167.0" width="105.0" height="266.0" fill="#fdecea" stroke="none"/>
<text x="377.5" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="377.5" dy="0.0">терпимий</tspan><tspan x="377.5" dy="15.0">реверс</tspan><tspan x="377.5" dy="15.0">(ключ ON)</tspan></text>
<line x1="178.0" y1="414.0" x2="682.0" y2="186.0" stroke="#2457d6" stroke-width="3.6"/>
<text x="291.4" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">V_ds = I · R_ds(on)</text>
<line x1="236.8" y1="347.5" x2="442.6" y2="347.5" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="228.4" y="351.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">поріг V_th = −5 мВ</text>
<line x1="325.0" y1="347.5" x2="325.0" y2="300.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 5"/>
<circle cx="325.0" cy="347.5" r="4.6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="325.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">I_поріг = −2.5 А</text>
<line x1="648.4" y1="201.2" x2="686.2" y2="184.1" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="551.8" y="151.5" width="250.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="676.8" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="676.8" dy="0.0">далі — прямий струм:</tspan><tspan x="676.8" dy="15.0">+20 А → +40 мВ</tspan><tspan x="676.8" dy="15.0">(за межами кадру)</tspan></text>
<rect x="694.0" y="274.0" width="250.0" height="68.0" rx="6" fill="#fff7f6" stroke="#c0392b" stroke-width="1.5"/><text x="819.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="819.0" dy="0.0">V_ds перетнув поріг ↓</tspan><tspan x="819.0" dy="15.6">⇒ контролер</tspan><tspan x="819.0" dy="15.6">розмикає ключ</tspan></text>
<rect x="100.0" y="480.0" width="760.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="504.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Затемнення (blanking): рішення компаратора ігнорують t_затемн після кожного фронту напруги —</tspan><tspan x="480.0" dy="15.6">щоб дзвін V_ds не вимкнув живу рейку хибним «реверсом».</tspan></text>
</svg>