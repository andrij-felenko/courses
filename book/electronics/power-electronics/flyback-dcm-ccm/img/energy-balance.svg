<text x="220.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ВХІД: енергія ~ Iпік²  (квадрат!)</text>
