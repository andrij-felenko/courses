<line x1="242.0" y1="244.0" x2="242.0" y2="228.0" stroke="#c0271e" stroke-width="1.4" marker-end="url(#aRed)"/>
<text x="150.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">У мертвий час струм котушки несе вбудований діод нижнього MOSFET</text>
<text x="150.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(короткочасно — тому надовго лишати його не можна: гріється).</text>
<rect x="70.0" y="360.0" width="780.0" height="54.0" rx="8" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="460.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">⚠ Перекриття = наскрізний струм (shoot-through):</text>
<text x="460.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якщо обидва ключі відкриються водночас — це коротке замикання входу на землю крізь них.</text>
<text x="460.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Замалий мертвий час → вигорання; завеликий → зайві втрати на діоді. Драйвер тримає баланс.</text>
