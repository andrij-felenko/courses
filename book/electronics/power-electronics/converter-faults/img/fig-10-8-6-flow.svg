<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Діагностичний потік: від симптому до причини</text>
<rect x="50.0" y="66.0" width="230.0" height="38.0" rx="7" fill="#f6f9fc" stroke="#caa24a" stroke-width="1.8"/>
<text x="66.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Чути свист?</text>
<line x1="286.0" y1="85.0" x2="316.0" y2="85.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="320.0" y="66.0" width="540.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="336.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ глянь режим (PFM?) і кераміку → forced-PWM/інші C</text>
<rect x="50.0" y="116.0" width="230.0" height="38.0" rx="7" fill="#f6f9fc" stroke="#c0271e" stroke-width="1.8"/>
<text x="66.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Дзвенить вихід?</text>
<line x1="286.0" y1="135.0" x2="316.0" y2="135.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="320.0" y="116.0" width="540.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="336.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ стрибок навантаж.: контур (§10.2.5) чи C/ESR</text>
<rect x="50.0" y="166.0" width="230.0" height="38.0" rx="7" fill="#f6f9fc" stroke="#c0271e" stroke-width="1.8"/>
<text x="66.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Імпульси нерівні?</text>
<line x1="286.0" y1="185.0" x2="316.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="320.0" y="166.0" width="540.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="336.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ субгармоніка при D&gt;0.5 → нахилова компенсація</text>
<rect x="50.0" y="216.0" width="230.0" height="38.0" rx="7" fill="#f6f9fc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="66.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Вихід просідає?</text>
<line x1="286.0" y1="235.0" x2="316.0" y2="235.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="320.0" y="216.0" width="540.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="336.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ форма підкаже: ліміт / насичення / DCR / вхід</text>
<rect x="50.0" y="266.0" width="230.0" height="38.0" rx="7" fill="#f6f9fc" stroke="#9b59b6" stroke-width="1.8"/>
<text x="66.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9b59b6" text-anchor="start" font-weight="bold" font-style="normal">Гріється?</text>
<line x1="286.0" y1="285.0" x2="316.0" y2="285.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="320.0" y="266.0" width="540.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="336.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ теплова карта (§10.2.7): втрати чи розведення</text>
<rect x="50.0" y="316.0" width="230.0" height="38.0" rx="7" fill="#f6f9fc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="66.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Не стартує?</text>
<line x1="286.0" y1="335.0" x2="316.0" y2="335.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="320.0" y="316.0" width="540.0" height="38.0" rx="7" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.2"/>
<text x="336.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ інраш / захист / просід входу → м'який старт, Cвх</text>
<rect x="70.0" y="350.0" width="760.0" height="22.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Майже всі хвороби зводяться до вже знайомих причин із цього розділу — діагностика лише читає їхні підписи</text>
</svg>
