<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поєднання: кулонометрія + напруга = найкраще</text>
<rect x="60.0" y="90.0" width="250.0" height="80.0" rx="10" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="185.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Кулонометрія</text>
<text x="185.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">гладко, точно коротко,</text>
<text x="185.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">та повільно дрейфує</text>
<rect x="60.0" y="220.0" width="250.0" height="80.0" rx="10" fill="#f3ecdf" stroke="#caa24a" stroke-width="1.8"/>
<text x="185.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Напруга (у спокої)</text>
<text x="185.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">шумна, та АБСОЛЮТНА —</text>
<text x="185.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не дрейфує</text>
<line x1="310.0" y1="130.0" x2="418.0" y2="175.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="310.0" y1="260.0" x2="418.0" y2="215.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="420.0" y="150.0" width="200.0" height="90.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="520.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПОЄДНАННЯ</text>
<text x="520.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коротко — лічимо заряд,</text>
<text x="520.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">напруга підправляє дрейф</text>
<line x1="620.0" y1="195.0" x2="698.0" y2="195.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<rect x="700.0" y="160.0" width="180.0" height="70.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="790.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">точний SoC</text>
<text x="790.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">стабільний, без дрейфу</text>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кожен спосіб латає ваду іншого: лічильник заряду дає гладкість і коротку точність, напруга — абсолютну прив'язку, що не дає дрейфу</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">накопичитись. Саме так працюють сучасні «паливоміри» (fuel gauge), нерідко ще й з моделлю конкретної комірки всередині.</text>
</svg>
