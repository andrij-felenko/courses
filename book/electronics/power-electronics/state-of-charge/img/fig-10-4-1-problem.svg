<text x="855.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">найкраще на практиці</text>
<rect x="70.0" y="346.0" width="800.0" height="24.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Усе, що видно ззовні, — напруга й струм на клемах. «Паливомір» батареї доводиться РАХУВАТИ з них, і кожен спосіб має свою ваду.</text>
