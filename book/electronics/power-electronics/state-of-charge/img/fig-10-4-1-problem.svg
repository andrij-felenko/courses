<text x="605.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лічи заряд (∫I·dt)</text>
<text x="605.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">точно, та ДРЕЙФУЄ</text>
