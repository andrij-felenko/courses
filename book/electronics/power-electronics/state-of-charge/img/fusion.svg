<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поєднання: лічба тримає гладкість, напруга прибиває дрейф</text>
<rect x="60.0" y="80.0" width="210.0" height="70.0" rx="10" fill="#eef0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="165.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Кулонометрія</text>
<text x="165.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">гладка, точна коротко</text>
<text x="165.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">але дрейфує</text>
<rect x="60.0" y="190.0" width="210.0" height="70.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="165.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Напруга</text>
<text x="165.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">абсолютна прив'язка</text>
<text x="165.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(спокій, край кривої)</text>
<circle cx="370.0" cy="170.0" r="26.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="370.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700">+</text>
<line x1="270.0" y1="115.0" x2="348.0" y2="158.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="270.0" y1="225.0" x2="348.0" y2="184.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="396.0" y1="170.0" x2="470.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="120.0" width="290.0" height="100.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Оцінка SoC</text>
<text x="615.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">точніша за кожен метод окремо</text>
<text x="615.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">так влаштовані мікросхеми-паливоміри</text>
<rect x="60.0" y="280.0" width="700.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="410.0" y="299.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Коротко довіряємо лічбі заряду; напругою (на краях кривої та у спокої)</tspan><tspan x="410.0" dy="13.7">повільно підправляємо її дрейф — м'яко, щоб відсотки не стрибали.</tspan></text>
</svg>