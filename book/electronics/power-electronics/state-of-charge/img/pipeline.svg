<text x="105.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">read_adc()</text>
<line x1="170.0" y1="118.0" x2="210.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="210.0" y="86.0" width="130.0" height="64.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="275.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">− зсув нуля</text>
<text x="275.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">I − I_zero</text>
<line x1="340.0" y1="118.0" x2="380.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="86.0" width="130.0" height="64.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="445.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">інтеграл ×Δt</text>
<text x="445.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q += I·Δt</text>
<line x1="510.0" y1="118.0" x2="550.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="86.0" width="130.0" height="64.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="615.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">накопичувач Q</text>
<text x="615.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">А·с</text>
<line x1="680.0" y1="118.0" x2="700.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="86.0" width="130.0" height="64.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="765.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">SoC</text>
<text x="765.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q / Ємність</text>
<rect x="120.0" y="210.0" width="300.0" height="66.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="270.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Якорі на відомих точках</text>
<text x="270.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">повний → Q=ємність, SoC=100%; відсічка → Q=0</text>
<line x1="270.0" y1="210.0" x2="270.0" y2="152.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="210.0" width="300.0" height="66.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Напруга у спокої</text>
<text x="620.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Q += k·(SoC_v·ємність − Q), м'яка корекція</text>
<line x1="620.0" y1="210.0" x2="620.0" y2="152.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="110.0" y="300.0" width="660.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Без віднімання зсуву АЦП інтеграл повзе навіть без струму; без якорів дрейф росте вічно.</tspan><tspan x="440.0" dy="13.0">Ємність — вивчена (тане з віком), не паспортна.</tspan></text>
</svg>