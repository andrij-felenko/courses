<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Який метод обрати — і три залізні правила</text>
<rect x="60.0" y="70.0" width="230.0" height="130.0" rx="12" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="175.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Похила Li-ion,</text>
<text x="175.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">треба дешево</text>
<line x1="80.0" y1="134.0" x2="270.0" y2="134.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="175.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">напруга у спокої</text>
<text x="175.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">проста оцінка, без чипа</text>
<rect x="360.0" y="70.0" width="230.0" height="130.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="475.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пласка LFP /</text>
<text x="475.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">потрібна точність</text>
<line x1="380.0" y1="134.0" x2="570.0" y2="134.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="475.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">кулонометрія + напруга</text>
<text x="475.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">паливомір (fuel gauge)</text>
<rect x="660.0" y="70.0" width="230.0" height="130.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="775.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Складна система,</text>
<text x="775.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">телеметрія</text>
<line x1="680.0" y1="134.0" x2="870.0" y2="134.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="775.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">паливомір з моделлю</text>
<text x="775.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+ SoH, прогноз часу</text>
<rect x="70.0" y="220.0" width="800.0" height="110.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Три залізні правила паливоміра</text>
<text x="470.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1) перекалібровуй на повному заряді (і на відсічці) — там напруга надійна;</text>
<text x="470.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">2) не вір останнім ~10% — там найбільша невизначеність;</text>
<text x="470.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">3) врахуй, що ємність тане з віком — інакше «100%» старої батареї бреше (про старіння — далі).</text>
</svg>
