<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки лишилось? Батарея не показує сама</text>
<rect x="70.0" y="100.0" width="120.0" height="170.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<rect x="105.0" y="88.0" width="50.0" height="14.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="130.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="66" fill="#6b7280" text-anchor="middle" font-weight="700">?</text>
<text x="130.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">скільки %</text>
<text x="130.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">видно лише V та I</text>
<text x="130.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">на клемах</text>
<line x1="196.0" y1="185.0" x2="246.0" y2="185.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="110.0" width="148.0" height="130.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="344.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Напруга</text>
<text x="344.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">глянь на V → SoC</text>
<text x="344.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">швидко, та бреше</text>
<rect x="462.0" y="110.0" width="148.0" height="130.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="536.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Кулонометрія</text>
<text x="536.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">лічи заряд (∫I·dt)</text>
<text x="536.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">точно, та дрейфує</text>
<rect x="654.0" y="110.0" width="148.0" height="130.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="728.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Поєднання</text>
<text x="728.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">поєднай обидва</text>
<text x="728.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">найкраще на практиці</text>
<rect x="70.0" y="292.0" width="732.0" height="44.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="436.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="436.0" dy="0.0">Усе, що видно ззовні, — напруга й струм на клемах.</tspan><tspan x="436.0" dy="14.3">«Паливомір» батареї доводиться рахувати з них, і кожен спосіб має свою ваду.</tspan></text>
</svg>