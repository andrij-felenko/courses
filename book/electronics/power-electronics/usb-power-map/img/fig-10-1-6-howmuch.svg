<text x="450.0" y="85.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">бачу USB-порт</text>
<line x1="450.0" y1="100.0" x2="160.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="90.0" y="150.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="200.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Старий A/micro?</text>
<text x="200.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ BC1.2: тип порту по D+/D−</text>
<text x="200.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(до 1.5 А) — тема 10.3.5</text>
<line x1="450.0" y1="100.0" x2="440.0" y2="150.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="370.0" y="150.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="480.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Type-C без PD?</text>
<text x="480.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ резистори CC: 5 В, 1.5/3 А</text>
<text x="480.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(до 15 Вт) — тема 10.3.2</text>
