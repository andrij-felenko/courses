<text x="760.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Type-C з PD?</text>
<text x="760.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ переговори: 9/15/20/48 В</text>
<text x="760.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(до 240 Вт) — теми 10.3.3–4</text>
<rect x="70.0" y="356.0" width="760.0" height="32.0" rx="8" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.5"/>
<text x="450.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Перш ніж брати струм, пристрій мусить ЗАПИТАТИ, скільки можна, — інакше або недобере, або перевантажить джерело.</text>
<text x="450.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Три способи спитати (BC1.2 / CC / PD) — три наступні теми розділу. Тут — лише карта, куди дивитись.</text>
