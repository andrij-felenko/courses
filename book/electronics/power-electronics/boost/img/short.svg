<rect x="70.0" y="366.0" width="780.0" height="24.0" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Шлях Vвх → котушка → діод → вихід існує ЗАВЖДИ — його не розриває жоден ключ контролера</tspan></text>
<text x="460.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Тому boost: не вміє Vвих &lt; Vвх · не гасить КЗ вимиканням ключа · б'є інрашем при старті</text>
<text x="460.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Контролер тут безсилий — захист має стояти ОКРЕМО</text>
