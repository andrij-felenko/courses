<rect x="59.5" y="276.8" width="741.0" height="46.5" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/><text x="430.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">ІНТЕРЛОК: ключ-джерело і ключ-стік НІКОЛИ не відкриті разом —</tspan><tspan x="430.0" dy="15.0">інакше вхід замкне на вихід (наскрізний струм). Спершу закрий обидва, витримай мертвий час, тоді відкрий один.</tspan></text>
<rect x="59.5" y="340.5" width="741.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Кожен бік — ПАРА транзисторів: у закритому стані їхні body-діоди дивляться назустріч і глушать струм в обидва боки.</tspan></text>
