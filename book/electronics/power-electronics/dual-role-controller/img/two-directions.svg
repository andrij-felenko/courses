<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворольовий порт: одна шина VBUS у два напрями</text>
<rect x="330.0" y="120.0" width="160.0" height="80.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="410.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">USB-C порт</text>
<text x="410.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(шина VBUS)</text>
<rect x="40.0" y="120.0" width="150.0" height="80.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="2.0"/>
<text x="115.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">чуже джерело</text>
<text x="115.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(зарядка, док)</text>
<line x1="196.0" y1="148.0" x2="324.0" y2="148.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="260.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">як СТІК: споживаю</text>
<rect x="630.0" y="120.0" width="150.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="705.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">чужий пристрій</text>
<text x="705.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(телефон)</text>
<line x1="496.0" y1="172.0" x2="624.0" y2="172.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="560.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">як ДЖЕРЕЛО: жену</text>
<rect x="143.5" y="261.2" width="533.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Той самий VBUS — то ВХІД (споживаю чужу напругу), то ВИХІД (жену свою).</tspan><tspan x="410.0" dy="15.6">Контролер вирішує напрям і кидає силові ключі — але по черзі, НІКОЛИ разом.</tspan></text>
</svg>