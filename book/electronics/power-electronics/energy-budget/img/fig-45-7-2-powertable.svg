  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Куди йдуть ватти: мотори майже все</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">у бюджеті потужності зависання моторів домінує; решта — крихти, та теж рахуються</text>
<text x="240" y="90" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">система</text>
<text x="260" y="90" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">потужність →</text>
<text x="240" y="124" font-size="11.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">Мотори (зависання)</text>
<rect x="250" y="104" width="468.0" height="30" rx="4" fill="#0a8f3c" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="726.0" y="125" font-size="11.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">270 Вт</text>
<text x="776.0" y="125" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(90%)</text>
<text x="240" y="168" font-size="11.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">Відеопередавач</text>
<rect x="250" y="148" width="17.333333333333332" height="30" rx="4" fill="#1f4ed8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="275.3333333333333" y="169" font-size="11.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">10 Вт</text>
<text x="325.3333333333333" y="169" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(3%)</text>
<text x="240" y="212" font-size="11.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">Бортовий комп'ютер</text>
<rect x="250" y="192" width="17.333333333333332" height="30" rx="4" fill="#d98a00" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="275.3333333333333" y="213" font-size="11.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">10 Вт</text>
<text x="325.3333333333333" y="213" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(3%)</text>
<text x="240" y="256" font-size="11.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">Серво / підвіс</text>
<rect x="250" y="236" width="12.133333333333333" height="30" rx="4" fill="#9333ea" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="270.1333333333333" y="257" font-size="11.5" fill="#9333ea" text-anchor="start" font-weight="bold" font-style="normal">7 Вт</text>
<text x="320.1333333333333" y="257" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(2%)</text>
<text x="240" y="300" font-size="11.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">ПК + давачі + RX</text>
<rect x="250" y="280" width="5.2" height="30" rx="4" fill="#6b7280" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="263.2" y="301" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">3 Вт</text>
<text x="313.2" y="301" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(1%)</text>
<line x1="250" y1="328" x2="770" y2="328" stroke="#1a1a1a" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="240" y="354" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">РАЗОМ</text>
<text x="250" y="354" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">≈ 300 Вт — це й ділить корисну енергію на час</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Мотори — ~90% витрати, тож час польоту найперше визначає вага й ефективність тяги; решту теж не ігноруй.</text>
