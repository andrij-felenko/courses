<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Кидок струму при під'єднанні батареї — і чому з'являється іскра</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">порожні конденсатори жадібно заряджаються миттєво → величезний пік струму</text>
<line x1="90" y1="330" x2="550" y2="330" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="550" y="348" font-size="10.5" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<line x1="90" y1="330" x2="90" y2="100" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="82" y="106" font-size="10.5" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">струм входу</text>
<line x1="90" y1="330" x2="96" y2="330" stroke="#1a1a1a" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="82" y="334" font-size="9" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">0</text>
<polyline points="94,330 96,120 120,300 170,322 290,324" fill="none" fill-opacity="1.0" stroke="#cc0000" stroke-width="2.6" stroke-linejoin="round"/>
<text x="120" y="110" font-size="10.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">без захисту: величезний пік → ІСКРА</text>
<polyline points="94,330 150,260 250,300 390,322 520,324" fill="none" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="2.6" stroke-linejoin="round"/>
<text x="320" y="270" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">з анти-іскрою: пологий заряд</text>
<rect x="620" y="120" width="310" height="230" rx="12" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="775" y="148" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому й чим лікують</text>
<text x="640" y="176" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Конденсатори на вході (45.2) при</text>
<text x="640" y="195" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вмиканні порожні — і тягнуть струм,</text>
<text x="640" y="214" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">як коротке замикання, аж поки</text>
<text x="640" y="233" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">не зарядяться. Звідси спалах на</text>
<text x="640" y="252" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">контактах роз'єму.</text>
<text x="640" y="271" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="640" y="290" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Лікують резистором передзаряду чи</text>
<text x="640" y="309" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">«анти-іскровим» роз'ємом, що пускає</text>
<text x="640" y="328" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перші струми через опір.</text>
<text x="480.0" y="458" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому LiPo при під'єднанні часто «стріляє» іскрою — і тому серйозні збірки беруть анти-іскрові роз'єми чи м'який старт.</text>
</svg>
