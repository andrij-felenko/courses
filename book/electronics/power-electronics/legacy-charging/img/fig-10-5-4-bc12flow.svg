<text x="460.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">За підсумком пристрій ставить безпечний струм: 0.5/0.9 А для SDP або до 1.5 А для CDP чи DCP.</text>
