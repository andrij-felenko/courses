<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підтяжка задає роль у парі</text>
<rect x="60.0" y="80.0" width="150.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="135.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Rp вгору</text>
<text x="135.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">джерело</tspan><tspan x="135.0" dy="16.2">(DFP, дає)</tspan></text>
<rect x="290.0" y="80.0" width="150.0" height="130.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="2.0"/>
<text x="365.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Rd вниз</text>
<text x="365.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">пристрій</tspan><tspan x="365.0" dy="16.2">(UFP, бере)</tspan></text>
<rect x="520.0" y="80.0" width="150.0" height="130.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="2.0"/>
<text x="595.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Rp ⇄ Rd</text>
<text x="595.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">дворольовий</tspan><tspan x="595.0" dy="16.2">(DRP, чергує)</tspan></text>
<rect x="110.6" y="234.2" width="498.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Роль не зашита в залізо: той самий роз'єм павербанка вранці заряджає</tspan><tspan x="360.0" dy="15.6">телефон, а ввечері заряджається сам — її задає резистор у кожній парі.</tspan></text>
