<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
<rect width="880" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо кабелю чип: VCONN живить e-marker</text>
<rect x="120.0" y="120.0" width="640.0" height="90.0" rx="14" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="440.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">USB-C кабель</text>
<line x1="150.0" y1="165.0" x2="730.0" y2="165.0" stroke="#b5763a" stroke-width="3" stroke-linecap="round"/>
<rect x="400.0" y="145.0" width="80.0" height="44.0" rx="8" fill="#eef3fb" stroke="#1f47b5" stroke-width="2"/>
<text x="440.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">e-marker</text>
<text x="440.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">чип</text>
<line x1="440.0" y1="145.0" x2="440.0" y2="120.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<text x="560.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">живиться від VCONN</text>
<text x="150.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чип каже системі:</text>
<text x="170.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• скільки ампер тримає кабель (3 А чи 5 А)</text>
<text x="170.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• довжину / швидкість даних</text>
<text x="170.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• чи активний (зі своєю електронікою)</text>
<rect x="520.0" y="235.0" width="320.0" height="90.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="680.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Без e-marker:</text>
<text x="540.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">система НЕ дозволить 5 А</text>
<text x="540.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(припустить безпечні 3 А) — звідси</text>
<text x="540.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«чому повільно заряджає цим шнуром»</text>
<rect x="70.0" y="334.0" width="740.0" height="18.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="440.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Повний струм несуть лише кабелі з e-marker; деталі — у темі 10.3.7</text>
</svg>
