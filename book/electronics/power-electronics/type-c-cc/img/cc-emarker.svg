<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незадіяний пін CC стає VCONN — живить чип кабелю</text>
<rect x="250.0" y="90.0" width="220.0" height="110.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="2.0"/>
<text x="360.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">кабель</text>
<rect x="298.7" y="136.2" width="122.6" height="47.6" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">e-marker</tspan><tspan x="360.0" dy="15.6">(чип у штекері)</tspan></text>
<line x1="120.0" y1="145.0" x2="250.0" y2="145.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">VCONN</text>
<text x="60.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(2-й CC)</text>
<line x1="470.0" y1="145.0" x2="660.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">тримає</tspan><tspan x="640.0" dy="14.3">3 чи 5 А</tspan><tspan x="640.0" dy="14.3">довжина,</tspan><tspan x="640.0" dy="14.3">швидкість</tspan></text>
<rect x="148.2" y="234.2" width="423.6" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Без e-marker система не ризикне пустити 5 А — обмежиться 3.</tspan><tspan x="360.0" dy="15.6">Звідси буденне «чому цим шнуром заряджає повільно».</tspan></text>
</svg>