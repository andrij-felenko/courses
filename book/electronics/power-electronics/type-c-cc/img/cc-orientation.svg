<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два піни CC: котрий з'єднаний — той і показує орієнтацію</text>
<rect x="70.0" y="70.0" width="170.0" height="200.0" rx="6" fill="#fbf3f3" stroke="#c0392b" stroke-width="2.0"/>
<text x="155.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">джерело</text>
<rect x="480.0" y="70.0" width="170.0" height="200.0" rx="6" fill="#f0f7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="565.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">пристрій</text>
<line x1="240.0" y1="140.0" x2="480.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="360.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">CC1 — з'єднаний наскрізь (несе Rp/Rd)</text>
<line x1="240.0" y1="215.0" x2="342.0" y2="215.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="5 4"/>
<line x1="378.0" y1="215.0" x2="480.0" y2="215.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="5 4"/>
<text x="360.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">✕</text>
<text x="360.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">CC2 — розірваний → стане VCONN</text>
<rect x="90.1" y="272.2" width="539.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">За тим, який із двох CC «ожив», система впізнає бік штекера й скеровує дані.</tspan><tspan x="360.0" dy="15.6">Живлення (VBUS, земля) симетричне й до повороту байдуже.</tspan></text>
</svg>