<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика дугового розряду та захист через CC</text>
<rect x="45.0" y="50.0" width="365.0" height="355.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="227.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Аварійне розмикання 48 В під 5 А</text>
<rect x="85.0" y="120.0" width="80.0" height="24.0" rx="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="125.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Штекер</text>
<rect x="290.0" y="120.0" width="80.0" height="24.0" rx="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="330.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гніздо</text>
<circle cx="227.0" cy="132.0" r="18.0" fill="#f39c12" stroke="#d35400" stroke-width="2.0"/>
<circle cx="227.0" cy="132.0" r="9.0" fill="#ffffff" stroke="#f1c40f" stroke-width="1.5"/>
<text x="227.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Плазмова дуга (T &gt; 4000 K)</text>
<text x="227.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Мікромісток розплавленого золота/міді</text>
<text x="227.5" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2. Випаровування металу та іонізація повітря</text>
<text x="227.5" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Напруга 48 В перевищує поріг дуги (12 В)</text>
<text x="227.5" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">4. Ерозія золота, нагар, деградація контактів</text>
<text x="227.5" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Без захисту роз'єм руйнується за десятки циклів!</text>
<rect x="450.0" y="50.0" width="365.0" height="355.0" rx="8" fill="#eaf3ea" stroke="#27ae60" stroke-width="2.0"/>
<text x="632.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Захист: CC рветься першим</text>
<line x1="480.0" y1="135.0" x2="785.0" y2="135.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="790.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">t</text>
<line x1="490.0" y1="120.0" x2="590.0" y2="120.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="590.0" y1="120.0" x2="590.0" y2="135.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="540.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">CC розімкнувся</text>
<line x1="490.0" y1="180.0" x2="620.0" y2="180.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="620.0" y1="180.0" x2="640.0" y2="200.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="640.0" y1="200.0" x2="775.0" y2="200.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="540.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ключ розімкнув струм</text>
<line x1="690.0" y1="145.0" x2="690.0" y2="220.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="690.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Механічний розрив VBUS (t &gt; 1 мс)</text>
<text x="632.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1. CC коротший на 0.4 мм → втрата контакту</text>
<text x="632.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. PD контролер закриває MOSFET за &lt; 500 мкс</text>
<text x="632.5" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. До розриву пінів VBUS струм дорівнює 0 А</text>
<text x="632.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Дуговий розряд відсутній, контакти цілі</text>
<rect x="33.1" y="419.0" width="793.8" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Гаряче висмикування на 48 В гаситься електронно: лінія CC відключає навантаження раніше за піни живлення</tspan></text>
</svg>