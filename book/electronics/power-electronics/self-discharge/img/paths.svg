<text x="470.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">①</text>
<text x="496.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">побічні хімічні реакції на електродах — тихо «спалюють» активну речовину</text>
<text x="470.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">②</text>
<text x="496.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">мікрокоротке крізь металеву домішку в сепараторі — електрони навпростець</text>
<text x="470.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">③</text>
<text x="496.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">поверхневий витік по вологій/брудній поверхні — зазвичай дрібний</text>
<rect x="210.6" y="417.9" width="486.8" height="44.1" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="454.0" y="436.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">у реальній комірці заряд саджається зсередини трьома шляхами; ① і ② — головні.</tspan><tspan x="454.0" dy="13.7">хімічні реакції (①) частково незворотні — це водночас старіння комірки.</tspan></text>
