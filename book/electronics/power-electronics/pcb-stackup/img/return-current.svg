<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зворотний струм іде під доріжкою — якщо опора суцільна</text>
<line x1="60.0" y1="90.0" x2="360.0" y2="90.0" stroke="#caa24a" stroke-width="5.0"/>
<text x="60.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="700">доріжка сигналу (L1)</text>
<rect x="60.0" y="150.0" width="300.0" height="20.0" rx="2" fill="#e8c9a3" stroke="#b5763a" stroke-width="1.3"/>
<text x="60.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">GND (L2)</text>
<line x1="210.0" y1="150.0" x2="210.0" y2="150.0" stroke="#27ae60" stroke-width="1.5"/>
<path d="M 340 150 L 80 150" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">зворот тулиться під доріжкою → мала петля</text>
<line x1="400.0" y1="70.0" x2="400.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="420.0" y1="90.0" x2="720.0" y2="90.0" stroke="#caa24a" stroke-width="5.0"/>
<text x="420.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="start" font-weight="700">доріжка сигналу (L1)</text>
<rect x="420.0" y="150.0" width="130.0" height="20.0" rx="2" fill="#e8c9a3" stroke="#b5763a" stroke-width="1.3"/>
<rect x="590.0" y="150.0" width="130.0" height="20.0" rx="2" fill="#e8c9a3" stroke="#b5763a" stroke-width="1.3"/>
<text x="570.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">щілина</text>
<text x="420.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">GND (L2)</text>
<path d="M 700 150 L 595 150 L 570 220 L 440 150" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="570.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">обхід щілини → величезна петля, дзвін, завади</text>
<text x="210.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">суцільна опора</text>
<text x="570.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">розрізана опора</text>
</svg>