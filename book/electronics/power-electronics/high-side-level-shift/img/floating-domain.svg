<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві опори напруги на одному кристалі</text>
<rect x="36.0" y="60.0" width="748.0" height="330.0" rx="14" fill="#fbfbfd" stroke="#6b7280" stroke-width="1.5"/>
<text x="410.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">одна кремнієва підкладка</text>
<rect x="74.0" y="130.0" width="214.0" height="96.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="181.0" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="181.0" dy="0.0">Логіка нижнього боку</tspan><tspan x="181.0" dy="16.9">опора — земля (COM)</tspan><tspan x="181.0" dy="16.9">0 … +12 В</tspan></text>
<line x1="74.0" y1="300.0" x2="288.0" y2="300.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="181.0" y1="226.0" x2="181.0" y2="300.0" stroke="#333333" stroke-width="1.4"/>
<text x="181.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">нерухома земля ≈ 0 В</text>
<rect x="340.0" y="138.0" width="140.0" height="80.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Прилад</tspan><tspan x="410.0" dy="18.2">зсуву рівня</tspan></text>
<text x="410.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">блокує всю шину Vбус</text>
<line x1="288.0" y1="172.0" x2="338.0" y2="172.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="482.0" y1="172.0" x2="532.0" y2="172.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="410.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">команда «відкрий / закрий»</text>
<rect x="534.0" y="130.0" width="214.0" height="96.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="641.0" y="165.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="641.0" dy="0.0">Плаваючий домен</tspan><tspan x="641.0" dy="16.9">опора — вузол SW</tspan><tspan x="641.0" dy="16.9">живлення VB − VS</tspan></text>
<line x1="620.0" y1="250.0" x2="748.0" y2="250.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="684.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">VB = Vбус + 12</text>
<line x1="620.0" y1="300.0" x2="748.0" y2="300.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="684.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">VS = SW: 0 → Vбус</text>
<line x1="700.0" y1="250.0" x2="700.0" y2="268.0" stroke="#333333" stroke-width="1.4"/>
<line x1="688.0" y1="268.0" x2="712.0" y2="268.0" stroke="#333333" stroke-width="2.0"/>
<line x1="688.0" y1="276.0" x2="712.0" y2="276.0" stroke="#333333" stroke-width="2.0"/>
<line x1="700.0" y1="276.0" x2="700.0" y2="300.0" stroke="#333333" stroke-width="1.4"/>
<text x="740.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Cbs</text>
<line x1="600.0" y1="300.0" x2="600.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="600.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">весь домен
злітає з SW</text>
<rect x="300.0" y="356.0" width="220.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="374.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">місток — лише прилад зсуву рівня</tspan></text>
</svg>