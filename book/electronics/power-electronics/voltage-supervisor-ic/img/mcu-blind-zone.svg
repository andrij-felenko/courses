<text x="420.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Внутрішній BOD живиться від падаючої VDD і втрачає силу нижче 1.2 В. Зовнішній супервізор тримає 0 В надійно.</text>
