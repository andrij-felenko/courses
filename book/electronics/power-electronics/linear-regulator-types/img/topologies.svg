<rect x="64.0" y="369.4" width="232.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">dropout = Vбе + Vнас</tspan><tspan x="180.0" dy="14.3">≈ 1.1 В (2 В у дарлінгтона)</tspan></text>
