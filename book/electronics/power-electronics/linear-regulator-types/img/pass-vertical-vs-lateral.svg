<text x="605.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Вертикальний NPN</text>
<rect x="600.0" y="178.0" width="430.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Базу задає РІЗНИЦЯ ГЛИБИН двох дифузій,</tspan><tspan x="815.0" dy="16.9">а глибину тримає час і температура в печі:</tspan><tspan x="815.0" dy="16.9">Wб — частки мікрона.   β ≈ 200…500.</tspan></text>
