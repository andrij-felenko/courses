<text x="605.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Бічний PNP</text>
<rect x="600.0" y="358.0" width="430.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Базу задає ЗАЗОР МІЖ ВІКНАМИ МАСКИ,</tspan><tspan x="815.0" dy="16.9">а зазор тримає роздільність фотолітографії:</tspan><tspan x="815.0" dy="16.9">у 1969-му — десятки мікронів.   β ≈ 10…50.</tspan></text>
<rect x="60.0" y="460.0" width="970.0" height="84.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="488.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">Піч тримала глибину дифузії з точністю до часток мікрона; фотолітографія тих років різала вікна десятками мікронів.</tspan><tspan x="545.0" dy="18.2">Тож база бічного PNP виходила на один-два порядки ширша за базу вертикального NPN — а з нею падало і β, і швидкодія.</tspan><tspan x="545.0" dy="18.2">Прохідний елемент 1969 року не обирали: на кристалі був рівно один транзистор, здатний тягнути ампер.</tspan></text>
</svg>