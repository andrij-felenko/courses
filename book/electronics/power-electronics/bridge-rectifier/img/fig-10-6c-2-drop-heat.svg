<text x="600.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">+ кидок при ввімкненні: розряджений</text>
<text x="600.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">конденсатор = коротке → пік I_FSM</text>
<text x="420.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Два діоди замість одного: удвічі більша втрата напруги й удвічі більше тепла, ніж у однопівперіодного.</text>
