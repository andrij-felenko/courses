<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий дільник, дві задачі: увімкнення й вимкнення</text>
<line x1="118.0" y1="80.0" x2="262.0" y2="80.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="190.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_in (жива шина)</text>
<line x1="190.0" y1="80.0" x2="190.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="168.0" y="110.0" width="44.0" height="46.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="190.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R1</text>
<line x1="190.0" y1="156.0" x2="190.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="190.0" cy="210.0" r="3.6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="202.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">вузол EN (v)</text>
<rect x="168.0" y="242.0" width="44.0" height="46.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="190.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R2</text>
<line x1="190.0" y1="210.0" x2="190.0" y2="242.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="190.0" y1="288.0" x2="190.0" y2="324.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="172.0" y1="324.0" x2="208.0" y2="324.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="179.0" y1="330.0" x2="201.0" y2="330.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="186.0" y1="336.0" x2="194.0" y2="336.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="190.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND</text>
<line x1="190.0" y1="210.0" x2="264.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="270.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">спрацьовує коли</text>
<text x="270.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b46c1" text-anchor="start" font-weight="700">v = Uref ≈ 1.2 В</text>
<circle cx="112.0" cy="210.0" r="16.0" fill="#fff6e6" stroke="#b5732e" stroke-width="1.8"/>
<line x1="112.0" y1="201.0" x2="112.0" y2="219.0" stroke="#b5732e" stroke-width="1.6"/>
<line x1="112.0" y1="201.0" x2="108.0" y2="207.0" stroke="#b5732e" stroke-width="1.6"/>
<line x1="112.0" y1="201.0" x2="116.0" y2="207.0" stroke="#b5732e" stroke-width="1.6"/>
<line x1="128.0" y1="210.0" x2="186.0" y2="210.0" stroke="#b5732e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="112.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b5732e" text-anchor="middle" font-weight="700">I_hys</text>
<text x="108.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b5732e" text-anchor="middle">тільки коли</text>
<text x="108.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b5732e" text-anchor="middle" font-weight="700">вихід ON</text>
<rect x="477.9" y="88.3" width="284.2" height="63.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="620.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Вихід OFF — чекаємо старту (I_hys нема):</tspan><tspan x="620.0" dy="15.0">(V_in − Uref) / R1  =  Uref / R2</tspan><tspan x="620.0" dy="15.0">⟹  V_увімк = Uref · (1 + R1/R2)</tspan></text>
<rect x="481.2" y="200.3" width="277.6" height="63.4" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="620.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Вихід ON — уже працює (+I_hys у вузол):</tspan><tspan x="620.0" dy="15.0">(V_in − Uref) / R1 + I_hys = Uref / R2</tspan><tspan x="620.0" dy="15.0">⟹  V_вимк = V_увімк − I_hys · R1</tspan></text>
<rect x="425.9" y="311.8" width="388.2" height="36.5" rx="6" fill="#fff6e6" stroke="#b5732e" stroke-width="1.8"/><text x="620.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5522" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">гістерезис:  ΔV = V_увімк − V_вимк = I_hys · R1</tspan></text>
<text x="430.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Різниця між станами — один доданок I_hys·R1. Він і зсуває нижній поріг униз від верхнього.</text>
</svg>