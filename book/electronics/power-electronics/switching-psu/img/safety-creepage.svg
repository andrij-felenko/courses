<text x="440.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Creepage ≥ 6.4–8.0 мм (поверхня)</text>
<text x="440.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Проріз у склотекстоліті перешкоджає утворенню струмопровідних містків від пилу та вологи (CTI),</text>
