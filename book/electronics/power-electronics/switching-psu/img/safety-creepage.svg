<text x="440.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Clearance ≥ 4.0–5.0 мм (по повітрю)</text>
