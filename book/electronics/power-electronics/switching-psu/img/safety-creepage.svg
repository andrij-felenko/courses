<text x="230.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПЕРВИННА ЗОНА (325–400 В)</text>
<text x="650.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ВТОРИННА ЗОНА (SELV &lt; 60 В)</text>
