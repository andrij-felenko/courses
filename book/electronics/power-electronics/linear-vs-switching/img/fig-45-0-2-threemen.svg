<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490"
     viewBox="0 0 980 490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="490" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Три внески, три лауреати: як збирали літій-іонний акумулятор</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">кожен додав свою цеглинку — Нобелівська премія з хімії 2019 на трьох</text>
<rect x="40" y="96" width="200" height="220" rx="12" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="140" y="124" font-size="14" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Віттінгем</text>
<text x="140" y="144" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Exxon, ~1976</text>
<text x="54" y="172" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">катод TiS₂ + анод</text>
<text x="54" y="190" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">із літій-металу;</text>
<text x="54" y="208" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перший перезаряджуваний,</text>
<text x="54" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">але ~2 В і НЕБЕЗПЕЧНИЙ</text>
<text x="54" y="244" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(літій-метал → пожежі)</text>
<rect x="290" y="96" width="200" height="220" rx="12" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="390" y="124" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Гуденаф</text>
<text x="390" y="144" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Oxford, 1980</text>
<text x="304" y="172" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">катод LiCoO₂</text>
<text x="304" y="190" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ ПОДВОЇВ напругу</text>
<text x="304" y="208" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">до ~4 В:</text>
<text x="304" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">удвічі більше енергії</text>
<rect x="540" y="96" width="200" height="220" rx="12" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="640" y="124" font-size="14" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Йосіно</text>
<text x="640" y="144" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1985</text>
<text x="554" y="172" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">анод із вуглецю (графіт)</text>
<text x="554" y="190" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">замість літій-металу</text>
<text x="554" y="208" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ БЕЗПЕЧНО;</text>
<text x="554" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перший придатний Li-ion</text>
<rect x="790" y="96" width="200" height="220" rx="12" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="890" y="124" font-size="14" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Sony</text>
<text x="890" y="144" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1991</text>
<text x="804" y="172" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">перший КОМЕРЦІЙНИЙ</text>
<text x="804" y="190" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">літій-іонний акумулятор</text>
<text x="804" y="208" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ бум телефонів,</text>
<text x="804" y="226" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ноутбуків, дронів</text>
<line x1="240" y1="206" x2="290" y2="206" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="490" y1="206" x2="540" y2="206" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="740" y1="206" x2="790" y2="206" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="120" y="350" width="740" height="64" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="140" y="376" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Урок історії: великий винахід — це РЕЛЕ внесків, а не осяяння одинака.</text>
<text x="140" y="398" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">А Джон Гуденаф отримав Нобеля у 97 років — найстарший лауреат в історії.</text>
<text x="490.0" y="476" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Небезпечний літій-метал → потужний катод → безпечний вуглецевий анод → товар. Без усіх трьох не було б ні телефона, ні дрона.</text>
</svg>
