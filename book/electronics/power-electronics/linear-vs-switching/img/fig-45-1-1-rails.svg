<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Одна батарея — багато напруг: навіщо перетворювачі</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">батарея дає одну напругу (та ще й плавну); апарату треба кілька стабільних</text>
<rect x="50" y="170" width="180" height="130" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="140" y="206" font-size="14" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Батарея 4S</text>
<text x="140" y="230" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">~14.8 В</text>
<text x="140" y="252" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(12–16.8 В</text>
<text x="140" y="268" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">під час розряду)</text>
<line x1="230" y1="200" x2="600" y2="130" stroke="#cc0000" stroke-width="2.2" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="108" width="310" height="48" rx="9" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="616" y="130" font-size="12" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">Мотори / ESC: сира батарея</text>
<text x="616" y="148" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">(потужно, напруга може плавати)</text>
<rect x="320" y="200" width="160" height="120" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="400" y="250" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Перетворювачі</text>
<text x="400" y="270" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">напруги</text>
<line x1="230" y1="250" x2="318" y2="250" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="480" y1="260" x2="600" y2="204" stroke="#1f4ed8" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="190" width="310" height="40" rx="9" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="616" y="216" font-size="13" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">5 В</text>
<text x="680" y="216" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">— логіка / контролер</text>
<line x1="480" y1="260" x2="600" y2="264" stroke="#0a8f3c" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="250" width="310" height="40" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="616" y="276" font-size="13" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">3.3 В</text>
<text x="680" y="276" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">— давачі (чисто!)</text>
<line x1="480" y1="260" x2="600" y2="324" stroke="#d98a00" stroke-width="1.8" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="310" width="310" height="40" rx="9" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="616" y="336" font-size="13" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">12 В</text>
<text x="680" y="336" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">— камера / підвіс</text>
<text x="480.0" y="454" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Кожна шина — окремий перетворювач. Питання лише ЯК перетворювати: спалюючи зайве в тепло чи переносячи енергію ощадно.</text>
</svg>
