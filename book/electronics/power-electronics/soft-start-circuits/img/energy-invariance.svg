<text x="128.0" y="160.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">пік V·Iкид</text>
<polygon points="110.0,440.0 110.0,343.7 479.0,440.0" fill="#2457d6" fill-opacity="0.13" stroke="none"/>
<polyline points="110.0,343.7 479.0,440.0" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="353.5" y="333.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">повільний фронт</text>
<rect x="160.2" y="492.0" width="334.6" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="327.5" y="512.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="327.5" dy="0.0">різні пік і тривалість — площа та сама  ½·C·V²</tspan></text>
<text x="870.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">На вольт виходу: та сама пряма</text>
<line x1="650.0" y1="440.0" x2="1096.0" y2="440.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="650.0" y1="440.0" x2="650.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1094.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Vвих  (0 → V)</text>
<text x="658.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">dW/dVвих = C·(V − Vвих)</text>
<polygon points="650.0,440.0 650.0,132.0 1050.0,440.0" fill="#27ae60" fill-opacity="0.16" stroke="none"/>
<polyline points="650.0,132.0 1050.0,440.0" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<text x="640.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">C·V</text>
<text x="1050.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V</text>
<text x="772.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">площа = ½·C·V²</text>
<rect x="640.0" y="492.0" width="460.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="870.0" y="512.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">dVвих/dt тут не з'являється — площа та сама за будь-якого фронту</tspan></text>
</svg>