<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзистор з'їдає ½·C·V² незалежно від форми фронту</text>
<line x1="597.0" y1="92.0" x2="597.0" y2="470.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 7"/>
<text x="327.5" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">У часі: форма фронту різна</text>
<line x1="110.0" y1="440.0" x2="551.0" y2="440.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="110.0" y1="440.0" x2="110.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="549.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">час t</text>
<text x="118.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">P на транзисторі</text>
<polygon points="110.0,440.0 110.0,151.1 233.0,440.0" fill="#c0392b" fill-opacity="0.20" stroke="none"/>
