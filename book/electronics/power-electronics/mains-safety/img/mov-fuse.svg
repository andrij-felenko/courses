<text x="200.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ловить коротке замикання</tspan><tspan x="200.0" dy="13.0">і перевантаження</tspan></text>
