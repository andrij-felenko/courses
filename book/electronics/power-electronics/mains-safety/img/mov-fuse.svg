<text x="650.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle"><tspan x="650.0" dy="0.0">кидок 1000+ В →</tspan><tspan x="650.0" dy="12.2">опір падає →</tspan><tspan x="650.0" dy="12.2">поглинає</tspan></text>
