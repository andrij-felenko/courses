<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="496" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок дій після появи VBUS</text>
<line x1="184.9" y1="156.0" x2="261.2" y2="156.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="223.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">VBUS &gt; 4.4 В</text>
<line x1="438.8" y1="156.0" x2="493.2" y2="156.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="466.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">лінії вільні</text>
<line x1="670.8" y1="156.0" x2="718.1" y2="156.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="694.5" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">клас відомий</text>
<rect x="85.1" y="126.1" width="93.8" height="59.8" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="132.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.0" dy="0.0">від'єднано</tspan><tspan x="132.0" dy="13.7">VBUS &lt; 4.0 В</tspan><tspan x="132.0" dy="13.7">ліміт 0</tspan></text>
<rect x="267.2" y="126.1" width="165.6" height="59.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="350.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">улягання, 100 мс</tspan><tspan x="350.0" dy="13.7">PHY геть, піни аналогові</tspan><tspan x="350.0" dy="13.7">ліміт 100 мА</tspan></text>
<rect x="499.2" y="126.1" width="165.6" height="59.8" rx="6" fill="#f2ecf8" stroke="#7a4fb0" stroke-width="1.8"/><text x="582.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="582.0" dy="0.0">читання</tspan><tspan x="582.0" dy="13.7">239.5 такту, медіана з 5</tspan><tspan x="582.0" dy="13.7">D+ і D−</tspan></text>
<rect x="724.1" y="126.1" width="123.7" height="59.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="786.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="786.0" dy="0.0">засув</tspan><tspan x="786.0" dy="13.7">ліміт виставлено</tspan><tspan x="786.0" dy="13.7">більше не читаємо</tspan></text>
<text x="450.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700">єдиний шанс прочитати дільник — ось тут, до будь-якої проби</text>
<line x1="582.0" y1="202.0" x2="582.0" y2="274.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="596.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">якщо клас не впізнано — можна спробувати BC1.2,</text>
<text x="596.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">але назад дороги вже нема:</text>
<line x1="286.3" y1="300.0" x2="601.7" y2="300.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="444.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">BC1.2-проба: D+ ← 0.6 В</text>
<line x1="601.7" y1="330.0" x2="286.3" y2="330.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="444.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">лише коли D+ провисне нижче 330 мВ</text>
<rect x="172.7" y="284.1" width="106.6" height="59.8" rx="6" fill="#f2ecf8" stroke="#7a4fb0" stroke-width="1.8"/><text x="226.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="226.0" dy="0.0">блок у режимі</tspan><tspan x="226.0" dy="13.7">дільника</tspan><tspan x="226.0" dy="13.7">2.7 В / 2.0 В</tspan></text>
<rect x="608.7" y="284.1" width="106.6" height="59.8" rx="6" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.8"/><text x="662.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8901f" text-anchor="middle" font-weight="700"><tspan x="662.0" dy="0.0">блок у режимі</tspan><tspan x="662.0" dy="13.7">замикання</tspan><tspan x="662.0" dy="13.7">підпису НЕМА</tspan></text>
<rect x="159.9" y="432.5" width="580.3" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="450.0" y="449.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">спершу дільник, потім BC1.2 — ніколи навпаки: проба стирає підпис, який ви ще не прочитали</tspan></text>
</svg>