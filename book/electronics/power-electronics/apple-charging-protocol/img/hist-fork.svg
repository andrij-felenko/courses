<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому набір підписався слабшим, ніж міг би збрехати</text>
<rect x="284.4" y="37.9" width="371.2" height="56.2" rx="6" fill="#fdf6e3" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="61.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Серпень 2010: код на 1 А вже розгаданий.</tspan><tspan x="470.0" dy="18.2">Що написати на лініях власного набору?</tspan></text>
<line x1="470.0" y1="96.0" x2="250.0" y2="142.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="150.0" width="380.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="250.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Написати 2.8/2.0 — «я на 1 А»</tspan></text>
<line x1="250.0" y1="202.0" x2="250.0" y2="224.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="226.0" width="380.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="250.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">iPhone повірить і візьме цілий ампер</tspan></text>
<line x1="250.0" y1="278.0" x2="250.0" y2="300.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="302.0" width="380.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="250.0" y="332.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">але LT1302-5 віддає щонайбільше 600 мА</tspan></text>
<line x1="250.0" y1="354.0" x2="250.0" y2="376.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="378.0" width="380.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="250.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">дві пальчикові просідають, VBUS падає</tspan></text>
<line x1="250.0" y1="430.0" x2="250.0" y2="452.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="454.0" width="380.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="250.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">підпис зникає → відкат → знову бере → цикл</tspan></text>
<line x1="470.0" y1="96.0" x2="690.0" y2="142.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="150.0" width="380.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="690.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Написати 2.0/2.0 — «я на 0.5 А»</tspan></text>
<line x1="690.0" y1="202.0" x2="690.0" y2="224.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="226.0" width="380.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="690.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">iPhone візьме рівно пів ампера</tspan></text>
<line x1="690.0" y1="278.0" x2="690.0" y2="300.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="302.0" width="380.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="690.0" y="332.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">LT1302-5 тримає це з добрим запасом</tspan></text>
<line x1="690.0" y1="354.0" x2="690.0" y2="376.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="378.0" width="380.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="690.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">VBUS стоїть, підпис лишається читним</tspan></text>
<line x1="690.0" y1="430.0" x2="690.0" y2="452.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="454.0" width="380.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="690.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">заряджає — повільніше, зате завжди</tspan></text>
</svg>