<rect x="70.0" y="244.0" width="880.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="260.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">PFC відповідає за ФОРМУ вхідного струму (щоб мережа бачила майже резистор), а не за якість виходу —</tspan><tspan x="510.0" dy="14.3">точну, розв'язану від мережі напругу робить уже наступний DC-DC каскад. Ролі не плутати.</tspan></text>
