<rect x="70.0" y="382.0" width="840.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Спершу — ДІАГНОЗ, тоді лік. Конденсатор прибирає ЗСУВ (тягне протилежний реактивний струм),</tspan><tspan x="490.0" dy="15.0">але проти СПОТВОРЕННЯ форми він безсилий: там треба перемалювати сам струм — дроселем або активним PFC.</tspan><tspan x="490.0" dy="15.0">Той самий присуд «PF = 0.6» означає різні поломки з різними інструментами — сплутати їх найдорожче.</tspan></text>
</svg>