<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рукостискання HVDCP</text>
<rect x="75.0" y="53.8" width="350.0" height="48.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="250.0" y="74.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">VBUS = 5 В · за BC1.2 це DCP</tspan><tspan x="250.0" dy="15.0">(D+ замкнено на D− усередині блока)</tspan></text>
<line x1="250.0" y1="116.0" x2="250.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="75.0" y="153.8" width="350.0" height="48.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="250.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">пристрій кладе на D+ 0.6 В</tspan><tspan x="250.0" dy="15.0">і НЕ відпускає</tspan></text>
<line x1="250.0" y1="216.0" x2="250.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="75.0" y="259.8" width="350.0" height="48.5" rx="6" fill="#f2ecf8" stroke="#7a4fb0" stroke-width="1.6"/><text x="250.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">блок розмикає перемичку D+/D−</tspan><tspan x="250.0" dy="15.0">і тягне D− донизу через ≈20 кОм</tspan></text>
<line x1="250.0" y1="322.0" x2="250.0" y2="358.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="75.0" y="363.8" width="350.0" height="48.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="250.0" y="384.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">D− упала нижче 0.325 В →</tspan><tspan x="250.0" dy="15.0">блок уміє Quick Charge</tspan></text>
<line x1="250.0" y1="424.0" x2="250.0" y2="456.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="75.0" y="465.2" width="350.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="250.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">пристрій виставляє код → VBUS росте</tspan></text>
<rect x="515.2" y="143.3" width="209.5" height="69.4" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/><text x="620.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">≥ 1.25 с утримання</tspan><tspan x="620.0" dy="13.7">(типово 1250 мс, межі 1000–1500)</tspan><tspan x="620.0" dy="13.7">стільки не протримається</tspan><tspan x="620.0" dy="13.7">жоден випадковий стан ліній</tspan></text>
<rect x="533.2" y="360.1" width="173.6" height="55.8" rx="6" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.2"/><text x="620.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">якщо D− лишилась високою —</tspan><tspan x="620.0" dy="13.7">це звичайний DCP:</tspan><tspan x="620.0" dy="13.7">5 В, і по тому</tspan></text>
<text x="452.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">перемикання — через 20–60 мс</text>
</svg>