<line x1="100.0" y1="140.0" x2="480.0" y2="140.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="480.0" y1="140.0" x2="480.0" y2="360.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="480.0" cy="360.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="480.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Імакс = Ікз</text>
<text x="480.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(1.5 А)</text>
