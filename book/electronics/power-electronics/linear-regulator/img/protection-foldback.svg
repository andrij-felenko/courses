<text x="488.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Іколіна (1.5 А)</text>
<text x="200.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ікз (0.3 А)</text>
<text x="200.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Foldback)</text>
<rect x="610.0" y="80.0" width="340.0" height="160.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="780.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Стандартне обмеження (червоний пунктир)</text>
<rect x="625.0" y="120.0" width="310.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">• Струм КЗ дорівнює максимальному: Ікз = 1.5 А</tspan><tspan x="780.0" dy="14.3">• Розсіювання потужності в КЗ:</tspan><tspan x="780.0" dy="14.3">  Ркз = Vвх · Імакс = 15 В · 1.5 А = 22.5 Вт</tspan><tspan x="780.0" dy="14.3">• Наслідок: затяжне КЗ руйнує кристал</tspan></text>
<rect x="610.0" y="260.0" width="340.0" height="170.0" rx="8" fill="#eef3fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="780.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Захист Foldback (синя лінія)</text>
<rect x="625.0" y="300.0" width="310.0" height="115.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">• Зі спадом Vвих струм зменшується до Ікз = 0.3 А</tspan><tspan x="780.0" dy="13.0">• Розсіювання потужності в КЗ:</tspan><tspan x="780.0" dy="13.0">  Ркз = Vвх · Ікз = 15 В · 0.3 А = 4.5 Вт</tspan><tspan x="780.0" dy="13.0">• Наслідок: потужність падає у 5 разів, кристал</tspan><tspan x="780.0" dy="13.0">  лишається в безпечній зоні (SOA)</tspan></text>
</svg>