<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="76.8" width="440.0" height="106.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="240.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Третя обмотка (Tertiary)</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">• Обмотка Nr + діод Dr повертають енергію у Vin</tspan><tspan x="240.0" dy="14.3">• Vds(max) = 2 · Vin (при Nr = Np)</tspan><tspan x="240.0" dy="14.3">• Жорстке обмеження: D &lt; 0.5</tspan><tspan x="240.0" dy="14.3">• Класичне просте рішення без втрат тепла</tspan></text>
<rect x="500.0" y="76.8" width="440.0" height="106.5" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="2.0"/><text x="720.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">2. RCD-кламп розмагнічування</tspan><tspan x="720.0" dy="14.3"></tspan><tspan x="720.0" dy="14.3">• Енергія Lm гаситься в тепло на резисторі R</tspan><tspan x="720.0" dy="14.3">• Vds(max) = Vin + Vclamp (може бути &gt; 2 Vin)</tspan><tspan x="720.0" dy="14.3">• Дозволяє D &gt; 0.5 завдяки швидшому спаду</tspan><tspan x="720.0" dy="14.3">• Постійні втрати потужності (низький ККД)</tspan></text>
<rect x="20.0" y="306.8" width="440.0" height="106.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="240.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">3. Двотранзисторний (Two-Switch)</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">• 2 ключі (верхній і нижній) + 2 діоди скидання</tspan><tspan x="240.0" dy="14.3">• Vds(max) = РІВНО Vin на кожному ключі!</tspan><tspan x="240.0" dy="14.3">• Енергія витоку повертається без викидів</tspan><tspan x="240.0" dy="14.3">• D &lt; 0.5; потрібен плаваючий драйвер</tspan></text>
<rect x="500.0" y="306.8" width="440.0" height="106.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="720.0" y="328.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">4. Активний кламп (Active Clamp)</tspan><tspan x="720.0" dy="14.3"></tspan><tspan x="720.0" dy="14.3">• Допоміжний MOSFET Qaux + конденсатор Cclamp</tspan><tspan x="720.0" dy="14.3">• Повна рекуперація енергії намагнічування</tspan><tspan x="720.0" dy="14.3">• М'яке перемикання (ZVS) транзисторів</tspan><tspan x="720.0" dy="14.3">• Дозволяє D &gt; 0.5 (до 0.7); висока складність</tspan></text>
</svg>