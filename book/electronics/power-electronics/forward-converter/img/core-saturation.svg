<text x="285.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Робочий розмах ΔB
(з поверненням у 0)</text>
<path d="M 225 220 Q 280 180 330 150 Q 360 125 385 110 L 400 108" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="330.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Дисбаланс: звалювання в Bsat!</text>
<rect x="450.0" y="20.0" width="430.0" height="380.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="665.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ланцюгова реакція руйнування</text>
<rect x="502.2" y="66.3" width="325.5" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. Неповне розмагнічування</tspan><tspan x="665.0" dy="14.3">Залишковий потік Φ0 зростає щоциклу (flux walking)</tspan></text>
<rect x="524.2" y="128.3" width="281.6" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="143.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. Досягнення порогу Bsat</tspan><tspan x="665.0" dy="14.3">Домени фериту повністю орієнтовані за полем</tspan></text>
<rect x="508.5" y="190.3" width="313.0" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">3. Колапс проникності</tspan><tspan x="665.0" dy="14.3">μr падає від 2000...3000 до 1 (повітряне осердя)</tspan></text>
<rect x="561.8" y="252.3" width="206.4" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="665.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">4. Обвал індуктивності Lm</tspan><tspan x="665.0" dy="14.3">Lm падає у тисячі разів: Lm → 0</tspan></text>
<rect x="499.1" y="314.4" width="331.8" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="329.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">5. Струмовий вибух і пробій</tspan><tspan x="665.0" dy="14.3">Струм ключа стрибає до сотень ампер → смерть MOSFET</tspan></text>
