<line x1="225.0" y1="80.0" x2="225.0" y2="65.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">B (індукція / потік)</text>
<line x1="60.0" y1="110.0" x2="390.0" y2="110.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="130.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+ Bsat (насичення ≈ 0.35 Тл)</text>
