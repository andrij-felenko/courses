<rect x="506.8" y="121.0" width="386.5" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="700.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Співвідношення     Dmax      Vds(peak)</tspan><tspan x="700.0" dy="13.0">Nr = 2 · Np        0.33      1.5 · Vin  (мале навантаження ключа)</tspan><tspan x="700.0" dy="13.0">Nr = Np (базове)   0.50      2.0 · Vin  (симетричний баланс)</tspan><tspan x="700.0" dy="13.0">Nr = 0.5 · Np      0.66      3.0 · Vin  (небезпечно високий Vds)</tspan><tspan x="700.0" dy="13.0">Active Clamp       0.70      Vin/(1-D)  (гнучкий плаваючий кламп)</tspan></text>
