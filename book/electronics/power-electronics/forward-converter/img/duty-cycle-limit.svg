<rect x="60.8" y="245.1" width="348.3" height="69.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Умова рівноваги осердя:</tspan><tspan x="235.0" dy="14.3">Vin · ton = Vreset · treset</tspan><tspan x="235.0" dy="14.3">Якщо Nr = Np  ⇒  Vreset = Vin  ⇒  treset = ton</tspan><tspan x="235.0" dy="14.3">Оскільки ton + treset ≤ T  ⇒  2 · ton ≤ T  ⇒  D ≤ 0.5</tspan></text>
