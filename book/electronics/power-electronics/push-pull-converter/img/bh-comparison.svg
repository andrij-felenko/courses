<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Використання петлі гістерезису: однотактний Forward проти Push-Pull</text>
<rect x="40.0" y="55.0" width="360.0" height="360.0" rx="8" fill="#fafbfc" stroke="#d0d5dd" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Однотактний Forward (1 квадрант)</text>
<line x1="220.0" y1="380.0" x2="220.0" y2="105.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="60.0" y1="245.0" x2="380.0" y2="245.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="232.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">B (Тл)</text>
<text x="375.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">H (А/м)</text>
<path d="M 220 215 Q 310 180 310 150 Q 250 180 220 215" fill="none" stroke="#c0392b" stroke-width="2.8"/>
<rect x="228.0" y="140.0" width="115.0" height="65.0" rx="4" fill="#fdeeee" stroke="#c0392b" stroke-width="1.0"/>
<text x="285.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Робоча зона ΔB</text>
<text x="285.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ΔB = B_max − B_r</text>
<text x="285.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">≈ 0.15–0.18 Тл</text>
<circle cx="220.0" cy="215.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">B_r</text>
<circle cx="310.0" cy="150.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="315.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">B_max</text>
<text x="220.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Перемагнічування лише в один бік</text>
<rect x="440.0" y="55.0" width="360.0" height="360.0" rx="8" fill="#fafbfc" stroke="#d0d5dd" stroke-width="1.5"/>
<text x="620.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Двотактний Push-Pull (I та III квадранти)</text>
<line x1="620.0" y1="380.0" x2="620.0" y2="105.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460.0" y1="245.0" x2="780.0" y2="245.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="632.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">B (Тл)</text>
<text x="775.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">H (А/м)</text>
<path d="M 540 340 Q 600 320 640 245 Q 700 170 700 150 Q 640 170 600 245 Q 540 320 540 340" fill="none" stroke="#27ae60" stroke-width="2.8"/>
<rect x="535.0" y="145.0" width="170.0" height="80.0" rx="4" fill="#eef7ee" stroke="#27ae60" stroke-width="1.0"/>
<text x="620.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Повна симетрична петля</text>
<text x="620.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ΔB = 2 · B_max</text>
<text x="620.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">≈ 0.40–0.60 Тл (удвічі більше!)</text>
<circle cx="700.0" cy="150.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="708.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">+B_max</text>
<circle cx="540.0" cy="340.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="532.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">−B_max</text>
<text x="620.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Габарити осердя зменшені в 1.8–2 рази</text>
</svg>