<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення BEC: коротким товстим проводом, буфер біля плати</text>
<rect x="67.6" y="126.2" width="74.7" height="47.6" rx="6" fill="#eef0f4" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">польотна</tspan><tspan x="105.0" dy="15.6">батарея</tspan></text>
<rect x="225.4" y="126.2" width="109.3" height="47.6" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">BEC / UBEC</tspan><tspan x="280.0" dy="15.6">→ тверді 5 В</tspan></text>
<line x1="150.0" y1="150.0" x2="230.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">11–25 В</text>
<line x1="332.0" y1="150.0" x2="470.0" y2="150.0" stroke="#333333" stroke-width="4.0" marker-end="url(#arrow)"/>
<text x="400.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">КОРОТКИЙ ТОВСТИЙ</text>
<text x="400.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">провід 5 В</text>
<rect x="516.5" y="126.2" width="87.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">бортовий</tspan><tspan x="560.0" dy="15.6">комп'ютер</tspan></text>
<rect x="484.2" y="222.3" width="151.7" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">буферна ємність</tspan><tspan x="560.0" dy="14.3">тут, впритул до плати</tspan></text>
<line x1="560.0" y1="212.0" x2="560.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">підхоплює кидок першою, поки BEC наздоганяє</text>
<line x1="105.0" y1="190.0" x2="560.0" y2="190.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="300.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">спільна земля — усі мінуси в одну точку</text>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">⚠ те саме, але провід тонкий і довгий:</text>
<text x="400.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">на 3 А він губить десяті вольта — шина просідає ще до плати</text>
<text x="400.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(тонка стрілка = тонкий провід = зайвий опір послідовно)</text>
<line x1="140.0" y1="320.0" x2="360.0" y2="320.0" stroke="#333333" stroke-width="1.0" marker-end="url(#arrow)"/>
</svg>