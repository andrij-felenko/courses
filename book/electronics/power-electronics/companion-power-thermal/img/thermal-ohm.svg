<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий закон Ома: тепло тече крізь ланцюжок опорів</text>
<text x="400.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">P (Вт) тече, як струм; θ (°C/Вт) — як опір; ΔT (°C) — як спад напруги</text>
<rect x="74.1" y="145.1" width="71.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">кристал</tspan><tspan x="110.0" dy="16.9">Tj</tspan></text>
<rect x="287.8" y="145.1" width="64.5" height="49.9" rx="6" fill="#eef0f4" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">корпус</tspan><tspan x="320.0" dy="16.9">Tc</tspan></text>
<rect x="490.4" y="145.1" width="79.3" height="49.9" rx="6" fill="#eef0f4" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">радіатор</tspan><tspan x="530.0" dy="16.9">Ts</tspan></text>
<rect x="674.1" y="145.1" width="71.9" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">повітря</tspan><tspan x="710.0" dy="16.9">Ta</tspan></text>
<line x1="156.0" y1="170.0" x2="274.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">θJC</text>
<line x1="366.0" y1="170.0" x2="484.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="425.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">θCS</text>
<line x1="576.0" y1="170.0" x2="664.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">θSA</text>
<text x="110.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">P = I²·Rds(on)</text>
<line x1="110.0" y1="124.0" x2="110.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="151.3" y="273.9" width="497.4" height="52.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Tj = Ta + P · (θJC + θCS + θSA)</tspan><tspan x="400.0" dy="18.2">перегрів кристала = потужність × сумарний тепловий опір</tspan></text>
<text x="400.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Аналогія точна в усталеному стані; на кидках потужності вмикається теплова ЄМНІСТЬ маси — вона згладжує пік.</text>
</svg>