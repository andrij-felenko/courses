<rect x="295.9" y="108.5" width="168.2" height="43.0" rx="6" fill="#e3f0fb" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Розгалужувач аудіо L/R/Mic</tspan><tspan x="380.0" dy="13.0">(прямий зв'язок з 3.5 мм)</tspan></text>
<rect x="295.9" y="168.5" width="168.2" height="43.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Комутація CC: Ra на аудіо,</tspan><tspan x="380.0" dy="13.0">Rd / PD на зарядний порт</tspan></text>
<rect x="280.7" y="229.1" width="198.7" height="41.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Силовий ключ VBUS (5 В / 500 мА)</tspan><tspan x="380.0" dy="12.3">із захистом від зворотного струму</tspan></text>
<rect x="584.2" y="107.3" width="101.5" height="45.3" rx="6" fill="#e3f0fb" stroke="#2457d6" stroke-width="1.5"/><text x="635.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Роз'єм 3.5 мм</tspan><tspan x="635.0" dy="14.3">(Навушники)</tspan></text>
<rect x="565.4" y="207.3" width="139.1" height="45.3" rx="6" fill="#fbf3f3" stroke="#c0392b" stroke-width="1.5"/><text x="635.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Вхід Type-C</tspan><tspan x="635.0" dy="14.3">(Зарядний пристрій)</tspan></text>
