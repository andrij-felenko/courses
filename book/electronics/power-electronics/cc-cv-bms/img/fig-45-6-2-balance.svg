<text x="480.0" y="430" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Заряд тече крізь усі комірки по черзі: коли найслабша дійшла 4.2 В, заряд треба спинити —</text>
<text x="480.0" y="446" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">інакше вона перезарядиться. Балансир зціджує надлишок із повніших, доки відсталі не наздоженуть.</text>
