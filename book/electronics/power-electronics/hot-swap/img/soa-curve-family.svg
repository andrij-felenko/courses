<text x="232.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="232.0" dy="0.0">робоча точка:</tspan><tspan x="232.0" dy="14.3">Vds = Vin, Id = Iмежа</tspan></text>
<line x1="316.0" y1="388.0" x2="362.0" y2="362.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="640.0" y="100.8" width="250.0" height="162.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Кожна лінія — СТАЛА потужність:</tspan><tspan x="765.0" dy="16.2">Id · Vds = (Tj max − Tc) / Zθ(t)</tspan><tspan x="765.0" dy="16.2"></tspan><tspan x="765.0" dy="16.2">коротший імпульс → менше Zθ(t)</tspan><tspan x="765.0" dy="16.2">→ вища дозволена потужність</tspan><tspan x="765.0" dy="16.2">→ лінія стоїть вище</tspan><tspan x="765.0" dy="16.2"></tspan><tspan x="765.0" dy="16.2">У логарифмічних осях стала</tspan><tspan x="765.0" dy="16.2">потужність — пряма з нахилом −1.</tspan></text>
<rect x="621.6" y="321.6" width="286.8" height="156.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="341.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Червоний пунктир — СПРАВЖНЯ межа.</tspan><tspan x="765.0" dy="15.6"></tspan><tspan x="765.0" dy="15.6">Нестійкість Спіріто зрізає верх</tspan><tspan x="765.0" dy="15.6">кривої на високих Vds — і тим</tspan><tspan x="765.0" dy="15.6">раніше, чим довший імпульс.</tspan><tspan x="765.0" dy="15.6"></tspan><tspan x="765.0" dy="15.6">Робоча точка лежить НИЖЧЕ суцільної</tspan><tspan x="765.0" dy="15.6">«10 мс» (теплова формула обіцяє запас),</tspan><tspan x="765.0" dy="15.6">але ВИЩЕ пунктиру — запасу немає.</tspan></text>
</svg>