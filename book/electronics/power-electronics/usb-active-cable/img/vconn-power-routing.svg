<rect x="30.0" y="96.0" width="190.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Силове джерело VBUS</tspan><tspan x="125.0" dy="13.0">PD Контракт: 5 В / 9 В /</tspan><tspan x="125.0" dy="13.0">15 В / 20 В / 48 В (EPR)</tspan><tspan x="125.0" dy="13.0">Струм до 5 А (до 240 Вт)</tspan></text>
