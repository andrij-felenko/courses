  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому промінь, а не стрілка: маса вирішує все</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щоб устигати за швидким сигналом, «перо» має бути майже без маси — таким є пучок електронів</text>
<line x1="410.0" y1="76.0" x2="410.0" y2="320.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,5" stroke-linecap="round"/>
<text x="210.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Механічна стрілка</text>
<circle cx="150.0" cy="230.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<line x1="150.0" y1="230.0" x2="201.6" y2="156.3" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="150.0" cy="230.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="201.6" cy="156.3" r="7.0" fill="#bbb" stroke="#1b1b1b" stroke-width="1.5"/>
<line x1="150.0" y1="230.0" x2="157.8" y2="140.3" stroke="#c9c9c9" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="150.0" cy="230.0" r="3.0" fill="#c9c9c9" stroke="#c9c9c9" stroke-width="1"/>
<text x="150.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">має масу й інерцію →</text>
<text x="150.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відстає від швидкого сигналу</text>
<text x="620.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Пучок електронів</text>
<rect x="470.0" y="150.0" width="30.0" height="30.0" rx="3" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<text x="485.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">К</text>
<line x1="500.0" y1="165.0" x2="740.0" y2="230.0" stroke="#7CFC7C" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="740.0" cy="230.0" r="7.0" fill="#7CFC7C" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="620.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">майже без маси →</text>
<text x="620.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">встигає за найшвидшим сигналом</text>
</svg>
