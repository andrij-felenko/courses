<text x="720.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коли АЧХ пласка?</text>
<text x="580.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">умова:  R₁·C₁ = R₂·C₂</text>
<text x="580.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">опірний поділ:  R₂/(R₁+R₂) = 1/10</text>
<text x="580.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ємнісний поділ:  C₁/(C₁+C₂) = 1/10</text>
<text x="580.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">збіглися → кожну частоту</text>
<text x="580.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ділить на 10 однаково (пласко)</text>
