<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Компенсований дільник ×10: навіщо в щупі підлаштовний конденсатор</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щоб поділ був однаковий на всіх частотах, сталі часу верхнього й нижнього плеча мусять збігтися</text>
