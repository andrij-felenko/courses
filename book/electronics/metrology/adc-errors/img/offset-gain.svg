<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві «лінійні» похибки: зсув нуля та похибка масштабу</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">обидві лишають криву прямою — тому їх виправляє двоточкове калібрування</text>
<line x1="120.0" y1="320.0" x2="120.0" y2="98.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="120.0" y1="320.0" x2="444.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="110.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">код</text>
<text x="436.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Vin</text>
<line x1="120.0" y1="320.0" x2="430.0" y2="110.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="120.0,282.2 374.2,110.0" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="120.0" cy="282.2" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="128.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">код ≠ 0 при 0 В</text>
<text x="275.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вся пряма зсунена вгору</text>
<text x="275.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зсув нуля (offset)</text>
<line x1="560.0" y1="320.0" x2="560.0" y2="98.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="560.0" y1="320.0" x2="884.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="550.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">код</text>
<text x="876.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Vin</text>
<line x1="560.0" y1="320.0" x2="870.0" y2="110.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="560.0,320.0 870.0,164.6" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="715.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">нахил не той — повну</text>
<text x="715.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">шкалу досягнуто не там</text>
<text x="715.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">Похибка масштабу (gain)</text>
<rect x="160.0" y="340.0" width="620.0" height="30.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="470.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Зсув — додати/відняти константу; масштаб — домножити. Дві точки задають і те, й те.</tspan></text>
</svg>