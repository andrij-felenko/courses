<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві «лінійні» похибки: зсув нуля та похибка масштабу</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидві лишають криву прямою — тому їх виправляє двоточкове калібрування</text>
<line x1="120.0" y1="320.0" x2="120.0" y2="98.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="120.0" y1="320.0" x2="444.0" y2="320.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="110.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">код</text>
<text x="436.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vin</text>
<polyline points="120.0,320.0 430.0,110.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6,4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="120.0,282.2 374.2,110.0" fill="none" stroke="#c0271e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="120.0" cy="282.2" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="128.0" y="276.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">код ≠ 0 при 0 В</text>
<text x="275.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вся пряма зсунена вгору</text>
<text x="275.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Зсув нуля (offset)</text>
<line x1="560.0" y1="320.0" x2="560.0" y2="98.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="560.0" y1="320.0" x2="884.0" y2="320.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="550.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">код</text>
<text x="876.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vin</text>
<polyline points="560.0,320.0 870.0,110.0" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6,4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="560.0,320.0 870.0,164.6" fill="none" stroke="#c0271e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="715.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">нахил не той — повну</text>
<text x="715.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">шкалу досягнуто не там</text>
<text x="715.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Похибка масштабу (gain)</text>
<rect x="160.0" y="340.0" width="620.0" height="30.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="470.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зсув — додати/відняти константу; масштаб — домножити. Дві точки задають і те, й те.</text>
</svg>
