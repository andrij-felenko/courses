<rect x="130.0" y="396.0" width="660.0" height="54.0" rx="6" fill="#f3f6fb" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="419.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Головна ідея: цифрувати прилад уміє лише НАПРУГУ.</tspan><tspan x="460.0" dy="14.3">Струм і опір він спершу обертає на напругу — шунтом чи джерелом струму — і вже її злічує.</tspan></text>
