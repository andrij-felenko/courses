<rect x="120.0" y="260.0" width="660.0" height="120.0" rx="6" fill="#f7f7f7" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Counts — найбільше число, що влазить на табло (2000 → до 1999).</tspan><tspan x="450.0" dy="14.3">Більше counts чи цифр = дрібніший крок = більше значущих знаків.</tspan><tspan x="450.0" dy="14.3">Автодіапазон сам обирає найменший діапазон, де число влазить,</tspan><tspan x="450.0" dy="14.3">щоб лишилося найбільше корисних цифр (4.236, а не 04.23).</tspan><tspan x="450.0" dy="14.3">«Точність» (±%) — це інше: межа правдивості показу, не його дрібність.</tspan></text>
