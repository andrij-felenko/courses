<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме число — лише для своїх умов</text>
<rect x="70.0" y="80.0" width="250.0" height="130.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="195.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0"></tspan></text>
<text x="195.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rds(on)</text>
<text x="195.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">20 мОм</text>
<text x="195.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">@ Vgs=10 В, 25 °C</text>
<text x="195.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(умови з даташита)</text>
<rect x="390.0" y="80.0" width="250.0" height="130.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/><text x="515.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0"></tspan></text>
<text x="515.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">той самий Rds(on)</text>
<text x="515.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 40 мОм</text>
<text x="515.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">@ Vgs=10 В, 125 °C</text>
<text x="515.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(у спеку — майже вдвічі)</text>
<line x1="326.0" y1="145.0" x2="384.0" y2="145.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="355.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">нагрів</text>
<text x="350.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">той самий параметр під іншою температурою чи напругою — інше число; звіряй умови зі своїми</text>
