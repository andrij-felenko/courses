<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
<rect width="820" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шунт: міряємо струм за крихітним спадом напруги</text>
<text x="410.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">малий відомий опір у розрив кола; спад на ньому V = I·R, звідси струм I = V/R</text>
<line x1="70.0" y1="170.0" x2="330.0" y2="170.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="490.0" y1="170.0" x2="760.0" y2="170.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<rect x="330.0" y="154.0" width="160.0" height="32.0" rx="6" fill="#eef2fb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="410.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">R_шунт = 1 мΩ</text>
<line x1="150.0" y1="170.0" x2="250.0" y2="170.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="200.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I = 10 А</text>
<line x1="560.0" y1="170.0" x2="660.0" y2="170.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<circle cx="410.0" cy="92.0" r="24.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="410.0" y="97.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V</text>
<text x="444.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= 10 мВ</text>
<line x1="393.0" y1="109.0" x2="350.0" y2="154.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="427.0" y1="109.0" x2="470.0" y2="154.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<rect x="205.0" y="220.0" width="410.0" height="58.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = V / R = 10 мВ / 1 мΩ = 10 А</text>
<text x="410.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">малий опір → майже не заважає колу (мала вставна R і втрата I²R)</text>
</svg>
