<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому категорія важить більше за вольти: опір джерела</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий транзієнт, але нижчий опір джерела → у рази більший струм (і енергія дуги)</text>
<line x1="455.0" y1="64.0" x2="455.0" y2="256.0" stroke="#e4e4e4" stroke-width="2" stroke-linecap="round"/>
<text x="232.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">CAT II — 1000 В</text>
<text x="232.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">розетка; випроба 6 кВ, джерело 12 Ом</text>
<text x="232.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = 6000 В / 12 Ом</text>
<text x="232.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">≈ 500 А</text>
<rect x="112.0" y="198.0" width="240.0" height="26.0" rx="4" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.2"/>
<rect x="112.0" y="198.0" width="40.0" height="26.0" rx="4" fill="#1f47b5" stroke="none" stroke-width="0"/>
<text x="232.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">менший струм транзієнта</text>
<text x="680.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CAT III — 600 В</text>
<text x="680.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">щиток; випроба 6 кВ, джерело 2 Ом</text>
<text x="680.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = 6000 В / 2 Ом</text>
<text x="680.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 3000 А</text>
<rect x="560.0" y="198.0" width="240.0" height="26.0" rx="4" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.2"/>
<rect x="560.0" y="198.0" width="240.0" height="26.0" rx="4" fill="#1f8a3b" stroke="none" stroke-width="0"/>
<text x="680.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">той самий транзієнт — ушестеро більший струм!</text>
<rect x="90.0" y="270.0" width="720.0" height="112.0" rx="9" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="450.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опір джерела CAT III (2 Ом) у шість разів нижчий за CAT II (12 Ом) — тож при однаковій</text>
<text x="450.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.1" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напрузі транзієнта струм (а отже, енергія можливої дуги) у рази більший.</text>
<text x="450.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ВИСНОВОК: CAT III-600 В «жорсткіший» за CAT II-1000 В, хоч вольтів менше.</text>
<text x="450.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому читають ОБИДВА числа — категорію і напругу — разом, а не лише вольти.</text>
</svg>
