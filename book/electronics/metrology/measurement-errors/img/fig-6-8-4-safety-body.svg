<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Безпека передусім: струм крізь тіло вбиває</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">мережа 230 В небезпечна; небезпечний саме СТРУМ крізь тіло (§2.13)</text>
<circle cx="200.0" cy="140.0" r="10.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="200.0" y1="150.0" x2="200.0" y2="180.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="200.0" y1="158.0" x2="184.0" y2="174.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="200.0" y1="158.0" x2="216.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="200.0" y1="180.0" x2="188.0" y2="208.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="200.0" y1="180.0" x2="212.0" y2="208.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<rect x="360.0" y="150.0" width="60.0" height="70.0" rx="6" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="378.0" cy="175.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="402.0" cy="175.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="390.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">230 В</text>
<line x1="216.0" y1="168.0" x2="360.0" y2="175.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="200.0" y1="208.0" x2="200.0" y2="320.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="280.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗ небезпечний шлях</text>
<rect x="500.0" y="110.0" width="300.0" height="200.0" rx="12" fill="#fbecea" stroke="#c0271e" stroke-width="1.8"/>
<text x="650.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Прості правила життя</text>
<text x="520.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• НЕ торкайся живих провідників</text>
<text x="520.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• «правило однієї руки»:</text>
<text x="535.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">другу — в кишеню, щоб струм</text>
<text x="535.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">не пішов крізь серце</text>
<text x="520.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• мережу 230 В лиши фахівцям;</text>
<text x="535.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">учися на низькій напрузі (5 В)</text>
<text x="520.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">• сумнів — вимкни живлення</text>
</svg>
