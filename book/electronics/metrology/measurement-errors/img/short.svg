<text x="380.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Контур: «гаряча» точка → крокодил → корпус → захисна земля → нейтраль мережі</text>
<text x="380.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">опір контуру ≈ 0 → струм у сотні ампер: згоряє слід щупа, вхід, а то й сам прилад</text>
<text x="380.0" y="460.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(а якщо плаває не прилад, а пристрій — під напругою опиняється корпус осцилографа)</text>
</svg>
