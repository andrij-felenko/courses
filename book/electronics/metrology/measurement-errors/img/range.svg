<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<rect width="900" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому діапазон важливий: той самий 0.20 В на двох діапазонах</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">прилад ±(0.5% показу + 2 одиниці); нижчий діапазон → менша підлога «одиниць»</text>
<rect x="40.0" y="76.0" width="330.0" height="196.0" rx="10" fill="#fbfbff" stroke="#c0271e" stroke-width="1.7"/>
<text x="205.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Діапазон 2 В (1 од. = 1 мВ)</text>
<rect x="135.0" y="112.0" width="140.0" height="46.0" rx="6" fill="#101814" stroke="#101814" stroke-width="2"/>
<text x="205.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#5dff9b" text-anchor="middle" font-weight="bold" font-style="normal">0.200</text>
<text x="58.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">± (0.5%·0.2 + 2·1 мВ)</text>
<text x="58.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= ±(1 + 2) = ±3 мВ</text>
<rect x="58.0" y="218.0" width="294.0" height="16.0" rx="4" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1"/>
<rect x="58.0" y="218.0" width="220.0" height="16.0" rx="4" fill="#c0271e" stroke="none" stroke-width="0"/>
<text x="205.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ ±1.5 %</text>
<rect x="530.0" y="76.0" width="330.0" height="196.0" rx="10" fill="#fbfbff" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="695.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Діапазон 200 мВ (1 од. = 0.1 мВ)</text>
<rect x="625.0" y="112.0" width="140.0" height="46.0" rx="6" fill="#101814" stroke="#101814" stroke-width="2"/>
<text x="695.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#5dff9b" text-anchor="middle" font-weight="bold" font-style="normal">200.0</text>
<text x="548.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">± (0.5%·0.2 + 2·0.1 мВ)</text>
<text x="548.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">= ±(1 + 0.2) = ±1.2 мВ</text>
<rect x="548.0" y="218.0" width="294.0" height="16.0" rx="4" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1"/>
<rect x="548.0" y="218.0" width="90.0" height="16.0" rx="4" fill="#1f8a3b" stroke="none" stroke-width="0"/>
<text x="695.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ ±0.6 %</text>
<line x1="378.0" y1="174.0" x2="522.0" y2="174.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="450.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">нижчий діапазон,</text>
<text x="450.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">менша «підлога»</text>
<rect x="90.0" y="296.0" width="720.0" height="50.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Відсоткова частина однакова (1 мВ), а частка «одиниць» упала з 2 мВ до 0.2 мВ — бо «одиниця» дрібніша.</text>
<text x="450.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому автодіапазон сам тисне показ у найменший діапазон, що вміщає значення (вставка до §1.6.6).</text>
</svg>
