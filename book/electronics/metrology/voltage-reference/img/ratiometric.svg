<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Раціометрія: коли коливання Vref самознищуються</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо давач і Vref живляться від ОДНОГО джерела, його дрейф скорочується у відношенні</text>
<line x1="120.0" y1="110.0" x2="840.0" y2="110.0" stroke="#c0271e" stroke-width="2.6" stroke-linecap="round"/>
<text x="120.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">VDD (живлення)</text>
<line x1="250.0" y1="110.0" x2="250.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="232.0" y="150.0" width="36.0" height="120.0" rx="3" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="250.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R</text>
<circle cx="268.0" cy="210.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<line x1="268.0" y1="210.0" x2="320.0" y2="210.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<line x1="250.0" y1="270.0" x2="250.0" y2="300.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="228.0" y1="300.0" x2="272.0" y2="300.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="234.0" y1="306.0" x2="266.0" y2="306.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="242.0" y1="312.0" x2="258.0" y2="312.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">до землі</text>
<rect x="330.0" y="185.0" width="130.0" height="60.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="395.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">АЦП</text>
<text x="395.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ref = VDD</text>
<line x1="560.0" y1="110.0" x2="560.0" y2="185.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round"/>
<line x1="460.0" y1="130.0" x2="560.0" y2="130.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="620.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">та сама VDD — як опорна</text>
<rect x="150.0" y="300.0" width="700.0" height="84.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="500.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">VDD підскочила на 10 %? І сигнал давача, і Vref зросли на ті самі 10 %.</text>
<text x="500.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Код = відношення сигналу до Vref — а воно НЕ змінилося. Дрейф живлення скоротився.</text>
<text x="500.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Тому потенціометри й резистивні давачі часто й не потребують точної опорної.</text>
</svg>
