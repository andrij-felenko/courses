<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<rect width="920" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЦП міряє ВІДНОШЕННЯ до Vref, а не самі вольти</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">код = (Vin / Vref) × максимум; Vref — це «що вважати повною шкалою»</text>
<rect x="290.0" y="100.0" width="90.0" height="230.0" rx="0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="278.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">Vref</text>
<text x="278.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="end" font-weight="normal" font-style="normal">0</text>
<text x="278.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(повна шкала)</text>
<rect x="290.0" y="187.4" width="90.0" height="142.6" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="335.0" y="262.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Vin</text>
<line x1="398.0" y1="187.4" x2="398.0" y2="330.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="393.0" y1="187.4" x2="403.0" y2="187.4" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="393.0" y1="330.0" x2="403.0" y2="330.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<text x="408.0" y="262.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">62 % від Vref</text>
<line x1="580.0" y1="215.0" x2="670.0" y2="215.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="670.0" y="188.0" width="150.0" height="56.0" rx="10" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="745.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">код</text>
<text x="745.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">= 62 % × макс</text>
<rect x="150.0" y="348.0" width="620.0" height="26.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.2"/>
<text x="460.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЦП питає не «скільки вольтів?», а «яка ти частка від Vref?».</text>
</svg>
