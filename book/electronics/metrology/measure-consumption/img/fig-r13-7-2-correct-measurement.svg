<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чесний вимір: шунт + осцилограф, інтеграл профілю = I_сер</text>
<rect x="14.0" y="76.2" width="72.1" height="47.6" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="2.0"/><text x="50.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="50.0" dy="0.0">Батарея</tspan><tspan x="50.0" dy="15.6">3.3 В</tspan></text>
<line x1="100.0" y1="100.0" x2="170.0" y2="100.0" stroke="#333333" stroke-width="2.0"/>
<rect x="180.0" y="78.0" width="80.0" height="44.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.0"/><text x="220.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Шунт</tspan><tspan x="220.0" dy="15.6">0.1 Ом</tspan></text>
<line x1="220.0" y1="122.0" x2="220.0" y2="160.0" stroke="#e67e22" stroke-width="1.5"/>
<text x="225.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="start">V_шунт = I × R</text>
<line x1="260.0" y1="100.0" x2="330.0" y2="100.0" stroke="#333333" stroke-width="2.0"/>
<rect x="361.4" y="76.2" width="57.2" height="47.6" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="2.0"/><text x="390.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ESP32</tspan><tspan x="390.0" dy="15.6">(чип)</tspan></text>
<line x1="440.0" y1="100.0" x2="520.0" y2="100.0" stroke="#333333" stroke-width="2.0"/>
<line x1="520.0" y1="100.0" x2="520.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="520.0" y1="200.0" x2="50.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="50.0" y1="200.0" x2="50.0" y2="130.0" stroke="#333333" stroke-width="2.0"/>
<line x1="200.0" y1="122.0" x2="160.0" y2="220.0" stroke="#1a7a73" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="240.0" y1="122.0" x2="280.0" y2="220.0" stroke="#1a7a73" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="157.9" y="221.2" width="124.2" height="47.6" rx="6" fill="#e8f8f7" stroke="#1a7a73" stroke-width="2.0"/><text x="220.0" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a7a73" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Осцилограф /</tspan><tspan x="220.0" dy="15.6">Power Profiler</tspan></text>
<rect x="515.6" y="80.6" width="168.8" height="78.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="600.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">I(t) = V_шунт(t) / R</tspan><tspan x="600.0" dy="15.6"></tspan><tspan x="600.0" dy="15.6">I_сер = ∫I(t)dt / T</tspan><tspan x="600.0" dy="15.6">    = площа ÷ час</tspan></text>
<rect x="506.8" y="222.2" width="166.5" height="55.6" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="590.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">⚠ Burden voltage:</tspan><tspan x="590.0" dy="14.3">на піку I×R просаджує</tspan><tspan x="590.0" dy="14.3">живлення чипа → brownout</tspan></text>
<rect x="105.5" y="324.5" width="548.9" height="27.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Єдина чесна метрика — площа під профілем струму (інтеграл), а не «що показав дисплей»</tspan></text>
</svg>