<rect x="140.0" y="160.0" width="70.0" height="34.0" rx="3" fill="#2b4a40" stroke="#27ae60" stroke-width="1.6"/>
<text x="175.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dff0e6" text-anchor="middle" font-weight="700">ІМС</text>
<line x1="68.0" y1="177.0" x2="105.0" y2="177.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="175.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">поле проходить ✗</text>
<text x="175.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">сам не іскрить</tspan><tspan x="175.0" dy="15.8">але НЕ екранує</tspan><tspan x="175.0" dy="15.8">для нечутливого / вторинне</tspan></text>
<rect x="340.0" y="84.0" width="250.0" height="250.0" rx="12" fill="#fcfcfc" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="465.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чорний розсіювальний</text>
<rect x="395.0" y="132.0" width="140.0" height="90.0" rx="6" fill="#d7d7d7" stroke="#1a1a1a" stroke-width="2.0"/>
