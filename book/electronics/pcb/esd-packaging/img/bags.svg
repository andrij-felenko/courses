<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440">
<rect width="940" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три класи пакувань: антистатичне, розсіювальне, екранувальне</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що від чого захищає — залежить від того, чи проводить плівка й чи має вона суцільний екран</text>
<rect x="50.0" y="84.0" width="250.0" height="250.0" rx="12" fill="#fcfcfc" stroke="#c0271e" stroke-width="1.8"/>
<text x="175.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Рожевий «антистатик»</text>
<rect x="105.0" y="130.0" width="140.0" height="90.0" rx="6" fill="#f9d6e0" stroke="#c0271e" stroke-width="2"/>
<rect x="140.0" y="158.0" width="70.0" height="34.0" rx="3" fill="#244" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="175.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#dff0e6" text-anchor="middle" font-weight="bold" font-style="normal">ІМС</text>
<polyline points="70.0,175.0 78.2,173.4 86.5,182.0 94.8,175.4 103.0,175.0" fill="none" stroke="#e08030" stroke-width="2.2"/>
<polyline points="107.0,175.0 118.0,174.1 129.0,179.0 140.0,175.0" fill="none" stroke="#e08030" stroke-width="1.8"/>
<text x="80.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">поле проходить ✗</text>
<text x="68.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• не електризується сам</text>
<text x="68.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• (низька трибоелектрика)</text>
<text x="68.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• НЕ екранує від поля!</text>
<text x="68.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• для НЕчутливого / вторинне</text>
<rect x="340.0" y="84.0" width="250.0" height="250.0" rx="12" fill="#fcfcfc" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="465.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чорний розсіювальний</text>
<rect x="395.0" y="130.0" width="140.0" height="90.0" rx="6" fill="#d7d7d7" stroke="#1b1b1b" stroke-width="2"/>
<rect x="430.0" y="158.0" width="70.0" height="34.0" rx="3" fill="#244" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="465.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#dff0e6" text-anchor="middle" font-weight="bold" font-style="normal">ІМС</text>
<polyline points="360.0,175.0 368.2,173.4 376.5,182.0 384.8,175.4 393.0,175.0" fill="none" stroke="#e08030" stroke-width="2.2"/>
<polyline points="397.0,175.0 408.0,174.1 419.0,179.0 430.0,175.0" fill="none" stroke="#e08030" stroke-width="1.8"/>
<text x="370.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">поле проходить ✗</text>
<text x="358.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• проводить помалу по поверхні</text>
<text x="358.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вирівнює заряд на собі</text>
<text x="358.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• екран слабкий</text>
<text x="358.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• лотки, піна, мати</text>
<rect x="640.0" y="84.0" width="250.0" height="250.0" rx="12" fill="#fcfcfc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="765.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Сріблястий екранувальний</text>
<rect x="695.0" y="130.0" width="140.0" height="90.0" rx="6" fill="#cfe0ea" stroke="#1f47b5" stroke-width="2"/>
<rect x="730.0" y="158.0" width="70.0" height="34.0" rx="3" fill="#244" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="765.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#dff0e6" text-anchor="middle" font-weight="bold" font-style="normal">ІМС</text>
<polyline points="660.0,175.0 668.2,173.4 676.5,182.0 684.8,175.4 693.0,175.0" fill="none" stroke="#e08030" stroke-width="2.2"/>
<rect x="693.0" y="132.0" width="4.0" height="86.0" rx="0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="670.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">поле НЕ проходить ✓</text>
<text x="658.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• метал. шар = клітка Фарадея</text>
<text x="658.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• не пускає поле всередину</text>
<text x="658.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• + розсіювальний шар</text>
<text x="658.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• ОСНОВНИЙ для ІМС</text>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключова пастка: рожевий «антистатик» лише не іскрить сам — він НЕ є екраном. Чутливу ІМС возять у сріблястому екранувальному пакеті.</text>
<text x="470.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Екранувальний пакет працює, лише поки закритий: відкритий — це вже не клітка Фарадея (§1.1.8).</text>
<text x="470.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Транспортна тара (тубуси, котушки, лотки) — з розсіювального пластику, щоб виводи не електризувались під час тряски.</text>
</svg>
