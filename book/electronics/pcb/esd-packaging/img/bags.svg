<text x="465.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dff0e6" text-anchor="middle" font-weight="700">ІМС</text>
<line x1="358.0" y1="177.0" x2="395.0" y2="177.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="465.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">поле проходить ✗</text>
<text x="465.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">проводить помалу</tspan><tspan x="465.0" dy="15.8">вирівнює заряд на собі</tspan><tspan x="465.0" dy="15.8">лотки, піна, мати</tspan></text>
<rect x="640.0" y="84.0" width="250.0" height="250.0" rx="12" fill="#fcfcfc" stroke="#2457d6" stroke-width="1.8"/>
<text x="765.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Сріблястий екранувальний</text>
<rect x="695.0" y="132.0" width="140.0" height="90.0" rx="6" fill="#cfe0ea" stroke="#2457d6" stroke-width="2.0"/>
<rect x="730.0" y="160.0" width="70.0" height="34.0" rx="3" fill="#2b4a40" stroke="#27ae60" stroke-width="1.6"/>
<text x="765.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dff0e6" text-anchor="middle" font-weight="700">ІМС</text>
<rect x="693.0" y="134.0" width="4.0" height="86.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<line x1="658.0" y1="177.0" x2="695.0" y2="177.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="765.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">поле НЕ проходить ✓</text>
<text x="765.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">метал. шар = клітка Фарадея</tspan><tspan x="765.0" dy="15.8">+ розсіювальний шар усередині</tspan><tspan x="765.0" dy="15.8">ОСНОВНИЙ для чутливих ІМС</tspan></text>
<rect x="13.6" y="356.0" width="912.8" height="32.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Пастка: рожевий «антистатик» лише не іскрить сам — він НЕ екран. Чутливу ІМС возять у сріблястому екранувальному пакеті.</tspan></text>
<text x="470.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Екранувальний пакет — клітка Фарадея, лише поки закритий: відкрив — захисту вже немає.</text>
<text x="470.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Транспортна тара (тубуси, котушки, лотки) — з розсіювального пластику, щоб тряска не родила заряд.</text>
