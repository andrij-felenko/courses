<text x="460.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Спільна ідея всієї тари</text>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">механічно: компонент не совається, виводи не труться один об одного й об стінки;</text>
<text x="460.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">електрично: матеріал розсіювальний (не діелектрик), тож перевезення не накопичує заряд.</text>
