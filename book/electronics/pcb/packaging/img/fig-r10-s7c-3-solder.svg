<text x="245.0" y="464.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">флюс + тонке жало + мідне обплетення дають SOIC і навіть QFN; для BGA цього вже мало.</text>
<text x="80.0" y="482.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Золоте правило:</text>
<text x="245.0" y="482.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">бачиш у даташиті лише BGA — або фен/піч і досвід, або шукай плату-перехідник на ширший крок.</text>
