<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи з'єднати кристал зі світом</text>
<text x="210.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Wire bonding (дротяне з'єднання)</text>
<rect x="60.0" y="200.0" width="300.0" height="30.0" rx="0" fill="#2f6f3f" stroke="#163b21" stroke-width="2.0"/>
<rect x="150.0" y="170.0" width="120.0" height="30.0" rx="0" fill="#9fb0c8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кристал (лицем угору)</text>
<path d="M 160,170 Q 122,118 84,200" fill="none" stroke="#c79a2e" stroke-width="1.8"/>
<rect x="79.0" y="196.0" width="10.0" height="8.0" rx="0" fill="#888888" stroke="#1a1a1a" stroke-width="1.0"/>
<path d="M 190,170 Q 157,118 124,200" fill="none" stroke="#c79a2e" stroke-width="1.8"/>
<rect x="119.0" y="196.0" width="10.0" height="8.0" rx="0" fill="#888888" stroke="#1a1a1a" stroke-width="1.0"/>
<path d="M 230,170 Q 263,118 296,200" fill="none" stroke="#c79a2e" stroke-width="1.8"/>
<rect x="291.0" y="196.0" width="10.0" height="8.0" rx="0" fill="#888888" stroke="#1a1a1a" stroke-width="1.0"/>
<path d="M 260,170 Q 298,118 336,200" fill="none" stroke="#c79a2e" stroke-width="1.8"/>
<rect x="331.0" y="196.0" width="10.0" height="8.0" rx="0" fill="#888888" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a06000" text-anchor="middle">тонкі золоті дротики</text>
<text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">по одному дротику на контакт, лише з краю кристала</text>
<text x="570.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Flip-chip (перевернутий кристал)</text>
<rect x="420.0" y="200.0" width="300.0" height="30.0" rx="0" fill="#2f6f3f" stroke="#163b21" stroke-width="2.0"/>
<rect x="500.0" y="150.0" width="140.0" height="34.0" rx="0" fill="#9fb0c8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="570.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кристал (лицем униз)</text>
<circle cx="512.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="531.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="550.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="569.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="588.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="607.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="626.0" cy="192.0" r="6.0" fill="#c0c0c0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="570.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кульки припою прямо під кристалом</text>
<text x="570.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">коротший шлях — швидше й більше з'єднань</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Дротики дешеві й усюди; перевернутий кристал дає сотні коротких з'єднань</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одразу під усією площею — його беруть, коли виводів багато або потрібна швидкість.</text>
</svg>