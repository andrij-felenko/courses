<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">QFN на столі: маршрут і пастка</text>
<rect x="45.0" y="80.0" width="210.0" height="140.0" rx="12" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.2"/>
<text x="150.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1. Флюс і ключ</text>
<line x1="61.0" y1="120.0" x2="239.0" y2="120.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="150.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">щедро флюсу на</tspan><tspan x="150.0" dy="15.0">майданчики; кут-ключ</tspan><tspan x="150.0" dy="15.0">(скіс) = вивід 1</tspan></text>
<rect x="275.0" y="80.0" width="210.0" height="140.0" rx="12" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="380.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Протягування</text>
<line x1="291.0" y1="120.0" x2="469.0" y2="120.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="380.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">крапля жала вздовж</tspan><tspan x="380.0" dy="15.0">ряду, надлишок —</tspan><tspan x="380.0" dy="15.0">мідним обплетенням</tspan></text>
<rect x="505.0" y="80.0" width="210.0" height="140.0" rx="12" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/>
<text x="610.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Теплове поле</text>
<line x1="521.0" y1="120.0" x2="699.0" y2="120.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="610.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">велике поле під низом</tspan><tspan x="610.0" dy="15.0">без via в платі</tspan><tspan x="610.0" dy="15.0">знизу не прогріти</tspan></text>
<line x1="255.0" y1="150.0" x2="275.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="485.0" y1="150.0" x2="505.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">QFN реально посадити на столі: головна пастка — теплове поле під центром,</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">яке без перехідних отворів (via) знизу прогріти майже неможливо.</text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">BGA цей маршрут уже не бере — контакт під центром, лише повний розплав корпусу.</text>
</svg>