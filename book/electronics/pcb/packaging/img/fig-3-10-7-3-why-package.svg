<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
<rect width="720" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо кристалу корпус</text>
<rect x="40.0" y="80.0" width="210.0" height="120.0" rx="12" fill="#f7f7f7" stroke="#1f47b5" stroke-width="2.2"/>
<text x="145.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Захист</text>
<text x="145.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">крихкий кремній — у міцну</text>
<text x="145.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оболонку від вологи й ударів</text>
<rect x="264.0" y="80.0" width="210.0" height="120.0" rx="12" fill="#f7f7f7" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="369.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Масштаб виводів</text>
<text x="369.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мікронні площадки кристала →</text>
<text x="369.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">контакти, які можна паяти</text>
<rect x="488.0" y="80.0" width="210.0" height="120.0" rx="12" fill="#f7f7f7" stroke="#c0271e" stroke-width="2.2"/>
<text x="593.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Відведення тепла</text>
<text x="593.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тепло від кристала — назовні,</text>
<text x="593.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">до плати й радіатора</text>
<text x="360.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Без корпуса кристал не вживеш: він мікроскопічний, крихкий і гарячий. Корпус робить його придатним</text>
<text x="360.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">до плати — захищає, виводить контакти до паяльного масштабу й відводить тепло.</text>
</svg>
