<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відбиття від кінця: скільки хвилі вертає, вирішує Γ</text>
<line x1="70.0" y1="120.0" x2="470.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="270.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лінія  Z₀ = 50 Ω</text>
<line x1="100.0" y1="104.0" x2="220.0" y2="104.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="160.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">падаюча</text>
<line x1="440.0" y1="140.0" x2="320.0" y2="140.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="378.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">відбита = Γ·падаюча</text>
<line x1="470.0" y1="86.0" x2="470.0" y2="154.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="470.0" y="98.0" width="46.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="493.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Z_L</text>
<rect x="163.0" y="180.5" width="214.1" height="27.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="270.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Γ = (Z_L − Z₀) / (Z_L + Z₀)</tspan></text>
<text x="560.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Z_L → ∞  (відкрито)</text>
<rect x="681.8" y="101.5" width="56.5" height="25.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="710.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="710.0" dy="0.0">Γ = +1</tspan></text>
<text x="560.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="560.0" dy="0.0">уся хвиля назад,</tspan><tspan x="560.0" dy="13.0">той самий знак</tspan></text>
<text x="560.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Z_L = Z₀  (узгоджено)</text>
<rect x="685.5" y="193.5" width="49.0" height="25.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="710.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="710.0" dy="0.0">Γ = 0</tspan></text>
<text x="560.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="560.0" dy="0.0">нічого не вертає —</tspan><tspan x="560.0" dy="13.0">вся енергія пройшла</tspan></text>
<text x="560.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Z_L = 0  (коротко)</text>
<rect x="681.8" y="285.5" width="56.5" height="25.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="710.0" y="302.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="710.0" dy="0.0">Γ = −1</tspan></text>
<text x="560.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="560.0" dy="0.0">уся хвиля назад,</tspan><tspan x="560.0" dy="13.0">оберт. знак</tspan></text>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Γ = 0 (узгоджено) — жодного відлуння; будь-яке неузгодження вертає частину назад</text>
</svg>