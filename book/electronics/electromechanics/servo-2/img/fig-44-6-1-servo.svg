<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Серво — це маленький замкнений контур: командуєш КУТ, не швидкість</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">усередині мотор + редуктор + давач кута + схема, що тримає задану позицію</text>
<rect x="60" y="110" width="470" height="250" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="295" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">серворушій (servo)</text>
<text x="70" y="196" font-size="11" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">ШІМ →</text>
<text x="70" y="212" font-size="10" fill="#0a8f3c" text-anchor="start" font-weight="normal" font-style="normal">бажаний кут</text>
<circle cx="170" cy="200" r="20" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="170" y="205" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Σ</text>
<line x1="132" y1="200" x2="150" y2="200" stroke="#0a8f3c" stroke-width="1.8" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="230" y="178" width="80" height="44" rx="8" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="270" y="204" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
<line x1="190" y1="200" x2="228" y2="200" stroke="#cc0000" stroke-width="1.8" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="209" y="190" font-size="8.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">похибка</text>
<rect x="340" y="178" width="86" height="44" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="383" y="204" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">редуктор</text>
<line x1="310" y1="200" x2="338" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="470" cy="200" r="16" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="470" y1="200" x2="506" y2="176" stroke="#1a1a1a" stroke-width="4" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="426" y1="200" x2="454" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="486" y="230" font-size="9.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">вал (качалка)</text>
<line x1="470" y1="216" x2="470" y2="330" stroke="#d98a00" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="470" y1="330" x2="170" y2="330" stroke="#d98a00" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="170" y1="330" x2="170" y2="222" stroke="#d98a00" stroke-width="1.6" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="320" y="322" font-size="10.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">потенціометр міряє СПРАВЖНІЙ кут вала</text>
<rect x="560" y="130" width="360" height="210" rx="12" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="740" y="156" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Мотор vs Серво</text>
<text x="580" y="186" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">МОТОР: командуєш ШВИДКІСТЬ —</text>
<text x="580" y="206" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">крутиться безперервно (тяга).</text>
<text x="580" y="226" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="580" y="246" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">СЕРВО: командуєш КУТ —</text>
<text x="580" y="266" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">повертає вал у позицію й ТРИМАЄ.</text>
<text x="580" y="286" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="580" y="306" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Це той самий зворотний зв'язок,</text>
<text x="580" y="326" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">що в ПІД із Розділу 34 — лише в залізі.</text>
<text x="480.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Схема щомиті порівнює заданий кут із виміряним і підкручує мотор, поки різниця не зникне, — крихітний автопілот для одного вала.</text>
</svg>
