<rect x="415.0" y="82.8" width="290.0" height="78.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="108.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Накопичувач фази</tspan><tspan x="560.0" dy="18.2">acc += M</tspan><tspan x="560.0" dy="18.2">(32 біти)</tspan></text>
<rect x="785.0" y="82.8" width="290.0" height="78.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="108.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Індекс таблиці</tspan><tspan x="930.0" dy="18.2">i = acc &gt;&gt; 24</tspan><tspan x="930.0" dy="18.2">(старші 8 бітів)</tspan></text>
<rect x="785.0" y="283.9" width="290.0" height="60.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="930.0" y="309.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Таблиця 256 слів</tspan><tspan x="930.0" dy="18.2">готове слово BSRR</tspan></text>
<rect x="415.0" y="283.9" width="290.0" height="60.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="309.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Один 32-бітний запис</tspan><tspan x="560.0" dy="18.2">GPIOA→BSRR = tab[i]</tspan></text>
<rect x="45.0" y="283.9" width="290.0" height="60.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="309.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Драбина R-2R</tspan><tspan x="190.0" dy="18.2">аналоговий рівень</tspan></text>
