<text x="62.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Vout</text>
<text x="560.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">крок сітки частот Δf = fs / 2³²</text>
<text x="956.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="956.0" dy="0.0">решта 24 бітів фази</tspan><tspan x="956.0" dy="16.9">не гине — копиться далі</tspan></text>
<text x="560.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">усі вісім бітів міняються разом — проміжних комбінацій немає</text>
<text x="630.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">у перериванні лишається три дії: додати, зсунути, записати</text>
</svg>