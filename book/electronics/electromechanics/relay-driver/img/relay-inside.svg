<text x="470.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">мережа, мотор, нагрівач</text>
<text x="380.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Слабкий струм у котушці рухає якір, той перемикає COM між NC і NO — і ці контакти комутують потужне коло.</text>
