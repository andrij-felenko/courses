<rect x="582.3" y="88.2" width="145.4" height="59.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="655.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">біля власної частоти</tspan><tspan x="655.0" dy="14.3">резонатор перевертає</tspan><tspan x="655.0" dy="14.3">фазу на пів оберту</tspan></text>
