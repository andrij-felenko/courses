<circle cx="456.0" cy="150.0" r="42.0" fill="#eef2f8" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="456.0" cy="150.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<circle cx="584.0" cy="150.0" r="42.0" fill="#fbeee6" stroke="#c0392b" stroke-width="1.8"/>
