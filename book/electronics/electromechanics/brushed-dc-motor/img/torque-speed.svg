<rect x="420.0" y="93.9" width="270.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="555.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">момент  ∝  струм</tspan><tspan x="555.0" dy="18.2">M = kT · I</tspan></text>
<text x="555.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сила на провід у полі → крутить</text>
