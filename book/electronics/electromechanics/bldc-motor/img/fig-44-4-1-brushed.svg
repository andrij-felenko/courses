<circle cx="700.0" cy="332.0" r="11" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="700.0" y="336.0" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<circle cx="642.0172439427031" cy="307.9827560572969" r="11" fill="#e0e6fd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="642.0172439427031" y="311.9827560572969" font-size="9" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<circle cx="618.0" cy="250.0" r="11" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="618.0" y="254.0" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<circle cx="642.0172439427031" cy="192.01724394270312" r="11" fill="#e0e6fd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="642.0172439427031" y="196.01724394270312" font-size="9" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<circle cx="700.0" cy="168.0" r="11" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="700.0" y="172.0" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<circle cx="757.9827560572969" cy="192.0172439427031" r="11" fill="#e0e6fd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="757.9827560572969" y="196.0172439427031" font-size="9" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<circle cx="700" cy="250" r="50" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="700.0" y="284.0" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="674.0192378864668" y="239.0" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="725.9807621135332" y="239.0" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<text x="700" y="314" font-size="9.5" fill="#0a8f3c" text-anchor="middle" font-weight="normal" font-style="normal">обмотки на СТАТОРІ</text>
<text x="700" y="180" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">магніти на дзвоні-роторі</text>
<rect x="820" y="220" width="110" height="60" rx="8" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="875" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ESC</text>
<text x="875" y="264" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">комутує</text>
<line x1="796" y1="250" x2="818" y2="250" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="580" y="380" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">без щіток → без зносу й іскор;</text>
<text x="580" y="397" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ефективний, велика питома потужність;</text>
<text x="580" y="414" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">комутацію робить електроніка (ESC).</text>
<text x="480.0" y="486" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Ідея проста: те, що крутилось і терлось (обмотки + щітки), зробили нерухомим, а перемикання струму віддали транзисторам.</text>
