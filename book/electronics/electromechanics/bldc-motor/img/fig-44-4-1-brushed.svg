  <rect x="0" y="0" width="960" height="500" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Чому дрони літають на безщіткових моторах</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">щітки прибрали: обмотки переїхали на статор, комутацію робить електроніка</text>
<text x="240" y="100" font-size="13.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Щіткований (brushed)</text>
<circle cx="240" cy="250" r="96" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="218" y="158" width="44" height="22" rx="4" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="240" y="174" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<rect x="218" y="320" width="44" height="22" rx="4" fill="#e0e6fd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="240" y="336" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<circle cx="240" cy="250" r="48" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="240" y="246" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">обмотки</text>
<text x="240" y="262" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">на РОТОРІ</text>
<line x1="144" y1="250" x2="190" y2="250" stroke="#1a1a1a" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="336" y1="250" x2="290" y2="250" stroke="#1a1a1a" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="144" y="242" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">щітка</text>
<text x="336" y="242" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">щітка</text>
<text x="120" y="380" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">щітки труться, іскрять і зношуються;</text>
<text x="120" y="397" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">обмежують оберти й потужність.</text>
<text x="700" y="100" font-size="13.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Безщітковий (BLDC)</text>
<circle cx="700" cy="250" r="96" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="782.0" cy="250.0" r="11" fill="#fde0e0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.2"/>
<text x="782.0" y="254.0" font-size="9" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<circle cx="757.9827560572969" cy="307.9827560572969" r="11" fill="#e0e6fd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
