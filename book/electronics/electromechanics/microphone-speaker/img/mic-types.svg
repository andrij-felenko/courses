<rect x="89.2" y="229.3" width="101.5" height="45.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="248.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">заряд «вшито»</tspan><tspan x="140.0" dy="14.3">в електрет</tspan></text>
<text x="140.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рух → зміна C → напруга</text>
<text x="140.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">потрібен FET-підсилювач</text>
<text x="140.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">дешевий, всюди до ~2010-х</text>
