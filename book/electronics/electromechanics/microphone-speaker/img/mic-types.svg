<circle cx="408.0" cy="110.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="408.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="390.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">той самий конденсатор,
але на кремнії</text>
<rect x="326.7" y="229.3" width="126.6" height="45.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="248.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">мембрана</tspan><tspan x="390.0" dy="14.3">витравлена в чипі</tspan></text>
<text x="390.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">підсилювач у тому ж корпусі</text>
<text x="390.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">часто одразу цифровий вихід</text>
<text x="390.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">у кожному телефоні</text>
<rect x="520.0" y="50.0" width="240.0" height="350.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="640.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний</text>
