<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікшування на прикладі елевонів «літаючого крила»</text>
<rect x="60.0" y="80.0" width="300.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">лівий елевон  = тангаж + крен</tspan><tspan x="210.0" dy="16.9">правий елевон = тангаж − крен</tspan></text>
<text x="250.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">обидві вгору → підняти ніс (тангаж)</text>
<path d="M 250 220 L 140 280 L 360 280 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="250.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">крило</text>
<line x1="170.0" y1="280.0" x2="170.0" y2="246.0" stroke="#c0392b" stroke-width="4.0"/>
<line x1="170.0" y1="280.0" x2="170.0" y2="246.0" stroke="#c0392b" stroke-width="4.0" marker-end="url(#arrow)"/>
<line x1="330.0" y1="280.0" x2="330.0" y2="246.0" stroke="#c0392b" stroke-width="4.0"/>
<line x1="330.0" y1="280.0" x2="330.0" y2="246.0" stroke="#c0392b" stroke-width="4.0" marker-end="url(#arrow)"/>
<text x="560.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">різнойменно → накренити (крен)</text>
<path d="M 560 220 L 450 280 L 670 280 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="560.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">крило</text>
<line x1="480.0" y1="280.0" x2="480.0" y2="246.0" stroke="#c0392b" stroke-width="4.0"/>
<line x1="480.0" y1="280.0" x2="480.0" y2="246.0" stroke="#c0392b" stroke-width="4.0" marker-end="url(#arrow)"/>
<line x1="640.0" y1="280.0" x2="640.0" y2="314.0" stroke="#2457d6" stroke-width="4.0"/>
<line x1="640.0" y1="280.0" x2="640.0" y2="314.0" stroke="#2457d6" stroke-width="4.0" marker-end="url(#arrow)"/>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ті самі дві поверхні несуть і тангаж, і крен — мікшер ховає цю геометрію</text>
</svg>