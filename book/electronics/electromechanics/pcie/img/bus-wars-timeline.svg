<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві хвилі шинних воєн: що вижило й чому</text>
<text x="490.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Хвиля перша — паралельні шини персонального комп'ютера</text>
<rect x="31.0" y="104.0" width="166.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="114.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="114.0" dy="0.0">1987</tspan><tspan x="114.0" dy="16.2">MCA (IBM)</tspan><tspan x="114.0" dy="16.2">розрив + ліцензія</tspan></text>
<rect x="219.0" y="104.0" width="166.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="302.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">1988</tspan><tspan x="302.0" dy="16.2">EISA («дев'ятка»)</tspan><tspan x="302.0" dy="16.2">надмножина ISA</tspan></text>
<rect x="407.0" y="104.0" width="166.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">1992</tspan><tspan x="490.0" dy="16.2">VL-Bus (VESA)</tspan><tspan x="490.0" dy="16.2">прив'язана до 486</tspan></text>
<rect x="595.0" y="104.0" width="166.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="678.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="678.0" dy="0.0">1992</tspan><tspan x="678.0" dy="16.2">PCI 1.0 (Intel)</tspan><tspan x="678.0" dy="16.2">свій договір</tspan></text>
<rect x="783.0" y="104.0" width="166.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="866.0" y="130.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="866.0" dy="0.0">1996</tspan><tspan x="866.0" dy="16.2">AGP (Intel)</tspan><tspan x="866.0" dy="16.2">латка для графіки</tspan></text>
<line x1="200.0" y1="142.0" x2="216.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="388.0" y1="142.0" x2="404.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="576.0" y1="142.0" x2="592.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="764.0" y1="142.0" x2="780.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="60.0" y1="236.0" x2="920.0" y2="236.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,6"/>
<text x="490.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Хвиля друга — чим замінити паралельну шину</text>
<rect x="32.5" y="292.0" width="140.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="102.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="102.5" dy="0.0">1998</tspan><tspan x="102.5" dy="16.2">PCI-X</tspan><tspan x="102.5" dy="16.2">IBM · HP · Compaq</tspan></text>
<rect x="187.5" y="292.0" width="140.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="257.5" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">1999</tspan><tspan x="257.5" dy="15.0">InfiniBand</tspan><tspan x="257.5" dy="15.0">нове ПЗ для всього</tspan></text>
<rect x="342.5" y="292.0" width="140.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="412.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">2001</tspan><tspan x="412.5" dy="16.2">HyperTransport</tspan><tspan x="412.5" dy="16.2">AMD, паралельна</tspan></text>
<rect x="497.5" y="292.0" width="140.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="567.5" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="567.5" dy="0.0">2001</tspan><tspan x="567.5" dy="15.0">3GIO (AWG)</tspan><tspan x="567.5" dy="15.0">Intel + промоутери</tspan></text>
<rect x="652.5" y="292.0" width="140.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="722.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="722.5" dy="0.0">2002</tspan><tspan x="722.5" dy="16.2">PCI Express</tspan><tspan x="722.5" dy="16.2">старий договір</tspan></text>
<rect x="807.5" y="292.0" width="140.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="877.5" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="877.5" dy="0.0">2004</tspan><tspan x="877.5" dy="16.2">чипсети 915/925</tspan><tspan x="877.5" dy="16.2">AGP прибрано</tspan></text>
<line x1="175.5" y1="330.0" x2="184.5" y2="330.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="330.5" y1="330.0" x2="339.5" y2="330.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="485.5" y1="330.0" x2="494.5" y2="330.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="640.5" y1="330.0" x2="649.5" y2="330.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="795.5" y1="330.0" x2="804.5" y2="330.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="120.0" y="424.0" width="26.0" height="18.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="158.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">зберегло сумісність із уже наявним — вижило на масовому ринку</text>
<rect x="120.0" y="456.0" width="26.0" height="18.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="158.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">вимагало розриву (нові плати або нове ПЗ) — лишилося в ніші</text>
<rect x="120.0" y="488.0" width="26.0" height="18.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="158.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">проміжне: латка до чинної шини або вужча ніша</text>
<text x="490.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна розвилка двічі: технічна перевага не рятувала того, хто вимагав переробки вже зробленого.</text>
</svg>