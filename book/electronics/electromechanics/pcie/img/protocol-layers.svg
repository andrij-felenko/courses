<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пакет PCIe: кожен рівень додає свою обгортку навколо попереднього</text>
<rect x="155.0" y="250.0" width="66.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="188.0" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="188.0" dy="0.0">кадр</tspan><tspan x="188.0" dy="15.0">STP</tspan></text>
<rect x="221.0" y="250.0" width="84.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="263.0" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="263.0" dy="0.0">номер</tspan><tspan x="263.0" dy="15.0">Seq#</tspan></text>
<rect x="305.0" y="250.0" width="130.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">заголовок</tspan><tspan x="370.0" dy="15.0">TLP</tspan></text>
<rect x="435.0" y="250.0" width="170.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">дані</tspan></text>
<rect x="605.0" y="250.0" width="80.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="645.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">LCRC</tspan></text>
<rect x="685.0" y="250.0" width="60.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">кадр</tspan><tspan x="715.0" dy="15.0">END</tspan></text>
<rect x="300.0" y="216.0" width="310.0" height="92.0" rx="8" fill="none" stroke="#27ae60" stroke-width="2"/>
<text x="455.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">транзакційний рівень — TLP: заголовок + дані  (СЕНС)</text>
<rect x="211.0" y="184.0" width="484.0" height="124.0" rx="8" fill="none" stroke="#2457d6" stroke-width="2"/>
<text x="453.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">рівень з'єднання — + номер + LCRC, квитанції ACK/NAK  (НАДІЙНІСТЬ)</text>
<rect x="140.0" y="152.0" width="620.0" height="156.0" rx="8" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="450.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">фізичний рівень — + кадр + скремблювання/кодування  (ДРІТ)</text>
<text x="450.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Зверху вниз два рівні незмінні роками: транзакційний і з'єднання.</text>
<text x="450.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Міняється лише фізичний: 2.5 → 64 ГТ/с, 8b/10b → PAM4 — а договір пакета той самий.</text>
