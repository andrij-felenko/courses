<text x="112.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">АЦП 5 МГц: наступний відлік уже через 20 тактів</text>
