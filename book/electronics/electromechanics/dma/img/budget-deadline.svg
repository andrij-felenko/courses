<text x="460.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Час відгуку той самий — 28 тактів; шина при цьому зайнята лише на третину.</text>
<text x="460.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Блокування B = 23 такти — це неподільний пакет на 16 слів у зовнішню SDRAM.</text>
