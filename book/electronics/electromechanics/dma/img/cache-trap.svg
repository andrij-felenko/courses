<text x="450.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">На ядрах із кешем даних (напр. Cortex-M7) ОЗП і кеш — дві версії однієї пам'яті; DMA бачить лише ОЗП.</text>
