<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="450.0" y1="70.0" x2="450.0" y2="392.0" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="5,6"/>
<text x="220.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Кільцевий режим: буфер без кінця</text>
<circle cx="220.0" cy="232.0" r="92.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<line x1="128.0" y1="232.0" x2="312.0" y2="232.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="220.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">половина A</text>
<text x="220.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">половина B</text>
<circle cx="220.0" cy="140.0" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">повний → IRQ + обгортка</text>
<circle cx="220.0" cy="324.0" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">половина → IRQ</text>
<circle cx="312.0" cy="232.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="324.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">DMA пише</text>
<text x="220.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дійшовши кінця — DMA сам вертається на початок</text>
<text x="680.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Пінг-понг: возять і читають нарізно</text>
<rect x="580.0" y="120.0" width="200.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="680.0" y="148.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">половина A</tspan><tspan x="680.0" dy="15.6">ядро читає (готова)</tspan></text>
<text x="680.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">⇅  міняються ролями</text>
<rect x="580.0" y="232.0" width="200.0" height="64.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.8"/><text x="680.0" y="260.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">половина B</tspan><tspan x="680.0" dy="15.6">DMA наповнює</tspan></text>
<text x="680.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">поки DMA наповнює одну половину,</text>
<text x="680.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ядро спокійно читає іншу — потік без розривів.</text>
</svg>