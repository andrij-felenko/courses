<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="432" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де живе розум возія: три відповіді, і всі три дожили до нас</text>
<line x1="320.0" y1="60.0" x2="320.0" y2="378.0" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="5,6"/>
<line x1="640.0" y1="60.0" x2="640.0" y2="378.0" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="5,6"/>
<text x="160.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">У процесорі</text>
<text x="160.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">DEC PDP-8, трициклова «data break», 1965</text>
<rect x="35.0" y="110.0" width="250.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">пристрій</tspan><tspan x="160.0" dy="15.0">лише піднімає запит</tspan></text>
<line x1="160.0" y1="154.0" x2="160.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="184.0" width="250.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="160.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ПРОЦЕСОР</tspan><tspan x="160.0" dy="13.0">адреса й лічильник — у комірках пам'яті</tspan></text>
<line x1="160.0" y1="236.0" x2="160.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="266.0" width="250.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">пам'ять</tspan></text>
<text x="160.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">три такти пам'яті на одне слово</text>
<text x="160.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">пристрій дешевий, смуга шини дорога</text>
<text x="480.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">В окремому контролері</text>
<text x="480.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Intel 8237 (1979) і DMA сучасного МК</text>
<rect x="355.0" y="110.0" width="250.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">пристрій</tspan><tspan x="480.0" dy="15.0">піднімає запит</tspan></text>
<line x1="480.0" y1="154.0" x2="480.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="355.0" y="184.0" width="250.0" height="52.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="480.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">КОНТРОЛЕР DMA</tspan><tspan x="480.0" dy="14.3">канали: src · dst · count</tspan></text>
<line x1="480.0" y1="236.0" x2="480.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="355.0" y="266.0" width="250.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">пам'ять</tspan></text>
<text x="480.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">один такт пам'яті на слово</text>
<text x="480.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">один блок обслуговує всі пристрої</text>
<text x="800.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">У самому пристрої</text>
<text x="800.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">SAGE, а згодом PCI та PCIe: bus mastering</text>
<rect x="675.0" y="110.0" width="250.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="800.0" y="132.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">ПРИСТРІЙ — сам ведучий</tspan><tspan x="800.0" dy="14.3">свої адреса й лічильник</tspan></text>
<line x1="800.0" y1="162.0" x2="800.0" y2="264.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="788.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">без посередника</text>
<rect x="675.0" y="266.0" width="250.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="290.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">пам'ять</tspan></text>
<text x="800.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пристрій сам ходить шиною</text>
<text x="800.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">найшвидше — і найнебезпечніше</text>
<text x="480.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">У сучасному довіднику ці три відповіді звуться «DMA request», «DMA controller» і «bus master».</text>
</svg>