<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один елемент за «запитом»: рукостискання й лічильник</text>
<rect x="365.0" y="52.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="440.0" y="79.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">ЯДРО</tspan></text>
<rect x="40.0" y="150.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="115.0" y="186.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Периферія</tspan><tspan x="115.0" dy="15.6">(напр. АЦП)</tspan><tspan x="115.0" dy="15.6">регістр даних</tspan></text>
<rect x="690.0" y="150.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="194.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">ОЗП</tspan><tspan x="765.0" dy="16.9">буфер</tspan></text>
<rect x="330.0" y="130.0" width="220.0" height="150.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="440.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Контролер DMA</text>
<rect x="345.0" y="162.0" width="190.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="440.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">src → адреса джерела</tspan></text>
<rect x="345.0" y="197.0" width="190.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="440.0" y="215.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">dst → адреса приймача</tspan></text>
<rect x="345.0" y="232.0" width="190.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="440.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">count → скільки лишилось</tspan></text>
<line x1="192.0" y1="178.0" x2="328.0" y2="178.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">① запит: новий байт</text>
<line x1="328.0" y1="214.0" x2="194.0" y2="214.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="262.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">② DMA читає регістр</text>
<line x1="552.0" y1="195.0" x2="688.0" y2="195.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">③ пише в ОЗП</text>
<text x="440.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">④ dst += ширина, count −= 1, запит знято</text>
<line x1="440.0" y1="128.0" x2="440.0" y2="100.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="452.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">⑤ count = 0 → IRQ «готово»</text>
<rect x="80.0" y="330.0" width="720.0" height="74.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="440.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Поки count &gt; 0, DMA чекає наступного запиту й возить рівно один елемент — ядро не бере участі.</text>
<text x="440.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переривання приходить раз на весь блок, а не на кожен байт.</text>
</svg>