<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жорсткість, точність і два класи контурів</text>
<line x1="70.0" y1="250.0" x2="350.0" y2="250.0" stroke="#333333" stroke-width="1.5"/>
<line x1="70.0" y1="250.0" x2="70.0" y2="80.0" stroke="#333333" stroke-width="1.5"/>
<text x="346.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">помилка</text>
<text x="74.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">сила корекції</text>
<rect x="70.0" y="80.0" width="34.0" height="170.0" rx="0" fill="#f0f0f0" stroke="none" stroke-width="1.5"/>
<text x="108.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">мертва зона</text>
<line x1="104.0" y1="250.0" x2="320.0" y2="92.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="324.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">жорстка</text>
<line x1="104.0" y1="250.0" x2="346.0" y2="194.0" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="6 5"/>
<text x="346.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">м'яка</text>
<text x="210.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">крутіший нахил → менший</text>
<text x="210.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">залишковий відхил під вагою</text>
<text x="590.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">два класи серворушіїв</text>
<rect x="440.0" y="92.0" width="300.0" height="70.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="123.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">контур ПОЗИЦІЇ</tspan><tspan x="590.0" dy="15.6">давач кута → тримає КУТ</tspan></text>
<rect x="440.0" y="182.0" width="300.0" height="70.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">контур ШВИДКОСТІ</tspan><tspan x="590.0" dy="15.6">давач обертів → тримає ОБЕРТИ</tspan></text>
<text x="590.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">та сама петля, інша вимірювана величина</text>
<text x="590.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(часто вкладені: позиція над швидкістю)</text>
</svg>