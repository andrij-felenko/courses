<text x="585.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">верх і низ кадру — у різні миті</text>
<text x="410.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Глобальна знімає весь кадр одночасно; рядкова веде вікно експозиції зверху вниз — звідси всі її артефакти.</text>
