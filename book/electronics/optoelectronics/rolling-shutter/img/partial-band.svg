<text x="400.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Глобальна заслінка зловила б цілий спалах усім кадром — у рядкової кожен рядок «бачить» світло у свою мить.</text>
