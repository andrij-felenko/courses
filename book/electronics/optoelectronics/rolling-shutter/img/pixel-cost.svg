<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна глобальності: пам'ять у кожному пікселі</text>
<rect x="60.0" y="76.0" width="320.0" height="230.0" rx="12" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/>
<text x="220.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">РЯДКОВИЙ піксель (≈4T)</text>
<circle cx="140.0" cy="196.0" r="42.0" fill="#bbf7d0" stroke="#27ae60" stroke-width="2.0"/>
<text x="140.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">фотодіод</text>
<text x="140.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">велика площа на світло</text>
<rect x="235.0" y="160.0" width="120.0" height="30.0" rx="5" fill="white" stroke="#6b7280" stroke-width="1.2"/>
<text x="295.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">трохи логіки</text>
<text x="295.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle"><tspan x="295.0" dy="0.0">зчитали рядок —</tspan><tspan x="295.0" dy="13.3">одразу віддали назовні.</tspan><tspan x="295.0" dy="13.3">Сховку нема.</tspan></text>
<text x="220.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700">дешево, дрібний піксель, більше світла</text>
<rect x="440.0" y="76.0" width="320.0" height="230.0" rx="12" fill="#fff5e6" stroke="#d98a00" stroke-width="1.8"/>
<text x="600.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="700">ГЛОБАЛЬНИЙ піксель (5T+ зі сховком)</text>
<circle cx="512.0" cy="194.0" r="30.0" fill="#fde68a" stroke="#d98a00" stroke-width="2.0"/>
<text x="512.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b06b00" text-anchor="middle">фотодіод</text>
<text x="512.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">менший</text>
<text x="512.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(місце з'їла пам'ять)</text>
<rect x="580.0" y="162.0" width="150.0" height="40.0" rx="6" fill="#fef3c7" stroke="#c0392b" stroke-width="1.8"/>
<text x="655.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">комірка пам'яті</text>
<text x="655.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b06b00" text-anchor="middle"><tspan x="655.0" dy="0.0">тримає заряд, поки</tspan><tspan x="655.0" dy="13.3">кадр зчитується рядок</tspan><tspan x="655.0" dy="13.3">за рядком назовні</tspan></text>
<text x="600.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b06b00" text-anchor="middle" font-weight="700">дорожче, складніший піксель, менше світла</text>
<text x="410.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Рядковому пікселю сховок не потрібен — він віддає заряд одразу, тож виходить простішим і дешевшим.</text>
<text x="410.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Глобальному треба «запам'ятати» весь кадр в одну мить — а пам'ять на кожен піксель коштує площі й грошей.</text>
</svg>