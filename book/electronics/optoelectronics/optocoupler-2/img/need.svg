<text x="410.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">З'єднати мідь = пустити сотні вольт у логіку й завадні петлі по «землях». Потрібен зв'язок БЕЗ струму.</text>
