<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витримка: скільки тримати відерце відкритим</text>
<text x="400.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">довша набирає більше світла, та розмиває рух</text>
<text x="210.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">КОРОТКА</text>
<rect x="120.0" y="100.0" width="180.0" height="96.0" rx="8" fill="#1f2937" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="210.0" cy="148.0" r="22.0" fill="none" stroke="#e5e7eb" stroke-width="2.4"/>
<text x="210.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">мало світла → темно</text>
<text x="210.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">рух застигає різко</text>
<text x="590.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДОВГА</text>
<rect x="500.0" y="100.0" width="180.0" height="96.0" rx="8" fill="#9aa3b2" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="566" cy="148" r="20" fill="none" stroke="#1f2937" stroke-width="2" stroke-opacity="0.30"/>
<circle cx="582" cy="148" r="20" fill="none" stroke="#1f2937" stroke-width="2" stroke-opacity="0.45"/>
<circle cx="598" cy="148" r="20" fill="none" stroke="#1f2937" stroke-width="2" stroke-opacity="0.60"/>
<circle cx="614" cy="148" r="20" fill="none" stroke="#1f2937" stroke-width="2" stroke-opacity="0.75"/>
<text x="590.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">багато світла → яскраво</text>
<text x="590.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">рух розмазується (motion blur)</text>
<line x1="310.0" y1="300.0" x2="490.0" y2="300.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">довша витримка</text>
<text x="400.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">більше світла, більше змазування</text>
<text x="400.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">На тремкому летючому апараті радше коротша витримка: різкий темний кадр кращий за яскравий мазок.</text>
</svg>