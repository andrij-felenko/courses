<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стеля й підлога пікселя</text>
<text x="380.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">корисний піксель лежить між шумом і насиченням</text>
<rect x="300.0" y="80.0" width="160.0" height="270.0" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="300.0" y="80.0" width="160.0" height="54.0" rx="6" fill="#fde2e2" stroke="none" stroke-width="1.5"/>
<line x1="300.0" y1="134.0" x2="460.0" y2="134.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="5,3"/>
<text x="380.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НАСИЧЕННЯ</text>
<text x="380.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(пересвіт, біле)</text>
<rect x="300.0" y="134.0" width="160.0" height="158.0" rx="6" fill="#eafaef" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">КОРИСНИЙ</text>
<text x="380.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">діапазон</text>
<line x1="300.0" y1="292.0" x2="460.0" y2="292.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="5,3"/>
<rect x="300.0" y="292.0" width="160.0" height="58.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ПІДЛОГА ШУМУ</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">(деталь тоне)</text>
<rect x="300.0" y="80.0" width="160.0" height="270.0" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="288.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">повна місткість</text>
<text x="288.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">(full-well)</text>
<text x="472.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">тепловий шум,</text>
<text x="472.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">завади</text>
<line x1="552.0" y1="134.0" x2="552.0" y2="292.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="552.0" y1="292.0" x2="552.0" y2="134.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="560.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">динамічний</text>
<text x="560.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">діапазон</text>
<text x="380.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">І пересвіт, і чорний провал — це втрачені назавжди дані: там просто нема чого витягати.</text>
