<text x="410.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Світло → електрони → заряд → напруга → число: це число і є яскравість пікселя.</text>
<text x="410.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Саме відерце сліпе до кольору — лічить усі фотони підряд, тобто міряє лише яскравість.</text>
