<circle cx="185.88276044371668" cy="256.55823020613724" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="176.4" cy="230.0" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="178.12217237062185" cy="200.22722896199602" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="192.0172439427031" cy="172.01724394270312" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="217.01268813012922" cy="150.3615842975271" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="249.99999999999997" cy="139.6" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="286.2018527017375" cy="142.6009962244323" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="319.8621499812309" cy="160.1378500187691" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="345.1595918486625" cy="190.58360646639568" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="250" y="102" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">МЕХАНІЧНЕ ТБ</text>
<text x="250" y="362" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">диск Нипкова: дірки по спіралі,</text>
<text x="250" y="378" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">крутиться й «прорізає» образ рядками</text>
<text x="250" y="402" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">✗ повільно, грубо, тендітно</text>
<rect x="610" y="160" width="180" height="140" rx="14" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="2.0"/>
<polyline points="630,190 770,190 630,205 770,205" fill="none" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4" stroke-linejoin="round"/>
<text x="700" y="234" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">пучок електронів</text>
<text x="700" y="252" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">сканує образ</text>
<text x="700" y="120" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ЕЛЕКТРОННЕ ТБ</text>
<text x="700" y="325" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">образорозкладач Фарнсворта:</text>
<text x="700" y="341" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сканує без жодної рухомої деталі</text>
<text x="700" y="365" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">✓ швидко, чітко, надійно</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Електрони легкі й безінерційні, тож сканують у тисячі разів швидше за будь-який диск — звідси й перемога.</text>
</svg>
