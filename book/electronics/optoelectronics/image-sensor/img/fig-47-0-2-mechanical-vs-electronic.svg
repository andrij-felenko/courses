<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Механічне проти електронного: чому диск програв</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">до Фарнсворта образ розкладали дірками в диску, що крутиться; він зробив це без рухомих деталей</text>
<circle cx="250" cy="230" r="110" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="290.0" cy="230.0" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="290.83547533699885" cy="246.91460771053698" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="284.2239682094289" cy="264.2239682094289" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<circle cx="270.12914854240375" cy="278.5960634100937" r="4" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
