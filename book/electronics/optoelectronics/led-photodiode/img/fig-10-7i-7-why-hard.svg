<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380">
<rect width="840" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="420.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому синій був такий важкий — і навіщо він потрібен</text>
<rect x="40.0" y="60.0" width="360.0" height="180.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="220.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дві стіни на шляху GaN</text>
<text x="220.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1. Виростити якісний кристал GaN</text>
<text x="220.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">— ґратка не сідала рівно на підкладку</text>
<text x="220.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f6e33" text-anchor="middle" font-weight="normal" font-style="normal">(розв'язок: буферний шар на сапфірі)</text>
<line x1="70.0" y1="142.0" x2="370.0" y2="142.0" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
<text x="220.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2. Зробити p-тип GaN (дірки)</text>
<text x="220.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">— легований магнієм GaN не провадив</text>
<text x="220.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f6e33" text-anchor="middle" font-weight="normal" font-style="normal">(розв'язок: промінь / відпал активує Mg)</text>
<text x="220.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидві — у §2.5.2–2.5.3, лише для GaN</text>
<rect x="440.0" y="60.0" width="360.0" height="180.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="620.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">навіщо саме синій</text>
<rect x="490.0" y="110.0" width="70.0" height="60.0" rx="6" fill="#1f47b5" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="525.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">синій</text>
<rect x="490.0" y="100.0" width="70.0" height="12.0" rx="3" fill="#e7c64a" stroke="#9c6a16" stroke-width="1.2"/>
<text x="525.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#7a5510" text-anchor="middle" font-weight="normal" font-style="normal">+ люмінофор</text>
<line x1="565.0" y1="140.0" x2="615.0" y2="140.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<circle cx="660.0" cy="140.0" r="26.0" fill="#fffbe8" stroke="#e0a32e" stroke-width="2"/>
<text x="660.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">БІЛЕ</text>
<text x="620.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">синій + жовтий люмінофор = біле світло</text>
<text x="620.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(того самого трюку, що в §2.5.7)</text>
<text x="420.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Без синього не зібрати білий: червоний і зелений були, а третьої — найенергійнішої — фарби бракувало.</text>
<text x="420.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">саме тому Нобель відзначив не «ще один колір», а ключ до енергоощадного освітлення.</text>
</svg>
