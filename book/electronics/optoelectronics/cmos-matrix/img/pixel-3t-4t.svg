<text x="660.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle"><tspan x="660.0" dy="0.0">накопичення (фотодіод) відділене</tspan><tspan x="660.0" dy="12.8">від зчитування (FD) — можна відняти шум</tspan></text>
<text x="440.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Затвор переносу переливає заряд із фотодіода у плавучу дифузію лише в мить зчитування — і це уможливлює CDS.</text>
