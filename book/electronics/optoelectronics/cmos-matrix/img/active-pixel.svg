<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Активний піксель: підсилювач у самій комірці</text>
<rect x="70.0" y="70.0" width="470.0" height="270.0" rx="12" fill="#fbfbfd" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="305.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один піксель</text>
<circle cx="165.0" cy="220.0" r="46.0" fill="#dbeafe" stroke="#2457d6" stroke-width="2.0"/>
<text x="165.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="165.0" dy="0.0">фото-</tspan><tspan x="165.0" dy="13.8">діод</tspan></text>
<text x="165.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">накопичує заряд</text>
<rect x="130.0" y="122.0" width="110.0" height="30.0" rx="5" fill="#fef3c7" stroke="#d98a00" stroke-width="1.5"/>
<text x="185.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b06b00" text-anchor="middle" font-weight="700">скидання</text>
<line x1="165.0" y1="174.0" x2="165.0" y2="152.0" stroke="#d98a00" stroke-width="1.5"/>
<rect x="285.0" y="180.0" width="120.0" height="78.0" rx="8" fill="#eafaef" stroke="#27ae60" stroke-width="1.8"/>
<text x="345.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">витоковий</tspan><tspan x="345.0" dy="13.7">повторювач</tspan></text>
<text x="345.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">заряд → напруга</text>
<line x1="211.0" y1="220.0" x2="283.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="248.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">читає,</text>
<text x="248.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">не виливає</text>
<rect x="430.0" y="194.0" width="90.0" height="50.0" rx="6" fill="white" stroke="#c0392b" stroke-width="1.6"/>
<text x="475.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">вибір</tspan><tspan x="475.0" dy="11.9">рядка</tspan></text>
<line x1="405.0" y1="219.0" x2="428.0" y2="219.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="520.0" y1="219.0" x2="570.0" y2="219.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="578.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">у стовпцеву</text>
<text x="578.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">лінію</text>
<text x="380.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Підсилювач у кожному пікселі читає заряд як напругу, не чіпаючи його, — це й робить піксель «активним».</text>
</svg>