<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корельована подвійна вибірка: відняти шум скидання</text>
<line x1="90.0" y1="250.0" x2="710.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="90.0" y1="250.0" x2="90.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="80.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">рівень</text>
<text x="710.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час →</text>
<text x="170.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="700">1. скидання</text>
<line x1="120.0" y1="250.0" x2="230.0" y2="250.0" stroke="#cbd5e1" stroke-width="2.0" stroke-dasharray="4,3"/>
<line x1="230.0" y1="222.0" x2="360.0" y2="222.0" stroke="#d98a00" stroke-width="3.0"/>
<text x="295.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b06b00" text-anchor="middle">порожній рівень</text>
<text x="295.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(лише шум скидання)</text>
<circle cx="300.0" cy="222.0" r="6.0" fill="#c0392b" stroke="white" stroke-width="1.4"/>
<text x="300.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">вибірка A</text>
<line x1="300.0" y1="222.0" x2="300.0" y2="250.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="520.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">2. перенос + сигнал</text>
<line x1="370.0" y1="222.0" x2="430.0" y2="132.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start">перелив</text>
<line x1="430.0" y1="132.0" x2="600.0" y2="132.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="515.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">рівень із сигналом</text>
<text x="515.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(той самий шум + сигнал)</text>
<circle cx="520.0" cy="132.0" r="6.0" fill="#c0392b" stroke="white" stroke-width="1.4"/>
<text x="520.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">вибірка B</text>
<line x1="520.0" y1="132.0" x2="520.0" y2="250.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="110.0" y="290.0" width="580.0" height="48.0" rx="10" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="400.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">B − A = чистий сигнал  (зернинка шуму скидання однакова → вираховується)</text>
<text x="400.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">заразом прибирається й сталий зсув повторювача та повільний 1/f-дрейф</text>
</svg>