<text x="408.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="408.0" dy="0.0">вузол</tspan><tspan x="408.0" dy="10.3">зберіг.</tspan></text>
