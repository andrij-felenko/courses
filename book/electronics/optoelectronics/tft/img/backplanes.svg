<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три основи активної матриці: чим швидші електрони, тим складніше робити</text>
<line x1="90.0" y1="330.0" x2="690.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">рухливість електронів — більша = швидший і дрібніший піксель →</text>
<line x1="90.0" y1="330.0" x2="90.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="34.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="34.0" dy="0.0">складність</tspan><tspan x="34.0" dy="14.3">і ціна</tspan><tspan x="34.0" dy="14.3">↑</tspan></text>
<circle cx="200.0" cy="290.0" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<rect x="154.3" y="222.8" width="91.3" height="46.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="242.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">a-Si</tspan><tspan x="200.0" dy="15.0">~1 см²/В·с</tspan></text>
<text x="200.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">аморфний кремній:</tspan><tspan x="200.0" dy="13.0">дешево, великі панелі,</tspan><tspan x="200.0" dy="13.0">але повільний</tspan></text>
<circle cx="420.0" cy="200.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="360.1" y="132.8" width="119.8" height="46.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">IGZO</tspan><tspan x="420.0" dy="15.0">~10–30 см²/В·с</tspan></text>
<text x="420.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="420.0" dy="0.0">оксид (In-Ga-Zn-O):</tspan><tspan x="420.0" dy="13.0">у 20–50× рухливіший,</tspan><tspan x="420.0" dy="13.0">малий витік → ниж. споживання</tspan></text>
<circle cx="620.0" cy="120.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="567.2" y="52.8" width="105.6" height="46.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="72.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">LTPS</tspan><tspan x="620.0" dy="15.0">~100 см²/В·с</tspan></text>
<text x="620.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">низькотемп. полікремній:</tspan><tspan x="620.0" dy="13.0">найшвидший, дрібний піксель,</tspan><tspan x="620.0" dy="13.0">лазер → дорого, дрібні екрани</tspan></text>
<line x1="200.0" y1="290.0" x2="420.0" y2="200.0" stroke="#333333" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="420.0" y1="200.0" x2="620.0" y2="120.0" stroke="#333333" stroke-width="1.4" stroke-dasharray="5,4"/>
</svg>