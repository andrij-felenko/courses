<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">HDR: коли сцена ширша за сенсор</text>
<text x="400.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">короткий кадр ловить світле, довгий — темне; зливаємо обидва</text>
<text x="115.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">КОРОТКИЙ кадр</text>
<rect x="40" y="86" width="150" height="65" rx="8" fill="#a5b4d8"/>
<rect x="40" y="151" width="150" height="65" rx="8" fill="#000000"/>
<rect x="40.0" y="86.0" width="150.0" height="130.0" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="115.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">небо добре, тінь чорна</text>
<text x="225.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<text x="325.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="700">ДОВГИЙ кадр</text>
<rect x="250" y="86" width="150" height="65" rx="8" fill="#ffffff"/>
<rect x="250" y="151" width="150" height="65" rx="8" fill="#6b7280"/>
<rect x="250.0" y="86.0" width="150.0" height="130.0" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="325.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тінь добре, небо біле</text>
<line x1="420.0" y1="151.0" x2="460.0" y2="151.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="550.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">ЗЛИТО (HDR)</text>
<rect x="475" y="86" width="150" height="65" rx="8" fill="#7c93c4"/>
<rect x="475" y="151" width="150" height="65" rx="8" fill="#5b6470"/>
<rect x="475.0" y="86.0" width="150.0" height="130.0" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="550.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">і небо, і тінь видно</text>
<rect x="660.0" y="86.0" width="130.0" height="130.0" rx="11" fill="#eafaef" stroke="#27ae60" stroke-width="1.5"/>
<text x="725.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle"><tspan x="725.0" dy="0.0">для машинного</tspan><tspan x="725.0" dy="13.3">бачення:</tspan><tspan x="725.0" dy="13.3"></tspan><tspan x="725.0" dy="13.3">вузький DR →</tspan><tspan x="725.0" dy="13.3">ціль гине</tspan><tspan x="725.0" dy="13.3">в блиску чи тіні</tspan></text>
<text x="400.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Склавши з кожного кадру добру частину, дістаємо ширший діапазон, ніж сенсор уловив би за раз.</text>
<text x="400.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Та на рухомому апараті об'єкти зсуваються між кадрами — радше беруть сенсор із ширшим власним діапазоном.</text>
</svg>