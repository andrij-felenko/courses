<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лік від зерна — більше світла, а не підсилення</text>
<text x="160.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ТЕМНО (мало фотонів)</text>
<text x="60.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сигнал</text>
<rect x="60.0" y="100.0" width="200.0" height="26.0" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<rect x="60.0" y="100.0" width="60.0" height="26.0" rx="4" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<text x="60.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">шум</text>
<rect x="60.0" y="150.0" width="200.0" height="14.0" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<rect x="60" y="150" width="44" height="14" rx="4" fill="#c0392b" fill-opacity="0.6"/>
<text x="160.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">низький SNR → зернисто</text>
<text x="160.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">СВІТЛО (багато фотонів)</text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">сигнал</text>
<rect x="60.0" y="258.0" width="200.0" height="26.0" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<rect x="60.0" y="258.0" width="184.0" height="26.0" rx="4" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="60.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">шум</text>
<rect x="60.0" y="308.0" width="200.0" height="14.0" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5"/>
<rect x="60" y="308" width="26" height="14" rx="4" fill="#c0392b" fill-opacity="0.6"/>
<text x="160.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">високий SNR → чисто</text>
<rect x="440.0" y="96.0" width="300.0" height="96.0" rx="10" fill="#f4f4f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="590.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">SNR ∝ √(фотони)</text>
<text x="590.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">учетверо світла → удвічі чистіше</text>
<text x="590.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">учетверо менше зерна</text>
<rect x="440.0" y="224.0" width="300.0" height="130.0" rx="10" fill="#fff5e6" stroke="#d98a00" stroke-width="1.6"/>
<text x="590.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">А підсилення?</text>
<text x="590.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">множить і сигнал, І шум</tspan><tspan x="590.0" dy="14.5">на одне число — відношення</tspan><tspan x="590.0" dy="14.5">від фотонного шуму не росте.</tspan><tspan x="590.0" dy="14.5">Кадр яскравіє, та не чистіє.</tspan></text>
<text x="390.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Єдиний справжній лік — більше фотонів: більший піксель, ширша діафрагма, довша витримка.</text>
</svg>