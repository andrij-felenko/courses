<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колір ока ≠ відбивність давача</text>
<text x="230.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">видиме світло</text>
<rect x="155.0" y="80.0" width="150.0" height="90.0" rx="8" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f4f6f8" text-anchor="middle" font-weight="700">темна на око</text>
<text x="470.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">в інфрачервоному</text>
<rect x="395.0" y="80.0" width="150.0" height="90.0" rx="8" fill="#f3e6c4" stroke="#caa24a" stroke-width="1.6"/>
<text x="470.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a5f12" text-anchor="middle" font-weight="700">яскрава для ІЧ</text>
<line x1="305.0" y1="125.0" x2="395.0" y2="125.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">та сама поверхня</text>
<text x="350.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">висновок робити тільки на робочій довжині хвилі давача, а не на око</text>
</svg>