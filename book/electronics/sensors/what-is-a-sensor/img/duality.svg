<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="680" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворювач читається у два боки: давач ↔ виконавчий пристрій</text>
<rect x="285.0" y="78.0" width="110.0" height="80.0" rx="8" fill="#f2f0fb" stroke="#6a4ea8" stroke-width="2.0"/>
<text x="340.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6a4ea8" text-anchor="middle" font-weight="700">перетво-</text>
<text x="340.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6a4ea8" text-anchor="middle" font-weight="700">рювач</text>
<text x="120.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ФІЗИЧНЕ</text>
<text x="560.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ЕЛЕКТРИЧНЕ</text>
<text x="340.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">давач:  фізичне → електричне</text>
<line x1="150.0" y1="118.0" x2="279.0" y2="118.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="401.0" y1="118.0" x2="540.0" y2="118.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="340.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">та сама фізика — два застосування:</text>
<line x1="540.0" y1="194.0" x2="401.0" y2="194.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="279.0" y1="194.0" x2="150.0" y2="194.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="340.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">виконавчий пристрій:  електричне → фізичне</text>
<rect x="82.0" y="230.0" width="130.0" height="36.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="147.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">динамік</text>
<text x="147.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">мікрофон</text>
<rect x="222.0" y="230.0" width="130.0" height="36.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="287.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">мотор</text>
<text x="287.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">генератор</text>
<rect x="362.0" y="230.0" width="130.0" height="36.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="427.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">п'єзо-пищалка</text>
<text x="427.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">давач удару</text>
<rect x="502.0" y="230.0" width="130.0" height="36.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="567.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пельтьє</text>
<text x="567.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">термопара</text>
</svg>