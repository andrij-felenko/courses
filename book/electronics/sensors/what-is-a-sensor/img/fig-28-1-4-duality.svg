<rect x="222.0" y="212.0" width="130.0" height="36.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1"/>
<text x="287.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
