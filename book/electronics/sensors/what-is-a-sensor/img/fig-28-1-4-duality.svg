<text x="340.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6a4ea8" text-anchor="middle" font-weight="bold" font-style="normal">рювач</text>
<text x="120.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">ФІЗИЧНЕ</text>
