<text x="340.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перетворювач читається у два боки: давач ↔ виконавчий пристрій</text>
