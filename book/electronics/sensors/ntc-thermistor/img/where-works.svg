<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий NTC — у двох ролях за різними його властивостями</text>
<rect x="30.0" y="56.0" width="320.0" height="256.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="190.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимір температури</text>
<text x="190.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">беремо круту R(T), струм — крихітний</text>
<text x="190.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">• висока чутливість біля кімнатної t°</tspan><tspan x="190.0" dy="16.7">• дешево, малий, швидкий</tspan><tspan x="190.0" dy="16.7">• самонагрів тримаємо мізерним</tspan><tspan x="190.0" dy="16.7">• вузький точний діапазон</tspan></text>
<rect x="73.4" y="266.5" width="233.2" height="31.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">термостати · батареї · ЦП · погода</tspan></text>
<rect x="370.0" y="56.0" width="320.0" height="256.0" rx="10" fill="#fbeee6" stroke="#c0392b" stroke-width="1.8"/>
<text x="530.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від кидка струму</text>
<text x="530.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тут самонагрів — навмисний інструмент</text>
<text x="530.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">• холодний при ввімкненні — опір ВЕЛИКИЙ</tspan><tspan x="530.0" dy="16.7">• обмежує кидок зарядки ємностей</tspan><tspan x="530.0" dy="16.7">• струм гріє його → опір ПАДАЄ</tspan><tspan x="530.0" dy="16.7">• далі майже не заважає</tspan></text>
<rect x="425.9" y="266.5" width="208.1" height="31.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">входи БЖ · підсвітка · двигуни</tspan></text>
</svg>