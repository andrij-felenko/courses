<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поле Землі занурюється в землю; курс дає ГОРИЗОНТАЛЬНА складова</text>
<line x1="60.0" y1="195.0" x2="660.0" y2="195.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
