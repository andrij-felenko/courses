<text x="284.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#9a4ea8" text-anchor="start" font-weight="normal" font-style="italic">кут нахилу</text>
<text x="360.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поле «занурюється» в землю (нахил/inclination); для курсу беруть лише горизонтальну частину</text>
