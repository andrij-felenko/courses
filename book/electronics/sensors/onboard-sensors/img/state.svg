<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500"
     viewBox="0 0 960 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Який давач у що вкладається: кожна частина стану — з кількох джерел</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">саме тому потрібне поєднання: одна величина підпирається кількома давачами</text>
<rect x="70" y="84" width="250" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="195.0" y="115" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">IMU</text>
<rect x="70" y="164" width="250" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="195.0" y="195" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Магнітометр</text>
<rect x="70" y="244" width="250" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="195.0" y="275" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Барометр</text>
<rect x="70" y="324" width="250" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="195.0" y="355" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">GNSS</text>
<rect x="70" y="404" width="250" height="52" rx="10" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="195.0" y="435" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Давач живлення</text>
<rect x="640" y="84" width="250" height="52" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="765.0" y="115" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Орієнтація (крен/тангаж/курс)</text>
<rect x="640" y="164" width="250" height="52" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="765.0" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Висота</text>
<rect x="640" y="244" width="250" height="52" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="765.0" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Положення</text>
<rect x="640" y="324" width="250" height="52" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="765.0" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Швидкість</text>
<rect x="640" y="404" width="250" height="52" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="765.0" y="435" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Енергія / здоров'я</text>
<line x1="320" y1="110" x2="640" y2="110" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="110" x2="640" y2="270" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="110" x2="640" y2="350" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="190" x2="640" y2="110" stroke="#0a8f3c" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="270" x2="640" y2="190" stroke="#d98a00" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="350" x2="640" y2="190" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="350" x2="640" y2="270" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="350" x2="640" y2="350" stroke="#1f4ed8" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<line x1="320" y1="430" x2="640" y2="430" stroke="#cc0000" stroke-width="1.4" stroke-opacity="0.65" stroke-linecap="round"/>
<text x="480.0" y="486" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Орієнтація, висота й положення живляться кількома давачами одразу — звідси й сила поєднання: давачі підстраховують одне одного.</text>
</svg>
