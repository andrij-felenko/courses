<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470"
     viewBox="0 0 940 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="470" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Осяяння 1957 року: переверни задачу — і супутник скаже, де ТИ</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відома точка + Доплер → орбіта супутника;  переверни — і відома орбіта + Доплер → твоя точка</text>
<rect x="40" y="78" width="410" height="300" rx="12" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="245" y="72" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ПРЯМА задача (що вміли)</text>
<path d="M 60 360 Q 245 300 430 360" fill="#dcfce7" stroke="#0a8f3c" stroke-width="1.6"/>
<path d="M 80 200 Q 290 90 420 210" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="281.0" y="143.0" width="18.0" height="14.0" rx="3" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<rect x="264.0" y="145.0" width="13.0" height="10.0" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="303.0" y="145.0" width="13.0" height="10.0" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="290" y="124" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">супутник</text>
<text x="290" y="138" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(орбіта відома)</text>
<circle cx="160" cy="330" r="7" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="160" y="352" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">станція (відома)</text>
<line x1="290" y1="160" x2="164" y2="322" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="290" cy="150" r="16" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<circle cx="290" cy="150" r="28" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<circle cx="290" cy="150" r="44" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<circle cx="290" cy="150" r="64" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<text x="245" y="366" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="italic">Доплер: тон вищий → нижчий</text>
<rect x="490" y="78" width="410" height="300" rx="12" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="695" y="72" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ОБЕРНЕНА задача (ідея!)</text>
<path d="M 510 360 Q 695 300 880 360" fill="#dcfce7" stroke="#0a8f3c" stroke-width="1.6"/>
<path d="M 530 200 Q 740 90 870 210" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
<rect x="731.0" y="143.0" width="18.0" height="14.0" rx="3" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<rect x="714.0" y="145.0" width="13.0" height="10.0" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="753.0" y="145.0" width="13.0" height="10.0" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<text x="740" y="124" font-size="10.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">супутник</text>
<text x="740" y="138" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(орбіта відома)</text>
<circle cx="610" cy="330" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="610" y="352" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ТИ (невідомо!)</text>
<line x1="740" y1="160" x2="614" y2="322" stroke="#1a1a1a" stroke-width="1.4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="740" cy="150" r="16" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<circle cx="740" cy="150" r="28" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<circle cx="740" cy="150" r="44" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<circle cx="740" cy="150" r="64" fill="none" fill-opacity="0.5" stroke="#1f4ed8" stroke-width="1.0"/>
<text x="695" y="366" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="italic">Доплер: тон вищий → нижчий</text>
<text x="470" y="200" font-size="30" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">⇄</text>
<text x="470" y="226" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">переверни</text>
<text x="470.0" y="456" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Учені APL вистежили «біп» Супутника за Доплером — і зрозуміли: якщо орбіту знати наперед, той самий Доплер видасть невідому позицію приймача. Так народилась супутникова навігація.</text>
</svg>
