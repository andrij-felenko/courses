<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500"
     viewBox="0 0 980 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="500" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Давачі апарата: що міряє, у чому сильний, у чому слабкий</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">довідкова карта — її ланки ми розкриємо в наступних темах</text>
<rect x="30" y="78" width="175" height="34" rx="7" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="42" y="101" font-size="12" fill="white" text-anchor="start" font-weight="bold" font-style="normal">Давач</text>
<rect x="205" y="78" width="250" height="34" rx="7" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="217" y="101" font-size="12" fill="white" text-anchor="start" font-weight="bold" font-style="normal">Міряє</text>
<rect x="455" y="78" width="250" height="34" rx="7" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="467" y="101" font-size="12" fill="white" text-anchor="start" font-weight="bold" font-style="normal">Сила</text>
<rect x="705" y="78" width="245" height="34" rx="7" fill="#1a1a1a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="717" y="101" font-size="12" fill="white" text-anchor="start" font-weight="bold" font-style="normal">Слабкість</text>
<rect x="30" y="112" width="175" height="58" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="42" y="146" font-size="11.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">IMU (гіро + акс)</text>
<rect x="205" y="112" width="250" height="58" rx="8" fill="#fafafa" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="217" y="146" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">прискорення, кут. швидкість</text>
<rect x="455" y="112" width="250" height="58" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="467" y="146" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">швидкий, завжди є</text>
<rect x="705" y="112" width="245" height="58" rx="8" fill="#fff5f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="717" y="146" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">кут спливає (інтеграл)</text>
<rect x="30" y="170" width="175" height="58" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<text x="42" y="204" font-size="11.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">Магнітометр</text>
<rect x="205" y="170" width="250" height="58" rx="8" fill="#fafafa" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="217" y="204" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">напрям поля Землі</text>
<rect x="455" y="170" width="250" height="58" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="467" y="204" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">абсолютний курс</text>
<rect x="705" y="170" width="245" height="58" rx="8" fill="#fff5f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="717" y="204" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">плутає залізо/струми</text>
<rect x="30" y="228" width="175" height="58" rx="8" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.3"/>
<text x="42" y="262" font-size="11.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">Барометр</text>
<rect x="205" y="228" width="250" height="58" rx="8" fill="#fafafa" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="217" y="262" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">тиск повітря</text>
<rect x="455" y="228" width="250" height="58" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="467" y="262" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">швидка висота</text>
<rect x="705" y="228" width="245" height="58" rx="8" fill="#fff5f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="717" y="262" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">дрейф із погодою/вітром</text>
<rect x="30" y="286" width="175" height="58" rx="8" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="42" y="320" font-size="11.5" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">GNSS-приймач</text>
<rect x="205" y="286" width="250" height="58" rx="8" fill="#fafafa" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="217" y="320" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">положення, швидкість</text>
<rect x="455" y="286" width="250" height="58" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="467" y="320" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">прив'язка до Землі</text>
<rect x="705" y="286" width="245" height="58" rx="8" fill="#fff5f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="717" y="320" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">повільний, треба небо</text>
<rect x="30" y="344" width="175" height="58" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="42" y="378" font-size="11.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">Давач живлення</text>
<rect x="205" y="344" width="250" height="58" rx="8" fill="#fafafa" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="217" y="378" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">напруга, струм</text>
<rect x="455" y="344" width="250" height="58" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="467" y="378" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">заряд і потужність</text>
<rect x="705" y="344" width="245" height="58" rx="8" fill="#fff5f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="717" y="378" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">не навігація — виживання</text>
<rect x="30" y="402" width="175" height="58" rx="8" fill="white" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="42" y="436" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">Додаткові</text>
<rect x="205" y="402" width="250" height="58" rx="8" fill="#fafafa" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="217" y="436" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">пітот · далекомір · опт. потік</text>
<rect x="455" y="402" width="250" height="58" rx="8" fill="#f3fbf5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="467" y="436" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">вузькі задачі точно</text>
<rect x="705" y="402" width="245" height="58" rx="8" fill="#fff5f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="717" y="436" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">за потреби, не завжди є</text>
</svg>
