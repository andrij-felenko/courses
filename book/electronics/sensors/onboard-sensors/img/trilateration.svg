<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500"
     viewBox="0 0 940 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як працює GPS: не карта, а годинник — трилатерація в часі</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">відстань = швидкість світла × час польоту сигналу; перетин сфер дає точку</text>
<circle cx="150" cy="150" r="249.64975465639858" fill="none" fill-opacity="0.55" stroke="#1f4ed8" stroke-width="1.3" stroke-dasharray="6,5"/>
<rect x="141.45" y="143.35" width="17.099999999999998" height="13.299999999999999" rx="3" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.4"/>
<rect x="125.3" y="145.25" width="12.35" height="9.5" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<rect x="162.35" y="145.25" width="12.35" height="9.5" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.2"/>
<text x="150" y="126" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">S1</text>
<line x1="150" y1="150" x2="360" y2="285" stroke="#1f4ed8" stroke-width="1.0" stroke-opacity="0.6" stroke-linecap="round"/>
<text x="255.0" y="213.5" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">c·t</text>
<circle cx="560" cy="130" r="253.03161857759991" fill="none" fill-opacity="0.55" stroke="#0a8f3c" stroke-width="1.3" stroke-dasharray="6,5"/>
<rect x="551.45" y="123.35" width="17.099999999999998" height="13.299999999999999" rx="3" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<rect x="535.3" y="125.25" width="12.35" height="9.5" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<rect x="572.35" y="125.25" width="12.35" height="9.5" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.2"/>
<text x="560" y="106" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">S2</text>
<line x1="560" y1="130" x2="360" y2="285" stroke="#0a8f3c" stroke-width="1.0" stroke-opacity="0.6" stroke-linecap="round"/>
<text x="460.0" y="203.5" font-size="10" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">c·t</text>
<circle cx="300" cy="440" r="166.20770138594662" fill="none" fill-opacity="0.55" stroke="#d98a00" stroke-width="1.3" stroke-dasharray="6,5"/>
<rect x="291.45" y="433.35" width="17.099999999999998" height="13.299999999999999" rx="3" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<rect x="275.3" y="435.25" width="12.35" height="9.5" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<rect x="312.35" y="435.25" width="12.35" height="9.5" rx="2" fill="#eef2ff" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.2"/>
<text x="300" y="416" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">S3</text>
<line x1="300" y1="440" x2="360" y2="285" stroke="#d98a00" stroke-width="1.0" stroke-opacity="0.6" stroke-linecap="round"/>
<text x="330.0" y="358.5" font-size="10" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">c·t</text>
<circle cx="360" cy="285" r="8" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="360" y="309" font-size="11.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">приймач (ТИ)</text>
<rect x="640" y="96" width="280" height="230" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="656" y="124" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Кожен супутник шле:</text>
<text x="656" y="146" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">«я ТУТ, і зараз час T».</text>
<text x="656" y="168" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="656" y="190" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Приймач міряє запізнення</text>
<text x="656" y="212" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">сигналу → відстань c·t →</text>
<text x="656" y="234" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">сфера навколо супутника.</text>
<text x="656" y="256" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="656" y="278" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Перетин сфер = позиція.</text>
<rect x="640" y="338" width="280" height="120" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="780" y="364" font-size="12.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">Чому 4, а не 3?</text>
<text x="656" y="386" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">3 сфери дають x, y, z.</text>
<text x="656" y="401" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Але годинник приймача —</text>
<text x="656" y="416" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">дешевий, не атомний.</text>
<text x="656" y="431" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">4-й супутник розв'язує ще</text>
<text x="656" y="446" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">й похибку його годинника.</text>
<text x="470.0" y="488" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">GPS міряє не відстань лінійкою, а ЧАС — тому все тримається на неймовірно точних годинниках.</text>
</svg>
