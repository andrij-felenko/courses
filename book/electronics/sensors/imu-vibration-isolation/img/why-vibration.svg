<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="392" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому вібрація рами псує IMU — два механізми поломки</text>
<rect x="79.5" y="67.0" width="140.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Мотори й гвинти</tspan><tspan x="150.0" dy="16.9">сотні обертів/с</tspan></text>
<text x="150.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">→ рама дрібно тремтить</text>
<line x1="150.0" y1="152.0" x2="150.0" y2="200.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="84.2" y="200.2" width="131.6" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="220.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">MEMS-IMU</tspan><tspan x="150.0" dy="15.6">жорстко на рамі</tspan></text>
<line x1="215.0" y1="222.0" x2="318.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="234.0" x2="318.0" y2="300.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="322.0" y="104.0" width="430.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="537.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">1. НАСИЧЕННЯ</tspan><tspan x="537.0" dy="16.9">пік вібрації перевищує діапазон ±g —</tspan><tspan x="537.0" dy="16.9">показ упирається в стелю й обрізається.</tspan></text>
<rect x="322.0" y="270.0" width="430.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="537.0" y="297.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">2. АЛІАСИНГ</tspan><tspan x="537.0" dy="16.9">швидке тремтіння при рідкій вибірці</tspan><tspan x="537.0" dy="16.9">складається в ХИБНИЙ повільний сигнал</tspan><tspan x="537.0" dy="16.9">просто в смузі корисних даних.</tspan></text>
<text x="390.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Обидві поломки стаються ДО того, як дані дійдуть до програми.</text>
</svg>