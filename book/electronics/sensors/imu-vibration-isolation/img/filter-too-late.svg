<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому цифровий фільтр сам не рятує: аліасинг стається ДО вибірки</text>
<rect x="56.0" y="96.0" width="150.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="131.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="131.0" dy="0.0">вібрація</tspan></text>
<text x="131.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">висока f</text>
<line x1="206.0" y1="119.0" x2="246.0" y2="119.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="246.0" y="96.0" width="150.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="321.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="321.0" dy="0.0">АЦП: вибірка</tspan></text>
<text x="321.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рідкі відліки</text>
<line x1="396.0" y1="119.0" x2="436.0" y2="119.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="436.0" y="96.0" width="150.0" height="46.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="511.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="511.0" dy="0.0">цифр. фільтр</tspan></text>
<text x="511.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у програмі</text>
<line x1="586.0" y1="119.0" x2="626.0" y2="119.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="626.0" y="96.0" width="170.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="711.0" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="711.0" dy="0.0">ПІЗНО!</tspan></text>
<text x="711.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">фільтр ріже й правду, і аліас</text>
<text x="226.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">↑ тут народжується аліас</text>
<line x1="226.0" y1="92.0" x2="226.0" y2="96.0" stroke="#c0392b" stroke-width="1.4"/>
<text x="400.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цифровий фільтр живе ПІСЛЯ вибірки — він не прибере того, що змішалося ДО неї.</text>
<text x="400.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Зупинити вібрацію треба РАНІШЕ: механічним демпфером (або аналоговим ФНЧ до АЦП).</text>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Демпфер — це і є той «фільтр до вибірки», якого цифрі бракує.</text>
</svg>