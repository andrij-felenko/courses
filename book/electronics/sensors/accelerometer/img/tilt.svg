<text x="585.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">з проєкцій g на осі давача</text>
<text x="360.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у спокої сталий вектор g завжди вказує вниз → за його проєкцією на осі знаємо нахил</text>
