  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="370.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дивина гравітації: у спокої акселерометр показує 1g, не 0</text>
<rect x="80.0" y="92.0" width="100.0" height="80.0" rx="6" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="130.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">спокій на столі</text>
<rect x="108.0" y="120.0" width="44.0" height="24.0" rx="3" fill="#cfe0f5" stroke="#1f47b5" stroke-width="1.2"/>
<text x="130.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">m</text>
<text x="130.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">читає 1g</text>
<text x="130.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стіл штовхає масу вгору</text>
<rect x="320.0" y="92.0" width="100.0" height="80.0" rx="6" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="370.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7a1e" text-anchor="middle" font-weight="bold" font-style="normal">вільне падіння</text>
<rect x="348.0" y="120.0" width="44.0" height="24.0" rx="3" fill="#cfe0f5" stroke="#1f47b5" stroke-width="1.2"/>
<text x="370.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">m</text>
<text x="370.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7a1e" text-anchor="middle" font-weight="bold" font-style="normal">читає 0</text>
<text x="370.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нема опори — маса вільна</text>
<rect x="560.0" y="92.0" width="100.0" height="80.0" rx="6" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="610.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">розгін угору a</text>
<rect x="588.0" y="120.0" width="44.0" height="24.0" rx="3" fill="#cfe0f5" stroke="#1f47b5" stroke-width="1.2"/>
<text x="610.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">m</text>
<text x="610.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">читає 1g + a</text>
<text x="610.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">опора тисне сильніше</text>
<text x="370.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">акселерометр НЕ відрізняє гравітацію від прискорення (принцип еквівалентності, Айнштайн)</text>
<text x="370.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тож міряє не «координатне» прискорення, а власне (силу опори): спокій = опора проти g = 1g</text>
</svg>
