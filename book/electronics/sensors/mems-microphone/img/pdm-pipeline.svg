<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">PDM → PCM: інтегратор швидко, гребінка повільно</text>
<rect x="40.0" y="111.0" width="128.0" height="78.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="104.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">PDM</tspan><tspan x="104.0" dy="16.9">1 біт</tspan></text>
<text x="104.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3.072 МГц</text>
<text x="104.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1 1 0 1 1 1 0 1</text>
<line x1="172.0" y1="150.0" x2="208.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="214.0" y="111.0" width="150.0" height="78.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="289.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="289.0" dy="0.0">інтегратор</tspan><tspan x="289.0" dy="16.2">acc += біт</tspan></text>
<text x="289.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">на КОЖНОМУ такті</text>
<line x1="368.0" y1="150.0" x2="438.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="404.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">÷ R</text>
<text x="404.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">прорідити</text>
<rect x="444.0" y="111.0" width="150.0" height="78.0" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="519.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="519.0" dy="0.0">гребінка</tspan><tspan x="519.0" dy="15.6">y = acc − acc_R</tspan></text>
<text x="519.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">лише на прорідженому</text>
<line x1="598.0" y1="150.0" x2="634.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="640.0" y="111.0" width="128.0" height="78.0" rx="8" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="704.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="704.0" dy="0.0">PCM</tspan><tspan x="704.0" dy="16.9">16 біт</tspan></text>
<text x="704.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">48 кГц</text>
<line x1="208.0" y1="215.0" x2="370.0" y2="215.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="289.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">працює на 3.072 МГц (важко)</text>
<line x1="438.0" y1="215.0" x2="600.0" y2="215.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="519.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">працює на 48 кГц (легко)</text>
<rect x="100.9" y="331.8" width="698.2" height="36.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="354.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">усереднити на високій частоті → прорідити в R разів → віддати рідкі багатобітні відліки</tspan></text>
</svg>