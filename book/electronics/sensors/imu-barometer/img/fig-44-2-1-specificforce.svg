<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Підступність акселерометра: він міряє «питому силу», а не рух</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">у спокої бачить g (звідси нахил), у вільному падінні — нуль</text>
<text x="160" y="90" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">У спокої на столі</text>
<rect x="126" y="141" width="68" height="68" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="160" y1="141" x2="160" y2="163" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="160" y1="187" x2="160" y2="209" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="160" cy="175" r="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="160" y1="169" x2="160" y2="105" stroke="#cc0000" stroke-width="2.6" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="110" y1="213" x2="210" y2="213" stroke="#1a1a1a" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="160" y="245" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">читає: +1 g</text>
<text x="160" y="265" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">опора штовхає вгору → читає g</text>
<text x="480" y="90" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">У вільному падінні</text>
<rect x="446" y="141" width="68" height="68" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="480" y1="141" x2="480" y2="163" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="480" y1="187" x2="480" y2="209" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="480" cy="175" r="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="480" cy="125" r="5" fill="#cc0000" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="480" y="245" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">читає: 0</text>
<text x="480" y="265" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">нічого не тисне → читає нуль</text>
<text x="800" y="90" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Нахилений (спокій)</text>
<g transform="rotate(22 800 175)">
<rect x="766" y="141" width="68" height="68" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="800" y1="141" x2="800" y2="163" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="800" y1="187" x2="800" y2="209" stroke="#6b7280" stroke-width="1.2" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="800" cy="175" r="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
</g>
<line x1="800" y1="125" x2="800" y2="231" stroke="#0a8f3c" stroke-width="1.4" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="800" y1="175" x2="830" y2="205" stroke="#cc0000" stroke-width="2.4" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="800" y="245" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">читає: проєкції g</text>
<text x="800" y="265" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">звідси абсолютний крен/тангаж</text>
<rect x="60" y="360" width="840" height="64" rx="11" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="80" y="384" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Акселерометр міряє «питому силу» — НЕ прискорення тіла. У спокої він «бачить» вектор g і дає абсолютний нахил.</text>
<text x="80" y="404" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Але під час РОЗГОНУ прискорення домішується до g, і нахил уже не відрізнити від руху — тому потрібен гіроскоп і поєднання.</text>
</svg>
