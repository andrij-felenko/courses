<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Акселерометр міряє питому силу, а не рух</text>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">У спокої бачить g (звідси нахил), у падінні — нуль</text>
<text x="150.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">У спокої на столі</text>
<rect x="133.0" y="158.0" width="34.0" height="34.0" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><line x1="150.0" y1="158.0" x2="150.0" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="150.0" y1="180.9" x2="150.0" y2="192.0" stroke="#6b7280" stroke-width="1.2"/><circle cx="150.0" cy="175.0" r="5.4" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="150.0" y1="169.0" x2="150.0" y2="105.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="98.0" y1="213.0" x2="202.0" y2="213.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="150.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">читає +1g угору</text>
<text x="150.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">опора штовхає вгору</text>
<text x="380.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">У вільному падінні</text>
<rect x="363.0" y="158.0" width="34.0" height="34.0" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><line x1="380.0" y1="158.0" x2="380.0" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="380.0" y1="180.9" x2="380.0" y2="192.0" stroke="#6b7280" stroke-width="1.2"/><circle cx="380.0" cy="175.0" r="5.4" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.3"/>
<circle cx="380.0" cy="119.0" r="5.0" fill="#c0392b" stroke="none" stroke-width="1.0"/>
<line x1="450.0" y1="145.0" x2="450.0" y2="205.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="464.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">падає</text>
<text x="380.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">читає нуль</text>
<text x="380.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нічого не тисне</text>
<text x="610.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нахилений (спокій)</text>
<polygon points="601.4,152.6 632.4,166.4 618.6,197.4 587.6,183.6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="610.0" cy="175.0" r="5.4" fill="#f1f2f4" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="610.0" y1="119.0" x2="610.0" y2="231.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="620.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">g</text>
<line x1="610.0" y1="175.0" x2="624.2" y2="212.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="610.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">читає проєкції g</text>
<text x="610.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">звідси крен і тангаж</text>
</svg>