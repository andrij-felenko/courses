<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
<rect width="720" height="280" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ефект Коріоліса: обертання відхиляє коливну масу вбік</text>
<rect x="210.0" y="80.0" width="180.0" height="140.0" rx="6" fill="none" stroke="#1b1b1b" stroke-width="1.4"/>
<rect x="270.0" y="134.0" width="60.0" height="32.0" rx="4" fill="#cfe0f5" stroke="#1f47b5" stroke-width="1.6"/>
<text x="300.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">маса</text>
<line x1="245.0" y1="120.0" x2="245.0" y2="98.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<line x1="245.0" y1="180.0" x2="245.0" y2="202.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="240.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="italic">вібрація</text>
<text x="300.0" y="66.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">обертання Ω</text>
<line x1="332.0" y1="110.0" x2="378.0" y2="110.0" stroke="#9a4ea8" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="382.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a4ea8" text-anchor="start" font-weight="bold" font-style="normal">відхилення Коріоліса</text>
<rect x="470.0" y="100.0" width="230.0" height="90.0" rx="8" fill="#fbfbfb" stroke="#9a4ea8" stroke-width="1.5"/>
<text x="585.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">відхилення ∝ Ω</text>
<text x="585.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(швидкість обертання)</text>
<text x="585.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a4ea8" text-anchor="middle" font-weight="bold" font-style="normal">міряють ємнісно → ω</text>
<text x="360.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">масу постійно гойдають; коли давач обертається, сила Коріоліса штовхає її поперек —</text>
<text x="360.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і це поперечне відхилення прямо пропорційне швидкості обертання</text>
</svg>
