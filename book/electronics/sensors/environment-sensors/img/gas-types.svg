<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи відчути газ — три різні класи перетворювача</text>
<rect x="16.0" y="52.0" width="228.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">MOX</text>
<text x="130.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">підігрітий оксид:</tspan><tspan x="130.0" dy="14.3">адсорбція міняє опір</tspan></text>
<line x1="38.0" y1="170.0" x2="222.0" y2="170.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="130.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="700">клас:</text>
<text x="130.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">резистивний</text>
<rect x="256.0" y="52.0" width="228.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<text x="370.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">електрохімічний</text>
<text x="370.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">газ дає струм у</tspan><tspan x="370.0" dy="14.3">мініпаливному елементі</tspan></text>
<line x1="278.0" y1="170.0" x2="462.0" y2="170.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="370.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="700">клас:</text>
<text x="370.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">самогенерувальний</text>
<rect x="496.0" y="52.0" width="228.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#8e44ad" stroke-width="1.6"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="middle" font-weight="700">NDIR</text>
<text x="610.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">газ поглинає свою</tspan><tspan x="610.0" dy="14.3">смугу ІЧ; міряємо поглинання</tspan></text>
<line x1="518.0" y1="170.0" x2="702.0" y2="170.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="610.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="700">клас:</text>
<text x="610.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">оптичний</text>
<text x="370.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">різні класи — та сама рамка перетворювача</text>
</svg>