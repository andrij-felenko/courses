<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 842 350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="842" height="350.5" fill="#ffffff"/>
