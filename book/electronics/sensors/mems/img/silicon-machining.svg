<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремній як механічний матеріал: ті самі методи — рухомі деталі</text>
<rect x="80.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#d7dde3" stroke="#1a1a1a" stroke-width="2.0"/>
