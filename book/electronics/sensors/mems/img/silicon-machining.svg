<line x1="236.0" y1="150.0" x2="320.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="326.0" y="114.0" width="200.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="426.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="426.0" dy="0.0">фотолітографія</tspan><tspan x="426.0" dy="16.9">+ травлення</tspan></text>
<line x1="532.0" y1="132.0" x2="616.0" y2="90.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="532.0" y1="168.0" x2="616.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="622.0" y="58.0" width="200.0" height="56.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.6"/><text x="722.0" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="722.0" dy="0.0">транзистори, схеми</tspan><tspan x="722.0" dy="15.6">(звичайний чип)</tspan></text>
<rect x="622.0" y="186.0" width="200.0" height="56.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="722.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.0" dy="0.0">балки, пружини, вантажі</tspan><tspan x="722.0" dy="15.6">(рухомі деталі — MEMS)</tspan></text>
<rect x="179.4" y="293.5" width="461.2" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">кремній — не лише для схем, а й чудовий механічний матеріал</tspan></text>
