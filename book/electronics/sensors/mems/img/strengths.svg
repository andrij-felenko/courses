<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві сторони мікромеханіки: сила й межі MEMS</text>
<text x="240.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">СИЛА</text>
<rect x="60.0" y="86.0" width="360.0" height="150.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="240.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">малі  ·  копійчані (пакетне виробництво)</tspan><tspan x="240.0" dy="16.9">інтегровані з електронікою  ·  маловитратні</tspan><tspan x="240.0" dy="16.9"></tspan><tspan x="240.0" dy="16.9">→ звідси їхня всюдисущість</tspan></text>
<text x="640.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">МЕЖІ</text>
<rect x="460.0" y="86.0" width="360.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="640.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">слабкий сигнал → шум (теплове тремтіння)</tspan><tspan x="640.0" dy="16.9">дрейф від температури (кремній розширюється)</tspan><tspan x="640.0" dy="16.9">зсув нуля у кожного свій (виробничий розкид)</tspan><tspan x="640.0" dy="16.9">крихкість до ударів</tspan></text>
<rect x="61.3" y="305.5" width="757.5" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">та сама крихітність дає і дешевизну, і шум, дрейф, крихкість → давачі доводиться поєднувати</tspan></text>
