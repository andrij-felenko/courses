<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доброчесне коло масштабу: ринок → об'єм → дешевизна</text>
<rect x="70.0" y="135.0" width="170.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="155.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">обов'язкові</tspan><tspan x="155.0" dy="16.2">подушки безпеки</tspan></text>
<line x1="244.0" y1="170.0" x2="256.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="260.0" y="135.0" width="170.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="345.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">масовий</tspan><tspan x="345.0" dy="16.2">ринок (об'єми)</tspan></text>
<line x1="434.0" y1="170.0" x2="446.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="135.0" width="170.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="535.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">падіння ціни</tspan><tspan x="535.0" dy="16.2">й розміру</tspan></text>
<line x1="624.0" y1="170.0" x2="636.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="135.0" width="170.0" height="70.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="725.0" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">давач їде</tspan><tspan x="725.0" dy="16.2">всюди</tspan></text>
<path d="M 725.0 205.0 C 725.0 290.0, 345.0 290.0, 345.0 209.0" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
<text x="535.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ще дешевше → ще більший об'єм</text>
<rect x="68.6" y="313.8" width="682.8" height="36.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">не телефон здешевив акселерометр — здешевлений акселерометр зробив можливими телефони</tspan></text>
</svg>