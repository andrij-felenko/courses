<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як технологія стає масовою: винахід → ринок → всюдисущість</text>
<line x1="80.0" y1="150.0" x2="780.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="108.0" cy="150.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="108.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">винахід</text>
<text x="108.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="108.0" dy="0.0">кремнієва</tspan><tspan x="108.0" dy="14.3">мікромеханіка, 1982</tspan></text>
<circle cx="374.0" cy="150.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="374.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">вбивча задача</text>
<text x="374.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="374.0" dy="0.0">подушки безпеки,</tspan><tspan x="374.0" dy="14.3">1990-ті</tspan></text>
<circle cx="682.0" cy="150.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="682.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">всюдисущість</text>
<text x="682.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">телефони, дрони,</tspan><tspan x="682.0" dy="14.3">ігри, 2000-ні</tspan></text>
<rect x="55.3" y="251.5" width="749.4" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">винахід запалює іскру, але вогонь розгоряється лише там, де є чому горіти — масова потреба</tspan></text>
</svg>