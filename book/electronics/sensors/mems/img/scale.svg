<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскільки мале: рухома деталь MEMS проти волосини</text>
<rect x="90.0" y="180.0" width="210.0" height="70.0" rx="4" fill="#e8d9c0" stroke="#9c7a45" stroke-width="2.0"/>
<text x="195.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9c7a45" text-anchor="middle" font-weight="700">людська волосина</text>
<text x="195.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">≈ 70 мкм</text>
<rect x="420.0" y="244.0" width="210.0" height="6.0" rx="2" fill="#cfe0f5" stroke="#2457d6" stroke-width="2.0"/>
<line x1="525.0" y1="190.0" x2="525.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">рухомий шар MEMS</text>
<text x="525.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">лічені мкм (≈ 2)</text>
<line x1="70.0" y1="250.0" x2="650.0" y2="250.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="71.6" y="297.5" width="616.8" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">у десятки разів тонше за волосину — і це справжня машина, з вантажем і пружинами</tspan></text>
