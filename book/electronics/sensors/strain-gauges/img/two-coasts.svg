<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тензодавач, винайдений двічі: 1938, два узбережжя</text>
<line x1="70.0" y1="66.0" x2="750.0" y2="66.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="90.0" cy="66.0" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="90.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1856</text>
<text x="90.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кельвін: ефект</text>
<circle cx="410.0" cy="66.0" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="410.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1938</text>
<text x="410.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">два незалежні винаходи</text>
<circle cx="730.0" cy="66.0" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="730.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1944</text>
<text x="730.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">патент, назва SR-4</text>
<rect x="60.0" y="110.0" width="320.0" height="28.0" rx="6" fill="#eef3f9" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Захід — Сіммонс (Caltech)</tspan></text>
<rect x="60.0" y="150.0" width="320.0" height="150.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="220.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">удар по металу: як міряти різку силу?</text>
<text x="220.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">↓</text>
<text x="220.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">динамометр + тонкий резистивний дріт</text>
<text x="220.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">↓</text>
<text x="220.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">натяг тягне дріт → опір змінюється</text>
<text x="220.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">↓</text>
<text x="220.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">швидко, без механічної інерції</text>
<rect x="440.0" y="110.0" width="320.0" height="28.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Схід — Руге (MIT), 3 квітня 1938</tspan></text>
<rect x="440.0" y="150.0" width="320.0" height="150.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="600.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">модель водонапірного бака: чи встоїть у землетрус?</text>
<text x="600.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">↓</text>
<text x="600.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">цигарковий папір на стінці + тонкий дріт</text>
<text x="600.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">↓</text>
<text x="600.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стінка тягнеться → дріт → опір змінюється</text>
<text x="600.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">↓</text>
<text x="600.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«винахід просто сплив у голові цілком»</text>
<text x="410.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">≈3000 км</text>
<text x="410.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">жодного</text>
<text x="410.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">контакту</text>
<line x1="220.0" y1="300.0" x2="410.0" y2="330.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="600.0" y1="300.0" x2="410.0" y2="330.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="210.0" y="330.0" width="400.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">той самий прилад → ΔR ≈ 0.7 Ω при 1000 µε</tspan></text>
<rect x="210.0" y="386.0" width="400.0" height="40.0" rx="6" fill="#fff3e0" stroke="#b8860b" stroke-width="1.5"/><text x="410.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">назва SR-4: S — Сіммонс, R — Руге; обидва — співвинахідники</tspan></text>
<text x="410.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«перший» у техніці — рідко чиста дата: дозрів увесь тракт, і винахід зробили одразу двоє</text>
</svg>