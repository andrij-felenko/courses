<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від Кельвіна (1856) до коефіцієнта тензочутливості</text>
<text x="190.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">дріт під натягом</text>
<line x1="70.0" y1="96.0" x2="40.0" y2="96.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="58.0" y="88.0" width="170.0" height="16.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="238.0" y1="96.0" x2="268.0" y2="96.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">опір росте під розтягом</text>
<line x1="560.0" y1="52.0" x2="604.0" y2="96.0" stroke="#333333" stroke-width="1.6"/>
<line x1="604.0" y1="96.0" x2="560.0" y2="140.0" stroke="#333333" stroke-width="1.6"/>
<line x1="560.0" y1="140.0" x2="516.0" y2="96.0" stroke="#333333" stroke-width="1.6"/>
<line x1="516.0" y1="96.0" x2="560.0" y2="52.0" stroke="#333333" stroke-width="1.6"/>
<text x="560.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">міст Вітстона</text>
<text x="560.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ним Кельвін і міряв ефект 1856-го</text>
<rect x="50.0" y="160.0" width="700.0" height="110.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="400.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">GF = (ΔR/R) / ε = (1 + 2ν) + (Δρ/ρ) / ε</text>
<rect x="80.0" y="200.0" width="320.0" height="56.0" rx="6" fill="#eef3f9" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="217.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">(1 + 2ν) — геометрія:</tspan><tspan x="240.0" dy="14.3">видовження + звуження перерізу</tspan><tspan x="240.0" dy="14.3">для металів ν ≈ 0.3 → 1.6</tspan></text>
<rect x="420.0" y="200.0" width="320.0" height="56.0" rx="6" fill="#fff3e0" stroke="#b8860b" stroke-width="1.5"/><text x="580.0" y="217.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">(Δρ/ρ)/ε — п'єзорезистивний член:</tspan><tspan x="580.0" dy="14.3">зміна самого питомого опору —</tspan><tspan x="580.0" dy="14.3">оте «зайве», що побачив Кельвін</tspan></text>
<rect x="120.0" y="300.0" width="240.0" height="90.0" rx="6" fill="#eef3f9" stroke="#2457d6" stroke-width="2.0"/>
<text x="240.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">метал: GF ≈ 2.0–2.1</text>
<text x="240.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лінійний, стабільний —</text>
<text x="240.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">досі основа вимірювання ваги</text>
<rect x="440.0" y="300.0" width="240.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">кремній: GF ≈ 100–200</text>
<text x="560.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">надчутливий, але</text>
<text x="560.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нелінійний і «пливе» з теплом</text>
<text x="400.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">різниця між 1.6 і 2.07 — це і є п'єзорезистивний внесок: кільце замкнулось</text>
</svg>