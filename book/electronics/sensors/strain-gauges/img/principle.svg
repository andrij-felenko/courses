<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому опір росте під розтягом: R = ρ·L / A</text>
<text x="150.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">у спокої</text>
<rect x="70.0" y="96.0" width="160.0" height="28.0" rx="6" fill="#eef3f9" stroke="#333333" stroke-width="1.8"/>
<text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">L</text>
<line x1="70.0" y1="138.0" x2="230.0" y2="138.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">довжина L</text>
<line x1="56.0" y1="96.0" x2="56.0" y2="124.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="34.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A</text>
<text x="300.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">R₀ = ρ·L / A</text>
<text x="150.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">під розтягом</text>
<line x1="58.0" y1="230.0" x2="28.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="252.0" y1="230.0" x2="282.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="64.0" y="221.0" width="182.0" height="18.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="155.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">L + ΔL</text>
<line x1="64.0" y1="252.0" x2="246.0" y2="252.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="155.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">довша → опір ↑</text>
<text x="150.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">тонша (A↓) → опір ↑</text>
<text x="300.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">R = ρ·(L+ΔL) / (A−ΔA)  &gt;  R₀</text>
<text x="615.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">три причини зростання R</text>
<rect x="520.0" y="92.0" width="190.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">довша L</tspan></text>
<rect x="520.0" y="138.0" width="190.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">менший переріз A</tspan></text>
<rect x="520.0" y="184.0" width="190.0" height="40.0" rx="6" fill="#fff3e0" stroke="#b8860b" stroke-width="1.5"/><text x="615.0" y="207.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">змінений ρ (п'єзорезистивність)</tspan></text>
<text x="615.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перші дві — геометрія;</text>
<text x="615.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">третя — сама фізика металу</text>
</svg>