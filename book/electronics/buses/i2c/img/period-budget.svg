<rect x="145.9" y="384.8" width="708.3" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="404.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">f_max = 1 / (t_LOW + t_HIGH + t_r + t_f); усі чотири виміряні між тими самими порогами 0.3·VDD і 0.7·VDD,</tspan><tspan x="500.0" dy="15.0">тож вони стикуються без щілин — кожна зайва наносекунда фронту забирає час у півперіодів такту.</tspan></text>
