<rect x="142.2" y="386.2" width="675.5" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">0.9 + 0.1 = 1.0 мкс із 1.3 мкс низького півперіоду; решта 0.3 мкс — рівно стеля часу наростання SDA.</tspan></text>
