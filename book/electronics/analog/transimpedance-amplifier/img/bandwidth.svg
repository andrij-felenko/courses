<text x="360.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Більший Cf → стабільніше й тихіше, але точка зламу нижча: смуга вужча. Cf обирають найменшим, що ще гасить дзвін.</text>
