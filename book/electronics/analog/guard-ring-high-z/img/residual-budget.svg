<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="383.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що лишається на опорі витоку: зсув Vos + похибка підсилення</text>
<line x1="80.0" y1="250.0" x2="680.0" y2="250.0" stroke="#6b7280" stroke-width="1.4"/>
<rect x="127.0" y="58.0" width="96.0" height="192.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="175.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ кільця</text>
<text x="175.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ΔV = 4.9 В</text>
<text x="175.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">(уся різниця)</text>
<text x="175.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сигнал тоне</text>
<text x="510.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З кільцем  (лупа ×1000)</text>
<rect x="462.0" y="202.0" width="96.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="462.0" y="178.0" width="96.0" height="24.0" rx="6" fill="#cdebd9" stroke="#27ae60" stroke-width="1.6"/>
<text x="568.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Vos ≈ 2 мВ</text>
<text x="568.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(не від сигналу)</text>
<text x="568.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Vсигн/Aol ≈ 1 мВ</text>
<text x="568.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(росте з сигналом)</text>
<text x="510.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">разом ≈ 3 мВ</text>
<line x1="446.0" y1="250.0" x2="446.0" y2="82.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="442.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">7 мВ</text>
<text x="442.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0</text>
<text x="360.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">напруга, що лишається на опорі витоку Rвитоку → саме вона жене залишковий струм</text>
<rect x="52.5" y="300.4" width="615.1" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Кільце знімає з опору майже всю напругу — лишаються ДВА дрібні залишки: зсув ОП Vos</tspan><tspan x="360.0" dy="15.6">(плаский, від сигналу не залежить) і похибка повторювача Vсигн/Aol (росте із сигналом).</tspan><tspan x="360.0" dy="15.6">Праву колонку показано лупою ×1000 — у шкалі лівої вона була б тонша за лінію.</tspan></text>
</svg>