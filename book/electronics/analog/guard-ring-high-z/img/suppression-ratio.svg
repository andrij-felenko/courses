<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пригнічення — це відношення напруг, і воно скінченне</text>
<text x="250.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">ΔVповна</text>
<line x1="172.0" y1="134.0" x2="328.0" y2="134.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="250.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#27ae60" text-anchor="middle" font-weight="700">Vзалишк</text>
<text x="362.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">=</text>
<text x="400.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="start" font-weight="700">Gприг</text>
<text x="250.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">опір Rвитоку скоротився — лишилось чисте відношення двох напруг</text>
<text x="250.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 В  /  2 мВ  =  1000×        4.9 В  /  3 мВ  ≈  1600×</text>
<rect x="31.9" y="244.2" width="656.1" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Vзалишк = Vos + Vсигн/Aol  &gt;  0  ЗАВЖДИ   →   Iзалишк = Vзалишк / Rвитоку  &gt;  0.</tspan><tspan x="360.0" dy="15.6">Зсув скінченний, підсилення скінченне — пригнічення велике (×1000…×2000), але НЕ нескінченне.</tspan></text>
</svg>