<rect x="83.2" y="276.2" width="553.5" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Струм витоку = напруга на опорі / опір. Прибери НАПРУГУ на кінцях опору —</tspan><tspan x="360.0" dy="15.6">тримай обидва кінці на одному потенціалі — і струм зникне, хоч опір той самий.</tspan></text>
