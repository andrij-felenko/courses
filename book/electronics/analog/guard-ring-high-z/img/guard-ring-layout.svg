<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільце оточує вхід: перехоплює витік ще до високоомного вузла</text>
<rect x="60.0" y="70.0" width="600.0" height="230.0" rx="8" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.0"/>
<text x="80.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">поверхня плати (волога, флюс, бруд → витоки звідусіль)</text>
<circle cx="360.0" cy="195.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">•</text>
<text x="360.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">вивід / доріжка ВХОДУ</text>
<text x="360.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">(0.1 В, високоомний)</text>
<rect x="265.0" y="140.0" width="190.0" height="110.0" rx="14" fill="none" stroke="#27ae60" stroke-width="3.5"/>
<text x="360.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ОХОРОННЕ КІЛЬЦЕ  (0.1 В — той самий потенціал)</text>
<line x1="120.0" y1="120.0" x2="255.0" y2="155.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="120.0" y1="270.0" x2="255.0" y2="235.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="120.0" x2="465.0" y2="155.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="270.0" x2="465.0" y2="235.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="120.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">витік</text>
<text x="600.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">витік</text>
<text x="360.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">увесь струм витоку сідає на кільце — до входу не доходить нічого</text>
<rect x="86.7" y="308.2" width="546.7" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Кільце фізично ОТОЧУЄ високоомний вузол. Будь-який витік із брудного оточення</tspan><tspan x="360.0" dy="15.6">впирається спершу в кільце; його бере на себе джерело кільця, а не сам вхід.</tspan></text>
</svg>