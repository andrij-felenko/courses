<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Старт-вузол штовхає при нулі — і зникає, коли осередок ожив</text>
<rect x="380.0" y="90.0" width="230.0" height="200.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="495.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e7a45" text-anchor="middle" font-weight="700">BANDGAP-ОСЕРЕДОК</text>
<text x="495.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(самозміщена петля)</text>
<rect x="404.0" y="160.0" width="182.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">ΔVbe → струм → дзеркало → той самий струм</tspan></text>
<rect x="404.0" y="202.0" width="182.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="495.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle"><tspan x="495.0" dy="0.0">тримає себе сама, коли вже біжить струм</tspan></text>
<line x1="610.0" y1="190.0" x2="634.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="638.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Vref</text>
<text x="638.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">≈1.25 В</text>
<rect x="60.0" y="110.0" width="250.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="185.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">СТАРТ-ВУЗОЛ</text>
<rect x="80.0" y="152.0" width="210.0" height="28.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">бачить: струм = 0 ?</tspan></text>
<rect x="80.0" y="190.0" width="210.0" height="28.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="185.0" dy="0.0">так → впорскує струм</tspan></text>
<rect x="80.0" y="228.0" width="210.0" height="28.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="185.0" dy="0.0">ні → відчепляється</tspan></text>
<line x1="310.0" y1="190.0" x2="380.0" y2="180.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="345.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">поштовх</text>
<line x1="380.0" y1="240.0" x2="310.0" y2="248.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="345.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нюхає струм</text>
</svg>