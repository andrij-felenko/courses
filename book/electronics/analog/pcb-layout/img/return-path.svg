<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм завжди вертається — і на високій частоті йде прямо під доріжкою</text>
<rect x="60.0" y="250.0" width="600.0" height="54.0" rx="6" fill="#fde9b8" stroke="#c8922a" stroke-width="1.6"/>
<text x="355.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a6510" text-anchor="middle">суцільний шар землі (мідь)</text>
<rect x="60.0" y="96.0" width="600.0" height="16.0" rx="4" fill="#c0392b" stroke="#8a2418" stroke-width="1.4"/>
<text x="355.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">сигнальна доріжка (струм туди →)</text>
<line x1="78.0" y1="112.0" x2="78.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="642.0" y1="112.0" x2="642.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="44.1" y="169.0" width="67.9" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="78.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="78.0" dy="0.0">джерело</tspan></text>
<rect x="608.1" y="161.2" width="67.9" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="630.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">наван-</tspan><tspan x="630.0" dy="15.6">таження</tspan></text>
<line x1="150.0" y1="104.0" x2="560.0" y2="104.0" stroke="#ffffff" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="560.0" y1="264.0" x2="150.0" y2="264.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="355.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">висока частота: зворотний струм біжить тонкою смужкою прямо під доріжкою</text>
<path d="M150 290 C 150 330, 660 330, 642 290" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
<text x="355.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">низька частота: розтікається широко (шлях найменшого опору)</text>
<text x="355.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">уся доріжка + зворотний шлях = петля; її площа й вирішує наводки</text>
</svg>