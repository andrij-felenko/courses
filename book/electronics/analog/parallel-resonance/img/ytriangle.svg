<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="110.0" y1="250.0" x2="540.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="110.0" y1="320.0" x2="110.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="540.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">G  (провідність)</text>
<text x="116.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">jB</text>
<text x="116.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сприйнятливість</text>
<line x1="110.0" y1="250.0" x2="376.6" y2="250.0" stroke="#cfd3d8" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="110.0" y1="250.0" x2="376.6" y2="250.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="384.6" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Y = G  (на f₀)</text>
<line x1="110.0" y1="250.0" x2="376.6" y2="320.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="376.6" y1="250.0" x2="376.6" y2="320.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="384.6" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">нижче f₀</text>
<line x1="110.0" y1="250.0" x2="376.6" y2="160.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="376.6" y1="250.0" x2="376.6" y2="160.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="384.6" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">вище f₀</text>
<text x="376.6" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">G = R/(R²+X²) ≈ R/X² = 1/R_D</text>
<rect x="74.4" y="60.2" width="371.1" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Поза f₀ є сприйнятливість B → |Y| більший → опір менший.</tspan><tspan x="260.0" dy="14.3">На f₀ сприйнятливість гілок гаситься, лишається сама G:</tspan><tspan x="260.0" dy="14.3">|Y| найменший → |Z| = 1/G найбільший = R_D.</tspan></text>
<text x="330.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Резонанс очима адмітансу: фазор Y лягає на вісь провідності — найкоротший Y, отже найвищий опір</text>
</svg>