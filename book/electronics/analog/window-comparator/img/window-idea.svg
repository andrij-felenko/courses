<text x="360.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Обидва виходи високі рівно тоді, коли сигнал у вікні. Виліз за будь-який край — той компаратор опускає вихід.</text>
