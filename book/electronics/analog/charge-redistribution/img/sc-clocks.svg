<rect x="14.8" y="306.2" width="690.3" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Такти НЕ перекриваються: між ними — короткий «мертвий час», коли обидва ключі</tspan><tspan x="360.0" dy="15.6">розімкнені (break-before-make). Інакше вузли на мить замкнулись би й заряд потік би «навпростець».</tspan></text>
