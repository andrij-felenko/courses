<rect x="28.5" y="348.2" width="663.0" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Заряд перетікає з повної ємності в порожню, доки НАПРУГИ зрівняються — як вода між сполученими</tspan><tspan x="360.0" dy="15.6">баками. Сумарний заряд той самий (Q = C·10), але тепер ділиться на дві ємності: спільні 5 В.</tspan></text>
