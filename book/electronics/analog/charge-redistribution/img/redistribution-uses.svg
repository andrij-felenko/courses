<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де працює перерозподіл заряду між ємностями</text>
<rect x="27.0" y="80.0" width="210.0" height="170.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="132.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Вибірка АЦП/ЦАП</text>
<line x1="43.0" y1="120.0" x2="221.0" y2="120.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="132.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="132.0" dy="0.0">вхід заряджає</tspan><tspan x="132.0" dy="16.2">конденсатор вибірки;</tspan><tspan x="132.0" dy="16.2">потім порівнюють</tspan></text>
<rect x="255.0" y="80.0" width="210.0" height="170.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Заряд-помпа</text>
<line x1="271.0" y1="120.0" x2="449.0" y2="120.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">конденсатор перекидають</tspan><tspan x="360.0" dy="16.2">між рівнями —</tspan><tspan x="360.0" dy="16.2">підіймає напругу</tspan></text>
<rect x="483.0" y="80.0" width="210.0" height="170.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="588.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Перекидні відра</text>
<line x1="499.0" y1="120.0" x2="677.0" y2="120.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="588.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">пакет заряду передають</tspan><tspan x="588.0" dy="16.2">з ємності в ємність</tspan><tspan x="588.0" dy="16.2">уздовж лінії</tspan></text>
<text x="360.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">У кожному — те саме: заряд перетікає між ємностями за законом збереження заряду.</text>
<rect x="38.8" y="308.2" width="642.4" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Перерозподіл заряду — не лише «парадокс із підручника»: це робочий принцип вибірки сигналу,</tspan><tspan x="360.0" dy="15.6">помпування напруги й передавання заряду в аналогових і змішаних схемах.</tspan></text>
</svg>