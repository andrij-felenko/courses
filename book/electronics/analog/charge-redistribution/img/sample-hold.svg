<text x="360.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ключ замкнений → вузол стежить за входом (вибірка). Ключ розмикається → C_утр тримає «знімок» (утримання).</text>
