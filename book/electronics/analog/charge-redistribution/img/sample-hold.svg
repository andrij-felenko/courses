<text x="129.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="129.0" dy="0.0">у мить розмикання ключ</tspan><tspan x="129.0" dy="14.3">скидає частину свого</tspan><tspan x="129.0" dy="14.3">заряду на C_утр →</tspan><tspan x="129.0" dy="14.3">сходинка похибки</tspan></text>
<rect x="252.5" y="232.0" width="215.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">kT/C-шум</text>
<line x1="266.5" y1="266.0" x2="453.5" y2="266.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="360.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">сам акт вибірки лишає</tspan><tspan x="360.0" dy="14.3">на C_утр шумовий заряд</tspan><tspan x="360.0" dy="14.3">σ² = kT/C — не залежить</tspan><tspan x="360.0" dy="14.3">від опору ключа</tspan></text>
