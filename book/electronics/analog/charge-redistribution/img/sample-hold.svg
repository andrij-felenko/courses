<text x="591.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="591.0" dy="0.0">струми витоку ключа й</tspan><tspan x="591.0" dy="14.3">буфера повільно зміщують</tspan><tspan x="591.0" dy="14.3">напругу — «знімок»</tspan><tspan x="591.0" dy="14.3">пливе з часом</tspan></text>
<rect x="55.9" y="368.2" width="608.2" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Вузол вибірки-зберігання — це керований перерозподіл заряду в C_утр. Три граблі класу:</tspan><tspan x="360.0" dy="15.6">інжекція заряду ключа, kT/C-шум вибірки й витік під час утримання.</tspan></text>
