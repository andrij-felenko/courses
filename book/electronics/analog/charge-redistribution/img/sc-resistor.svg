<rect x="76.4" y="328.2" width="567.2" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="348.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Конденсатор, що тактами переносить порції заряду між двома вузлами, у СЕРЕДНЬОМУ</tspan><tspan x="360.0" dy="15.6">жене такий самий струм, як резистор R = 1/(f·C): швидше такти → менший опір.</tspan></text>
