<text x="230.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">L</text>
<text x="230.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">N</text>
<text x="150.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">струм тече туди одним проводом,</tspan><tspan x="150.0" dy="15.0">назад другим — як корисний</tspan></text>
<text x="150.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">давить пара впоперек шин:</tspan><tspan x="150.0" dy="15.0">X-конденсатор</tspan></text>
