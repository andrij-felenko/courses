<text x="465.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">при-</tspan><tspan x="465.0" dy="15.6">стрій</tspan></text>
