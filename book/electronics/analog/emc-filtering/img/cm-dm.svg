<text x="610.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">той самий струм обома проводами в землю,</tspan><tspan x="610.0" dy="15.0">назад — паразитом по корпусу</tspan></text>
<text x="610.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">давить дросель + пара в землю:</tspan><tspan x="610.0" dy="15.0">синфазний дросель + Y-конденсатори</tspan></text>
