<rect x="93.5" y="314.2" width="533.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Ідеальний такт перемикається рівно по сітці. Реальний — щоразу трохи раніше</tspan><tspan x="360.0" dy="15.6">чи пізніше. Це тремтіння моментів у часі й називають джиттером.</tspan></text>
