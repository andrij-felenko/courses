<text x="65.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rб</text>
<text x="290.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1)  обери β_forced ≈ 10</text>
<text x="290.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2)  Ib = Ic / β_forced</text>
<text x="290.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">3)  Rб = (Vlog − Vbe) / Ib</text>
<text x="290.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">      = β_forced·(Vlog − 0.7)/Ic</text>
<line x1="290.0" y1="186.0" x2="770.0" y2="186.0" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
<text x="290.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Приклад: Ic = 100 мА, Vlog = 5 В</text>
<text x="290.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Ib = 100/10 = 10 мА</text>
<text x="290.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Rб = (5 − 0.7)/10мА = 430 Ом → 390 Ом</text>
<text x="290.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9c6a16" text-anchor="start" font-weight="bold" font-style="normal">перевір: Ib ≤ Iвиводу МК (≈20–40 мА)? ✓</text>
<text x="290.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9c6a16" text-anchor="start" font-weight="bold" font-style="normal">перевір: Vce(sat) &lt; 0.3 В у даташиті? ✓</text>
<text x="290.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">не лізе → потрібен Дарлінгтон або MOSFET</text>
<text x="410.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Округляй Rб ВНИЗ (більше бази — безпечніше); але стеж, щоб струм бази не перевищив дозволений для виводу.</text>
</svg>
