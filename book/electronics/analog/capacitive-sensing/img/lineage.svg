<text x="429.6" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="429.6" dy="0.0">система для</tspan><tspan x="429.6" dy="12.0">диспетчера</tspan></text>
