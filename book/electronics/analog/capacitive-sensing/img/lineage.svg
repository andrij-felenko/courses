<rect x="77.3" y="277.4" width="565.5" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Ідея → реалізація → система → щоденна річ: між «рука змінює ємність» і склом у кишені —</tspan><tspan x="360.0" dy="14.3">не стрибок, а той самий фізичний механізм, доведений до зрілості за століття</tspan></text>
