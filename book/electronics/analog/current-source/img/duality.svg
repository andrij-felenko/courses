<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два двійники: що тримають жорстко, що віддають вільно</text>
<rect x="40.0" y="56.0" width="290.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">ДЖЕРЕЛО НАПРУГИ</tspan></text>
<line x1="185.0" y1="116.0" x2="185.0" y2="144.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="163.0" y1="144.0" x2="207.0" y2="144.0" stroke="#1a1a1a" stroke-width="4.0"/>
<line x1="173.0" y1="156.0" x2="197.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="185.0" y1="156.0" x2="185.0" y2="184.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="225.0" cy="132.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="225.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="225.0" cy="168.0" r="9.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="225.0" y="171.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="185.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">тримає U сталою</text>
<text x="185.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">струм бере, скільки</text>
<text x="185.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">візьме навантаження</text>
<text x="185.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">коротко замкнути —</text>
<text x="185.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">струм нескінченний</text>
<line x1="360.0" y1="56.0" x2="360.0" y2="320.0" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="390.0" y="56.0" width="290.0" height="24.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="535.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="535.0" dy="0.0">ДЖЕРЕЛО СТРУМУ</tspan></text>
<circle cx="535.0" cy="150.0" r="30.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="535.0" y1="168.0" x2="535.0" y2="132.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="535.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">тримає I сталим</text>
<text x="535.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">напругу бере, скільки</text>
<text x="535.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">треба, щоб продавити I</text>
<text x="535.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">розірвати коло —</text>
<text x="535.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">напруга нескінченна</text>
</svg>