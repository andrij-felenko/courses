<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піддатливість: межа, доки джерело ще тримає струм</text>
<line x1="70.0" y1="200.0" x2="650.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="646.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">напруга, що дісталась навантаженню</text>
<rect x="140.0" y="110.0" width="400.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="340.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e7e44" text-anchor="middle" font-weight="700">тут струм стабільний: I = I₀</text>
<line x1="140.0" y1="100.0" x2="140.0" y2="208.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,3"/>
<line x1="540.0" y1="100.0" x2="540.0" y2="208.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">запас джерела</text>
<text x="540.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">уся напруга живлення</text>
<rect x="72.0" y="122.0" width="60.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="102.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#c0392b" text-anchor="middle"><tspan x="102.0" dy="0.0">джерело</tspan><tspan x="102.0" dy="10.4">здавлене:</tspan><tspan x="102.0" dy="10.4">I падає</tspan></text>
<rect x="554.0" y="122.0" width="86.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="597.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="597.0" dy="0.0">джерелу не</tspan><tspan x="597.0" dy="13.0">лишилось</tspan><tspan x="597.0" dy="13.0">напруги</tspan></text>
<text x="360.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ширину вікна звуть напругою піддатливості (compliance).</text>
</svg>