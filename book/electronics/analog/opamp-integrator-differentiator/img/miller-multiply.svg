<rect x="35.4" y="294.2" width="649.3" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="314.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Вхід піднявся на +1 В, вихід упав на −A В: різниця на ємності зросла в (1+A) разів,</tspan><tspan x="360.0" dy="15.6">тож стільки ж заряду треба прокачати з боку входу — крихітна C здається помноженою на (1+A).</tspan></text>
