<text x="375.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вхід 10 кОм</text>
<text x="375.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">вихід сидить на 2.5 В</text>
<line x1="450.0" y1="170.0" x2="494.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
