<text x="506.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="527.0" y1="170.0" x2="548.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<text x="520.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C2 = 470 мкФ (електроліт)</text>
<text x="520.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зріз 20 Гц на 32 Ом</text>
<line x1="548.0" y1="170.0" x2="600.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
