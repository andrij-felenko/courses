<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Аудіотракт: що нижчий опір за конденсатором — то він товщий</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва розділові рахуються тією самою формулою f_c = 1/(2πRC) — лише R різний</text>
<rect x="50.0" y="142.0" width="110.0" height="56.0" rx="8" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="105.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джерело</text>
<text x="105.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(DAC, 0 В DC)</text>
