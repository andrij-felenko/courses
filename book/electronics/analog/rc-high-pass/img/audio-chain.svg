<line x1="235.0" y1="156.0" x2="235.0" y2="184.0" stroke="#1b1b1b" stroke-width="2.8" stroke-linecap="round"/>
<line x1="237.0" y1="170.0" x2="258.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<text x="230.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C1 = 10 мкФ</text>
<text x="230.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">зріз 2 Гц на 10 кОм</text>
<line x1="258.0" y1="170.0" x2="300.0" y2="170.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
