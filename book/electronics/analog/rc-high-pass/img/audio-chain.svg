<text x="622.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🎧</text>
<text x="622.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">навушник 32 Ом, 0 В DC</text>
<line x1="660.0" y1="144.0" x2="760.0" y2="144.0" stroke="#1b1b1b" stroke-width="0" stroke-linecap="round"/>
<text x="740.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="430.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">C2 = 1/(2π·20 Гц·32 Ом) ≈ 250 мкФ  →  беруть 330–470 мкФ із запасом</text>
<text x="430.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ті самі 20 Гц на вході 10 кОм коштували лише 1 мкФ: ємність росте обернено до опору навантаження —</text>
<text x="430.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ось чому в старих плеєрах біля гнізда навушників стояли «бочки», а міжкаскадні конденсатори дрібні</text>
</svg>
