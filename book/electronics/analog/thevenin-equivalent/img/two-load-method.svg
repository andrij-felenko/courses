<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Метод двох навантажень: дві точки задають пряму джерела</text>
<text x="430.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два відомі навантаження, дві пари (I, V) — і з прямої V = Vth − I·Rth дістаємо обидва числа</text>
<line x1="110.0" y1="330.0" x2="600.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="600.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="italic" font-style="normal">струм I</text>
<line x1="110.0" y1="330.0" x2="110.0" y2="84.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="102.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">напруга V</text>
<line x1="110.0" y1="111.8" x2="528.2" y2="330.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="193.6" y1="155.5" x2="193.6" y2="330.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="193.6" y1="155.5" x2="110.0" y2="155.5" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<circle cx="193.6" cy="155.5" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="201.6" y="145.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">навант. R₁</text>
<line x1="277.3" y1="199.1" x2="277.3" y2="330.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="277.3" y1="199.1" x2="110.0" y2="199.1" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<circle cx="277.3" cy="199.1" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="285.3" y="189.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">навант. R₂</text>
<circle cx="110.0" cy="111.8" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="118.0" y="103.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Vth (екстрап. до I=0)</text>
<text x="340.0" y="203.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">нахил = −Rth</text>
<rect x="628.0" y="108.0" width="214.0" height="214.0" rx="10" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="735.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві пари (I, V):</text>
<text x="646.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V₁ = Vth − I₁·Rth</text>
<text x="646.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V₂ = Vth − I₂·Rth</text>
<line x1="646.0" y1="192.0" x2="826.0" y2="192.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="646.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Rth = (V₁−V₂)/(I₂−I₁)</text>
<text x="646.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Vth = V₁ + I₁·Rth</text>
<line x1="646.0" y1="254.0" x2="826.0" y2="254.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="646.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Ні відкритих, ні замкнених</text>
<text x="646.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">клем — лише два безпечні R.</text>
</svg>
