<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як читати число: завада, зведена до входу</text>
<text x="400.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">синфазна завада ділиться на CMRR — і стає крихітною похибкою на вході</text>
<rect x="60.0" y="95.0" width="300.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">синфазна завада  Vс = 1 В</tspan></text>
<line x1="210.0" y1="145.0" x2="210.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">÷ CMRR</text>
<rect x="60.0" y="180.0" width="300.0" height="46.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="207.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">видно на вході як  Vс / CMRR</tspan></text>
<text x="60.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">CMRR = 60 дБ (×1 000)</text>
<text x="60.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">= 1 мВ  — псує сигнал</text>
<text x="60.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">CMRR = 100 дБ (×100 000)</text>
<text x="60.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">= 10 мкВ  — майже невидно</text>
<text x="60.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">CMRR = 120 дБ (×1 000 000)</text>
<text x="60.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">= 1 мкВ  — чисто</text>
<line x1="470.0" y1="100.0" x2="470.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="470.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">дБ ↔ у скільки разів</text>
<line x1="464.0" y1="380.0" x2="476.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="458.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">60 дБ</text>
<text x="484.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">× 1 000</text>
<line x1="464.0" y1="296.7" x2="476.0" y2="296.7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="458.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">80 дБ</text>
<text x="484.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">× 10 000</text>
<line x1="464.0" y1="213.3" x2="476.0" y2="213.3" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="458.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">100 дБ</text>
<text x="484.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">× 100 000</text>
<line x1="464.0" y1="130.0" x2="476.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="458.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">120 дБ</text>
<text x="484.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">× 1 000 000</text>
<line x1="670.0" y1="380.0" x2="670.0" y2="296.7" stroke="#2457d6" stroke-width="1.6"/>
<line x1="665.0" y1="380.0" x2="675.0" y2="380.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="665.0" y1="296.7" x2="675.0" y2="296.7" stroke="#2457d6" stroke-width="1.6"/>
<text x="682.0" y="332.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700"><tspan x="682.0" dy="0.0">+20 дБ</tspan><tspan x="682.0" dy="13.8">= ×10</tspan></text>
</svg>