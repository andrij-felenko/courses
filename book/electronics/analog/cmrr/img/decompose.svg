<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будь-який вхід = спільне + різниця</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">підсилювач множить кожну складову на свій коефіцієнт; CMRR = Aд / Aс</text>
<line x1="70.0" y1="110.0" x2="70.0" y2="290.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="62.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">V</text>
<line x1="70.0" y1="160.0" x2="220.0" y2="160.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="226.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Vс (спільне)</text>
<circle cx="70.0" cy="147.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="62.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">V₊</text>
<circle cx="70.0" cy="173.0" r="5.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="62.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">V₋</text>
<line x1="88.0" y1="147.0" x2="88.0" y2="173.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="94.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Vд</text>
<line x1="180.0" y1="200.0" x2="294.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="140.0" width="150.0" height="120.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="375.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">диференційний</tspan><tspan x="375.0" dy="16.9">підсилювач</tspan></text>
<text x="375.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Aд  · Vд</text>
<text x="375.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Aс  · Vс</text>
<line x1="450.0" y1="178.0" x2="570.0" y2="178.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="576.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">корисне</text>
<line x1="450.0" y1="222.0" x2="570.0" y2="222.0" stroke="#c0392b" stroke-width="1.0" marker-end="url(#arrow)"/>
<text x="576.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">просочена завада</text>
<rect x="130.0" y="360.0" width="500.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">вихід = Aд·Vд + Aс·Vс      — мрія: Aс → 0, тобто CMRR → ∞</tspan></text>
</svg>