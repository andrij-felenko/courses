<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те саме сумарне підсилення — а смуга ширша двома каскадами</text>
<text x="420.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">×900 одним махом дає вузьку смугу; два по ×30 (теж ×900) тримають ширшу</text>
<text x="70.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Один каскад</text>
<line x1="70.0" y1="130.0" x2="150.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.4"/>
<rect x="150.0" y="100.0" width="150.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="225.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">×900</tspan></text>
<line x1="300.0" y1="130.0" x2="380.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.4"/>
<text x="385.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">смуга = GBW/900</text>
<text x="385.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">= 1.1 кГц (вузька)</text>
<text x="70.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Два каскади</text>
<line x1="70.0" y1="280.0" x2="130.0" y2="280.0" stroke="#cf8b5e" stroke-width="2.4"/>
<rect x="130.0" y="250.0" width="110.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/><text x="185.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">×30</tspan></text>
<line x1="240.0" y1="280.0" x2="300.0" y2="280.0" stroke="#cf8b5e" stroke-width="2.4"/>
<rect x="300.0" y="250.0" width="110.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/><text x="355.0" y="286.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">×30</tspan></text>
<line x1="410.0" y1="280.0" x2="470.0" y2="280.0" stroke="#cf8b5e" stroke-width="2.4"/>
<text x="478.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">кожен: смуга = GBW/30</text>
<text x="478.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">= 33 кГц на каскад</text>
<text x="478.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">разом ≈ 21 кГц (ширша!)</text>
<line x1="60.0" y1="205.0" x2="780.0" y2="205.0" stroke="#e0e0e0" stroke-width="1.0"/>
<rect x="60.0" y="348.0" width="720.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="420.0" y="371.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">GBW = 1 МГц у обох. Те саме сумарне ×900 — але розкладене по двох каскадах</tspan><tspan x="420.0" dy="16.2">віддає у ~19 разів ширшу смугу. Велике підсилення вигідно ділити.</tspan></text>
</svg>