<text x="705.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="705.0" dy="0.0">u та i рухаються разом</tspan><tspan x="705.0" dy="15.0">навантажувальною прямою</tspan></text>
