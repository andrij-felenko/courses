<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форма сплеску на фронті: звідки береться площа</text>
<text x="255.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">затиснуте індуктивне навантаження</text>
<text x="255.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="255.0" dy="0.0">спершу росте струм при повній напрузі,</tspan><tspan x="255.0" dy="15.0">потім падає напруга при повному струмі</tspan></text>
