<rect x="161.4" y="480.6" width="597.1" height="48.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Той самий фронт t, та сама напруга, той самий струм — а енергія різниться втричі.</tspan><tspan x="460.0" dy="16.2">Формула ½·U·I·t описує ліву картинку; на правій вона втричі завелика.</tspan></text>
