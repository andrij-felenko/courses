<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому ідею не вдавалося збудувати 55 років</text>
<text x="360.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виходу інтегратора бракувало моменту сили, щоб рухати наступний</text>
<rect x="102.0" y="117.0" width="96.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700">∫</text><text x="150.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інтегратор</text>
<text x="150.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">слабкий вихід</text>
<rect x="512.0" y="117.0" width="96.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700">∫</text><text x="560.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інтегратор</text>
<text x="560.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">опір навантаження</text>
<rect x="341.0" y="92.0" width="28.0" height="116.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="355.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">СТІНА</text>
<text x="355.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">момент</text>
<text x="355.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">сили</text>
<line x1="198.0" y1="150.0" x2="339.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="371.0" y1="150.0" x2="512.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 4"/>
<text x="441.5" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">кулька прослизає</text>
<line x1="70.0" y1="235.0" x2="650.0" y2="235.0" stroke="#dfe3e8" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="360.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ланка, якої бракувало: підсилювач моменту сили (Німан, 1925)</text>
<rect x="92.9" y="288.2" width="534.1" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="307.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Слабкий вхід лише ПРИТИСКАЄ стрічку до обертового барабана (як кабестан на якорі),</tspan><tspan x="360.0" dy="14.3">а барабан від двигуна віддає на вихід ту саму дію — але з силою. Вихід тепер може</tspan><tspan x="360.0" dy="14.3">рухати наступний інтегратор, сам не навантажуючись. Так ідея 1876 ожила 1931-го.</tspan></text>
</svg>