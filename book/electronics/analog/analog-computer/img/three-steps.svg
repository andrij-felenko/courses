<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три кроки, які зробили різні люди</text>
<text x="370.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ідею легко сплутати з реалізацією, а реалізацію — з цеглинкою</text>
<line x1="60.0" y1="150.0" x2="680.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="670.0" y1="150.0" x2="684.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="170.0" cy="150.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="170.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1876</text>
<text x="170.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ІДЕЯ</text>
<rect x="70.0" y="174.0" width="200.0" height="64.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">з'єднати інтегратори,</tspan><tspan x="170.0" dy="14.3">щоб втілити рівняння</tspan></text>
<text x="170.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">брати Томсони</text>
<circle cx="400.0" cy="150.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="400.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1931</text>
<text x="400.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">МЕХАНІКА</text>
<rect x="300.0" y="174.0" width="200.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">диференційний аналізатор:</tspan><tspan x="400.0" dy="13.0">вали, шестерні, 6 інтеграторів</tspan></text>
<text x="400.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">В. Буш, MIT</text>
<circle cx="620.0" cy="150.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="620.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1947→53</text>
<text x="620.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЕЛЕКТРОНІКА</text>
<rect x="520.0" y="174.0" width="200.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">та сама математика струмами:</tspan><tspan x="620.0" dy="14.3">«операційний підсилювач»</tspan></text>
<text x="620.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Раджаззіні; K2-W</text>
<text x="285.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">↑ між ними — 55 років: бракувало моменту сили</text>
</svg>