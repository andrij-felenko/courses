<text x="620.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">серце машини — на C</text>
<rect x="76.7" y="307.4" width="546.7" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Маючи лише ці три блоки, можна зібрати будь-яке лінійне диференційне рівняння:</tspan><tspan x="350.0" dy="14.3">масштаб дає коефіцієнти, сума — складання доданків, інтеграл — перехід між похідними</tspan></text>
