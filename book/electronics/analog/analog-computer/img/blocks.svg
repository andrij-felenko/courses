<line x1="310.0" y1="132.0" x2="352.0" y2="132.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="310.0" y1="168.0" x2="352.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
