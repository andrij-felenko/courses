<line x1="448.0" y1="150.0" x2="500.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">a+b</text>
<text x="400.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">складає кілька напруг</text>
<text x="400.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">в одному вузлі (КЗС)</text>
<rect x="572.0" y="111.0" width="96.0" height="78.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="620.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#27ae60" text-anchor="middle" font-weight="700">∫ dt</text><text x="620.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інтеграл</text>
