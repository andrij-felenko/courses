<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передавальна функція — один множник між входом і виходом</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">що коло робить із синусоїдою частоти ω: множить амплітуду й повертає фазу</text>
<text x="150.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">вхід X(ω)</text>
<line x1="150.0" y1="190.0" x2="205.0" y2="152.0" stroke="#2457d6" stroke-width="3.0"/>
<circle cx="150.0" cy="190.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">амплітуда A
фаза 0</text>
<line x1="210.0" y1="190.0" x2="290.0" y2="190.0" stroke="#cf8b5e" stroke-width="2.6"/>
<rect x="290.0" y="135.0" width="240.0" height="110.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.2"/>
<text x="410.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">H(ω)</text>
<text x="410.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лінійне коло</text>
<text x="410.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(фільтр, підсилювач, кабель…)</text>
<line x1="530.0" y1="190.0" x2="600.0" y2="190.0" stroke="#cf8b5e" stroke-width="2.6"/>
<text x="635.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">вихід Y = H·X</text>
<line x1="600.0" y1="190.0" x2="678.0" y2="172.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="600.0" cy="190.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="630.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">× |H| (розтяг)
− φ (поворот)</text>
<text x="410.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y(ω) = H(ω) · X(ω)   —   множення комплексних чисел: |Y|=|H|·|X|,  кут Y = кут X + кут H</text>
</svg>