<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 353" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="353" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід жертовної дротинки: ідея старша за Едісона</text>
<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">жоден рік не «народження фактично» — це ланцюг рук</text>
<line x1="60.0" y1="210.0" x2="680.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0"/>
<polygon points="680.0,210.0 670.0,205.0 670.0,215.0" fill="#1a1a1a"/>
<circle cx="106.7" cy="210.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="106.7" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1847</text>
<line x1="106.7" y1="204.0" x2="106.7" y2="176.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="106.7" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Бреге</text>
<text x="106.7" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ідея: тонкий дріт</text>
<text x="106.7" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">як заслін від блискавки</text>
<circle cx="220.0" cy="210.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="220.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1864</text>
<line x1="220.0" y1="216.0" x2="220.0" y2="244.0" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="220.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">фольга й дротини</text>
<text x="220.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">уже в ужитку на</text>
<text x="220.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">телеграфі й освітленні</text>
<circle cx="326.7" cy="210.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="326.7" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1880</text>
<line x1="326.7" y1="204.0" x2="326.7" y2="176.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="326.7" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">свинцева ланка</text>
<text x="326.7" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">патент Едісона,</text>
<text x="308.7" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">травень 1880</text>
<circle cx="393.3" cy="210.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="393.3" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1890</text>
<line x1="393.3" y1="216.0" x2="393.3" y2="244.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="393.3" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">патент-блок</text>
<text x="393.3" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">US 438305:</text>
<text x="393.3" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">подано 1885 → видано 1890</text>
<circle cx="620.0" cy="210.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="620.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1924</text>
<line x1="620.0" y1="204.0" x2="620.0" y2="176.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="620.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">автомат</text>
<text x="620.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Штоц + Шахтнер:</text>
<text x="620.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вимикач, що не згоряє</text>
<rect x="42.2" y="303.0" width="635.6" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">заслін дозрів на телеграфі задовго до розетки; Едісон зробив із нього придатний виріб, а не «вигадав уперше»</tspan></text>
</svg>