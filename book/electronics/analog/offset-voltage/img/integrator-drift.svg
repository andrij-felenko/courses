<line x1="430.0" y1="212.5" x2="650.0" y2="305.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="650.0" y1="305.0" x2="770.0" y2="305.0" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="650.0" cy="305.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="660.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Залипання у −V_sat</text>
<rect x="50.0" y="360.0" width="720.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Час до насичення інтегратора:  t_насичення = |V_sat| · R · C / |V_os|</tspan><tspan x="410.0" dy="13.0">Для Vos = 1 мВ, R = 100 кОм, C = 1 мкФ і Vsat = 10 В вихід залипне за t = 10 · 0.1 / 0.001 = 1000 с (~16 хв)</tspan></text>
