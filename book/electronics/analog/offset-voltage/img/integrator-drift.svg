<rect x="55.0" y="270.0" width="300.0" height="55.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="288.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Струм заряду конденсатора:</tspan><tspan x="205.0" dy="11.7">I_похибки = V_os / R</tspan><tspan x="205.0" dy="11.7">Створює лінійний дрейф виходу dV/dt = V_os / (R·C)</tspan></text>
