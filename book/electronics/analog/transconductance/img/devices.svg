<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крутість — спільна мова трьох підсилювальних приладів</text>
<rect x="27.0" y="70.0" width="210.0" height="165.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="132.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">BJT</text>
<text x="132.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вхід: Vбаза керує струмом</text>
<rect x="41.0" y="144.0" width="182.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="132.0" y="165.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">gm = I_C / V_T</tspan></text>
<text x="132.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">≈ 38·I (мА/В)</text>
<rect x="255.0" y="70.0" width="210.0" height="165.0" rx="10" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">MOSFET</text>
<text x="360.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вхід: V_GS керує струмом</text>
<rect x="269.0" y="144.0" width="182.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="360.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">gm = 2·I_D / (V_GS−V_th)</tspan></text>
<text x="360.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">росте як √I</text>
<rect x="483.0" y="70.0" width="210.0" height="165.0" rx="10" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="588.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">лампа (тріод)</text>
<text x="588.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вхід: V_сітка керує струмом</text>
<rect x="497.0" y="144.0" width="182.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="588.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="588.0" dy="0.0">gm = ΔI_анод / ΔV_сітка</tspan></text>
<text x="588.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1…10 мА/В</text>
<text x="360.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Прилади різні, формули різні — роль одна: напруга на вході задає струм на виході.</text>
</svg>