  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рецепт розрахунку й самоперевірки</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">порядок дій для будь-якого кола — і як перевірити себе</text>
<circle cx="110.0" cy="106.0" r="16.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="110.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="140.0" y="90.0" width="640.0" height="50.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="158.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Спрости</text>
<text x="158.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">згорни послідовні (ΣR) і паралельні (Σ1/R) групи</text>
<circle cx="110.0" cy="170.0" r="16.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="110.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<rect x="140.0" y="154.0" width="640.0" height="50.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="158.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Повний струм</text>
<text x="158.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">I = V / R_екв від джерела</text>
<circle cx="110.0" cy="234.0" r="16.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="110.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<rect x="140.0" y="218.0" width="640.0" height="50.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="158.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Розгорни назад</text>
<text x="158.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дільниками знайди спади й гілкові струми</text>
<circle cx="110.0" cy="298.0" r="16.0" fill="#1f47b5" stroke="#1b1b1b" stroke-width="2"/>
<text x="110.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<rect x="140.0" y="282.0" width="640.0" height="50.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="158.0" y="303.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Не згортається?</text>
<text x="158.0" y="321.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">признач струми, напиши KCL+KVL+Ом, розв'яжи систему</text>
<rect x="110.0" y="350.0" width="670.0" height="70.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="445.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Перевір себе:</text>
<text x="445.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• одиниці сходяться?   • KCL у вузлах і KVL у контурах виконуються?   • порядок величин розумний?</text>
</svg>
