<text x="401.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="471.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">розгорни назад</text>
<text x="457.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="457.0" dy="0.0">дільниками — спади</tspan><tspan x="457.0" dy="13.8">й гілкові струми</tspan></text>
