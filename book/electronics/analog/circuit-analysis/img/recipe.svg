<text x="631.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="631.0" dy="0.0">система</tspan><tspan x="631.0" dy="13.8">KCL + KVL + Ом</tspan></text>
<text x="370.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">і завжди — три самоперевірки:</text>
<rect x="20.0" y="245.0" width="220.0" height="64.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="130.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">одиниці</text>
<text x="130.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="130.0" dy="0.0">В з В, А з А —</tspan><tspan x="130.0" dy="12.6">не загубити множник</tspan></text>
<rect x="260.0" y="245.0" width="220.0" height="64.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="370.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">KCL / KVL</text>
<text x="370.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="370.0" dy="0.0">Σ струмів = повному,</tspan><tspan x="370.0" dy="12.6">Σ спадів = джерелу</tspan></text>
<rect x="500.0" y="245.0" width="220.0" height="64.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="610.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">порядок величин</text>
<text x="610.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">міліампери,</tspan><tspan x="610.0" dy="12.6">а не кілоампери?</tspan></text>
</svg>