<text x="360.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Будь-яке коло розв'язують комбінацією цих чотирьох — у правильному порядку</text>
