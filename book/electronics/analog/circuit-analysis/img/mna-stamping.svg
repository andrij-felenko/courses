<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резистор «штампує» хрест провідностей у матрицю G</text>
<line x1="380.0" y1="70.0" x2="380.0" y2="312.0" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резистор R між вузлами 1 і 2</text>
<circle cx="110.0" cy="160.0" r="18.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="110.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<circle cx="290.0" cy="160.0" r="18.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="290.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<line x1="128.0" y1="160.0" x2="165.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="235.0" y1="160.0" x2="272.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="165.0" y="148.0" width="70.0" height="24.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="2.0"/>
<text x="200.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<text x="200.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">провідність g = 1/R</text>
<text x="190.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">додає у G чотири внески:</text>
<text x="190.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(1,1) += g     (2,2) += g</text>
<text x="190.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">(1,2) −= g     (2,1) −= g</text>
<text x="600.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця провідностей G</text>
<text x="576.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1</text>
<text x="648.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">2</text>
<text x="524.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1</text>
<text x="524.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">2</text>
<rect x="540.0" y="132.0" width="72.0" height="72.0" rx="0" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
<text x="576.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">+g</text>
<rect x="612.0" y="132.0" width="72.0" height="72.0" rx="0" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
<text x="648.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">−g</text>
<rect x="540.0" y="204.0" width="72.0" height="72.0" rx="0" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
<text x="576.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">−g</text>
<rect x="612.0" y="204.0" width="72.0" height="72.0" rx="0" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
<text x="648.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">+g</text>
<text x="612.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен елемент штампує свій хрест незалежно</text>
<text x="612.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">— уся матриця збирається з netlist сама</text>
