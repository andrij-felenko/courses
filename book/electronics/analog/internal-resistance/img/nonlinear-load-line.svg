<text x="477.1" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e08030" text-anchor="middle" font-weight="700">більший r → точка зсувається</text>
<rect x="130.0" y="104.0" width="320.0" height="96.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="290.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Змінюєш ε чи r — лінія рухається,</tspan><tspan x="290.0" dy="14.3">а робоча точка ковзає</tspan><tspan x="290.0" dy="14.3">по кривій приладу.</tspan><tspan x="290.0" dy="14.3">Так задають режим діодів і транзисторів.</tspan></text>
