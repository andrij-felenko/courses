<text x="499.1" y="302.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">робоча точка</text>
<line x1="582.5" y1="360.0" x2="110.0" y2="199.0" stroke="#e08030" stroke-width="2.2" stroke-dasharray="6 4"/>
