<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінія навантаження: робоча точка — це перетин</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">джерело й навантаження мають спільні V та I — реальна точка там, де характеристики перетинаються</text>
<line x1="110.0" y1="360.0" x2="720.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">напруга V</text>
<line x1="110.0" y1="360.0" x2="110.0" y2="84.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="102.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">струм I</text>
<line x1="664.5" y1="360.0" x2="110.0" y2="359.7" stroke="#c0392b" stroke-width="2.8"/>
<line x1="110.0" y1="360.0" x2="720.0" y2="222.0" stroke="#2457d6" stroke-width="2.6"/>
<line x1="479.7" y1="359.9" x2="479.7" y2="360.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="479.7" y1="359.9" x2="110.0" y2="359.9" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="479.7" cy="359.9" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="491.7" y="347.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">робоча: 6.7 В, 33 мА</text>
<circle cx="664.5" cy="360.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="664.5" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ε (хол. хід)</text>
<circle cx="110.0" cy="359.7" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="102.0" y="359.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">I_кз = ε/r</text>
<text x="498.2" y="164.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">джерело: V = ε − I·r  (нахил −1/r)</text>
<text x="575.8" y="264.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">навантаження R: V = I·R</text>
</svg>