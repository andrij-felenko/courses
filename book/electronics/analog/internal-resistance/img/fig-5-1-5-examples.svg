</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Внутрішній опір у житті</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">малий r — «міцне» джерело (великий струм без просідання); великий r — кволе</text>
<rect x="55.0" y="100.0" width="190.0" height="140.0" rx="12" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="150.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Автоакумулятор</text>
<rect x="80.0" y="142.0" width="140.0" height="32.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="150.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">r ≈ 0.005 Ω</text>
<text x="150.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крутить стартер сотнями ампер</text>
<text x="150.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="275.0" y="100.0" width="190.0" height="140.0" rx="12" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="370.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Свіжа батарейка AA</text>
<rect x="300.0" y="142.0" width="140.0" height="32.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="370.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">r ≈ 0.2 Ω</text>
<text x="370.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тримає звичайне навантаження</text>
<text x="370.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="495.0" y="100.0" width="190.0" height="140.0" rx="12" fill="#f6f8fc" stroke="#e08030" stroke-width="1.8"/>
<text x="590.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стара батарейка</text>
<rect x="520.0" y="142.0" width="140.0" height="32.0" rx="8" fill="#fff" stroke="#e08030" stroke-width="1.6"/>
<text x="590.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">r ≈ 2–5 Ω</text>
<text x="590.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">просідає, «мертва» під струмом</text>
<text x="590.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="710.0" y="100.0" width="190.0" height="140.0" rx="12" fill="#f6f8fc" stroke="#c0271e" stroke-width="1.8"/>
<text x="805.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Літієва «таблетка»</text>
<rect x="735.0" y="142.0" width="140.0" height="32.0" rx="8" fill="#fff" stroke="#c0271e" stroke-width="1.6"/>
<text x="805.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">r ≈ 10 Ω</text>
<text x="805.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">лише слабкі споживачі</text>
<text x="805.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="120.0" y="300.0" width="620.0" height="50.0" rx="10" fill="#fff3e8" stroke="#e08030" stroke-width="1.6"/>
<text x="430.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Максимальний струм джерела — ε/r. Малий r → величезний можливий струм (і небезпека к.з.);</text>
<text x="430.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">великий r → джерело саме себе обмежує, але «не тягне» потужних споживачів.</text>
</svg>
