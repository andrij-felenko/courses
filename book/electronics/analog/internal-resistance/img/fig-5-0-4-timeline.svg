<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
<rect width="860" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як народилася ідея еквівалента</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">двічі-тричі незалежно — ознака по-справжньому глибокої думки</text>
<line x1="80.0" y1="150.0" x2="800.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="150.0" y1="142.0" x2="150.0" y2="158.0" stroke="#1f47b5" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="150.0" cy="150.0" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="150.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1853</text>
<text x="150.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гельмгольц</text>
<text x="150.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">попередник теореми</text>
<line x1="390.0" y1="142.0" x2="390.0" y2="158.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="390.0" cy="150.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="390.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1883</text>
<text x="390.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тевенен</text>
<text x="390.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інженер телеграфу (Франція):</text>
<text x="390.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">джерело напруги + опір</text>
<line x1="650.0" y1="142.0" x2="650.0" y2="158.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="650.0" cy="150.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="650.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1926</text>
<text x="650.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Нортон і Маєр</text>
<text x="650.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Bell Labs (США) й Німеччина:</text>
<text x="650.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">джерело струму + опір</text>
<rect x="150.0" y="252.0" width="560.0" height="48.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="430.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те, що кілька людей дійшли до цього незалежно, — знак, що ідея «дозріла»</text>
<text x="430.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(як свого часу збереження енергії). Абстракція «чорної скриньки» виявилася універсальною.</text>
</svg>
