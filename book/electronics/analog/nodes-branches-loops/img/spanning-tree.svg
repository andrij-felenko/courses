<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кістякове дерево й хорди: звідки беруться незалежні контури</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">обхід будує дерево без петель; кожна зайва гілка-хорда замикає один контур</text>
<line x1="170.0" y1="150.0" x2="380.0" y2="150.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="275.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">a</text>
<line x1="380.0" y1="150.0" x2="380.0" y2="330.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">b</text>
<line x1="380.0" y1="330.0" x2="170.0" y2="330.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="275.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">c</text>
<line x1="170.0" y1="330.0" x2="170.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5"/>
<line x1="170.0" y1="150.0" x2="380.0" y2="330.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="150.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">d</text>
<text x="298.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">e</text>
<circle cx="170.0" cy="150.0" r="19.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="170.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<circle cx="380.0" cy="150.0" r="19.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="380.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<circle cx="380.0" cy="330.0" r="19.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="380.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<circle cx="170.0" cy="330.0" r="19.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="170.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text>
<line x1="470.0" y1="112.0" x2="510.0" y2="112.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="520.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">гілка дерева (N−1 = 3): без петель</text>
<line x1="470.0" y1="140.0" x2="510.0" y2="140.0" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5"/>
<text x="520.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">хорда (B−N+1 = 2): замикає контур</text>
<rect x="470.0" y="176.0" width="366.0" height="168.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="488.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Хорда + шлях по дереву між її кінцями</text>
<text x="488.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">= один фундаментальний контур:</text>
<text x="488.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• хорда d (4–1) → контур 1-2-3-4</text>
<text x="488.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• хорда e (1–3) → контур 1-2-3</text>
<text x="488.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Разом L = 2 незалежні контури —</text>
<text x="488.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рівно B − N + 1.</text>
</svg>