<text x="230.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<circle cx="230.0" cy="300.0" r="16.0" fill="#c0271e" stroke="#1b1b1b" stroke-width="2"/>
<text x="230.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="230.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<circle cx="150.0" cy="210.0" r="16.0" fill="#c0271e" stroke="#1b1b1b" stroke-width="2"/>
<text x="150.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="150.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<circle cx="330.0" cy="210.0" r="16.0" fill="#c0271e" stroke="#1b1b1b" stroke-width="2"/>
<text x="330.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="330.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D</text>
<text x="240.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">степінь = число мостів; усі чотири НЕПАРНІ (3, 3, 5, 3)</text>
<rect x="470.0" y="96.0" width="360.0" height="120.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="650.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило Ейлера</text>
<text x="490.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• обхід із поверненням можливий, лише</text>
<text x="505.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">якщо КОЖНА вершина має парний степінь;</text>
<text x="490.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• допустимо щонайбільше 2 непарні</text>
<text x="505.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(і то лише як старт та фініш).</text>
<rect x="470.0" y="232.0" width="360.0" height="70.0" rx="12" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="650.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Тут непарних аж ЧОТИРИ.</text>
<text x="650.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Отже, пройти кожним мостом раз — НЕМОЖЛИВО.</text>
<text x="430.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ейлер довів це, не перебираючи маршрути, — самим рахунком парності. У цьому й сила графа.</text>
</svg>
