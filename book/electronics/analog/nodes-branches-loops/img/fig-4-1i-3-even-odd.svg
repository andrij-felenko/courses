<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому це неможливо: рахунок парності</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">проходячи землю наскрізь, витрачаєш 2 мости — тож потрібне ПАРНЕ їх число</text>
<path d="M 230.0 120.0 Q 178.0 154.4 150.0 210.0" fill="none" stroke="#c9c9c9" stroke-width="2"/>
