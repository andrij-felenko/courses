<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи обходу: вглиб (DFS) і вшир (BFS)</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">обидва відвідують усі вузли по разу за O(N+B); на МК — ітеративно, не рекурсією</text>
<line x1="440.0" y1="70.0" x2="440.0" y2="332.0" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="225.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">DFS — вглиб (стек, LIFO)</text>
<line x1="165.0" y1="130.0" x2="285.0" y2="130.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="285.0" y1="130.0" x2="285.0" y2="250.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="285.0" y1="250.0" x2="165.0" y2="250.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="165.0" y1="250.0" x2="165.0" y2="130.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="165.0" y1="130.0" x2="285.0" y2="250.0" stroke="#9aa3ad" stroke-width="2.0"/>
<circle cx="165.0" cy="130.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="165.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<circle cx="285.0" cy="130.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="285.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<circle cx="285.0" cy="250.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="285.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<circle cx="165.0" cy="250.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="165.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text>
<text x="225.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок: 1 → 2 → 3 → 4 (вглиб, тоді назад)</text>
<text x="225.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">стек: кладемо сусідів, беремо з вершини</text>
<text x="655.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">BFS — вшир (черга, FIFO)</text>
<line x1="595.0" y1="130.0" x2="715.0" y2="130.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="715.0" y1="130.0" x2="715.0" y2="250.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="715.0" y1="250.0" x2="595.0" y2="250.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="595.0" y1="250.0" x2="595.0" y2="130.0" stroke="#9aa3ad" stroke-width="2.0"/>
<line x1="595.0" y1="130.0" x2="715.0" y2="250.0" stroke="#9aa3ad" stroke-width="2.0"/>
<circle cx="595.0" cy="130.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="595.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<circle cx="715.0" cy="130.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="715.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<circle cx="715.0" cy="250.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="715.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<circle cx="595.0" cy="250.0" r="16.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/><text x="595.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text>
<text x="655.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок: 1 → (2, 3) → 4 (рівнями)</text>
<text x="655.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">черга: беремо з початку, додаємо в кінець</text>
<rect x="110.0" y="338.0" width="660.0" height="30.0" rx="6" fill="#fff8ee" stroke="#e08030" stroke-width="1.5"/><text x="440.0" y="356.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">На мікроконтролері — ЯВНИЙ стек/черга в пам'яті, а не рекурсія: глибокий граф переповнив би стек МК</tspan></text>
</svg>