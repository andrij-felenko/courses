<line x1="566.0" y1="165.0" x2="600.0" y2="165.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<rect x="600.0" y="155.0" width="70.0" height="20.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="635.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R</text>
