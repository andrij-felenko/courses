<text x="706.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">вузол Y</text>
<text x="636.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а елемент (резистор, лампа…)</text>
<text x="636.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">РОЗДІЛЯЄ на два різні вузли</text>
<text x="410.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Правило: подумки «стягни» всі суцільні дроти — скільки лишилось точок, стільки й вузлів.</text>
</svg>
