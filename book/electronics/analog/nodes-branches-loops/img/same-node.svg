<text x="260.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">усі ці точки — ОДИН вузол</text>
<text x="260.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(з'єднані дротом → однаковий потенціал)</text>
<circle cx="560.0" cy="165.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
