<line x1="220.0" y1="165.0" x2="220.0" y2="115.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="320.0" y1="165.0" x2="320.0" y2="215.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
