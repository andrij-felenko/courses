<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві петлі в кольоровому приймачі</text>
<line x1="40.0" y1="200.0" x2="110.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="75.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">композит</text>
<rect x="125.0" y="165.0" width="110.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="180.0" y="189.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">розділювач</tspan><tspan x="180.0" dy="14.3">(що це за</tspan><tspan x="180.0" dy="14.3">частина?)</tspan></text>
<line x1="235.0" y1="185.0" x2="300.0" y2="120.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="320.0" y="85.0" width="200.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="420.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ПОВІЛЬНА петля — рядкова</tspan><tspan x="420.0" dy="11.7">веде за синхроімпульсами</tspan><tspan x="420.0" dy="11.7">≈15.6 кГц, проста RC-настройка</tspan></text>
<line x1="522.0" y1="120.0" x2="600.0" y2="120.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="660.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">розгортка</text>
<text x="660.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(де малювати)</text>
<line x1="235.0" y1="215.0" x2="300.0" y2="285.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="320.0" y="250.0" width="200.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="420.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">ШВИДКА петля — кольорова</tspan><tspan x="420.0" dy="13.0">веде за burst, кварц 3.58 МГц</tspan><tspan x="420.0" dy="13.0">вузька смуга, точна фаза</tspan></text>
<line x1="522.0" y1="285.0" x2="600.0" y2="285.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="660.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">піднесена</text>
<text x="660.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(який колір)</text>
<rect x="86.7" y="339.0" width="546.7" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Та сама ідея петлі — двічі: одна тримає ГЕОМЕТРІЮ кадру, друга — ФАЗУ кольору</tspan></text>
</svg>