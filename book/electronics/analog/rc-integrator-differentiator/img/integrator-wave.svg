<text x="150.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інтеграл сталої = нахил</text>
<rect x="62.7" y="298.2" width="594.6" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="318.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Поки вхід тримає стале значення, конденсатор заряджається майже рівно — пряма лінія.</tspan><tspan x="360.0" dy="15.6">Прямокутник інтегрується в трикутник. Працює, ЛИШЕ коли τ = RC ≫ період входу.</tspan></text>
