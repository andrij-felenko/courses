<path d="M80.0 85.0 L220.0 85.0 L220.0 165.0 L360.0 165.0 L360.0 85.0 L500.0 85.0 L500.0 165.0 L640.0 165.0" fill="none" stroke="#2457d6" stroke-width="2.2"/>
