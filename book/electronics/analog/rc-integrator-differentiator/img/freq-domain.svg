<rect x="76.4" y="348.2" width="567.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Інтегрування = нахил −6 дБ/окт (ділення на ω): працює ВИЩЕ зламу, де C коротить.</tspan><tspan x="360.0" dy="15.6">Диференціювання = +6 дБ/окт (множення на ω): працює НИЖЧЕ зламу, де C ще тримає.</tspan></text>
