<rect x="90.0" y="402.0" width="600.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Перший десяток відсотків перезаливу прибирає більшість напруги — далі крива кладеться (зелена).</tspan><tspan x="390.0" dy="12.3">Опір тіла колектора rc додає СТАЛИЙ на даному струмі доданок rc·Ic — він і не дає Vce(sat) впасти в нуль,</tspan><tspan x="390.0" dy="12.3">і на великому Ic починає домінувати. Ось чому даташит дає Vce(sat) ЗАВЖДИ при конкретному Ic.</tspan></text>
