<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реактивний струм гріє провід так само, як активний</text>
<circle cx="70.0" cy="95.0" r="22.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2457d6" text-anchor="middle" font-weight="700">~</text>
<line x1="92.0" y1="95.0" x2="390.0" y2="95.0" stroke="#cf8b5e" stroke-width="9.0"/>
<line x1="92.0" y1="95.0" x2="390.0" y2="95.0" stroke="#cf8b5e" stroke-width="9.0"/>
<rect x="380.0" y="70.0" width="140.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">P = 2300 Вт</tspan><tspan x="450.0" dy="16.9">cos φ = 1.0</tspan></text>
<text x="240.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">I = 10 А (однаковий!)</text>
<text x="240.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">втрати в міді I²·R = 100·R</text>
<circle cx="70.0" cy="210.0" r="22.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="70.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2457d6" text-anchor="middle" font-weight="700">~</text>
<line x1="92.0" y1="210.0" x2="390.0" y2="210.0" stroke="#cf8b5e" stroke-width="9.0"/>
<line x1="92.0" y1="210.0" x2="390.0" y2="210.0" stroke="#cf8b5e" stroke-width="9.0"/>
<rect x="380.0" y="185.1" width="140.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">P = 1150 Вт</tspan><tspan x="450.0" dy="16.9">cos φ = 0.5</tspan></text>
<text x="240.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">I = 10 А (однаковий!)</text>
<text x="240.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">втрати в міді I²·R = 100·R</text>
<line x1="70.0" y1="152.0" x2="630.0" y2="152.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,5"/>
<rect x="87.1" y="249.6" width="525.9" height="48.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="350.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Та сама напруга 230 В, той самий струм 10 А, ті самі втрати в проводі —</tspan><tspan x="350.0" dy="16.2">але внизу корисної потужності вдвічі менше. За що ж гріється мідь?</tspan></text>
</svg>