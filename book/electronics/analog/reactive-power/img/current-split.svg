<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Активна й реактивна складові струму</text>
<line x1="126.0" y1="150.0" x2="346.0" y2="150.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="150.0" y1="330.0" x2="150.0" y2="120.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="350.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">U</text>
<line x1="150.0" y1="150.0" x2="264.9" y2="246.4" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="150.0" y1="150.0" x2="264.9" y2="150.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="264.9" y1="150.0" x2="264.9" y2="246.4" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="264.9" y1="150.0" x2="264.9" y2="246.4" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<path d="M 190.0 150.0 A 40 40 0 0 1 180.6 175.7" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="204.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">φ</text>
<text x="276.9" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">I</text>
<text x="207.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c6b35" text-anchor="middle" font-weight="700">I·cos φ</text>
<text x="272.9" y="202.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a2b22" text-anchor="start" font-weight="700">I·sin φ</text>
<rect x="380.0" y="60.0" width="250.0" height="44.0" rx="6" fill="#d7f0df" stroke="#27ae60" stroke-width="1.5"/>
<text x="394.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c6b35" text-anchor="start">I·cos φ — складова в фазі з U</text>
<text x="394.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c6b35" text-anchor="start">переносить активну потужність</text>
<rect x="380.0" y="120.0" width="250.0" height="44.0" rx="6" fill="#f7dcd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="394.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a2b22" text-anchor="start">I·sin φ — складова під 90°</text>
<text x="394.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a2b22" text-anchor="start">лише гойдає енергію туди-сюди</text>
<rect x="10.1" y="329.6" width="639.9" height="48.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="330.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Один струм I розкладається на дві складові: вздовж напруги U і впоперек неї.</tspan><tspan x="330.0" dy="16.2">Лише поздовжня (зелена) переносить активну потужність; поперечна (червона) — реактивна.</tspan></text>
