<text x="360.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vout = Vin</text>
<text x="360.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Та сама напруга — але вхід нічого не бере, а вихід усе віддає. Це й є розв'язка опорів.</text>
