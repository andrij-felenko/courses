<rect x="40.0" y="110.0" width="230.0" height="90.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="155.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВХІД</text>
