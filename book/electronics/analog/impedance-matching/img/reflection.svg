<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінець лінії: узгоджений поглинає, неузгоджений відбиває</text>
<text x="84.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">R_н ≠ Z₀  —  частина хвилі вертається відлунням</text>
<line x1="90.0" y1="130.0" x2="560.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="120.0" y1="116.0" x2="240.0" y2="116.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="180.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">пряма</text>
<line x1="530.0" y1="148.0" x2="410.0" y2="148.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="470.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">відбита (луна)</text>
<rect x="560.0" y="104.0" width="70.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="595.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">R_н</text>
<text x="595.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">≠ Z₀</text>
<text x="325.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Γ ≠ 0  →  фронт «дзвенить»</text>
<text x="84.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">R_н = Z₀  —  хвиля повністю поглинається, відлуння немає</text>
<line x1="90.0" y1="290.0" x2="560.0" y2="290.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="120.0" y1="276.0" x2="290.0" y2="276.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="205.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">пряма</text>
<rect x="560.0" y="264.0" width="70.0" height="52.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="595.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">R_н</text>
<text x="595.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">= Z₀</text>
<text x="390.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Γ = 0  →  лінія «прозора», VSWR = 1</text>
<rect x="131.1" y="376.0" width="457.8" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Γ = (R_н − Z₀) / (R_н + Z₀)   —   нуль рівно тоді, коли R_н = Z₀</tspan></text>
</svg>