<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один стик джерело → навантаження, три різні мети</text>
<text x="311.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">максимум потужності</text>
<rect x="60.0" y="84.0" width="92.0" height="52.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="106.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">джерело</text><text x="106.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_дж</text>
<line x1="152.0" y1="110.0" x2="466.0" y2="110.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="311.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">опори РІВНІ:  R_н = R_дж</text>
<rect x="470.0" y="84.0" width="150.0" height="52.0" rx="8" fill="#eef7f0" stroke="#c0392b" stroke-width="2.0"/><text x="545.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">навантаження</text><text x="545.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_н = R_дж</text>
<text x="311.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">немає відлуння в лінії</text>
<rect x="60.0" y="204.0" width="92.0" height="52.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="106.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">джерело</text><text x="106.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_дж</text>
<line x1="152.0" y1="230.0" x2="466.0" y2="230.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="311.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">опір = опору лінії:  R_н = Z₀</text>
<rect x="470.0" y="204.0" width="150.0" height="52.0" rx="8" fill="#eef7f0" stroke="#2457d6" stroke-width="2.0"/><text x="545.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">навантаження</text><text x="545.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_н = Z₀</text>
<text x="311.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ціла напруга сигналу</text>
<rect x="60.0" y="324.0" width="92.0" height="52.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="106.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">джерело</text><text x="106.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_дж</text>
<line x1="152.0" y1="350.0" x2="466.0" y2="350.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="311.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вхід ≫ виходу:  R_н ≫ R_дж</text>
<rect x="470.0" y="324.0" width="150.0" height="52.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="545.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">навантаження</text><text x="545.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_н ≫ R_дж</text>
<rect x="59.3" y="424.0" width="601.4" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">«Узгодити» не означає «зрівняти» — означає припасувати співвідношення опорів під мету</tspan></text>
</svg>