<rect x="52.5" y="374.2" width="615.1" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Робоча точка — там, де крива діода перетинає пряму навантаження. Рівняння нелінійне,</tspan><tspan x="360.0" dy="15.6">прямої формули немає: Ньютон стартує з здогадки й кількома кроками сходиться у перетин.</tspan></text>
