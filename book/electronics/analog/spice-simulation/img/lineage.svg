<rect x="72.2" y="416.2" width="635.6" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Один академічний код, відданий у суспільне надбання, породив цілу родину. Комерційні фірми</tspan><tspan x="390.0" dy="15.6">обгорнули те саме ядро зручностями й моделями — але «мова спайса» лишилася спільною.</tspan></text>
