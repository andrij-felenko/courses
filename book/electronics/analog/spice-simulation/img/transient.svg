<rect x="45.4" y="332.2" width="649.3" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Перехідний аналіз кроками йде в часі: на кожному кроці похідні (струм у C, напруга на L)</tspan><tspan x="370.0" dy="15.6">замінено різницею за крок Δt — і знову розв'язано схему. Крок сам стискається там, де круто.</tspan></text>
