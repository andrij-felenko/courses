<rect x="113.5" y="296.2" width="533.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Симулятор не «малює схему» — він перекладає її в систему рівнянь Кірхгофа</tspan><tspan x="380.0" dy="15.6">і чисельно її розв'язує. Нелінійні елементи змушують повторювати розв'язок.</tspan></text>
