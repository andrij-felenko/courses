<rect x="25.1" y="306.2" width="669.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Те саме ядро (рівняння Кірхгофа + Ньютон для нелінійностей) відповідає на чотири різні питання:</tspan><tspan x="360.0" dy="15.6">де схема стоїть у спокої, як реагує на повільну зміну входу, на частоту й на сигнал у часі.</tspan></text>
