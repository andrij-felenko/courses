<rect x="351.8" y="95.8" width="236.3" height="76.4" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="115.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">та сама крива, три імені:</tspan><tspan x="470.0" dy="15.0">•  ×2 за T = 2 роки</tspan><tspan x="470.0" dy="15.0">•  e^(rt),  r = ln2/T ≈ 34.7%/рік</tspan><tspan x="470.0" dy="15.0">•  +CAGR щороку, √2−1 ≈ 41.4%</tspan></text>
<rect x="96.9" y="420.2" width="526.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="440.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">41%, а не «половина від подвоєння»: два роки дають ×2, отже один рік — √2.</tspan><tspan x="360.0" dy="15.6">Множники діляться навпіл коренем, а не навпіл арифметично.</tspan></text>
