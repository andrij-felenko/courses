<rect x="35.4" y="434.4" width="649.3" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Площа під обома килимами однакова — це та сама повна потужність q²/12 (квантувач той самий).</tspan><tspan x="360.0" dy="15.6">Швидша вибірка розтягує її по ширшій смузі Найквіста: килим падає. Корисна смуга B (зелена)</tspan><tspan x="360.0" dy="15.6">однакова, тож унизу під нею вчетверо менше шуму — удвічі менший RMS = +6 дБ = +1 розряд.</tspan></text>
