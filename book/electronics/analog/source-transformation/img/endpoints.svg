<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="680" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому рівноцінні: обидва вигляди дають те саме на обох кінцях</text>
<rect x="40.0" y="70.0" width="290.0" height="200.0" rx="10" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.4"/>
<text x="185.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Холостий хід  (R_load = ∞)</text>
<text x="185.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">навантаження від’єднано — струму немає</text>
<rect x="50.4" y="145.2" width="139.1" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="120.0" dy="0.0">V-форма:</tspan><tspan x="120.0" dy="14.3">на R нема падіння →</tspan><tspan x="120.0" dy="14.3">U = V</tspan></text>
<rect x="174.2" y="145.2" width="151.7" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="250.0" dy="0.0">I-форма:</tspan><tspan x="250.0" dy="14.3">весь I тече крізь R →</tspan><tspan x="250.0" dy="14.3">U = I·R</tspan></text>
<rect x="45.4" y="229.5" width="279.2" height="31.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="248.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">V = I·R  →  напруга на клемах однакова</tspan></text>
<rect x="350.0" y="70.0" width="290.0" height="200.0" rx="10" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.4"/>
<text x="495.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коротке замикання  (R_load = 0)</text>
<text x="495.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">клеми з’єднані напряму — напруги немає</text>
<rect x="376.1" y="145.2" width="107.8" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="430.0" dy="0.0">V-форма:</tspan><tspan x="430.0" dy="14.3">увесь V на R →</tspan><tspan x="430.0" dy="14.3">I_sc = V / R</tspan></text>
<rect x="506.1" y="145.2" width="107.8" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="560.0" dy="0.0">I-форма:</tspan><tspan x="560.0" dy="14.3">R закорочено →</tspan><tspan x="560.0" dy="14.3">I_sc = I</tspan></text>
<rect x="352.0" y="229.5" width="286.0" height="31.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="248.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">I = V / R  →  струм короткого однаковий</tspan></text>
<text x="340.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дві крайні точки збігаються — а між ними обидва вигляди лінійні, тож збігаються скрізь</text>
</svg>