<rect x="490.9" y="76.2" width="258.3" height="59.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Додатна верхівка:</tspan><tspan x="620.0" dy="14.3">лінія → верхній діод (Vf) → шина → TVS</tspan><tspan x="620.0" dy="14.3">Uфікс ≈ Uшина + Vf + спад TVS</tspan></text>
<rect x="17.7" y="372.2" width="724.5" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">На лінію дивляться лише два маленькі діоди-стрілочники — їхня ємність мала, швидкий сигнал не валиться.</tspan><tspan x="380.0" dy="15.6">Громіздкий TVS, що тримає всю енергію, сидить осторонь на шині, не навантажуючи лінію своєю ємністю.</tspan></text>
