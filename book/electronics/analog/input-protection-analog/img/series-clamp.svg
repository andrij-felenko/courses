<text x="314.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">V+ = +15 В</text>
<line x1="360.0" y1="200.0" x2="360.0" y2="106.0" stroke="#1a1a1a" stroke-width="2.0"/>
