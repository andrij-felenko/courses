<text x="498.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">вузол ≈ 15.6 В — у безпеці</text>
<rect x="494.2" y="118.4" width="211.5" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">30 − 15.6 = 14.4 В на Rпосл</tspan><tspan x="600.0" dy="15.6">I = 14.4 / 10 000 ≈ 1.45 мА</tspan><tspan x="600.0" dy="15.6">1.45 мА &lt; 10 мА → діод цілий</tspan></text>
<rect x="86.7" y="308.2" width="546.7" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Резистор приймає всю різницю напруг на себе, а діодові лишає крихітний струм.</tspan><tspan x="360.0" dy="15.6">Без резистора діод спробував би провести десятки ампер і згорів би першим.</tspan></text>
