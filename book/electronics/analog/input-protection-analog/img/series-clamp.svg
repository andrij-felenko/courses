<line x1="360.0" y1="106.0" x2="360.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="376.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Iфікс ≈ 1.45 мА</text>
<text x="376.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(діод тримає вузол ≈ 15.6 В)</text>
<line x1="360.0" y1="200.0" x2="470.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
