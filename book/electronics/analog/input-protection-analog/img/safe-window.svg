<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="680" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Абсолютна межа входу: безпечне вікно між шинами живлення</text>
<line x1="250.0" y1="360.0" x2="250.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="250.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">напруга на вході</text>
<rect x="180.0" y="151.2" width="140.0" height="127.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="250.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">безпечне вікно</text>
<text x="250.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">обидва діоди закриті</text>
<line x1="160.0" y1="151.2" x2="340.0" y2="151.2" stroke="#c0392b" stroke-width="2.4"/>
<text x="154.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">V+</text>
<line x1="160.0" y1="278.8" x2="340.0" y2="278.8" stroke="#2457d6" stroke-width="2.4"/>
<text x="154.0" y="283.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">V−</text>
<line x1="180.0" y1="128.0" x2="320.0" y2="128.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="346.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">V+ + 0.6 В — верхній діод відкривається</text>
<line x1="180.0" y1="302.0" x2="320.0" y2="302.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="346.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">V− − 0.6 В — нижній діод відкривається</text>
<rect x="180.0" y="70.0" width="140.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="250.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">діод тече у V+</text>
<rect x="180.0" y="302.0" width="140.0" height="58.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.2"/>
<text x="250.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">діод тече з V−</text>
<rect x="70.1" y="372.2" width="539.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Поки сигнал у вікні V− … V+, вхід нічого не «бачить» — обидва діоди закриті.</tspan><tspan x="340.0" dy="15.6">Лише за ~0.6 В поза шиною найближчий діод відкривається й починає текти.</tspan></text>
</svg>