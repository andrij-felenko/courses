<rect x="14.4" y="309.4" width="791.2" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="328.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Оцифровувач вгадує число розряд за розрядом: компаратор зважує вхід проти пробної напруги, а ту пробну</tspan><tspan x="410.0" dy="14.3">напругу виробляє ЦАП із поточного здогаду. Тому перші резисторні ЦАП народилися саме тут — як вузол усередині оцифровувача.</tspan></text>
