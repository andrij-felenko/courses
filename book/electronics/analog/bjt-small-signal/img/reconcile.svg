<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна формула — два знайомі випадки</text>
<rect x="147.9" y="52.5" width="364.1" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="330.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">повна формула:  Av = − Rc / (re + Re)</tspan></text>
<line x1="330.0" y1="87.5" x2="330.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="94.8" y="156.2" width="170.5" height="47.6" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="180.0" dy="0.0">Re ≫ re</tspan><tspan x="180.0" dy="15.6">(є емітерний резистор)</tspan></text>
<rect x="411.9" y="156.2" width="136.3" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="480.0" dy="0.0">Re = 0</tspan><tspan x="480.0" dy="15.6">(емітер на землі)</tspan></text>
<line x1="300.0" y1="150.0" x2="180.0" y2="152.2" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="150.0" x2="480.0" y2="152.2" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="93.4" y="260.1" width="173.1" height="49.9" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Av ≈ − Rc / Re</tspan><tspan x="180.0" dy="16.9">(задають резистори)</tspan></text>
<rect x="380.7" y="261.2" width="198.6" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Av = − gm·Rc = − Rc / re</tspan><tspan x="480.0" dy="15.6">(задає робочий струм)</tspan></text>
<line x1="180.0" y1="203.8" x2="180.0" y2="256.1" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="480.0" y1="203.8" x2="480.0" y2="257.2" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>