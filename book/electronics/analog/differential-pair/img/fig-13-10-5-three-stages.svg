<text x="370.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«Ідеальний ОП» з §2.8.1 — це і є ці три каскади: вхід нічого не вантажить, середина шалено підсилює, вихід тягне струм.</text>
