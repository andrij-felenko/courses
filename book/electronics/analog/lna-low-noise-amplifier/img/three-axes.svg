<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вимоги до LNA, що тиснуть одна на одну</text>
<line x1="350.0" y1="85.0" x2="462.6" y2="280.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="462.6" y1="280.0" x2="237.4" y2="280.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="237.4" y1="280.0" x2="350.0" y2="85.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 4"/>
<circle cx="350.0" cy="85.0" r="8.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="350.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">малий ШУМ</text>
<text x="350.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тиша на вході</text>
<circle cx="462.6" cy="280.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="485.1" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">достатнє</text>
<text x="485.1" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПІДСИЛЕННЯ</text>
<text x="485.1" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">щоб утопити шум решти</text>
<circle cx="237.4" cy="280.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="214.9" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЛІНІЙНІСТЬ</text>
<text x="214.9" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">не зім'яти сильні сусідні канали</text>
<text x="350.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">компроміс</text>
<text x="350.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">LNA</text>
<text x="350.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усі три тягнуть транзистор і струм у різні боки</text>
<rect x="63.0" y="368.2" width="574.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">LNA не оптимізують за однією величиною. Найнижчий шум, достатнє підсилення</tspan><tspan x="350.0" dy="15.6">й лінійність борються за той самий транзистор і струм — проєкт LNA є компромісом.</tspan></text>
</svg>