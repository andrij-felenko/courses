<rect x="84.7" y="309.4" width="590.6" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="328.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Уся хитрість HEMT: донори, що віддають електрони, винесені в ОКРЕМИЙ шар, осторонь каналу.</tspan><tspan x="380.0" dy="14.3">Електрони течуть у чистому шарі, не натикаючись на заряджені домішки, — тому шумлять менше.</tspan></text>
