<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому небезпечний саме 3-й порядок: він сідає в корисну смугу</text>
<line x1="70.0" y1="150.0" x2="690.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="690.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">частота</text>
<text x="62.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">рівень</text>
<line x1="70.0" y1="150.0" x2="70.0" y2="54.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="70.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Вхід: два сильні сусідні канали</text>
<line x1="316.2" y1="150.0" x2="316.2" y2="64.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="316.2" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">f₁</text>
<line x1="385.0" y1="150.0" x2="385.0" y2="64.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="385.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">f₂</text>
<line x1="70.0" y1="380.0" x2="690.0" y2="380.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="690.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">частота</text>
<text x="62.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">рівень</text>
<line x1="70.0" y1="380.0" x2="70.0" y2="284.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="70.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Вихід нелінійного LNA: де сідають нові складові</text>
<rect x="220.0" y="280.0" width="261.2" height="100.0" fill="#eafaf0" opacity="0.55"/>
<text x="350.6" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">смуга приймача (за нею фільтр)</text>
<line x1="316.2" y1="380.0" x2="316.2" y2="294.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="316.2" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">f₁</text>
<line x1="385.0" y1="380.0" x2="385.0" y2="294.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="385.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">f₂</text>
<line x1="247.5" y1="380.0" x2="247.5" y2="328.0" stroke="#2457d6" stroke-width="3.0" stroke-dasharray="4 3"/>
<text x="247.5" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2f₁−f₂</text>
<line x1="453.8" y1="380.0" x2="453.8" y2="328.0" stroke="#2457d6" stroke-width="3.0" stroke-dasharray="4 3"/>
<text x="453.8" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2f₂−f₁</text>
<text x="140.9" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">f₂−f₁ →</text>
<text x="140.9" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(геть зліва)</text>
<text x="611.9" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">← 2f, f₁+f₂</text>
<text x="611.9" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(геть справа)</text>
<text x="350.6" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">складові 3-го порядку — у смузі, фільтр їх НЕ відсіє</text>
<rect x="69.0" y="422.2" width="621.9" height="47.6" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="442.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2-й порядок (2f, f₁±f₂) лягає вдвічі вище або в самий низ — далеко, фільтр його прибере.</tspan><tspan x="380.0" dy="15.6">3-й порядок 2f₁−f₂ і 2f₂−f₁ сідає впритул до f₁,f₂ — у смузі, де фільтр безсилий.</tspan></text>
</svg>