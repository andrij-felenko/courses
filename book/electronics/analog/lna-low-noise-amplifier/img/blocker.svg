<rect x="69.8" y="308.2" width="560.4" height="47.6" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Антена приносить кволий корисний сигнал ВОДНОЧАС із могутнім сусіднім каналом.</tspan><tspan x="350.0" dy="15.6">Якщо сильний загне LNA в нелінійність, він породить завади просто на корисному.</tspan></text>
