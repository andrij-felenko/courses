<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий двополюсник — два описи</text>
<rect x="305.0" y="110.0" width="110.0" height="60.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="360.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">двополюсник</text>
<line x1="305.0" y1="140.0" x2="275.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="415.0" y1="140.0" x2="445.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="275.0" cy="140.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="445.0" cy="140.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="65.0" y="91.0" width="170.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="116.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Z = R + jX</tspan></text>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">важкість (Ом)</text>
<text x="150.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">R — активний опір</text>
<text x="150.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">X — реактивність</text>
<rect x="485.0" y="91.0" width="170.0" height="38.0" rx="6" fill="#eef5ee" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="116.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Y = G + jB</tspan></text>
<text x="570.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">легкість (См)</text>
<text x="570.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">G — провідність</text>
<text x="570.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">B — сприйнятливість</text>
<line x1="250.0" y1="105.0" x2="299.0" y2="125.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="105.0" x2="421.0" y2="125.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Y = 1/Z — обертають ЦІЛЕ число, а не R і X окремо</text>
</svg>