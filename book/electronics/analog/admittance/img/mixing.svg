<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому R і X не можна обертати окремо</text>
<text x="95.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Маємо</text>
<rect x="60.0" y="75.0" width="70.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="95.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">R</tspan></text>
<rect x="60.0" y="145.0" width="70.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="95.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">X</tspan></text>
<rect x="250.0" y="70.0" width="220.0" height="120.0" rx="10" fill="#eef5ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">множимо на спряжене R − jX</text>
<text x="360.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">D = R² + X²</text>
<text x="360.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(сюди входять ОБА: і R, і X)</text>
<line x1="133.0" y1="95.0" x2="248.0" y2="110.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="133.0" y1="165.0" x2="248.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="77.0" width="150.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="100.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">G = R / D</tspan></text>
<rect x="545.0" y="147.0" width="150.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">B = −X / D</tspan></text>
<line x1="472.0" y1="110.0" x2="545.0" y2="95.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="472.0" y1="150.0" x2="545.0" y2="165.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="60.0" y1="230.0" x2="660.0" y2="230.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="360.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знаменник D спільний — тому в кожній частині Y «сидить» і R, і X.</text>
<rect x="160.0" y="287.5" width="140.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="298.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">G ≠ 1/R</tspan></text>
<rect x="420.0" y="287.5" width="140.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="298.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">B ≠ 1/X</tspan></text>
<text x="360.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">правда лише в чистих крайніх випадках</text>
</svg>