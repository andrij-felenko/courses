<rect x="67.9" y="277.4" width="584.3" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Весь внутрішній шум підсилювача винесено у два вхідні джерела: напругу en (послідовно)</tspan><tspan x="360.0" dy="14.3">і струм in (паралельно). Сам двопорт — тихий. Сумарний шумовий струм на вході: in + Ys·en.</tspan></text>
<rect x="52.2" y="332.5" width="615.6" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="351.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">F = 1 + ⟨|in + Ys·en|²⟩ / ⟨|is|²⟩  — у скільки разів повний вхідний шум більший за шум джерела.</tspan></text>
