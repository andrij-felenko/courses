<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ті самі дроти, той самий R_x — різниця в десятки відсотків</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">R_x = 0.10 Ω, кожен дріт 0.20 Ω, струм 1 А; що бачить кожен метод</text>
<text x="90.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">метод</text>
<text x="340.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">що міряє</text>
<text x="540.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">показ</text>
<text x="720.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">похибка</text>
<rect x="70.0" y="120.0" width="740.0" height="56.0" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1.3"/>
<text x="90.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2 проводи</text>
<text x="340.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">R_дрт + R_x + R_дрт</text>
<text x="540.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">0.50 Ω</text>
<text x="720.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+400 %</text>
<rect x="70.0" y="186.0" width="740.0" height="56.0" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1.3"/>
<text x="90.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">4 проводи</text>
<text x="340.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">лише R_x</text>
<text x="540.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">0.10 Ω</text>
<text x="720.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">≈ 0 %</text>
<rect x="120.0" y="268.0" width="620.0" height="66.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Двопровідний показ 0.50 Ω — це на 80 % дроти, лише на 20 % сам R_x: вимір неприданий.</tspan><tspan x="430.0" dy="14.3">Чотирипровідний бачить рівно 0.10 Ω, бо струм у чутливих проводах майже нульовий,</tspan><tspan x="430.0" dy="14.3">тож їхній І·R_дрт зникає. Що менший R_x, то більший виграш.</tspan></text>
</svg>