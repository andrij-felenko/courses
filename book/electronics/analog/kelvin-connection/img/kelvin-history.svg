<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кельвінове ім'я: ідея, реалізація, назва — три різні речі</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ім'я вшановує не першість в ідеї, а прилад, що зробив ідею практичною</text>
<rect x="30.0" y="90.0" width="250.0" height="230.0" rx="8" fill="#f4f4f4" stroke="#777777" stroke-width="2.0"/>
<text x="155.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#777777" text-anchor="middle" font-weight="700">ІДЕЯ</text>
<line x1="44.0" y1="126.0" x2="266.0" y2="126.0" stroke="#777777" stroke-width="1.4"/>
<text x="155.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Розвести струм</tspan><tspan x="155.0" dy="14.1">і вимір по різних</tspan><tspan x="155.0" dy="14.1">проводах.</tspan><tspan x="155.0" dy="14.1"></tspan><tspan x="155.0" dy="14.1">Випливає з закону</tspan><tspan x="155.0" dy="14.1">Ома — НІЧИЯ,</tspan><tspan x="155.0" dy="14.1">до неї міг дійти</tspan><tspan x="155.0" dy="14.1">будь-хто.</tspan></text>
<rect x="325.0" y="90.0" width="250.0" height="230.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">РЕАЛІЗАЦІЯ</text>
<line x1="339.0" y1="126.0" x2="561.0" y2="126.0" stroke="#27ae60" stroke-width="1.4"/>
<text x="450.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Подвійний міст</tspan><tspan x="450.0" dy="14.1">(~1861), праця</tspan><tspan x="450.0" dy="14.1">1862 р.</tspan><tspan x="450.0" dy="14.1"></tspan><tspan x="450.0" dy="14.1">Робочий прилад для</tspan><tspan x="450.0" dy="14.1">опорів від мкОм</tspan><tspan x="450.0" dy="14.1">до десятків ом.</tspan><tspan x="450.0" dy="14.1">СПРАВЖНЯ заслуга.</tspan></text>
<rect x="620.0" y="90.0" width="250.0" height="230.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="745.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">НАЗВА</text>
<line x1="634.0" y1="126.0" x2="856.0" y2="126.0" stroke="#2457d6" stroke-width="1.4"/>
<text x="745.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">«Кельвінове»</tspan><tspan x="745.0" dy="14.1">під'єднання,</tspan><tspan x="745.0" dy="14.1">контакт, кліпс.</tspan><tspan x="745.0" dy="14.1"></tspan><tspan x="745.0" dy="14.1">Ім'я мосту</tspan><tspan x="745.0" dy="14.1">розповзлося на</tspan><tspan x="745.0" dy="14.1">ВЕСЬ чотирививідний</tspan><tspan x="745.0" dy="14.1">спосіб.</tspan></text>
<line x1="284.0" y1="205.0" x2="321.0" y2="205.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="579.0" y1="205.0" x2="616.0" y2="205.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="302.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">втілив у</text>
<text x="597.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">дала ім'я</text>
<line x1="120.0" y1="372.0" x2="780.0" y2="372.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="120.0" cy="372.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="120.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1824</text>
<text x="120.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="120.0" dy="0.0">народився</tspan><tspan x="120.0" dy="10.8">у Белфасті</tspan></text>
<circle cx="300.0" cy="372.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="300.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1846</text>
<text x="300.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="300.0" dy="0.0">професор</tspan><tspan x="300.0" dy="10.8">у Глазго (22 р.)</tspan></text>
<circle cx="470.0" cy="372.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="470.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1858</text>
<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">дзеркальний</tspan><tspan x="470.0" dy="10.8">гальванометр</tspan></text>
<circle cx="610.0" cy="372.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="610.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">~1861</text>
<text x="610.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">подвійний</tspan><tspan x="610.0" dy="10.8">міст Кельвіна</tspan></text>
<circle cx="780.0" cy="372.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="780.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1866/92</text>
<text x="780.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="780.0" dy="0.0">лицар, тоді</tspan><tspan x="780.0" dy="10.8">барон Кельвін</tspan></text>
</svg>