<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
<rect width="720" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підсилення задають резистори, а не примхливе β</text>
<rect x="60.0" y="70.0" width="300.0" height="80.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.6"/>
<text x="210.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">A  ≈  − Rc / Re</text>
<text x="210.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">наприклад  −10 кОм / 1 кОм = −10</text>
<text x="210.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Re дає від'ємний зворотний зв'язок:</text>
<text x="210.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">трохи менше підсилення — зате стабільне</text>
<line x1="120.0" y1="226.0" x2="300.0" y2="226.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="210.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">вихід коригує сам себе</text>
<text x="560.0" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">β гуляє в рази…</text>
<rect x="430.0" y="190.0" width="40.0" height="60.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="450.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">β=100</text>
<rect x="494.0" y="130.0" width="40.0" height="120.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="514.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">β=300</text>
<rect x="558.0" y="75.0" width="40.0" height="175.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="578.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">β=600</text>
<line x1="420.0" y1="160.0" x2="630.0" y2="160.0" stroke="#1f8a3b" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>
<text x="635.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">A</text>
<text x="560.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">…а підсилення A — майже ні</text>
<text x="360.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">П'ятиразовий розкид β майже не зачіпає A — його тримають зовнішні резистори. Передбачуваність важливіша.</text>
</svg>
