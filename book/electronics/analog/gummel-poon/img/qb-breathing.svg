<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нормований заряд бази q_b дихає з двох боків</text><rect x="280.0" y="172.0" width="320.0" height="116.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="440.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">q_b = (q₁ / 2)·(1 + √(1 + 4·q₂))</tspan><tspan x="440.0" dy="14.3"></tspan><tspan x="440.0" dy="14.3">струм ділимо на q_b:</tspan><tspan x="440.0" dy="14.3">I_К = (I_S / q_b)·(e^(V_BE/Vₜ) − e^(V_BC/Vₜ))</tspan></text><rect x="30.0" y="150.0" width="185.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="122.5" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="122.5" dy="0.0">q₁ — ефект Ерлі</tspan><tspan x="122.5" dy="16.9">колектор з'їдає базу</tspan></text><rect x="58.0" y="246.0" width="52.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/><rect x="110.0" y="246.0" width="42.0" height="40.0" rx="6" fill="#fdf0e3" stroke="#333333" stroke-width="1.0"/><rect x="152.0" y="246.0" width="52.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/><line x1="168.0" y1="266.0" x2="150.0" y2="266.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="131.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">база вужча → q_b↓</text><text x="131.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">→ струм росте</text><line x1="217.0" y1="200.0" x2="276.0" y2="210.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="665.0" y="150.0" width="185.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="757.5" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="757.5" dy="0.0">q₂ — інжекція</tspan><tspan x="757.5" dy="16.9">заряд накопичується</tspan></text><rect x="668.0" y="246.0" width="52.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/><rect x="720.0" y="246.0" width="58.0" height="40.0" rx="6" fill="#f6c9c0" stroke="#333333" stroke-width="1.0"/><rect x="778.0" y="246.0" width="42.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/><circle cx="728.0" cy="266.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><circle cx="740.0" cy="266.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><circle cx="752.0" cy="266.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><circle cx="764.0" cy="266.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="744.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">база «важча» → q_b↑</text><text x="744.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">→ β падає</text><line x1="663.0" y1="200.0" x2="604.0" y2="210.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="440.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">q_b = 1  →  модель точно зводиться до Еберса — Молла</text>
</svg>