<rect x="150.0" y="372.0" width="420.0" height="34.0" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Vрізн = V₊ − V₋        Vсинф = (V₊ + V₋) / 2</tspan></text>
