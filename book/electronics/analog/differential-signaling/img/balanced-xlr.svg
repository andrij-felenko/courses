<line x1="142.0" y1="110.0" x2="300.0" y2="110.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="142.0" y1="175.0" x2="300.0" y2="175.0" stroke="#2457d6" stroke-width="2.4"/>
