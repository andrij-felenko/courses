<text x="590.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">balanced — про ІМПЕДАНС</text>
<line x1="505.0" y1="110.0" x2="665.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.4"/>
