<rect x="95.0" y="250.0" width="610.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">наводка гасне ⟺ плеча ЗБАЛАНСОВАНІ (рівний Z); дзеркальний привод лише додає розмах</tspan></text>
<text x="400.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">XLR (студійний звук): 1 — екран · 2 — hot (+) · 3 — cold (−)</text>
