<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Супер-чарунка у три кроки</text>
<rect x="25.0" y="70.0" width="210.0" height="150.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="51.0" cy="96.0" r="15.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="51.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="144.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Упізнати</text>
<text x="130.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">джерело струму J</tspan><tspan x="130.0" dy="15.6">на гілці, спільній</tspan><tspan x="130.0" dy="15.6">для двох вікон</tspan></text>
<line x1="240.0" y1="145.0" x2="260.0" y2="145.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="265.0" y="70.0" width="210.0" height="150.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<circle cx="291.0" cy="96.0" r="15.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="291.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="384.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Обійти по периметру</text>
<text x="370.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">один закон напруг</tspan><tspan x="370.0" dy="15.6">по зовнішньому кільцю —</tspan><tspan x="370.0" dy="15.6">обхід минає джерело</tspan></text>
<line x1="480.0" y1="145.0" x2="500.0" y2="145.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="505.0" y="70.0" width="210.0" height="150.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<circle cx="531.0" cy="96.0" r="15.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="531.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="624.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Додати обмеження</text>
<text x="610.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">рівняння джерела</tspan><tspan x="610.0" dy="15.6">I₁ − I₂ = J</tspan><tspan x="610.0" dy="15.6">(знак за напрямком)</tspan></text>
<text x="370.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дві невідомі (I₁, I₂) — два рівняння: закон напруг супер-чарунки + обмеження джерела</text>
</svg>