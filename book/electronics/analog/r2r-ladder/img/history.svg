<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як складалися ланки R-2R: від ідеї до робочої машини</text>
<line x1="60.0" y1="150.0" x2="700.0" y2="150.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="670.0" y1="150.0" x2="700.0" y2="150.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="140.0" cy="150.0" r="5.0" fill="#1a1a1a"/>
<text x="140.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">1937</text>
<line x1="140.0" y1="150.0" x2="140.0" y2="110.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="140.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">PCM</text>
<text x="140.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">ідея кодувати</tspan><tspan x="140.0" dy="12.3">голос числами</tspan><tspan x="140.0" dy="12.3">(Алек Рівз)</tspan></text>
<circle cx="310.0" cy="150.0" r="5.0" fill="#1a1a1a"/>
<text x="310.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1953</text>
<line x1="310.0" y1="150.0" x2="310.0" y2="194.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="310.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">мережа</text>
<text x="310.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">опис і перевага</tspan><tspan x="310.0" dy="12.3">драбинної R-2R</tspan><tspan x="310.0" dy="12.3">(Б. Д. Сміт)</tspan></text>
<circle cx="480.0" cy="150.0" r="5.0" fill="#1a1a1a"/>
<text x="480.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1954</text>
<line x1="480.0" y1="150.0" x2="480.0" y2="110.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="480.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Datrac</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">перша робоча</tspan><tspan x="480.0" dy="12.3">струмова R/2R,</tspan><tspan x="480.0" dy="12.3">оцифрував звук</tspan><tspan x="480.0" dy="12.3">(EPSCO)</tspan></text>
<circle cx="650.0" cy="150.0" r="5.0" fill="#1a1a1a"/>
<text x="650.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1955→63</text>
<line x1="650.0" y1="150.0" x2="650.0" y2="194.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="650.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">патент</text>
<text x="650.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">пристрій із R/2R</tspan><tspan x="650.0" dy="12.3">приоритет 1955,</tspan><tspan x="650.0" dy="12.3">видано 1963</tspan><tspan x="650.0" dy="12.3">(Гордон,</tspan><tspan x="650.0" dy="12.3">Таламбірас)</tspan></text>
<rect x="40.0" y="300.0" width="680.0" height="46.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Чотири різні внески, не один винахід: ідея (PCM), обґрунтування переваги драбини для двійкового декодування (Сміт), перша робоча струмова R/2R у серійному АЦП (Datrac), формальний пристрій у патенті. Жодна ланка не «винайшла R-2R сама-одна».</tspan></text>
</svg>