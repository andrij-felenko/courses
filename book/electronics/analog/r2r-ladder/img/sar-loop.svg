зберігання</tspan><tspan x="75.0" dy="14.4">(S/H)</tspan></text>
<line x1="120.0" y1="153.0" x2="175.0" y2="153.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
