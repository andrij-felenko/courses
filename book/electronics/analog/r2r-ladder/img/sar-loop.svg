<path d="M175.0 124.0 L175.0 182.0 L239.0 153.0 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="197.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">⊳</text>
<text x="205.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">компаратор</text>
<text x="205.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">більше/менше?</text>
<line x1="239.0" y1="153.0" x2="470.0" y2="153.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="120.0" width="120.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">регістр SAR</tspan><tspan x="530.0" dy="14.4">уточнює 1 біт</tspan><tspan x="530.0" dy="14.4">за крок</tspan></text>
<line x1="590.0" y1="153.0" x2="660.0" y2="153.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">код</text>
<text x="700.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">11 біт</text>
<rect x="430.0" y="244.0" width="200.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="530.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">внутрішній ЦАП на драбині R/2R</tspan><tspan x="530.0" dy="14.4">пробний код → пробна напруга</tspan></text>
<line x1="530.0" y1="186.0" x2="530.0" y2="244.0" stroke="#1a1a1a" stroke-width="1.8"/>
