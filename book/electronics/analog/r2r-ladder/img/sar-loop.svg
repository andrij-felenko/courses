<text x="545.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">пробний код</text>
<line x1="430.0" y1="270.0" x2="207.0" y2="270.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="207.0" y1="270.0" x2="207.0" y2="182.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="207.0" y1="190.0" x2="207.0" y2="182.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">пробна напруга Vпр (важки на терезах)</text>
<rect x="40.0" y="312.0" width="660.0" height="60.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="370.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Vвх порівнюють із пробною Vпр, яку ЦАП на драбині R/2R будує з пробного коду. Компаратор каже</tspan><tspan x="370.0" dy="14.3">«більше/менше», регістр уточнює один біт за крок (старший → молодший), 11 кроків — і код готовий.</tspan><tspan x="370.0" dy="14.3">Той внутрішній R/2R-ЦАП — і є наша лесенка, уперше в робочій машині.</tspan></text>
</svg>