<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекурсія опору: інваріант R відтворює сам себе щаблем за щаблем</text>
<text x="120.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">вузол k: видно R</text>
<circle cx="120.0" cy="120.0" r="3.2" fill="#1a1a1a"/>
<path d="M120.0 120.0 L127.0 130.0 L113.0 140.0 L127.0 150.0 L113.0 160.0 L127.0 170.0 L113.0 180.0 L120.0 190.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="105.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">R</text>
<line x1="120.0" y1="190.0" x2="120.0" y2="196.0" stroke="#1a1a1a" stroke-width="1.6"/><line x1="110.0" y1="196.0" x2="130.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="114.0" y1="200.0" x2="126.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8"/><line x1="118.0" y1="204.0" x2="122.0" y2="204.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="120.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="120.0" dy="0.0">уся внутрішня частина</tspan><tspan x="120.0" dy="13.0">з бітами на землі = R</tspan></text>
<line x1="186.0" y1="120.0" x2="250.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">+ горизонтальний R = 2R</text>
<path d="M260.0 120.0 L272.9 113.0 L285.7 127.0 L298.6 113.0 L311.4 127.0 L324.3 113.0 L337.1 127.0 L350.0 120.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="305.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<circle cx="350.0" cy="120.0" r="3.2" fill="#1a1a1a"/>
<rect x="299.7" y="173.5" width="100.6" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">R + R = 2R</tspan></text>
<line x1="410.0" y1="120.0" x2="474.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="550.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">вузол k+1: 2R ∥ 2R = R</text>
<circle cx="550.0" cy="120.0" r="3.2" fill="#1a1a1a"/>
<path d="M550.0 120.0 L557.0 130.0 L543.0 140.0 L557.0 150.0 L543.0 160.0 L557.0 170.0 L543.0 180.0 L550.0 190.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="565.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2R</text>
<line x1="550.0" y1="190.0" x2="550.0" y2="196.0" stroke="#1a1a1a" stroke-width="1.6"/><line x1="540.0" y1="196.0" x2="560.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="544.0" y1="200.0" x2="556.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8"/><line x1="548.0" y1="204.0" x2="552.0" y2="204.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="514.0" y1="120.0" x2="550.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="514.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">2R</text>
<rect x="498.0" y="216.0" width="130.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="563.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="563.0" dy="0.0">знову рівно R</tspan></text>
<rect x="40.0" y="300.0" width="640.0" height="46.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="325.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Гіпотеза: з вузла k углиб драбини видно R. Через горизонтальний R це стає 2R, а у вузлі k+1 паралель із вертикальним 2R знову дає рівно R. Інваріант відтворює себе, тож із будь-якого вузла видно R, а вихідний опір лесенки дорівнює R незалежно від коду.</tspan></text>
</svg>