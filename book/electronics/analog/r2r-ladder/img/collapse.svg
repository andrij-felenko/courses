<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому опір лесенки завжди R: 2R ∥ 2R = R, і так щабель за щаблем</text>
<text x="135.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">крок 1: кінець лесенки</text>
<circle cx="135.0" cy="110.0" r="3.2" fill="#1a1a1a"/>
<path d="M105.0 110.0 L112.0 118.3 L98.0 126.6 L112.0 134.9 L98.0 143.1 L112.0 151.4 L98.0 159.7 L105.0 168.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="90.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">2R</text><line x1="105.0" y1="168.0" x2="105.0" y2="174.0" stroke="#1a1a1a" stroke-width="1.6"/><line x1="95.0" y1="174.0" x2="115.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="99.0" y1="178.0" x2="111.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.8"/><line x1="103.0" y1="182.0" x2="107.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.6"/>
<path d="M165.0 110.0 L172.0 118.3 L158.0 126.6 L172.0 134.9 L158.0 143.1 L172.0 151.4 L158.0 159.7 L165.0 168.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="180.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2R</text><line x1="165.0" y1="168.0" x2="165.0" y2="174.0" stroke="#1a1a1a" stroke-width="1.6"/><line x1="155.0" y1="174.0" x2="175.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="159.0" y1="178.0" x2="171.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.8"/><line x1="163.0" y1="182.0" x2="167.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="105.0" y1="110.0" x2="165.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="80.7" y="223.5" width="108.7" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="135.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">2R ∥ 2R = R</tspan></text>
<text x="135.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="135.0" dy="0.0">кінцевий щабель і сусідній</tspan><tspan x="135.0" dy="13.0">2R стоять паралельно</tspan></text>
<line x1="228.0" y1="150.0" x2="268.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">крок 2: наступний вузол</text>
<circle cx="430.0" cy="110.0" r="3.2" fill="#1a1a1a"/>
<path d="M340.0 110.0 L352.9 103.0 L365.7 117.0 L378.6 103.0 L391.4 117.0 L404.3 103.0 L417.1 117.0 L430.0 110.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="385.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<line x1="340.0" y1="110.0" x2="340.0" y2="124.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="340.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="340.0" dy="0.0">сюди вже</tspan><tspan x="340.0" dy="11.7">згорнуто R</tspan></text>
<path d="M430.0 110.0 L437.0 118.3 L423.0 126.6 L437.0 134.9 L423.0 143.1 L437.0 151.4 L423.0 159.7 L430.0 168.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="445.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2R</text><line x1="430.0" y1="168.0" x2="430.0" y2="174.0" stroke="#1a1a1a" stroke-width="1.6"/><line x1="420.0" y1="174.0" x2="440.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="424.0" y1="178.0" x2="436.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.8"/><line x1="428.0" y1="182.0" x2="432.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="328.6" y="223.5" width="132.8" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="395.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">(R+R) ∥ 2R = R</tspan></text>
<text x="395.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="395.0" dy="0.0">R згортки + R лінії = 2R,</tspan><tspan x="395.0" dy="13.0">і знову паралель із 2R</tspan></text>
<line x1="548.0" y1="150.0" x2="588.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">висновок</text>
<rect x="600.0" y="100.0" width="100.0" height="86.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">З будь-якого</tspan><tspan x="650.0" dy="11.7">вузла вглиб —</tspan><tspan x="650.0" dy="11.7">завжди рівно R</tspan></text>
<text x="650.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">тому Rвих = R</tspan><tspan x="650.0" dy="14.3">і НЕ залежить</tspan><tspan x="650.0" dy="14.3">від коду</tspan></text>
<rect x="40.0" y="338.0" width="640.0" height="46.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="363.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Лесенка самоподібна: 2R ∥ 2R = R; цей R плюс горизонтальний R = 2R, який знову паралелиться з черговим 2R — і знову R. Картина згортається сама в себе, тож вихідний опір дорівнює R за будь-якого числа біт.</tspan></text>
</svg>