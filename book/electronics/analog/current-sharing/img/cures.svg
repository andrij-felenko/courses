<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як вирівняти поділ струму між джерелами</text>
<text x="148.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7a5d00" text-anchor="middle" font-weight="700">Баласт</text>
<rect x="43.0" y="95.0" width="210.0" height="110.0" rx="6" fill="#fff8e1" stroke="#d9a400" stroke-width="1.5"/><text x="148.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7a5d00" text-anchor="middle"><tspan x="148.0" dy="0.0">малий R у кожну</tspan><tspan x="148.0" dy="18.2">гілку → менша</tspan><tspan x="148.0" dy="18.2">чутливість до Δε</tspan></text>
<text x="370.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Розв'язув. діоди</text>
<rect x="265.0" y="95.0" width="210.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle"><tspan x="370.0" dy="0.0">діод вістрям до</tspan><tspan x="370.0" dy="18.2">вузла → зворотний</tspan><tspan x="370.0" dy="18.2">струм неможливий</tspan></text>
<text x="592.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Просідання</text>
<rect x="487.0" y="95.0" width="210.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="592.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle"><tspan x="592.0" dy="0.0">блок сам знижує</tspan><tspan x="592.0" dy="18.2">напругу зі струмом</tspan><tspan x="592.0" dy="18.2">→ сусіди беруть</tspan></text>
