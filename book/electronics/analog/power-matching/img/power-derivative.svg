<text x="170.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">= 0  ⟺  Rth − R = 0  ⟺  R = Rth.   Знак: + до піка, − після → це МАКСИМУМ.</text>
<text x="170.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Підставивши R = Rth:   P_max = Vth² / (4·Rth).</text>
