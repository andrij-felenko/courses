<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Візерунок формул: що куди множити й ділити</text>
<text x="360.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Трикутник → Зірка:  плече зірки = добуток двох суміжних сторін ÷ сума всіх трьох</text>
<line x1="250.0" y1="190.0" x2="160.0" y2="90.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="70.0" y1="190.0" x2="160.0" y2="90.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="70.0" y1="190.0" x2="250.0" y2="190.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="225.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">R_A</text>
<text x="93.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">R_B</text>
<text x="160.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">R_C</text>
<circle cx="70.0" cy="190.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="56.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="250.0" cy="190.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="262.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<circle cx="160.0" cy="90.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<rect x="360.0" y="110.0" width="330.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="525.0" y="151.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Rₐ = (R_B · R_C) / (R_A + R_B + R_C)</tspan></text>
<text x="525.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">«суміжні до A» = R_B і R_C (обидва впираються у A)</text>
<line x1="50.0" y1="235.0" x2="670.0" y2="235.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<text x="360.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Зірка → Трикутник:  сторона = сума попарних добутків ÷ протилежне плече</text>
<line x1="70.0" y1="385.0" x2="160.0" y2="355.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="250.0" y1="385.0" x2="160.0" y2="355.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="160.0" y1="300.0" x2="160.0" y2="355.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="99.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Rₐ</text>
<text x="221.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">R_b</text>
<text x="174.0" y="327.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">R_c</text>
<circle cx="160.0" cy="355.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="70.0" cy="385.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="56.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="250.0" cy="385.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="262.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<circle cx="160.0" cy="300.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<rect x="360.0" y="300.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="525.0" y="327.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">S = Rₐ·R_b + R_b·R_c + R_c·Rₐ</tspan></text>
<rect x="360.0" y="356.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="525.0" y="382.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">R_A = S / Rₐ   (Rₐ — плече до A)</tspan></text>
<text x="525.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чисельник S — той самий для всіх трьох сторін</text>
</svg>