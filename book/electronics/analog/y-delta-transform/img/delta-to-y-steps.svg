<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Δ→Y: як три рівняння дають один промінь</text>
<text x="58.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1. Скласти всі три рівняння</text>
<rect x="58.0" y="82.0" width="604.0" height="40.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">2·(Rₐ + R_b + R_c) = 2P / Σ</tspan></text>
<text x="58.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">кожен промінь увійшов двічі → зліва подвоєна сума</text>
<text x="58.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Поділити на два</text>
<rect x="58.0" y="166.0" width="604.0" height="40.0" rx="6" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Rₐ + R_b + R_c = P / Σ</tspan></text>
<text x="58.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">P = R_A·R_B + R_B·R_C + R_C·R_A   (попарні добутки)</text>
<text x="58.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">3. Відняти рівняння без Rₐ</text>
<rect x="58.0" y="250.0" width="604.0" height="40.0" rx="6" fill="#f7f9fc" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Rₐ = P/Σ − R_A·(R_B + R_C)/Σ</tspan></text>
<text x="58.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">доданки з R_A гасяться → лишається R_B·R_C</text>
<text x="58.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Результат</text>
<rect x="58.0" y="334.0" width="604.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Rₐ = (R_B · R_C) / (R_A + R_B + R_C)</tspan></text>
<text x="58.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">суміжні до A сторони над сумою всіх трьох</text>
</svg>