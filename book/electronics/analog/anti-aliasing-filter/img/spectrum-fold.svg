<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 375.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="375.8" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загортання спектра: частоти вище fN падають назад на сигнал</text>
<line x1="70.0" y1="250.0" x2="650.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="70.0" y1="250.0" x2="70.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="644.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">частота</text>
<line x1="220.0" y1="250.0" x2="220.0" y2="257.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="220.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">fmax</text>
<line x1="340.0" y1="250.0" x2="340.0" y2="257.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="340.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">fN = fs/2</text>
<line x1="580.0" y1="250.0" x2="580.0" y2="257.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="580.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">fs</text>
<line x1="340.0" y1="250.0" x2="340.0" y2="80.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 4"/>
<path d="M74.0 250.0 L220.0 130.0 L220.0 250.0 Z" fill="#eafaf0" stroke="#27ae60" stroke-width="2"/>
<text x="130.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">корисний</text>
<text x="130.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">сигнал</text>
<path d="M390.0 250.0 Q435.0 155.0 480.0 250.0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="435.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">завада вище fN</text>
<path d="M200.0 250.0 Q245.0 155.0 290.0 250.0" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="245.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">її аліас</text>
<path d="M435.0 155.0 Q340.0 100.0 245.0 155.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="340.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">загортається навколо fN</text>
<rect x="59.3" y="308.2" width="601.4" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Усе, що сидить вище fN, після відліків відбивається навколо fN і падає назад у смугу.</tspan><tspan x="360.0" dy="15.6">Там воно лягає поверх корисного сигналу — і вже не відокремиться нічим.</tspan></text>
</svg>