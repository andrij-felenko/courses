<text x="76.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">V</text>
<text x="562.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">T</text>
<path d="M 80.0,50.1 L 550.0,206.9" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="554.0" y="206.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Vbe (−2 мВ/°C)</text>
<path d="M 80.0,206.9 L 550.0,50.1" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<text x="554.0" y="50.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">K·ΔVbe (PTAT, +)</text>
<line x1="80.0" y1="128.5" x2="550.0" y2="128.5" stroke="#27ae60" stroke-width="3.0"/>
<text x="554.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">сума ≈ 1.25 В</text>
<text x="315.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Падіння переходу + помножена різниця двох переходів = майже константа.</text>
<text x="315.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">1.25 В — це і є ширина забороненої зони кремнію у вольтах.</text>
