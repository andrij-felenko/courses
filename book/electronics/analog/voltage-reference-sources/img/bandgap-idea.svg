<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Складаємо дві протилежні залежності в нуль</text>
<line x1="80.0" y1="250.0" x2="80.0" y2="48.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
