<text x="170.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">I_пряма = U_пряма / R_leak</text>
<text x="170.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">→ наноампери</text>
<text x="170.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Без сторожа</text>
<line x1="360.0" y1="86.0" x2="360.0" y2="310.0" stroke="#dfe3e8" stroke-width="1.4" stroke-dasharray="5 5"/>
<circle cx="530.0" cy="112.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
