<line x1="488.0" y1="132.0" x2="488.0" y2="228.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="395.6" y="152.0" width="116.9" height="56.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="454.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">U_залиш</tspan><tspan x="454.0" dy="13.0">≈ U_os + U_сигн/A</tspan><tspan x="454.0" dy="13.0">(мікровольти)</tspan></text>
<text x="530.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">I_залиш = U_залиш / R_leak</text>
<text x="530.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">→ піко-/фемтоампери</text>
<text x="530.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Зі сторожем</text>
<text x="360.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R_leak той самий — змінилась лише напруга над ним.  G = I_пряма/I_залиш = U_пряма/U_залиш.</text>
