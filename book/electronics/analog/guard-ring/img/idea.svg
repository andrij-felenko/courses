<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<ellipse cx="330.0" cy="180.0" rx="170" ry="110" fill="#eef7f0" stroke="#27ae60" stroke-width="2.6"/>
<text x="330.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">СТОРОЖ  (тієї самої напруги, що сигнал)</text>
<circle cx="330.0" cy="186.0" r="34.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="330.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">сигнал</text>
<text x="330.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">U</text>
<text x="70.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">брудна поверхня · сусідня шина +5 В</text>
<line x1="120.0" y1="95.0" x2="180.0" y2="120.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="95.0" x2="480.0" y2="120.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">витік</text>
<line x1="330.0" y1="220.0" x2="330.0" y2="264.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="149.0" y="268.0" width="362.0" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">між сигналом і сторожем  ΔU = 0  →  I = ΔU / R = 0</tspan></text>
<text x="330.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Витік тече туди, де є різниця напруг. Зрівняли потенціали — і він обходить сигнал.</text>
</svg>