<line x1="114.0" y1="198.0" x2="206.0" y2="198.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="160.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">витік поверхнею маски</text>
<text x="160.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Маска лишена: вона САМА проводить</text>
<line x1="350.0" y1="80.0" x2="350.0" y2="300.0" stroke="#dfe3e8" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="380.0" y="220.0" width="240.0" height="34.0" rx="2" fill="#e8d9b5" stroke="#6b7280" stroke-width="1.4"/>
<text x="500.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">FR-4 (підкладка)</text>
