<text x="566.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">кільце</text>
<text x="500.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">маска знята — гола чиста мідь</text>
<line x1="454.0" y1="216.0" x2="546.0" y2="216.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="458.0" y1="216.0" x2="544.0" y2="216.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">витік стікає в кільце, не у вузол</text>
<text x="500.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Маска знята: кільце перехоплює витік</text>
<text x="350.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Маска й засохлий флюс — теж скінченний опір. Їхньою поверхнею витік оминає кільце.</text>
<text x="350.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Тому над вузлом і кільцем мідь лишають голою й відмивають від флюсу.</text>
