<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="377.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічний інтегратор: колесо на диску</text>
<text x="340.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">де сидить колесо (y) — так швидко крутиться лічильник (∫ y dx)</text>
<circle cx="230.0" cy="210.0" r="108.0" fill="#eef2f6" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="230.0" cy="210.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 190.0 332.0 A 40.0 40.0 0 0 1 270.0 332.0" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="230.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">диск крутиться рівномірно (це вхід x)</text>
<text x="230.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДИСК</text>
<line x1="230.0" y1="210.0" x2="292.0" y2="210.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="261.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">y</text>
<ellipse cx="292.0" cy="210.0" rx="7" ry="20" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<line x1="292.0" y1="190.0" x2="362.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="292.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">колесо</text>
<circle cx="390.0" cy="190.0" r="22.0" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="390.0" cy="190.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="380.0" y1="174.0" x2="402.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">лічильник</text>
<text x="390.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">обертів</text>
<rect x="60.4" y="299.4" width="559.2" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="318.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">далеко від центра (велике y) — колесо мчить швидко; біля центра (мале y) — ледь повзе;</tspan><tspan x="340.0" dy="14.3">рухай колесо по радіусу за законом y(x) — і лічильник сам набирає ∫ y dx</tspan></text>
</svg>