<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дав Фрііс: одна мірка замість какофонії</text>
<text x="175.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">до 1944: кожен мірив по-своєму</text>
<rect x="60.0" y="80.0" width="230.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="175.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">«опір шуму 1.2 кОм»</text>
<rect x="60.0" y="124.0" width="230.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="175.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">«мін. сигнал 3 мкВ»</text>
<rect x="60.0" y="168.0" width="230.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="175.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">«напруга шуму нВ/√Гц»</text>
<rect x="60.0" y="212.0" width="230.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="175.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">(а тут — лише підсилення)</text>
<text x="175.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не зводяться одне до одного</text>
<rect x="325.2" y="90.2" width="149.6" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Фрііс, 1944</tspan><tspan x="400.0" dy="14.3">«Noise Figures</tspan><tspan x="400.0" dy="14.3">of Radio Receivers»</tspan></text>
<line x1="355.0" y1="200.0" x2="445.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="575.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">після: одна лінійка для всіх</text>
<rect x="465.0" y="86.0" width="222.0" height="92.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="576.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">F = (S/N)вх / (S/N)вих</text>
<text x="576.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">одне число, будь-який вузол</text>
<text x="576.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">ідеал → F = 1</text>
<text x="576.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">реальний → F &gt; 1</text>
<rect x="66.1" y="310.2" width="587.7" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="330.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">До статті 1944 року приймачі описували несумісними мірками — порівняти було годі.</tspan><tspan x="360.0" dy="15.6">Фрііс звів усе до одного відношення сигнал/шум на вході до виходу: спільна лінійка.</tspan></text>
</svg>