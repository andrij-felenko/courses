<rect x="21.7" y="368.2" width="676.6" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Власний шум ланки n народжується ПІСЛЯ n−1 підсилень — на вході він менший у стільки ж разів.</tspan><tspan x="360.0" dy="15.6">Тому в сумі кожен внесок поділений на добуток підсилень усіх ланок ПЕРЕД ним: ось і вся формула.</tspan></text>
