<rect x="90.3" y="332.2" width="519.3" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Підлога — тепловий шум самого джерела (kT₀ = −174 дБм/Гц при 290 К).</tspan><tspan x="350.0" dy="15.6">Коефіцієнт шуму F = у скільки разів елемент підняв шум над цією підлогою.</tspan></text>
