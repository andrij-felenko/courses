<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пасивні втрати: коефіцієнт шуму дорівнює самим втратам</text>
<rect x="97.0" y="198.0" width="46.0" height="22.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="97.0" y="88.0" width="46.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="120.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вхід</text>
<text x="120.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сигнал</text>
<text x="120.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">шум kT₀</text>
<rect x="250.0" y="122.0" width="90.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="295.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">атенюатор</text>
<text x="295.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">втрати L</text>
<line x1="340.0" y1="150.0" x2="390.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="447.0" y="198.0" width="46.0" height="22.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="447.0" y="170.5" width="46.0" height="27.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="470.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вихід</text>
<text x="470.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сигнал ÷ L</text>
<text x="470.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">шум так само kT₀</text>
<rect x="42.5" y="288.2" width="615.1" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Атенюатор тисне сигнал у L разів, але на виході знов стоїть теплова підлога kT₀.</tspan><tspan x="350.0" dy="15.6">SNR упав рівно в L разів — тому коефіцієнт шуму пасивних втрат: NF = L (у дБ = втрати).</tspan></text>
</svg>