<text x="450.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V₋ = Vout·Rg/(Rg+Rf)</text>
<text x="450.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ Vin = Vout·Rg/(Rg+Rf)</text>
<rect x="450.0" y="192.0" width="232.0" height="30.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="566.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Vout/Vin = 1 + Rf/Rg</text>
<text x="360.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сигнал на «+» задає V₋ через віртуальне коротке; дільник пов'язує V₋ із Vout. Прирівняли — готово.</text>
