<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="640" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="220.0" y="90.0" width="200.0" height="130.0" rx="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="320.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДЗЕРКАЛО</text>
<text x="320.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">струму</text>
<text x="70.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">задаємо тут</text>
<line x1="60.0" y1="155.0" x2="216.0" y2="155.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="135.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">I_REF</text>
<text x="135.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">опорний</text>
<text x="560.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">з’являється тут</text>
<line x1="424.0" y1="155.0" x2="600.0" y2="155.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="510.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">I_OUT ≈ I_REF</text>
<text x="510.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">точна копія</text>
<rect x="176.6" y="238.2" width="286.8" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="258.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Не залежить від навантаження праворуч —</tspan><tspan x="320.0" dy="15.6">це майже ідеальне джерело струму</tspan></text>
</svg>