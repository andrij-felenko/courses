<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="408" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чинник стійкості S за різних схем зміщення BJT</text>
<rect x="40.0" y="78.0" width="680.0" height="86.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="58.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Фіксований струм бази</text>
<text x="58.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тільки резистор база→живлення</text>
<text x="58.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">S = β + 1</text>
<text x="702.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="end" font-weight="700">≈ 150…300</text>
<text x="702.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-style="italic">розгін легкий</text>
<rect x="40.0" y="178.0" width="680.0" height="86.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="58.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Емітерний резистор RE</text>
<text x="58.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">RE дає від'ємний зв'язок за струмом</text>
<text x="58.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">S = (β+1)·(1+RB/RE) / (1+β+RB/RE)</text>
<text x="702.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="end" font-weight="700">≈ 10…30</text>
<text x="702.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">помітно стійкіше</text>
<rect x="40.0" y="278.0" width="680.0" height="86.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="58.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Подільник + RE</text>
<text x="58.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">база жорстко зафіксована, RE гальмує</text>
<text x="58.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">S → (1 + RB/RE),  RB мале</text>
<text x="702.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="end" font-weight="700">≈ 3…10</text>
<text x="702.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-style="italic">майже не пливе</text>
<text x="380.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">що жорсткіше зафіксована база й сильніший RE — то менший S, то стійкіше</text>
</svg>