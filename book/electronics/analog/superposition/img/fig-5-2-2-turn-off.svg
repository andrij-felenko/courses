<rect x="140.0" y="270.0" width="540.0" height="50.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="410.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Вимкнути» джерело — це не прибрати його, а замінити на його нульовий стан:</text>
<text x="410.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">напругу на нуль (дріт), струм на нуль (розрив). Внутрішні опори лишаються!</text>
