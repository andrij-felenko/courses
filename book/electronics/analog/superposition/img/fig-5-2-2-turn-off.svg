<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як «вимкнути» джерело на час розрахунку</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">джерело напруги → нуль вольтів = коротке замикання; джерело струму → нуль ампер = розрив</text>
<text x="180.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Джерело напруги → КЗ (дріт)</text>
<line x1="94.0" y1="167.0" x2="126.0" y2="167.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
