<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діючий струм за теоремою Піфагора</text>
<line x1="95.0" y1="300.0" x2="325.0" y2="300.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="210.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">I₁  (основна гармоніка)</text>
<line x1="309.0" y1="300.0" x2="309.0" y2="284.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="309.0" y1="284.0" x2="325.0" y2="284.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="325.0" y1="300.0" x2="325.0" y2="150.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="337.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">√(I₂²+I₃²+…)</text>
<text x="337.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">усі гармоніки разом</text>
<line x1="95.0" y1="300.0" x2="325.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="170.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">I_rms</text>
<rect x="85.0" y="344.0" width="320.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">I_rms² = I₁² + I₂² + I₃² + …</tspan></text>
<rect x="470.0" y="70.0" width="250.0" height="30.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="595.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Два множники PF</tspan></text>
<rect x="470.0" y="120.0" width="250.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">коеф. спотворення =</tspan><tspan x="595.0" dy="16.2">I₁ / I_rms = 1/√(1+THD²)</tspan></text>
<rect x="470.0" y="200.0" width="250.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">коеф. зсуву =</tspan><tspan x="595.0" dy="16.2">cos φ₁ (тільки основна)</tspan></text>
<rect x="470.0" y="290.0" width="250.0" height="44.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="595.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">PF = cos φ₁ × 1/√(1+THD²)</tspan></text>
</svg>