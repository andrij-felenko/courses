<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="560" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="280.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Z = R + jX : модуль |Z| і кут φ</text>
<line x1="90.0" y1="340.0" x2="470.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="90.0" y1="340.0" x2="90.0" y2="40.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="474.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Re  (R, оми)</text>
<text x="82.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">Im  (X)</text>
<line x1="90.0" y1="340.0" x2="340.0" y2="340.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="340.0" y1="340.0" x2="340.0" y2="140.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="90.0" y1="340.0" x2="340.0" y2="140.0" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
