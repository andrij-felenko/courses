<rect x="300.0" y="70.0" width="230.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="415.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">|Z| = √(R² + X²)</tspan><tspan x="415.0" dy="16.9">φ = arctan(X / R)</tspan><tspan x="415.0" dy="16.9">Z = |Z| · (cos φ + j·sin φ)</tspan></text>
