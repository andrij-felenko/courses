<text x="215.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">R</text>
<text x="356.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">X</text>
<text x="189.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">|Z|</text>
<path d="M 138.0 340.0 A 48 48 0 0 0 127.4 310.2" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
