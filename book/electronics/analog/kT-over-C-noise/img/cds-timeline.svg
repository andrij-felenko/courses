<text x="380.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">слабкий піксель тоне в kT/C-шумі скидання → не зменшити, ємність задерти не можна</text>
<text x="380.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ключ скидання щоразу саджає на вузол ≈√(kT/C) ~ сотні мкВ</text>
