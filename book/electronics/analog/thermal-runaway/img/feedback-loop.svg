<rect x="281.2" y="280.9" width="157.7" height="54.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="360.0" y="303.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Більша потужність</tspan><tspan x="360.0" dy="18.2">P = Ic·Vce</tspan></text>
<rect x="55.2" y="160.9" width="149.7" height="54.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="130.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Температура</tspan><tspan x="130.0" dy="18.2">переходу ще вища</tspan></text>
