<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Велетенське підсилення робить передатну криву сходинкою</text>
<line x1="110.0" y1="235.0" x2="610.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="610.0" y1="235.0" x2="626.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="614.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">V₊ − V₋</text>
<line x1="360.0" y1="390.0" x2="360.0" y2="66.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="360.0" y1="66.0" x2="360.0" y2="50.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="348.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Vвих</text>
<line x1="110.0" y1="80.0" x2="610.0" y2="80.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="110.0" y1="390.0" x2="610.0" y2="390.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="114.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">+Vрейки  («1»)</text>
<text x="114.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">−Vрейки  («0»)</text>
<path d="M110 390 L354 390 L366 80 L610 80" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="372.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">лінійна зона —</text>
<text x="372.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">лише мікровольти завширшки</text>
<text x="235.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">V₋ більший → вихід унизу</text>
<text x="485.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">V₊ більший → вихід угорі</text>
<text x="360.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Між рейками — майже вертикальна стінка: трохи переважив один вхід — і вихід уже на рейці</text>
</svg>