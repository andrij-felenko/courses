<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скрізь, де треба порівняти рівні: те саме «вище/нижче»</text>
<rect x="36.0" y="70.0" width="200.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="136.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">світло / темрява</text>
<text x="136.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">фоторезистор проти порога</text>
<rect x="260.0" y="70.0" width="200.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="360.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">поріг температури</text>
<text x="360.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">термістор → вентилятор</text>
<rect x="484.0" y="70.0" width="200.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="584.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">розряд батареї</text>
<text x="584.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дільник проти опорного</text>
<rect x="36.0" y="190.0" width="200.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="136.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">перехід через нуль</text>
<text x="136.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">синус → прямокутник</text>
<rect x="260.0" y="190.0" width="200.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="360.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">сигналізація</text>
<text x="360.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перевищило межу → тривога</text>
<rect x="484.0" y="190.0" width="200.0" height="96.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="584.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">вхід АЦП</text>
<text x="584.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">драбина порогів → код</text>
<text x="360.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен випадок — той самий компаратор: один вхід — сигнал, другий — поріг.</text>
</svg>