<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ключ вимкнено — дзеркально: струму майже нема (I≈0), тож U·I знову ≈ 0. Тепло є лише в коротку мить перемикання.</text>
