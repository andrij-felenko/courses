<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи показати перетин дротів</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">з'єднання — крапкою; непоєднаний перетин — просто навхрест або «містком»</text>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">З'єднано</text>
<line x1="80.0" y1="190.0" x2="240.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="160.0" y1="140.0" x2="160.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.4"/>
<circle cx="160.0" cy="190.0" r="6.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="160.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крапка</text>
<text x="430.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Не з'єднано (сучасно)</text>
<line x1="350.0" y1="190.0" x2="510.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="430.0" y1="140.0" x2="430.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="430.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">просто навхрест</text>
<text x="700.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Не з'єднано («місток»)</text>
<line x1="700.0" y1="140.0" x2="700.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.4"/>
