<rect x="420.0" y="120.0" width="200.0" height="180.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="520.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">зв'язні компоненти</text>
<text x="438.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">• union(R1.1, +5В) [дріт]</text>
<text x="438.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">• union(…, U1.in) [крапка]</text>
<text x="438.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">• union(R1.2, U1.out) [дріт]</text>
<text x="438.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">кожен набір = 1 ланцюг</text>
<text x="438.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">(той самий вузол §1.4.1)</text>
<line x1="640.0" y1="210.0" x2="710.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="720.0" y="120.0" width="160.0" height="180.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="800.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">НЕТЛИСТ</text>
<text x="736.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Net1 (+5В):</text>
<text x="746.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">R1.1, U1.in</text>
<text x="736.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Net2:</text>
<text x="746.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">R1.2, U1.out</text>
<text x="736.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">+ мітки за іменем</text>
<text x="736.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">зливаються в один</text>
<rect x="120.0" y="348.0" width="660.0" height="42.0" rx="8" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="367.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це пошук зв'язних компонент графа (§1.4.1a): дроти й крапки «зливають» піни в набори;</text>
<text x="450.0" y="383.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">однакові мітки-імена (+5В, GND) теж зливаються — навіть без намальованого дроту.</text>
