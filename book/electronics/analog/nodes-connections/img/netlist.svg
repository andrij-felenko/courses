<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Нетлист: як редактор «зафарбовує» вузли сам</text>
<text x="450.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">редактор будує граф пінів і дротів і шукає зв'язні компоненти — кожна стає одним ланцюгом (вузлом)</text>
<line x1="120.0" y1="140.0" x2="260.0" y2="140.0" stroke="#1f8a3b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="200.0" y1="140.0" x2="200.0" y2="210.0" stroke="#1f8a3b" stroke-width="2.5" stroke-linecap="round"/>
