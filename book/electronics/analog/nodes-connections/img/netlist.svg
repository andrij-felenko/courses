<text x="200.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="7.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">крапка з'єднує</text>
<line x1="120.0" y1="262.0" x2="260.0" y2="262.0" stroke="#1f47b5" stroke-width="2.5" stroke-linecap="round"/>
