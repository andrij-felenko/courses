<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нетлист: як редактор «зафарбовує» вузли сам</text>
<text x="450.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">редактор будує граф пінів і дротів і шукає зв'язні компоненти — кожна стає одним ланцюгом (вузлом)</text>
