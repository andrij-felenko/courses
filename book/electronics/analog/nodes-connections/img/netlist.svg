<text x="190.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">схема (піни + дроти)</text>
<line x1="330.0" y1="210.0" x2="400.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
