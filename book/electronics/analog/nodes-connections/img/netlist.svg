<text x="736.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">+ мітки за іменем</text>
<text x="736.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">зливаються в один</text>
<rect x="120.0" y="348.0" width="660.0" height="42.0" rx="8" fill="#f7f7f7" stroke="#6b7280" stroke-width="1.4"/>
<text x="450.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Це пошук зв'язних компонент графа: дроти й крапки «зливають» піни в набори;</text>
<text x="450.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">однакові мітки-імена (+5В, GND) теж зливаються — навіть без намальованого дроту.</text>
