<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому платять за чип: узгодженість резисторів = CMRR</text>
<rect x="40.0" y="56.0" width="320.0" height="280.0" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="200.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Зібрати самому: 3 ОП</text>
<rect x="60.0" y="100.0" width="280.0" height="50.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">три окремі ОП</tspan><tspan x="200.0" dy="15.6">+ п'ять ПІДІГНАНИХ резисторів</tspan></text>
<rect x="60.0" y="162.0" width="280.0" height="50.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="183.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">CMRR = наскільки точно</tspan><tspan x="200.0" dy="15.6">збіглися ці резистори</tspan></text>
<rect x="60.0" y="224.0" width="280.0" height="70.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">на 0.1% деталях →</tspan><tspan x="200.0" dy="15.6">CMRR ≈ 60–66 дБ</tspan><tspan x="200.0" dy="15.6">(+ температурний дрейф)</tspan></text>
<rect x="400.0" y="56.0" width="320.0" height="280.0" rx="10" fill="#f0f8f1" stroke="#27ae60" stroke-width="1.4"/>
<text x="560.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Готовий in-amp: 1 корпус</text>
<rect x="420.0" y="100.0" width="280.0" height="50.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">резистори на кристалі,</tspan><tspan x="560.0" dy="15.6">підрізані лазером</tspan></text>
<rect x="420.0" y="162.0" width="280.0" height="50.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="183.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">дрейфують РАЗОМ →</tspan><tspan x="560.0" dy="15.6">стабільний CMRR</tspan></text>
<rect x="420.0" y="224.0" width="280.0" height="70.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">CMRR ≈ 90–130 дБ «з коробки»</tspan><tspan x="560.0" dy="15.6">лишається поставити</tspan><tspan x="560.0" dy="15.6">один Rg</tspan></text>
</svg>