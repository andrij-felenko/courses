<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один ОП проти трьох: вхідний опір і відкидання завади</text>
<rect x="40.0" y="60.0" width="300.0" height="270.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="190.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">один ОП (простий віднімач)</text>
<rect x="60.0" y="104.0" width="260.0" height="54.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">вхід низькоомний:</tspan><tspan x="190.0" dy="15.6">резистори навантажують давач</tspan></text>
<rect x="60.0" y="168.0" width="260.0" height="54.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">CMRR тримається</tspan><tspan x="190.0" dy="15.6">лише на доборі 4 резисторів</tspan></text>
<rect x="60.0" y="232.0" width="260.0" height="70.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">0.1 % резистори →</tspan><tspan x="190.0" dy="15.6">CMRR ≈ 54 дБ</tspan><tspan x="190.0" dy="15.6">(завада тече далі)</tspan></text>
<rect x="380.0" y="60.0" width="300.0" height="270.0" rx="8" fill="#f0f8f1" stroke="#27ae60" stroke-width="1.4"/>
<text x="530.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">три ОП (інструментальний)</text>
<rect x="400.0" y="104.0" width="260.0" height="54.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">вхід величезний:</tspan><tspan x="530.0" dy="15.6">буфери не вантажать давач</tspan></text>
<rect x="400.0" y="168.0" width="260.0" height="54.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">перший каскад підсилює різницю,</tspan><tspan x="530.0" dy="15.6">спільне лишає в 1×</tspan></text>
<rect x="400.0" y="232.0" width="260.0" height="70.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">front-end множить CMRR →</tspan><tspan x="530.0" dy="15.6">≈ 94 дБ і вище</tspan><tspan x="530.0" dy="15.6">(завада задушена)</tspan></text>
</svg>