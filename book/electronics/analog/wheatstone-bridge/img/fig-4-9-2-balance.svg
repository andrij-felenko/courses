<text x="640.0" y="305.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">V_B = V·R₄/(R₃+R₄)</text>
<rect x="150.0" y="342.0" width="560.0" height="42.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="430.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Баланс (G = 0):  V_A = V_B  ⟺  R₁/R₂ = R₃/R₄  ⟺  R₁·R₄ = R₂·R₃</text>
<text x="430.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">V випадає з умови — баланс залежить лише від ВІДНОШЕНЬ плечей.</text>
