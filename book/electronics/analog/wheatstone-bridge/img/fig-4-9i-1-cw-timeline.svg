<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<rect width="900" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Міст, названий не за винахідником</text>
<text x="450.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">діамант Крісті (1833) став «мостом Вітстона» — і в цьому винна радше історія, ніж люди</text>
<line x1="70.0" y1="150.0" x2="830.0" y2="150.0" stroke="#bbbbbb" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="150.0" cy="150.0" r="7.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="2"/>
<line x1="150.0" y1="143.0" x2="150.0" y2="116.0" stroke="#cccccc" stroke-width="1.4" stroke-linecap="round"/>
<text x="150.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1833</text>
<text x="150.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Крісті: «діамантовий»</text>
<text x="150.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">метод (у статті про магнетизм)</text>
<circle cx="420.0" cy="150.0" r="7.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<line x1="420.0" y1="143.0" x2="420.0" y2="116.0" stroke="#cccccc" stroke-width="1.4" stroke-linecap="round"/>
<text x="420.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1843</text>
<text x="420.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вітстон: розвинув для</text>
<text x="420.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вимірювання опору; вказав Крісті</text>
<circle cx="740.0" cy="150.0" r="7.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<line x1="740.0" y1="143.0" x2="740.0" y2="116.0" stroke="#cccccc" stroke-width="1.4" stroke-linecap="round"/>
<text x="740.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">далі</text>
<text x="740.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">назва прилипла до Вітстона;</text>
<text x="740.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">переклади викинули Крісті</text>
</svg>
