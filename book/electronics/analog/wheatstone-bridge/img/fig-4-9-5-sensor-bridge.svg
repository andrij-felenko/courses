<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Міст як підсилювач різниці: крихітна ΔR → читабельний сигнал</text>
