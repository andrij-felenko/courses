<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де працює послідовне з'єднання</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">обмеження струму, складання опорів — і слабке місце ланцюжка</text>
<text x="150.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмеження струму</text>
<line x1="70.0" y1="130.0" x2="110.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.2"/>
<rect x="110.0" y="121.0" width="56.0" height="18.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="138.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R</text>
<line x1="166.0" y1="130.0" x2="200.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.2"/>
<polygon points="200,120 200,142 222,131" fill="#1a1a1a"/>
<line x1="222.0" y1="118.0" x2="222.0" y2="144.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="222.0" y1="130.0" x2="256.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.2"/>
<text x="150.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R послідовно з LED</text>
<text x="150.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тримає струм у нормі</text>
<text x="490.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гірлянда (слабке місце)</text>
<line x1="360.0" y1="130.0" x2="620.0" y2="130.0" stroke="#bdbdbd" stroke-width="2.0"/>
<circle cx="384.0" cy="130.0" r="9.0" fill="#bdbdbd" stroke="#8f8f8f" stroke-width="1.5"/>
<circle cx="424.0" cy="130.0" r="9.0" fill="#bdbdbd" stroke="#8f8f8f" stroke-width="1.5"/>
<circle cx="464.0" cy="130.0" r="9.0" fill="#bdbdbd" stroke="#8f8f8f" stroke-width="1.5"/>
<circle cx="504.0" cy="130.0" r="9.0" fill="#bdbdbd" stroke="#8f8f8f" stroke-width="1.5"/>
<circle cx="544.0" cy="130.0" r="9.0" fill="#bdbdbd" stroke="#8f8f8f" stroke-width="1.5"/>
<circle cx="584.0" cy="130.0" r="9.0" fill="#bdbdbd" stroke="#8f8f8f" stroke-width="1.5"/>
<line x1="497.0" y1="123.0" x2="511.0" y2="137.0" stroke="#c0392b" stroke-width="2.4"/>
<line x1="497.0" y1="137.0" x2="511.0" y2="123.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="490.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">одна лампа перегоріла —</text>
<text x="490.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">коло розірване, усі згасли</text>
<text x="740.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як один довший</text>
<rect x="666.0" y="122.0" width="50.0" height="16.0" rx="3" fill="#cf8b5e" stroke="#9c6b48" stroke-width="1.4"/>
<rect x="720.0" y="122.0" width="50.0" height="16.0" rx="3" fill="#cf8b5e" stroke="#9c6b48" stroke-width="1.4"/>
<text x="742.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">=</text>
<rect x="666.0" y="176.0" width="104.0" height="16.0" rx="3" fill="#cf8b5e" stroke="#9c6b48" stroke-width="1.4"/>
<text x="740.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">довше → більший опір</text>
<text x="740.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(R = ρL/A)</text>
<rect x="120.0" y="300.0" width="620.0" height="50.0" rx="6" fill="#f6f8fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="430.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Послідовно ставлять, щоб обмежити струм, скласти опір чи напругу —</tspan><tspan x="430.0" dy="15.0">та пам'ятають: розрив у будь-якій ланці гасить усе коло</tspan></text>
</svg>