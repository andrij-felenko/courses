<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: розрахувати послідовне коло</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">R₁=100, R₂=220, R₃=330 Ω під 12 В — знайти струм і спади</text>
<line x1="100.0" y1="140.0" x2="100.0" y2="290.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="84.0" y1="207.0" x2="116.0" y2="207.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="91.0" y1="223.0" x2="109.0" y2="223.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="76.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">12 В</text>
<line x1="100.0" y1="140.0" x2="430.0" y2="140.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<rect x="140.0" y="131.0" width="70.0" height="18.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="175.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R₁</text>
<rect x="240.0" y="131.0" width="70.0" height="18.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="275.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R₂</text>
<rect x="345.0" y="131.0" width="70.0" height="18.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="380.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R₃</text>
<line x1="430.0" y1="140.0" x2="430.0" y2="290.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="100.0" y1="290.0" x2="430.0" y2="290.0" stroke="#cf8b5e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="118.0" y1="140.0" x2="138.0" y2="140.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<rect x="470.0" y="96.0" width="320.0" height="200.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="488.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">R_екв = 100+220+330 = 650 Ω</text>
<text x="488.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">I = V / R_екв = 12 / 650 ≈ 18.5 мА</text>
<text x="488.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V₁ = I·R₁ ≈ 1.85 В</text>
<text x="488.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V₂ = I·R₂ ≈ 4.07 В</text>
<text x="488.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">V₃ = I·R₃ ≈ 6.08 В</text>
<rect x="488.0" y="262.0" width="284.0" height="26.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="630.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">перевірка: 1.85+4.07+6.08 ≈ 12 В ✓</text>
</svg>
