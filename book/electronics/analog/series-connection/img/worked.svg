<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад: розрахувати послідовне коло</text>
<text x="400.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">R₁=100, R₂=220, R₃=330 Ω під 12 В — знайти струм і спади</text>
<line x1="100.0" y1="130.0" x2="100.0" y2="193.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="82.0" y1="193.0" x2="118.0" y2="193.0" stroke="#1a1a1a" stroke-width="3.0"/><line x1="90.0" y1="209.0" x2="110.0" y2="209.0" stroke="#1a1a1a" stroke-width="6.0"/><line x1="100.0" y1="209.0" x2="100.0" y2="280.0" stroke="#1a1a1a" stroke-width="2.4"/><text x="76.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">12 В</text>
<line x1="100.0" y1="130.0" x2="430.0" y2="130.0" stroke="#cf8b5e" stroke-width="2.4"/>
<line x1="100.0" y1="280.0" x2="430.0" y2="280.0" stroke="#cf8b5e" stroke-width="2.4"/>
<line x1="430.0" y1="130.0" x2="430.0" y2="280.0" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="140.0" y="121.0" width="70.0" height="18.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="175.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R1</text>
<rect x="240.0" y="121.0" width="70.0" height="18.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="275.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R2</text>
<rect x="345.0" y="121.0" width="70.0" height="18.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="380.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R3</text>
<line x1="118.0" y1="130.0" x2="140.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="92.0" width="320.0" height="204.0" rx="12" fill="#f6f8fc" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="488.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">R_екв = 100+220+330 = 650 Ω</text>
<text x="488.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">I = V / R_екв = 12 / 650 ≈ 18.5 мА</text>
<text x="488.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">V₁ = I·R₁ ≈ 1.85 В</text>
<text x="488.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">V₂ = I·R₂ ≈ 4.07 В</text>
<text x="488.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">V₃ = I·R₃ ≈ 6.08 В</text>
<rect x="488.0" y="260.0" width="284.0" height="26.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">перевірка: 1.85+4.07+6.08 ≈ 12 В ✓</tspan></text>
</svg>