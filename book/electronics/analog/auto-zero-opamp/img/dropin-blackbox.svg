<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="445.8" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Zero-drift ОП ззовні і всередині: звичайні виводи, схована петля</text>
<rect x="250.0" y="110.0" width="260.0" height="200.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.2"/>
<text x="380.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ззовні — звичайний ОП на 5 виводів</text>
<text x="242.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">+IN</text>
<line x1="210.0" y1="170.0" x2="250.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
