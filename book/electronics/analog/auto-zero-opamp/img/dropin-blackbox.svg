<line x1="210.0" y1="238.0" x2="250.0" y2="238.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="518.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">OUT</text>
<line x1="510.0" y1="206.0" x2="550.0" y2="206.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">V+</text>
<line x1="380.0" y1="84.0" x2="380.0" y2="110.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="380.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">V−</text>
<line x1="380.0" y1="310.0" x2="380.0" y2="328.0" stroke="#6b7280" stroke-width="2.0"/>
<path d="M320.0 172.0 L320.0 240.0 L390.0 206.0 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<circle cx="320.0" cy="188.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="327.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="320.0" cy="224.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="320.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="346.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">головний</text>
<text x="346.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">каскад</text>
<line x1="250.0" y1="170.0" x2="320.0" y2="188.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="250.0" y1="238.0" x2="320.0" y2="224.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="390.0" y1="206.0" x2="510.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="278.0" y="258.0" width="204.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">чопер / auto-zero: міряє й гасить зсув</text>
<line x1="380.0" y1="258.0" x2="380.0" y2="242.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="386.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">− корекція зсуву</text>
<text x="380.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">всередині — машинерія, якої на виводах не видно</text>
<rect x="88.7" y="87.2" width="122.6" height="125.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">На виводах</tspan><tspan x="150.0" dy="15.6">поводиться як</tspan><tspan x="150.0" dy="15.6">дрібний ОП:</tspan><tspan x="150.0" dy="15.6">+IN, −IN, OUT,</tspan><tspan x="150.0" dy="15.6">живлення.</tspan><tspan x="150.0" dy="15.6"></tspan><tspan x="150.0" dy="15.6">Drop-in заміна.</tspan></text>
<rect x="560.4" y="102.8" width="143.1" height="94.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="632.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="632.0" dy="0.0">Але всередині</tspan><tspan x="632.0" dy="15.6">щось безперервно</tspan><tspan x="632.0" dy="15.6">перемикається —</tspan><tspan x="632.0" dy="15.6">звідси й переваги,</tspan><tspan x="632.0" dy="15.6">і граблі класу.</tspan></text>
<rect x="79.3" y="378.2" width="601.4" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="398.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Зовні zero-drift ОП — звичайна 5-вивідна мікросхема, drop-in заміна будь-якого ОП.</tspan><tspan x="380.0" dy="15.6">Усередині схована петля, що безперервно вимірює власний зсув каскаду й віднімає його.</tspan></text>
</svg>