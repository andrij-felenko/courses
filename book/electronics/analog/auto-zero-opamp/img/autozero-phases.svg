<rect x="45.6" y="326.2" width="628.8" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Спершу підсилювач міряє власну похибку на замкнутих входах і запам'ятовує її на C.</tspan><tspan x="360.0" dy="15.6">Тоді на сигналі ця поправка віднімається. Часте чергування тримає нуль попри дрейф і 1/f.</tspan></text>
