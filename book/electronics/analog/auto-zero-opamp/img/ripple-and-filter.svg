<rect x="65.6" y="306.2" width="628.8" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Брязкіт сидить на частоті чопера (сотні кГц), голки — на перемиканнях ключів.</tspan><tspan x="380.0" dy="15.6">Простий фільтр НЧ після виходу їх прибирає — але ВЕСТИ сигнал у смузі біля fчоп не можна.</tspan></text>
<rect x="34.8" y="378.2" width="690.3" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="398.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Тому «перший байт» zero-drift ОП на осцилографі — не рівна лінія, а рівень із брязкотом і голками.</tspan><tspan x="380.0" dy="15.6">Це нормальна поведінка класу: фільтруй вихід і не клади корисну смугу впритул до частоти чопера.</tspan></text>
