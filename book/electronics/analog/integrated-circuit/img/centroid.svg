<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний центроїд: як скоротити градієнт по пластині</text>
<line x1="60.0" y1="300.0" x2="660.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">параметр процесу плавно пливе вздовж кристала →</text>
<text x="190.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наївно: A та B поряд</text>
<rect x="110.0" y="110.0" width="70.0" height="110.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="145.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<rect x="190.0" y="110.0" width="70.0" height="110.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="225.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">B</text>
<line x1="145.0" y1="226.0" x2="145.0" y2="296.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="225.0" y1="226.0" x2="225.0" y2="296.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="185.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">центри різні → A і B ловлять різне</text>
<text x="540.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Центроїд: A B B A</text>
<rect x="410.0" y="110.0" width="60.0" height="110.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="440.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<rect x="476.0" y="110.0" width="60.0" height="110.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="506.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">B</text>
<rect x="542.0" y="110.0" width="60.0" height="110.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="572.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">B</text>
<rect x="608.0" y="110.0" width="60.0" height="110.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="638.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<line x1="539.0" y1="226.0" x2="539.0" y2="296.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="539.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">центр маси A = центр маси B</text>
<rect x="8.3" y="328.5" width="703.4" height="31.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="347.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Звели центри обох деталей в одну точку — лінійний градієнт додає до A і B порівну й скорочується у відношенні</tspan></text>
</svg>