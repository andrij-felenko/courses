<text x="474.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">|H| = R/(R·√2) = 0.707</text>
<rect x="59.3" y="348.2" width="601.4" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">R і XL — катети під прямим кутом (між ними рівно 90°), тож повний опір — гіпотенуза</tspan><tspan x="360.0" dy="15.6">√(R²+XL²), а НЕ сума R+XL. Коли XL = R, гіпотенуза = R·√2, кут = 45°, частка = 0.707.</tspan></text>
