<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому амплітуда всепропускної ланки рівно одиниця: нуль — дзеркало полюса</text>
<line x1="180.0" y1="230.0" x2="540.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="410.0" x2="360.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="536.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">σ (дійсна вісь)</text>
<text x="368.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">jω (уявна вісь)</text>
<text x="350.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0</text>
<line x1="290.0" y1="152.0" x2="360.0" y2="112.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="430.0" y1="152.0" x2="360.0" y2="112.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="290.0" y1="152.0" x2="430.0" y2="152.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="290.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#2457d6" text-anchor="middle" font-weight="700">×</text>
<circle cx="430.0" cy="152.0" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="278.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">полюс  −a+jb</text>
<text x="442.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">нуль  +a+jb</text>
<circle cx="360.0" cy="112.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="370.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">точка jω</text>
<text x="309.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">|s−нуль|</text>
<text x="411.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">= |s−полюс|</text>
<rect x="25.1" y="348.2" width="669.8" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Нуль — дзеркало полюса відносно уявної осі. Для будь-якої точки jω на осі</tspan><tspan x="360.0" dy="15.6">відстань до нуля = відстань до полюса, тож |H| = |jω−нуль| / |jω−полюс| = 1 — на ВСІХ частотах.</tspan></text>
</svg>