<rect x="637.0" y="130.4" width="165.9" height="239.2" rx="6" fill="#fbfdff" stroke="#2457d6" stroke-width="1.4"/><text x="720.0" y="153.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Дві сім'ї дуг:</tspan><tspan x="720.0" dy="14.3"></tspan><tspan x="720.0" dy="14.3">• коло СТАЛОГО R</tspan><tspan x="720.0" dy="14.3">  (сине) — по ньому</tspan><tspan x="720.0" dy="14.3">  жене ПОСЛІДОВНА</tspan><tspan x="720.0" dy="14.3">  реактивність;</tspan><tspan x="720.0" dy="14.3"></tspan><tspan x="720.0" dy="14.3">• коло СТАЛОЇ G</tspan><tspan x="720.0" dy="14.3">  (червоне) — по ньому</tspan><tspan x="720.0" dy="14.3">  жене ШУНТОВА.</tspan><tspan x="720.0" dy="14.3"></tspan><tspan x="720.0" dy="14.3">Задача — двома</tspan><tspan x="720.0" dy="14.3">кроками дійти</tspan><tspan x="720.0" dy="14.3">з точки джерела</tspan><tspan x="720.0" dy="14.3">в центр (50 Ω).</tspan></text>
