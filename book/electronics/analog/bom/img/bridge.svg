<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="70.0" width="150.0" height="170.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="115.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ЗАДУМ</text>
<text x="115.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Схема:</tspan><tspan x="115.0" dy="15.6">що з чим</tspan><tspan x="115.0" dy="15.6">з'єднано</tspan></text>
<text x="115.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Плата:</tspan><tspan x="115.0" dy="15.6">де кожне</tspan><tspan x="115.0" dy="15.6">сидить</tspan></text>
<text x="115.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(але не що купувати)</text>
<rect x="285.0" y="90.0" width="150.0" height="130.0" rx="12" fill="#eef7f0" stroke="#27ae60" stroke-width="2.4"/>
<text x="360.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">BOM</text>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перелік</tspan><tspan x="360.0" dy="15.6">компонентів</tspan></text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">міст задум → річ</text>
<rect x="530.0" y="70.0" width="150.0" height="170.0" rx="10" fill="#fdf0ea" stroke="#c0392b" stroke-width="2.0"/>
<text x="605.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">КОРОБКА</text>
<text x="605.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">конкретні</tspan><tspan x="605.0" dy="15.6">деталі від</tspan><tspan x="605.0" dy="15.6">конкретного</tspan><tspan x="605.0" dy="15.6">виробника</tspan></text>
<text x="605.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">те, що паяють</text>
<line x1="196.0" y1="155.0" x2="279.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="441.0" y1="155.0" x2="524.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="360.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Схема й плата кажуть «як» і «де». BOM каже «що саме і скільки» —</text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">без нього з правильного креслення не вийде жодної правильної плати</text>
</svg>