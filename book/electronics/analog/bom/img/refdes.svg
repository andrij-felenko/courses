<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне позначення R7 — крізь усі чотири документи</text>
<rect x="25.0" y="70.0" width="140.0" height="120.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="95.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">СХЕМА</text>
<text x="95.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">символ резистора</tspan><tspan x="95.0" dy="14.3">з міткою R7</tspan></text>
<rect x="68.0" y="200.5" width="54.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="95.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">R7</tspan></text>
<rect x="200.0" y="70.0" width="140.0" height="120.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="270.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ШОВКОГРАФІЯ</text>
<text x="270.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">напис «R7» на платі</tspan><tspan x="270.0" dy="14.3">біля контактних</tspan><tspan x="270.0" dy="14.3">майданчиків</tspan></text>
<rect x="243.0" y="200.5" width="54.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">R7</tspan></text>
<rect x="375.0" y="70.0" width="140.0" height="120.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="445.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">РЯДОК BOM</text>
<text x="445.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">R7 → 10 кОм,</tspan><tspan x="445.0" dy="14.3">MPN, корпус,</tspan><tspan x="445.0" dy="14.3">кількість</tspan></text>
<rect x="418.0" y="200.5" width="54.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">R7</tspan></text>
<rect x="550.0" y="70.0" width="140.0" height="120.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ДЕТАЛЬ</text>
<text x="620.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">потрібний</tspan><tspan x="620.0" dy="14.3">резистор</tspan><tspan x="620.0" dy="14.3">припаяно сюди</tspan></text>
<rect x="593.0" y="200.5" width="54.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">R7</tspan></text>
<line x1="95.0" y1="218.0" x2="620.0" y2="218.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="95.0" y1="190.0" x2="95.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="270.0" y1="190.0" x2="270.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="445.0" y1="190.0" x2="445.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="620.0" y1="190.0" x2="620.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="350.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Позиційне позначення — спільний ключ. Поки R7 однаковий усюди,</text>
<text x="350.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">людина й машина знають, що це та сама деталь у тому самому місці</text>
<text x="350.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Розбіжність хоч в одному документі — і на плату сяде не те або не туди</text>
</svg>