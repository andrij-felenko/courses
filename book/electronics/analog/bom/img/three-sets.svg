<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три множини позначень — а різниці між ними є помилки</text>
<circle cx="270" cy="200" r="120" fill="#2457d6" fill-opacity="0.10" stroke="#2457d6" stroke-width="2"/>
<circle cx="450" cy="200" r="120" fill="#1a1a1a" fill-opacity="0.07" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="360" cy="300" r="120" fill="#27ae60" fill-opacity="0.10" stroke="#27ae60" stroke-width="2"/>
<text x="200.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">СХЕМА</text>
<text x="200.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(задум)</text>
<text x="520.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПЛАТА</text>
<text x="520.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(мідь)</text>
<text x="360.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПЕРЕЛІК (BOM)</text>
<text x="360.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(що замовляти)</text>
<text x="360.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">усе</text>
<text x="360.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">збігається</text>
<text x="488.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="488.0" dy="0.0">B−M:</tspan><tspan x="488.0" dy="13.0">майданчик</tspan><tspan x="488.0" dy="13.0">без рядка</tspan><tspan x="488.0" dy="13.0">(E4)</tspan></text>
<text x="290.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="290.0" dy="0.0">M−B:</tspan><tspan x="290.0" dy="13.0">рядок без</tspan><tspan x="290.0" dy="13.0">майданчика</tspan><tspan x="290.0" dy="13.0">(E5)</tspan></text>
<text x="232.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="232.0" dy="0.0">S−B:</tspan><tspan x="232.0" dy="13.0">у схемі,</tspan><tspan x="232.0" dy="13.0">не на платі</tspan><tspan x="232.0" dy="13.0">(E7)</tspan></text>
<text x="360.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Перетин усіх трьох — здорове ядро. Кожна частина поза ним — окремий клас помилки.</text>
<text x="360.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Інструмент рахує саме ці різниці множин і друкує їх кодами E4–E7.</text>
</svg>