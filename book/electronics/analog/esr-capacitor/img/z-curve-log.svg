<rect x="20.2" y="342.2" width="659.5" height="59.6" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="350.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Дві реактивності в лог-лог осях — прямі однакового нахилу різного знаку, що перетинаються рівно на f₀.</tspan><tspan x="350.0" dy="14.3">Корінь у формулі — це геометрична середина: f₀ стоїть якраз посередині між ними за логарифмом.</tspan><tspan x="350.0" dy="14.3">Крива |Z| лягає на більшу з віток, а на резонансі сідає на горизонталь ESR — це її мінімум</tspan></text>
