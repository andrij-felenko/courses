<text x="360.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">лише запасає заряд</text>
<rect x="101.1" y="232.2" width="457.8" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">ESR — не окрема деталь, а зведений в одне число опір усіх втрат,</tspan><tspan x="330.0" dy="15.6">наче маленький резистор, упаяний послідовно з ідеальною ємністю</tspan></text>
