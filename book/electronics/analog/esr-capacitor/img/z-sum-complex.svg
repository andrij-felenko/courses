<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний опір як гіпотенуза: ESR + j·(ωL − 1/ωC)</text>
<line x1="120.0" y1="250.0" x2="530.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="150.0" y1="380.0" x2="150.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="526.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">дійсна вісь: опір (тепло)</text>
<text x="156.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">уявна вісь: реактивність</text>
<text x="156.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">+jωL вгору, −j/ωC вниз</text>
<line x1="150.0" y1="250.0" x2="300.0" y2="250.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="225.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ESR</text>
<line x1="300.0" y1="250.0" x2="300.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="308.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">+ωL</text>
<text x="308.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(індуктивна)</text>
<line x1="300.0" y1="130.0" x2="300.0" y2="330.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="308.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">−1/ωC</text>
<text x="308.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">(ємнісна, довша)</text>
<line x1="300.0" y1="250.0" x2="300.0" y2="330.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="308.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">X = ωL − 1/ωC</text>
<text x="308.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">(тут &lt; 0)</text>
<line x1="150.0" y1="250.0" x2="300.0" y2="330.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="211.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">|Z|</text>
<line x1="288.0" y1="250.0" x2="288.0" y2="238.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="288.0" y1="238.0" x2="300.0" y2="238.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="66.1" y="330.2" width="527.9" height="59.6" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="330.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Три послідовні опори додаються як вектори: активний ESR лягає на дійсну вісь,</tspan><tspan x="330.0" dy="14.3">реактивності — на уявну (ωL вгору, 1/ωC вниз) і частково гасять одна одну.</tspan><tspan x="330.0" dy="14.3">Повний опір |Z| — гіпотенуза прямокутного трикутника з катетами ESR і (ωL − 1/ωC)</tspan></text>
</svg>