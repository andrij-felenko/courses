<rect x="67.9" y="366.5" width="584.3" height="43.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Електроліт дає велику ємність — низький опір на низькій частоті, але ESR і ESL швидко стелять його.</tspan><tspan x="360.0" dy="13.0">Кераміка з малим ESR/ESL підхоплює там, де електроліт уже безпорадний. Разом — низько в усій смузі</tspan></text>
