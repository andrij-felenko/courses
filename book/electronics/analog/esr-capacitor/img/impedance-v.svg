<rect x="75.5" y="349.4" width="509.1" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="368.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">На резонансі реактивності взаємно гасяться — лишається сам ESR.</tspan><tspan x="330.0" dy="14.3">Нижче за ESR конденсатор не «коротшає» хоч би яка частота: дно галочки і є ESR</tspan></text>
