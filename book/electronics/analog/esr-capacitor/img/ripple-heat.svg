<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 610 399.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="610" height="399.5" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="300.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому конденсатор гріється й гине</text>
<rect x="239.8" y="63.3" width="120.3" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="82.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">пульсівний струм</tspan><tspan x="300.0" dy="14.3">I тече крізь ESR</tspan></text>
<rect x="406.7" y="177.3" width="126.6" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">втрати P = I²·ESR</tspan><tspan x="470.0" dy="14.3">гріють кристал</tspan></text>
<rect x="246.1" y="291.4" width="107.8" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">тепло піднімає</tspan><tspan x="300.0" dy="14.3">температуру</tspan></text>
<rect x="73.0" y="177.3" width="114.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">гарячий ESR</tspan><tspan x="130.0" dy="14.3">росте ще більше</tspan></text>
<line x1="354.9" y1="122.8" x2="409.1" y2="159.2" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="412.4" y1="238.6" x2="353.1" y2="278.4" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="250.3" y1="280.6" x2="185.7" y2="237.3" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="182.3" y1="164.9" x2="241.7" y2="125.1" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="300.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">петля</text>
<text x="300.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">розгону</text>
<rect x="56.3" y="336.5" width="487.4" height="43.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Поки тепловідвід відводить P швидше, ніж ESR його народжує, петля згасає.</tspan><tspan x="300.0" dy="13.0">Якщо ні — конденсатор закипає, тиск рве корпус. Тому й нормують гранична пульсація</tspan></text>
</svg>