<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як украдена формула обійшла світ</text>
<rect x="42.2" y="71.1" width="139.7" height="57.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="112.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="112.0" dy="0.0">Японія: Rubycon</tspan><tspan x="112.0" dy="13.7">справжній електроліт</tspan><tspan x="112.0" dy="13.7">(серії ZA, ZL)</tspan></text>
<rect x="248.1" y="71.1" width="103.8" height="57.8" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Китай: інженер</tspan><tspan x="300.0" dy="13.7">копіює формулу</tspan><tspan x="300.0" dy="13.7">з пам'яті</tspan></text>
<rect x="416.1" y="71.1" width="139.7" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="486.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="486.0" dy="0.0">Тайвань: перебіжчики</tspan><tspan x="486.0" dy="13.7">продають неповну</tspan><tspan x="486.0" dy="13.7">версію дешево</tspan></text>
<rect x="576.1" y="71.1" width="127.7" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">материнські плати,</tspan><tspan x="640.0" dy="13.7">відеокарти, БЖ</tspan><tspan x="640.0" dy="13.7">по світу</tspan></text>
<line x1="185.8" y1="100.0" x2="242.1" y2="100.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="355.9" y1="100.0" x2="410.1" y2="100.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="559.9" y1="100.0" x2="570.1" y2="100.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="393.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">загублені присадки</text>
<text x="563.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ціна нижча — беруть усі</text>
<line x1="60.0" y1="164.0" x2="680.0" y2="164.0" stroke="#e3e6ea" stroke-width="1.2"/>
<rect x="60.0" y="188.0" width="270.0" height="168.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="195.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Чого бракувало в електроліті</text>
<text x="76.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• присадки-пасиватори (фосфати) —</text>
<text x="76.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   тримали міцну плівку оксиду</text>
<text x="76.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• деполяризатори (аміни) —</text>
<text x="76.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   зв'язували зайвий водень</text>
<text x="76.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• правильна кислотність pH ≈ 4</text>
<text x="76.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   (у браку було лужне pH 7–8)</text>
<rect x="394.2" y="184.8" width="151.7" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="203.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">вода роз'їдає алюміній</tspan></text>
<rect x="376.2" y="224.8" width="187.6" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="243.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">росте лише гідроксид Al(OH)₃</tspan></text>
<line x1="470.0" y1="211.0" x2="470.0" y2="229.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="397.2" y="264.8" width="145.7" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="283.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">виділяється водень H₂</tspan></text>
<line x1="470.0" y1="251.0" x2="470.0" y2="269.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="385.2" y="304.8" width="169.6" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="323.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ESR злітає · газ роздуває</tspan></text>
<line x1="470.0" y1="291.0" x2="470.0" y2="309.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="397.2" y="336.8" width="145.7" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="355.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">банка пухне й рветься</tspan></text>
<line x1="470.0" y1="331.0" x2="470.0" y2="341.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>