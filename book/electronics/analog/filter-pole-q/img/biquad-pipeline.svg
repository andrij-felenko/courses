<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 441" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="441" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пара полюсів (f0, Q, fs)  →  5 коефіцієнтів біквада</text>
<rect x="95.0" y="55.0" width="110.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="150.0" dy="0.0">f0</tspan><tspan x="150.0" dy="16.9">(частота)</tspan></text>
<rect x="295.0" y="55.0" width="130.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="360.0" dy="0.0">Q</tspan><tspan x="360.0" dy="16.9">(добротність)</tspan></text>
<rect x="500.0" y="55.0" width="140.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="570.0" dy="0.0">fs</tspan><tspan x="570.0" dy="16.9">(дискретизація)</tspan></text>
<line x1="150.0" y1="102.0" x2="250.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="102.0" x2="470.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="148.0" width="260.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">ω₀ = 2·π·f0 / fs</tspan></text>
<line x1="330.0" y1="186.0" x2="250.0" y2="224.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="225.1" width="180.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">cw = cos ω₀</tspan><tspan x="210.0" dy="16.9">sw = sin ω₀</tspan></text>
<path d="M 360 102 C 480 150, 530 205, 510 232" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="415.0" y="225.1" width="200.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="515.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="515.0" dy="0.0">α = sw / (2·Q)</tspan><tspan x="515.0" dy="16.9">↑ уся Q тут</tspan></text>
<line x1="210.0" y1="274.0" x2="290.0" y2="312.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="515.0" y1="274.0" x2="440.0" y2="312.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="125.0" y="309.1" width="470.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">b0=(1−cw)/2   b1=1−cw   b2=(1−cw)/2</tspan><tspan x="360.0" dy="16.9">a0=1+α    a1=−2cw    a2=1−α</tspan></text>
<line x1="360.0" y1="362.0" x2="360.0" y2="388.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
