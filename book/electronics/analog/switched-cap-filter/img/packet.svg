<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому виходить опір 1 / (f·C)</text>
<rect x="68.0" y="102.0" width="44.0" height="36.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="90.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ΔQ</text>
<line x1="114.0" y1="120.0" x2="216.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="218.0" y="102.0" width="44.0" height="36.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="240.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ΔQ</text>
<line x1="264.0" y1="120.0" x2="366.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="368.0" y="102.0" width="44.0" height="36.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ΔQ</text>
<text x="500.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="start">…</text>
<line x1="60.0" y1="176.0" x2="430.0" y2="176.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="90.0" y1="171.0" x2="90.0" y2="181.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="240.0" y1="171.0" x2="240.0" y2="181.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="390.0" y1="171.0" x2="390.0" y2="181.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="165.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">1 такт = 1/f</text>
<text x="315.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">1 такт = 1/f</text>
<text x="470.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один пакет:</text>
<rect x="415.7" y="101.5" width="108.7" height="33.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ΔQ = C · ΔU</tspan></text>
<text x="470.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">за секунду f пакетів:</text>
<rect x="383.4" y="175.5" width="173.1" height="33.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">I = f · ΔQ = f·C·ΔU</tspan></text>
<text x="470.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">опір = ΔU / I:</text>
<rect x="399.6" y="249.5" width="140.9" height="33.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="270.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">R = 1 / (f · C)</tspan></text>
<text x="330.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Більший такт f або більший C → дрібніший «крок» опору → менший еквівалентний R</text>
</svg>