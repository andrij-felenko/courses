<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Суперузол у три кроки</text>
<rect x="30.0" y="70.0" width="200.0" height="150.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="56.0" cy="96.0" r="15.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="56.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="144.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Упізнати</text>
<text x="130.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">джерело напруги E</tspan><tspan x="130.0" dy="15.6">між двома НЕ-земляними</tspan><tspan x="130.0" dy="15.6">вузлами (плаває)</tspan></text>
<line x1="235.0" y1="145.0" x2="255.0" y2="145.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="260.0" y="70.0" width="200.0" height="150.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<circle cx="286.0" cy="96.0" r="15.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="286.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="374.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Обвести й скласти</text>
<text x="360.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">один баланс струмів</tspan><tspan x="360.0" dy="15.6">для всієї межі —</tspan><tspan x="360.0" dy="15.6">лише гілки крізь неї</tspan></text>
<line x1="465.0" y1="145.0" x2="485.0" y2="145.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="490.0" y="70.0" width="200.0" height="150.0" rx="12" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<circle cx="516.0" cy="96.0" r="15.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="516.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="604.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Додати обмеження</text>
<text x="590.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">рівняння джерела</tspan><tspan x="590.0" dy="15.6">V_a − V_b = E</tspan><tspan x="590.0" dy="15.6">(знак за полярністю)</tspan></text>
<text x="360.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дві невідомі (V_a, V_b) — два рівняння: баланс суперузла + обмеження джерела</text>
</svg>