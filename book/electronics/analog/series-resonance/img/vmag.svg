<line x1="90.0" y1="280.0" x2="90.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="280.0" x2="560.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="82.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">напруга</text>
<rect x="145.0" y="258.2" width="70.0" height="21.8" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<text x="180.0" y="248.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">U</text>
<text x="180.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вхід  U</text>
<rect x="295.0" y="106.0" width="70.0" height="174.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="330.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Q·U</text>
<text x="330.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">на котушці  U_L</text>
<rect x="425.0" y="106.0" width="70.0" height="174.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<text x="460.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Q·U</text>
<text x="460.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">на конд.  U_C</text>
<line x1="90.0" y1="258.2" x2="560.0" y2="258.2" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 5"/>
<text x="560.0" y="252.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">рівень входу</text>
<rect x="210.9" y="59.0" width="258.3" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="78.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Q = 8 → на L і на C по 8·U,</tspan><tspan x="340.0" dy="14.3">хоч джерело дає лише U.</tspan><tspan x="340.0" dy="14.3">Гасяться між собою — назовні нуль,</tspan><tspan x="340.0" dy="14.3">але нарізно кожна РЕАЛЬНА й небезпечна</tspan></text>
<text x="330.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Резонанс напруг: струм-пік на малому R дає на реактивностях напругу в Q разів більшу за вхідну</text>
</svg>