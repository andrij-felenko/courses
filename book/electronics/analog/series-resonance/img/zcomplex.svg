<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 670 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="670" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="210.0" y1="230.0" x2="500.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="250.0" y1="380.0" x2="250.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="496.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">Re  (опір R)</text>
<text x="260.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Im  (реактивність X)</text>
<text x="260.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">+j: індуктивне</text>
<text x="260.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">−j: ємнісне</text>
<line x1="250.0" y1="230.0" x2="400.0" y2="230.0" stroke="#d7dadf" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="325.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">R</text>
<line x1="250.0" y1="230.0" x2="400.0" y2="350.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<circle cx="400.0" cy="350.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="408.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Z = R − jXc</text>
<line x1="250.0" y1="230.0" x2="400.0" y2="230.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<circle cx="400.0" cy="230.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="408.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Z = R</text>
<text x="408.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">|Z| = R (мінімум)</text>
<line x1="250.0" y1="230.0" x2="400.0" y2="110.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<circle cx="400.0" cy="110.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="408.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Z = R + jXL</text>
<line x1="400.0" y1="102.0" x2="400.0" y2="358.0" stroke="#c7ccd2" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="400.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кінець Z ковзає тут</text>
<rect x="37.0" y="7.3" width="346.0" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="26.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Частота міняє ЛИШЕ уявну частину; дійсна = R завжди.</tspan><tspan x="210.0" dy="14.3">Резонанс — мить, коли фазор лягає на дійсну вісь.</tspan></text>
<text x="330.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Z = R + j(XL − Xc): кінець фазора ковзає вертикаллю Re = R; на f₀ уявна частина нуль — найкоротший фазор</text>
</svg>