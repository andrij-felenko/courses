<text x="380.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">180° між ними → однакові за модулем, протилежні за знаком</text>
<text x="380.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">H_ФНЧ(f₀) + H_ФВЧ(f₀) = 0</text>
