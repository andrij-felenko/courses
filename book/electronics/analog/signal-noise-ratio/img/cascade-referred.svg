<rect x="83.2" y="418.2" width="553.5" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="438.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Шум каскаду, зведений до входу, ділиться на ДОБУТОК підсилень усіх попередніх.</tspan><tspan x="360.0" dy="15.6">Перший каскад не поділений нічим — його шум домінує над усім трактом.</tspan></text>
