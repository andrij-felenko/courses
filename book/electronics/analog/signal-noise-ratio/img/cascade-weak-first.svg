<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому слабке підсилення першого каскаду пропускає шум другого</text>
<rect x="150.0" y="242.0" width="70.0" height="8.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="185.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">n₂ / G₁</text>
<text x="185.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сильний 1-й каскад</text>
<text x="185.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">G₁ = 100</text>
<rect x="435.0" y="182.0" width="70.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="470.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">n₂ / G₁</text>
<text x="470.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">слабкий 1-й каскад</text>
<text x="470.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">G₁ = 3</text>
<line x1="120.0" y1="250.0" x2="560.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="340.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(той самий каскад 2: n₂ однаковий)</text>
<rect x="69.8" y="321.2" width="560.4" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="341.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Шум другого каскаду доходить до входу як n₂ / G₁. Сильне G₁ топить його в нуль;</tspan><tspan x="350.0" dy="15.6">слабке G₁ майже не давить — шум другого пролазить у підсумковий SNR.</tspan></text>
</svg>