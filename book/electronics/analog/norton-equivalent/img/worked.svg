<text x="488.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">I_n = струм КЗ через клеми A–землю:</text>
<text x="500.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">R₂ закорочена → I_n = 12 / R₁</text>
<text x="500.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">= 12 / 6 = 2 А</text>
<line x1="488.0" y1="192.0" x2="772.0" y2="192.0" stroke="#e0e3e6" stroke-width="1.2"/>
<text x="488.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">R_n = R_th (джерело → КЗ):</text>
<text x="500.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">R₁ ∥ R₂ = 6∥3 = 2 Ω</text>
<line x1="488.0" y1="248.0" x2="772.0" y2="248.0" stroke="#e0e3e6" stroke-width="1.2"/>
<text x="488.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Перевірка: V_oc = I_n·R_n</text>
<text x="500.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">= 2·2 = 4 В = напруга х.х.  ✓</text>
<text x="630.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Нортон:  2 А  ∥  2 Ω</text>
<text x="410.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Готовий еквівалент Нортона:</text>
