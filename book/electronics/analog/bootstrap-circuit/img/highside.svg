<line x1="292.0" y1="170.0" x2="292.0" y2="225.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="292.0" y1="225.0" x2="430.0" y2="225.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="262.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end"><tspan x="262.0" dy="0.0">VB живить</tspan><tspan x="262.0" dy="14.3">драйвер верху</tspan></text>
<line x1="280.0" y1="182.0" x2="404.0" y2="144.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="90.0" width="210.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="625.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Фаза 1: низ увімкнено,</tspan><tspan x="625.0" dy="15.6">SW = 0. Db проводить,</tspan><tspan x="625.0" dy="15.6">Cb заряджається до Vcc</tspan><tspan x="625.0" dy="15.6">знизу (як батарейка).</tspan></text>
<rect x="520.0" y="230.0" width="210.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="625.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Фаза 2: верх увімкнено,</tspan><tspan x="625.0" dy="15.6">SW злітає до +V. Cb їде</tspan><tspan x="625.0" dy="15.6">разом, тож VB = +V + Vcc —</tspan><tspan x="625.0" dy="15.6">керування над шиною. Db</tspan><tspan x="625.0" dy="15.6">замкнено, Cb тримає заряд.</tspan></text>
</svg>