<line x1="430.0" y1="330.0" x2="430.0" y2="380.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="430.0" y1="180.0" x2="430.0" y2="270.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="430.0" cy="225.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="444.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">SW (виток верху)</text>
<text x="444.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стрибає 0 → +V</text>
<line x1="150.0" y1="70.0" x2="150.0" y2="110.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="150.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Vcc</text>
<path d="M 140 118 L 140 142 L 160 130 z" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
