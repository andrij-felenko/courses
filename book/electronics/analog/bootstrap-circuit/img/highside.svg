<line x1="150.0" y1="110.0" x2="150.0" y2="118.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="150.0" y1="142.0" x2="150.0" y2="170.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="150.0" y1="170.0" x2="280.0" y2="170.0" stroke="#27ae60" stroke-width="2.0"/>
