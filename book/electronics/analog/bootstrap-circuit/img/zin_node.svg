<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому видимий опір = R/(1−A): рахуємо струм крізь R</text>
<circle cx="150.0" cy="170.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="150.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">вхід (база)</text>
<text x="150.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">u</text>
<line x1="150.0" y1="170.0" x2="150.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="150.0" cy="288.0" r="28.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="150.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">~</text>
<text x="150.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">джерело сигналу</text>
<line x1="150.0" y1="170.0" x2="245.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="245.0" y="154.0" width="90.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="290.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<line x1="335.0" y1="170.0" x2="530.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="530.0" cy="170.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="530.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">вузол M (низ дільника)</text>
<text x="530.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">A·u</text>
<line x1="530.0" y1="170.0" x2="530.0" y2="240.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="514.0" y1="240.0" x2="546.0" y2="240.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="514.0" y1="252.0" x2="546.0" y2="252.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="554.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Cb</text>
<line x1="530.0" y1="252.0" x2="530.0" y2="295.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="530.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="530.0" dy="0.0">копія виходу</tspan><tspan x="530.0" dy="14.3">≈ A·u</tspan></text>
<text x="340.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">на R падає лише</text>
<text x="340.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">u − A·u = u·(1−A)</text>
<rect x="250.0" y="232.0" width="230.0" height="78.0" rx="6" fill="#f0fbf4" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="251.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">i = u·(1−A) / R</tspan><tspan x="365.0" dy="15.6">Z = u / i = R / (1−A)</tspan><tspan x="365.0" dy="15.6">кінці майже рівні → i крихітний</tspan><tspan x="365.0" dy="15.6">→ опір здається величезним</tspan></text>
</svg>