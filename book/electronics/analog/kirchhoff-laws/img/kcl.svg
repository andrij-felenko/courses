<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="600" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="300.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон струмів: вузол нічого не накопичує</text>
<circle cx="300.0" cy="175.0" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="316.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">вузол</text>
<line x1="150.0" y1="105.0" x2="290.0" y2="169.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="150.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">I₁ = 3 A</text>
<line x1="150.0" y1="245.0" x2="290.0" y2="181.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="150.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">I₂ = 2 A</text>
<line x1="310.0" y1="169.0" x2="450.0" y2="95.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="450.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">I₃ = 4 A</text>
<line x1="310.0" y1="177.0" x2="455.0" y2="183.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="465.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">I₄ = 1 A</text>
<rect x="50.6" y="279.0" width="498.8" height="32.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="300.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">втікло  I₁ + I₂ = 3 + 2 = 5 A     =     витекло  I₃ + I₄ = 4 + 1 = 5 A</tspan></text>
<text x="300.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у вузлі нема куди зникнути заряду — баланс точний у кожну мить</text>
</svg>