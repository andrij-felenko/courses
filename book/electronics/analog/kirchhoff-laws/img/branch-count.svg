<text x="210.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">b = 3 гілки  →  3 невідомі струми</text>
<rect x="410.0" y="90.0" width="200.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="112.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">n − 1 = 1</tspan><tspan x="510.0" dy="16.9">рівняння KCL</tspan></text>
<text x="510.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(по одному на кожен</text>
<text x="510.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вузол, крім останнього)</text>
