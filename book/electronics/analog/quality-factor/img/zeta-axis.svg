<text x="818.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ζ</text>
<rect x="70.0" y="120.0" width="304.2" height="30.0" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/>
<rect x="374.2" y="120.0" width="425.8" height="30.0" rx="0" fill="#eef6ef" stroke="none" stroke-width="0"/>
<text x="222.1" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ζ &lt; 1  недогасований (дзвенить)</text>
<text x="587.1" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ζ &gt; 1  перегасований</text>
