<circle cx="374.2" cy="150.0" r="6.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="374.2" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">↑ критичне демпфування — межа дзвону</text>
<text x="285.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="italic">ζ = 1/√2 ≈ 0.707 → Q ≈ 0.71: «максимально пласка» межа (АЧХ, §2.4)</text>
<rect x="70.0" y="274.0" width="740.0" height="44.0" rx="8" fill="#fff" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="440.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ζ = 1 / (2Q)        Q = 1 / (2ζ)        Q = 1 → ζ = 0.5</text>
<text x="440.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">висока Q (гострий резонанс, §2.3.6) = мале ζ (слабке демпфування, довгий дзвін)</text>
