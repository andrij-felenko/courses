<rect x="126.9" y="462.4" width="526.2" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="482.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Кожен щабель прибирає рівно одну ваду попереднього: округлення — зміщення,</tspan><tspan x="390.0" dy="15.6">дизер — кореляцію на тихому, формування — шум із корисної смуги. Модель</tspan><tspan x="390.0" dy="15.6">усюди та сама: q = x + e; ми лише міняємо, яким зробити e.</tspan></text>
