<rect x="55.4" y="404.4" width="649.3" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Тепловий шум — стихія: його середньоквадратичне значення диктують температура й опір,</tspan><tspan x="380.0" dy="15.6">форма спектра фіксована, відняти його не можна. Шум квантування народжується з чіткої</tspan><tspan x="380.0" dy="15.6">операції округлення — тому ним КЕРУЮТЬ: дизером тримають білим, формуванням женуть із смуги.</tspan></text>
