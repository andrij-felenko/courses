<rect x="96.4" y="390.4" width="567.2" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="410.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Округлили — і те, що зрізали (похибку округлення e), не викидаємо, а тримаємо й</tspan><tspan x="380.0" dy="15.6">додаємо до наступного відліку перед округленням. Різниця сусідніх похибок гасить</tspan><tspan x="380.0" dy="15.6">низькі частоти: шум спливає вгору, у смузі сигналу його майже не лишається.</tspan></text>
</svg>