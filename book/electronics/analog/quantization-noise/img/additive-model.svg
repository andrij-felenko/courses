<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квантувач як «сигнал + джерело шуму»: q = x + e</text>
<text x="190.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як воно є: округлення до рівнів</text>
<line x1="70.0" y1="120.0" x2="130.0" y2="120.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="110.0" y1="120.0" x2="132.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="78.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">x (неперервний)</text>
<rect x="132.0" y="86.0" width="96.0" height="68.0" rx="6" fill="#eef0f2" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="180.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">Q</text>
<text x="180.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">квантувач</text>
<line x1="228.0" y1="120.0" x2="310.0" y2="120.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="288.0" y1="120.0" x2="312.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="316.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">q (на рівнях)</text>
<text x="380.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#6b7280" text-anchor="middle" font-weight="700">≡</text>
<text x="570.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як це рахувати: q = x + e</text>
<line x1="470.0" y1="120.0" x2="536.0" y2="120.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="466.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">x</text>
<circle cx="554.0" cy="120.0" r="16.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="554.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<line x1="530.0" y1="120.0" x2="538.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="494.0" y="178.0" width="120.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="554.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">джерело шуму e</text>
<text x="554.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">рівн. ±q/2, біле</text>
<line x1="554.0" y1="178.0" x2="554.0" y2="136.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="554.0" y1="158.0" x2="554.0" y2="136.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="120.0" x2="650.0" y2="120.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="628.0" y1="120.0" x2="652.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="656.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">q</text>
<line x1="120.0" y1="300.0" x2="656.0" y2="300.0" stroke="#6b7280" stroke-width="1.3"/>
<line x1="120.0" y1="258.0" x2="120.0" y2="342.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="112.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">e</text>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">час →</text>
<line x1="120.0" y1="266.0" x2="640.0" y2="266.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="120.0" y1="334.0" x2="640.0" y2="334.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="646.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">+q/2</text>
<text x="646.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">−q/2</text>
<path d="M120.0 296.8 L135.0 304.1 L150.0 328.8 L165.0 297.7 L180.0 300.5 L195.0 305.9 L210.0 278.6 L225.0 300.8 L240.0 308.8 L255.0 319.9 L270.0 272.4 L285.0 286.6 L300.0 272.2 L315.0 321.1 L330.0 313.2 L345.0 268.8 L360.0 332.8 L375.0 331.6 L390.0 310.5 L405.0 307.9 L420.0 276.7 L435.0 267.0 L450.0 301.9 L465.0 270.0 L480.0 278.9 L495.0 282.5 L510.0 268.0 L525.0 297.5 L540.0 296.0 L555.0 323.3 L570.0 301.3 L585.0 309.5 L600.0 300.0 L615.0 311.0 L630.0 297.1" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="380.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">похибка e стрибає в межах ±q/2 безсистемно — це й є шум</text>
<rect x="103.2" y="400.4" width="553.5" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Той самий квантувач — два погляди. Зліва: округлення до рівнів (як воно діє).</tspan><tspan x="380.0" dy="15.6">Справа: сигнал плюс окреме джерело шуму e = q − x (як це рахувати). За жвавого</tspan><tspan x="380.0" dy="15.6">сигналу e рівномірна на ±q/2 й некорельована — тобто біла: модель точна.</tspan></text>
</svg>