<circle cx="360.0" cy="80.0" r="3.2" fill="#1a1a1a"/>
<line x1="330.0" y1="142.0" x2="330.0" y2="198.0" stroke="#1a1a1a" stroke-width="3.0"/><line x1="300.0" y1="170.0" x2="330.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="330.0" y1="151.0" x2="360.0" y2="132.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="360.0" y1="132.0" x2="360.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0"/><path d="M358.0 132.0 L346.0 143.0 L347.0 154.0 z" fill="#1a1a1a"/><line x1="330.0" y1="189.0" x2="360.0" y2="208.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="360.0" y1="208.0" x2="360.0" y2="232.0" stroke="#1a1a1a" stroke-width="2.0"/><text x="390.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">PNP</text>
<line x1="360.0" y1="232.0" x2="360.0" y2="246.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="337.0" y="253.0" width="46.0" height="34.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">навантаж.</text>
<line x1="360.0" y1="287.0" x2="360.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="360.0" y1="360.0" x2="360.0" y2="367.0" stroke="#1a1a1a" stroke-width="1.8"/><line x1="346.0" y1="367.0" x2="374.0" y2="367.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="352.0" y1="372.0" x2="368.0" y2="372.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="357.0" y1="377.0" x2="363.0" y2="377.0" stroke="#1a1a1a" stroke-width="1.8"/><text x="360.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND</text>
<text x="374.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">емітер = +12 В</text>
<rect x="221.0" y="162.0" width="38.0" height="16.0" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="240.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Rб</text>
<line x1="259.0" y1="170.0" x2="300.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="170.0" y1="170.0" x2="221.0" y2="170.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="166.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">МК</text>
<text x="240.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">база PNP</text>
<rect x="560.0" y="70.0" width="280.0" height="300.0" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="700.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">PNP відкритий, поки база &lt; +11.3 В</text>
<rect x="572.0" y="106.0" width="256.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle"><tspan x="700.0" dy="0.0">МК = 3.3 В (високий):</tspan><tspan x="700.0" dy="14.3">база ≈ 3.3 В &lt;&lt; 12 В → перехід</tspan><tspan x="700.0" dy="14.3">відкритий → PNP ВВІМКНЕНО</tspan></text>
<rect x="572.0" y="164.0" width="256.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="178.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle"><tspan x="700.0" dy="0.0">МК = 0 В (низький):</tspan><tspan x="700.0" dy="14.3">база ще нижче → перехід</tspan><tspan x="700.0" dy="14.3">відкритий → PNP ВВІМКНЕНО</tspan></text>
<rect x="572.0" y="222.0" width="256.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="236.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle"><tspan x="700.0" dy="0.0">вивід Hi-Z (відпущено):</tspan><tspan x="700.0" dy="14.3">підтягувань до 12 В нема →</tspan><tspan x="700.0" dy="14.3">база «висить» внизу → ВВІМКНЕНО</tspan></text>
<rect x="572.0" y="280.0" width="256.0" height="54.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="296.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f6e33" text-anchor="middle"><tspan x="700.0" dy="0.0">ЩОБ ЗАКРИТИ: базу треба підняти</tspan><tspan x="700.0" dy="14.3">до +12 В (зрівняти з емітером).</tspan><tspan x="700.0" dy="14.3">МК туди не дістає → не може.</tspan></text>
<text x="430.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Логіка ходить 0…3.3 В, а закрити PNP можна лише підтягнувши базу до 12 В — звідси потрібен перекладач рівня.</text>
</svg>