<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600">
<rect width="880" height="600" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: як навчилися «ловити» одну частоту</text>
<text x="440.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від гойдалки до налаштованого радіо (сірим — кількісний зміст Розділу 9)</text>
<line x1="220.0" y1="96.0" x2="220.0" y2="570.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="220.0" cy="126.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="198.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">здавна</text>
<text x="246.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Механічний резонанс</text>
<text x="246.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Гойдалка, камертон, келих — відгук лише на «свою» ноту</text>
<circle cx="220.0" cy="209.2" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="198.0" y="214.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1842</text>
<text x="246.0" y="206.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Генрі / Henry</text>
<text x="246.0" y="226.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Розряд лейденської банки СМИКАЄТЬСЯ туди-сюди — він коливальний</text>
<circle cx="220.0" cy="292.4" r="10.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<circle cx="220.0" cy="292.4" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="198.0" y="297.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1853</text>
<text x="246.0" y="289.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Кельвін / Kelvin</text>
<text x="246.0" y="309.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Довів: коло L+C гойдається з частотою, заданою L і C</text>
<circle cx="220.0" cy="375.6" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="198.0" y="380.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1887</text>
<text x="246.0" y="372.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Герц / Hertz</text>
<text x="246.0" y="392.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Резонансний приймач озивається лише в резонансі з передавачем</text>
<circle cx="220.0" cy="458.8" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="198.0" y="463.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1900</text>
<text x="246.0" y="455.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Лодж, Марконі</text>
<text x="246.0" y="475.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Налаштовані контури → кожна станція на своїй частоті</text>
<rect x="212.0" y="534.0" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="198.0" y="547.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Розділ 9</text>
<text x="246.0" y="539.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Реактивність і резонанс</text>
<text x="246.0" y="559.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Чому опір C і L залежить від частоти; f₀; добротність</text>
</svg>
