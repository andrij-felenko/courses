<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільна ділянка vs одна точка («зірка»)</text>
<text x="200.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ланцюжком — є спільна ділянка</text>
<line x1="70.0" y1="250.0" x2="330.0" y2="250.0" stroke="#2457d6" stroke-width="3.0"/>
<rect x="95.0" y="134.0" width="70.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">A</tspan></text>
<line x1="130.0" y1="166.0" x2="130.0" y2="250.0" stroke="#c0392b" stroke-width="2.4"/>
<rect x="235.0" y="134.0" width="70.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">B</tspan></text>
<line x1="270.0" y1="166.0" x2="270.0" y2="250.0" stroke="#27ae60" stroke-width="2.4"/>
<polyline points="70.0,250.0 85.0,257.0 100.0,243.0 115.0,257.0 130.0,250.0" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linejoin="round"/>
<text x="100.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Rспільн</text>
<line x1="140.0" y1="258.0" x2="80.0" y2="258.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="165.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">струм B тече крізь Rспільн → шум у A</text>
<line x1="70.0" y1="250.0" x2="70.0" y2="256.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="62.0" y1="256.0" x2="78.0" y2="256.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="400.0" y1="50.0" x2="400.0" y2="330.0" stroke="#dddddd" stroke-width="1.2"/>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">зіркою — спільна лише точка</text>
<circle cx="600.0" cy="250.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="600.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">одна точка землі</text>
<rect x="485.0" y="134.0" width="70.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">A</tspan></text>
<line x1="520.0" y1="166.0" x2="600.0" y2="250.0" stroke="#c0392b" stroke-width="2.4"/>
<rect x="645.0" y="134.0" width="70.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">B</tspan></text>
<line x1="680.0" y1="166.0" x2="600.0" y2="250.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="600.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">жодної спільної ділянки → струми не змішуються</text>
</svg>