<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний зворотний провід: чужий струм піднімає твою «землю»</text>
<rect x="45.0" y="72.3" width="150.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">гучне коло</tspan><tspan x="120.0" dy="14.3">(великий струм)</tspan></text>
<rect x="45.0" y="152.3" width="150.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">наш сигнал</tspan><tspan x="120.0" dy="14.3">(слабкий)</tspan></text>
