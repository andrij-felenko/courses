<line x1="470.0" y1="305.0" x2="470.0" y2="347.4" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3 3"/>
<rect x="395.0" y="347.4" width="150.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">потенціал N = I·R</tspan><tspan x="470.0" dy="14.3">(а не 0!)</tspan></text>
<rect x="120.0" y="392.0" width="560.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="414.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Тихий приймач міряє свій сигнал ВІД вузла N → дістає сигнал + I·R. Чужий струм підмішався в наш — хоча проводи нібито нарізно.</tspan></text>
