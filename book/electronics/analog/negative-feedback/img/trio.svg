<text x="360.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Блек дав підсилювач, Найквіст — коли він не зірветься в генерацію, Боде — як його розрахувати.</text>
