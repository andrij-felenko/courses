<rect x="430.0" y="175.0" width="250.0" height="60.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="555.0" y="201.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">РІЗНИЦЯ:</tspan><tspan x="555.0" dy="16.2">A − B  не змінилась (δ−δ=0)</tspan></text>
<text x="555.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сигнал у різниці — цілий; завада — у спільному</text>
