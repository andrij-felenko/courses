<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лік від перевороту: послідовний резистор + діодні фіксатори на рейки</text>
<circle cx="70.0" cy="170.0" r="24.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="70.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Uвх</text>
<text x="70.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">може вилізти за рейки</text>
<line x1="94.0" y1="170.0" x2="130.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="130.0" y="159.0" width="100.0" height="22.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="180.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rпосл</text>
<text x="180.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 кОм</text>
<line x1="230.0" y1="170.0" x2="460.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="330.0" cy="170.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="330.0" y1="170.0" x2="330.0" y2="75.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="330.0" y1="170.0" x2="330.0" y2="265.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="270.0" y1="75.0" x2="390.0" y2="75.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="396.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">V+</text>
<line x1="270.0" y1="265.0" x2="390.0" y2="265.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="396.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">V−</text>
<path d="M323.0 113.5 L337.0 113.5 L330.0 131.5 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><line x1="322.0" y1="131.5" x2="338.0" y2="131.5" stroke="#333333" stroke-width="2.0"/>
<path d="M323.0 226.5 L337.0 226.5 L330.0 208.5 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><line x1="322.0" y1="208.5" x2="338.0" y2="208.5" stroke="#333333" stroke-width="2.0"/>
<text x="318.0" y="126.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">D1</text>
<text x="318.0" y="221.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">D2</text>
<path d="M460.0 136.0 L460.0 204.0 L530.0 170.0 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="482.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОП</text>
<line x1="530.0" y1="170.0" x2="580.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="556.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вихід</text>
<text x="330.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">вхід полізе вище V+ → D1 відкрився, тримає</text>
<text x="330.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">полізе нижче V− → D2 відкрився, тримає</text>
<rect x="38.8" y="308.2" width="642.4" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Резистор обмежує струм, діоди D1/D2 не пускають вузол за рейки — вхід ОП лишається у вікні.</tspan><tspan x="360.0" dy="15.6">Перевага: дешево й надійно. Часто простіше взяти ОП, у якому захист уже всередині.</tspan></text>
</svg>