<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синфазне вікно: вузька смуга між рейками, де ОП ще «при тямі»</text>
<rect x="175.0" y="70.0" width="150.0" height="290.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<line x1="155.0" y1="70.0" x2="345.0" y2="70.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="351.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">V+  (верхня рейка)</text>
<line x1="155.0" y1="360.0" x2="345.0" y2="360.0" stroke="#2457d6" stroke-width="2.6"/>
<text x="351.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">V−  (нижня рейка)</text>
<rect x="175.0" y="125.0" width="150.0" height="165.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="175.0" y1="125.0" x2="325.0" y2="125.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="175.0" y1="290.0" x2="325.0" y2="290.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="250.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">СИНФАЗНЕ</text>
<text x="250.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ВІКНО</text>
<text x="250.0" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тут ОП працює</text>
<text x="250.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">надто близько до V+</text>
<text x="250.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">каскад глухне → переворот</text>
<text x="250.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">нижче V− (навіть на 0.3 В)</text>
<text x="250.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">паразитний діод → переворот</text>
<line x1="333.0" y1="207.5" x2="347.0" y2="207.5" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="360.9" y="184.8" width="164.2" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="443.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="443.0" dy="0.0">вихід стежить за входом</tspan><tspan x="443.0" dy="14.3">(правильний знак)</tspan></text>
<rect x="1.4" y="374.2" width="697.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Синфазна напруга — це «де посередині» сидять ОБИДВА входи. Доки вона в зеленому вікні —</tspan><tspan x="350.0" dy="15.6">усе гаразд. Вилізла за межу (до будь-якої рейки) — вхідний каскад зривається й знак перевертається.</tspan></text>
</svg>