<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтез тактового дерева (CTS) та стробування такту (Clock Gating)</text>
<rect x="40.0" y="70.0" width="130.0" height="65.0" rx="4" fill="#fce8e6" stroke="#c0392b" stroke-width="1.6"/>
<text x="105.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">PLL Синтезатор</text>
<text x="105.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">f = 24 МГц → 3 ГГц</text>
<text x="105.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Низький jitter</text>
<line x1="170.0" y1="102.0" x2="210.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="210.0" cy="102.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="210.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Root Clock</text>
<line x1="210.0" y1="102.0" x2="250.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="250.0" y1="60.0" x2="250.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="243.0" y="95.0" width="14.0" height="14.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="250.0" y1="60.0" x2="310.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="310.0" y1="42.0" x2="310.0" y2="82.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="250.0" y1="160.0" x2="310.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="310.0" y1="142.0" x2="310.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="310.0" y1="42.0" x2="350.0" y2="42.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="82.0" x2="350.0" y2="82.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="142.0" x2="350.0" y2="142.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="310.0" y1="182.0" x2="350.0" y2="182.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="280.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтез H-дерева вирівнює затримки:</text>
<text x="280.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Clock Skew = t_clk2 − t_clk1 ≈ 0 пс</text>
<rect x="370.0" y="50.0" width="350.0" height="240.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="545.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Комірка тактового стробування (Integrated Clock Gating, ICG)</text>
<rect x="390.0" y="100.0" width="100.0" height="60.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="440.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Latch (Засувка)</text>
<text x="440.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Прозора при CLK=0</text>
<text x="440.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Замикає при CLK=1</text>
<line x1="350.0" y1="120.0" x2="390.0" y2="120.0" stroke="#1e7e34" stroke-width="1.8"/>
<text x="345.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="end" font-weight="700">Enable</text>
<line x1="350.0" y1="148.0" x2="390.0" y2="148.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="345.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">CLK_in</text>
<line x1="490.0" y1="120.0" x2="530.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="370.0" y1="195.0" x2="510.0" y2="195.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="510.0" y1="195.0" x2="530.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.6"/>
<polygon points="530,110 560,110 575,130 560,150 530,150" fill="#dbeafe" stroke="#2457d6" stroke-width="1.6"/>
<text x="548.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">AND</text>
<line x1="575.0" y1="130.0" x2="625.0" y2="130.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="630.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Gated_CLK</text>
<rect x="630.0" y="160.0" width="80.0" height="40.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="670.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Регістри</text>
<line x1="615.0" y1="130.0" x2="615.0" y2="180.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="615.0" y1="180.0" x2="630.0" y2="180.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="545.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Засувка блокує перемикання сигналу Enable під час високого рівня CLK,</text>
<text x="545.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">що повністю виключає появу небезпечних паразитних імпульсів (glitches).</text>
<text x="380.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Clock gating вимикає динамічне перезаряджання ємностей P = C·V²·f у простійних функціональних блоках,</text>
<text x="380.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">економлячи до 30–50% динамічної потужності кристала без втрати стану регістрів.</text>
</svg>