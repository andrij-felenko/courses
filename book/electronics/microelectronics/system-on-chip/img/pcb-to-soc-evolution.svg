<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція обчислювальних систем: від розсипу мікросхем до монолітного SoC</text>
<rect x="40.0" y="65.0" width="210.0" height="260.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/>
<text x="145.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1980-ті: Дискретна плата</text>
<line x1="55.0" y1="101.0" x2="235.0" y2="101.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="145.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Друкована плата (PCB)</text>
<text x="145.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Окремий CPU (напр. Z80 / 8086)</text>
<text x="145.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">Окремий контролер ОЗП</text>
<text x="145.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Окремий UART / периферія</text>
<text x="145.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Логіка узгодження 74-серії</text>
<text x="145.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Десятки мікросхем на платі</text>
<text x="145.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Шини: 10–20 пФ на доріжку</text>
<text x="145.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Затримки: десятки наносекунд</text>
<rect x="275.0" y="65.0" width="210.0" height="260.0" rx="6" fill="#f0fdf4" stroke="#1e7e34" stroke-width="1.8"/>
<text x="380.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7e34" text-anchor="middle" font-weight="700">1990-ті: Мікроконтролери</text>
<line x1="290.0" y1="101.0" x2="470.0" y2="101.0" stroke="#1e7e34" stroke-width="1.0"/>
<text x="380.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="middle" font-weight="700">Перша інтеграція на кристалі</text>
<text x="380.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CPU + Flash + SRAM разом</text>
<text x="380.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Прості периферійні таймери/IO</text>
<text x="380.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Загальна розділена шина</text>
<text x="380.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Обмежена потужність (МГц)</text>
<text x="380.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="middle" font-weight="700">Прорив у вбудованих системах</text>
<text x="380.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Низька собівартість</text>
<text x="380.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Однорідний техпроцес</text>
<rect x="510.0" y="65.0" width="210.0" height="260.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="615.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2000-ні–2020-ті: Гетерогенний SoC</text>
<line x1="525.0" y1="101.0" x2="705.0" y2="101.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="615.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Повна гетерогенна система</text>
<text x="615.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">CPU + GPU + NPU + DDR PHY</text>
<text x="615.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Аналогові PLL, RF-радіо, ADC</text>
<text x="615.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle">Мережа NoC: терабайт/с</text>
<text x="615.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="middle">Мультидоменне DVFS</text>
<text x="615.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Мільярди транзисторів</text>
<text x="615.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Шина на кристалі: &lt;0.1 пФ</text>
<text x="615.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="middle">Енергія: &lt;1 пДж / біт</text>
<line x1="252.0" y1="180.0" x2="273.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="487.0" y1="180.0" x2="508.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Інтеграція на єдиному кристалі скоротила енергію передавання біта у десятки разів і усунула «вузьке горло» виводів</text>
</svg>