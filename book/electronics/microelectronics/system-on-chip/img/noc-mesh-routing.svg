<text x="570.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">T_zero = H · t_r + (H + F − 1) · t_w</text>
<text x="570.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">H = хопи (Manhattan), t_r = такти роутера, F = кількість флітів</text>
<text x="380.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Маршрутизація XY детермінована й позбавлена тупиків (deadlock-free) завдяки суворому порядку осей</text>
