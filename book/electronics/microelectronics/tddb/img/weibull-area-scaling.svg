<svg xmlns="http://www.w3.org/2000/svg" viewBox="-41.36 -10 841.36 431.92" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-41.36" y="-10" width="841.36" height="431.92" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл Вейбула та масштабування площі</text>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл Вейбула та ефект масштабування площі діелектрика</text>
<line x1="110.0" y1="330.0" x2="750.0" y2="330.0" stroke="#333333" stroke-width="2.0"/>
<line x1="110.0" y1="330.0" x2="110.0" y2="70.0" stroke="#333333" stroke-width="2.0"/>
<line x1="740.0" y1="330.0" x2="760.0" y2="330.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="80.0" x2="110.0" y2="60.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="750.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">Час до відмови ln(t)</text>
<text x="95.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">W = ln(−ln(1 − F))</text>
<line x1="110.0" y1="280.0" x2="750.0" y2="280.0" stroke="#e5e7e9" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="100.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">F = 0.01% (100 ppm)</text>
<line x1="110.0" y1="210.0" x2="750.0" y2="210.0" stroke="#e5e7e9" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="100.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">F = 1%</text>
<line x1="110.0" y1="140.0" x2="750.0" y2="140.0" stroke="#e5e7e9" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="100.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">F = 63.2% (W = 0, η)</text>
<line x1="110.0" y1="90.0" x2="750.0" y2="90.0" stroke="#e5e7e9" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="100.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">F = 90%</text>
<line x1="490.0" y1="290.0" x2="690.0" y2="90.0" stroke="#27ae60" stroke-width="2.6"/>
<text x="670.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Одиночний транзистор (A₀)</text>
<circle cx="510.0" cy="270.0" r="4.0" fill="#27ae60" stroke="#145a32" stroke-width="1.2"/>
<circle cx="550.0" cy="230.0" r="4.0" fill="#27ae60" stroke="#145a32" stroke-width="1.2"/>
<circle cx="590.0" cy="190.0" r="4.0" fill="#27ae60" stroke="#145a32" stroke-width="1.2"/>
<circle cx="630.0" cy="150.0" r="4.0" fill="#27ae60" stroke="#145a32" stroke-width="1.2"/>
<circle cx="670.0" cy="110.0" r="4.0" fill="#27ae60" stroke="#145a32" stroke-width="1.2"/>
<line x1="310.0" y1="290.0" x2="510.0" y2="90.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="480.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Весь чіп (Achip = 10⁹ · A₀)</text>
<line x1="590.0" y1="190.0" x2="410.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="396.8" y="146.3" width="206.4" height="37.3" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.2"/><text x="500.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Зсув площі:</tspan><tspan x="500.0" dy="14.3">Δln(t) = (1/β) · ln(Achip / A₀)</tspan></text>
<rect x="493.5" y="229.3" width="273.1" height="41.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="630.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Нахил прямої = β</tspan><tspan x="630.0" dy="14.3">(β ≈ tox / a₀, менший для тонких оксидів)</tspan></text>
<text x="400.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Правило слабкої ланки: більша сумарна площа затворів чіпа різко зменшує час до першого пробою</text>
</svg>