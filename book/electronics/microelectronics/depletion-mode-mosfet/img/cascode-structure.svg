<text x="410.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Силовий каскод: високовольтний GaN (Normally-ON) + кремнієвий MOSFET</text>
<line x1="170.0" y1="55.0" x2="170.0" y2="85.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="170.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стік (+650 В)</text>
