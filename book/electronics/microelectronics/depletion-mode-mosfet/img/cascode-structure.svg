<text x="170.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">GaN HEMT</text>
<text x="170.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Normally-ON</text>
<text x="170.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">650 В, Vth=−5 В</text>
<line x1="145.0" y1="115.0" x2="95.0" y2="115.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="95.0" y1="115.0" x2="95.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="95.0" cy="260.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="85.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">Затвор GaN = 0 В
(жорстко на землі)</text>
<line x1="170.0" y1="140.0" x2="170.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="170.0" cy="170.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="182.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">V_mid</text>
<rect x="145.0" y="200.0" width="50.0" height="50.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="170.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Si MOSFET</text>
<text x="170.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Normally-OFF</text>
<text x="170.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">30 В, Vth=+3 В</text>
<line x1="145.0" y1="225.0" x2="110.0" y2="225.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="110.0" cy="225.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="102.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">Драйвер
0...10 В</text>
<line x1="170.0" y1="250.0" x2="170.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="154.0" y1="275.0" x2="186.0" y2="275.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="160.0" y1="279.0" x2="180.0" y2="279.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="166.0" y1="283.0" x2="174.0" y2="283.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="170.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Витік (Земля 0 В)</text>
<rect x="405.3" y="76.0" width="369.4" height="78.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="92.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Стан 1: Каскод ВИМКНЕНО (Драйвер = 0 В)</tspan><tspan x="590.0" dy="13.0">• Нижній Si MOSFET закритий.</tspan><tspan x="590.0" dy="13.0">• Струм витоку піднімає V_mid до +8 В.</tspan><tspan x="590.0" dy="13.0">• Для GaN: Vgs = 0 − 8 = −8 В ≪ Vth (−5 В) → GaN ЗАКРИВАЄТЬСЯ!</tspan><tspan x="590.0" dy="13.0">• GaN блокує високу напругу 650 В; на Si падає лише 8 В.</tspan></text>
<rect x="405.3" y="202.5" width="369.4" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Стан 2: Каскод УВІМКНЕНО (Драйвер = +5 В)</tspan><tspan x="590.0" dy="13.0">• Нижній Si MOSFET повністю відкритий → V_mid ≈ 0 В.</tspan><tspan x="590.0" dy="13.0">• Для GaN: Vgs = 0 − 0 = 0 В &gt; Vth (−5 В) → GaN ВІДКРИВАЄТЬСЯ!</tspan><tspan x="590.0" dy="13.0">• Обидва ключі проводять струм з мінімальним опором Rds(on).</tspan></text>
<text x="410.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">Каскод перетворює небезпечний normally-on GaN на безпечний normally-off ключ зі стандартним драйвером 0...10 В.</text>
</svg>