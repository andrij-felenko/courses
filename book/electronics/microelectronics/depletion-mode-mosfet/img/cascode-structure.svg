<svg xmlns="http://www.w3.org/2000/svg" viewBox="-82.5 -10 902.5 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-82.5" y="-10" width="902.5" height="370" fill="#ffffff"/>
