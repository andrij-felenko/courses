<text x="640.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">(Static Noise Margin — SNM)</text>
<text x="640.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Геометричне визначення SNM:</tspan><tspan x="640.0" dy="14.9">Сторона НАЙБІЛЬШОГО квадрата,</tspan><tspan x="640.0" dy="14.9">що вписується в пелюстку кривої.</tspan><tspan x="640.0" dy="14.9"></tspan><tspan x="640.0" dy="14.9">1. Hold SNM (режим утримання):</tspan><tspan x="640.0" dy="14.9">• WL = 0 В (ізольовані інвертори)</tspan><tspan x="640.0" dy="14.9">• Максимальний розмір пелюсток</tspan><tspan x="640.0" dy="14.9">• Типове значення: 250–350 мВ</tspan><tspan x="640.0" dy="14.9"></tspan><tspan x="640.0" dy="14.9">2. Read SNM (режим читання):</tspan><tspan x="640.0" dy="14.9">• WL = V_DD, BL = V_DD</tspan><tspan x="640.0" dy="14.9">• Сплеск V_read зміщує низ VTC</tspan><tspan x="640.0" dy="14.9">• Пелюстки різко стискаються!</tspan><tspan x="640.0" dy="14.9">• Типове значення: 100–180 мВ</tspan><tspan x="640.0" dy="14.9"></tspan><tspan x="640.0" dy="14.9">Якщо шум V_noise &gt; SNM,</tspan><tspan x="640.0" dy="14.9">комірка спонтанно втрачає біт!</tspan></text>
</svg>