<rect x="389.6" y="240.1" width="360.8" height="69.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Область слабкої інверсії (підпорогова):</tspan><tspan x="570.0" dy="14.3">• Струм зростає експоненційно: I_sub ∝ 10^(V_GS / S)</tspan><tspan x="570.0" dy="14.3">• S_ideal = ln(10)·k_B·T / q ≈ 60 мВ/декаду (при 300 К)</tspan><tspan x="570.0" dy="14.3">• У реальних чіпах S ≈ 70–90 мВ/декаду</tspan></text>
