<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="14.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фізичні канали статичного струму витоку в нанорозмірному MOSFET</text>
<rect x="60.0" y="90.0" width="740.0" height="230.0" rx="0" fill="#edf3ec" stroke="#5a7a58" stroke-width="1.8"/>
<text x="430.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#5a7a58" text-anchor="middle" font-weight="700">p-підкладка / p-well (тіло транзистора, Body, потенціал V_B)</text>
<rect x="60.0" y="90.0" width="160.0" height="95.0" rx="0" fill="#d8e3f5" stroke="#2a59a8" stroke-width="1.5"/>
<text x="140.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2a59a8" text-anchor="middle" font-weight="700">Витік n⁺ (Source)</text>
<text x="140.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">V_S = 0 В</text>
<rect x="640.0" y="90.0" width="160.0" height="95.0" rx="0" fill="#d8e3f5" stroke="#2a59a8" stroke-width="1.5"/>
<text x="720.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2a59a8" text-anchor="middle" font-weight="700">Стік n⁺ (Drain)</text>
<text x="720.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">V_D = V_DD</text>
<rect x="220.0" y="100.0" width="420.0" height="85.0" rx="0" fill="#f9edf2" stroke="#a84e6c" stroke-width="1.2"/>
<text x="430.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a84e6c" text-anchor="middle" font-style="italic">Збіднена область під затвором</text>
<rect x="210.0" y="74.0" width="440.0" height="16.0" rx="0" fill="#fff8db" stroke="#d4a017" stroke-width="1.5"/>
<text x="430.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d4a017" text-anchor="middle" font-weight="700">Підзатворний діелектрик (High-k / SiO₂)</text>
<rect x="210.0" y="42.0" width="440.0" height="32.0" rx="3" fill="#e2e6eb" stroke="#4b5563" stroke-width="1.6"/>
<text x="430.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Затвор (Gate, V_G = 0 В у вимкненому стані)</text>
<line x1="210.0" y1="118.0" x2="650.0" y2="118.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="267.9" y="111.0" width="324.2" height="18.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">1. Підпороговий струм I_sub (дифузія витік -&gt; стік)</tspan></text>
<line x1="300.0" y1="60.0" x2="300.0" y2="98.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="206.1" y="16.0" width="187.8" height="18.0" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.5"/><text x="300.0" y="28.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">2. Тунелювання затвора I_gate</tspan></text>
<line x1="720.0" y1="175.0" x2="720.0" y2="230.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="573.7" y="246.0" width="212.6" height="18.0" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="680.0" y="258.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">3. Зворотний витік переходу I_rev</tspan></text>
<line x1="630.0" y1="95.0" x2="600.0" y2="175.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="406.8" y="196.0" width="206.4" height="18.0" rx="6" fill="#fff" stroke="#0284c7" stroke-width="1.5"/><text x="510.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">4. Витік GIDL (BTBT тунелювання)</tspan></text>
<rect x="40.0" y="340.0" width="780.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний статичний витік транзистора: I_leak = I_sub + I_gate + I_rev + I_GIDL</text>
<text x="430.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">• При V_GS = 0 В головним джерелом є I_sub (дифузія неосновних носіїв над бар'єром)</text>
<text x="430.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">• Зі зростанням V_DS посилюються DIBL та GIDL; при тонких діелектриках (&lt;1.5 нм) зростає I_gate</text>
</svg>