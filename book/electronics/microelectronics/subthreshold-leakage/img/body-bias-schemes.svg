<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адаптивне керування порогом через зміщення підкладки (Body Biasing)</text>
<rect x="40.0" y="60.0" width="230.0" height="260.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.4"/>
<text x="155.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="700">RBB: Зворотне зміщення</text>
<text x="155.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Режим спокою (Standby / Sleep)</text>
<rect x="60.0" y="125.0" width="190.0" height="70.0" rx="4" fill="#fff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="155.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_BS &lt; 0 В (V_B = −0.5 В)</text>
<text x="155.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Збіднена зона розширюється</text>
<rect x="42.4" y="212.1" width="225.2" height="65.9" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="155.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Наслідки RBB:</tspan><tspan x="155.0" dy="14.3">• Порогова напруга V_th зростає</tspan><tspan x="155.0" dy="14.3">• Підпороговий витік падає в 5–20×</tspan><tspan x="155.0" dy="14.3">• Заморожування витоку в сні</tspan></text>
<rect x="295.0" y="60.0" width="230.0" height="260.0" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4"/>
<text x="410.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ZBB: Нульове зміщення</text>
<text x="410.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Номінальний режим (Active)</text>
<rect x="315.0" y="125.0" width="190.0" height="70.0" rx="4" fill="#fff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="410.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_BS = 0 В (Підкладка = GND)</text>
<text x="410.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стандартна ширина збіднення</text>
<rect x="303.7" y="212.1" width="212.6" height="65.9" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Номінальний стан:</tspan><tspan x="410.0" dy="14.3">• Стандартний V_th = V_th0</tspan><tspan x="410.0" dy="14.3">• Номінальний струм I_on</tspan><tspan x="410.0" dy="14.3">• Базовий баланс швидкість/витік</tspan></text>
<rect x="550.0" y="60.0" width="230.0" height="260.0" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.4"/>
<text x="665.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">FBB: Пряме зміщення</text>
<text x="665.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Турбо-режим / High Performance</text>
<rect x="570.0" y="125.0" width="190.0" height="70.0" rx="4" fill="#fff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="665.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0 &lt; V_BS &lt; +0.4 В</text>
<text x="665.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Збіднена зона звужується</text>
<rect x="565.0" y="212.1" width="200.1" height="65.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Наслідки FBB:</tspan><tspan x="665.0" dy="14.3">• Порогова напруга V_th падає</tspan><tspan x="665.0" dy="14.3">• Струм I_on зростає на 15–30%</tspan><tspan x="665.0" dy="14.3">• Прискорення критичних блоків</tspan></text>
</svg>