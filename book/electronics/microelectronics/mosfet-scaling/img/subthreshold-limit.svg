<line x1="360.0" y1="290.0" x2="360.0" y2="294.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.9 В</text>
<line x1="450.0" y1="290.0" x2="450.0" y2="294.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="450.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1.2 В</text>
<line x1="90.0" y1="280.0" x2="300.0" y2="80.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="300.0" y1="80.0" x2="450.0" y2="60.0" stroke="#2457d6" stroke-width="2.2"/>
<circle cx="90.0" cy="280.0" r="4.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="300.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Vth = 0.7 В</text>
<text x="105.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">I_off ≈ 10⁻¹⁴ А</text>
<line x1="90.0" y1="170.0" x2="190.0" y2="80.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="190.0" y1="80.0" x2="340.0" y2="60.0" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="90.0" cy="170.0" r="4.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="190.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Vth = 0.25 В</text>
<text x="147.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I_off ≈ 10⁻⁸ А (катастрофа!)</text>
<line x1="170.0" y1="245.0" x2="220.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Підпороговий нахил S ≥ 60 мВ/дек</text>
<text x="250.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">S = ln(10)·(kB·T/q) — фізична стала</text>
<rect x="500.0" y="75.0" width="235.0" height="215.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="617.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Чому Vth не можна знижувати</text>
<text x="514.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Нахил S обмежений</text>
<text x="514.0" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">термічним розподілом</text>
<text x="514.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Больцмана (kB·T/q).</text>
<text x="514.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Щоб закрити ключ</text>
<text x="514.0" y="193.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(I_on/I_off &gt; 10⁶), треба</text>
<text x="514.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">діапазон Vgs не менше 0.4 В.</text>
<text x="514.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. При Vth &lt; 0.3 В струм</text>
<text x="514.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">витоку в спокої зростає</text>
<text x="514.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">експоненційно — чип кипить!</text>
</svg>