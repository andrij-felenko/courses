<text x="80.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">1 фА (OFF)</text>
<line x1="90.0" y1="290.0" x2="90.0" y2="294.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="90.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 В</text>
<line x1="180.0" y1="290.0" x2="180.0" y2="294.0" stroke="#6b7280" stroke-width="1.2"/>
