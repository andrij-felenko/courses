<text x="390.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Перед сном: імпульс SAVE переписує біт із Slave Latch у тіньовий Balloon Latch.</text>
<text x="390.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">2. Сон: VDD_SW = 0 В (Master-Slave гаснуть), а Balloon тримає біт від VDD_AON.</text>
<text x="390.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">3. Пробудження: після увімкнення VDD_SW імпульс RESTORE миттєво повертає стан у Slave.</text>
