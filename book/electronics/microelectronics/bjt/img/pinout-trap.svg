<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка TO-92: ніжки європейських і американських серій ДЗЕРКАЛЬНІ</text>
<text x="200.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">BC547 / BC557 (європа): C–B–E</text><path d="M154 150 A 46 46 0 0 1 246 150 Z" fill="#f4f6f8" stroke="#333333" stroke-width="2"/><line x1="154.0" y1="150.0" x2="246.0" y2="150.0" stroke="#333333" stroke-width="2.4"/><line x1="170.0" y1="150.0" x2="170.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.6"/><circle cx="170.0" cy="212.0" r="11.0" fill="#fff" stroke="#c0392b" stroke-width="2.0"/><text x="170.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">C</text><line x1="200.0" y1="150.0" x2="200.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.6"/><circle cx="200.0" cy="212.0" r="11.0" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/><text x="200.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text><line x1="230.0" y1="150.0" x2="230.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.6"/><circle cx="230.0" cy="212.0" r="11.0" fill="#fff" stroke="#2457d6" stroke-width="2.0"/><text x="230.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">E</text>
<text x="520.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">2N3904 / 2N2222 (америка): E–B–C</text><path d="M474 150 A 46 46 0 0 1 566 150 Z" fill="#f4f6f8" stroke="#333333" stroke-width="2"/><line x1="474.0" y1="150.0" x2="566.0" y2="150.0" stroke="#333333" stroke-width="2.4"/><line x1="490.0" y1="150.0" x2="490.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.6"/><circle cx="490.0" cy="212.0" r="11.0" fill="#fff" stroke="#2457d6" stroke-width="2.0"/><text x="490.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">E</text><line x1="520.0" y1="150.0" x2="520.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.6"/><circle cx="520.0" cy="212.0" r="11.0" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text><line x1="550.0" y1="150.0" x2="550.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.6"/><circle cx="550.0" cy="212.0" r="11.0" fill="#fff" stroke="#c0392b" stroke-width="2.0"/><text x="550.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">C</text>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="40" fill="#c0392b" text-anchor="middle" font-weight="700">≠</text>
<rect x="90.0" y="250.0" width="540.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Дивимось на ПЛАСКУ грань, ніжки вниз. C і E помінялись місцями.</tspan><tspan x="360.0" dy="16.2">Встромив 2N3904 у схему під BC547, не звіривши, — переплутав</tspan><tspan x="360.0" dy="16.2">колектор з емітером. Перехід база–емітер у зворотному ввімкненні</tspan><tspan x="360.0" dy="16.2">пробивається вже за ~5–6 В і деградує за частку секунди.</tspan></text>
<text x="360.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило: щоразу звіряй розпіновку з даташитом САМЕ свого номера.</text>
</svg>