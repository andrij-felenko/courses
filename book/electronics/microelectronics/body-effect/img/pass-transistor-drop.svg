<text x="430.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Vin = VDD</text>
<line x1="430.0" y1="130.0" x2="475.0" y2="130.0" stroke="#333333" stroke-width="2.0"/>
<line x1="475.0" y1="130.0" x2="490.0" y2="105.0" stroke="#333333" stroke-width="1.5"/>
<line x1="475.0" y1="130.0" x2="490.0" y2="155.0" stroke="#333333" stroke-width="1.5"/>
