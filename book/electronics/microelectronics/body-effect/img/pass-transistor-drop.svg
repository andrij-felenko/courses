<text x="525.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Bulk = VDD</text>
<rect x="490.0" y="142.0" width="70.0" height="26.0" rx="3" fill="#cfd9ea" stroke="#2457d6" stroke-width="1.3"/>
<text x="525.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">NMOS (EN)</text>
<text x="525.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Bulk = GND</text>
<line x1="560.0" y1="105.0" x2="575.0" y2="130.0" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="155.0" x2="575.0" y2="130.0" stroke="#333333" stroke-width="1.5"/>
<line x1="575.0" y1="130.0" x2="640.0" y2="130.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="640.0" cy="130.0" r="3.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<text x="640.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Vout = VDD</text>
<text x="540.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Повний розмах 0...VDD без втрати!</text>
<text x="540.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">PMOS дотягує '1' до повного VDD,</text>
<text x="540.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">NMOS дотягує '0' до чистого 0 В.</text>
<text x="370.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">Ефект підкладки робить поодинокий NMOS нездатним передати повний логічний рівень «1».</text>
</svg>