<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="34.2" y="9.0" width="671.7" height="26.0" rx="6" fill="#f4f6f8" stroke="#bac7d5" stroke-width="1.5"/><text x="370.0" y="26.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Логіка на передавальних транзисторах: втрата рівня '1' через ефект підкладки</tspan></text>
<rect x="50.0" y="50.0" width="260.0" height="230.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="180.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поодинокий NMOS-ключ</text>
<circle cx="90.0" cy="130.0" r="3.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<text x="90.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Vin = VDD</text>
<line x1="90.0" y1="130.0" x2="140.0" y2="130.0" stroke="#333333" stroke-width="2.0"/>
<rect x="140.0" y="115.0" width="80.0" height="30.0" rx="3" fill="#cfd9ea" stroke="#2457d6" stroke-width="1.5"/>
<text x="180.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">NMOS</text>
<line x1="180.0" y1="115.0" x2="180.0" y2="90.0" stroke="#333333" stroke-width="1.8"/>
<text x="180.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">VG = VDD (1.2 В)</text>
<line x1="180.0" y1="145.0" x2="180.0" y2="170.0" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="180.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">Bulk = 0 В</text>
<line x1="220.0" y1="130.0" x2="270.0" y2="130.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="270.0" cy="130.0" r="3.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<line x1="255.0" y1="130.0" x2="255.0" y2="150.0" stroke="#333333" stroke-width="1.5"/>
<line x1="245.0" y1="150.0" x2="265.0" y2="150.0" stroke="#333333" stroke-width="2.0"/>
<line x1="245.0" y1="155.0" x2="265.0" y2="155.0" stroke="#333333" stroke-width="2.0"/>
<line x1="255.0" y1="155.0" x2="255.0" y2="175.0" stroke="#333333" stroke-width="1.5"/>
<text x="280.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CL</text>
<text x="180.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Vout = VDD − Vth(Vout)</text>
<text x="180.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Замість 1.2 В → лише ≈ 0.65 В!</text>
<text x="180.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Vth зріс з 0.35 В до 0.55 В)</text>
<rect x="390.0" y="50.0" width="300.0" height="230.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="540.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рішення: CMOS Transmission Gate</text>
