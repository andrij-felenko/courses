<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="84.5" y="9.0" width="610.9" height="26.0" rx="6" fill="#f4f6f8" stroke="#bac7d5" stroke-width="1.5"/><text x="390.0" y="26.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Адаптивне керування підкладкою (Adaptive Body Biasing): FBB проти RBB</tspan></text>
<rect x="20.0" y="50.0" width="230.0" height="245.0" rx="6" fill="#f0fff4" stroke="#68d391" stroke-width="1.5"/>
<text x="135.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Пряме зміщення (FBB)</text>
<text x="135.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">VBS = +0.3...+0.4 В &gt; 0</text>
<line x1="35.0" y1="108.0" x2="235.0" y2="108.0" stroke="#c6f6d5" stroke-width="1.0"/>
<text x="135.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика процесу:</text>
<text x="135.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Звуження збідненого шару</text>
<text x="135.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Зниження порогу: Vth ↓ (−100 мВ)</text>
<text x="135.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Збільшення струму: Ion ↑ (+30%)</text>
<line x1="35.0" y1="198.0" x2="235.0" y2="198.0" stroke="#c6f6d5" stroke-width="1.0"/>
<text x="135.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення:</text>
<text x="135.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Турбо-режим процесора,</text>
<text x="135.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">компенсація повільних кутів (SS),</text>
<text x="135.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">максимальна тактова частота.</text>
<rect x="275.0" y="50.0" width="230.0" height="245.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.4"/>
<text x="390.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нульове зміщення (ZBB)</text>
<text x="390.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">VBS = 0 В (Витік = Тіло)</text>
<line x1="290.0" y1="108.0" x2="490.0" y2="108.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="390.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика процесу:</text>
<text x="390.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Стандартна ширина Wdep0</text>
<text x="390.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">• Номінальний поріг Vth0</text>
<text x="390.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Номінальні Ion та Ioff</text>
<line x1="290.0" y1="198.0" x2="490.0" y2="198.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="390.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення:</text>
<text x="390.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Стандартний робочий режим,</text>
<text x="390.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">збалансована енергоефективність</text>
<text x="390.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">та швидкодія за нормальної T.</text>
<rect x="530.0" y="50.0" width="230.0" height="245.0" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1.5"/>
<text x="645.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c05621" text-anchor="middle" font-weight="700">Зворотне зміщення (RBB)</text>
<text x="645.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c05621" text-anchor="middle" font-weight="700">VBS = −0.5...−1.5 В &lt; 0</text>
<line x1="545.0" y1="108.0" x2="745.0" y2="108.0" stroke="#feebc8" stroke-width="1.0"/>
<text x="645.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика процесу:</text>
<text x="645.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Розширення збідненого шару</text>
<text x="645.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c05621" text-anchor="middle" font-weight="700">• Зростання порогу: Vth ↑ (+150 мВ)</text>
<text x="645.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Придушення витоку: Ioff ↓↓ (10-100×)</text>
<line x1="545.0" y1="198.0" x2="745.0" y2="198.0" stroke="#feebc8" stroke-width="1.0"/>
<text x="645.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення:</text>
<text x="645.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Режим глибокого сну (Deep Sleep),</text>
<text x="645.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">радикальна економія батареї,</text>
<text x="645.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">компенсація гарячих кутів (FF).</text>
<text x="390.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-style="italic">Динамічне зміщення підкладки перетворює ефект підкладки з паразитного явища на інструмент керування енергоспоживанням.</text>
</svg>