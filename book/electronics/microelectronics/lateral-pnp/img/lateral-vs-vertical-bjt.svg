<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння фізики вертикального NPN та латерального PNP</text>
<rect x="40.0" y="55.0" width="370.0" height="385.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="225.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Вертикальний NPN (оптимізований)</text>
<rect x="65.0" y="105.0" width="320.0" height="140.0" rx="4" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.2"/>
<rect x="85.0" y="115.0" width="240.0" height="28.0" rx="2" fill="#d6e4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="205.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">n⁺ Емітер (сильно легований)</text>
<rect x="85.0" y="148.0" width="240.0" height="26.0" rx="2" fill="#fadbd8" stroke="#922b21" stroke-width="1.2"/>
<text x="205.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#922b21" text-anchor="middle" font-weight="700">p База (W_B ≈ 0.2–0.5 мкм, дифузійна)</text>
<rect x="85.0" y="179.0" width="240.0" height="55.0" rx="2" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="205.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">n Колектор (епітаксія + NBL)</text>
<line x1="345.0" y1="125.0" x2="345.0" y2="220.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="345.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">e⁻</text>
<text x="70.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носії: електрони (висока рухливість μ_n ≈ 1350 см²/В·с)</text>
<text x="70.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• База: надтонка (W_B ~ 0.3 мкм), задана дифузією</text>
<text x="70.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Час прольоту бази: τ_B ≈ 0.1–0.2 нс</text>
<text x="70.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Коефіцієнт підсилення: β ≈ 100–300</text>
<text x="70.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Гранична частота: f_T ≈ 300–800 МГц</text>
<text x="70.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Поверхнева рекомбінація: мінімальна (струм у глибині)</text>
<rect x="450.0" y="55.0" width="370.0" height="385.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="635.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Латеральний PNP (без додаткових масок)</text>
<rect x="475.0" y="105.0" width="320.0" height="140.0" rx="4" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.2"/>
<rect x="495.0" y="120.0" width="80.0" height="55.0" rx="2" fill="#fadbd8" stroke="#922b21" stroke-width="1.2"/>
<text x="535.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="middle" font-weight="700">p Емітер</text>
<rect x="580.0" y="120.0" width="110.0" height="55.0" rx="2" fill="#eef4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="635.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">n-база</text>
<text x="635.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">W_B ≈ 1–3 мкм</text>
<rect x="695.0" y="120.0" width="80.0" height="55.0" rx="2" fill="#fadbd8" stroke="#922b21" stroke-width="1.2"/>
<text x="735.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#922b21" text-anchor="middle" font-weight="700">p Колектор</text>
<line x1="570.0" y1="147.0" x2="700.0" y2="147.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Носії: дірки (низька рухливість μ_p ≈ 450 см²/В·с)</text>
<text x="480.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• База: широка (W_B ~ 1–3 мкм), задана літографією</text>
<text x="480.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Час прольоту бази: τ_B ≈ 20–30 нс (у 150 разів повільніше!)</text>
<text x="480.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Коефіцієнт підсилення: β ≈ 10–50</text>
<text x="480.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Гранична частота: f_T ≈ 2–8 МГц (&lt; 10 МГц)</text>
<text x="480.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Поверхнева рекомбінація: сильна біля межі Si-SiO₂</text>
</svg>