<text x="60.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Чому виготовлення займає понад 100 днів: фізика циклу та черги</text>
<text x="60.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 1000–1500 операцій: пластина повторно проходить літографію та травлення 60–90 разів.</text>
<text x="60.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Черги до EUV-сканерів: верстати завантажені на &gt;95%, формуючи технологічні буфери.</text>
<text x="60.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Незавершене виробництво (WIP): на GigaFab одночасно обробляються сотні тисяч пластин.</text>
<text x="60.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Величезна інерція: раптовий сплеск попиту фаб може покрити готовою партією лише за 4–6 місяців.</text>
