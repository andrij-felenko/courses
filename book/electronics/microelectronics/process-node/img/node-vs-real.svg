<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«5 нм» — це назва покоління, а не фізичний розмір</text>
<rect x="80.0" y="97.0" width="190.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="175.0" y="140.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">«5 нм»</tspan></text>
<text x="175.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">назва техпроцесу</text>
<line x1="290.0" y1="110.0" x2="372.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="331.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">насправді на чипі</text>
<rect x="392.0" y="72.0" width="300.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="404.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Крок між затворами (gate pitch)</text>
<text x="680.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">≈ 50 нм</text>
<rect x="392.0" y="118.0" width="300.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="404.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Крок металевих доріжок (metal pitch)</text>
<text x="680.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">≈ 30 нм</text>
<rect x="392.0" y="164.0" width="300.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="404.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Фізична довжина затвора</text>
<text x="680.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">≈ 16–20 нм</text>
<rect x="392.0" y="210.0" width="300.0" height="38.0" rx="6" fill="#fbeaea" stroke="#c0392b" stroke-width="1.8"/>
<text x="404.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«5 нм» як розмір чогось</text>
<text x="680.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">— нічого</text>
</svg>