<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
<rect width="720" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«5 нм» — це назва, а не фізичний розмір</text>
<rect x="70.0" y="80.0" width="230.0" height="90.0" rx="12" fill="#fde0dd" stroke="#c0271e" stroke-width="2.5"/>
<text x="185.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">«5 нм»</text>
<text x="185.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">назва техпроцесу</text>
<line x1="310.0" y1="125.0" x2="380.0" y2="125.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="345.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">насправді</text>
<rect x="400.0" y="84.0" width="270.0" height="38.0" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="410.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Крок затворів (gate pitch)</text>
<text x="660.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">~48–56 нм</text>
<rect x="400.0" y="130.0" width="270.0" height="38.0" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="410.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Крок металу (metal pitch)</text>
<text x="660.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">~30–36 нм</text>
<rect x="400.0" y="176.0" width="270.0" height="38.0" rx="6" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="410.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Довжина затвора (фізична)</text>
<text x="660.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">~16–20 нм</text>
<rect x="400.0" y="222.0" width="270.0" height="38.0" rx="6" fill="#fbeaea" stroke="#c0271e" stroke-width="1.8"/>
<text x="410.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«5 нм» як розмір чогось</text>
<text x="660.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">— нічого</text>
<text x="360.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Колись «вузол» приблизно дорівнював довжині затвора. Із ~2000-х цей зв'язок розпався:</text>
<text x="360.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сьогодні «5 нм», «3 нм» — лише маркетингові мітки поколінь, не виміряні нанометри на кремнії.</text>
</svg>
