<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квантове тунелювання: ультратонкий SiO2 проти High-k діелектрика</text>
<rect x="35.0" y="55.0" width="365.0" height="345.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="217.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний оксид SiO2 (ультратонкий)</text>
<rect x="60.0" y="103.0" width="315.0" height="160.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="60.0" y="103.0" width="75.0" height="160.0" rx="6" fill="#e5e7eb" stroke="#333333" stroke-width="1.0"/>
<text x="97.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затвор
(Poly-Si)</text>
<rect x="135.0" y="123.0" width="40.0" height="120.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="155.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">SiO2</text>
<text x="155.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1.2 нм</text>
<rect x="175.0" y="103.0" width="200.0" height="160.0" rx="6" fill="#e8f8f5" stroke="#333333" stroke-width="1.0"/>
<text x="275.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремнієвий
канал (Si)</text>
<line x1="105.0" y1="168.0" x2="225.0" y2="168.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="105.0" y1="198.0" x2="225.0" y2="198.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="267.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пряме
тунелювання!</text>
<text x="51.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фізична товщина t_phys = 1.2 нм (~4-5 атомних шарів)</text>
<text x="51.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Діелектрична проникність k = 3.9</text>
<text x="51.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Високий квантовий витік (&gt; 100 А/см²)</text>
<text x="51.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Неприйнятні статичні втрати потужності</text>
<rect x="440.0" y="55.0" width="365.0" height="345.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="622.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">High-k діелектрик HfO2 + перехідний шар</text>
<rect x="465.0" y="103.0" width="315.0" height="160.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="465.0" y="103.0" width="70.0" height="160.0" rx="6" fill="#d5dbdb" stroke="#333333" stroke-width="1.0"/>
<text x="500.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Металевий
затвор</text>
<rect x="535.0" y="123.0" width="20.0" height="120.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.2"/>
<text x="545.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d6608" text-anchor="middle" font-weight="700">IL</text>
<rect x="555.0" y="123.0" width="75.0" height="120.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/>
<text x="592.5" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">HfO2 (k≈22)</text>
<text x="582.5" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t_phys = 3.5 нм</text>
<rect x="630.0" y="103.0" width="150.0" height="160.0" rx="6" fill="#e8f8f5" stroke="#333333" stroke-width="1.0"/>
<text x="705.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремнієвий
канал (Si)</text>
<line x1="505.0" y1="168.0" x2="560.0" y2="168.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="560.0" y1="168.0" x2="535.0" y2="193.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="580.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Тунелювання
придушене</text>
<text x="456.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фізична товщина t_phys = 3.5 нм (3.0 нм HfO2 + 0.5 нм IL)</text>
<text x="456.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Діелектрична проникність k ≈ 20–25</text>
<text x="456.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Еквівалентна товщина EOT ≈ 1.0 нм</text>
<text x="456.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Витік тунелювання знижено у 100–1000 разів</text>
</svg>