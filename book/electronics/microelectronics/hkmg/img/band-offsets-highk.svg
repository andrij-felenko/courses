<text x="420.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">HfO2 має достатню висоту бар'єрів для обох типів носіїв, що гарантує низький термоемісійний витік</text>
