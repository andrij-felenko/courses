<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефект збіднення полікремнію (Poly-Depletion) та металевий затвор</text>
<rect x="35.0" y="55.0" width="365.0" height="345.0" rx="8" fill="#fef9e7" stroke="#b7950b" stroke-width="1.8"/>
<text x="217.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7950b" text-anchor="middle" font-weight="700">Полікремнієвий затвор (Poly-Si)</text>
<rect x="60.0" y="105.0" width="315.0" height="155.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="60.0" y="105.0" width="315.0" height="55.0" rx="6" fill="#d6dbdf" stroke="#333333" stroke-width="1.0"/>
<text x="217.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Poly-Si (N+ легований кремній)</text>
<rect x="60.0" y="142.0" width="315.0" height="18.0" rx="6" fill="#f9e79f" stroke="#d4ac0d" stroke-width="1.2"/>
<text x="217.5" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d6608" text-anchor="middle" font-weight="700">Шар збіднення W_dep (паразитна ємність C_poly)</text>
<rect x="60.0" y="160.0" width="315.0" height="35.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.2"/>
<text x="217.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">High-k діелектрик (HfO2, C_diel)</text>
<rect x="60.0" y="195.0" width="315.0" height="65.0" rx="6" fill="#ebf5fb" stroke="#333333" stroke-width="1.0"/>
<text x="217.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інверсійний шар / Кремнієвий канал</text>
<text x="217.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1/C_total = 1/C_diel + 1/C_poly</text>
<text x="51.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Обмежена концентрація домішок (~10²⁰ см⁻³)</text>
<text x="51.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Шар збіднення W_dep ≈ 0.3–0.5 нм біля межі</text>
<text x="51.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Послідовна паразитна ємність 1/C_poly</text>
<text x="51.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CET = EOT + 0.4 нм → втрата 20–30% струму каналу</text>
<rect x="440.0" y="55.0" width="365.0" height="345.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="622.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Металевий затвор (Metal Gate)</text>
<rect x="465.0" y="105.0" width="315.0" height="155.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="465.0" y="105.0" width="315.0" height="55.0" rx="6" fill="#aed6f1" stroke="#2980b9" stroke-width="1.2"/>
<text x="622.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b4f72" text-anchor="middle" font-weight="700">Метал (TiN / TaN / TiAl)</text>
<text x="622.5" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1b4f72" text-anchor="middle">Вільні електрони ~10²³ см⁻³ (W_dep = 0)</text>
<rect x="465.0" y="160.0" width="315.0" height="35.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.2"/>
<text x="622.5" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">High-k діелектрик (HfO2, C_diel)</text>
<rect x="465.0" y="195.0" width="315.0" height="65.0" rx="6" fill="#ebf5fb" stroke="#333333" stroke-width="1.0"/>
<text x="622.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інверсійний шар / Кремнієвий канал</text>
<text x="622.5" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">C_total = C_diel (максимальна ємність)</text>
<text x="456.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Величезна концентрація електронів (~10²³ см⁻³)</text>
<text x="456.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Нульовий шар збіднення (W_dep = 0 нм)</text>
<text x="456.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Немає паразитної послідовної ємності</text>
<text x="456.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CET = EOT → повний ємнісний контроль каналу</text>
</svg>