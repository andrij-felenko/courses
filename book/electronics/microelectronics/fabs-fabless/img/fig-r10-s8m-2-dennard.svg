<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Масштабування Деннарда: чому зменшення транзистора колись було «безкоштовним» — і чому перестало</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">правила Деннарда (1974): лінійний розмір ×0.7 за крок → площа ×0.5, напруга ×0.7 — і потужність на одиницю площі НЕ росте</text>
<line x1="472.0" y1="80.0" x2="472.0" y2="470.0" stroke="#1b1b1b" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="472.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 2005</text>
<rect x="40.0" y="84.0" width="408.0" height="196.0" rx="12" fill="#f1f8f3" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="244.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Доба «безкоштовного обіду» (≈1974–2005)</text>
<text x="64.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розмір (довжина)</text>
<text x="382.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">× 0.7</text>
<text x="64.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">площа транзистора</text>
<text x="382.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">× 0.5  (0.7²)</text>
<text x="64.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">напруга живлення V</text>
<text x="382.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">× 0.7</text>
<text x="64.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потужність / транзистор</text>
<text x="382.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">× 0.5</text>
<text x="64.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потужність на 1 мм²</text>
<text x="382.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">× 1  — стала!</text>
<text x="64.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">частота f</text>
<text x="382.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">× 1.4  росте вільно</text>
<text x="244.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">транзисторів удвічі більше — а гріє та сама площа так само</text>
<rect x="496.0" y="84.0" width="404.0" height="196.0" rx="12" fill="#fdf6f5" stroke="#c0271e" stroke-width="1.5"/>
<text x="698.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Після зламу (≈2005 →)</text>
<text x="512.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">напруга V</text>
<text x="884.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">застрягла ≈ 1 В</text>
<text x="512.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">(поріг транзистора не дає падати нижче)</text>
<text x="512.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">витоки (leakage)</text>
<text x="884.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">ростуть</text>
<text x="512.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">потужність на 1 мм²</text>
<text x="884.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">↑ лізе вгору</text>
<text x="512.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">частота f</text>
<text x="884.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">стала ≈ 3–4 ГГц</text>
<text x="512.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ціна виходу</text>
<text x="884.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="end" font-weight="bold" font-style="normal">плата за транзистори</text>
<text x="698.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.4" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="italic">транзистори ще множаться — але всі разом увімкнути не можна</text>
