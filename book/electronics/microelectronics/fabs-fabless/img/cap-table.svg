<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">TSMC, 1987: чий насправді був капітал і технологія</text>
<path d="M235.0,235.0 L235.0,117.0 A118.0,118.0 0 0 1 247.6,352.3 Z" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
<text x="305.7" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">48%</text>
<path d="M235.0,235.0 L247.6,352.3 A118.0,118.0 0 0 1 117.2,228.3 Z" fill="#2457d6" stroke="#ffffff" stroke-width="2"/>
<text x="186.2" y="290.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">28%</text>
<path d="M235.0,235.0 L117.2,228.3 A118.0,118.0 0 0 1 235.0,117.0 Z" fill="#b8860b" stroke="#ffffff" stroke-width="2"/>
<text x="186.4" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">24%</text>
<text x="235.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">хто дав гроші</text>
<rect x="430.0" y="60.0" width="460.0" height="78.0" rx="9" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<rect x="430.0" y="60.0" width="8.0" height="78.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="450.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Держава (Фонд розвитку)</text>
<text x="450.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">майже половина капіталу — пряма ставка уряду; промислову</text>
<text x="450.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">політику вели Сун Юньсюань і радник К. Т. Лі, що й покликали Чанга</text>
<rect x="430.0" y="150.0" width="460.0" height="78.0" rx="9" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<rect x="430.0" y="150.0" width="8.0" height="78.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="450.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Philips (Нідерланди)</text>
<text x="450.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">за частку передав виробничу технологію й ліцензував патенти;</text>
<text x="450.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">без чужого, відпрацьованого процесу молода фабрика не запустилася б</text>
<rect x="430.0" y="240.0" width="460.0" height="78.0" rx="9" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.6"/>
<rect x="430.0" y="240.0" width="8.0" height="78.0" rx="0" fill="#b8860b" stroke="#b8860b" stroke-width="0.0"/>
<text x="450.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="start" font-weight="700">Приватні інвестори Тайваню</text>
<text x="450.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">заможні промислові родини — решта капіталу; держава радше</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">переконала їх розділити ризик, ніж дочекалася добровільної черги</text>
<rect x="430.0" y="330.0" width="460.0" height="78.0" rx="9" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<rect x="430.0" y="330.0" width="8.0" height="78.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="450.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Морріс Чанг (Morris Chang)</text>
<text x="450.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">не гаманець, а задум, досвід і репутація: 25 років у TI,</text>
<text x="450.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">де подібну ідею свого часу відхилили — тут її дали збудувати</text>
<text x="460.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">За «дивом однієї людини» стоїть колективний пакет: внесок Чанга — задум, а не капітал.</text>
</svg>