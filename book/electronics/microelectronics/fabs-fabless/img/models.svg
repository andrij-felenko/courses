<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три моделі бізнесу в індустрії чіпів</text>
<rect x="40.0" y="78.0" width="192.0" height="132.0" rx="12" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="136.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">IDM</text>
<text x="136.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">проєктує І виготовляє</text>
<text x="136.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">власні фабрики</text>
<rect x="264.0" y="78.0" width="192.0" height="132.0" rx="12" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.2"/>
<text x="360.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Fabless</text>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лише проєктує</text>
<text x="360.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виготовлення — фабриці</text>
<rect x="488.0" y="78.0" width="192.0" height="132.0" rx="12" fill="#f4f6f8" stroke="#b8860b" stroke-width="2.2"/>
<text x="584.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b8860b" text-anchor="middle" font-weight="700">Foundry</text>
<text x="584.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лише виготовляє</text>
<text x="584.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чужі чіпи на замовлення</text>
<text x="360.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Колись усі були IDM — увесь ланцюг під одним дахом.</text>
<text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Дорожнеча фабу розколола індустрію надвоє: хто проєктує (fabless) і хто виготовляє (foundry).</text>
<text x="360.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">IDM лишаються, та на передовому краї їх дедалі менше.</text>
</svg>