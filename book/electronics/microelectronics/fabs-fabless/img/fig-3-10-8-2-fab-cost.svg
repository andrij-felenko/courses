<text x="360.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Окупити це можна лише шаленими обсягами. Тому компанії проєктують чіпи (fabless), а виготовлення</text>
<text x="360.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">віддають кільком гігантам-фабрикам — економіка масштабу не лишає іншого вибору.</text>
