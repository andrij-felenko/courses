<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чим саме TSMC була «першою»: два різні твердження</text>
<text x="240.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Що вже існувало до 1987</text>
<rect x="50.0" y="72.0" width="380.0" height="250.0" rx="10" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="66.0" y="88.0" width="348.0" height="66.0" rx="7" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="78.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Fujitsu, IBM, NEC, TI, Toshiba</text>
<text x="78.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">гіганти-IDM іноді варили чужі чипи —</text>
<text x="78.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">але як побічну послугу, у вільний час лінії</text>
<rect x="66.0" y="162.0" width="348.0" height="66.0" rx="7" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="78.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">≈ 50 fabless-фірм (сер. 1980-х)</text>
<text x="78.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">уже проєктували чипи без власної фабрики</text>
<text x="78.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">й шукали, де їх замовити</text>
<rect x="66.0" y="236.0" width="348.0" height="66.0" rx="7" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="78.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Chips &amp; Technologies, 1985</text>
<text x="78.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Ґордон Кемпбелл і Дадо Банатао —</text>
<text x="78.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">часто звана першою суто fabless-фірмою</text>
<text x="240.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">побічна послуга — ненадійна, а IDM ще й конкурент</text>
<line x1="434.0" y1="200.0" x2="474.0" y2="200.0" stroke="#b8860b" stroke-width="2.4"/>
<polyline points="474.0,200.0 463.0,195.0 463.0,205.0" fill="#b8860b"/>
<text x="454.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-style="italic">чого</text>
<text x="454.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-style="italic">бракувало</text>
<text x="680.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Що додала TSMC (1987)</text>
<rect x="490.0" y="72.0" width="380.0" height="250.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/>
<rect x="506.0" y="88.0" width="348.0" height="66.0" rx="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="518.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Виробництво — основна справа</text>
<text x="518.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">не підробіток фабрики, а весь сенс фірми:</text>
<text x="518.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">потужність лінії завжди для клієнта</text>
<rect x="506.0" y="162.0" width="348.0" height="66.0" rx="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="518.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">«Ми не конкуруємо з клієнтом»</text>
<text x="518.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">TSMC не має власних чипів-брендів —</text>
<text x="518.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">тож клієнт сміливо віддає свій проєкт</text>
<rect x="506.0" y="236.0" width="348.0" height="66.0" rx="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="518.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Спільна фабрика для всіх</text>
<text x="518.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">одна дорога лінія обслуговує десятки малих</text>
<text x="518.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">фірм — кожній порізно було б не під силу</text>
<text x="680.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">проєктувати чипи змогли навіть малі команди</text>
<rect x="50.0" y="392.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.5"/>
<text x="460.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точно: TSMC — не перша, хто варив чужі чипи, і не вона винайшла fabless. Вона перша зробила виробництво на замовлення</text>
<text x="460.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">надійною головною справою фірми, яка нікому не конкурує. Саме ця довіра, а не сам факт «варимо чуже», запустила fabless-індустрію.</text>
</svg>