<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<rect width="1000" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fb5"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві ролі: виконувати код на місці (XIP) vs зберігати дані</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">NOR віддає будь-який байт миттєво, тож процесор вибирає інструкції прямо з неї; NAND спершу копіюють у RAM</text>
<rect x="70.0" y="90.0" width="400.0" height="320.0" rx="14" fill="#eef2fb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="270.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">NOR + XIP (execute in place)</text>
<rect x="110.0" y="150.0" width="120.0" height="80.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="170.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Процесор</text>
<text x="170.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">fetch</text>
<rect x="300.0" y="150.0" width="130.0" height="80.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="2.2"/>
<text x="365.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">NOR-флеш</text>
<text x="365.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">код .text</text>
<line x1="300.0" y1="178.0" x2="230.0" y2="178.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="265.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">адреса</text>
<line x1="230.0" y1="205.0" x2="300.0" y2="205.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="265.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">інструкція</text>
<text x="270.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Процесор вибирає команди ПРЯМО з NOR,</text>
<text x="270.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">як із внутрішньої Flash (§3.6.3).</text>
<text x="270.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">→ код не треба нікуди копіювати</text>
<text x="270.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ але NOR дорога за мегабайт</text>
<text x="270.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Тому в NOR тримають ПРОШИВКУ.</text>
<rect x="530.0" y="90.0" width="400.0" height="320.0" rx="14" fill="#fdeef0" stroke="#c0271e" stroke-width="2.2"/>
<text x="730.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">NAND — сховище через буфер у RAM</text>
<rect x="560.0" y="150.0" width="110.0" height="70.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="2.2"/>
<text x="615.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">NAND</text>
<text x="615.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сторінки</text>
<rect x="720.0" y="150.0" width="100.0" height="70.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="770.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">RAM</text>
<text x="770.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">буфер</text>
<rect x="850.0" y="150.0" width="60.0" height="70.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="880.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ядро</text>
<line x1="670.0" y1="185.0" x2="720.0" y2="185.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aAmber)"/>
<text x="695.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">копія</text>
<line x1="820.0" y1="185.0" x2="850.0" y2="185.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="730.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Сторінку спершу КОПІЮЮТЬ у RAM,</text>
<text x="730.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і вже звідти з нею працює ядро.</text>
<text x="730.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ виконувати код напряму НЕ можна</text>
<text x="730.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ зате дешево й дуже ємно</text>
<text x="730.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Тому в NAND тримають ДАНІ:</text>
<text x="730.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">файли, медіа, великі масиви.</text>
</svg>
