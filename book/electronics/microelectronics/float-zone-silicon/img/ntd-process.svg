<text x="220.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Газове легування FZ (фосфін PH₃)</text>
<text x="220.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Конвекція Марангоні створює радіальні смуги</text>
<rect x="60.0" y="270.0" width="320.0" height="100.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.0"/>
<line x1="60.0" y1="320.0" x2="380.0" y2="320.0" stroke="#95a5a6" stroke-width="1.0" stroke-dasharray="4,4"/>
<path d="M 60.0 320.0 Q 90.0 290.0 120.0 320.0 Q 150.0 350.0 180.0 320.0 Q 210.0 285.0 240.0 320.0 Q 270.0 355.0 300.0 320.0 Q 330.0 295.0 360.0 320.0 L 380.0 320.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="220.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Радіальний розкид опору: ±15% … ±30%</text>
<text x="220.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Локальні пробої у високовольтних приладах</text>
<rect x="430.0" y="205.0" width="380.0" height="220.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Нейтронне легування (NTD)</text>
<text x="620.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ізотоп ³⁰Si розподілений абсолютно рівномірно</text>
<rect x="460.0" y="270.0" width="320.0" height="100.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.0"/>
<line x1="460.0" y1="320.0" x2="780.0" y2="320.0" stroke="#95a5a6" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="460.0" y1="320.0" x2="780.0" y2="320.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="620.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Радіальний розкид опору: &lt; 1% … 2%</text>
<text x="620.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ідеально рівномірне поле пробою по всій площі</text>
<text x="420.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">NTD перетворює природний кремній на фосфор із точністю атомного масштабу по всьому об'єму пластини.</text>
