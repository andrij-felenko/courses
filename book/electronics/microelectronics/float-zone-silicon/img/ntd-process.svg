<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нейтронно-трансмутаційне легування кремнію (NTD)</text>
<text x="420.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Ядерна реакція перетворення ³⁰Si → ³¹P для забезпечення ідеальної радіальної однорідності</text>
<rect x="30.0" y="75.0" width="780.0" height="115.0" rx="8" fill="#f4f6f7" stroke="#1f4e79" stroke-width="1.8"/>
<text x="420.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="700">Ядерна реакція опромінення тепловими нейтронами в реакторі</text>
<rect x="45.0" y="120.0" width="135.0" height="54.0" rx="6" fill="#ffffff" stroke="#5dade2" stroke-width="1.8"/>
<text x="112.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5dade2" text-anchor="middle" font-weight="700">Ізотоп ³⁰Si</text>
<text x="112.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3.1% у природному Si</text>
<line x1="182.0" y1="147.0" x2="194.0" y2="147.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="197.0" y="120.0" width="135.0" height="54.0" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.8"/>
<text x="264.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f39c12" text-anchor="middle" font-weight="700">+ Тепловий нейтрон n_th</text>
<text x="264.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Захоплення нейтрона</text>
<line x1="334.0" y1="147.0" x2="346.0" y2="147.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="349.0" y="120.0" width="135.0" height="54.0" rx="6" fill="#ffffff" stroke="#e74c3c" stroke-width="1.8"/>
<text x="416.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle" font-weight="700">Нестабільний ³¹Si</text>
<text x="416.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">T₁/₂ = 2.62 години</text>
<line x1="486.0" y1="147.0" x2="498.0" y2="147.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="501.0" y="120.0" width="135.0" height="54.0" rx="6" fill="#ffffff" stroke="#9b59b6" stroke-width="1.8"/>
<text x="568.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9b59b6" text-anchor="middle" font-weight="700">β⁻ розпад (електрон + нейтрино)</text>
<text x="568.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перетворення ядра</text>
<line x1="638.0" y1="147.0" x2="650.0" y2="147.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="653.0" y="120.0" width="135.0" height="54.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="720.5" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Донорний атом ³¹P</text>
<text x="720.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фосфор n-типу в ґратці</text>
