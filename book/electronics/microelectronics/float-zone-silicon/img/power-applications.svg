<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Застосування надчистого FZ-кремнію в силовій електроніці</text>
<text x="420.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Чому високовольтні IGBT та тиристори вимагають товстої високоомної n⁻-бази</text>
<rect x="30.0" y="75.0" width="430.0" height="365.0" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.8"/>
<text x="245.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="700">Структура високовольтного IGBT (3.3–6.5 кВ)</text>
<rect x="75.0" y="123.0" width="340.0" height="32.0" rx="6" fill="#aed6f1" stroke="#333333" stroke-width="1.5"/>
<text x="245.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MOS-затвори та p-емітерні комірки</text>
<rect x="75.0" y="155.0" width="340.0" height="160.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="2.0"/>
<text x="245.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Товста n⁻ дрейфова база з FZ-кремнію</text>
<text x="245.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Товщина W_d: 350 – 700 мкм</text>
<text x="245.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Питомий опір ρ: 100 – 600 Ом·см</text>
<text x="245.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Час життя τ &gt; 1000 мкс (глибока модуляція провідності)</text>
<text x="245.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Утримує напругу до 6500 В у закритому стані</text>
<rect x="75.0" y="315.0" width="340.0" height="25.0" rx="6" fill="#f9e79f" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">n⁺ польовий стоп-шар (Field Stop)</text>
<rect x="75.0" y="340.0" width="340.0" height="30.0" rx="6" fill="#f5b7b1" stroke="#333333" stroke-width="1.5"/>
<text x="245.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">p⁺ колекторний шар + металізація анода</text>
<rect x="480.0" y="75.0" width="330.0" height="365.0" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="645.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові ринкові ніші FZ-кремнію</text>
<rect x="492.0" y="123.0" width="306.0" height="68.0" rx="6" fill="#fcfcfc" stroke="#1f4e79" stroke-width="1.5"/>
<text x="502.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="700">Електротранспорт та тяга:</text>
<text x="502.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Інвертори електропоїздів, EV,</text>
<text x="502.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">приводи 100 кВт – 5 МВт.</text>
<rect x="492.0" y="199.0" width="306.0" height="68.0" rx="6" fill="#fcfcfc" stroke="#c0392b" stroke-width="1.5"/>
<text x="502.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Енергетика HVDC:</text>
<text x="502.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Високовольтні лінії передачі,</text>
<text x="502.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тиристорні вентилі до 800 кВ.</text>
<rect x="492.0" y="275.0" width="306.0" height="68.0" rx="6" fill="#fcfcfc" stroke="#1e8449" stroke-width="1.5"/>
<text x="502.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="start" font-weight="700">Детектори ядерної фізики:</text>
<text x="502.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Кремнієві трекові детектори (CERN),</text>
<text x="502.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">PIN-діоди повного збіднення.</text>
<rect x="492.0" y="351.0" width="306.0" height="68.0" rx="6" fill="#fcfcfc" stroke="#8e44ad" stroke-width="1.5"/>
<text x="502.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="start" font-weight="700">Високочастотні RF-прилади:</text>
<text x="502.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Підкладки для радарів і терагерців</text>
<text x="502.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">з нульовими діелектричними втратами.</text>
<text x="420.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Чим вища блокувальна напруга приладу, тим товстішою має бути база і тим вищі вимоги до FZ-кремнію.</text>
</svg>