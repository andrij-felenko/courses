<text x="495.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Затримка: −25% (швидкий) · Струм витоку: 8×–12×</text>
<rect x="480.0" y="320.0" width="340.0" height="100.0" rx="6" fill="#fdfefe" stroke="#8e44ad" stroke-width="1.5"/><text x="650.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Стратегія P&amp;R оптимізації:</tspan><tspan x="650.0" dy="11.7">• Критичні шляхи (Timing Critical): LVT / eLVT</tspan><tspan x="650.0" dy="11.7">• Некритичні шляхи (Non-critical Slack): HVT</tspan><tspan x="650.0" dy="11.7">Результат: макс. частота за мін. витоку (Leakage Recovery)</tspan></text>
