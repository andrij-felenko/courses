<rect x="30.0" y="8.5" width="390.0" height="33.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="29.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">NOR Flash: паралельні комірки (~10 F²)</tspan></text><rect x="460.0" y="8.5" width="390.0" height="33.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="29.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">NAND Flash: послідовний стек (~4 F²)</tspan></text><rect x="30.0" y="60.0" width="390.0" height="345.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><rect x="80.0" y="85.0" width="290.0" height="60.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><circle cx="110.0" cy="115.0" r="11.0" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/><text x="110.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">C</text><text x="230.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзистор комірки 1 (WL0)</text><text x="230.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Окремий контакт C до лінії BL</text><line x1="60.0" y1="160.0" x2="390.0" y2="160.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="3,3"/><text x="225.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Спільний контакт Source (SL)</text><rect x="80.0" y="175.0" width="290.0" height="60.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><circle cx="110.0" cy="205.0" r="11.0" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/><text x="110.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">C</text><text x="230.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзистор комірки 2 (WL1)</text><text x="230.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Окремий контакт C до лінії BL</text><rect x="55.0" y="280.5" width="340.0" height="69.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">• Площа комірки: ~9–12 F²</tspan><tspan x="225.0" dy="13.0">• Кожна пара комірок вимагає металевого контакту до BL</tspan><tspan x="225.0" dy="13.0">• Швидке випадкове читання байта: 50–90 нс</tspan><tspan x="225.0" dy="13.0">• Низька щільність, висока ціна за біт (1–256 МБ)</tspan></text><rect x="460.0" y="60.0" width="390.0" height="345.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><rect x="510.0" y="85.0" width="290.0" height="165.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><circle cx="535.0" cy="100.0" r="10.0" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/><text x="535.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle" font-weight="700">C</text><text x="655.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Контакт BL (1 на весь ланцюг)</text><rect x="540.0" y="118.0" width="230.0" height="18.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="655.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Комірка WL0 (послідовно)</text><rect x="540.0" y="140.0" width="230.0" height="18.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="655.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Комірка WL1 (послідовно)</text><rect x="540.0" y="162.0" width="230.0" height="18.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="655.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Комірка WL2 (послідовно)</text><rect x="540.0" y="184.0" width="230.0" height="18.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/><text x="655.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Комірки WL3..WL63 (без контактів!)</text><circle cx="535.0" cy="230.0" r="10.0" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/><text x="535.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle" font-weight="700">C</text><text x="655.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Контакт Source SL (1 на ланцюг)</text><rect x="485.0" y="280.5" width="340.0" height="69.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">• Площа комірки: ~4–5 F² (2D) / надвисока (3D BiCS)</tspan><tspan x="655.0" dy="13.0">• 32–128 комірок з'єднані послідовно без контактів</tspan><tspan x="655.0" dy="13.0">• Читання лише сторінками (2–16 КБ) за 25–50 мкс</tspan><tspan x="655.0" dy="13.0">• Колосальна щільність, низька ціна (ГБ / ТБ)</tspan></text>
</svg>