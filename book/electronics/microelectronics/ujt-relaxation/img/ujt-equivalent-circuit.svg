<rect x="140.0" y="395.0" width="460.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Умова відмикання емітера:</tspan><tspan x="370.0" dy="14.3">  V_E ≥ V_P = η·V_BB + V_D</tspan><tspan x="370.0" dy="14.3">де V_D ≈ 0.6...0.7 В (падіння на p-n переході),</tspan><tspan x="370.0" dy="14.3">   η = R_B1 / (R_B1 + R_B2) — коефіцієнт поділу.</tspan></text>
