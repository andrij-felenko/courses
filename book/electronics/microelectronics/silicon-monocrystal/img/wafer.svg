<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від злитка до пластини</text>
<ellipse cx="130" cy="95" rx="36" ry="14" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2"/>
<rect x="94.0" y="95.0" width="72.0" height="140.0" rx="0" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2.0"/>
<ellipse cx="130" cy="235" rx="36" ry="14" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="94.0" y1="121.0" x2="166.0" y2="121.0" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="94.0" y1="143.0" x2="166.0" y2="143.0" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="94.0" y1="165.0" x2="166.0" y2="165.0" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="94.0" y1="187.0" x2="166.0" y2="187.0" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="94.0" y1="209.0" x2="166.0" y2="209.0" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="130.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">злиток (boule)</text>
<text x="130.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ріжуть дротом</text>
<line x1="180.0" y1="165.0" x2="240.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зріз ~0.7 мм</text>
<circle cx="350.0" cy="165.0" r="50.0" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="350.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зріз: шорсткий</text>
<text x="350.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">шліфують + полірують</text>
<line x1="410.0" y1="165.0" x2="470.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="560.0" cy="165.0" r="60.0" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="560" cy="165" r="60" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.35"/>
<line x1="532.0" y1="218.0" x2="588.0" y2="218.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="560.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">пластина (wafer):</text>
<text x="560.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дзеркальна, орієнтована</text>
<text x="630.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">flat / notch:</text>
<text x="630.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">мітка орієнтації</text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Злиток ріжуть на тонкі зрізи, шліфують і полірують до атомарно-гладеньких; flat/notch на краю задає орієнтацію ґратки.</text>
</svg>