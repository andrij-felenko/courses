<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500">
<rect width="940" height="500" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Здогад Ерні, в який не вірили: не змивати оксид, а лишити його</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усі змивали захисний оксид після травлення, оголюючи переходи; Ерні лишив його — і той став і бронею, і ізолятором</text>
<text x="260.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Старий шлях («меза»): оксид змили</text>
<rect x="110.0" y="150.0" width="300.0" height="64.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="260.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кремній</text>
<path d="M220,150 L240,112 L300,112 L320,150 Z" fill="#e7ecf7" stroke="#1f47b5" stroke-width="1.6"/>
<text x="270.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">транзистор</text>
<line x1="240.0" y1="150.0" x2="240.0" y2="112.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="300.0" y1="150.0" x2="300.0" y2="112.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="240.0" cy="131.0" r="7.0" fill="none" stroke="#c0271e" stroke-width="2.2"/>
<circle cx="300.0" cy="131.0" r="7.0" fill="none" stroke="#c0271e" stroke-width="2.2"/>
<text x="260.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">перехід виходить на голу поверхню</text>
<rect x="120.0" y="250.0" width="280.0" height="64.0" rx="8" fill="#fff" stroke="#c0271e" stroke-width="1.6"/>
<text x="260.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Голий перехід беззахисний: бруд, волога, заряди</text>
<text x="260.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на поверхні псують його — транзистор «пливе»</text>
<text x="260.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">за параметрами й ненадійний. І метал класти ніяк.</text>
<text x="690.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Планар Ерні: оксид залишено</text>
<rect x="540.0" y="150.0" width="300.0" height="64.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="690.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кремній</text>
<rect x="540.0" y="138.0" width="300.0" height="14.0" rx="2" fill="#dff0df" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="690.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">суцільний шар оксиду (SiO₂)</text>
<line x1="650.0" y1="150.0" x2="650.0" y2="178.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="730.0" y1="150.0" x2="730.0" y2="178.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="650.0" y1="178.0" x2="730.0" y2="178.0" stroke="#c0271e" stroke-width="2.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="690.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">перехід захований під оксидом</text>
<line x1="600.0" y1="145.0" x2="635.0" y2="145.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="745.0" y1="145.0" x2="785.0" y2="145.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="690.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">↑ у вікнах кладуть метал ↑</text>
<rect x="550.0" y="250.0" width="280.0" height="64.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="690.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Оксид робить ДВІ справи разом: захищає перехід</text>
<text x="690.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(надійність, стабільність) — і служить ізолятором,</text>
<text x="690.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">по якому можна вести металеві доріжки. Звідси ІС.</text>
<line x1="415.0" y1="180.0" x2="535.0" y2="180.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="475.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна зміна</text>
<rect x="60.0" y="424.0" width="820.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="470.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Уся хитрість — у тому, чого Ерні НЕ зробив: не змив оксид. Той самий шар, що всі вважали сміттям, виявився і бронею для переходу,</text>
<text x="470.0" y="474.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і рівною ізоляційною підлогою для металевих з'єднань. Саме на цю «підлогу» Нойс і поклав доріжки своєї монолітної ІС.</text>
</svg>
