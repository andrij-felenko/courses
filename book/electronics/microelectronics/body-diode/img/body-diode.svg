<text x="360.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">У N-MOSFET тіло (p) коротко з'єднане з витоком; перехід тіло↔стік лишається діодом.</text>
<text x="360.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">На символі його малюють паралельно каналу: катод — на стоку, анод — на витоку.</text>
