<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повільне відновлення: діод не зачиняється миттєво</text>
<text x="350.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Коли діод тягнуть із прямого струму в запор, він на мить пускає струм назад (Irr) за час trr;</text>
<text x="350.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">накопичений під час провалу заряд Qrr — це зайві втрати й сплеск завад у швидкому мості.</text>
