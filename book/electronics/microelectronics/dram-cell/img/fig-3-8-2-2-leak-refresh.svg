<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Без поновлення рівень падає нижче порога й біт губиться; регенерація читає-й-перезаписує ряд кожні кілька мс</text>
