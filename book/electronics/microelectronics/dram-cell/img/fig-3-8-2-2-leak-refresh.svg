<text x="500.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Регенерація (refresh) — це фонове «прочитати ряд і записати назад». Поки вона встигає, біти живі; це робота контролера, не вашого коду.</text>
