<text x="230.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">← коротший час утримання            довший час утримання →</text>
<text x="430.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Один RC-механізм із кардинально різним опором витоку: від «оновлюй щомиті» до «зберігає десятиліттями».</text>
