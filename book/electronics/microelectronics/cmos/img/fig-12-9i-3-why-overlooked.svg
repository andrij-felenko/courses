<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
<rect width="720" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому зігнорували: повільно й нестабільно</text>
<text x="190.0" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">швидкодія (1963)</text>
<rect x="90.0" y="86.0" width="200.0" height="26.0" rx="0" fill="#fbeaea" stroke="#c0271e" stroke-width="1.4"/>
<text x="190.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">MOSFET — ×100 повільніший</text>
<rect x="90.0" y="122.0" width="26.0" height="26.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="130.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">біполярний</text>
<rect x="360.0" y="80.0" width="320.0" height="80.0" rx="8" fill="#fff7e6" stroke="#b5732e" stroke-width="1.3"/>
<text x="520.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">+ нестабільність:</text>
<text x="520.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">характеристики «плавали»</text>
<text x="520.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">з часом і температурою</text>
<rect x="120.0" y="188.0" width="480.0" height="56.0" rx="8" fill="#f6eef0" stroke="#d8a0a0" stroke-width="1.3"/>
<text x="360.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">промисловість гналася за швидкістю</text>
<text x="360.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— і економність КМОН тоді не оцінила</text>
<text x="360.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перевагу КМОН (мале споживання) тоді ніхто не цінував; ваду (повільність) бачили всі.</text>
</svg>
