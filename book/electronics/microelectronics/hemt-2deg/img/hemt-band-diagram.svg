<text x="390.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle">ΔE_v</text>
<rect x="134.2" y="280.2" width="151.7" height="59.6" rx="6" fill="#fff5f5" stroke="#ef9a9a" stroke-width="1.5"/><text x="210.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="210.0" dy="0.0">Збіднений шар AlGaAs:</tspan><tspan x="210.0" dy="14.3">донори іонізовані,</tspan><tspan x="210.0" dy="14.3">зона вигнута вгору</tspan></text>
<rect x="569.1" y="305.2" width="201.8" height="59.6" rx="6" fill="#f1f8e9" stroke="#a5d6a7" stroke-width="1.5"/><text x="670.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle"><tspan x="670.0" dy="0.0">Чистий об'єм GaAs:</tspan><tspan x="670.0" dy="14.3">зона провідності вище E_F,</tspan><tspan x="670.0" dy="14.3">вільних об'ємних носіїв немає</tspan></text>
<line x1="310.0" y1="175.0" x2="440.0" y2="275.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Електрони скочуються в яму</text>
