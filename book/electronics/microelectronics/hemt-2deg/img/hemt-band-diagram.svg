<text x="370.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ΔE_c</text>
<path d="M 420,240 L 420,310 C 440,310 460,305 480,270 C 500,245 510,240 520,240 Z" fill="#bbdefb" fill-opacity="0.7" stroke="none"/>
