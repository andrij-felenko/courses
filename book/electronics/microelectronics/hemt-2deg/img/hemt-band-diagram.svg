<rect x="382.3" y="322.4" width="145.4" height="45.3" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/><text x="455.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d47a1" text-anchor="middle"><tspan x="455.0" dy="0.0">2DEG у трикутній ямі</tspan><tspan x="455.0" dy="14.3">(z &lt; 5–10 нм)</tspan></text>
