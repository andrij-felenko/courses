<line x1="420.0" y1="60.0" x2="420.0" y2="390.0" stroke="#78909c" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#455a64" text-anchor="middle" font-weight="700">Межа гетеропереходу (z = 0)</text>
<text x="230.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Широкозонний n-AlGaAs (E_g1 ≈ 1.8 еВ)</text>
