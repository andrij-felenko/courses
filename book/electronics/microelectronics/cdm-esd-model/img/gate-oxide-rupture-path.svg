<text x="502.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Індуктивний викид напруги:</text>
<text x="512.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">V_L = L · (dI/dt) = 2 нГн · 50 А/нс = 100 В!</text>
<text x="502.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Динамічне падіння напруги:</text>
<text x="512.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">V_R = I · R_dyn = 10 А · 1.5 Ом = 15 В</text>
<text x="502.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Сумарно на затворі: десятки вольтів,</text>
