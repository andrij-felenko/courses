<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологічні шаблони активації: від Single-Sided до Blacksmith</text>
<rect x="40.0" y="55.0" width="185.0" height="405.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="132.5" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Single-Sided</text>
<text x="132.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(односторонній молот)</text>
<rect x="55.0" y="120.0" width="155.0" height="36.0" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.0"/>
<text x="132.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Рядок N-1 (Жертва)</text>
<rect x="55.0" y="164.0" width="155.0" height="36.0" rx="4" fill="#ffe6cc" stroke="#c0392b" stroke-width="2.0"/>
<text x="132.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рядок N (Агресор)</text>
<rect x="55.0" y="208.0" width="155.0" height="36.0" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1.0"/>
<text x="132.5" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Рядок N+1 (Жертва)</text>
<line x1="132.5" y1="164.0" x2="132.5" y2="156.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="132.5" y1="200.0" x2="132.5" y2="208.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="289.0" width="165.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="132.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Активація одного рядка N.</tspan><tspan x="132.5" dy="13.0">Збурення розсіюється</tspan><tspan x="132.5" dy="13.0">на обидва сусідні рядки.</tspan><tspan x="132.5" dy="13.0">Поріг N_ACT: ~100 000</tspan><tspan x="132.5" dy="13.0">(DDR3, перші досліди)</tspan></text>
<rect x="250.0" y="55.0" width="185.0" height="405.0" rx="8" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.8"/>
<text x="342.5" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Double-Sided</text>
<text x="342.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(сендвіч-атака)</text>
<rect x="265.0" y="120.0" width="155.0" height="36.0" rx="4" fill="#ffe6cc" stroke="#c0392b" stroke-width="2.0"/>
<text x="342.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Рядок N-1 (Агресор 1)</text>
<rect x="265.0" y="164.0" width="155.0" height="36.0" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2.0"/>
<text x="342.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#990000" text-anchor="middle" font-weight="700">Рядок N (ЖЕРТВА)</text>
<rect x="265.0" y="208.0" width="155.0" height="36.0" rx="4" fill="#ffe6cc" stroke="#c0392b" stroke-width="2.0"/>
<text x="342.5" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Рядок N+1 (Агресор 2)</text>
<line x1="342.5" y1="156.0" x2="342.5" y2="164.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="342.5" y1="208.0" x2="342.5" y2="200.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="249.9" y="289.0" width="185.3" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="342.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="342.5" dy="0.0">Чергування (N-1) ↔ (N+1).</tspan><tspan x="342.5" dy="13.0">Подвійний тиск на рядок N</tspan><tspan x="342.5" dy="13.0">з обох боків одночасно.</tspan><tspan x="342.5" dy="13.0">Поріг N_ACT падає в 2-4 рази!</tspan><tspan x="342.5" dy="13.0">Основний вектор експлойтів.</tspan></text>
<rect x="460.0" y="55.0" width="185.0" height="405.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="552.5" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Half-Double</text>
<text x="552.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(дистанція 2 рядки)</text>
<rect x="475.0" y="110.0" width="155.0" height="30.0" rx="4" fill="#ffe6cc" stroke="#c0392b" stroke-width="1.8"/>
<text x="552.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Рядок N-2 (Агресор)</text>
<rect x="475.0" y="146.0" width="155.0" height="30.0" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="552.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#825a00" text-anchor="middle">Рядок N-1 (Проміжний)</text>
<rect x="475.0" y="182.0" width="155.0" height="30.0" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="2.0"/>
<text x="552.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#990000" text-anchor="middle" font-weight="700">Рядок N (ЖЕРТВА)</text>
<line x1="552.5" y1="140.0" x2="552.5" y2="146.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="552.5" y1="176.0" x2="552.5" y2="182.0" stroke="#d6b656" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="459.9" y="289.0" width="185.3" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="552.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="552.5" dy="0.0">Агресор б'є по N-2.</tspan><tspan x="552.5" dy="13.0">Захист TRR рятує N-1,</tspan><tspan x="552.5" dy="13.0">але легке збурення N-1</tspan><tspan x="552.5" dy="13.0">плюс фоновий витік</tspan><tspan x="552.5" dy="13.0">добивають рядок N на діст. 2!</tspan></text>
<rect x="670.0" y="55.0" width="185.0" height="405.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="762.5" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Blacksmith</text>
<text x="762.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(неоднорідний шаблон)</text>
<rect x="685.0" y="105.0" width="155.0" height="24.0" rx="3" fill="#ffe6cc" stroke="#c0392b" stroke-width="1.2"/>
<text x="762.5" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Агр. A1 (f = 40%)</text>
<rect x="685.0" y="133.0" width="155.0" height="24.0" rx="3" fill="#ffe6cc" stroke="#c0392b" stroke-width="1.2"/>
<text x="762.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Агр. A2 (f = 25%)</text>
<rect x="685.0" y="161.0" width="155.0" height="24.0" rx="3" fill="#f8cecc" stroke="#b85450" stroke-width="2.0"/>
<text x="762.5" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#990000" text-anchor="middle" font-weight="700">ЖЕРТВА V</text>
<rect x="685.0" y="189.0" width="155.0" height="24.0" rx="3" fill="#ffe6cc" stroke="#c0392b" stroke-width="1.2"/>
<text x="762.5" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Агр. A3 (f = 35%)</text>
<rect x="675.5" y="289.0" width="173.9" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="762.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="762.5" dy="0.0">Атака на N рядків одночасно</tspan><tspan x="762.5" dy="13.0">з різними частотами.</tspan><tspan x="762.5" dy="13.0">Переповнює внутрішні</tspan><tspan x="762.5" dy="13.0">таблиці семплювання TRR</tspan><tspan x="762.5" dy="13.0">у чіпах DDR4 і DDR5.</tspan></text>
</svg>