  <marker id="aViol" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="490.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому кількох ніжок досить на мільярд транзисторів</text>
<text x="490.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Дві проблеми тестування — дістатися до вузла й побачити вузол — scan вирішує зсувом по ланцюгу.</text>
<rect x="50.0" y="80.0" width="430.0" height="150.0" rx="10" fill="#eef3ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="66.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Контрольованість (controllability)</text>
<text x="66.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">щоб перевірити вузол усередині, треба вміти</text>
<text x="66.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ЗАДАТИ йому потрібне 0/1. Без scan глибокий</text>
<text x="66.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вузол керується лише довгою послідовністю</text>
<text x="66.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">входів — комбінаторний жах.</text>
<text x="66.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Scan: засовуємо потрібний стан прямо в тригери.</text>
<rect x="50.0" y="244.0" width="430.0" height="150.0" rx="10" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<text x="66.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Спостережуваність (observability)</text>
<text x="66.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">і треба ще ПОБАЧИТИ, що вузол видав. Без scan</text>
<text x="66.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">внутрішній результат тоне в наступній логіці й</text>
<text x="66.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніколи не доходить до жодної ніжки.</text>
<text x="66.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Scan: тригер ловить результат, далі його</text>
<text x="66.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">виштовхуємо назовні й читаємо.</text>
<rect x="520.0" y="90.0" width="410.0" height="300.0" rx="14" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<text x="725.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кристал: мільярди вузлів усередині</text>
