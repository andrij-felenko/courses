<text x="725.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ланцюг проходить крізь усі тригери (точки доступу)</text>
<rect x="540.0" y="332.0" width="83.5" height="40.0" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
<text x="581.8" y="350.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold">TCK</text>
<text x="581.8" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">такт тесту</text>
<rect x="637.5" y="332.0" width="83.5" height="40.0" rx="6" fill="#fff" stroke="#caa24a" stroke-width="2"/>
<text x="679.2" y="350.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#caa24a" text-anchor="middle" font-weight="bold">TMS</text>
<text x="679.2" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">режим</text>
<rect x="735.0" y="332.0" width="83.5" height="40.0" rx="6" fill="#fff" stroke="#c0271e" stroke-width="2"/>
<text x="776.8" y="350.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold">TDI</text>
<text x="776.8" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вхід даних</text>
<rect x="832.5" y="332.0" width="83.5" height="40.0" rx="6" fill="#fff" stroke="#1f47b5" stroke-width="2"/>
<text x="874.2" y="350.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold">TDO</text>
<text x="874.2" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вихід даних</text>
<text x="725.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4 ніжки (+опц. TRST) = стандартний порт JTAG / IEEE 1149.1</text>
<text x="500.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≡</text>
<rect x="50.0" y="420.0" width="880.0" height="170.0" rx="12" fill="#f0fff2" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="72.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Розмін, що робить тестування можливим:</text>
<text x="72.0" y="476.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Прямих ніжок-«щупів» на кожен вузол не вистачить ніколи: вузлів мільярди, ніжок — сотні.</text>
<text x="72.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Scan перетворює ПРОСТІР (мільярди вузлів) на ЧАС (стільки тактів зсуву, скільки тригерів).</text>
<text x="72.0" y="528.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Платимо тактами на засування/виштовхування — а доступ дістаємо через ті самі 4 виводи.</text>
<text x="72.0" y="554.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Той самий порт потім служить і для внутрішньосхемної налагодки (debug), не лише для заводського тесту.</text>
<text x="908.0" y="582.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="italic">простір → час: ось чому «кількох ніжок досить»</text>
</svg>
