<text x="360.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тест сортує за частотою та цілістю блоків</text>
<line x1="150.0" y1="150.0" x2="150.0" y2="178.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="55.0" y="184.0" width="190.0" height="96.0" rx="6" fill="#cfe7d2" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="150.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">топ-сорт</text>
<text x="150.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">усі блоки цілі,</text>
<text x="150.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">висока частота</text>
<text x="150.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дорожче</text>
<line x1="360.0" y1="150.0" x2="360.0" y2="178.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="265.0" y="184.0" width="190.0" height="96.0" rx="6" fill="#fde9b0" stroke="#b8860b" stroke-width="1.8"/>
<text x="360.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">середній</text>
<text x="360.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">усі блоки цілі,</text>
<text x="360.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">нижча частота</text>
<text x="360.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">дешевше</text>
<line x1="570.0" y1="150.0" x2="570.0" y2="178.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="184.0" width="190.0" height="96.0" rx="6" fill="#f6d4d0" stroke="#c0392b" stroke-width="1.8"/>
<text x="570.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">молодша модель</text>
<text x="570.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">биті блоки —</text>
<text x="570.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вимкнути й продати</text>
<text x="570.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">найдешевше</text>
<text x="360.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Один із битих блоків назавжди вимикають — і восьмиядерний</text>
<text x="360.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кристал стає справним шестиядерним, а не йде у відходи.</text>
<text x="360.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Так із одного дизайну виходить ціла лінійка за різною ціною —</text>
<text x="360.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">і майже жоден кристал не марнується.</text>
