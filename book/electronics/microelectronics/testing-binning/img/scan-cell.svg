<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ціна — один MUX і один дріт на тригер, тобто кілька відсотків площі.</text>
