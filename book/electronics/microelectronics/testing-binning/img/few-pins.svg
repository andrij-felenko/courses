<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 762 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="762" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="376.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кількох ніжок досить на мільярд вузлів: простір → час</text>
<rect x="40.0" y="60.0" width="300.0" height="86.0" rx="6" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="56.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Контрольованість (controllability)</text>
<text x="56.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">задати вузлу потрібне значення —</text>
<text x="56.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">scan ЗАСОВУЄ стан у тригери зсувом</text>
<text x="56.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ззовні.</text>
<rect x="40.0" y="158.0" width="300.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="56.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Спостережуваність (observability)</text>
<text x="56.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">побачити, що вузол видав —</text>
<text x="56.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тригери ЛОВЛЯТЬ реакцію логіки,</text>
<text x="56.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">а зсув ВИШТОВХУЄ її назовні.</text>
<text x="190.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">обидві йдуть через дві ніжки + такт + scan_en</text>
<text x="190.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">простір мільярдів вузлів → час: стільки тактів,</text>
<text x="190.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">скільки тригерів у ланцюзі</text>
<line x1="348.0" y1="175.0" x2="392.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">стандартний порт доступу (TAP)</text>
<rect x="470.0" y="76.0" width="150.0" height="150.0" rx="6" fill="#e7eef8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="545.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">чіп</text>
<line x1="620.0" y1="96.0" x2="648.0" y2="96.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="648.0" cy="96.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="656.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">TCK — такт</text>
<line x1="620.0" y1="126.0" x2="648.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="648.0" cy="126.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="656.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">TMS — режим</text>
<line x1="620.0" y1="156.0" x2="648.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="648.0" cy="156.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="656.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">TDI — вхід даних</text>
<line x1="620.0" y1="186.0" x2="648.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="648.0" cy="186.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.0"/>
<text x="656.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">TDO — вихід даних</text>
<text x="545.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">+ необов'язковий TRST</text>
<text x="545.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">той самий порт згодом служить</text>
<text x="545.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">і для внутрішньосхемної налагодки (JTAG)</text>
</svg>