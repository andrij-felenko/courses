<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Інженери методично прибирають джерела дефектів → D у формулі Y ≈ e^(−A·D) падає, вихід росте.</text>
<text x="360.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Той самий дизайн на зрілому процесі дешевший — без жодної зміни в самому кристалі.</text>
