<line x1="378.0" y1="130.0" x2="391.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="542.0" y="108.0" width="120.0" height="44.0" rx="6" fill="#e7eef8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="602.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кристал 2</text>
<line x1="528.0" y1="130.0" x2="541.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
