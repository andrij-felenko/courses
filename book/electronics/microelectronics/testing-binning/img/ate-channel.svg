<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канал ATE: драйвер задає, компаратор зчитує — по одному на вивід</text>
<text x="180.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">один канал (pin electronics)</text>
<polygon points="70,86 70,134 118,110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="88.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">DRV</text>
<text x="64.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">вектор (що подати)</text>
<line x1="40.0" y1="110.0" x2="70.0" y2="110.0" stroke="#2457d6" stroke-width="1.6"/>
<polygon points="70,176 70,224 118,200" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="88.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="700">CMP</text>
<text x="64.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start">відповідь = еталон?</text>
