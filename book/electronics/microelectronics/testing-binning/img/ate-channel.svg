<circle cx="158.0" cy="155.0" r="4.0" fill="#e0a020" stroke="#9a6a00" stroke-width="1.0"/>
<line x1="158.0" y1="155.0" x2="196.0" y2="155.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="196.0" y="120.0" width="70.0" height="70.0" rx="6" fill="#e7eef8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="231.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">вивід</text>
<text x="231.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чіпа (DUT)</text>
<text x="170.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">драйвер ЗАДАЄ рівень входу,</text>
<text x="170.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle">компаратор ЗЧИТУЄ й порівнює вихід</text>
<text x="170.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">з еталоном — на кожнісінькому виводі</text>
<line x1="300.0" y1="200.0" x2="344.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">multisite: один тестер — багато кристалів</text>
