<text x="452.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кристал 3</text>
<line x1="378.0" y1="186.0" x2="391.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="542.0" y="164.0" width="120.0" height="44.0" rx="6" fill="#e7eef8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="602.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">кристал 4</text>
<line x1="528.0" y1="186.0" x2="541.0" y2="186.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="522.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ATE дорогий і платять за ЧАС;</text>
<text x="522.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тому багато кристалів тестують паралельно —</text>
<text x="522.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">час-на-кристал падає, а з ним і ціна тесту.</text>
<text x="522.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Канали драйвер/компаратор на кожен вивід ×</text>
<text x="522.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">багато сайтів — головний кошт тестера.</text>
