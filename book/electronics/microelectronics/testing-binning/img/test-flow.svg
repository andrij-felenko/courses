<text x="80.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">зондовий</text>
<text x="80.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тест на пластині</text>
<text x="80.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-style="italic">wafer sort</text>
<line x1="130.0" y1="150.0" x2="142.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
