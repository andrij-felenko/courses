<text x="304.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">корпусування</text>
<text x="304.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">кристал у корпус</text>
<text x="304.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">packaging</text>
<line x1="354.0" y1="150.0" x2="366.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="368.0" y="118.0" width="96.0" height="64.0" rx="6" fill="#cfe7d2" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="416.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">фінальний</text>
<text x="416.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тест запакованого</text>
<text x="416.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-style="italic">final test</text>
<line x1="466.0" y1="150.0" x2="478.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480.0" y="118.0" width="96.0" height="64.0" rx="6" fill="#fde9b0" stroke="#b8860b" stroke-width="1.6"/>
<text x="528.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">припрацювання</text>
<text x="528.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лише критичні чіпи</text>
<text x="528.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-style="italic">burn-in</text>
<line x1="578.0" y1="150.0" x2="590.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="592.0" y="118.0" width="96.0" height="64.0" rx="6" fill="#cfe7d2" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="640.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">відвантаження</text>
<text x="640.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">до замовника</text>
<text x="640.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-style="italic">ship</text>
<line x1="80.0" y1="160.0" x2="80.0" y2="190.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="80.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">брак → геть</text>
<line x1="416.0" y1="160.0" x2="416.0" y2="190.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="416.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">брак → геть</text>
<text x="360.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Кожен іспит відсіює брак ДО наступного, дорожчого кроку:</text>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">немає сенсу корпусувати або припрацьовувати кристал, що вже провалив тест.</text>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зондовий ловить брак ще на пластині; фінальний — пошкодження від корпусування;</text>
<text x="360.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">burn-in (лише для авто/медицини/серверів) — приховані ранні відмови.</text>
</svg>