<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Errata тримаються ревізії: баг живе в наборі масок</text>
<rect x="60.0" y="64.0" width="200.0" height="130.0" rx="6" fill="#e7eef8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="160.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кристал rev B0</text>
<rect x="86.0" y="100.0" width="148.0" height="30.0" rx="6" fill="#f6d4d0" stroke="#c0392b" stroke-width="1.4"/>
<text x="160.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">баг X у масках</text>
<text x="160.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">errata: «баг X присутній»</text>
<text x="160.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(виправити можна лише</text>
<text x="160.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">новим набором масок)</text>
<line x1="268.0" y1="130.0" x2="332.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">новий</text>
<text x="300.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">набір масок</text>
<rect x="340.0" y="64.0" width="200.0" height="130.0" rx="6" fill="#e7eef8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="440.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кристал rev C0</text>
<rect x="366.0" y="100.0" width="148.0" height="30.0" rx="6" fill="#cfe7d2" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="440.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">баг X прибрано</text>
<text x="440.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle">errata: рядок закрито</text>
<text x="440.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">«виправлено в C0»</text>
<rect x="560.0" y="70.0" width="140.0" height="124.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.4"/>
<text x="630.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">код:</text>
<text x="630.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">читає ревізію</text>
<text x="630.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">з регістра ID</text>
<text x="630.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">→ дивиться errata</text>
<text x="630.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">саме цієї ревізії</text>
<text x="630.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">→ вмикає обхід</text>
<line x1="540.0" y1="130.0" x2="558.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="360.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Хиба сидить у самому кремнії — у наборі фотомасок, за якими цей кристал надруковано.</text>
<text x="360.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Поки набір той самий, баг є в кожному вирізаному кристалі;</text>
<text x="360.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виправлення = змінити маски = нова ревізія.</text>
<text x="360.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Тому одна родина чіпів у різних ревізіях може потребувати різних обхідних шляхів.</text>
</svg>