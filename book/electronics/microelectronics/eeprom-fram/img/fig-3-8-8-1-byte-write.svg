<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Flash мусить СПЕРШУ стерти цілий блок, щоб змінити один байт; EEPROM і FRAM міняють окремий байт напряму</text>
<text x="90.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Flash (NOR/NAND): один байт не змінити окремо</text>
