<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Flash мусить СПЕРШУ стерти цілий блок, щоб змінити один байт; EEPROM і FRAM міняють окремий байт напряму</text>
