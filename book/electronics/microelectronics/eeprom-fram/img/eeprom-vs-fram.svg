<text x="500.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">FRAM сяє там, де треба часто й безпечно зберігати стан — дописувати лічильник при кожному циклі чи рятувати дані при зникненні живлення.</text>
