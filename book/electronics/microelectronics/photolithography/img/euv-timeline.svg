<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 780.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="780.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довгий шлях EUV: від ідеї середини 1980-х до фабрики 2019-го</text>
<line x1="232.0" y1="84.0" x2="232.0" y2="736.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="232.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="210.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">сер. 1980-х</text>
<text x="258.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Кіношіта (NTT, Японія) висуває ідею</text>
<text x="258.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Хіроо Кіношіта (Hiroo Kinoshita) пропонує літографію в м'якому</text>
<text x="258.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">рентгені; 1986-го вперше фокусує EUV-зображення дзеркалами</text>
<circle cx="232.0" cy="192.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="210.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1980-ті</text>
<text x="258.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Андервуд і Барбі — перші багатошарові дзеркала</text>
<text x="258.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Джим Андервуд (Jim Underwood) і Трой Барбі (Troy Barbee) роблять</text>
<text x="258.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">перші Mo/Si-дзеркала, що відбивають EUV — без них ідея мертва</text>
<circle cx="232.0" cy="272.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<text x="210.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">сер. 1980-х</text>
<text x="258.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Bell Labs пробує плазмове джерело</text>
<text x="258.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Оберт Вуд (Obert Wood) і Білл Сілфваст (Bill Silfvast) запускають</text>
<text x="258.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">лазерну плазму як джерело EUV; Рік Фрімен вводить термін</text>
<text x="258.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">«EUV-літографія»</text>
<circle cx="232.0" cy="356.0" r="7.0" fill="#ffffff" stroke="#caa24a" stroke-width="2.6"/>
<text x="210.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1992–94</text>
<text x="258.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="700">Intel і нацлабораторії США беруться всерйоз</text>
<text x="258.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Intel вкладає сотні мільйонів; Лівермор, Сандія, Берклі</text>
<text x="258.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">(Livermore, Sandia, Berkeley) ведуть роботу під DARPA/DOE</text>
<circle cx="232.0" cy="430.0" r="7.0" fill="#ffffff" stroke="#caa24a" stroke-width="2.6"/>
<text x="210.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1997</text>
<text x="258.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="700">консорціум EUV-LLC</text>
<text x="258.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Intel збирає коаліцію (AMD, Motorola, IBM, Micron) і фінансує</text>
<text x="258.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">нацлабораторії — переносить науку ближче до виробництва</text>
<circle cx="232.0" cy="504.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="210.0" y="509.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">кінець 1990-х</text>
<text x="258.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ASML бере EUV у роботу</text>
<text x="258.0" y="519.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Європейська ASML ставить на EUV як наступника DUV; партнерство</text>
<text x="258.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">з Zeiss по оптиці й Cymer по джерелу світла</text>
<circle cx="232.0" cy="584.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="210.0" y="589.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2012</text>
<text x="258.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Zeiss віддає ASML першу штатну оптику</text>
<text x="258.0" y="599.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Карл Цайс (Zeiss) розв'язує найстрашнішу задачу — дзеркала</text>
<text x="258.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">такої гладкості, що оптика перестає бути головним бар'єром</text>
<circle cx="232.0" cy="664.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="210.0" y="669.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2013</text>
<text x="258.0" y="661.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ASML купує Cymer; джерело пробиває ~10 Вт</text>
<text x="258.0" y="679.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Cymer додає попередній імпульс, що розплескує краплю олова,</text>
<text x="258.0" y="695.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">і потужність нарешті росте; того ж року ASML купує Cymer</text>
<circle cx="232.0" cy="728.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<text x="210.0" y="733.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">2018–2019</text>
<text x="258.0" y="725.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">EUV у серійному виробництві</text>
<text x="258.0" y="743.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Перші чіпи масово друкують на EUV (Samsung, TSMC).</text>
<text x="258.0" y="759.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Понад 30 років роботи дають робочу машину</text>
</svg>