<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">EUV — лише дзеркала у вакуумі, і куди дівається 98% світла</text>
<rect x="40.0" y="70.0" width="300.0" height="300.0" rx="12" fill="#f5f7fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Чому НЕ лінзи (як у DUV)</text>
<text x="58.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• EUV (13.5 нм) поглинає все:</text>
<text x="58.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   повітря, скло лінзи, плівка.</text>
<text x="58.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Промінь крізь лінзу згас би.</text>
<text x="58.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Тому: лише ВІДБИВАННЯ,</text>
<text x="58.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   дзеркалами Mo/Si.</text>
<text x="58.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• І весь шлях — у ВАКУУМІ,</text>
<text x="58.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   бо повітря з'їло б промінь.</text>
<text x="190.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дзеркало = ~40–50 пар шарів Mo/Si</text>
<rect x="90.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#6a3da0" stroke="none" stroke-width="0.0"/>
<rect x="104.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#caa24a" stroke="none" stroke-width="0.0"/>
<rect x="118.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#6a3da0" stroke="none" stroke-width="0.0"/>
<rect x="132.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#caa24a" stroke="none" stroke-width="0.0"/>
<rect x="146.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#6a3da0" stroke="none" stroke-width="0.0"/>
<rect x="160.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#caa24a" stroke="none" stroke-width="0.0"/>
<rect x="174.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#6a3da0" stroke="none" stroke-width="0.0"/>
<rect x="188.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#caa24a" stroke="none" stroke-width="0.0"/>
<rect x="202.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#6a3da0" stroke="none" stroke-width="0.0"/>
<rect x="216.0" y="304.0" width="12.0" height="14.0" rx="1" fill="#caa24a" stroke="none" stroke-width="0.0"/>
<text x="190.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">відбиває лише ~70% навіть у теорії</text>
<text x="640.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет світла: 11 відбивань поспіль</text>
<text x="640.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кожне відбивання забирає ~30% — втрати множаться</text>
<rect x="380.0" y="140.0" width="120.0" height="210.0" rx="6" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<rect x="380.0" y="140.0" width="120.0" height="20.0" rx="6" fill="#caa24a" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="700">100%</text>
<text x="440.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">джерело</tspan></text>
<rect x="520.0" y="300.0" width="120.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="520.0" y="300.0" width="120.0" height="20.0" rx="6" fill="#2457d6" stroke="none" stroke-width="0.0"/>
<text x="580.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">24%</text>
<text x="580.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">4 дзеркала-</tspan><tspan x="580.0" dy="12.0">конденсори</tspan></text>
<rect x="660.0" y="314.0" width="120.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<rect x="660.0" y="314.0" width="120.0" height="20.0" rx="6" fill="#c0392b" stroke="none" stroke-width="0.0"/>
<text x="720.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">17%</text>
<text x="720.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">маска</tspan><tspan x="720.0" dy="12.0">(теж дзеркало)</tspan></text>
<rect x="800.0" y="342.0" width="120.0" height="8.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<rect x="800.0" y="342.0" width="120.0" height="8.0" rx="6" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="860.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2%</text>
<text x="860.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">6 дзеркал</tspan><tspan x="860.0" dy="12.0">проєкції</tspan></text>
<line x1="502.0" y1="342.0" x2="518.0" y2="342.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="642.0" y1="342.0" x2="658.0" y2="342.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="782.0" y1="342.0" x2="798.0" y2="342.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="416.0" width="860.0" height="46.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="470.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсумок: до пластини доходить лише ~2% світла джерела —</text>
<text x="470.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">тому джерело мусить бути шалено потужним, а машина — гігантською.</text>
</svg>