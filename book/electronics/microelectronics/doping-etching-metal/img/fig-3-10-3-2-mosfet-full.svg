<text x="360.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усе, що в §2.7.2 було «затвор–ізолятор–канал», тут — результат окремих кроків фабрикації:</text>
<text x="360.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">оксид виростили, затвор осадили, n+-області вживили, контакти пробили. Будова = послідовність кроків.</text>
