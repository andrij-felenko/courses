<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійний удар по ціні великого кристала</text>
<rect x="70.0" y="70.0" width="580.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Менше кристалів на пластині</tspan><tspan x="360.0" dy="16.9">велика площа → їх просто менше вміщається</tspan></text>
<rect x="70.0" y="132.0" width="580.0" height="50.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="153.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Нижчий вихід (більше браку)</tspan><tspan x="360.0" dy="16.9">велика площа → частіше ловить дефект (Y ↓)</tspan></text>
<line x1="360.0" y1="188.0" x2="360.0" y2="214.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="200.0" y="223.6" width="320.0" height="48.8" rx="6" fill="#fde0dd" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">ціна за придатний кристал</tspan><tspan x="360.0" dy="16.2">росте набагато швидше за площу</tspan></text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">два множники діють в один бік — тому подвоєння площі може здорожчати придатний кристал у кілька разів</text>
</svg>