<text x="178.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">×</text>
<text x="240.0" y="206.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">×</text>
<text x="196.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">×</text>
<text x="210.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">будь-який × → весь кристал у брак</text>
<text x="64" y="306" font-family="Consolas, monospace" font-size="12.5" fill="#1a1a1a" font-weight="700">Y = e^(−4·0.5) = e^(−2) ≈ 13.5%</text>
