<rect x="50.0" y="336.0" width="660.0" height="60.0" rx="10" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="66" y="360" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a">моноліт : зі 100 заготовок годних ≈ 14</text>
<text x="66" y="380" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a">чиплети : зі 100 годних ≈ 61 → ≈ 15 систем по 4</text>
<text x="700.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">ціна виграшу — щільний міжз'єднувач між кристалами</text>
