<text x="550.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">брак — лише дефектний квадратик, решта годні</text>
<text x="404" y="306" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" font-weight="700">Y₁ = e^(−0.5) ≈ 60.7% на чиплет</text>
