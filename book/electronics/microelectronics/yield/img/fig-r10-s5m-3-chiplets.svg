<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="920" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому чиплети рятують: один великий кристал vs чотири малі тієї ж сумарної площі</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама логіка, та сама густина дефектів D = 0.5/см² — але вихід кардинально різний</text>
<rect x="70.0" y="96.0" width="360.0" height="250.0" rx="12" fill="#fdf6f5" stroke="#c0271e" stroke-width="1.6"/>
<text x="250.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Моноліт: один кристал A = 4 см²</text>
<rect x="180.0" y="146.0" width="140.0" height="140.0" rx="6" fill="#fdecec" stroke="#c0271e" stroke-width="2.0"/>
<text x="222.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="278.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="250.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="250.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">будь-який × → весь кристал у брак</text>
<text x="94.0" y="328.0" font-family="Consolas, monospace" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold">Y = e^(−4·0.5) = e^(−2) ≈ 13.5 %</text>
<rect x="490.0" y="96.0" width="360.0" height="250.0" rx="12" fill="#f1f8f3" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="670.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чиплети: 4 кристали по 1 см²</text>
<rect x="586.0" y="144.0" width="72.0" height="72.0" rx="5" fill="#fdecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="622.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<rect x="672.0" y="144.0" width="72.0" height="72.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="708.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">OK</text>
<rect x="586.0" y="230.0" width="72.0" height="72.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="622.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">OK</text>
<rect x="672.0" y="230.0" width="72.0" height="72.0" rx="5" fill="#fdecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="708.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">×</text>
<text x="670.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">брак — лише дефектний квадратик, решта годні</text>
<text x="514.0" y="328.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold">Y₁ = e^(−1·0.5) ≈ 60.7 % на кожен чиплет</text>
<line x1="438.0" y1="246.0" x2="484.0" y2="246.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="461.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ділимо</text>
<rect x="70.0" y="372.0" width="780.0" height="116.0" rx="10" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="90.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Що це дає на пластині (грубий підрахунок придатних кристалів)</text>
<text x="90.0" y="422.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">моноліт : зі 100 заготовок A=4 см²  годних ≈ 14  →  кожен 7-й виживає</text>
<text x="90.0" y="446.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">чиплети : зі 100 заготовок 1 см² годних ≈ 61  →  з них збираємо ≈ 15 систем по 4</text>
<text x="90.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Та сама логіка дає РАЗИ більше робочих систем — ось чому великі чипи ріжуть на чиплети.</text>
<text x="830.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="end" font-weight="normal" font-style="italic">ціна — інтерконект між кристалами</text>
<rect x="70.0" y="530.0" width="780.0" height="22.0" rx="6" fill="#fdf9ef" stroke="#caa24a" stroke-width="0"/>
<text x="460.0" y="545.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Дрібнити не безкоштовно: між чиплетами потрібен щільний міжз'єднувач (корпус-підкладка/міст), і це теж площа й затримка.</text>
</svg>
