<text x="600.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">історики повернули</tspan><tspan x="600.0" dy="15.6">Ерні й Леговця</tspan></text>
<text x="600.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">знов 4</text>
<text x="380.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Історія спершу стискає колективний винахід до легенди про геніїв-одинаків, а потім відновлює правду.</text>
