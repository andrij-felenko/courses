<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Єресь» Ерні: оксид залишають на місці</text>
<text x="190.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Мезаметод: оксид змили</text>
<rect x="70.0" y="130.0" width="240.0" height="90.0" rx="0" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M 130,130 L 250,130 L 250,90 L 130,90 Z" fill="#9fb0c8" stroke="#1a1a1a" stroke-width="2"/>
<line x1="190.0" y1="90.0" x2="190.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<line x1="250" y1="92" x2="300" y2="70" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">перехід — голий:</text>
<text x="300.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">бруд, волога, заряди</text>
<text x="190.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">транзистори «пливуть»</text>
<text x="570.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Планарний: оксид лишили</text>
<rect x="450.0" y="130.0" width="240.0" height="90.0" rx="0" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="450.0" y="112.0" width="240.0" height="18.0" rx="0" fill="#dfe7c8" stroke="#9bbf5a" stroke-width="1.5"/>
<text x="458.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b8e23" text-anchor="start">оксид (SiO₂)</text>
<rect x="540.0" y="112.0" width="24.0" height="18.0" rx="0" fill="#ffffff" stroke="#9bbf5a" stroke-width="1.2"/>
<line x1="552.0" y1="96.0" x2="552.0" y2="112.0" stroke="#9aa0a6" stroke-width="4.0"/>
<line x1="600" y1="100" x2="566" y2="116" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="604.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">вікно + метал</text>
<text x="570.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запечатує переходи +</text>
<text x="570.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">плоска підлога під метал</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий оксид робить дві справи: захищає переходи — і дає рівну ізоляційну поверхню, по якій ведуть метал.</text>
</svg>