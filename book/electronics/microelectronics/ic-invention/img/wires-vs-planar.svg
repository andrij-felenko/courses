<text x="380.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Обидва склали схему в одному кристалі; різниця — ЯК з'єднані деталі, і саме вона вирішила, що піде в серію.</text>
