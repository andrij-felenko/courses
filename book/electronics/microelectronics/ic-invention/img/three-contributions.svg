<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три внески, а не один геній</text>
<rect x="41.0" y="85.0" width="210.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.5"/>
<text x="146.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жан Ерні</text>
<text x="146.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ФУНДАМЕНТ</text>
<text x="146.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="146.0" dy="0.0">планарний оксид: захист</tspan><tspan x="146.0" dy="15.0">переходів + плоска</tspan><tspan x="146.0" dy="15.0">ізоляційна поверхня</tspan></text>
<line x1="253.0" y1="160.0" x2="273.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="275.0" y="85.0" width="210.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.5"/>
<text x="380.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джек Кілбі</text>
<text x="380.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ПЕРШИЙ ЗРАЗОК</text>
<text x="380.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">довів, що вся схема</tspan><tspan x="380.0" dy="15.0">влазить в один шматок</tspan><tspan x="380.0" dy="15.0">(хай з дротиками)</tspan></text>
<line x1="487.0" y1="160.0" x2="507.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="509.0" y="85.0" width="210.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.5"/>
<text x="614.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роберт Нойс</text>
<text x="614.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ФОРМА ДЛЯ СЕРІЇ</text>
<text x="614.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="614.0" dy="0.0">метал, надрукований</tspan><tspan x="614.0" dy="15.0">по оксиду Ерні —</tspan><tspan x="614.0" dy="15.0">можна тиражувати</tspan></text>
<text x="380.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Придумати фундамент, зробити перший зразок і зробити придатним до серії — три різні справи.</text>
</svg>