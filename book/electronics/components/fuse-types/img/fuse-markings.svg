</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що написано на корпусі — і шкала швидкості</text>
<text x="430.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">номінальний струм ≠ струм спрацювання; плюс напруга, відключна здатність і літера швидкості</text>
<text x="200.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">маркування на корпусі</text>
<rect x="128.0" y="102.0" width="144.0" height="36.0" rx="6" fill="#eaf3f7" stroke="#7fa8bd" stroke-width="2"/>
<rect x="117.0" y="102.0" width="12.0" height="36.0" rx="2" fill="#c7c7c7" stroke="#1b1b1b" stroke-width="1.5"/>
<rect x="271.0" y="102.0" width="12.0" height="36.0" rx="2" fill="#c7c7c7" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="200.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T 2A 250V</text>
<rect x="372.0" y="90.0" width="458.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f47b5" stroke-width="1.5"/>
<text x="384.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Номінальний струм (2A)</text>
<text x="384.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">несе вічно; рве при ~2× і вище (часострумова крива)</text>
<rect x="372.0" y="146.0" width="458.0" height="46.0" rx="8" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="384.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Номінальна напруга (250V)</text>
<text x="384.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">максимум, який безпечно розірве; ≥ напруги кола</text>
<rect x="372.0" y="202.0" width="458.0" height="46.0" rx="8" fill="#fafafa" stroke="#c0271e" stroke-width="1.5"/>
<text x="384.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Відключна здатність</text>
<text x="384.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">найбільше коротке, яке згасить без вибуху</text>
<text x="430.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Літера швидкості (та сама часострумова крива, різна стрімкість):</text>
