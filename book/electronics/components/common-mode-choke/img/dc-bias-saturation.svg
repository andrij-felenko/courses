<text x="710.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Насичення! B ≈ B_sat</text>
<text x="675.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">H_bias = N·ΔI / l_e</text>
<rect x="460.0" y="265.0" width="365.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="642.5" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="642.5" dy="0.0">Катастрофічна втрата фільтрації:</tspan><tspan x="642.5" dy="15.2">• Нескомпенсований струм ΔI зміщує осердя в область B_sat</tspan><tspan x="642.5" dy="15.2">• Диференційна проникність падає: μ_r від 10 000 → 15 ... 30</tspan><tspan x="642.5" dy="15.2">• Синфазна індуктивність L_cm обвалюється на 99%</tspan><tspan x="642.5" dy="15.2">• Дросель стає прозорим для завад — пристрій не проходить EMC</tspan></text>
</svg>