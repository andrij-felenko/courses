<rect x="35.0" y="265.0" width="365.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="217.5" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">Стан магнітної системи:</tspan><tspan x="217.5" dy="15.2">• Потоки від струму навантаження взаємно скомпенсовані</tspan><tspan x="217.5" dy="15.2">• H_net = 0, робоча точка сидить точно в нулі</tspan><tspan x="217.5" dy="15.2">• Осердя зберігає максимальну проникність μ_r ≈ 10 000</tspan><tspan x="217.5" dy="15.2">• Дросель ефективно душить завади навіть при 10–30 А струму</tspan></text>
<text x="642.5" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Незбалансований струм (ΔI або I_cm)</text>
<text x="642.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">I₁ ≠ I₂ (витік на землю / асиметрія лінії)</text>
<line x1="512.5" y1="175.0" x2="772.5" y2="175.0" stroke="#1a1a1a" stroke-width="1.2"/>
