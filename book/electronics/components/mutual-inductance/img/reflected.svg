<text x="256.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">один резистор  R/n²</text>
<text x="256.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(V₁/I₁ = (V₂/n)/(n·I₂) = R/n²)</text>
<text x="560.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="560.0" dy="0.0">n = N₂/N₁ — коефіцієнт трансформації;</tspan><tspan x="560.0" dy="15.6">знижувальний (n &lt; 1) робить навантаження</tspan><tspan x="560.0" dy="15.6">«важчим», підвищувальний — «легшим»</tspan></text>
