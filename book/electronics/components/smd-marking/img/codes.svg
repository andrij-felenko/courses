<text x="580.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">100 × 100</text>
<text x="580.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 10 000 Ω = 10 кΩ</text>
<text x="580.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="580.0" dy="0.0">дві цифри → код у ряді E96,</tspan><tspan x="580.0" dy="15.0">літера → множник</tspan></text>
