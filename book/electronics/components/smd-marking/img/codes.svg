<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код-метод пасивних деталей: значущі цифри + множник</text>
<rect x="30.0" y="60.0" width="220.0" height="250.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="140.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">тризначний</text>
<rect x="88.0" y="100.0" width="104.0" height="46.0" rx="6" fill="#f1f1f1" stroke="#c9c9c9" stroke-width="1.3"/>
<text x="140.0" y="134.0" font-family="Consolas, monospace" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="700">103</text>
<text x="140.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">10 × 10³</text>
<text x="140.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 10 000 Ω = 10 кΩ</text>
<text x="140.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="140.0" dy="0.0">перші дві — значущі,</tspan><tspan x="140.0" dy="15.0">третя — скільки нулів</tspan></text>
<rect x="250.0" y="60.0" width="220.0" height="250.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="360.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">літера R = кома</text>
