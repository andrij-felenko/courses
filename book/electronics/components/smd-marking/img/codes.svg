<text x="360.0" y="134.0" font-family="Consolas, monospace" font-size="30" fill="#1a1a1a" text-anchor="middle" font-weight="700">4R7</text>
<text x="360.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">4.7</text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 4.7 (Ом або пФ)</text>
<text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">R сидить на місці коми;</tspan><tspan x="360.0" dy="15.0">не губиться, як крапка</tspan></text>
