<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від коду до компонента: п'ять кроків, не вгадування</text>
<rect x="40.0" y="56.0" width="640.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="70.0" cy="89.0" r="18.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="70.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="102.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Зчитай код точно</text>
<text x="102.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">A7 (велике A, цифра 7). Знайди мітку піна 1 —</text>
<text x="102.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">вона задає орієнтацію корпусу.</text>
<line x1="360.0" y1="122.0" x2="360.0" y2="136.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="138.0" width="640.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="70.0" cy="171.0" r="18.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="70.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="102.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Зафіксуй корпус</text>
<text x="102.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Порахуй ніжки → SOT-23, 3 ніжки.</text>
<text x="102.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Код чинний лише в парі зі своїм корпусом.</text>
<line x1="360.0" y1="204.0" x2="360.0" y2="218.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="220.0" width="640.0" height="66.0" rx="6" fill="#ffffff" stroke="#e0a32e" stroke-width="1.8"/>
<circle cx="70.0" cy="253.0" r="18.0" fill="#e0a32e" stroke="#e0a32e" stroke-width="1.0"/>
<text x="70.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="102.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#e0a32e" text-anchor="start" font-weight="700">Знайди виробника</text>
<text x="102.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Логотип, закупівля чи контекст плати.</text>
<text x="102.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Один код у різних фірм означає різне.</text>
<line x1="360.0" y1="286.0" x2="360.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="302.0" width="640.0" height="66.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="70.0" cy="335.0" r="18.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="70.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="102.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Шукай у таблиці кодів</text>
<text x="102.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Marking-розділ даташита або зведений</text>
<text x="102.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">довідник кодів: рядок A7 → ім'я приладу.</text>
<line x1="360.0" y1="368.0" x2="360.0" y2="382.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="384.0" width="640.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="70.0" cy="417.0" r="18.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="70.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="102.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Звір по даташиту</text>
<text x="102.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Звір корпус, ніжки й функцію знайденого</text>
<text x="102.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">приладу — це відсіює випадкові збіги.</text>
</svg>