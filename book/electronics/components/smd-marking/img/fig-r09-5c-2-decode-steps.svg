</defs>
<text x="380.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як за «A7W» дійти до компонента: ланцюжок кроків</text>
<rect x="40.0" y="56.0" width="680.0" height="66.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<circle cx="70.0" cy="89.0" r="18.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="70.0" y="95.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="100.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Зчитай код точно</text>
<text x="100.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">A7W  (велике A, цифра 7, велике W).</text>
<text x="100.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Крапка/риска = ключ до орієнтації та піна 1.</text>
<line x1="380.0" y1="123.0" x2="380.0" y2="135.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="40.0" y="136.0" width="680.0" height="66.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<circle cx="70.0" cy="169.0" r="18.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="70.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="100.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Зафіксуй корпус</text>
<text x="100.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">SOT-23, 3 ніжки. Корпус звужує пошук:</text>
<text x="100.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">код чинний лише в межах свого корпусу.</text>
<line x1="380.0" y1="203.0" x2="380.0" y2="215.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="40.0" y="216.0" width="680.0" height="66.0" rx="8" fill="#ffffff" stroke="#e0a32e" stroke-width="1.8"/>
<circle cx="70.0" cy="249.0" r="18.0" fill="#e0a32e" stroke="#e0a32e" stroke-width="1"/>
<text x="70.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="100.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#e0a32e" text-anchor="start" font-weight="bold" font-style="normal">Знайди виробника</text>
<text x="100.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Логотип/закупівля/контекст плати.</text>
<text x="100.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Код A7W у різних фірм означає різне.</text>
<line x1="380.0" y1="283.0" x2="380.0" y2="295.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="40.0" y="296.0" width="680.0" height="66.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.8"/>
<circle cx="70.0" cy="329.0" r="18.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="70.0" y="335.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<text x="100.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Шукай у таблиці кодів</text>
<text x="100.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«SMD codebook» або marking-таблиця в даташиті:</text>
<text x="100.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">рядок A7W → ім'я приладу.</text>
<line x1="380.0" y1="363.0" x2="380.0" y2="375.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<rect x="40.0" y="376.0" width="680.0" height="66.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<circle cx="70.0" cy="409.0" r="18.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="70.0" y="415.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="100.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Звір по даташиту</text>
<text x="100.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Відкрий даташит знайденого приладу,</text>
<text x="100.0" y="437.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">звір корпус, ніжки й функцію — щоб не помилитись.</text>
