<text x="435.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">−ΔX</text>
<text x="785.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">−ΔX</text>
<rect x="435.0" y="270.0" width="350.0" height="175.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="610.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові фізичні чинники амплітуди:</text>
<text x="448.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="start">1. Електричне поле E = V_ripple / d_layer (до 5 МВ/м)</text>
<text x="448.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="start">2. Сегнетоелектрична поляризація кераміки BaTiO₃</text>
<text x="448.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="start">3. DC bias зміщує точку й лінеаризує електрострикцію</text>
<text x="448.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="start">4. Коефіцієнт Пуассона ν ≈ 0.3 стискає торці по X</text>
<text x="448.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="start">5. Циклічне зусилля передається на пайку з частотою f</text>
