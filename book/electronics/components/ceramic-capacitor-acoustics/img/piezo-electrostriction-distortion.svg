<rect x="0.0" y="0.0" width="820.0" height="480.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="210.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кристалічна комірка BaTiO₃ (перовскіт)</text>
<rect x="20.0" y="42.0" width="380.0" height="420.0" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.2"/>
