<line x1="610.0" y1="248.0" x2="610.0" y2="232.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Поздовжнє розширення (+ΔZ)</text>
<line x1="445.0" y1="150.0" x2="472.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
