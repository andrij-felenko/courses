<circle cx="120.0" cy="130.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="120.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">+</text>
<text x="120.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Центр симетрії збігається</text>
<text x="120.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Дипольний момент = 0</text>
<text x="300.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T &lt; 125 °C (Тетрагональна, X7R)</text>
<rect x="255.0" y="80.0" width="90.0" height="100.0" rx="2" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="255.0" cy="80.0" r="5.0" fill="#9ca3af" stroke="#1a1a1a" stroke-width="1.0"/>
