<circle cx="345.0" cy="180.0" r="5.0" fill="#9ca3af" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="300.0" cy="120.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="300.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">+</text>
<line x1="300.0" y1="155.0" x2="300.0" y2="133.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="318.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">P_s</text>
<text x="300.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зміщення іона Ti⁴⁺ на ~0.01 нм</text>
<text x="300.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Спонтанна поляризація P_s ≠ 0</text>
<line x1="35.0" y1="228.0" x2="385.0" y2="228.0" stroke="#e5e7eb" stroke-width="1.2"/>
<rect x="34.6" y="246.0" width="350.8" height="28.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Зворотний п'єзоефект: S = d₃₃ · E  (лінійний)</tspan></text>
<text x="210.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Знак поля змінює напрямок деформації (розтяг / стиск)</text>
<rect x="38.3" y="316.0" width="343.4" height="28.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="210.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Електрострикція: S = M₃₃ · E²  (квадратична)</tspan></text>
<text x="210.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Деформація завжди одного знака; подвоює частоту (2f)</text>
<rect x="17.9" y="389.4" width="384.3" height="41.3" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Сумарний відгук під DC-зміщенням + AC-пульсаціями:</tspan><tspan x="210.0" dy="14.3">S(t) ≈ d_eff · E_ac · sin(ωt) + M₃₃ · E_ac² · sin²(ωt)</tspan></text>
<text x="615.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічна деформація тіла MLCC</text>
