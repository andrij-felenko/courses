<text x="350.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Половина між «1» і «10» на осі — це НЕ 5, а ≈3.16 (√10).</text>
<text x="350.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Дуже легко зчитати число втричі-вчетверо хибно, якщо читати лог-вісь як лінійну.</text>
