<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
<rect width="700" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ефект Зенера: електрон тунелює крізь бар'єр</text>
<rect x="330.0" y="95.0" width="40.0" height="135.0" rx="0" fill="#d0d4da" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="350.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бар'єр (щілина)</text>
<circle cx="250.0" cy="162.0" r="7.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="2"/>
<line x1="246.5" y1="162.0" x2="253.5" y2="162.0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
<text x="250.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">електрон</text>
<line x1="266.0" y1="162.0" x2="470.0" y2="162.0" stroke="#1f8a3b" stroke-width="2.4" stroke-dasharray="5,4" marker-end="url(#aGreen)"/>
<text x="480.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">тунелює — крізь стіну</text>
<path d="M 262,150 Q 350,46 442,150" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="3,3"/>
<line x1="345.0" y1="72.0" x2="355.0" y2="82.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<line x1="355.0" y1="72.0" x2="345.0" y2="82.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<text x="350.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">над стіною — зась</text>
<text x="350.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сильне поле робить бар'єр тонким — і квантовий електрон проходить наскрізь, а не над ним.</text>
</svg>
