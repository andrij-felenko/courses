<text x="390.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">EMI-бусина зблизька: котушка з одного витка у втратному матеріалі</text>
<text x="390.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">для постійного струму — просто шматок дроту; для високочастотного шуму — пастка</text>
<rect x="60.0" y="90.0" width="320.0" height="250.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="220.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SMD-бусина (розріз)</text>
<rect x="110.0" y="150.0" width="220.0" height="110.0" rx="6" fill="#6a6f76" stroke="#4a4e54" stroke-width="2"/>
<text x="220.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ферит</text>
<line x1="70.0" y1="205.0" x2="110.0" y2="205.0" stroke="#b5732e" stroke-width="5" stroke-linecap="round"/>
<line x1="110.0" y1="205.0" x2="330.0" y2="205.0" stroke="#b5732e" stroke-width="5" stroke-linecap="round"/>
<line x1="330.0" y1="205.0" x2="370.0" y2="205.0" stroke="#b5732e" stroke-width="5" stroke-linecap="round"/>
<text x="220.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="normal" font-style="normal">провідник наскрізь — один «виток»</text>
<rect x="96.0" y="150.0" width="14.0" height="110.0" rx="0" fill="#9aa0a6" stroke="#7c7c82" stroke-width="1.4"/>
<rect x="330.0" y="150.0" width="14.0" height="110.0" rx="0" fill="#9aa0a6" stroke="#7c7c82" stroke-width="1.4"/>
<text x="220.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">DCR — міліоми: для DC деталі «нема»;</text>
<text x="220.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">увесь сенс — у фериті довкола дроту</text>
<rect x="420.0" y="90.0" width="300.0" height="250.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="570.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">феритове кільце на провіднику</text>
<circle cx="570.0" cy="200.0" r="62.0" fill="#6a6f76" stroke="#4a4e54" stroke-width="2"/>
<circle cx="570.0" cy="200.0" r="26.0" fill="#ffffff" stroke="#4a4e54" stroke-width="2"/>
<line x1="440.0" y1="200.0" x2="544.0" y2="200.0" stroke="#b5732e" stroke-width="4" stroke-linecap="round"/>
<line x1="596.0" y1="200.0" x2="700.0" y2="200.0" stroke="#b5732e" stroke-width="4" stroke-linecap="round"/>
<text x="570.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">та сама ідея без корпуса: магнітне поле</text>
<text x="570.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">струму замикається крізь утратний ферит</text>
<text x="390.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">індуктивності тут крихти (§2.2.2: один виток) — головну роботу виконують втрати матеріалу</text>
</svg>
