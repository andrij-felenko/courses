<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стеля напруги комірки: хімічна межа, а не пробій</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вище певної напруги електроліт починає розкладатися — «діелектрик» тут рідкий</text>
