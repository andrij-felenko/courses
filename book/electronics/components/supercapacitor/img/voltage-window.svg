<text x="385.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">органічний електроліт</text>
<text x="385.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">типовий номінал 2.7 В</text>
<text x="225.0" y="292.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">≈1.2 В: вода → H₂ + O₂</text>
<text x="385.0" y="143.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">розклад розчинника, газ</text>
<text x="530.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Це не пробій із §2.1.5:</text>
<text x="530.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поле не проколює ізолятор —</text>
<text x="530.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">напруга запускає електроліз,</text>
<text x="530.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">газ і деградацію комірки.</text>
<text x="530.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">W = ½·C·V² — стеля</text>
<text x="530.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">б'є у квадраті: на 2.7 В</text>
<text x="530.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">комірка тримає вчетверо менше,</text>
<text x="530.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ніж тримала б на 5.4 В.</text>
<text x="530.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Вихід — послідовні збірки (§2.1.7)</text>
</svg>
