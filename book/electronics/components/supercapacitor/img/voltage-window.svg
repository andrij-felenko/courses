<text x="225.0" y="438.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дешево й безпечно, але ~1 В</text>
