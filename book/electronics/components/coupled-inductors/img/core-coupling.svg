<text x="537.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Розсіювання Φ_lk2
(L_lk2 = (1−k)·L₂)</text>
<rect x="30.0" y="360.0" width="780.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="420.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема: кожна обмотка діє як послідовні L_leak та L_m. При k → 1 розсіювання зникає.</text>
