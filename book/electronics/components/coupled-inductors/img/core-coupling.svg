<rect x="115.0" y="248.0" width="50.0" height="14.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2.0"/>
<rect x="115.0" y="270.0" width="50.0" height="14.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2.0"/>
<text x="80.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Вхід 1 (●)</text>
<text x="80.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Вихід 1</text>
<line x1="60.0" y1="180.0" x2="110.0" y2="180.0" stroke="#b45309" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="270.0" x2="60.0" y2="270.0" stroke="#b45309" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="80.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Обмотка 1
(L₁, i₁)</text>
<path d="M 190,180 C 230,180 230,260 190,260" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4"/>
<path d="M 140,180 C 100,180 100,260 140,260" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,4"/>
<text x="303.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Розсіювання Φ_lk1
(L_lk1 = (1−k)·L₁)</text>
