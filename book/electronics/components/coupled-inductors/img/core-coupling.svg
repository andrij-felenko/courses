<text x="760.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Вихід 2</text>
<line x1="780.0" y1="180.0" x2="730.0" y2="180.0" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="730.0" y1="270.0" x2="780.0" y2="270.0" stroke="#1d4ed8" stroke-width="2.0" marker-end="url(#arrow)"/>
