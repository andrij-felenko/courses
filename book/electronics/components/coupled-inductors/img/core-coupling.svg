<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="410.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="420.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітні потоки двох зв'язаних обмоток на спільному осерді</text>
<text x="420.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Повний потік кожної обмотки: Φ = Φ_m (взаємний зв'язок) + Φ_lk (розсіювання в повітря)</text>
<path d="M 140,100 L 700,100 L 700,340 L 140,340 Z M 240,170 L 240,270 L 600,270 L 600,170 Z" fill="#374151" fill-rule="evenodd" stroke="#1f2937" stroke-width="2"/>
<path d="M 190,135 L 650,135 L 650,305 L 190,305 Z" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8,5"/>
<text x="420.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Спільний потік в осерді: Φ_m (індуктивність намагнічування L_m)</text>
<text x="420.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Коефіцієнт зв'язку k = M / √(L₁·L₂) = Φ_m / Φ_повний</text>
<rect x="115.0" y="160.0" width="50.0" height="14.0" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2.0"/>
