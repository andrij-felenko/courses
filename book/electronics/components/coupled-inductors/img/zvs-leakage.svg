<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">М'яка комутація (ZVS) за рахунок індуктивності розсіювання L_leak</text>
<text x="420.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Енергія, накопичена в розсіюванні (0.5·L_leak·I²), перезаряджає паразитивні ємності C_oss під час мертвого часу t_dead</text>
