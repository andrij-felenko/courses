<text x="600.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергетичний баланс резонансного переходу</text>
<rect x="410.0" y="140.0" width="380.0" height="230.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="600.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. Умова повного розряду C_oss для 100% ZVS:</tspan><tspan x="600.0" dy="14.9">    0.5 · L_leak · I_pk²  ≥  0.5 · (C_oss1 + C_oss2) · Vin²</tspan><tspan x="600.0" dy="14.9"></tspan><tspan x="600.0" dy="14.9">2. Мінімальний струм для досягнення нульової напруги:</tspan><tspan x="600.0" dy="14.9">    I_pk,min = Vin · √(2·C_oss / L_leak)</tspan><tspan x="600.0" dy="14.9"></tspan><tspan x="600.0" dy="14.9">3. Необхідна тривалість мертвого часу (Dead Time):</tspan><tspan x="600.0" dy="14.9">    t_dead ≈ (π / 2) · √(L_leak · 2·C_oss)</tspan><tspan x="600.0" dy="14.9"></tspan><tspan x="600.0" dy="14.9">Результат: транзистор відкривається при V_ds = 0 В.</tspan><tspan x="600.0" dy="14.9">Динамічні втрати вмикання P_sw = 0.5·f·C·V² ПОВНІСТЮ ЗНИКАЮТЬ!</tspan></text>
</svg>