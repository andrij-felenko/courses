<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурна класифікація керамічних конденсаторів за EIA RS-198</text>
<rect x="40.0" y="52.0" width="760.0" height="115.0" rx="8" fill="#f2faf5" stroke="#27ae60" stroke-width="1.8"/>
<text x="60.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Клас I: Ультрастабільні параелектрики (C0G / NP0)</text>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Код C0G: C = 0.0 ppm/°C (мантиса)  |  0 = множник ×(-1)  |  G = допуск ТКЄ ±30 ppm/°C</tspan><tspan x="60.0" dy="15.5">Діапазон: −55 °C ... +125 °C  |  Дрейф: 0 ± 30 ppm/°C (абсолютно лінійний, ΔC &lt; 0.3% у всьому діапазоні)</tspan><tspan x="60.0" dy="15.5">Властивості: нульовий ефект старіння, відсутність DC-bias провалу ємності, нульовий п'єзошум.</tspan></text>
<rect x="40.0" y="185.0" width="760.0" height="315.0" rx="8" fill="none" stroke="#b45309" stroke-width="1.8"/>
<text x="60.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="start" font-weight="700">Клас II / III: Сегнетоелектрики високої ємності (трисимвольний код EIA)</text>
<rect x="60.0" y="227.0" width="225.0" height="140.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="172.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1-й символ: мін. темп.</text>
<text x="75.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="75.0" dy="0.0">X = −55 °C  (промисловий)</tspan><tspan x="75.0" dy="15.4">Y = −30 °C  (помірний)</tspan><tspan x="75.0" dy="15.4">Z = +10 °C  (комерційний)</tspan></text>
<rect x="305.0" y="227.0" width="225.0" height="140.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="417.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2-й символ: макс. темп.</text>
<text x="320.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="320.0" dy="0.0">5 = +85 °C   (споживчий)</tspan><tspan x="320.0" dy="15.4">7 = +125 °C  (промисловий)</tspan><tspan x="320.0" dy="15.4">8 = +150 °C  (автомобільний)</tspan></text>
<rect x="550.0" y="227.0" width="230.0" height="140.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="665.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3-й символ: дрейф ΔC/C</text>
<text x="565.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="565.0" dy="0.0">P = ±10%</tspan><tspan x="565.0" dy="15.4">R = ±15%   (стандартний X7R/X5R)</tspan><tspan x="565.0" dy="15.4">U = +22% / −56%  (Z5U)</tspan><tspan x="565.0" dy="15.4">V = +22% / −82%  (Y5V, критичний)</tspan></text>
<rect x="60.0" y="380.0" width="720.0" height="100.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="75.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Типові комбінації в інженерній практиці:</text>
<text x="75.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="75.0" dy="0.0">• X7R: −55 °C...+125 °C, ΔC = ±15%  →  універсальний вибір для аналогових і цифрових кіл</tspan><tspan x="75.0" dy="14.9">• X5R: −55 °C...+85 °C, ΔC = ±15%   →  компактні плати з високою ємністю (смартфони, IoT)</tspan><tspan x="75.0" dy="14.9">• Y5V: −30 °C...+85 °C, ΔC = +22%/−82%  →  висока щільність ємності, але падіння до 5 разів на морозі!</tspan></text>
</svg>