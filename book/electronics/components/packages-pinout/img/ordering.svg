<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код замовлення: один номер — багато сенсів</text>
<rect x="90.0" y="88.0" width="160.0" height="46.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="170.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">LM358</text>
<line x1="170.0" y1="138.0" x2="170.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="170.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">сімейство</text>
<rect x="254.0" y="88.0" width="56.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="282.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">I</text>
<line x1="282.0" y1="138.0" x2="282.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="282.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">темп. сорт (−40…85)</text>
<rect x="314.0" y="88.0" width="56.0" height="46.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="342.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">D</text>
<line x1="342.0" y1="138.0" x2="342.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="342.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">корпус (SOIC)</text>
<rect x="374.0" y="88.0" width="56.0" height="46.0" rx="6" fill="#fff3e0" stroke="#e0a32e" stroke-width="1.8"/>
<text x="402.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#e0a32e" text-anchor="middle" font-weight="700">R</text>
<line x1="402.0" y1="138.0" x2="402.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="402.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">стрічка/котушка</text>
<text x="350.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Один суфікс — і це інший корпус, інший сорт чи інша фасовка.</text>
<text x="350.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Замовиш не той суфікс — приїде той самий чип, але в корпусі, що не влазить.</text>
</svg>