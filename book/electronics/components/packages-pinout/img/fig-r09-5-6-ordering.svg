<text x="350.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Замовиш не той суфікс — приїде той самий чип, але в корпусі, що не влазить у плату.</text>
<text x="350.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Таблиця Ordering Information розшифровує кожну літеру номера. Звіряй корпус і сорт ПЕРЕД замовленням.</text>
