<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня функціональна архітектура годинника реального часу (RTC)</text><rect x="20.0" y="55.0" width="260.0" height="340.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тактовий генератор і дільник</text><rect x="40.0" y="95.0" width="220.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="118.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Генератор Пірса</tspan><tspan x="150.0" dy="15.6">32 768 Гц (кварц)</tspan></text><line x1="150.0" y1="150.0" x2="150.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="158.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">32.768 кГц</text><rect x="40.0" y="185.0" width="220.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">15-розрядний дільник</tspan><tspan x="150.0" dy="15.6">(2¹⁵ Ripple Counter)</tspan><tspan x="150.0" dy="15.6">32 768 Гц → 1 Гц</tspan></text><line x1="150.0" y1="250.0" x2="150.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40.0" y="285.0" width="220.0" height="85.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Секундний строб (1 Гц)</tspan><tspan x="150.0" dy="14.3">Digital Trimming / Calib</tspan><tspan x="150.0" dy="14.3">Фазове підстроювання</tspan></text><line x1="260.0" y1="325.0" x2="305.0" y2="325.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="282.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1 Гц</text><rect x="305.0" y="55.0" width="280.0" height="340.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Календарний блок BCD</text><rect x="325.0" y="95.0" width="240.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Секунди (00..59) &amp; Хвилини (00..59)</tspan></text><line x1="445.0" y1="137.0" x2="445.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="325.0" y="150.0" width="240.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Години (00..23 / 12 AM/PM)</tspan></text><line x1="445.0" y1="192.0" x2="445.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="325.0" y="205.0" width="240.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">День тижня (1..7) &amp; Число (01..31)</tspan></text><line x1="445.0" y1="247.0" x2="445.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="325.0" y="260.0" width="240.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="284.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Місяць &amp; Рік (00..99)</tspan></text><line x1="445.0" y1="302.0" x2="445.0" y2="315.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="325.0" y="315.0" width="240.0" height="60.0" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Логіка високосного року</tspan><tspan x="445.0" dy="13.0">Апаратна корекція 28/29 лютого</tspan><tspan x="445.0" dy="13.0">Працює коректно до 2099 року</tspan></text><rect x="605.0" y="55.0" width="275.0" height="340.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="742.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керування, будильники, зв'язок</text><rect x="625.0" y="95.0" width="235.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="742.5" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Регістри будильників</tspan><tspan x="742.5" dy="14.3">Alarm 1 / Alarm 2 (маски)</tspan></text><line x1="860.0" y1="120.0" x2="890.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="868.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">INT/SQW</text><rect x="625.0" y="160.0" width="235.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="742.5" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Регістри конфігурації / статусу</tspan><tspan x="742.5" dy="14.3">Резервна пам'ять (SRAM)</tspan></text><rect x="625.0" y="225.0" width="235.0" height="55.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="742.5" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Time-Hold Latching</tspan><tspan x="742.5" dy="14.3">Фіксація даних під час читання</tspan></text><rect x="625.0" y="295.0" width="235.0" height="80.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="742.5" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Цифровий інтерфейс</tspan><tspan x="742.5" dy="14.3">Шина I²C (SDA, SCL) / SPI</tspan><tspan x="742.5" dy="14.3">Адресація та регістровий доступ</tspan></text><line x1="565.0" y1="250.0" x2="625.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="625.0" y1="255.0" x2="565.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="565.0" y1="120.0" x2="625.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
