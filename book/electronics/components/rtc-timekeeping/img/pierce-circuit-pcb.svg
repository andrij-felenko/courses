tray ≈ 2..5 пФ (паразитна ємність плати й виводів)</tspan></text><rect x="460.0" y="55.0" width="420.0" height="335.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологія трасування та охоронне кільце</text><rect x="480.0" y="110.0" width="100.0" height="120.0" rx="3" fill="#334155" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">RTC IC</text><rect x="580.0" y="130.0" width="14.0" height="10.0" rx="6" fill="#f59e0b" stroke="#333333" stroke-width="1.5"/><text x="572.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="end" font-weight="700">OSCI</text><rect x="580.0" y="180.0" width="14.0" height="10.0" rx="6" fill="#f59e0b" stroke="#333333" stroke-width="1.5"/><text x="572.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="end" font-weight="700">OSCO</text><rect x="580.0" y="210.0" width="14.0" height="10.0" rx="6" fill="#38bdf8" stroke="#333333" stroke-width="1.5"/><text x="572.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="end" font-weight="700">GND</text><path d="M 594,215 L 640,215 L 640,245 L 830,245 L 830,105 L 640,105 L 640,125 L 594,125 L 594,145 L 630,145 L 630,175 L 594,175 L 594,195 L 630,195 L 630,215 Z" fill="none" stroke="#27ae60" stroke-width="3"/><line x1="594.0" y1="135.0" x2="700.0" y2="135.0" stroke="#ea580c" stroke-width="2.5"/><line x1="594.0" y1="185.0" x2="670.0" y2="185.0" stroke="#ea580c" stroke-width="2.5"/><rect x="670.0" y="180.0" width="20.0" height="10.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/><line x1="690.0" y1="185.0" x