roke="#c0392b" stroke-width="1.5"/><text x="670.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Правила трасування:</tspan><tspan x="670.0" dy="13.0">1. Жодних швидкісних сигналів (SPI, ШІМ) під кварцом.</tspan><tspan x="670.0" dy="13.0">2. Суцільний земляний шар на нижньому шарі.</tspan><tspan x="670.0" dy="13.0">3. Змивання залишків флюсу (витік 10 МОм зриває генерацію).</tspan></text>
