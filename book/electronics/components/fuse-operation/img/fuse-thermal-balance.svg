<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 895 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="895" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий баланс плавкої ланки: генерація I²R проти тепловідводу</text>
<rect x="35.0" y="55.0" width="260.0" height="340.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="45.0" y="65.0" width="240.0" height="32.0" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="165.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Штатний режим (I ≤ I_nom)</text>
<rect x="90.6" y="110.2" width="148.8" height="39.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="165.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Теплогенерація:</tspan><tspan x="165.0" dy="15.6">Q_in = I² · R(T) · t</tspan></text>
<rect x="56.4" y="175.2" width="217.2" height="39.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="165.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Тепловідвід:</tspan><tspan x="165.0" dy="15.6">Q_out = k_th · (T - T_amb) · t</tspan></text>
<rect x="73.4" y="245.2" width="183.1" height="39.6" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Q_in = Q_out</tspan><tspan x="165.0" dy="15.6">(Стаціонарна рівновага)</tspan></text>
<rect x="71.2" y="319.2" width="187.6" height="51.6" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="165.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Температура стабілізується:</tspan><tspan x="165.0" dy="14.3">T_стала &lt;&lt; T_плавлення</tspan><tspan x="165.0" dy="14.3">(Провідник не пошкоджується)</tspan></text>
<rect x="325.0" y="55.0" width="260.0" height="340.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="335.0" y="65.0" width="240.0" height="32.0" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1.0"/>
<text x="455.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">Перевантаження (I_nom &lt; I ≤ 3·I_nom)</text>
<rect x="353.2" y="110.2" width="203.5" height="39.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="455.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Q_in &gt; Q_out</tspan><tspan x="455.0" dy="15.6">(Повільне накопичення тепла)</tspan></text>
<rect x="363.5" y="175.2" width="183.0" height="39.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="455.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Частина тепла розсіюється</tspan><tspan x="455.0" dy="15.6">у виводи та корпус</tspan></text>
<rect x="337.4" y="245.2" width="235.2" height="39.6" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="455.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">T(t) повільно зростає</tspan><tspan x="455.0" dy="15.6">Час розриву: секунди...хвилини</tspan></text>
<rect x="364.4" y="326.4" width="181.3" height="37.3" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="455.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Діє M-ефект (дифузія олова)</tspan><tspan x="455.0" dy="14.3">або прогрів термобаласту</tspan></text>
<rect x="615.0" y="55.0" width="260.0" height="340.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="625.0" y="65.0" width="240.0" height="32.0" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.0"/>
<text x="745.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Коротке замикання (I &gt;&gt; I_nom)</text>
<rect x="633.0" y="110.2" width="224.0" height="39.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="745.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Q_in &gt;&gt;&gt; Q_out</tspan><tspan x="745.0" dy="15.6">Адіабатичний процес (Q_out ≈ 0)</tspan></text>
<rect x="653.5" y="175.2" width="183.0" height="39.6" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="745.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Тепло не встигає вийти</tspan><tspan x="745.0" dy="15.6">в довкілля за мілісекунди</tspan></text>
<rect x="631.1" y="245.2" width="227.8" height="39.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Уся енергія йде на плавлення:</tspan><tspan x="745.0" dy="15.6">I²t_melt = const(матеріал, S)</tspan></text>
<rect x="638.7" y="326.4" width="212.6" height="37.3" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="745.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Вибухове випаровування перешийка</tspan><tspan x="745.0" dy="14.3">і запалювання електричної дуги</tspan></text>
</svg>