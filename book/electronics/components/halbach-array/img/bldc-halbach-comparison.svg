<text x="751.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">↑</text>
<rect x="460.0" y="185.0" width="320.0" height="46.0" rx="3" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Безпазовий статор (Coreless / Slotless)</text>
<text x="620.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Когінг = 0, чистий синусоїдний момент</text>
<text x="460.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Сталеве ярмо повністю відсутнє (економія ваги)</text>
<text x="460.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Поле в зазорі зростає на ≈40% (B ~ 1.4 B₀)</text>
<text x="460.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Нульовий когінг та ідеальна плавність обертання</text>
<text x="460.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Рекордна питома потужність (кВт/кг)</text>
<rect x="60.0" y="368.0" width="720.0" height="76.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.6"/>
<text x="420.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масив Гальбаха усуває необхідність у важкому феромагнітному осерді ротора.</text>
<text x="420.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Це кардинально знижує момент інерції ротора, дозволяє миттєве прискорення приводів</text>
<text x="420.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">та забезпечує максимальний ККД у дронах, сервоприводах і безпілотній авіації.</text>
