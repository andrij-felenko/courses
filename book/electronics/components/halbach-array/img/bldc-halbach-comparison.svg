<text x="345.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">S (↓)</text>
<rect x="60.0" y="185.0" width="320.0" height="46.0" rx="3" fill="#e8eaed" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмотки та зубці статора</text>
<text x="220.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Присутній зубцевий момент (когінг)</text>
<text x="60.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Сталеве ярмо додає 30–50% маси ротора</text>
<text x="60.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прямокутна форма поля -&gt; когінг і гармоніки</text>
<text x="60.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Втрати на вихрові струми в магнітах і сталі</text>
<text x="620.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ротор Гальбаха (без сталевого ярма)</text>
<rect x="460.0" y="85.0" width="320.0" height="24.0" rx="3" fill="#34495e" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Немагнітний карбоновий бандаж (надлегкий)</text>
