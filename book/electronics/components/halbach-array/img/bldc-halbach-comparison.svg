<text x="623.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">↓</text>
<rect x="658.0" y="109.0" width="58.0" height="46.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="687.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">←</text>
