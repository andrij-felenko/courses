<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння конструкції ротора BLDC: класичний магнітопровід проти масиву Гальбаха</text>
<text x="220.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звичайний ротор із залізним ярмом</text>
<rect x="60.0" y="85.0" width="320.0" height="34.0" rx="3" fill="#95a5a6" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Важке сталеве магнітне ярмо (Back-yoke)</text>
<rect x="70.0" y="119.0" width="70.0" height="42.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="105.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">N (↑)</text>
