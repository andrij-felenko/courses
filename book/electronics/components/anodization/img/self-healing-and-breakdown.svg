<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Самозаліковування та іскровий пробій</text>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка діелектрика під навантаженням: відновлення проти пробою</text>
<rect x="40.0" y="50.0" width="325.0" height="310.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="50.0" width="325.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="202.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">А. Ефект самозаліковування (Self-healing)</text>
<rect x="60.0" y="110.0" width="285.0" height="45.0" rx="6" fill="#d2d7df" stroke="#333333" stroke-width="1.0"/>
<text x="202.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Вентильний метал (Al / Ta анод)</text>
<rect x="60.0" y="155.0" width="285.0" height="35.0" rx="6" fill="#b5d5c5" stroke="#27ae60" stroke-width="1.2"/>
<text x="120.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0e5a32" text-anchor="middle">Оксидний діелектрик</text>
<rect x="230.0" y="155.0" width="14.0" height="35.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="237.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
<rect x="60.0" y="190.0" width="285.0" height="35.0" rx="6" fill="#e8f4fc" stroke="#9ac4db" stroke-width="1.0"/>
<text x="202.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e5780" text-anchor="middle">Електроліт / Провідний полімер (катод)</text>
<line x1="237.0" y1="245.0" x2="237.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="65.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">1. Рідкий електроліт: електрохімічне доокиснення Al₂O₃</text>
<text x="65.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Полімер / MnO₂: локальний нагрів перетворює катод</text>
<text x="65.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">в ізолятор (вигорання дефекту без пожежі)</text>
<text x="202.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Струм витоку падає, дефект ізолюється</text>
<rect x="395.0" y="50.0" width="325.0" height="310.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="395.0" y="50.0" width="325.0" height="40.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="557.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Б. Іскровий пробій (Scintillation / PEO)</text>
<rect x="415.0" y="110.0" width="285.0" height="45.0" rx="6" fill="#d2d7df" stroke="#333333" stroke-width="1.0"/>
<text x="557.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Метал (напруга U_form &gt; U_breakdown)</text>
<rect x="415.0" y="155.0" width="285.0" height="35.0" rx="6" fill="#b5d5c5" stroke="#27ae60" stroke-width="1.2"/>
<path d="M 530 195 L 538 172 L 532 172 L 542 150 L 536 170 L 544 170 Z" fill="#f39c12" stroke="#c0392b" stroke-width="1"/>
<path d="M 580 195 L 588 172 L 582 172 L 592 150 L 586 170 L 594 170 Z" fill="#f39c12" stroke="#c0392b" stroke-width="1"/>
<rect x="415.0" y="190.0" width="285.0" height="35.0" rx="6" fill="#e8f4fc" stroke="#9ac4db" stroke-width="1.0"/>
<text x="557.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e5780" text-anchor="middle">Електроліт під високою напругою</text>
<text x="418.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">1. Електричне поле перевищує діелектричну міцність</text>
<text x="418.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Лавинна іонізація та локальні плазмові мікродуги</text>
<text x="418.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. Кристалізація аморфного оксиду (руйнування ізоляції)</text>
<text x="557.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Утворення грубих керамічних плівок (PEO)</text>
<text x="380.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Конденсатори формують нижче напруги сцинтиляції; явище PEO застосовують для надтвердої кераміки</text>
</svg>