<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бар'єрний оксид проти пористого</text>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два типи анодних плівок: бар'єрна та пориста</text>
<rect x="40.0" y="50.0" width="325.0" height="325.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="50.0" width="325.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="202.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">А. Бар'єрний оксид (конденсатори)</text>
<text x="202.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нейтральний електроліт (pH 5–7)</text>
<text x="202.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Борні, фосфатні, адипатні розчини</text>
<rect x="60.0" y="150.0" width="285.0" height="45.0" rx="6" fill="#e8f4fc" stroke="#bcd4e6" stroke-width="1.0"/>
<text x="202.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e5780" text-anchor="middle">Рідкий електроліт (або MnO₂ / полімер)</text>
<rect x="60.0" y="195.0" width="285.0" height="45.0" rx="6" fill="#b5d5c5" stroke="#27ae60" stroke-width="1.5"/>
<text x="202.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0e5a32" text-anchor="middle" font-weight="700">Суцільний щільний діелектрик (Al₂O₃ / Ta₂O₅)</text>
<text x="202.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0e5a32" text-anchor="middle">Товщина d = α_v · U_form (нанометри)</text>
<rect x="60.0" y="240.0" width="285.0" height="55.0" rx="6" fill="#d2d7df" stroke="#333333" stroke-width="1.2"/>
<text x="202.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вентильний метал (Al, Ta, Nb фольга/губка)</text>
<text x="65.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Оксид нерозчинний в електроліті</text>
<text x="65.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Струм спадає до мікроамперів (самозамикання)</text>
<text x="65.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Висока діелектрична міцність (E ~ 10⁷ В/см)</text>
<rect x="395.0" y="50.0" width="325.0" height="325.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="395.0" y="50.0" width="325.0" height="44.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.2"/>
<text x="557.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle" font-weight="700">Б. Пористий оксид (AAO, захист/нанопори)</text>
<text x="557.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кислий електроліт (pH 0–2)</text>
<text x="557.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сірчана H₂SO₄, щавлева H₂C₂O₄ кислоти</text>
