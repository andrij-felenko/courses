<text x="557.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0e5a32" text-anchor="middle">Тонкий бар'єрний шар на дні пор</text>
<text x="418.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Конкуренція росту поля і кислотного розчинення</text>
<text x="418.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Товщина шару до десятків мікронів (пористі стінки)</text>
<text x="418.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Забарвлення барвниками, наношаблони, антикорозія</text>
<text x="380.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">У конденсаторах потрібен суто бар'єрний шар; пористий оксид використовують для твердих захисних покриттів</text>
