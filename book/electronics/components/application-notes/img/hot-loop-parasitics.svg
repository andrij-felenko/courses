<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мінімізація площі силового контуру (Hot Loop) у Step-Down DCDC</text>
<rect x="30.0" y="55.0" width="360.0" height="360.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">НЕПРАВИЛЬНО: Велика площа Hot Loop</text>
<rect x="50.0" y="110.0" width="60.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="80.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">C_IN</text>
<rect x="280.0" y="110.0" width="80.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="320.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">DCDC IC</text>
<text x="320.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">VIN / SW</text>
<rect x="170.0" y="270.0" width="80.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">D1 / GND</text>
<line x1="110.0" y1="130.0" x2="280.0" y2="130.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="320.0" y1="180.0" x2="320.0" y2="290.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="320.0" y1="290.0" x2="250.0" y2="290.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="170.0" y1="290.0" x2="80.0" y2="290.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="80.0" y1="290.0" x2="80.0" y2="150.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="200.0" cy="200.0" r="45.0" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Велика площа S</text>
<text x="200.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">L_loop ≈ 15 нГн</text>
<text x="210.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Високий сплеск V = L·(dI/dt)</text>
<text x="210.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Потужне випромінювання EMI (радіозавади)</text>
<text x="210.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Дзвін на вузлі SW руйнує польові ключі</text>
<rect x="430.0" y="55.0" width="360.0" height="360.0" rx="8" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО: Мінімізований Hot Loop</text>
<rect x="460.0" y="130.0" width="60.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">C_IN</text>
<rect x="540.0" y="130.0" width="90.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="585.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">DCDC IC</text>
<text x="585.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">VIN  PGND</text>
<rect x="470.0" y="120.0" width="150.0" height="90.0" rx="4" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="535.0" cy="165.0" r="20.0" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
<text x="528.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">S min</text>
<rect x="660.0" y="140.0" width="50.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="685.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">L1</text>
<rect x="730.0" y="140.0" width="50.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="755.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">C_OUT</text>
<line x1="630.0" y1="160.0" x2="660.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<line x1="710.0" y1="160.0" x2="730.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<text x="610.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Кераміка C_IN стоїть упритул до VIN і PGND</text>
<text x="610.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зворотний струм іде прямою широкою міддю</text>
<text x="610.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">L_loop &lt; 1.5 нГн → сплески придушено на 80%</text>
<text x="610.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Суцільний суміжний полігон GND під верхнім шаром</text>
<text x="610.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Магнітне поле замикається в мікрооб'ємі</text>
<text x="610.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Повна відповідність стандартам CISPR 32 / EN 55032</text>
</svg>