<text x="630.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сфери застосування компенсаторів</text>
<rect x="485.0" y="111.0" width="290.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Type II (1 нуль, 2 полюси):</tspan><tspan x="630.0" dy="13.0">• Струмовий режим (Current-Mode Control)</tspan><tspan x="630.0" dy="13.0">• 1 полюс навантаження + 1 ESR-нуль</tspan><tspan x="630.0" dy="13.0">• Кола: Rc, Cc, Cp на виводі COMP</tspan><tspan x="630.0" dy="13.0">• Фазовий підйом: до +90°</tspan></text>
<rect x="485.0" y="251.0" width="290.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Type III (2 нулі, 3 полюси):</tspan><tspan x="630.0" dy="13.0">• Режим за напругою (Voltage-Mode)</tspan><tspan x="630.0" dy="13.0">• Компенсує подвійний LC-полюс кераміки</tspan><tspan x="630.0" dy="13.0">• Кола: R1, R2, R3, C1, C2, C3</tspan><tspan x="630.0" dy="13.0">• Фазовий підйом: до +160°</tspan></text>
