<text x="240.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Type III додає 2 нулі перед f_LC та піднімає фазу на +120°</text>
<text x="240.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Запобігає генерації та перерегулюванню при стрибках струму</text>
