<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія технічної документації напівпровідникових компонентів</text>
<rect x="70.0" y="56.2" width="680.0" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Silicon Errata (Лист апаратних помилок)</tspan><tspan x="410.0" dy="15.6">Апаратні баги кристала, обмеження ревізій та обхідні шляхи (Workarounds)</tspan></text>
<rect x="70.0" y="136.2" width="680.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Datasheet (Паспорт компонента)</tspan><tspan x="410.0" dy="15.6">Юридичні межі: Absolute Max, Guaranteed Min/Typ/Max, розпіновка, корпуси</tspan></text>
<rect x="70.0" y="221.2" width="680.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Application Notes (AN / Прикладні інженерні нотатки)</tspan><tspan x="410.0" dy="15.6">Розрахунок кіл компенсації (Type II/III), правила PCB Layout, боротьба з EMI</tspan></text>
<rect x="80.0" y="313.4" width="320.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Reference Design (RD)</tspan><tspan x="240.0" dy="15.6">Повний проєкт: схема, BOM,</tspan><tspan x="240.0" dy="15.6">Gerber, теплові карти й EMI-тести</tspan></text>
<rect x="420.0" y="313.4" width="320.0" height="63.2" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="580.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Evaluation Board (EVB/EVK)</tspan><tspan x="580.0" dy="15.6">Мануал налагоджувальної плати:</tspan><tspan x="580.0" dy="15.6">джампери, тестові точки, виміри</tspan></text>
<rect x="70.0" y="409.4" width="680.0" height="41.3" rx="6" fill="#f9f9f9" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Vendor Simulators &amp; White Papers (LTspice, WEBENCH, ADIsim)</tspan><tspan x="410.0" dy="14.3">Концептуальні статті, макромоделі та параметричний синтез</tspan></text>
