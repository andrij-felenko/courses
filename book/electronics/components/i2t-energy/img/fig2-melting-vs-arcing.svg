<circle cx="605.0" cy="355.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="342.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Clearing I²t (Total) = Melting I²t + Arcing I²t (Повна пропущена енергія)</text>
