<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
<rect width="820" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дроти як деталь: переріз, AWG, допустимий струм</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">товщина задає і опір (R=ρL/A), і допустимий струм; багатожильний — гнучкіший</text>
<rect x="40.0" y="86.0" width="360.0" height="290.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="220.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Суцільний vs багатожильний</text>
<circle cx="140.0" cy="188.0" r="36.0" fill="#d9a066" stroke="#a06a2a" stroke-width="2"/>
<text x="140.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">суцільний</text>
<text x="140.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тримає форму, дешевий</text>
<text x="140.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">ламається від частих згинів</text>
<circle cx="300.0" cy="188.0" r="38.0" fill="none" stroke="#a06a2a" stroke-width="2"/>
<circle cx="318.0" cy="188.0" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<circle cx="309.0" cy="203.6" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<circle cx="291.0" cy="203.6" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<circle cx="282.0" cy="188.0" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<circle cx="291.0" cy="172.4" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<circle cx="309.0" cy="172.4" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<circle cx="300.0" cy="188.0" r="8.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.2"/>
<text x="300.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">багатожильний</text>
<text x="300.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">гнучкий, стійкий до вібрації</text>
<text x="220.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Чому гнучкіший: тонка жилка гнеться легко (напруга згину ∝ товщині),</text>
<text x="220.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">а жилки в пучку ще й ковзають одна повз одну.</text>
<text x="220.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(для гвинтових клем багатожильний обтискають у наконечник-ферулу)</text>
<rect x="420.0" y="86.0" width="360.0" height="290.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="600.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Калібр (AWG) і застосування</text>
<text x="600.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">менший номер AWG = товщий дріт = більший струм</text>
<circle cx="472.0" cy="158.0" r="4.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.4"/>
<text x="500.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">AWG 22</text>
<text x="500.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">0.33 мм²  ·  сигнали, дрібне живлення</text>
<circle cx="472.0" cy="204.0" r="6.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.4"/>
<text x="500.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">AWG 18</text>
<text x="500.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">0.82 мм²  ·  живлення приладів</text>
<circle cx="472.0" cy="250.0" r="9.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.4"/>
<text x="500.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">AWG 14</text>
<text x="500.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">2.1 мм²  ·  побутова розетка (~15 А)</text>
<circle cx="472.0" cy="296.0" r="13.0" fill="#d9a066" stroke="#a06a2a" stroke-width="1.4"/>
<text x="500.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">AWG 10</text>
<text x="500.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">5.3 мм²  ·  потужні лінії (~30 А)</text>
<text x="600.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Допустимий струм залежить ще й від ізоляції, обдуву й пучкування;</text>
<text x="600.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тонший дріт — іще й більший опір і просадка напруги (R=ρL/A).</text>
</svg>
