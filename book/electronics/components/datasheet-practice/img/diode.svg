<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Даташит діода: рядки, що вирішують вибір</text>
<rect x="60.0" y="43.0" width="16.0" height="13.0" rx="2" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="82.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">абсолютний максимум</text>
<rect x="300.0" y="43.0" width="16.0" height="13.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="322.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">робоча межа</text>
<rect x="520.0" y="43.0" width="16.0" height="13.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="542.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">параметр</text>
<rect x="50.0" y="72.0" width="120.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="110.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">VRRM</text>
<text x="182.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">найбільша зворотна напруга до пробою</text>
<text x="182.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">беруть із запасом ≥ 2× до шини</text>
<rect x="50.0" y="116.0" width="120.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="110.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">IFSM</text>
<text x="182.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">піковий одиничний струм-кидок</text>
<text x="182.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">важить при ввімкненні на ємність</text>
<rect x="50.0" y="160.0" width="120.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="110.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">IF(av)</text>
<text x="182.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тривалий прямий струм без перегріву</text>
<text x="182.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">має перекривати робочий струм</text>
<rect x="50.0" y="204.0" width="120.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="110.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">VF</text>
<text x="182.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">пряме падіння при заданому струмі</text>
<text x="182.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">втрати й нагрів P ≈ VF·IF, колонка max</text>
<rect x="50.0" y="248.0" width="120.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="110.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">trr</text>
<text x="182.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">час відновлення (швидкість)</text>
<text x="182.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">вирішальний лише у швидкій комутації</text>
</svg>