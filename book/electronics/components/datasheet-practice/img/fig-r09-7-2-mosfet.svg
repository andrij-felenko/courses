<text x="540.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">I²·Rds(on) → нагрів →</text>
<text x="540.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Rds(on) ще росте (§2.9.4)</text>
<text x="350.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Силовий ключ: VDS і VGS — священні межі; Rds(on) і Qg — втрати; VGS(th) і крива Rds(VGS) — чи відкриється від твоєї логіки.</text>
