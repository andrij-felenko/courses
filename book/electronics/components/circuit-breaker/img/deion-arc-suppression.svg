<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електродинаміка та механізм гасіння електричної дуги в деіонній камері</text>
<rect x="30.0" y="55.0" width="265.0" height="395.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="40.0" y="65.0" width="245.0" height="32.0" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.0"/>
<text x="162.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">1. Електродинамічне видування</text>
<rect x="57.7" y="105.1" width="209.5" height="49.8" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="162.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Розмикання контактів під струмом:</tspan><tspan x="162.5" dy="13.7">Спалахує плазмовий шнур дуги</tspan><tspan x="162.5" dy="13.7">(T = 6 000 ... 20 000 K)</tspan></text>
<rect x="62.1" y="178.3" width="200.8" height="63.4" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="162.5" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">Сила Лоренца:</tspan><tspan x="162.5" dy="13.7">F = I · L × B</tspan><tspan x="162.5" dy="13.7">Контур петлі струму виштовхує</tspan><tspan x="162.5" dy="13.7">дугу від контактів на роги</tspan></text>
<rect x="73.9" y="271.0" width="177.3" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/><text x="162.5" y="285.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Дугогасні роги (Arc Runners):</tspan><tspan x="162.5" dy="13.0">Розширення проміжку дуги,</tspan><tspan x="162.5" dy="13.0">збільшення опору плазми</tspan></text>
<rect x="80.6" y="357.0" width="163.9" height="46.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.0"/><text x="162.5" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Феромагнітне затягування:</tspan><tspan x="162.5" dy="13.0">Сталеві пластини притягують</tspan><tspan x="162.5" dy="13.0">дугу всередину решітки</tspan></text>
<rect x="320.0" y="55.0" width="265.0" height="395.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="330.0" y="65.0" width="245.0" height="32.0" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1.0"/>
<text x="452.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">2. Поділ на мікродуги (De-ion)</text>
<rect x="341.8" y="105.1" width="221.5" height="49.8" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="452.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="452.5" dy="0.0">Пакет сталевих пластин:</tspan><tspan x="452.5" dy="13.7">10–15 пластин із V-подібним вирізом</tspan><tspan x="452.5" dy="13.7">товщиною 0.8–1.2 мм</tspan></text>
<rect x="345.6" y="185.1" width="213.8" height="49.8" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="452.5" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">Стрибок спаду напруги:</tspan><tspan x="452.5" dy="13.7">V_arc = ∑ (V_кат + V_ан + E·d)</tspan><tspan x="452.5" dy="13.7">Кожна пластина дає ΔV ≈ 20–25 В</tspan></text>
<rect x="361.9" y="263.3" width="181.3" height="63.4" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="452.5" y="278.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">Сумарна напруга дуги:</tspan><tspan x="452.5" dy="13.7">V_arc = N · ΔV ≈ 250–350 В</tspan><tspan x="452.5" dy="13.7">Напруга дуги перевищує</tspan><tspan x="452.5" dy="13.7">напругу мережі живлення!</tspan></text>
<rect x="348.3" y="363.5" width="208.4" height="33.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.0"/><text x="452.5" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.5" dy="0.0">Примусове зменшення струму:</tspan><tspan x="452.5" dy="13.0">di/dt = (V_grid - V_arc) / L &lt; 0</tspan></text>
<rect x="610.0" y="55.0" width="265.0" height="395.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="620.0" y="65.0" width="245.0" height="32.0" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.0"/>
<text x="742.5" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">3. Деіонізація та згасання</text>
<rect x="634.8" y="105.1" width="215.5" height="49.8" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="742.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Кондуктивне охолодження:</tspan><tspan x="742.5" dy="13.7">Величезна теплоємність і площа</tspan><tspan x="742.5" dy="13.7">металевих пластин відбирають тепло</tspan></text>
<rect x="645.3" y="179.5" width="194.4" height="61.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="742.5" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Рекомбінація носіїв:</tspan><tspan x="742.5" dy="13.0">Температура плазми різко падає,</tspan><tspan x="742.5" dy="13.0">іони рекомбінують з електронами,</tspan><tspan x="742.5" dy="13.0">опір каналу злітає до мегаомів</tspan></text>
<rect x="636.8" y="271.0" width="211.5" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/><text x="742.5" y="285.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Газогенеруючі стінки:</tspan><tspan x="742.5" dy="13.0">Поліамід виділяє охолоджуючий</tspan><tspan x="742.5" dy="13.0">газ під дією УФ-випромінювання дуги</tspan></text>
<rect x="632.1" y="357.0" width="220.8" height="46.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="742.5" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.5" dy="0.0">Повне гасіння дуги:</tspan><tspan x="742.5" dy="13.0">Струм розірвано за 2–5 мс</tspan><tspan x="742.5" dy="13.0">до природного переходу через нуль!</tspan></text>
</svg>