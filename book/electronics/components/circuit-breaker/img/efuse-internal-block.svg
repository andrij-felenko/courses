<rect x="85.5" y="330.7" width="169.0" height="58.5" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="170.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Керування наростанням dV/dt</tspan><tspan x="170.0" dy="12.3">(Soft-Start / Inrush Control)</tspan><tspan x="170.0" dy="12.3">Заряд ємностей навантаження</tspan><tspan x="170.0" dy="12.3">без пускових надструмів</tspan></text>
<rect x="373.6" y="330.7" width="152.8" height="58.5" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Термодатчик кристала (TSD)</tspan><tspan x="450.0" dy="12.3">Вимкнення при T_j &gt; 165 °C</tspan><tspan x="450.0" dy="12.3">з гістерезисом 20 °C</tspan><tspan x="450.0" dy="12.3">(Захист від перегріву SOA)</tspan></text>
<rect x="629.2" y="330.7" width="201.5" height="58.5" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="730.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Контролер аварійних станів</tspan><tspan x="730.0" dy="12.3">• Latch-off: блокування до скидання</tspan><tspan x="730.0" dy="12.3">• Auto-retry: цикл перезапуску</tspan><tspan x="730.0" dy="12.3">Вивід статусу FAULT / ALERT</tspan></text>
<rect x="161.0" y="436.0" width="578.0" height="18.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.0"/><text x="450.0" y="448.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Зовнішні виводи налаштування: R_ILIM (поріг струму), C_SS (час пуску), EN (увімкнення), FLT (статус)</tspan></text>
