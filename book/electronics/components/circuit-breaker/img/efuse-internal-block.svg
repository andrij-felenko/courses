<rect x="78.5" y="216.0" width="183.0" height="48.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="170.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Зарядна помпа (Charge Pump)</tspan><tspan x="170.0" dy="13.0">Формування V_gate &gt; V_in</tspan><tspan x="170.0" dy="13.0">для повного відкриття N-MOSFET</tspan></text>
<rect x="341.7" y="216.0" width="216.6" height="48.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Швидкий компаратор КЗ</tspan><tspan x="450.0" dy="13.0">Відсікання затвора за &lt; 500 нс</tspan><tspan x="450.0" dy="13.0">при жорсткому короткому замиканні</tspan></text>
