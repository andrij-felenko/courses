<text x="355.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">Відсікання дугою за 2–3 мс — інтеграл I²t знижено в 10–20 разів!</text>
