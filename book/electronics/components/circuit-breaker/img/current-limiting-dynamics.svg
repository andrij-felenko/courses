<text x="355.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Очікуваний струм КЗ без обмеження (Prospective I_peak ≈ 10 кА)</text>
<text x="355.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">Пік на 5 мс, природне гасіння при переході через нуль на 10 мс</text>
