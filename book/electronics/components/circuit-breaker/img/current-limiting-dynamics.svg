<rect x="642.5" y="121.7" width="204.9" height="56.5" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="745.0" y="134.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Клас 1 (Без обмеження):</tspan><tspan x="745.0" dy="12.3">Гасіння дуги під час переходу</tspan><tspan x="745.0" dy="12.3">змінного струму через нуль (~10 мс).</tspan><tspan x="745.0" dy="12.3">Максимальне теплове навантаження.</tspan></text>
<rect x="656.1" y="217.9" width="177.9" height="44.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="745.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Клас 2 (Середнє обмеження):</tspan><tspan x="745.0" dy="12.3">Проміжне обмеження енергії I²t.</tspan><tspan x="745.0" dy="12.3">Час відключення 6–8 мс.</tspan></text>
<rect x="633.0" y="299.6" width="224.0" height="70.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="745.0" y="313.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Клас 3 (Найвище обмеження):</tspan><tspan x="745.0" dy="12.3">Надшвидке розходження контактів,</tspan><tspan x="745.0" dy="12.3">висока напруга дуги V_arc &gt; V_grid.</tspan><tspan x="745.0" dy="12.3">Обмеження пікового струму за 2–4 мс.</tspan><tspan x="745.0" dy="12.3">Обов'язковий для сучасних мереж.</tspan></text>
