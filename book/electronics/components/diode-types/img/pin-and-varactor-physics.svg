<path d="M 70.0,254.0 L 75.2,267.4 L 80.4,274.9 L 85.6,279.9 L 90.8,283.6 L 96.0,286.4 L 101.2,288.6 L 106.4,290.5 L 111.6,292.0 L 116.8,293.4 L 122.0,294.5 L 127.2,295.5 L 132.4,296.5 L 137.6,297.3 L 142.8,298.0 L 148.0,298.7 L 153.2,299.3 L 158.4,299.8 L 163.6,300.4 L 168.8,300.8 L 174.0,301.3 L 179.2,301.7 L 184.4,302.1 L 189.6,302.5 L 194.8,302.8 L 200.0,303.1 L 205.2,303.4 L 210.4,303.7 L 215.6,304.0 L 220.8,304.3 L 226.0,304.5 L 231.2,304.7 L 236.4,305.0 L 241.6,305.2 L 246.8,305.4 L 252.0,305.6 L 257.2,305.8 L 262.4,306.0 L 267.6,306.2 L 272.8,306.3 L 278.0,306.5 L 283.2,306.6 L 288.4,306.8 L 293.6,306.9 L 298.8,307.1 L 304.0,307.2 L 309.2,307.4 L 314.4,307.5 L 319.6,307.6 L 324.8,307.7 L 330.0,307.9" fill="none" stroke="#7a4e8a" stroke-width="2.4"/>
<text x="190.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4e8a" text-anchor="middle" font-weight="700">C_j ∝ 1 / √(V_R + V_bi)</text>
<rect x="45.0" y="345.0" width="360.0" height="95.0" rx="6" fill="#fdf4ff" stroke="#7a4e8a" stroke-width="1.5"/><text x="225.0" y="367.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Застосування варикапів:</tspan><tspan x="225.0" dy="14.3">• ГУН (VCO) у синтезаторах частоти PLL</tspan><tspan x="225.0" dy="14.3">• Електронне перестроювання FM/ВЧ-фільтрів</tspan><tspan x="225.0" dy="14.3">• Коефіцієнт перекриття: C_max/C_min ≈ 2...10</tspan><tspan x="225.0" dy="14.3">• Висока добротність Q для мін. фазового шуму</tspan></text>
<rect x="460.0" y="55.0" width="390.0" height="400.0" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="655.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">PIN-діод (ВЧ/СВЧ атенюатори та ключі)</text>
<rect x="485.0" y="100.0" width="90.0" height="70.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="530.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">p⁺ (анод)</text>
<rect x="575.0" y="100.0" width="160.0" height="70.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
<text x="655.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ca8a04" text-anchor="middle" font-weight="700">i-область (Intrinsic)</text>
<text x="655.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">широкий нелегований шар</text>
<rect x="735.0" y="100.0" width="90.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.4"/>
<text x="780.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">n⁺ (катод)</text>
<rect x="475.0" y="185.0" width="360.0" height="140.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="655.0" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Два режими роботи PIN-діода:</tspan><tspan x="655.0" dy="11.7">1. Постійний / НЧ струм: звичайний діод із накопиченням заряду в товстому i-шарі.</tspan><tspan x="655.0" dy="11.7">2. ВЧ/СВЧ сигнал (f &gt; 10 МГц): період сигналу Т &lt;&lt; часу життя носіїв τ. Носії не встигають розсмоктатися!</tspan><tspan x="655.0" dy="11.7">→ Діод поводиться як чистий лінійний резистор R_d без нелінійних спотворень сигналу!</tspan></text>
<rect x="495.0" y="340.0" width="320.0" height="45.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="655.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">R_ВЧ ≈ W_i² / (2 · μ · τ · I_DC)  ∝  1 / I_прямий</text>
<rect x="475.0" y="400.0" width="360.0" height="50.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="655.0" y="415.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="655.0" dy="0.0">Застосування PIN-діода:</tspan><tspan x="655.0" dy="13.0">• Безінерційний керований ВЧ-атенюатор</tspan><tspan x="655.0" dy="13.0">• Швидкі антенні перемикачі прийому/передачі (T/R Switch)</tspan></text>
</svg>