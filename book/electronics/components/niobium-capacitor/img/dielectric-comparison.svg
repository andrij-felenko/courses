<rect x="325.0" y="121.3" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Проникність: ε_r ≈ 27</tspan><tspan x="420.0" dy="14.3">Висока питома ємність</tspan></text>
<rect x="325.0" y="196.3" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Густина металу: 16.65 г/см³</tspan><tspan x="420.0" dy="14.3">Важкий, дорогий ресурс</tspan></text>
<rect x="325.0" y="271.4" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Товщина оксиду: ~1.7 нм/В</tspan><tspan x="420.0" dy="14.3">Напруги до 50 В</tspan></text>
