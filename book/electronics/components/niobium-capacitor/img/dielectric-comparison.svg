<rect x="60.0" y="121.3" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Проникність: ε_r ≈ 9.5</tspan><tspan x="155.0" dy="14.3">Базова поляризація</tspan></text>
<rect x="60.0" y="196.3" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Густина металу: 2.70 г/см³</tspan><tspan x="155.0" dy="14.3">Легкий, але низька ε_r</tspan></text>
<rect x="60.0" y="271.4" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Товщина оксиду: ~1.2 нм/В</tspan><tspan x="155.0" dy="14.3">Висока напруга (&gt; 500 В)</tspan></text>
<rect x="60.0" y="346.4" width="190.0" height="37.3" rx="6" fill="#eaeded" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">CV/cc: Низька / Середня</tspan><tspan x="155.0" dy="14.3">Великі габарити банки</tspan></text>
