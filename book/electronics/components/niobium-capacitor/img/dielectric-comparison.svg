<rect x="590.0" y="121.3" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Проникність: ε_r ≈ 41–42</tspan><tspan x="685.0" dy="14.3">Найвища серед оксидів!</tspan></text>
<rect x="590.0" y="196.3" width="190.0" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Густина металу: 4.57 г/см³</tspan><tspan x="685.0" dy="14.3">У 3.6× легший за тантал</tspan></text>
<rect x="588.1" y="271.4" width="193.8" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Товщина оксиду: ~3.7 нм/В</tspan><tspan x="685.0" dy="14.3">Оптимум під низьку V (≤ 10 В)</tspan></text>
<rect x="590.0" y="346.4" width="190.0" height="37.3" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">CV/cc: Висока + Безпека</tspan><tspan x="685.0" dy="14.3">Неспаленна конструкція</tspan></text>
