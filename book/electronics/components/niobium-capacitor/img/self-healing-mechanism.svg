<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850.8 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850.8" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння реакції на локальний пробій: тантал (Ta) проти ніобій-оксиду (NbO)</text>
<rect x="30.0" y="60.0" width="370.0" height="390.0" rx="8" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<text x="215.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Танталовий конденсатор (Ta / MnO₂)</text>
<rect x="50.0" y="111.3" width="330.0" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">1. Локальний дефект діелектрика Ta₂O₅</tspan><tspan x="215.0" dy="14.3">Сплеск струму → точковий нагрів &gt; 450 °C</tspan></text>
<rect x="50.0" y="191.3" width="330.0" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">2. Термічний розпад катода MnO₂</tspan><tspan x="215.0" dy="14.3">2 MnO₂ → Mn₂O₃ + O₂↑ (виділення вільного кисню)</tspan></text>
<rect x="50.0" y="271.4" width="330.0" height="37.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">3. Екзотермічне окиснення металу</tspan><tspan x="215.0" dy="14.3">4 Ta + 5 O₂ → 2 Ta₂O₅ + ΔH (T &gt; 2000 °C)</tspan></text>
<rect x="19.4" y="364.4" width="391.1" height="41.3" rx="6" fill="#f9d5d5" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">НАСЛІДОК: теплове розганяння (Thermal Runaway)</tspan><tspan x="215.0" dy="14.3">Коротке замикання, відкрите полум'я, дим і прогар плати</tspan></text>
<line x1="215.0" y1="160.0" x2="215.0" y2="182.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="240.0" x2="215.0" y2="262.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="320.0" x2="215.0" y2="347.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="60.0" width="370.0" height="390.0" rx="8" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<text x="625.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Оксидно-ніобієвий (NbO / MnO₂)</text>
<rect x="460.0" y="111.3" width="330.0" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">1. Локальний пробій діелектрика Nb₂O₅</tspan><tspan x="625.0" dy="14.3">Сплеск струму → локальне розігрівання зони дефекту</tspan></text>
<rect x="460.0" y="191.3" width="330.0" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">2. Відновлення до нижчих оксидів</tspan><tspan x="625.0" dy="14.3">Nb₂O₅ → 2 NbO₂ + ½ O₂ (енергопоглинальна реакція)</tspan></text>
<rect x="443.4" y="271.4" width="363.1" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">3. Формування ізоляційного корка</tspan><tspan x="625.0" dy="14.3">NbO₂ має високий опір (ρ ~ 10²–10⁴ Ом·см) → струм спадає</tspan></text>
<rect x="419.2" y="364.4" width="411.6" height="41.3" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">НАСЛІДОК: самопасивація (Self-Passivation)</tspan><tspan x="625.0" dy="14.3">Безпечний обрив кола (Open Circuit), нульовий ризик пожежі</tspan></text>
<line x1="625.0" y1="160.0" x2="625.0" y2="182.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="625.0" y1="240.0" x2="625.0" y2="262.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="625.0" y1="320.0" x2="625.0" y2="347.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>