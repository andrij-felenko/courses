<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізми ерозії, деградації та зварювання контактів</text>
<rect x="35.0" y="20.0" width="240.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
<text x="155.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анодно-катодне перенесення</text>
<line x1="50.0" y1="56.0" x2="260.0" y2="56.0" stroke="#e1e4e8" stroke-width="1.0"/>
<rect x="300.0" y="20.0" width="240.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Окиснення й нагар</text>
<line x1="315.0" y1="56.0" x2="525.0" y2="56.0" stroke="#e1e4e8" stroke-width="1.0"/>
<rect x="565.0" y="20.0" width="240.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
<text x="685.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Брязкіт і зварювання (Bounce)</text>
<line x1="580.0" y1="56.0" x2="790.0" y2="56.0" stroke="#e1e4e8" stroke-width="1.0"/>
<path d="M 95 75 L 135 75 Q 155 98 175 75 L 215 75 L 215 95 L 95 95 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="155.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Анод (+) — кратер вигоряння</text>
<circle cx="155.0" cy="112.0" r="5.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="205.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">e⁻ потік</text>
<line x1="185.0" y1="120.0" x2="165.0" y2="105.0" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 95 150 L 135 150 Q 155 128 175 150 L 215 150 L 215 130 L 95 130 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="155.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Катод (−) — наростання конуса</text>
<text x="155.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="155.0" dy="0.0">У колах DC струм тече в один бік.</tspan><tspan x="155.0" dy="11.7">Електрони бомбардують анод,</tspan><tspan x="155.0" dy="11.7">вибиваючи метал.</tspan><tspan x="155.0" dy="11.7">Утворюється голка та ямка,</tspan><tspan x="155.0" dy="11.7">що веде до заклинювання.</tspan></text>
<rect x="345.0" y="75.0" width="150.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<rect x="355.0" y="95.0" width="130.0" height="5.0" rx="6" fill="#9a3412" stroke="#9a3412" stroke-width="1.0"/>
<rect x="355.0" y="125.0" width="130.0" height="5.0" rx="6" fill="#9a3412" stroke="#9a3412" stroke-width="1.0"/>
<rect x="345.0" y="130.0" width="150.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle" font-weight="700">Оксидна / вуглецева плівка</text>
<text x="420.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="420.0" dy="0.0">Висока температура дуги</tspan><tspan x="420.0" dy="11.7">окиснює базовий метал (Cu, Ag).</tspan><tspan x="420.0" dy="11.7">Органічні пари розкладаються</tspan><tspan x="420.0" dy="11.7">на вуглець (нагар).</tspan><tspan x="420.0" dy="11.7">R_контакту зростає в сотні разів,</tspan><tspan x="420.0" dy="11.7">викликаючи саморозігрів.</tspan></text>
<line x1="600.0" y1="140.0" x2="760.0" y2="140.0" stroke="#333333" stroke-width="1.2"/>
<line x1="600.0" y1="140.0" x2="600.0" y2="80.0" stroke="#333333" stroke-width="1.2"/>
<path d="M 600 90 L 630 90 L 635 140 L 650 140 L 655 90 L 675 90 L 680 140 L 690 140 L 695 90 L 750 90" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="660.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Мікророзмикання (1–5 мс)</text>
<text x="685.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="685.0" dy="0.0">Пружний удар контактів при</tspan><tspan x="685.0" dy="11.7">вмиканні викликає брязкіт.</tspan><tspan x="685.0" dy="11.7">Пусковий струм (Inrush I) у мить</tspan><tspan x="685.0" dy="11.7">розриву запалює мікродуги.</tspan><tspan x="685.0" dy="11.7">Метал плавиться, і контакти</tspan><tspan x="685.0" dy="11.7">намертво зварюються.</tspan></text>
</svg>