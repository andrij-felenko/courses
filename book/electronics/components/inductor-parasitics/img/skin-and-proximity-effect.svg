<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скін-ефект та ефект близькості в провідниках котушки</text>
<rect x="25.0" y="20.0" width="790.0" height="400.0" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл густини змінного струму в провідниках обмотки</text>
<rect x="45.0" y="75.0" width="225.0" height="325.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="157.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Постійний струм (DC)</text>
<circle cx="157.5" cy="200.0" r="65.0" fill="#ffebee" stroke="#c0392b" stroke-width="2.0"/>
<text x="157.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рівномірна</text>
<text x="157.5" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">густина J_0</text>
<text x="157.5" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Струм протікає крізь</text>
<text x="157.5" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">весь переріз міді</text>
<text x="157.5" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">R_ac = R_dc</text>
<text x="157.5" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Втрати мінімальні</text>
<rect x="295.0" y="75.0" width="240.0" height="325.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="415.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Скін-ефект (Skin Effect)</text>
<circle cx="415.0" cy="200.0" r="65.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="415.0" cy="200.0" r="65.0" fill="none" stroke="#c0392b" stroke-width="14.0"/>
<circle cx="415.0" cy="200.0" r="51.0" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.0"/>
<text x="415.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Знеструмлений</text>
<text x="415.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">центр (J ≈ 0)</text>
<line x1="480.0" y1="200.0" x2="466.0" y2="200.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="485.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">δ (скін-шар)</text>
<text x="415.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Власне поле витісняє</text>
<text x="415.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">струм до поверхні</text>
<text x="415.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e0a32e" text-anchor="middle" font-weight="700">R_ac &gt; R_dc</text>
<text x="415.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">δ = √(ρ / π f μ)</text>
<rect x="560.0" y="75.0" width="240.0" height="325.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="680.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Ефект близькості</text>
<circle cx="630.0" cy="200.0" r="40.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="730.0" cy="200.0" r="40.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<path d="M 630 160 A 40 40 0 0 0 630 240 A 25 40 0 0 1 630 160" fill="#c0392b" stroke="none"/>
<path d="M 730 160 A 40 40 0 0 1 730 240 A 25 40 0 0 0 730 160" fill="#c0392b" stroke="none"/>
<path d="M 680 145 Q 680 200 680 255" fill="none" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="680.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Поле H_ext</text>
<text x="680.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Поле сусідніх витків</text>
<text x="680.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">спричиняє вихрові струми</text>
<text x="680.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_ac &gt;&gt; R_dc (до 10–50×)</text>
<text x="680.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Втрати ростуть як m²</text>
</svg>