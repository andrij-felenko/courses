<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640">
<rect width="860" height="640" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="430.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: як навчилися запасати електрику</text>
<text x="430.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен крок — нове питання, що штовхало далі (сірим — те, що стане змістом Розділу 7)</text>
<line x1="196.0" y1="96.0" x2="196.0" y2="610.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="196.0" cy="126.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="174.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">до 1745</text>
<text x="222.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Машини тертя</text>
<text x="222.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Заряд є — та миттєво розлітається. Чи можна його ЗАПАСТИ?</text>
<circle cx="196.0" cy="216.8" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="174.0" y="221.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1745</text>
<text x="222.0" y="213.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">фон Кляйст / von Kleist</text>
<text x="222.0" y="233.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Банка з цвяхом у руці б'є струмом — але рецепт неясний, ніхто не повторить</text>
<circle cx="196.0" cy="307.6" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="174.0" y="312.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1746</text>
<text x="222.0" y="304.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Мушенбрук, Кунеус / Leiden</text>
<text x="222.0" y="324.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Удар, що звалив професора. «Не повторив би й за королівство Франції»</text>
<circle cx="196.0" cy="398.4" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="174.0" y="403.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1746</text>
<text x="222.0" y="395.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Нолле / Nollet</text>
<text x="222.0" y="415.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Назва «лейденська банка»; розряд крізь ~200 ченців — а як ШВИДКО біжить?</text>
<circle cx="196.0" cy="489.2" r="10.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<circle cx="196.0" cy="489.2" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="174.0" y="494.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1747–48</text>
<text x="222.0" y="486.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Франклін / Franklin</text>
<text x="222.0" y="506.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Де сидить заряд? — НЕ у воді, а на СКЛІ; + і − рівні; «батарея» банок</text>
<rect x="188.0" y="572.0" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="174.0" y="585.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Розділ 7</text>
<text x="222.0" y="577.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Конденсатор</text>
<text x="222.0" y="597.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Скільки заряду й від чого це залежить? — ЄМНІСТЬ</text>
</svg>
