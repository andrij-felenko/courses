<text x="680.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">L₂</text>
<circle cx="720.0" cy="132.0" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<line x1="585.0" y1="150.0" x2="635.0" y2="150.0" stroke="#333333" stroke-width="2.0"/>
