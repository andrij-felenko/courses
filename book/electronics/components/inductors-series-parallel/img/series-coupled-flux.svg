<text x="610.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Потоки віднімаються: Φ_сум = Φ₁ − Φ₂</text>
<rect x="440.0" y="260.0" width="345.0" height="135.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="612.5" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="612.5" dy="0.0">Входить у крапку L₁, виходить з L₂:</tspan><tspan x="612.5" dy="15.6">v = (L₁ − M)·(di/dt) + (L₂ − M)·(di/dt)</tspan><tspan x="612.5" dy="15.6"></tspan><tspan x="612.5" dy="15.6">L_eq = L₁ + L₂ − 2·M</tspan><tspan x="612.5" dy="15.6">(при L₁=L₂, k=1: L_eq = 0)</tspan></text>
</svg>