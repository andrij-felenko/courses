<circle cx="780.0" cy="150.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="460.0" y1="134.0" x2="500.0" y2="134.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">i(t)</text>
<line x1="510.0" y1="180.0" x2="570.0" y2="180.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
