<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Потоки складаються: Φ_сум = Φ₁ + Φ₂</text>
<rect x="35.0" y="260.0" width="345.0" height="135.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="207.5" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="207.5" dy="0.0">Струм входить в обидві крапки:</tspan><tspan x="207.5" dy="15.6">v = (L₁ + M)·(di/dt) + (L₂ + M)·(di/dt)</tspan><tspan x="207.5" dy="15.6"></tspan><tspan x="207.5" dy="15.6">L_eq = L₁ + L₂ + 2·M</tspan><tspan x="207.5" dy="15.6">де M = k·√(L₁·L₂)</tspan></text>
<rect x="425.0" y="50.0" width="375.0" height="360.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="610.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Зустрічне ввімкнення (Flux Opposing)</text>
<rect x="470.0" y="105.0" width="280.0" height="16.0" rx="3" fill="#e1e4e8" stroke="#6b7280" stroke-width="1.5"/>
<text x="610.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Спільне магнітне осердя (k &gt; 0)</text>
