<text x="310.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перша сторінка — короткий портрет: назва, ключові цифри, опис, ескіз розпіновки. Швидко відсіяти «не те».</text>
