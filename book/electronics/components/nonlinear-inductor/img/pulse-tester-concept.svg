<text x="55.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Чому саме поодинокий короткий імпульс (Single-Pulse Method):</text>
<text x="55.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Дросель НЕ встигає нагрітися постійним струмом під час тесту (виключається спад B_sat).</text>
<text x="55.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Знімається повна характеристика L_diff(i) від 0 до сотень ампер за один імпульс 20…50 мкс.</text>
<text x="380.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Структура вимірювального стенда для зняття кривих L(i) методом поодинокого імпульсу високого струму</text>
