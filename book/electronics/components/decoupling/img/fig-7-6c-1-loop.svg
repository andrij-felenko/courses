<text x="410.0" y="470.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тому важлива не відстань сама собою, а замкнена ПЛОЩА шляху струму</text>
