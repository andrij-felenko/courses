<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому «впритул»: рахується площа петлі струму</text>
<text x="410.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ривок струму біжить петлею «конденсатор → ніжка → чип → земля → конденсатор»</text>
<rect x="50.0" y="96.0" width="350.0" height="330.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/><text x="225.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">погано: конденсатор «десь на платі»</text><rect x="75.0" y="160.0" width="100.0" height="90.0" rx="6" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.8"/><text x="125.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">чип</text><text x="183.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">VDD</text><text x="183.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">GND</text><rect x="175.0" y="170.0" width="205.0" height="150.0" rx="6" fill="#fbecec" stroke="none" stroke-width="0.0"/><line x1="175.0" y1="170.0" x2="380.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="175.0" y1="320.0" x2="380.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="380.0" y1="170.0" x2="380.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="380.0" y1="250.0" x2="380.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="362.0" y1="242.0" x2="398.0" y2="242.0" stroke="#1a1a1a" stroke-width="2.6"/><line x1="362.0" y1="248.0" x2="398.0" y2="248.0" stroke="#1a1a1a" stroke-width="2.6"/><text x="406.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">100 нФ</text><line x1="374.0" y1="170.0" x2="187.0" y2="170.0" stroke="#c0392b" stroke-width="2.0"/><path d="M187.0 170.0 L195.0 165.6 L195.0 174.4 z" fill="#c0392b"/><line x1="187.0" y1="320.0" x2="374.0" y2="320.0" stroke="#c0392b" stroke-width="2.0"/><path d="M374.0 320.0 L366.0 324.4 L366.0 315.6 z" fill="#c0392b"/><text x="225.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle" font-weight="700">велика петля = великий «опір» швидкій</text><text x="225.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle" font-weight="700">зміні струму — викид на кожному фронті</text>
<rect x="430.0" y="96.0" width="350.0" height="330.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/><text x="605.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">добре: впритул до ніжки</text><rect x="455.0" y="160.0" width="100.0" height="90.0" rx="6" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.8"/><text x="505.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">чип</text><text x="563.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">VDD</text><text x="563.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">GND</text><rect x="555.0" y="170.0" width="40.0" height="150.0" rx="6" fill="#eef6ef" stroke="none" stroke-width="0.0"/><line x1="555.0" y1="170.0" x2="595.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="555.0" y1="320.0" x2="595.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="595.0" y1="170.0" x2="595.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="595.0" y1="250.0" x2="595.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="577.0" y1="242.0" x2="613.0" y2="242.0" stroke="#1a1a1a" stroke-width="2.6"/><line x1="577.0" y1="248.0" x2="613.0" y2="248.0" stroke="#1a1a1a" stroke-width="2.6"/><text x="621.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">100 нФ</text><line x1="589.0" y1="170.0" x2="567.0" y2="170.0" stroke="#27ae60" stroke-width="2.0"/><path d="M567.0 170.0 L575.0 165.6 L575.0 174.4 z" fill="#27ae60"/><line x1="567.0" y1="320.0" x2="589.0" y2="320.0" stroke="#27ae60" stroke-width="2.0"/><path d="M589.0 320.0 L581.0 324.4 L581.0 315.6 z" fill="#27ae60"/><text x="605.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f6e33" text-anchor="middle" font-weight="700">крихітна петля: запас доходить</text><text x="605.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f6e33" text-anchor="middle" font-weight="700">за наносекунди, без викидів</text>
<text x="410.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">довгий провідник опирається швидкій зміні струму (це його індуктивність);</text>
<text x="410.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">тому важлива не відстань сама собою, а замкнена ПЛОЩА шляху струму</text>
</svg>