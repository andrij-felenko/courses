<text x="531.7" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T_turn = 80 °C</text>
<text x="531.7" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">df/dT = 0</text>
<text x="288.8" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="700">AT-зріз (кубічна S-крива)</text>
<text x="332.9" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">SC-зріз (оптимізований під 80 °C)</text>
<rect x="650.0" y="95.0" width="290.0" height="125.0" rx="6" fill="#fef3c7" stroke="#d35400" stroke-width="1.5"/><text x="795.0" y="132.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Параболічна модель біля T_turn:</tspan><tspan x="795.0" dy="14.3">Δf/f(T) = a·(T − T₀) + b·(T − T₀)²</tspan><tspan x="795.0" dy="14.3">У вершині T₀ = T_turn лінійний член a = 0:</tspan><tspan x="795.0" dy="14.3">df/dT = 2·b·(T − T_turn) = 0</tspan><tspan x="795.0" dy="14.3">Чутливість до тепла спадає в 1000+ разів!</tspan></text>
<rect x="650.0" y="235.0" width="290.0" height="140.0" rx="6" fill="#eff6ff" stroke="#2980b9" stroke-width="1.5"/><text x="795.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Розрахунок похибки при коливанні ΔT:</tspan><tspan x="795.0" dy="14.3">Якщо терморегулятор тримає T з точністю:</tspan><tspan x="795.0" dy="14.3">ΔT = ±0.01 °C = ±10 mK</tspan><tspan x="795.0" dy="14.3">Тоді відхилення частоти:</tspan><tspan x="795.0" dy="14.3">Δf/f = b · (0.01 °C)²</tspan><tspan x="795.0" dy="14.3">Δf/f ≈ −3.2·10⁻³ · 10⁻⁴ ppm = −3.2·10⁻¹³!</tspan><tspan x="795.0" dy="14.3">Це рівень кращих квантових стандартів.</tspan></text>
<rect x="650.0" y="390.0" width="290.0" height="120.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="795.0" y="435.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Чому саме 75–85 °C?</tspan><tspan x="795.0" dy="11.7">• Вище максимальної температури приладу (+70 °C)</tspan><tspan x="795.0" dy="11.7">• Потрібен лише нагрівач, без охолоджувача Пельтьє</tspan><tspan x="795.0" dy="11.7">• Нижче межі деградації старіння кварцу (+95 °C)</tspan></text>
</svg>