<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="410.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стійкість до напружень: одинарний AT проти подвійного SC-зрізу</text>
<text x="420.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому подвійний кут повороту (SC) усуває динамічний дрейф при тепловому ударі та вібраціях</text>
<rect x="30.0" y="85.0" width="375.0" height="320.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="217.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">AT-зріз: чутливий до напруг (Stress-Sensitive)</text>
<rect x="100.0" y="140.0" width="180.0" height="50.0" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="190.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="700">Кварцова пластина AT</text>
<rect x="75.0" y="150.0" width="25.0" height="30.0" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.2"/>
<rect x="280.0" y="150.0" width="25.0" height="30.0" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.2"/>
<line x1="60.0" y1="165.0" x2="75.0" y2="165.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="320.0" y1="165.0" x2="305.0" y2="165.0" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Стиск від кріплення / теплового градієнта</text>
<rect x="50.0" y="220.0" width="335.0" height="95.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="60.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Відгук частоти на увімкнення нагрівача (тепловий удар):</text>
<line x1="70.0" y1="295.0" x2="360.0" y2="295.0" stroke="#94a3b8" stroke-width="1.0"/>
<line x1="70.0" y1="295.0" x2="70.0" y2="245.0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="360.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">t (час)</text>
<text x="65.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Δf</text>
<path d="M 70 295 L 110 295 Q 120 250, 140 252 Q 180 260, 240 293 L 360 295" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="150.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Сплеск до +5..10 ppm!</text>
<text x="250.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">повільна релаксація</text>
<text x="50.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start" font-weight="700">• Коефіцієнт напруги K_stress ≠ 0</text>
<text x="50.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start">• Чутливість до прискорення: ~1–2 ppb/g</text>
<text x="50.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start">• Нестабільність при вібрації та теплових перехідних процесах</text>
<rect x="435.0" y="85.0" width="375.0" height="320.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="622.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">SC-зріз: компенсація напружень (Stress-Compensated)</text>
<rect x="505.0" y="140.0" width="180.0" height="50.0" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="595.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Кварцова пластина SC (φ=21.9°, θ=34.1°)</text>
<rect x="480.0" y="150.0" width="25.0" height="30.0" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.2"/>
<rect x="685.0" y="150.0" width="25.0" height="30.0" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.2"/>
<line x1="465.0" y1="165.0" x2="480.0" y2="165.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="725.0" y1="165.0" x2="710.0" y2="165.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="595.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Тензорні компоненти напруг взаємно гасяться</text>
<rect x="455.0" y="220.0" width="335.0" height="95.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="465.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Відгук частоти на увімкнення нагрівача (тепловий удар):</text>
<line x1="475.0" y1="295.0" x2="765.0" y2="295.0" stroke="#94a3b8" stroke-width="1.0"/>
<line x1="475.0" y1="295.0" x2="475.0" y2="245.0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="765.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">t (час)</text>
<text x="470.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Δf</text>
<line x1="475.0" y1="295.0" x2="765.0" y2="295.0" stroke="#16a34a" stroke-width="2.5"/>
<text x="620.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Сплеск частоти відсутній (нульовий dF/dt)</text>
<text x="455.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="start" font-weight="700">• Коефіцієнт напруги K_stress ≈ 0 (компенсовано)</text>
<text x="455.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="start">• Чутливість до прискорення: ~0.1–0.2 ppb/g (у 10 разів краща)</text>
<text x="455.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="start">• Миттєвий вихід на робочу частоту в OCXO без теплового дрейфу</text>
</svg>