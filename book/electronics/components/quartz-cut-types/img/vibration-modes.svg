<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 855 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="855" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="430.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічні моди коливань кварцових резонаторів</text>
<text x="420.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Форма деформації визначає робочу частоту, спосіб кріплення та добротність</text>
<rect x="30.0" y="85.0" width="375.0" height="165.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="45.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700">1. Товщинний зсув (Thickness Shear, TS)</text>
<text x="45.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Зрізи: AT, BT, SC, IT · Частоти: 1–50+ МГц (до 200 МГц на овертонах)</text>
<rect x="95.0" y="145.0" width="160.0" height="40.0" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<polygon points="110,145 270,145 250,185 90,185" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8" fill-opacity="0.8"/>
<line x1="155.0" y1="137.0" x2="215.0" y2="137.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="205.0" y1="193.0" x2="145.0" y2="193.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">f = N / t</text>
<text x="285.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">t — товщина</text>
<text x="285.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">N — стала частоти</text>
<text x="45.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Верхня й нижня грані ковзають у протилежні боки; частота ∝ 1/товщини</text>
<rect x="435.0" y="85.0" width="375.0" height="165.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="450.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="start" font-weight="700">2. Згинний камертон (Flexure Tuning Fork)</text>
<text x="450.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Зрізи: XY-cut, +5° X-cut · Частота: 32.768 кГц (годинниковий стандарт)</text>
<rect x="510.0" y="175.0" width="40.0" height="25.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<path d="M 515 175 C 515 150, 498 140, 500 135 L 508 135 C 506 142, 523 150, 523 175 Z" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
<path d="M 537 175 C 537 150, 554 140, 552 135 L 544 135 C 546 142, 529 150, 529 175 Z" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
<line x1="490.0" y1="138.0" x2="510.0" y2="138.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="562.0" y1="138.0" x2="542.0" y2="138.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">f ∝ w / L²</text>
<text x="585.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">L — довжина зубця</text>
<text x="585.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">w — ширина зубця</text>
<text x="450.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Два зубці коливаються у протифазі; реакції в основі взаємно гасяться</text>
<rect x="30.0" y="265.0" width="375.0" height="165.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="45.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9a3412" text-anchor="start" font-weight="700">3. Площинний зсув (Face Shear)</text>
<text x="45.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Зрізи: CT, DT · Частоти: 100–600 кГц (проміжний діапазон)</text>
<rect x="140.0" y="325.0" width="60.0" height="60.0" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<line x1="132.0" y1="320.0" x2="142.0" y2="330.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="208.0" y1="390.0" x2="198.0" y2="380.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">f = N_fs / a</text>
<text x="235.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">a — довжина ребра</text>
<text x="235.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">частота від розмірів грані</text>
<text x="45.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Квадратна пластина перетворюється на ромб у власній площині</text>
<rect x="435.0" y="265.0" width="375.0" height="165.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="450.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="start" font-weight="700">4. Поздовжній стиск/розтяг (Extensional)</text>
<text x="450.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Зрізи: MT, NT, GT, +5° X-брусок · Частоти: 40–200 кГц</text>
<rect x="480.0" y="345.0" width="100.0" height="25.0" rx="2" fill="#e9d5ff" stroke="#9333ea" stroke-width="1.5"/>
<line x1="470.0" y1="357.0" x2="455.0" y2="357.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="590.0" y1="357.0" x2="605.0" y2="357.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">f = v / (2·L)</text>
<text x="625.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">L — довжина стрижня</text>
<text x="625.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">v — швидкість звуку</text>
<text x="450.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Хвиля біжить уздовж бруска; частота задається виключно його довжиною</text>
</svg>