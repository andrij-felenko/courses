<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хроніка FDIV: три місяці від тихого багу до відкликання</text>
<line x1="150.0" y1="70.0" x2="150.0" y2="400.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="150.0" cy="90.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">літо 1994</text>
<rect x="174.0" y="68.0" width="560.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="454.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">Intel сама знаходить ваду</tspan><tspan x="454.0" dy="15.6">й тихо править нові партії</tspan></text>
<circle cx="150.0" cy="156.0" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">30 жовт. 1994</text>
<rect x="174.0" y="134.0" width="560.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="454.0" y="152.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">Т. Найслі публічно описує</tspan><tspan x="454.0" dy="15.6">дефект листом колегам</tspan></text>
<circle cx="150.0" cy="222.0" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">листоп. 1994</text>
<rect x="174.0" y="200.0" width="560.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="454.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">Тім Коу дає число, де помилка</tspan><tspan x="454.0" dy="15.6">видна на калькуляторі — баг стає мемом</tspan></text>
<circle cx="150.0" cy="288.0" r="7.0" fill="#d4a017" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d4a017" text-anchor="end" font-weight="700">груд. 1994</text>
<rect x="174.0" y="266.0" width="560.0" height="44.0" rx="6" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5"/><text x="454.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">IBM спиняє відвантаження ПК →</tspan><tspan x="454.0" dy="15.6">акції й довіра падають</tspan></text>
<circle cx="150.0" cy="354.0" r="7.0" fill="#1e7e45" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7e45" text-anchor="end" font-weight="700">20 груд. 1994</text>
<rect x="174.0" y="332.0" width="560.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#1e7e45" stroke-width="1.5"/><text x="454.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">Повна заміна «no questions asked» —</tspan><tspan x="454.0" dy="15.6">перше відкликання процесора</tspan></text>
<rect x="40.0" y="414.0" width="680.0" height="42.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="438.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Урок галузі: складний чип завжди має відомі баги — відповідальний виробник їх ПУБЛІКУЄ ($475 млн резерв)</tspan></text>
</svg>