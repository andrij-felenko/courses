<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий рядок: зі значком і без нього</text>
<rect x="60.0" y="70.0" width="330.0" height="34.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Вихідний струм</tspan></text>
<rect x="390.0" y="70.0" width="270.0" height="34.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">85 мА</tspan></text>
<text x="632.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">(1)</text>
<line x1="560.0" y1="108.0" x2="560.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="158.5" y="169.9" width="403.0" height="52.2" rx="6" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5"/><text x="360.0" y="191.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">(1) Імпульсне значення: 300 мкс, рідкі імпульси.</tspan><tspan x="360.0" dy="18.2">Тривалий струм у рази менший.</tspan></text>
<rect x="60.0" y="258.0" width="290.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Без виноски: 85 мА = постійний</tspan><tspan x="205.0" dy="15.6">робочий струм → прилад згорить</tspan></text>
<rect x="370.0" y="258.0" width="290.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="515.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7e45" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">З виноскою: постійний струм</tspan><tspan x="515.0" dy="15.6">закладаємо в рази нижчий → ціло</tspan></text>
