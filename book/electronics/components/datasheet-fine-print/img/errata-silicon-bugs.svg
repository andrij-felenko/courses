<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Errata: вади самого кремнію — і обхід до кожної</text>
<rect x="40.0" y="64.0" width="360.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Баг кремнію (поведінка ≠ опис)</tspan></text>
<rect x="410.0" y="64.0" width="270.0" height="30.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e7e45" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">Обхід (workaround)</tspan></text>
