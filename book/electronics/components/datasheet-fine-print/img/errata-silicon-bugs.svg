<rect x="410.0" y="100.0" width="270.0" height="40.0" rx="6" fill="#f0faf3" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">скинути регістр перед першим прийомом</tspan></text>
<rect x="40.0" y="148.0" width="360.0" height="40.0" rx="6" fill="#fef4f3" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Зайвий зсув на нульовому каналі АЦП</tspan></text>
<line x1="402.0" y1="168.0" x2="408.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="410.0" y="148.0" width="270.0" height="40.0" rx="6" fill="#f0faf3" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="172.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">відняти виміряний зсув у коді</tspan></text>
<rect x="40.0" y="196.0" width="360.0" height="40.0" rx="6" fill="#fef4f3" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">I²C зависає при розтягуванні такту</tspan></text>
<line x1="402.0" y1="216.0" x2="408.0" y2="216.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="410.0" y="196.0" width="270.0" height="40.0" rx="6" fill="#f0faf3" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">вимкнути clock-stretching</tspan></text>
<rect x="154.5" y="241.9" width="411.0" height="52.2" rx="6" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5"/><text x="360.0" y="263.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">«Мій код правильний, а не працює» —</tspan><tspan x="360.0" dy="18.2">часто це відомий errata-баг. Звіряй ДО, не ПІСЛЯ.</tspan></text>
<text x="360.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">errata прив'язана до ревізії кремнію (дата-код на корпусі)</text>
