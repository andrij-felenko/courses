<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Латч-ап: паразитний тиристор замикає Vcc на GND</text>
<line x1="120.0" y1="70.0" x2="580.0" y2="70.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="110.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">Vcc</text>
<line x1="120.0" y1="260.0" x2="580.0" y2="260.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="110.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">GND</text>
<rect x="250.0" y="100.0" width="90.0" height="50.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="295.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">PNP</text>
<text x="295.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">паразит</text>
<rect x="360.0" y="180.0" width="90.0" height="50.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="405.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">NPN</text>
<text x="405.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">паразит</text>
<line x1="340.0" y1="125.0" x2="360.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="205.0" x2="340.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">петля</text>
<line x1="295.0" y1="100.0" x2="295.0" y2="70.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="405.0" y1="230.0" x2="405.0" y2="260.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="180.0" y1="125.0" x2="248.0" y2="125.0" stroke="#e0a32e" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="175.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b07d1e" text-anchor="end" font-weight="700">інжекція струму</text>
<text x="175.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">(вхід / hot-plug)</text>
<line x1="490.0" y1="70.0" x2="490.0" y2="260.0" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="6 4"/>
<text x="498.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">коротке Vcc→GND</text>
<text x="498.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">крізь кристал</text>
<text x="350.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Струм «вмикає» петлю; коротке тримається саме, доки не зняти живлення. Не обмежиш — кристал вигоряє.</text>
