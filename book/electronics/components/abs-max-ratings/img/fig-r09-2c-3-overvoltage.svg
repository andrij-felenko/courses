<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
<rect width="720" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться перенапруга на вході</text>
<rect x="50.0" y="56.0" width="300.0" height="110.0" rx="8" fill="#fbecec" stroke="#9bb0c2" stroke-width="1.4"/>
<text x="64.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1. 5 В на 3.3-вольтовий вхід</text>
<text x="64.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сигнал «1» (5 В) вищий за рейку Vcc=3.3 В</text>
<line x1="64.0" y1="118.0" x2="336.0" y2="118.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="64.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→ сигнал ↗ діод до Vcc відкрито</text>
<rect x="370.0" y="56.0" width="300.0" height="110.0" rx="8" fill="#fdf4dd" stroke="#9bb0c2" stroke-width="1.4"/>
<text x="384.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2. Сигнал раніше за живлення</text>
<text x="384.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Vcc ще 0, а на вході вже повні вольти</text>
<line x1="384.0" y1="118.0" x2="656.0" y2="118.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="384.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→ вхід «вище» нульової рейки</text>
<rect x="50.0" y="186.0" width="300.0" height="110.0" rx="8" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.4"/>
<text x="64.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. Індуктивний викид / наводка</text>
<text x="64.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">котушка чи довгий дріт кидає голку</text>
<line x1="64.0" y1="248.0" x2="336.0" y2="248.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="64.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→ коротка піка поза рейками</text>
<rect x="370.0" y="186.0" width="300.0" height="110.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.4"/>
<text x="384.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">4. Гаряче підключення</text>
<text x="384.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ємнісне перекидання в мить стику</text>
<line x1="384.0" y1="248.0" x2="656.0" y2="248.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="384.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">→ стрибок штовхає вхід за рейку</text>
<text x="360.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усі чотири шляхи кінчаються однаково: захисний діод входу відмикається — і починається струм крізь ніжку.</text>
</svg>
