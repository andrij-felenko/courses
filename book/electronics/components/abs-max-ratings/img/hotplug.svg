<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гаряче підключення: що коїться в мить дотику</text>
<rect x="40.0" y="60.0" width="200.0" height="40.0" rx="6" fill="#fff3e0" stroke="#e0a32e" stroke-width="1.5"/>
<text x="140.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b07d1e" text-anchor="middle" font-weight="700">Порядок дотику</text>
<rect x="40.0" y="110.0" width="200.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="1.5"/><text x="140.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">сигнал торкнувся</tspan><tspan x="140.0" dy="13.0">раніше за землю —</tspan><tspan x="140.0" dy="13.0">чип ще «плаває»</tspan></text>
<line x1="140.0" y1="180.0" x2="140.0" y2="206.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="260.0" y="60.0" width="200.0" height="40.0" rx="6" fill="#fff3e0" stroke="#e0a32e" stroke-width="1.5"/>
<text x="360.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b07d1e" text-anchor="middle" font-weight="700">Кидок струму</text>
<rect x="260.0" y="110.0" width="200.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="1.5"/><text x="360.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">розряджені вхідні</tspan><tspan x="360.0" dy="13.0">ємності — мов</tspan><tspan x="360.0" dy="13.0">коротке замикання</tspan></text>
<line x1="360.0" y1="180.0" x2="360.0" y2="206.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="60.0" width="200.0" height="40.0" rx="6" fill="#fff3e0" stroke="#e0a32e" stroke-width="1.5"/>
<text x="580.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b07d1e" text-anchor="middle" font-weight="700">Викид напруги</text>
<rect x="480.0" y="110.0" width="200.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="1.5"/><text x="580.0" y="133.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">індуктивність</tspan><tspan x="580.0" dy="13.0">кабелю дає сплеск</tspan><tspan x="580.0" dy="13.0">при кидку струму</tspan></text>
<line x1="580.0" y1="180.0" x2="580.0" y2="206.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="206.0" width="620.0" height="40.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="350.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">усі три штовхають вхід за рейки — знову за абсолютний максимум, з ризиком латч-апу</text>
<text x="350.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Тому на роз'ємах землю й живлення роблять довшими, а на лініях ставлять резистори й TVS.</text>
</svg>