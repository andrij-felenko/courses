<text x="350.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">У зеленому — усе як обіцяно. У жовтій прірві — може й працює, та нічого не гарантовано.</text>
<text x="350.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">За червоною межею прилад псується — часто незворотно, навіть від короткого дотику.</text>
