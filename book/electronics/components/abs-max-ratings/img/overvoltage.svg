<text x="96.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ємнісне перекидання при гарячому підключенні</text>
<line x1="524.0" y1="234.0" x2="556.0" y2="234.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="556.0" y="66.0" width="110.0" height="186.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="611.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">діод</text>
<text x="611.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">відкрито</text>
<text x="350.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Будь-який шлях відмикає захисний діод — і впорскує струм, що здатен запустити латч-ап.</text>
</svg>