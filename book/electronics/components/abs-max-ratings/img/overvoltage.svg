<text x="96.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5 В на 3.3-вольтовий вхід</text>
<line x1="524.0" y1="84.0" x2="556.0" y2="84.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
