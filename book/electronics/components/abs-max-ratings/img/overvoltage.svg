<text x="72.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b07d1e" text-anchor="middle" font-weight="700">2</text>
<text x="96.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">сигнал раніше за живлення (рейка ще 0)</text>
<line x1="524.0" y1="134.0" x2="556.0" y2="134.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="166.0" width="470.0" height="36.0" rx="6" fill="#fff3e0" stroke="#e0a32e" stroke-width="1.4"/>
