<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 883.32 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="883.32" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фізичні механізми розсіювання енергії</text>
<text x="420.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен канал має свою частотну залежність та геометрію локалізації втрат</text>
<rect x="50.0" y="75.0" width="165.0" height="230.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="132.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">1. Омічний опір (DCR)</text>
<line x1="60.0" y1="111.0" x2="205.0" y2="111.0" stroke="#333333" stroke-width="0.8"/>
<text x="62.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Постійний струм</text>
<text x="62.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Рівномірна густина по перерізу</text>
<text x="62.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">R_dc = ρ · l / A</text>
<text x="62.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Внесок: переважає на низьких f</text>
<rect x="245.0" y="75.0" width="165.0" height="230.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.6"/>
<text x="327.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Скін та Proximity</text>
<line x1="255.0" y1="111.0" x2="400.0" y2="111.0" stroke="#c0392b" stroke-width="0.8"/>
<text x="257.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Скін-шар δ ∝ 1/√f</text>
<text x="257.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вихрові струми від сусідів</text>
<text x="257.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Струм тиснеться до країв витків</text>
<text x="257.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">R_ac зростає як √f та f²</text>
<rect x="440.0" y="75.0" width="165.0" height="230.0" rx="6" fill="#fdf8ee" stroke="#d35400" stroke-width="1.6"/>
<text x="522.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">3. Втрати в осерді</text>
<line x1="450.0" y1="111.0" x2="595.0" y2="111.0" stroke="#d35400" stroke-width="0.8"/>
<text x="452.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Гістерезис: площа петлі B-H ∝ f</text>
<text x="452.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вихрові струми в осерді ∝ f²</text>
<text x="452.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">P_core = k_h·f·Bⁿ + k_e·f²·B²</text>
<text x="452.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вибір: NiZn ферит або повітря</text>
<rect x="635.0" y="75.0" width="165.0" height="230.0" rx="6" fill="#fbf0fd" stroke="#8e44ad" stroke-width="1.6"/>
<text x="717.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">4. Діелектрик ізоляції</text>
<line x1="645.0" y1="111.0" x2="790.0" y2="111.0" stroke="#8e44ad" stroke-width="0.8"/>
<text x="647.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Поляризація лаку та каркаса</text>
<text x="647.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Затримка диполів у полі</text>
<text x="647.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Кут втрат tan δ_d</text>
<text x="647.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">R_s,diel зростає як f³ біля SRF</text>
<line x1="50.0" y1="345.0" x2="790.0" y2="345.0" stroke="#333333" stroke-width="2.0"/>
<line x1="770.0" y1="345.0" x2="800.0" y2="345.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="805.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Частота f</text>
<text x="132.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Низькі частоти (DC..кГц)</text>
<text x="132.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Переважає мідний DCR</text>
<text x="327.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Середні частоти (кГц..МГц)</text>
<text x="327.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Скін + Проксиміті витків</text>
<text x="522.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">ВЧ діапазон (МГц..декоМГц)</text>
<text x="522.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Гістерезис та вихори осердя</text>
<text x="717.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">НадВЧ / біля SRF</text>
<text x="717.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Діелектрик каркаса і C_p</text>
</svg>