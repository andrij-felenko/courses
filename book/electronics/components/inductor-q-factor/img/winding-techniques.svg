<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конструктивні методи мінімізації втрат та ємності</text>
<text x="420.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Оптимізація форми провідника, просторового розміщення витків та матеріалу каркаса</text>
<rect x="40.0" y="75.0" width="175.0" height="205.0" rx="6" fill="#f4f9f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="127.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Літцендрат (Litz wire)</text>
<line x1="50.0" y1="111.0" x2="205.0" y2="111.0" stroke="#27ae60" stroke-width="0.8"/>
<text x="52.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Сотні тонких ізольованих жил</text>
<text x="52.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Переплетені в об'ємі пучка</text>
<text x="52.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Знищує скін та проксиміті</text>
<text x="52.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ефективний: 10 кГц – 2 МГц</text>
<rect x="235.0" y="75.0" width="175.0" height="205.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="322.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Секційне намотування</text>
<line x1="245.0" y1="111.0" x2="400.0" y2="111.0" stroke="#2457d6" stroke-width="0.8"/>
<text x="247.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Обмотка розбита на секції N</text>
<text x="247.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Послідовне з'єднання C_sec</text>
<text x="247.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">C_total = C_sec / N</text>
<text x="247.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Знижує C_p у N² разів!</text>
<rect x="430.0" y="75.0" width="175.0" height="205.0" rx="6" fill="#fdf8ee" stroke="#d35400" stroke-width="1.6"/>
<text x="517.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Кошикове / Універсаль</text>
<line x1="440.0" y1="111.0" x2="595.0" y2="111.0" stroke="#d35400" stroke-width="0.8"/>
<text x="442.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Перехресне укладання витків</text>
<text x="442.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Сусідні витки не паралельні</text>
<text x="442.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Мінімум площі перекриття</text>
<text x="442.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Широко у ВЧ радіоприймачах</text>
<rect x="625.0" y="75.0" width="175.0" height="205.0" rx="6" fill="#fbf0fd" stroke="#8e44ad" stroke-width="1.6"/>
<text x="712.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Крокове намотування (ВЧ)</text>
<line x1="635.0" y1="111.0" x2="790.0" y2="111.0" stroke="#8e44ad" stroke-width="0.8"/>
<text x="637.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Крок між витками s ≈ d</text>
<text x="637.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Повітряне або керамічне осердя</text>
<text x="637.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Мінімум ємності та tan δ</text>
<text x="637.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Посріблені трубки на VHF/UHF</text>
<rect x="40.0" y="295.0" width="760.0" height="65.0" rx="6" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.5"/><text x="420.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Головний закон високої добротності:</tspan><tspan x="420.0" dy="14.3">Для низьких/середніх частот (кГц..МГц) боротьба йде за площу міді та опір (літцендрат, ферит),</tspan><tspan x="420.0" dy="14.3">а на високих частотах (МГц..ГГц) — за мінімізацію ємності C_p та діелектричних втрат (крок, повітря, фторопласт).</tspan></text>
</svg>