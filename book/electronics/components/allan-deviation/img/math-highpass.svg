<text x="672.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">дисперсія Аллана</text>
<rect x="110.0" y="430.0" width="740.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="460.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">шум зі степеневим спектром  S_y(f) = h·f^α;  біля f = 0 підінтегральна функція:</tspan><tspan x="480.0" dy="15.6">класика  →  f^α  ·  збігається лише при  α &gt; −1        Аллан  →  f^(α+2)  ·  збігається при  α &gt; −3</tspan><tspan x="480.0" dy="15.6">два зайві степені f — це і є весь виграш першої різниці</tspan></text>
