<text x="400.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм передачі напруження: Паяний шов тягне олово/нікель → Епоксидний шар еластично зсувається (τ = G·γ)</text>
<text x="400.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Зниження напруження на межі кераміки у 3–5 разів порівняно з жорстким трьохшаровим виводом</text>
