<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640">
<rect width="880" height="640" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: рух магніту народжує струм</text>
<text x="440.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен крок — нове питання (сірим — те, що з цього виросло)</text>
<line x1="210.0" y1="96.0" x2="210.0" y2="610.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="210.0" cy="124.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="188.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1820</text>
<text x="236.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ерстед / Ørsted</text>
<text x="236.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Струм відхиляє компас — електрика РОБИТЬ магнетизм</text>
<circle cx="210.0" cy="200.3" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="188.0" y="205.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1820–25</text>
<text x="236.0" y="197.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ампер / Ampère</text>
<text x="236.0" y="217.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Струми діють один на одного; котушка = магніт (електродинаміка)</text>
<circle cx="210.0" cy="276.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="188.0" y="281.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1820-ті</text>
<text x="236.0" y="273.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Зворотне питання</text>
<text x="236.0" y="293.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">А чи зробить магніт струм? Усі шукають сталий ефект — і марно</text>
<circle cx="210.0" cy="353.0" r="10.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<circle cx="210.0" cy="353.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="188.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1831</text>
<text x="236.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Фарадей / Faraday</text>
<text x="236.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">ТАК — але лише при ЗМІНІ поля: електромагнітна індукція</text>
<circle cx="210.0" cy="429.3" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="188.0" y="434.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1830–32</text>
<text x="236.0" y="426.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Генрі / Henry</text>
<text x="236.0" y="446.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Котушка опирається зміні ВЛАСНОГО струму — самоіндукція, «генрі»</text>
<circle cx="210.0" cy="505.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="188.0" y="510.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1834</text>
<text x="236.0" y="502.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ленц / Lenz</text>
<text x="236.0" y="522.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Наведений струм завжди ПРОТИ зміни (збереження енергії)</text>
<rect x="202.0" y="574.0" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="188.0" y="587.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">тема</text>
<text x="236.0" y="579.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Котушка</text>
<text x="236.0" y="599.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Що таке індуктивність і чому котушка не любить зміни струму</text>
</svg>
