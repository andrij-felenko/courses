<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип вольт-секундного балансу в імпульсних перетворювачах</text>
<rect x="30.0" y="45.0" width="430.0" height="295.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
<text x="245.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вольт-секундний баланс на котушці: ∫ V_L dt = 0</text>
<line x1="60.0" y1="190.0" x2="430.0" y2="190.0" stroke="#333333" stroke-width="1.5"/>
<line x1="60.0" y1="290.0" x2="60.0" y2="85.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="50.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_L</text>
<text x="420.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">t</text>
<rect x="80.0" y="110.0" width="140.0" height="80.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="150.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">+ (V_in − V_out)</text>
<text x="150.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Площа A_on = V_on · t_on</text>
<rect x="220.0" y="190.0" width="160.0" height="70.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="300.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">− V_out</text>
<text x="300.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Площа A_off = V_off · t_off</text>
<line x1="80.0" y1="275.0" x2="220.0" y2="275.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="150.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">t_on (накопичення)</text>
<line x1="220.0" y1="275.0" x2="380.0" y2="275.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="300.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">t_off (віддача)</text>
<rect x="480.0" y="45.0" width="250.0" height="295.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.5"/>
<text x="605.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Магнітний потік Φ(t)</text>
<rect x="490.0" y="95.0" width="230.0" height="115.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="605.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">ΔΦ = (1/N) · ∫ V_L dt</tspan><tspan x="605.0" dy="13.0"></tspan><tspan x="605.0" dy="13.0">Якщо A_on = A_off:</tspan><tspan x="605.0" dy="13.0">Потік повертається у вихідну</tspan><tspan x="605.0" dy="13.0">точку кожного періоду.</tspan><tspan x="605.0" dy="13.0">Стабільна робота SMPS!</tspan></text>
<rect x="490.0" y="220.0" width="230.0" height="110.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">УВАГА: Якщо A_on &gt; A_off:</tspan><tspan x="605.0" dy="12.3">Потік щоперіоду зростає (дрейф),</tspan><tspan x="605.0" dy="12.3">осердя входить у НАСИЧЕННЯ,</tspan><tspan x="605.0" dy="12.3">L падає до нуля → струм злітає,</tspan><tspan x="605.0" dy="12.3">силовий ключ вибухає!</tspan></text>
</svg>