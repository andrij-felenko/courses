<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Електрична ізоляція: підступ корпуса TO-220</text>
<text x="410.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">металева пластина деталі часто з'єднана з виводом (колектор/сток), а радіатор спільний — тож потрібна ізоляція</text>
<rect x="320.0" y="300.0" width="300.0" height="50.0" rx="6" fill="#eef5ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">радіатор (часто заземлений / спільний)</text>
<rect x="340.0" y="282.0" width="260.0" height="16.0" rx="3" fill="#fff3e0" stroke="#e08030" stroke-width="2"/>
<text x="470.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ізолювальна прокладка (слюда/кераміка/силікон) + паста</text>
<rect x="380.0" y="250.0" width="180.0" height="32.0" rx="4" fill="#cdd5da" stroke="#1b1b1b" stroke-width="2"/>
<text x="470.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пластина деталі (TO-220)</text>
<rect x="400.0" y="200.0" width="140.0" height="50.0" rx="6" fill="#2a2a2a" stroke="#101010" stroke-width="2"/>
<text x="470.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-style="normal">корпус деталі</text>
<rect x="462.0" y="150.0" width="16.0" height="150.0" rx="2" fill="#9a9a9a" stroke="#1b1b1b" stroke-width="1.6"/>
<rect x="456.0" y="250.0" width="28.0" height="50.0" rx="2" fill="#fff3e0" stroke="#e08030" stroke-width="1.6"/>
<text x="470.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">гвинт</text>
<text x="620.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#a06a00" text-anchor="start" font-weight="bold" font-style="normal">ізолювальна втулка</text>
<text x="620.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">довкола гвинта</text>
<rect x="70.0" y="150.0" width="150.0" height="96.0" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="145.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крізь прокладку:</text>
<text x="145.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тепло ✓</text>
<text x="145.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">струм ✗</text>
<rect x="110.0" y="360.0" width="600.0" height="28.0" rx="10" fill="#fff8ee" stroke="#e08030" stroke-width="1.4"/>
<text x="410.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прокладка пропускає тепло, але не струм; втулка ізолює гвинт. Забудеш — радіатор замкне вивід.</text>
