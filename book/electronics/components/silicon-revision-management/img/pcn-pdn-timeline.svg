<text x="70.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Критичні часові нормативи JEDEC для інженерних команд:</text>
<text x="70.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. JESD46 (PCN): постачальник зобов'язаний надати зразки та звіт кваліфікації за 90 днів до впровадження.</text>
<text x="70.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. JESD48 (PDN): мінімум 6 місяців від сповіщення до дедлайну LTB, і ще 6 місяців до фінального відвантаження LTS.</text>
<text x="70.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-style="italic">3. Ігнорування PCN призводить до несподіваного зриву виробництва або непротестованих відмов плати в польових умовах.</text>
