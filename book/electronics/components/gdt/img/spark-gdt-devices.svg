<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один принцип — два корпуси: іскра в повітрі та іскра в запаяній колбі</text>
<rect x="40.0" y="55.0" width="410.0" height="270.0" rx="10" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="245.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Іскровий проміжок (spark gap)</text>
<text x="245.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">просто два електроди в повітрі</text>
<line x1="245.0" y1="135.0" x2="245.0" y2="172.0" stroke="#1a1a1a" stroke-width="8.0"/>
<path d="M 231,172 L 259,172 L 245,182 Z" fill="#1a1a1a"/>
<line x1="245.0" y1="218.0" x2="245.0" y2="255.0" stroke="#1a1a1a" stroke-width="8.0"/>
<path d="M 231,218 L 259,218 L 245,208 Z" fill="#1a1a1a"/>
<polyline points="245,182 252,187 238,193 252,198 238,203 245,208" fill="none" stroke="#e08030" stroke-width="3" stroke-linejoin="round"/>
<line x1="245.0" y1="135.0" x2="100.0" y2="135.0" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="100.0" cy="135.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="94.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">лінія / антена</text>
<line x1="245.0" y1="255.0" x2="100.0" y2="255.0" stroke="#2457d6" stroke-width="2.5"/>
<circle cx="100.0" cy="255.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="94.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">земля</text>
<text x="273.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08030" text-anchor="start">зазор</text>
<text x="273.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(повітря)</text>
<text x="245.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Дешево, грубо. Іскрить на повітрі,</text>
<text x="245.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">псується, ловить пил і вологу.</text>
<rect x="490.0" y="55.0" width="410.0" height="270.0" rx="10" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="695.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Газорозрядник (GDT)</text>
<text x="695.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий зазор, але в запаяній колбі з газом</text>
<rect x="600.0" y="130.0" width="190.0" height="110.0" rx="14" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.5"/>
<rect x="618.0" y="150.0" width="22.0" height="70.0" rx="3" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="750.0" y="150.0" width="22.0" height="70.0" rx="3" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="695.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a3fb0" text-anchor="middle" font-style="italic">Ne / Ar</text>
<polyline points="642,185 660,177 677,193 695,177 713,193 730,177 748,185" fill="none" stroke="#e08030" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="695" cy="185" rx="48" ry="22" fill="#e08030" opacity="0.12"/>
<line x1="600.0" y1="185.0" x2="550.0" y2="185.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="550.0" cy="185.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="544.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">лінія</text>
<line x1="790.0" y1="185.0" x2="850.0" y2="185.0" stroke="#2457d6" stroke-width="3.0"/>
<circle cx="850.0" cy="185.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="856.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">земля</text>
<text x="695.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Газ і тиск підібрані під потрібний поріг;</text>
<text x="695.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">герметично, без зносу. Тримає тисячі ампер.</text>
<rect x="40.0" y="352.0" width="860.0" height="95.0" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="60.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Де стоїть: ПОПЕРЕК (паралельно) між лінією та землею — у нормі його наче нема</text>
<text x="70.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08030" text-anchor="middle">сплеск</text>
<polyline points="70,403 74,407 66,411 70,415" fill="none" stroke="#e08030" stroke-width="2.2" stroke-linejoin="round"/>
