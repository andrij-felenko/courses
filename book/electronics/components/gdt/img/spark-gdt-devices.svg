<line x1="405.0" y1="462.0" x2="435.0" y2="462.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="410.0" y1="466.0" x2="430.0" y2="466.0" stroke="#2457d6" stroke-width="2.5"/>
<line x1="414.0" y1="470.0" x2="426.0" y2="470.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="444.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">GDT</text>
<rect x="745.0" y="397.0" width="30.0" height="36.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="800.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">схема,</text>
<text x="800.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">яку бережемо</text>
</svg>