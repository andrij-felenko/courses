<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">GDT як «лом» (crowbar): спрацював — і коротить сплеск на землю</text>
<line x1="90" y1="340" x2="90" y2="80" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<line x1="90" y1="340" x2="850" y2="340" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="78.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">U на GDT</text>
<text x="850.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">час</text>
<line x1="90.0" y1="120.0" x2="850.0" y2="120.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="850.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">напруга спрацювання (sparkover) ~ сотні В…кВ</text>
<line x1="90.0" y1="300.0" x2="850.0" y2="300.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="850.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">напруга дуги (arc) ~ 10…20 В — ось чому захищає</text>
<polyline points="100,334 130,330 160,322 190,308 220,288 250,262 280,228 310,180 320,120" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
<polyline points="320,120 338,300" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
<polyline points="338,300 650,300" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
<polyline points="650,300 730,270 830,285" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="2 4" stroke-linejoin="round"/>
<text x="210.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">1. сплеск росте,</text>
<text x="210.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">GDT ще «не бачить»</text>
<circle cx="320.0" cy="120.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="328.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. пробій газу</text>
<line x1="360" y1="200" x2="344" y2="235" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="366.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">3. напруга «складається»</text>
<text x="366.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(crowbar — коротке на землю)</text>
<text x="485.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">4. тримає дугу, поки тече струм</text>
<text x="760.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">5. струм згас →</text>
<text x="760.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">GDT знову ізолятор</text>
</svg>