<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="430.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Трюк точності ΔV_BE: різниця за двох струмів не залежить від екземпляра</text>
<rect x="50.0" y="56.0" width="380.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="240.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">два струми — дві напруги</text>
<line x1="70.0" y1="300.0" x2="410.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="410.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">U_F</text>
<line x1="70.0" y1="300.0" x2="70.0" y2="80.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="64.0" y="76.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">log I</text>
<line x1="138.0" y1="245.0" x2="393.0" y2="91.0" stroke="#b5732e" stroke-width="2.6" stroke-linecap="round"/>
<line x1="303.8" y1="300.0" x2="303.8" y2="148.8" stroke="#1f8a3b" stroke-width="1.3" stroke-dasharray="4,3" stroke-linecap="round"/>
<line x1="70.0" y1="148.8" x2="303.8" y2="148.8" stroke="#1f8a3b" stroke-width="1.3" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="303.8" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">I₁</text>
<line x1="329.2" y1="300.0" x2="329.2" y2="132.2" stroke="#c0271e" stroke-width="1.3" stroke-dasharray="4,3" stroke-linecap="round"/>
<line x1="70.0" y1="132.2" x2="329.2" y2="132.2" stroke="#c0271e" stroke-width="1.3" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="329.2" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I₂ = 10·I₁</text>
<line x1="303.8" y1="74.0" x2="329.2" y2="74.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="329.2" y1="74.0" x2="303.8" y2="74.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="316.5" y="68.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ΔU</text>
<rect x="460.0" y="56.0" width="380.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="650.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">чому це точно</text>
<text x="650.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ΔU = n·U_T·ln(I₂/I₁)</text>
<text x="650.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">U_T = kT/q  (§2.5.5.m)</text>
<text x="650.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">при I₂/I₁ = 10:</text>
<text x="650.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ΔU = n·ln10·(kT/q)</text>
<text x="650.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">ΔU ПРОПОРЦІЙНА абсолютній T!</text>
<text x="650.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">і НЕ залежить від Is, зміщення,</text>
<text x="650.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">екземпляра — лише від відношення струмів</text>
<text x="650.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">≈ 0.2 мВ/°C на пару — мало, але</text>
<text x="650.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="normal">ідеально передбачувано, без калібрування</text>
<text x="650.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">так міряють T процесори й точні давачі</text>
<text x="430.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звичайний U_F треба калібрувати під екземпляр; ΔU за двох струмів — абсолютний термометр із фізики.</text>
</svg>
