<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польова кристалізація та надійність танталових конденсаторів</text>
<rect x="15.0" y="15.0" width="345.0" height="370.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="187.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польова кристалізація аморфного Ta₂O₅</text>
<text x="187.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ріст кристалітів під напругою та підвищеною температурою</text>
<rect x="57.0" y="90.0" width="260.0" height="20.0" rx="2" fill="#a0aec0" stroke="#4a5568" stroke-width="1.2"/>
<text x="187.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Металевий тантал Ta (анодне тіло)</text>
<rect x="57.0" y="110.0" width="260.0" height="45.0" rx="2" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.2"/>
<text x="132.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2b6cb0" text-anchor="middle">Аморфний Ta₂O₅ (ізолятор)</text>
<rect x="212.0" y="110.0" width="45.0" height="45.0" rx="2" fill="#fed7d7" stroke="#c0392b" stroke-width="1.5"/>
<text x="234.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Кристаліт</text>
<text x="234.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Ta₂O₅</text>
<line x1="212.0" y1="110.0" x2="212.0" y2="155.0" stroke="#c53030" stroke-width="2.0" stroke-dasharray="2,2"/>
<line x1="257.0" y1="110.0" x2="257.0" y2="155.0" stroke="#c53030" stroke-width="2.0" stroke-dasharray="2,2"/>
<rect x="57.0" y="155.0" width="260.0" height="20.0" rx="2" fill="#718096" stroke="#2d3748" stroke-width="1.2"/>
<text x="187.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Катодний шар (MnO₂ або Полімер)</text>
<rect x="25.0" y="215.0" width="325.0" height="155.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.0"/>
<text x="187.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм росту струму витоку (DCL)</text>
<text x="187.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Аморфний Ta₂O₅ термодинамічно метастабільний</text>
<text x="187.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Поле E &gt; 2 МВ/см викликає міграцію іонів кисню</text>
<text x="187.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Кристалічна фаза має вищу густину → мікротріщини</text>
<text x="187.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">• Струм витоку DCL стрімко зростає у 10–100 разів</text>
<text x="187.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Потребує напругового дератингу до 50% від V_nom</text>
<rect x="375.0" y="15.0" width="370.0" height="370.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="560.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими відмови: MnO₂ проти Полімеру</text>
<text x="560.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Самозаліковування та ризик теплового загоряння</text>
<rect x="385.0" y="75.0" width="350.0" height="135.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="560.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Твердотільний тантал з катодом MnO₂</text>
<text x="560.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Мікропробій нагріває MnO₂: 2MnO₂ → Mn₂O₃ + O₂</text>
<text x="560.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">2. Mn₂O₃ ізолятор (самозаліковування за малого струму)</text>
<text x="560.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b2c2c" text-anchor="middle" font-weight="700">3. За високого струму: вивільнений O₂ окиснює Ta</text>
<text x="560.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">4. Екзотермічна реакція горіння Ta + O₂ → Пожежа</text>
<text x="560.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вимога: послідовний опір 1–3 Ом/В або дератинг 50%</text>
<rect x="385.0" y="220.0" width="350.0" height="150.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.2"/>
<text x="560.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Полімерний тантал (PEDOT:PSS)</text>
<text x="560.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Провідний полімер не містить зв'язаного кисню</text>
<text x="560.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">2. Нагрів викликає карбонізацію та ізоляцію полімеру</text>
<text x="560.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3. Відсутність кисню виключає екзотермічне горіння Ta</text>
<text x="560.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">4. «Доброякісна відмова» (Benign failure): високоомний стан</text>
<text x="560.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Допускає дератинг напруги 10–20% (робота на 80–90% V_nom)</text>
</svg>