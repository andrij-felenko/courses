<text x="715.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">+ΔP</text>
<rect x="390.0" y="310.0" width="340.0" height="60.0" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.0"/>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">L = L₀ · 2^((T_max − T_core) / 10)</text>
<text x="560.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ресурс скорочується вдвічі на кожні 10 °C перегріву серцевини</text>
