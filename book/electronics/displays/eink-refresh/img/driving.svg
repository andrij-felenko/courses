<rect x="324.0" y="142.0" width="332.0" height="36.0" rx="6" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.3"/><text x="490.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">LUT за температурою  (термодавач)</tspan></text>
<rect x="324.0" y="190.0" width="332.0" height="36.0" rx="6" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.3"/><text x="490.0" y="211.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">±15 В: зарядна помпа / перетворювач</tspan></text>
<rect x="324.0" y="238.0" width="332.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/><text x="490.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">драйвери рядків і стовпців панелі</tspan></text>
<text x="360.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">хост шле образ і команду; вибір хвилеформи, імпульси й висока напруга — на модулі</text>
