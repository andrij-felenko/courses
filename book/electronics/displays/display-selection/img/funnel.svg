<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Напрям вибору — згори вниз, від сценарію</text>
<rect x="60.0" y="60.0" width="640.0" height="62.0" rx="6" fill="#eef4f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f78b4" text-anchor="middle" font-weight="700">СЦЕНАРІЙ</text>
<text x="380.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">хто? де? що показує? як часто? скільки живе? почім? у якому корпусі?</text>
<rect x="150.0" y="152.0" width="460.0" height="62.0" rx="6" fill="#fff8e6" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">ТВЕРДІ ОБМЕЖЕННЯ</text>
<text x="380.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сонце · енергія · вартість · кабель · розмір · дотик</text>
<rect x="240.0" y="244.0" width="280.0" height="62.0" rx="6" fill="#eafaf0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">КАНДИДАТИ</text>
<text x="380.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">e-ink · OLED · TFT-LCD</text>
<line x1="380.0" y1="122.0" x2="380.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">вивести</text>
<line x1="380.0" y1="214.0" x2="380.0" y2="242.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">відсіяти</text>
<line x1="700.0" y1="300.0" x2="700.0" y2="64.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-style="italic">хто йде знизу — впирається</text>
<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">обмеження викидають більшість технологій — і лише тоді порівнюють деталі</text>
</svg>