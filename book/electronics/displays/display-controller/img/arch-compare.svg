<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр «на склі» проти кадру «в МК»</text>
<rect x="40.0" y="60.0" width="310.0" height="230.0" rx="6" fill="#f7fbff" stroke="#2457d6" stroke-width="2.0"/>
<text x="195.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Розумна панель (кадр на склі)</text>
<text x="60.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">+ майже не їсть RAM хоста</text>
<text x="60.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">+ дешевий МК, проста шина</text>
<text x="60.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">+ шле лише ЗМІНИ</text>
<text x="60.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">− обмежена гнучкість і розмір</text>
<rect x="370.0" y="60.0" width="310.0" height="230.0" rx="6" fill="#fff3f1" stroke="#c0392b" stroke-width="2.0"/>
<text x="525.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Хост-буфер (кадр у МК)</text>
<text x="390.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">+ повний контроль пікселів</text>
<text x="390.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">+ великі екрани, плавна анімація</text>
<text x="390.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">− багато швидкої RAM (× 2 кадри)</text>
<text x="390.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">− безперервний потік, потужний МК</text>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Безкоштовного варіанта немає — є відповідний задачі</text>
</svg>