<text x="360.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">out = src·α + dst·(1 − α)</text>
<text x="360.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Скло не буває напівпрозорим — у буфер екрана лягає вже ЗМІШАНИЙ колір</text>
