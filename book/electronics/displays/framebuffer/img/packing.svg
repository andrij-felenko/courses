<text x="410.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Менше за байт (1, 2, 4 біти) — пікселі пакують у байт, і зміна одного вимагає читай-міняй-пиши</text>
