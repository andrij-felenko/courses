<text x="380.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резистивний відчуває МЕХАНІЧНИЙ натиск; ємнісний — ЕЛЕКТРИЧНУ присутність пальця.</text>
<text x="380.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Звідси й уся різниця: чим торкатися, чи є мультитач, яка міцність і чіткість.</text>
