<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">RGB-паралельний: панель без памʼяті, скан без упину</text>
<rect x="56.0" y="92.0" width="180.0" height="150.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="146.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хост</text>
<rect x="74.0" y="128.0" width="144.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="146.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">кадровий буфер</text>
<text x="146.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">(памʼять — тут!)</text>
<rect x="74.0" y="178.0" width="144.0" height="48.0" rx="6" fill="#eef0ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="146.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">контролер дисплея</text>
<text x="146.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вичитує через DMA</text>
<text x="390.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">PCLK + R/G/B + HSYNC/VSYNC/DE</text>
<line x1="238.0" y1="104.0" x2="540.0" y2="104.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="238.0" y1="115.0" x2="540.0" y2="115.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="238.0" y1="126.0" x2="540.0" y2="126.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="238.0" y1="137.0" x2="540.0" y2="137.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="238.0" y1="148.0" x2="540.0" y2="148.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="238.0" y1="159.0" x2="540.0" y2="159.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="390.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">широка безперервна шина (28–40 пінів)</text>
<rect x="540.0" y="92.0" width="170.0" height="170.0" rx="6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="625.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">панель без GRAM</text>
<line x1="556.0" y1="126.0" x2="678.0" y2="126.0" stroke="#3a6df0" stroke-width="2.2"/>
<line x1="556.0" y1="142.0" x2="678.0" y2="142.0" stroke="#3a6df0" stroke-width="2.2"/>
<line x1="556.0" y1="158.0" x2="678.0" y2="158.0" stroke="#3a6df0" stroke-width="2.2"/>
<line x1="556.0" y1="174.0" x2="678.0" y2="174.0" stroke="#3a6df0" stroke-width="2.2"/>
<line x1="556.0" y1="190.0" x2="678.0" y2="190.0" stroke="#6b7280" stroke-width="2.2"/>
<line x1="678.0" y1="126.0" x2="556.0" y2="142.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="2,3"/>
<text x="625.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#cfd3da" text-anchor="middle">хтось мусить лити</text>
<text x="625.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ff8a80" text-anchor="middle" font-weight="700">весь растр щокадру</text>
<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Панель лише засвічує те, що зараз на лініях. Зупиниш потік — картинка розсиплеться.</text>
<text x="380.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Контролер дисплея безперервно сканує кадр, видаючи пікселі під PCLK; між видимими ділянками —</text>
<text x="380.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">порожні «поля» (porch) для гасіння. Памʼ ять під кадровий буфер — у самому хості.</text>
</svg>