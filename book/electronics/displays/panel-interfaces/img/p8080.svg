<text x="160.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(8 чи 16 розрядів)</text>
<line x1="242.0" y1="122.0" x2="300.0" y2="122.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="304.0" y="86.0" width="160.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="384.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">контролер</text>
<text x="384.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">«защіпає» слово</text>
<text x="384.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">на фронті WR</text>
<text x="90.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">WR (строб):</text>
<path d="M 190.0 228.0 L 224.0 228.0 L 224.0 250.0 L 258.0 250.0 L 258.0 228.0 L 292.0 228.0 L 292.0 250.0 L 326.0 250.0 L 326.0 228.0 L 360.0 228.0 L 360.0 250.0 L 394.0 250.0 L 394.0 228.0 L 428.0 228.0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<line x1="258.0" y1="216.0" x2="258.0" y2="260.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="2,3"/>
<text x="258.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">фронт → слово фіксується</text>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">За один строб проходить 8 або 16 біт — у стільки ж разів ширша труба за SPI, що жене по біту.</text>
<text x="380.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Платять пінами: 12–24 проводи проти трьох. Усередині — той самий контролер із GRAM, що й у SPI.</text>
</svg>