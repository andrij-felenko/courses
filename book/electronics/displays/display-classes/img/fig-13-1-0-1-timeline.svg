  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Рідкий кристал → дисплей: ланцюг від ботаніки до годинника</text>
<text x="450.0" y="57.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">наука була готова за 70 років до приладу; синім — те, що сталося ПОЗА RCA</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="730.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="116.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1888</text>
<text x="276.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Райнітцер / Reinitzer</text>
<text x="276.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Холестерилбензоат має ДВІ точки плавлення — каламутний проміжний стан</text>
<circle cx="250.0" cy="190.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1889</text>
<text x="276.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Леманн / Lehmann</text>
<text x="276.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Це «рідкий кристал»: тече як рідина, а світло заломлює як кристал</text>
<circle cx="250.0" cy="264.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="269.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1911</text>
<text x="276.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Можен / Mauguin</text>
<text x="276.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Закручений шар нематика повертає площину поляризації світла</text>
<circle cx="250.0" cy="338.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1962</text>
<text x="276.0" y="335.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Вільямс / Williams · RCA</text>
<text x="276.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Електричне поле збурює нематик у смуги-домени — є електрооптика!</text>
<circle cx="250.0" cy="412.0" r="10.5" fill="#c0271e" stroke="#c0271e" stroke-width="3"/>
<circle cx="250.0" cy="412.0" r="5.0" fill="#fff" stroke="#fff" stroke-width="0"/>
<text x="228.0" y="417.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1968</text>
<text x="276.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Гайльмаєр / Heilmeier · RCA</text>
<text x="276.0" y="428.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Динамічне розсіяння: прозоре скло мутніє від струму — ПЕРШИЙ LCD</text>
<circle cx="250.0" cy="486.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="491.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1970</text>
<text x="276.0" y="483.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Гельфріх / Helfrich</text>
<text x="276.0" y="502.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Іде з RCA до Roche: ідею «закрученого нематика» в RCA зустріли байдуже</text>
<circle cx="250.0" cy="560.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="565.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1971</text>
<text x="276.0" y="557.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Шадт+Гельфріх · Ферґасон</text>
<text x="276.0" y="576.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Twisted nematic (TN): польовий ефект, копійки енергії — оце й переможе</text>
<circle cx="250.0" cy="634.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="228.0" y="639.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1973</text>
<text x="276.0" y="631.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Sharp · Seiko · Японія</text>
<text x="276.0" y="650.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#4a5a86" text-anchor="start" font-weight="normal" font-style="italic">Калькулятор і годинник на LCD — виробництво їде в Азію</text>
<circle cx="250.0" cy="708.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="713.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1976</text>
<text x="276.0" y="705.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">RCA продає LC-бізнес</text>
<text x="276.0" y="724.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Винахід остаточно йде з компанії, що його породила</text>
<text x="450.0" y="752.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Іронія: RCA зробила перший дисплей (1968) і випустила з рук обидві ключові ідеї — DSM і TN.</text>
</svg>
