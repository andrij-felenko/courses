<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві причини розірвати провід між двома боками</text>
<text x="360.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Безпека: небезпечний потенціал не має вийти на слабкий бік</text>
<line x1="360.0" y1="78.0" x2="360.0" y2="168.0" stroke="#27ae60" stroke-width="2.4" stroke-dasharray="6,5"/>
<text x="360.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">бар'єр</text>
<rect x="90.0" y="96.0" width="150.0" height="58.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="165.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">силовий бік</text>
<text x="165.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">сотні вольтів</text>
<rect x="480.0" y="96.0" width="150.0" height="58.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="555.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">керування + людина</text>
<text x="555.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">3.3 В, дотик</text>
<line x1="245.0" y1="125.0" x2="350.0" y2="125.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="363.0" y1="110.0" x2="363.0" y2="140.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="302.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">напруга впирається</text>
<text x="420.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">стінка не пускає</text>
<line x1="40.0" y1="200.0" x2="680.0" y2="200.0" stroke="#d6dde6" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Шум: спільна земля дає петлю зі зрівнювальним струмом</text>
<rect x="90.0" y="258.0" width="150.0" height="52.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">пристрій A</text>
<rect x="480.0" y="258.0" width="150.0" height="52.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="555.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">пристрій B</text>
<text x="360.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">БЕЗ розриву:</text>
<line x1="165.0" y1="322.0" x2="165.0" y2="334.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="152.0" y1="334.0" x2="178.0" y2="334.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="157.0" y1="339.0" x2="173.0" y2="339.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="162.0" y1="344.0" x2="168.0" y2="344.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="555.0" y1="322.0" x2="555.0" y2="334.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="542.0" y1="334.0" x2="568.0" y2="334.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="547.0" y1="339.0" x2="563.0" y2="339.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="552.0" y1="344.0" x2="558.0" y2="344.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="165.0" y1="344.0" x2="555.0" y2="344.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">різні «нулі» → струм тече по спільній землі</text>
<line x1="300.0" y1="344.0" x2="420.0" y2="344.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">зрівнювальний струм наводить шум у сигнал</text>
<text x="360.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">Розрив землі забирає контур: різниця лишається, а струму нема куди текти</text>
</svg>