<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи провести сигнал крізь непровідну стінку</text>
<rect x="40.0" y="52.0" width="300.0" height="296.0" rx="10" fill="#eef2f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="190.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ємнісний зв'язок</text>
<text x="190.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(дві пластинки + діелектрик)</text>
<line x1="80.0" y1="150.0" x2="165.0" y2="150.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="165.0" y1="124.0" x2="165.0" y2="176.0" stroke="#1a1a1a" stroke-width="4.0"/>
<line x1="215.0" y1="124.0" x2="215.0" y2="176.0" stroke="#1a1a1a" stroke-width="4.0"/>
<line x1="215.0" y1="150.0" x2="300.0" y2="150.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="190.0" y1="110.0" x2="190.0" y2="190.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="190.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">діелектрик</text>
<text x="190.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">постійна напруга не проходить</text>
<text x="190.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">швидка зміна наводить струм</text>
<line x1="110.0" y1="258.0" x2="160.0" y2="258.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">тільки зміна</text>
<text x="190.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">→ переходить на другу пластину</text>
<rect x="380.0" y="52.0" width="300.0" height="296.0" rx="10" fill="#fbeee6" stroke="#c0392b" stroke-width="1.6"/>
<text x="530.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітний зв'язок</text>
<text x="530.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(дві котушки, спільне поле)</text>
<path d="M 488 126 a 8 8 0 1 1 0.1 0" fill="none" stroke="#2457d6" stroke-width="2.2"/>
<path d="M 572 126 a 8 8 0 1 0 -0.1 0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<path d="M 488 142 a 8 8 0 1 1 0.1 0" fill="none" stroke="#2457d6" stroke-width="2.2"/>
<path d="M 572 142 a 8 8 0 1 0 -0.1 0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<path d="M 488 158 a 8 8 0 1 1 0.1 0" fill="none" stroke="#2457d6" stroke-width="2.2"/>
<path d="M 572 158 a 8 8 0 1 0 -0.1 0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<line x1="480.0" y1="120.0" x2="458.0" y2="120.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="480.0" y1="180.0" x2="458.0" y2="180.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="580.0" y1="120.0" x2="602.0" y2="120.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="580.0" y1="180.0" x2="602.0" y2="180.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="530.0" y1="106.0" x2="530.0" y2="194.0" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="530.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">ізоляція</text>
<text x="530.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">постійний струм не проходить</text>
<text x="530.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">зміна струму = змінне поле</text>
<text x="530.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">→ наводить напругу в другій котушці</text>
<text x="360.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Обидва містки пропускають лише ЗМІНУ — на цьому все й будується</text>
</svg>