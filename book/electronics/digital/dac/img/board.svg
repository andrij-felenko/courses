<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині модуля MCP4725: число по I²C стає чистою напругою</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дві лінії I²C → 12-бітний регістр → драбина ЦАП → буфер → єдиний вихід; EEPROM тримає значення між увімкненнями</text>
<rect x="12.0" y="166.0" width="136.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="80.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">VCC / GND</tspan><tspan x="80.0" dy="15.6">(живлення = Vref)</tspan></text>
<rect x="12.0" y="266.0" width="136.0" height="48.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="80.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">SDA / SCL</tspan><tspan x="80.0" dy="15.6">(I²C, до 400 кГц)</tspan></text>
<rect x="287.0" y="184.0" width="106.0" height="72.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
<text x="340.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">12-бітний</tspan><tspan x="340.0" dy="16.9">регістр</tspan><tspan x="340.0" dy="16.9">(0…4095)</tspan></text>
<line x1="148.0" y1="290.0" x2="280.0" y2="232.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="148.0" y1="190.0" x2="280.0" y2="214.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Vref = VCC</text>
<rect x="273.0" y="290.0" width="134.0" height="58.0" rx="6" fill="#f0fff0" stroke="#27ae60" stroke-width="1.5"/>
<text x="340.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">EEPROM</tspan><tspan x="340.0" dy="14.3">(тримає значення</tspan><tspan x="340.0" dy="14.3">між увімкненнями)</tspan></text>
<line x1="340.0" y1="290.0" x2="340.0" y2="258.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="352.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start"><tspan x="352.0" dy="0.0">відновлює</tspan><tspan x="352.0" dy="11.7">при старті</tspan></text>
<line x1="393.0" y1="220.0" x2="530.0" y2="220.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="556.0" y="180.0" width="88.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="600.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Драбина</tspan><tspan x="600.0" dy="15.6">R-2R</tspan><tspan x="600.0" dy="15.6">(аналогова</tspan><tspan x="600.0" dy="15.6">схема)</tspan></text>
<line x1="644.0" y1="220.0" x2="730.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="688.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">буфер</text>
<rect x="760.0" y="195.0" width="62.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="791.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="791.0" dy="0.0">OUT</tspan><tspan x="791.0" dy="16.9">0…VCC</tspan></text>
<rect x="100.0" y="340.0" width="660.0" height="28.0" rx="6" fill="#fff8e6" stroke="#cca43a" stroke-width="1.5"/><text x="430.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Vref = VCC: точність виходу прямо залежить від стабільності живлення.</tspan></text>
</svg>