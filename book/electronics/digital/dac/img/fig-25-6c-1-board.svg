<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині модуля MCP4725: «ЦАП у коробочці» з пам'яттю</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дві лінії I²C → регістр → драбина ЦАП → буфер → вихід; EEPROM зберігає значення між увімкненнями</text>
<rect x="11.9" y="166.2" width="136.3" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="80.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">VCC / GND</tspan><tspan x="80.0" dy="15.6">(живлення = Vref)</tspan></text>
<rect x="11.9" y="266.2" width="136.3" height="47.6" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="80.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">SDA / SCL</tspan><tspan x="80.0" dy="15.6">(I²C, до 400 кГц)</tspan></text>
<line x1="140.0" y1="290.0" x2="270.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="287.2" y="184.6" width="105.5" height="70.8" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/><text x="340.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">12-бітний</tspan><tspan x="340.0" dy="16.9">ЦАП-регістр</tspan><tspan x="340.0" dy="16.9">(0…4095)</tspan></text>
<rect x="273.6" y="290.2" width="132.9" height="59.6" rx="6" fill="#f0fff0" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">EEPROM</tspan><tspan x="340.0" dy="14.3">(зберігає значення</tspan><tspan x="340.0" dy="14.3">між увімкненнями)</tspan></text>
<line x1="340.0" y1="303.0" x2="340.0" y2="255.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">відновлює
при старті</text>
<line x1="392.8" y1="220.0" x2="530.0" y2="220.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.8" y="180.6" width="88.4" height="78.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Драбина</tspan><tspan x="600.0" dy="15.6">R-2R</tspan><tspan x="600.0" dy="15.6">(аналогова</tspan><tspan x="600.0" dy="15.6">схема)</tspan></text>
<line x1="644.2" y1="220.0" x2="730.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="759.9" y="195.1" width="60.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">OUT</tspan><tspan x="790.0" dy="16.9">0…VCC</tspan></text>
<text x="730.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">буфер</text>
<line x1="140.0" y1="190.0" x2="270.0" y2="215.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Vref = VCC</text>
<rect x="100.0" y="340.0" width="660.0" height="28.0" rx="6" fill="#fff8e6" stroke="#cca43a" stroke-width="1.5"/><text x="430.0" y="357.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Vref = VCC: точність виходу прямо залежить від стабільності живлення.</tspan></text>
</svg>