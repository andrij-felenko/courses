<rect x="540.0" y="348.0" width="230.0" height="50.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="369.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Ціна оновлення НЕ залежить від K:</tspan><tspan x="655.0" dy="14.3">завжди 2 додавання, а не K</tspan></text>
<text x="400.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кільце: голова біжить по колу, найстаріший відлік «випадає» саме там, де вписуємо новий</text>
