<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві стратегії скрабу: сліпо переписати все — чи звірити й виправити</text>
<rect x="40.0" y="56.0" width="330.0" height="350.0" rx="6" fill="#fdf3f0" stroke="#c0392b" stroke-width="2.0"/>
<text x="205.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">СЛІПИЙ СКРАБ (blind)</text>
<rect x="58.0" y="96.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">періодично перезаписати ВЕСЬ кадр</tspan><tspan x="205.0" dy="15.0">(чи весь чип) з еталона — не читаючи</tspan></text>
<text x="58.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a45" text-anchor="start">+  простий: лише пише, звіряння нема</text>
<text x="58.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a45" text-anchor="start">+  MBU не страшний: пише все підряд</text>
<text x="58.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">−  пише й по цілому — марна робота</text>
<text x="58.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">−  у живий кадр → ризик контенції</text>
<text x="58.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">−  не знає, що і коли збоїло</text>
<rect x="58.0" y="322.0" width="294.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="352.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="205.0" dy="0.0">де: логіку можна на мить спинити,</tspan><tspan x="205.0" dy="15.0">потрібна гранична простота</tspan></text>
<rect x="390.0" y="56.0" width="330.0" height="350.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="555.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e7a45" text-anchor="middle" font-weight="700">READBACK-СКРАБ</text>
<rect x="408.0" y="96.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">прочитати кадр назад, звірити (ECC/CRC),</tspan><tspan x="555.0" dy="15.0">виправити лише хибне — у ціле не пише</tspan></text>
<text x="408.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a45" text-anchor="start">+  цілого не чіпає → без контенції</text>
<text x="408.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7a45" text-anchor="start">+  дає звіт: де й коли був збій</text>
<text x="408.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">−  складніший: звіряти й рахувати ECC</text>
<text x="408.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">−  ECC кадру ловить 1–2 біти; більше —</text>
<text x="424.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">перекладає на CRC + перезаливку</text>
<rect x="408.0" y="322.0" width="294.0" height="68.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="352.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a45" text-anchor="middle"><tspan x="555.0" dy="0.0">де: логіку спиняти не можна,</tspan><tspan x="555.0" dy="15.0">потрібен облік збоїв (космос)</tspan></text>
</svg>