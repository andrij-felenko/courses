<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комірка даних читається адресою; комірка конфігурації просто ТРИМАЄ вихід</text>
<rect x="40.0" y="58.0" width="300.0" height="26.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Комірка даних (звичайна RAM)</tspan></text>
<rect x="130.0" y="104.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="190.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 біт</text>
<text x="190.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">даних</text>
<line x1="60.0" y1="134.0" x2="128.0" y2="134.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="48.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">адреса</text>
<text x="48.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">обирає її</text>
<line x1="252.0" y1="134.0" x2="320.0" y2="134.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="290.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">дані</text>
<rect x="60.0" y="200.0" width="280.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="224.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Її раз-по-раз ЧИТАЮТЬ і ПЕРЕПИСУЮТЬ:</tspan><tspan x="200.0" dy="14.3">адреса вибирає одну з мільйонів,</tspan><tspan x="200.0" dy="14.3">вміст живе своїм життям під час роботи.</tspan></text>
<rect x="400.0" y="58.0" width="300.0" height="26.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Комірка конфігурації (тканина FPGA)</tspan></text>
<rect x="420.0" y="104.0" width="110.0" height="60.0" rx="6" fill="#dff3e6" stroke="#27ae60" stroke-width="2.0"/>
<text x="475.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">засув</text>
<text x="475.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тримає 1 біт</text>
<line x1="532.0" y1="134.0" x2="600.0" y2="134.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="602.0" y="108.0" width="96.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="650.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">перемикач</text>
<text x="650.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">/ біт LUT</text>
<rect x="420.0" y="200.0" width="280.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="224.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Її НЕ адресують під час роботи:</tspan><tspan x="560.0" dy="14.3">залили раз при старті — і вихід</tspan><tspan x="560.0" dy="14.3">СТАЛО тримає дріт чи біт таблиці.</tspan></text>
<rect x="120.0" y="300.0" width="500.0" height="66.0" rx="6" fill="#fff8e1" stroke="#c0392b" stroke-width="1.5"/><text x="370.0" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Та сама SRAM-схема — різна роль. Комірка даних — це «зошит», куди пишуть і звідки читають.</tspan><tspan x="370.0" dy="11.7">Комірка конфігурації — це «перемикач, застиглий у положенні»: вона й Є частиною схеми,</tspan><tspan x="370.0" dy="11.7">її вихід нікуди не читають шиною — він мовчки задає, як з'єднані дроти.</tspan></text>
</svg>