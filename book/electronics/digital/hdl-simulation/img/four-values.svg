<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Провід у симуляції має чотири значення, не два — і саме X та Z ловлять баги</text>
<rect x="98.0" y="95.0" width="84.0" height="50.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/><text x="140.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">0</tspan></text>
<text x="140.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">твердий нуль</text>
<text x="140.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="140.0" dy="0.0">лог. низький рівень</tspan></text>
<rect x="288.0" y="95.0" width="84.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="330.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">1</tspan></text>
<text x="330.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тверда одиниця</text>
<text x="330.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="330.0" dy="0.0">лог. високий рівень</tspan></text>
<rect x="478.0" y="95.0" width="84.0" height="50.0" rx="6" fill="#fdf3d6" stroke="#b8860b" stroke-width="2.2"/><text x="520.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">X</tspan></text>
<text x="520.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700">НЕВІДОМО</text>
<text x="520.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">не задано / конфлікт</tspan></text>
<rect x="668.0" y="95.0" width="84.0" height="50.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="2.2"/><text x="710.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Z</tspan></text>
<text x="710.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ВІДКЛЮЧЕНО</text>
<text x="710.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="710.0" dy="0.0">ніхто не жене (три-стейт)</tspan></text>
<rect x="70.0" y="250.0" width="320.0" height="78.0" rx="6" fill="#fdf3d6" stroke="#b8860b" stroke-width="1.6"/><text x="230.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">X з'являється, коли провід НЕ ІНІЦІАЛІЗОВАНО або два</tspan><tspan x="230.0" dy="12.3">драйвери тягнуть у різні боки. Симулятор РОЗНОСИТЬ X</tspan><tspan x="230.0" dy="12.3">далі схемою — і баг сам себе підсвічує ще до плати.</tspan></text>
<rect x="410.0" y="250.0" width="320.0" height="78.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="570.0" y="280.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Z — законний стан три-стейтового виходу (спільна шина).</tspan><tspan x="570.0" dy="11.1">Але Z на внутрішньому дроті майже завжди означає</tspan><tspan x="570.0" dy="11.1">«сюди нічого не під'єднано» — теж помилка, видима в симуляції.</tspan></text>
</svg>