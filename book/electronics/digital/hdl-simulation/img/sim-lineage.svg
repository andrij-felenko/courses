<text x="410.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">керований подіями симулятор — старший за Verilog: мову приладнали до вже готової машини часу</text>
