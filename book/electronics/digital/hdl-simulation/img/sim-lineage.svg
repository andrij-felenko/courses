<text x="547.4" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1984</text>
<text x="547.4" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="547.4" dy="0.0">Мурбі несе ту саму</tspan><tspan x="547.4" dy="10.8">керовану подіями</tspan><tspan x="547.4" dy="10.8">машину в Gateway</tspan></text>
