<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехресний зв'язок робить два стійкі стани</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вихід кожного елемента живить вхід іншого — петля сама себе підтримує</text>
<path d="M250.0 150.0 L250.0 180.0 L294.0 165.0 z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><circle cx="300.0" cy="165.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M250.0 210.0 L250.0 240.0 L294.0 225.0 z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><circle cx="300.0" cy="225.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="306.0" y1="165.0" x2="340.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="306.0" y1="225.0" x2="340.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="340.0" cy="165.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="340.0" cy="225.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="350.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Q=1</text>
<text x="350.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Q̄=0</text>
<line x1="340.0" y1="165.0" x2="340.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="340.0" y1="126.0" x2="232.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="232.0" y1="126.0" x2="232.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="232.0" y1="225.0" x2="250.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="340.0" y1="225.0" x2="340.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="340.0" y1="264.0" x2="218.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="218.0" y1="264.0" x2="218.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="218.0" y1="165.0" x2="250.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="272.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">два інвертори, з'єднані навхрест</text>
<rect x="540.0" y="100.0" width="250.0" height="170.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/><text x="665.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Два стійкі стани:</tspan><tspan x="665.0" dy="15.6">стан «1»:  Q=1, Q̄=0</tspan><tspan x="665.0" dy="15.6">стан «0»:  Q=0, Q̄=1</tspan><tspan x="665.0" dy="15.6">кожен сам себе тримає —</tspan><tspan x="665.0" dy="15.6">замкнене коло, що «застрягло»</tspan></text>
<text x="410.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Це й є 1 біт: схема не скочується в одну рівновагу — вона має дві й тримає обрану.</text>
</svg>