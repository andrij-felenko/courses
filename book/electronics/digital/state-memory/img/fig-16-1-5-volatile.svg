<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
<rect width="820" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тонкість: така пам'ять тримається ЖИВЛЕННЯМ</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">петля самопідтримки працює, лише поки є струм; зникло живлення — біт забуто (енергозалежність)</text>
<rect x="110.0" y="100.0" width="250.0" height="120.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="2"/>
<text x="235.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">живлення Є</text>
<text x="235.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Q = 1 (тримається)</text>
<text x="235.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">петля підкріплює себе</text>
<line x1="370.0" y1="160.0" x2="450.0" y2="160.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="410.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вимк.</text>
<rect x="460.0" y="100.0" width="250.0" height="120.0" rx="10" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="2"/>
<text x="585.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">живлення НЕМА</text>
<text x="585.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Q = ?  (забуто)</text>
<text x="585.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">петля розірвана</text>
<text x="410.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому пам'ять на тригерах (регістри, SRAM) — «енергозалежна»: губить дані без живлення.</text>
<text x="410.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Постійне зберігання (Flash) — інша річ, до якої дійдемо в Розділі 19.</text>
</svg>
