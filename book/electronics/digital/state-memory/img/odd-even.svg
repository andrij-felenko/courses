<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парність інверсій у петлі вирішує: тримати стан чи коливатися</text>
<text x="410.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один інвертор у петлі осідає біля порога; кільце з 3+ інверторів коливається; два інвертори дають два стійкі стани</text>
<rect x="40.0" y="78.0" width="360.0" height="300.0" rx="6" fill="#ffffff" stroke="#e2e6ea" stroke-width="1.5"/>
<text x="220.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1 інвертор (непарна) → нема стійкого стану</text>
<line x1="130.0" y1="166.0" x2="170.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M170.0 150.0 L170.0 182.0 L214.0 166.0 z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><circle cx="220.0" cy="166.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="226.0" y1="166.0" x2="290.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="290.0" y1="166.0" x2="290.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="290.0" y1="126.0" x2="110.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="110.0" y1="126.0" x2="110.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="110.0" y1="166.0" x2="130.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вихід → вхід</text>
<text x="220.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">вихід = вхід → застрягає коло порога,</text>
<text x="220.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">поводиться як підсилювач, а не пам'ять</text>
<text x="220.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">чисте коливання дає лише непарне</text>
<text x="220.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">кільце з 3 і більше інверторів</text>
<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(кільцевий генератор)</text>
<rect x="420.0" y="78.0" width="360.0" height="300.0" rx="6" fill="#ffffff" stroke="#e2e6ea" stroke-width="1.5"/>
<text x="600.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2 інвертори (парна) → два стійкі стани</text>
<path d="M530.0 150.0 L530.0 180.0 L574.0 165.0 z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><circle cx="580.0" cy="165.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M530.0 210.0 L530.0 240.0 L574.0 225.0 z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><circle cx="580.0" cy="225.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="586.0" y1="165.0" x2="620.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="586.0" y1="225.0" x2="620.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.8"/>
<circle cx="620.0" cy="165.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="620.0" cy="225.0" r="3.2" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="630.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Q=1</text>
<text x="630.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Q̄=0</text>
<line x1="620.0" y1="165.0" x2="620.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="620.0" y1="126.0" x2="512.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="512.0" y1="126.0" x2="512.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="512.0" y1="225.0" x2="530.0" y2="225.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="620.0" y1="225.0" x2="620.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="620.0" y1="264.0" x2="498.0" y2="264.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="498.0" y1="264.0" x2="498.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="498.0" y1="165.0" x2="530.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="600.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Q=1 тримає Q̄=0, а Q̄=0 тримає Q=1 — узгоджено</text>
<text x="600.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(і дзеркальний стан так само стійкий)</text>
<text x="600.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">стабільно: тримає 1 біт</text>
</svg>