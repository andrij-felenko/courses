<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резистор світлодіода за кольором: R = (V_ніжки − V_LED) / I</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">однаковий струм 10 мА на 3.3 В — та різний V_LED дає різний запас</text>
<rect x="70.0" y="62.0" width="730.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="150.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">колір</text>
<text x="360.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">V_LED (Vf)</text>
<text x="580.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">R для 10 мА на 3.3 В</text>
<text x="770.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">запас</text>
<rect x="70.0" y="99.0" width="730.0" height="30.0" rx="4" fill="#f7f9fc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="150.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">червоний</text>
<text x="360.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2.0 В</text>
<text x="580.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">130 Ом</text>
<text x="770.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">добрий</text>
<text x="150.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">зелений / жовтий</text>
<text x="360.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2.1 В</text>
<text x="580.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">120 Ом</text>
<text x="770.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">добрий</text>
<rect x="70.0" y="167.0" width="730.0" height="30.0" rx="4" fill="#f7f9fc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="150.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">синій / білий</text>
<text x="360.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3.0 В</text>
<text x="580.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">30 Ом</text>
<text x="770.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">МАЛИЙ</text>
<rect x="110.0" y="226.0" width="640.0" height="84.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Синій / білий мають V_LED близьке до 3.3 В — на резистор лишається крихта.</tspan><tspan x="430.0" dy="14.3">Тоді струм дуже чутливий до розкиду Vf: трохи більший Vf — LED ледь жевріє,</tspan><tspan x="430.0" dy="14.3">трохи менший — перевантаження. На 3.3 В сині/білі капризні, комфортніше від 5 В.</tspan></text>
</svg>