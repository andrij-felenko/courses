<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два бюджети струму: окрема ніжка й увесь чип</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">як розетка й головний автомат — тримати треба обидві межі заразом</text>
<rect x="30.0" y="74.0" width="400.0" height="210.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="230.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">бюджет ніжки («розетка»)</text>
<text x="54.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ніжка 0</text>
<rect x="180.0" y="117.0" width="190.0" height="18.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<rect x="180.0" y="117.0" width="95.0" height="18.0" rx="3" fill="#cdddff" stroke="#2457d6" stroke-width="0.0"/>
<text x="376.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">≤ ~20 мА</text>
<text x="54.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ніжка 1</text>
<rect x="180.0" y="151.0" width="190.0" height="18.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<rect x="180.0" y="151.0" width="95.0" height="18.0" rx="3" fill="#cdddff" stroke="#2457d6" stroke-width="0.0"/>
<text x="376.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">≤ ~20 мА</text>
<text x="54.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ніжка 2</text>
<rect x="180.0" y="185.0" width="190.0" height="18.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<rect x="180.0" y="185.0" width="95.0" height="18.0" rx="3" fill="#cdddff" stroke="#2457d6" stroke-width="0.0"/>
<text x="376.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">≤ ~20 мА</text>
<text x="54.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ніжка 3</text>
<rect x="180.0" y="219.0" width="190.0" height="18.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<rect x="180.0" y="219.0" width="95.0" height="18.0" rx="3" fill="#cdddff" stroke="#2457d6" stroke-width="0.0"/>
<text x="376.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">≤ ~20 мА</text>
<text x="230.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кожна окремо — не більш як ~20 мА (стеля 40)</text>
<rect x="460.0" y="74.0" width="370.0" height="210.0" rx="10" fill="#fff6e0" stroke="#b5732e" stroke-width="1.6"/>
<text x="645.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a5a1d" text-anchor="middle" font-weight="700">бюджет чипа («автомат»)</text>
<text x="645.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Σ усіх ніжок</text>
<text x="645.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5a1d" text-anchor="middle" font-weight="700">≤ межа живлення чипа</text>
<rect x="486.0" y="190.0" width="318.0" height="38.0" rx="6" fill="#ffffff" stroke="#e6d2b0" stroke-width="1.5"/><text x="645.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">8 світлодіодів × 10 мА = 80 мА</tspan><tspan x="645.0" dy="14.3">через спільні VDD / GND</tspan></text>
<text x="645.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">забагато → притишити струм або взяти драйвер</text>
<text x="430.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мало, щоб кожна ніжка була в межах — їхня СУМА теж мусить уміститися.</text>
</svg>