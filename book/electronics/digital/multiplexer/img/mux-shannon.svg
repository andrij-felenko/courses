<text x="360.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад Шеннона за x  =  один 2→1 мультиплексор</text>
