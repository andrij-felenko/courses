<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільна шина: двоє хочуть говорити водночас</text>
<line x1="60.0" y1="150.0" x2="640.0" y2="150.0" stroke="#1a1a1a" stroke-width="4.0"/>
<text x="350.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спільна шина (одна на всіх)</text>
<rect x="103.7" y="73.5" width="92.5" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Майстер A</tspan></text>
<line x1="150.0" y1="106.5" x2="150.0" y2="150.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">хочу писати!</text>
<rect x="303.7" y="73.5" width="92.5" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Майстер B</tspan></text>
<line x1="350.0" y1="106.5" x2="350.0" y2="150.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="350.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">хочу писати!</text>
<rect x="506.7" y="73.5" width="86.7" height="33.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Майстер C</tspan></text>
<line x1="550.0" y1="106.5" x2="550.0" y2="150.0" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="5,4"/>
<circle cx="350.0" cy="150.0" r="15.0" fill="#fdecea" stroke="#c0392b" stroke-width="3.0"/>
<text x="350.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
<rect x="120.0" y="210.0" width="460.0" height="62.0" rx="6" fill="#fff7ec" stroke="#b08900" stroke-width="1.5"/><text x="350.0" y="229.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">A жене «1», B жене «0» на ту саму лінію —</tspan><tspan x="350.0" dy="16.2">рівень невизначений, дані зіпсовані, виходи в конфлікті.</tspan><tspan x="350.0" dy="16.2">Треба правило: хто говорить зараз?</tspan></text>
</svg>