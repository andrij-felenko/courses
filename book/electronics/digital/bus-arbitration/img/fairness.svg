<rect x="48.0" y="218.0" width="264.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="240.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Хто зайнятий — той і тримає шину.</tspan><tspan x="180.0" dy="12.7">Молодші можуть чекати вічно = голодування.</tspan></text>
