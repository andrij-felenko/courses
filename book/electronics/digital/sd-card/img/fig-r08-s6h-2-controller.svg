<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540">
<rect width="920" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серце суперечки: ГОЛА NAND проти «NAND + контролер»</text>
<text x="460.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це не дрібниця корпусу, а РІЗНИЙ поділ праці — і саме він вирішив, хто переживе зростання флешу</text>
<rect x="50.0" y="84.0" width="400.0" height="392.0" rx="12" fill="#fdf6f6" stroke="#c0271e" stroke-width="2"/>
<text x="250.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">SmartMedia · xD — ГОЛА NAND</text>
<text x="250.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(картка = просто чип пам'яті)</text>
<rect x="150.0" y="146.0" width="200.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="250.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">NAND-флеш</text>
<text x="250.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(плавучий затвор, §3.6.8)</text>
<line x1="250.0" y1="206.0" x2="250.0" y2="244.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="366.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">уся робота — на ПРИСТРІЙ</text>
<rect x="96.0" y="250.0" width="308.0" height="150.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="250.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПРИСТРІЙ (камера) мусить сам:</text>
<text x="116.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• вести таблицю зношення (wear leveling)</text>
<text x="116.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• обходити биті комірки (bad blocks)</text>
<text x="116.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• рахувати й виправляти помилки (ECC, §3.9)</text>
<text x="116.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• знати ТОЧНУ організацію цього чипа</text>
<rect x="96.0" y="412.0" width="308.0" height="50.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="250.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Новий, більший чип NAND → камера його</text>
<text x="250.0" y="449.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вже НЕ розуміє. Стелю вперлися на 128 МБ.</text>
<rect x="470.0" y="84.0" width="400.0" height="392.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="2"/>
<text x="670.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CompactFlash · SD — NAND + КОНТРОЛЕР</text>
<text x="670.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(картка ховає всю складність у собі)</text>
<rect x="560.0" y="146.0" width="220.0" height="116.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="670.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">усередині КАРТКИ:</text>
<rect x="580.0" y="180.0" width="80.0" height="60.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="620.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">NAND</text>
<text x="620.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чип(и)</text>
<rect x="680.0" y="180.0" width="80.0" height="60.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="720.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">контро-</text>
<text x="720.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лер</text>
<line x1="660.0" y1="210.0" x2="678.0" y2="210.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<rect x="560.0" y="274.0" width="220.0" height="126.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="670.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контролер сам, ПРИХОВАНО:</text>
<text x="580.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• рознесе запис рівномірно</text>
<text x="580.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• обійде биті комірки</text>
<text x="580.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• порахує ECC і сховає помилки</text>
<text x="580.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• віддасть назовні рівні «сектори»</text>
<rect x="560.0" y="412.0" width="220.0" height="50.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="670.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Пристрій бачить ПРОСТИЙ диск.</text>
<text x="670.0" y="449.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Новий чип? Картка сама все ховає.</text>
<text x="460.0" y="500.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гола NAND дешевша СЬОГОДНІ — та прив'язує картку до конкретного чипа й валить тягар ECC на камеру.</text>
<text x="460.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Контролер у картці коштує копійки, зате робить її САМОДОСТАТНЬОЮ й сумісною наперед. Цю ставку SD виграла.</text>
</svg>
