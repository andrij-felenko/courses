<svg xmlns="http://www.w3.org/2000/svg" width="920" height="712" viewBox="0 0 920 712">
<rect width="920" height="712" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Війна карток пам'яті: десять років, шість форматів, один переможець</text>
<text x="460.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожна фірма штовхала СВІЙ формат; ринок терпів зоопарк роз'ємів — аж поки SD не зібрала найкращий компроміс</text>
<line x1="270.0" y1="100.0" x2="270.0" y2="686.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="270.0" cy="126.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="248.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1994</text>
<text x="296.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">CompactFlash (SanDisk)</text>
<text x="296.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Велика, міцна, з КОНТРОЛЕРОМ усередині. Профі люблять її й досі</text>
<text x="296.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">— але для кишені завелика</text>
<circle cx="270.0" cy="192.8" r="7.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="248.0" y="197.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1995</text>
<text x="296.0" y="189.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">SmartMedia (Toshiba)</text>
<text x="296.0" y="208.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Тонша й дешевша — бо це ГОЛА NAND без контролера. Та сама</text>
<text x="296.0" y="224.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">дешевизна її згодом і вб'є</text>
<circle cx="270.0" cy="259.5" r="7.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="248.0" y="264.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1997</text>
<text x="296.0" y="256.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">MMC (SanDisk + Siemens + Nokia)</text>
<text x="296.0" y="275.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Крихітна (32×24 мм) картка для телефонів і плеєрів — основа, на</text>
<text x="296.0" y="291.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">якій виросте SD</text>
<circle cx="270.0" cy="326.2" r="7.0" fill="#fff" stroke="#caa24a" stroke-width="2.6"/>
<text x="248.0" y="331.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1998</text>
<text x="296.0" y="323.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Memory Stick (Sony)</text>
<text x="296.0" y="342.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Sony йде СВОЇМ, закритим шляхом: «жуйка» лише для пристроїв Sony</text>
<text x="296.0" y="358.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">(відлуння Betamax)</text>
<circle cx="270.0" cy="393.0" r="11.0" fill="#fff" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="270.0" cy="393.0" r="10.0" fill="none" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="270.0" cy="393.0" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="248.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1999</text>
<text x="296.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">SD (SanDisk + Panasonic + Toshiba)</text>
<text x="296.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Беруть інтерфейс MMC, додають захист від запису, міцніший корпус</text>
<text x="296.0" y="425.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">і DRM — і ВІДКРИВАЮТЬ стандарт</text>
<circle cx="270.0" cy="459.8" r="11.0" fill="#fff" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="270.0" cy="459.8" r="10.0" fill="none" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="270.0" cy="459.8" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="248.0" y="464.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">січ. 2000</text>
<text x="296.0" y="456.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">засновано SD Association</text>
<text x="296.0" y="475.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Троє фундаторів кличуть усіх: ліцензія для будь-якого виробника.</text>
<text x="296.0" y="491.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Зоопарк починає сходитися до одного</text>
<circle cx="270.0" cy="526.5" r="7.0" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="248.0" y="531.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2002</text>
<text x="296.0" y="523.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">xD (Olympus + Fujifilm)</text>
<text x="296.0" y="542.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Остання спроба «голої NAND» — спадкоємиця SmartMedia.</text>
<text x="296.0" y="558.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Спізнилася: ринок уже обирав SD</text>
<circle cx="270.0" cy="593.2" r="11.0" fill="#fff" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="270.0" cy="593.2" r="10.0" fill="none" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="270.0" cy="593.2" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="248.0" y="598.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">листоп. 2003</text>
<text x="296.0" y="590.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">SD виходить уперед</text>
<text x="296.0" y="609.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">У США: SD ≈ 42% · CompactFlash ≈ 26% · Memory Stick ≈ 16%.</text>
<text x="296.0" y="625.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Перелом стався</text>
<circle cx="270.0" cy="660.0" r="11.0" fill="#fff" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="270.0" cy="660.0" r="10.0" fill="none" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="270.0" cy="660.0" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="248.0" y="665.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2005→</text>
<text x="296.0" y="657.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">microSD у кожному телефоні</text>
<text x="296.0" y="676.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Крихітна SD вростає у смартфони — і остаточно закриває питання.</text>
<text x="296.0" y="692.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Sony здається й бере SD (2010)</text>
</svg>
