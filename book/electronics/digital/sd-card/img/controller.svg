<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гола NAND проти «NAND + контролер»</text>
<text x="210.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">гола NAND  (SmartMedia, xD)</text>
<rect x="130.0" y="80.0" width="160.0" height="70.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.4"/>
<text x="210.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">лише чип NAND</text>
<rect x="60.0" y="200.0" width="300.0" height="180.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="210.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">пристрій робить усе сам:</text>
<text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">облік зносу</text>
<text x="210.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">обхід битих комірок</text>
<text x="210.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">корекція помилок (ECC)</text>
<text x="210.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">знати точну будову чипа</text>
<text x="210.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">новий NAND → стара камера</text>
<text x="210.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вже не розуміє</text>
<line x1="210.0" y1="154.0" x2="210.0" y2="196.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="610.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">NAND + контролер  (CF, SD)</text>
<rect x="530.0" y="80.0" width="160.0" height="60.0" rx="6" fill="#eef4ff" stroke="#c9d6f0" stroke-width="1.4"/>
<text x="610.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">чип NAND</text>
<rect x="510.0" y="162.0" width="200.0" height="60.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="610.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">контролер бере</text>
<text x="610.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">всю роботу на себе</text>
<line x1="610.0" y1="144.0" x2="610.0" y2="158.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="510.0" y="270.0" width="200.0" height="90.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="610.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">назовні: простий</text>
<text x="610.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">«диск» із секторами;</text>
<text x="610.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">новий чип картка</text>
<text x="610.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ховає сама</text>
<line x1="610.0" y1="226.0" x2="610.0" y2="266.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Контролер коштує копійки — а робить картку самодостатньою й сумісною наперед.</text>
</svg>