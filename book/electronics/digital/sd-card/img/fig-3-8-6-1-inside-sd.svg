<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<rect width="1000" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#6a3fb5"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="500.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усередині SD-картки: NAND-кристали плюс власний контролер</text>
<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Картка — це не «гола» пам'ять: контролер усередині веде ECC, ремонт дефектів і відображення адрес</text>
<rect x="120.0" y="100.0" width="540.0" height="290.0" rx="16" fill="#f7f7f7" stroke="#1b1b1b" stroke-width="2.4"/>
<polygon points="160.0,100.0 120.0,140.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.4" stroke-linejoin="round"/>
<text x="390.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SD-картка (корпус)</text>
<rect x="160.0" y="160.0" width="150.0" height="90.0" rx="8" fill="#fdeef0" stroke="#c0271e" stroke-width="2.2"/>
<text x="235.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">NAND-кристал</text>
<text x="235.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">гори комірок</text>
<rect x="160.0" y="270.0" width="150.0" height="90.0" rx="8" fill="#fdeef0" stroke="#c0271e" stroke-width="2.2"/>
<text x="235.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">NAND-кристал</text>
<text x="235.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(може бути кілька)</text>
<rect x="360.0" y="175.0" width="250.0" height="170.0" rx="12" fill="#f1ecfa" stroke="#6a3fb5" stroke-width="2.6"/>
<text x="485.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#6a3fb5" text-anchor="middle" font-weight="bold" font-style="normal">Контролер картки</text>
<text x="375.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ECC: ловить і виправляє биті біти</text>
<text x="375.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• ховає дефектні блоки, ставить запасні</text>
<text x="375.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• відображає «сектори» на реальні комірки</text>
<text x="375.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• рівномірно розкидає запис (знос)</text>
<line x1="310.0" y1="205.0" x2="360.0" y2="205.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aAmber)"/>
<line x1="310.0" y1="315.0" x2="360.0" y2="315.0" stroke="#caa24a" stroke-width="2" marker-end="url(#aAmber)"/>
<rect x="720.0" y="200.0" width="200.0" height="120.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="820.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Назовні: проста шина</text>
<text x="820.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«читай сектор N»</text>
<line x1="610.0" y1="260.0" x2="720.0" y2="260.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="665.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">проста</text>
<text x="665.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">команда</text>
<text x="500.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Для вашого МК картка виглядає як проста «блокова» пам'ять: «дай сектор», «запиши сектор». Усю каверзу NAND контролер бере на себе.</text>
<text x="500.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама ідея, що в §3.8.5 змушувала копіювати NAND у RAM, тут уже розв'язана — всередині картки.</text>
</svg>
