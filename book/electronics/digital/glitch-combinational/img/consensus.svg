<rect x="110.0" y="328.0" width="500.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Член A·B дорівнює 1 на ВСЬОМУ верхньому рядку — і поки C перемикається,</tspan><tspan x="360.0" dy="15.0">саме він утримує вихід у 1. Перемикання C більше не залишає виходу</tspan><tspan x="360.0" dy="15.0">без жодної одиничної групи: розриву нема, глітча нема.</tspan></text>
