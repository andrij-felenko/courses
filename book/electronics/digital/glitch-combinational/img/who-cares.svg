<rect x="70.0" y="320.0" width="590.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="365.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Защіпка читає вхід даних лише за фронтом такту, коли все вже усталилося — глітч до того часу зник. Але глітч на самому такті чи на дозволі — це зайвий фронт: защіпнеться випадкове значення.</tspan></text>
