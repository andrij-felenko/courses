<text x="360.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глітч на вході даних — пробачимо; глітч на такті чи дозволі — ні</text>
