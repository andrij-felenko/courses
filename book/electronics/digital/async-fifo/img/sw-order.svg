<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Публікуй рух індексу ОСТАННІМ: спершу дані, потім head</text>
<text x="40.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">ПРАВИЛЬНО — публікуй ОСТАННІМ:</text>
<rect x="60.0" y="82.0" width="150.0" height="44.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.8"/>
<text x="135.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">buf[head]=x</text>
<text x="135.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1) спершу дані</text>
<line x1="210.0" y1="104.0" x2="260.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="260.0" y="82.0" width="150.0" height="44.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.8"/>
<text x="335.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">head = next</text>
<text x="335.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2) потім опублікувати</text>
<line x1="410.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="460.0" y="82.0" width="150.0" height="44.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.8"/>
<text x="535.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">споживач бачить
повний слот</text>
<text x="535.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані вже на місці</text>
<line x1="40.0" y1="176.0" x2="720.0" y2="176.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="40.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">НЕПРАВИЛЬНО — переставив місцями:</text>
<rect x="60.0" y="222.0" width="150.0" height="44.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
<text x="135.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">head = next</text>
<text x="135.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1) посунув head</text>
<line x1="210.0" y1="244.0" x2="260.0" y2="244.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="260.0" y="222.0" width="150.0" height="44.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
<text x="335.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">(перемикання
контексту тут)</text>
<text x="335.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">споживача пустили</text>
<line x1="410.0" y1="244.0" x2="460.0" y2="244.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="460.0" y="222.0" width="150.0" height="44.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/>
<text x="535.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">читає ПОРОЖНІЙ
слот → сміття</text>
<text x="535.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані ще не лягли</text>
</svg>