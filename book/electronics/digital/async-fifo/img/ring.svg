<rect x="210.0" y="300.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/><text x="380.0" y="325.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">W наздогнав R «іззаду» на цілий круг — адреси збіглися,</tspan><tspan x="380.0" dy="11.7">та старший «оберт-біт» W уже інший. Ось як розрізнити повно й порожньо.</tspan></text>
