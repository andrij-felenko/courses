<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вказівник рахує в коді Грея — на межі домену міняється лише 1 біт</text>
<text x="40.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">той самий крок вказівника (7→8):</text>
<text x="50.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">двійковий wr_ptr</text>
<rect x="230.0" y="60.0" width="150.0" height="40.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.8"/><text x="305.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">0111 → 1000</tspan></text>
<text x="405.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">усі 4 біти разом</text>
<text x="50.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">код Грея wr_ptr</text>
<rect x="230.0" y="126.0" width="150.0" height="40.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.8"/><text x="305.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">0100 → 1100</tspan></text>
<text x="405.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">рівно 1 біт</text>
<line x1="40.0" y1="210.0" x2="720.0" y2="210.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="40.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">чому саме Грей рятує на межі:</text>
