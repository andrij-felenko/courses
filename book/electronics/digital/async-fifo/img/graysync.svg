<line x1="200.0" y1="270.0" x2="250.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="250.0" y="250.0" width="90.0" height="40.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="295.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">тр.1</tspan></text>
<line x1="340.0" y1="270.0" x2="380.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="380.0" y="250.0" width="90.0" height="40.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="425.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">тр.2</tspan></text>
<line x1="470.0" y1="270.0" x2="520.0" y2="270.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="520.0" y="250.0" width="190.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="615.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">приймач бачить</tspan><tspan x="615.0" dy="14.3">старе АБО нове</tspan></text>
