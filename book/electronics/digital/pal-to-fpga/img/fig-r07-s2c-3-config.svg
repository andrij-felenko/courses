<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="820" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aViol" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Перша конфігурація»: не код для МК, а схема, що друкується в чип</text>
<rect x="32.0" y="80.0" width="165.0" height="150.0" rx="10" fill="#ffffff" stroke="#7a3ea8" stroke-width="2.4"/>
<rect x="32.0" y="80.0" width="165.0" height="30.0" rx="10" fill="#7a3ea8" stroke="#7a3ea8" stroke-width="0"/>
<text x="114.5" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">1. Малюємо схему</text>
<text x="114.5" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у редакторі (GUI)</text>
<text x="114.5" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тягнемо дроти між</text>
<text x="114.5" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">блоками — без HDL</text>
<rect x="62.0" y="188.0" width="30.0" height="22.0" rx="3" fill="#fff" stroke="#7a3ea8" stroke-width="1.6"/>
<rect x="137.0" y="188.0" width="30.0" height="22.0" rx="3" fill="#fff" stroke="#7a3ea8" stroke-width="1.6"/>
<line x1="92.0" y1="199.0" x2="137.0" y2="199.0" stroke="#7a3ea8" stroke-width="1.8" stroke-linecap="round"/>
<rect x="229.0" y="80.0" width="165.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="2.4"/>
<rect x="229.0" y="80.0" width="165.0" height="30.0" rx="10" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="311.5" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">2. Записуємо в чип</text>
<text x="311.5" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">I²C-запис конфігу</text>
<text x="311.5" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">в NVM (програматор</text>
<text x="311.5" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">або просто МК)</text>
<text x="311.5" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SDA · SCL →</text>
<rect x="426.0" y="80.0" width="165.0" height="150.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="2.4"/>
<rect x="426.0" y="80.0" width="165.0" height="30.0" rx="10" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="508.5" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">3. Знеструмлюємо</text>
<text x="508.5" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">конфіг лишається</text>
<text x="508.5" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">в NVM — не зника</text>
<text x="508.5" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">після вимкнення</text>
<text x="508.5" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">⏻  →  NVM тримає</text>
<rect x="623.0" y="80.0" width="165.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="2.4"/>
<rect x="623.0" y="80.0" width="165.0" height="30.0" rx="10" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="705.5" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">4. Чип сам працює</text>
<text x="705.5" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вмикається вже</text>
<text x="705.5" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">налаштованим, МК</text>
<text x="705.5" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">більше не потрібен</text>
<text x="705.5" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ працює само</text>
<line x1="201.0" y1="155.0" x2="225.0" y2="155.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<line x1="398.0" y1="155.0" x2="422.0" y2="155.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<line x1="595.0" y1="155.0" x2="619.0" y2="155.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<line x1="60.0" y1="270.0" x2="760.0" y2="270.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="410.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чим це відрізняється від звички програмувати МК</text>
<rect x="70.0" y="308.0" width="330.0" height="70.0" rx="8" fill="#f4f7ff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="235.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">МК: щоразу при старті</text>
<text x="235.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ВИКОНУЄ програму інструкція за</text>
<text x="235.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">інструкцією — потрібні такт і живлення.</text>
<rect x="420.0" y="308.0" width="330.0" height="70.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="585.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">CMIC: схема просто Є в залізі</text>
<text x="585.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">одразу після подачі живлення —</text>
<text x="585.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ніякої програми не «біжить» (§3.7.5).</text>
<text x="410.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Тому «перший байт» тут — це «перша конфігурація»: один раз залив схему — і забув.</text>
</svg>
