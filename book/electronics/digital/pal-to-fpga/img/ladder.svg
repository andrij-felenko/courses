<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="120.0" y="340.0" width="330.0" height="50.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="134.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="700">PROM/PAL</text>
<text x="134.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="700">1978</text>
<text x="230.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">одна матриця AND-OR; десятки вентилів; пропалюється раз</text>
<line x1="140.0" y1="340.0" x2="140.0" y2="326.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="280.0" width="290.0" height="50.0" rx="6" fill="#fafafa" stroke="#b8860b" stroke-width="1.8"/>
<text x="134.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="start" font-weight="700">GAL</text>
<text x="134.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="700">1983</text>
<text x="230.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">те саме, але СТИРНИЙ (EEPROM) — можна переписати</text>
<line x1="140.0" y1="280.0" x2="140.0" y2="266.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="220.0" width="250.0" height="50.0" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.8"/>
<text x="134.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">CPLD</text>
<text x="134.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="700">кін. 1980-х</text>
<text x="230.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">багато PAL-блоків + матриця; нелеткий</text>
<line x1="140.0" y1="220.0" x2="140.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="160.0" width="200.0" height="50.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.8"/>
<text x="134.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">FPGA</text>
<text x="134.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="700">1985 →</text>
<text x="230.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">сітка LUT-клітинок + RAM/DSP; до мільйонів LUT</text>
<line x1="140.0" y1="160.0" x2="140.0" y2="146.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="100.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">більше ємності й гнучкості ↑</text>
