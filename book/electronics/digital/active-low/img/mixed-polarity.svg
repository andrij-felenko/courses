<circle cx="300.0" cy="150.0" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="300.0" y1="150.0" x2="300.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0"/>
