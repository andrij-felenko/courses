<text x="480.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">EN̅ (active-low)</text>
<text x="480.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1 → ВИМКНЕНО</text>
<rect x="40.0" y="300.0" width="640.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="324.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Один дріт — дві полярності: подаєш 1, і A увімкнено, а B вимкнено; подаєш 0 — навпаки. Разом вони не працюють ніколи. Полярність кожної ніжки погоджують свідомо: інвертором або чіткою обробкою в коді.</tspan></text>
