<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Setup і hold — дві заборони навколо фронту</text>
<line x1="180.0" y1="90.0" x2="180.0" y2="280.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="180.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">фронт N</text>
<line x1="540.0" y1="90.0" x2="540.0" y2="280.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="540.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">фронт N+1</text>
<line x1="70.0" y1="250.0" x2="660.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час →</text>
<rect x="180.0" y="190.0" width="70.0" height="60.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="215.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">hold</text>
<text x="215.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">заборона</text>
<rect x="450.0" y="190.0" width="90.0" height="60.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="495.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">setup</text>
<text x="495.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">заборона</text>
<rect x="250.0" y="204.0" width="200.0" height="46.0" rx="3" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="350.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">тут вхід приймача</text>
<text x="350.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">має право мінятися</text>
<text x="215.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="215.0" dy="0.0">прибіжиш зарано —</tspan><tspan x="215.0" dy="14.3">затреш старе, що ще</tspan><tspan x="215.0" dy="14.3">замикається</tspan><tspan x="215.0" dy="14.3">(ламають ШВИДКІ шляхи)</tspan></text>
<text x="495.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="495.0" dy="0.0">прибіжиш запізно —</tspan><tspan x="495.0" dy="14.3">не встигне застигнути</tspan><tspan x="495.0" dy="14.3">до фронту</tspan><tspan x="495.0" dy="14.3">(ламають ПОВІЛЬНІ шляхи)</tspan></text>
</svg>