<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резистивний дільник: опускає 5 В → 3.3 В (лише в один бік)</text>
<text x="150.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вхід 5 В (драйвер)</text>
<line x1="150.0" y1="70.0" x2="150.0" y2="100.0" stroke="#333333" stroke-width="2.0"/>
<rect x="134.0" y="100.0" width="32.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="194.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">R1 = 1.7 кОм</text>
<line x1="150.0" y1="160.0" x2="150.0" y2="190.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="150.0" cy="190.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="150.0" y1="190.0" x2="300.0" y2="190.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="328.9" y="167.3" width="122.3" height="45.3" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">вихід ≈ 3.3 В</tspan><tspan x="390.0" dy="14.3">→ на 3.3-В вхід</tspan></text>
<rect x="134.0" y="200.0" width="32.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="194.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">R2 = 3.3 кОм</text>
<line x1="150.0" y1="260.0" x2="150.0" y2="300.0" stroke="#333333" stroke-width="2.0"/>
<line x1="132.0" y1="300.0" x2="168.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="138.0" y1="306.0" x2="162.0" y2="306.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="144.0" y1="312.0" x2="156.0" y2="312.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="150.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>
<rect x="427.3" y="96.6" width="205.4" height="66.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Vвих = Vвх · R2/(R1+R2)</tspan><tspan x="530.0" dy="16.9">= 5 · 3.3/(1.7+3.3)</tspan><tspan x="530.0" dy="16.9">= 5 · 0.66 = 3.3 В</tspan></text>
<rect x="441.3" y="219.3" width="177.3" height="61.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="239.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Тільки ВНИЗ: 3.3 В назад</tspan><tspan x="530.0" dy="15.0">не підняти. І дільник</tspan><tspan x="530.0" dy="15.0">гальмує фронт (RC).</tspan></text>
</svg>