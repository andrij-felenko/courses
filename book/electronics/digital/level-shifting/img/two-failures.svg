<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи, якими пряме з'єднання різних рівнів ламається</text>
<rect x="30.0" y="56.0" width="320.0" height="270.0" rx="10" fill="#fbfdfb" stroke="#27ae60" stroke-width="1.6"/>
<text x="190.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сліпий вхід: 1 не дотягує</text>
<rect x="69.8" y="100.2" width="76.4" height="59.6" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="108.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="108.0" dy="0.0">драйвер</tspan><tspan x="108.0" dy="14.3">3.3 В</tspan><tspan x="108.0" dy="14.3">VOH=3.2 В</tspan></text>
<line x1="160.0" y1="130.0" x2="240.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="247.8" y="100.2" width="76.4" height="59.6" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="286.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="286.0" dy="0.0">вхід</tspan><tspan x="286.0" dy="14.3">5 В</tspan><tspan x="286.0" dy="14.3">VIH=3.5 В</tspan></text>
<text x="190.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3.2 В &lt; 3.5 В</text>
<rect x="54.6" y="203.3" width="270.8" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">вхід читає «1» як «0» (або як завгодно):</tspan><tspan x="190.0" dy="14.3">зв'язок мовчки не працює</tspan></text>
<text x="190.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ніщо не гріється — просто не передається</text>
<rect x="370.0" y="56.0" width="320.0" height="270.0" rx="10" fill="#fffaf9" stroke="#c0392b" stroke-width="1.6"/>
<text x="530.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спалений вхід: перенапруга</text>
<rect x="409.8" y="100.2" width="76.4" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="448.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="448.0" dy="0.0">драйвер</tspan><tspan x="448.0" dy="14.3">5 В</tspan><tspan x="448.0" dy="14.3">VOH=4.4 В</tspan></text>
<line x1="500.0" y1="130.0" x2="580.0" y2="130.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="584.6" y="107.3" width="82.7" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="626.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">вхід 3.3 В</tspan><tspan x="626.0" dy="14.3">VDD=3.3 В</tspan></text>
<text x="530.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">4.4 В  ≫  3.3 В + 0.5 В</text>
<rect x="394.3" y="203.9" width="271.4" height="44.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="222.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">захисний діод входу відмикається,</tspan><tspan x="530.0" dy="13.7">крізь нього тече струм → деградація/смерть</tspan></text>
<text x="530.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">може згоріти одразу або «жити» й тихо вмирати</text>
</svg>