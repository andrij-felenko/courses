<text x="860.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">повільно, точно</text>
<rect x="120.0" y="240.0" width="720.0" height="130.0" rx="12" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="480.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хитрість: «формування шуму» виштовхує похибку квантування у ВИСОКІ частоти,</text>
<text x="480.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">а фільтр їх зрізає — лишаючи дуже чистий низькочастотний сигнал.</text>
<text x="480.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">+ Передискретизація сама собою захищає від аліасингу.</text>
<text x="480.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">− Повільний: задешево високу роздільність дають лише для неквапних сигналів</text>
<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(аудіо, ваги, термопари). Це і є той «зовнішній точний АЦП».</text>
