  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SAR: зважування половинками Vref (двійковий пошук)</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама ідея «гир-часток Vref»: більша гиря — лишити чи зняти, далі менша</text>
<rect x="110.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="185.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">½ Vref</text>
<text x="185.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лишити ✓</text>
<line x1="260.0" y1="165.0" x2="305.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="305.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="380.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">¼ Vref</text>
<text x="380.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">зняти ✗</text>
<line x1="455.0" y1="165.0" x2="500.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="500.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="575.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">⅛ Vref</text>
<text x="575.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лишити ✓</text>
<line x1="650.0" y1="165.0" x2="695.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="695.0" y="130.0" width="150.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="770.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1/16 Vref</text>
<text x="770.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лишити ✓</text>
<line x1="845.0" y1="165.0" x2="890.0" y2="165.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="470.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">питання за питанням «Vin більше за пробу?» — по одному біту за крок</text>
<rect x="150.0" y="280.0" width="640.0" height="90.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="470.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">N біт — рівно N кроків порівняння. Усередині — ЦАП (дає пробну напругу)</text>
<text x="470.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">і компаратор (порівнює з Vin). Це «терези» з гирями-частками Vref.</text>
<text x="470.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Швидко, дешево, по одному виміру — тому SAR і стоїть у мікроконтролерах.</text>
</svg>
