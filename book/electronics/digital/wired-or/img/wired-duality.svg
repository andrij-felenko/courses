<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий дріт — і АБО, і І (залежно від назви активного рівня)</text>
<rect x="290.0" y="70.0" width="140.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="360.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">один фізичний дріт</text>
<text x="360.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">правило: нуль перемагає</text>
<rect x="45.0" y="165.0" width="220.0" height="120.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="155.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">дивимось як «активний 0»</text>
<text x="155.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0 = «так, я прошу»</text>
<text x="155.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">лінія активна, якщо</text>
<text x="155.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ХОЧ ОДИН просить</text>
<text x="155.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">це монтажне АБО</text>
<rect x="455.0" y="165.0" width="220.0" height="120.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="565.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">дивимось як «активна 1»</text>
<text x="565.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1 = «усе гаразд»</text>
<text x="565.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">лінія висока, лише якщо</text>
<text x="565.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ВСІ відпустили</text>
<text x="565.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">це монтажне І</text>
<line x1="300.0" y1="114.0" x2="195.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="420.0" y1="114.0" x2="525.0" y2="165.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Логіка не в залізі, а в тім, який рівень ти назвав «активним».</text>
</svg>