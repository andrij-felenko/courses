<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди ставити clean і invalidate на осі часу</text>
<line x1="50.0" y1="150.0" x2="770.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="760.0" y1="150.0" x2="775.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="770.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<line x1="150.0" y1="144.0" x2="150.0" y2="156.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="106.1" y="77.9" width="87.8" height="40.1" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">CPU наповнив</tspan><tspan x="150.0" dy="13.7">буфер (TX)</tspan></text>
<line x1="150.0" y1="118.1" x2="150.0" y2="144.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="150.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дані сидять у кеші</text>
<line x1="330.0" y1="144.0" x2="330.0" y2="156.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="283.1" y="77.9" width="93.8" height="40.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="330.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">clean D-cache</tspan><tspan x="330.0" dy="13.7">(by addr)</tspan></text>
<line x1="330.0" y1="118.1" x2="330.0" y2="144.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="330.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">кеш → SRAM</text>
<line x1="500.0" y1="144.0" x2="500.0" y2="156.0" stroke="#b9770e" stroke-width="2.0"/>
<rect x="441.1" y="77.9" width="117.7" height="40.1" rx="6" fill="#fdf3e6" stroke="#b9770e" stroke-width="1.8"/><text x="500.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">старт DMA</tspan><tspan x="500.0" dy="13.7">(SRAM ↔ пристрій)</tspan></text>
<line x1="500.0" y1="118.1" x2="500.0" y2="144.0" stroke="#b9770e" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="500.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ядро зайняте іншим</text>
<line x1="690.0" y1="144.0" x2="690.0" y2="156.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="625.1" y="77.9" width="129.7" height="40.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="690.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">invalidate D-cache</tspan><tspan x="690.0" dy="13.7">(перед читанням RX)</tspan></text>
<line x1="690.0" y1="118.1" x2="690.0" y2="144.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="690.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">викинути стару копію</text>
<text x="410.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок непорушний: clean ПЕРЕД тим, як DMA читає; invalidate ПІСЛЯ того, як DMA записав.</text>
<text x="410.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Переплутати місцями — знову несвіжі дані або затертий чужий рядок.</text>
</svg>