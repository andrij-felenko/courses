<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Півбуфер: поки DMA пише верхню половину, ядро жує нижню</text>
<rect x="120.0" y="90.0" width="640.0" height="66.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="440.0" y1="90.0" x2="440.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="280.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">нижня половина</text>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">верхня половина</text>
<text x="110.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">0</text>
<text x="770.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">N</text>
<line x1="600.0" y1="76.0" x2="600.0" y2="90.0" stroke="#b9770e" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="558.5" y="28.3" width="83.0" height="39.3" rx="6" fill="#fdf3e6" stroke="#b9770e" stroke-width="1.5"/><text x="600.0" y="44.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">DMA ПИШЕ</tspan><tspan x="600.0" dy="14.3">(зараз тут)</tspan></text>
<line x1="280.0" y1="170.0" x2="280.0" y2="156.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="226.0" y="178.3" width="108.0" height="39.3" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">ядро ЧИТАЄ</tspan><tspan x="280.0" dy="14.3">(invalidate цю)</tspan></text>
<rect x="197.9" y="263.1" width="164.2" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Half-transfer IRQ (HT):</tspan><tspan x="280.0" dy="14.3">нижня половина готова →</tspan><tspan x="280.0" dy="14.3">invalidate ЛИШЕ нижню,</tspan><tspan x="280.0" dy="14.3">потім читай нижню</tspan></text>
<rect x="505.4" y="263.1" width="189.3" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Transfer-complete IRQ (TC):</tspan><tspan x="600.0" dy="14.3">верхня половина готова →</tspan><tspan x="600.0" dy="14.3">invalidate ЛИШЕ верхню,</tspan><tspan x="600.0" dy="14.3">потім читай верхню</tspan></text>
<text x="440.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">КОЖНА половина — сама вирівняна на 32 й кратна 32, інакше invalidate однієї зачепить рядок сусідньої, яку DMA саме пише.</text>
</svg>