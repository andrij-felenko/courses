<rect x="70.0" y="372.0" width="700.0" height="56.0" rx="6" fill="#f7fdfa" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Заряджати ємність лінії до меншої напруги дешевше КВАДРАТИЧНО: половину розмаху —</tspan><tspan x="420.0" dy="15.6">чверть енергії на кожен перемик. Тому LPDDR тисне напругу сигналу вниз аж до сотень мВ.</tspan><tspan x="420.0" dy="15.6">Розплата — менший запас над завадами, тож коротка доріжка точка-в-точку тут обов'язкова.</tspan></text>
