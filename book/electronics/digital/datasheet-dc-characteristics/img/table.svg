<rect x="40.0" y="362.0" width="400.0" height="78.0" rx="6" fill="#fff6e0" stroke="#b5732e" stroke-width="1.5"/><text x="240.0" y="391.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Два рядки VOH (і два VOL) — не помилка.</tspan><tspan x="240.0" dy="13.0">Той самий вихід дає РІЗНУ «1» залежно від струму:</tspan><tspan x="240.0" dy="13.0">майже без навантаження — 4.4 В, під 4 мА — уже 3.84 В.</tspan></text>
<rect x="460.0" y="362.0" width="400.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="391.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">II (±1 мкА) — вхід майже нічого не тягне: один вихід</tspan><tspan x="660.0" dy="13.0">живить сотні входів. ICC (20 мкА) — увесь чип у спокої</tspan><tspan x="660.0" dy="13.0">п'є мікроампери: CMOS платить струмом лише за перемикання.</tspan></text>
