<text x="142.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряме кільце</text>
<line x1="46.0" y1="104.0" x2="238.0" y2="104.0" stroke="#333333" stroke-width="1.2"/>
<text x="142.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">N станів</tspan></text>
<text x="142.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">унітарний код</tspan></text>
<text x="142.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">БЕЗ вентилів декоду</tspan></text>
<text x="142.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">гріє N тригерів</tspan><tspan x="142.0" dy="13.2">заради N станів</tspan></text>
<rect x="268.0" y="60.0" width="224.0" height="240.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="380.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Johnson</text>
<line x1="284.0" y1="104.0" x2="476.0" y2="104.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="380.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2N станів</tspan></text>
<text x="380.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">код Грея (1 біт/крок)</tspan></text>
<text x="380.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">декод: 1 вентиль ×2 входи</tspan></text>
<text x="380.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">удвічі щедріший</tspan><tspan x="380.0" dy="13.2">за те саме залізо</tspan></text>
<rect x="506.0" y="60.0" width="224.0" height="240.0" rx="6" fill="#f7f0ea" stroke="#c98a3a" stroke-width="1.8"/>
<text x="618.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійковий</text>
<line x1="522.0" y1="104.0" x2="714.0" y2="104.0" stroke="#c98a3a" stroke-width="1.2"/>
<text x="618.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="618.0" dy="0.0">2^N станів</tspan></text>
<text x="618.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="618.0" dy="0.0">щільний двійковий код</tspan></text>
<text x="618.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="618.0" dy="0.0">декод: широкі AND</tspan></text>
<text x="618.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="618.0" dy="0.0">максимум станів,</tspan><tspan x="618.0" dy="13.2">але глітчі й ширші вентилі</tspan></text>
