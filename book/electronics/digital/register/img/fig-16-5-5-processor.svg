<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
<rect width="860" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо: регістри — це «руки» процесора, де лежать числа</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">АЛП (§15.7) рахує, а регістри тримають його операнди й результат — разом це обчислювальне ядро</text>
<rect x="120.0" y="110.0" width="110.0" height="36.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="175.0" y="133.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">регістр R0</text>
<rect x="120.0" y="155.0" width="110.0" height="36.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="175.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">регістр R1</text>
<rect x="120.0" y="200.0" width="110.0" height="36.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="175.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">регістр R2</text>
<rect x="120.0" y="245.0" width="110.0" height="36.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="175.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">регістр R3</text>
<text x="175.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">регістровий файл</text>
<path d="M 380,130 L 470,150 L 470,250 L 380,270 L 380,210 L 395,200 L 380,190 Z" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2"/>
<text x="425.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">АЛП</text>
<line x1="230.0" y1="160.0" x2="380.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="230.0" y1="250.0" x2="380.0" y2="235.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="305.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">операнди</text>
<line x1="470.0" y1="200.0" x2="540.0" y2="200.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="505.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">результат</text>
<line x1="540.0" y1="200.0" x2="540.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round"/>
<line x1="540.0" y1="330.0" x2="175.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round"/>
<line x1="175.0" y1="330.0" x2="175.0" y2="304.0" stroke="#1b1b1b" stroke-width="1.5" marker-end="url(#aInk)"/>
<text x="360.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">результат вертається в регістр</text>
<rect x="600.0" y="120.0" width="230.0" height="150.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="715.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спеціальні регістри:</text>
<text x="616.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• лічильник команд (PC) — де ми</text>
<text x="616.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  в програмі (§18.2)</text>
<text x="616.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• регістр інструкції — що робимо</text>
<text x="616.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• регістр адреси/даних пам'яті</text>
<text x="616.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• прапорці (нуль, перенос…)</text>
<text x="430.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Регістр + АЛП = датапас. Додамо керування (Розділ 18) — і це вже процесор.</text>
</svg>
