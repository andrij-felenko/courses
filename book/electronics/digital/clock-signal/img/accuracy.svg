<text x="482.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">робоча конячка точного такту в МК</text>
<text x="16.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Годинниковий кварц 32768 Гц</text>
<line x1="457.9" y1="280.0" x2="506.1" y2="280.0" stroke="#27ae60" stroke-width="6.0"/>
<text x="514.1" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">±5–20 ppm</text>
<text x="457.9" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">для лічби реального часу (RTC)</text>
<text x="16.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">TCXO: кварц + термокомпенсація</text>
