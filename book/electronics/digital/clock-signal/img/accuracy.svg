<text x="705.9" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8862b" text-anchor="start" font-weight="700">±3 000–5 000 ppm</text>
<text x="680.2" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">дешевий, CL уже всередині; точність середня</text>
<text x="16.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Кварцовий резонатор</text>
