<text x="457.9" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">кремнієва балка замість кристала; міцний до ударів</text>
