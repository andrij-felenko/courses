<rect x="280.0" y="100.0" width="96.0" height="34.0" rx="5" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="328.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">тригер 1</text>
