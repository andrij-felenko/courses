<text x="328.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">тригер 3</text>
<path d="M 280,204 L 292,211 L 280,218" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
