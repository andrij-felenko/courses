<path d="M 280,254 L 292,261 L 280,268" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="328.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">усі тактовані РАЗОМ</text>
<rect x="440.0" y="100.0" width="380.0" height="184.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/>
<text x="630.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дає спільний такт:</text>
<text x="458.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• єдиний момент зміни стану — фронт такту</text>
<text x="458.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• між фронтами все «застигло», і логіка</text>
<text x="458.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   спокійно встигає порахувати наступне</text>
<text x="458.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• система передбачувана:</text>
<text x="458.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">   крок — порахувати — крок — порахувати</text>
<text x="458.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• це і є СИНХРОННИЙ дизайн</text>
</svg>