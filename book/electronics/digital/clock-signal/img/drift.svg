<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що означає ppm на практиці: відхід годинника й запас зв'язку</text>
<rect x="50.0" y="56.0" width="350.0" height="330.0" rx="8" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="225.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1) Годинник «пливе»</text>
<text x="225.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">похибка × час = накопичений відхід</text>
<text x="225.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">1 ppm ≈ 0.0864 с за добу</text>
<text x="72.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">джерело</text>
<text x="215.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ppm</text>
<text x="300.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">за добу</text>
<text x="372.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">за рік</text>
<line x1="70.0" y1="158.0" x2="388.0" y2="158.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="72.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">RC у чипі</text>
<text x="215.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">±30 000</text>
<text x="300.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">43.2 хв</text>
<text x="372.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">11.0 дн</text>
<text x="72.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кераміка</text>
<text x="215.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8862b" text-anchor="middle" font-weight="700">±4 000</text>
<text x="300.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">5.8 хв</text>
<text x="372.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8862b" text-anchor="middle" font-weight="700">1.5 дн</text>
<text x="72.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кварц МК</text>
<text x="215.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">±30</text>
<text x="300.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2.6 с</text>
<text x="372.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">16 хв</text>
<text x="72.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кварц RTC</text>
<text x="215.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">±20</text>
<text x="300.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1.7 с</text>
<text x="372.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">11 хв</text>
<text x="72.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">TCXO</text>
<text x="215.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">±1</text>
<text x="300.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0.086 с</text>
<text x="372.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">32 с</text>
<text x="225.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">RC за рік «з'їде» на тижні —</text>
<text x="225.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">тримати реальний час на ньому не можна</text>
<rect x="440.0" y="56.0" width="350.0" height="330.0" rx="8" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="615.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2) Зв'язок «розсинхрониться»</text>
<text x="615.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">два боки шини рахують біти своїми тактами</text>
<text x="615.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">сумарне розходження двох боків:</text>
<rect x="470.0" y="146.0" width="135.0" height="20.0" rx="0" fill="#e8f6ec" stroke="#27ae60" stroke-width="1.5"/>
<rect x="605.0" y="146.0" width="67.5" height="20.0" rx="0" fill="#fbf3df" stroke="#b8862b" stroke-width="1.5"/>
<rect x="672.5" y="146.0" width="67.5" height="20.0" rx="0" fill="#fae8e6" stroke="#c0392b" stroke-width="1.5"/>
<line x1="470.0" y1="166.0" x2="470.0" y2="172.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="470.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 %</text>
<line x1="537.5" y1="166.0" x2="537.5" y2="172.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="537.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 %</text>
<line x1="605.0" y1="166.0" x2="605.0" y2="172.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="605.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 %</text>
<line x1="672.5" y1="166.0" x2="672.5" y2="172.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="672.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 %</text>
<line x1="740.0" y1="166.0" x2="740.0" y2="172.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="740.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4 %</text>
<text x="537.5" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">надійно</text>
<text x="706.2" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">збій</text>
<text x="615.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пара тактів і де вона лягає:</text>
<circle cx="460.0" cy="234.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="472.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">два кварци: 0.006 % — величезний запас</text>
<circle cx="460.0" cy="258.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="472.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">кераміка + кварц: ~0.4 % — ще надійно</text>
<circle cx="460.0" cy="282.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="472.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">дві кераміки: ~0.8 % — теж проходить</text>
<circle cx="460.0" cy="306.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="472.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">RC + кварц: ~3 % — уже на межі зриву</text>
<text x="615.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ось чому UART на «голому» RC часто не злітає</text>
</svg>