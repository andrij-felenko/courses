<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр: &lt;= розділяє щаблі, = зливає їх у один</text>
<text x="400.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Конвеєр на  &lt;=  :  щаблі розділені регістрами</text>
<text x="400.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кожен щабель бере результат сусіда з МИНУЛОГО такту — три набори повзуть одночасно</text>
<rect x="84.0" y="87.0" width="132.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">щабель 1</text><text x="150.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">p ← a·k</text>
<rect x="334.0" y="87.0" width="132.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="400.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">щабель 2</text><text x="400.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">s ← p1+p2</text>
<rect x="584.0" y="87.0" width="132.0" height="62.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="650.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">щабель 3</text><text x="650.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">y ← s+p3</text>
<rect x="265.0" y="98.0" width="20.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><path d="M265.0 133.0 L272.0 129.0 L265.0 125.0 Z" fill="none" stroke="#27ae60" stroke-width="1.3"/>
<rect x="515.0" y="98.0" width="20.0" height="40.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><path d="M515.0 133.0 L522.0 129.0 L515.0 125.0 Z" fill="none" stroke="#27ae60" stroke-width="1.3"/>
<line x1="216.0" y1="118.0" x2="265.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="285.0" y1="118.0" x2="334.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="466.0" y1="118.0" x2="515.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="535.0" y1="118.0" x2="584.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="275.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">регістр</text>
<text x="525.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">регістр</text>
<text x="728.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">→ y</text>
<text x="400.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">результат y виходить щотакту — але із затримкою 3 такти (стільки щаблів)</text>
<line x1="34.0" y1="268.0" x2="766.0" y2="268.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="400.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">…з  =  замість  &lt;=  :  s = p1+p2;  y = s+p3;  усі беруть ВЖЕ нові значення</text>
<rect x="90.0" y="314.0" width="620.0" height="42.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="102.0" y="336.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" ><tspan xml:space="preserve">y = a·k1 + b·k2 + c·k3   // весь вираз за ОДИН фронт</tspan></text>
<text x="400.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">регістри-межі зникли → конвеєр колапсує в один довгий ланцюг: правильне число, але вбита частота й затримка</text>
</svg>