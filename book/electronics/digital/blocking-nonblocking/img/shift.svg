<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсувний регістр: &lt;= крокує, = колапсує</text>
<text x="390.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">always @(posedge clk) begin  a &lt;= in;  b &lt;= a;  c &lt;= b;  end</text>
