<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вирівнювання запису: PHY підганяє строб під такт на самому чіпі</text>
<rect x="87.8" y="95.7" width="124.3" height="108.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="120.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">PHY</tspan><tspan x="150.0" dy="16.9">суне затримку</tspan><tspan x="150.0" dy="16.9">строба DQS</tspan><tspan x="150.0" dy="16.9">маленькими</tspan><tspan x="150.0" dy="16.9">кроками</tspan></text>
<rect x="557.3" y="91.0" width="185.3" height="118.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">DRAM</tspan><tspan x="650.0" dy="15.6">(режим write leveling):</tspan><tspan x="650.0" dy="15.6">строб DQS клацає —</tspan><tspan x="650.0" dy="15.6">чіп ловить значення</tspan><tspan x="650.0" dy="15.6">такту CK і вертає його</tspan><tspan x="650.0" dy="15.6">на лінію DQ</tspan></text>
<line x1="212.2" y1="120.0" x2="557.3" y2="120.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="384.8" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">строб DQS →</text>
<line x1="212.2" y1="150.0" x2="557.3" y2="150.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="384.8" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">такт CK →</text>
<line x1="557.3" y1="195.0" x2="212.2" y2="195.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="384.8" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">← відповідь на DQ: 0 чи 1</text>
<rect x="30.0" y="282.0" width="760.0" height="36.0" rx="6" fill="#fffef0" stroke="#caa300" stroke-width="1.5"/><text x="410.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">0 → строб іще рано (до фронту CK): додати затримку.   1 → строб уже наздогнав фронт CK: край знайдено.</tspan></text>
</svg>