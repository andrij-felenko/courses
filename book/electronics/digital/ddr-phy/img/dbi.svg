<rect x="70.0" y="296.0" width="700.0" height="74.0" rx="6" fill="#f7fdfa" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="313.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Правило: якщо в байті понад чотири нулі, передавач інвертує ВСІ вісім ліній</tspan><tspan x="420.0" dy="15.6">і виставляє дев'ятий прапорець DBI = 0; приймач бачить прапорець і інвертує назад.</tspan><tspan x="420.0" dy="15.6">Гарантія: із дев'яти ліній (8 DQ + DBI) щонайменше п'ять завжди тримають одиницю —</tspan><tspan x="420.0" dy="15.6">а одиниця в POD струму не палить.</tspan></text>
