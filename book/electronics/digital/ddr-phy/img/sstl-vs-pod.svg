<text x="570.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">DQ</text>
<line x1="560.0" y1="299.0" x2="560.0" y2="360.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="560.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">струм лише коли DQ = 0;</text>
<text x="560.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">при DQ = 1 струм ≈ 0</text>
<rect x="70.0" y="398.0" width="720.0" height="56.0" rx="6" fill="#fffef0" stroke="#caa300" stroke-width="1.5"/><text x="430.0" y="423.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">SSTL палить струм і на 0, і на 1 — обидва плеча активні.</tspan><tspan x="430.0" dy="11.7">POD палить струм лише коли тягне 0: при 1 верх і драйвер на однаковому VDDQ, перепаду нема, струм ≈ 0. Половину рівнів отримали задарма.</tspan></text>
</svg>