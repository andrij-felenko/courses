<text x="690.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вихід</text>
<line x1="125.0" y1="216.0" x2="605.0" y2="216.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="605.0" y1="216.0" x2="125.0" y2="216.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="125.0" y1="182.0" x2="125.0" y2="216.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="605.0" y1="182.0" x2="605.0" y2="216.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="159.0" y="233.0" width="401.9" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">повна затримка шляху = 3 + 5 + 4 + 6 = 18 нс</tspan></text>
<rect x="70.0" y="280.0" width="580.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="296.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Вихід ланцюга «застигає» лише через суму всіх затримок на шляху — це і є нижня межа для періоду такту.</tspan></text>
