<text x="125.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">tpd 3 нс</text>
<line x1="170.0" y1="148.0" x2="240.0" y2="148.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="120.0" width="90.0" height="56.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="285.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="285.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">tpd 5 нс</text>
<line x1="330.0" y1="148.0" x2="400.0" y2="148.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
