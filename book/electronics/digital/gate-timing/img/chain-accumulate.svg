<text x="605.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">tpd 6 нс</text>
<line x1="42.0" y1="148.0" x2="80.0" y2="148.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
