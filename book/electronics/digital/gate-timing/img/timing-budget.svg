<rect x="600.0" y="150.0" width="70.0" height="46.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="635.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">запас</text>
<rect x="196.6" y="230.5" width="326.9" height="35.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">T ≥ tcq + затримка_логіки + setup</tspan></text>
<rect x="70.0" y="274.0" width="600.0" height="24.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="370.0" y="289.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Якщо логіка довша — період мусить рости (такт повільнішає). «Запас» (slack) — те, що лишилося.</tspan></text>
