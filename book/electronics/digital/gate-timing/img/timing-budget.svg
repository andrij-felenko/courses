<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один період такту мусить умістити весь шлях</text>
<line x1="70.0" y1="116.0" x2="70.0" y2="226.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="670.0" y1="116.0" x2="670.0" y2="226.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="70.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">фронт</text>
<text x="670.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">наступний фронт</text>
<line x1="70.0" y1="126.0" x2="670.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="670.0" y1="126.0" x2="70.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="370.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">період такту T</text>
<rect x="70.0" y="150.0" width="60.0" height="46.0" rx="4" fill="#eef2ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="100.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">tcq</text>
<rect x="130.0" y="150.0" width="360.0" height="46.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="310.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">логіка (шлях)</text>
<rect x="490.0" y="150.0" width="110.0" height="46.0" rx="4" fill="#fff3cd" stroke="#d39e00" stroke-width="2.0"/>
