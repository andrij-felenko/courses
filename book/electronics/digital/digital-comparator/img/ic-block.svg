<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітудний компаратор-мікросхема: що заходить і що виходить</text>
<rect x="300.0" y="70.0" width="220.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="410.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">4-бітовий</text>
<text x="410.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">магнітудний</text>
<text x="410.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">компаратор</text>
<rect x="70.0" y="100.0" width="150.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="125.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">A  (a₃a₂a₁a₀)</tspan></text>
<rect x="70.0" y="158.0" width="150.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="183.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">B  (b₃b₂b₁b₀)</tspan></text>
<line x1="220.0" y1="121.0" x2="300.0" y2="121.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="179.0" x2="300.0" y2="179.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="250.0" width="176.0" height="60.0" rx="6" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/><text x="148.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d00" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">каскадні входи</tspan><tspan x="148.0" dy="14.3">Iₐ﹥ᵦ  Iₐ₌ᵦ  Iₐ﹤ᵦ</tspan><tspan x="148.0" dy="14.3">(від молодшого чипа)</tspan></text>
<line x1="230.0" y1="280.0" x2="300.0" y2="255.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="120.0" x2="580.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="100.0" width="150.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Qₐ﹥ᵦ  A &gt; B</tspan></text>
<line x1="520.0" y1="179.0" x2="580.0" y2="179.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="159.0" width="150.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="183.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Qₐ₌ᵦ  A = B</tspan></text>
<line x1="520.0" y1="238.0" x2="580.0" y2="238.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="218.0" width="150.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="242.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Qₐ﹤ᵦ  A &lt; B</tspan></text>
<text x="410.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">три виходи = і результат, і «каскадний вихід» у старший чип</text>
</svg>