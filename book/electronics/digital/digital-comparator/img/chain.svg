<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -10 864 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-24" y="-10" width="864" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два 4-бітові чипи → одне 8-бітове порівняння</text>
<rect x="90.0" y="80.0" width="210.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="195.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТАРШИЙ чип</text>
<text x="195.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">біти 7…4</text>
<text x="195.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d00" text-anchor="middle" font-weight="700">Iₐ₌ᵦ ← вихід</text>
<text x="195.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d00" text-anchor="middle">молодшого</text>
<rect x="540.0" y="80.0" width="210.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="645.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">МОЛОДШИЙ чип</text>
<text x="645.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">біти 3…0</text>
<text x="645.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Iₐ₌ᵦ = 1 (старт)</text>
<text x="645.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Iₐ﹥ᵦ = Iₐ﹤ᵦ = 0</text>
<line x1="540.0" y1="210.0" x2="300.0" y2="210.0" stroke="#b8860b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="420.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d00" text-anchor="middle" font-weight="700">3 виходи молодшого →</text>
<text x="420.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d00" text-anchor="middle">3 каскадні входи старшого</text>
<line x1="90.0" y1="155.0" x2="50.0" y2="155.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="46.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">результат</text>
<text x="46.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">усіх 8 біт</text>
<text x="420.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">старший чип має останнє слово; за рівних старших біт віддає голос ланцюга молодшого</text>
</svg>