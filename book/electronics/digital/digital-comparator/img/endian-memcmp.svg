<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">memcmp над little-endian числами: молодший байт першим</text>
<text x="310.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">байт 0 (молодший)</text>
<text x="440.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">байт 1 (старший)</text>
<text x="70.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">A</text>
<text x="160.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">= 0x0100 = 256</text>
<rect x="250.0" y="90.0" width="120.0" height="40.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="2.0"/>
<text x="310.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x00</text>
<rect x="380.0" y="90.0" width="120.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.0"/>
<text x="440.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x01</text>
<text x="70.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">B</text>
<text x="160.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">= 0x0002 = 2</text>
<rect x="250.0" y="155.0" width="120.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="310.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x02</text>
<rect x="380.0" y="155.0" width="120.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.0"/>
<text x="440.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x00</text>
<line x1="310.0" y1="200.0" x2="310.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="238.0" width="400.0" height="46.0" rx="6" fill="#fff4f4" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="265.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">memcmp: 0x00 &lt; 0x02  ⇒  «A менше»</tspan></text>
<rect x="540.0" y="238.0" width="200.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">а насправді</tspan><tspan x="640.0" dy="16.9">256 &gt; 2 !</tspan></text>
<text x="390.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">магнітудно чесний лише для big-endian (старший байт першим)</text>
</svg>