<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="aPos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="aFld" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ліки: додати затримку в шлях даних, щоб зміна вийшла з вікна</text>
<text x="70.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">було: шлях занадто швидкий</text><line x1="300.0" y1="72.0" x2="300.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="300.0" y="72.0" width="70.0" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/><line x1="90.0" y1="102.0" x2="322.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="322.0" y1="102.0" x2="322.0" y2="82.0" stroke="#c0392b" stroke-width="2.4"/><line x1="322.0" y1="82.0" x2="700.0" y2="82.0" stroke="#c0392b" stroke-width="2.4"/><circle cx="322.0" cy="92.0" r="4.5" fill="#c0392b"/><text x="330.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">✗ у вікні</text>
<text x="70.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">D(FF2)</text>
<text x="70.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">стало: у шлях даних вставили буфер-затримку</text><line x1="300.0" y1="192.0" x2="300.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="3 3"/><rect x="300.0" y="192.0" width="70.0" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/><line x1="90.0" y1="222.0" x2="400.0" y2="222.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="400.0" y1="222.0" x2="400.0" y2="202.0" stroke="#27ae60" stroke-width="2.4"/><line x1="400.0" y1="202.0" x2="700.0" y2="202.0" stroke="#27ae60" stroke-width="2.4"/><circle cx="400.0" cy="212.0" r="4.5" fill="#27ae60"/><text x="408.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">✓ поза вікном</text><line x1="324.0" y1="232.0" x2="398.0" y2="232.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#aFld)"/><text x="362.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">+ додана затримка</text>
<text x="70.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">D(FF2)</text>
<rect x="470.0" y="258.0" width="236.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="588.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Період такту у формулу hold</tspan><tspan x="588.0" dy="13.7">не входить — тому сповільнити</tspan><tspan x="588.0" dy="13.7">такт НЕ рятує; лікує лише затримка</tspan></text>
</svg>