<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Семафор: запиши 0 і прочитай назад</text>
<rect x="300.0" y="175.0" width="120.0" height="70.0" rx="6" fill="#eef3ff" stroke="#333333" stroke-width="2.0"/>
<text x="360.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один латч-семафор</text>
<text x="360.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перемагає той,</text>
<text x="360.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">хто зайшов першим</text>
<rect x="50.0" y="90.0" width="230.0" height="60.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="165.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">A: пише 0 у семафор</tspan></text>
<line x1="165.0" y1="150.0" x2="320.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="90.0" width="230.0" height="60.0" rx="6" fill="#fdeef0" stroke="#c0392b" stroke-width="2.0"/><text x="555.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">B: пише 0 у той самий семафор</tspan></text>
<line x1="555.0" y1="150.0" x2="400.0" y2="175.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="320.0" width="230.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="165.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">A читає назад: 0</tspan><tspan x="165.0" dy="15.6">→ ресурс мій</tspan></text>
<line x1="320.0" y1="245.0" x2="165.0" y2="320.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="320.0" width="230.0" height="80.0" rx="6" fill="#fdeef0" stroke="#c0392b" stroke-width="2.0"/><text x="555.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">B читає назад: 1</tspan><tspan x="555.0" dy="15.6">→ зайнято, чекай</tspan></text>
<line x1="400.0" y1="245.0" x2="555.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>