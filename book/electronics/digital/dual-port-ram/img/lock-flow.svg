<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Замок «запиши 0, прочитай назад»: спізнілий не чекає, а йде робити інше</text>
<rect x="310.0" y="96.0" width="140.0" height="66.0" rx="6" fill="#fff7e6" stroke="#333333" stroke-width="2.0"/>
<text x="380.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один латч-семафор</text>
<text x="380.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">залізо пропускає</tspan><tspan x="380.0" dy="14.3">лише одного</tspan></text>
<rect x="40.0" y="40.0" width="220.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="66.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Ядро A: пише 0</tspan></text>
<line x1="150.0" y1="84.0" x2="334.0" y2="96.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="40.0" width="220.0" height="44.0" rx="6" fill="#fdeef0" stroke="#c0392b" stroke-width="2.0"/><text x="610.0" y="65.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Ядро B: пише 0 (майже водночас)</tspan></text>
<line x1="610.0" y1="84.0" x2="426.0" y2="96.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="210.0" width="250.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="165.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">A читає назад: 0</tspan><tspan x="165.0" dy="15.6">→ замок мій, блок мій</tspan></text>
<line x1="334.0" y1="162.0" x2="165.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="250.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Працює зі скринькою</tspan><tspan x="165.0" dy="15.6">під захистом</tspan></text>
<line x1="165.0" y1="276.0" x2="165.0" y2="320.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="410.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Віддає замок: пише 1</tspan></text>
<line x1="165.0" y1="380.0" x2="165.0" y2="410.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="210.0" width="250.0" height="66.0" rx="6" fill="#fdeef0" stroke="#c0392b" stroke-width="2.0"/><text x="595.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">B читає назад: 1</tspan><tspan x="595.0" dy="15.6">→ замок у сусіда</tspan></text>
<line x1="426.0" y1="162.0" x2="595.0" y2="210.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="320.0" width="250.0" height="60.0" rx="6" fill="#fdeef0" stroke="#c0392b" stroke-width="2.0"/><text x="595.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">НЕ чекає — іде робити</tspan><tspan x="595.0" dy="15.6">своє (крутить радіо)</tspan></text>
<line x1="595.0" y1="276.0" x2="595.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="410.0" width="250.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Спробує знову за мить</tspan></text>
<line x1="595.0" y1="380.0" x2="595.0" y2="410.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>