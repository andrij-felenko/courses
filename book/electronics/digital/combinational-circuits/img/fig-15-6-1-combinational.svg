  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Комбінаційна схема: вихід залежить ЛИШЕ від входів зараз</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">немає пам'яті, немає зворотного зв'язку, немає такту — чиста функція входів (на відміну від Розділу 16)</text>
<rect x="120.0" y="110.0" width="250.0" height="150.0" rx="12" fill="#eef4ff" stroke="#1b1b1b" stroke-width="2"/>
<text x="245.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">комбінаційна</text>
<text x="245.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(вентилі без петель)</text>
<line x1="70.0" y1="140.0" x2="120.0" y2="140.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="64.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<line x1="70.0" y1="180.0" x2="120.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="64.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">B</text>
<line x1="70.0" y1="220.0" x2="120.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="64.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">C</text>
<line x1="370.0" y1="185.0" x2="420.0" y2="185.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="426.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Y = f(A,B,C)</text>
<text x="245.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ті самі входи → завжди той самий вихід</text>
<rect x="560.0" y="110.0" width="230.0" height="150.0" rx="12" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="675.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">послідовнісна</text>
<text x="675.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(з пам'яттю)</text>
<path d="M 600,235 q 75,40 150,0" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)" stroke-dasharray="5 4"/>
<text x="675.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зворотний зв'язок + такт</text>
<text x="675.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">→ Розділ 16</text>
</svg>
