<text x="530.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">пошук Ченя:</tspan><tspan x="530.0" dy="10.9">перебір αⁱ</tspan></text>
