<text x="390.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="390.0" dy="0.0">Берлекемп–</tspan><tspan x="390.0" dy="10.9">Мессі</tspan></text>
