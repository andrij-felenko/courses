<text x="670.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">y(x) = r(x)</tspan><tspan x="670.0" dy="10.9">⊕ помилки</tspan></text>
<line x1="51.0" y1="224.0" x2="729.0" y2="224.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="390.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">чому саме αʲ: помилка лишає слід тільки якщо перевіряти в коренях g(x)</text>
<text x="390.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">нуль синдромів → чисто; ненульові → σ(x) кодує, ДЕ саме сидять помилки</text>
<text x="390.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">коренів σ(x) рівно стільки, скільки помилок (доки їх ≤ t)</text>
