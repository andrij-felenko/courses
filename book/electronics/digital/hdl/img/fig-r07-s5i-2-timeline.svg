<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
<rect width="920" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві мови, один шлях: від креслення до тексту</text>
<text x="460.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сині віхи — VHDL (держава), червоні — Verilog (бізнес), зелена — спільне майбутнє</text>
<line x1="250.0" y1="92.0" x2="250.0" y2="530.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="114.0" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<circle cx="250.0" cy="114.0" r="3.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="230.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">1980</text>
<text x="272.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Програма VHSIC</text>
<text x="272.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Міноборони США починає проєкт надшвидких чипів — і впирається:</text>
<text x="272.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">кожен постачальник ОПИСУЄ свій чип по-своєму, паперу не звести</text>
<text x="272.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">докупи</text>
<circle cx="250.0" cy="163.2" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<circle cx="250.0" cy="163.2" r="3.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="230.0" y="168.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">1983</text>
<text x="272.0" y="160.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Контракт на VHDL</text>
<text x="272.0" y="177.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ВПС наймають Intermetrics, TI та IBM зробити СПІЛЬНУ мову опису;</text>
<text x="272.0" y="191.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">синтаксис наказано взяти від Ada</text>
<circle cx="250.0" cy="212.5" r="7.5" fill="#fff" stroke="#c0271e" stroke-width="2.8"/>
<circle cx="250.0" cy="212.5" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="230.0" y="217.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">1983/84</text>
<text x="272.0" y="209.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Verilog у Gateway</text>
<text x="272.0" y="226.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Незалежно й майже водночас Філ Мурбі з колегами пишуть Verilog</text>
<text x="272.0" y="240.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">та симулятор Verilog-XL — щоб ПЕРЕВІРИТИ схему до кремнію</text>
<circle cx="250.0" cy="261.8" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<circle cx="250.0" cy="261.8" r="3.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="230.0" y="266.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">1987</text>
<text x="272.0" y="258.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">VHDL → IEEE 1076</text>
<text x="272.0" y="275.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Військову мову відкривають промисловості; вона стає першим</text>
<text x="272.0" y="289.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">стандартом HDL</text>
<circle cx="250.0" cy="311.0" r="7.5" fill="#fff" stroke="#1f8a3b" stroke-width="2.8"/>
<circle cx="250.0" cy="311.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="230.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">1987</text>
<text x="272.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Перший синтез</text>
<text x="272.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">З'являються інструменти, що з ОПИСУ автоматично будують схему</text>
<text x="272.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вентилів — мова перестає лише документувати (перевірити рік)</text>
<circle cx="250.0" cy="360.2" r="7.5" fill="#fff" stroke="#c0271e" stroke-width="2.8"/>
<circle cx="250.0" cy="360.2" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="230.0" y="365.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">1989/90</text>
<text x="272.0" y="357.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Cadence купує Gateway</text>
<text x="272.0" y="374.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Verilog стає власністю великої фірми (точний рік — перевірити)</text>
<circle cx="250.0" cy="409.5" r="7.5" fill="#fff" stroke="#c0271e" stroke-width="2.8"/>
<circle cx="250.0" cy="409.5" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="230.0" y="414.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">1990/91</text>
<text x="272.0" y="406.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Verilog у відкритий світ</text>
<text x="272.0" y="423.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Під тиском ринку Cadence віддає мову спільноті Open Verilog</text>
<text x="272.0" y="437.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">International (OVI)</text>
<circle cx="250.0" cy="458.8" r="7.5" fill="#fff" stroke="#c0271e" stroke-width="2.8"/>
<circle cx="250.0" cy="458.8" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="230.0" y="463.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">1995</text>
<text x="272.0" y="455.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Verilog → IEEE 1364</text>
<text x="272.0" y="472.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Друга мова теж стає офіційним стандартом — тепер їх дві рівні</text>
<circle cx="250.0" cy="508.0" r="7.5" fill="#fff" stroke="#1f8a3b" stroke-width="2.8"/>
<circle cx="250.0" cy="508.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="230.0" y="513.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">донині</text>
<text x="272.0" y="505.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Обидві живі</text>
<text x="272.0" y="522.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">VHDL і Verilog ділять світ; з Verilog виросла SystemVerilog. У</text>
<text x="272.0" y="536.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">навчанні й хобі (як iCE40-плати) частіше беруть Verilog</text>
</svg>
