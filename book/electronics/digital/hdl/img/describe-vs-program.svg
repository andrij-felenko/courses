<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однаковий рядок — протилежний сенс: наказ у часі чи постійне залізо</text>
<text x="200.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">C на мікроконтролері</text>
<text x="200.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">рядки виконуються по черзі</text>
<rect x="40.0" y="88.0" width="320.0" height="80.5" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="52.0" y="111.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">x = read(A);</text><text x="52.0" y="129.8" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">y = read(B);</text><text x="52.0" y="148.7" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">c = x + y;</text>
<line x1="26.0" y1="100.0" x2="26.0" y2="156.6" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="18.0" y="128.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-style="italic">час</text>
<text x="200.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">крок за кроком: спершу одне</text>
<text x="200.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">читання, тоді друге, тоді сума</text>
<text x="560.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Verilog (опис заліза)</text>
<text x="560.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">усе існує водночас</text>
<rect x="400.0" y="88.0" width="320.0" height="42.8" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="412.0" y="111.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">assign c = a + b;</text>
<line x1="420.0" y1="186.8" x2="528.0" y2="186.8" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="420.0" y1="214.8" x2="528.0" y2="214.8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="414.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-style="italic">a</text>
<text x="414.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-style="italic">b</text>
<line x1="592.0" y1="200.8" x2="704.0" y2="200.8" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="710.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">c</text>
<rect x="528.0" y="179.8" width="64.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="560.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">+</tspan></text>
<text x="560.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">суматор завжди тримає на виході суму</text>
</svg>