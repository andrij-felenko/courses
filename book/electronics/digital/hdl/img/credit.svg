<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точна атрибуція: дві команди, жодного одинокого генія</text>
<rect x="95.9" y="84.2" width="128.2" height="51.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="160.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Програма VHSIC</tspan><tspan x="160.0" dy="15.6">і ВПС США</tspan></text>
<text x="160.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">ЗАМОВНИК:</tspan><tspan x="160.0" dy="13.0">поставили задачу,</tspan><tspan x="160.0" dy="13.0">дали гроші</tspan></text>
<rect x="379.9" y="92.0" width="180.2" height="36.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="470.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Intermetrics, TI, IBM</tspan></text>
<text x="470.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">ВИКОНАВЦІ контракту</tspan><tspan x="470.0" dy="13.0">1983: спроєктували VHDL</tspan><tspan x="470.0" dy="13.0">(синтаксис від Ada)</tspan></text>
<rect x="107.1" y="214.2" width="105.8" height="51.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="160.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Філ Мурбі,</tspan><tspan x="160.0" dy="15.6">Ґоел, Хуанг</tspan></text>
<text x="160.0" y="281.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">СТАРТАП Gateway:</tspan><tspan x="160.0" dy="13.0">придумали Verilog</tspan><tspan x="160.0" dy="13.0">і симулятор Verilog-XL</tspan></text>
<rect x="387.3" y="214.2" width="165.4" height="51.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="470.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Спільноти й IEEE</tspan><tspan x="470.0" dy="15.6">(OVI · 1076 · 1364)</tspan></text>
<text x="470.0" y="281.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="470.0" dy="0.0">ВІДКРИЛИ обидві мови,</tspan><tspan x="470.0" dy="13.0">зробили надбанням усіх</tspan></text>
<text x="700.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Двох одиноких</tspan><tspan x="700.0" dy="15.4">геніїв тут</tspan><tspan x="700.0" dy="15.4">немає —</tspan><tspan x="700.0" dy="15.4">дві колективні</tspan><tspan x="700.0" dy="15.4">історії, що</tspan><tspan x="700.0" dy="15.4">зрослися в</tspan><tspan x="700.0" dy="15.4">один інструмент</tspan></text>
</svg>