<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мигалка: той самий опис — і текст для людини, і схема для кремнію</text>
<rect x="40.0" y="64.0" width="300.0" height="183.2" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="52.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="700">blink.v — читає людина</text><text x="52.0" y="106.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">module blink(</text><text x="52.0" y="123.4" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">  input  clk,</text><text x="52.0" y="140.8" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">  output led);</text><text x="52.0" y="158.2" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">  reg [23:0] cnt = 0;</text><text x="52.0" y="175.6" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">  always @(posedge clk)</text><text x="52.0" y="193.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">    cnt &lt;= cnt + 1;</text><text x="52.0" y="210.4" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">  assign led = cnt[23];</text><text x="52.0" y="227.8" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" xml:space="preserve">endmodule</text>
<text x="570.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">у що це перекладе синтез</text>
<rect x="428.9" y="100.2" width="122.3" height="59.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="490.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">лічильник cnt</tspan><tspan x="490.0" dy="14.3">[23:0]</tspan><tspan x="490.0" dy="14.3">(банк тригерів)</tspan></text>
