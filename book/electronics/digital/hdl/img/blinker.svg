<text x="390.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">старший біт перемикається у 2²⁴ разів повільніше за такт — око бачить блимання</text>
