<text x="39.0" y="102.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">module blink(</text>
<text x="39.0" y="124.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    input  clk,</text>
<text x="39.0" y="146.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    output reg led);</text>
<text x="39.0" y="168.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">  reg [23:0] cnt = 0;</text>
<text x="39.0" y="190.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="39.0" y="212.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">  always @(posedge clk)</text>
<text x="39.0" y="234.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  begin</text>
<text x="39.0" y="256.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    cnt &lt;= cnt + 1;</text>
<text x="39.0" y="278.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    led &lt;= cnt[23];</text>
<text x="39.0" y="300.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  end</text>
<text x="39.0" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">endmodule</text>
