<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Мигалка на Verilog: той самий опис — це ТЕКСТ і це СХЕМА</text>
