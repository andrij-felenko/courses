<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві колиски HDL: замовлення держави й чип стартапу</text>
<rect x="40.0" y="60.0" width="330.0" height="200.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="205.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">VHDL</text>
<text x="205.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">замовлення Пентагону</text>
<text x="205.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">міністерство оборони США</tspan><tspan x="205.0" dy="15.9">велика програма, консорціум</tspan><tspan x="205.0" dy="15.9">мета — ДОКУМЕНТУВАТИ</tspan><tspan x="205.0" dy="15.9">поведінку чужих чипів</tspan></text>
<text x="205.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">строга мова-документ</text>
<rect x="410.0" y="60.0" width="330.0" height="200.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="575.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">Verilog</text>
<text x="575.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мова стартапу</text>
<text x="575.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">маленька фірма, жменька людей</tspan><tspan x="575.0" dy="15.9">написана за одну зиму</tspan><tspan x="575.0" dy="15.9">мета — ПРОСИМУЛЮВАТИ</tspan><tspan x="575.0" dy="15.9">власну схему до кремнію</tspan></text>
<text x="575.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">гнучкий інструмент перевірки</text>
<text x="390.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">різні світи — одна думка: описати залізо текстом, а решту хай зробить машина</text>
</svg>