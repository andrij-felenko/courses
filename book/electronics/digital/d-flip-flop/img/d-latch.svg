<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">D-латч: один вхід даних D — і заборонений стан зникає</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">беремо S=D, R=D̄ (через інвертор): S і R завжди протилежні, тож S=R=1 неможливе</text>
<text x="104.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">D</text>
<circle cx="140.0" cy="160.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a"/>
<line x1="116.0" y1="160.0" x2="230.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="180.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">S = D</text>
<line x1="140.0" y1="160.0" x2="140.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 140.0,217.0 L 140.0,243.0 L 166.0,230.0 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/><circle cx="172.0" cy="230.0" r="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="178.0" y1="230.0" x2="230.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="205.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">R = D̄</text>
<text x="104.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">такт</text>
<line x1="116.0" y1="280.0" x2="230.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<rect x="230.0" y="150.0" width="130.0" height="150.0" rx="8" fill="#eef7ee" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="295.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">тактований</text>
<text x="295.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">латч</text>
<line x1="360.0" y1="200.0" x2="430.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="436.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Q</text>
<rect x="540.0" y="120.0" width="290.0" height="168.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/><text x="685.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">такт=1 → Q стежить за D (Q=D)</tspan><tspan x="685.0" dy="15.0">такт=0 → Q тримає (пам'ять)</tspan><tspan x="685.0" dy="15.0">заборонений стан неможливий</tspan><tspan x="685.0" dy="15.0">та поки такт=1 латч прозорий:</tspan><tspan x="685.0" dy="15.0">зміна D одразу йде на Q</tspan></text>
</svg>