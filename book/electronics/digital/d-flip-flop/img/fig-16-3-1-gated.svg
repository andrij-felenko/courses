<text x="200.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R·такт</text>
<line x1="226.0" y1="158.0" x2="300.0" y2="158.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
