<line x1="150.0" y1="200.0" x2="150.0" y2="235.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="150.0" y1="235.0" x2="180.0" y2="235.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
