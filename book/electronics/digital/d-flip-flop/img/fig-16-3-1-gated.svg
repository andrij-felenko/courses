<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перший крок: дозволити запис лише за сигналом такту</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">два AND «пропускають» S і R, лише коли такт=1; такт=0 → на засувку йдуть нулі → вона тримає</text>
<text x="110.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">S</text>
<line x1="116.0" y1="150.0" x2="180.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="110.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">R</text>
<line x1="116.0" y1="250.0" x2="180.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="110.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">такт</text>
