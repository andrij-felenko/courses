<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">D-латч: один вхід даних D — і заборонений стан зникає</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">беремо S=D, R=D̄ (через інвертор): S і R завжди протилежні, тож S=R=1 неможливе</text>
<text x="110.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">D</text>
<circle cx="140.0" cy="160.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<line x1="116.0" y1="160.0" x2="230.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="180.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">S = D</text>
<line x1="140.0" y1="160.0" x2="140.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 150,217.0 L 150,243.0 L 180,230 Z" fill="#fafafa" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="186.0" cy="230.0" r="6.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="192.0" y1="230.0" x2="230.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="205.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">R = D̄</text>
<text x="110.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">такт</text>
<line x1="116.0" y1="280.0" x2="230.0" y2="280.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<rect x="230.0" y="150.0" width="130.0" height="150.0" rx="8" fill="#eef7ee" stroke="#1b1b1b" stroke-width="2"/>
<text x="295.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тактований</text>
<text x="295.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">латч (gated)</text>
<line x1="360.0" y1="200.0" x2="430.0" y2="200.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<text x="436.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Q</text>
<rect x="540.0" y="120.0" width="290.0" height="170.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="685.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тепер:</text>
<text x="560.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• такт=1 → Q стежить за D (Q=D)</text>
<text x="560.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• такт=0 → Q тримає (пам'ять)</text>
<text x="560.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">• заборонений стан НЕМОЖЛИВИЙ</text>
<text x="560.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">Та поки такт=1, латч «прозорий»:</text>
<text x="560.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="start" font-weight="normal" font-style="normal">будь-яка зміна D одразу йде на Q.</text>
</svg>
