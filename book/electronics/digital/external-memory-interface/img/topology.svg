<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">FMC/FSMC: місток між простою шиною ядра і ніжками зовнішньої пам'яті</text>
<rect x="70.0" y="150.0" width="150.0" height="120.0" rx="8" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="145.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро</text>
<text x="145.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Cortex-M</text>
<text x="145.0" y="238.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12" fill="#1a1a1a" text-anchor="middle">*ptr = 0x1234;</text>
<text x="145.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">просто запис за адресою</text>
<line x1="220.0" y1="210.0" x2="300.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="260.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">проста</text>
<text x="260.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">внутрішня</text>
<text x="260.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">адреса+дані</text>
<rect x="300.0" y="120.0" width="190.0" height="180.0" rx="10" fill="#f3f7f3" stroke="#27ae60" stroke-width="2.4"/>
<text x="395.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">FMC / FSMC</text>
<text x="395.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">апаратний блок у МК</text>
<text x="314.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• дешифрує адресу → NEx</text>
<text x="314.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• виставляє A, D на ніжки</text>
<text x="314.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• смикає NWE / NOE</text>
<text x="314.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• відлічує такти HCLK</text>
<line x1="490.0" y1="210.0" x2="590.0" y2="210.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="540.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ніжки МК</text>
<text x="540.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">NEx</text>
<text x="540.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">A[25:0]</text>
<text x="540.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">D[15:0]</text>
<text x="540.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">NWE·NOE·NADV</text>
<rect x="600.0" y="120.0" width="150.0" height="66.0" rx="5" fill="#23262b" stroke="#0c0e10" stroke-width="1.5"/><text x="675.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e9e9e9" text-anchor="middle" font-weight="700">SRAM / PSRAM</text><text x="675.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a9adb3" text-anchor="middle" font-style="italic">статична пам'ять</text>
<rect x="600.0" y="208.0" width="150.0" height="66.0" rx="5" fill="#23262b" stroke="#0c0e10" stroke-width="1.5"/><text x="675.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e9e9e9" text-anchor="middle" font-weight="700">NOR Flash</text><text x="675.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a9adb3" text-anchor="middle" font-style="italic">код/дані</text>
<rect x="600.0" y="296.0" width="150.0" height="66.0" rx="5" fill="#3a2a55" stroke="#000" stroke-width="1.5"/>
<text x="675.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e9e9e9" text-anchor="middle" font-weight="700">дисплей</text>
<text x="675.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c8b6e6" text-anchor="middle" font-style="italic">паралельний 8080</text>
<line x1="590.0" y1="153.0" x2="590.0" y2="329.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="590.0" y1="153.0" x2="600.0" y2="153.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="241.0" x2="600.0" y2="241.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="329.0" x2="600.0" y2="329.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро робить звичайний запис за адресою — а FMC перетворює його на смикання ніжок:</text>
<text x="500.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">піднімає потрібний NEx, кладе адресу й дані на шину, дає імпульс NWE — і зовні з'являється цикл шини пам'яті.</text>
<text x="500.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">Для програми зовнішня мікросхема — просто ще один діапазон адрес.</text>
</svg>