<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від наносекунд даташита дисплея — до тактів FMC</text>
<text x="500.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Даташит ILI9341 (режим 8080, цикл запису) — три числа в наносекундах:</text>
<rect x="150.0" y="78.0" width="200.0" height="74.0" rx="9" fill="#fbfdff" stroke="#c0392b" stroke-width="2.2"/>
<text x="250.0" y="104.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">tWRL</text>
<text x="250.0" y="127.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle">≥ 15 нс</text>
<text x="250.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">~WR низький</text>
<rect x="390.0" y="78.0" width="200.0" height="74.0" rx="9" fill="#fbfdff" stroke="#2457d6" stroke-width="2.2"/>
<text x="490.0" y="104.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">tWRH</text>
<text x="490.0" y="127.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle">≥ 15 нс</text>
<text x="490.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">~WR високий</text>
<rect x="630.0" y="78.0" width="200.0" height="74.0" rx="9" fill="#fbfdff" stroke="#27ae60" stroke-width="2.2"/>
<text x="730.0" y="104.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">tWC</text>
<text x="730.0" y="127.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle">≥ 66 нс</text>
<text x="730.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">повний цикл</text>
<line x1="500.0" y1="160.0" x2="500.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="508.0" y="184" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="700"> ÷ період HCLK (168 МГц → 5.95 нс), округлити ВГОРУ</text>
<line x1="150.0" y1="250.0" x2="150.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="192.0" y1="250.0" x2="192.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="234.0" y1="250.0" x2="234.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="276.0" y1="250.0" x2="276.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="318.0" y1="250.0" x2="318.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="360.0" y1="250.0" x2="360.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="402.0" y1="250.0" x2="402.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="444.0" y1="250.0" x2="444.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="486.0" y1="250.0" x2="486.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="528.0" y1="250.0" x2="528.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="570.0" y1="250.0" x2="570.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="612.0" y1="250.0" x2="612.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<line x1="654.0" y1="250.0" x2="654.0" y2="360.0" stroke="#e2e5ea" stroke-width="1.0"/>
<text x="171.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1</text>
<text x="213.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2</text>
<text x="255.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3</text>
<text x="297.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4</text>
<text x="339.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">5</text>
<text x="381.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">6</text>
<text x="423.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">7</text>
<text x="465.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8</text>
<text x="507.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">9</text>
<text x="549.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">10</text>
<text x="591.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">11</text>
<text x="633.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">12</text>
<text x="402.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">такти HCLK (5.95 нс кожен)</text>
<text x="136.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">~WR</text>
<polyline points="150.0,274.0 486.0,274.0 486.0,274.0 486.0,300.0 612.0,300.0 612.0,300.0 612.0,274.0 654.0,274.0" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="150.0" y1="330.0" x2="486.0" y2="330.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="150.0" y1="325.0" x2="150.0" y2="335.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="486.0" y1="325.0" x2="486.0" y2="335.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="318.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ADDSET = 8</text>
<line x1="486.0" y1="330.0" x2="612.0" y2="330.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="486.0" y1="325.0" x2="486.0" y2="335.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="612.0" y1="325.0" x2="612.0" y2="335.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="549.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">DATAST = 3</text>
<text x="549.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">DATAST покриває tWRL</text>
<line x1="150.0" y1="404.0" x2="654.0" y2="404.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="150.0" y1="399.0" x2="150.0" y2="409.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="654.0" y1="399.0" x2="654.0" y2="409.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="402.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">повний цикл ≈ (8+3+1)×5.95 ≈ 71 нс ≥ tWC = 66 нс</text>
<text x="500.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Пастка: візьмеш такти «упритул» під tWRL (DATAST=3), забувши про tWC — окремий імпульс наче правильний,</text>
<text x="500.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">а повний цикл закороткий. Команди старту пройдуть (між ними код зволікає), а швидке заливання — в артефактах.</text>
<text x="500.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">Лік: ADDSET дотягує повну тривалість до tWC. Швидше даташит не дозволяє, повільніше — лише мляво малює.</text>
</svg>