<text x="235.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">напрямок каже те, ЯКИЙ зі стробів смикнувся; читання — той самий малюнок на ~RD</text>
