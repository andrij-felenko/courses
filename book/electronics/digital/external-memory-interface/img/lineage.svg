<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві процесорні шини 1974 року дожили як два режими контролерів дисплеїв</text>
<rect x="188.0" y="29.0" width="120.7" height="53.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/><text x="248.4" y="52.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="248.4" dy="0.0">Intel 8080</tspan><tspan x="248.4" dy="16.9">квітень 1974</tspan></text>
<rect x="607.2" y="29.0" width="128.8" height="53.9" rx="6" fill="#f3f7f3" stroke="#27ae60" stroke-width="2.0"/><text x="671.6" y="52.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="671.6" dy="0.0">Motorola 6800</tspan><tspan x="671.6" dy="16.9">березень 1974</tspan></text>
<rect x="165.2" y="131.6" width="166.5" height="52.8" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="248.4" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="248.4" dy="0.0">дві лінії: ~RD і ~WR</tspan><tspan x="248.4" dy="16.2">(окремі строби)</tspan></text>
<rect x="574.1" y="131.6" width="195.0" height="52.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="671.6" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="671.6" dy="0.0">R/W (рівень) + E (строб)</tspan><tspan x="671.6" dy="16.2">одна лінія напрямку</tspan></text>
<line x1="248.4" y1="86.0" x2="248.4" y2="128.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="671.6" y1="86.0" x2="671.6" y2="128.6" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="158.9" y="235.6" width="179.0" height="52.8" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/><text x="248.4" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="248.4" dy="0.0">«8080-режим»</tspan><tspan x="248.4" dy="16.2">контролерів дисплеїв</tspan></text>
<rect x="582.1" y="235.6" width="179.0" height="52.8" rx="6" fill="#f3f7f3" stroke="#27ae60" stroke-width="2.0"/><text x="671.6" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="671.6" dy="0.0">«6800-режим»</tspan><tspan x="671.6" dy="16.2">контролерів дисплеїв</tspan></text>
<line x1="248.4" y1="187.4" x2="248.4" y2="232.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="671.6" y1="187.4" x2="671.6" y2="232.6" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="372.7" y="344.5" width="174.7" height="55.1" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="460.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">STM32 FMC / FSMC</tspan><tspan x="460.0" dy="17.6">уміє ОБИДВА режими</tspan></text>
<line x1="248.4" y1="291.4" x2="366.7" y2="366.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="671.6" y1="291.4" x2="553.3" y2="366.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
