<rect x="464.3" y="100.2" width="231.4" height="59.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="580.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">швидка робоча RAM</tspan><tspan x="580.0" dy="14.3">великий обсяг · миттєвий доступ</tspan><tspan x="580.0" dy="14.3">нелеткість НЕ потрібна</tspan></text>
<rect x="460.9" y="240.2" width="238.2" height="59.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="580.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">ємне нелетке сховище</tspan><tspan x="580.0" dy="14.3">мегабайти · мусить пережити збій</tspan><tspan x="580.0" dy="14.3">запис рідший за читання</tspan></text>
<text x="370.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одна пам'ять не буває водночас і блискавично-швидкою, і дешево-ємною, і нелеткою</text>
