<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три навантаження — дві різні пам'яті</text>
<rect x="96.1" y="67.3" width="67.7" height="45.3" rx="6" fill="#cfe0f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="130.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">кадри</tspan><tspan x="130.0" dy="14.3">дисплея</tspan></text>
<rect x="99.5" y="152.3" width="60.9" height="45.3" rx="6" fill="#dff0df" stroke="#1a1a1a" stroke-width="1.5"/><text x="130.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">буфери</tspan><tspan x="130.0" dy="14.3">аудіо</tspan></text>
<rect x="99.5" y="247.3" width="60.9" height="45.3" rx="6" fill="#f6efd6" stroke="#1a1a1a" stroke-width="1.5"/><text x="130.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">логи й</tspan><tspan x="130.0" dy="14.3">записи</tspan></text>
