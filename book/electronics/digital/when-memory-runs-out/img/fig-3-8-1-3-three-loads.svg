<text x="710.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">МУСЯТЬ пережити збій</text>
<text x="694.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">•</text>
<text x="710.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">обсяг — мегабайти</text>
<line x1="694.0" y1="300.0" x2="906.0" y2="300.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="800.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">→ потрібне нелетке сховище</text>
<text x="500.0" y="442.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Немає однієї «правильної» пам'яті: робочі дані просять швидкості, а сховище — ємності й нелеткості. Тому далі ми вивчимо обидва роди.</text>
