<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Кадри й аудіо просять ШВИДКОЇ робочої пам'яті; логи — ЄМНОГО сховища, що переживе вимкнення</text>
