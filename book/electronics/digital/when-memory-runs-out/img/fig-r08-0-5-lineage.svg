<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452">
<rect width="900" height="452" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чий це винахід: ідея, перший масовий чип і остаточний переможець — РІЗНІ внески</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«придумати найкращу комірку» ≠ «першим випустити робочу DRAM» ≠ «зробити так, щоб найкраща комірка пішла в серію»</text>
<rect x="22.0" y="82.0" width="272.0" height="268.0" rx="12" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<rect x="22.0" y="82.0" width="272.0" height="30.0" rx="12" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="158.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ІДЕЯ 1T1C</text>
<text x="158.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Роберт Деннард, IBM</text>
<text x="158.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1966 / 1968</text>
<text x="40.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Епіфанія: біт = заряд на</text>
<text x="40.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">конденсаторі, доступ — через</text>
<text x="40.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ОДИН транзистор. Патент</text>
<text x="40.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">US 3,387,286. Найдешевша</text>
<text x="40.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">можлива комірка — на папері</text>
<text x="40.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">й у патенті.</text>
<line x1="296.0" y1="216.0" x2="312.0" y2="216.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="314.0" y="82.0" width="272.0" height="268.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<rect x="314.0" y="82.0" width="272.0" height="30.0" rx="12" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="450.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРШИЙ ЧИП</text>
<text x="450.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Honeywell → Intel</text>
<text x="450.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1969 / 1970</text>
<text x="332.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Реджіц і Проебстінг (Honeywell)</text>
<text x="332.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">роблять 3-транзисторну</text>
<text x="332.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">комірку; Intel під орудою</text>
<text x="332.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Карпа випускає 1103 —</text>
<text x="332.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">першу МАСОВУ DRAM.</text>
<text x="332.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Не 1T, бо так було простіше.</text>
<line x1="588.0" y1="216.0" x2="604.0" y2="216.0" stroke="#8a8a8a" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="606.0" y="82.0" width="272.0" height="268.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<rect x="606.0" y="82.0" width="272.0" height="30.0" rx="12" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="742.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">ПЕРЕМОГА 1T</text>
<text x="742.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">галузь, середина 1970-х</text>
<text x="742.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">~1973–1976</text>
<text x="624.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Коли техпроцес дозрів,</text>
<text x="624.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">чипи на 4 Кбіт переходять</text>
<text x="624.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на комірку Деннарда —</text>
<text x="624.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вона витісняє і 3T, і осердя.</text>
<text x="624.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Відтоді 1T1C — стандарт</text>
<text x="624.0" y="273.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.2" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усієї світової ОЗП.</text>
<rect x="60.0" y="366.0" width="780.0" height="66.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підручник любить одне ім'я — «Деннард винайшов DRAM». Чесніше: він придумав найкращу КОМІРКУ, але першу масову</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">DRAM випустили інші й на іншій комірці; а перемогла ідея Деннарда лише тоді, коли її дотягнула вся галузь. Велике — гуртом.</text>
</svg>
