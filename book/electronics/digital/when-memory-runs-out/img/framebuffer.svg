<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки беруться байти кадру дисплея</text>
<rect x="159.4" y="49.0" width="401.2" height="42.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="360.0" y="74.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">обсяг кадру = (байтів/піксель) × (пікселів)</tspan></text>
<text x="170.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">RGB565: 2 Б/піксель</text>
<rect x="90.0" y="168.0" width="55.0" height="26.0" rx="0" fill="#f3dede" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="117.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">R·5</text>
<rect x="145.0" y="168.0" width="66.0" height="26.0" rx="0" fill="#dff0df" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="178.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">G·6</text>
<rect x="211.0" y="168.0" width="55.0" height="26.0" rx="0" fill="#cfe0f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="238.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">B·5</text>
<text x="170.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">5 + 6 + 5 = 16 біт = 2 Б</text>
<line x1="370.0" y1="130.0" x2="370.0" y2="300.0" stroke="#e4e8ee" stroke-width="1.2"/>
<text x="470.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">320 × 240</text>
<text x="580.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">= 76 800 пікселів</text>
<text x="470.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">× 2 Б</text>
<text x="580.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">= 153 600 Б ≈ 150 КБ</text>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">× 2 буфери</text>
<text x="580.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">= 300 КБ</text>
<text x="470.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">другий буфер — щоб око не ловило</text>
<text x="470.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">напівдомальований кадр</text>
<text x="360.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">один кадр уже 150 КБ; плавна анімація — 300 КБ, за межею SRAM</text>
</svg>