</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві ціни за дешевизну 1T-комірки (обидві Деннард розв'язав схемою)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крихітний заряд складно і прочитати, не стерши, і втримати, не поновивши — звідси два «ритуали» DRAM</text>
<rect x="60.0" y="84.0" width="360.0" height="300.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1) Читання РУЙНУЄ біт</text>
<line x1="134.0" y1="162.0" x2="146.0" y2="162.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="146.0" y1="150.0" x2="146.0" y2="174.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="154.0" y1="150.0" x2="154.0" y2="174.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
