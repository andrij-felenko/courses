<line x1="224.0" y1="328.0" x2="236.0" y2="328.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="236.0" y1="316.0" x2="236.0" y2="340.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="244.0" y1="316.0" x2="244.0" y2="340.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<line x1="244.0" y1="328.0" x2="256.0" y2="328.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="250.0" y1="336.0" x2="262.0" y2="336.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="253.0" y1="340.0" x2="259.0" y2="340.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="240.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ + +</text>
<text x="240.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">…і схема ВІДНОВЛЮЄ заряд назад</text>
<rect x="480.0" y="84.0" width="360.0" height="300.0" rx="10" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="660.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2) Заряд сам ТЕЧЕ з часом</text>
<line x1="540.0" y1="290.0" x2="790.0" y2="290.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="540.0" y1="290.0" x2="540.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="790.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">час →</text>
<text x="532.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">заряд</text>
<line x1="540.0" y1="250.0" x2="790.0" y2="250.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round"/>
<text x="792.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">поріг</text>
<polyline points="540.0,168.0 610.0,248.0 610.0,168.0 680.0,248.0 680.0,168.0 750.0,248.0 750.0,168.0" fill="none" stroke="#c0271e" stroke-width="2.6"/>
<circle cx="610.0" cy="168.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="680.0" cy="168.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="750.0" cy="168.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="660.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">зелені точки — РЕГЕНЕРАЦІЯ:</text>
<text x="660.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">контролер раз у кілька мс перечитує</text>
<text x="660.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й дозаряджає КОЖЕН рядок, щоб біт не впав за поріг</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Обидва «ритуали» — читати-відновлювати й періодично освіжати — успадковані аж від магнітних осердь (§3.6).</text>
<text x="450.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме вони — причина, чому DRAM не під'єднати до простого GPIO, а потрібен окремий контролер пам'яті (§3.8.4).</text>
</svg>
