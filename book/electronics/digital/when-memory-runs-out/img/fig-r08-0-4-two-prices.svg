<line x1="160.0" y1="170.0" x2="172.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="163.0" y1="174.0" x2="169.0" y2="174.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="150.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ + +</text>
<text x="150.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">було «1»</text>
<line x1="196.0" y1="172.0" x2="252.0" y2="172.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
