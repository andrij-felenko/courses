<line x1="284.0" y1="162.0" x2="296.0" y2="162.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="296.0" y1="150.0" x2="296.0" y2="174.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="304.0" y1="150.0" x2="304.0" y2="174.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<line x1="304.0" y1="162.0" x2="316.0" y2="162.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="310.0" y1="170.0" x2="322.0" y2="170.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="313.0" y1="174.0" x2="319.0" y2="174.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">—</text>
<text x="300.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">заряд УТІК у лінію</text>
<text x="300.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(підсилювач устиг</text>
<text x="300.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">почути: «там була 1»)</text>
<text x="240.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">комірка тепер ПОРОЖНЯ — біт стерто читанням</text>
<line x1="240.0" y1="270.0" x2="240.0" y2="302.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
