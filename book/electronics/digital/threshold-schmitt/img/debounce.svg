<text x="540.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(і логічно інвертований)</text>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Той самий прийом — для будь-якого млявого чи зашумленого джерела: давач із плавним виходом, довга лінія, оптичний переривач.</text>
