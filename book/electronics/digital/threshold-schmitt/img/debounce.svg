<text x="450.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">RC згладжує стрибки, а гістерезис інвертора відрізає рештки брязкоту — на виході один чіткий перепад</text>
<text x="140.0" y="95.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">кнопка + RC</text>
