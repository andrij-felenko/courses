<rect x="70.0" y="300.0" width="740.0" height="96.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один компаратор із гістерезисом перетворює будь-що аналогове на чисту, без-дребезгу цифру.</text>
<text x="440.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Саме так аналоговий світ Модулів 1–2 «заходить» у цифровий світ Модуля 3 — крізь поріг.</text>
<text x="440.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому на схемах входи з позначкою-петлею (Шмітт) ставлять там, де сигнал млявий: кнопки, давачі, довгі лінії.</text>
