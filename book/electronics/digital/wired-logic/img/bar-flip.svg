<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один дріт, два погляди — заперечення міняє «·» на «+»</text>
<line x1="360.0" y1="66.0" x2="360.0" y2="274.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,5"/>
<text x="190.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">активно-високо</text>
<text x="190.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">«сигнал = 1»</text>
<rect x="107.5" y="111.0" width="165.1" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="136.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">L = a · b · c</tspan></text>
<text x="190.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">лінія висока ⟺</tspan><tspan x="190.0" dy="15.0">усі входи = 1</tspan><tspan x="190.0" dy="15.0">(монтажне «І»)</tspan></text>
<text x="530.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">активно-низько</text>
<text x="530.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">«сигнал = 0», беремо L̅</text>
<rect x="425.1" y="111.0" width="209.7" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="136.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">L̅ = a̅ + b̅ + c̅</tspan></text>
<text x="530.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">активна ⟺</tspan><tspan x="530.0" dy="15.0">хоч один вхід тягне</tspan><tspan x="530.0" dy="15.0">(монтажне «АБО»)</tspan></text>
<text x="360.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">заперечи все — і «·» стає «+»:  (a·b·c)̅  =  a̅ + b̅ + c̅   (де Морган)</text>
</svg>