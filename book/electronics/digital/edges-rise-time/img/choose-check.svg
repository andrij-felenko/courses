<text x="40.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Як підібрати на практиці:</text>
<text x="48.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1.  Старт із ~33 Ω (або поряд: 22 / 27 / 33 Ω).</text>
<text x="48.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2.  Дивись фронт осцилографом біля ПРИЙМАЧА.</text>
<text x="48.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">3.  Дзвенить → бери більший R; млявий → менший.</text>
<text x="48.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4.  Бери НАЙМЕНШИЙ R, за якого дзвін уже зник.</text>
<rect x="430.0" y="234.0" width="300.0" height="132.0" rx="8" fill="#f6f9ff" stroke="#1f47b5" stroke-width="1.3"/>
<text x="580.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Орієнтир номіналу</text>
<text x="446.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Rs + Rout(драйвера)  ≈  Z доріжки</text>
<text x="446.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Z типової доріжки ≈ 40–70 Ω,</text>
<text x="446.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Rout драйвера ≈ 10–50 Ω →</text>
<text x="446.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">лишок 22–33 Ω «добиває» до Z.</text>
<text x="446.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b5742e" text-anchor="start" font-weight="italic" font-style="normal">Точне Z — це вже лінії передачі.</text>
<text x="380.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="italic" font-style="normal">Головне правило: один послідовний R на лінію, впритул до драйвера; перевіряй очима на осцилографі, а не на віру.</text>
</svg>
