<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Логічні (TTL) рівні UART: «1» = VCC, «0» = 0 В</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">так виглядає лінія прямо на ніжці мікроконтролера — спокій високий, старт тягне вниз</text>
