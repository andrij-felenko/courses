<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому десяткове залізо породило BCD</text>
<text x="360.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">гроші вимагають точної десятки → машини рахують десятково → BCD успадковує це</text>
<line x1="96.0" y1="92.0" x2="96.0" y2="424.0" stroke="#c9ccd1" stroke-width="2.0"/>
<circle cx="96.0" cy="119.7" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="80.0" y="124.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1890</text>
<text x="118.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Табулятори Голлеріта</text>
<text x="118.0" y="132.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перепис США: десяткові диски-лічильники, перфокарта</text>
<circle cx="96.0" cy="175.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="80.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1934</text>
<text x="118.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Бухгалтерські машини IBM</text>
<text x="118.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">рахунки клієнтів у десяткових цифрах, а не у двійковій</text>
<circle cx="96.0" cy="230.3" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="80.0" y="235.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1944</text>
<text x="118.0" y="224.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Гарвардський Mark I</text>
<text x="118.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">релейний обчислювач, 23-значні ДЕСЯТКОВІ лічильники</text>
<circle cx="96.0" cy="285.7" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="80.0" y="290.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">1959</text>
<text x="118.0" y="279.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">IBM 1401 — BCD</text>
<text x="118.0" y="298.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">цифра = 6 бітів (BCDIC); десяткова машина для бізнесу</text>
<circle cx="96.0" cy="341.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="80.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">1963–64</text>
<text x="118.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">EBCDIC</text>
<text x="118.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">6-бітний BCD розширено до 8 бітів заради сумісності</text>
<circle cx="96.0" cy="396.3" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<text x="80.0" y="401.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1964</text>
<text x="118.0" y="390.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">System/360</text>
<text x="118.0" y="409.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">пакований BCD убудовано в набір команд — під спадкове залізо</text>
</svg>