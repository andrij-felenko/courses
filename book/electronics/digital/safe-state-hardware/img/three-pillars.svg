<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три опори, на яких залізо тримає безпечний стан</text>
<rect x="40.0" y="55.0" width="200.0" height="46.0" rx="6" fill="#e8f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="81.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Підтяжка на вводах/виводах</tspan></text>
<rect x="40.0" y="120.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">резистор тягне лінію</tspan><tspan x="140.0" dy="15.6">у визначений рівень,</tspan><tspan x="140.0" dy="15.6">поки драйвера нема</tspan></text>
<text x="140.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">▼</text>
<text x="140.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e6b3a" text-anchor="middle"><tspan x="140.0" dy="0.0">reset/зависання → лінія не «плаває»</tspan></text>
<rect x="280.0" y="55.0" width="200.0" height="46.0" rx="6" fill="#e8f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Вимкнення драйвера (Hi-Z→стоп)</tspan></text>
<rect x="280.0" y="120.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="380.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">на скиді вивід</tspan><tspan x="380.0" dy="15.6">відпускається, а зовні</tspan><tspan x="380.0" dy="15.6">підтяжка веде у стоп</tspan></text>
<text x="380.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">▼</text>
<text x="380.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e6b3a" text-anchor="middle"><tspan x="380.0" dy="0.0">мотор/реле знеструмлюється саме</tspan></text>
<rect x="520.0" y="55.0" width="200.0" height="46.0" rx="6" fill="#e8f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Watchdog + дефолт скиду</tspan></text>
<rect x="520.0" y="120.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="620.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">зависання → скид,</tspan><tspan x="620.0" dy="15.6">після скиду виводи —</tspan><tspan x="620.0" dy="15.6">у безпечнім дефолті</tspan></text>
<text x="620.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">▼</text>
<text x="620.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e6b3a" text-anchor="middle"><tspan x="620.0" dy="0.0">оживлення завжди через безпечний старт</tspan></text>
</svg>