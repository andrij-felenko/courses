<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Старший біт A3 вмикає рівно один чип — два дешифратори дають 1 з 16</text>
<rect x="40.0" y="150.0" width="110.0" height="90.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="95.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">A0 A1 A2</text>
<text x="95.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(спільні)</text>
<rect x="260.0" y="70.0" width="150.0" height="120.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="335.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">74HC138</text>
<text x="335.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">молодша вісімка</text>
<text x="335.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">E3=1, бо A3=0 (через інвертор)</text>
<text x="335.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виходи Y0…Y7</text>
<text x="335.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">увімкнено</text>
<line x1="150.0" y1="130.0" x2="260.0" y2="130.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="260.0" y="220.0" width="150.0" height="120.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="335.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">74HC138</text>
<text x="335.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">старша вісімка</text>
<text x="335.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">E1=0, бо A3=0 → чип спить</text>
<text x="335.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">виходи Y8…Y15</text>
<text x="335.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вимкнено → усі 1</text>
<line x1="150.0" y1="280.0" x2="260.0" y2="280.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="150.0" y="320.0" width="110.0" height="50.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="205.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">A3 = 0</text>
<text x="205.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ інвертор</text>
<line x1="205.0" y1="320.0" x2="300.0" y2="195.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="205.0" y1="320.0" x2="300.0" y2="285.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="430.0" y="150.0" width="300.0" height="120.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/><text x="580.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">4-в-16: дві мікросхеми, нуль додаткових вентилів.</tspan><tspan x="580.0" dy="12.3"></tspan><tspan x="580.0" dy="12.3">5-в-32: чотири мікросхеми й один інвертор.</tspan><tspan x="580.0" dy="12.3"></tspan><tspan x="580.0" dy="12.3">Дозволи E саме для цього й зроблені різнополярними.</tspan></text>
</svg>