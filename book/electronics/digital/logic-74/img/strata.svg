<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження стандарту 74: чотири внески — і шари технологій у назві</text>
<rect x="20.0" y="58.0" width="172.5" height="92.0" rx="9" fill="#fbfbfb" stroke="#c0392b" stroke-width="2.0"/>
<text x="106.2" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ІДЕЯ / НАЗВА</text>
<text x="106.2" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Бісон, Fairchild</text>
<text x="106.2" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">бл. 9.03.1961</text>
<text x="106.2" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">назвав «TTL»</text>
<line x1="193.5" y1="104.0" x2="201.5" y2="104.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="202.5" y="58.0" width="172.5" height="92.0" rx="9" fill="#fbfbfb" stroke="#8e44ad" stroke-width="2.0"/>
<text x="288.8" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">ПАТЕНТ</text>
<text x="288.8" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Б'юї, TRW</text>
<text x="288.8" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">подав 8.09.1961</text>
<text x="288.8" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">US 3,283,170 (1966)</text>
<line x1="376.0" y1="104.0" x2="384.0" y2="104.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="385.0" y="58.0" width="172.5" height="92.0" rx="9" fill="#fbfbfb" stroke="#2457d6" stroke-width="2.0"/>
<text x="471.2" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ПЕРША РОДИНА</text>
<text x="471.2" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Лонго, Sylvania</text>
<text x="471.2" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">SUHL, 1963</text>
<text x="471.2" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">→ ракета Phoenix</text>
<line x1="558.5" y1="104.0" x2="566.5" y2="104.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="567.5" y="58.0" width="172.5" height="92.0" rx="9" fill="#fbfbfb" stroke="#27ae60" stroke-width="2.0"/>
<text x="653.8" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">МАСОВИЙ СТАНДАРТ</text>
<text x="653.8" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TI: 5400 (1964)</text>
<text x="653.8" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">7400 (1966)</text>
<text x="653.8" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">&gt;50% ринку</text>
<rect x="90.0" y="166.0" width="580.0" height="30.0" rx="6" fill="#fdf6e3" stroke="#6b7280" stroke-width="1.3"/><text x="380.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Піонер (ідея й перша родина) ≠ переможець ринку (масовий, дешевий стандарт) — це РІЗНІ внески.</tspan></text>
<text x="380.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">…а в літерах сучасного імені закам'яніли покоління технологій:</text>
<rect x="60.0" y="216.0" width="640.0" height="34.0" rx="6" fill="#fbfbfb" stroke="#a04000" stroke-width="1.6"/>
<text x="74.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a04000" text-anchor="start" font-weight="700">74  (1966)</text>
<text x="220.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">біполярний TTL — вихідний шар</text>
<rect x="60.0" y="256.0" width="640.0" height="34.0" rx="6" fill="#fbfbfb" stroke="#b9770e" stroke-width="1.6"/>
<text x="74.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">74LS (1971)</text>
<text x="220.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">TTL із діодами Шоткі — швидше, менше струму</text>
<rect x="60.0" y="296.0" width="640.0" height="34.0" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.6"/>
<text x="74.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">74HC (1980-ті)</text>
<text x="220.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">CMOS: майже нуль струму в спокої</text>
<rect x="60.0" y="336.0" width="640.0" height="34.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="74.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">74HCT (1980-ті)</text>
<text x="220.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">CMOS зі старим TTL-порогом на вході</text>
<rect x="60.0" y="376.0" width="640.0" height="34.0" rx="6" fill="#fbfbfb" stroke="#8e44ad" stroke-width="1.6"/>
<text x="74.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="start" font-weight="700">74LVC (1990-ті)</text>
<text x="220.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">низька напруга 3.3 В, вхід терпить 5 В</text>
</svg>