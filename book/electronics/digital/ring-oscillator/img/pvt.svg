<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 382" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="382" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама чутливість: вада для годинника — дар для датчика</text>
<text x="350.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">швидкість вентиля залежить від температури й напруги, тож частота кільця пливе за ними</text>
<line x1="80.0" y1="250.0" x2="300.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="80.0" y1="250.0" x2="80.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="300.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">температура →</text>
<text x="72.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">частота</text>
<path d="M 88.0 118.0 L 96.0 120.6 L 104.0 123.3 L 112.0 125.9 L 120.0 128.6 L 128.0 131.2 L 136.0 133.8 L 144.0 136.5 L 152.0 139.1 L 160.0 141.8 L 168.0 144.4 L 176.0 147.0 L 184.0 149.7 L 192.0 152.3 L 200.0 155.0 L 208.0 157.6 L 216.0 160.2 L 224.0 162.9 L 232.0 165.5 L 240.0 168.2 L 248.0 170.8 L 256.0 173.4 L 264.0 176.1 L 272.0 178.7 L 280.0 181.4 L 288.0 184.0" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="210.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">гарячіше → повільніше</text>
<line x1="400.0" y1="250.0" x2="620.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="400.0" y1="250.0" x2="400.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="620.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">живлення →</text>
<text x="392.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">частота</text>
<path d="M 408.0 208.0 L 416.0 204.9 L 424.0 201.8 L 432.0 198.6 L 440.0 195.5 L 448.0 192.4 L 456.0 189.3 L 464.0 186.2 L 472.0 183.0 L 480.0 179.9 L 488.0 176.8 L 496.0 173.7 L 504.0 170.6 L 512.0 167.4 L 520.0 164.3 L 528.0 161.2 L 536.0 158.1 L 544.0 155.0 L 552.0 151.8 L 560.0 148.7 L 568.0 145.6 L 576.0 142.5 L 584.0 139.4 L 592.0 136.2 L 600.0 133.1 L 608.0 130.0" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<text x="504.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вище живлення → швидше</text>
<rect x="148.8" y="309.4" width="402.5" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="350.0" y="328.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Для тактового джерела ця плавучість — біда (частота «дихає»).</tspan><tspan x="350.0" dy="14.3">Для вбудованого датчика — навпаки дар: чип сам себе міряє.</tspan></text>
</svg>