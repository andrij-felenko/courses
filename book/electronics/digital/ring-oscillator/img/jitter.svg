<rect x="69.8" y="313.4" width="540.4" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Куди саме впав фронт у мить вибірки — вирішує тепловий шум, а він непередбачуваний.</tspan><tspan x="340.0" dy="14.3">Тож ланцюжок бітів — справді випадковий, а не порахований формулою.</tspan></text>
