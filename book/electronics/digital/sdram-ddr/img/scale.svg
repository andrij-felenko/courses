<text x="440.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Практичний наслідок: кадр невеликого дисплея впирається в шину, а не в розрахунок.</text>
