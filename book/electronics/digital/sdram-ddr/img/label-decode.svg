<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маркування модуля: що в ньому зашифровано</text>
<rect x="70.0" y="78.0" width="740.0" height="52.0" rx="8" fill="#f3f7f3" stroke="#1f6b3a" stroke-width="2.0"/>
<text x="440.0" y="112.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700">PC4-25600   DDR4-3200   CL22-22-22</text>
<line x1="218.0" y1="132.0" x2="218.0" y2="152.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="218.0" y1="152.0" x2="176.0" y2="244.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="250.0" width="232.0" height="150.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<rect x="60.0" y="250.0" width="232.0" height="30.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="176.0" y="271.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">PC4-25600</text>
<text x="176.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">= пік ГБ/с × 1000</text>
<text x="72.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">клас модуля (PC4 = DDR4)</text>
<text x="72.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">25600 МБ/с = 3200 × 8 байтів</text>
<line x1="468.0" y1="132.0" x2="468.0" y2="152.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="468.0" y1="152.0" x2="440.0" y2="244.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="324.0" y="250.0" width="232.0" height="150.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<rect x="324.0" y="250.0" width="232.0" height="30.0" rx="0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="440.0" y="271.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">DDR4-3200</text>
<text x="440.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">тип і швидкість</text>
<text x="336.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">DDR4 — покоління</text>
<text x="336.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">3200 — передач за секунду,</text>
<text x="336.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">у мільйонах (МТ/с)</text>
<line x1="700.0" y1="132.0" x2="700.0" y2="152.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="700.0" y1="152.0" x2="704.0" y2="244.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="588.0" y="250.0" width="232.0" height="150.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<rect x="588.0" y="250.0" width="232.0" height="30.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="704.0" y="271.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">CL22</text>
<text x="704.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">затримка, у тактах</text>
<text x="600.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">CAS latency — пауза від</text>
<text x="600.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">запиту до першого слова;</text>
<text x="600.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">22 такти, не наносекунди!</text>
<rect x="60.0" y="418.0" width="760.0" height="38.0" rx="8" fill="#fff7ef" stroke="#e08030" stroke-width="1.8"/>
<text x="440.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкість (3200) і затримка (CL22) — різні числа: одне про потік, друге про паузу перед першим словом.</text>
</svg>