<text x="500.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Стара DRAM відповідала «коли встигне»; SDRAM прив'язана до такту, тож звернення вишиковуються конвеєром</text>
