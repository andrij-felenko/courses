<rect x="60.0" y="298.0" width="600.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Пастка: читаємо той самий регістр, у який цей же такт пишемо —</tspan><tspan x="360.0" dy="15.6">порт читання ще віддає СТАРЕ значення, а не щойно записане</tspan></text>
