<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідея, назва й залізо йшли нарізно</text>
<line x1="120.0" y1="92.0" x2="708.0" y2="92.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="714.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рік</text>
<circle cx="190.0" cy="92.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1964</text>
<line x1="190.0" y1="98.0" x2="190.0" y2="126.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="98.0" y="126.0" width="184.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">CDC 6600</tspan></text>
<text x="190.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">залізо є: 6 ярусів, зсув</tspan><tspan x="190.0" dy="14.1">до 63 позицій за такт;</tspan><tspan x="190.0" dy="14.1">зветься «parallel</tspan><tspan x="190.0" dy="14.1">shifting network»</tspan></text>
<circle cx="400.0" cy="92.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="400.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1965</text>
<line x1="400.0" y1="98.0" x2="400.0" y2="126.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="308.0" y="126.0" width="184.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">патент Burroughs</tspan></text>
<text x="400.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">уперше в тексті —</tspan><tspan x="400.0" dy="14.1">термін «barrel switch»</tspan><tspan x="400.0" dy="14.1">(подано 26.11.1965,</tspan><tspan x="400.0" dy="14.1">видано 1968)</tspan></text>
<circle cx="615.0" cy="92.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="615.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1985</text>
<line x1="615.0" y1="98.0" x2="615.0" y2="126.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="523.0" y="126.0" width="184.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="615.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Intel 386</tspan></text>
<text x="615.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">barrel shifter на кристалі</tspan><tspan x="615.0" dy="14.1">мікропроцесора: зсув за</tspan><tspan x="615.0" dy="14.1">3 такти незалежно від</tspan><tspan x="615.0" dy="14.1">величини</tspan></text>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три речі, які легко сплутати:</text>
<rect x="150.0" y="322.0" width="300.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="341.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">ідея розкладу на степені двійки</tspan></text>
<text x="468.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→  стара, спільна — жоден автор</text>
<rect x="150.0" y="360.0" width="300.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">назва «barrel switch / shifter»</tspan></text>
<text x="468.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→  від патенту Burroughs, 1965</text>
<rect x="150.0" y="398.0" width="300.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="417.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">реалізація на кристалі CPU</tspan></text>
<text x="468.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">→  масово — Intel 386, 1985</text>
</svg>