<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="150.0" y1="119.0" x2="277.0" y2="119.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="140.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">A = 1</text>
<line x1="150.0" y1="141.0" x2="277.0" y2="141.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="140.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">B = 1</text>
<path d="M 277.0,108.0 L 300.0,108.0 A 22.0,22.0 0 0 1 300.0,152.0 L 277.0,152.0 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="322.0" y1="130.0" x2="430.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="430.0" y1="130.0" x2="430.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="430.0" y1="200.0" x2="470.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="385.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">P = A·B = 1</text>
<line x1="150.0" y1="232.0" x2="473.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="140.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">C = 0</text>
<path d="M 473.0,187.0 Q 502.7,187.0 527.0,210.0 Q 502.7,233.0 473.0,233.0 Q 488.1,210.0 473.0,187.0 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<line x1="527.0" y1="210.0" x2="567.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="573.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Y = 1</text>
<text x="300.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">AND</text>
<text x="502.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">OR</text>
<rect x="60.0" y="268.0" width="600.0" height="40.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="291.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Вихід AND (P) заводять на вхід OR; другий вхід OR — це C. Так вираз Y = A·B + C «оживає» в залізі.</tspan></text>
</svg>