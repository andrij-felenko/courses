<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кружок = інверсія: буфер, інвертор і «бульбашка» на будь-якій ніжці</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">трикутник сам по собі лише ПЕРЕДАЄ сигнал; маленький кружок у точці означає «тут перевернути»</text>
