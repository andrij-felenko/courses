<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два домени живлення стикаються — і кожен напрямок ламається по-своєму</text>
<text x="360.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зверху: вихід 5 В тисне в 3.3-вольтовий вхід</text>
<rect x="80.0" y="76.0" width="140.0" height="68.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="150.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 В логіка</text>
<text x="150.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">VOH ≈ 5 В</text>
<rect x="500.0" y="76.0" width="140.0" height="68.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="570.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3.3 В логіка</text>
<text x="570.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">макс. вхід ≈ 3.6 В</text>
<line x1="222.0" y1="110.0" x2="498.0" y2="110.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">5 В на пін, розрахований на 3.3 В</text>
<rect x="199.5" y="124.5" width="321.0" height="31.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перенапруга → струм у захисний діод → деградація</tspan></text>
<line x1="40.0" y1="188.0" x2="680.0" y2="188.0" stroke="#d6dde6" stroke-width="1.2" stroke-dasharray="5,5"/>
<text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Знизу: вихід 3.3 В не дотягує до порога 5-вольтового входу</text>
<rect x="80.0" y="234.0" width="140.0" height="68.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3.3 В логіка</text>
<text x="150.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">VOH ≈ 3.3 В</text>
<rect x="500.0" y="234.0" width="140.0" height="68.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="570.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 В логіка</text>
<text x="570.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">VIH ≈ 3.5 В</text>
<line x1="222.0" y1="268.0" x2="498.0" y2="268.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="360.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">3.3 В приходить на вхід, що чекає ≥ 3.5 В</text>
<rect x="199.5" y="282.5" width="321.0" height="31.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="301.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">сигнал нижче VIH → «1» не впізнається або плаває</tspan></text>
<text x="360.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Тому між доменами потрібен посередник — перетворювач рівнів</text>
</svg>