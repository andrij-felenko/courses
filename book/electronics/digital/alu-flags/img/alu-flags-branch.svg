<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння = відняти й глянути на прапорці</text>
<text x="360.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">процесор рахує A − B, потім читає комбінацію бітів</text>
<text x="190.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">знакове тлумачення</text>
<rect x="40.0" y="108.0" width="300.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<text x="56.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A = B</text>
<text x="324.0" y="133.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">Z = 1</text>
<rect x="40.0" y="158.0" width="300.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<text x="56.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A ≠ B</text>
<text x="324.0" y="183.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">Z = 0</text>
<rect x="40.0" y="208.0" width="300.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<text x="56.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A &lt; B  (знак.)</text>
<text x="324.0" y="233.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">N ≠ V</text>
<rect x="40.0" y="258.0" width="300.0" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/>
<text x="56.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A ≥ B  (знак.)</text>
<text x="324.0" y="283.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">N = V</text>
<text x="530.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">беззнакове тлумачення</text>
<rect x="380.0" y="108.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="396.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A = B</text>
<text x="664.0" y="133.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">Z = 1</text>
<rect x="380.0" y="158.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="396.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A ≠ B</text>
<text x="664.0" y="183.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">Z = 0</text>
<rect x="380.0" y="208.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="396.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A &lt; B  (беззн.)</text>
<text x="664.0" y="233.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">C = 0</text>
<rect x="380.0" y="258.0" width="300.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="396.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">A ≥ B  (беззн.)</text>
<text x="664.0" y="283.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="14" fill="#1a1a1a" text-anchor="end" xml:space="preserve">C = 1</text>
<text x="360.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі біти результату — різні прапорці, бо '&lt;' для знакових і беззнакових різне</text>
</svg>