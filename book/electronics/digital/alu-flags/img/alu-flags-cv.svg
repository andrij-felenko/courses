<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одні біти — два тлумачення: C стежить за беззнаковим, V за знаковим</text>
<rect x="40.0" y="58.0" width="310.0" height="258.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="195.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">200 + 100</text>
<text x="58.0" y="112.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  1100 1000   беззн. 200 / знак. −56</text>
<text x="58.0" y="136.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">+ 0110 0100   беззн. 100 / знак. +100</text>
<text x="58.0" y="160.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  ─────────</text>
<text x="58.0" y="184.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">1 0010 1100   беззн. 300✗ / знак. +44✓</text>
<rect x="58.0" y="204.0" width="274.0" height="74.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="70.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">C = 1  (беззнакове не влізло)</text>
<text x="70.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">V = 0  (знаки доданків різні —</text>
<text x="84.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">знакове переповнення неможливе)</text>
<rect x="380.0" y="58.0" width="310.0" height="258.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="535.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">(−100) + (−50)</text>
<text x="398.0" y="112.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  1001 1100   беззн. 156 / знак. −100</text>
<text x="398.0" y="136.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">+ 1100 1110   беззн. 206 / знак.  −50</text>
<text x="398.0" y="160.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  ─────────</text>
<text x="398.0" y="184.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">1 0110 1010   беззн. 362✗ / знак. +106✗</text>
<rect x="398.0" y="204.0" width="274.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="410.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">V = 1  (−150 не влазить у −128…127)</text>
<text x="410.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">знак стрибнув з '−' на '+' —</text>
<text x="424.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">явна ознака знакового переповнення</text>
</svg>