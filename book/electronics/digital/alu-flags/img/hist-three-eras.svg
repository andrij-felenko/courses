<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три способи спитати «який вийшов результат»</text>
<rect x="24.0" y="58.0" width="226.0" height="372.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.4"/>
<text x="137.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">IBM 704 · 1954</text>
<text x="137.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">тест-і-стрибок</text>
<text x="38.0" y="132.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  CLA  X      ; A := X</text>
<text x="38.0" y="153.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  SUB  Y      ; A := A−Y</text>
<text x="38.0" y="174.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  TMI  NEG    ; A&lt;0 → стриб</text>
<text x="38.0" y="195.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">  ...         ; інакше сюди</text>
<text x="38.0" y="216.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">NEG ...</text>
<rect x="36.0" y="254.0" width="202.0" height="156.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="137.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="137.0" dy="0.0">Команда сама дивиться</tspan><tspan x="137.0" dy="14.3">на суматор і стрибає.</tspan><tspan x="137.0" dy="14.3">Стану після неї</tspan><tspan x="137.0" dy="14.3">не лишається —</tspan><tspan x="137.0" dy="14.3">питати «а який був</tspan><tspan x="137.0" dy="14.3">знак?» вже нема де.</tspan><tspan x="137.0" dy="14.3">Умову вшито</tspan><tspan x="137.0" dy="14.3">в сам стрибок.</tspan></text>
<rect x="264.0" y="58.0" width="226.0" height="372.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="377.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">System/360 · 1964</text>
<text x="377.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">2 біти коду умови</text>
<rect x="306.0" y="124.0" width="30.0" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="321.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">?</text>
<rect x="340.0" y="124.0" width="30.0" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="355.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">?</text>
<text x="390.0" y="145.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">CC ∈ {0,1,2,3}</text>
<rect x="276.0" y="174.0" width="202.0" height="236.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="377.0" y="202.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">Операція лишає у слові</tspan><tspan x="377.0" dy="14.3">стану (PSW) двобітний</tspan><tspan x="377.0" dy="14.3">код: 0, 1, 2 або 3.</tspan><tspan x="377.0" dy="14.3"> </tspan><tspan x="377.0" dy="14.3">Але що ці числа значать —</tspan><tspan x="377.0" dy="14.3">залежить від КОМАНДИ:</tspan><tspan x="377.0" dy="14.3">після ADD «2» — це</tspan><tspan x="377.0" dy="14.3">«додатний», після</tspan><tspan x="377.0" dy="14.3">порівняння — «перший</tspan><tspan x="377.0" dy="14.3">більший».</tspan><tspan x="377.0" dy="14.3"> </tspan><tspan x="377.0" dy="14.3">Стан нарешті переживає</tspan><tspan x="377.0" dy="14.3">команду; тлумачити</tspan><tspan x="377.0" dy="14.3">його важко.</tspan></text>
<rect x="504.0" y="58.0" width="226.0" height="372.0" rx="6" fill="#eafbf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="617.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">явний регістр стану</text>
<text x="617.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">N Z V C, однаково завжди</text>
<rect x="534.0" y="124.0" width="34.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="551.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">N</text>
<rect x="574.0" y="124.0" width="34.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="591.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Z</text>
<rect x="614.0" y="124.0" width="34.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="631.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">V</text>
<rect x="654.0" y="124.0" width="34.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="671.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">C</text>
<rect x="516.0" y="174.0" width="202.0" height="236.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/><text x="617.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="617.0" dy="0.0">Окремі іменовані біти:</tspan><tspan x="617.0" dy="14.3">знак, нуль, знакове</tspan><tspan x="617.0" dy="14.3">переповнення, перенос.</tspan><tspan x="617.0" dy="14.3"> </tspan><tspan x="617.0" dy="14.3">МАЙЖЕ КОЖНА операція</tspan><tspan x="617.0" dy="14.3">через АЛП оновлює їх</tspan><tspan x="617.0" dy="14.3">ОДНАКОВО.</tspan><tspan x="617.0" dy="14.3"> </tspan><tspan x="617.0" dy="14.3">Читати легко: «менше</tspan><tspan x="617.0" dy="14.3">знакове» = N≠V, і це</tspan><tspan x="617.0" dy="14.3">не залежить від того,</tspan><tspan x="617.0" dy="14.3">хто порахував.</tspan><tspan x="617.0" dy="14.3"> </tspan><tspan x="617.0" dy="14.3">Так і живе в процесорах</tspan><tspan x="617.0" dy="14.3">донині.</tspan></text>
<line x1="252.0" y1="244.0" x2="262.0" y2="244.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="492.0" y1="244.0" x2="502.0" y2="244.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">стан результату поступово «відклеївся» від самої команди й став окремим, іменованим</text>
</svg>