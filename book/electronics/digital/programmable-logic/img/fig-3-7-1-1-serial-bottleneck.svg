<rect x="60.0" y="396.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Процесор розкладає роботу в ЧАСІ (швидко перемикає одну АЛП); FPGA розкладає її у ПРОСТОРІ (багато схем нараз).</text>
<text x="450.0" y="446.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Коли дій багато й вони однотипні, послідовний процесор просто не встигає по тактах — а паралельне залізо встигає.</text>
