<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">FPGA у тракті осцилографа чи логічного аналізатора</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">швидкий потік відліків іде СПЕРШУ у FPGA, процесор підхоплює зібране</text>
<rect x="60.0" y="130.0" width="110.0" height="70.0" rx="8" fill="#fff" stroke="#2457d6" stroke-width="1.8"/>
<text x="115.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Входи</text>
<text x="115.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">сотні Мвідл/с</text>
<line x1="170.0" y1="165.0" x2="210.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="210.0" y="130.0" width="150.0" height="70.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="285.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">FPGA</text>
<text x="285.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">ловить кожен відлік</text>
<line x1="360.0" y1="165.0" x2="400.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="130.0" width="120.0" height="70.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="460.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буфер</text>
<text x="460.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">складає дані</text>
<line x1="520.0" y1="165.0" x2="560.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="130.0" width="130.0" height="70.0" rx="8" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="625.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Процесор</text>
<text x="625.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">малює екран</text>
<line x1="690.0" y1="165.0" x2="730.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="130.0" width="90.0" height="70.0" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="775.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Екран</text>
<text x="285.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">обов'язковий «почет» FPGA:</text>
<rect x="210.0" y="254.0" width="150.0" height="34.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="285.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">флеш конфігурації</text>
<line x1="285.0" y1="254.0" x2="285.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="400.0" y="254.0" width="150.0" height="34.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="475.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">кварц такту</text>
<line x1="475.0" y1="254.0" x2="285.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="560.0" y="254.0" width="150.0" height="34.0" rx="6" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="635.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">кілька джерел живлення</text>
<line x1="635.0" y1="254.0" x2="285.0" y2="218.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="440.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">Передову лінію — швидкий потік — тримає FPGA; процесор уже потім спокійно рахує.</text>
</svg>