<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заклад на закон Мура: транзистори можна марнувати</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">проміняти ПЛОЩУ й ШВИДКІСТЬ на ГНУЧКІСТЬ і ЧАС</text>
<line x1="90.0" y1="250.0" x2="470.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="90.0" y1="250.0" x2="90.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="280.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">роки →</text>
<text x="74.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ціна 1 транзистора</text>
<polyline points="90.0,90.0 99.5,100.4 109.0,110.2 118.5,119.3 128.0,127.8 137.5,135.7 147.0,143.1 156.5,150.0 166.0,156.4 175.5,162.4 185.0,168.0 194.5,173.2 204.0,178.1 213.5,182.6 223.0,186.9 232.5,190.8 242.0,194.5 251.5,198.0 261.0,201.2 270.5,204.2 280.0,207.0 289.5,209.6 299.0,212.0 308.5,214.3 318.0,216.4 327.5,218.4 337.0,220.3 346.5,222.0 356.0,223.6 365.5,225.1 375.0,226.5 384.5,227.8 394.0,229.0 403.5,230.2 413.0,231.2 422.5,232.2 432.0,233.1 441.5,234.0 451.0,234.8 460.5,235.6 470.0,236.2" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<circle cx="158.4" cy="151.3" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="170.4" y="145.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ставка Фрімана, 1984</text>
<rect x="520.0" y="90.0" width="320.0" height="96.0" rx="10" fill="#fbeeee" stroke="#c0392b" stroke-width="1.7"/>
<text x="680.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПЛАТА за гнучкість</text>
<text x="538.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• більша площа на кристалі</text>
<text x="538.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• нижча швидкість</text>
<text x="538.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• вища ціна за штуку</text>
<rect x="520.0" y="200.0" width="320.0" height="96.0" rx="10" fill="#eef7ee" stroke="#27ae60" stroke-width="1.7"/>
<text x="680.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ВИГРАШ</text>
<text x="538.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• схема за години замість місяців</text>
<text x="538.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• правлення помилок новим бітстрімом</text>
<text x="538.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• нуль витрат на маски</text>
<text x="440.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">Що дешевшим транзистор — то вигідніший обмін «трохи зайвого кремнію → миттєва гнучкість». Заклад виграно.</text>
</svg>