<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях до FPGA: чип, якому схему завантажують</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">не ПЕРЕБУДОВУВАТИ залізо під задачу, а ЗАВАНТАЖУВАТИ конфігурацію</text>
<line x1="80.0" y1="150.0" x2="820.0" y2="150.0" stroke="#8a8a8a" stroke-width="2.0"/>
<circle cx="150.0" cy="150.0" r="7.0" fill="#fff" stroke="#6b7280" stroke-width="3.0"/>
<text x="150.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">поч. 1980-х</text>
<text x="150.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ідея «чистої</text>
<text x="150.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">стрічки» у Zilog</text>
<circle cx="360.0" cy="150.0" r="9.0" fill="#c0392b" stroke="#c0392b" stroke-width="3.0"/>
<text x="360.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1984</text>
<text x="360.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">заснування Xilinx</text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">$4 млн, без заводу</text>
<circle cx="610.0" cy="150.0" r="7.0" fill="#fff" stroke="#27ae60" stroke-width="3.0"/>
<text x="610.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1 лист. 1985</text>
<text x="610.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">XC2064 — перша</text>
<text x="610.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">FPGA у кремнії</text>
<circle cx="810.0" cy="150.0" r="7.0" fill="#fff" stroke="#6b7280" stroke-width="3.0"/>
<text x="810.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">далі</text>
<text x="810.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">індустрія на</text>
<text x="810.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мільярди</text>
<text x="450.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усе почалося з відмови (у Zilog ідею не схотіли),</text>
<text x="450.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">а вивершилося чипом, якому схему задають бітстрімом при ввімкненні.</text>
</svg>