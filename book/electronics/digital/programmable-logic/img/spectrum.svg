<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місце FPGA: гнучкість проти швидкості</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">від «усе вирішує програма» до «усе зашито в кремній»</text>
<line x1="90.0" y1="150.0" x2="810.0" y2="150.0" stroke="#8a8a8a" stroke-width="2.0"/>
<circle cx="150.0" cy="150.0" r="8.0" fill="#fff" stroke="#2457d6" stroke-width="3.0"/>
<rect x="80.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#2457d6" stroke-width="1.6"/>
<text x="150.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Процесор / МК</text>
<text x="150.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">будь-яка програма,</text>
<text x="150.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">але послідовно</text>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">гнучкий, повільніший</text>
<circle cx="380.0" cy="150.0" r="8.0" fill="#fff" stroke="#caa24a" stroke-width="3.0"/>
<rect x="310.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#caa24a" stroke-width="1.6"/>
<text x="380.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">GPU</text>
<text x="380.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">тисячі ядер,</text>
<text x="380.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">дані-паралельно</text>
<circle cx="560.0" cy="150.0" r="8.0" fill="#fff" stroke="#27ae60" stroke-width="3.0"/>
<rect x="490.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#27ae60" stroke-width="1.6"/>
<text x="560.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">FPGA</text>
<text x="560.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">своя СХЕМА під</text>
<text x="560.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">задачу, паралельно</text>
<text x="560.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">← наш герой</text>
<circle cx="770.0" cy="150.0" r="8.0" fill="#fff" stroke="#c0392b" stroke-width="3.0"/>
<rect x="700.0" y="72.0" width="140.0" height="56.0" rx="8" fill="#fafafa" stroke="#c0392b" stroke-width="1.6"/>
<text x="770.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ASIC</text>
<text x="770.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">схема назавжди</text>
<text x="770.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">випалена в чип</text>
<text x="770.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">найшвидший, негнучкий</text>
<line x1="250.0" y1="222.0" x2="110.0" y2="222.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="180.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">більше ГНУЧКОСТІ</text>
<line x1="650.0" y1="222.0" x2="790.0" y2="222.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">більше ШВИДКОСТІ й ефективності</text>
<rect x="60.0" y="318.0" width="780.0" height="66.0" rx="10" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.7"/>
<text x="450.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процесор гнучкий, бо програмований, але послідовний; ASIC найшвидший, та схема в ньому застигла.</text>
<text x="450.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">FPGA бере справжню паралельну СХЕМУ під задачу, яку до того ж можна переписати.</text>
</svg>