<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Троє засновників — три ролі, а не «один геній»</text>
<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">«придумати» ≠ «підняти компанію» ≠ «зробити так, щоб це можна було виробляти»</text>
<rect x="41.0" y="80.0" width="250.0" height="150.0" rx="10" fill="#fafafa" stroke="#27ae60" stroke-width="1.8"/>
<text x="166.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Росс Фріман</text>
<rect x="96.0" y="122.0" width="140.0" height="26.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="166.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">ВИНАХІД</text>
<text x="166.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">сама ідея FPGA:</text>
<text x="166.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">чип, у який схему завантажують</text>
<rect x="315.0" y="80.0" width="250.0" height="150.0" rx="10" fill="#fafafa" stroke="#2457d6" stroke-width="1.8"/>
<text x="440.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Джеймс Барнетт</text>
<rect x="370.0" y="122.0" width="140.0" height="26.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="440.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">УПРАВЛІННЯ</text>
<text x="440.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">підняв компанію з нуля:</text>
<text x="440.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">гроші, команда, перший продукт</text>
<rect x="589.0" y="80.0" width="250.0" height="150.0" rx="10" fill="#fafafa" stroke="#c0392b" stroke-width="1.8"/>
<text x="714.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Берні Вондершмітт</text>
<rect x="644.0" y="122.0" width="140.0" height="26.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="714.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">ВИРОБНИЦТВО</text>
<text x="714.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">як випускати чипи</text>
<text x="714.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">без власного заводу</text>
<text x="440.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усі троє прийшли з Zilog. Внески різні — і всі необхідні.</text>
<text x="440.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Прибери будь-кого — і FPGA лишилася б ідеєю в шухляді.</text>
</svg>