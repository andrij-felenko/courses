<text x="269.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">збереж.</text>
<text x="269.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контекст</text>
<line x1="302.0" y1="132.0" x2="314.0" y2="132.0" stroke="#1f47b5" stroke-width="1.5" marker-end="url(#aBlue)"/>
<rect x="314.0" y="110.0" width="66.0" height="44.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.5"/>
<text x="347.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">код-</text>
<text x="347.0" y="137.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">обробник</text>
<line x1="380.0" y1="132.0" x2="392.0" y2="132.0" stroke="#1f47b5" stroke-width="1.5" marker-end="url(#aBlue)"/>
<rect x="392.0" y="110.0" width="66.0" height="44.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.5"/>
<text x="425.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вихід</text>
<text x="230.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">десятки–сотні тактів + джитер (затримка «плаває»)</text>
<text x="230.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">FPGA (пряма логіка)</text>
<rect x="120.0" y="248.0" width="80.0" height="44.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="160.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вхід</text>
<line x1="200.0" y1="270.0" x2="320.0" y2="270.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<rect x="320.0" y="248.0" width="150.0" height="44.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="395.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">комбінаційна логіка</text>
<text x="395.0" y="283.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кілька вентилів</text>
<line x1="470.0" y1="270.0" x2="560.0" y2="270.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<rect x="560.0" y="248.0" width="80.0" height="44.0" rx="5" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="600.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вихід</text>
<text x="230.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">одиниці–десятки наносекунд, СТАЛО (без джитера)</text>
<rect x="60.0" y="344.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FPGA реагує за час проходження сигналу крізь кілька вентилів — швидко й ПЕРЕДБАЧУВАНО, такт у такт однаково.</text>
<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Процесорові ж треба перервати поточну роботу, зберегти стан і виконати код — повільніше, і затримка «плаває».</text>
