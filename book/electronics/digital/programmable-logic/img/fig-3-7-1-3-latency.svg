<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Друга перевага: детермінована МАЛА затримка від входу до дії</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">скільки наносекунд від «сигнал змінився» до «вихід відреагував»</text>
<text x="230.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Процесор (через переривання)</text>
<rect x="80.0" y="110.0" width="66.0" height="44.0" rx="5" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.5"/>
