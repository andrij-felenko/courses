<text x="380.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен інтервал — фізика чіпа: час, поки буфер-підсилювач розгойдає крихітний заряд комірки.</text>
<text x="380.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Відлічиш замало — прочитаєш сміття; тому числа таймінгів (як «CL22» на модулі) контролер знає наперед.</text>
