<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий автомат: switch-код проти таблиці переходів</text>
<text x="225.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Логіка зашита в код</text>
<rect x="40.0" y="92.0" width="380.0" height="268.0" rx="8" fill="#f7f8fa" stroke="#2457d6" stroke-width="1.6"/><text x="56.0" y="114.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">switch (state) {</text><text x="56.0" y="133.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  case LOCKED:</text><text x="56.0" y="153.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    if (ev == COIN) {</text><text x="56.0" y="172.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">      unlock();</text><text x="56.0" y="192.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">      state = OPEN;</text><text x="56.0" y="211.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    }</text><text x="56.0" y="231.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    break;</text><text x="56.0" y="250.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  case OPEN:</text><text x="56.0" y="270.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    if (ev == PUSH) {</text><text x="56.0" y="289.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">      lock();</text><text x="56.0" y="309.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">      state = LOCKED;</text><text x="56.0" y="328.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    }</text><text x="56.0" y="348.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">    break;</text><text x="56.0" y="367.5" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">}</text>
<text x="665.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Логіка винесена в дані</text>
<rect x="470.0" y="100.0" width="110.0" height="46.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="525.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">next[][]</text>
<rect x="580.0" y="100.0" width="150.0" height="46.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="655.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">COIN</text>
<rect x="730.0" y="100.0" width="150.0" height="46.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="805.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">PUSH</text>
<rect x="470.0" y="146.0" width="110.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="525.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">LOCKED</text>
<rect x="580.0" y="146.0" width="150.0" height="46.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.3"/>
<text x="655.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">OPEN</text>
<text x="655.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">/unlock</text>
<rect x="730.0" y="146.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="805.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">LOCKED</text>
<text x="805.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">/—</text>
<rect x="470.0" y="192.0" width="110.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="525.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">OPEN</text>
<rect x="580.0" y="192.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="655.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">OPEN</text>
<text x="655.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">/—</text>
<rect x="730.0" y="192.0" width="150.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="805.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">LOCKED</text>
<text x="805.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">/lock</text>
<text x="665.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">клітинка = (новий стан, дія)</text>
<text x="450.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обидва кодують LOCKED + COIN → unlock і перехід в OPEN; таблиця відділяє «що» від «як крутить рушій».</text>
</svg>