<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спадок: одне правило — під усім цифровим світом</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щойно сигнал треба «оцифрувати», працює теорема дискретизації — від музики до твого давача</text>
<circle cx="480.0" cy="150.0" r="52.0" fill="#fff6e0" stroke="#caa24a" stroke-width="2.4"/>
<text x="480.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">теорема</text>
<text x="480.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дискретизації</text>
<rect x="75.0" y="90.0" width="150.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="150.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Цифрове аудіо</text>
<text x="150.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">CD, MP3, телефон</text>
<line x1="225.0" y1="120.0" x2="430.0" y2="150.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<rect x="75.0" y="220.0" width="150.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="150.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Цифрове фото/відео</text>
<text x="150.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сенсори, камери</text>
<line x1="225.0" y1="250.0" x2="430.0" y2="150.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<rect x="735.0" y="90.0" width="150.0" height="60.0" rx="10" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/>
<text x="810.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#7a4fb0" text-anchor="middle" font-weight="bold" font-style="normal">Цифрова телефонія</text>
<text x="810.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">PCM, T1</text>
<line x1="735.0" y1="120.0" x2="530.0" y2="150.0" stroke="#7a4fb0" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="735.0" y="220.0" width="150.0" height="60.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="810.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Кожен АЦП</text>
<text x="810.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">давачі, ESP32</text>
<line x1="735.0" y1="250.0" x2="530.0" y2="150.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<rect x="150.0" y="312.0" width="660.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="480.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скромний АЦП у твоєму ESP32 — прямий нащадок цієї ідеї:</text>
<text x="480.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">виміряти світ рівно стільки разів, скільки треба, — і не втратити нічого.</text>
</svg>
