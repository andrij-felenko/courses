<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
<rect width="960" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де працює АЦП: майже кожен давач читають саме ним</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе, що дає змінну напругу, стає числом через АЦП</text>
<rect x="60.0" y="90.0" width="840.0" height="46.0" rx="9" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="82.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Потенціометр / ручка</text>
<text x="430.0" y="119.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">поворот → напруга подільника</text>
<rect x="60.0" y="142.0" width="840.0" height="46.0" rx="9" fill="#fbfcff" stroke="#c0271e" stroke-width="1.6"/>
<text x="82.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Давач температури</text>
<text x="430.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тепло → напруга (термістор, LM35)</text>
<rect x="60.0" y="194.0" width="840.0" height="46.0" rx="9" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="82.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Фоторезистор (LDR)</text>
<text x="430.0" y="223.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">світло → опір → напруга</text>
<rect x="60.0" y="246.0" width="840.0" height="46.0" rx="9" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="82.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="start" font-weight="bold" font-style="normal">Мікрофон</text>
<text x="430.0" y="275.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">звук → коливання напруги</text>
<rect x="60.0" y="298.0" width="840.0" height="46.0" rx="9" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="82.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Напруга батареї</text>
<text x="430.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">подільник → виміряти заряд</text>
<rect x="60.0" y="350.0" width="840.0" height="46.0" rx="9" fill="#fbfcff" stroke="#2aa198" stroke-width="1.6"/>
<text x="82.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#2aa198" text-anchor="start" font-weight="bold" font-style="normal">Джойстик</text>
<text x="430.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дві осі → дві напруги (два канали)</text>
<text x="480.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Спільне одне: фізична величина → напруга → АЦП → число, з яким працює код.</text>
</svg>
