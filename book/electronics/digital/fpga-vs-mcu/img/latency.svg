<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затримка «вхід змінився -&gt; вихід відреагував»</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">груба ілюстрація порядків — конкретика залежить від задачі</text>
<text x="216.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">МК: опитування в циклі</text>
<rect x="230.0" y="96.0" width="500.0" height="38.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="742.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">сотні нс–мкс: поки дійде черга</text>
<text x="216.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">МК: переривання</text>
<rect x="230.0" y="172.0" width="290.0" height="38.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="532.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">десятки–сотні тактів на вхід у обробник</text>
<text x="216.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="700">FPGA: пряма логіка</text>
<rect x="230.0" y="248.0" width="60.0" height="38.0" rx="6" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="302.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">одиниці–десятки нс: крізь кілька вентилів</text>
<line x1="230.0" y1="328.0" x2="730.0" y2="328.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="230.0" y1="328.0" x2="730.0" y2="328.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="230.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">-&gt; більша затримка</text>
<rect x="40.0" y="358.0" width="680.0" height="60.0" rx="6" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/><text x="380.0" y="391.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Коли важать саме наносекунди (швидке керування, захист, обробка фронтів) — FPGA виграє з великим відривом.</tspan></text>
<text x="380.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Досить «зреагувати за мікросекунди» — мікроконтролера вистачає, і він простіший.</text>
</svg>