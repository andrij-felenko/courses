<text x="600.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">біти ловлять різні фронти → проміжне сміття</text>
<text x="600.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">треба: рукостискання · FIFO · код Грея (CDC)</text>
<rect x="40.0" y="300.0" width="740.0" height="96.0" rx="10" fill="#fff7ec" stroke="#caa24a" stroke-width="2"/>
<text x="60.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Головна пастка на МК/FPGA:</text>
<text x="60.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вихід ПЕРШОГО тригера (Q1) — «брудний». Його не можна розгалужувати в логіку, ні в який</text>
<text x="60.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">інший тригер. Уся схема читає ЛИШЕ вихід ДРУГОГО (Q2). Інакше метастабільність «розповзеться».</text>
<text x="60.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">І ще: обидва тригери — в ОДНОМУ тактовому домені приймача, поряд, без логіки між ними.</text>
<text x="410.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Чим більше «запасу часу» (slack) до фронту FF2 — тим експоненційно більший MTBF:</text>
<text x="410.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">MTBF = e^(t_r / τ) / ( f_clk · f_data · T_w )</text>
<text x="410.0" y="462.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">хочеш надійніше за тих самих частот — додай ТРЕТІЙ тригер (ще один цілий період на згасання).</text>
</svg>
