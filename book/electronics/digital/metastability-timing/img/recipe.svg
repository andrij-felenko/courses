<text x="220.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дешево, надійно, MTBF — роки/століття</text>
