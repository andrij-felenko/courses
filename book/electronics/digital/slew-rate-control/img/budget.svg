<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ціль — не «якнайкрутіше», а «рівно скільки треба»</text>
<line x1="120.0" y1="300.0" x2="120.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="120.0" y1="70.0" x2="120.0" y2="60.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="112.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">крутість</text>
<text x="112.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">млявіше</text>
<line x1="120.0" y1="250.0" x2="660.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="660.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">мінімум: фронт &lt; біта</text>
<text x="500.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">швидша шина → крутіший</text>
<line x1="120.0" y1="110.0" x2="660.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,5"/>
<text x="660.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">максимум: довший дріт дзвенить</text>
<polygon points="120,250 120,110 470,195" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="250.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">коридор</text>
<text x="250.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">вибору</text>
<line x1="120.0" y1="300.0" x2="690.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="690.0" y1="300.0" x2="700.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">довжина лінії · швидкість</text>
<rect x="150.0" y="336.0" width="460.0" height="32.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="1.4"/><text x="380.0" y="355.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Крутість бери мінімальну, що ще несе потрібну швидкість — і жодним пікселем крутішу</tspan></text>
</svg>