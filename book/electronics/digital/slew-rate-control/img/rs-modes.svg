<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Вивід RS: одна ніжка — три режими; резистор на землю задає крутість</text>
<rect x="30.0" y="60.0" width="200.0" height="150.0" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="130.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">high-speed</text>
<text x="130.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RS ── 0 Ω ── GND</text>
<text x="130.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">без обмеження нахилу</text>
<polyline points="86,148 124,148 124,122 174,122" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<rect x="290.0" y="60.0" width="200.0" height="150.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="390.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">slope control</text>
<text x="390.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RS ── R ── GND</text>
<text x="390.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">нахил ∝ 1/R</text>
<polyline points="346,148 400,122 434,122" fill="none" stroke="#27ae60" stroke-width="2.6"/>
<rect x="550.0" y="60.0" width="200.0" height="150.0" rx="8" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="650.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">standby / silent</text>
<text x="650.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RS ── високий рівень</text>
<text x="650.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">драйвер спить, приймач чує</text>
<line x1="606.0" y1="135.0" x2="694.0" y2="135.0" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="650.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">тиша на шині</text>
<line x1="120.0" y1="320.0" x2="660.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="660.0" y1="320.0" x2="672.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="120.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">малий R  →  крутіше (≈15 В/мкс при 10 кОм)</text>
<text x="660.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">великий R  →  пологіше (≈2 В/мкс при 100 кОм)</text>
<line x1="190.0" y1="315.0" x2="190.0" y2="325.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="190.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0 Ω</text>
<line x1="300.0" y1="315.0" x2="300.0" y2="325.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="300.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">10к</text>
<line x1="470.0" y1="315.0" x2="470.0" y2="325.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="470.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">47к</text>
<line x1="600.0" y1="315.0" x2="600.0" y2="325.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="600.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">100к</text>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">правило класу: бери НАЙПОЛОГІШИЙ фронт, що ще несе потрібну швидкість шини</text>
</svg>