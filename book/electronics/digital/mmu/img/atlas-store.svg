<text x="239.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a5a2e" text-anchor="middle">тягнемо з барабана</text>
<line x1="405.0" y1="268.0" x2="685.0" y2="320.0" stroke="#7a5a2e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a5a2e" text-anchor="middle" font-style="italic">у вільний блок</text>
<text x="410.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Програма адресує всі 1 000 000 слів як одне ціле; апаратура сама тримає гарячі сторінки в осерді, решту — на барабані.</text>
