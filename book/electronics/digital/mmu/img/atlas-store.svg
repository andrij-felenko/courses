<text x="405.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6a3fb5" text-anchor="middle" font-weight="700">відповідники (PAR)</text>
<text x="405.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6a3fb5" text-anchor="middle">по одному на блок осердя</text>
<rect x="320.0" y="180.0" width="170.0" height="20.0" rx="6" fill="#ffffff" stroke="#6a3fb5" stroke-width="1.1"/>
<text x="405.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6a3fb5" text-anchor="middle">стор. ? = блок ?</text>
<rect x="320.0" y="206.0" width="170.0" height="20.0" rx="6" fill="#ffffff" stroke="#6a3fb5" stroke-width="1.1"/>
<text x="405.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6a3fb5" text-anchor="middle">стор. ? = блок ?</text>
<rect x="320.0" y="232.0" width="170.0" height="20.0" rx="6" fill="#ffffff" stroke="#6a3fb5" stroke-width="1.1"/>
<text x="405.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#6a3fb5" text-anchor="middle">стор. ? = блок ?</text>
<text x="405.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6a3fb5" text-anchor="middle" font-style="italic">звіряє адресу з усіма 32 нараз</text>
<text x="405.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">адреса від процесора</text>
<line x1="405.0" y1="70.0" x2="405.0" y2="96.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="136.0" x2="590.0" y2="110.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="550.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">є в осерді:</text>
<text x="550.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">блок за такт</text>
<line x1="190.0" y1="250.0" x2="300.0" y2="226.0" stroke="#7a5a2e" stroke-width="2.0" marker-end="url(#arrow)"/>
