<text x="430.0" y="373.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кілька транзисторів (§15.2–15.5)</text>
