<rect x="200.0" y="400.0" width="460.0" height="56.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="430.0" y="425.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">транзистор</text>
