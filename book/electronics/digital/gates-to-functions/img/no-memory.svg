<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="250.0" y="110.0" width="200.0" height="90.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.8"/>
<text x="350.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">комбінаційна</tspan><tspan x="350.0" dy="19.5">логіка</tspan></text>
<text x="350.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(без пам'яті)</text>
<line x1="180.0" y1="138.0" x2="250.0" y2="138.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="180.0" y1="172.0" x2="250.0" y2="172.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="174.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">входи зараз</text>
<line x1="450.0" y1="155.0" x2="520.0" y2="155.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="526.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">вихід</text>
<text x="350.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Скільки разів натиснули кнопку?»</text>
<text x="350.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">— не знає: не пам'ятає попередніх натискань</text>
<text x="350.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">потрібні ПАМ'ЯТЬ (зберегти стан) і ТАКТ (ритм кроків)</text>
</svg>