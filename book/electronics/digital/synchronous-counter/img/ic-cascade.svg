<text x="380.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">хиба-пастка: RCO ворухне ENT, але НЕ ENP — головний «стоп» вішають на ENP</text>
