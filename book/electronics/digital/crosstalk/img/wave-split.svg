<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди біжать наведені хвилі: чому на ближньому додаються, на дальньому гасяться</text>
<line x1="70.0" y1="90.0" x2="630.0" y2="90.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="58.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ближній</text>
<text x="632.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дальній</text>
<text x="350.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ємнісний струм  iC = Cм·dV/dt  (тече в точці зв'язку)</text>
<circle cx="350.0" cy="86.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="350.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="338.0" y1="106.0" x2="110.0" y2="106.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="362.0" y1="106.0" x2="590.0" y2="106.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="210.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">назад  ½iC  (+)</text>
<text x="490.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вперед  ½iC  (+)</text>
<line x1="70.0" y1="210.0" x2="630.0" y2="210.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="58.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ближній</text>
<text x="632.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дальній</text>
<text x="350.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Індуктивна е.р.с.  vL = M·dI/dt  (наводиться вздовж петлі)</text>
<circle cx="334.0" cy="206.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="334.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="366.0" cy="206.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="366.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="338.0" y1="226.0" x2="110.0" y2="226.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="362.0" y1="226.0" x2="590.0" y2="226.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="210.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">назад  (+)</text>
<text x="490.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">вперед  (−)</text>
<line x1="70.0" y1="340.0" x2="630.0" y2="340.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="58.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ближній</text>
<text x="632.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дальній</text>
<text x="350.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сума на кінці = ємнісний ± індуктивний</text>
<rect x="64.0" y="352.0" width="250.0" height="60.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="2.0"/><text x="189.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="189.0" dy="0.0">БЛИЖНІЙ:  (+) + (+)  →  ДОДАЮТЬСЯ</tspan><tspan x="189.0" dy="14.3">Vбл ∝ (Cм/C + M/L)</tspan></text>
<rect x="386.0" y="352.0" width="250.0" height="60.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/><text x="511.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="511.0" dy="0.0">ДАЛЬНІЙ:  (+) + (−)  →  ГАСЯТЬСЯ</tspan><tspan x="511.0" dy="14.3">Vдл ∝ (Cм/C − M/L)</tspan></text>
<text x="350.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ємнісний внесок на обох кінцях однакового знаку; індуктивний — протилежного на дальньому. Звідси сума й різниця.</text>
</svg>