<text x="96.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Розсунути доріжки</text>
<line x1="31.0" y1="106.0" x2="161.0" y2="106.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="27.0" y="116.0" width="138.0" height="128.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="96.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="96.0" dy="0.0">Cм і M</tspan><tspan x="96.0" dy="13.0">падають</tspan><tspan x="96.0" dy="13.0">з відстанню.</tspan><tspan x="96.0" dy="13.0">Правило 3W:</tspan><tspan x="96.0" dy="13.0">проміжок ≥ 2·ширини.</tspan></text>
<rect x="193.0" y="66.0" width="158.0" height="190.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="2.0"/>
<text x="272.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Земля-щит</text>
<line x1="207.0" y1="106.0" x2="337.0" y2="106.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="203.0" y="116.0" width="138.0" height="128.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="272.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="272.0" dy="0.0">Заземлена</tspan><tspan x="272.0" dy="15.6">доріжка</tspan><tspan x="272.0" dy="15.6">чи шар землі</tspan><tspan x="272.0" dy="15.6">перехоплює поле</tspan><tspan x="272.0" dy="15.6">й веде зворотний</tspan><tspan x="272.0" dy="15.6">струм поряд.</tspan></text>
<rect x="369.0" y="66.0" width="158.0" height="190.0" rx="6" fill="#fbfcfd" stroke="#c0392b" stroke-width="2.0"/>
<text x="448.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Тихший фронт</text>
<line x1="383.0" y1="106.0" x2="513.0" y2="106.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="379.0" y="116.0" width="138.0" height="128.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="448.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="448.0" dy="0.0">Менший slew</tspan><tspan x="448.0" dy="15.6">→ менший dV/dt</tspan><tspan x="448.0" dy="15.6">і dI/dt</tspan><tspan x="448.0" dy="15.6">→ слабший</tspan><tspan x="448.0" dy="15.6">інжект у жертву.</tspan></text>
<rect x="545.0" y="66.0" width="158.0" height="190.0" rx="6" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="624.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диференційна пара</text>
<line x1="559.0" y1="106.0" x2="689.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="555.0" y="116.0" width="138.0" height="128.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="624.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="624.0" dy="0.0">Завада б'є</tspan><tspan x="624.0" dy="15.6">в обидва</tspan><tspan x="624.0" dy="15.6">проводи рівно</tspan><tspan x="624.0" dy="15.6">→ приймач</tspan><tspan x="624.0" dy="15.6">бере різницю</tspan><tspan x="624.0" dy="15.6">й викидає її.</tspan></text>
<text x="360.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Найдешевше — фронт і відстань; найнадійніше на швидкості — земля-щит і диференціал.</text>
</svg>