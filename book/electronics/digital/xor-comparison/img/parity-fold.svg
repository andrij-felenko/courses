<text x="60.0" y="508.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">XOR асоціативний і комутативний, тож суму всіх 32 бітів можна групувати як завгодно. Згортаючи слово навпіл,</text>
<text x="60.0" y="526.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ми XOR-имо біт i з бітом i+16, потім i з i+8 і т. д. — наприкінці молодший біт несе XOR-суму ВСІХ бітів: парність.</text>
</svg>
