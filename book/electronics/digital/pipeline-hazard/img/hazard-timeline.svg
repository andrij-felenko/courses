<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід конфліктів: 1961 → 1964 → 1967</text>
<line x1="60.0" y1="92.0" x2="860.0" y2="92.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="838.0" y1="92.0" x2="866.0" y2="92.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="200.0" cy="92.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="200.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1961</text>
<text x="200.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">IBM 7030 Stretch</text>
<circle cx="460.0" cy="92.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="460.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1964</text>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">CDC 6600</text>
<circle cx="720.0" cy="92.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="720.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1967</text>
<text x="720.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">System/360 Mod. 91</text>
<rect x="78.0" y="210.0" width="244.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="200.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Багато команд у польоті</tspan><tspan x="200.0" dy="15.0">(до 11). Проброс store→load,</tspan><tspan x="200.0" dy="15.0">відкат наперед вибраного —</tspan><tspan x="200.0" dy="15.0">усе ще БЕЗ назв</tspan></text>
<line x1="200.0" y1="98.0" x2="200.0" y2="210.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="338.0" y="210.0" width="244.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="460.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Незалежні вузли + табло:</tspan><tspan x="460.0" dy="15.0">уперше ПОЗАЧЕРГОВЕ</tspan><tspan x="460.0" dy="15.0">виконання. WAR/WAW</tspan><tspan x="460.0" dy="15.0">розв'язують ЗУПИНКОЮ</tspan></text>
<line x1="460.0" y1="98.0" x2="460.0" y2="210.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="598.0" y="210.0" width="244.0" height="92.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="720.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Станції + спільна шина +</tspan><tspan x="720.0" dy="15.0">ПЕРЕЙМЕНУВАННЯ регістрів:</tspan><tspan x="720.0" dy="15.0">WAR/WAW усунено в корені</tspan><tspan x="720.0" dy="15.0">(різні імена — нема сутички)</tspan></text>
<line x1="720.0" y1="98.0" x2="720.0" y2="210.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="314.0" y1="358.0" x2="346.0" y2="358.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="260.4" y="313.4" width="139.1" height="45.3" rx="6" fill="#fff6e6" stroke="#6b7280" stroke-width="1.2"/><text x="330.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">перекриття в часі →</tspan><tspan x="330.0" dy="14.3">уперше можливий RAW</tspan></text>
<line x1="574.0" y1="358.0" x2="606.0" y2="358.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="529.8" y="313.4" width="120.3" height="45.3" rx="6" fill="#fff6e6" stroke="#6b7280" stroke-width="1.2"/><text x="590.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">позачерговість →</tspan><tspan x="590.0" dy="14.3">можливі WAR/WAW</tspan></text>
<text x="450.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кожна машина, розв'язавши свою задачу, породжувала задачу для наступної</text>
</svg>