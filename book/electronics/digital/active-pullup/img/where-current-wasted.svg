<rect x="93.7" y="363.1" width="552.7" height="57.8" rx="6" fill="#eef1f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="370.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Стартова сила РІВНА — але резистор одразу починає вичахати (струм (VDD−V)/R</tspan><tspan x="370.0" dy="13.7">падає з ростом V), тож крива загинається вниз. Джерело тримає ту крутість весь час.</tspan><tspan x="370.0" dy="13.7">Пік резистора змарнований унизу, де V мала й поріг далеко; до VIH рампа приходить раніше.</tspan></text>
