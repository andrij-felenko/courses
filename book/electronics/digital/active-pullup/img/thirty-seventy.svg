<rect x="595.2" y="58.7" width="189.6" height="182.7" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.5"/><text x="690.0" y="78.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Чому 30% і 70%:</tspan><tspan x="690.0" dy="13.7"></tspan><tspan x="690.0" dy="13.7">• нижче 0.3·VDD ще «нуль»</tspan><tspan x="690.0" dy="13.7">   (запас від завад унизу)</tspan><tspan x="690.0" dy="13.7">• вище 0.7·VDD вже «одиниця»</tspan><tspan x="690.0" dy="13.7">   (запас від завад угорі)</tspan><tspan x="690.0" dy="13.7">• пласкі хвости кривої —</tspan><tspan x="690.0" dy="13.7">   поза вимірюванням</tspan><tspan x="690.0" dy="13.7"></tspan><tspan x="690.0" dy="13.7">Міряють чистий підйом</tspan><tspan x="690.0" dy="13.7">між порогами, а не</tspan><tspan x="690.0" dy="13.7">«розмазані» краї.</tspan></text>
