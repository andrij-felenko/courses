<text x="102.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">напруга «1»</text>
<line x1="110.0" y1="95.0" x2="690.0" y2="95.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="102.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">VDD</text>
<rect x="110.0" y="250.0" width="580.0" height="70.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/>
<line x1="110.0" y1="250.0" x2="690.0" y2="250.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="684.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end">поріг VIH приймача — нижче «1» не читається</text>
<line x1="110.0" y1="105.0" x2="620.0" y2="200.0" stroke="#27ae60" stroke-width="2.6"/>
