<text x="690.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">струм навантаження I →</text>
<line x1="110.0" y1="320.0" x2="110.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
