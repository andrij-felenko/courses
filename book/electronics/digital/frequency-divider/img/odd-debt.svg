<text x="430.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідеальна межа лежить на 2.5-му такті — між фронтами. Цілий поріг туди не стає.</text>
<text x="430.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Бракує рівно ПІВ такту. Саме його дає спадний фронт — ось звідки прийом «подвійного фронту».</text>
