<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="640" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">довжина циклу = порядок x</text>
<text x="320.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">а він мусить ділити 2⁴ − 1 = 15  (теорема Лагранжа)</text>
<rect x="90.0" y="300.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="125.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">1</tspan></text>
<text x="184.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">вироджений: x = 1</text>
<line x1="125.0" y1="300.0" x2="125.0" y2="274.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="234.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="125.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">3</tspan></text>
<text x="184.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">коротка петля</text>
<line x1="125.0" y1="234.0" x2="125.0" y2="208.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="168.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">5</tspan></text>
<text x="184.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">незвідний, та НЕ примітивний</text>
<line x1="125.0" y1="168.0" x2="125.0" y2="142.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="90.0" y="102.0" width="70.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="125.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">15</tspan></text>
<text x="184.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">примітивний — повний обхід</text>
<text x="125.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дозволені лише ці 4 значення</text>
<text x="46.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">порядок x</text>
</svg>