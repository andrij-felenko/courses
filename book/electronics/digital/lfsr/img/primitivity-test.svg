<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">перевірка примітивності — у два кроки</text>
<text x="190.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">x⁴ + x + 1</text>
<rect x="133.8" y="103.5" width="112.3" height="29.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. незвідний?</tspan></text>
<text x="190.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p(1)=1, не ділиться на</text>
<text x="190.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">x, x+1, x²+x+1  →  так</text>
<line x1="190.0" y1="175.0" x2="190.0" y2="196.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="122.7" y="205.5" width="134.6" height="29.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">2. порядок = 15?</tspan></text>
<text x="190.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">15/3 → x⁵ = x²+x ≠ 1  ✓</text>
<text x="190.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">15/5 → x³ = x³   ≠ 1  ✓</text>
<line x1="190.0" y1="286.0" x2="190.0" y2="308.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="132.3" y="309.9" width="115.5" height="52.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="331.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ПРИМІТИВНИЙ</tspan><tspan x="190.0" dy="18.2">цикл = 15</tspan></text>
<line x1="380.0" y1="60.0" x2="380.0" y2="380.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="560.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">x⁴+x³+x²+x+1</text>
<rect x="503.8" y="103.5" width="112.3" height="29.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">1. незвідний?</tspan></text>
<text x="560.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">теж незвідний  →  так</text>
<line x1="560.0" y1="165.0" x2="560.0" y2="196.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="492.7" y="205.5" width="134.6" height="29.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">2. порядок = 15?</tspan></text>
<text x="560.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">(x+1)·q = x⁵+1  →  x⁵ = 1</text>
<text x="560.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">кандидат 15/3 спрацював!</text>
<line x1="560.0" y1="286.0" x2="560.0" y2="308.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="489.2" y="309.9" width="141.5" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="331.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">НЕ примітивний</tspan><tspan x="560.0" dy="18.2">порядок = 5</tspan></text>
</svg>