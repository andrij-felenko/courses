<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Строга типізація: багатослівність в обмін на ранню ловлю помилок</text>
<text x="205.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">VHDL: строгий тип</text>
<rect x="40.0" y="70.0" width="330.0" height="71.8" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="52.0" y="91.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" xml:space="preserve">signal cnt : integer;</text><text x="52.0" y="107.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" xml:space="preserve">signal ln  : std_logic;</text><text x="52.0" y="122.9" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" xml:space="preserve">cnt &lt;= ln;   -- різні типи!</text>
<rect x="124.3" y="162.0" width="161.4" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="205.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">✗ КОМПІЛЯТОР СПИНЯЄ</tspan><tspan x="205.0" dy="15.6">ще до симуляції</tspan></text>
<text x="205.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">помилку видно за секунди, у себе на столі</text>
<text x="555.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Вільний тип (C, Verilog)</text>
<rect x="390.0" y="70.0" width="330.0" height="71.8" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="402.0" y="91.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" xml:space="preserve">reg [7:0] cnt;</text><text x="402.0" y="107.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" xml:space="preserve">wire      ln;</text><text x="402.0" y="122.9" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" xml:space="preserve">cnt = ln;   // мовчки зіллє</text>
<rect x="463.2" y="162.0" width="183.7" height="47.6" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.0"/><text x="555.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">⚠ ЗБИРАЄТЬСЯ мовчки</tspan><tspan x="555.0" dy="15.6">глюк випливе в кремнії</tspan></text>
<text x="555.0" y="229.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ловиш уже на платі — коштує днів</text>
</svg>