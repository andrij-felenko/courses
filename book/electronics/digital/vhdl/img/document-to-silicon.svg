<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спершу документ, симуляція й синтез — потім</text>
<line x1="50.0" y1="306.0" x2="770.0" y2="306.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="770.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">час →</text>
<rect x="40.0" y="66.0" width="220.0" height="168.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="2.2"/>
<text x="150.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ДОКУМЕНТ</text>
<line x1="60.0" y1="106.0" x2="240.0" y2="106.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">мета 1983:</tspan><tspan x="150.0" dy="14.7">точний паспорт</tspan><tspan x="150.0" dy="14.7">поведінки чужого</tspan><tspan x="150.0" dy="14.7">чипа — обов'язковий</tspan><tspan x="150.0" dy="14.7">за MIL-STD-454</tspan></text>
<line x1="150.0" y1="234.0" x2="150.0" y2="306.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="150.0" cy="306.0" r="5.0" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">записати</text>
<rect x="290.0" y="66.0" width="220.0" height="168.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="400.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">СИМУЛЯЦІЯ</text>
<line x1="310.0" y1="106.0" x2="490.0" y2="106.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="400.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">«так очевидно</tspan><tspan x="400.0" dy="14.7">приваблива» ідея:</tspan><tspan x="400.0" dy="14.7">раз записано</tspan><tspan x="400.0" dy="14.7">формально —</tspan><tspan x="400.0" dy="14.7">проганяй на ПК</tspan></text>
<line x1="400.0" y1="234.0" x2="400.0" y2="306.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="400.0" cy="306.0" r="5.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="400.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">проганяти</text>
<rect x="540.0" y="66.0" width="220.0" height="168.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="650.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">СИНТЕЗ</text>
<line x1="560.0" y1="106.0" x2="740.0" y2="106.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="650.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">перелом:</tspan><tspan x="650.0" dy="14.7">інструмент сам</tspan><tspan x="650.0" dy="14.7">будує з опису</tspan><tspan x="650.0" dy="14.7">схему вентилів</tspan><tspan x="650.0" dy="14.7">і тригерів</tspan></text>
<line x1="650.0" y1="234.0" x2="650.0" y2="306.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 4"/>
<circle cx="650.0" cy="306.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="650.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">будувати</text>
<line x1="262.0" y1="150.0" x2="288.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="275.0" dy="0.0">той самий</tspan><tspan x="275.0" dy="10.3">текст</tspan></text>
<line x1="512.0" y1="150.0" x2="538.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">той самий текст VHDL здобував уміння по черзі — будувати залізо навчився ОСТАННІМ</text>
</svg>