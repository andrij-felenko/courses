<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо постала VHDL: спочатку документ, а не креслення</text>
<rect x="283.3" y="121.0" width="213.4" height="57.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="390.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">один текст VHDL</tspan><tspan x="390.0" dy="16.9">(точний опис поведінки)</tspan></text>
<rect x="88.8" y="53.0" width="122.3" height="73.9" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ПАСПОРТ чипа</tspan><tspan x="150.0" dy="14.3">для військових:</tspan><tspan x="150.0" dy="14.3">що він робить,</tspan><tspan x="150.0" dy="14.3">однаково в усіх</tspan></text>
<line x1="150.0" y1="127.0" x2="277.3" y2="132.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">МЕТА 1980-х</text>
<rect x="558.6" y="53.0" width="142.8" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="630.0" y="72.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">СИМУЛЯТОР</tspan><tspan x="630.0" dy="14.3">читає той самий</tspan><tspan x="630.0" dy="14.3">текст — «проганяє»</tspan><tspan x="630.0" dy="14.3">поведінку</tspan></text>
<line x1="502.7" y1="132.0" x2="630.0" y2="127.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">приросло пізніше</text>
<rect x="572.3" y="213.1" width="115.5" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="630.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">СИНТЕЗАТОР</tspan><tspan x="630.0" dy="14.3">будує з тексту</tspan><tspan x="630.0" dy="14.3">справжню схему</tspan><tspan x="630.0" dy="14.3">вентилів</tspan></text>
<line x1="502.7" y1="168.0" x2="630.0" y2="213.1" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="300.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">приросло ще пізніше</text>
<text x="390.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">спершу — щоб ЗАПИСАТИ поведінку однозначно; будувати з опису навчилися вже потім</text>
</svg>