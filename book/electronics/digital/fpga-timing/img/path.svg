<text x="360.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">спільний такт: обидва тригери ловлять один фронт</text>
<rect x="71.0" y="245.3" width="578.0" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="264.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">За один період сигнал мусить вийти (t_cq), пройти логіку (t_logic) і встигнути на setup —</tspan><tspan x="360.0" dy="14.3">найдовший такий перегін у дизайні і є критичний шлях.</tspan></text>
