<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що обмежує частоту: шлях від тригера до тригера крізь логіку</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">між двома фронтами такту сигнал має встигнути вийти з регістра, пройти логіку й усістися на вході наступного (§3.3.8)</text>
<rect x="90.0" y="160.0" width="70.0" height="60.0" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="125.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">REG A</text>
<polyline points="94.0,214.0 99.0,208.0 99.0,214.0" fill="none" stroke="#1f47b5" stroke-width="1.4"/>
<text x="125.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">джерело</text>
<line x1="160.0" y1="190.0" x2="230.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="195.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">t_cq</text>
<rect x="230.0" y="160.0" width="360.0" height="60.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="410.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">комбінаційна логіка</text>
<text x="410.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(кілька LUT + дроти між ними)</text>
<line x1="590.0" y1="190.0" x2="660.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="625.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">t_logic</text>
<rect x="660.0" y="160.0" width="70.0" height="60.0" rx="4" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="695.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">REG B</text>
<polyline points="664.0,214.0 669.0,208.0 669.0,214.0" fill="none" stroke="#1f47b5" stroke-width="1.4"/>
<text x="695.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">приймач</text>
<line x1="125.0" y1="270.0" x2="695.0" y2="270.0" stroke="#c0271e" stroke-width="1.6" stroke-linecap="round"/>
<line x1="125.0" y1="270.0" x2="125.0" y2="224.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<line x1="695.0" y1="270.0" x2="695.0" y2="224.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<text x="410.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">спільний такт (clk): обидва тригери ловлять один фронт (§3.3.6)</text>
<text x="410.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">критичний шлях = t_cq + t_logic + t_setup</text>
<text x="410.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(найдовший такий шлях у всьому дизайні)</text>
<rect x="60.0" y="332.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один «крок» роботи FPGA — це політ сигналу від регістра до регістра: вийти (t_cq), пройти логіку (t_logic), устигнути (t_setup).</text>
<text x="450.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сума цих часів на НАЙДОВШОМУ такому шляху і є критичний шлях — він диктує, наскільки коротким може бути такт.</text>
</svg>
