  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Slack: запас (або борг) часу проти заданої цілі</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інструмент порівнює потрібний шлях із доступним періодом; різниця — slack: додатний = встигаємо, від'ємний = ні</text>
<text x="110.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ціль: такт 100 МГц → період 10 нс</text>
<line x1="150.0" y1="130.0" x2="710.0" y2="130.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<line x1="150.0" y1="124.0" x2="150.0" y2="136.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<line x1="710.0" y1="124.0" x2="710.0" y2="136.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<text x="720.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">10 нс</text>
<text x="110.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">шлях A = 8 нс</text>
<rect x="150.0" y="160.0" width="448.0" height="26.0" rx="4" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="374.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">логіка 8 нс</text>
<rect x="598.0" y="160.0" width="112.0" height="26.0" rx="4" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="654.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">+2 нс</text>
<text x="720.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">slack = +2 нс ✓</text>
<text x="110.0" y="245.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">шлях B = 12 нс</text>
<rect x="150.0" y="230.0" width="672.0" height="26.0" rx="4" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="486.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">логіка 12 нс (задовга!)</text>
<line x1="710.0" y1="224.0" x2="710.0" y2="262.0" stroke="#1b1b1b" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="720.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">slack = −2 нс ✗</text>
<text x="450.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Від'ємний slack означає: дизайн НЕ працюватиме на цій частоті — треба коротший шлях або нижчий такт.</text>
<rect x="60.0" y="314.0" width="780.0" height="66.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.7"/>
<text x="450.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Slack = період такту − потрібний час шляху. Додатний — є запас; рівно нуль — на межі; від'ємний — таймінг ПРОВАЛЕНО.</text>
<text x="450.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перший обов'язок після трасування — перевірити, що найгірший slack невід'ємний. Деталі розрахунку — у вставці 🧮 до §3.7.7.</text>
</svg>
