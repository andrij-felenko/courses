<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фіксувальні діоди GPIO: напругу тримають, струм ін'єкції — ні</text>
<line x1="95.0" y1="82.0" x2="575.0" y2="82.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="89.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">V_DD</text>
<line x1="95.0" y1="330.0" x2="575.0" y2="330.0" stroke="#2457d6" stroke-width="2.6"/>
<text x="89.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">V_SS</text>
<line x1="150.0" y1="206.0" x2="323.0" y2="206.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="150.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">чужий рівень</text>
<text x="150.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">+5 В на вхід</text>
<circle cx="335.0" cy="206.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="327.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">вивід GPIO</text>
<line x1="335.0" y1="206.0" x2="445.0" y2="206.0" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M445.0 176.0 L445.0 236.0 L503.0 206.0 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="461.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вентиль</text>
<text x="475.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">внутрішня логіка</text>
<line x1="335.0" y1="206.0" x2="335.0" y2="124.0" stroke="#c0392b" stroke-width="2.6"/>
<path d="M326.0 145.0 L344.0 145.0 L335.0 127.0 Z" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<line x1="326.0" y1="127.0" x2="344.0" y2="127.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="335.0" y1="124.0" x2="335.0" y2="82.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="355.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">відкритий:</text>
<text x="355.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">вхід &gt; V_DD + 0.6 В</text>
<text x="355.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">→ струм ін'єкції в шину</text>
<line x1="335.0" y1="206.0" x2="335.0" y2="288.0" stroke="#6b7280" stroke-width="2.0"/>
<path d="M326.0 285.0 L344.0 285.0 L335.0 267.0 Z" fill="none" stroke="#6b7280" stroke-width="2.0"/>
<line x1="326.0" y1="267.0" x2="344.0" y2="267.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="335.0" y1="288.0" x2="335.0" y2="330.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="355.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">закритий</text>
<line x1="345.0" y1="68.0" x2="545.0" y2="68.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="455.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">струм ін'єкції I_inj</text>
<rect x="40.0" y="366.0" width="640.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Поки сигнал між шинами — обидва діоди закриті. Виліз вище V_DD — верхній діод</tspan><tspan x="360.0" dy="15.6">відкривається й тримає напругу, але крізь нього тече струм ін'єкції. Діод обмежує</tspan><tspan x="360.0" dy="15.6">напругу, а не струм: цей струм і треба тримати послідовним резистором.</tspan></text>
</svg>