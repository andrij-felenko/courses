<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розряд статики: HBM повільний і широкий, CDM — блискавичний</text>
<line x1="110.0" y1="320.0" x2="650.0" y2="320.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="320.0" x2="110.0" y2="80.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">час (нс)</text>
<text x="98.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">струм розряду</text>
<polyline points="110.0,320.0 170.0,200.0 240.0,228.0 370.0,265.0 540.0,298.0 640.0,312.0" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="410.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">HBM — модель тіла людини</text>
<text x="410.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">фронт ~ нс, спад ~160 нс</text>
<text x="410.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">100 пФ · 1.5 кОм, до кількох кВ</text>
<polyline points="110.0,320.0 120.0,92.0 132.0,280.0 144.0,310.0 156.0,320.0" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<text x="170.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">CDM — модель зарядженого пристрою</text>
<text x="170.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">фронт &lt; 0.4 нс, пік десятки А</text>
<text x="170.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">мала послідовна індуктивність → блискавично</text>
<rect x="40.0" y="350.0" width="640.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Той самий заряд, різна форма. HBM (палець людини) — нижчий, ширший імпульс; TVS устигає зреагувати.</tspan><tspan x="360.0" dy="14.3">CDM (заряджена сама плата) — блискавичний і високий; вартовий мусить стояти просто коло виводу.</tspan></text>
</svg>