<rect x="150.0" y="296.0" width="580.0" height="34.0" rx="8" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="440.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тиснемо — пари зчіпаються; відпускаємо — розходяться. Між дотиками контакт «дзвенить».</text>
