<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Антибрязкіт у коді: три підходи до того самого</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">усі вважають пачку дрижань за одну подію — лише міряють «устоявся» по-різному</text>
<rect x="35.0" y="78.0" width="250.0" height="168.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Лічильник</text>
<text x="160.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">рахуй однакові відліки</tspan><tspan x="160.0" dy="14.9">поспіль; набралось N —</tspan><tspan x="160.0" dy="14.9">рівень устояв, приймай</tspan></text>
<line x1="53.0" y1="210.0" x2="267.0" y2="210.0" stroke="#d6dde6" stroke-width="1.2"/>
<text x="160.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">тримає: число відліків</text>
<rect x="325.0" y="78.0" width="250.0" height="168.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Мітка часу</text>
<text x="450.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">запам'ятай час зміни;</tspan><tspan x="450.0" dy="14.9">не чіпай рівень, поки</tspan><tspan x="450.0" dy="14.9">не мине вікно T</tspan></text>
<line x1="343.0" y1="210.0" x2="557.0" y2="210.0" stroke="#d6dde6" stroke-width="1.2"/>
<text x="450.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">тримає: час останньої зміни</text>
<rect x="615.0" y="78.0" width="250.0" height="168.0" rx="12" fill="#fbf3e0" stroke="#b8860b" stroke-width="2.0"/>
<text x="740.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">Автомат станів</text>
<text x="740.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">явні стани: стабільний →</tspan><tspan x="740.0" dy="14.9">під підозрою → знову</tspan><tspan x="740.0" dy="14.9">стабільний; решта — там само</tspan></text>
<line x1="633.0" y1="210.0" x2="847.0" y2="210.0" stroke="#d6dde6" stroke-width="1.2"/>
<text x="740.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">тримає: стан + час</text>
<text x="450.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простіше — лічильник; не блокує цикл — мітка часу; найнадійніше — автомат.</text>
</svg>