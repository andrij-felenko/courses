<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пороги 0.8 і 2.0 висять симетрично від точки 1.4 В</text>
<rect x="267.0" y="60.0" width="66.0" height="240.0" rx="6" fill="#e5e7eb" stroke="#333333" stroke-width="1.2"/>
<rect x="267.0" y="226.2" width="66.0" height="73.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
<rect x="267.0" y="60.0" width="66.0" height="55.4" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.4"/>
<rect x="267.0" y="115.4" width="66.0" height="110.8" rx="6" fill="#fde2e1" stroke="#c0392b" stroke-width="1.2"/>
<line x1="227.0" y1="170.8" x2="363.0" y2="170.8" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="5,3"/>
<text x="369.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1.4 В = 2 × 0.7 (точка перемикання)</text>
<text x="369.0" y="119.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">VIH = 2.0  (поріг «1»)</text>
<text x="369.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">VIL = 0.8  (поріг «0»)</text>
<line x1="251.0" y1="170.8" x2="251.0" y2="115.4" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="245.0" y="147.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">+0.6</text>
<line x1="251.0" y1="170.8" x2="251.0" y2="226.2" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="245.0" y="202.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">−0.6</text>
<text x="300.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">«1»</text>
<text x="300.0" y="267.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">«0»</text>
<text x="330.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Від точки перемикання ~1.4 В відклали однаковий запас угору і вниз — так і вийшла пара 2.0 / 0.8.</text>
</svg>