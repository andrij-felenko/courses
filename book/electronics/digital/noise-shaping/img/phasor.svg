<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться |1 − z⁻¹| = 2·sin(ω/2): різниця двох векторів на колі</text>
<text x="380.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на частоті ω множник (1 − z⁻¹) — це відрізок між точками 1 та e^{−jω} одиничного кола</text>
<circle cx="250.0" cy="250.0" r="150.0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="70.0" y1="250.0" x2="434.0" y2="250.0" stroke="#cfd6de" stroke-width="1.0"/>
<line x1="250.0" y1="70.0" x2="250.0" y2="430.0" stroke="#cfd6de" stroke-width="1.0"/>
<text x="440.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Re</text>
<text x="258.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Im</text>
<line x1="250.0" y1="250.0" x2="400.0" y2="250.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="410.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">1</text>
<line x1="250.0" y1="250.0" x2="329.5" y2="377.2" stroke="#b8860b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="341.5" y="393.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="start" font-weight="700">z⁻¹ = e⁻ʲω</text>
<path d="M294.0 250.0 A44.0 44.0 0 0 1 273.3 287.3" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="310.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">ω</text>
<line x1="400.0" y1="250.0" x2="329.5" y2="377.2" stroke="#c0392b" stroke-width="3.0"/>
<text x="378.7" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">1 − z⁻¹</text>
<text x="378.7" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">довжина = 2·sin(ω/2)</text>
<text x="468.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Відрізок між двома точками</text>
<text x="468.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">одиничного кола, розведеними</text>
<text x="468.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">на кут ω, має довжину рівно</text>
<text x="468.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2·sin(ω/2).</text>
<text x="468.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ω → 0  (низька частота):</text>
<text x="468.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">хорда → 0, шум гаситься.</text>
<text x="468.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ω → π  (fₛ/2):</text>
<text x="468.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">хорда → 2, шум удвічі вищий.</text>
<rect x="30.0" y="402.0" width="700.0" height="52.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="424.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Ось геометричний корінь усього: один доданок «мінус минула помилка» перетворює пропуск шуму</tspan><tspan x="380.0" dy="15.6">на хорду 2·sin(ω/2) — нуль коло DC, максимум коло fₛ/2. Звідси й нахил спектра шуму вгору.</tspan></text>
</svg>