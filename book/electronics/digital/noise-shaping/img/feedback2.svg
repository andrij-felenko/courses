<text x="486.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<line x1="250.0" y1="150.0" x2="250.0" y2="246.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,4"/>
