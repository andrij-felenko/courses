<rect x="560.0" y="212.0" width="288.0" height="68.0" rx="6" fill="#f0fff0" stroke="#27ae60" stroke-width="1.5"/><text x="704.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="704.0" dy="0.0">У коді: спершу e2 ← e1, тоді e1 ← e[n].</tspan><tspan x="704.0" dy="13.0">Поправка входу = 2·e1 − e2. Два рядки стану.</tspan></text>
