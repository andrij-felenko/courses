<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формувач другого порядку: дві комірки памʼяті помилки</text>
<text x="430.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у вхід повертаємо 2·e[n−1] − e[n−2] — рівно розкриті дужки (1 − z⁻¹)²; це прямо лягає на код</text>
<text x="30.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вхід x[n]</text>
