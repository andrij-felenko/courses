<text x="351.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">помилка квантування e[n]</text>
<rect x="100.4" y="222.0" width="99.2" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="150.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Фільтр H(z)</tspan></text>
<line x1="432.0" y1="240.0" x2="199.6" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
