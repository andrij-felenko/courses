<circle cx="140.0" cy="150.0" r="22.0" fill="#fff7e6" stroke="#b8860b" stroke-width="2.0"/>
<text x="140.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#b8860b" text-anchor="middle" font-weight="700">+</text>
<line x1="162.0" y1="150.0" x2="250.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="255.5" y="116.4" width="112.9" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="312.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="312.0" dy="0.0">Квантувач</tspan><tspan x="312.0" dy="15.6">(відкидає</tspan><tspan x="312.0" dy="15.6">молодші біти)</tspan></text>
<line x1="368.5" y1="150.0" x2="470.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
