<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повна потужність шуму та сама — змінюється лише її РОЗКЛАД</text>
<text x="380.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">формування не прибирає шум, а пересипає його зі смуги сигналу нагору, де він нешкідливий</text>
<rect x="150.0" y="90.0" width="150.0" height="133.0" rx="4" fill="#e9edf2" stroke="#cfd6de" stroke-width="1.2"/>
<rect x="150.0" y="223.0" width="150.0" height="57.0" rx="4" fill="#f6c9c0" stroke="#c0392b" stroke-width="1.4"/>
<line x1="144.0" y1="280.0" x2="306.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="225.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівний шум</text>
<rect x="470.0" y="91.0" width="150.0" height="178.0" rx="4" fill="#e9edf2" stroke="#cfd6de" stroke-width="1.2"/>
<rect x="470.0" y="269.0" width="150.0" height="11.0" rx="4" fill="#d8f3e2" stroke="#27ae60" stroke-width="1.4"/>
<line x1="464.0" y1="280.0" x2="626.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="545.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сформований шум</text>
<text x="314.0" y="251.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">у смузі</text>
<text x="314.0" y="265.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">(шкідливо)</text>
<text x="634.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">у смузі — мало</text>
<text x="634.0" y="179.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">решта — нагорі</text>
<text x="634.0" y="193.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">(зріжемо)</text>
<line x1="126.0" y1="280.0" x2="126.0" y2="90.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="120.0" y1="280.0" x2="132.0" y2="280.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="120.0" y1="90.0" x2="132.0" y2="90.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="80.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">та сама</text>
<text x="80.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повна</text>
<text x="80.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">площа</text>
</svg>