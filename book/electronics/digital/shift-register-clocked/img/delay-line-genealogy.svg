<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна ідея «затримати на такт» — крізь чотири носії</text>
<rect x="60.0" y="66.0" width="660.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.4"/>
<rect x="60.0" y="66.0" width="84.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="102.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1943</text>
<text x="102.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рік</text>
<text x="164.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Ртутна акустична лінія</text>
<text x="164.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="164.0" dy="0.0">звукова хвиля біжить</tspan><tspan x="164.0" dy="14.4">стовпом ртуті ~1.45 мм/мкс</tspan></text>
<text x="706.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Шоклі · Еккерт · Моклі</text>
<line x1="390.0" y1="164.0" x2="390.0" y2="182.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="184.0" width="660.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.4"/>
<rect x="60.0" y="184.0" width="84.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="102.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1950-і</text>
<text x="102.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рік</text>
<text x="164.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Магнітострикційний дріт</text>
<text x="164.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="164.0" dy="0.0">крутильна хвиля біжить</tspan><tspan x="164.0" dy="14.4">сталевим/нікелевим дротом</tspan></text>
<text x="706.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">калькулятори: Olivetti P101</text>
<line x1="390.0" y1="282.0" x2="390.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="302.0" width="660.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.4"/>
<rect x="60.0" y="302.0" width="84.0" height="96.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="102.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">1969</text>
<text x="102.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рік</text>
<text x="164.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Ківшовий ланцюг (BBD)</text>
<text x="164.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="164.0" dy="0.0">заряд перекочується</tspan><tspan x="164.0" dy="14.4">з ємності в ємність по такту</tspan></text>
<text x="706.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Санґстер · Теер (Philips)</text>
<line x1="390.0" y1="400.0" x2="390.0" y2="418.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="420.0" width="660.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="60.0" y="420.0" width="84.0" height="96.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="102.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1970-і</text>
<text x="102.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рік</text>
<text x="164.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Тактований зсувний регістр / CCD</text>
<text x="164.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="164.0" dy="0.0">біт стоїть у тригері,</tspan><tspan x="164.0" dy="14.4">на фронті стрибає до сусіда</tspan></text>
<text x="706.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Бойл · Сміт (CCD, Bell)</text>
<rect x="125.1" y="529.6" width="529.9" height="52.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="552.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Носій щоразу інший — ртуть, дріт, ланцюг ємностей, кремнієвий тригер, —</tspan><tspan x="390.0" dy="16.2">а дія та сама: затримати сигнал рівно на один такт і передати далі.</tspan></text>
</svg>