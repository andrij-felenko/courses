<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема «гонитви по колу»: чому JK будують по фронту, а не по рівню</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">поки такт високий і J=K=1, майстер-слейв не рятує «прозорий» тригер: вихід перекидається знову й знову</text>
<text x="96.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">такт</text>
<line x1="130.0" y1="130.0" x2="850.0" y2="130.0" stroke="#e4e4e4" stroke-width="1.0"/>
<polyline points="130,130 260,130 260,96 620,96 620,130 850,130" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="260.0" y1="92.0" x2="260.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="620.0" y1="92.0" x2="620.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="440.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">такт високий увесь цей час, J=K=1</text>
<text x="96.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">J=K</text>
<line x1="130.0" y1="212.0" x2="850.0" y2="212.0" stroke="#e4e4e4" stroke-width="1.0"/>
<polyline points="130,212 130,180 850,180" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<text x="96.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">Q</text>
<line x1="130.0" y1="304.0" x2="850.0" y2="304.0" stroke="#e4e4e4" stroke-width="1.0"/>
<polyline points="130,304 260,304 260,272 320,272 320,304 380,304 380,272 440,272 440,304 500,304 500,272 560,272 560,304 620,304 620,272 850,272" fill="none" stroke="#27ae60" stroke-width="2.4"/>
<text x="440.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Q скаче туди-сюди — скільки встигне за час імпульсу</text>
<rect x="150.0" y="318.0" width="620.0" height="52.0" rx="10" fill="#fdf0ea" stroke="#c0392b" stroke-width="1.6"/><text x="460.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">«гонитва по колу» (race-around): вихід біжить назад на вхід і за широкий</tspan><tspan x="460.0" dy="14.3">рівень такту перекидається кілька разів — кінцевий стан невизначений.</tspan><tspan x="460.0" dy="14.3">Лік: захоплення по ФРОНТУ (справжній edge-тригер)</tspan></text>
</svg>