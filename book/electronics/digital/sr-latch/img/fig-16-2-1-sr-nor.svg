<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SR-засувка: два NOR навхрест із керувальними входами S і R</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">S (set) ставить Q=1, R (reset) ставить Q=0, а S=R=0 — «тримати» (це і є пам'ять)</text>
