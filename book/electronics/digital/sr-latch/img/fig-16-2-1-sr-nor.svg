<text x="600.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">→ — заборона</text>
<text x="560.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">S=R=0 → пам'ять: Q лишається таким, як був</text>
