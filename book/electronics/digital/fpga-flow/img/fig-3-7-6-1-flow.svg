<text x="450.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Аналогія з софтом: синтез ≈ «компіляція», а розміщення+трасування — суто апаратні кроки, яких у софті немає.</text>
<text x="450.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перші два схожі на компілятор; останні два — це фізичне «вкладання» схеми в конкретний кристал.</text>
