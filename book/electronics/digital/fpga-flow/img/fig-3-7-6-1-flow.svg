<text x="619.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">прокласти дроти</text>
<text x="619.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">крізь перемикачі</text>
<line x1="694.0" y1="155.0" x2="712.0" y2="155.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
