<text x="190.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Інтерференційні смуги (fringe pattern)</text>
<text x="230.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Задача розгортання: відновити неперервний профіль φ = ψ + 2π·k</text>
<rect x="470.0" y="50.0" width="470.0" height="405.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="705.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0"></tspan></text>
<text x="705.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Сингулярні залишки та розрізи (Branch Cuts)</text>
<text x="705.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Теорема про контурний інтеграл: ∮ ∇ψ · dr = 2π · q (q ∈ {−1, 0, +1})</text>
