<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фазове розгортання (Phase Unwrapping) та сингулярні залишки (Residues)</text>
<rect x="20.0" y="50.0" width="420.0" height="405.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="230.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0"></tspan></text>
<text x="230.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Згортання фази за модулем 2π</text>
<text x="230.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Інтерферограма фіксує лише ψ = W(φ) ∈ [−π, +π)</text>
<line x1="50.0" y1="240.0" x2="400.0" y2="240.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="50.0" y1="160.0" x2="400.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
