<text x="705.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Гольдштейна з'єднує заряди розрізами</text>
