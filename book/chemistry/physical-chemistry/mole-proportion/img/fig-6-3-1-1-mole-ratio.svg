<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
</defs>
<rect width="940" height="320" fill="white"/>
<text x="470" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">коефіцієнти рівняння — це відношення молів</text>
<text x="470" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle" font-weight="bold" fill="#222">2H₂  +  O₂  →  2H₂O</text>
<text x="150" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#2f6f9e">2 молі</text>
<text x="360" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#a83c30">1 моль</text>
<text x="640" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#2f7d4f">2 молі</text>
<rect x="180" y="190" width="580" height="100" rx="10" fill="#f7fafc" stroke="#9fb4c0" stroke-width="1.4"/>
<text x="470" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#666">читаємо як рецепт у молях:</text>
<text x="470" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="bold" fill="#1f6f9e">на 1 моль O₂ припадає 2 молі H₂O</text>
<text x="470" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#2f7d4f">тож із 2 молів O₂ вийде 2 · 2 = 4 молі H₂O</text>
</svg>
