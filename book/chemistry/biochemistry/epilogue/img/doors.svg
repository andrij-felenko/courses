<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="450.0" y="42.0" width="450.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому на поличці саме 2, потім 8?</text>
<text x="675.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">квантова й комп'ютерна хімія</text>
<rect x="450.0" y="138.0" width="450.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Яка молекула на вигляд?</text>
<text x="675.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">органічний синтез, фармація</text>
<rect x="450.0" y="234.0" width="450.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому реакція взагалі йде?</text>
<text x="675.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">термодинаміка</text>
<rect x="450.0" y="330.0" width="450.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що всередині ядра?</text>
<text x="675.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">радіохімія</text>
<rect x="450.0" y="426.0" width="450.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як молекули складаються в живе?</text>
<text x="675.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">біохімія, молекулярна біологія</text>
<rect x="35.0" y="241.4" width="250.0" height="59.1" rx="6" fill="#e8f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="160.0" y="265.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Те, що ти вже</tspan><tspan x="160.0" dy="22.1">розумієш</tspan></text>
