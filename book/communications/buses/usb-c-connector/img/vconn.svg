<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незадіяний CC: Rd, Ra чи VCONN</text>
<rect x="40.0" y="60.0" width="300.0" height="110.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="190.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Активний CC</text>
<text x="190.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Rd ≈ 5.1 кОм → є приймач</text>
<text x="190.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">по цій лінії піде узгодження</text>
<text x="190.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">і, далі, дані-конфігурація</text>
<text x="530.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Другий CC — що там?</text>
<rect x="380.0" y="64.0" width="300.0" height="56.0" rx="6" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="390.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Ra ≈ 0.8–1.2 кОм</text>
<text x="390.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">кабель з маркером → подати VCONN</text>
<rect x="380.0" y="130.0" width="300.0" height="56.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/>
<text x="390.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">нічого (висить)</text>
<text x="390.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">пасивний кабель → VCONN не треба</text>
<rect x="380.0" y="196.0" width="300.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="390.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ще один Rd</text>
<text x="390.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">приймач у безпровідній орієнтації</text>
<line x1="340.0" y1="115.0" x2="378.0" y2="92.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="270.0" width="640.0" height="44.0" rx="6" fill="#f7faf8" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="295.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Той самий контакт буває лінією конфігурації або живленням кабелю VCONN — вирішує, який резистор на ньому знайдено.</tspan></text>
</svg>