<text x="360.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для прошивки ESP32 по USB 2.0 досить VBUS, GND, D+/D− і Rd на CC.</text>
<text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Швидкі пари, SBU і VCONN лишаються незадіяними.</text>
