<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм зависання шини I2C та процедура відновлення 9 тактами</text>
<rect x="30.0" y="55.0" width="360.0" height="270.0" rx="6" fill="#fdecea" stroke="#d9534f" stroke-width="1.8"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9534f" text-anchor="middle" font-weight="700">Аварія: зависання шини (Bus Lockup)</text>
<text x="210.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Ведучий читав байт із веденого.</tspan><tspan x="210.0" dy="13.1">2. Ведений виставив біт '0' (притягнув SDA до GND).</tspan><tspan x="210.0" dy="13.1">3. Ведучий скинувся (Watchdog / Brownout / Reset).</tspan><tspan x="210.0" dy="13.1">4. Після перезавантаження ведучий бачить SDA=LOW.</tspan><tspan x="210.0" dy="13.1">5. Ведучий не може згенерувати START (потрібен SDA=HIGH).</tspan><tspan x="210.0" dy="13.1">6. Ведений вічно чекає такту SCL від ведучого.</tspan></text>
<line x1="40.0" y1="275.0" x2="380.0" y2="275.0" stroke="#d9534f" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="210.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9534f" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ: Шина мертва для всіх пристроїв</text>
<rect x="420.0" y="55.0" width="390.0" height="270.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="615.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Процедура скидання (9-Clock Recovery)</text>
<text x="615.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">1. Перевести піни SCL і SDA в режим GPIO Open-Drain.</tspan><tspan x="615.0" dy="12.8">2. Якщо SDA == 0, подати до 9 імпульсів на лінію SCL.</tspan><tspan x="615.0" dy="12.8">3. Ведений дочитує внутрішній байт і відпускає SDA.</tspan><tspan x="615.0" dy="12.8">4. Щойно SDA == 1, сформувати сигнал STOP.</tspan><tspan x="615.0" dy="12.8">5. Повторно ініціалізувати апаратний блок I2C.</tspan></text>
<text x="440.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">SCL:</text>
<polyline points="475.0,230.0 485.0,214.0 495.0,230.0 505.0,214.0 515.0,230.0 525.0,214.0 535.0,230.0 545.0,214.0 555.0,230.0 590.0,230.0" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<text x="515.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">9 тактів SCL</text>
<text x="440.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">SDA:</text>
<polyline points="475.0,275.0 545.0,275.0 555.0,259.0 590.0,259.0 595.0,275.0 615.0,275.0 620.0,259.0" fill="none" stroke="#2457d6" stroke-width="1.8"/>
<text x="560.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">Ведений відпустив SDA</text>
<text x="640.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">STOP</text>
<text x="420.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">9 тактів гарантують вихід веденого з поточного байтового вікна без апаратного скидання живлення</text>
</svg>