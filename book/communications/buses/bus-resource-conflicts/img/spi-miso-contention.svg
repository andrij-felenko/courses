<text x="420.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Два двотактні виходи на одній лінії закорочують живлення на землю через внутрішні транзистори</text>
