<text x="76.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Фізична частота перемикання станів на дроті (тактові імпульси/с)</text>
<rect x="680.0" y="73.0" width="128.0" height="32.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
<text x="744.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">125 Мбод</text>
