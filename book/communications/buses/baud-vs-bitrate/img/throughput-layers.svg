<line x1="440.0" y1="293.0" x2="440.0" y2="305.0" stroke="#333333" stroke-width="1.5"/>
<line x1="437.0" y1="302.0" x2="440.0" y2="305.0" stroke="#333333" stroke-width="1.5"/>
<line x1="443.0" y1="302.0" x2="440.0" y2="305.0" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="305.0" width="760.0" height="48.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="76.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Корисний бітрейт застосунку (Goodput)</text>
<text x="76.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Чисті корисні байти після відкидання заголовків Ethernet, IP, TCP і пауз IFG</text>
<rect x="680.0" y="313.0" width="128.0" height="32.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="744.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">158.2 Мбіт/с</text>
<text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Бодова швидкість задає фізику передачі на дроті; корисний бітрейт (Goodput) визначається математикою кодування та протоколами</text>
</svg>