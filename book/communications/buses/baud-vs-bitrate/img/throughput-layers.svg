<text x="76.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Нетто-бітрейт каналу (Net Coded Bitrate, R_net)</text>
<text x="76.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Вирахування завадостійкого кодування FEC (кодова швидкість R = 5/6 або LDPC)</text>
