<text x="76.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Вирахування надлишковості лінійного кодування (наприклад, 8b/10b забирає 20%)</text>
