<text x="76.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Множення на k = 2 біти/символ (4-PAM модуляція, 4 рівні напруги)</text>
