<rect x="129.6" y="402.5" width="640.7" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="421.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Пристрій віддає дані лише у відповідь на адресований йому токен; підтвердження закриває транзакцію.</tspan></text>
