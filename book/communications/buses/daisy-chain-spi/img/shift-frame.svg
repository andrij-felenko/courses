<text x="410.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Порядок надсилання байтів ведучим: [ Байт для IC3 ] → [ Байт для IC2 ] → [ Байт для IC1 ]</text>
