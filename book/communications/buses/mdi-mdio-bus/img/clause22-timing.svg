<text x="30.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">MAC формує всі поля від PRE до DATA включно. TA = «10» утримується ведучим.</text>
<line x1="30.0" y1="135.0" x2="730.0" y2="135.0" stroke="#e5e7e9" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="30.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Кадр читання (Read Frame, Opcode = 10):</text>
