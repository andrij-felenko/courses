<text x="380.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура та часові діаграми кадрів IEEE 802.3 Clause 22 (Read / Write)</text>
