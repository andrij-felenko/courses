<text x="189.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ST</text>
<text x="189.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">01</text>
<rect x="208.0" y="168.0" width="38.0" height="32.0" rx="3" fill="#aed6f1" stroke="#333333" stroke-width="1.2"/>
<text x="227.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">OP</text>
<text x="227.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">10</text>
<rect x="246.0" y="168.0" width="65.0" height="32.0" rx="3" fill="#d4efdf" stroke="#333333" stroke-width="1.2"/>
<text x="278.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">PHYAD</text>
<text x="278.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">A4..A0</text>
<rect x="311.0" y="168.0" width="65.0" height="32.0" rx="3" fill="#fdebd0" stroke="#333333" stroke-width="1.2"/>
<text x="343.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">REGAD</text>
<text x="343.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R4..R0</text>
<rect x="376.0" y="168.0" width="40.0" height="32.0" rx="3" fill="#f9e79f" stroke="#333333" stroke-width="1.2"/>
<text x="396.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">TA</text>
<text x="396.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Z0</text>
<rect x="416.0" y="168.0" width="175.0" height="32.0" rx="3" fill="#d5f5e3" stroke="#333333" stroke-width="1.2"/>
<text x="503.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">DATA (16 бітів)</text>
<text x="503.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D15 .. D0 (від PHY до MAC)</text>
<rect x="591.0" y="168.0" width="45.0" height="32.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="613.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">IDLE</text>
<text x="613.5" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Hi-Z</text>
<rect x="131.7" y="238.1" width="496.5" height="73.9" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="380.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Механізм перемикання лінії Turnaround (TA) під час читання:</tspan><tspan x="380.0" dy="14.3">• 1-й такт (Z): MAC відпускає лінію в Hi-Z; підтяжка тримає високий рівень</tspan><tspan x="380.0" dy="14.3">• 2-й такт (0): PHY перехоплює шину і притискає MDIO до нуля (підтвердження)</tspan><tspan x="380.0" dy="14.3">• Далі PHY передає 16 біт даних D15..D0, синхронізуючись за тактами MDC</tspan></text>
<text x="200.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Керує MAC (Ведучий)</text>
<line x1="200.0" y1="370.0" x2="350.0" y2="370.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Керує PHY (Ведений)</text>
<line x1="430.0" y1="370.0" x2="580.0" y2="370.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>