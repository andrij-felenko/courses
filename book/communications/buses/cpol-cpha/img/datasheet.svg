<text x="280.5" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">погляд 2: на якому фронті стрілка вибірки → CPHA</text>
