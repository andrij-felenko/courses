<rect x="60.0" y="286.0" width="640.0" height="60.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="380.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигнал біжить ~15 см/нс; при 50 МГц біт триває лише 20 нс.</text>
<text x="380.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Уже метр кабелю зсуває фронт на третину біта — і вибірка влучає в перехід.</text>
