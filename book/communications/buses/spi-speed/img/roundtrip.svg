<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Затримка туди-назад: чому MISO спізнюється</text>
<rect x="80.0" y="130.0" width="130.0" height="90.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="145.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ВЕДУЧИЙ</text>
<rect x="550.0" y="130.0" width="130.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="615.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВЕДЕНИЙ</text>
<line x1="210.0" y1="150.0" x2="550.0" y2="150.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1) фронт SCK летить туди (затримка t)</text>
<line x1="550.0" y1="196.0" x2="210.0" y2="196.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2) ведений жене MISO, вона летить назад (ще t)</text>
<text x="380.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">разом ≈ 2t, перш ніж ведучий зможе зняти MISO</text>
<rect x="60.0" y="268.0" width="640.0" height="62.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="380.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">На високій частоті 2t стає сумірним із бітом — і MISO не встигає усталитися до вибірки.</text>
<text x="380.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Це окрема, ще жорсткіша межа на «швидко + далеко», ніж простий перекіс.</text>
</svg>