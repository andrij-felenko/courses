<text x="670.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">дві протифазні лінії: завада однакова на обох → гаситься</text>
<rect x="60.0" y="252.0" width="780.0" height="90.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="450.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SPI — однополюсний і неузгоджений: чудово на короткій платі, погано на метрах кабелю.</text>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Для довгих відстаней беруть диференційні шини (RS-485 тощо), де завада гаситься різницею.</text>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Висновок: SPI житель ПЛАТИ — між сусідніми чіпами, а не між приладами через кабель.</text>
</svg>
