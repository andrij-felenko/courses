<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SPI однополюсний і без узгодження → не для довгих ліній</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сигнали міряються відносно спільної землі й нічим не «гасяться»; на довгому дроті — відбиття й завади</text>
<text x="250.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">однополюсний (SPI)</text>
