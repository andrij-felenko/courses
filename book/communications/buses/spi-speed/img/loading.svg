<rect x="60.0" y="252.0" width="640.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="380.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен пристрій і кожен сантиметр доріжки додають ємність C; час фронту ~ R·C росте.</text>
<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Тому навіть на платі гранична частота падає з довжиною ліній і числом ведених.</text>
<text x="380.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Практично: коротші доріжки й менше навантаження — вища доступна частота.</text>
</svg>