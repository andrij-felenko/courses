<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ємнісне навантаження тисне на швидкість</text>
<text x="210.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">мала ємність — фронт різкий</text>
<line x1="110.0" y1="200.0" x2="200.0" y2="200.0" stroke="#27ae60" stroke-width="2.8"/>
<line x1="200.0" y1="200.0" x2="200.0" y2="130.0" stroke="#27ae60" stroke-width="2.8"/>
<line x1="200.0" y1="130.0" x2="320.0" y2="130.0" stroke="#27ae60" stroke-width="2.8"/>
<text x="210.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">встигає за швидким тактом</text>
<text x="560.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">велика ємність — фронт завалений</text>
<polyline points="460.0,200.0 505.0,200.0 505.0,200.0 508.3,195.2 511.7,190.7 515.0,186.6 518.3,182.7 521.7,179.1 525.0,175.7 528.3,172.6 531.7,169.6 535.0,166.9 538.3,164.4 541.7,162.0 545.0,159.8 548.3,157.8 551.7,155.9 555.0,154.1 558.3,152.4 561.7,150.9 565.0,149.5 568.3,148.1 571.7,146.9 575.0,145.7 578.3,144.6 581.7,143.6 585.0,142.7 588.3,141.8 591.7,141.0 595.0,140.3 598.3,139.6 601.7,138.9 605.0,138.3 608.3,137.7 611.7,137.2 615.0,136.7 618.3,136.2 621.7,135.8 625.0,135.4 628.3,135.0 631.7,134.7 635.0,134.4 638.3,134.1 641.7,133.8 645.0,133.5 648.3,133.3 651.7,133.1 655.0,132.9" fill="none" stroke="#c0392b" stroke-width="2.8"/>
