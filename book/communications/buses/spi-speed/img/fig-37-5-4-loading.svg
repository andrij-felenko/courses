  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ємнісне навантаження теж тисне на швидкість</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">довгі доріжки й багато пристроїв додають ємність; навіть двотактний вихід заряджає її не миттєво</text>
<text x="230.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">мала ємність — фронт різкий</text>
<line x1="90.0" y1="180.0" x2="118.0" y2="180.0" stroke="#1f8a3b" stroke-width="2.8" stroke-linecap="round"/>
<line x1="118.0" y1="130.0" x2="118.0" y2="180.0" stroke="#1f8a3b" stroke-width="2.8" stroke-linecap="round"/>
<line x1="118.0" y1="130.0" x2="216.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.8" stroke-linecap="round"/>
<text x="670.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">велика ємність — фронт «завалений»</text>
<line x1="530.0" y1="180.0" x2="558.0" y2="180.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 558.0,180.0 L 561.3,175.8 L 564.5,172.0 L 567.8,168.6 L 571.1,165.4 L 574.3,162.4 L 577.6,159.7 L 580.9,157.3 L 584.1,155.0 L 587.4,152.9 L 590.7,151.0 L 593.9,149.3 L 597.2,147.7 L 600.5,146.2 L 603.7,144.9 L 607.0,143.6 L 610.3,142.5 L 613.5,141.5 L 616.8,140.5 L 620.1,139.6 L 623.3,138.8 L 626.6,138.1 L 629.9,137.4 L 633.1,136.8 L 636.4,136.2 L 639.7,135.7 L 642.9,135.3 L 646.2,134.8 L 649.5,134.4 L 652.7,134.0 L 656.0,133.7" fill="none" stroke="#1b1b1b" stroke-width="2.8"/>
<text x="230.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">встигає за швидким тактом</text>
<text x="670.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">не встигає → доводиться знизити SCK</text>
<rect x="60.0" y="250.0" width="780.0" height="80.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="450.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожен пристрій і кожен сантиметр доріжки додають ємність C; час фронту ~ R×C росте.</text>
<text x="450.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тому навіть на платі max-швидкість падає з довжиною ліній і числом ведених на шині.</text>
<text x="450.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Практично: коротші доріжки й менше навантаження = вища доступна частота.</text>
</svg>
