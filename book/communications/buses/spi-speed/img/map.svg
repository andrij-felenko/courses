<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта «швидкість × відстань»: де живе SPI</text>
<line x1="130.0" y1="320.0" x2="720.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="130.0" y1="320.0" x2="130.0" y2="90.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="715.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">відстань →</text>
<text x="120.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">швидкість</text>
<text x="230.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">см (плата)</text>
<text x="580.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">метри (кабель)</text>
<rect x="140.0" y="96.0" width="250.0" height="108.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="265.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">SPI</text>
<text x="265.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">швидко + близько</text>
<rect x="140.0" y="226.0" width="250.0" height="84.0" rx="6" fill="#fbf3df" stroke="#b08900" stroke-width="1.8"/>
<text x="265.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b08900" text-anchor="middle" font-weight="700">I2C</text>
<text x="265.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">повільніше, теж близько</text>
<rect x="420.0" y="96.0" width="300.0" height="214.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="570.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">диференційні шини</text>
<text x="570.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(RS-485, CAN, LVDS)</text>
<text x="570.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">для метрів і завад</text>
<rect x="60.0" y="348.0" width="640.0" height="44.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="380.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI — десятки МГц на сантиметрах плати; на кабель чи метри бери диференційну шину.</text>
