<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три лінії I2S: такт, вибір слова, дані</text>
<rect x="66.0" y="100.0" width="156.0" height="150.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="144.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ПЕРЕДАВАЧ</text>
<text x="144.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(джерело звуку)</text>
<rect x="478.0" y="100.0" width="156.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="556.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПРИЙМАЧ</text>
<text x="556.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(ЦАП, кодек)</text>
<line x1="222.0" y1="180.0" x2="478.0" y2="180.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">SCK</text>
<text x="350.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">такт біта (bit clock)</text>
<line x1="222.0" y1="208.0" x2="478.0" y2="208.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">WS</text>
<text x="350.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">вибір слова: 0 = лівий, 1 = правий</text>
<line x1="222.0" y1="236.0" x2="478.0" y2="236.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">SD</text>
<text x="350.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">самі відліки звуку</text>
<text x="350.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SCK і WS дає ВЕДУЧИЙ (тут — передавач); SD несе дані до приймача</text>
<text x="350.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ведучим може бути й приймач — тоді такт і кадр жене він, а SD усе одно від джерела</text>
</svg>