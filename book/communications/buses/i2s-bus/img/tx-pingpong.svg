<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійна буферизація: DMA ллє, CPU наповнює</text>
<rect x="40.0" y="120.0" width="120.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="100.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПРОЦЕСОР</text>
<text x="100.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">наповнює</text>
<text x="100.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ривками</text>
<rect x="530.0" y="120.0" width="130.0" height="96.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="595.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">I2S + DMA</text>
<text x="595.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">→ ЦАП</text>
<text x="595.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ллє рівномірно</text>
<rect x="250.0" y="96.0" width="200.0" height="44.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="350.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">БУФЕР A</text>
<text x="350.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">DMA ллє його → ЦАП</text>
<rect x="250.0" y="176.0" width="200.0" height="44.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="350.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">БУФЕР B</text>
<text x="350.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">CPU наповнює наперед</text>
<line x1="160.0" y1="140.0" x2="250.0" y2="198.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="450.0" y1="118.0" x2="530.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="320.0" y1="140.0" x2="320.0" y2="176.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="380.0" y1="176.0" x2="380.0" y2="140.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="350.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">на межі — обмін ролями</text>
<rect x="148.5" y="283.9" width="403.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="350.0" y="302.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">поки DMA спорожнює один буфер, CPU наповнює інший;</tspan><tspan x="350.0" dy="13.7">устигає наповнити швидше, ніж DMA спорожнює → у звуці НЕМАЄ діри</tspan></text>
</svg>