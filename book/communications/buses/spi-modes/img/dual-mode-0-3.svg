 UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a5fb0" text-anchor="end" font-weight="700">DATA (Спільна)</text><polygon points="164.0,281.0 266.0,281.0 270.0,295.0 266.0,309.0 164.0,309.0 160.0,295.0" fill="#f8f9fa" stroke="#7a5fb0" stroke-width="1.8"/><text x="215.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 7 (MSB)</text><polygon points="274.0,281.0 366.0,281.0 370.0,295.0 366.0,309.0 274.0,309.0 270.0,295.0" fill="#f8f9fa" stroke="#7a5fb0" stroke-width="1.8"/><text x="320.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 6</text><polygon points="374.0,281.0 466.0,281.0 470.0,295.0 466.0,309.0 374.0,309.0 370.0,295.0" fill="#f8f9fa" stroke="#7a5fb0" stroke-width="1.8"/><text x="420.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 5</text><polygon points="474.0,281.0 616.0,281.0 620.0,295.0 616.0,309.0 474.0,309.0 470.0,295.0" fill="#f8f9fa" stroke="#7a5fb0" stroke-width="1.8"/><text x="545.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 4</text><rect x="50.0" y="370.0" width="760.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Чому це працює без перемикання регістра веденого:</tspan><tspan x="430.0" dy="14.3">1. В обох режимах ВИБІРКА відбувається точно на НАРОСТАЮЧОМУ фронті (0→1), коли лінія стабільна.</tspan><tspan x="430.0" dy="14.3">2. В обох режимах ЗМІНА даних відбувається точно на СПАДНОМУ фронті (1→0).</tspan><tspan x="430.0" dy="14.3">3. Різниця лише в рівні SCLK під час неактивного /CS (HIGH vs LOW), який ведений просто ігнорує!</tspan></text>
