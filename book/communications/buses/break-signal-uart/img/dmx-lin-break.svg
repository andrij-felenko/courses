<text x="760.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1–8 байт від Slave</text>
<rect x="157.7" y="352.9" width="564.6" height="44.1" rx="6" fill="#f4f8fb" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="371.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">В обох протоколах Break є єдиним маркером синхронізації: він гарантує, що всі ведені вузли</tspan><tspan x="440.0" dy="13.7">скидають свої приймальні парсери в нульовий стан одночасно без додаткових сигнальних ліній.</tspan></text>
