<svg xmlns="http://www.w3.org/2000/svg" viewBox="-232.44 -10 1112.44 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-232.44" y="-10" width="1112.44" height="450" fill="#ffffff"/>
