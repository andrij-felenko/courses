<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Застосування Break у промислових протоколах: DMX512 та LIN-Bus</text>
<text x="40.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1. Протокол DMX512 (250 кбод, Tbit = 4.0 мкс): структура пакета керування світлом</text>
