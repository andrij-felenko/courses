<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичний CAN 2.0 проти CAN FD (Flexible Data-rate)</text>
<text x="40.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Classical CAN 2.0 (єдина швидкість, макс. 8 байтів даних):</text>
<rect x="40.0" y="76.0" width="740.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="120.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Арбітраж (11/29 б)</text>
<text x="120.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">500 кбіт/с</text>
<line x1="200.0" y1="76.0" x2="200.0" y2="122.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="380.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Дані (0..8 байтів) + CRC-15</text>
<text x="380.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">500 кбіт/с (фіксована швидкість арбітражу)</text>
<line x1="580.0" y1="76.0" x2="580.0" y2="122.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="680.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK + EOF</text>
<text x="680.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">500 кбіт/с</text>
<text x="40.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">CAN FD (двошвидкісний режим, до 64 байтів даних):</text>
<rect x="40.0" y="174.0" width="180.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="130.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза арбітражу</text>
<text x="130.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">500 кбіт/с (SOF, ID, BRS)</text>
<rect x="225.0" y="174.0" width="395.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="422.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПРИСКОРЕНА ФАЗА ДАНИХ (до 64 байтів) + CRC-17/21</text>
<text x="422.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">2..5..8 Мбіт/с (перемикання бітом BRS = 1)</text>
<rect x="625.0" y="174.0" width="155.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="702.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза ACK / EOF</text>
<text x="702.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">500 кбіт/с (CRC Del → EOF)</text>
<line x1="220.0" y1="162.0" x2="230.0" y2="174.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="225.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">BRS Sample Point ↑</text>
<line x1="620.0" y1="174.0" x2="630.0" y2="162.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CRC Delimiter SP ↓</text>
<rect x="88.8" y="254.3" width="642.4" height="71.4" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="410.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ключові вдосконалення CAN FD (ISO 11898-1:2015):</tspan><tspan x="410.0" dy="13.7">• Пропускна здатність: до 8 разів вища за рахунок розгону фази даних до 2–8 Мбіт/с</tspan><tspan x="410.0" dy="13.7">• Обсяг корисного навантаження: розширено з 8 до 64 байтів на кадр (менший оверхед)</tspan><tspan x="410.0" dy="13.7">• Fixed Stuff Bits у полі CRC + Stuff Count (3 біти коду Грея): усунення вразливості каскадного стафінгу</tspan></text>
<rect x="151.6" y="359.8" width="516.8" height="30.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Сумісність: фаза арбітражу залишається надійним побітовим голосуванням з повним RTT</tspan></text>
</svg>