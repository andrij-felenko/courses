<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локалізація несправностей: скінченний автомат станів вузла CAN</text>
<rect x="40.0" y="70.0" width="220.0" height="140.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="150.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ERROR ACTIVE</text>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">TEC &lt; 128  ТА  REC &lt; 128</text>
<text x="150.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Повноправний учасник</text>
<text x="150.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Шле Active Error Flag</text>
<text x="150.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">  (6 домінантних бітів)</text>
<text x="150.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Звичайна пауза IFS (3 біти)</text>
<rect x="325.0" y="70.0" width="230.0" height="140.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.2"/>
<text x="440.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7950b" text-anchor="middle" font-weight="700">ERROR PASSIVE</text>
<text x="440.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">TEC ≥ 128  АБО  REC ≥ 128</text>
<text x="440.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Підозра на несправність</text>
<text x="440.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">• Шле Passive Error Flag</text>
<text x="440.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">  (6 рецесивних бітів)</text>
<text x="440.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Suspend Transmission (+8 б)</text>
<rect x="620.0" y="70.0" width="180.0" height="140.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="710.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">BUS OFF</text>
<text x="710.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">TEC &gt; 255</text>
<text x="710.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">• Вузол ізольовано</text>
<text x="710.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Трансивер відключено</text>
<text x="710.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">  від ведення ліній</text>
<text x="710.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Не шле жодних бітів</text>
<line x1="260.0" y1="120.0" x2="325.0" y2="120.0" stroke="#b7950b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="292.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b7950b" text-anchor="middle" font-weight="700">TEC ≥ 128 | REC ≥ 128</text>
<line x1="325.0" y1="160.0" x2="260.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="292.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">TEC ≤ 127 &amp; REC ≤ 127</text>
<line x1="555.0" y1="140.0" x2="620.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="587.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">TEC &gt; 255</text>
<line x1="710.0" y1="210.0" x2="710.0" y2="255.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="710.0" y1="255.0" x2="150.0" y2="255.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="150.0" y1="255.0" x2="150.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Відновлення (Recovery): прослуховування 128 × 11 рецесивних бітів → TEC=0, REC=0</text>
<rect x="151.6" y="299.3" width="516.8" height="71.4" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ваги лічильників помилок (асиметрична шкала покарання):</tspan><tspan x="410.0" dy="13.7">• Помилка при передачі (Tx Error): TEC += 8   (передавач відповідає за спотворення)</tspan><tspan x="410.0" dy="13.7">• Помилка при прийомі (Rx Error):  REC += 1   (захист приймачів від чужих шумів)</tspan><tspan x="410.0" dy="13.7">• Успішна передача кадру:          TEC -= 1   |   Успішний прийом кадру: REC -= 1</tspan></text>
<rect x="112.7" y="399.8" width="594.6" height="30.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="418.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Результат: зламаний передавач ізолюється за 32 помилки поспіль, не руйнуючи зв'язок решти мережі</tspan></text>
</svg>