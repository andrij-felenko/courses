<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури: карта пам'яті SD проти мультифункціонального пристрою SDIO</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Один фізичний інтерфейс — принципово різні моделі адресації, паралелізму та обробки подій</text>
<rect x="40.0" y="70.0" width="410.0" height="425.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/>
<rect x="40.0" y="70.0" width="410.0" height="36.0" rx="8" fill="#eaeded" stroke="#6b7280" stroke-width="1.5"/>
<text x="245.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта пам'яті SD (SD Memory Card)</text>
<rect x="60.0" y="125.0" width="370.0" height="48.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.2"/>
<text x="245.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Фізичний інтерфейс: CLK, CMD, DAT[0..3]</text>
<text x="245.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спільний фізичний рівень SD-роз'єму</text>
<rect x="60.0" y="188.0" width="370.0" height="58.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.2"/>
<text x="245.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d6608" text-anchor="middle" font-weight="700">Модель адресації: LBA (блокова пам'ять)</text>
<text x="245.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фіксовані сектори 512 байтів · CMD17/18 (Read), CMD24/25 (Write)</text>
<text x="245.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Немає прямого доступу до окремих регістрів керування</text>
<rect x="60.0" y="260.0" width="370.0" height="68.0" rx="6" fill="#fdf2e9" stroke="#e59866" stroke-width="1.2"/>
<text x="245.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#935116" text-anchor="middle" font-weight="700">Контролер FTL (Flash Translation Layer)</text>
<text x="245.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Wear-leveling, збирання сміття, трансляція LBA → NAND</text>
<text x="245.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Недетерміновані затримки зайнятості (BUSY на DAT0)</text>
<rect x="60.0" y="342.0" width="370.0" height="62.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.2"/>
<text x="245.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Модель керування подіями: Пасивна</text>
<text x="245.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Карта ніколи не ініціює обмін самостійно</text>
<text x="245.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Відсутній апаратний механізм переривань хоста</text>
<rect x="60.0" y="418.0" width="370.0" height="60.0" rx="4" fill="#f8f9f9" stroke="#6b7280" stroke-width="1.0"/>
<text x="245.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення: масивне енергонезалежне сховище</text>
<text x="245.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Один логічний простір даних без внутрішньої мультиплексії</text>
<text x="245.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ініціалізація: CMD0 → CMD8 → ACMD41</text>
<rect x="490.0" y="70.0" width="410.0" height="425.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<rect x="490.0" y="70.0" width="410.0" height="36.0" rx="8" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="695.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#117864" text-anchor="middle" font-weight="700">Пристрій SDIO (SDIO Multi-Function Device)</text>
<rect x="510.0" y="125.0" width="370.0" height="48.0" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.2"/>
<text x="695.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Фізичний інтерфейс: CLK, CMD, DAT[0..3]</text>
<text x="695.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сумісний 1-бітний / 4-бітний роз'єм або впаяна мікросхема</text>
<rect x="510.0" y="184.0" width="370.0" height="68.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.2"/>
<text x="695.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Функція 0: CIA (Common Information Area)</text>
<text x="695.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Регістри CCCR (керування шиною, частотою, шиною переривань)</text>
<text x="695.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Регістри FBR (властивості функцій 1..7) + CIS кортежі ідентифікації</text>
<text x="695.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a5276" text-anchor="middle">Доступ: 1-байтові команди CMD52 / burst CMD53</text>
<rect x="510.0" y="260.0" width="181.0" height="70.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="600.5" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Функція 1: Wi-Fi MAC</text>
<text x="600.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TX/RX FIFO черги</text>
<text x="600.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розмір блока: 512 Б</text>
<text x="600.5" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#196f3d" text-anchor="middle">Окремий IRQ статус</text>
<rect x="699.0" y="260.0" width="181.0" height="70.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.2"/>
<text x="789.5" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">Функція 2: Bluetooth HCI</text>
<text x="789.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">HCI пакети команд/UART</text>
<text x="789.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Розмір блока: 64 Б</text>
<text x="789.5" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6c3483" text-anchor="middle">Окремий IRQ статус</text>
<rect x="510.0" y="340.0" width="370.0" height="64.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="695.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Апаратні переривання (In-band IRQ на DAT1)</text>
<text x="695.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пристрій опускає лінію DAT1 у нуль між передачею блоків</text>
<text x="695.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Хост миттєво реагує та опитує регістр INT_PENDING через CMD52</text>
<rect x="510.0" y="414.0" width="370.0" height="64.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/>
<text x="695.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#196f3d" text-anchor="middle" font-weight="700">Призначення: швидкісний периферійний інтерфейс</text>
<text x="695.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">До 7 незалежних апаратних функцій + прямий доступ до регістрів</text>
<text x="695.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#196f3d" text-anchor="middle">Ініціалізація: CMD0 → CMD5 (IO_SEND_OP_COND) → CMD3</text>
</svg>