<rect x="60.0" y="260.0" width="780.0" height="110.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Двотактний вихід заряджає лінію активно — фронт різкий, можна тактувати дуже швидко.</text>
<text x="450.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому SPI тягне десятки МГц проти 0.1…3.4 МГц у I2C.</text>
<text x="450.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Зворотний бік: двотактні виходи НЕ можна просто зводити разом — звідси окремі лінії й CS.</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(саме та несумісність двотактних виходів, що ми бачили в §36.2)</text>
</svg>
