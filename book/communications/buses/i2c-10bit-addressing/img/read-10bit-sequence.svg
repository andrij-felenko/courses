<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність сигналів при 10-бітному читанні (Master Read)</text>
<text x="50.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Фаза 1: Адресація та вибір веденого (напрямок R/W = 0)</text>
<rect x="50.0" y="68.0" width="36.0" height="46.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="68.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">S</text>
<rect x="91.0" y="68.0" width="180.0" height="46.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="181.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1-й байт: 11110 + A9..A8 + W(0)</text>
<rect x="276.0" y="68.0" width="40.0" height="46.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="296.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<rect x="321.0" y="68.0" width="130.0" height="46.0" rx="4" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="386.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2-й байт: A7..A0</text>
<rect x="456.0" y="68.0" width="40.0" height="46.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="476.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<text x="511.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">→ ведений розпізнає себе й фіксує вибір</text>
<text x="50.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Фаза 2: Повторний старт і запит читання (напрямок R/W = 1)</text>
<rect x="50.0" y="154.0" width="36.0" height="46.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="68.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Sr</text>
<rect x="91.0" y="154.0" width="180.0" height="46.0" rx="4" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="181.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1-й байт: 11110 + A9..A8 + R(1)</text>
<rect x="276.0" y="154.0" width="40.0" height="46.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="296.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<rect x="321.0" y="154.0" width="110.0" height="46.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="376.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані 1 (D7..D0)</text>
<rect x="436.0" y="154.0" width="40.0" height="46.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="456.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<rect x="481.0" y="154.0" width="120.0" height="46.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="541.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані 2 (останній)</text>
<rect x="606.0" y="154.0" width="45.0" height="46.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="628.5" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">NACK</text>
<rect x="656.0" y="154.0" width="36.0" height="46.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="674.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">P</text>
<rect x="50.0" y="224.0" width="740.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="65.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Чому 2-й байт адреси не передається вдруге?</text>
<text x="65.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">  Ведений уже зафіксував свій стан адресації у Фазі 1. На повторний старт із R/W=1</text>
<text x="65.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">  відгукується лише той єдиний чіп, який був щойно обраний, і негайно починає передачу даних.</text>
<rect x="50.0" y="336.0" width="740.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Читання вимагає Repeated START: спочатку повна адресація із R/W=0, потім рестарт із R/W=1 без 2-го байта</tspan></text>
</svg>