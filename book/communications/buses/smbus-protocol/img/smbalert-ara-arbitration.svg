<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/>
    </marker>
  </defs>
<rect x="0.0" y="0.0" width="820.0" height="380.0" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол сповіщення хоста: лінія SMBALERT# та арбітраж ARA</text>
<rect x="40.0" y="50.0" width="360.0" height="145.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="220.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1: Аварійне переривання веденого</text>
<text x="52.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Давач заряду (адреса 0x16) фіксує перегрів або падіння напруги.</text>
<text x="52.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Давач притягує лінію SMBALERT# до нуля (активний рівень 0 В).</text>
<text x="52.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Хост фіксує спадний фронт на вході зовнішнього переривання.</text>
<rect x="420.0" y="50.0" width="360.0" height="145.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="600.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 2: Запит відповіді на тривогу (ARA)</text>
<text x="432.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Хост надсилає загальний широкомовний запит:</text>
<text x="432.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• START → Alert Response Address (0001 100b = 0x0C) + R (байт 0x19).</text>
<text x="432.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Усі пристрої з активним SMBALERT# слухають цю адресу і готують відповідь.</text>
<rect x="40.0" y="210.0" width="360.0" height="145.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
<text x="220.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 3: Побітовий арбітраж на шині SDA</text>
<text x="52.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кожен збуджений ведений передає власну 7-бітну адресу на лінію SDA.</text>
<text x="52.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пристрій з найменшою адресою (наприклад, 0x16 проти 0x48) перемагає,</text>
<text x="52.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• оскільки його нульові біти домінують над одиницями суперників.</text>
<rect x="420.0" y="210.0" width="360.0" height="145.0" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
<text x="600.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 4: Завершення та зняття сигналу</text>
<text x="432.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Хост надсилає ACK переможцю та дізнається точну адресу винуватця (0x16).</text>
<text x="432.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Переможець відпускає лінію SMBALERT#.</text>
<text x="432.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Якщо SMBALERT# лишається низьким, хост повторює читання ARA для інших.</text>
<line x1="220.0" y1="195.0" x2="220.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400.0" y1="120.0" x2="420.0" y2="120.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600.0" y1="195.0" x2="600.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>