<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка мертвого зависання у режимі фіксації Latch та її усунення</text>
<rect x="15.0" y="15.0" width="730.0" height="280.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="30.0" y="35.0" width="335.0" height="240.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="197.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пастка зависання (Latched Hang Trap)</text>
<text x="45.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Давач виставив nINT = 0 (Data Ready)</text>
<text x="45.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">2. MCU раптово перезавантажився (Watchdog)</text>
<text x="45.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. MCU стартує і вмикає EXTI (Falling Edge)</text>
<text x="45.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">4. На лінії nINT ВЖЕ статичний 0 (немає перепаду!)</text>
<text x="45.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">5. Детектор фронту мовчить → система зависла</text>
<rect x="50.0" y="215.0" width="295.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="197.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">DEADLOCK: Переривання ніколи не прийде,</text>
<text x="197.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">бо давач чекає вичитування старих даних</text>
<rect x="395.0" y="35.0" width="335.0" height="240.0" rx="6" fill="#f9fcf9" stroke="#27ae60" stroke-width="1.5"/>
<text x="562.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Алгоритм відновлення (Dummy Flush)</text>
<text x="410.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Ініціалізація шини SPI / I2C</text>
<text x="410.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">2. Холосте читання (Dummy Read):</text>
<text x="425.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Зчитування STATUS_REG / INT_STATUS</text>
<text x="425.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Зчитування вихідних регістрів (OUT_X..Z)</text>
<text x="410.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">3. Фіксатор скинуто → nINT повертається в 1</text>
<text x="410.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">4. Тільки тепер вмикаємо EXTI в MCU</text>
<rect x="415.0" y="215.0" width="295.0" height="45.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.2"/>
<text x="562.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ГАРАНТОВАНИЙ СТАРТ: Наступна вибірка</text>
<text x="562.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">створить чистий фронт 1 → 0 для EXTI</text>
</svg>