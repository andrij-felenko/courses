<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорога завдовжки у 80 років: від коду Морзе до кадру UART</text>
<line x1="60.0" y1="120.0" x2="760.0" y2="120.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="90.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
