<text x="90.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1840-і</text>
<text x="90.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="90.0" dy="0.0">швидкість —</tspan><tspan x="90.0" dy="12.5">але рукою оператора</tspan></text>
<circle cx="218.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="218.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Бодо</text>
<text x="218.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1870-і</text>
<text x="218.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="218.0" dy="0.0">5 однакових одиниць:</tspan><tspan x="218.0" dy="12.5">читає машина</tspan></text>
<circle cx="346.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="346.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">розподільник</text>
<text x="346.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1870-і</text>
<text x="346.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="346.0" dy="0.0">один дріт —</tspan><tspan x="346.0" dy="12.5">кільком (TDM)</tspan></text>
<circle cx="474.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="474.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маррей / телетайп</text>
<text x="474.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1900-і</text>
<text x="474.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="474.0" dy="0.0">клавіатура</tspan><tspan x="474.0" dy="12.5">і перфострічка</tspan></text>
<circle cx="602.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="602.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">старт-стоп</text>
<text x="602.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1910-і</text>
<text x="602.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="602.0" dy="0.0">кадр сам себе</tspan><tspan x="602.0" dy="12.5">синхронізує</tspan></text>
<circle cx="730.0" cy="120.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="730.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">UART</text>
<text x="730.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">нині</text>
<text x="730.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">той самий кадр</tspan><tspan x="730.0" dy="12.5">у кремнії</tspan></text>
<rect x="70.0" y="240.0" width="680.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="258.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Кожен крок прибирав щось зайве: спершу майстерність руки, потім спільний</tspan><tspan x="410.0" dy="15.6">годинник — аж лишився мінімальний самосинхронний кадр, що дожив до UART.</tspan></text>
