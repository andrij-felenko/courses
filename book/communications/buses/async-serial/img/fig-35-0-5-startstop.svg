<text x="470.0" y="533.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звідси: лише дроти TX/RX (без дроту такту), але обидві сторони мусять заздалегідь домовитися про baud.</text>
