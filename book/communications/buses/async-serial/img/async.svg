<text x="90.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">власний генератор приймача f_rx ≈ baud</text>
<text x="90.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">старт-біт лише ЗАПУСКАЄ відлік; далі час веде свій годинник</text>
<rect x="80.0" y="252.0" width="600.0" height="96.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Лінія в спокої тримається у «1». Щоб надіслати знак, передавач кидає її в «0»</tspan><tspan x="380.0" dy="15.6">на один біт — це старт-біт, постріл стартового пістолета. Упіймавши цей</tspan><tspan x="380.0" dy="15.6">перепад, приймач запускає власний відлік і сам, за своїм годинником, знімає</tspan><tspan x="380.0" dy="15.6">кожен наступний біт через домовлений інтервал; завершує знак стоп-біт.</tspan><tspan x="380.0" dy="15.6">І так — наново перед кожним знаком. Та сама ідея старт-стоп із телетайпа.</tspan></text>
