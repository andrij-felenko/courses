<rect x="60.0" y="320.0" width="740.0" height="56.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.6"/>
<text x="430.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Часта помилка новачка: з'єднати TX↔TX. Треба НАВХРЕСТ — вихід на вхід.</text>
<text x="430.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">І обов'язково спільна земля: без неї рівні «0/1» нема відносно чого міряти (§35.4).</text>
