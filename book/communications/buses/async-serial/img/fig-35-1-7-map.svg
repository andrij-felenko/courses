<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540">
<rect width="780" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="390.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Карта ліній зв'язку: дві осі рішень</text>
<text x="390.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">де серед них UART — і чому саме «асинхронна послідовна»</text>
<line x1="180.0" y1="110.0" x2="180.0" y2="450.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="460.0" y1="110.0" x2="460.0" y2="450.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="740.0" y1="110.0" x2="740.0" y2="450.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="180.0" y1="110.0" x2="740.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="180.0" y1="280.0" x2="740.0" y2="280.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="180.0" y1="450.0" x2="740.0" y2="450.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="320.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПОСЛІДОВНО (1 лінія)</text>
<text x="600.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПАРАЛЕЛЬНО (N ліній)</text>
<text x="164.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">СИНХРОННО</text>
<text x="164.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(є дріт такту)</text>
<text x="164.0" y="365.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">АСИНХРОННО</text>
<text x="164.0" y="381.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">(нема дроту такту)</text>
<text x="320.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">шина з тактом</text>
<text x="320.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дані + окремий дріт такту</text>
<text x="600.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">паралельний порт</text>
<text x="600.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">багато ліній + строб/такт</text>
<rect x="186.0" y="286.0" width="268.0" height="158.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="320.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">UART</text>
<text x="320.0" y="381.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">старт-стоп, домовлений baud</text>
<text x="600.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">майже не вживають</text>
<text x="600.0" y="381.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перекіс ліній робить це марним</text>
<rect x="60.0" y="476.0" width="660.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="390.0" y="499.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">UART = асинхронна ПОСЛІДОВНА лінія: одна лінія на напрям, без дроту такту.</text>
<text x="390.0" y="519.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Синхронні послідовні шини (з дротом такту) — наступні розділи модуля.</text>
</svg>
