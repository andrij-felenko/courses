<rect x="80.0" y="340.0" width="640.0" height="78.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="359.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Приймач не має дроту такту: він ловить спад СТАРТ, запускає власний лічильник</tspan><tspan x="400.0" dy="15.6">і бере відлік посеред кожного біта (пунктир). Перед наступним знаком усе</tspan><tspan x="400.0" dy="15.6">синхронізується знову. Дорогу й крихку вічну синхронність розподільника</tspan><tspan x="400.0" dy="15.6">замінили на дешеву разову — перед кожним знаком. Це й є асинхронність.</tspan></text>
