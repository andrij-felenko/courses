<text x="490.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">праві (під праву руку)</text>
<rect x="70.0" y="286.0" width="600.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Літеру набирали не послідовно, а акордом — натискали одночасно ту</tspan><tspan x="370.0" dy="15.6">комбінацію з п'яти клавіш (дві ліворуч, три праворуч), що відповідала п'яти</tspan><tspan x="370.0" dy="15.6">бітам знака. І робити це треба було строго у відведену апаратом мить:</tspan><tspan x="370.0" dy="15.6">оператор підлаштовувався під машину, а не навпаки. Уперше ритм лінії задавало</tspan><tspan x="370.0" dy="15.6">не людське чуття, а механічний такт — щоб на тому кінці декодувала машина.</tspan></text>
