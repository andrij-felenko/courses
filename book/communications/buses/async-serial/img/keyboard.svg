<text x="370.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Акорд літери «A» = 11000  (натиснуто 2 ліві)</text>
