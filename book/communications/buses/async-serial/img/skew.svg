<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінії стартують разом — а приходять урізнобій (перекіс)</text>
<text x="60.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Передавач</text>
<line x1="110.0" y1="95.0" x2="110.0" y2="250.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="110.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">усі міняються разом</text>
<line x1="110.0" y1="110.0" x2="110.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="110.0" y1="110.0" x2="110.0" y2="134.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="110.0" y1="134.0" x2="320.0" y2="134.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="102.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">D0</text>
<line x1="110.0" y1="156.0" x2="120.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="120.0" y1="156.0" x2="120.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="120.0" y1="180.0" x2="320.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="102.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">D1</text>
<line x1="110.0" y1="202.0" x2="136.0" y2="202.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="136.0" y1="202.0" x2="136.0" y2="226.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="136.0" y1="226.0" x2="320.0" y2="226.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="102.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">D2</text>
<line x1="110.0" y1="248.0" x2="150.0" y2="248.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="150.0" y1="248.0" x2="150.0" y2="272.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="150.0" y1="272.0" x2="320.0" y2="272.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="102.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">D3</text>
<line x1="138.0" y1="95.0" x2="138.0" y2="300.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="144.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">мить вибірки</text>
<text x="144.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">D0,D1 уже нові, D2,D3 ще старі → читається суміш</text>
<rect x="70.0" y="350.0" width="620.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Вісім дротів ніколи не однакові: різна довжина, ємність, опір — тож фронт по</tspan><tspan x="380.0" dy="15.6">кожному біжить із трохи різною затримкою. Поки інтервал на біт довгий, це</tspan><tspan x="380.0" dy="15.6">дрібниця. Та що вищий темп — то коротший біт, і коли він стає сумірний із</tspan><tspan x="380.0" dy="15.6">розкидом затримок, біти одного стовпчика прибувають врізнобій, і приймач</tspan><tspan x="380.0" dy="15.6">знімає суміш старого й нового байта. Одна послідовна лінія цієї біди не має.</tspan></text>
</svg>