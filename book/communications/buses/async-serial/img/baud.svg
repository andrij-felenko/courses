<text x="195.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.0</text>
<line x1="230.0" y1="128.0" x2="230.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="230.0" y1="90.0" x2="300.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="265.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D1</text>
<text x="265.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.0</text>
<line x1="300.0" y1="90.0" x2="300.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="300.0" y1="128.0" x2="370.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="335.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D2</text>
<text x="335.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.0</text>
<line x1="370.0" y1="128.0" x2="440.0" y2="128.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="405.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D3</text>
<text x="405.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.0</text>
<line x1="440.0" y1="128.0" x2="440.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="440.0" y1="90.0" x2="510.0" y2="90.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="475.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D4</text>
<text x="475.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.0</text>
