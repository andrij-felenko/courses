<text x="562.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">стоп</text>
<text x="562.5" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.5</text>
<text x="90.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1 + 5 + 1.5 = 7.5 одиниць на знак</text>
<rect x="80.0" y="200.0" width="600.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1 бод = одна сигнальна одиниця (символ) за секунду. Класичний телетайп —</tspan><tspan x="380.0" dy="15.6">45.45 бода, тож одна одиниця триває 1 / 45.45 ≈ 22 мс, а знак (7.5 одиниць) —</tspan><tspan x="380.0" dy="15.6">≈165 мс: близько 6 знаків за секунду, тобто ≈60 слів за хвилину. З 7.5 одиниць</tspan><tspan x="380.0" dy="15.6">корисні лише 5 — третина «ефіру» йде на старт і стоп: це плата за те, щоб</tspan><tspan x="380.0" dy="15.6">обійтися без дроту такту. Чому бод ≠ біт/с? Бо бод лічить символи на лінії.</tspan><tspan x="380.0" dy="15.6">Поки символ має два рівні (мітка/пропуск), він несе 1 біт — і бод = біт/с;</tspan><tspan x="380.0" dy="15.6">щойно рівнів більше двох, один символ несе кілька біт, і вони розходяться.</tspan></text>
</svg>