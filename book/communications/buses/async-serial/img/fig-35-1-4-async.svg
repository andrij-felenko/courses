<rect x="60.0" y="360.0" width="760.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="440.0" y="383.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виграш: лише TX і RX (+ земля), без дроту такту — два пристрої, два дроти даних.</text>
<text x="440.0" y="403.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ціна: обидві сторони мусять наперед збігтися у baud, а їхні годинники — бути «досить точними».</text>
