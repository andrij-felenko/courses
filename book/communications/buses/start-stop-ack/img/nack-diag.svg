<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">NACK — корисний сигнал: про що він каже</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">відсутність ACK означає різне залежно від того, ДЕ вона сталася</text>
<rect x="60.0" y="90.0" width="200.0" height="180.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="160.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">після АДРЕСИ</text>
<text x="160.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">на шині нема пристрою</text>
<text x="160.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">з такою адресою</text>
<text x="160.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">→ перевір адресу й дроти</text>
<rect x="350.0" y="90.0" width="200.0" height="180.0" rx="12" fill="#fbf3df" stroke="#b08900" stroke-width="2.0"/>
<text x="450.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="700">після байта (запис)</text>
<text x="450.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ведений не може прийняти</text>
<text x="450.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(зайнятий або помилка)</text>
<text x="450.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">→ сповільни чи перевір стан</text>
<rect x="640.0" y="90.0" width="200.0" height="180.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="740.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">від ведучого (читання)</text>
<text x="740.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">«це був останній байт,</text>
<text x="740.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">далі не треба»</text>
<text x="740.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">→ нормальне завершення</text>
<rect x="60.0" y="304.0" width="780.0" height="40.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="320.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Реакція на ACK/NACK — основа надійного драйвера: за ними видно і відсутність чіпа, і його стан.</tspan><tspan x="450.0" dy="15.0">Бібліотеки повертають цей результат (наприклад, код повернення Wire.endTransmission()).</tspan></text>
</svg>