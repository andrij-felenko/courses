<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Напівдуплекс I2C проти повного дуплексу UART</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна лінія даних → говорять по черзі; дві лінії → можна одночасно в обидва боки</text>
<rect x="60.0" y="90.0" width="360.0" height="200.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="240.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I2C: одна SDA — по черзі</text>
<rect x="90.0" y="150.0" width="90.0" height="60.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="135.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ведучий</text>
<rect x="300.0" y="150.0" width="90.0" height="60.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="345.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ведений</text>
<line x1="180.0" y1="170.0" x2="300.0" y2="170.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="240.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">то так…</text>
<line x1="300.0" y1="196.0" x2="180.0" y2="196.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="240.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">…то так (не водночас)</text>
<rect x="460.0" y="90.0" width="360.0" height="200.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="640.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">UART: TX і RX — водночас</text>
<rect x="490.0" y="150.0" width="90.0" height="60.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="535.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<rect x="700.0" y="150.0" width="90.0" height="60.0" rx="8" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="745.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<line x1="580.0" y1="166.0" x2="700.0" y2="166.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<text x="640.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">TX →</text>
<line x1="700.0" y1="194.0" x2="580.0" y2="194.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="640.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">← RX (одночасно)</text>
<rect x="60.0" y="312.0" width="760.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="440.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I2C економить лінію ціною одночасності: у кожну мить говорить лише ОДИН бік SDA.</text>
</svg>
