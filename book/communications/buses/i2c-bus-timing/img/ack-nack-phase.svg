<text x="430.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Приймач виставляє ACK завчасно (t_SU;DAT) і утримує його до спаду 9-го такту (t_HD;DAT), після чого повертає лінію.</text>
