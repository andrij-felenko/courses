<text x="480.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Немає окремих ліній CS (як в SPI) та INT/DRDY (як в I2C). Усі переривання та конфігурація передаються по SDA.</text>
<text x="480.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Контролер динамічно перемикає лінії між Open-Drain (старт, адреса, арбітраж) та Push-Pull (дані 12.5 Мбіт/с).</text>
