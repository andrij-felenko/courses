<text x="130.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Bus Idle (SDA=1, SCL=1)</text>
<rect x="210.0" y="75.0" width="180.0" height="46.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text x="300.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Запит переривання</text>
<text x="300.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Давач притягує SDA до '0'</text>
<rect x="400.0" y="75.0" width="220.0" height="46.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="510.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Арбітраж адреси IBI</text>
<text x="510.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Давач видає свою Dynamic Addr + RnW=1</text>
