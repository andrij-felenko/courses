<text x="470.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Перевага: Давач відправляє причину переривання (MDB) одразу в кадрі IBI</text>
<text x="470.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Контролеру не потрібно робити повторний окремий запит читання статусного регістра (як в I2C).</text>
<text x="470.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Якщо одночасно переривання шлють два давачі, арбітраж виграє той, у кого менша динамічна адреса.</text>
<text x="470.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Економія: на платі смартфона з 15 сенсорами ліквідовано 15 окремих сигнальних доріжок INT.</text>
