<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішньосмугове переривання (In-Band Interrupt, IBI)</text>
<text x="470.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Асинхронний запит давача по лінії SDA без виділеного апаратного виводу GPIO INT</text>
<rect x="60.0" y="75.0" width="140.0" height="46.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
