<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція швидкості: I2C Fast-Mode Plus, I3C SDR та I3C HDR-DDR</text>
<text x="470.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Відкритий стік (1 Мбіт/с) → Однотактний Push-Pull (12.5 Мбіт/с) → Двоточковий такт DDR (25 Мбіт/с)</text>
<rect x="50.0" y="75.0" width="840.0" height="105.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="65.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. I2C Fast-Mode Plus (Fm+): 1 МГц Open-Drain</text>
<text x="65.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Повільні спади/фронти через підтяжку R_pullup; 9 тактів на байт (8 біт + ACK); максимум 0.89 Мбіт/с</text>
<rect x="50.0" y="195.0" width="840.0" height="105.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="65.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. I3C SDR (Single Data Rate): 12.5 МГц Push-Pull</text>
<text x="65.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Активне керування лініями; зчитування по спаду/фронту SCL; 9 тактів на байт (8 біт + T-біт); до 12.5 Мбіт/с</text>
<rect x="50.0" y="315.0" width="840.0" height="105.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="65.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. I3C HDR-DDR (Double Data Rate): 12.5 МГц / 25 Мбіт/с</text>
<text x="65.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Подвійна швидкість: дані передаються і на наростаючому, і на спадному фронті SCL; корисний потік до 25 Мбіт/с</text>
