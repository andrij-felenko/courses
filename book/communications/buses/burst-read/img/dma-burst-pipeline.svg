<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне Burst-зчитування з прямим доступом до пам'яті (DMA)</text>
<text x="460.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">автономна перекачка масивів вимірів без завантаження ядра мікроконтролера</text>
<rect x="40.0" y="80.0" width="200.0" height="310.0" rx="8" fill="#fbfcfc" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Давач (IMU Sensor)</text>
<text x="140.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">LSM6DSO / BMI270</text>
<rect x="55.0" y="150.0" width="170.0" height="50.0" rx="5" fill="#fdebd0" stroke="#b9770e" stroke-width="1.2"/>
<text x="140.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Лінія INT / DRDY</text>
<text x="140.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Імпульс готовності даних</text>
<rect x="55.0" y="220.0" width="170.0" height="145.0" rx="5" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="140.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Регістри виходу (14 B)</text>
<text x="140.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0x20: Status</text>
<text x="140.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0x28..0x2D: Accel XYZ</text>
<text x="140.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0x22..0x27: Gyro XYZ</text>
<text x="140.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0x30..0x31: Temp</text>
<text x="140.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#117864" text-anchor="middle" font-weight="700">SPI / I2C інтерфейс</text>
<rect x="280.0" y="80.0" width="330.0" height="310.0" rx="8" fill="#edf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="445.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Мікроконтролер (STM32 / ESP32)</text>
<rect x="295.0" y="130.0" width="300.0" height="55.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="445.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Периферія SPI / I2C (Shift Reg + FIFO)</text>
<text x="445.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Апаратна генерація такту SCK / SCL</text>
<rect x="295.0" y="205.0" width="300.0" height="160.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="445.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Контролер прямого доступу (DMA Engine)</text>
<text x="445.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stream / Channel з апаратним тригером</text>
<rect x="310.0" y="260.0" width="270.0" height="42.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.0"/>
<text x="445.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#117864" text-anchor="middle" font-weight="700">Лічильник передачі (NDTR = 14)</text>
<text x="445.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Автоматичне декрементування лічильника</text>
<rect x="310.0" y="310.0" width="270.0" height="42.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.0"/>
<text x="445.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#117864" text-anchor="middle" font-weight="700">Інкремент адреси пам'яті (MINC = 1)</text>
<text x="445.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Адреса периферії фіксована (PINC = 0)</text>
<rect x="650.0" y="80.0" width="230.0" height="310.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
<text x="765.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оперативна пам'ять (SRAM)</text>
<rect x="665.0" y="130.0" width="200.0" height="115.0" rx="5" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.2"/>
<text x="765.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Кільцевий / Подвійний буфер</text>
<text x="765.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Buffer A [14 B] — заповнює DMA</text>
<text x="765.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Buffer B [14 B] — читає CPU</text>
<text x="765.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Transfer Complete (TC) ISR</text>
<rect x="665.0" y="260.0" width="200.0" height="105.0" rx="5" fill="#f4f6f7" stroke="#333333" stroke-width="1.2"/>
<text x="765.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро процесора (CPU Core)</text>
<text x="765.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Завантаження CPU = 0%</text>
<text x="765.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вільний для обчислень</text>
<text x="765.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">AHRS / Фільтр Калмана</text>
<line x1="225.0" y1="175.0" x2="290.0" y2="175.0" stroke="#b9770e" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="257.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">DRDY</text>
<line x1="225.0" y1="290.0" x2="290.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="255.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Burst</text>
<line x1="445.0" y1="185.0" x2="445.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="285.0" x2="665.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="630.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">DMA Bus</text>
</svg>