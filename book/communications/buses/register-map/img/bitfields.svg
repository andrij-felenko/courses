<text x="460.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щоб змінити ОДНЕ поле, не зачепивши решти, роблять «читай-зміни-запиши»:</text>
<text x="82.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">1. прочитати поточний байт регістра;</text>
<text x="82.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">2. замаскувати потрібні біти (AND з ~маска) і вставити нове значення (OR);</text>
<text x="82.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3. записати байт назад — решта налаштувань збереглася.</text>
