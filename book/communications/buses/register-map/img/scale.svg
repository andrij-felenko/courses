<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сирий відлік → фізична величина: масштаб із даташита</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">чіп віддає «голі» числа; даташит дає чутливість для переведення</text>
<rect x="120.0" y="100.0" width="200.0" height="70.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="220.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сирий int16</text>
<text x="220.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">8192</text>
<line x1="322.0" y1="135.0" x2="390.0" y2="135.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="357.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">÷ чутливість</text>
<rect x="400.0" y="100.0" width="230.0" height="70.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.6"/>
<text x="515.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">16384 LSB/g</text>
<text x="515.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(з даташита, ±2g)</text>
<line x1="632.0" y1="135.0" x2="700.0" y2="135.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="710.0" y="100.0" width="150.0" height="70.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="785.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">0.5 g</text>
<rect x="60.0" y="200.0" width="780.0" height="130.0" rx="10" fill="#f2f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="450.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">величина = сирий_відлік / чутливість = 8192 / 16384 = 0.5 g</text>
<text x="450.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">для гіроскопа — LSB/(°/с), для барометра — свої формули, для температури — зсув і масштаб.</text>
<text x="450.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Часто ще потрібне калібрування (прибрати зсув нуля): відлік → масштаб → калібрування.</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Без масштабу «8192» нічого не означає; саме даташит робить із відліку фізику.</text>
</svg>