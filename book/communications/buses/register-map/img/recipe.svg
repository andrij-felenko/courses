<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Універсальний рецепт «оживлення» I2C-чіпа</text>
<text x="470.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі чотири кроки працюють майже для кожного давача</text>
<rect x="60.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfcfd" stroke="#2457d6" stroke-width="2.2"/>
<text x="157.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. СКАН</text>
<text x="157.5" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">знайти адресу</text>
<text x="157.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">на шині</text>
<line x1="257.0" y1="175.0" x2="283.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="285.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfcfd" stroke="#b07a00" stroke-width="2.2"/>
<text x="382.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b07a00" text-anchor="middle" font-weight="700">2. WHO_AM_I</text>
<text x="382.5" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">звірити ID —</text>
<text x="382.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">це справді він?</text>
<line x1="482.0" y1="175.0" x2="508.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="510.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfcfd" stroke="#27ae60" stroke-width="2.2"/>
<text x="607.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. НАЛАШТУВАТИ</text>
<text x="607.5" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">розбудити, задати</text>
<text x="607.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">діапазон, частоту</text>
<line x1="707.0" y1="175.0" x2="733.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="735.0" y="130.0" width="195.0" height="90.0" rx="12" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="832.5" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. ЧИТАТИ</text>
<text x="832.5" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пакетом виміри,</text>
<text x="832.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">скласти й масштабувати</text>
<path d="M 832.5,220 C 832.5,270 920,270 920,222" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="832.5" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">повторювати в циклі</text>
<rect x="60.0" y="300.0" width="820.0" height="44.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="470.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перші три кроки — раз при старті; четвертий — у головному циклі стільки разів, скільки треба.</text>
</svg>