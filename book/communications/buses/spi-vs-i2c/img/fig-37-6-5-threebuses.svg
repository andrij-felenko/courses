<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три дротові шини модуля: кожна про своє</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">UART, I2C і SPI — не конкуренти, а інструменти під різні задачі</text>
<rect x="25.0" y="100.0" width="280.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="165.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">UART (§35)</text>
<text x="165.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">точка-точка, асинхронно</text>
<circle cx="49.0" cy="180.0" r="3.5" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="63.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">2 лінії на лінк</text>
<circle cx="49.0" cy="208.0" r="3.5" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="63.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">без спільного такту</text>
<circle cx="49.0" cy="236.0" r="3.5" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="63.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">модуль ↔ ПК, GPS, радіомодем</text>
<rect x="319.0" y="100.0" width="280.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2.2"/>
<text x="459.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">I2C (§36)</text>
<text x="459.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">багато дрібних, 2 дроти</text>
<circle cx="343.0" cy="180.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="357.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">адреси на спільній шині</text>
<circle cx="343.0" cy="208.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="357.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">повільно, ощадить ніжки</text>
<circle cx="343.0" cy="236.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="357.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">давачі, RTC, пам'ять</text>
<rect x="613.0" y="100.0" width="280.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="753.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">SPI (§37)</text>
<text x="753.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кілька швидких, на платі</text>
<circle cx="637.0" cy="180.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="651.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">окремі лінії + CS</text>
<circle cx="637.0" cy="208.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="651.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">десятки МГц, повний дуплекс</text>
<circle cx="637.0" cy="236.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="651.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">дисплей, SD, флеш, АЦП</text>
<rect x="60.0" y="300.0" width="800.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="460.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дротовий зв'язок модуля повний: вибрав шину під задачу — і знаєш її до фізики.</text>
</svg>
