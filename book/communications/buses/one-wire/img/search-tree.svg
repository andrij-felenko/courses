<text x="40.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">Прохід 1 → D3: на розвилці біта 1 обрано 0; гілка 1 лишилась → LastDiscrepancy = 1.</text>
<text x="40.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Прохід 2 → D1: вертаємось на гілку 1, там нова розвилка (біт 2), обрано 0 → LastDiscrepancy = 2.</text>
<text x="40.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="start">Прохід 3 → D2: гілка 1 біта 2; розвилок більше нема → останній пристрій, кінець.</text>
<text x="40.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">① ② ③ — порядок відкриття · зелений ромб — розвилка (0,0) · пунктир — повернення до останньої розвилки</text>
