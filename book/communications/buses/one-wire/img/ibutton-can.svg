<rect x="110.0" y="127.0" width="190.0" height="96.0" rx="9" fill="#eef1f4" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="205.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">кришка = DQ</text>
<text x="205.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">корпус і дно</tspan><tspan x="205.0" dy="13.7">= земля (GND)</tspan></text>
<line x1="300.0" y1="102.0" x2="330.0" y2="102.0" stroke="#c0392b" stroke-width="1.3"/>
<text x="336.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">кришка — єдиний контакт даних (DQ)</text>
<line x1="300.0" y1="122.0" x2="330.0" y2="122.0" stroke="#27ae60" stroke-width="1.3"/>
<text x="336.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">поліпропіленове кільце — ізолятор</text>
<line x1="300.0" y1="175.0" x2="330.0" y2="175.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="336.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">сталевий корпус і дно — спільна земля (GND)</text>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві металеві поверхні — і все.</text>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Один сигнальний контакт + земля: ні штирів, ні роз'єму, ні полярності — торкнувся й прочитав.</text>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Мінімум контактів — найдешевший і найнадійніший дотик.</text>
