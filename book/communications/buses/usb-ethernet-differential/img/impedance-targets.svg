<text x="306.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">FR-4</text>
<rect x="164.0" y="142.0" width="30.0" height="10.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="226.0" y="142.0" width="30.0" height="10.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="179.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">+</text>
<text x="241.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="194.0" y1="158.0" x2="226.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="210.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вужчий проміжок</text>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">USB 2.0  (D+ / D−)</text>
<text x="210.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ціль ≈ 90 Ω диференційно</text>
<line x1="460.0" y1="200.0" x2="680.0" y2="200.0" stroke="#6b7280" stroke-width="3.0"/>
<text x="570.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">опорний шар (GND)</text>
<rect x="460.0" y="150.0" width="220.0" height="50.0" rx="2" fill="#f1f3f5" stroke="#d0d4d8" stroke-width="1.0"/>
<text x="666.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">FR-4</text>
<rect x="524.0" y="142.0" width="30.0" height="10.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="586.0" y="142.0" width="30.0" height="10.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="539.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">+</text>
<text x="601.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">−</text>
<line x1="554.0" y1="158.0" x2="586.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="570.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ширший проміжок</text>
<text x="570.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Ethernet  (вита пара)</text>
<text x="570.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ціль ≈ 100 Ω диференційно</text>
<line x1="390.0" y1="88.0" x2="390.0" y2="232.0" stroke="#d0d4d8" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="70.0" y="270.0" width="640.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Імпеданс пари визначає НЕ протокол, а геометрія: ширина двох доріжок,</tspan><tspan x="390.0" dy="16.2">проміжок між ними, товщина діелектрика до опорного шару й сам діелектрик.</tspan><tspan x="390.0" dy="16.2">Цифри в стандартах — це просто домовлені цілі, під які зведено цю геометрію:</tspan><tspan x="390.0" dy="16.2">USB 2.0 цілить у 90 Ω між D+ і D−, Ethernet — у 100 Ω у кожній парі.</tspan><tspan x="390.0" dy="16.2">Відступив від геометрії — попливла ціль, на стрибку імпедансу хвиля частково</tspan><tspan x="390.0" dy="16.2">відбивається назад відлунням, і швидка лінія починає збоїти. Тому в правилах</tspan><tspan x="390.0" dy="16.2">розведення стоїть конкретне число, а не «приблизно».</tspan></text>
</svg>