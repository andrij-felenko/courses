<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія пари задає диференційний імпеданс: USB ≈ 90 Ω, Ethernet ≈ 100 Ω</text>
<line x1="100.0" y1="200.0" x2="320.0" y2="200.0" stroke="#6b7280" stroke-width="3.0"/>
<text x="210.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">опорний шар (GND)</text>
