<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типові граблі розведення: усе, що порушує однаковість або сталу геометрію</text>
<rect x="70.0" y="70.0" width="640.0" height="64.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="86.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗  Розвели дроти різними шляхами</text>
<text x="104.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">пара перестала бути парою: завада сідає нерівно,</text>
<text x="104.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">синфазне придушення просідає</text>
<rect x="70.0" y="146.0" width="640.0" height="64.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="86.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗  Розрив опорного шару під парою</text>
<text x="104.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">під доріжками щілина в землі → стрибок імпедансу</text>
<text x="104.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">і відлуння на швидкості</text>
<rect x="70.0" y="222.0" width="640.0" height="64.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="86.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗  Перехідний отвір (via) лише на одному дроті</text>
<text x="104.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">один дріт подовжився й змінив імпеданс — асиметрія,</text>
<text x="104.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">якої не було в плані</text>
<rect x="70.0" y="298.0" width="640.0" height="64.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="86.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗  Залишковий «хвіст» (stub) на лінії</text>
<text x="104.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">відгалуження-тупик відбиває хвилю назад</text>
<text x="104.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">і спотворює фронт</text>
<rect x="70.0" y="374.0" width="640.0" height="64.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="86.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">✗  Гострий поворот під 90°</text>
<text x="104.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">у куті змінюється ширина → локальний стрибок Z₀;</text>
<text x="104.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ведуть плавно, двома кутами по 45°</text>
</svg>