<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дроти пари ведуть однакової довжини: інакше фронти приходять урозбіг</text>
<text x="205.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Один дріт довший — перекіс</text>
<line x1="80.0" y1="100.0" x2="330.0" y2="100.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="74.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">+</text>
<path d="M80,150 L150,150 L165,128 L210,128 L225,150 L330,150" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<text x="74.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">−</text>
<text x="195.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">обхід перешкоди → довший шлях</text>
<line x1="330.0" y1="90.0" x2="330.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="205.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">фронт «−» спізнюється на Δt</text>
<text x="205.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">у мить переходу A − B на мить хибна</text>
<line x1="400.0" y1="72.0" x2="400.0" y2="230.0" stroke="#d0d4d8" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="590.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Коротший підтягнуто міандром</text>
<line x1="470.0" y1="100.0" x2="720.0" y2="100.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="464.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">+</text>
<path d="M470,150 L500,150 L500,138 L515,138 L515,150 L530,150 L530,138 L545,138 L545,150 L600,150 L615,128 L640,128 L655,150 L720,150" fill="none" stroke="#27ae60" stroke-width="2.4"/>
<text x="580.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">зиґзаґ-доважка зрівнює довжину</text>
<line x1="720.0" y1="90.0" x2="720.0" y2="160.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="590.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">обидва фронти приходять разом</text>
<text x="590.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">різниця A − B чиста на переході</text>
<rect x="70.0" y="265.0" width="640.0" height="158.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="291.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Біт живе в різниці A − B, і вона чиста лише доки фронти на обох дротах</tspan><tspan x="390.0" dy="16.2">перемикаються одночасно. Фронт біжить дротом зі скінченною швидкістю, тож</tspan><tspan x="390.0" dy="16.2">довший дріт доносить свій фронт пізніше — це перекіс (skew). У мить переходу,</tspan><tspan x="390.0" dy="16.2">поки один дріт уже змінив рівень, а другий ще ні, різниця на коротку мить</tspan><tspan x="390.0" dy="16.2">провалюється й стає хибною. На повільній лінії ця щілина мізерна, на швидкій —</tspan><tspan x="390.0" dy="16.2">доростає до помилки. Тому коротшу доріжку навмисне подовжують зиґзаґом</tspan><tspan x="390.0" dy="16.2">(міандром), щоб обидві стали однакової довжини. Для USB це доли міліметра,</tspan><tspan x="390.0" dy="16.2">для багатопарного Ethernet вирівнюють ще й пари між собою.</tspan></text>
</svg>