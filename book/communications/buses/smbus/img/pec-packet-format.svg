<text x="420.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">Обчислення CRC-8 (поліном C(x) = x⁸ + x² + x + 1, ініціалізація 0x00)</text>
<rect x="50.0" y="195.0" width="800.0" height="105.0" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2"/>
<text x="70.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9d174d" text-anchor="start" font-weight="700">Ключові правила функціонування PEC (Packet Error Checking):</text>
<text x="70.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Поліном CRC-8: x⁸ + x² + x + 1 (позначення 0x07 або 0x107). Початковий залишок — 0x00.</text>
<text x="70.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Охоплення: всі байти від стартового біта (адреса, біти R/W, код команди, лічильник кількості та дані).</text>
<text x="70.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Обробка помилки: якщо ведений виявляє невідповідність PEC при записі, він генерує NACK і відкидає дані.</text>
</svg>