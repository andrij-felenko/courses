<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Подія у веденого:
переривання ALERT# -&gt; 0</text>
<text x="50.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Транзакція
Хоста (SDA)</text>
<rect x="212.5" y="120.0" width="35.0" height="36.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="230.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">S</text>
<rect x="247.5" y="120.0" width="155.0" height="36.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="325.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ARA Адреса: 0001 100b (0x0C)</text>
<rect x="402.5" y="120.0" width="35.0" height="36.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="420.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rd (1)</text>
