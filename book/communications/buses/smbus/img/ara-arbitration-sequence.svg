<text x="455.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK</text>
<rect x="472.5" y="120.0" width="245.0" height="36.0" rx="4" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="595.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза Арбітражу (Адреса веденого 7-біт)</text>
<rect x="717.5" y="120.0" width="35.0" height="36.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
