<rect x="50.0" y="195.0" width="800.0" height="165.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="70.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Арбітраж за схемою «Монтажне АБО» (Wired-AND) на лінії SDA під час фази адреси веденого:</text>
<text x="70.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Ведений A (0x18 = 0001 1000b):</text>
<text x="320.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">0   0   0   1   1   0   0   0   (Перемагає: утримує 0 на 4-му біті)</text>
<text x="70.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">Ведений B (0x48 = 0100 1000b):</text>
<text x="320.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">0   1   0   0   1   0   0   0   (Програє на 2-му біті: хотів 1, побачив 0 -&gt; відпускає шину)</text>
<text x="70.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Результат:</text>
<text x="145.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Хост зчитує 0x18. Ведений A скидає свій ALERT#. Ведений B продовжує утримувати ALERT# для наступного ARA.</text>
</svg>