<text x="625.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SDA: 0→1 при SCL=1</text>
<rect x="93.7" y="303.5" width="652.7" height="43.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Переведення пінів у режим GPIO (Bit-Banging)  →  2. Генерація до 9 тактів SCL (виштовхування бітів веденого)</tspan><tspan x="420.0" dy="13.0">3. Моніторинг SDA: якщо SDA став '1', ведений відпустив шину  →  4. Формування сигналу STOP для скидання стану</tspan></text>
