<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="400.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">Алгоритм ведучого: генерація такту з опитуванням SCL та таймаутом</text>
<rect x="71.6" y="65.2" width="176.9" height="59.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="160.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">1. Притягнути SCL до 0V</tspan><tspan x="160.0" dy="14.3">(SCL_OUT = LOW)</tspan><tspan x="160.0" dy="14.3">Запустити таймер t_LOW</tspan></text>
<rect x="57.9" y="167.3" width="204.1" height="45.3" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="160.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">2. Відрахувати t_LOW</tspan><tspan x="160.0" dy="14.3">(затримка половини періоду)</tspan></text>
<line x1="160.0" y1="130.0" x2="160.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="64.8" y="255.2" width="190.5" height="59.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="160.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">3. Відпустити лінію SCL</tspan><tspan x="160.0" dy="14.3">(SCL_OUT = HIGH-Z)</tspan><tspan x="160.0" dy="14.3">Запустити таймер таймауту</tspan></text>
<line x1="160.0" y1="225.0" x2="160.0" y2="255.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="341.3" y="262.4" width="197.3" height="45.3" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">4. Чи піднявся SCL до VIH?</tspan><tspan x="440.0" dy="14.3">(Зчитування SCL_IN == 1)</tspan></text>
<line x1="275.0" y1="285.0" x2="330.0" y2="285.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="611.6" y="255.2" width="176.9" height="59.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="700.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">5. SCL високий!</tspan><tspan x="700.0" dy="14.3">Запустити таймер t_HIGH</tspan><tspan x="700.0" dy="14.3">(Семплування біта SDA)</tspan></text>
<line x1="550.0" y1="285.0" x2="595.0" y2="285.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="572.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="601.3" y="72.3" width="197.3" height="45.3" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="700.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">6. Відрахувати t_HIGH</tspan><tspan x="700.0" dy="14.3">Перейти до наступного біта</tspan></text>
<line x1="700.0" y1="245.0" x2="700.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600.0" y1="95.0" x2="275.0" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="315.3" y="353.5" width="249.4" height="43.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="440.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Чи не перевищено таймаут?</tspan><tspan x="440.0" dy="13.0">(t_WAIT &gt; t_TIMEOUT_MAX, напр. 35 мс)</tspan></text>
<line x1="440.0" y1="320.0" x2="440.0" y2="350.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">НІ (0V)</text>
<path d="M 330 375 H 260 V 310 H 330" fill="none" stroke="#e08a1e" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="219.2" y="324.6" width="81.6" height="40.7" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="242.0" y="342.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="242.0" dy="0.0">Очікування</tspan><tspan x="242.0" dy="11.7">(Stretching)</tspan></text>
<rect x="612.5" y="347.0" width="175.0" height="56.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="700.0" y="365.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Аварія шини (Bus Lockup)!</tspan><tspan x="700.0" dy="13.0">Виклик процедури 9 тактів</tspan><tspan x="700.0" dy="13.0">Скидання інтерфейсу I2C</tspan></text>
<line x1="550.0" y1="375.0" x2="600.0" y2="375.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">ТАК (Fail)</text>
</svg>