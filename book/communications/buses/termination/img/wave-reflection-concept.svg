<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвиля в лінії передачі: падаючий фронт, межа і відбиття</text>
<text x="80.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Поширення падаючого фронту (V⁺, I⁺) у лінії з хвильовим опором Z₀</text>
<rect x="40.0" y="85.0" width="70.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="75.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">TX</text>
<text x="75.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">V_step</text>
<line x1="110.0" y1="105.0" x2="710.0" y2="105.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="110.0" y1="145.0" x2="710.0" y2="145.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="410.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сигнальний провідник (L₀ на одиницю довжини)</text>
<text x="410.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Опорна земля GND (C₀ на одиницю довжини) → Z₀ = √(L₀/C₀)</text>
<line x1="260.0" y1="105.0" x2="340.0" y2="105.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="300.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Падаюча хвиля V⁺</text>
<text x="300.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I⁺ = V⁺ / Z₀</text>
<rect x="710.0" y="85.0" width="75.0" height="70.0" rx="6" fill="#fef6e7" stroke="#d97706" stroke-width="1.8"/>
<text x="747.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">RX</text>
<text x="747.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Z_L</text>
<line x1="40.0" y1="185.0" x2="780.0" y2="185.0" stroke="#d0d4d8" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="80.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Що відбувається на кінці лінії при розриві (Z_L = ∞) проти узгодження (Z_L = Z₀)</text>
<rect x="50.0" y="230.0" width="345.0" height="205.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="222.5" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">Неузгоджений кінець (Z_L = ∞, розрив)</tspan><tspan x="222.5" dy="15.0">Струм на розриві не може текти (I_L = 0).</tspan><tspan x="222.5" dy="15.0">Щоб скомпенсувати струм I⁺, лінія</tspan><tspan x="222.5" dy="15.0">породжує відбиту хвилю зі струмом I⁻ = −I⁺.</tspan><tspan x="222.5" dy="15.0">При цьому напруга подвоюється:</tspan><tspan x="222.5" dy="15.0">V⁻ = +V⁺  →  V_total = V⁺ + V⁻ = 2 · V⁺</tspan><tspan x="222.5" dy="15.0">Коефіцієнт відбиття Γ = +1.0 (викид напруги!)</tspan></text>
<rect x="425.0" y="230.0" width="345.0" height="205.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="597.5" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="597.5" dy="0.0">Узгоджений кінець (Z_L = Z₀, термінатор)</tspan><tspan x="597.5" dy="15.0">Резистор R_L = Z₀ приймає струм I_L = V⁺ / Z₀</tspan><tspan x="597.5" dy="15.0">точно у відповідності до закону лінії.</tspan><tspan x="597.5" dy="15.0">Уся енергія хвилі перетворюється на тепло.</tspan><tspan x="597.5" dy="15.0">Відбита хвиля взагалі не виникає:</tspan><tspan x="597.5" dy="15.0">V⁻ = 0  →  V_total = V⁺ (чистий фронт)</tspan><tspan x="597.5" dy="15.0">Коефіцієнт відбиття Γ = 0.0 (нуль відлуння)</tspan></text>
</svg>