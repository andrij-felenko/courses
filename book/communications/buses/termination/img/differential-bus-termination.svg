<rect x="480.0" y="310.0" width="320.0" height="135.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/><text x="640.0" y="345.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Перевага Split Termination:</tspan><tspan x="640.0" dy="11.7">• Для диференційного сигналу: R_diff = 60 + 60 = 120 Ω</tspan><tspan x="640.0" dy="11.7">  (повна відповідність стандарту ISO 11898).</tspan><tspan x="640.0" dy="11.7">• Для синфазної завади (Common-Mode Noise):</tspan><tspan x="640.0" dy="11.7">  середня точка заземлена через C_split (4.7 нФ),</tspan><tspan x="640.0" dy="11.7">  що ефективно зливає ВЧ-шум на землю й</tspan><tspan x="640.0" dy="11.7">  значно знижує електромагнітне випромінювання (EMI).</tspan></text>
