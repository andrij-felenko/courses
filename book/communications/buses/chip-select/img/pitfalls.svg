<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часті пастки з лінією CS</text>
<rect x="25.0" y="64.0" width="210.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="130.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Плаваюча CS</text>
<text x="130.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ніжка «у повітрі» —</tspan><tspan x="130.0" dy="14.9">ведений ловить хибний</tspan><tspan x="130.0" dy="14.9">вибір</tspan></text>
<line x1="41.0" y1="198.0" x2="219.0" y2="198.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="130.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">тримай CS визначеною</tspan></text>
<rect x="255.0" y="64.0" width="210.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="360.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Дві опущені CS</text>
<text x="360.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">двоє ведених женуть</tspan><tspan x="360.0" dy="14.9">MISO разом —</tspan><tspan x="360.0" dy="14.9">конфлікт</tspan></text>
<line x1="271.0" y1="198.0" x2="449.0" y2="198.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">опускай рівно одну</tspan></text>
<rect x="485.0" y="64.0" width="210.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="590.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">CS не піднято</text>
<text x="590.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">команди «злипаються»</tspan><tspan x="590.0" dy="14.9">одна з одною</tspan></text>
<line x1="501.0" y1="198.0" x2="679.0" y2="198.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="590.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">піднімай після обміну</tspan></text>
<text x="360.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">усі CS високі за замовчуванням; одну опустив на обмін — одразу підняв</text>
</svg>