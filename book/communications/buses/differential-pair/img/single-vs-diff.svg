<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна лінія міряє від спільної землі; пара міряє сама від себе</text>
<text x="190.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Однопровідна лінія</text>
<line x1="70.0" y1="110.0" x2="320.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">TX</text>
<text x="320.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">RX</text>
<line x1="70.0" y1="175.0" x2="320.0" y2="175.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="195.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">спільна земля (GND)</text>
<line x1="300.0" y1="110.0" x2="300.0" y2="173.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="308.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">V лінії</text>
<text x="195.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">завада</text>
<line x1="150.0" y1="90.0" x2="150.0" y2="108.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="175.0" y1="90.0" x2="175.0" y2="108.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="200.0" y1="90.0" x2="200.0" y2="108.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<line x1="225.0" y1="90.0" x2="225.0" y2="108.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="195.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">рівень міряється ВІД землі:</text>
<text x="195.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">завада на дроті чи зсув земель</text>
<text x="195.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">→ прямо псує відлік</text>
<text x="575.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Диференційна пара</text>
<line x1="450.0" y1="100.0" x2="700.0" y2="100.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="450.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">A</text>
<line x1="450.0" y1="150.0" x2="700.0" y2="150.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="450.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">B</text>
<line x1="680.0" y1="150.0" x2="680.0" y2="102.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="688.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">A − B</text>
<text x="575.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">рівень — це РІЗНИЦЯ двох дротів:</text>
<text x="575.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">спільної опорної землі не треба,</text>
<text x="575.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">сигнал «носить опору з собою»</text>
<line x1="380.0" y1="70.0" x2="380.0" y2="300.0" stroke="#d0d4d8" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="120.0" y="340.0" width="600.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Однопровідна лінія беззахисна: її «1» і «0» визначені тільки</tspan><tspan x="420.0" dy="16.2">відносно спільної землі, тож будь-яка завада на дроті чи зсув земель</tspan><tspan x="420.0" dy="16.2">одразу псує відлік. Пара ж кодує біт у різниці двох дротів — і ця</tspan><tspan x="420.0" dy="16.2">різниця не залежить від того, що коїться зі «спільним» рівнем.</tspan></text>
</svg>