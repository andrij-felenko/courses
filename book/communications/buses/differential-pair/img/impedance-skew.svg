<text x="225.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вита пара</text>
<line x1="300.0" y1="132.0" x2="320.0" y2="132.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="300.0" y1="168.0" x2="320.0" y2="168.0" stroke="#2457d6" stroke-width="2.2"/>
<rect x="320.0" y="128.0" width="14.0" height="44.0" rx="3" fill="#fff7e6" stroke="#e67e22" stroke-width="1.8"/>
<text x="355.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="start" font-weight="700">R = Z₀</text>
<text x="355.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">≈ 100–120 Ω</text>
<text x="210.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стала відстань між дротами →</text>
<text x="210.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сталий хвильовий опір Z₀</text>
<line x1="420.0" y1="70.0" x2="420.0" y2="250.0" stroke="#d0d4d8" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="595.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Узгодження довжин</text>
<line x1="470.0" y1="120.0" x2="700.0" y2="120.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="465.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">A</text>
<path d="M470,168 L560,168 L575,150 L590,186 L605,168 L700,168" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<text x="465.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">B</text>
<text x="585.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">B довший → його фронт спізнюється</text>
<line x1="700.0" y1="110.0" x2="700.0" y2="180.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="595.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">розбіг фронтів Δt = перекіс (skew)</text>
<rect x="70.0" y="290.0" width="640.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="311.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Швидкий фронт на парі — це хвиля, тож пара поводиться як лінія з власним хвильовим</tspan><tspan x="390.0" dy="16.2">опором Z₀ (диференційний, типово 90–120 Ω). Тримаючи сталу відстань між дротами,</tspan><tspan x="390.0" dy="16.2">ми тримаємо Z₀ сталим по всій довжині; на дальньому кінці ставимо резистор R = Z₀,</tspan><tspan x="390.0" dy="16.2">щоб хвиля поглиналася, а не відбивалася назад відлунням. А коли дроти різної</tspan><tspan x="390.0" dy="16.2">довжини, протифазні фронти приходять не одночасно (skew): у мить переходу різниця</tspan><tspan x="390.0" dy="16.2">A − B на мить хибна — на високій швидкості це помилка. Тому пари ведуть рівними.</tspan></text>
</svg>