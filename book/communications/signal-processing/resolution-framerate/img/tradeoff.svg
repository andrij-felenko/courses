<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">За все платиться бітами</text>
<rect x="147.6" y="99.7" width="144.8" height="100.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">ХОЧЕМО БІЛЬШЕ</tspan><tspan x="220.0" dy="18.2">роздільності</tspan><tspan x="220.0" dy="18.2">кадрів/с</tspan><tspan x="220.0" dy="18.2">глибини біта</tspan></text>
<rect x="624.2" y="99.7" width="231.6" height="100.6" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">ПЛАТИМО</tspan><tspan x="740.0" dy="18.2">смугою каналу</tspan><tspan x="740.0" dy="18.2">пам'яттю · обчисленнями</tspan><tspan x="740.0" dy="18.2">затримкою · батареєю</tspan></text>
<line x1="335" y1="150" x2="615" y2="150" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="480.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">за кожен зайвий біт</text>
<rect x="60.0" y="250.0" width="390.0" height="130.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.6"/>
<text x="255.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">FPV (ти летиш у відео)</text>
<text x="255.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">над усе — низька затримка</text>
<text x="255.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">й плавність, а не мегапікселі</text>
<text x="255.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">краще чітке 720p без лагу,</text>
<text x="255.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">ніж 4K із запізненням</text>
<rect x="510.0" y="250.0" width="390.0" height="130.0" rx="6" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.6"/>
<text x="705.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Машинне бачення</text>
<text x="705.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">баланс роздільності й fps</text>
<text x="705.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">з бортовим обчислювачем:</text>
<text x="705.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">забагато даних — не</text>
<text x="705.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">встигне обробити кадр</text>
<text x="480.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">А сирий потік однаково стискають</text>
</svg>