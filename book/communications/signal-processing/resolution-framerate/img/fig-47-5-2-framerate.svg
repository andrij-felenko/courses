<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Частота кадрів: відео — це швидкі знімки поспіль</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">показуй ~24+ кадрів/с — і око зливає їх у рух (інерція зору); більше fps — плавніше, та й більше даних</text>
<text x="415.0" y="96" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">кадри (окремі знімки)</text>
