<text x="560" y="378" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">60 знімків щосекунди</text>
<text x="480.0" y="438" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Більше fps — плавніший рух і менша затримка на кадр, але стільки ж разів більше даних щосекунди.</text>
