<text x="636" y="176" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">FHD 1080p (1920×1080) — 2.1 Мпк</text>
<rect x="610" y="194" width="18" height="18" rx="8" fill="#93c5fd" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1"/>
<text x="636" y="208" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">HD 720p (1280×720) — 0.9 Мпк</text>
<rect x="610" y="226" width="18" height="18" rx="8" fill="#60a5fa" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1"/>
<text x="636" y="240" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">VGA (640×480) — 0.3 Мпк</text>
<text x="700" y="280" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">мало пікселів = грубо</text>
<rect x="672" y="295" width="13" height="13" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="686" y="295" width="13" height="13" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
