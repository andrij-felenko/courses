<rect x="672" y="337" width="13" height="13" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="700" y="337" width="13" height="13" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="840" y="280" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">багато = чітко</text>
<text x="840" y="332" font-size="46" fill="#334155" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">«Мегапікселі» — це лічильник відерець: вони дають різкість, але кожен зайвий ще й роздуває обсяг даних.</text>
