  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Роздільність: скільки пікселів у кадрі</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ширина × висота = число відерець; більше пікселів — більше деталей, та й більше даних</text>
<rect x="90" y="110" width="460" height="259" rx="8" fill="#dbeafe" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="90" y="110" width="320" height="180" rx="8" fill="#bfdbfe" fill-opacity="0.6" stroke="#1a1a1a" stroke-width="1.4"/>
