<rect x="672" y="323" width="13" height="13" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<rect x="686" y="323" width="13" height="13" rx="8" fill="#334155" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
