<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декореляція сигналів: перетворення R'G'B' у простір Y'CbCr</text>
<rect x="30.0" y="55.0" width="230.0" height="230.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="145.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Вхідні сигнали R'G'B'</text>
<text x="145.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(висока кореляція, 100% смуги)</text>
<rect x="50.0" y="115.0" width="190.0" height="38.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="145.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">R' (Червоний канал)</text>
<rect x="50.0" y="163.0" width="190.0" height="38.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="145.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">G' (Зелений канал)</text>
<rect x="50.0" y="211.0" width="190.0" height="38.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.0"/>
<text x="145.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">B' (Синій канал)</text>
<rect x="300.0" y="110.0" width="220.0" height="120.0" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
<text x="410.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Матричний конвертер</text>
<text x="410.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Y' = W_R·R' + W_G·G' + W_B·B'</text>
<text x="410.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cb = (B' - Y') / (2 - 2W_B)</text>
<text x="410.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Cr = (R' - Y') / (2 - 2W_R)</text>
<line x1="260.0" y1="134.0" x2="300.0" y2="140.0" stroke="#ef4444" stroke-width="2.0"/>
<line x1="260.0" y1="182.0" x2="300.0" y2="170.0" stroke="#22c55e" stroke-width="2.0"/>
<line x1="260.0" y1="230.0" x2="300.0" y2="200.0" stroke="#3b82f6" stroke-width="2.0"/>
<rect x="560.0" y="55.0" width="230.0" height="230.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="675.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Вихідні канали Y'CbCr</text>
<text x="675.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(декорельовані, розділена чутливість)</text>
<rect x="580.0" y="115.0" width="190.0" height="38.0" rx="4" fill="#fef08a" stroke="#eab308" stroke-width="1.0"/>
<text x="675.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Y' (Яскравість, 100% смуги)</text>
<rect x="580.0" y="163.0" width="190.0" height="38.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/>
<text x="675.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Cb (Синя різниця, 25-50% смуги)</text>
<rect x="580.0" y="211.0" width="190.0" height="38.0" rx="4" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.0"/>
<text x="675.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#be123c" text-anchor="middle" font-weight="700">Cr (Червона різниця, 25-50% смуги)</text>
<line x1="520.0" y1="140.0" x2="580.0" y2="134.0" stroke="#eab308" stroke-width="2.0"/>
<line x1="520.0" y1="170.0" x2="580.0" y2="182.0" stroke="#0284c7" stroke-width="2.0"/>
<line x1="520.0" y1="200.0" x2="580.0" y2="230.0" stroke="#f43f5e" stroke-width="2.0"/>
</svg>