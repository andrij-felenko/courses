<line x1="655.0" y1="97.0" x2="670.0" y2="97.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="670.0" y="75.0" width="95.0" height="45.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="717.5" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="717.5" dy="0.0">P5</tspan><tspan x="717.5" dy="14.3">PTS=5</tspan></text>
<text x="120.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">Порядок у контейнері та декодері (DTS):</text>
<rect x="120.0" y="170.0" width="95.0" height="50.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="167.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">I0</tspan><tspan x="167.5" dy="13.0">DTS=0, PTS=0</tspan></text>
<rect x="230.0" y="170.0" width="95.0" height="50.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="277.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="277.5" dy="0.0">P3</tspan><tspan x="277.5" dy="13.0">DTS=1, PTS=3</tspan></text>
<rect x="340.0" y="170.0" width="95.0" height="50.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="387.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="387.5" dy="0.0">B1</tspan><tspan x="387.5" dy="13.0">DTS=2, PTS=1</tspan></text>
<rect x="450.0" y="170.0" width="95.0" height="50.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="497.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="497.5" dy="0.0">B2</tspan><tspan x="497.5" dy="13.0">DTS=3, PTS=2</tspan></text>
<rect x="560.0" y="170.0" width="95.0" height="50.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="607.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="607.5" dy="0.0">P5</tspan><tspan x="607.5" dy="13.0">DTS=4, PTS=5</tspan></text>
<rect x="670.0" y="170.0" width="95.0" height="50.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="717.5" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="717.5" dy="0.0">B4</tspan><tspan x="717.5" dy="13.0">DTS=5, PTS=4</tspan></text>
<line x1="265.0" y1="120.0" x2="265.0" y2="140.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="265.0" y1="140.0" x2="475.0" y2="170.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">P3 передається раніше B-кадрів!</text>
<rect x="120.0" y="245.0" width="645.0" height="95.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="442.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Механізм буфера відновлення порядку (Reordering Buffer / DPB)</text>
<text x="442.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• B-кадри вимагають майбутній опорний P-кадр для обчислення двонаправленого руху.</text>
<text x="442.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Декодер затримує видачу B-кадрів на екран, доки не розпакує P3, досягаючи PTS-синхронізації.</text>
</svg>