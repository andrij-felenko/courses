<line x1="215.0" y1="97.0" x2="230.0" y2="97.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="230.0" y="75.0" width="95.0" height="45.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="277.5" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="277.5" dy="0.0">B1</tspan><tspan x="277.5" dy="14.3">PTS=1</tspan></text>
<line x1="325.0" y1="97.0" x2="340.0" y2="97.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="340.0" y="75.0" width="95.0" height="45.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="387.5" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="387.5" dy="0.0">B2</tspan><tspan x="387.5" dy="14.3">PTS=2</tspan></text>
<line x1="435.0" y1="97.0" x2="450.0" y2="97.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="450.0" y="75.0" width="95.0" height="45.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="497.5" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="497.5" dy="0.0">P3</tspan><tspan x="497.5" dy="14.3">PTS=3</tspan></text>
<line x1="545.0" y1="97.0" x2="560.0" y2="97.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
