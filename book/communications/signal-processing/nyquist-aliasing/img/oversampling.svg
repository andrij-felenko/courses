<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Із запасом: передискретизація (oversampling)</text>
<text x="480.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">беруть fs помітно більшою за 2·fmax — щоб реальний фільтр устиг зрізати й щоб усереднити</text>
<text x="120.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Впритул (fs = 2·fmax):</text>
<line x1="120.0" y1="150.0" x2="860.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<rect x="120.0" y="104.0" width="260.0" height="46.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="250.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сигнал</text>
<line x1="400.0" y1="80.0" x2="400.0" y2="150.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="400.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">fs/2</text>
<text x="880.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="120.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">фільтру нема де спадати — потрібна «стіна» (нездійсненно)</text>
<text x="120.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Із запасом (fs ≫ 2·fmax):</text>
<line x1="120.0" y1="260.0" x2="860.0" y2="260.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<rect x="120.0" y="214.0" width="100.0" height="46.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="170.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">сигнал</text>
<line x1="540.0" y1="190.0" x2="540.0" y2="260.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="540.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.6" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">fs/2</text>
<line x1="220.0" y1="250.0" x2="540.0" y2="250.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<text x="380.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.4" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">запас</text>
<text x="880.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="120.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">є проміжок — пологий фільтр устигає зрізати ВЧ</text>
<rect x="150.0" y="332.0" width="660.0" height="40.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="480.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бонус: удвічі-вчетверо більше відліків можна усереднити —</text>
<text x="480.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">менше шуму й трохи «чесніших» біт (пор. §26.3, §26.7).</text>
</svg>
