<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="740" height="320">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня будова окремого пальця (Finger K)</text><rect x="18.3" y="108.5" width="73.4" height="23.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="55.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="55.0" dy="0.0">Вхід r(t)</tspan></text><line x1="95.0" y1="120.0" x2="140.0" y2="120.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/><circle cx="160.0" cy="120.0" r="18.0" fill="#fef2f2" stroke="#ef4444" stroke-width="2.0"/><text x="160.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#ef4444" text-anchor="middle" font-weight="700">×</text><text x="160.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="700">Дерозширення</text><rect x="113.7" y="212.5" width="92.6" height="35.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Генератор ПСП</tspan><tspan x="160.0" dy="13.0">c(t - τ_k)</tspan></text><line x1="160.0" y1="202.0" x2="160.0" y2="138.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="178.0" y1="120.0" x2="220.0" y2="120.0" stroke="#334155" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="214.0" y="99.3" width="131.9" height="41.3" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="280.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Інтегратор за T_s</tspan><tspan x="280.0" dy="14.3">∫_{0}^{T_s} dt</tspan></text><line x1="340.0" y1="120.0" x2="390.0" y2="120.0" stroke="#334155" stroke-width="2.0" marker-end="url(#arrow)"/><circle cx="365.0" cy="120.0" r="3.5" fill="#334155" stroke="#334155" stroke-width="1.5"/><line x1="365.0" y1="120.0" x2="365.0" y2="230.0" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="293.9" y="237.5" width="142.2" height="35.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="365.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Оцінювач каналу</tspan><tspan x="365.0" dy="13.0">h_k = a_k · e^{j θ_k}</tspan></text><circle cx="410.0" cy="120.0" r="18.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2.0"/><text x="410.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="700">×</text><text x="410.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Фазування й зважування</text><line x1="365.0" y1="280.0" x2="410.0" y2="280.0" stroke="#10b981" stroke-width="1.5"/><line x1="410.0" y1="280.0" x2="410.0" y2="138.0" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="403.5" y="192.5" width="82.9" height="15.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="445.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Вага w_k = h_k*</tspan></text><line x1="428.0" y1="120.0" x2="490.0" y2="120.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="490.4" y="99.3" width="159.2" height="41.3" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="570.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Вихід пальця K</tspan><tspan x="570.0" dy="14.3">y_k = a_k² · s + n_k'</tspan></text><rect x="480.0" y="205.0" width="230.0" height="95.0" rx="6" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/><text x="595.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">Результат роботи пальця:</text><text x="595.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1. Очищення від ПСП супроводжувачів</text><text x="595.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2. Компенсація фази e^{-j θ_k}</text><text x="595.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3. Зважування пропорційно a_k</text>
</svg>