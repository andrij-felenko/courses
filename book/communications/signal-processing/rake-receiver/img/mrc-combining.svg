<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="340.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип MRC: поворот фаз і когерентне додавання у комплексній площині</text><rect x="20.0" y="45.0" width="335.0" height="275.0" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/><text x="187.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">До обробки: довільні фази (некогерентні)</text><line x1="70.0" y1="190.0" x2="300.0" y2="190.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="185.0" y1="90.0" x2="185.0" y2="290.0" stroke="#94a3b8" stroke-width="1.2"/><text x="295.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Re</text><text x="192.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Im</text><line x1="185.0" y1="190.0" x2="270.0" y2="140.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/><text x="275.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">y₀ (θ₀ = 30°)</text><line x1="185.0" y1="190.0" x2="120.0" y2="110.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="105.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">y₁ (θ₁ = 130°)</text><line x1="185.0" y1="190.0" x2="135.0" y2="250.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow)"/><text x="115.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">y₂ (θ₂ = 220°)</text><text x="187.5" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-style="italic">Вектори гасять один одного! (руйнівна інтерференція)</text><rect x="385.0" y="45.0" width="335.0" height="275.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="552.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Після MRC: фази вирівняні вздовж Re</text><line x1="410.0" y1="190.0" x2="700.0" y2="190.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="440.0" y1="90.0" x2="440.0" y2="290.0" stroke="#94a3b8" stroke-width="1.2"/><text x="695.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Re</text><text x="447.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Im</text><line x1="440.0" y1="190.0" x2="520.0" y2="190.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/><text x="475.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">w₀·y₀</text><line x1="520.0" y1="190.0" x2="580.0" y2="190.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/><text x="545.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">w₁·y₁</text><line x1="580.0" y1="190.0" x2="625.0" y2="190.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow)"/><text x="600.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">w₂·y₂</text><line x1="440.0" y1="230.0" x2="625.0" y2="230.0" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrow)"/><text x="530.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Сумарний сигнал Y = Σ w_k · y_k</text><text x="552.5" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-style="italic">Повна конструктивна інтерференція: SNR максимально можливе!</text>
</svg>