<text x="390.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл втрати інформації при повторному стисненні з втратами</text>
<rect x="40.0" y="80.0" width="130.0" height="70.0" rx="6" fill="#eef2fb" stroke="#27ae60" stroke-width="1.5"/>
