<line x1="360.0" y1="115.0" x2="400.0" y2="115.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="400.0" y="80.0" width="160.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="480.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ДКТ / Психоакустика</tspan><tspan x="480.0" dy="14.3">+ ПОВТОРНЕ КВАНТУВАННЯ</tspan></text>
<text x="480.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">[ Похибка e_n+1 ]</text>
