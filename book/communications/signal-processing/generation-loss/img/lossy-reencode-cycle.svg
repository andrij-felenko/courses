<path d="M 670.0,150.0 C 670.0,205.0 105.0,205.0 105.0,150.0" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="390.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Повторне збереження / перекодування</text>
<text x="390.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Похибка квантування відкидає дрібні коефіцієнти при кожному збереженні, спотворюючи геометрію та хрому</text>
