<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура пакетних мереж: Дейтаграми проти Віртуальних каналів</text>
<rect x="20.0" y="45.0" width="410.0" height="460.0" rx="6" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="225.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">А. Дейтаграмні мережі (Datagram — IP)</text>
<rect x="35.0" y="85.0" width="380.0" height="42.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Формат пакета: [ IP: 198.51.100.42 | Дані ]</tspan><tspan x="225.0" dy="13.0">Кожен пакет несе повну глобальну адресу</tspan></text>
<rect x="35.0" y="138.0" width="90.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="80.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">Хост A</tspan></text>
<rect x="175.0" y="138.0" width="100.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Маршрутизатор</tspan><tspan x="225.0" dy="13.0">R1</tspan></text>
<rect x="325.0" y="138.0" width="90.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Хост B</tspan></text>
<line x1="125.0" y1="156.0" x2="175.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="275.0" y1="156.0" x2="325.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="185.0" width="380.0" height="75.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Таблиця маршрутизації R1 (Stateless):</tspan><tspan x="225.0" dy="12.3">Префікс мережі       | Наступний вузол | Порт</tspan><tspan x="225.0" dy="12.3">198.51.100.0/24      | 203.0.113.2     | eth1</tspan><tspan x="225.0" dy="12.3">0.0.0.0/0 (Default)  | 192.0.2.1       | eth0</tspan></text>
<rect x="35.0" y="270.0" width="380.0" height="220.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="344.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">• Без встановлення з'єднання (Connectionless)</tspan><tspan x="225.0" dy="13.0">• Автономна маршрутизація кожного пакета</tspan><tspan x="225.0" dy="13.0">• Стійкість до аварійних ситуацій: при падінні лінка</tspan><tspan x="225.0" dy="13.0">  динамічна маршрутизація пускає пакети в обхід</tspan><tspan x="225.0" dy="13.0">  без необхідності перезапуску сесії</tspan><tspan x="225.0" dy="13.0">• Простота й масштабованість вузлів:</tspan><tspan x="225.0" dy="13.0">  ядро мережі не зберігає стан з'єднань</tspan></text>
<rect x="450.0" y="45.0" width="410.0" height="460.0" rx="6" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="655.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Б. Віртуальні канали (VC — X.25, ATM, MPLS)</text>
<rect x="465.0" y="85.0" width="380.0" height="42.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Формат пакета: [ Локальна мітка VC = 42 | Дані ]</tspan><tspan x="655.0" dy="13.0">Заголовок несе коротку локальну мітку</tspan></text>
<rect x="465.0" y="138.0" width="90.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Хост A</tspan></text>
<rect x="605.0" y="138.0" width="100.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Комутатор</tspan><tspan x="655.0" dy="13.0">SW1</tspan></text>
<rect x="755.0" y="138.0" width="90.0" height="36.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="159.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Хост B</tspan></text>
<line x1="555.0" y1="156.0" x2="605.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="705.0" y1="156.0" x2="755.0" y2="156.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="465.0" y="185.0" width="380.0" height="75.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="655.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Таблиця трансляції міток SW1 (Stateful):</tspan><tspan x="655.0" dy="12.3">Вхідний порт | Вхідна мітка | Вихідний порт | Нова мітка</tspan><tspan x="655.0" dy="12.3">Port 1       | 42           | Port 3        | 107</tspan><tspan x="655.0" dy="12.3">Port 2       | 15           | Port 4        | 88</tspan></text>
<rect x="465.0" y="270.0" width="380.0" height="220.0" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.5"/><text x="655.0" y="344.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">• Орієнтація на з'єднання (Connection-Oriented):</tspan><tspan x="655.0" dy="13.0">  фаза Setup створює записи у комутаторах</tspan><tspan x="655.0" dy="13.0">• Швидка комутація: прямий індексний пошук</tspan><tspan x="655.0" dy="13.0">  замість довгого префіксного аналізу (LPM)</tspan><tspan x="655.0" dy="13.0">• Гарантії QoS та резервування смуги для потоку</tspan><tspan x="655.0" dy="13.0">• Чутливість до відмов: вихід вузла з ладу</tspan><tspan x="655.0" dy="13.0">  розриває VC і потребує нового Setup</tspan></text>
</svg>