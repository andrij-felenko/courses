<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структурні парадигми: блокові та неперервні (згорткові) коди</text>
<rect x="30.0" y="48.0" width="370.0" height="270.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="215.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Блокові коди (n, k): Хеммінг, БЧХ, Рід–Соломон</text>
<rect x="89.3" y="97.5" width="251.4" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Інформаційний вектор m = [m₁, m₂, ..., mk]</tspan><tspan x="215.0" dy="13.0">фіксована довжина k біт</tspan></text>
<line x1="215.0" y1="138.0" x2="215.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="97.9" y="161.0" width="234.3" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Множення на матрицю c = m · G</tspan><tspan x="215.0" dy="13.0">або синдромний поліном s(x)</tspan><tspan x="215.0" dy="13.0">Кодове слово c = [m | p] довжиною n біт</tspan></text>
<rect x="95.0" y="236.0" width="240.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="250.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">• Автономні ізольовані блоки даних</tspan><tspan x="215.0" dy="13.0">• Пам'ять між сусідніми блоками відсутня</tspan><tspan x="215.0" dy="13.0">• Синдромна перевірка: H · cᵀ = 0</tspan></text>
<rect x="440.0" y="48.0" width="370.0" height="270.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Неперервні коди: Згорткові (Trellis / Вітербі)</text>
<rect x="490.8" y="97.5" width="268.5" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Неперервний потік бітів ... u_t, u_{t-1}, ...</tspan><tspan x="625.0" dy="13.0">зсувні регістри з пам'яттю m тактів</tspan></text>
<line x1="625.0" y1="138.0" x2="625.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="493.6" y="161.0" width="262.8" height="48.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Згортка з поліномами g₁(D), g₂(D)</tspan><tspan x="625.0" dy="13.0">вихідні біти (v₁ᵗ, v₂ᵗ) залежать від пам'яті</tspan><tspan x="625.0" dy="13.0">Декодування за графом станів (Trellis)</tspan></text>
<rect x="516.4" y="236.0" width="217.2" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="250.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">• Потокова обробка без штучних меж</tspan><tspan x="625.0" dy="13.0">• Довжина кодового обмеження K</tspan><tspan x="625.0" dy="13.0">• Оптимальний пошук шляху за Вітербі</tspan></text>
</svg>