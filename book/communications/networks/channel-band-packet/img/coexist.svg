<text x="610.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">спершу перевір, чи канал</text>
<text x="610.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вільний (CSMA/CA)</text>
<rect x="50.0" y="250.0" width="660.0" height="46.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="276.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Спільне одне: ЖОДНА не дає гарантії — заглушити ефір може будь-хто; вони лише роблять зіткнення рідшими.</tspan></text>
