<text x="150.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Wi-Fi сидить на одному</text>
<text x="150.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">каналі — береш найвільніший</text>
<rect x="275.0" y="78.0" width="210.0" height="150.0" rx="12" fill="#eef3ff" stroke="#0a3d91" stroke-width="2.0"/>
<rect x="285.0" y="92.0" width="190.0" height="34.0" rx="6" fill="#eef3ff" stroke="#eef3ff" stroke-width="1.5"/><text x="380.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0a3d91" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">стрибати частотою</tspan></text>
<text x="380.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Bluetooth скаче по каналах</text>
<text x="380.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">~1600 разів за секунду</text>
