<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поля керування фрагментацією в заголовку IPv4 (32-бітний рядок)</text>
<text x="55.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">біт 0</text>
<text x="405.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">біт 15</text>
<text x="415.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">біт 16</text>
<text x="470.5" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">18</text>
<text x="482.5" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">19</text>
<text x="765.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">біт 31</text>
<rect x="50.0" y="70.0" width="360.0" height="56.0" rx="4" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Identification (16 біт)</text>
<text x="230.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Унікальний ID дейтаграми джерела</text>
<rect x="410.0" y="70.0" width="67.5" height="56.0" rx="4" fill="#fff7e6" stroke="#c0392b" stroke-width="1.8"/>
<text x="443.8" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Flags</text>
<text x="443.8" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 біти</text>
<rect x="477.5" y="70.0" width="292.5" height="56.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="623.8" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Fragment Offset (13 біт)</text>
<text x="623.8" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зміщення навантаження в блоках по 8 байтів</text>
<rect x="50.0" y="161.0" width="320.0" height="155.0" rx="6" fill="#fffdf9" stroke="#c0392b" stroke-width="1.3"/>
<text x="210.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Розшифровка прапорців (Flags)</text>
<line x1="65.0" y1="193.0" x2="355.0" y2="193.0" stroke="#fed7aa" stroke-width="1.0"/>
<text x="70.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Біт 0: Reserved (мусить бути 0)</text>
<text x="70.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• Біт 1: DF (Don't Fragment)</text>
<text x="85.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1 = заборона ділити пакет (роутер відкидає)</text>
<text x="70.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Біт 2: MF (More Fragments)</text>
<text x="85.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1 = є наступні фрагменти; 0 = останній</text>
<rect x="400.0" y="161.0" width="370.0" height="155.0" rx="6" fill="#f6fcf8" stroke="#27ae60" stroke-width="1.3"/>
<text x="585.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Масштабування зміщення (Крок 8 байтів)</text>
<line x1="415.0" y1="193.0" x2="755.0" y2="193.0" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="420.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 13 біт задають максимум 2¹³ = 8192 позиції.</text>
<text x="420.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Одиниця виміру — 8 октетів (64 біти):</text>
<text x="435.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Байтове зміщення = Fragment Offset × 8</text>
<text x="420.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• 8192 × 8 = 65 536 байтів — максимальна дейтаграма IPv4.</text>
<text x="420.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Кожен нефінальний фрагмент МУСИТЬ бути кратним 8 байтам.</text>
</svg>