<rect x="30.0" y="368.0" width="780.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="385.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Алгоритм вибору DR/BDR: 1) Найвищий пріоритет інтерфейсу (Router Priority, 0..255; 0 — ніколи не стає DR).</tspan><tspan x="420.0" dy="13.7">2) За однакового пріоритету перемагає найбільший Router ID. Вибір є непереривним (Non-preemptive).</tspan></text>
