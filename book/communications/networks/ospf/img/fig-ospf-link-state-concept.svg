<line x1="620.0" y1="157.0" x2="564.0" y2="192.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="620.0" y1="157.0" x2="676.0" y2="192.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="736.0" y1="162.0" x2="704.0" y2="192.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="570.0" y1="205.0" x2="670.0" y2="205.0" stroke="#27ae60" stroke-width="1.5"/>
<rect x="445.0" y="240.0" width="350.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="620.0" y="280.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">1. Кожен роутер анонсує стан своїх лінків (LSA).</tspan><tspan x="620.0" dy="11.7">2. LSA розливаються лавиною (Flooding) по всій зоні.</tspan><tspan x="620.0" dy="11.7">3. Усі вузли формують ідентичну базу стану каналів (LSDB).</tspan><tspan x="620.0" dy="11.7">4. Кожен запускає SPF (Дейкстру) і будує власне дерево шляхів.</tspan></text>
<rect x="30.0" y="375.0" width="780.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="392.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">OSPF гарантує відсутність петель усередині зони: математично неможливо створити петлю,</tspan><tspan x="420.0" dy="13.7">коли кожен пристрій обчислює найкоротший шлях на єдиному глобальному графі топології.</tspan></text>
