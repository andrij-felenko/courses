<text x="150.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Таблиця R1</text>
<text x="270.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Таблиця R2</text>
<rect x="45.0" y="215.0" width="330.0" height="135.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="210.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">• Роутер передає лише готові вектори (дистанції) сусідам.</tspan><tspan x="210.0" dy="11.7">• Немає карти топології: вузол знає лише куди віддати пакет.</tspan><tspan x="210.0" dy="11.7">• Повільна збіжність, небезпека зациклення (Count to Infinity).</tspan><tspan x="210.0" dy="11.7">• Метрика — кількість хопів (без урахування швидкості лінії).</tspan></text>
<rect x="430.0" y="55.0" width="380.0" height="310.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Підхід стану каналів (OSPF Link-State)</text>
<text x="620.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен вузол має повну топологічну карту мережі</text>
