<rect x="30.0" y="385.0" width="780.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="399.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">• ABR (Area Border Router) — з'єднує звичайну зону з магістральною Area 0 і генерує LSA Type 3.</tspan><tspan x="420.0" dy="13.0">• ASBR (Autonomous System Boundary Router) — імпортує зовнішні маршрути (LSA Type 5 або Type 7).</tspan><tspan x="420.0" dy="13.0">• Зони ізолюють лавинну розсилку LSA: топологічні зміни в одній зоні не змушують перераховувати SPF у сусідніх.</tspan></text>
