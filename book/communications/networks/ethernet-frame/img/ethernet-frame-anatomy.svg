<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 883 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="883" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія кадру Ethernet II (DIX) на фізичному дроті</text>
<rect x="30.0" y="60.0" width="240.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Фізичний рівень (L1) — синхронізація</text>
<rect x="40.0" y="95.0" width="75.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.1"/><text x="77.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="77.5" dy="0.0">IFG</tspan><tspan x="77.5" dy="13.0">(інтервал)</tspan><tspan x="77.5" dy="13.0">12 байтів</tspan><tspan x="77.5" dy="13.0">(96 бітів)</tspan></text>
<rect x="120.0" y="95.0" width="90.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.1"/><text x="165.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Преамбула</tspan><tspan x="165.0" dy="11.7">7 байтів</tspan><tspan x="165.0" dy="11.7">0xAA (10101010)</tspan></text>
<rect x="215.0" y="95.0" width="45.0" height="60.0" rx="6" fill="#fff3cd" stroke="#e67e22" stroke-width="1.3"/><text x="237.5" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="237.5" dy="0.0">SFD</tspan><tspan x="237.5" dy="11.7">1 байт</tspan><tspan x="237.5" dy="11.7">0xAB</tspan></text>
<rect x="280.0" y="60.0" width="530.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="545.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Канальний кадр (L2 Frame) — від 64 до 1518 байтів</text>
<rect x="290.0" y="95.0" width="95.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="337.5" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="337.5" dy="0.0">MAC отримувача</tspan><tspan x="337.5" dy="11.7">(Destination)</tspan><tspan x="337.5" dy="11.7">6 байтів</tspan></text>
<rect x="390.0" y="95.0" width="95.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="437.5" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="437.5" dy="0.0">MAC джерела</tspan><tspan x="437.5" dy="13.0">(Source)</tspan><tspan x="437.5" dy="13.0">6 байтів</tspan></text>
<rect x="490.0" y="95.0" width="80.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="530.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">EtherType</tspan><tspan x="530.0" dy="11.7">2 байти</tspan><tspan x="530.0" dy="11.7">(&gt;= 0x0600)</tspan></text>
<rect x="575.0" y="95.0" width="160.0" height="60.0" rx="6" fill="#fffdf0" stroke="#d4ac0d" stroke-width="1.2"/><text x="655.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Корисні дані (Payload)</tspan><tspan x="655.0" dy="13.0">46 – 1500 байтів</tspan><tspan x="655.0" dy="13.0">(IPv4, IPv6, ARP...)</tspan><tspan x="655.0" dy="13.0">+ Padding якщо &lt; 46 Б</tspan></text>
<rect x="740.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="770.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">FCS / CRC</tspan><tspan x="770.0" dy="11.7">4 байти</tspan><tspan x="770.0" dy="11.7">CRC-32</tspan></text>
<rect x="30.0" y="195.0" width="380.0" height="195.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="220.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок передачі та бітові прапори</text>
<text x="45.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">• Байти йдуть зліва направо: Dst MAC → Src MAC → EtherType.</tspan><tspan x="45.0" dy="15.9">• Усередині кожного байта біти передаються LSB-first (молодшим уперед).</tspan><tspan x="45.0" dy="15.9">• Перший переданий біт Dst MAC — прапор I/G (Unicast / Multicast).</tspan><tspan x="45.0" dy="15.9">• Другий переданий біт Dst MAC — прапор U/L (Universal / Local MAC).</tspan><tspan x="45.0" dy="15.9">• FCS (CRC-32) накриває весь L2-кадр (Dst MAC ... Payload/Pad).</tspan></text>
<rect x="430.0" y="195.0" width="380.0" height="195.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розміри та обмеження (MTU = 1500)</text>
<text x="445.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="445.0" dy="0.0">• Мінімальний L2-кадр: 6 + 6 + 2 + 46 (Pad) + 4 = 64 байти.</tspan><tspan x="445.0" dy="15.9">• Кадр менший за 64 байти вважається Runt/уламком колізії.</tspan><tspan x="445.0" dy="15.9">• Максимальний стандартний L2-кадр: 14 (заголовок) + 1500 + 4 = 1518 байтів.</tspan><tspan x="445.0" dy="15.9">• З тегом 802.1Q VLAN: заголовок 18 байтів → максимум 1522 байти.</tspan><tspan x="445.0" dy="15.9">• Фізична довжина на дроті: L2-кадр + 8 Б (преамбула/SFD) + 12 Б (IFG).</tspan></text>
</svg>