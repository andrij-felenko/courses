<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вставка та структура тега IEEE 802.1Q (VLAN &amp; QoS)</text>
<rect x="30.0" y="55.0" width="760.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="410.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр Ethernet із вставленим тегом 802.1Q (розмір зростає на 4 байти)</text>
<rect x="40.0" y="88.0" width="100.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="90.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">Dst MAC (6B)</tspan></text>
<rect x="145.0" y="88.0" width="100.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="195.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Src MAC (6B)</tspan></text>
<rect x="250.0" y="88.0" width="140.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">802.1Q Tag (4B)</tspan><tspan x="320.0" dy="13.0">TPID + TCI</tspan></text>
<rect x="395.0" y="88.0" width="100.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.1"/><text x="445.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">EtherType (2B)</tspan><tspan x="445.0" dy="13.0">(напр. 0x0800)</tspan></text>
<rect x="500.0" y="88.0" width="205.0" height="42.0" rx="6" fill="#fffdf0" stroke="#d4ac0d" stroke-width="1.1"/><text x="602.5" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="602.5" dy="0.0">Payload (42–1500B)</tspan></text>
<rect x="710.0" y="88.0" width="70.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="745.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">FCS (4B)</tspan></text>
<rect x="30.0" y="160.0" width="760.0" height="235.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="410.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Детальна розкладка 32 бітів тега 802.1Q</text>
<rect x="50.0" y="205.0" width="270.0" height="65.0" rx="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.3"/>
<text x="185.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">TPID (16 бітів)</text>
<text x="185.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x8100 (Tag Protocol Identifier)</text>
<rect x="330.0" y="205.0" width="440.0" height="65.0" rx="4" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.3"/>
<text x="550.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7950b" text-anchor="middle" font-weight="700">TCI — Tag Control Information (16 бітів)</text>
<rect x="340.0" y="235.0" width="110.0" height="30.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.1"/><text x="395.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">PCP (3 біти)</tspan><tspan x="395.0" dy="11.7">Пріоритет QoS</tspan></text>
<rect x="455.0" y="235.0" width="75.0" height="30.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.1"/><text x="492.5" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="492.5" dy="0.0">DEI (1 біт)</tspan><tspan x="492.5" dy="11.7">Скидання</tspan></text>
<rect x="535.0" y="235.0" width="225.0" height="30.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.1"/><text x="647.5" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">VID — VLAN Identifier (12 бітів: 1 – 4094)</tspan></text>
<text x="50.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="50.0" dy="0.0">• TPID (16 бітів) = 0x8100: сигналізує комутатору, що заголовок містить тег VLAN.</tspan><tspan x="50.0" dy="15.9">• PCP (3 біти, 802.1p): 8 класів трафіку від 0 (Best Effort) до 7 (Мережеве керування/голос).</tspan><tspan x="50.0" dy="15.9">• DEI / CFI (1 біт): Drop Eligible Indicator — дозвіл дропати кадр першим при перевантаженні каналу.</tspan><tspan x="50.0" dy="15.9">• VID (12 бітів): номер віртуальної мережі. 0 = пріоритет без VLAN, 1 = default VLAN, 4095 = reserved.</tspan></text>
</svg>