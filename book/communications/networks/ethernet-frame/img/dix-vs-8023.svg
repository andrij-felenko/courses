<text x="420.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Значення &lt;= 1500 (0x05DC) інтерпретується як ДОВЖИНА  |  Значення &gt;= 1536 (0x0600) інтерпретується як ETHERTYPE</text>
