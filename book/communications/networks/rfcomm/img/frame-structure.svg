<text x="205.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Керування</text>
<text x="205.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 байт</text>
<rect x="260.0" y="70.0" width="120.0" height="54.0" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="320.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Довжина</text>
<text x="320.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 або 2 байти</text>
<rect x="380.0" y="70.0" width="100.0" height="54.0" rx="5" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.8"/>
<text x="430.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="700">Кредити</text>
<text x="430.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 байт (опція)</text>
<rect x="480.0" y="70.0" width="150.0" height="54.0" rx="5" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
<text x="555.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Корисні дані</text>
<text x="555.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 .. N байтів</text>
<rect x="630.0" y="70.0" width="90.0" height="54.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="675.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Контроль</text>
<text x="675.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 байт</text>
<rect x="40.0" y="160.0" width="210.0" height="140.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="145.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Поле адреси (1 байт)</text>
<text x="145.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Біт 0: EA = 1 (кінець адреси)</text>
<text x="145.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Біт 1: C/R (команда / відповідь)</text>
<text x="145.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Біт 2: D (напрямок ініціатора)</text>
<text x="145.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Біти 3..7: Номер Server Channel</text>
<text x="145.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">DLCI = (ServerChannel &lt;&lt; 1) | D</text>
<rect x="270.0" y="160.0" width="220.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="380.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Керування та довжина</text>
<text x="380.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">SABM (0x2F / 0x3F) — запуск</text>
<text x="380.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">UA (0x63 / 0x73) — підтвердження</text>
<text x="380.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">UIH (0xEF / 0xFF) — потік даних</text>
<text x="380.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">DISC (0x43 / 0x53) — розрив</text>
<text x="380.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">P/F = 1 в UIH вмикає байт Credits</text>
<rect x="510.0" y="160.0" width="210.0" height="140.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="615.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Контрольна сума FCS (CRC-8)</text>
<text x="615.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для SABM, UA, DISC, DM:</text>
<text x="615.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Рахується по: Addr + Ctrl + Len</text>
<text x="615.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Для кадрів UIH (дані):</text>
<text x="615.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Рахується ТІЛЬКИ по: Addr + Ctrl</text>
<text x="615.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">(швидкий пропуск даних)</text>
<text x="380.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Кадр RFCOMM інкапсулюється в пакет L2CAP без повторного додавання преамбули</text>
</svg>