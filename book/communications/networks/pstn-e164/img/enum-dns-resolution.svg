<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм трансляції телефонного номера E.164 в SIP URI через DNS ENUM</text>
<rect x="40.0" y="50.0" width="780.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Крок 1. Вхідний номер E.164</text>
<text x="60.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">+380 44 123 4567</text>
<text x="60.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(Номер у міжнародному форматі)</text>
<rect x="40.0" y="135.0" width="780.0" height="88.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="60.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="700">Крок 2. Нормалізація та реверс цифр</text>
<text x="60.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Видалення символів крім цифр: 380441234567</text>
<text x="60.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Реверс послідовності: 765432144083</text>
<text x="60.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Розділення крапками та суфікс: 7.6.5.4.3.2.1.4.4.0.8.3.e164.arpa</text>
<rect x="40.0" y="235.0" width="780.0" height="88.0" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="60.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0891b2" text-anchor="start" font-weight="700">Крок 3. Запит до системи доменних імен (DNS NAPTR)</text>
<text x="60.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">DNS Query: Type NAPTR для домену «7.6.5.4.3.2.1.4.4.0.8.3.e164.arpa»</text>
<text x="60.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Відповідь DNS: Запис Naming Authority Pointer (RFC 3403 / RFC 6116):</text>
<text x="60.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IN NAPTR 100 10 &quot;u&quot; &quot;E2U+sip&quot; &quot;!^.*$!sip:user@operator.ua!&quot; .</text>
<rect x="40.0" y="355.0" width="780.0" height="88.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Крок 4. Обчислення регулярного виразу та результат</text>
<text x="60.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Підстановка регулярного виразу до вхідного номера:</text>
<text x="60.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Цільовий URI адресації VoIP: sip:user@operator.ua</text>
<text x="60.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Маршрутизація SIP INVITE безпосередньо через IP-мережу</text>
<line x1="430.0" y1="118.0" x2="430.0" y2="133.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="218.0" x2="430.0" y2="233.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="338.0" x2="430.0" y2="353.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ENUM перетворює телефонний номер на глобальне доменне ім'я для прямого з'єднання IP-до-IP.</text>
</svg>