<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія міжкадрових інтервалів (IFS) у стандарті IEEE 802.11</text>
<line x1="50.0" y1="140.0" x2="790.0" y2="140.0" stroke="#333333" stroke-width="2.0"/>
<line x1="780.0" y1="140.0" x2="810.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="810.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="end" font-weight="700">Час</text>
<rect x="50.0" y="80.0" width="110.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="105.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Попередня</text>
<text x="105.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">передача</text>
<line x1="160.0" y1="70.0" x2="160.0" y2="280.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="160.0" y="155.0" width="80.0" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="200.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">SIFS (16 мкс)</text>
<rect x="240.0" y="150.0" width="120.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="300.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ACK / CTS / фрагмент</text>
<text x="300.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">(найвищий пріоритет)</text>
<rect x="160.0" y="200.0" width="130.0" height="26.0" rx="6" fill="#fff7e6" stroke="#d97706" stroke-width="1.4"/>
<text x="225.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">PIFS (25 мкс) = SIFS + 1 слот</text>
<rect x="290.0" y="195.0" width="110.0" height="36.0" rx="6" fill="#fff7e6" stroke="#d97706" stroke-width="1.4"/>
<text x="345.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Опитування AP</text>
<text x="345.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">(режим PCF / маяки)</text>
<rect x="160.0" y="245.0" width="180.0" height="26.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="250.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">DIFS (34 мкс) = SIFS + 2 слоти</text>
<rect x="340.0" y="240.0" width="130.0" height="36.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="405.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Звичайні дані (DCF)</text>
<text x="405.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">+ випадковий Backoff</text>
<rect x="475.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="491.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">1</text>
<rect x="507.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="523.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">2</text>
<rect x="539.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="555.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">3</text>
<rect x="571.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="587.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">4</text>
<rect x="603.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="619.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">5</text>
<rect x="635.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="651.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">6</text>
<rect x="667.0" y="105.0" width="32.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="683.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">7</text>
<text x="587.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Слоти змагань (Backoff Slots, по 9 мкс)</text>
<rect x="160.0" y="30.0" width="420.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="370.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">EIFS (SIFS + DIFS + ACK) — пауза при отриманні битого кадру</text>
<text x="420.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Коротша пауза гарантує вищий пріоритет: термінові службові кадри (ACK) випереджають звичайні дані.</text>
</svg>