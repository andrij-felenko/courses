<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Топологічні аномалії спільного радіоефіру</text>
<rect x="25.0" y="55.0" width="380.0" height="335.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.6"/>
<text x="215.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Проблема прихованого вузла</text>
<circle cx="95.0" cy="185.0" r="80.0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.2"/>
<circle cx="335.0" cy="185.0" r="80.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="95.0" cy="185.0" r="20.0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="95.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<circle cx="215.0" cy="185.0" r="22.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="215.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B (AP)</text>
<circle cx="335.0" cy="185.0" r="20.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="335.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C</text>
<line x1="120.0" y1="185.0" x2="190.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="155.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">DATA</text>
<line x1="310.0" y1="185.0" x2="240.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">DATA</text>
<rect x="145.0" y="275.0" width="140.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="215.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Колізія на вузлі B!</text>
<text x="215.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">A і C не чують одне одного</text>
<text x="215.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Фізичне прослуховування безсиле:</text>
<text x="215.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">A і C вважають, що канал вільний.</text>
<rect x="435.0" y="55.0" width="380.0" height="335.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.6"/>
<text x="625.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Проблема засвіченого вузла</text>
<circle cx="475.0" cy="185.0" r="18.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="475.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="565.0" cy="185.0" r="18.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="565.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B</text>
<circle cx="685.0" cy="185.0" r="18.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="685.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">C</text>
<circle cx="775.0" cy="185.0" r="18.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="775.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">D</text>
<line x1="545.0" y1="185.0" x2="498.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="522.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">B → A</text>
<line x1="705.0" y1="185.0" x2="752.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="3 3"/>
<line x1="745.0" y1="185.0" x2="754.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">C → D</text>
<line x1="585.0" y1="185.0" x2="665.0" y2="185.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="625.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">чує B</text>
<rect x="540.0" y="275.0" width="170.0" height="46.0" rx="6" fill="#fff7e6" stroke="#d97706" stroke-width="1.4"/>
<text x="625.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Хибне мовчання вузла C</text>
<text x="625.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">Передача C → D не шкодить A!</text>
<text x="625.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">C чує мовлення B і блокує відправку,</text>
<text x="625.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">даремно втрачаючи ємність каналу.</text>
<text x="420.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Приховані вузли руйнують кадри колізіями; засвічені вузли блокують паралельні незалежні передачі.</text>
</svg>