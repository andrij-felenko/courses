<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому виявлення колізій (CSMA/CD) не працює в радіоефірі</text>
<rect x="30.0" y="55.0" width="370.0" height="320.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.6"/>
<text x="215.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Дротовий Ethernet (CSMA/CD)</text>
<line x1="55.0" y1="175.0" x2="375.0" y2="175.0" stroke="#333333" stroke-width="4.0"/>
<text x="215.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Спільний кабель (коаксіал / вита пара)</text>
<circle cx="95.0" cy="175.0" r="24.0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="95.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Вузол A</text>
<circle cx="335.0" cy="175.0" r="24.0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="335.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Вузол B</text>
<text x="95.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">TX: 2.0 В</text>
<text x="335.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">TX: 2.0 В</text>
<rect x="130.0" y="250.0" width="170.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="215.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Накладання сигналів</text>
<text x="215.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">U = 2.0 В + 1.8 В ≈ 3.8 В</text>
<text x="215.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Рівні напруги співмірні → приймач легко</text>
<text x="215.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">детектує стрибок напруги під час передачі</text>
<rect x="440.0" y="55.0" width="370.0" height="320.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.6"/>
<text x="625.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Бездротовий ефір (Wi-Fi)</text>
<circle cx="495.0" cy="175.0" r="24.0" fill="#fff7e6" stroke="#c0392b" stroke-width="1.8"/>
<text x="495.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Станція A</text>
<circle cx="755.0" cy="175.0" r="24.0" fill="#fff7e6" stroke="#c0392b" stroke-width="1.8"/>
<text x="755.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Станція B</text>
<text x="495.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">TX: +20 дБм (100 мВт)</text>
<text x="755.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">TX: +20 дБм (100 мВт)</text>
<line x1="525.0" y1="175.0" x2="725.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="625.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Затухання у просторі (-80 дБ)</text>
<rect x="500.0" y="240.0" width="250.0" height="68.0" rx="6" fill="#fff2e8" stroke="#c0392b" stroke-width="1.4"/>
<text x="625.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Власний TX: 100 мВт (+20 дБм)</text>
<text x="625.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чужий сигнал: 0.00001 мВт (-80 дБм)</text>
<text x="625.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Різниця 10 000 000 разів (100 дБ)</text>
<text x="625.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Власний передавач глушить приймач:</text>
<text x="625.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">чути чужу колізію під час мовлення неможливо</text>
<text x="420.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">У радіоефірі колізію не можна вчасно перервати — її слід уникати наперед (Collision Avoidance).</text>
</svg>