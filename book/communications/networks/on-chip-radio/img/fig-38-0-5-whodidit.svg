<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Хто що зробив: техніка, назва, стандарт — різні люди</text>
<text x="450.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">винахід колективний: одні створили радіо, інший дав назву, консорціум зробив стандартом</text>
<rect x="55.0" y="92.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="190.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ТЕХНІКА</text>
<text x="190.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ericsson, Лунд</text>
<circle cx="77.0" cy="168.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="91.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Яап Гаартсен («батько Bluetooth»)</text>
<circle cx="77.0" cy="194.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="91.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Свен Маттіссон</text>
<circle cx="77.0" cy="220.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="91.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">коротке дешеве радіо, з 1994</text>
<rect x="345.0" y="92.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#0a3d91" stroke-width="2.2"/>
<text x="480.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#0a3d91" text-anchor="middle" font-weight="bold" font-style="normal">НАЗВА</text>
<text x="480.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Intel</text>
<circle cx="367.0" cy="168.0" r="3.5" fill="#0a3d91" stroke="#0a3d91" stroke-width="0"/>
<text x="381.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Джим Кардач</text>
<circle cx="367.0" cy="194.0" r="3.5" fill="#0a3d91" stroke="#0a3d91" stroke-width="0"/>
<text x="381.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кодова назва зі скандинавських саг</text>
<circle cx="367.0" cy="220.0" r="3.5" fill="#0a3d91" stroke="#0a3d91" stroke-width="0"/>
<text x="381.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ідея «об'єднувача»</text>
<rect x="635.0" y="92.0" width="270.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2.2"/>
<text x="770.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">СТАНДАРТ</text>
<text x="770.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SIG (1998)</text>
<circle cx="657.0" cy="168.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="671.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ericsson + Intel + Nokia</text>
<circle cx="657.0" cy="194.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="671.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">+ IBM + Toshiba</text>
<circle cx="657.0" cy="220.0" r="3.5" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="671.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">спільний відкритий стандарт</text>
<rect x="60.0" y="312.0" width="780.0" height="44.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як і з радіо чи транзистором, тут немає одного «винахідника»: техніка, назва й стандарт — праця різних команд.</text>
