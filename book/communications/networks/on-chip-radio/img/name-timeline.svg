<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як радіо назвали іменем вікінга — ланцюг подій</text>
<line x1="200.0" y1="70.0" x2="200.0" y2="520.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="200.0" cy="100.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="180.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">~960</text>
<text x="224.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Гаральд Синьозубий</text>
<text x="224.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Король данів об'єднує розрізнені племена в одне королівство — звідси вся метафора</text>
<circle cx="200.0" cy="185.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="180.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1994</text>
<text x="224.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Ericsson, Лунд</text>
<text x="224.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Яап Гаартсен і Свен Маттіссон починають дешеве коротке радіо без дротів</text>
<circle cx="200.0" cy="278.0" r="9.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<circle cx="200.0" cy="278.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="180.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">~1996</text>
<text x="224.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Джим Кардач, Intel</text>
<text x="224.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Зі скандинавських саг («Рудий Орм») бере КОДОВУ назву: об'єднає протоколи, як король — племена</text>
<circle cx="200.0" cy="371.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="180.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1998</text>
<text x="224.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">SIG: 5 компаній</text>
<text x="224.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Ericsson, Intel, Nokia, IBM, Toshiba творять консорціум; шукають «серйозну» назву</text>
<circle cx="200.0" cy="456.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="180.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">1998</text>
<text x="224.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">PAN і RadioWire провалились</text>
<text x="224.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">PAN не пройшов перевірку марки, RadioWire не встигли перевірити — лишився Bluetooth</text>
<rect x="60.0" y="500.0" width="640.0" height="44.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="525.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Технологію зробили в Лунді, назвали жартома в Intel — а «серйозне» ім'я так і не вигадали.</tspan></text>
</svg>