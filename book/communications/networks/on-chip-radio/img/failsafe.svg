<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек ховає повтори — а повну втрату зв'язку ловиш ТИ</text>
<rect x="110.0" y="96.0" width="540.0" height="56.0" rx="10" fill="#eaf6ec" stroke="#27ae60" stroke-width="2.0"/>
<text x="132.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">твій застосунок</text>
<text x="132.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">send() / on_receive()  +  FAILSAFE на тривалу тишу</text>
<rect x="110.0" y="164.0" width="540.0" height="56.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="132.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">стек радіо (Wi-Fi / BT)</text>
<text x="132.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">пакети, CRC, ACK, повтори — усе ховається тут</text>
<rect x="110.0" y="232.0" width="540.0" height="56.0" rx="10" fill="#ffffff" stroke="#b08900" stroke-width="2.0"/>
<text x="132.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="700">радіо на чіпі</text>
<text x="132.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">антена, модуляція, біти по повітрю</text>
<line x1="380.0" y1="152.0" x2="380.0" y2="164.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="380.0" y1="220.0" x2="380.0" y2="232.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="304.0" width="660.0" height="46.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="330.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Межа відповідальності: повтори окремих пакетів — справа чіпа; реакція на ПОВНУ втрату зв'язку — твоя.</tspan></text>
</svg>