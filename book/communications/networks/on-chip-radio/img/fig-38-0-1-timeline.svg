<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<rect width="900" height="640" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як радіо назвали іменем вікінга — ланцюг подій</text>
<text x="450.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">технологію зробили в Лунді, назвали жартома в Інтелі, а «серйозне» ім'я так і не встигли вигадати</text>
<line x1="230.0" y1="96.0" x2="230.0" y2="612.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="230.0" cy="126.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~960</text>
<text x="256.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Гаральд Синьозубий</text>
<text x="256.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Король данів об'єднує розрізнені племена в одне королівство — звідси й уся метафора</text>
<circle cx="230.0" cy="217.2" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="222.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1994</text>
<text x="256.0" y="214.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ericsson, Лунд</text>
<text x="256.0" y="234.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Яап Гаартсен і Свен Маттіссон починають дешеве коротке радіо, щоб з'єднати пристрої без дротів</text>
<circle cx="230.0" cy="308.4" r="10.0" fill="#fff" stroke="#0a3d91" stroke-width="3"/>
<circle cx="230.0" cy="308.4" r="4.5" fill="#0a3d91" stroke="#0a3d91" stroke-width="0"/>
<text x="208.0" y="313.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1997</text>
<text x="256.0" y="305.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#0a3d91" text-anchor="start" font-weight="bold" font-style="normal">Джим Кардач, Intel</text>
<text x="256.0" y="325.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Зі скандинавських саг («Рудий Орм») бере КОДОВУ назву: «об'єднає протоколи, як король — племена»</text>
<circle cx="230.0" cy="399.6" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="404.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1998</text>
<text x="256.0" y="396.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SIG: 5 компаній</text>
<text x="256.0" y="416.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Ericsson, Intel, Nokia, IBM, Toshiba творять консорціум; шукають «серйозну» назву</text>
<circle cx="230.0" cy="490.8" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="208.0" y="495.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1998</text>
<text x="256.0" y="487.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">PAN і RadioWire провалились</text>
<text x="256.0" y="507.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">PAN не пройшов перевірку торгової марки, RadioWire не встигли перевірити — лишився Bluetooth</text>
<rect x="222.0" y="574.0" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="208.0" y="587.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Розділ 38</text>
<text x="256.0" y="579.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Радіо на чіпі сьогодні</text>
<text x="256.0" y="599.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Той самий Bluetooth (і Wi-Fi) уже всередині мікроконтролера — як ним користуватися</text>
</svg>
