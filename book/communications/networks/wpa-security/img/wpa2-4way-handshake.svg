<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириетапне рукостискання WPA2-PSK (4-Way Handshake)</text>
<rect x="127.5" y="38.6" width="104.9" height="62.8" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="57.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Клієнт (STA)</tspan><tspan x="180.0" dy="16.9">Supplicant</tspan><tspan x="180.0" dy="16.9">MAC: SPA</tspan></text>
<rect x="705.3" y="38.6" width="149.4" height="62.8" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="780.0" y="57.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Точка доступу (AP)</tspan><tspan x="780.0" dy="16.9">Authenticator</tspan><tspan x="780.0" dy="16.9">MAC: AA</tspan></text>
<line x1="180.0" y1="105.0" x2="180.0" y2="525.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="780.0" y1="105.0" x2="780.0" y2="525.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="290.0" y="115.0" width="380.0" height="30.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Попередній спільний ключ: PMK = PBKDF2(Пароль, SSID, 4096)</text>
<line x1="780.0" y1="175.0" x2="180.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="155.0" width="320.0" height="34.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">M1: EAPOL-Key [ANonce, Key Replay Ctr = 1]</text>
<text x="480.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">AP генерує псевдовипадкове число ANonce</text>
<rect x="40.0" y="210.0" width="240.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">STA генерує SNonce</tspan><tspan x="160.0" dy="11.7">PTK = PRF-512(PMK, AA, SPA, ANonce, SNonce)</tspan><tspan x="160.0" dy="11.7">PTK = KCK(128) || KEK(128) || TK(128)</tspan></text>
<line x1="180.0" y1="290.0" x2="780.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="270.0" width="360.0" height="34.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">M2: EAPOL-Key [SNonce, RSN-IE, MIC (через KCK)]</text>
<text x="480.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">STA доводить знання PMK; мішень офлайн-атак!</text>
<rect x="680.0" y="325.0" width="240.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="325.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">AP обчислює PTK</tspan><tspan x="800.0" dy="13.0">Перевіряє EAPOL-MIC через KCK</tspan><tspan x="800.0" dy="13.0">Генерує груповий ключ GTK</tspan></text>
<line x1="780.0" y1="405.0" x2="180.0" y2="405.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="385.0" width="380.0" height="34.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">M3: EAPOL-Key [ANonce, MIC, Enc(KEK, GTK), Install=1]</text>
<text x="480.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Наказ встановити PTK/GTK; вразливий до KRACK повторів</text>
<line x1="180.0" y1="470.0" x2="780.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="450.0" width="320.0" height="34.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="480.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">M4: EAPOL-Key [Key Replay Ctr, MIC]</text>
<text x="480.0" y="479.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Підтвердження завершення: перехід на CCMP</text>
<rect x="210.0" y="508.0" width="540.0" height="26.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="480.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Канал встановлено: кадри шифруються AES-CCMP через сеансовий ключ TK</text>
</svg>