<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плавно чи з обриву: як гасне картинка на краю дальності</text>
<line x1="90.0" y1="300.0" x2="690.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="90.0" y1="300.0" x2="90.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="690.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="700">слабшання сигналу / відстань →</text>
<text x="96.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">↑ якість картинки</text>
<polyline points="90.0,92.0 200.0,110.0 310.0,142.0 420.0,186.0 530.0,236.0 630.0,278.0 690.0,292.0" fill="none" stroke="#2457d6" stroke-width="2.6" stroke-linejoin="round"/>
<text x="340.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">аналог — плавно</text>
<text x="560.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">сніг росте, та видно</text>
<text x="560.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">→ є запас і попередження</text>
<polyline points="90.0,86.0 310.0,86.0 430.0,94.0 450.0,102.0 458.0,294.0" fill="none" stroke="#b9770e" stroke-width="2.6" stroke-linejoin="round"/>
<text x="110.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">цифра — з обриву</text>
<circle cx="450.0" cy="102.0" r="5.0" fill="#fdeeec" stroke="#c0392b" stroke-width="1.4"/>
<text x="464.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">«обрив»: ідеально… і раптом</text>
<text x="464.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">стоп-кадр / розсип квадратів</text>
<rect x="90.0" y="332.0" width="600.0" height="40.0" rx="6" fill="#fbf6ea" stroke="#b9770e" stroke-width="1.4"/>
<text x="390.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a5310" text-anchor="middle">адаптивний бітрейт і FEC пом'якшують обрив — та зовсім його не прибрати:</text>
<text x="390.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a5310" text-anchor="middle">за порогом декодер просто не збере кадр</text>
</svg>