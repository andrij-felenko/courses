<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві адреси пристрою: MAC і IP — різні рівні</text>
<rect x="50.0" y="80.0" width="320.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="210.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">MAC — апаратна</text>
<rect x="80.0" y="124.0" width="260.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="210.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">A4:CF:12:9B:5E:07</tspan></text>
<text x="210.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">• випалена виробником у радіо</tspan><tspan x="210.0" dy="17.6">• унікальна, не міняється</tspan><tspan x="210.0" dy="17.6">• «паспорт заліза» — хто це</tspan></text>
<rect x="390.0" y="80.0" width="320.0" height="180.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="550.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">IP — мережева</text>
<rect x="440.0" y="124.0" width="220.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="550.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">192.168.1.12</tspan></text>
<text x="550.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">• видана цією мережею</tspan><tspan x="550.0" dy="17.6">• може змінюватися</tspan><tspan x="550.0" dy="17.6">• «де він зараз» у мережі</tspan></text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">MAC — як ім'я людини (дане раз); IP — як її поточна адреса проживання (з переїздом міняється).</text>
</svg>