<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">З IP-адресою маленький чіп дістає весь інтернет</text>
<rect x="30.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="105.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ESP32</text>
<text x="105.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">192.168.1.12</tspan></text>
<line x1="180.0" y1="150.0" x2="220.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="220.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.7"/>
<text x="295.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Роутер</text>
<text x="295.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">шлюз</tspan></text>
<line x1="370.0" y1="150.0" x2="410.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.7"/>
<text x="485.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Інтернет</text>
<text x="485.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">маршрути, DNS</tspan></text>
<line x1="560.0" y1="150.0" x2="600.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="110.0" width="150.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="675.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер / хмара</text>
<text x="675.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">час, оновлення,</tspan><tspan x="675.0" dy="13.5">команди</tspan></text>
<text x="390.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Уся складність інтернету працює так само, як для ноутбука: ESP32 — просто ще один вузол із IP.</text>
</svg>