<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приєднання до Wi-Fi: чотири кроки до «в мережі»</text>
<rect x="42.0" y="104.0" width="150.0" height="92.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="117.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Скан</text>
<text x="117.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="117.0" dy="0.0">хто в ефірі?</tspan><tspan x="117.0" dy="15.4">слухаю SSID</tspan></text>
<line x1="192.0" y1="150.0" x2="224.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="224.0" y="104.0" width="150.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="299.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Автентифікація</text>
<text x="299.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="299.0" dy="0.0">доводжу пароль</tspan><tspan x="299.0" dy="15.4">(WPA2/WPA3)</tspan></text>
<line x1="374.0" y1="150.0" x2="406.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="406.0" y="104.0" width="150.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.7"/>
<text x="481.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">3. Асоціація</text>
<text x="481.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="481.0" dy="0.0">AP приймає</tspan><tspan x="481.0" dy="15.4">мене в мережу</tspan></text>
<line x1="556.0" y1="150.0" x2="588.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="588.0" y="104.0" width="150.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="663.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4. IP-адреса</text>
<text x="663.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="663.0" dy="0.0">роутер видає IP</tspan><tspan x="663.0" dy="15.4">(DHCP)</tspan></text>
<text x="390.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Доки немає IP — пристрій ще НЕ в мережі: саме видача адреси завершує приєднання.</text>
</svg>