<rect x="60.0" y="292.0" width="780.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Аналогія: IP — це будинок, порт — квартира в ньому. А НАДІЙНО чи ШВИДКО доставляти — вирішує TCP/UDP (§38.4).</text>
