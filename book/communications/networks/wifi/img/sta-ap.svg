<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">AP — точка доступу</text>
<circle cx="560.0" cy="150.0" r="30.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="560.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ESP32</text>
<rect x="480.0" y="248.0" width="160.0" height="48.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/>
