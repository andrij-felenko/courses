<line x1="560.0" y1="248.0" x2="560.0" y2="184.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">STA — щоб вийти в інтернет; AP — щоб віддати дані напряму. ESP32 уміє й обидва разом (AP+STA).</text>
