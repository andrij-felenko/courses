<circle cx="200.0" cy="268.0" r="30.0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="200.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ESP32</text>
<line x1="200.0" y1="238.0" x2="200.0" y2="172.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="248.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">заходжу</text>
