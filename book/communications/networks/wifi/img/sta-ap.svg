<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP32 по обидва боки Wi-Fi: STA проти AP</text>
<rect x="40.0" y="70.0" width="320.0" height="250.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="200.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">STA — клієнт (station)</text>
<rect x="120.0" y="120.0" width="160.0" height="48.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/>
