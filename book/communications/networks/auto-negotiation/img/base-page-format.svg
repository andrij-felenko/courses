<rect x="26.0" y="165.0" width="235.0" height="185.0" rx="6" fill="#f0f9ff" stroke="#2457d6" stroke-width="1.5"/><text x="143.5" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="143.5" dy="0.0">S[4:0] — Поле селектора:</tspan><tspan x="143.5" dy="14.3">• 00001 = IEEE 802.3 Ethernet</tspan><tspan x="143.5" dy="14.3">• 00010 = IEEE 802.9 ISLAN-16T</tspan><tspan x="143.5" dy="14.3">• 00100 = IEEE 802.5 Token Ring</tspan><tspan x="143.5" dy="14.3">• 00101 = IEEE 802.3 Annex 28F</tspan><tspan x="143.5" dy="14.3">Усі сучасні Ethernet-чипи</tspan><tspan x="143.5" dy="14.3">передають строго 00001b.</tspan></text>
<rect x="271.0" y="165.0" width="375.0" height="185.0" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="458.5" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="458.5" dy="0.0">A[7:0] — Технологічні можливості:</tspan><tspan x="458.5" dy="14.3">• D5 (A0): 10BASE-T Half-Duplex</tspan><tspan x="458.5" dy="14.3">• D6 (A1): 10BASE-T Full-Duplex</tspan><tspan x="458.5" dy="14.3">• D7 (A2): 100BASE-TX Half-Duplex</tspan><tspan x="458.5" dy="14.3">• D8 (A3): 100BASE-TX Full-Duplex</tspan><tspan x="458.5" dy="14.3">• D9 (A4): 100BASE-T4 (4 пари Cat3)</tspan><tspan x="458.5" dy="14.3">• D10 (A5): Симетричний PAUSE (802.3x)</tspan><tspan x="458.5" dy="14.3">• D11 (A6): Асиметричний PAUSE</tspan><tspan x="458.5" dy="14.3">• D12 (A7): Extended Next Page (10GBASE-T)</tspan></text>
<rect x="656.0" y="165.0" width="138.0" height="185.0" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/><text x="725.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Керуючі біти:</tspan><tspan x="725.0" dy="14.3"></tspan><tspan x="725.0" dy="14.3">• RF (D13):</tspan><tspan x="725.0" dy="14.3">  Помилка на</tspan><tspan x="725.0" dy="14.3">  віддаленому кінці</tspan><tspan x="725.0" dy="14.3"></tspan><tspan x="725.0" dy="14.3">• ACK (D14):</tspan><tspan x="725.0" dy="14.3">  Успішний прийом</tspan><tspan x="725.0" dy="14.3">  3 однакових слів</tspan><tspan x="725.0" dy="14.3"></tspan><tspan x="725.0" dy="14.3">• NP (D15):</tspan><tspan x="725.0" dy="14.3">  Запит обміну</tspan><tspan x="725.0" dy="14.3">  Next Page</tspan></text>
