<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Пропускна здатність: бітрейт мусить улізти під стелю</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">канал несе обмежено біт/с, і ця «стеля» падає з відстанню; відеобітрейт має йти ПІД нею, з запасом — інакше затори й втрати</text>
<polygon points="110,160 820,340 820,370 110,370" fill="#dbeafe" fill-opacity="1.0" stroke="none" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="465,250 820,250 820,340" fill="#fecaca" fill-opacity="1.0" stroke="none" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="110" y1="370" x2="850" y2="370" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="110" y1="370" x2="110" y2="120" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="845" y="392" font-size="10" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">відстань / завади →</text>
<text x="116" y="116" font-size="10" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">↑ біт/с</text>
<line x1="110" y1="160" x2="820" y2="340" stroke="#1f4ed8" stroke-width="2.8" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="150" y="148" font-size="10" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">стеля = доступна смуга</text>
<text x="150" y="163" font-size="8.5" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">(падає з відстанню/завадами)</text>
<line x1="110" y1="250" x2="820" y2="250" stroke="#cc0000" stroke-width="2.2" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="118" y="242" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">сталий бітрейт</text>
<circle cx="465" cy="250" r="5" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="470" y="238" font-size="9.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">тут бітрейт переріс смугу</text>
<text x="690" y="296" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ЗАТОРИ · ВТРАТИ</text>
<line x1="110" y1="178" x2="820" y2="356" stroke="#0a8f3c" stroke-width="2.4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="210" y="205" font-size="9.5" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">адаптивний (повзе під стелею)</text>
<text x="480.0" y="446" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Золоте правило: бітрейт — нижче найгіршої смуги, із запасом. Адаптивний кодек сам сповзає за стелею; аналог цього не вміє.</text>
</svg>
