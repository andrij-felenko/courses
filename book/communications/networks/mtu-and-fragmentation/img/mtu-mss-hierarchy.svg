<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія розмірів: від фізичного кадру L2 до TCP MSS</text>
<rect x="30.0" y="55.0" width="820.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="45.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Кадр на фізичному дроті (Wire Frame) — 1538 байтів загалом</text>
<rect x="40.0" y="85.0" width="75.0" height="55.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.1"/><text x="77.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="77.5" dy="0.0">IFG + Preamble</tspan><tspan x="77.5" dy="11.7">+ SFD</tspan><tspan x="77.5" dy="11.7">20 байтів (L1)</tspan></text>
<rect x="120.0" y="85.0" width="95.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="167.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.5" dy="0.0">L2 Заголовок</tspan><tspan x="167.5" dy="11.7">(Dst, Src, Type)</tspan><tspan x="167.5" dy="11.7">14 байтів</tspan></text>
<rect x="220.0" y="85.0" width="550.0" height="55.0" rx="6" fill="#fffdf0" stroke="#d4ac0d" stroke-width="1.4"/><text x="495.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Канальне корисне навантаження / Link MTU (IP-пакет)</tspan><tspan x="495.0" dy="14.3">1500 байтів (максимальний неподільний L3 блок)</tspan></text>
<rect x="775.0" y="85.0" width="65.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="807.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="807.5" dy="0.0">FCS</tspan><tspan x="807.5" dy="11.7">CRC-32</tspan><tspan x="807.5" dy="11.7">4 байти</tspan></text>
<rect x="220.0" y="165.0" width="550.0" height="80.0" rx="6" fill="#fffdf0" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="235.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7950b" text-anchor="start" font-weight="700">Мережевий рівень (IP MTU = 1500 байтів)</text>
<rect x="230.0" y="192.0" width="110.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="285.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">IPv4 Header</tspan><tspan x="285.0" dy="11.7">20 байтів</tspan><tspan x="285.0" dy="11.7">(IPv6: 40 Б)</tspan></text>
<rect x="345.0" y="192.0" width="415.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="552.5" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="552.5" dy="0.0">IP Payload (TCP сегмент або UDP датаграма)</tspan><tspan x="552.5" dy="13.0">1480 байтів для IPv4 (1460 байтів для IPv6)</tspan></text>
<rect x="345.0" y="260.0" width="415.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="360.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Транспортний рівень (TCP Segment)</text>
<rect x="355.0" y="287.0" width="105.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="407.5" y="300.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="407.5" dy="0.0">TCP Header</tspan><tspan x="407.5" dy="11.7">20 байтів</tspan><tspan x="407.5" dy="11.7">(без опцій)</tspan></text>
<rect x="465.0" y="287.0" width="285.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="607.5" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="607.5" dy="0.0">TCP MSS (Maximum Segment Size)</tspan><tspan x="607.5" dy="13.0">1460 байтів (IPv4) / 1440 байтів (IPv6)</tspan><tspan x="607.5" dy="13.0">Чисті дані прикладного рівня</tspan></text>
<rect x="30.0" y="355.0" width="820.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Категорії розмірів MTU в сучасних мережах:</text>
<rect x="40.0" y="385.0" width="255.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="167.5" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="167.5" dy="0.0">Стандартний Ethernet</tspan><tspan x="167.5" dy="11.7">MTU = 1500 байтів</tspan><tspan x="167.5" dy="11.7">L2 кадр: 1518 Б (1522 з VLAN)</tspan><tspan x="167.5" dy="11.7">Базовий стандарт глобального інтернету</tspan></text>
<rect x="305.0" y="385.0" width="260.0" height="70.0" rx="6" fill="#eefaf2" stroke="#27ae60" stroke-width="1.1"/><text x="435.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Baby Giant / Mini-Jumbo</tspan><tspan x="435.0" dy="11.7">MTU = 1508 – 1600 байтів</tspan><tspan x="435.0" dy="11.7">L2 кадр: до 1618 Б</tspan><tspan x="435.0" dy="11.7">Запас під QinQ, MPLS, PPPoE у провайдерів</tspan></text>
<rect x="575.0" y="385.0" width="265.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="707.5" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Jumbo Frames (ЦОД / SAN / NAS)</tspan><tspan x="707.5" dy="11.7">MTU = 9000 байтів</tspan><tspan x="707.5" dy="11.7">L2 кадр: 9018 Б (MSS = 8960 Б)</tspan><tspan x="707.5" dy="11.7">Зменшення переривань CPU у 6 разів</tspan></text>
</svg>