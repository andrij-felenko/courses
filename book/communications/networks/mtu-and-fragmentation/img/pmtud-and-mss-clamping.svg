<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">PMTUD Black Hole проти апаратного MSS Clamping</text>
<rect x="30.0" y="55.0" width="395.0" height="385.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.4"/>
<text x="227.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Проблема: Path MTU Black Hole</text>
<rect x="45.0" y="95.0" width="105.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="97.5" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="97.5" dy="0.0">Клієнт (Host A)</tspan><tspan x="97.5" dy="11.7">MTU 1500</tspan><tspan x="97.5" dy="11.7">DF = 1</tspan></text>
<rect x="175.0" y="95.0" width="105.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="227.5" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Маршрутизатор R1</tspan><tspan x="227.5" dy="11.7">(Тунель MTU 1420)</tspan></text>
<rect x="305.0" y="95.0" width="105.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="357.5" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="357.5" dy="0.0">Сервер (Host B)</tspan><tspan x="357.5" dy="11.7">MTU 1500</tspan></text>
<rect x="45.0" y="155.0" width="365.0" height="55.0" rx="6" fill="#fff3cd" stroke="#e67e22" stroke-width="1.1"/><text x="227.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Пакет 1500 Б (DF=1) ──&gt; R1 не може передати у тунель 1420 Б</tspan><tspan x="227.5" dy="11.7">R1 відкидає пакет і надсилає назад ICMP Type 3 Code 4:</tspan><tspan x="227.5" dy="11.7">«Fragmentation Needed, next-hop MTU = 1420»</tspan></text>
<rect x="45.0" y="225.0" width="365.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="227.5" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="227.5" dy="0.0">⛔ Фаєрвол / Middlebox блокує всі ICMP пакети!</tspan><tspan x="227.5" dy="11.7">Клієнт не отримує сповіщення про MTU 1420.</tspan><tspan x="227.5" dy="11.7">Клієнт повторно надсилає 1500 Б (TCP Retransmission).</tspan><tspan x="227.5" dy="11.7">Сесія зависає назавжди (Path MTU Black Hole)!</tspan></text>
<rect x="45.0" y="300.0" width="365.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="227.5" y="342.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Наслідки Black Hole:</tspan><tspan x="227.5" dy="11.7">• Малі пакети (TCP SYN, ACK, SSH keystrokes) проходять.</tspan><tspan x="227.5" dy="11.7">• Великі пакети (HTTP відповіді, TLS сертифікати) губляться.</tspan><tspan x="227.5" dy="11.7">• Користувач бачить «вічне завантаження сторінки».</tspan><tspan x="227.5" dy="11.7">• TCP змушений чекати Retransmission Timeout (RTO).</tspan></text>
<rect x="455.0" y="55.0" width="395.0" height="385.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.4"/>
<text x="652.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Рішення: MSS Clamping (ip tcp adjust-mss)</text>
<rect x="470.0" y="95.0" width="105.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="522.5" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">Клієнт (Host A)</tspan><tspan x="522.5" dy="11.7">Пропонує MSS=1460</tspan></text>
<rect x="600.0" y="95.0" width="105.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="652.5" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="652.5" dy="0.0">Шлюз R1 (MSS Clamp)</tspan><tspan x="652.5" dy="11.7">adjust-mss 1380</tspan></text>
<rect x="730.0" y="95.0" width="105.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="782.5" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="782.5" dy="0.0">Сервер (Host B)</tspan><tspan x="782.5" dy="11.7">Отримує MSS=1380</tspan></text>
<rect x="470.0" y="155.0" width="365.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.1"/><text x="652.5" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">1. Під час TCP Handshake клієнт надсилає SYN із MSS=1460.</tspan><tspan x="652.5" dy="11.7">2. Маршрутизатор R1 перехоплює SYN, бачить тунель MTU 1420,</tspan><tspan x="652.5" dy="11.7">   і знає, що макс. безпечний MSS = 1420 - 20 - 20 = 1380 Б.</tspan></text>
<rect x="470.0" y="225.0" width="365.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="652.5" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="652.5" dy="0.0">✓ R1 перезаписує поле Option MSS: 1460 ──&gt; 1380</tspan><tspan x="652.5" dy="11.7">✓ R1 на льоту перераховує TCP Checksum (RFC 1624).</tspan><tspan x="652.5" dy="11.7">✓ Сервер B відповідає SYN-ACK з урахуванням MSS=1380.</tspan><tspan x="652.5" dy="11.7">✓ Обидві сторони одразу надсилають пакети &lt;= 1420 Б!</tspan></text>
<rect x="470.0" y="300.0" width="365.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="652.5" y="342.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="652.5" dy="0.0">Переваги MSS Clamping:</tspan><tspan x="652.5" dy="11.7">• 100% захист від зависання веб-сайтів і TLS з'єднань.</tspan><tspan x="652.5" dy="11.7">• Не залежить від працездатності чи фільтрації ICMP.</tspan><tspan x="652.5" dy="11.7">• Нульова потреба змінювати MTU на мільйонах хостів.</tspan><tspan x="652.5" dy="11.7">• Робота на рівні мережевого ядра без оверхеду проксі.</tspan></text>
</svg>