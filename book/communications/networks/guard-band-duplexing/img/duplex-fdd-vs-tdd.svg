<rect x="35.0" y="290.0" width="360.0" height="95.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="215.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">• Потрібен ВЧ-дуплексер (ізоляція Tx/Rx &gt; 50 дБ)</tspan><tspan x="215.0" dy="13.0">• Симетричний парний спектр (наприклад, 2×20 МГц)</tspan><tspan x="215.0" dy="13.0">• Мінімальна детермінована затримка (RTT)</tspan><tspan x="215.0" dy="13.0">• Неможливо динамічно перерозподілити смугу DL/UL</tspan></text>
