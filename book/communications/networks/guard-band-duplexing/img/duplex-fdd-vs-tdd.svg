<rect x="687.0" y="210.0" width="95.0" height="45.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="734.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">DL (Tx)</text>
<rect x="445.0" y="290.0" width="360.0" height="95.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="625.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">• Замість дуплексера — швидкий комутатор SPDT</tspan><tspan x="625.0" dy="13.0">• Гнучка асиметрія трафіку (наприклад, 4:1 DL/UL)</tspan><tspan x="625.0" dy="13.0">• Взаємність каналу (Reciprocity) для Massive MIMO</tspan><tspan x="625.0" dy="13.0">• Вимагає суворої фазової синхронізації базових станцій</tspan></text>
<rect x="20.0" y="415.0" width="800.0" height="50.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="420.0" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">FDD забезпечує ізоляцію дуплексним розносом частот і фільтрами, працюючи без пауз.</tspan><tspan x="420.0" dy="14.3">TDD економить спектр і апаратуру, розділяючи передачу й прийом захисними інтервалами GP у часі.</tspan></text>
