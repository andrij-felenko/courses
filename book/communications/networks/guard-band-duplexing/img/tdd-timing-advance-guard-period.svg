<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія поширення хвилі, Timing Advance та захисний період (GP)</text>
<rect x="30.0" y="55.0" width="780.0" height="135.0" rx="8" fill="#fcfdfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="50.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Часова шкала базової станції (gNB)</text>
<line x1="60.0" y1="135.0" x2="770.0" y2="135.0" stroke="#333333" stroke-width="1.5"/>
<line x1="740.0" y1="135.0" x2="775.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="770.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">t</text>
<rect x="60.0" y="95.0" width="240.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="180.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">DL Передача (Tx)</text>
<rect x="300.0" y="95.0" width="160.0" height="40.0" rx="4" fill="#fef5e7" stroke="#e67e22" stroke-width="1.8"/>
<text x="380.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Guard Period (GP)</text>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">GP ≥ 2·d_max/c + T_switch</text>
<rect x="460.0" y="95.0" width="240.0" height="40.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="580.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">UL Прийом (Rx від усіх UE)</text>
<rect x="30.0" y="210.0" width="780.0" height="135.0" rx="8" fill="#fcfdfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="50.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Часова шкала мобільного термінала (Edge UE, відстань d_max)</text>
<line x1="60.0" y1="290.0" x2="770.0" y2="290.0" stroke="#333333" stroke-width="1.5"/>
<line x1="740.0" y1="290.0" x2="775.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="770.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">t</text>
<rect x="140.0" y="250.0" width="220.0" height="40.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="250.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">DL Прийом (Rx, затримка τ)</text>
<line x1="60.0" y1="135.0" x2="140.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="300.0" y1="135.0" x2="360.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="75.0" y="185.0" width="125.0" height="24.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="137.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Затримка τ = d/c</text>
<rect x="360.0" y="250.0" width="45.0" height="40.0" rx="2" fill="#e2e8f0" stroke="#6b7280" stroke-width="1.0"/>
<text x="382.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Rx/Tx</text>
<rect x="405.0" y="250.0" width="240.0" height="40.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="525.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">UL Tx (з випередженням TA = 2τ)</text>
<line x1="405.0" y1="250.0" x2="460.0" y2="135.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="435.0" y="185.0" width="125.0" height="24.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="497.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Затримка τ = d/c</text>
<rect x="30.0" y="365.0" width="780.0" height="85.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Механізм: термінал надсилає сигнал раніше на час TA = 2·d/c, щоб його пакет прибув на базову станцію синхронно з іншими.</tspan><tspan x="420.0" dy="13.0">Захисний період GP на gNB гарантує, що останні відлуння DL згасли і приймач встиг перемкнутися до прибуття першого UL-пакета.</tspan><tspan x="420.0" dy="13.0">Максимальний радіус стільника R_max обмежується тривалістю GP: R_max ≈ c · (GP - T_switch) / 2.</tspan></text>
</svg>