<svg xmlns="http://www.w3.org/2000/svg" viewBox="-39 -10 879 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-39" y="-10" width="879" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Амплітудно-частотна характеристика та розв'язка ВЧ-дуплексера (FDD)</text>
<line x1="60.0" y1="330.0" x2="780.0" y2="330.0" stroke="#333333" stroke-width="1.5"/>
<line x1="750.0" y1="330.0" x2="785.0" y2="330.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Частота (f)</text>
<line x1="60.0" y1="330.0" x2="60.0" y2="50.0" stroke="#333333" stroke-width="1.5"/>
<line x1="60.0" y1="70.0" x2="60.0" y2="45.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="55.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">Коефіцієнт передачі |S_ij| (дБ)</text>
<line x1="60.0" y1="80.0" x2="770.0" y2="80.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="52.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">0 дБ (пропускання)</text>
<line x1="60.0" y1="150.0" x2="770.0" y2="150.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="52.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">-20 дБ</text>
<line x1="60.0" y1="220.0" x2="770.0" y2="220.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="52.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">-40 дБ</text>
<line x1="60.0" y1="290.0" x2="770.0" y2="290.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="52.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">-60 дБ (ізоляція)</text>
<path d="M 80,310 L 150,300 L 190,85 L 290,85 L 330,300 L 760,310" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="240.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Смуга Tx (|S_21|)</text>
<path d="M 80,310 L 510,310 L 550,85 L 650,85 L 690,300 L 760,310" fill="none" stroke="#2457d6" stroke-width="2.5"/>
<text x="600.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Смуга Rx (|S_31|)</text>
<rect x="330.0" y="85.0" width="180.0" height="225.0" rx="3" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/>
<text x="420.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700">Дуплексний рознос</text>
<text x="420.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">(Duplex Gap / Δf)</text>
<text x="420.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зона перехідного спаду фільтрів</text>
<line x1="600.0" y1="100.0" x2="600.0" y2="290.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Ізоляція Tx→Rx</text>
<text x="660.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">&gt; 50..60 дБ</text>
<rect x="60.0" y="360.0" width="720.0" height="65.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Дуплексер захищає надчутливий малошумний підсилювач (LNA) приймача від вигорання та блокування</tspan><tspan x="420.0" dy="13.0">потужним сигналом власного передавача (+30..+46 дБм). Чим менший дуплексний рознос Δf, тим вищий</tspan><tspan x="420.0" dy="13.0">порядок фільтрів (SAW/BAW або об'ємних резонаторів) і тим більші втрати на внесення (Insertion Loss).</tspan></text>
</svg>