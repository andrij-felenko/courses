<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">• Root Bridge: комутатор із найменшим BID; усі його порти є Designated (DP).</tspan><tspan x="380.0" dy="14.9">• RP (Root Port): порт комутатора з найкоротшим шляхом (Root Path Cost) до Root Bridge.</tspan><tspan x="380.0" dy="14.9">• DP (Designated Port): порт, який надсилає найкращий BPDU у свій сегмент мережі.</tspan><tspan x="380.0" dy="14.9">• AP (Alternate/Blocking Port): порт, який програв вибори і блокує транзитний трафік для усунення петлі.</tspan></text>
