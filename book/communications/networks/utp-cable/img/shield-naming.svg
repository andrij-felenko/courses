<text x="500.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">xx — екран усього кабелю · yy — екран кожної пари · TP = вита пара (twisted pair)</text>
