<rect x="110.0" y="430.0" width="360.0" height="96.0" rx="6" fill="#f4faf4" stroke="#27ae60" stroke-width="1.5"/><text x="290.0" y="458.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Загальний екран (xx)</tspan><tspan x="290.0" dy="15.6">ловить зовнішнє поле для всього джгута —</tspan><tspan x="290.0" dy="15.6">клітка Фарадея навколо сигналів;</tspan><tspan x="290.0" dy="15.6">заземлюють здебільшого з одного кінця.</tspan></text>
<rect x="530.0" y="430.0" width="360.0" height="96.0" rx="6" fill="#f4f6fc" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="458.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Екран пари (yy)</tspan><tspan x="710.0" dy="15.6">прибирає взаємні наводки між парами</tspan><tspan x="710.0" dy="15.6">(перехресні завади, crosstalk) і лишок,</tspan><tspan x="710.0" dy="15.6">який не догасило саме звивання.</tspan></text>
<text x="500.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">більше екранів — вища завадостійкість і ціна, товщий і твердіший кабель, складніше заземлення</text>
