<line x1="660.0" y1="401.0" x2="660.0" y2="425.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="570.0" y="425.0" width="180.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="444.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Інкремент спроб: k = k + 1</tspan></text>
<line x1="660.0" y1="457.0" x2="660.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="480.0" width="240.0" height="65.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="497.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">k &gt; 16?  =&gt; Фатальна помилка (Drop)</tspan><tspan x="660.0" dy="12.3">Інакше BEB: вибір випадкового r:</tspan><tspan x="660.0" dy="12.3">r ∈ [0, 2^(min(k, 10)) − 1]</tspan><tspan x="660.0" dy="12.3">Затримка = r × 512 біт-часів (51.2 мкс)</tspan></text>
<line x1="540.0" y1="512.0" x2="45.0" y2="512.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
