<rect x="330.0" y="45.0" width="160.0" height="32.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="58.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Готовий кадр до відправки</tspan><tspan x="410.0" dy="11.7">k = 0 (лічильник спроб)</tspan></text>
