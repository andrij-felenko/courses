<rect x="80.0" y="375.0" width="160.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="388.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Кадр передано успішно!</tspan><tspan x="160.0" dy="11.7">Скидання k = 0</tspan><tspan x="160.0" dy="11.7">Готовність до наступного</tspan></text>
