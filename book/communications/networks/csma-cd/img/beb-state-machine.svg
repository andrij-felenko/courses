<text x="140.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Після затримки r × 51.2 мкс: повернення до прослуховування</text>
