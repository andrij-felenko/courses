<rect x="300.0" y="175.0" width="220.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Міжкадровий інтервал (IFG):</tspan><tspan x="410.0" dy="13.0">Очікування 96 біт-часів (9.6 мкс)</tspan></text>
