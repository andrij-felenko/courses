<rect x="156.0" y="100.0" width="8.0" height="270.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="70.0" y="450.0" width="680.0" height="42.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="467.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Умова надійного виявлення: T_кадру ≥ 2τ. Якщо кадр коротший за 2τ, станція A завершить</tspan><tspan x="410.0" dy="13.7">передачу до приходу колізії і помилково вважатиме кадр успішно доставленим!</tspan></text>
