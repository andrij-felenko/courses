<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння встановлення з'єднання: традиційний стек проти HTTPS RR</text>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Порівняння встановлення з'єднання: традиційний HTTP-стек проти HTTPS RR (RFC 9460)</text>
<rect x="30.0" y="55.0" width="980.0" height="285.0" rx="8" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.2"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Традиційний шлях (без HTTPS-запису): 4 RTT до першого шифрованого HTTP/3-запиту</text>
<rect x="83.0" y="120.2" width="114.0" height="59.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="140.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. DNS A / AAAA</tspan><tspan x="140.0" dy="14.3">(198.51.100.1)</tspan><tspan x="140.0" dy="14.3">1 RTT</tspan></text>
<rect x="297.3" y="120.2" width="145.4" height="59.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="370.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">2. TCP SYN (порт 80)</tspan><tspan x="370.0" dy="14.3">+ HTTP 301 Redirect</tspan><tspan x="370.0" dy="14.3">на https:// (1 RTT)</tspan></text>
<rect x="551.0" y="120.2" width="157.9" height="59.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="630.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">3. TCP (443) + TLS 1.3</tspan><tspan x="630.0" dy="14.3">(відкритий SNI)</tspan><tspan x="630.0" dy="14.3">+ HTTP/2 GET (1 RTT)</tspan></text>
<rect x="814.2" y="120.2" width="151.7" height="59.6" rx="6" fill="#fdf2f2" stroke="#d97706" stroke-width="1.5"/><text x="890.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">4. Alt-Svc: h3=&quot;:443&quot;</tspan><tspan x="890.0" dy="14.3">Лише НАСТУПНЕ</tspan><tspan x="890.0" dy="14.3">з'єднання — QUIC!</tspan></text>
<line x1="215.0" y1="150.0" x2="285.0" y2="150.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="455.0" y1="150.0" x2="525.0" y2="150.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="735.0" y1="150.0" x2="805.0" y2="150.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="230.0" width="940.0" height="90.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="520.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Наслідки старого підходу:</tspan><tspan x="520.0" dy="14.3">• 3-4 повних кругових затримки (RTT) до завантаження першого байта захищеного контенту.</tspan><tspan x="520.0" dy="14.3">• Небезпечний незашифрований трафік на порт 80 (можливість перехоплення й підміни редиректу).</tspan><tspan x="520.0" dy="14.3">• Відкритий SNI (Server Name Indication) у TLS ClientHello видає домен мережевим посередникам.</tspan></text>
<rect x="30.0" y="360.0" width="980.0" height="310.0" rx="8" fill="#eef8f1" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="50.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Оптимізований шлях з HTTPS Resource Record (Type 65): 1 RTT до захищеного HTTP/3</text>
<rect x="114.6" y="423.1" width="270.8" height="73.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="442.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Паралельний DNS:</tspan><tspan x="250.0" dy="14.3">HTTPS (Type 65) + A/AAAA</tspan><tspan x="250.0" dy="14.3">Відповідь: h3, port 443, ipv4/6hint, ECH</tspan><tspan x="250.0" dy="14.3">(1 RTT DNS)</tspan></text>
<rect x="643.4" y="423.1" width="233.2" height="73.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="442.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">2. Прямий запуск QUIC (UDP 443):</tspan><tspan x="760.0" dy="14.3">Шифрування SNI через ECHConfigList</tspan><tspan x="760.0" dy="14.3">+ Handshake + HTTP/3 Request</tspan><tspan x="760.0" dy="14.3">(1 RTT з'єднання)</tspan></text>
<line x1="435.0" y1="460.0" x2="575.0" y2="460.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="505.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Одразу QUIC + ECH</text>
<rect x="50.0" y="545.0" width="940.0" height="105.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="572.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Переваги нового підходу:</tspan><tspan x="520.0" dy="14.3">• Економія 2-3 кругових затримок (RTT) під час першого відвідування веб-сайту.</tspan><tspan x="520.0" dy="14.3">• Схема оновлюється до https:// без запиту на відкритий порт 80 (усунення діри перехоплення).</tspan><tspan x="520.0" dy="14.3">• Підтримка HTTP/3 QUIC виявляється миттєво з DNS без заголовка Alt-Svc.</tspan><tspan x="520.0" dy="14.3">• SNI повністю зашифровано через ECH (Encrypted Client Hello) — приватність домену захищена.</tspan></text>
</svg>