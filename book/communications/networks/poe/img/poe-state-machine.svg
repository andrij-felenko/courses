<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="370.0" rx="0" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатоступеневий автомат станів PoE (IEEE 802.3)</text>
<rect x="25.0" y="65.0" width="185.0" height="180.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="35.0" y="75.0" width="165.0" height="32.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="117.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="117.5" dy="0.0">1. Детекція (Detection)</tspan></text>
<text x="117.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="117.0" dy="0.0">Зондування: 2.8...10 В</tspan><tspan x="117.0" dy="13.0">Крок ΔV → вимір ΔI</tspan><tspan x="117.0" dy="13.0">R_det = ΔV / ΔI</tspan><tspan x="117.0" dy="13.0"></tspan><tspan x="117.0" dy="13.0">Норма: 19...26.5 кОм</tspan><tspan x="117.0" dy="13.0">(номінал 24.9 кОм)</tspan><tspan x="117.0" dy="13.0">C_in ≤ 150 нФ</tspan></text>
<line x1="210.0" y1="155.0" x2="245.0" y2="155.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="227.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">OK</text>
<rect x="245.0" y="65.0" width="185.0" height="180.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="255.0" y="75.0" width="165.0" height="32.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="337.5" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="337.5" dy="0.0">2. Класифікація</tspan></text>
<text x="337.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="337.0" dy="0.0">Напруга: 14.5...20.5 В</tspan><tspan x="337.0" dy="13.0">Вимір струму класу:</tspan><tspan x="337.0" dy="13.0">Клас 0...8 (0.44...90 Вт)</tspan><tspan x="337.0" dy="13.0"></tspan><tspan x="337.0" dy="13.0">1-Event: 802.3af (до 15.4 Вт)</tspan><tspan x="337.0" dy="13.0">2-Event: 802.3at (30 Вт)</tspan><tspan x="337.0" dy="13.0">Multi-Event: 802.3bt</tspan></text>
<line x1="430.0" y1="155.0" x2="465.0" y2="155.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="447.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">OK</text>
<rect x="465.0" y="65.0" width="185.0" height="180.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="475.0" y="75.0" width="165.0" height="32.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="557.5" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="557.5" dy="0.0">3. Запуск (Power-Up)</tspan></text>
<text x="557.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="557.0" dy="0.0">Наростання: до 48...57 В</tspan><tspan x="557.0" dy="13.0">Обмеження пускового</tspan><tspan x="557.0" dy="13.0">струму (Inrush Limit):</tspan><tspan x="557.0" dy="13.0">I_inrush ≤ 400...450 мА</tspan><tspan x="557.0" dy="13.0"></tspan><tspan x="557.0" dy="13.0">Заряд C_bulk на PD</tspan><tspan x="557.0" dy="13.0">UVLO перемикання</tspan></text>
<line x1="650.0" y1="155.0" x2="685.0" y2="155.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="667.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">OK</text>
<rect x="685.0" y="65.0" width="175.0" height="180.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="695.0" y="75.0" width="155.0" height="32.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">4. Робота й моніторинг</tspan></text>
<text x="772.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="772.0" dy="0.0">Повна потужність:</tspan><tspan x="772.0" dy="13.0">48...57 В навантаження</tspan><tspan x="772.0" dy="13.0"></tspan><tspan x="772.0" dy="13.0">Контроль струму MPS:</tspan><tspan x="772.0" dy="13.0">I ≥ 10 мА (802.3af/at)</tspan><tspan x="772.0" dy="13.0">або Short MPS (bt)</tspan><tspan x="772.0" dy="13.0">Захист OCP / SCP</tspan></text>
<line x1="772.0" y1="245.0" x2="772.0" y2="310.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="772.0" y1="310.0" x2="117.0" y2="310.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="117.0" y1="310.0" x2="117.0" y2="245.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="290.0" width="320.0" height="36.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="298.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Від'єднання або перевантаження (Disconnect / OCP)</tspan><tspan x="440.0" dy="11.7">Зняття напруги за &lt; 10...350 мс → Перехід до детекції</tspan></text>
<rect x="25.0" y="335.0" width="835.0" height="25.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="442.5" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="442.5" dy="0.0">Звичайний мережевий порт ПК не має сигнатури 25 кОм: детекція провалюється, і небезпечні 54 В не подаються.</tspan></text>
</svg>