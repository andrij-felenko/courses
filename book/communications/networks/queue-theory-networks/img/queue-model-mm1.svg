<text x="253.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">P₃</text>
<rect x="280.0" y="120.0" width="36.0" height="60.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
