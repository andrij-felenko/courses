<line x1="180.0" y1="215.0" x2="360.0" y2="215.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="180.0" y1="210.0" x2="180.0" y2="220.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="360.0" y1="210.0" x2="360.0" y2="220.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="270.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Середня черга L_q (пакетів)</text>
<text x="270.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Час очікування W_q</text>
<circle cx="440.0" cy="150.0" r="42.0" fill="#fef9e7" stroke="#e67e22" stroke-width="2.0"/>
<text x="440.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передавач</text>
<text x="440.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700">μ = C / L_p</text>
<line x1="370.0" y1="150.0" x2="398.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="482.0" y1="150.0" x2="620.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="550.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний канал C</text>
<text x="550.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">біт / с</text>
<text x="550.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Час передачі 1/μ</text>
<rect x="160.0" y="65.0" width="330.0" height="235.0" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
<text x="325.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вся система: середня кількість L = λ · W, час W = W_q + 1/μ</text>
<text x="380.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Завантаження ρ = λ / μ. Стійкий стан можливий лише при ρ &lt; 1.</text>
</svg>