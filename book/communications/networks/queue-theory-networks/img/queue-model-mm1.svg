<text x="270.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буфер інтерфейсу (черга)</text>
<rect x="190.0" y="120.0" width="36.0" height="60.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
