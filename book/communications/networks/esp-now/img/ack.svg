<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Успіх» = MAC-квитанція, а не «застосунок прочитав»</text>
<rect x="90.0" y="127.0" width="120.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">передавач</tspan></text>
<rect x="550.0" y="127.0" width="120.0" height="46.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.8"/><text x="610.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">приймач</tspan><tspan x="610.0" dy="14.3">(радіо)</tspan></text>
<line x1="212" y1="140" x2="548" y2="140" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">кадр-дія ESP-NOW</text>
<line x1="548" y1="164" x2="212" y2="164" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">апаратний ACK (рівень MAC)</text>
<rect x="70.0" y="214.0" width="300.0" height="70.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">callback → ESP_NOW_SEND_SUCCESS</tspan><tspan x="220.0" dy="14.3">означає лише: радіо приймача</tspan><tspan x="220.0" dy="14.3">взяло кадр і квитнуло</tspan></text>
<rect x="390.0" y="214.0" width="300.0" height="70.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">НЕ означає: застосунок кадр</tspan><tspan x="540.0" dy="14.3">прочитав, розібрав чи виконав</tspan><tspan x="540.0" dy="14.3">команду</tspan></text>
<rect x="50.0" y="306.0" width="660.0" height="56.0" rx="6" fill="#fbf6e6" stroke="#b08900" stroke-width="1.5"/><text x="380.0" y="330.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Broadcast ніхто не квитує — там SUCCESS = лише «пішло в ефір».</tspan><tspan x="380.0" dy="15.0">Потрібна певність доставки? Клади власне підтвердження у відповідь-кадр.</tspan></text>
</svg>