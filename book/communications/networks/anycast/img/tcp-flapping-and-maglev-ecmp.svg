<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема зміни маршруту (BGP Flap) у TCP та її вирішення через Maglev і QUIC</text>
<rect x="20.0" y="50.0" width="820.0" height="215.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="210.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Проблема: BGP Route Flap під час активної сесії TCP</text>
<rect x="40.0" y="95.0" width="140.0" height="65.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">TCP 198.51.100.1</text>
<rect x="340.0" y="90.0" width="210.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="445.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">PoP 1 (Франкфурт)</text>
<text x="445.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">TCP State: ESTABLISHED</text>
<text x="445.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Seq: 10420, Ack: 501</text>
<rect x="610.0" y="90.0" width="210.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="715.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">PoP 2 (Лондон)</text>
<text x="715.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">НЕМАЄ TCP стану!</text>
<text x="715.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Відповідь: TCP RST (скидання)</text>
<line x1="180.0" y1="110.0" x2="340.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">1. SYN, SYN-ACK</text>
<line x1="180.0" y1="140.0" x2="610.0" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">2. BGP flap -&gt; DATA</text>
<rect x="40.0" y="175.0" width="780.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="0.8"/><text x="430.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Коли проміжний лінк падає або перераховується BGP AS-Path, наступний пакет сесії</tspan><tspan x="430.0" dy="13.0">потрапляє на інший PoP. Без синхронізації або узгодженого хешування новий сервер</tspan><tspan x="430.0" dy="13.0">не знає стану сесії й надсилає клієнту TCP RST, перериваючи передачу.</tspan></text>
<rect x="20.0" y="280.0" width="820.0" height="225.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="275.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Архітектурні рішення: Maglev Consistent Hashing та QUIC Connection ID</text>
<rect x="40.0" y="325.0" width="235.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="157.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Балансувальник Maglev</text>
<text x="157.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Таблиця розміром M (просте).</text>
<text x="157.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">5-tuple стабільно хешується</text>
<text x="157.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">на той самий бекенд-вузол.</text>
<rect x="310.0" y="325.0" width="235.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="427.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Тунелювання DSR / GRE</text>
<text x="427.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">L4-проксі інкапсулює пакет</text>
<text x="427.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">у GRE/Geneve до вузла;</text>
<text x="427.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відповідь іде клієнту напряму.</text>
<rect x="580.0" y="325.0" width="240.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="700.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Протокол QUIC (RFC 9000)</text>
<text x="700.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Connection ID (CID) замість IP:Port.</text>
<text x="700.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зміна маршруту чи IP-адреси</text>
<text x="700.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">не розриває транспортний потік.</text>
<rect x="40.0" y="430.0" width="780.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="0.8"/><text x="430.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Завдяки узгодженому розподілу таблиць Maglev усі PoP однаково відображають клієнтські 5-tuple</tspan><tspan x="430.0" dy="13.0">на бекенди, а QUIC усуває прив'язку до IP-адрес на транспортному рівні.</tspan></text>
</svg>