<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація атрибутів шляху BGP (Path Attributes)</text>
<text x="410.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Байт прапорців атрибута (Attribute Flags Byte)</text>
<rect x="110.0" y="72.0" width="600.0" height="40.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="110.0" y="72.0" width="150.0" height="40.0" rx="0" fill="#eef3ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="185.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Bit 0: Optional</text>
<text x="185.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0: Well-Known, 1: Optional</text>
<rect x="260.0" y="72.0" width="150.0" height="40.0" rx="0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="335.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Bit 1: Transitive</text>
<text x="335.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1: Transitive, 0: Non-Trans</text>
<rect x="410.0" y="72.0" width="150.0" height="40.0" rx="0" fill="#fff7e6" stroke="#6b7280" stroke-width="1.2"/>
<text x="485.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 2: Partial</text>
<text x="485.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1: Неповний / транзит</text>
<rect x="560.0" y="72.0" width="150.0" height="40.0" rx="0" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="635.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 3: Ext. Length</text>
<text x="635.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0: 1 байт, 1: 2 байти</text>
<rect x="30.0" y="135.0" width="365.0" height="135.0" rx="8" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="212.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Well-Known Mandatory (Обов'язкові)</text>
<text x="212.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мусять розпізнаватися й бути в кожному UPDATE</text>
<line x1="45.0" y1="188.0" x2="380.0" y2="188.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="60.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- ORIGIN (код 1): джерело маршруту (IGP, EGP, INCOMPLETE)</text>
<text x="60.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- AS_PATH (код 2): послідовність автономних систем</text>
<text x="60.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- NEXT_HOP (код 3): IP-адреса наступного шлюзу</text>
<rect x="425.0" y="135.0" width="365.0" height="135.0" rx="8" fill="#edf4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="607.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Well-Known Discretionary (Дискреційні)</text>
<text x="607.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розпізнаються всіма, але присутні за потреби</text>
<line x1="440.0" y1="188.0" x2="775.0" y2="188.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="450.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- LOCAL_PREF (код 5): пріоритет виходу з AS (в iBGP)</text>
<text x="450.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- ATOMIC_AGGREGATE (код 6): позначка агрегованого шляху</text>
<rect x="30.0" y="285.0" width="365.0" height="135.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="212.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Optional Transitive (Опційні транзитивні)</text>
<text x="212.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Передаються сусіднім AS, навіть якщо не підтримуються</text>
<line x1="45.0" y1="338.0" x2="380.0" y2="338.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="60.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- AGGREGATOR (код 7): IP та ASN маршрутизатора агрегації</text>
<text x="60.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- COMMUNITY (код 8): числові теги політики (32 біти)</text>
<text x="60.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- LARGE_COMMUNITY (код 32): розширені теги (96 бітів)</text>
<rect x="425.0" y="285.0" width="365.0" height="135.0" rx="8" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/>
<text x="607.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Optional Non-Transitive (Опційні нетранзитивні)</text>
<text x="607.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Не підтримуються -&gt; видаляються при передачі далі</text>
<line x1="440.0" y1="338.0" x2="775.0" y2="338.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="450.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- MED (код 4): Multi-Exit Discriminator (метрика до сусіда)</text>
<text x="450.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- ORIGINATOR_ID (код 9): захист від петель Route Reflector</text>
<text x="450.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">- CLUSTER_LIST (код 10): послідовність кластерів RR</text>
</svg>