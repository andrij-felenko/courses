<line x1="375.0" y1="200.0" x2="470.0" y2="240.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="695.0" y1="200.0" x2="600.0" y2="240.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="30.0" y="340.0" width="365.0" height="100.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.2"/><text x="212.5" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Правила eBGP (між різними AS):</tspan><tspan x="212.5" dy="14.3">- Змінює NEXT_HOP на власну IP інтерфейсу.</tspan><tspan x="212.5" dy="14.3">- Дописує власний ASN на початок AS_PATH.</tspan><tspan x="212.5" dy="14.3">- Типово TTL=1 (прямий L2-лінк між шлюзами).</tspan></text>
<rect x="425.0" y="340.0" width="365.0" height="100.0" rx="6" fill="#edf4ff" stroke="#2457d6" stroke-width="1.2"/><text x="607.5" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Правила iBGP (всередині однієї AS):</tspan><tspan x="607.5" dy="13.0">- Зберігає початковий NEXT_HOP (потрібен next-hop-self).</tspan><tspan x="607.5" dy="13.0">- Не змінює AS_PATH і не додає свій ASN.</tspan><tspan x="607.5" dy="13.0">- Split Horizon: не передає iBGP маршрут іншим iBGP-пірам.</tspan></text>
</svg>