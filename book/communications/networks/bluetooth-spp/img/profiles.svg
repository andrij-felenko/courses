<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профілі Bluetooth: готові сценарії під різні задачі</text>
<rect x="8.0" y="120.0" width="150.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="83.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">SPP</text>
<text x="83.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="83.0" dy="0.0">послідовні дані</tspan><tspan x="83.0" dy="14.3">(бездротовий UART)</tspan></text>
<rect x="186.0" y="120.0" width="150.0" height="92.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="261.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">A2DP</text>
<text x="261.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="261.0" dy="0.0">стереозвук</tspan><tspan x="261.0" dy="14.3">(навушники)</tspan></text>
<rect x="364.0" y="120.0" width="150.0" height="92.0" rx="6" fill="#f2ecf8" stroke="#8a5fb0" stroke-width="1.8"/>
<text x="439.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#8a5fb0" text-anchor="middle" font-weight="700">HID</text>
<text x="439.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="439.0" dy="0.0">клавіатури, миші</tspan><tspan x="439.0" dy="14.3">(ввід)</tspan></text>
<rect x="542.0" y="120.0" width="150.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="617.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">HFP</text>
<text x="617.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="617.0" dy="0.0">гарнітура, дзвінки</tspan><tspan x="617.0" dy="14.3">(голос)</tspan></text>
<text x="83.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">↑ для довільних даних — саме SPP</text>
<text x="350.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">кожен профіль домовляється не лише ЯК передати біти, а й ЩО саме й навіщо</text>
</svg>