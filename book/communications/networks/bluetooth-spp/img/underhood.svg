<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Під капотом SPP: чистий потік над брудним ефіром</text>
<rect x="120.0" y="44.0" width="460.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="350.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">застосунок: SerialBT.print / read</tspan></text>
<text x="590.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">бачить рівний UART-потік</text>
<rect x="120.0" y="114.0" width="460.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="350.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">стек Bluetooth: RFCOMM, пакети, CRC, ACK, ретраї, стрибки частоти</tspan></text>
<text x="590.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">ховає всю чорну роботу</text>
<rect x="120.0" y="184.0" width="460.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="350.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">ефір 2.4 ГГц: спільний, з втратами й завадами</tspan></text>
<text x="590.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">тут реальна ненадійність</text>
<line x1="320.0" y1="96.0" x2="320.0" y2="114.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380.0" y1="114.0" x2="380.0" y2="96.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320.0" y1="166.0" x2="320.0" y2="184.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380.0" y1="184.0" x2="380.0" y2="166.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">чистий потік нагорі — результат боротьби стека внизу; SPP ховає ненадійність, а не скасовує</text>
</svg>