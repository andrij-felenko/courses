<text x="420.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Наскрізний семантичний зв'язок: транспортний стан тримають виключно хости A і B</text>
<rect x="30.0" y="220.0" width="780.0" height="260.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.4"/>
<text x="50.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Реальність Інтернету: проміжні пристрої (Middleboxes) розривають шари моделі OSI</text>
<rect x="45.0" y="262.0" width="105.0" height="185.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="97.5" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="97.5" dy="0.0">Клієнт A</tspan><tspan x="97.5" dy="12.3">192.168.1.10</tspan><tspan x="97.5" dy="12.3"></tspan><tspan x="97.5" dy="12.3">TCP SYN</tspan><tspan x="97.5" dy="12.3">(Seq=1000,</tspan><tspan x="97.5" dy="12.3">Opt=TFO,MPTCP)</tspan></text>
<rect x="170.0" y="262.0" width="125.0" height="85.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="232.5" y="290.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">NAT / CGNAT (L3/L4)</tspan><tspan x="232.5" dy="11.7">Зміна IP та портів</tspan><tspan x="232.5" dy="11.7">Таблиця трансляції</tspan><tspan x="232.5" dy="11.7">Таймаути сесій</tspan></text>
<rect x="170.0" y="355.0" width="125.0" height="92.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="232.5" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">Stateful Firewall</tspan><tspan x="232.5" dy="11.7">Відстеження 5-tuple</tspan><tspan x="232.5" dy="11.7">TCP state machine</tspan><tspan x="232.5" dy="11.7">Дроп поза вікном</tspan></text>
<rect x="325.0" y="262.0" width="160.0" height="185.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="405.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">WAN Optimizer / PEP (L4)</tspan><tspan x="405.0" dy="11.7">TCP Split-Connection</tspan><tspan x="405.0" dy="11.7">• Підміна ACK клієнту</tspan><tspan x="405.0" dy="11.7">• Власний буфер TCP</tspan><tspan x="405.0" dy="11.7">• Вирізання невідомих опцій</tspan><tspan x="405.0" dy="11.7">• Clamping MSS</tspan></text>
<rect x="515.0" y="262.0" width="135.0" height="185.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="582.5" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">L7 Proxy / DPI / WAF</tspan><tspan x="582.5" dy="11.7">• TLS MITM термінація</tspan><tspan x="582.5" dy="11.7">• Інспекція корисного навантаження</tspan><tspan x="582.5" dy="11.7">• Кешування контенту</tspan><tspan x="582.5" dy="11.7">• Фільтрація за SNI/URL</tspan></text>
<rect x="675.0" y="262.0" width="120.0" height="185.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="735.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Сервер B</tspan><tspan x="735.0" dy="12.3">203.0.113.80</tspan><tspan x="735.0" dy="12.3"></tspan><tspan x="735.0" dy="12.3">Отримує змінений</tspan><tspan x="735.0" dy="12.3">потік: інший IP,</tspan><tspan x="735.0" dy="12.3">нові Seq/Ack,</tspan><tspan x="735.0" dy="12.3">опції вирізано</tspan></text>
