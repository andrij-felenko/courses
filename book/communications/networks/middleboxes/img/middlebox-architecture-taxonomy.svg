<rect x="45.0" y="88.0" width="120.0" height="95.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="105.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Клієнт (Host A)</tspan><tspan x="105.0" dy="13.0">[L7] Застосунок</tspan><tspan x="105.0" dy="13.0">[L4] TCP/UDP стан</tspan><tspan x="105.0" dy="13.0">[L3] IP адресація</tspan></text>
