<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Патології костеніння протоколів (Protocol Ossification)</text>
<rect x="30.0" y="48.0" width="780.0" height="125.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій А: Блокування невідомих номерів IP-протоколів (SCTP, DCCP)</text>
<rect x="45.0" y="80.0" width="170.0" height="78.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="130.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Хост-відправник</tspan><tspan x="130.0" dy="12.3">IP Proto = 132 (SCTP)</tspan><tspan x="130.0" dy="12.3">Новий надійний</tspan><tspan x="130.0" dy="12.3">мультипотоковий транспорт</tspan></text>
<line x1="215.0" y1="119.0" x2="310.0" y2="119.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="310.0" y="80.0" width="220.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="420.0" y="104.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Enterprise Firewall / ISP NAT</tspan><tspan x="420.0" dy="11.7">Парсер: if (proto != 6 &amp;&amp; proto != 17)</tspan><tspan x="420.0" dy="11.7">→ DROP (Тихе скидання)</tspan><tspan x="420.0" dy="11.7">Немає парсера L4 портів для SCTP</tspan></text>
<line x1="530.0" y1="119.0" x2="570.0" y2="119.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="590.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">✖ Пакет знищено</text>
<rect x="660.0" y="80.0" width="135.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="727.5" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="727.5" dy="0.0">Хост-одержувач</tspan><tspan x="727.5" dy="12.3">Очікує з'єднання</tspan><tspan x="727.5" dy="12.3">(Таймаут 3000 мс,</tspan><tspan x="727.5" dy="12.3">трафік не дійшов)</tspan></text>
<rect x="30.0" y="185.0" width="780.0" height="135.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій Б: Вирізання невідомих TCP-опцій (MPTCP Subflow, Fast Open Cookie)</text>
<rect x="45.0" y="218.0" width="170.0" height="88.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="130.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Клієнт (SYN + Opt 30)</tspan><tspan x="130.0" dy="11.7">TCP Header (40 байт)</tspan><tspan x="130.0" dy="11.7">• Option 30 (MPTCP)</tspan><tspan x="130.0" dy="11.7">• Option 34 (TFO Cookie)</tspan><tspan x="130.0" dy="11.7">Розмір заголовка = 10 слів</tspan></text>
<line x1="215.0" y1="262.0" x2="310.0" y2="262.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="310.0" y="218.0" width="220.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="420.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Middlebox (Scrubber / Optimizer)</tspan><tspan x="420.0" dy="11.7">• Не знає Kind=30 / Kind=34</tspan><tspan x="420.0" dy="11.7">• Затирає опції нулями (NOP)</tspan><tspan x="420.0" dy="11.7">• АБО зменшує Data Offset</tspan><tspan x="420.0" dy="11.7">• АБО ламає TCP Checksum</tspan></text>
<line x1="530.0" y1="262.0" x2="630.0" y2="262.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="630.0" y="218.0" width="165.0" height="88.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="712.5" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Сервер (Отримує SYN)</tspan><tspan x="712.5" dy="11.7">Опції відсутні!</tspan><tspan x="712.5" dy="11.7">З'єднання переходить у</tspan><tspan x="712.5" dy="11.7">звичайний однопотоковий</tspan><tspan x="712.5" dy="11.7">TCP без оптимізацій</tspan></text>
<rect x="30.0" y="332.0" width="780.0" height="142.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Сценарій В: Передчасне підтвердження (ACK Spoofing) у Performance Enhancing Proxy</text>
<rect x="45.0" y="362.0" width="160.0" height="98.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="125.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Клієнт</tspan><tspan x="125.0" dy="11.7">1. Шле Data (Seq=1..1000)</tspan><tspan x="125.0" dy="11.7">3. Отримує ACK=1001!</tspan><tspan x="125.0" dy="11.7">(Вважає, що дані надійно</tspan><tspan x="125.0" dy="11.7">записані на сервері)</tspan></text>
<line x1="205.0" y1="385.0" x2="290.0" y2="385.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290.0" y1="425.0" x2="205.0" y2="425.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="362.0" width="230.0" height="98.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="405.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">TCP Split-Proxy (Супутниковий PEP)</tspan><tspan x="405.0" dy="11.7">2. Швидкий ACK клієнту</tspan><tspan x="405.0" dy="11.7">Буферизує 1000 байт у пам'яті</tspan><tspan x="405.0" dy="11.7">4. ПОВІЛЬНА передача на сервер</tspan><tspan x="405.0" dy="11.7">💥 Падіння живлення проксі!</tspan></text>
<line x1="520.0" y1="395.0" x2="620.0" y2="395.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="570.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Дані втрачено</text>
<rect x="630.0" y="362.0" width="165.0" height="98.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="712.5" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="712.5" dy="0.0">Сервер</tspan><tspan x="712.5" dy="11.7">Не отримав даних.</tspan><tspan x="712.5" dy="11.7">Клієнт не повторює, бо</tspan><tspan x="712.5" dy="11.7">вже отримав ACK.</tspan><tspan x="712.5" dy="11.7">Тихе пошкодження сесії!</tspan></text>
</svg>