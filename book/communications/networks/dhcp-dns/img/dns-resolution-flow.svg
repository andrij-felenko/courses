<line x1="430.0" y1="255.0" x2="550.0" y2="335.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="360.0" x2="430.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="410.0" width="780.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#4b5563" stroke-width="1.5"/><text x="420.0" y="429.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рекурсивний запит (ліворуч): «Знайди мені IP або поверни помилку».</tspan><tspan x="420.0" dy="14.3">Ітеративні запити (праворуч): «Я не знаю остаточної IP, але звернись за цією делегованою адресою».</tspan></text>
