<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="200.0" width="150.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="221.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Клієнт (Stub Resolver)</tspan><tspan x="105.0" dy="11.7">Браузер / ОС</tspan><tspan x="105.0" dy="11.7">192.168.1.105</tspan></text>
<rect x="250.0" y="180.0" width="180.0" height="95.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="340.0" y="207.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Рекурсивний резолвер</tspan><tspan x="340.0" dy="11.7">(ISP або 1.1.1.1 / 8.8.8.8)</tspan><tspan x="340.0" dy="11.7">1. Перевіряє власний кеш</tspan><tspan x="340.0" dy="11.7">2. Виконує ітерації</tspan><tspan x="340.0" dy="11.7">3. Кешує результат</tspan></text>
<rect x="550.0" y="30.0" width="260.0" height="55.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="47.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">1. Root Server («.»)</tspan><tspan x="680.0" dy="14.3">«Я не знаю адресу example.com,</tspan><tspan x="680.0" dy="14.3">але запитай TLD сервер .com»</tspan></text>
<rect x="550.0" y="175.0" width="260.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="680.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">2. TLD Server («.com»)</tspan><tspan x="680.0" dy="11.7">«Я не знаю IP самого сайту,</tspan><tspan x="680.0" dy="11.7">але ось авторитетний NS ns1.example.com»</tspan></text>
<rect x="550.0" y="320.0" width="260.0" height="65.0" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">3. Авторитетний NS (example.com)</tspan><tspan x="680.0" dy="14.3">«Ось точна відповідь (AA):</tspan><tspan x="680.0" dy="14.3">A = 93.184.216.34</tspan><tspan x="680.0" dy="14.3">TTL = 3600 секунд»</tspan></text>
<line x1="180.0" y1="220.0" x2="250.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="182.0" y="185.0" width="66.0" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="203.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Запит</tspan></text>
<line x1="250.0" y1="250.0" x2="180.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="182.0" y="255.0" width="66.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">IP-адреса</tspan></text>
<line x1="430.0" y1="195.0" x2="550.0" y2="55.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="70.0" x2="430.0" y2="210.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="225.0" x2="550.0" y2="195.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
