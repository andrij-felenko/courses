<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від MITM у Numeric Comparison</text>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічний захист від MITM у моделі Numeric Comparison (LE Secure Connections)</text>
<rect x="70.0" y="60.0" width="180.0" height="38.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ініціатор (A)</text>
<rect x="610.0" y="60.0" width="180.0" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Відповідач (B)</text>
<line x1="160.0" y1="98.0" x2="160.0" y2="305.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="700.0" y1="98.0" x2="700.0" y2="305.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="160.0" y1="120.0" x2="700.0" y2="120.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Зобов'язання C_a = f4(PK_a, PK_b, N_a, 0)</text>
<line x1="700.0" y1="165.0" x2="160.0" y2="165.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Відкриття випадкового числа N_b</text>
<line x1="160.0" y1="210.0" x2="700.0" y2="210.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Розкриття N_a -&gt; B перевіряє C_a == f4(PK_a, PK_b, N_a, 0)</text>
<rect x="200.0" y="233.5" width="460.0" height="43.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/><text x="430.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Обидва рахують: V = g2(PK_a, PK_b, N_a, N_b) mod 10⁶</tspan><tspan x="430.0" dy="13.0">Користувач бачить 6 цифр на обох екранах і натискає «Підтвердити»</tspan></text>
<text x="430.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Stage 2: Взаємний обмін DHKey Check (E_a та E_b через функцію f6)</text>
<text x="430.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Активний зловмисник (MITM) не може підмінити ключі непомітно: шанс вгадати 6 цифр без розбіжності = 10⁻⁶</text>
