<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фільтрація джитеру в протоколі RTP (RFC 3550)</text>
<rect x="40.0" y="70.0" width="240.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="160.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Різниця часу транзиту</text>
<text x="160.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">D(i-1, i) = (R_i - S_i) - (R_{i-1} - S_{i-1})</text>
<text x="160.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">S_i — мітка надсилання (RTP timestamp)</text>
<text x="160.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R_i — локальний час прибуття (кванти RTP)</text>
<line x1="280.0" y1="125.0" x2="340.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">|D|</text>
<rect x="340.0" y="70.0" width="380.0" height="110.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="530.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Рекурсивний згладжувальний фільтр (EWMA)</text>
<text x="530.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">J_i = J_{i-1} + (|D(i-1, i)| - J_{i-1}) / 16</text>
<text x="530.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ваговий коефіцієнт α = 1/16 (постійна часу ≈ 16 пакетів)</text>
<text x="530.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="middle" font-weight="700">Реалізується цілочисельним бітовим зсувом: &gt;&gt; 4</text>
<line x1="530.0" y1="180.0" x2="530.0" y2="230.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140.0" y="230.0" width="480.0" height="125.0" rx="8" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/>
<text x="380.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Передача в звітах RTCP Receiver Report (RR)</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Поле «Interarrival Jitter» (32 біти):</text>
<text x="380.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Передається в одиницях частоти дискретизації кодека</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">• 8 кГц (G.711): 1 квант = 125 мкс  |  48 кГц (Opus): 1 квант = 20.83 мкс</text>
<text x="380.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Дозволяє відправнику оцінити якість мережі без синхронізації годинників!</text>
</svg>