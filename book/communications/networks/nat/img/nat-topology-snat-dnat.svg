<rect x="60.0" y="380.0" width="720.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">SNAT підміняє внутрішню адресу джерела на зовнішню IP:порт роутера для виходу в Інтернет.</tspan><tspan x="420.0" dy="14.3">DNAT перенаправляє вхідний трафік на публічний порт до приватного хоста всередині LAN.</tspan></text>
</svg>