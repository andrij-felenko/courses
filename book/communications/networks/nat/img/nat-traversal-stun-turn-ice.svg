<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізми подолання NAT: архітектура STUN, TURN та ICE</text>
<rect x="40.0" y="60.0" width="200.0" height="160.0" rx="6" fill="#f0f5ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="140.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт A (за NAT)</text>
<rect x="50.0" y="96.0" width="180.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="140.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Локальний сокет:</tspan><tspan x="140.0" dy="13.0">192.168.1.100:5000</tspan><tspan x="140.0" dy="13.0"></tspan><tspan x="140.0" dy="13.0">NAT мапінг:</tspan><tspan x="140.0" dy="13.0">203.0.113.10:45000</tspan></text>
<rect x="320.0" y="55.0" width="200.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="420.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер STUN</text>
<text x="420.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RFC 5389 / 8489</text>
<rect x="330.0" y="106.0" width="180.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="420.0" y="123.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Повертає рефлексивну IP:порт</tspan><tspan x="420.0" dy="11.7">(XOR-MAPPED-ADDRESS)</tspan></text>
<rect x="320.0" y="175.0" width="200.0" height="100.0" rx="6" fill="#fff8e8" stroke="#c0392b" stroke-width="1.4"/>
<text x="420.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сервер TURN</text>
<text x="420.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RFC 5766 / 8656</text>
<rect x="330.0" y="226.0" width="180.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="420.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Ретранслює медіа-трафік</tspan><tspan x="420.0" dy="11.7">(якщо NAT симетричний)</tspan></text>
<rect x="600.0" y="60.0" width="200.0" height="160.0" rx="6" fill="#f0f5ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="700.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт B (за NAT)</text>
<rect x="610.0" y="96.0" width="180.0" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="700.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Локальний сокет:</tspan><tspan x="700.0" dy="13.0">10.0.0.5:6000</tspan><tspan x="700.0" dy="13.0"></tspan><tspan x="700.0" dy="13.0">NAT мапінг:</tspan><tspan x="700.0" dy="13.0">198.51.100.20:56000</tspan></text>
<line x1="240.0" y1="100.0" x2="320.0" y2="100.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="600.0" y1="100.0" x2="520.0" y2="100.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="240.0" y1="225.0" x2="320.0" y2="225.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="520.0" y1="225.0" x2="600.0" y2="225.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="290.0" width="760.0" height="135.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="420.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фреймворк ICE (Interactive Connectivity Establishment — RFC 8445)</text>
<rect x="55.0" y="328.0" width="730.0" height="85.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="420.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Збір кандидатів: Host (локальна IP) ➔ Server Reflexive (STUN IP) ➔ Relayed (TURN IP).</tspan><tspan x="420.0" dy="13.0">2. Обмін кандидатами через сигналізацію (SDP offer/answer).</tspan><tspan x="420.0" dy="13.0">3. STUN Connectivity Checks: перевірка зв'язності пар кандидатів і вибір найшвидшого прямого P2P шляху.</tspan></text>
</svg>