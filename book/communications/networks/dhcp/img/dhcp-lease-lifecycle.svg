<rect x="254.5" y="237.3" width="211.0" height="45.3" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">RENEWING (T1 = 0.5 · Lease)</tspan><tspan x="360.0" dy="14.3">(Unicast REQUEST до сервера)</tspan></text>
<rect x="-2.3" y="237.3" width="224.6" height="45.3" rx="6" fill="#fff8e7" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="268.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">REBINDING (T2 = 0.875 · Lease)</tspan><tspan x="110.0" dy="14.3">(Broadcast REQUEST усім)</tspan></text>
