<text x="75.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Оренда вичерпана (Lease Expired) або DHCPNAK → Очищення IP та перехід в INIT</text>
