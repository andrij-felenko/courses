<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.3 -10 874.5 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-12.3" y="-10" width="874.5" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат станів DHCP та таймери оренди (RFC 2131)</text>
<rect x="40.0" y="67.3" width="140.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">INIT</tspan><tspan x="110.0" dy="14.3">(Старт, немає IP)</tspan></text>
