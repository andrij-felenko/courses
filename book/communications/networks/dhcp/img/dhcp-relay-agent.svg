<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ретрансляція DHCP через маршрутизатор (DHCP Relay Agent / GIADDR)</text>
<rect x="41.3" y="35.2" width="197.3" height="59.6" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="54.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">DHCP Клієнт</tspan><tspan x="140.0" dy="14.3">(VLAN 10: 192.168.10.0/24)</tspan><tspan x="140.0" dy="14.3">IP: 0.0.0.0 : 68</tspan></text>
<rect x="320.0" y="35.2" width="220.0" height="59.6" rx="6" fill="#fff8e7" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="54.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">DHCP Relay Agent (Router)</tspan><tspan x="430.0" dy="14.3">eth0: 192.168.10.1 (GIADDR)</tspan><tspan x="430.0" dy="14.3">eth1: 10.0.0.1 (до ядра)</tspan></text>
<rect x="604.3" y="35.2" width="231.4" height="59.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="54.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Центральний DHCP Сервер</tspan><tspan x="720.0" dy="14.3">(Серверний сегмент 10.0.0.0/24)</tspan><tspan x="720.0" dy="14.3">IP: 10.0.0.5 : 67</tspan></text>
<line x1="140.0" y1="105.0" x2="140.0" y2="470.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="430.0" y1="105.0" x2="430.0" y2="180.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="430.0" y1="248.0" x2="430.0" y2="470.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="720.0" y1="105.0" x2="720.0" y2="470.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="150.0" y1="145.0" x2="420.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="132.2" y="116.7" width="305.5" height="28.7" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="285.0" y="128.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">1. DHCPDISCOVER (L2 Broadcast)</tspan><tspan x="285.0" dy="11.7">Src: 0.0.0.0:68 → Dst: 255.255.255.255:67 | GIADDR=0.0.0.0</tspan></text>
<rect x="273.7" y="192.8" width="312.7" height="42.4" rx="6" fill="#fffaf0" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Relay Agent модифікує дейтаграму:</tspan><tspan x="430.0" dy="11.7">• Записує GIADDR = 192.168.10.1 (IP вхідного інтерфейсу)</tspan><tspan x="430.0" dy="11.7">• Збільшує HOPS (+1) та додає Option 82 (Circuit/Remote ID)</tspan></text>
<line x1="440.0" y1="280.0" x2="710.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="424.8" y="251.7" width="300.4" height="28.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="263.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">2. DHCPDISCOVER (L3 Unicast Forward)</tspan><tspan x="575.0" dy="11.7">Src: 10.0.0.1:67 → Dst: 10.0.0.5:67 | GIADDR=192.168.10.1</tspan></text>
<line x1="710.0" y1="355.0" x2="440.0" y2="355.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="409.4" y="320.8" width="331.2" height="40.4" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">3. DHCPOFFER (L3 Unicast Reply)</tspan><tspan x="575.0" dy="11.7">Сервер обирає пул 192.168.10.0/24 за GIADDR</tspan><tspan x="575.0" dy="11.7">Src: 10.0.0.5:67 → Dst: 192.168.10.1:67 | yiaddr=192.168.10.105</tspan></text>
<line x1="420.0" y1="430.0" x2="150.0" y2="430.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="142.5" y="395.8" width="285.0" height="40.4" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="407.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">4. DHCPOFFER (L2 Delivery до клієнта)</tspan><tspan x="285.0" dy="11.7">Relay видаляє Option 82 і передає пакет на MAC клієнта</tspan><tspan x="285.0" dy="11.7">Dst: 255.255.255.255:68 або Unicast на chaddr</tspan></text>
</svg>