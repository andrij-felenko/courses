<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириетапний діалог DHCP DORA та параметри кадрів</text>
<rect x="60.7" y="38.2" width="198.6" height="47.6" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="58.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">DHCP Клієнт</tspan><tspan x="160.0" dy="15.6">(MAC: 00:1A:2B:3C:4D:5E)</tspan></text>
<rect x="585.0" y="38.2" width="190.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="58.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">DHCP Сервер</tspan><tspan x="680.0" dy="15.6">(192.168.1.1 : 67)</tspan></text>
<line x1="160.0" y1="92.0" x2="160.0" y2="480.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="680.0" y1="92.0" x2="680.0" y2="480.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="170.0" y1="140.0" x2="670.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="205.0" y="104.0" width="430.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. DHCPDISCOVER (Широкомовний Broadcast)</tspan><tspan x="420.0" dy="13.0">Src: 0.0.0.0:68 → Dst: 255.255.255.255:67 | xid: 0x39A4F2B1</tspan><tspan x="420.0" dy="13.0">Option 53=1, Option 55=[1, 3, 6, 15], Flags: Broadcast/Unicast</tspan></text>
<line x1="670.0" y1="220.0" x2="170.0" y2="220.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="205.0" y="184.0" width="430.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. DHCPOFFER (Пропозиція конфігурації)</tspan><tspan x="420.0" dy="13.0">Src: 192.168.1.1:67 → Dst: 255.255.255.255:68 (або Unicast)</tspan><tspan x="420.0" dy="13.0">yiaddr: 192.168.1.105, Option 54 (Server ID): 192.168.1.1, Lease: 86400s</tspan></text>
<line x1="170.0" y1="300.0" x2="670.0" y2="300.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="205.0" y="264.0" width="430.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">3. DHCPREQUEST (Вибір сервера та запит оренди)</tspan><tspan x="420.0" dy="13.0">Src: 0.0.0.0:68 → Dst: 255.255.255.255:67 | xid: 0x39A4F2B1</tspan><tspan x="420.0" dy="13.0">Option 50 (Req IP): 192.168.1.105, Option 54 (Server ID): 192.168.1.1</tspan></text>
<line x1="670.0" y1="380.0" x2="170.0" y2="380.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="205.0" y="344.0" width="430.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">4. DHCPACK (Підтвердження оренди та опції)</tspan><tspan x="420.0" dy="13.0">Src: 192.168.1.1:67 → Dst: 255.255.255.255:68 (або Unicast)</tspan><tspan x="420.0" dy="13.0">yiaddr: 192.168.1.105, Mask: /24, Router: 192.168.1.1, DNS: 1.1.1.1</tspan></text>
<rect x="125.0" y="432.5" width="310.0" height="35.0" rx="6" fill="#fff8e7" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Перевірка IP: ARP Probe / Gratuitous ARP</tspan><tspan x="280.0" dy="13.0">(Якщо конфлікт → DHCPDECLINE; інакше → BOUND)</tspan></text>
<line x1="160.0" y1="435.0" x2="200.0" y2="450.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>