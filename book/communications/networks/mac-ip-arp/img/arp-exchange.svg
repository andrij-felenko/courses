<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ARP: як знайти MAC за відомим IP у своїй мережі</text>
<circle cx="110.0" cy="230.0" r="40.0" fill="#eef3ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="110.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<text x="110.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">я</text>
<rect x="40.0" y="278.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/><text x="110.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">знаю IP цілі</tspan><tspan x="110.0" dy="13.0">MAC — ні</tspan></text>
<circle cx="600.0" cy="110.0" r="34.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="600.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">B</text>
<circle cx="600.0" cy="230.0" r="34.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">C</text>
<rect x="644.0" y="212.0" width="120.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.1"/><text x="704.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="704.0" dy="0.0">це мій IP</tspan><tspan x="704.0" dy="13.0">.42</tspan></text>
<circle cx="600.0" cy="350.0" r="34.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="600.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">D</text>
<line x1="152.0" y1="212.0" x2="562.0" y2="110.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="152.0" y1="212.0" x2="562.0" y2="230.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="152.0" y1="212.0" x2="562.0" y2="350.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="255.0" y="150.0" width="250.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="380.0" y="167.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1. ЗАПИТ — усім (broadcast)</tspan><tspan x="380.0" dy="14.3">MAC-ціль: FF:FF:FF:FF:FF:FF</tspan><tspan x="380.0" dy="14.3">«у кого 192.168.1.42?»</tspan></text>
<line x1="562.0" y1="244.0" x2="150.0" y2="244.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="300.0" width="260.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="380.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2. ВІДПОВІДЬ — особисто A (unicast)</tspan><tspan x="380.0" dy="14.3">«.42 → це мій MAC C0:FF:EE:...»</tspan><tspan x="380.0" dy="14.3">тепер A знає MAC цілі</tspan></text>
<text x="380.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Питають усіх; відповідає тільки власник адреси — і теж особисто.</text>
</svg>