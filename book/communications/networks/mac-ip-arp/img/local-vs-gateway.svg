<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="385.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кого питати ARP: ціль у моїй мережі — чи маршрутизатор?</text>
<rect x="255.0" y="61.5" width="260.0" height="33.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="385.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">Хочу надіслати на IP цілі</tspan></text>
<polygon points="385,120 535,158 385,196 235,158" fill="#fff7e6" stroke="#6b7280" stroke-width="1.6"/>
<text x="385.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">ціль у МОЇЙ підмережі?</tspan><tspan x="385.0" dy="14.3">(IP &amp; маска збігаються)</tspan></text>
<line x1="385.0" y1="96.0" x2="385.0" y2="118.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">ТАК</text>
<line x1="235.0" y1="158.0" x2="200.0" y2="158.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="182.0" width="300.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="200.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ARP саму ЦІЛЬ:</tspan><tspan x="200.0" dy="14.3">«у кого цей IP?» → її MAC</tspan><tspan x="200.0" dy="14.3"></tspan><tspan x="200.0" dy="14.3">кадр шлю ПРЯМО на MAC цілі</tspan><tspan x="200.0" dy="14.3">один крок — і на місці</tspan></text>
<text x="545.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">НІ (інша мережа)</text>
<line x1="535.0" y1="158.0" x2="570.0" y2="158.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.0" y="182.0" width="300.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="570.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">ARP ШЛЮЗ (маршрутизатор):</tspan><tspan x="570.0" dy="14.3">беру його MAC</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">кадр — на MAC шлюзу,</tspan><tspan x="570.0" dy="14.3">але IP-пакет — на кінцевий вузол</tspan></text>
<text x="385.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ARP працює лише в МЕЖАХ однієї підмережі — широкомовний крик не виходить за маршрутизатор.</text>
<text x="385.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">За межі веде маршрутизація: кадр віддаєш шлюзу, а він передає пакет далі.</text>
</svg>