<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три коди Голея</text>
<rect x="40.0" y="56.0" width="700.0" height="112.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="60.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">[23, 12, 7]</text>
<text x="272.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start"><tspan x="272.0" dy="0.0">12 бітів даних + 11 перевірних = 23</tspan><tspan x="272.0" dy="22.4">виправляє 3 помилки</tspan></text>
<rect x="575.5" y="82.8" width="144.9" height="58.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="648.0" y="107.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="648.0" dy="0.0">ДОСКОНАЛИЙ</tspan><tspan x="648.0" dy="19.5">2¹²·2¹¹ = 2²³</tspan></text>
<rect x="40.0" y="180.0" width="700.0" height="112.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="60.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">[24, 12, 8]</text>
<text x="272.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start"><tspan x="272.0" dy="0.0">+1 біт парності до 23  →  24</tspan><tspan x="272.0" dy="22.4">навпіл: 12 даних, 12 захисту</tspan><tspan x="272.0" dy="22.4">виправляє 3, виявляє 4</tspan></text>
<rect x="566.2" y="206.8" width="163.5" height="58.5" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="648.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="648.0" dy="0.0">код «Вояджерів»</tspan><tspan x="648.0" dy="19.5">Юпітер і Сатурн</tspan></text>
<rect x="40.0" y="304.0" width="700.0" height="112.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="60.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700">[11, 6, 5]</text>
<text x="272.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start"><tspan x="272.0" dy="0.0">трійковий: над 3 символами (1 / X / 2)</tspan><tspan x="272.0" dy="22.4">виправляє 2 помилки</tspan></text>
<rect x="584.9" y="330.8" width="126.3" height="58.5" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="648.0" y="355.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="648.0" dy="0.0">ДОСКОНАЛИЙ</tspan><tspan x="648.0" dy="19.5">3⁶·3⁵ = 3¹¹</tspan></text>
</svg>