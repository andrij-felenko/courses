<text x="390.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">Осередки не налазять один на одного й не лишають зазору:</text>
<text x="390.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">4096 кодових слів × 2048 слів у кулі  =  2²³  —  увесь простір, без залишку.</text>
