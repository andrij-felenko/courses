<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому Флетчер ловить перестановку, яку проста сума пропускає</text>
<text x="60.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">порядок A B C:</text>
<rect x="60.0" y="96.0" width="70.0" height="38.0" rx="5" fill="#eaf0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="95.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<text x="95.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">×3</text>
<rect x="156.0" y="96.0" width="70.0" height="38.0" rx="5" fill="#eaf0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="191.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="191.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">×2</text>
<rect x="252.0" y="96.0" width="70.0" height="38.0" rx="5" fill="#eaf0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="287.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<text x="287.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">×1</text>
<text x="60.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">порядок B A C (переставлено):</text>
<rect x="60.0" y="216.0" width="70.0" height="38.0" rx="5" fill="#eaf0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="95.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="95.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">×3</text>
<rect x="156.0" y="216.0" width="70.0" height="38.0" rx="5" fill="#eaf0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="191.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<text x="191.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">×2</text>
<rect x="252.0" y="216.0" width="70.0" height="38.0" rx="5" fill="#eaf0ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="287.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C</text>
<text x="287.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">×1</text>
<rect x="360.0" y="84.0" width="300.0" height="62.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="376.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">sum1 = A+B+C</text>
<text x="376.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="start" font-weight="700">sum2 = 3A+2B+C</text>
<rect x="360.0" y="204.0" width="300.0" height="62.0" rx="6" fill="#fafafa" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="376.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">sum1 = B+A+C  (та сама!)</text>
<text x="376.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">sum2 = 3B+2A+C  (інша!)</text>
<line x1="50.0" y1="296.0" x2="670.0" y2="296.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="360.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">sum1 порядку не бачить; sum2 зважує байт позицією — і ловить перестановку</text>
<text x="360.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">готова сума Флетчера = (sum2 &lt;&lt; 8) | sum1</text>
</svg>