<text x="385.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">мільярди кілометрів — сигнал слабне</text>
<rect x="30.0" y="180.0" width="232.0" height="130.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<rect x="30.0" y="180.0" width="232.0" height="7.0" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="146.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Сигнал — слабший за подих</text>
<text x="146.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="146.0" dy="0.0">Передавач — як лампочка (близько 20 Вт).</tspan><tspan x="146.0" dy="13.7">За мільярди км до антени долітають крихти</tspan><tspan x="146.0" dy="13.7">енергії — на самій межі шуму.</tspan></text>
<rect x="282.0" y="180.0" width="232.0" height="130.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="2.2"/>
<rect x="282.0" y="180.0" width="232.0" height="7.0" rx="0" fill="#caa24a" stroke="#caa24a" stroke-width="0.0"/>
<text x="398.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="700">Перепитати — не варіант</text>
<text x="398.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="398.0" dy="0.0">Радіохвиля йде в один бік годинами.</tspan><tspan x="398.0" dy="13.7">Запит «повтори» вертався б добу й довше —</tspan><tspan x="398.0" dy="13.7">діалог із підтвердженням тут марний.</tspan></text>
<rect x="534.0" y="180.0" width="232.0" height="130.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<rect x="534.0" y="180.0" width="232.0" height="7.0" rx="0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="650.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Тож лагодимо на місці</text>
<text x="650.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Раз перепитати не можна — приймач мусить</tspan><tspan x="650.0" dy="13.7">виправити з того, що прийшло. Для цього</tspan><tspan x="650.0" dy="13.7">в потік наперед домішують надлишок.</tspan></text>
</svg>