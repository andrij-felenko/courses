<text x="480.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сильніший код: +23% бітів, повільніше читання — і лише ×52.   Коротше вікно: нуль бітів, сама лише регулярність — ×14 000.</text>
