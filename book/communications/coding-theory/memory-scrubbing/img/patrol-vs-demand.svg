<text x="245.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e874b" text-anchor="middle">уже почищено</text>
<text x="670.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">черга попереду</text>
<text x="60.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">дістає навіть ХОЛОДНІ слова, до яких програма не звертається роками — гарантований повний прохід за заданий час</text>
<line x1="50.0" y1="228.0" x2="830.0" y2="228.0" stroke="#e0e0e0" stroke-width="1.2"/>
<text x="60.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">На вимогу — лише там, де ЗВИЧАЙНЕ читання знайшло виправний збій</text>
