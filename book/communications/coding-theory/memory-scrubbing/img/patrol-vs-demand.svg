<text x="393.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e874b" text-anchor="middle" font-weight="700">знайшло збій → одразу запис назад полагодженого</text>
<text x="60.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">дешево (слово й так прочитали), але лагодить лише ГАРЯЧІ дані, до яких торкнулись — холодні лишає патрулю</text>
<text x="440.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">разом вони покривають і холодні дані (патруль), і гарячі (вимога)</text>
