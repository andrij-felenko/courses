<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два різновиди: патрульне прочісує все, на вимогу лагодить те, чого торкнулись</text>
<text x="60.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Патрульне — фоновий обхід УСІЄЇ пам'яті адреса за адресою</text>
