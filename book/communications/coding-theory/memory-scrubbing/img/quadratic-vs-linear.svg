<text x="653.4" y="252.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">×180 = t / T</text>
<text x="644.4" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">6 місяців</text>
<text x="730.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">нахил 2 — ризик РОЗГАНЯЄТЬСЯ</text>
<text x="730.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">без очищення:  P ∝ t²</text>
<text x="620.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e874b" text-anchor="end" font-weight="700">з очищенням:  P ∝ T·t</text>
<text x="620.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e874b" text-anchor="end" font-style="italic">нахил 1 — стала небезпека</text>
<text x="450.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Без очищення вікно росте разом із місією — тому крива квадратична й задирається.</text>
<text x="450.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Очищення підрізає вікно до сталої T — крива стає прямою, а розрив шириться як t/T.</text>
