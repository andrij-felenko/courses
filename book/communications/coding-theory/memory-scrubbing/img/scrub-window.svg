<text x="470.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Фізика однакова: шість збоїв, ті самі моменти. Фатальна лише пара В ОДНОМУ вікні — тому ризик тягне не λ, а λ·(довжина вікна).</text>
