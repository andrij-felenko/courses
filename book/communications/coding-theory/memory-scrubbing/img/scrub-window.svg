<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікно експозиції: той самий потік збоїв — два різні присуди</text>
<text x="470.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">одне слово, ті самі шість влучань у ті самі моменти; різниця лише в тому, чи хтось прибирає між ними</text>
<text x="120.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">БЕЗ очищення — вікно дорівнює всьому часу роботи</text>
