<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інша оселя того ж CRC: усередині контролерів CAN і SD він живе прямо на лінії</text>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Тут CRC не послуга для процесора, а вартовий на дроті: рахується сам, на льоту, повз ядро</text>
<text x="70.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Передавання кадру</text>
<rect x="70.0" y="110.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="110.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ідентиф.</text>
<rect x="156.0" y="110.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="196.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="242.0" y="110.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="282.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="328.0" y="110.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="368.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="414.0" y="110.0" width="80.0" height="38.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="2.2"/>
<text x="454.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">CRC</text>
<text x="454.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">15/16 біт</text>
<text x="544.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">→ на шину</text>
<rect x="180.0" y="170.0" width="240.0" height="48.0" rx="6" fill="#fffdf6" stroke="#caa24a" stroke-width="1.5"/><text x="300.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">апаратний генератор CRC</tspan><tspan x="300.0" dy="13.0">рахує остачу з усіх байтів кадру</tspan></text>
<line x1="420.0" y1="188.0" x2="454.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">сам дописує</text>
<line x1="60.0" y1="248.0" x2="700.0" y2="248.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="380.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">фізична лінія (CAN-шина / SPI до картки) — біти летять як є</text>
<text x="70.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Приймання кадру</text>
<rect x="70.0" y="296.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="110.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ідентиф.</text>
<rect x="156.0" y="296.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="196.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="242.0" y="296.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="282.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="328.0" y="296.0" width="80.0" height="38.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="368.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані</text>
<rect x="414.0" y="296.0" width="80.0" height="38.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="2.2"/>
<text x="454.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">CRC</text>
<text x="454.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">15/16 біт</text>
<rect x="180.0" y="352.0" width="240.0" height="48.0" rx="6" fill="#fffdf6" stroke="#caa24a" stroke-width="1.5"/><text x="300.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">той самий генератор у приймачі</tspan><tspan x="300.0" dy="13.0">рахує CRC заново з прийнятих байтів</tspan></text>
<rect x="470.0" y="352.0" width="230.0" height="48.0" rx="9" fill="#f0fff2" stroke="#27ae60" stroke-width="2.0"/>
<text x="585.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">звіряє: свій CRC = CRC з кадру?</text>
<text x="585.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">збіглися → прийнято · ні → відкинуто</text>
<line x1="420.0" y1="376.0" x2="468.0" y2="376.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="60.0" y="426.0" width="640.0" height="44.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="444.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Ключова відмінність від блока в МК: тут CRC вбудований у протокол і працює автоматично —</tspan><tspan x="380.0" dy="13.7">апаратура сама додає його при передачі й перевіряє при прийомі, ще до того, як байти дійдуть до коду.</tspan></text>
</svg>