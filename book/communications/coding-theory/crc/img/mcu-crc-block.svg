<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний блок CRC у мікроконтролері (STM32-клас)</text>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Процесор лише пише слова в регістр і читає готову остачу — такти зсуву й XOR блок робить сам</text>
<line x1="60.0" y1="150.0" x2="700.0" y2="150.0" stroke="#1a1a1a" stroke-width="3.0"/>
<text x="70.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">внутрішня шина МК (AHB / APB)</text>
<rect x="70.0" y="96.0" width="150.0" height="90.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="145.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро (CPU)</text>
<text x="145.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пише слово →</text>
<text x="145.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">← читає остачу</text>
<text x="145.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">вільне для іншого</text>
<rect x="280.0" y="200.0" width="420.0" height="200.0" rx="12" fill="#fffdf6" stroke="#caa24a" stroke-width="2.4"/>
<text x="490.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="700">Периферійний блок CRC</text>
<rect x="310.0" y="246.0" width="180.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">DR — регістр даних</tspan><tspan x="400.0" dy="14.3">CRC-&gt;DR = word;</tspan></text>
<text x="400.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сюди процесор кладе 32-бітне слово</text>
<rect x="310.0" y="326.0" width="180.0" height="60.0" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2.0"/>
<text x="400.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">зсувний регістр + XOR</text>
<text x="400.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відводи = поліном</text>
<text x="400.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">за такт — зсув і XOR</text>
<line x1="400.0" y1="296.0" x2="400.0" y2="324.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="520.0" y="246.0" width="160.0" height="50.0" rx="6" fill="#f0fff2" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="267.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">акумулятор остачі</tspan><tspan x="600.0" dy="13.7">crc = CRC-&gt;DR;</tspan></text>
<text x="600.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">читання = готовий CRC</text>
<line x1="490.0" y1="350.0" x2="520.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="326.0" width="160.0" height="60.0" rx="6" fill="#ffffff" stroke="#7a3ea8" stroke-width="1.5"/><text x="600.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">фіксоване в залізі:</tspan><tspan x="600.0" dy="12.3">поліном, init;</tspan><tspan x="600.0" dy="12.3">деякі блоки — настроювані</tspan></text>
<rect x="60.0" y="416.0" width="640.0" height="40.0" rx="6" fill="#f0fff2" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="432.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Суть: апаратний CRC — той самий бітовий цикл, виконаний електронікою за частку такту на біт.</tspan><tspan x="380.0" dy="13.7">Ядро не крутить цикл — лише годує блок словами й наприкінці читає остачу.</tspan></text>
</svg>