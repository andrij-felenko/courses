<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблична версія: вісім бітових тактів згорнуто в одне читання</text>
<text x="380.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ідея Сарвейта: наслідок восьми тактів залежить лише від байта зверху — рахуймо його заздалегідь</text>
<rect x="50.0" y="70.0" width="300.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Бітовий цикл — 8 тактів на байт</tspan><tspan x="200.0" dy="15.6"></tspan><tspan x="200.0" dy="15.6">8 розгалужень «if msb»</tspan><tspan x="200.0" dy="15.6">на кожен байт даних</tspan></text>
<line x1="360.0" y1="125.0" x2="420.0" y2="125.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="390.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">одне</text>
<text x="390.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">читання</text>
<rect x="430.0" y="70.0" width="280.0" height="110.0" rx="6" fill="#f0fff2" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Таблична версія — 1 крок на байт</tspan><tspan x="570.0" dy="15.0"></tspan><tspan x="570.0" dy="15.0">idx = (crc &gt;&gt; 8) ^ byte</tspan><tspan x="570.0" dy="15.0">crc = (crc &lt;&lt; 8) ^ T[idx]</tspan><tspan x="570.0" dy="15.0"></tspan><tspan x="570.0" dy="15.0">Жодних гілок у гарячому циклі.</tspan></text>
<text x="380.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як народжується один рядок T[i]: проганяємо «бітовим» циклом самé значення i</text>
<rect x="70.0" y="230.0" width="150.0" height="56.0" rx="6" fill="#ffffff" stroke="#7a3ea8" stroke-width="1.5"/><text x="145.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">байт i</tspan><tspan x="145.0" dy="15.6">0x00 … 0xFF</tspan></text>
<line x1="225.0" y1="258.0" x2="290.0" y2="258.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="290.0" y="230.0" width="200.0" height="56.0" rx="6" fill="#f4f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="254.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">бітовий цикл 8 разів</tspan><tspan x="390.0" dy="14.3">(той самий, що ліворуч)</tspan></text>
<line x1="495.0" y1="258.0" x2="560.0" y2="258.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="560.0" y="230.0" width="150.0" height="56.0" rx="6" fill="#f0fff2" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="254.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">T[i]</tspan><tspan x="635.0" dy="14.3">запис у таблицю</tspan></text>
<text x="380.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Це роблять один раз — на старті програми; далі таблиця лежить готова.</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фрагмент готової таблиці (CRC-32, рефлексований варіант)</text>
<rect x="59.0" y="346.0" width="122.0" height="54.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="120.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="700">0x00</text>
<text x="120.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x00000000</text>
<rect x="189.0" y="346.0" width="122.0" height="54.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="250.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="700">0x01</text>
<text x="250.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x77073096</text>
<rect x="319.0" y="346.0" width="122.0" height="54.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="700">0x02</text>
<text x="380.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0xEE0E612C</text>
<rect x="449.0" y="346.0" width="122.0" height="54.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="510.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="700">0x03</text>
<text x="510.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x990951BA</text>
<rect x="579.0" y="346.0" width="122.0" height="54.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="640.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="700">0x04</text>
<text x="640.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x076DC419</text>
<rect x="50.0" y="414.0" width="660.0" height="44.0" rx="6" fill="#fff7ec" stroke="#caa24a" stroke-width="1.5"/><text x="380.0" y="432.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Платимо пам'яттю: таблиця CRC-32 — 256×4 = 1024 байти Flash (CRC-8 — 256 байтів).</tspan><tspan x="380.0" dy="13.7">Виграємо ~увосьмеро менше тактів і жодних гілок — на МК без апаратного CRC це найходовіший компроміс.</tspan></text>
</svg>