<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
<rect width="900" height="600" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
  <marker id="aViol" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Таблична версія: вісім бітових тактів згорнуто в одне читання таблиці</text>
<text x="450.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ідея Сарвейта (1988): наслідок восьми тактів залежить лише від байта зверху — тож порахуймо його заздалегідь</text>
<rect x="60.0" y="80.0" width="360.0" height="150.0" rx="9" fill="#fff" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="240.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Бітовий цикл — 8 тактів на байт</text>
<circle cx="100.0" cy="124.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="116.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">такт 1: зсув + XOR</text>
<circle cx="100.0" cy="136.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="116.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">такт 2: зсув</text>
<circle cx="100.0" cy="148.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="116.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">такт 3: зсув</text>
<circle cx="100.0" cy="160.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="116.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">такт 4: зсув + XOR</text>
<circle cx="100.0" cy="172.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="116.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">такт 5: зсув + XOR</text>
<circle cx="100.0" cy="184.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="116.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">такт 6: зсув</text>
<circle cx="100.0" cy="196.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="116.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">такт 7: зсув</text>
<circle cx="100.0" cy="208.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="116.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">такт 8: зсув</text>
<text x="240.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">8 розгалужень «if msb» на кожен байт</text>
<line x1="430.0" y1="152.0" x2="490.0" y2="152.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="460.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">одне</text>
<text x="460.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">читання</text>
<rect x="510.0" y="80.0" width="330.0" height="150.0" rx="9" fill="#f0fff2" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="675.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Таблична версія — 1 крок на байт</text>
<text x="530.0" y="132.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal">idx  = (crc &gt;&gt; 8) ^ byte</text>
<text x="530.0" y="154.0" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="normal">crc  = (crc &lt;&lt; 8) ^ T[idx]</text>
<text x="530.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">T[256] — заздалегідь порахований CRC</text>
<text x="530.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">кожного з 256 значень байта.</text>
<text x="530.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="start" font-weight="normal" font-style="normal">Жодних розгалужень у гарячому циклі.</text>
<text x="450.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як народжується один рядок таблиці T[i]: проганяємо «бітовим» циклом самé значення i</text>
<rect x="90.0" y="286.0" width="150.0" height="60.0" rx="8" fill="#fff" stroke="#7a3ea8" stroke-width="2"/>
<text x="165.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7a3ea8" text-anchor="middle" font-weight="bold" font-style="normal">байт i</text>
<text x="165.0" y="332.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0x00 … 0xFF</text>
<line x1="240.0" y1="316.0" x2="305.0" y2="316.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="305.0" y="286.0" width="215.0" height="60.0" rx="8" fill="#f4f7ff" stroke="#1f47b5" stroke-width="2"/>
<text x="412.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">бітовий цикл 8 разів</text>
<text x="412.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(той самий, що на Рис. 3.9.4a.1)</text>
<line x1="520.0" y1="316.0" x2="585.0" y2="316.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<rect x="585.0" y="286.0" width="170.0" height="60.0" rx="8" fill="#f0fff2" stroke="#1f8a3b" stroke-width="2"/>
<text x="670.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">T[i] — 32 (чи 8/16) біт</text>
<text x="670.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">запис у таблицю</text>
<text x="450.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це роблять один раз — на старті програми або на етапі компіляції; далі таблиця лежить готова.</text>
<text x="450.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Фрагмент готової таблиці (CRC-32, рефлексований варіант)</text>
<text x="130.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">i</text>
<rect x="150.0" y="414.0" width="88.0" height="56.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="194.0" y="436.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="bold">0x00</text>
<text x="194.0" y="458.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x00000000</text>
<rect x="250.0" y="414.0" width="88.0" height="56.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="294.0" y="436.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="bold">0x01</text>
<text x="294.0" y="458.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x77073096</text>
<rect x="350.0" y="414.0" width="88.0" height="56.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="394.0" y="436.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="bold">0x02</text>
<text x="394.0" y="458.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0xEE0E612C</text>
<rect x="450.0" y="414.0" width="88.0" height="56.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="494.0" y="436.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="bold">0x03</text>
<text x="494.0" y="458.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x990951BA</text>
<rect x="550.0" y="414.0" width="88.0" height="56.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="594.0" y="436.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="bold">0x04</text>
<text x="594.0" y="458.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x076DC419</text>
<rect x="650.0" y="414.0" width="88.0" height="56.0" rx="6" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="694.0" y="436.0" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7a3ea8" text-anchor="middle" font-weight="bold">0x05</text>
<text x="694.0" y="458.0" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal">0x706AF48F</text>
<text x="756.0" y="448.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">… і так усі 256 рядків</text>
<rect x="60.0" y="500.0" width="780.0" height="78.0" rx="9" fill="#fff7ec" stroke="#caa24a" stroke-width="1.8"/>
<text x="80.0" y="526.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">Чим платимо й що виграємо:</text>
<text x="80.0" y="548.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Пам'ять: таблиця CRC-32 — це 256 × 4 = 1024 байти у Flash. Для CRC-8 — лише 256 байтів.</text>
<text x="80.0" y="566.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• Швидкість: ~ у 8 разів менше тактів і жодних гілок — на МК без апаратного CRC це найходовіший компроміс.</text>
</svg>
