<line x1="200.0" y1="550.0" x2="214.0" y2="550.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="200.0" y1="370.0" x2="186.0" y2="370.0" stroke="#c0392b" stroke-width="2.2"/>
<rect x="60.7" y="327.1" width="110.7" height="85.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="116.0" y="349.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="116.0" dy="0.0">≈ 12 років</tspan><tspan x="116.0" dy="16.9">пошуку</tspan><tspan x="116.0" dy="16.9">практичного</tspan><tspan x="116.0" dy="16.9">декодера</tspan></text>
</svg>