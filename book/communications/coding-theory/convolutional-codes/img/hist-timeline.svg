<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 825" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="825" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код 1955 — декодер 1967: дванадцять років між кодом і його переможним декодером</text>
<line x1="312.0" y1="66.0" x2="312.0" y2="762.0" stroke="#6b7280" stroke-width="2.2"/>
<line x1="320.0" y1="100.0" x2="352.0" y2="100.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1948</text>
<circle cx="312.0" cy="100.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
<rect x="356.0" y="70.0" width="690.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="701.0" y="95.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Шеннон — теорема кодування каналу: надійність нижче межі досяжна</tspan><tspan x="701.0" dy="17.6">обіцянка без рецепту: самого коду теорема не дає</tspan></text>
<line x1="320.0" y1="190.0" x2="352.0" y2="190.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1955</text>
<circle cx="312.0" cy="190.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="356.0" y="160.0" width="690.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="701.0" y="185.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Еліас — згорткові коди: надлишок вплетено в потік, а не в блоки</tspan><tspan x="701.0" dy="17.6">код народжено; доброго декодера до нього ще немає</tspan></text>
<line x1="320.0" y1="280.0" x2="352.0" y2="280.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1957</text>
<circle cx="312.0" cy="280.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="356.0" y="250.0" width="690.0" height="60.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/><text x="701.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Возенкрафт — послідовне декодування, перший практичний метод</tspan><tspan x="701.0" dy="17.6">майже оптимальне, та обсяг лічби — випадковий, з важким хвостом</tspan></text>
<line x1="320.0" y1="370.0" x2="352.0" y2="370.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1963</text>
<circle cx="312.0" cy="370.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="356.0" y="340.0" width="690.0" height="60.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/><text x="701.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Фано — послідовне декодування без стека, ощадніше на пам'ять</tspan><tspan x="701.0" dy="17.6">вище порогової швидкості лічба вибухає — буфер переповнюється</tspan></text>
<line x1="320.0" y1="460.0" x2="352.0" y2="460.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1963</text>
<circle cx="312.0" cy="460.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="356.0" y="430.0" width="690.0" height="60.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/><text x="701.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Мессі — порогове (мажоритарне) декодування: просте й швидке</tspan><tspan x="701.0" dy="17.6">лічба обмежена, зате код помітно слабший за оптимум</tspan></text>
<line x1="320.0" y1="550.0" x2="352.0" y2="550.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">1967</text>
<circle cx="312.0" cy="550.0" r="13.0" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="312.0" cy="550.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.6"/>
<rect x="356.0" y="520.0" width="690.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="701.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Вітербі — асимптотично оптимальний алгоритм, СТАЛА лічба на такт</tspan><tspan x="701.0" dy="17.6">народжений як доказ меж помилки й засіб пояснити студентам</tspan></text>
<line x1="320.0" y1="640.0" x2="352.0" y2="640.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="645.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1969</text>
<circle cx="312.0" cy="640.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="356.0" y="610.0" width="690.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="701.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Омура — це пряме динамічне програмування (ML для автомата)</tspan><tspan x="701.0" dy="17.6">оптимальність випливає одразу, щойно впізнати в ньому DP</tspan></text>
<line x1="320.0" y1="730.0" x2="352.0" y2="730.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="286.0" y="735.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end">1973</text>
<circle cx="312.0" cy="730.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="356.0" y="700.0" width="690.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="701.0" y="726.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="701.0" dy="0.0">Форні — це декодування за максимумом правдоподібності; ґратка</tspan><tspan x="701.0" dy="17.6">дає ім'я «алгоритм Вітербі» і вжиток далеко за межами кодів</tspan></text>
