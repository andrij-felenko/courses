<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апостеріор = канал + апріор + зовнішнє; напарникові йде лише зовнішнє</text>
<rect x="220.0" y="96.0" width="170.0" height="56.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<rect x="390.0" y="96.0" width="165.0" height="56.0" rx="5" fill="#fdf3e3" stroke="#c77d0a" stroke-width="2.2"/>
<rect x="555.0" y="96.0" width="245.0" height="56.0" rx="5" fill="#eef4ff" stroke="#2457d6" stroke-width="2.4"/>
<text x="305.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">L_канал</text>
<text x="472.5" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c77d0a" text-anchor="middle" font-weight="700">L_апріор</text>
<text x="677.5" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">L_зовн</text>
<text x="204.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">L_апост(uₖ) =</text>
<text x="305.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="305.0" dy="0.0">= Lᴄ·yˢ</tspan><tspan x="305.0" dy="13.8">власний систематичний відлік</tspan></text>
<text x="472.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c77d0a" text-anchor="middle"><tspan x="472.5" dy="0.0">від напарника</tspan><tspan x="472.5" dy="13.8">(його попередня звістка)</tspan></text>
<text x="677.5" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="677.5" dy="0.0">нове — з контролю</tspan><tspan x="677.5" dy="13.8">й сусідніх бітів</tspan></text>
<text x="305.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">✗ напарник це вже має</text>
<text x="472.5" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">✗ він це щойно й сказав</text>
<line x1="739.5" y1="158.0" x2="739.5" y2="330.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="631.6" y="332.6" width="215.8" height="50.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="739.5" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="739.5" dy="0.0">лише L_зовн → напарникові</tspan><tspan x="739.5" dy="16.2">(стає його L_апріор)</tspan></text>
<rect x="104.5" y="373.7" width="511.1" height="48.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="360.0" y="394.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">віддати весь L_апост = повернути напарникові його ж слова</tspan><tspan x="360.0" dy="15.1">як «незалежне» підтвердження → фальшива певність, мов виск мікрофона</tspan></text>
</svg>