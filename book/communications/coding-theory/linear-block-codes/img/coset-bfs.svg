<text x="347.5" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">⊕ один стовпець H</text>
<text x="470.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">8 синдромів = 1 нульовий + 7 стовпців → таблиця заповнилась уже на рівні 1.</tspan><tspan x="470.0" dy="18.8">Рівня 2 просто немає: вільних синдромів не лишилось, тож будь-яка помилка</tspan><tspan x="470.0" dy="18.8">ваги 2 неминуче збігається з чиїмось стовпцем — і декодер «виправить» не той біт.</tspan></text>
