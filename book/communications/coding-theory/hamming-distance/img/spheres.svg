<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дозволені слова — острівці, помилка зсуває нас від берега</text>
<line x1="270.0" y1="230.0" x2="610.0" y2="230.0" stroke="#e4e4e4" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="440.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">відстань d між словами</text>
<circle cx="270.0" cy="230.0" r="70.0" fill="#eef7ef" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="610.0" cy="230.0" r="70.0" fill="#eef7ef" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="270.0" cy="230.0" r="15.0" fill="#fff" stroke="#2457d6" stroke-width="2.6"/>
<text x="270.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<circle cx="610.0" cy="230.0" r="15.0" fill="#fff" stroke="#2457d6" stroke-width="2.6"/>
<text x="610.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">B</text>
<text x="270.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">куля A: радіус t</text>
<text x="610.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">куля B: радіус t</text>
<circle cx="308.0" cy="202.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="320.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">прийнято з помилкою</text>
<line x1="308.0" y1="202.0" x2="283.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="300.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">ближче до A → вертаємо в A ✓</text>
<line x1="60.0" y1="344.0" x2="820.0" y2="344.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="60.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Якщо помилок ≤ t = ⌊(d−1)/2⌋ — точка ще у «своїй» кулі → виправимо однозначно.</text>
<text x="60.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="start">Якщо помилок до d−1 — точка вийшла зі своєї кулі, але не дійшла чужої → бачимо, що щось не так.</text>
<text x="60.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">Якщо помилок ≥ d — могли впасти в ЧУЖУ кулю → приймемо хибне слово за правильне (тиха помилка).</text>
</svg>