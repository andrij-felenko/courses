<rect x="612.0" y="252.0" width="170.0" height="38.0" rx="5" fill="#f4f4f4" stroke="#c9c9c9" stroke-width="1.4"/>
<text x="697.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">дані</text>
<line x1="70.0" y1="298.0" x2="70.0" y2="306.0" stroke="#caa24a" stroke-width="1.8"/>
<line x1="782.0" y1="298.0" x2="782.0" y2="306.0" stroke="#caa24a" stroke-width="1.8"/>
