<text x="426.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="middle" font-weight="700">TCP/UDP checksum — псевдозаголовок + заголовок + дані</text>
<text x="426.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">псевдозаголовок прив'язує суму до IP-адрес і протоколу — хибно доставлений пакет не пройде</text>
