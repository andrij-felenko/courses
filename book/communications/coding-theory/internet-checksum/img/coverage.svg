<line x1="430.0" y1="138.0" x2="430.0" y2="146.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="70.0" y1="146.0" x2="430.0" y2="146.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="250.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">IP checksum — лише заголовок</text>
<text x="250.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">TTL спадає щохопу → перераховують тільки заголовок, не дані</text>
