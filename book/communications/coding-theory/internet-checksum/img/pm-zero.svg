<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 432" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="432" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Помилка ±0: RFC 1141 проти RFC 1624</text>
<text x="430.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">коли правильна нова сума — це нуль</text>
<rect x="319.2" y="73.8" width="221.5" height="32.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="430.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">HC′  має бути  +0 = 0x0000</tspan></text>
<line x1="396.0" y1="106.2" x2="292.0" y2="150.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="464.0" y1="106.2" x2="568.0" y2="150.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="56.0" y="152.0" width="352.0" height="30.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.5"/><text x="232.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="232.0" dy="0.0">RFC 1141 (1990) — гола сума</tspan></text>
<rect x="56.0" y="194.0" width="352.0" height="38.0" rx="6" fill="#f6f7f9" stroke="#1a1a1a" stroke-width="1.4"/><text x="232.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="232.0" dy="0.0">HC′ = HC +₁ m +₁ ~m′</tspan></text>
<text x="232.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сума ненульових доданків не буває +0</text>
<rect x="120.0" y="276.0" width="224.0" height="44.0" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="2.0"/>
<text x="232.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">0xFFFF  (−0)</text>
<text x="232.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">✗ хибно (−0 замість +0)</text>
<rect x="452.0" y="152.0" width="352.0" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="628.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="628.0" dy="0.0">RFC 1624 (1994) — інверсія в кінці</tspan></text>
<rect x="452.0" y="194.0" width="352.0" height="38.0" rx="6" fill="#f6f7f9" stroke="#1a1a1a" stroke-width="1.4"/><text x="628.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="628.0" dy="0.0">HC′ = ~(~HC +₁ ~m +₁ m′)</tspan></text>
<text x="628.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">фінальне  ~  повертає −0 у +0</text>
<rect x="516.0" y="276.0" width="224.0" height="44.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="628.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0x0000  (+0)</text>
<text x="628.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">✓ правильно</text>
<line x1="60.0" y1="374.0" x2="800.0" y2="374.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="430.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">припущена дистрибутивність  ~  над сумою ламається саме на нулі — двоїстість оберненого коду</text>
<text x="430.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">RFC 1141 не «повертається» в область суми й не інвертує наприкінці, тож застряє на −0</text>
</svg>