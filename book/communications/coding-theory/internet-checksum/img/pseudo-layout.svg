<text x="414.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довжина тут — це довжина TCP/UDP (заголовок + дані), а НЕ довжина IP-пакета.</text>
<text x="414.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Протокол / Next Header — це 6 (TCP) або 17 (UDP); в IPv6 з розширеннями воно</text>
<text x="414.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">НЕ дорівнює полю Next Header самого заголовка IPv6.</text>
<text x="414.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="middle" font-style="italic">Ці байти НІКОЛИ не йдуть у дріт — їх складають однаково на обох кінцях лише щоб згодувати в суму</text>
