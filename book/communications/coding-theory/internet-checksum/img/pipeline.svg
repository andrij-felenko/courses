<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">приймач складає ВСІ слова разом із контрольною сумою → 0xFFFF</text>
<text x="380.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">0xFFFF — це «−0», тобто нуль в оберненому коді: пакет цілий</text>
