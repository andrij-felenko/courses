<text x="42.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">16-бітні слова (поля заголовка IPv4; поле суми занулене)</text>
<rect x="211.1" y="155.8" width="337.8" height="32.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="380.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">32-бітний акумулятор: складаємо всі слова</tspan></text>
