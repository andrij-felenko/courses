<rect x="55.5" y="444.2" width="749.0" height="51.6" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="430.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">суцільна — точне  L₁ ⊞ L₂ = 2·atanh( tanh(L₁/2)·tanh(L₂/2) )     ·     пунктир — min-sum = min(|L₁|, |L₂|)</tspan><tspan x="430.0" dy="15.6">точна крива ЗАВЖДИ нижча: min-sum перебільшує впевненість, і тим більше, чим ближчі входи</tspan></text>
