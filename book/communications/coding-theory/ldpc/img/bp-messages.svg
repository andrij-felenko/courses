<text x="640.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">b₁</text>
<circle cx="750.0" cy="178.0" r="19.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="750.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">b₂</text>
<circle cx="860.0" cy="178.0" r="19.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="860.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">b₃</text>
<text x="640.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">адресат</text>
<rect x="726.0" y="296.0" width="48.0" height="48.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.6"/>
<text x="750.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">c</text>
<text x="750.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">перевірка знає лише одне:</text>
<text x="750.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">b₁ ⊕ b₂ ⊕ b₃ = 0</text>
<text x="596.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">✗</text>
<text x="596.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">те саме</text>
<text x="596.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">правило</text>
<rect x="587.9" y="468.1" width="324.2" height="55.9" rx="6" fill="#f1f5ff" stroke="#2457d6" stroke-width="2.0"/><text x="750.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">L(c → b₁) = L(b₂→c) ⊞ L(b₃→c)</tspan><tspan x="750.0" dy="16.9">внесок самого b₁ у добуток НЕ входить</tspan></text>
<text x="500.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">одне правило на обидва боки: у відповідь вузлові вкладай лише те, що дізнався ПОЗА ним — інакше він почує власне відлуння</text>
