<text x="250.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">b</text>
<line x1="250.0" y1="412.0" x2="250.0" y2="356.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="250.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">L_кан(b)  — те, що сказав канал</text>
<text x="96.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">✗</text>
<text x="96.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">почуте</text>
<text x="96.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">від c₁ —</text>
<text x="96.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">не назад</text>
<rect x="75.8" y="468.1" width="348.4" height="55.9" rx="6" fill="#f2fbf5" stroke="#27ae60" stroke-width="2.0"/><text x="250.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">L(b → c₁) = L_кан(b) + M(c₂→b) + M(c₃→b)</tspan><tspan x="250.0" dy="16.9">внесок самого c₁ у суму НЕ входить</tspan></text>
<text x="750.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">вузол-перевірка: ⊞ усіх, крім адресата</text>
