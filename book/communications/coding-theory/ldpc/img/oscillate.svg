<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли декодер зациклюється</text>
<rect x="190.0" y="53.6" width="520.0" height="52.8" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="450.0" y="76.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">код на 12 бітів: помилки в b1 і b9 сидять в одній перевірці c5 —</tspan><tspan x="450.0" dy="16.2">вона їх взаємно гасить і мовчить, тож звинуватити нікого</tspan></text>
<rect x="193.9" y="153.6" width="512.2" height="52.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="450.0" y="176.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">w = 0100 0000 0100     синдром = 1001 0000</tspan><tspan x="450.0" dy="16.2">порушені c0, c3 · найбільший рахунок = 1 · нічия на шести бітах</tspan></text>
<rect x="228.8" y="313.6" width="442.5" height="52.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="450.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">w = 1100 0000 0100     синдром = 0001 1000</tspan><tspan x="450.0" dy="16.2">порушені c3, c4 · найбільший рахунок = 1 · знову нічия</tspan></text>
<line x1="380.0" y1="222.0" x2="380.0" y2="298.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="392.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">перевертає b0</text>
<line x1="520.0" y1="298.0" x2="520.0" y2="222.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="532.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">перевертає b0 назад</text>
<rect x="162.9" y="423.6" width="574.2" height="52.8" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="450.0" y="446.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">жодного прогресу: стан повертається на себе — цикл із періодом 2, вічно</tspan><tspan x="450.0" dy="16.2">єдиний вихід — жорсткий ліміт ітерацій</tspan></text>
</svg>