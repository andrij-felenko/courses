<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біт парності: один зайвий біт робить кількість одиниць парною</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">парність = XOR усіх бітів даних; додаємо його — і одиниць стає парне число</text>
<text x="136.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">дані</text>
<rect x="150.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="167.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="190.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="207.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="230.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="247.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="270.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="287.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="310.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="327.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text><rect x="350.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="367.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1</text><rect x="390.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/><text x="407.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<rect x="450.0" y="100.0" width="34.0" height="34.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.6"/>
<text x="467.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="467.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">P</text>
<text x="494.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">= біт парності</text>
<text x="136.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">лічимо</text>
<text x="150.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">одиниць у даних = 5 (непарно)</text>
<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">щоб разом стало ПАРНО, ставимо P = 1</text>
<text x="150.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">тепер одиниць = 6 — парно (even parity)</text>
<line x1="60.0" y1="300.0" x2="700.0" y2="300.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="60.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Приймач рахує одиниці в усіх 8 бітах:</text>
<text x="80.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">сума парна  → помилки (однієї) не було</text>
<text x="80.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">сума непарна → один біт перевернувся — кадр битий</text>
<text x="80.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">Самого P досить, щоб ПОБАЧИТИ помилку, але не щоб знати, ДЕ вона.</text>
</svg>