<text x="390.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">будувати циклічний код = розкласти xⁿ−1 і взяти добуток частини множників за g(x)</text>
