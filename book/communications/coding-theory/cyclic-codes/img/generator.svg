<text x="434.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">обираємо за твірний g(x)</text>
<line x1="434.0" y1="128.0" x2="434.0" y2="176.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
