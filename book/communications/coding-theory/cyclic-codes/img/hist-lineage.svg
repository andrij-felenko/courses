<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що відчинив погляд «код = ідеал»</text>
<rect x="240.0" y="42.0" width="640.0" height="100.0" rx="6" fill="#d7f0e0" stroke="#27ae60" stroke-width="2.6"/><text x="560.0" y="78.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Пренж, 1957 · Дослідницький центр ВПС США (AFCRC)</tspan><tspan x="560.0" dy="18.9">циклічний код = ІДЕАЛ у кільці GF(2)[x]/(xⁿ−1),</tspan><tspan x="560.0" dy="18.9">заданий одним дільником g(x) многочлена xⁿ−1</tspan></text>
<text x="560.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">той самий алгебраїчний ключ відчинив одразу три робочі родини:</text>
<rect x="40.0" y="236.0" width="320.0" height="122.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="200.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">CRC</tspan><tspan x="200.0" dy="17.6">g(x) лише ВИЯВЛЯЄ збій;</tspan><tspan x="200.0" dy="17.6">кілька вентилів XOR</tspan><tspan x="200.0" dy="17.6">на повній швидкості лінії</tspan></text>
<line x1="560.0" y1="182.0" x2="200.0" y2="230.0" stroke="#2457d6" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="400.0" y="236.0" width="320.0" height="122.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">BCH — Окенгем 1959,</tspan><tspan x="560.0" dy="17.6">Бозе–Рей-Чоудхурі 1960</tspan><tspan x="560.0" dy="17.6">корені g у GF(2ᵐ)</tspan><tspan x="560.0" dy="17.6">→ гарантована відстань</tspan></text>
<line x1="560.0" y1="182.0" x2="560.0" y2="230.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<rect x="760.0" y="236.0" width="320.0" height="122.0" rx="6" fill="#f6f4ec" stroke="#b7791f" stroke-width="2.0"/><text x="920.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Рід–Соломон, 1960</tspan><tspan x="920.0" dy="17.6">Рід і Соломон · MIT</tspan><tspan x="920.0" dy="17.6">цілі символи в GF(2ᵐ)</tspan><tspan x="920.0" dy="17.6">CD, QR-коди, «Вояджер»</tspan></text>
<line x1="560.0" y1="182.0" x2="920.0" y2="230.0" stroke="#b7791f" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="560.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">жодна з трьох — не вдалий здогад: усі три СПРОЄКТОВАНО з алгебри поля й многочленів</text>
</svg>