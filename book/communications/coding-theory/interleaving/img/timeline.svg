<text x="550.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ramsey і Forney довели її найдешевшу форму — а компакт-диск за десять років виніс її в кожну вітальню.</text>
