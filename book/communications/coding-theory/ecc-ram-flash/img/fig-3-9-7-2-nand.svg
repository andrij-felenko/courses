<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
<rect width="880" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Flash NAND: кожна сторінка має «запасну» зону під сильніший код (BCH)</text>
<text x="440.0" y="55.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">комірки NAND зношуються й течуть — тому ECC тут не розкіш, а умова роботи</text>
<rect x="70.0" y="100.0" width="540.0" height="60.0" rx="6" fill="#eaf0ff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="340.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">дані сторінки  (напр. 2048 байт)</text>
<rect x="610.0" y="100.0" width="200.0" height="60.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.8"/>
<text x="710.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">spare-зона</text>
<text x="710.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="normal" font-style="normal">(ECC + службове)</text>
<text x="70.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">одна фізична сторінка NAND</text>
<text x="70.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Що більше циклів стирання — то більше бітів «пливе», то сильніший код потрібен:</text>
<rect x="90.0" y="230.0" width="220.0" height="70.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="200.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">свіжа NAND</text>
<text x="200.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1–4 биті/сектор</text>
<line x1="314.0" y1="265.0" x2="336.0" y2="265.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="340.0" y="230.0" width="220.0" height="70.0" rx="8" fill="#fff" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">середина ресурсу</text>
<text x="450.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">8 бітів/сектор</text>
<line x1="564.0" y1="265.0" x2="586.0" y2="265.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="590.0" y="230.0" width="220.0" height="70.0" rx="8" fill="#fff" stroke="#c0271e" stroke-width="1.8"/>
<text x="700.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">під кінець ресурсу</text>
<text x="700.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">24–40+ бітів/сектор</text>
<text x="440.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому контролер NAND рахує BCH/LDPC на десятки бітів. «Зношений» накопичувач — це той, де код уже не встигає за дефектами.</text>
</svg>
