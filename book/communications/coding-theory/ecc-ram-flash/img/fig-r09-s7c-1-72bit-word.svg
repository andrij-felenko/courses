<rect x="60.0" y="220.0" width="840.0" height="52.0" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="480.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">64 біти даних  +  8 біт контролю  =  72-бітне слово, яке контролер читає й перевіряє за один такт</text>
<text x="60.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Що дають ці 8 додаткових біт — код SECDED:</text>
<rect x="60.0" y="298.0" width="266.7" height="118.0" rx="10" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="193.3" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Один біт зіпсувався</text>
<line x1="74.0" y1="334.0" x2="312.7" y2="334.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="74.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">синдром указує НА ЯКИЙ —</text>
<text x="74.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">контролер мовчки виправляє,</text>
<text x="74.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">процесор бачить чисті дані</text>
<rect x="346.7" y="298.0" width="266.7" height="118.0" rx="10" fill="#faf3e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="480.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Два біти зіпсувалися</text>
<line x1="360.7" y1="334.0" x2="599.3" y2="334.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<text x="360.7" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">синдром каже «помилка є,</text>
<text x="360.7" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">одну не виправити» — це</text>
<text x="360.7" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">видима подія, не тиха втрата</text>
<rect x="633.3" y="298.0" width="266.7" height="118.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="766.7" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">SECDED розшифровується як</text>
<line x1="647.3" y1="334.0" x2="886.0" y2="334.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="647.3" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Single Error Correct,</text>
<text x="647.3" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Double Error Detect:</text>
<text x="647.3" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1 — лагодимо, 2 — помічаємо</text>
</svg>
