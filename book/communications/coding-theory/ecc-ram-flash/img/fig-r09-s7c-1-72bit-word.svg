<text x="60.0" y="76.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Модуль зблизька — дев'ять однакових чіпів DRAM по 8 ліній даних кожен:</text>
