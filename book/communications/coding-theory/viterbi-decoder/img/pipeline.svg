<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія декодера: три блоки й петля, що впирається в межу швидкості</text>
<defs><marker id="arrowRED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="arrowGRN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker></defs>
<text x="96.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">м'які відліки</text>
<text x="96.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">r₀ r₁ … з демодулятора</text>
<line x1="70.0" y1="284.0" x2="149.0" y2="284.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="153.0" y="198.0" width="210.0" height="128.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/><text x="258.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="258.0" dy="0.0">Блок метрик гілок</tspan><tspan x="258.0" dy="15.6">(BMU)</tspan><tspan x="258.0" dy="15.6"></tspan><tspan x="258.0" dy="15.6">для кожного ребра ґратки —</tspan><tspan x="258.0" dy="15.6">відстань прийнятого</tspan><tspan x="258.0" dy="15.6">до мітки ребра</tspan></text>
<rect x="485.0" y="198.0" width="210.0" height="128.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/><text x="590.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Додати-порівняти-</tspan><tspan x="590.0" dy="18.2">вибрати (ACSU)</tspan><tspan x="590.0" dy="18.2"></tspan><tspan x="590.0" dy="18.2">оновити метрику стану,</tspan><tspan x="590.0" dy="18.2">лишити один</tspan><tspan x="590.0" dy="18.2">вцілілий шлях</tspan></text>
<rect x="817.0" y="198.0" width="210.0" height="128.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/><text x="922.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="922.0" dy="0.0">Пам'ять вцілілих</tspan><tspan x="922.0" dy="18.2">(SMU)</tspan><tspan x="922.0" dy="18.2"></tspan><tspan x="922.0" dy="18.2">вікно глибини D,</tspan><tspan x="922.0" dy="18.2">простеження назад</tspan><tspan x="922.0" dy="18.2">до злиття шляхів</tspan></text>
<line x1="365.0" y1="262.0" x2="483.0" y2="262.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="424.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">метрики</text>
<text x="424.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">гілок λ</text>
<line x1="697.0" y1="262.0" x2="815.0" y2="262.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="756.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">біти рішень</text>
<text x="756.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(вказівники)</text>
<line x1="1029.0" y1="284.0" x2="1140.0" y2="284.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1136.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">відновлені</text>
<text x="1136.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">біти</text>
<path d="M722.0 196.0 C 722.0 76.0, 458.0 76.0, 458.0 196.0" fill="none" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrowRED)"/>
<text x="590.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">метрики станів ← такт t−1</text>
<text x="590.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">замкнена петля — межа швидкості</text>
<rect x="247.5" y="421.5" width="684.9" height="37.0" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="1.8"/><text x="590.0" y="444.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">BMU і SMU конвеєризуються вільно; уся межа швидкості — в одній замкненій ланці ACS</tspan></text>
</svg>