<text x="698.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="698.5" dy="0.0">корені σ:</tspan><tspan x="698.5" dy="12.6">перебір Ч'єна</tspan></text>
