<text x="580.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">синдроми залежать лише від помилки — тому декодер знаходить і лагодить до t збоїв</text>
