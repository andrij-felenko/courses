<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія далекого космосу: борт застигає в мить запуску, Земля — ні</text>
<line x1="70.0" y1="262.0" x2="1150.0" y2="262.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="76.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">ЗЕМЛЯ: теорію й залізо переробляють далі</text>
<rect x="7.0" y="90.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="95.0" y="110.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="95.0" dy="0.0">1960</tspan><tspan x="95.0" dy="15.0">Рід і Соломон</tspan><tspan x="95.0" dy="15.0">друкують код</tspan></text>
<line x1="95.0" y1="152.0" x2="95.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="95.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="112.0" y="172.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="200.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="200.0" dy="0.0">1967</tspan><tspan x="200.0" dy="15.0">Вітербі: алгоритм,</tspan><tspan x="200.0" dy="15.0">автор — «непрактично»</tspan></text>
<line x1="200.0" y1="234.0" x2="200.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="200.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="217.0" y="90.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="305.0" y="110.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="305.0" dy="0.0">1971</tspan><tspan x="305.0" dy="15.0">воркшоп:</tspan><tspan x="305.0" dy="15.0">«кодування померло»</tspan></text>
<line x1="305.0" y1="152.0" x2="305.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="305.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="472.0" y="90.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="560.0" y="110.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="560.0" dy="0.0">1982</tspan><tspan x="560.0" dy="15.0">Берлекамп чистить</tspan><tspan x="560.0" dy="15.0">код → стандарт CCSDS</tspan></text>
<line x1="560.0" y1="152.0" x2="560.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="560.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="612.0" y="172.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="700.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="700.0" dy="0.0">1986</tspan><tspan x="700.0" dy="15.0">наземний декодер</tspan><tspan x="700.0" dy="15.0">RS нарешті готовий</tspan></text>
<line x1="700.0" y1="234.0" x2="700.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="700.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="752.0" y="90.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="840.0" y="110.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="840.0" dy="0.0">1990-і</tspan><tspan x="840.0" dy="15.0">Big Viterbi Decoder:</tspan><tspan x="840.0" dy="15.0">8192 ланок</tspan></text>
<line x1="840.0" y1="152.0" x2="840.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="840.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="882.0" y="172.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="970.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="970.0" dy="0.0">2000-і</tspan><tspan x="970.0" dy="15.0">турбокоди</tspan><tspan x="970.0" dy="15.0">й LDPC</tspan></text>
<line x1="970.0" y1="234.0" x2="970.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="970.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="1007.0" y="90.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="1095.0" y="110.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="1095.0" dy="0.0">2021</tspan><tspan x="1095.0" dy="15.0">аматор перечитує</tspan><tspan x="1095.0" dy="15.0">борт 1977-го</tspan></text>
<line x1="1095.0" y1="152.0" x2="1095.0" y2="256.0" stroke="#2457d6" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="1095.0" cy="262.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<line x1="410.0" y1="56.0" x2="410.0" y2="478.0" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="9 6"/>
<circle cx="410.0" cy="262.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="422.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1977 — ЗАПУСК: остання мить, коли ще можна щось припаяти</text>
<rect x="410.0" y="334.0" width="740.0" height="44.0" rx="8" fill="#8a5a0018" stroke="#8a5a00" stroke-width="2.2"/>
<text x="30.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5a00" text-anchor="start" font-weight="700">БОРТ: уже не змінити</text>
<text x="780.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5a00" text-anchor="middle" font-weight="700">те, що припаяли 1977-го, — і так до сьогодні, без жодної зміни  →</text>
<rect x="420.0" y="398.0" width="230.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a5a00" stroke-width="1.8"/><text x="535.0" y="419.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle"><tspan x="535.0" dy="0.0">внутрішній: згортковий</tspan><tspan x="535.0" dy="15.0">K = 7, r = 1/2</tspan></text>
<rect x="660.0" y="398.0" width="230.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a5a00" stroke-width="1.8"/><text x="775.0" y="419.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle"><tspan x="775.0" dy="0.0">зовнішній: Ґолей (24,12)</tspan><tspan x="775.0" dy="15.0">100 % надлишку</tspan></text>
<rect x="900.0" y="398.0" width="250.0" height="50.0" rx="6" fill="#ffffff" stroke="#8a5a00" stroke-width="1.8"/><text x="1025.0" y="419.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a5a00" text-anchor="middle"><tspan x="1025.0" dy="0.0">кодер RS(255,223)</tspan><tspan x="1025.0" dy="15.0">вимкнений — чекає на Землю</tspan></text>
<line x1="700.0" y1="272.0" x2="700.0" y2="328.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="712.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1986: єдине, що ще можна змінити, — команда «увімкни RS»</text>
<text x="590.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кодер летить і застигає назавжди; декодер лишається на Землі й може рости десятиліттями. Каскад ділиться саме по цьому шву.</text>
</svg>