<text x="618.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">(на log-log степенева — це пряма)</text>
<line x1="186.0" y1="311.0" x2="206.0" y2="311.0" stroke="#c0392b" stroke-width="3.2"/>
<text x="214.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">один довгий код + оптимальний декодер:</text>
<text x="214.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Pr(e) ≈ G^(−E/R) — від ціни лише СТЕПЕНЕВА</text>
<line x1="186.0" y1="366.0" x2="206.0" y2="366.0" stroke="#27ae60" stroke-width="3.2"/>
<text x="214.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">каскад RS-ланок:  G ≈ L³</text>
<text x="214.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">Pr(e) ≈ p₀^(L^(1−Δ)) — від ціни майже ВИБУХОВА</text>
<text x="470.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обіцянка Шеннона вибухова від ДОВЖИНИ. Але платять не за довжину — платять за декодер.</text>
