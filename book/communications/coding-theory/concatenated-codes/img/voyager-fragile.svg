<text x="250.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">кожен піксель складається з попереднього — тож похибка їде далі й далі, до самого краю.</text>
<text x="500.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стиснення прибирає з даних природний надлишок — і кожен уцілілий біт стає незамінним. Звідси й вимога BER 10⁻⁶, а з нею — Рід–Соломон.</text>
