<text x="250.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">перевернувся один біт → зіпсована одна крапка. На знімку 800×800 її не видно.</text>
<text x="250.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Саме тому Юпітерові й Сатурнові вистачало BER 5·10⁻³.</text>
