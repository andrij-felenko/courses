<text x="250.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">той самий один біт → «+1» стало «+9». Разів у 2.5 менше бітів у канал — заради цього все й робилося.</text>
