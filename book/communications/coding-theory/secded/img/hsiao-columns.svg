<text x="513.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">УСІ НЕПАРНІ СТОВПЦІ ВИСОТИ 8</text>
<text x="513.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">8 + 56 + 56 + 8 = 128 = 2⁷ — вибирати є з чого</text>
