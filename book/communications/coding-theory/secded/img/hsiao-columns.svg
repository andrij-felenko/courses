<text x="762.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="700">—</text>
<rect x="190.0" y="300.0" width="646.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/><text x="513.0" y="336.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="513.0" dy="0.0">8 + 56 + 8 = 72 стовпці   ·   1·8 + 3·56 + 5·8 = 216 одиниць   ·   216 / 8 = 27 на рядок</tspan></text>
<text x="450.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">жоден стовпець не нульовий і не повторюється → d = 3; усі непарної ваги → d = 4</text>
<text x="450.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">сума непарного числа непарних стовпців — завжди непарна, тож трьом нізащо не дати нуль</text>
