<text x="876.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c77d00" text-anchor="middle" font-weight="700">◄ пʼятий вирок, якого нема у (8,4)</text>
<text x="505.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">У навчальному (8,4) синдром має 3 біти й усі 7 ненульових значень — справжні позиції: третій стовпець порожній.</text>
<text x="505.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">У (72,64) 56 зі 128 синдромів не вказують нікуди. Наївне «data ^= 1 &lt;&lt; (s−1)» тут пише ПОЗА словом.</text>
