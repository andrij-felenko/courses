<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перепис простору: восьмий біт купує місце для чесного «не знаю»</text>
<text x="172.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="172.0" dy="0.0">Геммінг (7,4)</tspan><tspan x="172.0" dy="15.6">усі 2⁷ = 128 слів</tspan></text>
<rect x="186.0" y="118.0" width="35.2" height="48.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="221.2" y="118.0" width="246.4" height="48.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="344.4" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">112 слів — крок 1 від коду</text>
<text x="186.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">16 · (1 + 7) = 128 = 2⁷ — кулі покрили ВЕСЬ простір: вільного слова нема, сказати «не знаю» нічим</text>
<text x="172.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="172.0" dy="0.0">розширений (8,4)</tspan><tspan x="172.0" dy="15.6">усі 2⁸ = 256 слів</tspan></text>
<rect x="186.0" y="232.0" width="35.2" height="48.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="221.2" y="232.0" width="281.6" height="48.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="362.0" y="260.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">128 слів — крок 1 від коду</text>
<rect x="502.8" y="232.0" width="246.4" height="48.0" rx="5" fill="#fdf0dd" stroke="#c77d00" stroke-width="2.0"/>
<text x="626.0" y="260.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c77d00" text-anchor="middle" font-weight="700">112 слів — нічийна земля</text>
<text x="186.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">16 · (1 + 8) = 144 із 256 — восьмий біт подвоїв простір, а кодових слів ті самі 16: 112 лишилися вільні</text>
<rect x="110.0" y="336.0" width="18.0" height="18.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="136.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">16 кодових слів</text>
<rect x="272.6" y="336.0" width="18.0" height="18.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="298.6" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">виправні: крок 1 від коду</text>
<rect x="503.6" y="336.0" width="18.0" height="18.0" rx="4" fill="#fdf0dd" stroke="#c77d00" stroke-width="2.0"/>
<text x="529.6" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">нічийна земля: видно, та не виправно</text>
</svg>