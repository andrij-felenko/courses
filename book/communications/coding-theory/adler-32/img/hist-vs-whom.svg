<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проти кого насправді змагався Adler-32</text>
<rect x="320.0" y="72.0" width="260.0" height="64.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="2.2"/><text x="450.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#caa24a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Adler-32</tspan><tspan x="450.0" dy="19.5">mod 65521 (просте)</tspan></text>
<line x1="370.0" y1="140.0" x2="205.0" y2="218.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="140.0" x2="695.0" y2="218.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="120.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">«я покращував</tspan><tspan x="120.0" dy="16.2">ось це»</tspan></text>
<text x="790.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">«він побив</tspan><tspan x="790.0" dy="16.2">ось це»?</tspan></text>
<rect x="75.0" y="222.0" width="260.0" height="60.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="205.0" y="247.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Флетчер-16</tspan><tspan x="205.0" dy="18.2">mod 255</tspan></text>
<rect x="565.0" y="222.0" width="260.0" height="60.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="695.0" y="247.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Флетчер-32</tspan><tspan x="695.0" dy="18.2">mod 65535</tspan></text>
<text x="205.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">✓ але це 32 біти проти 16 —</tspan><tspan x="205.0" dy="15.6">перемога наперед відома</tspan></text>
<text x="695.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">✗ вимір 2006: у майже всіх</tspan><tspan x="695.0" dy="15.6">випадках кращий Флетчер-32</tspan></text>
<line x1="50.0" y1="366.0" x2="850.0" y2="366.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="450.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просте 65521 перемішує біти краще — але лишає менше «кошиків» під підписи.</text>
<text x="450.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">У більшості випадків утрата кошиків з'їдає виграш від перемішування.</text>
<text x="450.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Сам Марк Адлер 2006 року визнав: Флетчера-32 він тоді просто не знав.</text>
</svg>