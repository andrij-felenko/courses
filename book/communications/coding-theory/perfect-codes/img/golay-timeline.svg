<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="880" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Досконалі коди: хто, коли й у якому порядку</text>
<line x1="150.0" y1="74.0" x2="150.0" y2="812.0" stroke="#dcdcdc" stroke-width="3.0"/>
<text x="130.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1947</text>
<line x1="158.0" y1="100.0" x2="178.0" y2="100.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="68.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Юхані Віртакалліо друкує 729 стовпчиків у «Veikkaaja»</text>
<text x="194.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">фінський журнал тоталізатора; це трійковий код [11, 6, 5] — але цього ще ніхто не знає</text>
<circle cx="150.0" cy="100.0" r="7.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1948</text>
<line x1="158.0" y1="184.0" x2="178.0" y2="184.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="152.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Шеннон наводить код [7, 4] як приклад у §17</text>
<text x="194.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">метод прямо приписано Геммінгові; сам Геммінг ще не опублікувався</text>
<circle cx="150.0" cy="184.0" r="7.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1949</text>
<line x1="158.0" y1="268.0" x2="178.0" y2="268.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="236.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Голей: «Notes on Digital Coding», Proc. IRE 37, с. 657</text>
<text x="194.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">півсторінки: q-ковий Геммінг, перша перевірна матриця, [23, 12, 7], [11, 6, 5] і здогад</text>
<circle cx="150.0" cy="268.0" r="7.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1950</text>
<line x1="158.0" y1="352.0" x2="178.0" y2="352.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="320.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Геммінг нарешті друкує власну статтю</text>
<text x="194.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">патентні застереження затримали публікацію на три роки</text>
<circle cx="150.0" cy="352.0" r="7.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1957</text>
<line x1="158.0" y1="436.0" x2="178.0" y2="436.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="404.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Стюарт Ллойд: «Binary block coding» — теорема Ллойда</text>
<text x="194.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">необхідна умова: корені многочлена Ллойда мусять бути цілими — знаряддя пошуку</text>
<circle cx="150.0" cy="436.0" r="7.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1962</text>
<line x1="158.0" y1="520.0" x2="178.0" y2="520.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="488.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Юрій Васильєв: нелінійні досконалі коди</text>
<text x="194.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">параметри Геммінга, але код не лінійний — отже, параметри не визначають самого коду</text>
<circle cx="150.0" cy="520.0" r="7.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="609.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1970–71</text>
<line x1="158.0" y1="604.0" x2="178.0" y2="604.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="572.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="597.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Як ван Лінт відтинає випадок за випадком</text>
<text x="194.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">над GF(q) немає досконалих кодів на дві й на три помилки</text>
<circle cx="150.0" cy="604.0" r="7.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="693.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">1973</text>
<line x1="158.0" y1="688.0" x2="178.0" y2="688.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="656.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="681.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Аймо Тієтявяйнен закриває питання над скінченними полями</text>
<text x="194.0" y="704.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">незалежно — Віктор Зинов'єв і Володимир Леонтьєв; здогад Голея доведено через 24 роки</text>
<circle cx="150.0" cy="688.0" r="7.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.4"/>
<text x="130.0" y="777.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1991–93</text>
<line x1="158.0" y1="772.0" x2="178.0" y2="772.0" stroke="#dcdcdc" stroke-width="1.6"/>
<rect x="178.0" y="740.0" width="760.0" height="64.0" rx="8" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.3"/>
<text x="194.0" y="765.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Ііро Гонкала й Олександр Барг знаходять Віртакалліо</text>
<text x="194.0" y="788.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">первість фінського гравця виходить на світло через сорок чотири роки</text>
<circle cx="150.0" cy="772.0" r="7.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.4"/>
<text x="490.0" y="848.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">код із журналу тоталізатора випередив наукову статтю; здогад із тієї статті доводили двадцять чотири роки</text>
</svg>