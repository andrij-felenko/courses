<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сімнадцять років: від двох статей 1954-го до знімків Марса</text>
<text x="190.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="700">1954</text>
<text x="590.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="700">1966</text>
<text x="895.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="700">1971</text>
<rect x="55.0" y="118.4" width="270.0" height="63.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="190.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Маллер (Muller)</tspan><tspan x="190.0" dy="15.6">код = таблиця булевої функції</tspan><tspan x="190.0" dy="15.6">EC-3, вересень 1954</tspan></text>
<rect x="55.0" y="208.4" width="270.0" height="63.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Рід (Reed)</tspan><tspan x="190.0" dy="15.6">декодер: голосування більшістю</tspan><tspan x="190.0" dy="15.6">PGIT-4, вересень 1954</tspan></text>
<line x1="325.0" y1="150.0" x2="355.0" y2="195.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="325.0" y1="240.0" x2="355.0" y2="195.0" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="355.0" cy="195.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
