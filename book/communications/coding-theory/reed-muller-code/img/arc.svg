<circle cx="905.0" cy="328.0" r="4.0" fill="#a85526" stroke="none" stroke-width="0.0"/>
<text x="540.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">код (Маллер) + декодер (Рід)  →  швидка машина (Ґрін)  →  різкі знімки Марса</text>
</svg>