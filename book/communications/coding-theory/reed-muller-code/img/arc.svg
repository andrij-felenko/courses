<line x1="358.0" y1="195.0" x2="463.0" y2="195.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="465.0" y="163.4" width="250.0" height="63.2" rx="6" fill="#fff7d6" stroke="#1a1a1a" stroke-width="1.8"/><text x="590.0" y="183.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Ґрін (Green), JPL</tspan><tspan x="590.0" dy="15.6">«зелена машина»:</tspan><tspan x="590.0" dy="15.6">швидке перетв. Адамара</tspan></text>
<line x1="716.0" y1="194.0" x2="770.0" y2="189.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="770.0" y="150.6" width="250.0" height="78.8" rx="6" fill="#f6f4ec" stroke="#b7791f" stroke-width="1.8"/><text x="895.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">«Марінер-9» → орбіта Марса</tspan><tspan x="895.0" dy="15.6">RM(1,5) = [32, 6, 16]</tspan><tspan x="895.0" dy="15.6">виправляє 7 помилок</tspan><tspan x="895.0" dy="15.6">перші чіткі знімки</tspan></text>
