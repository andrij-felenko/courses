<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лема Плоткіна: вага кожної половини дає d = 2^(m−r)</text>
<rect x="48.0" y="66.0" width="382.0" height="328.0" rx="10" fill="#fcfdfe" stroke="#27ae60" stroke-width="1.8"/><text x="239.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Випадок 1:  v = 0</text><rect x="109.0" y="124.0" width="118.0" height="42.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="168.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">u</text><rect x="251.0" y="124.0" width="118.0" height="42.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="310.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">u</text><text x="101.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="end">(</text><text x="377.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="start">)</text><text x="239.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="239.0" dy="0.0">слово ненульове ⇒ u ≠ 0</tspan><tspan x="239.0" dy="21.9">вага = wt(u) + wt(u) = 2·wt(u)</tspan><tspan x="239.0" dy="21.9">wt(u) ≥ d₁   ⇒   вага ≥ 2·d₁</tspan></text><rect x="151.9" y="349.0" width="174.2" height="30.0" rx="6" fill="#fff7d6" stroke="#b7791f" stroke-width="1.5"/><text x="239.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="239.0" dy="0.0">обидві половини рівні</tspan></text>
<rect x="470.0" y="66.0" width="382.0" height="328.0" rx="10" fill="#fcfdfe" stroke="#2457d6" stroke-width="1.8"/><text x="661.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Випадок 2:  v ≠ 0</text><rect x="531.0" y="124.0" width="118.0" height="42.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">u</text><rect x="673.0" y="124.0" width="118.0" height="42.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="732.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">u⊕v</text><text x="523.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="end">(</text><text x="799.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="start">)</text><text x="661.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="661.0" dy="0.0">вага = wt(u) + wt(u⊕v)</tspan><tspan x="661.0" dy="21.9">≥ wt( u ⊕ (u⊕v) ) = wt(v)</tspan><tspan x="661.0" dy="21.9">wt(v) ≥ d₂   ⇒   вага ≥ d₂</tspan></text><rect x="559.0" y="349.0" width="204.0" height="30.0" rx="6" fill="#fff7d6" stroke="#b7791f" stroke-width="1.5"/><text x="661.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="661.0" dy="0.0">нерівність трикутника ваг</tspan></text>
<rect x="81.3" y="417.5" width="737.5" height="57.1" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.2"/><text x="450.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">d(r,m) = min( 2·d₁ , d₂ ),   d₁ = d(r,m−1) = 2^((m−1)−r),   d₂ = d(r−1,m−1) = 2^(m−r)</tspan><tspan x="450.0" dy="17.6">2·d₁ = 2^(m−r) = d₂   —   обидві межі рівні   ⇒   d(r,m) = 2^(m−r)</tspan></text>
</svg>