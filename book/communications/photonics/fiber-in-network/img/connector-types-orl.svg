<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптичні роз'єми UPC (0°) проти APC (8°): механизм пригнічення відбиття ORL</text>
