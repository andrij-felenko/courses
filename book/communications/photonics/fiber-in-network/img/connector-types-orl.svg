<text x="515.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Відбиття згасає в оболонці!</text>
<text x="595.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Світло відбивається під кутом 16°</text>
<text x="595.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">і розсіюється в оболонці волокна</text>
<text x="595.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Загасання відбиття (ORL): ≥ 60..70 дБ</text>
<text x="595.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Сфера: PON, CATV, DWDM магістралі</text>
<rect x="20.0" y="345.0" width="760.0" height="45.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="364.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">У мережах PON та DWDM косий зріз APC є обов'язковим: він не дає потужному паразитному відбиттю</tspan><tspan x="400.0" dy="13.7">повертатися в лазер OLT і спотворювати вимірювання рефлектометра OTDR.</tspan></text>
