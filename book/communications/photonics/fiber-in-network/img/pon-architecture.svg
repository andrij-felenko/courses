<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура пасивної оптичної мережі (PON): OLT, сплітер та ONU</text>
<rect x="20.0" y="50.0" width="190.0" height="290.0" rx="8" fill="#f4f6f8" stroke="#3498db" stroke-width="1.5"/>
<text x="115.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3498db" text-anchor="middle" font-weight="700">Центральна станція (CO)</text>
<rect x="35.0" y="95.0" width="160.0" height="110.0" rx="6" fill="#ebf5fb" stroke="#3498db" stroke-width="1.2"/>
<text x="115.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#3498db" text-anchor="middle" font-weight="700">OLT</text>
<text x="115.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Optical Line Terminal</text>
<text x="115.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">TX: 1490 / 1577 нм</text>
<text x="115.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle" font-weight="700">RX: 1310 / 1270 нм</text>
<text x="115.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">WDM-фільтр OLT</text>
<text x="115.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розділення TX/RX</text>
<text x="115.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">на одній нитці</text>
<text x="115.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Шина Ethernet 10G/100G</text>
<line x1="195.0" y1="150.0" x2="360.0" y2="150.0" stroke="#3498db" stroke-width="3.0"/>
<line x1="210.0" y1="140.0" x2="270.0" y2="140.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Downstream (1490 нм)</text>
<line x1="270.0" y1="160.0" x2="210.0" y2="160.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle" font-weight="700">Upstream TDMA (1310 нм)</text>
<text x="275.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Магістральний кабель (до 20 км)</text>
<rect x="360.0" y="100.0" width="100.0" height="180.0" rx="8" fill="#fdebd0" stroke="#d35400" stroke-width="1.8"/>
<text x="410.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Пасивний</text>
<text x="410.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">сплітер 1:32</text>
<text x="410.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Втрати:</text>
<text x="410.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">10·log2(32) ≈ 15 дБ</text>
<text x="410.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Без живлення!</text>
<text x="410.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(шафа в дворі)</text>
<line x1="460.0" y1="120.0" x2="620.0" y2="90.0" stroke="#3498db" stroke-width="2.0"/>
<rect x="620.0" y="65.0" width="180.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="710.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ONU 1 (Будинок A)</text>
<text x="710.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пакетний фільтр MAC</text>
<line x1="460.0" y1="150.0" x2="620.0" y2="150.0" stroke="#3498db" stroke-width="2.0"/>
<rect x="620.0" y="125.0" width="180.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="710.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ONU 2 (Квартира 12)</text>
<text x="710.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="middle">Часовий слот T2 (Upstream)</text>
<line x1="460.0" y1="190.0" x2="540.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="550.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">• • •  до 64 абонентів</text>
<line x1="460.0" y1="230.0" x2="620.0" y2="270.0" stroke="#3498db" stroke-width="2.0"/>
<rect x="620.0" y="245.0" width="180.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="710.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ONU N (Квартира 64)</text>
<text x="710.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="middle">Часовий слот TN (Upstream)</text>
<rect x="20.0" y="350.0" width="780.0" height="50.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="371.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вхідне світло від OLT розщеплюється пасивним призматичним/планарним сплітером без електрики.</tspan><tspan x="410.0" dy="13.7">Downstream мовить на всі ONU безперервно, Upstream передається пакетами спалахів (Burst Mode) у виділених слотах.</tspan></text>
</svg>