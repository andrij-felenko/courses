<rect x="250.0" y="300.0" width="60.0" height="46.0" rx="5" fill="#eef2f7" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="327.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">x₀</tspan></text>
