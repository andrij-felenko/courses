<rect x="430.0" y="300.0" width="60.0" height="46.0" rx="5" fill="#eef2f7" stroke="#2457d6" stroke-width="1.6"/><text x="460.0" y="327.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">x₃</tspan></text>
<text x="370.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">тіло символу (N = 4)</text>
<rect x="186.0" y="294.0" width="128.0" height="58.0" rx="8" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="250.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">вікно h=[1, 0.5] для y[0]</text>
<path d="M460.0,296.0 C 460.0,236.0 220.0,236.0 220.0,296.0" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">копія хвоста → у префікс</text>
<text x="530.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">y[0] = 1·x₀ + 0.5·x₃</text>
<text x="530.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">= 1·x₀ + 0.5·x[(0−1) mod 4]</text>
<text x="530.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">→ кільцева згортка, Yₖ = Hₖ·Xₖ</text>
<text x="500.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Префікс підставляє власний хвіст символу там, де згортка сягнула б у попередній символ — і лінійна згортка стає кільцевою.</text>
