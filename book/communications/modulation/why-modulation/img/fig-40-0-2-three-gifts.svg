<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три винаходи однієї людини, на яких стоїть усе радіо</text>
<text x="460.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Армстронг подарував світу підсилення, архітектуру приймача й чистий звук</text>
<rect x="40.0" y="86.0" width="270.0" height="230.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="175.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1912</text>
<text x="175.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Регенерація</text>
<text x="175.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Позитивний зворотний зв'язок:</text>
<text x="175.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лампа підсилює в тисячі разів</text>
<text x="175.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— і сама стає генератором</text>
<text x="175.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">хвиль.</text>
<line x1="64.0" y1="286.0" x2="286.0" y2="286.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="175.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">вперше радіо стало гучним і дешевим</text>
<rect x="330.0" y="86.0" width="270.0" height="230.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="465.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1918</text>
<text x="465.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Супергетеродин</text>
<text x="465.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Зсув будь-якої частоти на одну</text>
<text x="465.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зручну проміжну (ПЧ), де її</text>
<text x="465.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">легко підсилити й</text>
<text x="465.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">відфільтрувати.</text>
<line x1="354.0" y1="286.0" x2="576.0" y2="286.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="465.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">архітектура майже КОЖНОГО приймача досі</text>
<rect x="620.0" y="86.0" width="270.0" height="230.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="755.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1933</text>
<text x="755.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Широкосмугова FM</text>
<text x="755.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Інформація — у частоті, не в</text>
<text x="755.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">амплітуді. Чистий, безшумний</text>
<text x="755.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">звук, про який мріяли.</text>
<line x1="644.0" y1="286.0" x2="866.0" y2="286.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="755.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">її трагічна доля — серце цієї історії</text>
</svg>
