<line x1="620.0" y1="230.0" x2="620.0" y2="178.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="650.0" y1="230.0" x2="650.0" y2="160.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="680.0" y1="230.0" x2="680.0" y2="178.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="710.0" y1="230.0" x2="710.0" y2="178.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="740.0" y1="230.0" x2="740.0" y2="198.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="560.0" y1="140.0" x2="740.0" y2="140.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<text x="650.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">широко → тихо</text>
<text x="650.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">багато смуги, зате чисто</text>
<rect x="60.0" y="278.0" width="780.0" height="78.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="450.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">FM-мовлення: Δf = 75 кГц, звук до fₘ = 15 кГц → B ≈ 2·(75+15) = 180 кГц (канал 200 кГц).</text>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Порівняй: AM-канал — лише 10 кГц. FM займає у ~20 разів ширше — і цим купує свою чистоту.</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий обмін смуга↔якість Шеннон зробить точним законом — про межу йтиметься у §40.4.</text>
</svg>
