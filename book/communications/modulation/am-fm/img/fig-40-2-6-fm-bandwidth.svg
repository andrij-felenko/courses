<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ціна тиші — смуга: правило Карсона</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">B ≈ 2·(Δf + fₘ): що більша девіація Δf, то ширша смуга й глибша завадостійкість</text>
<text x="230.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">вузька FM (мала Δf)</text>
<line x1="80.0" y1="230.0" x2="400.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="200.0" y1="230.0" x2="200.0" y2="186.0" stroke="#b08900" stroke-width="3" stroke-linecap="round"/>
<line x1="230.0" y1="230.0" x2="230.0" y2="160.0" stroke="#b08900" stroke-width="3" stroke-linecap="round"/>
<line x1="260.0" y1="230.0" x2="260.0" y2="186.0" stroke="#b08900" stroke-width="3" stroke-linecap="round"/>
<line x1="200.0" y1="140.0" x2="260.0" y2="140.0" stroke="#1f8a3b" stroke-width="1.4" stroke-linecap="round"/>
<text x="230.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вузько</text>
<text x="230.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тісно, але шумніше</text>
<text x="650.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">широка FM (велика Δf)</text>
<line x1="480.0" y1="230.0" x2="820.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="560.0" y1="230.0" x2="560.0" y2="198.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
