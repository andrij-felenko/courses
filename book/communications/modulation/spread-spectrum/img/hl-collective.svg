<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чесно: що належить їм, а що — ні</text>
<rect x="40.0" y="78.0" width="680.0" height="96.0" rx="10" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="58.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Їхня справжня заслуга</text>
<text x="58.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Конкретна, запатентована реалізація стрибків частоти (синхронізація піанолою, 88 частот)</text>
<text x="58.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">для незаглушуваної торпеди — сміливо й на десятиліття випереджаючи час.</text>
<rect x="40.0" y="184.0" width="680.0" height="96.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="1.8"/>
<text x="58.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b08900" text-anchor="start" font-weight="700">Чого вони не робили</text>
<text x="58.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Самі стрибки частоти існували й раніше: патент Тесли (1903), Ценнек і Телефункен.</text>
<text x="58.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Сучасний розширений спектр інженери розвинули значною мірою незалежно, у 1950–60-х.</text>
<rect x="40.0" y="290.0" width="680.0" height="96.0" rx="10" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="58.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Тож гасло «винайшла Wi-Fi»</text>
<text x="58.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">перебільшення: прямої лінії «її патент → Wi-Fi» немає.</text>
<text x="58.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Правда чесніша — вона видатна попередниця, чий внесок несправедливо стерли.</text>
</svg>