<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що лишилось: ідея — всюди, а урок — подвійний</text>
<rect x="30.0" y="78.0" width="230.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#2457d6" stroke-width="2.0"/>
<text x="145.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#1a1a1a" text-anchor="middle">📡</text>
<text x="145.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ідея — у кишені</text>
<text x="145.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Стрибки частоти —</text>
<text x="145.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">серце Bluetooth; родинні</text>
<text x="145.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">техніки — у Wi-Fi і GPS.</text>
<rect x="275.0" y="78.0" width="230.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2.0"/>
<text x="390.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#1a1a1a" text-anchor="middle">⚖️</text>
<text x="390.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">Кредит — чесно</text>
<text x="390.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Видатна попередниця, чий</text>
<text x="390.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">внесок стерли; не «винайшла</text>
<text x="390.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">все», але й не «ніщо».</text>
<rect x="520.0" y="78.0" width="230.0" height="200.0" rx="12" fill="#fbfbfb" stroke="#27ae60" stroke-width="2.0"/>
<text x="635.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="23" fill="#1a1a1a" text-anchor="middle">👤</text>
<text x="635.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Урок — про упередження</text>
<text x="635.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Талант не питає про</text>
<text x="635.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зовнішність чи фах:</text>
<text x="635.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">винахідником буває й кінозірка.</text>
</svg>