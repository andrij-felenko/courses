<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диво приймача: код збирає сигнал, а заваду — розмазує</text>
<line x1="80.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="700.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">частота</text>
<rect x="140.0" y="224.0" width="230.0" height="26.0" rx="0" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="255.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">сигнал (розмазаний)</text>
<line x1="290.0" y1="250.0" x2="290.0" y2="130.0" stroke="#c0392b" stroke-width="4.0"/>
<text x="290.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">вузька завада</text>
<line x1="400.0" y1="175.0" x2="470.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="435.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">× код</text>
<line x1="560.0" y1="250.0" x2="560.0" y2="120.0" stroke="#27ae60" stroke-width="5.0"/>
<text x="560.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">сигнал зібрано</text>
<rect x="490.0" y="232.0" width="200.0" height="18.0" rx="0" fill="#fdecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="590.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">завада розмазана</text>
<rect x="60.0" y="300.0" width="640.0" height="26.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="316.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Виграш обробки піднімає сигнал над завадою — у стільки разів, скільки чипів.</tspan></text>
<text x="380.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Саме так GPS приймається, хоч його сигнал слабший за шум: код витягує його з-під шуму.</text>
</svg>