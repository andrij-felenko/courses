<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640">
<rect width="940" height="640" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="470.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Геді Ламарр: кінозірка, що запатентувала стрибки частоти</text>
<text x="470.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">геніальна ідея 1942 року, відкинута флотом і забута на півстоліття</text>
<line x1="280.0" y1="92.0" x2="280.0" y2="616.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="280.0" cy="116.0" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="258.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1914</text>
<text x="306.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Народилася у Відні</text>
<text x="306.0" y="133.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Гедвіґа Кіслер, з єврейської родини в Австрії</text>
<circle cx="280.0" cy="168.9" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="258.0" y="173.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1933</text>
<text x="306.0" y="166.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Кіно + шлюб з Мандлем</text>
<text x="306.0" y="185.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">На ділових зустрічах чоловіка-зброяра вбирає знання про озброєння</text>
<circle cx="280.0" cy="221.8" r="7.0" fill="#fff" stroke="#1f47b5" stroke-width="2.6"/>
<text x="258.0" y="226.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1937</text>
<text x="306.0" y="219.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Втеча до Голлівуду</text>
<text x="306.0" y="238.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Тікає від чоловіка й нацистської Європи; стає зіркою MGM</text>
<circle cx="280.0" cy="274.7" r="9.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="280.0" cy="274.7" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="258.0" y="279.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1940</text>
<text x="306.0" y="272.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Зустріч з Антайлом</text>
<text x="306.0" y="291.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">З композитором-авангардистом задумує незаглушуване радіо</text>
<circle cx="280.0" cy="327.6" r="9.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="280.0" cy="327.6" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="258.0" y="332.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1942</text>
<text x="306.0" y="325.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Патент 2 292 387</text>
<text x="306.0" y="344.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">«Secret Communication System» — стрибки по 88 частотах</text>
<rect x="272.0" y="372.4" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="258.0" y="385.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1942</text>
<text x="306.0" y="378.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Флот відкидає</text>
<text x="306.0" y="397.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">«Завелике для торпеди» — винахід кладуть під сукно</text>
<rect x="272.0" y="425.3" width="16.0" height="16.0" rx="3" fill="#fff" stroke="#c0271e" stroke-width="2.6"/>
<text x="258.0" y="438.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1959</text>
<text x="306.0" y="431.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Патент згасає</text>
<text x="306.0" y="450.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Так і не використаний; винахідники не дістали ні цента</text>
<circle cx="280.0" cy="486.2" r="6.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.4"/>
<text x="258.0" y="491.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1962</text>
<text x="306.0" y="484.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Військові беруть ідею</text>
<text x="306.0" y="503.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Схожу техніку впроваджують — уже після згасання патенту</text>
<circle cx="280.0" cy="539.1" r="9.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="280.0" cy="539.1" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="258.0" y="544.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1997</text>
<text x="306.0" y="537.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Нарешті визнання</text>
<text x="306.0" y="556.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Премія EFF Pioneer повертає їй ім'я винахідниці</text>
<circle cx="280.0" cy="592.0" r="9.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="280.0" cy="592.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="258.0" y="597.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2014</text>
<text x="306.0" y="590.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Зала слави (посмертно)</text>
<text x="306.0" y="609.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Національна зала слави винахідників — справедливість запізно</text>
</svg>
