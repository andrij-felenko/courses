<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бод проти біт/с: чому це не одне й те саме</text>
<text x="450.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">бітова швидкість = символьна швидкість (бод) × log₂M</text>
<text x="450.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">приклад: символьна швидкість 1 Мбод</text>
<text x="135.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">BPSK</text>
<rect x="245.0" y="150.0" width="120.0" height="34.0" rx="5" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="255.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1 Мбод × 1 = 1 Мбіт/с</text>
<text x="135.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">QPSK</text>
<rect x="245.0" y="200.0" width="240.0" height="34.0" rx="5" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="255.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1 Мбод × 2 = 2 Мбіт/с</text>
<text x="135.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="700">16-QAM</text>
<rect x="245.0" y="250.0" width="480.0" height="34.0" rx="5" fill="#fbf3df" stroke="#b08900" stroke-width="1.8"/>
<text x="255.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1 Мбод × 4 = 4 Мбіт/с</text>
<rect x="60.0" y="306.0" width="780.0" height="30.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="450.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама символьна швидкість — а біт/с різні: ось як вантажніший символ прискорює лінію.</text>
</svg>