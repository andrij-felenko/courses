<rect x="22.6" y="328.6" width="714.8" height="82.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="350.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Принцип роботи:</tspan><tspan x="380.0" dy="15.6">1. Модулятор формує радіосигнал s(t) з двох незалежних сигналів I(t) та Q(t).</tspan><tspan x="380.0" dy="15.6">2. Демодулятор перемножує s(t) на ортогональні несучі та відфільтровує частоту 2f_c за допомогою ФНЧ.</tspan><tspan x="380.0" dy="15.6">3. Вихід ФНЧ — точно відновлені складові I'(t) = I(t)/2 та Q'(t) = Q(t)/2.</tspan></text>
