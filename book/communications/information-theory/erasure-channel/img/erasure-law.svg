<line x1="344.0" y1="219.0" x2="370.0" y2="245.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="344.0" y1="245.0" x2="370.0" y2="219.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="352.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">0  (символ не плутається)</text>
<circle cx="150.0" cy="232.0" r="34.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="150.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">x</text>
<text x="150.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">будь-який символ</text>
<circle cx="560.0" cy="108.0" r="30.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="560.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">x</text>
<text x="606.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">той самий</text>
