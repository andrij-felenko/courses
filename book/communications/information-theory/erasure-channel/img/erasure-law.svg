<text x="560.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-style="italic">y</text>
<text x="606.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">інший символ</text>
<circle cx="560.0" cy="356.0" r="30.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="560.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="25" fill="#c0392b" text-anchor="middle" font-weight="700">?</text>
<text x="606.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">стерто</text>
<rect x="58.0" y="398.0" width="604.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">втрата, що САМА себе оголошує: приймач бачить «?» і точно знає, ДЕ бракує символа</tspan></text>
