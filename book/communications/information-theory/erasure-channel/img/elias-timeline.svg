<text x="514.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="514.0" dy="0.0">приписують Еліасу (~1955), проте жодне</tspan><tspan x="514.0" dy="16.2">першоджерело цього не фіксує;</tspan><tspan x="514.0" dy="16.2">Wikipedia донині — «citation needed»</tspan></text>
