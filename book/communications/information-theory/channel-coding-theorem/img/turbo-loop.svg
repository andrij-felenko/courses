<rect x="478.0" y="292.0" width="348.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="652.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="652.0" dy="0.0">Передають ЛИШЕ зовнішню інформацію —</tspan><tspan x="652.0" dy="13.7">те, що декодер довідався сам, відібравши те,</tspan><tspan x="652.0" dy="13.7">що йому й так підказали канал і сусід.</tspan></text>
<text x="652.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="652.0" dy="0.0">Без цього віднімання два декодери просто</tspan><tspan x="652.0" dy="13.0">повертають одне одному власні ж думки —</tspan><tspan x="652.0" dy="13.0">і переконують себе замість того, щоб учитися.</tspan></text>
