<rect x="45.0" y="420.0" width="690.0" height="42.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Нижче C хмари роз'єднані — приймач однозначно впізнає слово. Вище C їх більше, ніж місця: хмари налазять, плутанина неминуча.</tspan></text>
