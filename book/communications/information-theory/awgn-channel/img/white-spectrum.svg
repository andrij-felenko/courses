<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Білий шум: однакова щільність потужності на всіх частотах</text>
<line x1="90.0" y1="262.0" x2="662.0" y2="262.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="656.0" y1="262.0" x2="672.0" y2="262.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="664.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">частота</text>
<line x1="90.0" y1="266.0" x2="90.0" y2="88.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="90.0" y1="94.0" x2="90.0" y2="74.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="84.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">щільність потужності</text>
<rect x="300.0" y="146.0" width="160.0" height="116.0" rx="0" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="380.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">смуга B</text>
<text x="380.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">N = N₀·B</tspan><tspan x="380.0" dy="15.0">шум у смузі</tspan></text>
<line x1="90.0" y1="146.0" x2="650.0" y2="146.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="644.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">N₀/2 — те саме на кожній частоті</text>
<rect x="60.0" y="292.0" width="600.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Як біле світло містить усі кольори порівну — білий шум має всі частоти</tspan><tspan x="360.0" dy="10.4">порівну. Пласким навіки він бути не може (нескінченна потужність); насправді плаский у всій смузі, яку ми вживаємо.</tspan></text>
</svg>