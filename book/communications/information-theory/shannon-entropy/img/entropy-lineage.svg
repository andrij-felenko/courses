<text x="326.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">фізика (Ґіббс):     S = −k ∑ pᵢ · ln pᵢ</tspan><tspan x="326.0" dy="16.2">зв'язок (Шеннон):  H = −  ∑ pᵢ · log₂ pᵢ</tspan></text>
