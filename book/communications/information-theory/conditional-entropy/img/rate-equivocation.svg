<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкість і двозначність: що канал доносить і що неусувно губить</text>
<text x="410.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R = H(X) − H(X|Y)   —   справжня швидкість передачі</text>
<line x1="112.0" y1="350.0" x2="700.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="112.0" y1="354.0" x2="112.0" y2="86.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="112.0" y1="101.0" x2="112.0" y2="89.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="100.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">біт/символ</text>
<line x1="107.0" y1="350.0" x2="112.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="102.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0.0</text>
<line x1="107.0" y1="275.0" x2="112.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="102.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0.5</text>
<line x1="107.0" y1="200.0" x2="112.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="102.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">1.0</text>
<line x1="107.0" y1="125.0" x2="112.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="102.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">1.5</text>
<line x1="112.0" y1="200.0" x2="668.0" y2="200.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="674.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">C — пропускна</text>
<text x="674.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">здатність каналу</text>
<rect x="189.0" y="245.0" width="122.0" height="105.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="295.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">R → H</text>
<text x="250.0" y="312.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">усе доходить</text>
<text x="250.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">H ≤ C</text>
<text x="250.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">помилку й двозначність</text>
<text x="250.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">можна звести до нуля</text>
<rect x="479.0" y="200.0" width="122.0" height="150.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="540.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">R ≈ C</text>
<text x="540.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">доходить</text>
<rect x="479.0" y="110.0" width="122.0" height="90.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="540.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">H(X|Y) ≥ H − C</text>
<text x="540.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">неусувний залишок</text>
<text x="540.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">H &gt; C</text>
<text x="540.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">двозначність не опустити</text>
<text x="540.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">нижче за H − C</text>
</svg>