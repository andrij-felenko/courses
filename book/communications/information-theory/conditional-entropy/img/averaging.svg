<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Умовна ентропія — середній залишок непевності по всіх підказках</text>
<line x1="100.0" y1="350.0" x2="480.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="100.0" y1="354.0" x2="100.0" y2="104.1" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="100.0" y1="113.4" x2="100.0" y2="94.8" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90.0" y="101.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">залишок</text>
<text x="90.0" y="115.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">H(X|Y=y), біт</text>
<line x1="95.0" y1="350.0" x2="100.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="91.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0.0</text>
<line x1="95.0" y1="234.0" x2="100.0" y2="234.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="91.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0.5</text>
<line x1="95.0" y1="118.0" x2="100.0" y2="118.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="91.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">1.0</text>
<line x1="100.0" y1="192.2" x2="472.0" y2="192.2" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="478.0" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">H(X) = 0.680</text>
<text x="478.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">(наосліп)</text>
<rect x="100.0" y="241.2" width="288.0" height="108.8" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="244.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">H = 0.469</text>
<text x="244.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y = певно</text>
<text x="244.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">p = 0.8</text>
<rect x="388.0" y="118.0" width="72.0" height="232.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="424.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">H = 1.000</text>
<text x="424.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y = сумнівно</text>
<text x="424.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">p = 0.2</text>
<line x1="100.0" y1="216.6" x2="472.0" y2="216.6" stroke="#c0392b" stroke-width="2.0"/>
<text x="478.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">H(X|Y) = 0.575</text>
<text x="424.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">рідкісний сумнівний прапорець</text>
<text x="424.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">лишає більше, ніж наосліп</text>
<rect x="508.0" y="250.0" width="300.0" height="92.0" rx="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="524.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="524.0" dy="0.0">H(X|Y) = Σ p(y)·H(X|Y=y)</tspan><tspan x="524.0" dy="15.0">  = 0.8·0.469 + 0.2·1.000</tspan><tspan x="524.0" dy="15.0">  = 0.575 біта / символ</tspan></text>
<text x="280.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ширина — частота підказки, висота — її залишок; площа — внесок у середнє</text>
</svg>