<rect x="70.0" y="350.0" width="720.0" height="72.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="430.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">лат. aequus «рівний» + vōx «голос»  →  aequivocus «рівноголосий, двозначний»</text>
<text x="430.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">→ англ. equivocation: слово логіки про двозначність, що його Шеннон переніс на канал</text>
