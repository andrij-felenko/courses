<text x="720.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">0.5</text>
<line x1="640.0" y1="250.0" x2="748.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="668.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">p(a|y)</text>
<text x="720.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">p(b|y)</text>
