<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Людина за межею: Клод Шеннон і народження теорії інформації</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1948 рік, Bell Labs — стаття, що заснувала цілу науку про передавання даних</text>
<circle cx="170.0" cy="170.0" r="46.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="170.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Клод</text>
<text x="170.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Шеннон</text>
<text x="170.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1916–2001</text>
<circle cx="280.0" cy="112.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="296.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«A Mathematical Theory of Communication» (1948) — заснувала теорію інформації</text>
<circle cx="280.0" cy="142.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="296.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Увів у науку біт як одиницю інформації</text>
<circle cx="280.0" cy="172.0" r="3.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="296.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Довів межу C — і що до неї можна підійти скільзавгодно близько хорошим кодуванням</text>
<rect x="280.0" y="212.0" width="580.0" height="70.0" rx="8" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="296.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чесно про попередників (наука — колективна):</text>
<text x="296.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Гаррі Найквіст (1924) і Ралф Гартлі (1928), теж із Bell Labs, заклали підвалини —</text>
<text x="296.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">тому й «Шеннон–Гартлі». Та саме синтез 1948 року, що дав точну межу, належить Шеннону.</text>
</svg>
