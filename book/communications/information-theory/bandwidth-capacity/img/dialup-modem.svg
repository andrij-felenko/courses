<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому дозвонний модем уперся в ~33.6 кбіт/с</text>
<rect x="60.0" y="80.0" width="250.0" height="150.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="185.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Телефонна лінія</text>
<text x="185.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">смуга B ≈ 3100 Гц</text>
<text x="185.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">сигнал/шум ≈ 30 дБ</text>
<text x="185.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(× 1000 у разах)</text>
<text x="185.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вузька смуга для голосу</text>
<line x1="316.0" y1="155.0" x2="372.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="344.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шеннон</text>
<rect x="380.0" y="80.0" width="280.0" height="150.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="520.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">C = 3100 · log₂(1 + 1000)</tspan><tspan x="520.0" dy="16.2">C = 3100 · 9.97</tspan><tspan x="520.0" dy="16.2">C ≈ 31 000 біт/с</tspan></text>
<line x1="400.0" y1="178.0" x2="640.0" y2="178.0" stroke="#cfd6dd" stroke-width="1.2"/>
<text x="520.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">≈ 31 кбіт/с</text>
<text x="520.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">це фізична стеля лінії</text>
<rect x="60.0" y="270.0" width="600.0" height="56.0" rx="6" fill="#fdf6ec" stroke="#b08900" stroke-width="1.5"/><text x="360.0" y="294.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">«56k» не побили закон: один бік лінії зробили цифровим — прибрали етап</tspan><tspan x="360.0" dy="15.0">перетворення й підняли ефективний S/N. Не перестрибнули стіну, а відсунули її.</tspan></text>
</svg>