<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа C — стіна можливого</text>
<rect x="70.0" y="70.0" width="284.0" height="230.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="212.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЗОНА МОЖЛИВОГО</text>
<text x="212.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">швидкість нижча за C:</tspan><tspan x="212.0" dy="14.3">є кодування, що дає зв'язок</tspan><tspan x="212.0" dy="14.3">майже без помилок навіть у шумі</tspan></text>
<rect x="366.0" y="70.0" width="284.0" height="230.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="508.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ЗОНА НЕМОЖЛИВОГО</text>
<text x="508.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="508.0" dy="0.0">швидкість вища за C:</tspan><tspan x="508.0" dy="14.3">жодна модуляція й жодне</tspan><tspan x="508.0" dy="14.3">кодування не врятують</tspan></text>
<line x1="360.0" y1="64.0" x2="360.0" y2="306.0" stroke="#1a1a1a" stroke-width="4.0"/>
<text x="360.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">C = B · log₂(1 + S/N)</text>
<line x1="230.0" y1="250.0" x2="352.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">підійти — як завгодно близько</text>
</svg>