<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне керування потоком (RTS / CTS Handshaking)</text>
<rect x="40.0" y="60.0" width="240.0" height="310.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Приймач A (MCU A)</text>
<rect x="500.0" y="60.0" width="240.0" height="310.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="620.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Передавач B (MCU B)</text>
<rect x="60.0" y="110.0" width="200.0" height="120.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="160.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Приймальний буфер RX FIFO</text>
<rect x="75.0" y="175.0" width="170.0" height="45.0" rx="4" fill="#fca5a5" stroke="#ef4444" stroke-width="1.2"/>
<text x="160.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Поріг High Watermark!</text>
<text x="160.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">(Буфер майже повний)</text>
<rect x="520.0" y="110.0" width="200.0" height="120.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="620.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Передавальний буфер TX</text>
<rect x="535.0" y="150.0" width="170.0" height="65.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="620.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">Призупинення TX</text>
<text x="620.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle">(Пауза до деасерції CTS)</text>
<line x1="500.0" y1="140.0" x2="280.0" y2="140.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Дані (TX B -&gt; RX A)</text>
<line x1="280.0" y1="260.0" x2="500.0" y2="260.0" stroke="#c026d3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="390.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#86198f" text-anchor="middle" font-weight="700">Сигнал RTS (A) -&gt; CTS (B)</text>
<text x="390.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#701a75" text-anchor="middle">RTS = High (Накладено стоп)</text>
<rect x="60.0" y="280.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="160.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">Приймач A піднімає RTS</text>
<text x="160.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">при досягненні порогу</text>
<text x="160.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">щоб відсікти переповнення</text>
<rect x="520.0" y="280.0" width="200.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="620.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">Передавач B бачить CTS</text>
<text x="620.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">і негайно зупиняє TX</text>
<text x="620.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">після поточного байта</text>
</svg>