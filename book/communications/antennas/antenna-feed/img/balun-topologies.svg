<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схеми вольтного (Рутроф) та струмового (Гуанелла) балунів</text>
<rect x="20.0" y="50.0" width="370.0" height="240.0" rx="8" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.0"/>
<text x="205.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Вольтний балун 1:1 (Рутроф)</text>
<text x="205.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фіксує рівність напруг V_A = -V_B</text>
<rect x="170.0" y="115.0" width="70.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#8e44ad" stroke-width="1.8"/>
<text x="205.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Осердя</text>
<line x1="70.0" y1="135.0" x2="170.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="100.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">50 Ом вхід</text>
<line x1="70.0" y1="205.0" x2="170.0" y2="205.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="120.0" y1="205.0" x2="120.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="105.0" y1="235.0" x2="135.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="240.0" y1="135.0" x2="340.0" y2="135.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="240.0" y1="205.0" x2="340.0" y2="205.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="310.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Клема A (+V)</text>
<text x="310.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Клема B (-V)</text>
<text x="205.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Недолік: при несиметрії навантаження I_A ≠ I_B</text>
<rect x="410.0" y="50.0" width="370.0" height="240.0" rx="8" fill="#fcfdfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="595.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Струмовий балун 1:1 (Гуанелла)</text>
<text x="595.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фіксує рівність струмів I_A = -I_B</text>
<rect x="540.0" y="115.0" width="110.0" height="110.0" rx="6" fill="#4a5568" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="595.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Феритове</text>
<text x="595.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">осердя</text>
<line x1="440.0" y1="135.0" x2="540.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="440.0" y1="205.0" x2="540.0" y2="205.0" stroke="#718096" stroke-width="2.5"/>
<text x="485.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Жила</text>
<text x="485.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">Екран</text>
<line x1="650.0" y1="135.0" x2="750.0" y2="135.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="650.0" y1="205.0" x2="750.0" y2="205.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="715.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Клема A (I_A)</text>
<text x="715.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Клема B (I_B)</text>
<text x="595.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Перевага: високе пригнічення струмів спільної моди</text>
<rect x="20.0" y="305.0" width="760.0" height="60.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Вольтний балун задає потенціали на клемах, але пропускає струм спільної моди при асиметрії землеємностей.</tspan><tspan x="400.0" dy="14.3">Струмовий балун (дросель) гарантує рівність струмів у плечах антени за будь-яких умов.</tspan></text>
</svg>