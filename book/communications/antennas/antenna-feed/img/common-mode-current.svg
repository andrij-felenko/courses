<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виникнення струмів спільної моди та дія струмового балуна</text>
<rect x="20.0" y="50.0" width="380.0" height="290.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="210.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Пряме підключення (без балуна)</text>
<line x1="70.0" y1="120.0" x2="200.0" y2="120.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="220.0" y1="120.0" x2="350.0" y2="120.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="200.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="220.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="135.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Плече A (I_A)</text>
<text x="285.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Плече B (I_B)</text>
<rect x="190.0" y="140.0" width="40.0" height="150.0" rx="3" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/>
<line x1="200.0" y1="120.0" x2="200.0" y2="140.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="220.0" y1="120.0" x2="220.0" y2="140.0" stroke="#718096" stroke-width="2.0"/>
<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Коаксіал</text>
<line x1="200.0" y1="180.0" x2="200.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="175.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I_in</text>
<line x1="235.0" y1="150.0" x2="235.0" y2="270.0" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Струм I_cm на</text>
<text x="290.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">зовнішньому екрані!</text>
<text x="210.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Результат: I_A ≠ I_B, випромінювання кабелю</text>
<rect x="420.0" y="50.0" width="380.0" height="290.0" rx="8" fill="#fcfdfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Зі струмовим балуном (Guanella 1:1)</text>
<line x1="470.0" y1="120.0" x2="600.0" y2="120.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="620.0" y1="120.0" x2="750.0" y2="120.0" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="600.0" cy="120.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="620.0" cy="120.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="535.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">I_A</text>
<text x="685.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">I_B = -I_A</text>
<rect x="590.0" y="210.0" width="40.0" height="110.0" rx="3" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/>
<rect x="575.0" y="150.0" width="70.0" height="45.0" rx="6" fill="#4a5568" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="610.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Ферит (Z_cm)</text>
<line x1="600.0" y1="120.0" x2="600.0" y2="150.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="620.0" y1="120.0" x2="620.0" y2="150.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="635.0" y1="195.0" x2="635.0" y2="230.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="710.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Високий Z_cm</text>
<text x="710.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">блокує I_cm</text>
<text x="610.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Симетрію відновлено: I_A = I_B, I_cm ≈ 0</text>
<rect x="20.0" y="350.0" width="780.0" height="55.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="410.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Струмовий балун створює високий опір Z_cm для ВЧ-струмів на зовнішній поверхні екрана,</tspan><tspan x="410.0" dy="14.3">усуваючи паразитивне випромінювання фідера та спотворення діаграми спрямованості.</tspan></text>
</svg>