<circle cx="290.0" cy="195.0" r="60.0" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<circle cx="170.0" cy="195.0" r="60.0" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
