<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Узгодження на діаграмі Сміта: траєкторія від Z_A до центра 50 Ом</text>
