<rect x="410.0" y="55.0" width="330.0" height="270.0" rx="6" fill="#fcfcfd" stroke="#1a1a1a" stroke-width="1.5"/><text x="575.0" y="146.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Як працює діаграма Сміта:</tspan><tspan x="575.0" dy="11.7"></tspan><tspan x="575.0" dy="11.7">• Центр діаграми — точка ідеального узгодження (50 Ом, Γ = 0).</tspan><tspan x="575.0" dy="11.7">• Послідовна індуктивність L — рух за годинниковою стрілкою по колу R = const.</tspan><tspan x="575.0" dy="11.7">• Послідовна ємність C — рух проти годинникової стрілки по колу R = const.</tspan><tspan x="575.0" dy="11.7">• Паралельна ємність C — рух за годинниковою стрілкою по колу G = const.</tspan><tspan x="575.0" dy="11.7">• Паралельна індуктивність L — рух проти годинникової стрілки по колу G = const.</tspan><tspan x="575.0" dy="11.7"></tspan><tspan x="575.0" dy="11.7">Будь-який імпеданс Z_A переводиться в центр за 2 кроки L-вузла!</tspan></text>
</svg>