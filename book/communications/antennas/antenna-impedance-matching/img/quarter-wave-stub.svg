<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподілене узгодження: чвертьхвильова лінія та узгоджувальний шлейф</text>
<rect x="20.0" y="50.0" width="350.0" height="280.0" rx="8" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.0"/>
<text x="195.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чвертьхвильовий трансформатор (λ/4)</text>
<line x1="40.0" y1="140.0" x2="120.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="40.0" y1="210.0" x2="120.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="80.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Z_0</text>
<rect x="120.0" y="130.0" width="150.0" height="90.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.0"/>
<text x="195.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2980b9" text-anchor="middle" font-weight="700">Лінія Z_w</text>
<text x="195.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Довжина ℓ = λ / 4</text>
<rect x="270.0" y="125.0" width="80.0" height="100.0" rx="6" fill="#fdfefe" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="310.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">R_A</text>
<rect x="35.0" y="238.0" width="320.0" height="78.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="195.0" y="262.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Формула трансформації λ/4:</tspan><tspan x="195.0" dy="11.7">Z_w = √(Z_0 · R_A)</tspan><tspan x="195.0" dy="11.7"></tspan><tspan x="195.0" dy="11.7">Трансформує активний опір R_A у хвильовий опір фідеру Z_0.</tspan></text>
<rect x="390.0" y="50.0" width="350.0" height="280.0" rx="8" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.0"/>
<text x="565.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралельний узгоджувальний шлейф</text>
<line x1="410.0" y1="140.0" x2="640.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="410.0" y1="230.0" x2="640.0" y2="230.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="530.0" y1="140.0" x2="530.0" y2="75.0" stroke="#8e44ad" stroke-width="2.5"/>
<line x1="560.0" y1="140.0" x2="560.0" y2="75.0" stroke="#8e44ad" stroke-width="2.5"/>
<line x1="530.0" y1="75.0" x2="560.0" y2="75.0" stroke="#8e44ad" stroke-width="2.5"/>
<text x="545.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">КЗ шлейф (Stub)</tspan></text>
<line x1="545.0" y1="155.0" x2="640.0" y2="155.0" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="545.0" y1="155.0" x2="450.0" y2="155.0" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="510.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Відстань d</tspan></text>
<rect x="640.0" y="125.0" width="80.0" height="120.0" rx="6" fill="#fdfefe" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="680.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Z_A</tspan></text>
<rect x="405.0" y="238.0" width="320.0" height="78.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/><text x="565.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Принцип шлейфового узгодження:</tspan><tspan x="565.0" dy="11.7">1. Відстань d обирається так, щоб Re(Y) = 1/Z_0.</tspan><tspan x="565.0" dy="11.7">2. Шлейф створює реактивність −jB, що повністю компенсує +jB антени.</tspan></text>
</svg>