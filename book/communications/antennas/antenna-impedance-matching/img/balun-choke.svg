<line x1="250.0" y1="132.0" x2="100.0" y2="132.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Струм затікання I_3 = I_1 − I_2 розтікається по зовнішній оплетці!</tspan><tspan x="380.0" dy="13.7">Кабель випромінює як частина антени → спотворення ДН та завади.</tspan></text>
