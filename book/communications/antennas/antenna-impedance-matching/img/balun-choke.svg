<rect x="280.0" y="230.0" width="440.0" height="95.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Механізм придушення:</tspan><tspan x="500.0" dy="11.7">Ферит створює високий синфазний опір (Z_cm ≫ 500 Ом) для зовнішньої поверхні оплетки.</tspan><tspan x="500.0" dy="11.7">Струм затікання I_3 ≈ 0. Струми у плечах диполя строго симетричні (I_1 = I_2).</tspan></text>
</svg>