<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Визначення спрямованості: інтенсивність U(θ, ϕ) та тілесний кут Ω_A</text>
<rect x="20.0" y="50.0" width="350.0" height="280.0" rx="8" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.0"/>
<text x="200.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Елемент сфери dΩ = sin(θ) dθ dϕ</text>
<line x1="200.0" y1="200.0" x2="200.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Z (θ=0°)</text>
<line x1="200.0" y1="200.0" x2="320.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">X</text>
<line x1="200.0" y1="200.0" x2="100.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="92.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Y</text>
<line x1="200.0" y1="200.0" x2="285.0" y2="125.0" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="285.0" cy="125.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="295.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">U(θ, ϕ) [Вт/ст]</text>
<path d="M 200,155 A 45 45 0 0 1 228,175" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="220.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">θ</text>
<text x="200.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">Спрямованість описує розподіл</tspan><tspan x="200.0" dy="13.8">потужності P_rad по сферичних кутах</tspan></text>
<rect x="390.0" y="50.0" width="350.0" height="280.0" rx="8" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.0"/>
<text x="570.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Тілесний кут променя Ω_A</text>
<polygon points="570.0,200.0 680.0,150.0 680.0,250.0" fill="#f4eeef" stroke="#8e44ad" stroke-width="1.8"/>
<ellipse cx="680" cy="200" rx="15" ry="50" fill="#e8daef" stroke="#8e44ad" stroke-width="1.8"/>
<line x1="570.0" y1="200.0" x2="705.0" y2="200.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="630.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">U_max</text>
<text x="615.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="middle" font-weight="700">Ω_A</text>
<rect x="410.0" y="255.0" width="310.0" height="60.0" rx="6" fill="#fdfefe" stroke="#8e44ad" stroke-width="1.5"/><text x="565.0" y="267.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Формула спрямованості:</tspan><tspan x="565.0" dy="14.3">D = 4π · U_max / P_rad = 4π / Ω_A</tspan><tspan x="565.0" dy="14.3"></tspan><tspan x="565.0" dy="14.3">Чим менший кут Ω_A, тим більша спрямованість D</tspan></text>
</svg>