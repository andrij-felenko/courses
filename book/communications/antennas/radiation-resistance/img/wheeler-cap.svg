<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310"><rect width="100%" height="100%" fill="#ffffff"/><text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод ковпака Вілера (Wheeler Cap) для розділення R_рад та R_втрат</text><rect x="40.0" y="50.0" width="320.0" height="220.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Вимірювання у вільному просторі</text><line x1="200.0" y1="110.0" x2="200.0" y2="190.0" stroke="#333333" stroke-width="3.0"/><line x1="140.0" y1="190.0" x2="260.0" y2="190.0" stroke="#333333" stroke-width="2.0"/><circle cx="200.0" cy="190.0" r="4.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/><path d="M 220 130 A 30 30 0 0 1 220 170" fill="none" stroke="#27ae60" stroke-width="2"/><path d="M 235 120 A 50 50 0 0 1 235 180" fill="none" stroke="#27ae60" stroke-width="2"/><path d="M 180 130 A 30 30 0 0 0 180 170" fill="none" stroke="#27ae60" stroke-width="2"/><rect x="87.2" y="215.5" width="225.6" height="29.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">R_вільне = R_рад + R_втрат</tspan></text><rect x="400.0" y="50.0" width="320.0" height="220.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Вимірювання у провідному ковпаку</text><path d="M 475 190 A 85 85 0 0 1 645 190 Z" fill="#e2e8f0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,2"/><text x="560.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Екранувальний ковпак (r = λ / 2π)</text><line x1="560.0" y1="130.0" x2="560.0" y2="190.0" stroke="#333333" stroke-width="3.0"/><line x1="500.0" y1="190.0" x2="620.0" y2="190.0" stroke="#333333" stroke-width="2.0"/><circle cx="560.0" cy="190.0" r="4.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/><text x="595.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Випромінювання заблоковане</text><rect x="479.5" y="215.5" width="161.1" height="29.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">R_ковпак = R_втрат</tspan></text><text x="380.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір випромінювання:  R_рад = R_вільне - R_ковпак</text></svg>