<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="440.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="390.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний механізм пасивного випромінювання та формування хвилі</text>
<rect x="30.0" y="60.0" width="340.0" height="350.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="200.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="700">РЕФЛЕКТОР (L_R &gt; λ/2)</text>
<line x1="120.0" y1="130.0" x2="120.0" y2="290.0" stroke="#c53030" stroke-width="4.0"/>
<text x="120.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c53030" text-anchor="middle" font-weight="700">Активний диполь</text>
<line x1="280.0" y1="110.0" x2="280.0" y2="310.0" stroke="#2b6cb0" stroke-width="4.0"/>
<text x="280.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="700">Рефлектор</text>
<line x1="130.0" y1="180.0" x2="270.0" y2="180.0" stroke="#dd6b20" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dd6b20" text-anchor="middle">Падаюче поле E₀</text>
<rect x="91.4" y="190.0" width="217.2" height="100.0" rx="6" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="200.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">• Реактивність: Індуктивна (X &gt; 0)</tspan><tspan x="200.0" dy="13.0">• Зсув струму: Відстає по фазі</tspan><tspan x="200.0" dy="13.0">• Просторова затримка: β·d ≈ 70°</tspan><tspan x="200.0" dy="13.0">• Сумарна фаза ззаду: ≈ 180°</tspan><tspan x="200.0" dy="13.0">  → Протифаза (гасіння назад!)</tspan><tspan x="200.0" dy="13.0">• Сумарна фаза попереду: ≈ 0°</tspan><tspan x="200.0" dy="13.0">  → Синфазність (підсилення вперед!)</tspan></text>
<rect x="410.0" y="60.0" width="340.0" height="350.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="580.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2f855a" text-anchor="middle" font-weight="700">ДИРЕКТОР (L_D &lt; λ/2)</text>
<line x1="480.0" y1="130.0" x2="480.0" y2="290.0" stroke="#c53030" stroke-width="4.0"/>
<text x="480.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c53030" text-anchor="middle" font-weight="700">Активний диполь</text>
<line x1="640.0" y1="145.0" x2="640.0" y2="275.0" stroke="#2f855a" stroke-width="4.0"/>
<text x="640.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2f855a" text-anchor="middle" font-weight="700">Директор</text>
<line x1="490.0" y1="180.0" x2="630.0" y2="180.0" stroke="#dd6b20" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dd6b20" text-anchor="middle">Падаюче поле E₀</text>
<rect x="471.4" y="183.5" width="217.2" height="113.0" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/><text x="580.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">• Реактивність: Ємнісна (X &lt; 0)</tspan><tspan x="580.0" dy="13.0">• Зсув струму: Випереджає по фазі</tspan><tspan x="580.0" dy="13.0">• Промені вільної хвилі наздоганяють</tspan><tspan x="580.0" dy="13.0">  перевипромінене поле директора</tspan><tspan x="580.0" dy="13.0">• Формується сповільнена хвиля</tspan><tspan x="580.0" dy="13.0">  уздовж директорного ряду</tspan><tspan x="580.0" dy="13.0">• Ефект лінзи: Концентрація</tspan><tspan x="580.0" dy="13.0">  променя в напрямку директора</tspan></text>
</svg>