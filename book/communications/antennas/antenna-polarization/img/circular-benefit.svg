<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три переваги колової поляризації</text>
<rect x="25.0" y="60.0" width="210.0" height="230.0" rx="10" fill="#fbfdff" stroke="#27ae60" stroke-width="1.8"/>
<text x="130.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Байдужа до</tspan><tspan x="130.0" dy="17.5">орієнтації</tspan></text>
<line x1="50.0" y1="142.0" x2="210.0" y2="142.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="130.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">лінійну ловить</tspan><tspan x="130.0" dy="15.4">під будь-яким кутом</tspan><tspan x="130.0" dy="15.4">≈ −3 дБ, без нулів</tspan></text>
<rect x="280.0" y="60.0" width="210.0" height="230.0" rx="10" fill="#fbfdff" stroke="#2457d6" stroke-width="1.8"/>
<text x="385.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">Відкидає</tspan><tspan x="385.0" dy="17.5">відбиття</tspan></text>
<line x1="305.0" y1="142.0" x2="465.0" y2="142.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="385.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">відбиття перевертає</tspan><tspan x="385.0" dy="15.4">«руку» (RHCP↔LHCP)</tspan><tspan x="385.0" dy="15.4">→ копії відсіюються</tspan></text>
<rect x="535.0" y="60.0" width="210.0" height="230.0" rx="10" fill="#fbfdff" stroke="#8e44ad" stroke-width="1.8"/>
<text x="640.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Подвоєння</tspan><tspan x="640.0" dy="17.5">каналу</tspan></text>
<line x1="560.0" y1="142.0" x2="720.0" y2="142.0" stroke="#8e44ad" stroke-width="1.0"/>
<text x="640.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">RHCP і LHCP взаємно</tspan><tspan x="640.0" dy="15.4">«глухі» → дві лінії</tspan><tspan x="640.0" dy="15.4">на одній частоті</tspan></text>
<text x="380.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">тому колову беруть для GPS і супутників — орієнтація постійно «гуляє»</text>
</svg>