<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схеми об'єднання сигналів рознесеного прийому</text>
<rect x="30.0" y="95.0" width="50.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="55.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+45°</text>
<rect x="30.0" y="215.0" width="50.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="55.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">-45°</text>
<rect x="101.7" y="97.3" width="116.6" height="35.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Канал RX 1</tspan><tspan x="160.0" dy="14.3">r1(t) = h1·s + n1</tspan></text>
<rect x="101.7" y="217.3" width="116.6" height="35.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Канал RX 2</tspan><tspan x="160.0" dy="14.3">r2(t) = h2·s + n2</tspan></text>
<line x1="80.0" y1="115.0" x2="105.0" y2="115.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="80.0" y1="235.0" x2="105.0" y2="235.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="215.0" y1="115.0" x2="270.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="215.0" y1="235.0" x2="270.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="275.0" y="80.0" width="230.0" height="90.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="390.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Selection Combining (SC)</text>
<text x="390.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Вибір каналу з max(SNR)</text>
<text x="390.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">gamma_sc = max(gamma1, gamma2)</text>
<rect x="275.0" y="200.0" width="230.0" height="90.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="390.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Maximal Ratio Combining (MRC)</text>
<text x="390.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Вагове додавання w_i = h_i*</text>
<text x="390.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">gamma_mrc = gamma1 + gamma2</text>
<line x1="505.0" y1="125.0" x2="560.0" y2="125.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="601.8" y="107.3" width="66.4" height="35.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="635.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Вихід SC</tspan><tspan x="635.0" dy="14.3">(Простий)</tspan></text>
<line x1="505.0" y1="245.0" x2="560.0" y2="245.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="573.6" y="227.3" width="122.9" height="35.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Вихід MRC</tspan><tspan x="635.0" dy="14.3">(Максимальний SNR)</tspan></text>
<text x="370.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">MRC забезпечує максимальний виграш рознесеного прийому завдяки накопиченню енергії обох ветвей</text>
</svg>