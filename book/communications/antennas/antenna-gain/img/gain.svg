  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підсилення антени — це КОНЦЕНТРАЦІЯ, а не зайва енергія</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">антена нічого не додає; вона збирає ту саму потужність у вужчий промінь</text>
<text x="230.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">лампа без рефлектора</text>
<circle cx="230.0" cy="200.0" r="6.0" fill="#e8b53a" stroke="#e8b53a" stroke-width="0"/>
<line x1="230.0" y1="200.0" x2="285.0" y2="200.0" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="277.6" y2="172.5" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="257.5" y2="152.4" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="230.0" y2="145.0" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="202.5" y2="152.4" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="182.4" y2="172.5" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="175.0" y2="200.0" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="182.4" y2="227.5" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="202.5" y2="247.6" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="230.0" y2="255.0" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="257.5" y2="247.6" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<line x1="230.0" y1="200.0" x2="277.6" y2="227.5" stroke="#b08900" stroke-width="1" stroke-linecap="round"/>
<text x="230.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">слабко, але навсібіч</text>
<text x="660.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">лампа з рефлектором</text>
<circle cx="600.0" cy="200.0" r="6.0" fill="#e8b53a" stroke="#e8b53a" stroke-width="0"/>
<path d="M 600,200 L 780,155 L 780,245 Z" fill="#fff6d8" stroke="#1f8a3b" stroke-width="2"/>
<text x="720.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">яскраво — але лише вперед</text>
<rect x="60.0" y="300.0" width="780.0" height="50.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама лампа, та сама потужність — рефлектор лише ЗБИРАЄ світло в промінь. Антена робить так само.</text>
<text x="450.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Більше підсилення (дБі) = вужчий промінь. Виграш в один бік — це втрата в інші.</text>
</svg>
