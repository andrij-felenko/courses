<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Передавання = перетворити коливний струм на хвилю. Приймання — навпаки (далі).</text>
