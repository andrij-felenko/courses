<rect x="50.0" y="330.0" width="370.0" height="165.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="235.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Коректне вікно: W = 2^(2-1) = 2</text>
<rect x="60.0" y="365.0" width="350.0" height="120.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="235.0" y="410.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">• TX надсилає [0, 1], RX приймає [0, 1] та зсуває вікно на [2, 3]</tspan><tspan x="235.0" dy="11.7">• Якщо всі ACK [0, 1] втрачено, TX повторює [0, 1]</tspan><tspan x="235.0" dy="11.7">• RX бачить кадри [0, 1] поза новим вікном [2, 3] → відкидає як ДУБЛІКАТИ!</tspan><tspan x="235.0" dy="11.7">Немає неоднозначності.</tspan></text>
<rect x="450.0" y="330.0" width="380.0" height="165.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="640.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Помилкове вікно: W = 3 &gt; 2^(2-1)</text>
<rect x="460.0" y="365.0" width="360.0" height="120.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="640.0" y="410.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">• TX надсилає [0, 1, 2], RX приймає їх і зсуває вікно на [3, 0, 1]</tspan><tspan x="640.0" dy="11.7">• Якщо всі ACK втрачено, TX повторює старий кадр 0</tspan><tspan x="640.0" dy="11.7">• RX очікує новий кадр 0 у вікні [3, 0, 1] → сприймає дублікат як НОВІ ДАНІ!</tspan><tspan x="640.0" dy="11.7">Критичне пошкодження потоку даних.</tspan></text>
