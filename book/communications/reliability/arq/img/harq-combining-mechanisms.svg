<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізми софт-комбінування в гібридному ARQ (HARQ)</text>
<rect x="30.0" y="45.0" width="425.0" height="490.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="242.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">HARQ Type II: Chase Combining (CC)</text>
<rect x="50.0" y="95.0" width="385.0" height="75.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="242.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Спроба 1: Передача блоку (RV = 0)</tspan><tspan x="242.5" dy="13.0">Сигнал проходить канал з шумом → CRC FAIL!</tspan><tspan x="242.5" dy="13.0">М'які біти (LLR_1) зберігаються в буфері</tspan></text>
<line x1="242.0" y1="175.0" x2="242.0" y2="215.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="220.0" width="385.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="242.5" y="250.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Спроба 2: Повторна передача ІДЕНТИЧНОЇ копії (RV = 0)</tspan><tspan x="242.5" dy="13.0">Отримано зашумлені біти LLR_2</tspan><tspan x="242.5" dy="13.0">Soft Combining: LLR_total = LLR_1 + LLR_2</tspan></text>
<line x1="242.0" y1="305.0" x2="242.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="350.0" width="385.0" height="90.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="242.5" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Ефект накопичення енергії:</tspan><tspan x="242.5" dy="13.0">• Дисперсія шуму зменшується</tspan><tspan x="242.5" dy="13.0">• Ефективне SNR зростає на +3 дБ з кожним повтором</tspan><tspan x="242.5" dy="13.0">• Декодер FEC успішно декодує сумарний LLR → CRC PASS!</tspan></text>
<rect x="50.0" y="450.0" width="385.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="242.5" y="479.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Особливість: швидкість коду R_eff не змінюється.</tspan><tspan x="242.5" dy="13.0">Ідеально для стаціонарного каналу з білим шумом.</tspan></text>
<rect x="485.0" y="45.0" width="425.0" height="490.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="697.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">HARQ Type II: Incremental Redundancy (IR)</text>
<rect x="505.0" y="95.0" width="385.0" height="75.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="697.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Спроба 1: Передача систематичних бітів (RV0)</tspan><tspan x="697.5" dy="13.0">Кодова швидкість висока (R = 3/4, сильне пунктування)</tspan><tspan x="697.5" dy="13.0">CRC FAIL → LLR_RV0 зберігається</tspan></text>
<line x1="697.0" y1="175.0" x2="697.0" y2="215.0" stroke="#e67e22" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="505.0" y="220.0" width="385.0" height="80.0" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/><text x="697.5" y="250.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Спроба 2: Передача НОВИХ бітів паритету (RV1)</tspan><tspan x="697.5" dy="13.0">Декодер об'єднує RV0 та RV1</tspan><tspan x="697.5" dy="13.0">Еквівалентна швидкість коду падає: R = 1/2</tspan></text>
<line x1="697.0" y1="305.0" x2="697.0" y2="345.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="505.0" y="350.0" width="385.0" height="90.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="697.5" y="385.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Спроба 3 (за потреби): Додатковий паритет (RV2/RV3)</tspan><tspan x="697.5" dy="13.0">Кодова швидкість досягає базової (R = 1/3)</tspan><tspan x="697.5" dy="13.0">Кодовий виграш значно вищий, ніж простий приріст SNR → CRC PASS!</tspan></text>
<rect x="505.0" y="450.0" width="385.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="697.5" y="479.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">Особливість: кожна спроба додає нову інформацію.</tspan><tspan x="697.5" dy="13.0">Використовується в LTE, 5G NR (LDPC/Polar) та Wi-Fi 6.</tspan></text>
</svg>