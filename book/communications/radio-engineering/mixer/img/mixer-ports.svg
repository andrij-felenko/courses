<rect x="250.0" y="282.4" width="240.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Порт LO (Гетеродин)</tspan><tspan x="370.0" dy="14.3">Частота: f_LO | Потужність: P_LO</tspan></text>
<line x1="450.0" y1="140.0" x2="640.0" y2="140.0" stroke="#c0392b" stroke-width="2.2"/>
