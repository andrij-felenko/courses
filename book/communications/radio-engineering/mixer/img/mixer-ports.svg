<rect x="511.1" y="80.2" width="217.8" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Порт IF (ПЧ вихід)</tspan><tspan x="620.0" dy="14.3">Частота: f_IF = |f_RF ± f_LO|</tspan><tspan x="620.0" dy="14.3">Потужність: P_IF</tspan></text>
<path d="M 350.0 180.0 Q 300.0 180.0 300.0 155.0" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
