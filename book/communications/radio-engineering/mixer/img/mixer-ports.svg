<rect x="45.0" y="80.2" width="150.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Порт RF (ВЧ вхід)</tspan><tspan x="120.0" dy="14.3">Частота: f_RF</tspan><tspan x="120.0" dy="14.3">Потужність: P_RF</tspan></text>
