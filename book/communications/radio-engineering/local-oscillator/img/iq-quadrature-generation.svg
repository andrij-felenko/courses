<text x="380.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Гетеродин Zero-IF / I-Q приймачів має видавати дві синусоїди з квадрируванням (зсув 90°).</text>
