<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадна формула Фрііса: шум приймача задає перший каскад</text>
<rect x="50.0" y="124.0" width="120.0" height="52.0" rx="7" fill="#eafaf1" stroke="#27ae60" stroke-width="1.9"/>
<text x="110.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">LNA</text>
<text x="110.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">F₁, G₁</text>
<rect x="270.0" y="124.0" width="120.0" height="52.0" rx="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.9"/>
<text x="330.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">змішувач</text>
<text x="330.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">F₂, G₂</text>
<rect x="490.0" y="124.0" width="120.0" height="52.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/>
<text x="550.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">IF-підс.</text>
<text x="550.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">F₃</text>
<line x1="40.0" y1="150.0" x2="50.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="170.0" y1="150.0" x2="270.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="150.0" x2="490.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="150.0" x2="680.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="40.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">антена</text>
<rect x="50.0" y="55.0" width="120.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/><text x="110.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">внесок:</tspan><tspan x="110.0" dy="14.3">F₁  (повністю)</tspan></text>
<rect x="270.0" y="55.0" width="120.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.2"/><text x="330.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">внесок:</tspan><tspan x="330.0" dy="14.3">(F₂−1) / G₁</tspan></text>
<rect x="490.0" y="55.0" width="120.0" height="42.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.2"/><text x="550.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">внесок:</tspan><tspan x="550.0" dy="13.0">(F₃−1) / (G₁·G₂)</tspan></text>
<line x1="110.0" y1="97.0" x2="110.0" y2="124.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="330.0" y1="97.0" x2="330.0" y2="124.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="550.0" y1="97.0" x2="550.0" y2="124.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<rect x="110.0" y="250.0" width="500.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="360.0" y="273.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">F_заг = F₁ + (F₂−1)/G₁ + (F₃−1)/(G₁·G₂) + …   →   якщо G₁ велике: F_заг ≈ F₁</tspan></text>
<text x="360.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">перший каскад входить без дільника — тому LNA задає чутливість усього приймача</text>
</svg>