<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три основні режими роботи технології NFC</text>
<rect x="35.0" y="50.0" width="205.0" height="240.0" rx="8" fill="#eff6ff" stroke="#27ae60" stroke-width="1.8"/>
<text x="137.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Reader/Writer Mode</text>
<line x1="47.0" y1="90.0" x2="228.0" y2="90.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="45.0" y="100.0" width="185.0" height="180.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="137.5" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Активний пристрій (PCD)</tspan><tspan x="137.5" dy="13.0">живить пасивну мітку (PICC).</tspan><tspan x="137.5" dy="13.0"></tspan><tspan x="137.5" dy="13.0">Застосування:</tspan><tspan x="137.5" dy="13.0">- Зчитування NDEF тегів</tspan><tspan x="137.5" dy="13.0">- Смарт-плакати</tspan><tspan x="137.5" dy="13.0">- Валідація квитків</tspan></text>
<rect x="260.0" y="50.0" width="205.0" height="240.0" rx="8" fill="#f0fdf4" stroke="#c0392b" stroke-width="1.8"/>
<text x="362.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Peer-to-Peer Mode</text>
<line x1="272.0" y1="90.0" x2="453.0" y2="90.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="270.0" y="100.0" width="185.0" height="180.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="362.5" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Два активних/пасивних</tspan><tspan x="362.5" dy="14.3">пристрої (P2P).</tspan><tspan x="362.5" dy="14.3"></tspan><tspan x="362.5" dy="14.3">Протоколи:</tspan><tspan x="362.5" dy="14.3">- ISO/IEC 18092 (NFCIP-1)</tspan><tspan x="362.5" dy="14.3">- LLCP (Logical Link)</tspan><tspan x="362.5" dy="14.3">- SNEP (NDEF Exchange)</tspan></text>
<rect x="485.0" y="50.0" width="205.0" height="240.0" rx="8" fill="#fdf2f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="587.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Card Emulation Mode</text>
<line x1="497.0" y1="90.0" x2="678.0" y2="90.0" stroke="#2457d6" stroke-width="1.2"/>
<rect x="495.0" y="100.0" width="185.0" height="180.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="587.5" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="587.5" dy="0.0">Смартфон імітує</tspan><tspan x="587.5" dy="13.0">пасивну смарт-карту.</tspan><tspan x="587.5" dy="13.0"></tspan><tspan x="587.5" dy="13.0">Архітектура:</tspan><tspan x="587.5" dy="13.0">- HCE (Host Card Emulation)</tspan><tspan x="587.5" dy="13.0">- Secure Element (SE / SIM)</tspan><tspan x="587.5" dy="13.0">- SWP (Single Wire Protocol)</tspan></text>
<rect x="100.0" y="305.0" width="520.0" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="360.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Всі 3 режими спираються на єдиний фізичний шар 13.56 МГц (ISO 14443 / FeliCa)</tspan></text>
</svg>