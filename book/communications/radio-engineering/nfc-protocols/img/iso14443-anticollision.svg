<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія антиколізії та каскадного вибору UID в ISO 14443-3</text>
<rect x="35.0" y="80.0" width="145.0" height="170.0" rx="6" fill="#e0f2fe" stroke="#27ae60" stroke-width="1.5"/>
<text x="107.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 1: Ініціалізація</text>
<line x1="45.0" y1="114.0" x2="170.0" y2="114.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="43.0" y="120.0" width="129.0" height="122.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="107.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="107.5" dy="0.0">REQA (0x26) /</tspan><tspan x="107.5" dy="13.0">WUPA (0x52)</tspan><tspan x="107.5" dy="13.0"></tspan><tspan x="107.5" dy="13.0">Відповідь ATQA:</tspan><tspan x="107.5" dy="13.0">Вказує розмір UID</tspan><tspan x="107.5" dy="13.0">(4, 7 або 10 байт)</tspan></text>
<line x1="182.0" y1="165.0" x2="198.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="200.0" y="80.0" width="145.0" height="170.0" rx="6" fill="#fef3c7" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="272.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cascade Level 1</text>
<line x1="210.0" y1="114.0" x2="335.0" y2="114.0" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="208.0" y="120.0" width="129.0" height="122.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="272.5" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="272.5" dy="0.0">SEL = 0x93</tspan><tspan x="272.5" dy="11.7">ANTICOLLISION</tspan><tspan x="272.5" dy="11.7"></tspan><tspan x="272.5" dy="11.7">Отримання:</tspan><tspan x="272.5" dy="11.7">UID0..UID3 + BCC</tspan><tspan x="272.5" dy="11.7">(Якщо UID0=0x88 → CT)</tspan></text>
<line x1="347.0" y1="165.0" x2="363.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="365.0" y="80.0" width="145.0" height="170.0" rx="6" fill="#ecfdf5" stroke="#c0392b" stroke-width="1.5"/>
<text x="437.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Cascade Level 2</text>
<line x1="375.0" y1="114.0" x2="500.0" y2="114.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="373.0" y="120.0" width="129.0" height="122.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="437.5" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="437.5" dy="0.0">SEL = 0x95</tspan><tspan x="437.5" dy="13.0">(якщо UID &gt; 4B)</tspan><tspan x="437.5" dy="13.0"></tspan><tspan x="437.5" dy="13.0">Отримання:</tspan><tspan x="437.5" dy="13.0">UID3..UID6 + BCC</tspan><tspan x="437.5" dy="13.0"></tspan><tspan x="437.5" dy="13.0">SELECT → SAK</tspan></text>
<line x1="512.0" y1="165.0" x2="528.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="530.0" y="80.0" width="145.0" height="170.0" rx="6" fill="#f3e8ff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="602.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cascade Level 3</text>
<line x1="540.0" y1="114.0" x2="665.0" y2="114.0" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="538.0" y="120.0" width="129.0" height="122.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="602.5" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="602.5" dy="0.0">SEL = 0x97</tspan><tspan x="602.5" dy="13.0">(якщо UID = 10B)</tspan><tspan x="602.5" dy="13.0"></tspan><tspan x="602.5" dy="13.0">Отримання:</tspan><tspan x="602.5" dy="13.0">UID6..UID9 + BCC</tspan><tspan x="602.5" dy="13.0"></tspan><tspan x="602.5" dy="13.0">Перехід у ACTIVE</tspan></text>
<rect x="160.0" y="275.0" width="400.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">SAK (Select Acknowledge) завершує вибір мітки:</tspan><tspan x="360.0" dy="13.0">SAK bit 3 = 0 (Сумісна з ISO 14443-4) → Надсилається RATS</tspan><tspan x="360.0" dy="13.0">SAK bit 3 = 1 (MIFARE Classic / Proprietary)</tspan></text>
</svg>