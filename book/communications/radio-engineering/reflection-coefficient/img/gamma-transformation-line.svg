<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація Г(l) = Г_L e⁻²ʲᵇˡ при русі вздовж лінії передачі</text>
<rect x="40.0" y="60.0" width="760.0" height="110.0" rx="6" fill="#f8fafc" stroke="#2c3e50" stroke-width="1.5"/>
<line x1="60.0" y1="95.0" x2="680.0" y2="95.0" stroke="#2c3e50" stroke-width="2.5"/>
<line x1="60.0" y1="135.0" x2="680.0" y2="135.0" stroke="#2c3e50" stroke-width="2.5"/>
<rect x="680.0" y="80.0" width="100.0" height="70.0" rx="4" fill="#f5eeed" stroke="#8e44ad" stroke-width="2.0"/>
<text x="730.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Z_L (Г_L)</text>
<line x1="650.0" y1="155.0" x2="150.0" y2="155.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Відстань l від навантаження до генератора (рух за годинниковою стрілкою на Г-площині)</text>
<circle cx="250.0" cy="310.0" r="90.0" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
<line x1="140.0" y1="310.0" x2="360.0" y2="310.0" stroke="#7f8c8d" stroke-width="1.0"/>
<line x1="250.0" y1="200.0" x2="250.0" y2="420.0" stroke="#7f8c8d" stroke-width="1.0"/>
<line x1="250.0" y1="310.0" x2="313.6" y2="246.4" stroke="#8e44ad" stroke-width="2.0"/>
<circle cx="313.6" cy="246.4" r="4.0" fill="#8e44ad" stroke="#8e44ad" stroke-width="1.5"/>
<text x="328.6" y="241.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Г_L (l = 0)</text>
<line x1="250.0" y1="310.0" x2="264.0" y2="398.9" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="264.0" cy="398.9" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="249.0" y="413.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Г(l) = Г_L e⁻²ʲᵇˡ</text>
<text x="290.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2βl</text>
<rect x="420.0" y="200.0" width="390.0" height="220.0" rx="6" fill="#edf2f7" stroke="#2c3e50" stroke-width="1.5"/><text x="615.0" y="248.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Ключові властивості трансформації Г(l):</tspan><tspan x="615.0" dy="11.7"></tspan><tspan x="615.0" dy="11.7">1. Періодичність λ/2 (180° по довжині = 360° на площині):</tspan><tspan x="615.0" dy="11.7">   Г(l + λ/2) = Г(l) e⁻²ʲ⁽²ᵖ/ˡ⁾⁽ˡ⁺ˡ/²⁾ = Г(l) e⁻²ʲᵖ = Г(l)</tspan><tspan x="615.0" dy="11.7">   Імпеданс лінії повторюється кожні пів хвилі.</tspan><tspan x="615.0" dy="11.7"></tspan><tspan x="615.0" dy="11.7">2. Чвертьхвильовий трансформатор λ/4 (90° по довжині = 180° на площині):</tspan><tspan x="615.0" dy="11.7">   Г(l + λ/4) = −Г(l)</tspan><tspan x="615.0" dy="11.7">   Інверсія імпедансу: Z_in = Z₀² / Z_L (коротке стає розривом).</tspan><tspan x="615.0" dy="11.7"></tspan><tspan x="615.0" dy="11.7">3. Втрати в лінії (α &gt; 0):</tspan><tspan x="615.0" dy="11.7">   Модуль спадає: |Г(l)| = |Г_L| e⁻²ᵃˡ (спіраль до центру Г = 0).</tspan></text>
</svg>