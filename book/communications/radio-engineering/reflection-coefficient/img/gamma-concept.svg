<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа розділу лінії передачі Z₀ та навантаження Z_L</text>
<rect x="40.0" y="60.0" width="480.0" height="230.0" rx="8" fill="#f8fafc" stroke="#2c3e50" stroke-width="2.0"/>
<text x="280.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Двопровідна лінія передачі (хвильовий опір Z₀)</text>
<line x1="60.0" y1="130.0" x2="520.0" y2="130.0" stroke="#2c3e50" stroke-width="3.0"/>
<line x1="60.0" y1="230.0" x2="520.0" y2="230.0" stroke="#2c3e50" stroke-width="3.0"/>
<line x1="100.0" y1="160.0" x2="360.0" y2="160.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="230.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Падаюча хвиля V⁺ = V₀ e⁻ʲᵇᶻ</text>
<line x1="360.0" y1="200.0" x2="100.0" y2="200.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="230.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Відбита хвиля V⁻ = Γ · V⁺ = V₀ Γ e⁺ʲᵇᶻ</text>
<rect x="520.0" y="110.0" width="140.0" height="140.0" rx="6" fill="#f5eeed" stroke="#8e44ad" stroke-width="2.5"/>
<text x="590.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Навантаження</text>
<text x="590.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Z_L = R_L + j X_L</text>
<line x1="520.0" y1="130.0" x2="550.0" y2="130.0" stroke="#2c3e50" stroke-width="3.0"/>
<line x1="520.0" y1="230.0" x2="550.0" y2="230.0" stroke="#2c3e50" stroke-width="3.0"/>
<circle cx="520.0" cy="130.0" r="4.0" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/>
<circle cx="520.0" cy="230.0" r="4.0" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.5"/>
<rect x="40.0" y="310.0" width="760.0" height="95.0" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="1.5"/><text x="420.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Гранична умова на межі z = 0 (безперервність напруги та струму):</tspan><tspan x="420.0" dy="16.9">V(0) = V⁺ + V⁻,   I(0) = (V⁺ − V⁻) / Z₀ = V(0) / Z_L</tspan><tspan x="420.0" dy="16.9">Формула коефіцієнта відбиття:  Γ_L = V⁻ / V⁺ = (Z_L − Z₀) / (Z_L + Z₀)</tspan></text>
</svg>