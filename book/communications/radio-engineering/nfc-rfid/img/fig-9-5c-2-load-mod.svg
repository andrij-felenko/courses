<text x="400.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це відбитий опір у дії (§2.2.6 і вставка про n²): навантаження вторинного контуру</text>
