<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="740.0" height="300.0" rx="8" fill="#f9fafb" stroke="#333333" stroke-width="1.0"/>
<text x="380.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл шумів у каскадному приймальному тракті</text>
<rect x="30.7" y="78.4" width="198.6" height="63.2" rx="6" fill="#e8f4ec" stroke="#27ae60" stroke-width="2.0"/><text x="130.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Каскад 1: LNA</tspan><tspan x="130.0" dy="15.6">NF1 = 1.0 dB (F1 = 1.26)</tspan><tspan x="130.0" dy="15.6">G1 = 18 dB (G1 = 63.1)</tspan></text>
<line x1="220.0" y1="110.0" x2="270.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="287.9" y="78.4" width="184.2" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Каскад 2: Фільтр</tspan><tspan x="380.0" dy="15.6">NF2 = 2.0 dB (F2 = 1.58)</tspan><tspan x="380.0" dy="15.6">G2 = -2.0 dB (G2 = 0.63)</tspan></text>
<line x1="490.0" y1="110.0" x2="540.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="537.9" y="78.4" width="184.2" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Каскад 3: Змішувач</tspan><tspan x="630.0" dy="15.6">NF3 = 8.0 dB (F3 = 6.31)</tspan><tspan x="630.0" dy="15.6">G3 = 10 dB</tspan></text>
<line x1="50.0" y1="180.0" x2="710.0" y2="180.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула Фрііса: F_total = F1 + (F2 - 1)/G1 + (F3 - 1)/(G1·G2)</text>
<rect x="82.4" y="228.4" width="95.2" height="63.2" rx="6" fill="#e8f4ec" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Внесок LNA:</tspan><tspan x="130.0" dy="15.6">F1 = 1.259</tspan><tspan x="130.0" dy="15.6">(Визначний)</tspan></text>
<text x="245.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<rect x="305.0" y="228.4" width="150.0" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Внесок фільтра:</tspan><tspan x="380.0" dy="15.6">0.58 / 63.1 = 0.009</tspan><tspan x="380.0" dy="15.6">(Мізерний)</tspan></text>
<text x="515.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<rect x="555.0" y="228.4" width="150.0" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Внесок змішувача:</tspan><tspan x="630.0" dy="15.6">5.31 / 39.8 = 0.133</tspan><tspan x="630.0" dy="15.6">(Придушений в G1)</tspan></text>
</svg>