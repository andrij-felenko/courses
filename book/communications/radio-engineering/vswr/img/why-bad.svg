<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чим насправді небезпечне неузгодження</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">втрата дальності — це ще пів біди; гірше — загроза самому передавачу</text>
<rect x="45.0" y="86.0" width="270.0" height="210.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="180.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📉</text>
<text x="180.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Менше дальності</text>
<text x="180.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Відбита потужність не дійшла</text>
<text x="180.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">до антени — мінус децибели</text>
<text x="180.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бюджету лінії.</text>
<rect x="335.0" y="86.0" width="270.0" height="210.0" rx="12" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="470.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">🔥</text>
<text x="470.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Загроза передавачу</text>
<text x="470.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Відбита хвиля вертається в</text>
<text x="470.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">підсилювач і гріє його —</text>
<text x="470.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">потужні TX можуть згоріти.</text>
<rect x="625.0" y="86.0" width="270.0" height="210.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="760.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">📵</text>
<text x="760.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Передавач «душить» себе</text>
<text x="760.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Захист бачить високий КСХ і</text>
<text x="760.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">САМ зрізає потужність —</text>
<text x="760.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дальність падає ще більше.</text>
</svg>
