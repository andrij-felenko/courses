<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прив'язка до каналу: блокування MitM-проксі у SCRAM-PLUS</text>
<rect x="124.0" y="93.0" width="72.1" height="34.0" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Клієнт</tspan></text>
<rect x="489.2" y="85.0" width="221.5" height="49.9" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Зловмисний MitM-проксі</tspan><tspan x="600.0" dy="16.9">(підміняє сертифікат TLS)</tspan></text>
<rect x="960.6" y="93.0" width="158.9" height="34.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">Справжній Сервер</tspan></text>
<line x1="230.0" y1="180.0" x2="470.0" y2="180.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">TLS-з'єднання №1 (Сертифікат проксі)</text>
<line x1="730.0" y1="180.0" x2="960.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="850.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">TLS-з'єднання №2 (Сертифікат сервера)</text>
<rect x="176.4" y="240.2" width="327.2" height="59.6" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/><text x="340.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Клієнт бере відбиток сертифіката із TLS №1:</tspan><tspan x="340.0" dy="14.3">tls-server-end-point = SHA-256(Сертифікат_Проксі)</tspan><tspan x="340.0" dy="14.3">Вставляє у поле c=... повідомлення AuthMessage</tspan></text>
<rect x="671.3" y="240.2" width="377.4" height="59.6" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/><text x="860.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Сервер бере відбиток сертифіката із TLS №2:</tspan><tspan x="860.0" dy="14.3">tls-server-end-point = SHA-256(Сертифікат_Сервера)</tspan><tspan x="860.0" dy="14.3">Очікує цей відбиток у полі c=... повідомлення AuthMessage</tspan></text>
<line x1="340.0" y1="345.0" x2="600.0" y2="400.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="400.0" x2="860.0" y2="345.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.1" y="388.4" width="539.8" height="63.2" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="408.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Проксі пересилає SCRAM ClientProof без змін.</tspan><tspan x="600.0" dy="15.6">Але змінити поле c=... проксі не може, бо воно накрите підписом ClientProof!</tspan><tspan x="600.0" dy="15.6">А розрахувати новий ClientProof без пароля проксі не вміє.</tspan></text>
<rect x="243.4" y="526.6" width="713.2" height="66.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="547.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Результат перевірки на сервері:</tspan><tspan x="600.0" dy="16.9">AuthMessage клієнта (з відбитком проксі)  ≠  AuthMessage сервера (з відбитком сервера)</tspan><tspan x="600.0" dy="16.9">Сервер виявляє розрив каналу і скидає сесію: e=channel-bindings-dont-match</tspan></text>
<text x="600.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">SCRAM-SHA-256-PLUS робить підміну TLS-сертифіката безглуздою навіть за наявності скомпрометованого кореневого CA</text>
</svg>