<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.6 -10 1287.2 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-12.6" y="-10" width="1287.2" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей безпеки: Plaintext vs Digest vs SCRAM</text>
<rect x="87.0" y="78.5" width="286.0" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="230.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">1. Пасивне прослуховування каналу</tspan></text>
<rect x="119.6" y="174.0" width="220.9" height="32.0" rx="6" fill="#eef3fb" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Відкритий текст (Plaintext)</tspan></text>
<rect x="129.1" y="239.5" width="201.8" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="230.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Пароль перехоплюється миттєво</tspan></text>
<line x1="230.0" y1="215.0" x2="230.0" y2="232.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="138.2" y="334.0" width="183.7" height="32.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">HTTP Digest / CRAM-MD5</tspan></text>
<rect x="10.0" y="399.5" width="440.1" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="230.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Пароль не їде, але виклик MD5 вразливий до швидкого офлайн-перебору</tspan></text>
<line x1="230.0" y1="375.0" x2="230.0" y2="392.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="145.6" y="494.0" width="168.8" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="514.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">SCRAM (PBKDF2 + XOR)</tspan></text>
<rect x="-2.6" y="559.5" width="465.2" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="230.0" y="566.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Їде ClientProof; офлайн-перебір вимагає тисяч ітерацій PBKDF2 на пароль</tspan></text>
<line x1="230.0" y1="535.0" x2="230.0" y2="552.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="481.0" y="78.5" width="277.9" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="620.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">2. Викрадення бази даних сервера</tspan></text>
<rect x="509.6" y="174.0" width="220.9" height="32.0" rx="6" fill="#eef3fb" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Відкритий текст (Plaintext)</tspan></text>
<rect x="506.5" y="239.5" width="226.9" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="620.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Усі паролі скомпрометовано одразу</tspan></text>
<line x1="620.0" y1="215.0" x2="620.0" y2="232.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="539.3" y="334.0" width="161.4" height="32.0" rx="6" fill="#eef3fb" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">HTTP Digest (H(A1))</tspan></text>
<rect x="396.8" y="399.5" width="446.4" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="620.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Хеш H(A1) є еквівалентом пароля — зловмисник входить без зламу хешу!</tspan></text>
<line x1="620.0" y1="375.0" x2="620.0" y2="392.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="502.1" y="494.0" width="235.8" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="514.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">SCRAM (StoredKey + ServerKey)</tspan></text>
<rect x="365.5" y="559.5" width="509.1" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="620.0" y="596.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">StoredKey не дає увійти (потрібен ClientKey); перебір захищено сіллю та PBKDF2</tspan></text>
<line x1="620.0" y1="535.0" x2="620.0" y2="552.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="842.8" y="78.5" width="334.3" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="1010.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">3. Фальшивий сервер / Man-in-the-Middle</tspan></text>
<rect x="899.6" y="174.0" width="220.9" height="32.0" rx="6" fill="#eef3fb" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">Відкритий текст (Plaintext)</tspan></text>
<rect x="902.8" y="239.5" width="214.4" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="1010.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Фальшивий сервер забирає пароль</tspan></text>
<line x1="1010.0" y1="215.0" x2="1010.0" y2="232.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="918.2" y="334.0" width="183.7" height="32.0" rx="6" fill="#eef3fb" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">HTTP Digest / CRAM-MD5</tspan></text>
<rect x="786.8" y="399.5" width="446.4" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="1010.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Одностороння автентифікація: клієнт не перевіряє справжність сервера</tspan></text>
<line x1="1010.0" y1="375.0" x2="1010.0" y2="392.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="933.0" y="494.0" width="153.9" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="514.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">SCRAM-SHA-256-PLUS</tspan></text>
<rect x="755.5" y="559.5" width="509.1" height="31.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="1010.0" y="578.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">Взаємна автентифікація (ServerSignature) + прив'язка до TLS-каналу блокує MitM</tspan></text>
<line x1="1010.0" y1="535.0" x2="1010.0" y2="552.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
