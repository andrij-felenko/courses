<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="114.0" y="41.0" width="72.1" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="62.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Клієнт</tspan></text>
<line x1="150.0" y1="82.0" x2="150.0" y2="730.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="1014.0" y="41.0" width="72.1" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="62.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">Сервер</tspan></text>
<line x1="1050.0" y1="82.0" x2="1050.0" y2="730.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="150.0" y1="130.0" x2="1050.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1. client-first: ім'я користувача та випадковий nonce клієнта</text>
<rect x="411.3" y="162.3" width="377.4" height="45.3" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="600.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">n=alice, r=fyko+d2lwyECACBYghMXFGW3</tspan><tspan x="600.0" dy="14.3">(заголовок зв'язування n,, вказує: канал без TLS-binding)</tspan></text>
<line x1="1050.0" y1="270.0" x2="150.0" y2="270.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">2. server-first: спільний nonce, сіль та лічильник ітерацій</text>
<rect x="405.0" y="305.2" width="389.9" height="59.6" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="600.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">r=fyko+d2lwyECACBYghMXFGW3B96duGRZSbNHH3ftuGJqtryh,</tspan><tspan x="600.0" dy="14.3">s=QSXCR+Q6sek8bf92, i=4096</tspan><tspan x="600.0" dy="14.3">Сервер видобуває зі своєї БД: Salt, i, StoredKey, ServerKey</tspan></text>
<rect x="163.2" y="390.9" width="333.5" height="88.2" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/><text x="330.0" y="410.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Клієнт рахує:</tspan><tspan x="330.0" dy="14.3">SaltedPassword = PBKDF2(Pass, Salt, i)</tspan><tspan x="330.0" dy="14.3">ClientKey = HMAC(SaltedPassword, &quot;Client Key&quot;)</tspan><tspan x="330.0" dy="14.3">StoredKey = H(ClientKey)</tspan><tspan x="330.0" dy="14.3">ClientProof = ClientKey ⊕ HMAC(StoredKey, AuthMsg)</tspan></text>
<line x1="150.0" y1="535.0" x2="1050.0" y2="535.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">3. client-final: канал, повний nonce і маскований доказ ClientProof</text>
<rect x="364.3" y="548.0" width="471.4" height="73.9" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="600.0" y="567.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">c=biws, r=fyko+d2lwyECACBYghMXFGW3B96duGRZSbNHH3ftuGJqtryh,</tspan><tspan x="600.0" dy="14.3">p=v0X8v3Bz2T0CJGbJQII0GeKPxjw=</tspan><tspan x="600.0" dy="14.3">Сервер знімає маску: ClientKey' = ClientProof ⊕ HMAC(StoredKey, AuthMsg)</tspan><tspan x="600.0" dy="14.3">Перевірка: H(ClientKey') == StoredKey  ⇒  клієнт справжній!</tspan></text>
<line x1="1050.0" y1="665.0" x2="150.0" y2="665.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="654.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">4. server-final: підпис сервера ServerSignature (v=...)</text>
<rect x="395.6" y="692.4" width="408.7" height="45.3" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.5"/><text x="600.0" y="711.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">v=rmF9pqV8S7suAoZWja4TGst0VaE=</tspan><tspan x="600.0" dy="14.3">Клієнт звіряє з HMAC(ServerKey, AuthMsg)  ⇒  сервер справжній!</tspan></text>
</svg>