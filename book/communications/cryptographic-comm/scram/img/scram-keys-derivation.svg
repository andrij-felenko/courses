<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево виведення ключів та доказів у SCRAM</text>
<rect x="334.0" y="68.5" width="552.0" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="610.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Пароль користувача (Password)   +   Сіль (Salt)   +   Ітерації (i)</tspan></text>
<line x1="610.0" y1="110.0" x2="610.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="401.6" y="151.2" width="416.7" height="47.6" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/><text x="610.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">PBKDF2-HMAC-SHA256 (Password, Salt, i)</tspan><tspan x="610.0" dy="15.6">Повільне обчислення (тисячі ітерацій, захист від перебору)</tspan></text>
<line x1="610.0" y1="205.0" x2="610.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="362.2" y="245.1" width="495.5" height="49.9" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="610.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">SaltedPassword (солений майстер-секрет)</tspan><tspan x="610.0" dy="16.9">НІКОЛИ не зберігається на сервері й не передається мережею!</tspan></text>
<line x1="610.0" y1="305.0" x2="610.0" y2="335.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="310.0" y1="335.0" x2="910.0" y2="335.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="310.0" y1="335.0" x2="310.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="910.0" y1="335.0" x2="910.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="128.9" y="371.2" width="362.2" height="47.6" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="310.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">ClientKey = HMAC(SaltedPassword, &quot;Client Key&quot;)</tspan><tspan x="310.0" dy="15.6">Секретний ключ клієнта</tspan></text>
<line x1="310.0" y1="430.0" x2="310.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="118.7" y="468.4" width="382.5" height="63.2" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.5"/><text x="310.0" y="488.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">StoredKey = H(ClientKey)</tspan><tspan x="310.0" dy="15.6">Зберігається в базі даних сервера!</tspan><tspan x="310.0" dy="15.6">Односторонній геш: з StoredKey не відновити ClientKey</tspan></text>
<line x1="310.0" y1="545.0" x2="310.0" y2="585.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="142.7" y="591.2" width="334.6" height="47.6" rx="6" fill="#ffffff" stroke="#c8d6ea" stroke-width="1.5"/><text x="310.0" y="611.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">ClientSignature = HMAC(StoredKey, AuthMessage)</tspan><tspan x="310.0" dy="15.6">Підпис контенту переговорів на StoredKey</tspan></text>
<line x1="310.0" y1="650.0" x2="310.0" y2="685.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="95.4" y="691.2" width="429.2" height="47.6" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="711.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">ClientProof = ClientKey ⊕ ClientSignature</tspan><tspan x="310.0" dy="15.6">Маскований доказ: їде мережею, не розкриваючи ClientKey</tspan></text>
<rect x="728.9" y="363.4" width="362.2" height="63.2" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.5"/><text x="910.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">ServerKey = HMAC(SaltedPassword, &quot;Server Key&quot;)</tspan><tspan x="910.0" dy="15.6">Зберігається в базі даних сервера!</tspan><tspan x="910.0" dy="15.6">Секретний ключ автентифікації сервера</tspan></text>
<line x1="910.0" y1="445.0" x2="910.0" y2="585.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="729.0" y="591.2" width="362.0" height="47.6" rx="6" fill="#ffffff" stroke="#e6d3b3" stroke-width="1.5"/><text x="910.0" y="611.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">ServerSignature = HMAC(ServerKey, AuthMessage)</tspan><tspan x="910.0" dy="15.6">Підпис сервера: передається клієнту у виразі v=...</tspan></text>
<line x1="910.0" y1="650.0" x2="910.0" y2="685.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="714.0" y="691.2" width="392.0" height="47.6" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="711.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Клієнт звіряє ServerSignature зі своїм розрахунком</tspan><tspan x="910.0" dy="15.6">Гарантує захист від фальшивого сервера</tspan></text>
</svg>