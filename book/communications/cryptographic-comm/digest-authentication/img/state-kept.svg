<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан, який кожен бік тримає між запитами</text>
<rect x="264.0" y="79.0" width="72.1" height="34.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="300.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Клієнт</tspan></text>
<rect x="146.4" y="199.4" width="307.3" height="141.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="219.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">лічильник nc на КОЖЕН виклик окремо —</tspan><tspan x="300.0" dy="15.6">скільки запитів уже пішло з цим nonce</tspan><tspan x="300.0" dy="15.6"></tspan><tspan x="300.0" dy="15.6">для -sess: ключ сеансу і той самий cnonce,</tspan><tspan x="300.0" dy="15.6">поки живе виклик</tspan><tspan x="300.0" dy="15.6"></tspan><tspan x="300.0" dy="15.6">сам виклик — щоб наступного разу</tspan><tspan x="300.0" dy="15.6">не марнувати зайвий оберт на 401</tspan></text>
<line x1="300.0" y1="128.0" x2="300.0" y2="172.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="844.0" y="79.0" width="72.1" height="34.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="880.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Сервер</tspan></text>
<rect x="733.2" y="207.2" width="293.6" height="125.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">секрет підпису — один на всі машини;</tspan><tspan x="880.0" dy="15.6">виклик перевіряє сам себе, таблиці немає</tspan><tspan x="880.0" dy="15.6"></tspan><tspan x="880.0" dy="15.6">H(A1) ОКРЕМО на кожен алгоритм:</tspan><tspan x="880.0" dy="15.6">інший геш — інше значення у сховищі</tspan><tspan x="880.0" dy="15.6"></tspan><tspan x="880.0" dy="15.6">найбільший прийнятий nc на кожен виклик</tspan></text>
<line x1="880.0" y1="128.0" x2="880.0" y2="172.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="80.0" x2="590.0" y2="400.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="313.2" y="466.6" width="553.5" height="66.8" rx="6" fill="#eef3fb" stroke="#c7d5ea" stroke-width="1.5"/><text x="590.0" y="487.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Самоперевірний виклик прибирає таблицю виданих чисел — але не звірку nc.</tspan><tspan x="590.0" dy="16.9">Захист від повтору без пам'яті не буває: забудьте вжиті номери —</tspan><tspan x="590.0" dy="16.9">і перехоплений запит пройде вдруге, хоч би яким свіжим був виклик.</tspan></text>
</svg>