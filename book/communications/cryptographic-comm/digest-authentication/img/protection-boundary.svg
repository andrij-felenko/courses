<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="46.0" width="1140.0" height="190.0" rx="10" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.2"/>
<rect x="145.8" y="125.5" width="68.4" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Клієнт</tspan></text>
<rect x="1025.8" y="125.5" width="68.4" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">Сервер</tspan></text>
<line x1="214.2" y1="142.0" x2="1025.8" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Заголовок із доказом — захищено</text>
<text x="620.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Метод, шлях, заголовки, тіло запиту й уся відповідь — відкритим текстом</text>
<line x1="250.0" y1="240.0" x2="250.0" y2="300.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175.5" y="323.5" width="149.0" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="250.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Хто слухає канал</tspan></text>
<rect x="152.2" y="425.9" width="195.6" height="88.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Бачить nonce і response.</tspan><tspan x="250.0" dy="14.3">Повторити не може — але може</tspan><tspan x="250.0" dy="14.3">вдома перебирати паролі</tspan><tspan x="250.0" dy="14.3">мільярдами за секунду,</tspan><tspan x="250.0" dy="14.3">доки не збіжиться геш.</tspan></text>
<line x1="620.0" y1="240.0" x2="620.0" y2="300.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="521.3" y="323.5" width="197.3" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="620.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Хто вкрав файл сервера</tspan></text>
<rect x="522.2" y="425.9" width="195.6" height="88.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">У файлі лежить H(A1) —</tspan><tspan x="620.0" dy="14.3">цього досить, щоб увійти.</tspan><tspan x="620.0" dy="14.3">Повільний солений геш сюди</tspan><tspan x="620.0" dy="14.3">не вставити: формула вимагає</tspan><tspan x="620.0" dy="14.3">рівно H(A1) з обох боків.</tspan></text>
<line x1="990.0" y1="240.0" x2="990.0" y2="300.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="895.4" y="323.5" width="189.3" height="33.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="990.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Хто сидить посередині</tspan></text>
<rect x="889.1" y="425.9" width="201.8" height="88.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Підміняє виклик Digest</tspan><tspan x="990.0" dy="14.3">на Basic — і браузер віддає</tspan><tspan x="990.0" dy="14.3">пароль відкрито.</tspan><tspan x="990.0" dy="14.3">Схема цього не бачить,</tspan><tspan x="990.0" dy="14.3">рятує лише впертість клієнта.</tspan></text>
<text x="620.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Схема боронить передавання секрету, а не сам секрет:</text>
<text x="620.0" y="664.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">слабкий пароль лишається слабким, а сховище сервера — беззахисним</text>
</svg>