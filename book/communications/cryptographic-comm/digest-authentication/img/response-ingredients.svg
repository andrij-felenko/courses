<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="344.9" y="48.5" width="550.1" height="35.0" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="620.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">response = H( H(A1) : nonce : nc : cnonce : qop : H(A2) )</tspan></text>
<text x="620.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Шість складників — шість різних загроз</text>
<rect x="180.6" y="194.0" width="238.9" height="32.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="300.0" y="214.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">H(A1) = H(ім'я : realm : пароль)</tspan></text>
<rect x="770.3" y="180.2" width="239.4" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Сервер тримає не пароль, а цей геш;</tspan><tspan x="890.0" dy="14.3">realm розводить один пароль</tspan><tspan x="890.0" dy="14.3">на різні служби</tspan></text>
<line x1="425.4" y1="210.0" x2="764.3" y2="210.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="204.5" y="294.0" width="191.0" height="32.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="300.0" y="314.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">nonce — число від сервера</tspan></text>
<rect x="789.1" y="287.4" width="201.8" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Доказ живе рівно один виклик:</tspan><tspan x="890.0" dy="14.3">підслухане завтра вже мертве</tspan></text>
<line x1="401.5" y1="310.0" x2="783.1" y2="310.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="201.1" y="394.0" width="197.8" height="32.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="300.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">cnonce — число від клієнта</tspan></text>
<rect x="795.4" y="380.2" width="189.3" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Сервер не підсуне виклик,</tspan><tspan x="890.0" dy="14.3">під який має готову таблицю</tspan><tspan x="890.0" dy="14.3">відповідей</tspan></text>
<line x1="404.9" y1="410.0" x2="789.4" y2="410.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="214.8" y="494.0" width="170.5" height="32.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="300.0" y="514.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">nc — лічильник запитів</tspan></text>
<rect x="804.8" y="487.4" width="170.5" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="506.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Та сама відповідь удруге</tspan><tspan x="890.0" dy="14.3">видає повтор одразу</tspan></text>
<line x1="391.2" y1="510.0" x2="798.8" y2="510.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="221.6" y="594.0" width="156.8" height="32.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="300.0" y="614.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">qop — рівень захисту</tspan></text>
<rect x="786.0" y="587.4" width="208.1" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="606.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Всередині геша, тож посередник</tspan><tspan x="890.0" dy="14.3">не зіб'є його на слабший</tspan></text>
<line x1="384.4" y1="610.0" x2="780.0" y2="610.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="214.8" y="694.0" width="170.5" height="32.0" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="300.0" y="714.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">H(A2) = H(метод : URI)</tspan></text>
<rect x="801.6" y="680.2" width="176.8" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="699.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Доказ прив'язаний до дії:</tspan><tspan x="890.0" dy="14.3">перехоплений GET не стане</tspan><tspan x="890.0" dy="14.3">DELETE над іншим ресурсом</tspan></text>
<line x1="391.2" y1="710.0" x2="795.6" y2="710.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>