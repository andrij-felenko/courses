<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Катастрофічний колапс автентифікації та конфіденційності при повторі Nonce</text>
<rect x="50.0" y="75.0" width="300.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="200.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Пакет 1: Enc(K, N, A₁, P₁)</tspan><tspan x="200.0" dy="15.6">C₁ = P₁ ⊕ KS(N)</tspan><tspan x="200.0" dy="15.6">T₁ = GHASH_H(A₁, C₁) ⊕ AES_K(J₀)</tspan></text>
<rect x="50.0" y="185.0" width="300.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="200.0" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Пакет 2: Enc(K, N, A₂, P₂)</tspan><tspan x="200.0" dy="15.6">C₂ = P₂ ⊕ KS(N)   [той самий Nonce!]</tspan><tspan x="200.0" dy="15.6">T₂ = GHASH_H(A₂, C₂) ⊕ AES_K(J₀)</tspan></text>
<rect x="410.0" y="75.0" width="310.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="565.0" y="98.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">1. Витік відкритого тексту (Two-Time Pad)</tspan><tspan x="565.0" dy="15.6">C₁ ⊕ C₂ = P₁ ⊕ P₂</tspan><tspan x="565.0" dy="15.6">Гамма повністю взаємознищується,</tspan><tspan x="565.0" dy="15.6">розкриваючи XOR відкритих даних</tspan></text>
<rect x="410.0" y="185.0" width="310.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="565.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">2. Знищення маски тегу</tspan><tspan x="565.0" dy="14.3">T₁ ⊕ T₂ = GHASH_H(A₁, C₁) ⊕ GHASH_H(A₂, C₂)</tspan><tspan x="565.0" dy="14.3">Маска AES_K(J₀) скоротилася!</tspan><tspan x="565.0" dy="14.3">Маємо поліном від невідомого H</tspan></text>
<line x1="355.0" y1="112.0" x2="405.0" y2="112.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="355.0" y1="222.0" x2="405.0" y2="222.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="770.0" y="115.0" width="260.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="900.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">3. Відновлення ключа H</tspan><tspan x="900.0" dy="15.6">Знаходження коренів полінома</tspan><tspan x="900.0" dy="15.6">у полі GF(2¹²⁸) дає підключ H.</tspan><tspan x="900.0" dy="15.6"></tspan><tspan x="900.0" dy="15.6">Наслідок:</tspan><tspan x="900.0" dy="15.6">Зловмисник довільно підробляє</tspan><tspan x="900.0" dy="15.6">теги для будь-яких пакетів!</tspan></text>
<line x1="725.0" y1="230.0" x2="765.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="360.0" width="980.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="540.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Захист у сучасних протоколах (TLS 1.3, WireGuard, QUIC):</tspan><tspan x="540.0" dy="15.6">• Суворо монотонний 64-бітний лічильник sequence_number для кожного пакета (Nonce = IV_base ⊕ SeqNum).</tspan><tspan x="540.0" dy="15.6">• Автоматичний розрив сесії / переузгодження ключів (rekeying) до досягнення ліміту лічильника.</tspan><tspan x="540.0" dy="15.6">• Використання SIV-режимів (AES-GCM-SIV, RFC 8452), стійких до повтору одноразових чисел.</tspan></text>
</svg>