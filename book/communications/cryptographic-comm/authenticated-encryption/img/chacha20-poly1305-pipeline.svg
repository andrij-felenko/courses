<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр та генерація одноразового ключа в ChaCha20-Poly1305 (RFC 8439)</text>
<rect x="60.0" y="60.0" width="240.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="180.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Key (256b) + Nonce (96b)</tspan><tspan x="180.0" dy="16.9">Спільні секретні параметри</tspan></text>
<rect x="380.0" y="60.0" width="260.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="510.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">ChaCha20 Блок 0 (Counter = 0)</tspan><tspan x="510.0" dy="16.9">Генерує перші 64 байти гами</tspan></text>
<line x1="305.0" y1="85.0" x2="375.0" y2="85.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="710.0" y="60.0" width="310.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="865.0" y="86.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">ChaCha20 Блоки 1..N (Counter ≥ 1)</tspan><tspan x="865.0" dy="16.9">Шифрують відкритий текст P ⊕ KeyStream</tspan></text>
<line x1="305.0" y1="95.0" x2="705.0" y2="85.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="380.0" y="160.0" width="260.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="510.0" y="190.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Розподіл 64 байтів Блока 0:</tspan><tspan x="510.0" dy="11.7">• Перші 16 Б → ключ r (затискається / clamped)</tspan><tspan x="510.0" dy="11.7">• Наступні 16 Б → секрет s</tspan><tspan x="510.0" dy="11.7">• Решта 32 Б відкидаються</tspan></text>
<line x1="510.0" y1="125.0" x2="510.0" y2="155.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="710.0" y="160.0" width="310.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="865.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Ciphertext C</tspan><tspan x="865.0" dy="16.9">(тіло захищеного пакета)</tspan></text>
<line x1="865.0" y1="125.0" x2="865.0" y2="155.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="260.0" width="240.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="180.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">AAD (асоційовані дані)</tspan><tspan x="180.0" dy="16.9">(заголовки, pad16)</tspan></text>
<rect x="350.0" y="280.0" width="420.0" height="130.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="560.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Автентифікатор Poly1305 за модулем 2¹³⁰ − 5:</tspan><tspan x="560.0" dy="15.6"></tspan><tspan x="560.0" dy="15.6">Acc = (...((pad(A)·r + pad(C))·r + len(A)||len(C))·r)</tspan><tspan x="560.0" dy="15.6">      mod (2¹³⁰ − 5)</tspan><tspan x="560.0" dy="15.6"></tspan><tspan x="560.0" dy="15.6">Фінальний тег T = (Acc + s) mod 2¹²⁸</tspan></text>
<line x1="180.0" y1="315.0" x2="345.0" y2="335.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="510.0" y1="255.0" x2="510.0" y2="275.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="810.0" y1="225.0" x2="680.0" y2="275.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="310.0" width="200.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="920.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">16-байтовий тег T</tspan><tspan x="920.0" dy="16.9">(Poly1305 Tag)</tspan></text>
<line x1="775.0" y1="340.0" x2="815.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="450.0" width="960.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="540.0" y="483.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Перевага над AES-GCM: Абсолютно константний час виконання без табличних підстановок і без потреби в спеціальних апаратних інструкціях CPU. Виняткова стійкість до атак по сторонніх каналах (Side-Channel Attacks).</tspan></text>
</svg>