<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічне доведення неіснування запису: NSEC проти NSEC3</text>
<text x="270.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">NSEC: Лексикографічне кільце імен</text>
<rect x="89.8" y="117.3" width="120.3" height="45.3" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/><text x="150.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">api.example.com.</tspan><tspan x="150.0" dy="14.3">[A, RRSIG, NSEC]</tspan></text>
<rect x="317.3" y="117.3" width="145.4" height="45.3" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/><text x="390.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">mail.example.com.</tspan><tspan x="390.0" dy="14.3">[A, MX, RRSIG, NSEC]</tspan></text>
<rect x="209.8" y="247.3" width="120.3" height="45.3" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/><text x="270.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">www.example.com.</tspan><tspan x="270.0" dy="14.3">[A, RRSIG, NSEC]</tspan></text>
<line x1="220.0" y1="140.0" x2="305.0" y2="140.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="185.0" x2="330.0" y2="240.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="210.0" y1="250.0" x2="160.0" y2="185.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="103.2" y="345.9" width="333.5" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Запит: blog.example.com (не існує)</tspan><tspan x="270.0" dy="14.3">Відповідь: NSEC запис від api до mail.</tspan><tspan x="270.0" dy="14.3">«Між api та mail інших імен немає!»</tspan><tspan x="270.0" dy="14.3">Доказ валідний, але розкриває структуру зони.</tspan><tspan x="270.0" dy="14.3">⚠️ Вразливість Zone Walking: перебір усіх доменів.</tspan></text>
<line x1="540.0" y1="60.0" x2="540.0" y2="540.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="810.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">NSEC3: Гешоване кільце із сіллю</text>
<rect x="623.0" y="117.3" width="114.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">0P9... (H(api))</tspan><tspan x="680.0" dy="14.3">Next: 7T8...</tspan></text>
<rect x="879.8" y="117.3" width="120.3" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="940.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">7T8... (H(mail))</tspan><tspan x="940.0" dy="14.3">Next: B4U...</tspan></text>
<rect x="753.0" y="247.3" width="114.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">B4U... (H(www))</tspan><tspan x="810.0" dy="14.3">Next: 0P9...</tspan></text>
<line x1="755.0" y1="140.0" x2="865.0" y2="140.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="940.0" y1="185.0" x2="875.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="250.0" x2="690.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.1" y="345.9" width="339.8" height="88.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Запит: blog.example.com → H(blog) = 3K2...</tspan><tspan x="810.0" dy="14.3">Відповідь: NSEC3 запис з інтервалом 0P9... → 7T8...</tspan><tspan x="810.0" dy="14.3">Хеш 3K2... строго потрапляє в інтервал [0P9..7T8]!</tspan><tspan x="810.0" dy="14.3">✓ Доказ неіснування без розкриття відкритого імені.</tspan><tspan x="810.0" dy="14.3">Ітерований хеш SHA-1/SHA-256 із сіллю (Salt).</tspan></text>
<text x="540.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">NSEC3 захищає приватність внутрішньої топології зони від автоматизованого сканування</text>
</svg>