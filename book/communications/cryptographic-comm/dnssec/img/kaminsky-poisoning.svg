<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атака Камінські: підміна авторитетного сервера в кеші рекурсивного резолвера</text>
<rect x="115.6" y="82.2" width="168.8" height="47.6" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/><text x="200.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Рекурсивний резолвер</tspan><tspan x="200.0" dy="15.6">(Кеш DNS)</tspan></text>
<line x1="200.0" y1="136.0" x2="200.0" y2="620.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="430.7" y="82.2" width="198.6" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Зловмисник (Атакуючий)</tspan><tspan x="530.0" dy="15.6">Генерує випадкові запити</tspan></text>
<line x1="530.0" y1="136.0" x2="530.0" y2="620.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="768.2" y="82.2" width="183.7" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="102.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">Справжній сервер зони</tspan><tspan x="860.0" dy="15.6">(Auth NS: example.com)</tspan></text>
<line x1="860.0" y1="136.0" x2="860.0" y2="620.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<line x1="530.0" y1="190.0" x2="200.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="365.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">1. Запит: a891f.example.com (у кеші немає)</text>
<line x1="200.0" y1="240.0" x2="860.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2. Рекурсивний запит a891f.example.com (TxID: ? Port: ?)</text>
<line x1="530.0" y1="300.0" x2="200.0" y2="300.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="365.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">3. Шквал фальшивих відповідей (перебір TxID 0..65535)</text>
<rect x="179.4" y="353.1" width="371.1" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="365.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Підроблений пакет:</tspan><tspan x="365.0" dy="14.3">• Answer: a891f.example.com → 1.2.3.4</tspan><tspan x="365.0" dy="14.3">• Authority: example.com NS evil.attacker.net  ← ОТРУТА!</tspan><tspan x="365.0" dy="14.3">• Additional: evil.attacker.net A 6.6.6.6</tspan></text>
<line x1="860.0" y1="470.0" x2="200.0" y2="470.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">4. Справжня відповідь: NXDOMAIN (запізнилася)</text>
<rect x="133.1" y="546.2" width="793.8" height="47.6" rx="6" fill="#fdf3e6" stroke="#d97706" stroke-width="1.5"/><text x="530.0" y="566.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Наслідок без DNSSEC: Резолвер кешує evil.attacker.net як новий NS для ВСІЄЇ зони example.com!</tspan><tspan x="530.0" dy="15.6">Захист із DNSSEC: Відповідь 3 відкидається, бо в ній немає валідного RRSIG від справжнього KSK/ZSK зони.</tspan></text>
</svg>