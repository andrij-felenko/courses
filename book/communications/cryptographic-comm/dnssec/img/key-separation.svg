<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розділення ключів у DNSSEC: ZSK, KSK та міст довіри DS</text>
<rect x="60.0" y="70.0" width="960.0" height="140.0" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="190.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Батьківська зона (наприклад, .com)</text>
<rect x="468.8" y="110.2" width="422.4" height="59.6" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="680.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Запис DS (Delegation Signer) для example.com:</tspan><tspan x="680.0" dy="14.3">Key Tag: 54109 | Alg: 13 (ECDSA) | Digest Type: 2 (SHA-256)</tspan><tspan x="680.0" dy="14.3">Digest: SHA-256( «example.com.» + DNSKEY_KSK )</tspan></text>
<line x1="680.0" y1="215.0" x2="680.0" y2="265.0" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="785.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Криптографічний геш-зліпок (хеш KSK)</text>
<rect x="60.0" y="270.0" width="960.0" height="310.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Авторитетна зона (example.com)</text>
<rect x="161.5" y="330.9" width="277.1" height="88.2" rx="6" fill="#fdf3e6" stroke="#d97706" stroke-width="1.5"/><text x="300.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Ключ підпису ключів: KSK (Flag 257)</tspan><tspan x="300.0" dy="14.3">• Довгоживучий (ротація раз на 1–2 роки)</tspan><tspan x="300.0" dy="14.3">• Зберігається у захищеному сховищі (HSM)</tspan><tspan x="300.0" dy="14.3">• Підписує ВИКЛЮЧНО набір DNSKEY RRset</tspan><tspan x="300.0" dy="14.3">• Його публічна частина гешується в DS</tspan></text>
<rect x="596.4" y="330.9" width="327.2" height="88.2" rx="6" fill="#eef3fb" stroke="#3b82f6" stroke-width="1.5"/><text x="760.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Ключ підпису зони: ZSK (Flag 256)</tspan><tspan x="760.0" dy="14.3">• Короткоживучий (ротація кожні 1–3 місяці)</tspan><tspan x="760.0" dy="14.3">• Зберігається на сервері підпису зони</tspan><tspan x="760.0" dy="14.3">• Підписує всі прикладні RRset (A, MX, NSEC)</tspan><tspan x="760.0" dy="14.3">• Ротується локально без участі батьківської зони</tspan></text>
<line x1="460.0" y1="375.0" x2="595.0" y2="375.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">RRSIG(DNSKEY)</text>
<rect x="596.4" y="497.4" width="327.2" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="516.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Прикладні записи зони: A, AAAA, MX, TXT, NSEC3...</tspan><tspan x="760.0" dy="14.3">Підписані щомісячним ZSK → валідні записи RRSIG</tspan></text>
<line x1="760.0" y1="445.0" x2="760.0" y2="480.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="830.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">RRSIG(Data)</text>
</svg>