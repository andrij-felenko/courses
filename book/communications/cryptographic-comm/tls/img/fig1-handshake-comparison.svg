<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="161.2" y="10.5" width="717.5" height="35.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Еволюція рукостискання: затримка встановлення з'єднання та захист метаданих</tspan></text>
<rect x="20.0" y="60.0" width="315.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="177.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">TLS 1.2 (2-RTT Handshake)</text>
<text x="177.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Сертифікат і параметри у відкритому вигляді</text>
<rect x="45.0" y="120.0" width="70.0" height="24.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="80.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">Client</text>
<rect x="235.0" y="120.0" width="70.0" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="270.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Server</text>
<line x1="80.0" y1="144.0" x2="80.0" y2="500.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="270.0" y1="144.0" x2="270.0" y2="500.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="85.0" y1="175.0" x2="265.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="177.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ClientHello (CipherSuites)</text>
<line x1="265.0" y1="220.0" x2="85.0" y2="260.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="177.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">ServerHello, Certificate (Plain)</text>
<text x="177.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">ServerKeyExchange, ServerHelloDone</text>
<text x="30.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="700">1 RTT</text>
<line x1="85.0" y1="280.0" x2="265.0" y2="320.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="177.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ClientKeyExchange</text>
<text x="177.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">ChangeCipherSpec, Finished</text>
<line x1="265.0" y1="335.0" x2="85.0" y2="370.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="177.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ChangeCipherSpec, Finished</text>
<text x="30.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="700">2 RTT</text>
<line x1="85.0" y1="410.0" x2="265.0" y2="440.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="177.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">[Шифровані дані додатку]</text>
<rect x="35.0" y="470.0" width="285.0" height="55.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
<text x="177.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Недоліки TLS 1.2:</text>
<text x="177.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Затримка 2 RTT до першого байта даних</text>
<text x="177.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Відкритий сертифікат розкриває ідентичність</text>
<rect x="355.0" y="60.0" width="325.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="517.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">TLS 1.3 (1-RTT Full Handshake)</text>
<text x="517.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Захищений обмін з першої відповіді</text>
<rect x="380.0" y="120.0" width="70.0" height="24.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="415.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">Client</text>
<rect x="585.0" y="120.0" width="70.0" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="620.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Server</text>
<line x1="415.0" y1="144.0" x2="415.0" y2="500.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="620.0" y1="144.0" x2="620.0" y2="500.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="420.0" y1="180.0" x2="615.0" y2="215.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="517.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">ClientHello</text>
<text x="517.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">+ key_share (ECDH публічний ключ)</text>
<line x1="615.0" y1="240.0" x2="420.0" y2="285.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="517.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">ServerHello + key_share</text>
<rect x="435.0" y="260.0" width="165.0" height="42.0" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.0"/>
<text x="517.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">{EncryptedExtensions, Cert,</text>
<text x="517.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-weight="700"> CertVerify, Finished}</text>
<text x="368.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#047857" text-anchor="middle" font-weight="700">1 RTT</text>
<line x1="420.0" y1="335.0" x2="615.0" y2="365.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="517.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">{Finished} + [Шифровані дані додатку]</text>
<line x1="615.0" y1="395.0" x2="420.0" y2="425.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="517.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">[Шифрована відповідь сервера]</text>
<rect x="370.0" y="470.0" width="295.0" height="55.0" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.0"/>
<text x="517.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#065f46" text-anchor="middle" font-weight="700">Переваги TLS 1.3 (1-RTT):</text>
<text x="517.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#065f46" text-anchor="middle">• Дані надсилаються рівно за 1 RTT</text>
<text x="517.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#065f46" text-anchor="middle">• Сертифікат сервера зашифровано ключем handshake</text>
<rect x="700.0" y="60.0" width="320.0" height="480.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="860.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="700">TLS 1.3 (0-RTT Resumption)</text>
<text x="860.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">Відновлення сесії за допомогою PSK</text>
<rect x="725.0" y="120.0" width="70.0" height="24.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="760.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">Client</text>
<rect x="925.0" y="120.0" width="70.0" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="960.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Server</text>
<line x1="760.0" y1="144.0" x2="760.0" y2="500.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="960.0" y1="144.0" x2="960.0" y2="500.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="765.0" y1="180.0" x2="955.0" y2="215.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="860.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle" font-weight="700">ClientHello + early_data_ext</text>
<text x="860.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle" font-weight="700">+ [0-RTT Early Data (GET /index)]</text>
<text x="715.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b21a8" text-anchor="middle" font-weight="700">0 RTT</text>
<line x1="955.0" y1="250.0" x2="765.0" y2="290.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="860.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">ServerHello (PSK selected)</text>
<text x="860.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">{EncryptedExtensions, Finished}</text>
<text x="860.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">[Шифрована відповідь 200 OK]</text>
<line x1="765.0" y1="335.0" x2="955.0" y2="365.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="860.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">{Finished} (1-RTT Traffic Key)</text>
<rect x="715.0" y="470.0" width="290.0" height="55.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/>
<text x="860.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Застереження щодо 0-RTT:</text>
<text x="860.0" y="504.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Немає прямої секретності (PFS) для 0-RTT</text>
<text x="860.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">• Вразливість до атак повтору (Replay Attacks)</text>
</svg>