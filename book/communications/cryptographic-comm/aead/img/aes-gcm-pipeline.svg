<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та конвеєр режиму AES-GCM (NIST SP 800-38D)</text>
<rect x="50.0" y="60.0" width="220.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="160.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Хеш-ключ Галуа:</tspan><tspan x="160.0" dy="16.9">H = AES_K(0¹²⁸)</tspan></text>
<rect x="340.0" y="60.0" width="180.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="430.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Лічильник CTR:</tspan><tspan x="430.0" dy="16.9">Y₀ = Nonce || 1</tspan></text>
<rect x="550.0" y="60.0" width="180.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="640.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Блоки CTR:</tspan><tspan x="640.0" dy="16.9">Y₁, Y₂, ..., Yₙ</tspan></text>
<rect x="550.0" y="140.0" width="180.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">AES_K(Yᵢ) (шифрогамма)</tspan></text>
<line x1="640.0" y1="115.0" x2="640.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="790.0" y="140.0" width="210.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="895.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Plaintext (P₁, P₂, ...)</tspan></text>
<rect x="670.0" y="220.0" width="240.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="790.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Ciphertext Cᵢ = Pᵢ ⊕ AES_K(Yᵢ)</tspan></text>
<line x1="640.0" y1="190.0" x2="740.0" y2="215.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="890.0" y1="190.0" x2="810.0" y2="215.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="220.0" width="220.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="160.0" y="241.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">AAD (A₁, A₂, ...)</tspan><tspan x="160.0" dy="16.9">доповнені нулями до 16 Б</tspan></text>
<rect x="50.0" y="310.0" width="220.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="160.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Блок довжин:</tspan><tspan x="160.0" dy="16.9">len(A) || len(C)</tspan></text>
<rect x="340.0" y="240.0" width="250.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="483.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="483.0" dy="0.0">Функція GHASH над GF(2¹²⁸):</tspan><tspan x="483.0" dy="15.6">S = (...((A₁·H ⊕ A₂)·H ⊕ ...</tspan><tspan x="483.0" dy="15.6">  ... ⊕ C₁)·H ⊕ ... ⊕ len)·H</tspan><tspan x="483.0" dy="15.6"></tspan><tspan x="483.0" dy="15.6">Незвідний поліном:</tspan><tspan x="483.0" dy="15.6">f(x) = x¹²⁸ + x⁷ + x² + x + 1</tspan></text>
<line x1="160.0" y1="115.0" x2="370.0" y2="235.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="275.0" y1="245.0" x2="335.0" y2="275.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="665.0" y1="250.0" x2="595.0" y2="285.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="275.0" y1="335.0" x2="335.0" y2="335.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="340.0" y="420.0" width="180.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="430.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Маска тегу:</tspan><tspan x="430.0" dy="16.9">AES_K(Y₀)</tspan></text>
<line x1="430.0" y1="115.0" x2="430.0" y2="415.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.0" y="420.0" width="280.0" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="780.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Автентифікаційний тег:</tspan><tspan x="780.0" dy="16.9">Tag T = GHASH(...) ⊕ AES_K(Y₀)</tspan></text>
<line x1="595.0" y1="350.0" x2="710.0" y2="415.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="525.0" y1="445.0" x2="635.0" y2="445.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="500.0" width="980.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="540.0" y="526.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Апаратне прискорення: Інструкції AES-NI для шифрування лічильника та PCLMULQDQ / PMULL для множення в полі GF(2¹²⁸)</tspan></text>
</svg>