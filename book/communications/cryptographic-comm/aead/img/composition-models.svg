<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири архітектурні парадигми захисту повідомлення</text>
<rect x="30.0" y="60.0" width="220.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="140.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Encrypt-and-MAC</text>
<text x="140.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SSH-1</text>
<rect x="45.0" y="125.0" width="190.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="140.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Відкритий текст P</tspan></text>
<line x1="140.0" y1="213.0" x2="140.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="230.0" width="190.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">C = Enc(P)</tspan><tspan x="140.0" dy="15.6">T = MAC(P)</tspan></text>
<line x1="140.0" y1="318.0" x2="140.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="370.0" width="190.0" height="84.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="140.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Вразливість:</tspan><tspan x="140.0" dy="15.6">витік рівності P</tspan><tspan x="140.0" dy="15.6">через детермінований MAC</tspan></text>
<rect x="280.0" y="60.0" width="220.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="390.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">MAC-then-Encrypt</text>
<text x="390.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">SSL 3.0 / TLS 1.0–1.2</text>
<rect x="295.0" y="125.0" width="190.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="390.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Відкритий текст P</tspan></text>
<line x1="390.0" y1="213.0" x2="390.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="295.0" y="230.0" width="190.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="390.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">P' = P || MAC(P)</tspan><tspan x="390.0" dy="15.6">C = Enc(P' || Pad)</tspan></text>
<line x1="390.0" y1="318.0" x2="390.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="295.0" y="370.0" width="190.0" height="84.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="390.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Вразливість:</tspan><tspan x="390.0" dy="15.6">Padding Oracle,</tspan><tspan x="390.0" dy="15.6">Lucky 13, POODLE</tspan></text>
<rect x="530.0" y="60.0" width="220.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Encrypt-then-MAC</text>
<text x="640.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">IPsec ESP / TLS 1.2 EtM</text>
<rect x="545.0" y="125.0" width="190.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="640.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Відкритий текст P</tspan></text>
<line x1="640.0" y1="213.0" x2="640.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="545.0" y="230.0" width="190.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">C = Enc(P)</tspan><tspan x="640.0" dy="15.6">T = MAC(AAD || C)</tspan></text>
<line x1="640.0" y1="318.0" x2="640.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="545.0" y="370.0" width="190.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="640.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Стійкий, але вимагає</tspan><tspan x="640.0" dy="15.6">2 проходів, 2 ключів</tspan><tspan x="640.0" dy="15.6">і ручної збірки</tspan></text>
<rect x="780.0" y="60.0" width="220.0" height="440.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="890.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтегрований AEAD</text>
<text x="890.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">AES-GCM / ChaCha20-Poly</text>
<rect x="795.0" y="125.0" width="190.0" height="84.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/><text x="890.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Plaintext P + AAD</tspan></text>
<line x1="890.0" y1="213.0" x2="890.0" y2="226.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="795.0" y="230.0" width="190.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">(C, T) = AEAD_Enc(K, N, A, P)</tspan></text>
<line x1="890.0" y1="318.0" x2="890.0" y2="366.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="795.0" y="370.0" width="190.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="402.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Єдиний чорний ящик:</tspan><tspan x="890.0" dy="13.0">1 прохід, захист AAD,</tspan><tspan x="890.0" dy="13.0">неможливість розшифрувати до T</tspan></text>
