<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Катастрофа повторного використання Nonce у GCM (Атака Джукса)</text>
<rect x="60.0" y="70.0" width="440.0" height="80.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="280.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Повідомлення 1 (під Nonce N):</tspan><tspan x="280.0" dy="16.9">C₁ = P₁ ⊕ AES_K(CTR₁)</tspan><tspan x="280.0" dy="16.9">Tag T₁ = GHASH(H, C₁) ⊕ AES_K(Y₀)</tspan></text>
<rect x="560.0" y="70.0" width="440.0" height="80.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="780.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Повідомлення 2 (під ТИМ САМИМ Nonce N):</tspan><tspan x="780.0" dy="16.9">C₂ = P₂ ⊕ AES_K(CTR₂)</tspan><tspan x="780.0" dy="16.9">Tag T₂ = GHASH(H, C₂) ⊕ AES_K(Y₀)</tspan></text>
<rect x="230.0" y="185.0" width="600.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="530.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Почленне віднімання / додавання тегів (XOR у GF(2¹²⁸)):</tspan><tspan x="530.0" dy="16.9">T₁ ⊕ T₂ = GHASH(H, C₁) ⊕ GHASH(H, C₂)</tspan><tspan x="530.0" dy="16.9">Спільна маска AES_K(Y₀) повністю скорочується!</tspan></text>
<line x1="280.0" y1="155.0" x2="430.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="155.0" x2="630.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="290.0" width="760.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="530.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Розкриття через многочлен у полі GF(2¹²⁸):</tspan><tspan x="530.0" dy="16.9">(T₁ ⊕ T₂) = (C₁,₁ ⊕ C₂,₁)·H³ ⊕ (C₁,₂ ⊕ C₂,₂)·H² ⊕ (L₁ ⊕ L₂)·H</tspan><tspan x="530.0" dy="16.9">Отримуємо многочлен P(H) = 0 відомого степеня від невідомого ключа H!</tspan></text>
<line x1="530.0" y1="260.0" x2="530.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="400.0" width="440.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="280.0" y="425.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1. Відновлення хеш-ключа H:</tspan><tspan x="280.0" dy="16.9">Знаходження коренів многочлена в GF(2¹²⁸)</tspan><tspan x="280.0" dy="16.9">дає невелику кількість кандидатів на H</tspan></text>
<rect x="560.0" y="400.0" width="440.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="780.0" y="425.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">2. Повна фальсифікація (Universal Forgery):</tspan><tspan x="780.0" dy="16.9">Зловмисник обчислює маску AES_K(Y₀) = T₁ ⊕ GHASH(H, C₁)</tspan><tspan x="780.0" dy="16.9">і може підробити Tag для БУДЬ-ЯКОГО пакета!</tspan></text>
<line x1="400.0" y1="370.0" x2="330.0" y2="395.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="370.0" x2="730.0" y2="395.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>