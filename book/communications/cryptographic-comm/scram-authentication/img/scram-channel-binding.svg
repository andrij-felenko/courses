<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прив'язка до каналу в SCRAM-SHA-256-PLUS (Channel Binding)</text>
<rect x="40.0" y="60.0" width="860.0" height="160.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="70.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Сценарій А: Пряме з'єднання клієнт ↔ сервер</text>
<rect x="60.0" y="105.0" width="200.0" height="95.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Клієнт (Client)</tspan><tspan x="160.0" dy="11.7">Витягує з TLS:</tspan><tspan x="160.0" dy="11.7">tls-server-end-point</tspan><tspan x="160.0" dy="11.7">= SHA-256(Сертифікат сервера)</tspan><tspan x="160.0" dy="11.7">gs2-header: p=tls-server-end-point,,</tspan></text>
<line x1="270.0" y1="150.0" x2="660.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="300.0" y="115.0" width="330.0" height="40.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="465.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">TLS 1.3 Тунель (Сертифікат сервера CERT_A)</tspan><tspan x="465.0" dy="13.0">AuthMessage містить hash(CERT_A)</tspan></text>
<text x="465.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Обидві сторони мають однаковий hash(CERT_A) → Автентифікація успішна!</text>
<rect x="680.0" y="105.0" width="200.0" height="95.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Сервер (Server)</tspan><tspan x="780.0" dy="11.7">Витягує з TLS:</tspan><tspan x="780.0" dy="11.7">tls-server-end-point</tspan><tspan x="780.0" dy="11.7">= SHA-256(Свій сертифікат CERT_A)</tspan><tspan x="780.0" dy="11.7">Перевіряє gs2-header у AuthMessage</tspan></text>
<rect x="40.0" y="245.0" width="860.0" height="175.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="70.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Сценарій Б: Спроба перехоплення MITM (TLS-проксі розриває сесію)</text>
<rect x="60.0" y="290.0" width="190.0" height="115.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Клієнт</tspan><tspan x="155.0" dy="11.7">TLS-сесія 1 із MITM</tspan><tspan x="155.0" dy="11.7">Бачить підроблений CERT_MITM</tspan><tspan x="155.0" dy="11.7">gs2-header містить:</tspan><tspan x="155.0" dy="11.7">hash(CERT_MITM)</tspan><tspan x="155.0" dy="11.7">AuthMessage_1</tspan></text>
<line x1="260.0" y1="345.0" x2="370.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="315.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">TLS Сесія 1</text>
<rect x="380.0" y="290.0" width="180.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Зловмисник (MITM)</tspan><tspan x="470.0" dy="11.7">Має дві окремі сесії:</tspan><tspan x="470.0" dy="11.7">1. Клієнт ↔ MITM (CERT_MITM)</tspan><tspan x="470.0" dy="11.7">2. MITM ↔ Сервер (CERT_A)</tspan><tspan x="470.0" dy="11.7">Не може змінити ClientProof!</tspan></text>
<line x1="570.0" y1="345.0" x2="680.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">TLS Сесія 2</text>
<rect x="690.0" y="290.0" width="190.0" height="115.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="785.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Сервер</tspan><tspan x="785.0" dy="11.7">TLS-сесія 2 із MITM</tspan><tspan x="785.0" dy="11.7">Очікує в gs2-header:</tspan><tspan x="785.0" dy="11.7">hash(CERT_A)</tspan><tspan x="785.0" dy="11.7">Отримує ClientProof від AuthMessage_1:</tspan><tspan x="785.0" dy="11.7">НЕСХОДЖЕННЯ! Відхилено!</tspan></text>
</svg>