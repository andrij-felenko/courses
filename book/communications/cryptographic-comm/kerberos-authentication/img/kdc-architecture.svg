<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура Kerberos: довірена третя сторона (KDC) та розподіл ключів</text>
<rect x="340.0" y="70.0" width="620.0" height="460.0" rx="8" fill="#fcfcfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="360.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Область автентифікації Kerberos (Realm: EXAMPLE.ORG)</text>
<rect x="50.0" y="181.0" width="240.0" height="118.0" rx="6" fill="#eef3fb" stroke="#b8d0ee" stroke-width="1.5"/><text x="170.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Клієнт (Principal)</tspan><tspan x="170.0" dy="15.6">alice@EXAMPLE.ORG</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Довгостроковий секрет:</tspan><tspan x="170.0" dy="15.6">Ключ пароля користувача (K_c)</tspan><tspan x="170.0" dy="15.6">Отримує: TGT та сервісні квитки</tspan></text>
<rect x="370.0" y="120.0" width="270.0" height="390.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
<text x="505.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Key Distribution Center (KDC)</text>
<text x="505.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Спільна база даних секретів облікових записів</text>
<rect x="385.3" y="193.1" width="239.4" height="73.9" rx="6" fill="#fdf8e8" stroke="#e8d39c" stroke-width="1.5"/><text x="505.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Authentication Service (AS)</tspan><tspan x="505.0" dy="14.3">• Перевіряє первинний вхід (пароль)</tspan><tspan x="505.0" dy="14.3">• Видає квиток TGT</tspan><tspan x="505.0" dy="14.3">• Генерує сесійний ключ K_{c,tgs}</tspan></text>
<rect x="394.7" y="323.1" width="220.6" height="73.9" rx="6" fill="#fdf8e8" stroke="#e8d39c" stroke-width="1.5"/><text x="505.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Ticket Granting Service (TGS)</tspan><tspan x="505.0" dy="14.3">• Перевіряє наданий квиток TGT</tspan><tspan x="505.0" dy="14.3">• Видає сервісний квиток (ST)</tspan><tspan x="505.0" dy="14.3">• Генерує сервісний ключ K_{c,s}</tspan></text>
<text x="505.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Володіє ключами: K_c, K_{tgs}, K_s</text>
<rect x="686.6" y="301.0" width="246.9" height="118.0" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="810.0" y="325.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Цільовий сервер (Service)</tspan><tspan x="810.0" dy="15.6">cifs/fs.example.org</tspan><tspan x="810.0" dy="15.6"></tspan><tspan x="810.0" dy="15.6">Довгостроковий секрет:</tspan><tspan x="810.0" dy="15.6">Ключ служби (K_s)</tspan><tspan x="810.0" dy="15.6">Не має зв'язку з KDC у рантаймі!</tspan></text>
<line x1="275.0" y1="220.0" x2="395.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. AS-REQ</text>
<line x1="395.0" y1="245.0" x2="275.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. AS-REP (TGT)</text>
<line x1="275.0" y1="345.0" x2="395.0" y2="345.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. TGS-REQ</text>
<line x1="395.0" y1="370.0" x2="275.0" y2="370.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">4. TGS-REP (ST)</text>
<line x1="275.0" y1="440.0" x2="690.0" y2="440.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. AP-REQ (ST + Authenticator) ──→ 6. AP-REP</text>
</svg>