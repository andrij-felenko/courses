<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура привілеїв Active Directory: Microsoft PAC та ланцюг підписів</text>
<rect x="40.0" y="65.0" width="960.0" height="450.0" rx="8" fill="#fcfdfe" stroke="#333333" stroke-width="1.5"/>
<text x="60.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Service Ticket (зашифрований ключем служби K_s)</text>
<text x="60.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Містить cname, session_key K_{c,s}, timestamps та розширення Authorization-Data:</text>
<rect x="70.0" y="135.0" width="900.0" height="360.0" rx="6" fill="#f9fbfd" stroke="#b8d0ee" stroke-width="1.5"/>
<rect x="70.0" y="135.0" width="900.0" height="36.0" rx="6" fill="#eef3fb" stroke="#b8d0ee" stroke-width="1.5"/>
<text x="520.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">MS-PAC (Privilege Attribute Certificate) — структура привілеїв користувача</text>
<rect x="127.0" y="201.6" width="346.0" height="116.8" rx="6" fill="#ffffff" stroke="#b8d0ee" stroke-width="1.5"/><text x="300.0" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">KERB_VALIDATION_INFO (Дані авторизації)</tspan><tspan x="300.0" dy="14.3"></tspan><tspan x="300.0" dy="14.3">• User SID (ідентифікатор користувача)</tspan><tspan x="300.0" dy="14.3">• Primary Group RID (основна група)</tspan><tspan x="300.0" dy="14.3">• Group SIDs (усі доменні групи, вкл. Domain Admins)</tspan><tspan x="300.0" dy="14.3">• UserAccountControl (прапорці стану обліковки)</tspan><tspan x="300.0" dy="14.3">• Resource Group SIDs (локальні групи ресурсів)</tspan></text>
<rect x="553.8" y="190.9" width="352.3" height="88.2" rx="6" fill="#fdf8e8" stroke="#e8d39c" stroke-width="1.5"/><text x="730.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">1. Підпис сервера (PAC_SERVER_CHECKSUM)</tspan><tspan x="730.0" dy="14.3"></tspan><tspan x="730.0" dy="14.3">HMAC-SHA1-96 / HMAC-MD5 на ключі служби K_s</tspan><tspan x="730.0" dy="14.3">Захищає: підтверджує цілісність KERB_VALIDATION_INFO.</tspan><tspan x="730.0" dy="14.3">Хто перевіряє: Цільовий сервер при обробці AP-REQ.</tspan></text>
<rect x="553.8" y="335.9" width="352.3" height="88.2" rx="6" fill="#fdedec" stroke="#f5b7b1" stroke-width="1.5"/><text x="730.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">2. Підпис KDC (PAC_PRIVSVR_CHECKSUM)</tspan><tspan x="730.0" dy="14.3"></tspan><tspan x="730.0" dy="14.3">HMAC на секретному ключі KDC (K_{tgs} / krbtgt)</tspan><tspan x="730.0" dy="14.3">Захищає: запобігає підробці привілеїв самим сервером!</tspan><tspan x="730.0" dy="14.3">Сервер не може підробити собі права адміна.</tspan></text>
<line x1="515.0" y1="235.0" x2="545.0" y2="235.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="515.0" y1="380.0" x2="545.0" y2="380.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер перевіряє власний підпис; для перевірки KDC-підпису може виконати RPC-виклик NetrLogonSamLogon до контролера домену</text>
</svg>