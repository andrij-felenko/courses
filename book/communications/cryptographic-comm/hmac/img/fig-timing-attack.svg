<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="112.7" y="35.0" width="374.6" height="49.9" rx="6" fill="#fdeeed" stroke="#f5b7b1" stroke-width="1.5"/><text x="300.0" y="56.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Вразливо: Ранній вихід (memcmp / operator==)</tspan><tspan x="300.0" dy="16.9">if (a[i] != b[i]) return false;</tspan></text>
<rect x="130.1" y="137.3" width="339.8" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Кандидат 1: [ 0xAA ... ] != Очікуваний [ 0x55 ... ]</tspan><tspan x="300.0" dy="14.3">Незбіг на байті 0 -&gt; Миттєвий вихід (t = 12 нс)</tspan></text>
<rect x="114.4" y="237.3" width="371.1" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Кандидат 2: [ 0x55, 0xBB ... ] != [ 0x55, 0x77 ... ]</tspan><tspan x="300.0" dy="14.3">Незбіг на байті 1 -&gt; Вихід після 2 порівнянь (t = 18 нс)</tspan></text>
<rect x="89.4" y="337.4" width="421.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Кандидат 3: [ 0x55, 0x77, 0xCC ... ] != [ 0x55, 0x77, 0x33 ... ]</tspan><tspan x="300.0" dy="14.3">Незбіг на байті 2 -&gt; Вихід після 3 порівнянь (t = 24 нс)</tspan></text>
<rect x="150.2" y="443.1" width="299.6" height="73.9" rx="6" fill="#fdeeed" stroke="#f5b7b1" stroke-width="1.5"/><text x="300.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Витік інформації через час відповіді:</tspan><tspan x="300.0" dy="14.3">Зловмисник підбирає підпис побайтово!</tspan><tspan x="300.0" dy="14.3">256 варіантів * 32 байти = 8192 спроби</tspan><tspan x="300.0" dy="14.3">замість 2^256 варіантів повного перебору.</tspan></text>
<line x1="600.0" y1="40.0" x2="600.0" y2="640.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,6"/>
<rect x="704.6" y="35.0" width="390.8" height="49.9" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="900.0" y="56.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Безпечно: Константний час (CRYPTO_memcmp)</tspan><tspan x="900.0" dy="16.9">diff |= (a[i] ^ b[i]); ... return (diff == 0);</tspan></text>
<rect x="758.3" y="137.3" width="283.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Кандидат 1: [ 0xAA ... ]</tspan><tspan x="900.0" dy="14.3">Обробляються ВСІ 32 байти -&gt; Час t = 85 нс</tspan></text>
<rect x="758.3" y="237.3" width="283.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Кандидат 2: [ 0x55, 0xBB ... ]</tspan><tspan x="900.0" dy="14.3">Обробляються ВСІ 32 байти -&gt; Час t = 85 нс</tspan></text>
<rect x="758.3" y="337.4" width="283.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Кандидат 3: [ 0x55, 0x77, 0xCC ... ]</tspan><tspan x="900.0" dy="14.3">Обробляються ВСІ 32 байти -&gt; Час t = 85 нс</tspan></text>
<rect x="750.2" y="443.1" width="299.6" height="73.9" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="900.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Нульовий витік інформації:</tspan><tspan x="900.0" dy="14.3">Час виконання суворо однаковий</tspan><tspan x="900.0" dy="14.3">незалежно від кількості співпалих байтів.</tspan><tspan x="900.0" dy="14.3">Побайтовий підбір стає неможливим.</tspan></text>
<text x="600.0" y="680.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Перевірка автентичності підпису вимагає константного часу виконання без умовних переходів</text>
</svg>