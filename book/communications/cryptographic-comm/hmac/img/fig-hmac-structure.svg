<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="381.7" y="26.2" width="436.6" height="47.6" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="600.0" y="46.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Вхідний секретний ключ K (довільної довжини)</tspan><tspan x="600.0" dy="15.6">Якщо |K| &gt; B: K' = H(K); якщо |K| &lt; B: K' = K || 0x00...</tspan></text>
<line x1="470.0" y1="85.0" x2="300.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="730.0" y1="85.0" x2="900.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="167.2" y="156.2" width="265.5" height="47.6" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="300.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">K_in = K' ⊕ ipad</tspan><tspan x="300.0" dy="15.6">(ipad = 0x36, повторений B разів)</tspan></text>
<line x1="300.0" y1="220.0" x2="300.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="38.4" y="256.2" width="143.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Повідомлення m</tspan><tspan x="110.0" dy="15.6">(довільна довжина)</tspan></text>
<line x1="190.0" y1="280.0" x2="210.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="220.0" x2="300.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="153.2" y="354.0" width="293.6" height="32.0" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="300.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Конкатенація: [ K_in || Повідомлення m ]</tspan></text>
<line x1="300.0" y1="405.0" x2="300.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="92.8" y="476.2" width="414.3" height="47.6" rx="6" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5"/><text x="300.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Внутрішній геш H: d_in = H(K_in || m)</tspan><tspan x="300.0" dy="15.6">Фіксований дайджест (наприклад, 32 байти для SHA-256)</tspan></text>
<rect x="767.2" y="156.2" width="265.5" height="47.6" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="900.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">K_out = K' ⊕ opad</tspan><tspan x="900.0" dy="15.6">(opad = 0x5C, повторений B разів)</tspan></text>
<line x1="460.0" y1="500.0" x2="740.0" y2="500.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="715.6" y="476.2" width="368.8" height="47.6" rx="6" fill="#fdf3e6" stroke="#e6d3b3" stroke-width="1.5"/><text x="900.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Конкатенація: [ K_out || Внутрішній дайджест d_in ]</tspan><tspan x="900.0" dy="15.6">Рівно B + L байтів (наприклад, 64 + 32 = 96 байтів)</tspan></text>
<line x1="900.0" y1="220.0" x2="900.0" y2="460.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="545.0" x2="900.0" y2="610.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="704.6" y="625.0" width="390.8" height="49.9" rx="6" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.5"/><text x="900.0" y="646.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">Зовнішній геш H: HMAC(K, m) = H(K_out || d_in)</tspan><tspan x="900.0" dy="16.9">Фінальний код автентичності повідомлення</tspan></text>
<text x="600.0" y="745.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Зовнішній геш закриває вихід внутрішнього геша — стан внутрішнього стиснення не виходить назовні</text>
</svg>