<rect x="595.0" y="35.0" width="190.0" height="50.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="56.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Автентифікатор (FIDO2)</tspan><tspan x="690.0" dy="15.6">TPM / YubiKey / Enclave</tspan></text>
