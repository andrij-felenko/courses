<text x="550.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">2. SHA-256(clientDataJSON), rpId</text>
