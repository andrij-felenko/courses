<rect x="80.0" y="360.0" width="210.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="185.0" y="377.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">1. sid SignerIdentifier:</tspan><tspan x="185.0" dy="14.3">• IssuerAndSerialNumber</tspan><tspan x="185.0" dy="14.3">  (Видавець + серійний №)</tspan><tspan x="185.0" dy="14.3">• SubjectKeyIdentifier (SKI)</tspan><tspan x="185.0" dy="14.3">  (Геш відкритого ключа)</tspan></text>
<rect x="305.0" y="360.0" width="170.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="390.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">2. digestAlgorithm:</tspan><tspan x="390.0" dy="14.3">Алгоритм гешу</tspan><tspan x="390.0" dy="14.3">(наприклад SHA-256)</tspan></text>
<rect x="490.0" y="360.0" width="270.0" height="85.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="625.0" y="377.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">3. signedAttrs [0] IMPLICIT:</tspan><tspan x="625.0" dy="14.3">SET OF Attribute (DER-кодовані!)</tspan><tspan x="625.0" dy="14.3">• contentType (id-data)</tspan><tspan x="625.0" dy="14.3">• messageDigest (SHA256(payload))</tspan><tspan x="625.0" dy="14.3">• signingTime (UTC/Generalized)</tspan></text>
<rect x="775.0" y="360.0" width="245.0" height="85.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="897.5" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="897.5" dy="0.0">4. signatureAlgorithm:</tspan><tspan x="897.5" dy="14.3">Алгоритм шифрування підпису</tspan><tspan x="897.5" dy="14.3">(rsaEncryption / ecdsa-sha256)</tspan></text>
<rect x="80.0" y="465.0" width="430.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="295.0" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">5. signature SignatureValue (OCTET STRING):</tspan><tspan x="295.0" dy="15.6">Криптографічний підпис над DER-байтами signedAttrs:</tspan><tspan x="295.0" dy="15.6">σ = RSA_Sign_sk(DER(signedAttrs)) або ECDSA_Sign_sk(...)</tspan></text>
<rect x="530.0" y="465.0" width="490.0" height="90.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="775.0" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">6. unsignedAttrs [1] IMPLICIT (Непідписані атрибути):</tspan><tspan x="775.0" dy="15.6">• countersignature (Завірення нотаріусом / додатковий підпис)</tspan><tspan x="775.0" dy="15.6">• id-aa-timeStampToken (Штамп точного часу за RFC 3161 TSA)</tspan></text>
