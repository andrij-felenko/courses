<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потокова однопрохідна верифікація (Streaming Single-Pass Pipeline)</text>
<rect x="40.0" y="70.0" width="200.0" height="70.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/><text x="140.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Вхідний потік даних</tspan><tspan x="140.0" dy="15.6">(HTTP OTA / UART / мережа)</tspan><tspan x="140.0" dy="15.6">Частинами по 4–64 КБ</tspan></text>
<line x1="245.0" y1="105.0" x2="315.0" y2="105.0" stroke="#4b5563" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="335.0" cy="105.0" r="18.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="335.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">T</text>
<line x1="355.0" y1="95.0" x2="455.0" y2="75.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="50.0" width="240.0" height="55.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="580.0" y="73.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Прямий запис у Flash пам'ять</tspan><tspan x="580.0" dy="15.6">(Сектори OTA Bank B)</tspan></text>
<line x1="355.0" y1="115.0" x2="455.0" y2="135.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="115.0" width="240.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="580.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Потоковий SHA-256 (SHA_Update)</tspan><tspan x="580.0" dy="11.7">Потребує лише 108 байтів стану в RAM!</tspan></text>
<line x1="705.0" y1="142.0" x2="785.0" y2="142.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="790.0" y="115.0" width="240.0" height="55.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="910.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Фінальний дайджест</tspan><tspan x="910.0" dy="15.6">SHA_Final() → H_calc</tspan></text>
<rect x="40.0" y="200.0" width="990.0" height="220.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="535.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Перевірка CMS Detached Signature на завершенні потоку (Stream EOF)</text>
<rect x="60.0" y="245.0" width="240.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="180.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Підпис .p7s</tspan><tspan x="180.0" dy="15.6">(Отриманий у заголовку</tspan><tspan x="180.0" dy="15.6">або окремим пакетом)</tspan></text>
<line x1="305.0" y1="277.0" x2="365.0" y2="277.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="370.0" y="245.0" width="300.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="520.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">1. Звірка дайджестів:</tspan><tspan x="520.0" dy="15.6">H_calc == SignerInfo.messageDigest</tspan><tspan x="520.0" dy="15.6">2. Верифікація підпису відкритим ключем</tspan></text>
<line x1="675.0" y1="277.0" x2="735.0" y2="277.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="740.0" y="245.0" width="270.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="875.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">Перевірка сертифіката</tspan><tspan x="875.0" dy="15.6">проти апаратного Root of Trust</tspan><tspan x="875.0" dy="15.6">(Зашитий у OTP / ROM / TPM)</tspan></text>
<rect x="60.0" y="335.0" width="950.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="535.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Результат: якщо всі перевірки успішні → бутлоадер встановлює прапорець BOOT_VALID у Flash metadata.</tspan><tspan x="535.0" dy="15.6">Якщо хоча б один біт пошкоджено або підпис недійсний → сектори OTA Bank B стираються,</tspan><tspan x="535.0" dy="15.6">і система безпечно перезавантажується у попередню стабільну версію Bank A.</tspan></text>
<rect x="40.0" y="440.0" width="990.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="535.0" y="473.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Пам'ять: Повний розмір прошивки = 64 МБ, але оперативна пам'ять MCU (SRAM), задіяна для повної перевірки CMS,</tspan><tspan x="535.0" dy="15.6">становить менше 4 КБ (буфер читання ASN.1 + стан SHA-256 + відкритий ключ).</tspan></text>
</svg>