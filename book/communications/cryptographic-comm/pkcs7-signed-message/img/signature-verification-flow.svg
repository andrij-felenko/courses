<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоетапний конвеєр перевірки підпису CMS/PKCS#7 з атрибутами</text>
<rect x="40.0" y="60.0" width="480.0" height="210.0" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.6"/>
<text x="280.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="700">ЕТАП 1: Гешування вихідного тіла (Payload)</text>
<rect x="60.0" y="105.0" width="180.0" height="65.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="150.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Payload Data</tspan><tspan x="150.0" dy="15.6">(eContent або</tspan><tspan x="150.0" dy="15.6">зовнішній файл)</tspan></text>
<line x1="245.0" y1="137.0" x2="295.0" y2="137.0" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300.0" y="105.0" width="90.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="345.0" y="133.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">SHA-256</tspan><tspan x="345.0" dy="15.6">(Digest)</tspan></text>
<line x1="395.0" y1="137.0" x2="445.0" y2="137.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450.0" y="105.0" width="50.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="475.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">H₁</tspan></text>
<rect x="60.0" y="190.0" width="440.0" height="65.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="0.0"/><text x="280.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Обчислюється дайджест H₁ = SHA256(Payload).</tspan><tspan x="280.0" dy="13.0">Якщо підпис відокремлений (detached), файл читається з диска або Flash.</tspan></text>
<rect x="560.0" y="60.0" width="500.0" height="210.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<text x="810.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">ЕТАП 2: Звірка атрибута MessageDigest</text>
<rect x="580.0" y="105.0" width="230.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="695.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">SignedAttributes (SET OF)</tspan><tspan x="695.0" dy="14.3">• contentType: id-data</tspan><tspan x="695.0" dy="14.3">• messageDigest: H_attr</tspan><tspan x="695.0" dy="14.3">• signingTime: 2026-08-19</tspan></text>
<rect x="870.0" y="105.0" width="170.0" height="75.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="955.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="955.0" dy="0.0">Порівняння дайджестів:</tspan><tspan x="955.0" dy="13.0">Чи рівні H₁ == H_attr ?</tspan></text>
<line x1="815.0" y1="142.0" x2="865.0" y2="142.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="195.0" width="460.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/><text x="810.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Критична перевірка: якщо H₁ ≠ H_attr, тіло повідомлення було модифіковане,</tspan><tspan x="810.0" dy="13.0">і процес верифікації негайно зупиняється з помилкою відхилення.</tspan></text>
<rect x="40.0" y="290.0" width="1020.0" height="240.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="550.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ЕТАП 3: Верифікація асиметричного цифрового підпису над SignedAttributes</text>
<rect x="60.0" y="340.0" width="240.0" height="80.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">SignedAttributes</tspan><tspan x="180.0" dy="15.6">(Канонічне DER-кодування</tspan><tspan x="180.0" dy="15.6">з тегом 0x31 SET OF)</tspan></text>
<line x1="305.0" y1="380.0" x2="355.0" y2="380.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="340.0" width="140.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">SHA-256</tspan><tspan x="430.0" dy="15.6">H₂ = Hash(DER)</tspan></text>
<line x1="505.0" y1="380.0" x2="555.0" y2="380.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="335.0" width="230.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="675.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Асиметрична верифікація:</tspan><tspan x="675.0" dy="14.3">Verify(pk, H₂, SignatureValue)</tspan><tspan x="675.0" dy="14.3">(RSA Decrypt / ECDSA Verify)</tspan></text>
<rect x="820.0" y="335.0" width="220.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="930.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Сертифікат підписувача</tspan><tspan x="930.0" dy="14.3">Відкритий ключ pk</tspan><tspan x="930.0" dy="14.3">витягується за sid</tspan><tspan x="930.0" dy="14.3">з поля certificates</tspan></text>
<line x1="930.0" y1="430.0" x2="750.0" y2="415.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="445.0" width="980.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="550.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Чому саме двоетапно? Підпис накладається на атрибути, що зв'язує час підпису (SigningTime),</tspan><tspan x="550.0" dy="15.6">ідентичність контенту (MessageDigest) та тип даних (ContentType) в єдиний неподільний криптографічний доказ.</tspan><tspan x="550.0" dy="15.6">Канонічне DER-сортування октетів у SET OF гарантує однаковий геш H₂ на будь-якій платформі.</tspan></text>
</svg>