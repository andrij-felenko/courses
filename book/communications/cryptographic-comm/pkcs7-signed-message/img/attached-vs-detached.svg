<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вбудований (Attached / Encapsulated) проти Відокремленого (Detached) підпису</text>
<rect x="50.0" y="60.0" width="460.0" height="390.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="280.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Вбудований підпис (Attached / Encapsulated)</text>
<text x="280.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Файли .p7m, поштові вкладення S/MIME, PKCS#12</text>
<rect x="80.0" y="130.0" width="400.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="280.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Єдиний файл повідомлення (ContentInfo)</text>
<rect x="100.0" y="165.0" width="360.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/><text x="280.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">eContent (ВБУДОВАНИЙ ПОВНІСТЮ)</tspan><tspan x="280.0" dy="14.3">Корисне навантаження всередині OCTET STRING</tspan></text>
<rect x="100.0" y="225.0" width="360.0" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="280.0" y="251.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Сертифікати X.509 + CRL + SignerInfo + Підпис</tspan></text>
<rect x="100.0" y="275.0" width="360.0" height="45.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="280.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Підписані та непідписані атрибути</tspan></text>
<rect x="80.0" y="345.0" width="400.0" height="90.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.0"/><text x="280.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Властивості:</tspan><tspan x="280.0" dy="14.3">• Все в одному контейнері — неможливо загубити підпис</tspan><tspan x="280.0" dy="14.3">• Вимагає вилучення даних з ASN.1 перед обробкою</tspan><tspan x="280.0" dy="14.3">• Не підходить для гігабайтних бінарників та прошивок</tspan></text>
<rect x="570.0" y="60.0" width="460.0" height="390.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="800.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Відокремлений підпис (Detached Signature)</text>
<text x="800.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Файли .p7s / .sig, UEFI Secure Boot, OTA-прошивки MCU</text>
<rect x="600.0" y="130.0" width="180.0" height="200.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.4"/>
<text x="690.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">Оригінальний файл</text>
<rect x="615.0" y="175.0" width="150.0" height="140.0" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.0"/><text x="690.0" y="205.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">firmware.bin</tspan><tspan x="690.0" dy="14.3">або vmlinuz</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">(Незмінний,</tspan><tspan x="690.0" dy="14.3">виконується</tspan><tspan x="690.0" dy="14.3">прямо з Flash</tspan><tspan x="690.0" dy="14.3">без розбору)</tspan></text>
<rect x="810.0" y="130.0" width="190.0" height="200.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="905.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Файл підпису .p7s</text>
<rect x="825.0" y="175.0" width="160.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="905.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">eContent = NULL</tspan><tspan x="905.0" dy="14.3">(Тіло відсутнє)</tspan></text>
<rect x="825.0" y="225.0" width="160.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="905.0" y="251.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Certificates + CRL</tspan></text>
<rect x="825.0" y="275.0" width="160.0" height="45.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="905.0" y="301.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">SignerInfo + Підпис</tspan></text>
<line x1="690.0" y1="335.0" x2="905.0" y2="335.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600.0" y="345.0" width="400.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/><text x="800.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Властивості:</tspan><tspan x="800.0" dy="13.0">• Оригінальний бінарник залишається чистим і готовим до виконання</tspan><tspan x="800.0" dy="13.0">• Нульові накладні витрати пам'яті на копіювання payload</tspan><tspan x="800.0" dy="13.0">• Ідеально для мікроконтролерів із десятками кілобайтів RAM</tspan></text>
<rect x="50.0" y="465.0" width="980.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="540.0" y="490.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Інженерний вибір: S/MIME та PKCS#12 обирають Attached для зручності транспортування; системне програмування (OTA, Linux kernel modules, Secure Boot) завжди обирає Detached для швидкості та збереження пам'яті.</tspan></text>
</svg>