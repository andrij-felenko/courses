<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="25.0" width="410.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="265.0" y="51.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Master Key (128 / 192 / 256 бітів)</tspan><tspan x="265.0" dy="16.9">Таємний ключ довготривалої сесії</tspan></text>
<rect x="530.0" y="25.0" width="410.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="735.0" y="51.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Master Salt (112 бітів)</tspan><tspan x="735.0" dy="14.3">Криптографічна сіль проти колізій і райдужних таблиць</tspan></text>
<line x1="265.0" y1="85.0" x2="380.0" y2="125.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="735.0" y1="85.0" x2="620.0" y2="125.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="125.0" width="880.0" height="95.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.8"/><text x="500.0" y="153.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">KDF (Key Derivation Function на базі AES-CTR PRF)</tspan><tspan x="500.0" dy="15.6">IV = (Master_Salt ⊕ (Label || (Index ÷ KDR))) · 2¹⁶</tspan><tspan x="500.0" dy="15.6">Key_Stream = AES_MasterKey(IV || 0) || AES_MasterKey(IV || 1) ...</tspan><tspan x="500.0" dy="15.6">де Label: 0x00 = SRTP Encrypt, 0x01 = SRTP Auth, 0x02 = SRTP Salt (0x03..0x05 для SRTCP)</tspan></text>
<line x1="200.0" y1="220.0" x2="200.0" y2="275.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="220.0" x2="500.0" y2="275.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="800.0" y1="220.0" x2="800.0" y2="275.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="275.0" width="275.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="197.5" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="197.5" dy="0.0">SRTP Encryption Key (k_e)</tspan><tspan x="197.5" dy="14.3">• Розмір: 128 / 256 бітів</tspan><tspan x="197.5" dy="14.3">• Label = 0x00</tspan><tspan x="197.5" dy="14.3">• Для гами AES-CTR / f8 payload</tspan></text>
<rect x="365.0" y="275.0" width="275.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="502.5" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="502.5" dy="0.0">SRTP Authentication Key (k_a)</tspan><tspan x="502.5" dy="14.3">• Розмір: 160 бітів (SHA-1)</tspan><tspan x="502.5" dy="14.3">• Label = 0x01</tspan><tspan x="502.5" dy="14.3">• Для HMAC-SHA1 тега цілісності</tspan></text>
<rect x="670.0" y="275.0" width="270.0" height="120.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="805.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle"><tspan x="805.0" dy="0.0">SRTP Salting Key (k_s)</tspan><tspan x="805.0" dy="14.3">• Розмір: 112 бітів</tspan><tspan x="805.0" dy="14.3">• Label = 0x02</tspan><tspan x="805.0" dy="14.3">• Для змішування з SSRC та Index в IV</tspan></text>
</svg>