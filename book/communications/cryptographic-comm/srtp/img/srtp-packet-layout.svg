<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="40.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Структура пакета SRTP (RFC 3711) і розмежування шифрування та автентифікації</tspan></text>
<rect x="40.0" y="80.0" width="180.0" height="90.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.8"/><text x="130.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle"><tspan x="130.0" dy="0.0">RTP Header (12 Б)</tspan><tspan x="130.0" dy="14.3">• V, P, X, CC, M, PT</tspan><tspan x="130.0" dy="14.3">• Sequence Number</tspan><tspan x="130.0" dy="14.3">• Timestamp, SSRC</tspan></text>
<rect x="230.0" y="80.0" width="130.0" height="90.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.8"/><text x="295.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle"><tspan x="295.0" dy="0.0">RTP Ext (опція)</tspan><tspan x="295.0" dy="14.3">• Profile data</tspan><tspan x="295.0" dy="14.3">• Гучність звуку</tspan><tspan x="295.0" dy="14.3">• Поворот кадру</tspan></text>
<rect x="370.0" y="80.0" width="370.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="555.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="555.0" dy="0.0">RTP Payload (корисне навантаження)</tspan><tspan x="555.0" dy="14.3">Зашифровано блоковим шифром AES-CTR / AES-f8</tspan><tspan x="555.0" dy="14.3">Аудіо (Opus, G.711) або відео (H.264, VP9, AV1)</tspan></text>
<rect x="750.0" y="80.0" width="60.0" height="90.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="780.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle"><tspan x="780.0" dy="0.0">MKI</tspan><tspan x="780.0" dy="14.3">(опц.)</tspan></text>
<rect x="820.0" y="80.0" width="140.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="890.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="890.0" dy="0.0">Auth Tag (4–10 Б)</tspan><tspan x="890.0" dy="13.0">HMAC-SHA1-80 / 32</tspan><tspan x="890.0" dy="13.0">або тег AEAD (16 Б)</tspan><tspan x="890.0" dy="13.0">(контроль цілісності)</tspan></text>
<line x1="370.0" y1="200.0" x2="740.0" y2="200.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="370.0" y1="194.0" x2="370.0" y2="206.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="740.0" y1="194.0" x2="740.0" y2="206.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="370.0" y="215.0" width="370.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="555.0" y="234.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="555.0" dy="0.0">Область ШИФРУВАННЯ: тільки тіло корисного навантаження</tspan><tspan x="555.0" dy="11.7">(заголовки відкриті для маршрутизаторів SFU та буферів джитера)</tspan></text>
<line x1="40.0" y1="295.0" x2="810.0" y2="295.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="40.0" y1="289.0" x2="40.0" y2="301.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="810.0" y1="289.0" x2="810.0" y2="301.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="40.0" y="310.0" width="770.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="425.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="425.0" dy="0.0">Область АВТЕНТИФІКАЦІЇ (HMAC-SHA1): заголовок + розширення + шифротекст + ROC</tspan><tspan x="425.0" dy="14.3">Тег обчислюється поверх шифротексту (Encrypt-then-MAC), захищаючи послідовність і підміну</tspan></text>
<line x1="815.0" y1="315.0" x2="890.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>