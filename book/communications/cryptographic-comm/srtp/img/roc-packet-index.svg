<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="20.0" width="900.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="40.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Розгортання 16-бітного SEQ у 48-бітний Packet Index (i = 2¹⁶ · ROC + SEQ)</tspan><tspan x="500.0" dy="15.6">Запобігає колізіям IV у шифрі AES-CTR при переповненні лічильника через кожні 65 536 пакетів</tspan></text>
<rect x="50.0" y="95.0" width="420.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="260.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="260.0" dy="0.0">Rollover Counter (ROC, 32 біти)</tspan><tspan x="260.0" dy="14.3">Зберігається локально отримувачем (не передається в мережу!)</tspan></text>
<rect x="530.0" y="95.0" width="420.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="740.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle"><tspan x="740.0" dy="0.0">Sequence Number (SEQ, 16 бітів)</tspan><tspan x="740.0" dy="15.6">Передається у заголовку кожного пакета RTP</tspan></text>
<line x1="260.0" y1="155.0" x2="360.0" y2="195.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="740.0" y1="155.0" x2="640.0" y2="195.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="150.0" y="195.0" width="700.0" height="50.0" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.8"/><text x="500.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">48-бітний абсолютний індекс пакета i = (ROC &lt;&lt; 16) | SEQ</tspan><tspan x="500.0" dy="15.6">Гарантує унікальність пари (Key, IV) для 2⁴⁸ пакетів (~280 трильйонів пакетів)</tspan></text>
<rect x="50.0" y="275.0" width="900.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Автоматичне відновлення ROC при порушенні порядку доставки (Out-of-Order):</tspan><tspan x="500.0" dy="14.3">• Якщо s_l &lt; 32768 і SEQ - s_l &gt; 32768 (запізнілий пакет з попередньої епохи) → ROC_est = ROC - 1</tspan><tspan x="500.0" dy="14.3">• Якщо s_l &gt;= 32768 і s_l - SEQ &gt; 32768 (перехід через 65535 → 0) → ROC_est = ROC + 1 (після перевірки тега ROC = ROC + 1)</tspan><tspan x="500.0" dy="14.3">• Replay Protection Window: бітова маска 64/128 пакетів захищає від атак повторного відтворення</tspan></text>
</svg>