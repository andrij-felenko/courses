<rect x="50.0" y="225.0" width="265.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="182.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="182.5" dy="0.0">Протокольний профіль</tspan><tspan x="182.5" dy="13.0">• Оголошення підтримуваних схем</tspan><tspan x="182.5" dy="13.0">• Інкапсуляція викликів (Base64)</tspan><tspan x="182.5" dy="13.0">• Сигналізація результату (OK / FAIL)</tspan></text>
<rect x="340.0" y="225.0" width="280.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Абстрактний рушій стану</tspan><tspan x="480.0" dy="13.0">• Вибір механізму клієнтом</tspan><tspan x="480.0" dy="13.0">• Цикл «виклик-відповідь» (Loop)</tspan><tspan x="480.0" dy="13.0">• Контекст автентифікації та Authzid</tspan></text>
<rect x="645.0" y="225.0" width="265.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Рівень безпеки (Security Layer)</tspan><tspan x="777.5" dy="13.0">• Узгодження QOP (auth, int, conf)</tspan><tspan x="777.5" dy="13.0">• Обрамлення потоку (4-byte length)</tspan><tspan x="777.5" dy="13.0">• Зв'язування з каналом (GS2 / Plus)</tspan></text>
