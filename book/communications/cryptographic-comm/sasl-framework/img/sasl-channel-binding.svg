<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прив'язка до каналу (Channel Binding): захист від підміни через TLS-проксі</text>
<rect x="40.0" y="55.0" width="180.0" height="340.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Легітимний Клієнт</text>
<rect x="50.0" y="100.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Встановлює TLS A:</tspan><tspan x="130.0" dy="13.0">Обчислює відбиток</tspan><tspan x="130.0" dy="13.0">CB_A = H(Cert_A)</tspan><tspan x="130.0" dy="13.0">наприклад SHA-256</tspan></text>
<rect x="390.0" y="55.0" width="180.0" height="340.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="480.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">MITM Проксі</text>
<rect x="400.0" y="100.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Розриває TLS:</tspan><tspan x="480.0" dy="13.0">Сесія A: власний Cert_A</tspan><tspan x="480.0" dy="13.0">Сесія B: серверний Cert_B</tspan><tspan x="480.0" dy="13.0">Пересилає SASL-доказ</tspan></text>
<rect x="740.0" y="55.0" width="180.0" height="340.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="830.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Цільовий Сервер</text>
<rect x="750.0" y="100.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Приймає TLS B:</tspan><tspan x="830.0" dy="13.0">Володіє Cert_B</tspan><tspan x="830.0" dy="13.0">Обчислює свій відбиток</tspan><tspan x="830.0" dy="13.0">CB_B = H(Cert_B)</tspan></text>
<rect x="230.0" y="110.0" width="150.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="305.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Канал TLS A</tspan><tspan x="305.0" dy="13.0">(Cert_A атакуючого)</tspan></text>
<rect x="580.0" y="110.0" width="150.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Канал TLS B</tspan><tspan x="655.0" dy="13.0">(Cert_B сервера)</tspan></text>
<line x1="220.0" y1="220.0" x2="390.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="235.0" width="150.0" height="65.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="305.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Client-First:</tspan><tspan x="305.0" dy="11.7">p=tls-server-end-point</tspan><tspan x="305.0" dy="11.7">Вкладено CB_A</tspan></text>
<line x1="570.0" y1="220.0" x2="740.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="235.0" width="150.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Форвардинг:</tspan><tspan x="655.0" dy="11.7">Пересилає Client-First</tspan><tspan x="655.0" dy="11.7">з незмінним CB_A</tspan></text>
<rect x="750.0" y="230.0" width="160.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Верифікація на сервері:</tspan><tspan x="830.0" dy="13.0">CB_A (з токена) ≟ CB_B</tspan><tspan x="830.0" dy="13.0">Відбитки не збіглися!</tspan><tspan x="830.0" dy="13.0"></tspan><tspan x="830.0" dy="13.0">→ ДОСТУП ВІДХИЛЕНО</tspan></text>
<rect x="40.0" y="410.0" width="880.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Захист Channel Binding: атакуючий не може підмінити CB_A на CB_B у Client-First без знання пароля клієнта,</tspan><tspan x="480.0" dy="13.0">оскільки відбиток каналу криптографічно зв'язаний із підписом ClientProof (SCRAM-SHA-256-PLUS).</tspan></text>
</svg>