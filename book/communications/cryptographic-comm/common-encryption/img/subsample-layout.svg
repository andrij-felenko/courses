<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="96.0" width="176.0" height="66.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.8"/><text x="148.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">чисті</tspan><tspan x="148.0" dy="18.2">32 Б</tspan></text>
<rect x="236.0" y="96.0" width="764.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="618.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="618.0" dy="0.0">зашифровано — тіло зрізу, 48 088 Б</tspan></text>
<text x="530.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">один семпл (закодований кадр) = 48 120 Б</text>
<rect x="87.4" y="234.6" width="205.2" height="66.8" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="190.0" y="255.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">4 Б — довжина NAL-одиниці</tspan><tspan x="190.0" dy="16.9">1 Б — заголовок NAL</tspan><tspan x="190.0" dy="16.9">27 Б — заголовок зрізу</tspan></text>
<line x1="190.0" y1="228.6" x2="148.0" y2="170.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="538.1" y="243.1" width="323.8" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">коефіцієнти перетворення й вектори руху —</tspan><tspan x="700.0" dy="16.9">єдине, що без ключа не має жодного сенсу</tspan></text>
<line x1="700.0" y1="237.1" x2="700.0" y2="170.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="348.0" width="940.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="371.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Демультиплексор без ключа: знаходить межі одиниць, читає їхні типи,</tspan><tspan x="530.0" dy="18.2">будує покажчик і перемикає бітрейт — і не бачить ані пікселя</tspan></text>
