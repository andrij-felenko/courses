<rect x="420.0" y="270.0" width="370.0" height="90.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="605.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Транслюється автопілотом періодично (1 Гц) або при появі нової події.</tspan><tspan x="605.0" dy="12.8">GCS порівнює отриманий sequence із локальним лічильником:</tspan><tspan x="605.0" dy="12.8">якщо є розрив — негайно запитує втрачені кадри через REQUEST_EVENT.</tspan><tspan x="605.0" dy="12.8">Працює як легковагове серцебиття системи журналювання.</tspan></text>
