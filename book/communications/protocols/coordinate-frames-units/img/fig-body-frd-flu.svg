<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="350.0" rx="8" fill="#fdfdfd" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язані системи координат апарата: FRD (авіація) та FLU (робототехніка)</text>
<rect x="30.0" y="55.0" width="370.0" height="290.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="215.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Body FRD (Forward — Right — Down)</text>
<text x="215.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Авіаційний стандарт (кути Тейта-Браяна: Roll, Pitch, Yaw)</text>
<circle cx="200.0" cy="195.0" r="14.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="150.0" y1="160.0" x2="250.0" y2="230.0" stroke="#888888" stroke-width="3.0"/>
<line x1="150.0" y1="230.0" x2="250.0" y2="160.0" stroke="#888888" stroke-width="3.0"/>
<circle cx="150.0" cy="160.0" r="12.0" fill="#e8f4fd" stroke="#0288d1" stroke-width="1.5"/>
<circle cx="250.0" cy="230.0" r="12.0" fill="#e8f4fd" stroke="#0288d1" stroke-width="1.5"/>
<circle cx="150.0" cy="230.0" r="12.0" fill="#feeef0" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="250.0" cy="160.0" r="12.0" fill="#feeef0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="200.0" y1="195.0" x2="130.0" y2="150.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="125.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+X_b (Forward / Ніс)</text>
<line x1="200.0" y1="195.0" x2="275.0" y2="160.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">+Y_b (Right / Праворуч)</text>
<line x1="200.0" y1="195.0" x2="200.0" y2="275.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="210.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">+Z_b (Down / Днище)</text>
<rect x="45.0" y="275.0" width="340.0" height="55.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="215.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило правого гвинта:</text>
<text x="215.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Roll (крен): праве крило вниз (+) | Pitch (тангаж): ніс вгору (+)</text>
<text x="215.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Yaw (рискання): поворот за годинниковою стрілкою (+)</text>
<rect x="440.0" y="55.0" width="370.0" height="290.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="625.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Body FLU (Forward — Left — Up)</text>
<text x="625.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Робототехнічний стандарт (ROS REP 103, орієнтація камер)</text>
<circle cx="610.0" cy="215.0" r="14.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="560.0" y1="180.0" x2="660.0" y2="250.0" stroke="#888888" stroke-width="3.0"/>
<line x1="560.0" y1="250.0" x2="660.0" y2="180.0" stroke="#888888" stroke-width="3.0"/>
<circle cx="560.0" cy="180.0" r="12.0" fill="#feeef0" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="660.0" cy="250.0" r="12.0" fill="#feeef0" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="560.0" cy="250.0" r="12.0" fill="#e8f4fd" stroke="#0288d1" stroke-width="1.5"/>
<circle cx="660.0" cy="180.0" r="12.0" fill="#e8f4fd" stroke="#0288d1" stroke-width="1.5"/>
<line x1="610.0" y1="215.0" x2="540.0" y2="170.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="535.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+X_b (Forward / Ніс)</text>
<line x1="610.0" y1="215.0" x2="535.0" y2="250.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="525.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">+Y_b (Left / Ліворуч)</text>
<line x1="610.0" y1="215.0" x2="610.0" y2="135.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="620.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">+Z_b (Up / Верх)</text>
<rect x="455.0" y="275.0" width="340.0" height="55.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="625.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок осей FRD та FLU:</text>
<text x="625.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">X_flu = X_frd</text>
<text x="625.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Y_flu = -Y_frd  |  Z_flu = -Z_frd</text>
</svg>