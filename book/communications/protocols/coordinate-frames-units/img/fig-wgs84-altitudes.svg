<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1041.8 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1041.8" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="8" fill="#fdfdfd" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Глобальні висоти: WGS84 еліпсоїд, геоїд (AMSL) та рельєф (AGL)</text>
<path d="M 50 280 Q 420 270 790 280" stroke="#2457d6" stroke-width="2" fill="none"/>
<text x="795.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Еліпсоїд WGS84 (математична модель, h = 0)</text>
<path d="M 50 235 Q 250 215 450 245 T 790 220" stroke="#27ae60" stroke-width="2.5" fill="none"/>
<text x="795.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Геоїд / Середній рівень моря (AMSL, H = 0)</text>
<path d="M 50 310 L 50 210 Q 180 140 280 180 T 480 120 T 650 160 T 790 140 L 790 310 Z" stroke="#8d6e63" stroke-width="1.5" fill="#efebe9"/>
<text x="795.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5d4037" text-anchor="start" font-weight="700">Фізичний рельєф поверхні Землі (Terrain)</text>
<circle cx="480.0" cy="75.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">БПЛА у польоті</text>
<line x1="480.0" y1="75.0" x2="480.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="425.0" y1="75.0" x2="425.0" y2="120.0" stroke="#d84315" stroke-width="1.8"/>
<line x1="420.0" y1="75.0" x2="430.0" y2="75.0" stroke="#d84315" stroke-width="1.5"/>
<line x1="420.0" y1="120.0" x2="430.0" y2="120.0" stroke="#d84315" stroke-width="1.5"/>
<text x="415.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d84315" text-anchor="end" font-weight="700">h_AGL (Above Ground Level)</text>
<text x="415.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Висота над поверхнею</text>
<line x1="505.0" y1="75.0" x2="505.0" y2="245.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="500.0" y1="75.0" x2="510.0" y2="75.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="500.0" y1="245.0" x2="510.0" y2="245.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="515.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">H (AMSL / Orthometric)</text>
<text x="515.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Висота над рівнем моря</text>
<line x1="680.0" y1="75.0" x2="680.0" y2="275.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="675.0" y1="75.0" x2="685.0" y2="75.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="675.0" y1="275.0" x2="685.0" y2="275.0" stroke="#2457d6" stroke-width="1.5"/>
<text x="690.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">h (HAE / Ellipsoid Height)</text>
<text x="690.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Сира геодезична висота GNSS</text>
<line x1="425.0" y1="245.0" x2="425.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="420.0" y1="245.0" x2="430.0" y2="245.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="420.0" y1="275.0" x2="430.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="415.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end" font-weight="700">N (Хвиля геоїда / Undulation)</text>
<rect x="40.0" y="60.0" width="260.0" height="50.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="170.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фундаментальне співвідношення:</text>
<text x="170.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">h = H + N  =&gt;  H = h - N</text>
</svg>