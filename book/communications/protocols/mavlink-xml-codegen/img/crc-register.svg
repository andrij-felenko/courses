<text x="495.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0x8408 = 1000 0100 0000 1000₂ — одиниці стоять якраз на бітах 15, 10 і 3.</text>
<text x="495.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Це многочлен 0x1021 (x¹⁶ + x¹² + x⁵ + 1), записаний дзеркально: зсув іде до молодшого біта.</text>
