<text x="495.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Байт рядка спершу XOR-иться в молодші вісім бітів; далі — вісім таких кроків.</text>
