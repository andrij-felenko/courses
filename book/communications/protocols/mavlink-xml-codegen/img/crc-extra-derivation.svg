<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC_EXTRA: відбиток опису, зведений до одного байта</text>
<rect x="221.0" y="75.8" width="458.1" height="58.5" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">HEARTBEAT  uint32_t custom_mode  uint8_t type  uint8_t autopilot</tspan><tspan x="450.0" dy="15.0">uint8_t base_mode  uint8_t system_status  uint8_t mavlink_version</tspan></text>
<text x="450.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">назва повідомлення, далі тип і назва кожного базового поля — у дротовому порядку</text>
<rect x="334.4" y="163.2" width="231.2" height="53.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">CRC-16/MCRF4XX по цих символах</tspan><tspan x="450.0" dy="15.6">початкове значення 0xFFFF</tspan></text>
<line x1="450.0" y1="220.8" x2="450.0" y2="237.2" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="361.8" y="245.2" width="176.5" height="53.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">отримали 0x2C1E</tspan><tspan x="450.0" dy="15.6">два байти: 0x2C і 0x1E</tspan></text>
<line x1="450.0" y1="302.8" x2="450.0" y2="319.2" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="318.0" y="327.2" width="264.1" height="53.6" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.5"/><text x="450.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">складаємо половинки: 0x1E ^ 0x2C</tspan><tspan x="450.0" dy="15.6">CRC_EXTRA = 0x32 = 50</tspan></text>
<line x1="450.0" y1="138.2" x2="450.0" y2="160.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="450.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Цей байт домішують у кінець контрольної суми кожного кадру HEARTBEAT —</text>
<text x="450.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">тож сторона з іншим описом просто не зійдеться в CRC.</text>
</svg>