<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ролі: сервер даних і клієнт (не master/slave)</text>
<rect x="90.0" y="113.5" width="170.0" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.9"/><text x="175.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Периферія</tspan></text>
<text x="175.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">= сервер даних</text>
<text x="175.0" y="188.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зберігає значення; рекламує себе</text>
<text x="175.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(давач, гаджет)</text>
<rect x="440.0" y="113.5" width="170.0" height="33.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.9"/><text x="525.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Центральний</tspan></text>
<text x="525.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">= клієнт</text>
<text x="525.0" y="188.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сканує, під'єднується, читає/пише</text>
<text x="525.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(телефон, ПК)</text>
<line x1="434.0" y1="120.0" x2="266.0" y2="120.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="350.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">запит значення</text>
<line x1="266.0" y1="142.0" x2="434.0" y2="142.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="350.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">значення у відповідь</text>
<text x="350.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ESP32 може бути будь-ким: периферією-давачем або центральним-збирачем</text>
</svg>