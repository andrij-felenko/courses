<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -10 732 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-12" y="-10" width="732" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина дій: що обрати під ситуацію</text>
<rect x="60.0" y="62.0" width="600.0" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="78.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Утримати висоту / завис</text>
<text x="78.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">коли є GPS-утримання позиції; чекає повернення пілота</text>
<rect x="60.0" y="124.0" width="600.0" height="52.0" rx="6" fill="#e8f4f8" stroke="#2b7a9b" stroke-width="1.6"/>
<text x="78.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b7a9b" text-anchor="start" font-weight="700">SmartRTL — назад по сліду</text>
<text x="78.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">летить додому тим шляхом, яким прилетів (є лог маршруту)</text>
<rect x="60.0" y="186.0" width="600.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="78.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">RTL — прямо додому</text>
<text x="78.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">піднявся й полетів по прямій до точки зльоту, там сів</text>
<rect x="60.0" y="248.0" width="600.0" height="52.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="78.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="start" font-weight="700">Land — сісти тут і зараз</text>
<text x="78.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">нема куди летіти або нема GPS: керована посадка на місці</text>
<rect x="60.0" y="310.0" width="600.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="78.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Обрізати мотори</text>
<text x="78.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">остання межа: над людьми падіння краще, ніж некерований політ</text>
<line x1="30.0" y1="68.0" x2="30.0" y2="356.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="20.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рішучіше</text>
</svg>