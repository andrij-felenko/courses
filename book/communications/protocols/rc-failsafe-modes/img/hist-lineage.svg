<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід однієї ідеї: відмова → безпечний стан</text>
<rect x="40.0" y="90.0" width="150.0" height="84.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">1870-ті</tspan><tspan x="115.0" dy="15.0">континуальні</tspan><tspan x="115.0" dy="15.0">гальма</tspan></text>
<rect x="215.0" y="90.0" width="150.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="290.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">1889</tspan><tspan x="290.0" dy="15.0">Арма, закон:</tspan><tspan x="290.0" dy="15.0">самозастосовні</tspan></text>
<rect x="390.0" y="90.0" width="150.0" height="84.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="465.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">семафор:</tspan><tspan x="465.0" dy="15.0">обрив → «стій»</tspan></text>
<rect x="565.0" y="90.0" width="150.0" height="84.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.5"/><text x="640.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">1945–46</tspan><tspan x="640.0" dy="15.0">слово</tspan><tspan x="640.0" dy="15.0">«fail-safe»</tspan></text>
<line x1="190.0" y1="132.0" x2="215.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="365.0" y1="132.0" x2="390.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="132.0" x2="565.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="174.0" x2="640.0" y2="208.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="214.0" width="340.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">приймач RC та польотний контролер дрона:</tspan><tspan x="470.0" dy="14.3">сигнал зник → газ у нуль / RTL / посадка —</tspan><tspan x="470.0" dy="14.3">та сама логіка «відмова веде в безпечний бік»</tspan></text>
<text x="390.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Принцип старший за слово: інженерія 1870-х уже будувала його в залізі.</text>
</svg>