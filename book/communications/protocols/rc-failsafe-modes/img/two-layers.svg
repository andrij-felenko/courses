<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два рубежі оборони: приймач і контролер</text>
<rect x="30.0" y="70.0" width="150.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">ефір</tspan><tspan x="105.0" dy="16.9">(радіолінк)</tspan></text>
<line x1="60.0" y1="175.0" x2="150.0" y2="175.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="105.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">сигнал зник</text>
<text x="105.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нема кадрів</text>
<rect x="230.0" y="60.0" width="230.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="345.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПРИЙМАЧ (RX)</text>
<text x="345.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">рубіж 1</text>
<rect x="250.0" y="120.0" width="190.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">лічить тишу:</tspan><tspan x="345.0" dy="15.0">нема кадру довше T?</tspan></text>
<rect x="250.0" y="176.0" width="190.0" height="60.0" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="345.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">рішення про ВИХІД:</tspan><tspan x="345.0" dy="14.3">• тримати останнє</tspan><tspan x="345.0" dy="14.3">• зняти імпульси</tspan><tspan x="345.0" dy="14.3">• віддати пресет</tspan></text>
<rect x="250.0" y="246.0" width="190.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="265.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">що піде по дроту</tspan><tspan x="345.0" dy="14.3">на контролер</tspan></text>
<rect x="510.0" y="60.0" width="230.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="625.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">КОНТРОЛЕР (FC)</text>
<text x="625.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">рубіж 2</text>
<rect x="530.0" y="120.0" width="190.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">лічить свою тишу:</tspan><tspan x="625.0" dy="14.3">нема валідного кадру?</tspan></text>
<rect x="530.0" y="176.0" width="190.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">ДІЯ в польоті:</tspan><tspan x="625.0" dy="14.3">• утримати висоту</tspan><tspan x="625.0" dy="14.3">• RTL / посадка</tspan><tspan x="625.0" dy="14.3">• обрізати мотори</tspan></text>
<rect x="530.0" y="246.0" width="190.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="265.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">рятує апарат,</tspan><tspan x="625.0" dy="14.3">а не просто дріт</tspan></text>
<line x1="180.0" y1="175.0" x2="228.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="185.0" x2="508.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="484.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дріт</text>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Приймач вирішує, ЩО класти на дріт; контролер вирішує, ЩО РОБИТИ в повітрі.</text>
</svg>