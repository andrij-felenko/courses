<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр цифрової обробки сигналу та фільтрації шуму RSSI</text>
<rect x="33.6" y="77.5" width="152.8" height="65.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Сирий потік RSSI</tspan><tspan x="110.0" dy="13.0">• Пакети з Ch 37, 38, 39</tspan><tspan x="110.0" dy="13.0">• Стрибки шуму до ±15 дБ</tspan><tspan x="110.0" dy="13.0">• Випадкові випадіння</tspan></text>
<line x1="190.0" y1="110.0" x2="240.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="215.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">z[k]</text>
<rect x="245.8" y="77.5" width="158.5" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="325.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Медіанний фільтр</tspan><tspan x="325.0" dy="13.0">(вікно W = 5..7)</tspan><tspan x="325.0" dy="13.0">• Відкидає глибокі випади</tspan><tspan x="325.0" dy="13.0">• Зберігає фронт зміни</tspan></text>
<line x1="405.0" y1="110.0" x2="455.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">z_med</text>
<rect x="475.0" y="71.0" width="200.0" height="78.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.6"/><text x="575.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">1D Фільтр Калмана</tspan><tspan x="575.0" dy="13.0">Прогноз: x̂ = x, P = P + Q</tspan><tspan x="575.0" dy="13.0">Підсилення: K = P / (P + R)</tspan><tspan x="575.0" dy="13.0">Оновлення: x̂ = x̂ + K(z - x̂)</tspan><tspan x="575.0" dy="13.0">P = (1 - K)P</tspan></text>
<line x1="680.0" y1="110.0" x2="720.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">RSSI_est</text>
<line x1="575.0" y1="165.0" x2="575.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="405.0" y="242.2" width="340.0" height="55.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/><text x="575.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Log-Distance Path Loss Model</tspan><tspan x="575.0" dy="14.3">d = 10 ^ ((MeasuredPower - RSSI_est) / (10 · n))</tspan><tspan x="575.0" dy="14.3">Розрахунок фізичної відстані (м)</tspan></text>
<line x1="395.0" y1="270.0" x2="290.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="231.0" width="210.0" height="78.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="247.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Зони наближення (Proximity Zones)</tspan><tspan x="165.0" dy="13.0">• Immediate: d &lt; 0.5 м</tspan><tspan x="165.0" dy="13.0">• Near: 0.5 м ≤ d ≤ 3.0 м</tspan><tspan x="165.0" dy="13.0">• Far: d &gt; 3.0 м</tspan><tspan x="165.0" dy="13.0">• Unknown: сигнал втрачено</tspan></text>
</svg>