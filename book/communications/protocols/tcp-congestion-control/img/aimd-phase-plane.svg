<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фазова діаграма збіжності AIMD до справедливості та ефективності</text>
<rect x="0.0" y="0.0" width="760.0" height="440.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<line x1="100.0" y1="360.0" x2="410.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="100.0" y1="360.0" x2="100.0" y2="50.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="415.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Швидкість Потоку 1 (x₁)</text>
<text x="90.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкість Потоку 2 (x₂)</text>
<line x1="100.0" y1="360.0" x2="390.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4 4"/>
<text x="340.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Лінія справедливості (x₁ = x₂)</text>
<line x1="100.0" y1="80.0" x2="380.0" y2="360.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="340.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Лінія ємності (x₁ + x₂ = C)</text>
<circle cx="240.0" cy="220.0" r="6.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
<text x="252.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Оптимум (C/2, C/2)</text>
<line x1="140.0" y1="180.0" x2="200.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="140.0" cy="180.0" r="3.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<line x1="200.0" y1="120.0" x2="150.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="200.0" cy="120.0" r="3.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<line x1="150.0" y1="240.0" x2="220.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="150.0" cy="240.0" r="3.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<line x1="220.0" y1="170.0" x2="160.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="220.0" cy="170.0" r="3.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<line x1="160.0" y1="265.0" x2="230.0" y2="195.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="160.0" cy="265.0" r="3.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<rect x="430.0" y="80.0" width="260.0" height="260.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="560.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому AIMD стійкий:</text>
<text x="445.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">1. Аддитивне зростання (+1, +1):</text>
<text x="455.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">зміщує стан паралельно куту 45°,</text>
<text x="455.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">наближаючи відносні частки до 1:1.</text>
<text x="445.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2. Мультиплікативне скорочення:</text>
<text x="455.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">спрямовує вектор до початку координат</text>
<text x="455.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(×0.5), зберігаючи пропорцію рівності.</text>
<text x="445.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Збіжність:</text>
<text x="455.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">цикл пульсацій неминуче звужується</text>
<text x="455.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">навколо точки оптимуму (C/2, C/2).</text>
<rect x="30.0" y="399.5" width="700.0" height="31.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="380.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Фазова діаграма Чіу-Джейна: доведення збіжності AIMD до лінії справедливості та лінії ємності.</tspan></text>
</svg>