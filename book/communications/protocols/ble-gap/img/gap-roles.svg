<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальні ролі GAP у Bluetooth Low Energy</text>
<rect x="30.0" y="45.0" width="335.0" height="295.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="197.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Режим без з'єднання (Broadcasting)</text>
<rect x="47.0" y="90.0" width="300.0" height="69.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="197.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="197.0" dy="0.0">Broadcaster (Мовник)</tspan><tspan x="197.0" dy="14.3">• Тільки передає (Tx)</tspan><tspan x="197.0" dy="14.3">• Шле пакети ADV_NONCONN_IND</tspan><tspan x="197.0" dy="14.3">• Приклади: iBeacon, маячок температури</tspan></text>
<line x1="197.0" y1="168.0" x2="197.0" y2="212.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">реклама (Adv)</text>
<rect x="47.0" y="225.1" width="300.0" height="69.9" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="197.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="197.0" dy="0.0">Observer (Спостерігач)</tspan><tspan x="197.0" dy="14.3">• Тільки приймає (Rx)</tspan><tspan x="197.0" dy="14.3">• Пасивне або активне сканування</tspan><tspan x="197.0" dy="14.3">• Приклади: сканер міток, шлюз збору даних</tspan></text>
<rect x="395.0" y="45.0" width="335.0" height="295.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="562.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Режим зі з'єднанням (Connection)</text>
<rect x="412.0" y="90.0" width="300.0" height="69.9" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.8"/><text x="562.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Peripheral (Периферія)</tspan><tspan x="562.0" dy="14.3">• Рекламує себе (ADV_IND)</tspan><tspan x="562.0" dy="14.3">• Приймає з'єднання → Link Layer Slave</tspan><tspan x="562.0" dy="14.3">• Приклади: розумний годинник, пульсометр</tspan></text>
<line x1="540.0" y1="212.0" x2="540.0" y2="168.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="584.0" y1="168.0" x2="584.0" y2="212.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">Adv / Дані</text>
<text x="628.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Connect / Дані</text>
<rect x="412.0" y="225.1" width="300.0" height="69.9" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/><text x="562.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Central (Центральний)</tspan><tspan x="562.0" dy="14.3">• Сканує ефір і надсилає CONNECT_IND</tspan><tspan x="562.0" dy="14.3">• Керує розкладом → Link Layer Master</tspan><tspan x="562.0" dy="14.3">• Приклади: смартфон, планшет, ПК</tspan></text>
</svg>