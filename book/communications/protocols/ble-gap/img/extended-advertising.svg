<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розширеного рекламування (Extended Advertising) у Bluetooth 5.0</text>
<rect x="40.0" y="50.0" width="680.0" height="115.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="60.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Первинні канали рекламування (Primary Channels: 37, 38, 39) — LE 1M / LE Coded</text>
<rect x="70.0" y="89.0" width="280.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ADV_EXT_IND (Короткий заголовок)</tspan><tspan x="210.0" dy="13.0">• Адреса передавача (AdvA)</tspan><tspan x="210.0" dy="13.0">• AuxPointer: [Канал 14, Час Δt, PHY LE 2M]</tspan></text>
<text x="520.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Мінімізує завантаження каналів 37-39,
перенаправляючи слухача на канали даних</text>
<line x1="210.0" y1="150.0" x2="210.0" y2="215.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="225.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">AuxPointer (вказівник на вторинний канал)</text>
<rect x="40.0" y="215.0" width="680.0" height="120.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="60.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Вторинні канали даних (Secondary Channels: 0..36) — LE 1M / LE 2M / LE Coded</text>
<rect x="70.0" y="254.0" width="280.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">AUX_ADV_IND (Великий пакет даних)</tspan><tspan x="210.0" dy="13.0">• Корисне навантаження до 254 байтів</tspan><tspan x="210.0" dy="13.0">• Швидкість LE 2M або дальність LE Coded</tspan></text>
<rect x="390.0" y="254.0" width="280.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="530.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">AUX_CHAIN_IND (Ланцюгові пакети)</tspan><tspan x="530.0" dy="13.0">• Об'єднання пакетів до 1650 байтів</tspan><tspan x="530.0" dy="13.0">• Periodic Advertising (SyncInfo) для LE Audio</tspan></text>
<line x1="355.0" y1="280.0" x2="385.0" y2="280.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>