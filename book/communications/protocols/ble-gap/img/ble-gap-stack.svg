<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Положення GAP у стеку протоколів Bluetooth Low Energy</text>
<rect x="40.0" y="28.2" width="680.0" height="43.6" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="46.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Рівень застосунку (Application)</tspan><tspan x="380.0" dy="15.6">Профілі користувача, бізнес-логіка, датчики</tspan></text>
<rect x="40.0" y="95.0" width="680.0" height="145.0" rx="8" fill="#f0f4f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Рівень хоста (Host)</text>
<rect x="48.2" y="130.9" width="333.5" height="88.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="215.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">GAP (Generic Access Profile)</tspan><tspan x="215.0" dy="14.3">• Ролі: Broadcaster, Observer, Peripheral, Central</tspan><tspan x="215.0" dy="14.3">• Рекламування (Advertising) і сканування</tspan><tspan x="215.0" dy="14.3">• Встановлення з'єднання та узгодження таймінгів</tspan><tspan x="215.0" dy="14.3">• Приватність адрес і безпека зв'язку</tspan></text>
<text x="215.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">GAP — поведінка та зв'язок</text>
<rect x="390.0" y="130.9" width="310.0" height="88.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="545.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">GATT / ATT</tspan><tspan x="545.0" dy="14.3">• Сервіси та характеристики</tspan><tspan x="545.0" dy="14.3">• Операції Read, Write, Notify, Indicate</tspan><tspan x="545.0" dy="14.3">• Модель даних клієнт / сервер</tspan><tspan x="545.0" dy="14.3">• Структура бази атрибутів</tspan></text>
<text x="545.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">GATT — структура даних</text>
<line x1="40.0" y1="255.0" x2="720.0" y2="255.0" stroke="#333333" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Інтерфейс контролера HCI (Host Controller Interface) — команди та події</text>
<rect x="40.0" y="270.0" width="680.0" height="135.0" rx="8" fill="#fbfaf6" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Рівень контролера (Controller)</text>
<rect x="60.0" y="307.2" width="640.0" height="55.6" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.6"/><text x="380.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Link Layer (LL)</tspan><tspan x="380.0" dy="14.3">• Стан: Standby, Advertising, Scanning, Initiating, Connection</tspan><tspan x="380.0" dy="14.3">• Керування радіопакетами, частотне стрибання (FHSS), таймінги зв'язку</tspan></text>
<text x="380.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Link Layer — канальний рівень радіо</text>
<rect x="60.0" y="373.5" width="640.0" height="23.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.4"/><text x="380.0" y="388.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Фізичний рівень (PHY 2.4 ГГц): LE 1M, LE 2M, LE Coded (S=2, S=8)</tspan></text>
</svg>