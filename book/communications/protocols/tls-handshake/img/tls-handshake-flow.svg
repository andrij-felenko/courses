<text x="220.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ClientKeyExchange, ChangeCipherSpec</text>
<text x="220.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Finished [Encrypted]</text>
<line x1="360.0" y1="290.0" x2="80.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
