<text x="660.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">{EncryptedExt, Cert, CertVerify, Finished}</text>
<text x="660.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">* Все після ServerHello зашифровано Handshake-ключем</text>
<line x1="520.0" y1="260.0" x2="800.0" y2="290.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="660.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">{Finished} + Application Data (HTTP/3 / HTTP/2)</text>
<line x1="475.0" y1="340.0" x2="845.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="660.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Дані передаються вже після 1 RTT!</text>
