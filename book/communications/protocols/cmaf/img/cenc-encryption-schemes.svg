<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="420.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схеми шифрування Common Encryption (CENC / ISO/IEC 23001-7) у CMAF</text>
<rect x="30.0" y="55.0" width="820.0" height="155.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="180.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Схема 'cenc' — AES-128 CTR</text>
<text x="540.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Історично: Microsoft PlayReady, Widevine Modular)</text>
<text x="440.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">100% корисного навантаження NAL-юніта шифрується лічильниковим режимом (Counter Mode)</text>
<rect x="50.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<text x="100.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">NAL Header</text>
<text x="100.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Відкритий (Clear)</text>
<rect x="160.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Block 1 (16B)</text>
<text x="210.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">AES-CTR</text>
<rect x="270.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="320.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Block 2 (16B)</text>
<text x="320.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">AES-CTR</text>
<rect x="380.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="430.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Block 3 (16B)</text>
<text x="430.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">AES-CTR</text>
<rect x="490.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="540.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Block 4 (16B)</text>
<text x="540.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">AES-CTR</text>
<rect x="600.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="650.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Block 5 (16B)</text>
<text x="650.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">AES-CTR</text>
<rect x="710.0" y="120.0" width="100.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="760.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Block 6 (16B)</text>
<text x="760.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">AES-CTR</text>
<text x="440.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Шифрується кожен 16-байтний блок без пропусків. Не підтримується апаратними рушіями Apple.</text>
<rect x="30.0" y="230.0" width="820.0" height="165.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="210.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Схема 'cbcs' — AES-128 CBC (1:9 Pattern Protection)</text>
<text x="600.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Універсальний стандарт: Apple FairPlay, Widevine, PlayReady)</text>
<text x="440.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Патерн 1:9 — шифрується лише 1 блок з 10 (16 байтів шифровано : 144 байти відкрито)</text>
<rect x="50.0" y="295.0" width="100.0" height="45.0" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<text x="100.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">NAL Header</text>
<text x="100.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Відкритий (Clear)</text>
<rect x="160.0" y="295.0" width="120.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Crypt Block 1</text>
<text x="220.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">16B AES-CBC</text>
<rect x="290.0" y="295.0" width="380.0" height="45.0" rx="3" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Skip Blocks 1..9 (144 байти відкритого відеопотоку)</text>
<text x="480.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Пропускаються без криптографічних операцій (збереження енергії ЦП/GPU)</text>
<rect x="680.0" y="295.0" width="120.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="740.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Crypt Block 2</text>
<text x="740.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">16B AES-CBC</text>
<text x="440.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ентропія відео повністю зламана (картинка не декодується), але навантаження на крипточип менше на 90%!</text>
</svg>