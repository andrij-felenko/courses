<text x="95.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">старт</text>
<text x="705.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">перевірка</text>
<text x="360.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тип повідомлення (heartbeat, attitude, GPS…) → приймач знає, як читати дані</text>
<rect x="60.0" y="286.0" width="800.0" height="44.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="460.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кадр + ID + CRC — точно ті самі ідеї, що ми будували для UART у Розділі 35. MAVLink — їх зрілий нащадок.</text>
<text x="460.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Детально розберемо структуру в §42.5.</text>
