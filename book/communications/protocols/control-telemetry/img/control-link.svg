<rect x="350.0" y="168.0" width="260.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="192.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">висока надійність</tspan><tspan x="480.0" dy="15.6">втрата → безпечний режим</tspan></text>
