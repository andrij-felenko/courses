<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Несподіванка: світовий стандарт виник «між іншим»</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">головною метою був дрон із зором, а не протокол</text>
<rect x="60.0" y="80.0" width="360.0" height="150.0" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="240.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГОЛОВНА мета</text>
<text x="240.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="240.0" dy="0.0">дрон із комп'ютерним зором,</tspan><tspan x="240.0" dy="15.0">що сам літає в приміщенні</tspan><tspan x="240.0" dy="15.0">(змагання мікроапаратів)</tspan></text>
<text x="240.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">→ лишилася науковою роботою</text>
<rect x="480.0" y="80.0" width="360.0" height="150.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="660.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПОБІЧНІ інструменти</text>
<text x="660.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">MAVLink (протокол)</tspan><tspan x="660.0" dy="15.0">+ QGroundControl (станція)</tspan><tspan x="660.0" dy="15.0">зроблені «by accident»</tspan></text>
<text x="660.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">→ стали світовим стандартом</text>
</svg>