<text x="480.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як аспірант із Цюриха дав дронам спільну мову</text>
<text x="480.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">MAVLink став стандартом не наказом, а тому, що відкриту спільноту його підхопила</text>
<line x1="300.0" y1="92.0" x2="300.0" y2="616.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<rect x="293.0" y="115.0" width="14.0" height="14.0" rx="3" fill="#fff" stroke="#b08900" stroke-width="2.4"/>
<text x="278.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2007</text>
<text x="326.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">DIY Drones + ArduCopter</text>
<text x="326.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Кріс Андерсон засновує спільноту; Жорді Муньйос пише автопілот на Arduino</text>
<circle cx="300.0" cy="199.3" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<text x="278.0" y="204.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2008</text>
<text x="326.0" y="197.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Проєкт у ETH Zürich</text>
<text x="326.0" y="217.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Лоренц Маєр будує дрон із комп'ютерним зором для змагань MAV</text>
<circle cx="300.0" cy="276.7" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<text x="278.0" y="281.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2009</text>
<text x="326.0" y="274.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">MAVLink і ArduPilot 1.0</text>
<text x="326.0" y="294.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Маєр випускає MAVLink; Муньйос — ArduPilot 1.0. Дві гілки, одна мова</text>
<circle cx="300.0" cy="354.0" r="7.5" fill="#fff" stroke="#1f47b5" stroke-width="2.8"/>
<text x="278.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2011</text>
<text x="326.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">PX4 і Pixhawk</text>
<text x="326.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Перебудова з нуля: народжуються PX4 і відкрите залізо Pixhawk (ETH + 3DR)</text>
<rect x="293.0" y="424.3" width="14.0" height="14.0" rx="3" fill="#fff" stroke="#b08900" stroke-width="2.4"/>
<text x="278.0" y="436.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2011–12</text>
<text x="326.0" y="429.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Тридж і pymavlink</text>
<text x="326.0" y="449.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Ендрю Тридджелл вибухово розвиває ArduPilot, пише pymavlink і MAVProxy</text>
<rect x="293.0" y="501.7" width="14.0" height="14.0" rx="3" fill="#fff" stroke="#b08900" stroke-width="2.4"/>
<text x="278.0" y="513.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">2014</text>
<text x="326.0" y="506.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Dronecode Foundation</text>
<text x="326.0" y="526.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">MAVLink, PX4, QGroundControl — під дахом Linux Foundation</text>
<circle cx="300.0" cy="586.0" r="9.0" fill="#fff" stroke="#1f8a3b" stroke-width="3"/>
<circle cx="300.0" cy="586.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="278.0" y="591.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">сьогодні</text>
<text x="326.0" y="584.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">MAVLink — лінгва франка</text>
<text x="326.0" y="604.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Нею «розмовляють» PX4, ArduPilot і тисячі апаратів по всьому світу</text>
