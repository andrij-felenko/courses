<rect x="257.1" y="274.2" width="425.8" height="51.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Кожна лінія має свої вимоги — тому їх часто розділяють</tspan><tspan x="470.0" dy="15.6">(різні смуги, різні модулі).</tspan></text>
