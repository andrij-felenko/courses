<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок апарата — не одна лінія, а кілька ролей</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">керування «віжки» вгору, телеметрія «панель приладів» в обидва боки, інколи ще й відео</text>
