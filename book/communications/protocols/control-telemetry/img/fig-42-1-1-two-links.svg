<line x1="700.0" y1="130.0" x2="250.0" y2="130.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="470.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">КЕРУВАННЯ: команди вгору (низька затримка!)</text>
