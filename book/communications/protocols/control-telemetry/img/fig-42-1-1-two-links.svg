<text x="470.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ВІДЕО (FPV): картинка вниз, широка смуга</text>
<rect x="60.0" y="300.0" width="820.0" height="60.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожна лінія має СВОЇ вимоги — тому їх часто розділяють (різні смуги, різні модулі).</text>
<text x="470.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">У цьому розділі головна героїня — лінія телеметрії, бо саме нею «розмовляє» MAVLink.</text>
