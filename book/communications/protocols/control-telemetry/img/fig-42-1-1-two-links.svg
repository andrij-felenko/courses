<text x="470.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">ТЕЛЕМЕТРІЯ: стан вниз + налаштування вгору</text>
