<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіозв'язок дрона — це не одна лінія, а кілька ролей</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">керування «віжки» вгору, телеметрія «панель приладів» вниз, інколи ще й відео</text>
<line x1="161.0" y1="149.0" x2="239.0" y2="191.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
