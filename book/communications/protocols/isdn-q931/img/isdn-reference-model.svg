<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еталонна архітектура ISDN та структури інтерфейсів BRI і PRI</text>
<rect x="20.0" y="20.0" width="1000.0" height="310.0" rx="10" fill="#ffffff" stroke="#c8d6ea" stroke-width="1.4"/>
<text x="40.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Еталонна архітектура абонентського доступу ISDN (ITU-T I.411)</text>
<rect x="40.0" y="75.0" width="120.0" height="60.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="102.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">TE2</tspan><tspan x="100.0" dy="11.7">Аналоговий тел. / RS-232</tspan></text>
<rect x="210.0" y="75.0" width="110.0" height="60.0" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="102.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">TA</tspan><tspan x="265.0" dy="11.7">Термінальний адаптер</tspan></text>
<line x1="160.0" y1="105.0" x2="210.0" y2="105.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">R</text>
<rect x="40.0" y="160.0" width="120.0" height="60.0" rx="6" fill="#eefaf1" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="181.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">TE1</tspan><tspan x="100.0" dy="11.7">ISDN-термінал</tspan><tspan x="100.0" dy="11.7">(цифровий апарат)</tspan></text>
<rect x="380.0" y="115.0" width="120.0" height="80.0" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">NT2</tspan><tspan x="440.0" dy="13.0">Офісна АТС (PBX)</tspan><tspan x="440.0" dy="13.0">/ Мультиплексор</tspan></text>
<line x1="320.0" y1="105.0" x2="380.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="160.0" y1="190.0" x2="380.0" y2="165.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="348.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">S</text>
<text x="270.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">S (пасивна шина)</text>
<rect x="560.0" y="115.0" width="120.0" height="80.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">NT1</tspan><tspan x="620.0" dy="11.7">Мережеве закінчення</tspan><tspan x="620.0" dy="11.7">(L1 перетворювач)</tspan></text>
<line x1="500.0" y1="155.0" x2="560.0" y2="155.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">T</text>
<rect x="820.0" y="115.0" width="180.0" height="80.0" rx="6" fill="#eefaf1" stroke="#333333" stroke-width="1.5"/><text x="917.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="917.0" dy="0.0">LE / ET</tspan><tspan x="917.0" dy="14.3">Місцева станція</tspan><tspan x="917.0" dy="14.3">(комутатор оператора)</tspan></text>
<line x1="680.0" y1="155.0" x2="820.0" y2="155.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="750.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">U (2-провідна абонентська пара)</text>
<text x="750.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2B1Q або 4B3T · до 5.5 км</text>
<rect x="40.0" y="245.0" width="960.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.0"/>
<text x="520.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряме абонентське підключення (без офісної АТС): точки S і T зливаються в єдиний 4-провідний інтерфейс S/T</text>
<text x="520.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">NT1 живить пасивну шину (S-bus) та узгоджує 4 проводи всередині будівлі з 2-провідною парою оператора (U)</text>
<rect x="20.0" y="350.0" width="1000.0" height="310.0" rx="10" fill="#ffffff" stroke="#c8d6ea" stroke-width="1.4"/>
<text x="40.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Структури каналів доступу ISDN: BRI проти PRI (E1 / T1)</text>
<rect x="40.0" y="400.0" width="460.0" height="240.0" rx="8" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.2"/>
<text x="270.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Базовий доступ BRI (2B + D)</text>
<text x="270.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Корисна швидкість: 144 кбіт/с · Лінійна на S/T: 192 кбіт/с</text>
<rect x="60.0" y="470.0" width="190.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="491.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">B1-канал: 64 кбіт/с</tspan><tspan x="155.0" dy="14.3">Голос G.711 / Чисті дані</tspan></text>
<rect x="270.0" y="470.0" width="190.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="365.0" y="491.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">B2-канал: 64 кбіт/с</tspan><tspan x="365.0" dy="14.3">Голос G.711 / Чисті дані</tspan></text>
<rect x="160.0" y="535.0" width="220.0" height="45.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="554.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">D-канал: 16 кбіт/с</tspan><tspan x="270.0" dy="14.3">Сигналізація Q.931 / LAPD</tspan></text>
<rect x="60.0" y="595.0" width="420.0" height="30.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="270.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Службові біти кадру L1 (синхронізація, ехо D-каналу): 48 кбіт/с</text>
<rect x="520.0" y="400.0" width="480.0" height="240.0" rx="8" fill="#eefaf1" stroke="#c8e6c9" stroke-width="1.2"/>
<text x="760.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Первинний доступ PRI (Магістральний потік)</text>
<text x="760.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Європа / ITU: E1 (2.048 Мбіт/с) · Північна Америка: T1 (1.544 Мбіт/с)</text>
<rect x="540.0" y="470.0" width="440.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="492.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">E1 PRI: 30B + D + Framing (32 таймслоти × 64 кбіт/с)</tspan><tspan x="760.0" dy="13.7">Таймслот 0 = Синхронізація/FAS, Таймслот 16 = D-канал 64 кбіт/с</tspan></text>
<rect x="540.0" y="535.0" width="440.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="554.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">T1 PRI: 23B + D (24 таймслоти × 64 кбіт/с + 8 кбіт/с кадрування)</tspan><tspan x="760.0" dy="13.7">Таймслот 24 = D-канал 64 кбіт/с сигналізації Q.931</tspan></text>
<rect x="540.0" y="595.0" width="440.0" height="30.0" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="760.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">NFAS: 1 D-канал може керувати до 20 транками T1/E1 (до 479 B-каналів)</text>
</svg>