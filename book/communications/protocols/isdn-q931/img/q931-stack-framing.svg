<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек протоколів D-каналу та бінарне кодування кадрів LAPD і Q.931</text>
<rect x="20.0" y="20.0" width="1000.0" height="680.0" rx="10" fill="#ffffff" stroke="#c8d6ea" stroke-width="1.4"/>
<text x="40.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Стек сигналізації D-каналу та анатомія кадру LAPD (Q.921) + Q.931</text>
<rect x="40.0" y="75.0" width="230.0" height="200.0" rx="8" fill="#f4f6f8" stroke="#c8d6ea" stroke-width="1.2"/>
<text x="155.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек рівнів D-каналу</text>
<rect x="55.0" y="115.0" width="200.0" height="42.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="133.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Рівень 3: ITU-T Q.931</tspan><tspan x="155.0" dy="11.7">Керування викликами (Call Control)</tspan></text>
<rect x="55.0" y="165.0" width="200.0" height="42.0" rx="6" fill="#eef3fb" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Рівень 2: LAPD (Q.921)</tspan><tspan x="155.0" dy="13.0">Надійний канал кадрів (HDLC)</tspan></text>
<rect x="55.0" y="215.0" width="200.0" height="42.0" rx="6" fill="#eefaf1" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="233.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Рівень 1: I.430 (BRI) / I.431 (PRI)</tspan><tspan x="155.0" dy="11.7">Фізичний рівень, TDM, біти E</tspan></text>
<rect x="300.0" y="75.0" width="700.0" height="200.0" rx="8" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.2"/>
<text x="320.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Кадр LAPD канального рівня L2 (передається біт-орієнтовано з прапорцями 0x7E)</text>
<rect x="320.0" y="115.0" width="60.0" height="48.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="136.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Прапорець</tspan><tspan x="350.0" dy="11.7">0x7E</tspan></text>
<rect x="385.0" y="115.0" width="120.0" height="48.0" rx="6" fill="#eefaf1" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">Адреса (2 байти)</tspan><tspan x="445.0" dy="13.0">SAPI, C/R, TEI</tspan></text>
<rect x="510.0" y="115.0" width="110.0" height="48.0" rx="6" fill="#eefaf1" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="136.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">Керування (1-2 Б)</tspan><tspan x="565.0" dy="11.7">I / S / U-кадр</tspan></text>
<rect x="625.0" y="115.0" width="230.0" height="48.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="136.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Інформаційне поле (Інфо)</tspan><tspan x="740.0" dy="11.7">Корисне навантаження L3 (Пакет Q.931)</tspan></text>
<rect x="860.0" y="115.0" width="75.0" height="48.0" rx="6" fill="#eefaf1" stroke="#333333" stroke-width="1.5"/><text x="897.5" y="136.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="897.5" dy="0.0">FCS (CRC-16)</tspan><tspan x="897.5" dy="11.7">2 байти</tspan></text>
<rect x="940.0" y="115.0" width="50.0" height="48.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="965.0" y="142.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">0x7E</tspan></text>
<rect x="320.0" y="175.0" width="660.0" height="85.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="335.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Адресне поле LAPD:</text>
<text x="335.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• SAPI (6 бітів): 0 = Сигналізація виклику Q.931; 16 = Пакети X.25; 63 = Керування TEI</text>
<text x="335.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• C/R (1 біт): Команда / Відповідь · EA0/EA1: Біти розширення адреси (0 у 1-му байті, 1 у 2-му)</text>
<text x="335.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• TEI (7 бітів): 0 = Точка-точка (PRI/PBX); 64–126 = Динамічні адреси терміналів BRI; 127 = Broadcast</text>
<rect x="40.0" y="295.0" width="960.0" height="390.0" rx="8" fill="#fdf3e6" stroke="#f5c6cb" stroke-width="1.2"/>
<text x="60.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Анатомія повідомлення Q.931 (L3 PDU)</text>
<rect x="60.0" y="340.0" width="180.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Дискримінатор протоколу</tspan><tspan x="150.0" dy="11.7">1 байт: 0x08 = Q.931</tspan><tspan x="150.0" dy="11.7">(0x03 = X.25, 0x40 = Q.932)</tspan></text>
<rect x="250.0" y="340.0" width="230.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="365.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Call Reference (Посилання виклику)</tspan><tspan x="365.0" dy="11.7">1 байт довжини + 1-2 байти значення</tspan><tspan x="365.0" dy="11.7">Старший біт: 0=Originator, 1=Destination</tspan></text>
<rect x="490.0" y="340.0" width="180.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Тип повідомлення</tspan><tspan x="580.0" dy="13.0">1 байт: SETUP (0x05),</tspan><tspan x="580.0" dy="13.0">CONNECT (0x07), DISC...</tspan></text>
<rect x="680.0" y="340.0" width="300.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Змінні інформаційні елементи (IE)</tspan><tspan x="830.0" dy="13.0">Набір параметрів змінної довжини (TLV):</tspan><tspan x="830.0" dy="13.0">Номери, Кодеки, Канал, Причина</tspan></text>
<rect x="60.0" y="410.0" width="920.0" height="260.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="80.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ключові інформаційні елементи (Information Elements, IE) у повідомленнях Q.931:</text>
<text x="80.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">0x04 · Bearer Capability</text>
<text x="310.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Тип послуги: Мова G.711 (A/μ-law), 3.1 кГц аудіо (модем/факс), Unrestricted Digital 64k (дані без обробки).</text>
<text x="80.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">0x18 · Channel Identification</text>
<text x="310.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вибір B-каналу: B1 або B2 для BRI, номер таймслота 1–31 для PRI. Прапорець: Preferred (бажаний) чи Exclusive (виключний).</text>
<text x="80.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">0x6C · Calling Party Number</text>
<text x="310.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Номер абонента, що кличе (E.164), тип номера (міжнародний/національний), ознака заборони показу номера (CLIR).</text>
<text x="80.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">0x70 · Called Party Number</text>
<text x="310.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Номер абонента, якого кличуть (E.164 цифри призначення: план нумерації, код міста, номер лінії).</text>
<text x="80.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">0x08 · Cause (Причина)</text>
<text x="310.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Діагностичний код завершення/відмови: 16 = Normal clearing, 17 = User busy, 1 = Unallocated number, 34 = No circuit.</text>
<text x="80.0" y="655.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">0x28 · Display / 0x1E · Progress</text>
<text x="310.0" y="655.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Текстовий напис для екрана телефону або індикатор внутрішньосмугового сигналу (In-band information available).</text>
</svg>