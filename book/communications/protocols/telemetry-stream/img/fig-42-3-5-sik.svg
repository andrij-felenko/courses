<rect x="60.0" y="226.0" width="820.0" height="80.0" rx="9" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="470.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Відкрита прошивка SiK; діапазон 433 / 868 / 915 МГц; стрибки частоти (FHSS, §40.5); ~100 мВт; дальність — кілометри.</text>
<text x="470.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Серійна швидкість зазвичай 57600 бод. Сильніший варіант — RFD900 на десятки км.</text>
<text x="470.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Підключив air до телеметрійного UART контролера, ground — у USB ноутбука, і MAVLink «полетів».</text>
</svg>
