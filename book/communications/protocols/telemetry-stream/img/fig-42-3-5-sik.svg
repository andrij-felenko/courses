<text x="470.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Класика телеметрії: SiK-радіо (3DR / RFD900)</text>
<text x="470.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дві однакові платки з антенами — найпоширеніший спосіб пустити MAVLink по радіо</text>
<rect x="180.0" y="110.0" width="140.0" height="70.0" rx="6" fill="#1f3a1f" stroke="#1f8a3b" stroke-width="1.6"/>
<line x1="320.0" y1="130.0" x2="360.0" y2="100.0" stroke="#9a9aa0" stroke-width="3" stroke-linecap="round"/>
<rect x="200.0" y="130.0" width="40.0" height="30.0" rx="0" fill="#3a5a3a" stroke="#9ec99e" stroke-width="1"/>
<text x="250.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#cfe8cf" text-anchor="middle" font-weight="normal" font-style="normal">Si chip</text>
<text x="250.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">air (на дроні)</text>
<rect x="620.0" y="110.0" width="140.0" height="70.0" rx="6" fill="#1f3a1f" stroke="#1f8a3b" stroke-width="1.6"/>
<line x1="760.0" y1="130.0" x2="800.0" y2="100.0" stroke="#9a9aa0" stroke-width="3" stroke-linecap="round"/>
<rect x="640.0" y="130.0" width="40.0" height="30.0" rx="0" fill="#3a5a3a" stroke="#9ec99e" stroke-width="1"/>
<text x="690.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#cfe8cf" text-anchor="middle" font-weight="normal" font-style="normal">Si chip</text>
<text x="690.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ground (на USB)</text>
<line x1="330.0" y1="145.0" x2="610.0" y2="145.0" stroke="#b08900" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#aAmb)"/>
