<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 462" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="462" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="40.0" width="214.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">1 · розбір заголовка</tspan></text>
<text x="274.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">12 байтів із мережевого порядку: seq, ts, PT, M, SSRC</text>
<text x="274.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">відсіюємо: не другу версію й обрізані датаграми</text>
<line x1="137.0" y1="104.0" x2="137.0" y2="116.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="118.0" width="214.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">2 · розгортання номера</tspan></text>
<text x="274.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">16 біт → монотонні 64: кола переповнення рахуємо самі</text>
<text x="274.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">відсіюємо: дублікат і пакет, що відстав більше за вікно</text>
<line x1="137.0" y1="182.0" x2="137.0" y2="194.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="196.0" width="214.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">3 · вікно пересортування</tspan></text>
<text x="274.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">кільце на N слотів; віддаємо суцільний ряд від голови</text>
<text x="274.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">здаємось на дірі: тисне вікно або вийшов бюджет часу</text>
<line x1="137.0" y1="260.0" x2="137.0" y2="272.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="274.0" width="214.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">4 · збирання кадру</tspan></text>
<text x="274.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">усі пакети зі спільною міткою часу — до маркерного включно</text>
<text x="274.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">діра всередині кадру → кадр іде позначений як пошкоджений</text>
<line x1="137.0" y1="338.0" x2="137.0" y2="350.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="352.0" width="214.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="137.0" y="387.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">5 · віддача декодерові</tspan></text>
<text x="274.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">кадр, мітка часу й прапорець цілості — далі декодер</text>
<text x="274.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">коли саме показувати — вирішує вже буфер джитера</text>
</svg>