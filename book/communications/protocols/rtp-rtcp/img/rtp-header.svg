<text x="60.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">seq — росте на одиницю з кожним пакетом: відновити порядок, побачити діру</text>
<text x="60.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">timestamp — момент у годиннику медіа: КОЛИ показувати, а не коли прийшло</text>
<text x="60.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">SSRC — випадковий номер потоку: аудіо й відео одного джерела мають різні</text>
<text x="60.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">PT — тип навантаження: який кодек і яка частота годинника міток</text>
<text x="60.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">M — маркер: у відео означає останній пакет кадру</text>
