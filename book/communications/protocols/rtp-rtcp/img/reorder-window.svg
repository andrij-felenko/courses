<text x="105.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">голова черги</text>
<text x="105.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">стоїть на дірі</text>
<text x="385.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">найдалі отриманий</text>
<text x="385.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">випередив голову на 4</text>
<text x="46.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Синє — пакет уже в кільці й чекає; біле — ще не прийшов; червоне — на ньому стоїть голова.</text>
<text x="46.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Поки голова стоїть, віддавати нічого не можна: 4183 без 4182 — це переставлений порядок.</text>
<text x="46.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Здаємось і оголошуємо втрату за одним із двох порогів: найдалі отриманий випередив голову</text>
<text x="46.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">більше ніж на глибину вікна, або голова простояла довше за відведений бюджет часу.</text>
<text x="46.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Пакет із номером ПОЗАДУ голови викидаємо мовчки: його місце в потоці вже проїхало.</text>
</svg>