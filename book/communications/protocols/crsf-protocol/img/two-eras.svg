<text x="150.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">2015</text>
<line x1="355.0" y1="112.0" x2="355.0" y2="124.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="355.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">2016</text>
<line x1="600.0" y1="112.0" x2="600.0" y2="124.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="600.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">~2020</text>
<line x1="820.0" y1="112.0" x2="820.0" y2="124.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="820.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">2021</text>
<rect x="95.0" y="150.0" width="330.0" height="128.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="260.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фірмовий винахід</text>
<text x="260.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">TBS Crossfire, Team BlackSheep</text>
<rect x="112.0" y="210.0" width="296.0" height="56.0" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.2"/><text x="260.0" y="235.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">далекобійний лінк FPV; свій формат «приймач↔контролер»</tspan><tspan x="260.0" dy="11.7">поверх звичайного UART — рішення ПІД СВІЙ продукт</tspan></text>
<rect x="545.0" y="150.0" width="350.0" height="128.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="720.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Стандарт через прийняття</text>
<text x="720.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ExpressLRS (відкритий проєкт)</text>
<rect x="562.0" y="210.0" width="316.0" height="56.0" rx="6" fill="#f4faf5" stroke="#27ae60" stroke-width="1.2"/><text x="720.0" y="235.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">не став вигадувати свій формат — узяв готовий CRSF</tspan><tspan x="720.0" dy="11.7">і зосередився на власне радіо. Так формат став спільним</tspan></text>
<line x1="425.0" y1="214.0" x2="545.0" y2="214.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="485.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">узяв</text>
<text x="485.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">готове</text>
<text x="470.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключова різниця: TBS ВИНАЙШОВ формат для себе; ELRS зробив його ДЕ-ФАКТО стандартом,</text>
<text x="470.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">прийнявши як є. Стандарт тут не спроєктований комітетом, а виріс із прийняття чужого рішення.</text>
<text x="470.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Дати веб-звірено: Crossfire — 2015; широке піднесення ELRS на 2.4 ГГц і прийняття CRSF — близько 2020.</text>
