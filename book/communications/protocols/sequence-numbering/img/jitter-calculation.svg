<svg xmlns="http://www.w3.org/2000/svg" viewBox="-47.2 -10 887.2 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-47.2" y="-10" width="887.2" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часові мітки та розрахунок інтервального джиттера (RFC 3550)</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Оцінка варіації мережевої затримки: D(i, j) = (R_j - S_j) - (R_i - S_i),  J = J + (|D| - J) / 16</text>
<text x="60.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">TX (Відправник)</text>
<text x="60.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">RX (Одержувач)</text>
<line x1="80.0" y1="110.0" x2="780.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<line x1="80.0" y1="330.0" x2="780.0" y2="330.0" stroke="#333333" stroke-width="1.8"/>
<line x1="770.0" y1="110.0" x2="800.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="330.0" x2="800.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="805.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">t</text>
<text x="805.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">t</text>
<circle cx="160.0" cy="110.0" r="5.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<circle cx="310.0" cy="330.0" r="5.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<line x1="160.0" y1="115.0" x2="310.0" y2="325.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">S₁ = 0 мс</text>
<text x="310.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">R₁ = 30 мс</text>
<text x="215.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Пакет 1 (затримка 30 мс)</text>
<circle cx="320.0" cy="110.0" r="5.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<circle cx="420.0" cy="330.0" r="5.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<line x1="320.0" y1="115.0" x2="420.0" y2="325.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">S₂ = 20 мс</text>
<text x="420.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">R₂ = 40 мс</text>
<text x="355.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-style="italic">Пакет 2 (затримка 20 мс)</text>
<circle cx="480.0" cy="110.0" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<circle cx="710.0" cy="330.0" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="480.0" y1="115.0" x2="710.0" y2="325.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">S₃ = 40 мс</text>
<text x="710.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">R₃ = 95 мс</text>
<text x="575.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Пакет 3 (затримка 55 мс - сплеск)</text>
<rect x="80.0" y="380.0" width="680.0" height="80.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покроковий розрахунок різниці затримок D та оновлення джиттера J:</text>
<text x="420.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1 → 2: D(1, 2) = (40 - 20) - (30 - 0) = 20 - 30 = -10 мс  ⇒  |D| = 10 мс  ⇒  J₁ = 0 + (10 - 0)/16 = 0.625 мс</text>
<text x="420.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2 → 3: D(2, 3) = (95 - 40) - (40 - 20) = 55 - 20 = +35 мс  ⇒  |D| = 35 мс  ⇒  J₂ = 0.625 + (35 - 0.625)/16 ≈ 2.77 мс</text>
</svg>