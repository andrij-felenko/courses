AMSL / Rel / AGL)</text><text x="60.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">28..31 б:</text><rect x="140.0" y="210.0" width="356.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="318.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">seq (uint16)</text><text x="318.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Індекс елемента в місії (0 .. 65535)</text><rect x="502.0" y="210.0" width="362.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="683.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">command (uint16)</text><text x="683.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Код дії (перелік MAV_CMD_NAV / DO / COND)</text><text x="60.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">32..37 б:</text><rect x="140.0" y="275.0" width="115.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="197.5" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">target_system</text><text x="197.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Sys ID</text><rect x="261.0" y="275.0" width="115.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="318.5" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">target_component</text><text x="318.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Comp ID</text><rect x="382.0" y="275.0" width="125.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="444.5" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">frame</text><text x="444.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MAV_FRAME</text><rect x="513.0" y="275.0" width="115.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.5" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">current</text><text x="570.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1=Активний</text><rect x="634.0" y="275.0" width="115.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="691.5" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">autocontinue</text><text x="691.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1=Автоперехід</text><rect x="755.0" y="275.0" width="115.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="812.5" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">mission_type</text><text x="812.5" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0=Mission</text><rect x="140.0" y="345.0" width="724.0" height="95.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="155.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Ключові властивості протокольного пакування:</text><text x="155.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Масштабування географічних координат: Lat/Lon множаться на 10⁷ (дискретність ≈ 1.11 см на екваторі замість ~1.7 м у float32).</text><text x="155.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Поле frame визначає спосіб тлумачення висоти z (AMSL / відносно точки старту / відносно рельєфу AGL / локальні метри).</text><text x="155.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Порядок полів у кадрі MAVLink автоматично сортується генератором за спаданням розміру типів для запобігання паддінгу.</text>
</svg>