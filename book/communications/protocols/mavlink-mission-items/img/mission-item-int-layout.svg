<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкова структура корисного навантаження MISSION_ITEM_INT (#73, 38 байтів)</text><text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розподіл полів за правилом вирівнювання MAVLink v2 (від 4-байтових до 1-байтових)</text><text x="60.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">0..15 б:</text><rect x="140.0" y="80.0" width="175.0" height="44.0" rx="4" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="227.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">param1 (float)</text><text x="227.5" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Параметр 1 (час / кут)</text><rect x="321.0" y="80.0" width="175.0" height="44.0" rx="4" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="408.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">param2 (float)</text><text x="408.5" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Параметр 2 (радіус прийому)</text><rect x="502.0" y="80.0" width="175.0" height="44.0" rx="4" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="589.5" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">param3 (float)</text><text x="589.5" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Параметр 3 (радіус прольоту)</text><rect x="68