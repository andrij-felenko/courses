<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія проходження точки маршруту (MAV_CMD_NAV_WAYPOINT)</text><text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Радіус прийому (param2), радіус зрізання кута (param3) та таймер зависання (param1)</text><rect x="45.0" y="70.0" width="370.0" height="370.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="230.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">А: Зупинка та зависання (param1 &gt; 0)</text><circle cx="265.0" cy="180.0" r="45.0" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/><circle cx="265.0" cy="180.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="277.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">WPT 1</text><line x1="85.0" y1="250.0" x2="265.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="165.0" y1="219.0" x2="185.0" y2="211.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/><text x="85.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Старт</text><line x1="265.0" y1="180.0" x2="375.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="3,3"/><line x1="310.0" y1="159.0" x2="330.0" y2="151.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/><text x="365.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">До WPT 2</text><line x1="265.0" y1="180.0" x2="233.2" y2="211.8" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">R_acc</text><rect x="60.0" y="305.0" width="340.0" height="115.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="70.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Послідовність автопілота:</text><text x="70.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Вхід у сферу R_acc — гальмування до 0 м/с.</text><text x="70.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Відлік таймера зависання (Hold Time у с).</text><text x="70.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Розворот курсу та перехід до наступного seq.</text><rect x="445.0" y="70.0" width="370.0" height="370.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="630.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Б: Плавне зрізання кута (Fly-Through)</text><circle cx="645.0" cy="175.0" r="45.0" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/><circle cx="645.0" cy="175.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="657.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">WPT 1</text><line x1="485.0" y1="250.0" x2="645.0" y2="175.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/><line x1="645.0" y1="175.0" x2="775.0" y2="130.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/><path d="M 485,250 Q 610,210 775,130" fill="none" stroke="#27ae60" stroke-width="2.5"/><text x="555.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Траєкторія L1 (R_pass)</text><rect x="460.0" y="305.0" width="340.0" height="115.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/><text x="470.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Переваги прольоту по дузі:</text><text x="470.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Швидкість не падає до 0 (збереження енергії).</text><text x="470.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Відсутність ривків орієнтації та камери.</text><text x="470.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Ідеально для літаків і картографічної сітки.</text>
</svg>