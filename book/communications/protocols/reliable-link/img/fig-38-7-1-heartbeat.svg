<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Серцебиття (heartbeat): «я живий» через рівні проміжки</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пристрій періодично шле короткий сигнал; зник на надто довго — значить, зв'язок утрачено</text>
<line x1="110.0" y1="170.0" x2="800.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="800.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">час →</text>
<line x1="150.0" y1="170.0" x2="150.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<text x="150.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">♥</text>
<line x1="250.0" y1="170.0" x2="250.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<text x="250.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">♥</text>
<line x1="350.0" y1="170.0" x2="350.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<text x="350.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">♥</text>
<line x1="450.0" y1="170.0" x2="450.0" y2="130.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<text x="450.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">♥</text>
<text x="300.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">рівні удари: «живий, живий…»</text>
<rect x="490.0" y="126.0" width="230.0" height="44.0" rx="5" fill="#fdeeee" stroke="#c0271e" stroke-width="1.4"/>
<text x="605.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">немає ударів</text>
<line x1="745.0" y1="170.0" x2="745.0" y2="110.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="745.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тиша задовга → ВТРАТА</text>
<rect x="60.0" y="248.0" width="780.0" height="70.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіо рідко дає чітку подію «від'єднано» — тож втрату ловлять саме за ВІДСУТНІСТЮ серцебиття.</text>
<text x="450.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий heartbeat ми ще зустрінемо в протоколі MAVLink (§42).</text>
</svg>
