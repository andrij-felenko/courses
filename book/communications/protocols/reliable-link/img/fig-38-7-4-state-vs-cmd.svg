<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Шли СТАН, а не приріст: втрата сама виправляється</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">абсолютне значення наступне оновлення лагодить; приріст («+10») при втраті зникає назавжди</text>
<text x="110.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">СТАН (добре):</text>
<rect x="130.0" y="130.0" width="120.0" height="30.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="190.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">газ=30</text>
<rect x="330.0" y="130.0" width="120.0" height="30.0" rx="5" fill="#f4f4f4" stroke="#c0271e" stroke-width="1.4"/>
<text x="390.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">газ=50 зник</text>
<rect x="530.0" y="130.0" width="120.0" height="30.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="590.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">газ=70</text>
<text x="450.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">втратили «50» — але «70» одразу все виправило (приймач знає точне значення)</text>
<text x="110.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ПРИРІСТ (погано):</text>
<rect x="130.0" y="260.0" width="120.0" height="30.0" rx="5" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="190.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+10</text>
<rect x="330.0" y="260.0" width="120.0" height="30.0" rx="5" fill="#f4f4f4" stroke="#c0271e" stroke-width="1.4"/>
<text x="390.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+10 зник</text>
<rect x="530.0" y="260.0" width="120.0" height="30.0" rx="5" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="590.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+10</text>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">втратили один «+10» — і приймач НАЗАВЖДИ на 10 нижче, ніж мав бути</text>
<rect x="60.0" y="330.0" width="780.0" height="1.0" rx="0" fill="none" stroke="none" stroke-width="0"/>
</svg>
