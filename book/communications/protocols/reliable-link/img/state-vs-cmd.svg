<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шли стан, а не приріст: втрата сама виправляється</text>
<text x="110.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">стан (добре): шлемо точне значення</text>
<rect x="110.0" y="108.0" width="110.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="165.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">газ=30</text>
<rect x="290.0" y="108.0" width="110.0" height="32.0" rx="6" fill="#f4f4f4" stroke="#c0392b" stroke-width="1.4"/>
<text x="345.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">газ=50</text>
<line x1="220.0" y1="124.0" x2="288.0" y2="124.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="470.0" y="108.0" width="110.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="525.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">газ=70</text>
<line x1="400.0" y1="124.0" x2="468.0" y2="124.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="360.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">загубили «50» — «70» одразу все виправило</text>
<text x="110.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">приріст (погано): шлемо зміну</text>
<rect x="110.0" y="238.0" width="110.0" height="32.0" rx="6" fill="#eef4ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="165.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+10</text>
<rect x="290.0" y="238.0" width="110.0" height="32.0" rx="6" fill="#f4f4f4" stroke="#c0392b" stroke-width="1.4"/>
<text x="345.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+10</text>
<line x1="220.0" y1="254.0" x2="288.0" y2="254.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="470.0" y="238.0" width="110.0" height="32.0" rx="6" fill="#eef4ff" stroke="#c0392b" stroke-width="1.8"/>
<text x="525.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+10</text>
<line x1="400.0" y1="254.0" x2="468.0" y2="254.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="360.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">загубили один «+10» — приймач назавжди на 10 нижче</text>
</svg>