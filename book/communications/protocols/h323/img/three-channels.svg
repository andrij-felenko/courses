<line x1="530.0" y1="480.0" x2="812.0" y2="480.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="530.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">RTP і RTCP — власне звук і відео</text>
<text x="530.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">UDP, пари портів, кожен напрям окремо</text>
<text x="530.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">воротар медіа не бачить: потік іде найкоротшим шляхом</text>
