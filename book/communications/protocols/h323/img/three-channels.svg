<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три канали сигналізації H.323 і медіа повз воротаря</text>
<rect x="30.0" y="150.0" width="1000.0" height="440.0" rx="12" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.2"/>
<text x="52.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Зона одного воротаря</text>
<rect x="334.8" y="43.0" width="390.5" height="49.9" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="64.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Воротар (gatekeeper): хто зареєстрований у зоні,</tspan><tspan x="530.0" dy="16.9">скільки смуги вже роздано, чи можна ще один виклик</tspan></text>
<rect x="70.0" y="250.0" width="170.0" height="250.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Термінал A</tspan></text>
<rect x="820.0" y="250.0" width="170.0" height="250.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="905.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="905.0" dy="0.0">Термінал B</tspan></text>
