<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -10 812 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-26" y="-10" width="812" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стиснення заголовків Van Jacobson (CSLIP, RFC 1144)</text>
<text x="40.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Стандартний пакет SLIP (40 байтів заголовків):</text>
