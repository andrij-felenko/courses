<text x="565.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">END</text>
<text x="610.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Заголовки = 40 байтів</text>
<text x="40.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Стиснений пакет CSLIP (стиснення до 3–5 байтів):</text>
<rect x="40.0" y="190.0" width="70.0" height="38.0" rx="4" fill="#fdeeed" stroke="#c0392b" stroke-width="1.6"/>
<text x="75.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SLIP</text>
<text x="75.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">END</text>
<rect x="115.0" y="190.0" width="95.0" height="38.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
