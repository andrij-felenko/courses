<text x="255.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 байт</text>
<rect x="300.0" y="190.0" width="110.0" height="38.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="355.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Delta Seq/ACK</text>
<text x="355.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1-3 байти</text>
<rect x="415.0" y="190.0" width="120.0" height="38.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="475.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Payload</text>
<text x="475.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані (1-100 B)</text>
<rect x="540.0" y="190.0" width="70.0" height="38.0" rx="4" fill="#fdeeed" stroke="#c0392b" stroke-width="1.6"/>
<text x="575.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SLIP</text>
<text x="575.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">END</text>
<text x="620.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Заголовки = 3–5 байтів!</text>
<rect x="40.0" y="260.0" width="680.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.2"/><text x="380.0" y="287.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">На повільних лініях (9600–19200 бод) CSLIP скорочує затримку інтерактивних сесій (SSH/Telnet) у 5–10 разів, передаючи лише дельти полів замість статичних IP/TCP адрес і портів.</tspan></text>
</svg>