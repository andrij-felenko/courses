<text x="185.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">IP Header</text>
<text x="185.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">20 байтів</text>
<rect x="260.0" y="80.0" width="140.0" height="38.0" rx="4" fill="#fef5e7" stroke="#d35400" stroke-width="1.6"/>
<text x="330.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">TCP Header</text>
<text x="330.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">20 байтів</text>
<rect x="405.0" y="80.0" width="120.0" height="38.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="465.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Payload</text>
