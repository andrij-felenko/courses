<svg xmlns="http://www.w3.org/2000/svg" viewBox="-23.75 -10 807.5 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-23.75" y="-10" width="807.5" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінцевий автомат (FSM) декодера SLIP</text>
<circle cx="200.0" cy="160.0" r="65.0" fill="#ebf5fb" stroke="#2457d6" stroke-width="2.2"/>
<text x="200.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">STATE_NORMAL</text>
<text x="200.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Збирання кадру</text>
<circle cx="560.0" cy="160.0" r="65.0" fill="#fef5e7" stroke="#d35400" stroke-width="2.2"/>
<text x="560.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">STATE_ESCAPED</text>
<text x="560.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Очікування підстановки</text>
<line x1="265.0" y1="140.0" x2="495.0" y2="140.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">байт == 0xDB (ESC)</text>
<line x1="495.0" y1="180.0" x2="265.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">0xDC → додати 0xC0 | 0xDD → додати 0xDB</text>
<line x1="160.0" y1="110.0" x2="160.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="160.0" y1="70.0" x2="240.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="240.0" y1="70.0" x2="240.0" y2="108.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">байт != 0xC0, 0xDB → додати в буфер</text>
<line x1="160.0" y1="210.0" x2="160.0" y2="250.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="160.0" y1="250.0" x2="240.0" y2="250.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="240.0" y1="250.0" x2="240.0" y2="212.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">байт == 0xC0 (END) → якщо len &gt; 0: видати пакет</text>
<rect x="40.0" y="318.0" width="680.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.2"/><text x="380.0" y="345.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Крайові випадки: якщо у стані STATE_ESCAPED приходить 0xC0 (порушення послідовності) — кадр скидається через помилку протоколу. Якщо буфер досягає MTU — надлишок відкидається.</tspan></text>
