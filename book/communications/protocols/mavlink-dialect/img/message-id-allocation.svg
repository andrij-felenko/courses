<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір ідентифікаторів Message ID: MAVLink v1 проти MAVLink 2</text>
<text x="80.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">MAVLink v1 (8 бітів у заголовку: 0 .. 255)</text>
<rect x="80.0" y="95.0" width="470.0" height="55.0" rx="6" fill="#edf2f7" stroke="#2457d6" stroke-width="1.5"/><text x="315.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">0 .. 149 (Ядро та Common)</tspan><tspan x="315.0" dy="14.3">HEARTBEAT, ATTITUDE, GPS_RAW, COMMAND_LONG</tspan></text>
<rect x="555.0" y="95.0" width="230.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">150 .. 240 (Вендори v1)</tspan><tspan x="670.0" dy="13.0">ArduPilot, MatrixPilot, AutoQuad</tspan></text>
<rect x="790.0" y="95.0" width="70.0" height="55.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="825.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">241..255</tspan><tspan x="825.0" dy="13.0">Тести</tspan></text>
<text x="470.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">У v1 виникали непереборні колізії: вендори призначали однакові номери 150..240 різним повідомленням.</text>
<text x="80.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">MAVLink 2 (24 біти у заголовку: 0 .. 16 777 215)</text>
<rect x="80.0" y="240.0" width="110.0" height="60.0" rx="6" fill="#edf2f7" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="267.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">0 .. 255</tspan><tspan x="135.0" dy="11.7">Сумісність із v1</tspan></text>
<rect x="195.0" y="240.0" width="195.0" height="60.0" rx="6" fill="#f4ecf7" stroke="#7d3c98" stroke-width="1.5"/><text x="292.5" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="292.5" dy="0.0">256 .. 9 999</tspan><tspan x="292.5" dy="12.3">Розширення standard / common</tspan><tspan x="292.5" dy="12.3">(ODOMETRY, OBSTACLE_DISTANCE)</tspan></text>
<rect x="395.0" y="240.0" width="185.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="487.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="487.5" dy="0.0">10 000 .. 41 999</tspan><tspan x="487.5" dy="13.7">Офіційні вендори</tspan><tspan x="487.5" dy="13.7">(PX4, ArduPilot mega v2)</tspan></text>
<rect x="585.0" y="240.0" width="145.0" height="60.0" rx="6" fill="#e0f2f1" stroke="#0d9488" stroke-width="1.5"/><text x="657.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="657.5" dy="0.0">42 000 .. 42 999</tspan><tspan x="657.5" dy="13.7">Приватні діалекти</tspan><tspan x="657.5" dy="13.7">(Custom Payloads)</tspan></text>
<rect x="735.0" y="240.0" width="125.0" height="60.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/><text x="797.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="797.5" dy="0.0">43 000 .. 16.7M</tspan><tspan x="797.5" dy="13.7">Стратегічний</tspan><tspan x="797.5" dy="13.7">резерв</tspan></text>
<text x="470.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило безпеки: приватні повідомлення завжди реєструють у 24-бітному просторі (наприклад, 42000..42999).</text>
<text x="470.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Це унеможливлює накладання з офіційними оновленнями common.xml та ardupilotmega.xml.</text>
<rect x="80.0" y="395.0" width="780.0" height="55.0" rx="4" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="100.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Діапазон 0..255:</text>
<text x="215.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">пакується в 1 байт у кадрах v1 або в 3 байти в кадрах v2; спільний для обох версій.</text>
<text x="100.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="start" font-weight="700">Діапазон 256+:</text>
<text x="215.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">дозволений ВИКЛЮЧНО в MAVLink 2 (маркер кадру 0xFD); у кадр v1 (0xFE) фізично не вміщується.</text>
</svg>