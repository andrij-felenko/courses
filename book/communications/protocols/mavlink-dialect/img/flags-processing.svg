<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 961 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="961" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка прапорців заголовка MAVLink 2: IFLAG проти CFLAG</text>
<rect x="60.0" y="80.0" width="200.0" height="50.0" rx="6" fill="#edf2f7" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Отримано кадр MAVLink 2</tspan><tspan x="160.0" dy="15.0">(STX = 0xFD)</tspan></text>
<line x1="260.0" y1="105.0" x2="330.0" y2="105.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.7" y="73.2" width="318.7" height="63.6" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Перевірка incompat_flags (IFLAG)</tspan><tspan x="470.0" dy="14.3">Чи встановлено біти, НЕВІДОМІ цьому приймачеві?</tspan><tspan x="470.0" dy="14.3">(Наприклад, біт 0x01 = MAVLINK_IFLAG_SIGNED)</tspan></text>
<line x1="470.0" y1="145.0" x2="470.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="370.0" y="220.0" width="200.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">ВІДХИЛИТИ КАДР (DROP)</tspan><tspan x="470.0" dy="14.3">Несумісний бінарний формат</tspan></text>
<line x1="625.0" y1="105.0" x2="690.0" y2="105.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="655.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">НІ</text>
<rect x="672.3" y="76.1" width="235.5" height="57.8" rx="6" fill="#f4f6f8" stroke="#7d3c98" stroke-width="1.5"/><text x="790.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Аналіз compat_flags (CFLAG)</tspan><tspan x="790.0" dy="13.7">(Додаткові необов'язкові опції,</tspan><tspan x="790.0" dy="13.7">наприклад 24-бітний розширений лінк)</tspan></text>
<line x1="790.0" y1="160.0" x2="790.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="812.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Усі прапорці</text>
<rect x="640.0" y="220.0" width="260.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">ПРИЙНЯТИ ТА ОБРОБИТИ ПАКЕТ</tspan><tspan x="770.0" dy="11.7">• Невідомі біти CFLAG безпечно ігноруються (сумісність збережено);</tspan><tspan x="770.0" dy="11.7">• Відомі IFLAG активують обов'язкову логіку (перевірку підпису HMAC-SHA256);</tspan><tspan x="770.0" dy="11.7">• Перевіряється контрольна сума кадру з урахуванням CRC_EXTRA діалекту.</tspan></text>
<rect x="60.0" y="345.0" width="820.0" height="95.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="80.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Прапорці несумісності (incompat_flags):</text>
<text x="370.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Визначають зміни, без яких парсер НЕ МОЖЕ коректно прочитати байти на дроті.</text>
<text x="370.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Якщо хоч один біт не підтримується — кадр негайно викидається з черги.</text>
<text x="80.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Прапорці сумісності (compat_flags):</text>
<text x="370.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Позначають необов'язкові системні ознаки (наприклад, пріоритет чи роутинг).</text>
<text x="370.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Старий або сторонній парсер може сміливо ігнорувати їх і розбирати корисні дані.</text>
<text x="470.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Механізм IFLAG/CFLAG гарантує еволюцію протоколу без втрати зв'язку між різними версіями прошивок.</text>
</svg>