<text x="676.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">ATTITUDE · GPS · BATTERY … щосекунди й частіше</text>
<text x="676.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">час →</text>
<rect x="520.0" y="220.0" width="340.0" height="96.0" rx="6" fill="#f0f4fb" stroke="#2457d6" stroke-width="1.8"/><text x="690.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Частоту замовляють раз командою</tspan><tspan x="690.0" dy="16.2">SET_MESSAGE_INTERVAL:</tspan><tspan x="690.0" dy="16.2">param1 = ID повідомлення,</tspan><tspan x="690.0" dy="16.2">param2 = період у мкс (1 000 000 = 1 Гц)</tspan></text>
