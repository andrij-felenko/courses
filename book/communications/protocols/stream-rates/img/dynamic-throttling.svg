<text x="160.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RSSI &gt; -75 дБм | txbuf &lt; 40%</text>
<rect x="55.0" y="140.0" width="210.0" height="170.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="193.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Повні номінальні частоти:</tspan><tspan x="160.0" dy="11.7">• ATTITUDE: 50 Гц (плавний горизонт)</tspan><tspan x="160.0" dy="11.7">• POSITION: 10 Гц (траєкторія)</tspan><tspan x="160.0" dy="11.7">• VFR_HUD: 10 Гц (швидкість)</tspan><tspan x="160.0" dy="11.7">• SYS_STATUS: 2 Гц</tspan><tspan x="160.0" dy="11.7">• HEARTBEAT: 1 Гц</tspan><tspan x="160.0" dy="11.7">• Навантаження: ~3200 Б/с</tspan></text>
