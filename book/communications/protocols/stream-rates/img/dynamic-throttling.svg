<text x="780.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">RSSI &lt; -90 дБм | txbuf &gt; 85%</text>
<rect x="675.0" y="140.0" width="210.0" height="170.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="189.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Аварійне виживання каналу:</tspan><tspan x="780.0" dy="13.0">• ATTITUDE: 5 Гц</tspan><tspan x="780.0" dy="13.0">• POSITION: 1 Гц</tspan><tspan x="780.0" dy="13.0">• VFR_HUD: 0 Гц (Вимкнено)</tspan><tspan x="780.0" dy="13.0">• SYS_STATUS: 1 Гц</tspan><tspan x="780.0" dy="13.0">• HEARTBEAT: 1 Гц (Священний)</tspan><tspan x="780.0" dy="13.0">• Навантаження: ~350 Б/с</tspan></text>
<rect x="40.0" y="350.0" width="860.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="470.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Ключовий принцип: Запобігання переповненню буфера радіомодема рятує доставку команд RTL/LAND,</tspan><tspan x="470.0" dy="14.3">а часовий гістерезис (5 секунд стабільності) виключає коливання частот на межі зон зв'язку.</tspan></text>
