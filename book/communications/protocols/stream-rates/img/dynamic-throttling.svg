<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Автоматичне ступінчасте регулювання частот при деградації радіосигналу та заповненні буфера</text>
