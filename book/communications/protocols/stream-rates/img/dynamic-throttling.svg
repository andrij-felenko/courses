<rect x="365.0" y="140.0" width="210.0" height="170.0" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/><text x="470.0" y="189.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Зниження навантаження (-65%):</tspan><tspan x="470.0" dy="13.0">• ATTITUDE: 15 Гц</tspan><tspan x="470.0" dy="13.0">• POSITION: 4 Гц</tspan><tspan x="470.0" dy="13.0">• VFR_HUD: 2 Гц</tspan><tspan x="470.0" dy="13.0">• SYS_STATUS: 1 Гц</tspan><tspan x="470.0" dy="13.0">• HEARTBEAT: 1 Гц</tspan><tspan x="470.0" dy="13.0">• Навантаження: ~1100 Б/с</tspan></text>
