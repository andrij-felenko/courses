<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розподіл корисного навантаження, службових заголовків MAVLink v2 та резерву надійності</text>
