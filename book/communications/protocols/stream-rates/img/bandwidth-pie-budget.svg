<text x="702.5" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Команди GCS, параметри, місії, FEC радіоефіру</text>
<rect x="50.0" y="175.0" width="270.0" height="235.0" rx="6" fill="#fdfefe" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="185.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний ліміт UART</text>
<rect x="65.0" y="215.0" width="240.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">57600 бод = 5760 Байт/с</tspan><tspan x="185.0" dy="11.7">(1 старт + 8 біт + 1 стоп = 10 біт/Б)</tspan><tspan x="185.0" dy="11.7"></tspan><tspan x="185.0" dy="11.7">Накладні витрати MAVLink v2:</tspan><tspan x="185.0" dy="11.7">• 14 байт заголовка і CRC на кожен пакет</tspan><tspan x="185.0" dy="11.7">• ATTITUDE: 28 Б даних + 14 Б заголовок</tspan><tspan x="185.0" dy="11.7">  = 42 Байти/пакет</tspan><tspan x="185.0" dy="11.7">• Заголовки забирають 30-40% смуги!</tspan></text>
<rect x="335.0" y="175.0" width="270.0" height="235.0" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.2"/>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Золоте правило 60%</text>
<rect x="350.0" y="215.0" width="240.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="470.0" dy="0.0">Утилізація понад 65% — небезпечна:</tspan><tspan x="470.0" dy="11.7"></tspan><tspan x="470.0" dy="11.7">• Радіоефір напівдуплексний (TDD)</tspan><tspan x="470.0" dy="11.7">• Стрибки частот FHSS втрачають слоти</tspan><tspan x="470.0" dy="11.7">• Завади викликають повтори кадрів модема</tspan><tspan x="470.0" dy="11.7">• Буфер модема переповнюється, ламаючи</tspan><tspan x="470.0" dy="11.7">  доставку критичних команд керування!</tspan></text>
<rect x="620.0" y="175.0" width="270.0" height="235.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.2"/>
<text x="755.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Особливості ELRS / CRSF</text>
<rect x="635.0" y="215.0" width="240.0" height="180.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle"><tspan x="755.0" dy="0.0">Вузькі канали керування:</tspan><tspan x="755.0" dy="11.7"></tspan><tspan x="755.0" dy="11.7">• Telemetry Ratio 1:64 @ 250 Гц =</tspan><tspan x="755.0" dy="11.7">  лише ~3.9 телеметрійних пакетів/с</tspan><tspan x="755.0" dy="11.7">• Смуга телеметрії: 100-300 Байт/с!</tspan><tspan x="755.0" dy="11.7">• Потрібне вимкнення Attitude/IMU</tspan><tspan x="755.0" dy="11.7">  і передача лише Position/Status на 1 Гц</tspan></text>
</svg>