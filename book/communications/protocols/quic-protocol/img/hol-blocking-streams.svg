<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння блокування Head-of-Line у TCP та незалежних потоків QUIC</text>
<rect x="40.0" y="20.0" width="740.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="40.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">TCP: Мультиплексування кількох потоків у єдиний монолітний потік байтів</tspan></text>
<rect x="50.0" y="65.0" width="130.0" height="42.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Пакет 1 (Потік A)</tspan><tspan x="115.0" dy="13.7">Отримано OK</tspan></text>
<rect x="190.0" y="65.0" width="130.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Пакет 2 (Потік B)</tspan><tspan x="255.0" dy="13.7">ВТРАЧЕНО В КАНАЛІ</tspan></text>
<rect x="330.0" y="65.0" width="130.0" height="42.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="395.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Пакет 3 (Потік C)</tspan><tspan x="395.0" dy="13.7">Отримано в буфер</tspan></text>
<rect x="470.0" y="65.0" width="130.0" height="42.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="535.0" y="82.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Пакет 4 (Потік A)</tspan><tspan x="535.0" dy="13.7">Отримано в буфер</tspan></text>
<rect x="50.0" y="120.0" width="720.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Буфер ядра TCP (sk_buff): Потік A і C заблоковані у черзі очікування!</tspan><tspan x="410.0" dy="14.3">Ядро Linux не віддає застосунку байти 3 і 4, доки не надійде повтор пакета 2 (Head-of-Line Blocking).</tspan></text>
<line x1="40.0" y1="195.0" x2="780.0" y2="195.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2 3"/>
<rect x="40.0" y="215.0" width="740.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="235.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">QUIC: Потоки є логічно незалежними структурами всередині UDP-датаграм</tspan></text>
<rect x="50.0" y="260.0" width="160.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="273.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Датаграма 10 (Потік A)</tspan><tspan x="130.0" dy="13.0">Зсув 0..1200</tspan><tspan x="130.0" dy="13.0">Обробляється негайно</tspan></text>
<rect x="220.0" y="260.0" width="160.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="273.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Датаграма 11 (Потік B)</tspan><tspan x="300.0" dy="13.0">Зсув 0..1200</tspan><tspan x="300.0" dy="13.0">ВТРАЧЕНО</tspan></text>
<rect x="390.0" y="260.0" width="160.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="273.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Датаграма 12 (Потік C)</tspan><tspan x="470.0" dy="13.0">Зсув 0..1200</tspan><tspan x="470.0" dy="13.0">Обробляється негайно</tspan></text>
<rect x="560.0" y="260.0" width="160.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="273.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Датаграма 13 (Потік A)</tspan><tspan x="640.0" dy="13.0">Зсув 1200..2400</tspan><tspan x="640.0" dy="13.0">Обробляється негайно</tspan></text>
<rect x="50.0" y="320.0" width="220.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Потік A:</tspan><tspan x="160.0" dy="13.7">Отримано байти 0..2400</tspan><tspan x="160.0" dy="13.7">Застосунок читає без затримки!</tspan></text>
<rect x="280.0" y="320.0" width="220.0" height="60.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="390.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Потік B:</tspan><tspan x="390.0" dy="13.7">Очікує повтору пакета</tspan><tspan x="390.0" dy="13.7">Лише потік B на паузі</tspan></text>
<rect x="510.0" y="320.0" width="260.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Потік C:</tspan><tspan x="640.0" dy="13.7">Отримано байти 0..1200</tspan><tspan x="640.0" dy="13.7">Застосунок читає без затримки!</tspan></text>
<rect x="40.0" y="395.0" width="740.0" height="36.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="416.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Результат: Втрата пакета в одному потоці QUIC не сповільнює паралельні потоки.</tspan></text>
</svg>