<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння мережевих стеків: монолітний TCP+TLS проти модульного QUIC+UDP</text>
<rect x="60.0" y="20.0" width="320.0" height="36.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="42.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Традиційний стек (HTTP/2)</tspan></text>
<rect x="440.0" y="20.0" width="320.0" height="36.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="42.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Сучасний стек QUIC (HTTP/3)</tspan></text>
<rect x="60.0" y="70.0" width="320.0" height="48.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="220.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">HTTP/2 (Кадрування, потоки, HPACK)</tspan><tspan x="220.0" dy="15.0">Простір користувача</tspan></text>
<rect x="60.0" y="126.0" width="320.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="146.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">TLS 1.3 / 1.2 (Криптографія, безпека)</tspan><tspan x="220.0" dy="15.0">Окремий рівень шифрування</tspan></text>
<rect x="60.0" y="182.0" width="320.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">TCP (Надійна доставка, потік байтів,</tspan><tspan x="220.0" dy="15.0">контроль перевантаження, ковзне вікно)</tspan><tspan x="220.0" dy="15.0">Ядро операційної системи (Kernel)</tspan></text>
<rect x="60.0" y="260.0" width="320.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">IP (IPv4 / IPv6 Маршрутизація)</tspan><tspan x="220.0" dy="15.0">Мережевий рівень</tspan></text>
<rect x="60.0" y="312.0" width="320.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Канальний / Фізичний рівень (Ethernet, Wi-Fi, 5G)</tspan></text>
<line x1="40.0" y1="178.0" x2="390.0" y2="178.0" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="220.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Межа ядра: TCP зашитий у системний стек OS</text>
<rect x="440.0" y="70.0" width="320.0" height="48.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="600.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">HTTP/3 (QPACK, мапінг запитів на потоки)</tspan><tspan x="600.0" dy="15.0">Простір користувача</tspan></text>
<rect x="440.0" y="126.0" width="320.0" height="104.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">QUIC (RFC 9000 / RFC 9001 / RFC 9002)</tspan><tspan x="600.0" dy="14.3">• Незалежні потоки без блокування (Streams)</tspan><tspan x="600.0" dy="14.3">• Вбудований захист TLS 1.3 (0-RTT, крипто)</tspan><tspan x="600.0" dy="14.3">• Контроль перевантаження у просторі процесу</tspan><tspan x="600.0" dy="14.3">• Ідентифікатори з'єднань (Connection ID)</tspan></text>
<rect x="440.0" y="238.0" width="320.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="256.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">UDP (Проста датаграмна інкапсуляція)</tspan><tspan x="600.0" dy="15.0">Ядро OS / Без стану черг</tspan></text>
<rect x="440.0" y="290.0" width="320.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="308.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">IP (IPv4 / IPv6 Маршрутизація)</tspan><tspan x="600.0" dy="15.0">Мережевий рівень</tspan></text>
<rect x="440.0" y="342.0" width="320.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="367.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Канальний / Фізичний рівень (Ethernet, Wi-Fi, 5G)</tspan></text>
<line x1="420.0" y1="234.0" x2="770.0" y2="234.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="600.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">QUIC реалізовано у просторі користувача поверх UDP</text>
</svg>