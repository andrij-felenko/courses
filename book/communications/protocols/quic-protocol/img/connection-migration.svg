<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес міграції з'єднання QUIC між Wi-Fi та LTE за допомогою Connection ID</text>
<rect x="40.0" y="20.0" width="740.0" height="36.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="42.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Міграція з'єднання (Connection Migration) без розриву сесії</tspan></text>
<rect x="50.0" y="75.0" width="200.0" height="60.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="150.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Клієнт (Смартфон)</tspan><tspan x="150.0" dy="14.3">CID = 0x83f1a9b2...</tspan><tspan x="150.0" dy="14.3">Перемикання Wi-Fi -&gt; LTE</tspan></text>
<rect x="570.0" y="75.0" width="200.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Сервер (Edge Node)</tspan><tspan x="670.0" dy="14.3">CID = 0x83f1a9b2...</tspan><tspan x="670.0" dy="14.3">Прив'язка до CID, а не IP</tspan></text>
<rect x="60.0" y="155.0" width="300.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Початковий шлях (Wi-Fi):</tspan><tspan x="210.0" dy="13.7">IP: 192.168.1.45:54321 -&gt; Сервер :443</tspan></text>
<line x1="370.0" y1="179.0" x2="560.0" y2="179.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">1-RTT Data</text>
<rect x="60.0" y="220.0" width="700.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Подія: Користувач вийшов із зони Wi-Fi. Інтерфейс перемкнувся на стільникову мережу LTE (нова IP)</tspan></text>
<rect x="60.0" y="275.0" width="300.0" height="52.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="210.0" y="291.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Новий шлях (LTE):</tspan><tspan x="210.0" dy="13.0">IP: 100.64.22.8:61200 (Новий 4-tuple!)</tspan><tspan x="210.0" dy="13.0">Клієнт шле PATH_CHALLENGE (8B)</tspan></text>
<line x1="370.0" y1="285.0" x2="560.0" y2="285.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">PATH_CHALLENGE</text>
<line x1="560.0" y1="315.0" x2="370.0" y2="315.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">PATH_RESPONSE</text>
<rect x="570.0" y="275.0" width="200.0" height="52.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="291.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Сервер відповідає:</tspan><tspan x="670.0" dy="13.0">PATH_RESPONSE (8B)</tspan><tspan x="670.0" dy="13.0">Шлях підтверджено!</tspan></text>
<rect x="50.0" y="355.0" width="340.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">TCP при зміні IP: Повна загибель сесії!</tspan><tspan x="220.0" dy="13.0">Сокет скидається помилкою ECONNRESET,</tspan><tspan x="220.0" dy="13.0">потрібен новий TCP SYN + TLS Handshake.</tspan></text>
<rect x="430.0" y="355.0" width="340.0" height="50.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="370.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">QUIC при зміні IP: Нульова затримка!</tspan><tspan x="600.0" dy="13.0">Потоки даних продовжують передаватись</tspan><tspan x="600.0" dy="13.0">завдяки сталому ідентифікатору CID.</tspan></text>
</svg>