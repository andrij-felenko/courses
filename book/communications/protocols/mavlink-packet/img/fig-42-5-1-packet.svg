<text x="480.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це точно той самий принцип, що ми будували для UART у §35.6: старт, довжина, дані, контрольна сума.</text>
