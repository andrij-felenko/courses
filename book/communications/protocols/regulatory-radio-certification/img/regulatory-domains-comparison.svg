<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння регуляторних рамок: FCC (США), CE RED (ЄС) та SRRC (Китай)</text>
<rect x="30.0" y="40.0" width="265.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="162.5" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">США: FCC</tspan><tspan x="162.5" dy="14.3">(Federal Communications Commission)</tspan></text>
<rect x="30.0" y="95.0" width="265.0" height="315.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="162.5" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Правова база:</tspan><tspan x="162.5" dy="11.7">• Title 47 CFR Part 15</tspan><tspan x="162.5" dy="11.7">  - Part 15B (Ненавмисні випромінювачі)</tspan><tspan x="162.5" dy="11.7">  - Part 15C §15.247 / §15.249 (ISM)</tspan><tspan x="162.5" dy="11.7">  - Part 15E (UNII 5/6 ГГц)</tspan><tspan x="162.5" dy="11.7"></tspan><tspan x="162.5" dy="11.7">Процедура допуску:</tspan><tspan x="162.5" dy="11.7">• SDoC (для ненавмисних випромінювачів)</tspan><tspan x="162.5" dy="11.7">• Certification через TCB (Telecomm.</tspan><tspan x="162.5" dy="11.7">  Certification Body) для радіомодулів</tspan><tspan x="162.5" dy="11.7"></tspan><tspan x="162.5" dy="11.7">Обов'язкове маркування:</tspan><tspan x="162.5" dy="11.7">• FCC ID: [Grantee Code (3–5)][Product Code]</tspan><tspan x="162.5" dy="11.7"></tspan><tspan x="162.5" dy="11.7">Особливість:</tspan><tspan x="162.5" dy="11.7">Дозволено високу потужність (до 1 Вт cond),</tspan><tspan x="162.5" dy="11.7">акцент на захист урядових смуг.</tspan></text>
<rect x="315.0" y="40.0" width="265.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="447.5" y="59.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="447.5" dy="0.0">ЄС: CE RED</tspan><tspan x="447.5" dy="13.0">(Radio Equipment Directive 2014/53/EU)</tspan></text>
<rect x="315.0" y="95.0" width="265.0" height="315.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="447.5" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="447.5" dy="0.0">Правова база:</tspan><tspan x="447.5" dy="13.0">• Директива RED 2014/53/EU</tspan><tspan x="447.5" dy="13.0">• ETSI EN 300 328 (2.4 ГГц ISM)</tspan><tspan x="447.5" dy="13.0">• ETSI EN 300 220 (Sub-GHz SRD)</tspan><tspan x="447.5" dy="13.0">• ETSI EN 301 489 (Серія EMC)</tspan><tspan x="447.5" dy="13.0">• EN 62368-1 (Електробезпека LVD)</tspan><tspan x="447.5" dy="13.0"></tspan><tspan x="447.5" dy="13.0">Процедура допуску:</tspan><tspan x="447.5" dy="13.0">• Module A (Самодекларація виробника DoC)</tspan><tspan x="447.5" dy="13.0">• Нотифікований орган (Notified Body, NB)</tspan><tspan x="447.5" dy="13.0">  у разі відхилення від гармонізованих норм</tspan><tspan x="447.5" dy="13.0"></tspan><tspan x="447.5" dy="13.0">Обов'язкове маркування:</tspan><tspan x="447.5" dy="13.0">• Знак CE (+ 4 цифри NB за наявності)</tspan><tspan x="447.5" dy="13.0"></tspan><tspan x="447.5" dy="13.0">Особливість:</tspan><tspan x="447.5" dy="13.0">Жорсткий ліміт 100 мВт EIRP, обов'язковий</tspan><tspan x="447.5" dy="13.0">Duty Cycle або LBT для доступу до ефіру.</tspan></text>
<rect x="600.0" y="40.0" width="265.0" height="45.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="732.5" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="732.5" dy="0.0">Китай: SRRC / CMIIT</tspan><tspan x="732.5" dy="14.3">(State Radio Regulatory Commission)</tspan></text>
<rect x="600.0" y="95.0" width="265.0" height="315.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="732.5" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">Правова база:</tspan><tspan x="732.5" dy="13.0">• Radio Regulation of the PRC</tspan><tspan x="732.5" dy="13.0">• Регуляторні накази MIIT</tspan><tspan x="732.5" dy="13.0">• Стандарти GB/T та GB 9254</tspan><tspan x="732.5" dy="13.0"></tspan><tspan x="732.5" dy="13.0">Процедура допуску:</tspan><tspan x="732.5" dy="13.0">• Обов'язкове тестування зразків</tspan><tspan x="732.5" dy="13.0">  виключно в акредитованих державних</tspan><tspan x="732.5" dy="13.0">  лабораторіях на території Китаю</tspan><tspan x="732.5" dy="13.0">• Самодекларація заборонена</tspan><tspan x="732.5" dy="13.0"></tspan><tspan x="732.5" dy="13.0">Обов'язкове маркування:</tspan><tspan x="732.5" dy="13.0">• CMIIT ID: [Рік][Тип][Номер дозволу]</tspan><tspan x="732.5" dy="13.0"></tspan><tspan x="732.5" dy="13.0">Особливість:</tspan><tspan x="732.5" dy="13.0">Унікальні сітки Sub-GHz (470–510 МГц),</tspan><tspan x="732.5" dy="13.0">заборона неавторизованих шифрів.</tspan></text>
</svg>