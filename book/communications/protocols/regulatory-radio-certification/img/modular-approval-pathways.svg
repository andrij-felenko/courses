<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи модульної сертифікації та інтеграції в кінцевий виріб (Host Product)</text>
<rect x="30.0" y="45.0" width="240.0" height="350.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/>
<text x="150.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рівень 1: Радіомодуль (OEM)</text>
<rect x="45.0" y="85.0" width="210.0" height="160.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="150.0" y="121.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">8 критеріїв Full Modular (KDB 996369):</tspan><tspan x="150.0" dy="11.7">1. Власне металеве екранування RF</tspan><tspan x="150.0" dy="11.7">2. Буферизовані входи даних/керування</tspan><tspan x="150.0" dy="11.7">3. Вбудований стабілізатор живлення</tspan><tspan x="150.0" dy="11.7">4. Фіксована антена / унікальний роз'єм</tspan><tspan x="150.0" dy="11.7">5. Тестування Standalone на тестовій платі</tspan><tspan x="150.0" dy="11.7">6. Постійне маркування FCC ID на кришці</tspan><tspan x="150.0" dy="11.7">7. Чіткі інструкції з інтеграції в мануалі</tspan><tspan x="150.0" dy="11.7">8. Відповідність вимогам RF Exposure/SAR</tspan></text>
<rect x="45.0" y="260.0" width="210.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="297.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Результат для модуля:</tspan><tspan x="150.0" dy="11.7">• Отримання гранту FCC ID</tspan><tspan x="150.0" dy="11.7">• Повний звіт RF / EMC / RED</tspan><tspan x="150.0" dy="11.7">• Виробник несе відповідальність</tspan><tspan x="150.0" dy="11.7">  за радіопараметри модуля</tspan></text>
<line x1="270.0" y1="220.0" x2="320.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="45.0" width="270.0" height="350.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="455.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень 2: Кінцевий виріб (Host)</text>
<rect x="335.0" y="85.0" width="240.0" height="160.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="455.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Інтеграція готового модуля в хост:</tspan><tspan x="455.0" dy="11.7">• Дотримання топології трасування антени</tspan><tspan x="455.0" dy="11.7">• Перевірка електроживлення та розв'язки</tspan><tspan x="455.0" dy="11.7">• Оцінка відстані до тіла користувача:</tspan><tspan x="455.0" dy="11.7">  - &gt; 20 см: мобільний розрахунок MPE</tspan><tspan x="455.0" dy="11.7">  - &lt; 20 см: портативний пристрій, SAR!</tspan><tspan x="455.0" dy="11.7">• Оцінка одночасного випромінювання</tspan><tspan x="455.0" dy="11.7">  (Co-located RF: Wi-Fi + BLE + LTE)</tspan></text>
<rect x="335.0" y="260.0" width="240.0" height="115.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="303.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">Тестування кінцевого хоста:</tspan><tspan x="455.0" dy="11.7">• Part 15B (Ненавмисне випромінювання хоста)</tspan><tspan x="455.0" dy="11.7">• EN 301 489 (EMC системного рівня)</tspan><tspan x="455.0" dy="11.7">• EN 62368-1 (Електробезпека виробу)</tspan></text>
<line x1="590.0" y1="220.0" x2="640.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="45.0" width="210.0" height="350.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="745.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Рівень 3: Допуск на ринок</text>
<rect x="655.0" y="85.0" width="180.0" height="135.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Маркування хоста:</tspan><tspan x="745.0" dy="12.3"></tspan><tspan x="745.0" dy="12.3">«Contains FCC ID: XYZ-123»</tspan><tspan x="745.0" dy="12.3">«Contains CMIIT ID: ...»</tspan><tspan x="745.0" dy="12.3"></tspan><tspan x="745.0" dy="12.3">Знак CE на корпусі</tspan><tspan x="745.0" dy="12.3">готового приладу</tspan></text>
<rect x="655.0" y="235.0" width="180.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="745.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Документація виробника:</tspan><tspan x="745.0" dy="11.7">• Технічний файл (TCF)</tspan><tspan x="745.0" dy="11.7">• Підписана EU DoC</tspan><tspan x="745.0" dy="11.7">• Збереження тест-репортів</tspan><tspan x="745.0" dy="11.7">  протягом 10 років</tspan></text>
</svg>