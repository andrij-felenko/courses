<text x="765.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">3-тя
(3·f0)</text>
<rect x="450.0" y="50.0" width="370.0" height="80.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="69.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Зони випромінювання та вимірювальні норми:</tspan><tspan x="635.0" dy="11.7">1. In-Band: корисний сигнал, ліміт EIRP (FCC 30 дБм, ETSI 20 дБм)</tspan><tspan x="635.0" dy="11.7">2. Out-of-Band (OOB): спадання спектральної маски (−20 dBc)</tspan><tspan x="635.0" dy="11.7">3. Spurious (Гармоніки): ETSI TX ≤ −30 дБм, RX ≤ −54 дБм</tspan><tspan x="635.0" dy="11.7">4. FCC Restricted Bands: жорсткий поріг ≤ −41.2 дБм EIRP (500 мкВ/м)</tspan></text>
</svg>