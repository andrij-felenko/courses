<rect x="280.0" y="70.0" width="80.0" height="260.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="320.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Основна смуга
