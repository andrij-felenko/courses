<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27 -10 907 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-27" y="-10" width="907" height="430" fill="#ffffff"/>
