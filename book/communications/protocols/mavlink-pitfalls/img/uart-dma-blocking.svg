<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="380.0" height="330.0" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Блокувальний TX (Катастрофа реального часу)</text>
<rect x="40.0" y="75.0" width="340.0" height="45.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Головний цикл PID (400 Гц, період 2.5 мс)</text>
<text x="210.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">uart_write_blocking(280 байтів)</text>
<line x1="210.0" y1="120.0" x2="210.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="150.0" width="340.0" height="65.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Швидкість 57600 бод:</tspan><tspan x="210.0" dy="13.7">280 Б × 10 біт / 57600 = 48.6 мс затримки!</tspan><tspan x="210.0" dy="13.7">(Пропуск 19 ітерацій стабілізації!)</tspan></text>
<line x1="210.0" y1="215.0" x2="210.0" y2="245.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="245.0" width="340.0" height="85.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Наслідки блокування:</tspan><tspan x="210.0" dy="13.7">• Зрив оцінювача EKF і розбіжність орієнтації</tspan><tspan x="210.0" dy="13.7">• Спрацьовування Watchdog таймера (HardFault)</tspan><tspan x="210.0" dy="13.7">• Падіння апарата або втрата керованості</tspan></text>
<rect x="420.0" y="20.0" width="380.0" height="330.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">DMA + Кільцевий буфер (Надійна архітектура)</text>
<rect x="440.0" y="75.0" width="340.0" height="45.0" rx="4" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.2"/>
<text x="610.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Головний цикл PID (Виконується без пауз)</text>
<text x="610.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ring_buffer_push() — час O(1), менше 1 мкс</text>
<line x1="610.0" y1="120.0" x2="610.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="150.0" width="340.0" height="65.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="610.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Кільцевий буфер TX + Апаратний DMA:</tspan><tspan x="610.0" dy="13.7">Дані течуть у фоні без участі ядра CPU;</tspan><tspan x="610.0" dy="13.7">Черга повна → дроп телеметрії, збереження команд</tspan></text>
<line x1="610.0" y1="215.0" x2="610.0" y2="245.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="245.0" width="340.0" height="85.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="610.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Переваги DMA-схеми:</tspan><tspan x="610.0" dy="13.7">• Частота PID-контуру суворо фіксована (400 Гц)</tspan><tspan x="610.0" dy="13.7">• Дроп низькопріоритетних пакетів при заторах</tspan><tspan x="610.0" dy="13.7">• Повний облік помилок (TX drop counter)</tspan></text>
</svg>