<text x="210.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Причина: у MAVLink немає поля TTL!</tspan><tspan x="210.0" dy="13.0">Широкомовний HEARTBEAT із SBC дублюється в UART і UDP,</tspan><tspan x="210.0" dy="13.0">повертається назад і розмножується лавиноподібно.</tspan><tspan x="210.0" dy="13.0">Захист: Split-Horizon + таблиця маршрутизації за sys/comp.</tspan></text>
