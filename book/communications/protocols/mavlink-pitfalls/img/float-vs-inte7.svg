<text x="217.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">Формат: 1 біт знак, 8 біт експонента, 23 біти мантиса</tspan><tspan x="217.0" dy="13.7">Кількість рівнів дискретизації: 2²⁴ = 16 777 216</tspan><tspan x="217.0" dy="13.7">Діапазон довготи: −180.0° .. +180.0°</tspan></text>
