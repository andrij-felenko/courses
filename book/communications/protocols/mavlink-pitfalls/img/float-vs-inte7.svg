<text x="217.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="217.0" dy="0.0">Крок квантування при λ ≈ 180°:</tspan><tspan x="217.0" dy="13.7">Δλ = 180° / 2²³ ≈ 2.15 × 10⁻⁵ градуса</tspan><tspan x="217.0" dy="13.7">Похибка на екваторі: ≈ 2.39 метра!</tspan><tspan x="217.0" dy="13.7">(Непридатно для автопосадки та RTK!)</tspan></text>
