<rect x="40.0" y="138.0" width="680.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="380.0" y="156.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">двійкові дані можуть містити байт-роздільник →</tspan><tspan x="380.0" dy="15.0">потрібне екранування (byte stuffing; елегантно — COBS)</tspan></text>
