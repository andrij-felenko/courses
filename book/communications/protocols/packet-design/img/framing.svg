<rect x="40.0" y="294.0" width="680.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#9aa0a8" stroke-width="1.3"/><text x="380.0" y="315.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">для тексту зручний роздільник (рядок = повідомлення); для двійкових даних — поле довжини;</tspan><tspan x="380.0" dy="15.0">найнадійніше — поєднати: SYNC для старту, LEN для кінця</tspan></text>
