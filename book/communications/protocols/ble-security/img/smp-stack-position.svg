<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура безпеки BLE: положення SMP та апаратного шифрування</text>
<rect x="40.0" y="19.3" width="760.0" height="41.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.4"/><text x="420.0" y="36.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Рівень застосунку (Application)</tspan><tspan x="420.0" dy="14.3">Профілі безпеки, бізнес-логіка, взаємодія з користувачем (PIN / Numeric Comparison)</tspan></text>
<text x="420.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Рівень хоста (Host — стек протоколів мікроконтролера)</text>
<rect x="50.0" y="135.5" width="240.0" height="69.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="170.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">GAP / GATT</tspan><tspan x="170.0" dy="13.0">• Визначення рівнів безпеки</tspan><tspan x="170.0" dy="13.0">• Запит зв'язку Security Request</tspan><tspan x="170.0" dy="13.0">• Реєстрація IO-можливостей</tspan></text>
<rect x="315.0" y="129.0" width="250.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="440.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Security Manager (SMP)</tspan><tspan x="440.0" dy="13.0">• Протокол спарювання (Legacy / LESC)</tspan><tspan x="440.0" dy="13.0">• Обмін ключами ECDH P-256</tspan><tspan x="440.0" dy="13.0">• Генерація LTK, IRK, CSRK</tspan><tspan x="440.0" dy="13.0">• Перевірка захисту від MITM</tspan></text>
<rect x="595.0" y="135.5" width="230.0" height="69.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="710.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">L2CAP</tspan><tspan x="710.0" dy="13.0">Канальний рівень хоста</tspan><tspan x="710.0" dy="13.0">Фіксований канал CID 0x0006</tspan><tspan x="710.0" dy="13.0">(SMP Channel)</tspan></text>
<line x1="295.0" y1="170.0" x2="310.0" y2="170.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="170.0" x2="590.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="40.0" y1="260.0" x2="800.0" y2="260.0" stroke="#333333" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="420.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">HCI (Host Controller Interface) — передача сесійних ключів LTK/SKD/IV у контролер</text>
<text x="420.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Рівень контролера (Controller — радіотракт та апаратний криптопроцесор)</text>
<rect x="60.0" y="329.0" width="360.0" height="82.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Link Layer (LL)</tspan><tspan x="240.0" dy="13.0">• Протокол керування шифруванням LLCP</tspan><tspan x="240.0" dy="13.0">• Кадри LL_ENC_REQ / LL_ENC_RSP</tspan><tspan x="240.0" dy="13.0">• Лічильник пакетів для Nonce</tspan><tspan x="240.0" dy="13.0">• Відновлення зв'язку (Bonding)</tspan></text>
<rect x="440.0" y="335.5" width="360.0" height="69.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.8"/><text x="620.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Апаратний блок AES-128 CCM</tspan><tspan x="620.0" dy="13.0">• Потокове шифрування корисного навантаження</tspan><tspan x="620.0" dy="13.0">• Обчислення 4-байтного коду автентичності MIC</tspan><tspan x="620.0" dy="13.0">• Захист від підміни та повторення кадрів</tspan></text>
<line x1="425.0" y1="370.0" x2="435.0" y2="370.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>