<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три послідовні фази процедури спарювання в протоколі SMP</text>
<rect x="30.0" y="20.0" width="780.0" height="130.0" rx="6" fill="#f4f8fb" stroke="#2457d6" stroke-width="1.5"/>
<text x="50.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Фаза 1: Узгодження параметрів безпеки (Pairing Feature Exchange)</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ініціатор надсилає Pairing Request, відповідач повертає Pairing Response (L2CAP CID 0x0006)</text>
<text x="50.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Обмін прапорцями: IO Capabilities, OOB Data Flag, AuthReq (Bonding, MITM, Secure Connections SC)</text>
<text x="50.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вибір криптографічного протоколу (Legacy або LESC) та моделі асоціації (Just Works / Passkey / NumComp / OOB)</text>
<text x="50.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Узгодження розміру ключа шифрування (від 7 до 16 байтів)</text>
<line x1="420.0" y1="150.0" x2="420.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="175.0" width="780.0" height="165.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="50.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Фаза 2: Автентифікація та генерація сесійних ключів шифрування</text>
<rect x="50.0" y="229.6" width="350.0" height="70.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="225.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">LE Legacy Pairing</tspan><tspan x="225.0" dy="12.3">• Введення TK (Temporary Key 0..999999)</tspan><tspan x="225.0" dy="12.3">• Обмін випадковими числами Mrand / Srand</tspan><tspan x="225.0" dy="12.3">• Генерація STK = s1(TK, Srand, Mrand)</tspan><tspan x="225.0" dy="12.3">• Нестійкий до пасивного перехоплення!</tspan></text>
<rect x="430.0" y="229.6" width="370.0" height="70.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="615.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">LE Secure Connections (LESC)</tspan><tspan x="615.0" dy="12.3">• Генерація пар ключів ECDH P-256</tspan><tspan x="615.0" dy="12.3">• Обмін публічними ключами PKa, PKb</tspan><tspan x="615.0" dy="12.3">• Обчислення DHKey = ECDH(SK, PK_peer)</tspan><tspan x="615.0" dy="12.3">• Виведення LTK = f5(DHKey, ...) без передачі в ефір!</tspan></text>
<line x1="420.0" y1="340.0" x2="420.0" y2="365.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="365.0" width="780.0" height="115.0" rx="6" fill="#fdfaf3" stroke="#6b7280" stroke-width="1.5"/>
<text x="50.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Фаза 3: Трансляція та збереження довгострокових ключів (Key Distribution / Bonding)</text>
<text x="50.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Виконується виключно в уже зашифрованому каналі канального рівня (Link Layer Encryption)</text>
<text x="50.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Розподіл IRK (Identity Resolving Key) — для генерації та резолвінгу приватних адрес RPA</text>
<text x="50.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Розподіл CSRK (Connection Signature Resolving Key) — для підпису даних ATT без шифрування сесії</text>
</svg>