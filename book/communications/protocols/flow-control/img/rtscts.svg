<text x="410.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">B.RTS → A.CTS: дозвіл/пауза + спільна земля</text>
<text x="70.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">B майже повний → знімає RTS;  A бачить це на CTS → затихає в межах байта-двох.</text>
<rect x="50.0" y="320.2" width="720.0" height="31.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">RTS/CTS — швидко й двійково-безпечно (керують лінії, не байти). Ціна — 2 зайві дроти.</tspan></text>
