<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зупиняти заздалегідь: водяний знак і байти в дорозі</text>
<rect x="130.0" y="80.0" width="100.0" height="230.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="130.0" y="114.5" width="100.0" height="195.5" rx="6" fill="#eaf0fd" stroke="none" stroke-width="0.0"/>
<line x1="118.0" y1="137.5" x2="242.0" y2="137.5" stroke="#b08900" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="248.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="start" font-weight="700">верхній поріг → «стоп»</text>
<line x1="118.0" y1="222.6" x2="242.0" y2="222.6" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="248.0" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">нижній поріг → «далі»</text>
<text x="180.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">буфер приймача</text>
<text x="248.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">запас зверху — на байти,</text>
<text x="248.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">що вже в дорозі після «стоп»</text>
<rect x="40.0" y="322.2" width="680.0" height="31.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="380.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Два пороги дають гістерезис — сигнали не смикаються щобайта. «Стоп» — заздалегідь.</tspan></text>
</svg>