<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 839.3 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="839.3" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програмне керування потоком: XON/XOFF спецбайтами</text>
<rect x="70.0" y="90.0" width="150.0" height="130.0" rx="12" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="145.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передавач</text>
<rect x="600.0" y="90.0" width="150.0" height="130.0" rx="12" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="675.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач</text>
<line x1="220.0" y1="145.0" x2="600.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дані →</text>
<line x1="600.0" y1="178.0" x2="220.0" y2="178.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">XOFF (0x13) = «пауза»</text>
<line x1="600.0" y1="206.0" x2="220.0" y2="206.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">XON (0x11) = «продовжуй»</text>
<rect x="0.7" y="274.2" width="818.6" height="31.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="410.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Плюс — нуль зайвих дротів. Мінус фатальний для двійкових даних: байти 0x11 і 0x13 більше не можна слати як дані.</tspan></text>
</svg>