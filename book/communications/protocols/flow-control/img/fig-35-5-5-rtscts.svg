<line x1="516.0" y1="326.0" x2="576.0" y2="326.0" stroke="#b08900" stroke-width="2.4" stroke-linecap="round"/>
<text x="468.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">«стоп»</text>
<text x="80.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">A бачить CTS → паузить TX:</text>
<line x1="360.0" y1="366.0" x2="432.0" y2="366.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="432.0" y1="366.0" x2="432.0" y2="386.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="432.0" y1="386.0" x2="516.0" y2="386.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="516.0" y1="366.0" x2="516.0" y2="386.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="516.0" y1="366.0" x2="564.0" y2="366.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<text x="474.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">TX мовчить</text>
<rect x="60.0" y="400.0" width="800.0" height="28.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="460.0" y="419.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">RTS/CTS — швидко й двійково-безпечно (службо ниток, не байтів), ціна — 2 зайві дроти.</text>
