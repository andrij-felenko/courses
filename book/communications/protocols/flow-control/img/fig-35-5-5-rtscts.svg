<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Апаратне керування потоком: RTS/CTS кажуть «стоп, я повний»</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дві додаткові лінії навхрест: приймач знімає RTS, передавач бачить це по CTS і паузить</text>
<rect x="80.0" y="110.0" width="150.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="155.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пристрій A</text>
<rect x="690.0" y="110.0" width="150.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="765.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пристрій B</text>
<text x="222.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">TX</text>
<text x="688.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">TX</text>
<text x="222.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">RX</text>
<text x="688.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">RX</text>
<text x="222.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">RTS</text>
<text x="688.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="end" font-weight="bold" font-style="normal">RTS</text>
<text x="222.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">CTS</text>
<text x="688.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">CTS</text>
<line x1="230.0" y1="152.0" x2="688.0" y2="182.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<line x1="688.0" y1="152.0" x2="230.0" y2="182.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<line x1="230.0" y1="218.0" x2="688.0" y2="248.0" stroke="#b08900" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="688.0" y1="218.0" x2="230.0" y2="248.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="459.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">TX ↔ RX (навхрест)</text>
<text x="459.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">RTS ↔ CTS (навхрест) + спільна земля</text>
<text x="80.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">B майже повний → знімає RTS:</text>
<line x1="360.0" y1="326.0" x2="420.0" y2="326.0" stroke="#b08900" stroke-width="2.4" stroke-linecap="round"/>
<line x1="420.0" y1="326.0" x2="420.0" y2="346.0" stroke="#b08900" stroke-width="2.4" stroke-linecap="round"/>
<line x1="420.0" y1="346.0" x2="516.0" y2="346.0" stroke="#b08900" stroke-width="2.4" stroke-linecap="round"/>
