<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння упакування бітів у UPER та APER</text>
<rect x="20.0" y="20.0" width="1020.0" height="580.0" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Невирівняний (UPER) проти Вирівняного (APER) режимів кодування</text>
<text x="40.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Як правила вирівнювання додають паддінг-біти до межі октету для полів розміром понад 2 байти</text>
<rect x="40.0" y="100.0" width="980.0" height="65.0" rx="6" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="55.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Тестова структура ASN.1:</text>
<text x="55.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Example ::= SEQUENCE { flag BOOLEAN, code INTEGER (0..7), tag INTEGER (0..65535), data OCTET STRING (SIZE(3)) }</text>
<rect x="40.0" y="180.0" width="980.0" height="185.0" rx="8" fill="#eefaf1" stroke="#a3d9b1" stroke-width="1.4"/>
<text x="55.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b813e" text-anchor="start" font-weight="700">UPER (UNALIGNED PER) — Пакування біт-у-біт без вирівнювання</text>
<text x="55.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Суцільний потік: 1 біт (flag) + 3 біти (code) + 16 бітів (tag) + 24 біти (data) = 44 біти (5.5 байтів)</text>
<rect x="55.0" y="245.0" width="80.0" height="65.0" rx="6" fill="#ffffff" stroke="#1e50a2" stroke-width="1.5"/><text x="95.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">flag</tspan><tspan x="95.0" dy="14.3">(1 біт)</tspan></text>
<rect x="145.0" y="245.0" width="100.0" height="65.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="195.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">code</tspan><tspan x="195.0" dy="14.3">(3 біти)</tspan></text>
<rect x="255.0" y="245.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#1b813e" stroke-width="1.5"/><text x="370.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">tag: INTEGER (0..65535)</tspan><tspan x="370.0" dy="14.3">(16 бітів)</tspan></text>
<rect x="495.0" y="245.0" width="340.0" height="65.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="665.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">data: OCTET STRING SIZE(3)</tspan><tspan x="665.0" dy="14.3">(24 біти = 3 октети)</tspan></text>
<rect x="845.0" y="245.0" width="110.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="900.0" y="274.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">паддінг кадру</tspan><tspan x="900.0" dy="13.0">(4 біти нулів)</tspan></text>
<text x="55.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b813e" text-anchor="start" font-weight="700">Підсумок UPER: рівно 6 байтів у каналі (44 біти корисних + 4 біти фінального доповнення кадру)</text>
<rect x="40.0" y="380.0" width="980.0" height="200.0" rx="8" fill="#fdf3e6" stroke="#f0c38c" stroke-width="1.4"/>
<text x="55.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">APER (ALIGNED PER) — Обов'язкове вирівнювання перед полями довжиною &gt; 2 байти та великими цілими</text>
<text x="55.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Поля &lt;= 255 не вирівнюються, але діапазон 65536 вимагає вирівнювання на межу октету перед записом значення</text>
<rect x="55.0" y="445.0" width="80.0" height="65.0" rx="6" fill="#ffffff" stroke="#1e50a2" stroke-width="1.5"/><text x="95.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">flag</tspan><tspan x="95.0" dy="14.3">(1 біт)</tspan></text>
<rect x="145.0" y="445.0" width="100.0" height="65.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="195.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">code</tspan><tspan x="195.0" dy="14.3">(3 біти)</tspan></text>
<rect x="255.0" y="445.0" width="120.0" height="65.0" rx="6" fill="#ffebeb" stroke="#c53030" stroke-width="1.5"/><text x="315.0" y="474.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">паддінг октету</tspan><tspan x="315.0" dy="13.0">(4 біти до межі)</tspan></text>
<rect x="385.0" y="445.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#1b813e" stroke-width="1.5"/><text x="500.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">tag: INTEGER (0..65535)</tspan><tspan x="500.0" dy="14.3">(16 бітів = 2 октети)</tspan></text>
<rect x="625.0" y="445.0" width="320.0" height="65.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="785.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">data: OCTET STRING SIZE(3)</tspan><tspan x="785.0" dy="14.3">(24 біти = 3 октети)</tspan></text>
<text x="55.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Підсумок APER: 6 байтів, але структура чітко розбита по байтах: Байт 0 = [flag+code+pad], Байти 1-2 = tag, Байти 3-5 = data</text>
<text x="55.0" y="565.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Перевага APER: швидший розбір процесором (пряме копіювання memcpy для октетних масивів), ціна — надлишкові біти паддінгу</text>
</svg>