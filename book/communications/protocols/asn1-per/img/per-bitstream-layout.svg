<text x="40.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Кодування структури RRCConnectionRequest: поля упаковані без вирівнювання на межі байтів</text>
