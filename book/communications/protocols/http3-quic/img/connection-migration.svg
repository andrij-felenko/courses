<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переключення мережевого інтерфейсу (Connection Migration)</text>
<rect x="50.0" y="65.0" width="220.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0"></tspan></text>
<text x="160.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мобільний клієнт</text>
<rect x="65.0" y="110.0" width="190.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Інтерфейс Wi-Fi</tspan><tspan x="160.0" dy="14.3">IP: 192.168.1.5:54321</tspan></text>
<rect x="65.0" y="163.0" width="190.0" height="40.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Інтерфейс LTE (4G/5G)</tspan><tspan x="160.0" dy="14.3">IP: 100.64.2.88:61000</tspan></text>
<rect x="610.0" y="65.0" width="220.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0"></tspan></text>
<text x="720.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер HTTP/3</text>
<rect x="625.0" y="120.0" width="190.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">QUIC Session Table</tspan><tspan x="720.0" dy="14.3">CID: 0x8f4a2b10</tspan><tspan x="720.0" dy="14.3">Стан сесії: ACTIVE</tspan></text>
<line x1="260.0" y1="130.0" x2="600.0" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">1. Початковий шлях (Wi-Fi) + CID: 0x8f4a2b10</text>
<line x1="260.0" y1="183.0" x2="600.0" y2="170.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="430.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Зміна мережі на LTE (новий IP:Port) + CID: 0x8f4a2b10</text>
<text x="50.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">У TCP з'єднання прив'язане до сокета (IP_src, Port_src, IP_dst, Port_dst) і рветься при зміні Wi-Fi → LTE.</text>
<text x="50.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">У QUIC з'єднання ідентифікується прозорим Connection ID (CID), що не залежить від IP-адреси.</text>
<text x="50.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Сервер валідує новий шлях через PATH_CHALLENGE і продовжує передачу без перезапуску TLS.</text>
</svg>