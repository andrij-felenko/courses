<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури мережевих стеків</text>
<text x="180.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">HTTP/1.1 (TCP)</text>
<rect x="60.0" y="83.0" width="240.0" height="52.0" rx="6" fill="#fdf3e0" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="113.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">HTTP/1.1 (текстовий)</tspan></text>
<rect x="60.0" y="141.0" width="240.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">TLS 1.2 (окремий шар)</tspan></text>
<rect x="60.0" y="199.0" width="240.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">TCP (потоковий транспорт)</tspan></text>
<rect x="60.0" y="257.0" width="240.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">IP (мережевий шар)</tspan></text>
<text x="460.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">HTTP/2 (TCP)</text>
<rect x="340.0" y="83.0" width="240.0" height="52.0" rx="6" fill="#fdf3e0" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="113.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">HTTP/2 (мультиплексування)</tspan></text>
<rect x="340.0" y="141.0" width="240.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">TLS 1.2 / 1.3</tspan></text>
<rect x="340.0" y="199.0" width="240.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">TCP (єдиний кадриковий потік)</tspan></text>
<rect x="340.0" y="257.0" width="240.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">IP (мережевий шар)</tspan></text>
<text x="740.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">HTTP/3 (QUIC/UDP)</text>
<rect x="620.0" y="83.0" width="240.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="113.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">HTTP/3 (кадри + QPACK)</tspan></text>
<rect x="620.0" y="141.0" width="240.0" height="52.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">QUIC (потоки + TLS 1.3)</tspan></text>
<rect x="620.0" y="199.0" width="240.0" height="52.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">UDP (датаграми)</tspan></text>
<rect x="620.0" y="257.0" width="240.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">IP (мережевий шар)</tspan></text>
<text x="60.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">HTTP/1.1 та HTTP/2 спираються на TCP, де TLS є окремим шаром над байтовим потоком.</text>
<text x="60.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">HTTP/3 переносить мультиплексування і безпеку безпосередньо в QUIC поверх UDP.</text>
<text x="60.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Втрата одного UDP-пакета у QUIC не затримує передачу інших незалежних HTTP-потоків.</text>
</svg>