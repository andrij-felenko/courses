<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Head-of-Line Blocking у TCP проти QUIC</text>
<rect x="50.0" y="65.0" width="380.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0"></tspan></text>
<text x="240.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">TCP (HTTP/2): Єдиний потік кадривання</text>
<rect x="70.0" y="120.0" width="75.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="107.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="107.5" dy="0.0">Stream A</tspan><tspan x="107.5" dy="14.3">Pkt 1</tspan></text>
<rect x="155.0" y="120.0" width="75.0" height="45.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="192.5" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="192.5" dy="0.0">Stream B</tspan><tspan x="192.5" dy="11.7">Pkt 2 (втрачено)</tspan></text>
<rect x="240.0" y="120.0" width="75.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="277.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="277.5" dy="0.0">Stream A</tspan><tspan x="277.5" dy="14.3">Pkt 3</tspan></text>
<rect x="325.0" y="120.0" width="75.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="362.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Stream C</tspan><tspan x="362.5" dy="14.3">Pkt 4</tspan></text>
<line x1="230.0" y1="180.0" x2="230.0" y2="215.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="220.0" width="340.0" height="60.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">ЗАБЛОКОВАНО ВСІ ПОТОКИ (A, B, C)!</tspan><tspan x="240.0" dy="14.3">Буфер ядра TCP чекає на повтор Pkt 2</tspan></text>
<rect x="450.0" y="65.0" width="380.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0"></tspan></text>
<text x="640.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">QUIC (HTTP/3): Незалежні потоки</text>
<rect x="470.0" y="120.0" width="105.0" height="45.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="522.5" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="522.5" dy="0.0">Stream A: Pkt 1, 3</tspan><tspan x="522.5" dy="11.7">Отримано</tspan></text>
<rect x="585.0" y="120.0" width="110.0" height="45.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Stream B: Pkt 2</tspan><tspan x="640.0" dy="13.0">(втрачено)</tspan></text>
<rect x="705.0" y="120.0" width="105.0" height="45.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="757.5" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="757.5" dy="0.0">Stream C: Pkt 4</tspan><tspan x="757.5" dy="11.7">Отримано</tspan></text>
<line x1="522.0" y1="180.0" x2="522.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="757.0" y1="180.0" x2="757.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="220.0" width="160.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="247.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Stream A і C обробляються</tspan><tspan x="550.0" dy="11.7">НЕГАЙНО без затримок</tspan></text>
<rect x="650.0" y="220.0" width="160.0" height="60.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Лише Stream B чекає</tspan><tspan x="730.0" dy="14.3">на повтор датаграми</tspan></text>
<text x="50.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">При втраті пакета TCP змушений зупинити весь буфер до отримання повторно надісланого байта.</text>
<text x="50.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">QUIC ізолює втрати: додаток відразу читає дані з надійних потоків, не чекаючи на пошкоджений.</text>
</svg>