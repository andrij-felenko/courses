<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова датаграми QUIC та зв'язок зсуву і кадрів</text>
<rect x="50.0" y="65.0" width="780.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Заголовок UDP (8 байтів: Порт джерела, Порт призначення, Довжина, Контрольна сума)</tspan></text>
<rect x="50.0" y="125.0" width="210.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">QUIC Short Header</tspan><tspan x="155.0" dy="14.3">1-RTT (Flags + CID)</tspan></text>
<rect x="265.0" y="125.0" width="140.0" height="50.0" rx="6" fill="#fdf3e0" stroke="#333333" stroke-width="1.5"/><text x="335.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">Packet Number</tspan><tspan x="335.0" dy="14.3">(Монотонний №)</tspan></text>
<rect x="410.0" y="125.0" width="420.0" height="50.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Зашифрований корисний вантаж (Payload + AEAD Auth Tag)</tspan></text>
<text x="150.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розпаковані фрейми у Payload:</text>
<rect x="265.0" y="185.0" width="260.0" height="50.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">STREAM Frame</tspan><tspan x="395.0" dy="11.7">Stream ID: 4 | Offset: 1024 | Data: 512B</tspan></text>
<rect x="530.0" y="185.0" width="170.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">ACK Frame</tspan><tspan x="615.0" dy="14.3">Largest Acked: 105</tspan></text>
<rect x="705.0" y="185.0" width="125.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="767.5" y="213.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="767.5" dy="0.0">PADDING Frame</tspan></text>
<text x="50.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Packet Number монотонно зростає для КОЖНОЇ датаграми (навіть при повторі) і служить для вимірювання RTT.</text>
<text x="50.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Stream Offset відповідає за порядок даних у конкретному потіку додатка (втрачений кадри мають той самий offset).</text>
<text x="50.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Одна UDP-датаграма QUIC може містити декілька фреймів (STREAM, ACK, MAX_DATA) одночасно.</text>
</svg>