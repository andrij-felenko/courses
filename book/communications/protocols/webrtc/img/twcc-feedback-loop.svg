<text x="440.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Завдяки TWCC відправник виявляє зростання черг у проміжних маршрутизаторах задовго до реальної втрати пакетів.</text>
