<rect x="580.0" y="215.0" width="240.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Генератор RTCP TWCC Feedback:</tspan><tspan x="700.0" dy="14.3">(Sequence # + дельти часу d_t)</tspan></text>
