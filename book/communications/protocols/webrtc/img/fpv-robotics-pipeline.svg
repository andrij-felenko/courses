<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">WebRTC у робототехніці: FPV-відео та телеметрія через браузер</text>
<rect x="40.0" y="55.0" width="360.0" height="315.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бортовий комп'ютер дрона / робота</text>
<rect x="60.0" y="95.0" width="320.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="112.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">CSI/USB Камера (1080p60 / 720p120)</tspan><tspan x="220.0" dy="14.3">Hardware Capture (V4L2 / DMA-BUF)</tspan></text>
<rect x="60.0" y="145.0" width="320.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Апаратний H.264/AV1 енкодер (NVENC / V4L2-M2M):</tspan><tspan x="220.0" dy="13.0">Низька затримка (Intra-Refresh, zero B-frames)</tspan></text>
<rect x="60.0" y="202.0" width="320.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="219.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">WebRTC C++ Agent (libdatachannel / GStreamer):</tspan><tspan x="220.0" dy="14.3">SRTP відеострімінг + RTCDataChannel</tspan></text>
<rect x="60.0" y="252.0" width="320.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Політний контролер (UART / CAN / MAVLink):</tspan><tspan x="220.0" dy="13.0">Прийом команд керування та відправка телеметрії</tspan></text>
<rect x="60.0" y="310.0" width="320.0" height="45.0" rx="6" fill="#fdf3e0" stroke="#b08900" stroke-width="1.5"/><text x="220.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">RTCDataChannel (ordered=false, maxRetransmits=0)</tspan><tspan x="220.0" dy="13.0">Телеметрія польоту 50 Гц без затримок буферизації</tspan></text>
<rect x="480.0" y="55.0" width="360.0" height="315.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="660.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станція керування в браузері (GCS)</text>
<rect x="500.0" y="95.0" width="320.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="112.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">HTML5 Canvas / WebCodecs API:</tspan><tspan x="660.0" dy="14.3">Апаратний декодер низької затримки</tspan></text>
<rect x="500.0" y="145.0" width="320.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Відображення FPV-відео (Glass-to-Glass &lt; 60 мс)</tspan><tspan x="660.0" dy="13.0">Без плагінів у будь-якому сучасному браузері</tspan></text>
<rect x="500.0" y="198.0" width="320.0" height="45.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Gamepad API / Клавіатура:</tspan><tspan x="660.0" dy="14.3">Опитування стіків джойстика з частотою 100 Гц</tspan></text>
<rect x="500.0" y="252.0" width="320.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="273.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Відправка команд керування по DataChannel:</tspan><tspan x="660.0" dy="11.7">Бінарний формат (MAVLink / Protobuf / FlatBuffers)</tspan></text>
<rect x="500.0" y="310.0" width="320.0" height="45.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">HUD Телеметрії (Штучний горизонт, GPS, батарея)</tspan><tspan x="660.0" dy="13.0">Рендеринг через WebGL / SVG</tspan></text>
<line x1="400.0" y1="130.0" x2="480.0" y2="130.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="400.0" y1="130.0" x2="480.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SRTP Відео</text>
<line x1="400.0" y1="240.0" x2="480.0" y2="240.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="480.0" y1="240.0" x2="400.0" y2="240.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Команди</text>
<line x1="400.0" y1="290.0" x2="480.0" y2="290.0" stroke="#b08900" stroke-width="2.0"/>
<line x1="400.0" y1="290.0" x2="480.0" y2="290.0" stroke="#b08900" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">Телеметрія</text>
<text x="440.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повна відсутність додаткових шлюзів: браузер безпосередньо з'єднується з бортовим комп'ютером через WebRTC.</text>
</svg>