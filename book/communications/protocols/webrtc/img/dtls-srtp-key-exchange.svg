<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шифрування DTLS-SRTP та виведення сесійних ключів</text>
<rect x="40.0" y="55.0" width="360.0" height="310.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1. DTLS Handshake (поверх UDP)</text>
<rect x="60.0" y="100.0" width="320.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="120.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Клієнтський ClientHello (випадкові числа + розширення)</tspan></text>
<rect x="60.0" y="145.0" width="320.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="166.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ServerHello + Сертифікат + ServerKeyExchange</tspan></text>
<rect x="60.0" y="190.0" width="320.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ClientKeyExchange + CertificateVerify (якщо взаємна)</tspan></text>
<rect x="60.0" y="235.0" width="320.0" height="45.0" rx="6" fill="#fdf3e0" stroke="#b08900" stroke-width="1.5"/><text x="220.0" y="254.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Звірка хешу сертифіката з SDP a=fingerprint</tspan><tspan x="220.0" dy="13.0">(Захист від Man-in-the-Middle атаки)</tspan></text>
<rect x="60.0" y="290.0" width="320.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">DTLS Finished</tspan><tspan x="220.0" dy="14.3">(Спільний секрет Master Secret сформовано)</tspan></text>
<line x1="405.0" y1="210.0" x2="475.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RFC 5764</text>
<text x="440.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Keying Material</text>
<rect x="480.0" y="55.0" width="360.0" height="310.0" rx="6" fill="#fef5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="660.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Виведення ключів SRTP / SRTCP</text>
<rect x="500.0" y="100.0" width="320.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="118.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">SRTP Master Client Encryption Key (128/256 біт)</tspan></text>
<rect x="500.0" y="136.0" width="320.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">SRTP Master Server Encryption Key (128/256 біт)</tspan></text>
<rect x="500.0" y="172.0" width="320.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="190.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">SRTP Master Client Salt Key (112 біт)</tspan></text>
<rect x="500.0" y="208.0" width="320.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="226.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">SRTP Master Server Salt Key (112 біт)</tspan></text>
<rect x="500.0" y="244.0" width="320.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">SRTCP Master Authentication Keys (якщо HMAC-SHA1)</tspan></text>
<rect x="500.0" y="285.0" width="320.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Прямий захист RTP-пакетів:</tspan><tspan x="660.0" dy="11.7">Заголовки у відкритому вигляді (SSRC, Seq, Timestamp)</tspan><tspan x="660.0" dy="11.7">Корисний вантаж зашифровано AES-GCM / AES-CTR</tspan></text>
<text x="440.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">DTLS не шифрує медіа безпосередньо: він узгоджує ключі для надшвидкого апаратного шифрування SRTP у потоці.</text>
</svg>