<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура повідомлення PARAM_VALUE: розташування полів та упаковка даних</text>
<rect x="40.0" y="90.0" width="180.0" height="60.0" rx="6" fill="#fff3e0" stroke="#d97706" stroke-width="2.0"/>
<text x="130.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">param_value</text>
<text x="130.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">4 байти (float)</text>
<rect x="228.0" y="90.0" width="140.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="298.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">param_count</text>
<text x="298.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2 байти (uint16)</text>
<rect x="376.0" y="90.0" width="140.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="446.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">param_index</text>
<text x="446.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2 байти (uint16)</text>
<rect x="524.0" y="90.0" width="240.0" height="60.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="644.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">param_id [16]</text>
<text x="644.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">16 байтів (ASCII)</text>
<rect x="772.0" y="90.0" width="120.0" height="60.0" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.0"/>
<text x="832.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">param_type</text>
<text x="832.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1 байт</text>
<line x1="40.0" y1="162.0" x2="892.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="40.0" y1="156.0" x2="40.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="892.0" y1="156.0" x2="892.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="466.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корисне навантаження повідомлення PARAM_VALUE (#22) — рівно 25 байтів</text>
<rect x="40.0" y="210.0" width="410.0" height="220.0" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.8"/><text x="245.0" y="282.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Трюк бітового відображення (Bit-cast)</tspan><tspan x="245.0" dy="11.7"></tspan><tspan x="245.0" dy="11.7">Поле param_value передається як 32-бітний IEEE 754 float.</tspan><tspan x="245.0" dy="11.7">Для цілих типів (UINT32 / INT32) заборонено числове зведення (float)x:</tspan><tspan x="245.0" dy="11.7">мантиса float має лише 24 біти, що знищує молодші біти цілого.</tspan><tspan x="245.0" dy="11.7"></tspan><tspan x="245.0" dy="11.7">Правило протоколу: сирі 4 байти цілого копіюються в 4 байти float</tspan><tspan x="245.0" dy="11.7">через memcpy або std::bit_cast без зміни бітів.</tspan></text>
<line x1="130.0" y1="185.0" x2="245.0" y2="210.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="490.0" y="210.0" width="410.0" height="220.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="695.0" y="282.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Пастки ідентифікатора та нумерації</tspan><tspan x="695.0" dy="11.7"></tspan><tspan x="695.0" dy="11.7">• param_id: рівно 16 байтів ASCII. Якщо назва має 16 символів,</tspan><tspan x="695.0" dy="11.7">  нульовий символ '\0' ВІДСУТНІЙ! Читач зобов'язаний виділити 17 байтів</tspan><tspan x="695.0" dy="11.7">  і додати кінцевий '\0' власноруч.</tspan><tspan x="695.0" dy="11.7"></tspan><tspan x="695.0" dy="11.7">• param_index: номер параметра від 0 до param_count - 1.</tspan><tspan x="695.0" dy="11.7">  Дозволяє ловити пропущені пакети за розривами індексів.</tspan></text>
<line x1="644.0" y1="185.0" x2="695.0" y2="210.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>