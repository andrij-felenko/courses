<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл режиму Offboard та спрацювання захисного таймера (Failsafe)</text>
<rect x="31.6" y="80.2" width="176.8" height="59.6" rx="6" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">СТАН: MANUAL / HOLD</tspan><tspan x="120.0" dy="14.3">Автопілот утримує позицію</tspan><tspan x="120.0" dy="14.3">або керується оператором</tspan></text>
<rect x="298.5" y="80.2" width="183.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">СТАН: WARMUP STREAM</tspan><tspan x="390.0" dy="14.3">Бортовий комп'ютер шле</tspan><tspan x="390.0" dy="14.3">уставки з частотою &gt;= 2 Гц</tspan></text>
<rect x="600.0" y="80.2" width="180.0" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">СТАН: OFFBOARD ACTIVE</tspan><tspan x="690.0" dy="14.3">Автопілот виконує уставки</tspan><tspan x="690.0" dy="14.3">Таймер втрати скидається</tspan></text>
<line x1="210.0" y1="110.0" x2="295.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="252.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Старт потоку</text>
<line x1="485.0" y1="110.0" x2="595.0" y2="110.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">MAV_CMD_DO_SET_MODE</text>
<text x="540.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Потік стабільний)</text>
<rect x="600.0" y="260.2" width="180.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ТАЙМАУТ ВТРАТИ ПОТОКУ</tspan><tspan x="690.0" dy="14.3">Немає уставок &gt; 500 мс</tspan><tspan x="690.0" dy="14.3">(COM_OF_LOSS_T спрацював)</tspan></text>
<rect x="295.0" y="260.2" width="190.0" height="59.6" rx="6" fill="#fff8ee" stroke="#d97706" stroke-width="1.5"/><text x="390.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">АВАРІЙНИЙ РЕЖИМ</tspan><tspan x="390.0" dy="14.3">Автономне зависання (Hold)</tspan><tspan x="390.0" dy="14.3">або повернення додому (RTL)</tspan></text>
<rect x="28.5" y="260.2" width="183.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">АВАРІЙНА ПОСАДКА (Land)</tspan><tspan x="120.0" dy="14.3">Якщо зв'язок не відновлено</tspan><tspan x="120.0" dy="14.3">або сідає батарея</tspan></text>
<line x1="690.0" y1="160.0" x2="690.0" y2="235.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">dt &gt; 500 мс</text>
<line x1="595.0" y1="290.0" x2="490.0" y2="290.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="542.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">Failsafe дія</text>
<line x1="290.0" y1="290.0" x2="210.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Таймаут Hold</text>
<line x1="390.0" y1="235.0" x2="390.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="390.0" y1="185.0" x2="600.0" y2="140.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Потік відновлено (Auto-recover)</text>
<rect x="42.0" y="365.0" width="736.0" height="42.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="410.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Правило безпеки: комп'ютер-компаньйон зобов'язаний тримати потік навіть при нерухомому висінні дрона</text>
<text x="410.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Припинення надсилання координат автопілот розцінює як зависання або аварію керуючої програми</text>
