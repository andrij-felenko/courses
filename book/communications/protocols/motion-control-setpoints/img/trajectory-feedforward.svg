<text x="610.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Плавне S-подібне наростання</text>
<rect x="445.0" y="210.0" width="320.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="455.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Швидкість v(t) [Feedforward]</text>
<line x1="460.0" y1="270.0" x2="500.0" y2="270.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="500.0" y1="270.0" x2="560.0" y2="230.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="560.0" y1="230.0" x2="620.0" y2="230.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="620.0" y1="230.0" x2="680.0" y2="270.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="680.0" y1="270.0" x2="750.0" y2="270.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Неперервний профіль швидкості</text>
<rect x="445.0" y="305.0" width="320.0" height="110.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="455.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Переваги динамічного зв'язку:</text>
<text x="455.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Обмежений, контрольований ривок (Minimum Jerk)</text>
<text x="455.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Регулятор помилки відпрацьовує лише шум і вітер</text>
<text x="455.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нульове фазове запізнення траєкторії</text>
<text x="455.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Економія заряду батареї та стабільність камери</text>
</svg>