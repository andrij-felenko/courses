<line x1="120.0" y1="270.0" x2="140.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="140.0" y1="225.0" x2="220.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="220.0" y1="225.0" x2="280.0" y2="270.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="280.0" y1="270.0" x2="360.0" y2="270.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="180.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Насичення за швидкістю (V_max)</text>
<rect x="55.0" y="305.0" width="320.0" height="110.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="65.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Наслідки для апарата:</text>
<text x="65.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нескінченний теоретичний ривок (Jerk = d³x/dt³)</text>
<text x="65.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Ударне насичення регуляторів і моторів</text>
<text x="65.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Вібрації, розгойдування корисного навантаження</text>
<text x="65.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Затримка реакції контуру положення (Phase Lag)</text>
<rect x="425.0" y="55.0" width="360.0" height="375.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.4"/>
<text x="605.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Плавний сплайн + Feedforward (p + v + a)</text>
<text x="605.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Передача узгодженого стану з полінома 5-го степеня</text>
<rect x="445.0" y="115.0" width="320.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
