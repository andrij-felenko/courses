<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння відпрацювання ступінчастої уставки та гладкого профілю з Feedforward</text>
<rect x="35.0" y="55.0" width="360.0" height="375.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.4"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ступінчаста уставка (Тільки позиція)</text>
<text x="215.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Передача лише цільової точки p_target без v_ff та a_ff</text>
<rect x="55.0" y="115.0" width="320.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="65.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Позиція x(t)</text>
<line x1="70.0" y1="180.0" x2="120.0" y2="180.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
