<line x1="280.0" y1="133.0" x2="360.0" y2="135.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="205.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Перерегулювання!</text>
<rect x="55.0" y="210.0" width="320.0" height="80.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="65.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Швидкість v(t)</text>
