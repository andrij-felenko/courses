<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 875 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="875" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="116.4" y="6.5" width="587.3" height="35.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="410.0" y="29.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Чотириточковий обмін мітками часу між клієнтом і сервером NTP</tspan></text>
<line x1="180.0" y1="65.0" x2="180.0" y2="365.0" stroke="#333333" stroke-width="2.5"/>
<line x1="640.0" y1="65.0" x2="640.0" y2="365.0" stroke="#333333" stroke-width="2.5"/>
<line x1="180.0" y1="360.0" x2="180.0" y2="385.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="640.0" y1="360.0" x2="640.0" y2="385.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45.1" y="36.5" width="269.9" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="57.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Клієнт (локальний годинник t_c)</tspan></text>
<rect x="505.1" y="36.5" width="269.9" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="57.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Сервер (еталонний годинник t_s)</tspan></text>
<circle cx="180.0" cy="110.0" r="5.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<rect x="24.6" y="93.3" width="130.8" height="33.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="90.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">T1 (Origin)</tspan><tspan x="90.0" dy="14.3">Відправка клієнтом</tspan></text>
<circle cx="640.0" cy="175.0" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<rect x="679.9" y="158.3" width="110.3" height="33.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="171.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">T2 (Receive)</tspan><tspan x="735.0" dy="14.3">Прийом сервером</tspan></text>
<line x1="180.0" y1="110.0" x2="640.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="350.0" y="120.0" width="160.0" height="26.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">NTP Request (Запит)</tspan><tspan x="430.0" dy="13.0">[Мітка T1]</tspan></text>
<line x1="652.0" y1="175.0" x2="652.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<rect x="725.0" y="207.5" width="130.0" height="24.0" rx="6" fill="#fff8e7" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="216.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Обробка на сервері:</tspan><tspan x="790.0" dy="11.7">(T3 − T2)</tspan></text>
<circle cx="640.0" cy="240.0" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<rect x="669.6" y="223.3" width="130.8" height="33.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="243.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">T3 (Transmit)</tspan><tspan x="735.0" dy="14.3">Відправка сервером</tspan></text>
<circle cx="180.0" cy="305.0" r="5.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<rect x="31.4" y="288.4" width="117.1" height="33.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="90.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">T4 (Destination)</tspan><tspan x="90.0" dy="14.3">Прийом клієнтом</tspan></text>
<line x1="640.0" y1="240.0" x2="180.0" y2="305.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="250.0" width="220.0" height="28.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="254.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">NTP Response (Відповідь)</tspan><tspan x="430.0" dy="11.7">[Мітки: T1 (Origin), T2 (Rx), T3 (Tx)]</tspan></text>
<line x1="168.0" y1="110.0" x2="168.0" y2="305.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3,3"/>
<rect x="35.0" y="207.5" width="120.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="95.0" y="216.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">Час обміну:</tspan><tspan x="95.0" dy="11.7">(T4 − T1)</tspan></text>
<rect x="70.0" y="393.2" width="680.0" height="43.6" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="411.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Кругова затримка (Round-Trip Delay): δ = (T4 − T1) − (T3 − T2)</tspan><tspan x="410.0" dy="15.6">Зміщення годинника (Clock Offset): θ = ((T2 − T1) + (T3 − T4)) / 2</tspan></text>
</svg>