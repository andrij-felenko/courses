<rect x="440.0" y="254.5" width="340.0" height="61.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Перевага: сувора монотонність часу!</tspan><tspan x="610.0" dy="13.0">• Частота тактового таймера коригується на ±500 ppm</tspan><tspan x="610.0" dy="13.0">• Час безперервний, жодних стрибків і збоїв таймерів</tspan><tspan x="610.0" dy="13.0">• Застосовується для зміщень &lt; 128 мс (NTP стандарт)</tspan></text>
<rect x="25.5" y="366.4" width="769.0" height="37.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Правило NTP: Якщо |θ| &lt; 128 мс — виконується плавне підведення Slew (adjtime).</tspan><tspan x="410.0" dy="14.3">Якщо 128 мс ≤ |θ| &lt; 1000 с — виконується Step (разовий стрибок). Якщо |θ| ≥ 1000 с — паніка (NTPd зупиняється).</tspan></text>
