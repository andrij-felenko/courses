<rect x="40.0" y="254.5" width="340.0" height="61.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Небезпека: порушення монотонності!</tspan><tspan x="210.0" dy="13.0">• Час рухається назад або стрибає вперед</tspan><tspan x="210.0" dy="13.0">• Таймери та тайм-аути спрацьовують некоректно</tspan><tspan x="210.0" dy="13.0">• Ламається порядок записів у базах даних та логах</tspan></text>
