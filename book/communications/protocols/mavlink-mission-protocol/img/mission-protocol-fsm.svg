<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="540.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><rect x="160.3" y="10.5" width="559.4" height="35.0" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="1.5"/><text x="440.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">СКІНЧЕННИЙ АВТОМАТ СТАНІВ ТРАНЗАКЦІЙ (GCS / AUTOPILOT FSM)</tspan></text><rect x="216.4" y="75.0" width="447.2" height="49.9" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="440.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">СТАН: IDLE (ОЧІКУВАННЯ)</tspan><tspan x="440.0" dy="16.9">Транзакція неактивна, автопілот виконує місію з Flash</tspan></text><rect x="43.0" y="202.6" width="254.1" height="74.8" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="170.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">СТАН: UPLOAD_ACTIVE</tspan><tspan x="170.0" dy="15.6">• Автопілот чекає черговий seq</tspan><tspan x="170.0" dy="15.6">• Перевірка валідності координат</tspan><tspan x="170.0" dy="15.6">• Запис у staging RAM-буфер</tspan></text><rect x="571.8" y="202.6" width="276.4" height="74.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">СТАН: DOWNLOAD_ACTIVE</tspan><tspan x="710.0" dy="15.6">• GCS витягує пункти [0..count-1]</tspan><tspan x="710.0" dy="15.6">• Автопілот віддає записи</tspan><tspan x="710.0" dy="15.6">• Очікування наступного REQUEST_INT</tspan></text><rect x="249.7" y="345.4" width="380.6" height="59.2" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">ОБРОБКА ТАЙМАУТУ (TIMEOUT / RETRY)</tspan><tspan x="440.0" dy="15.6">Таймер &gt; 250..1500 мс → Повторна відправка запиту</tspan><tspan x="440.0" dy="15.6">Лічильник спроб (retries) &lt; 5</tspan></text><rect x="191.9" y="466.4" width="496.2" height="37.3" rx="6" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="1.5"/><text x="440.0" y="481.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">СКАСУВАННЯ / АВАРІЙНЕ СКИДАННЯ (ABORT)</tspan><tspan x="440.0" dy="14.3">Відкидання staging-буфера, збереження старого плану, MISSION_ACK(ERROR)</tspan></text><line x1="320.0" y1="120.0" x2="230.0" y2="185.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="196.7" y="132.0" width="86.6" height="16.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="240.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">MISSION_COUNT</tspan></text><line x1="170.0" y1="185.0" x2="310.0" y2="100.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="126.7" y="102.0" width="86.6" height="16.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="113.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">ACK(ACCEPTED)</tspan></text><line x1="560.0" y1="120.0" x2="650.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="599.8" y="132.0" width="80.4" height="16.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="131.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">REQUEST_LIST</tspan></text><line x1="710.0" y1="185.0" x2="570.0" y2="100.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="672.9" y="102.0" width="74.2" height="16.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/><text x="710.0" y="113.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">MISSION_ACK</tspan></text><line x1="230.0" y1="290.0" x2="330.0" y2="350.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="650.0" y1="290.0" x2="550.0" y2="350.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="350.0" y1="380.0" x2="260.0" y2="300.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="530.0" y1="380.0" x2="620.0" y2="300.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440.0" y1="420.0" x2="440.0" y2="455.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="365.7" y="430.0" width="148.6" height="16.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="453.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Retries вичерпано (5/5)</tspan></text>
</svg>