<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек протоколів мережі Thread</text>
<rect x="40.0" y="26.5" width="700.0" height="27.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="43.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Рівень застосунків: Matter / CHIP, CoAP, MQTT-SN, кастомні IPv6-сервіси</tspan></text>
<rect x="40.0" y="75.0" width="700.0" height="75.0" rx="8" fill="#f0f4f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="55.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Транспорт і керування мережею</text>
<rect x="60.0" y="102.5" width="210.0" height="35.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="165.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">UDP (User Datagram)</tspan><tspan x="165.0" dy="13.0">Порти застосунку та MLE</tspan></text>
<rect x="290.0" y="102.5" width="200.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="390.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">DTLS / ECJPAKE</tspan><tspan x="390.0" dy="13.0">Безпечне комісіонування</tspan></text>
<rect x="510.0" y="102.5" width="210.0" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="615.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">MLE (Mesh Link Est.)</tspan><tspan x="615.0" dy="13.0">Сусідство та RIPng-маршрут</tspan></text>
<rect x="40.0" y="160.0" width="700.0" height="55.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="390.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Мережевий рівень: IPv6 (ICMPv6, SLAAC, Unicast / Multicast ff02:: / ff03::)</text>
<text x="390.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Адресація: Link-Local (fe80::/64), Mesh-Local (fd00::/64), Global Unicast (GUA)</text>
<rect x="40.0" y="225.0" width="700.0" height="70.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.6"/>
<text x="390.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d6608" text-anchor="middle" font-weight="700">Адаптаційний рівень 6LoWPAN (RFC 4944, RFC 6282)</text>
<text x="390.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Компресія заголовків IPHC / NHC (IPv6 40 Б + UDP 8 Б → 4..7 Б)</text>
<text x="390.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Фрагментація та зворотне збирання: IPv6 MTU 1280 Б ↔ 802.15.4 PSDU 127 Б</text>
<rect x="40.0" y="305.0" width="700.0" height="60.0" rx="8" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.4"/>
<text x="390.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Канальний рівень MAC IEEE 802.15.4 (2006)</text>
<text x="390.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">CSMA/CA без слотів, кадри даних/ACK, 16-бітні та 64-бітні адреси, захист AES-128 CCM</text>
<rect x="40.0" y="375.0" width="700.0" height="48.0" rx="8" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.4"/>
<text x="390.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5b2c6f" text-anchor="middle" font-weight="700">Фізичний рівень PHY 2.4 ГГц ISM (канали 11..26 з кроком 5 МГц)</text>
<text x="390.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Модуляція O-QPSK з DSSS (32 чіпи/символ), швидкість передачі 250 кбіт/с</text>
</svg>