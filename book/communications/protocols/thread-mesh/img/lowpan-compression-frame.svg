<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компресія заголовків 6LoWPAN та структура кадру 802.15.4</text>
<rect x="40.0" y="40.0" width="740.0" height="95.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="55.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">Стандартний пакет IPv6 / UDP без компресії (Заголовки: 48 байтів)</text>
<rect x="60.0" y="75.0" width="270.0" height="45.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="195.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Базовий заголовок IPv6</text>
<text x="195.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">40 байтів (Src/Dst IPv6, HopLimit, NextHdr)</text>
<rect x="335.0" y="75.0" width="140.0" height="45.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="405.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">UDP заголовок</text>
<text x="405.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">8 Б (Порти, CRC)</text>
<rect x="480.0" y="75.0" width="290.0" height="45.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="625.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Корисне навантаження (Payload)</text>
<text x="625.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Дані датчика, CoAP, Matter тощо</text>
<line x1="410.0" y1="135.0" x2="410.0" y2="170.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="410.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Компресія 6LoWPAN IPHC / NHC (RFC 6282)</text>
<rect x="40.0" y="180.0" width="740.0" height="180.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<text x="55.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Фізичний кадр IEEE 802.15.4 (Максимальний розмір PSDU = 127 байтів)</text>
<rect x="55.0" y="215.0" width="135.0" height="55.0" rx="4" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="122.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">MAC Header (MHR)</text>
<text x="122.5" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">FCF, PAN ID, Адреси</text>
<text x="122.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">~15..23 байти</text>
<rect x="196.0" y="215.0" width="85.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="238.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Aux Security</text>
<text x="238.5" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">5 байтів</text>
<text x="238.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">KeyID, Frame Ctr</text>
<rect x="287.0" y="215.0" width="100.0" height="55.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="337.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">IPHC Header</text>
<text x="337.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2..3 байти</text>
<text x="337.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Контекст IPv6</text>
<rect x="393.0" y="215.0" width="95.0" height="55.0" rx="4" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.6"/>
<text x="440.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d6608" text-anchor="middle" font-weight="700">NHC UDP Hdr</text>
<text x="440.5" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1..4 байти</text>
<text x="440.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d6608" text-anchor="middle">Стиснені порти</text>
<rect x="494.0" y="215.0" width="185.0" height="55.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="586.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Корисне навантаження</text>
<text x="586.5" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">70..85 байтів пейлоаду</text>
<text x="586.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Чисті прикладні дані</text>
<rect x="685.0" y="215.0" width="85.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="727.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">MIC / FCS</text>
<text x="727.5" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">4 Б + 2 Б</text>
<text x="727.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Цілісність / CRC</text>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Економія: 48 байтів IPv6+UDP заголовків стискаються у 4..7 байтів 6LoWPAN</text>
<text x="410.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">При перевищенні 127 байтів активується фрагментація 6LoWPAN (FRAG1: 4 Б, FRAGN: 5 Б)</text>
</svg>