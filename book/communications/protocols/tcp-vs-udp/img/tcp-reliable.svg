<text x="346.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-style="italic">3 загубився — TCP перешле</text>
<line x1="350.0" y1="150.0" x2="350.0" y2="188.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
