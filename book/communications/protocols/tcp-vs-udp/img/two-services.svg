<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два транспорти поверх IP: надійний проти швидкого</text>
<rect x="60.0" y="56.0" width="580.0" height="34.0" rx="0" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.3"/>
<text x="72.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">ознака</text>
<text x="350.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TCP</text>
<text x="545.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">UDP</text>
<rect x="60.0" y="90.0" width="580.0" height="34.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="72.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">з'єднання</text>
<text x="350.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">так (рукостискання)</text>
<text x="545.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">ні (просто шлеш)</text>
<rect x="60.0" y="124.0" width="580.0" height="34.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="72.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">доставка</text>
<text x="350.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">гарантована</text>
<text x="545.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">як вийде, бувають втрати</text>
<rect x="60.0" y="158.0" width="580.0" height="34.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="72.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">порядок</text>
<text x="350.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">по порядку</text>
<text x="545.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">може плутатись</text>
<rect x="60.0" y="192.0" width="580.0" height="34.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="72.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">затримка</text>
<text x="350.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">більша, плаває</text>
<text x="545.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">мала, рівна</text>
<rect x="60.0" y="226.0" width="580.0" height="34.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="72.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">накладні</text>
<text x="350.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">більші</text>
<text x="545.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">мінімальні</text>
<rect x="60.0" y="260.0" width="580.0" height="34.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="72.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">модель</text>
<text x="350.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">потік байтів</text>
<text x="545.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">окремі датаграми</text>
<rect x="181.1" y="299.4" width="337.7" height="49.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="350.0" y="320.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">TCP — служба доставки з підписом про вручення;</tspan><tspan x="350.0" dy="14.3">UDP — кинута в скриньку листівка</tspan></text>
</svg>