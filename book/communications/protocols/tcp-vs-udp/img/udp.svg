<text x="350.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ні рукостискання, ні ретраїв, ні очікування — дані доходять миттєво й свіжими</text>
