<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому TCP погано для реального часу: блокування голови черги</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один загублений пакет тримає ВСІ наступні, аж поки його не перешлють — для відео це згубно</text>
<text x="110.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">TCP:</text>
<rect x="160.0" y="96.0" width="70.0" height="30.0" rx="5" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="195.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="240.0" y="96.0" width="70.0" height="30.0" rx="5" fill="#f4f4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="275.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2 загубл.</text>
<rect x="320.0" y="96.0" width="70.0" height="30.0" rx="5" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="355.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<rect x="400.0" y="96.0" width="70.0" height="30.0" rx="5" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="435.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<rect x="480.0" y="96.0" width="70.0" height="30.0" rx="5" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.8"/>
<text x="515.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<line x1="310.0" y1="90.0" x2="310.0" y2="150.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="470.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">3,4,5 прийшли, але ЧЕКАЮТЬ, поки перешлеться 2</text>
<text x="470.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ велика затримка («затор»)</text>
<text x="110.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">UDP:</text>
<rect x="160.0" y="216.0" width="70.0" height="30.0" rx="5" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="195.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="240.0" y="216.0" width="70.0" height="30.0" rx="5" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="275.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">2 нема</text>
<rect x="320.0" y="216.0" width="70.0" height="30.0" rx="5" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="355.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<rect x="400.0" y="216.0" width="70.0" height="30.0" rx="5" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="435.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<rect x="480.0" y="216.0" width="70.0" height="30.0" rx="5" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="515.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="470.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3,4,5 віддаються ОДРАЗУ — пропуск замість затору</text>
<text x="470.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">→ дані свіжі, кадр-два просто зникли</text>
<rect x="60.0" y="312.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для відео/голосу/гри свіжість важливіша за повноту: краще пропустити кадр, ніж застрягти на ньому.</text>
<text x="450.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому реальний час майже завжди йде по UDP, а не TCP.</text>
</svg>
