<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат пакету канального рівня BLE та бітові поля заголовка PDU</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура кадру канального рівня (Link Layer Packet Format)</text>
<rect x="60.0" y="60.0" width="90.0" height="55.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="105.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Preamble</text>
<text x="105.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 / 2 байти</text>
<rect x="155.0" y="60.0" width="160.0" height="55.0" rx="4" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.8"/>
<text x="235.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Access Address</text>
<text x="235.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4 байти (32 біти)</text>
<rect x="320.0" y="60.0" width="330.0" height="55.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="485.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Link Layer PDU</text>
<text x="485.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2 .. 257 байтів</text>
<rect x="655.0" y="60.0" width="125.0" height="55.0" rx="4" fill="#f3e8ff" stroke="#8e44ad" stroke-width="1.8"/>
<text x="717.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">CRC</text>
<text x="717.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 байти (24 біти)</text>
<line x1="320.0" y1="115.0" x2="60.0" y2="175.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="650.0" y1="115.0" x2="780.0" y2="175.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="60.0" y="175.0" width="720.0" height="185.0" rx="6" fill="#fafbfc" stroke="#27ae60" stroke-width="1.5"/>
<text x="420.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Деталізація Data Channel PDU (Пакет каналу даних)</text>
<rect x="80.0" y="215.0" width="340.0" height="75.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="250.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">16-бітний заголовок (Header)</text>
<rect x="90.0" y="245.0" width="45.0" height="35.0" rx="2" fill="#eef4ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="112.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">LLID</text>
<text x="112.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2 біти</text>
<rect x="140.0" y="245.0" width="45.0" height="35.0" rx="2" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.0"/>
<text x="162.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">NESN</text>
<text x="162.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 біт</text>
<rect x="190.0" y="245.0" width="40.0" height="35.0" rx="2" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.0"/>
<text x="210.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">SN</text>
<text x="210.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 біт</text>
<rect x="235.0" y="245.0" width="40.0" height="35.0" rx="2" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/>
<text x="255.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">MD</text>
<text x="255.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 біт</text>
<rect x="280.0" y="245.0" width="55.0" height="35.0" rx="2" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="307.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">CP/RFU</text>
<text x="307.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 біти</text>
<rect x="340.0" y="245.0" width="70.0" height="35.0" rx="2" fill="#eef4ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="375.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Length</text>
<text x="375.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8 бітів</text>
<rect x="435.0" y="215.0" width="330.0" height="75.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="600.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Payload (Корисне навантаження)</text>
<text x="600.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 .. 251 байт (L2CAP фрагменти або LL Control)</text>
<text x="420.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">LLID: 01b = Continuation/Empty, 10b = Start L2CAP, 11b = LL Control</text>
<text x="420.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Контроль потоку ARQ: біти SN (Sequence Number) та NESN (Next Expected Sequence Number)</text>
</svg>