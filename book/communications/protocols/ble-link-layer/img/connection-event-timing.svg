<line x1="755.0" y1="60.0" x2="755.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="755.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Anchor Point (n+1)</text>
<line x1="60.0" y1="80.0" x2="755.0" y2="80.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="60.0" y1="73.0" x2="60.0" y2="87.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="755.0" y1="73.0" x2="755.0" y2="87.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="410.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Connection Interval (connInterval: 7.5 мс .. 4.0 с)</text>
<rect x="40.0" y="250.0" width="760.0" height="150.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="60.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Ключові часові параметри Link Layer:</text>
<text x="60.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• connInterval — період між точками прив'язки (Anchor Points), крок 1.25 мс.</text>
<text x="60.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• connSlaveLatency — кількість подій зв'язку (0..499), які ведений може проспати за відсутності даних.</text>
<text x="60.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• connSupervisionTimeout — граничний час (100 мс..32 с) очікування успішного пакету до розриву зв'язку.</text>
<text x="60.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• T_IFS (Inter-Frame Space) — фіксована пауза 150 ± 1 мкс між передачею та прийомом для перемикання радіотракту.</text>
</svg>