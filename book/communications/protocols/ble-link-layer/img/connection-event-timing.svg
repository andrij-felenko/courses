<text x="285.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">ACK (NESN=1)</text>
<line x1="340.0" y1="135.0" x2="400.0" y2="135.0" stroke="#6b7280" stroke-width="1.5"/>
