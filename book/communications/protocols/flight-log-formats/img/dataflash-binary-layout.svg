<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Побайтова структура та самоописні кадри ArduPilot DataFlash (BIN)</text>
<rect x="30.0" y="60.0" width="820.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадрування потоку DataFlash: кожен пакет має 3-байтний заголовок</text>
<rect x="45.0" y="95.0" width="140.0" height="30.0" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="115.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">0xA3 (HEAD1)</tspan></text>
<rect x="190.0" y="95.0" width="140.0" height="30.0" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="260.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">0x95 (HEAD2)</tspan></text>
<rect x="335.0" y="95.0" width="140.0" height="30.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="405.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Type ID (uint8)</tspan></text>
<rect x="480.0" y="95.0" width="355.0" height="30.0" rx="6" fill="#d5e8d4" stroke="#27ae60" stroke-width="1.5"/><text x="657.5" y="113.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="657.5" dy="0.0">Корисне навантаження повідомлення (довжина = FMT.Length - 3)</tspan></text>
<rect x="30.0" y="150.0" width="820.0" height="160.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повідомлення опису схеми: FMT (Type 0x80, фіксована довжина 89 байтів)</text>
<rect x="45.0" y="190.0" width="110.0" height="40.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="100.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Type (uint8)</tspan><tspan x="100.0" dy="11.7">ID типу (напр. 5)</tspan></text>
<rect x="160.0" y="190.0" width="110.0" height="40.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Length (uint8)</tspan><tspan x="215.0" dy="13.0">Повна довжина</tspan></text>
<rect x="275.0" y="190.0" width="130.0" height="40.0" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="340.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Name (char[4])</tspan><tspan x="340.0" dy="13.0">Назва (ATT, GPS)</tspan></text>
<rect x="410.0" y="190.0" width="180.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Format (char[16])</tspan><tspan x="500.0" dy="13.0">Специфікатор типів (Qfffe)</tspan></text>
<rect x="595.0" y="190.0" width="240.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="715.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Columns (char[64])</tspan><tspan x="715.0" dy="13.0">Назви полів (TimeUS,Roll,Pitch...)</tspan></text>
<rect x="45.0" y="240.0" width="790.0" height="55.0" rx="4" fill="#f9fbe7" stroke="#afb42b" stroke-width="1.2"/>
<text x="440.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#827717" text-anchor="middle" font-weight="700">Повідомлення одиниць вимірювання та множників: FMTU (Type 0x2A)</text>
<text x="440.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Type (uint8) + Units char[16] ('s'=м/с, 'd'=град, 'm'=метри) + Multipliers char[16] ('2'=100, 'e'=0.01, '1'=1)</text>
<rect x="30.0" y="325.0" width="820.0" height="140.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="440.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклади бінарних касет даних (розпаковуються згідно з FMT)</text>
<rect x="45.0" y="362.0" width="380.0" height="48.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="235.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ATT (Attitude): 0xA3 0x95 0x05 + 28 байтів</text>
<text x="235.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">TimeUS (uint64), Roll (float), Pitch (float), Yaw (float)</text>
<rect x="440.0" y="362.0" width="395.0" height="48.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="637.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">GPS: 0xA3 0x95 0x01 + 45 байтів</text>
<text x="637.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">TimeUS, Status, Lat/Lng (int32 / 1e7), Alt (float), Spd (float)</text>
<rect x="45.0" y="415.0" width="790.0" height="40.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="440.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">PARM (Параметр): 0xA3 0x95 0x81 + TimeUS (uint64) + Name (char[16]) + Value (float32)</text>
<text x="440.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MSG (Текстовий лог): 0xA3 0x95 0x82 + TimeUS (uint64) + Text (char[50])</text>
</svg>