<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 975 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="975" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний ланцюг керування: від стіка до мотора</text>
<rect x="35.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">ПУЛЬТ</tspan><tspan x="110.0" dy="16.9">(TX)</tspan></text>
<text x="110.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">стіки → канали → кадр</text>
<rect x="305.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">ПРИЙМАЧ</tspan><tspan x="380.0" dy="16.9">(RX)</tspan></text>
<text x="380.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ловить ефір,</text>
<text x="380.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">розпаковує канали</text>
<rect x="575.0" y="125.0" width="150.0" height="49.9" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">КОНТРОЛЕР</tspan><tspan x="650.0" dy="16.9">(FC)</tspan></text>
<text x="650.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">змішує канали,</text>
<text x="650.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">керує моторами</text>
<rect x="805.0" y="133.5" width="150.0" height="33.0" rx="6" fill="#eef6ef" stroke="#1a1a1a" stroke-width="1.5"/><text x="880.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">МОТОРИ</tspan></text>
<text x="880.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тяга</text>
<line x1="180.0" y1="150.0" x2="310.0" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="245.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">радіолінк</text>
<text x="245.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ефір · стрибки частоти</text>
<text x="245.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">▲ прив'язка</text>
<line x1="450.0" y1="150.0" x2="580.0" y2="150.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="515.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">протокол приймача</text>
<text x="515.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">дріт · SBUS / CRSF</text>
<line x1="720.0" y1="150.0" x2="810.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="480.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дві точки стику різні за природою: одна по ефіру, друга по дроту — і ламаються по-різному</text>
</svg>