<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340">
<rect width="920" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прив'язка (binding): щоб пульт і приймач «впізнавали» одне одного</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одноразово задають спільний унікальний ключ і послідовність стрибків — і пара говорить лише між собою</text>
<rect x="90.0" y="100.0" width="120.0" height="60.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="150.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">пульт A</text>
<rect x="330.0" y="100.0" width="120.0" height="60.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="390.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">приймач A</text>
<line x1="212.0" y1="120.0" x2="328.0" y2="120.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<line x1="328.0" y1="140.0" x2="212.0" y2="140.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<text x="270.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">свій ключ + хоп-послідовність</text>
<rect x="90.0" y="190.0" width="120.0" height="60.0" rx="6" fill="#fbf3df" stroke="#b08900" stroke-width="1.8"/>
<text x="150.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">пульт B</text>
<rect x="330.0" y="190.0" width="120.0" height="60.0" rx="6" fill="#fbf3df" stroke="#b08900" stroke-width="1.8"/>
<text x="390.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">приймач B</text>
<line x1="212.0" y1="220.0" x2="328.0" y2="220.0" stroke="#b08900" stroke-width="2" marker-end="url(#aAmb)"/>
<text x="270.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інший ключ — інша пара</text>
<rect x="500.0" y="96.0" width="360.0" height="160.0" rx="9" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="680.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що дає прив'язка:</text>
<text x="516.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• пара спілкується лише між собою</text>
<text x="516.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• десятки пілотів поряд не заважають</text>
<text x="516.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• спирається на стрибки частоти (§40.5)</text>
<text x="516.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• роблять раз: кнопкою, перемичкою</text>
<text x="516.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  або bind-фразою</text>
</svg>
