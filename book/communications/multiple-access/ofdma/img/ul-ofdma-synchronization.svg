<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація у висхідному каналі UL-OFDMA: узгодження за часом (TA), частотою (CFO) та потужністю</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висхідний канал (Uplink OFDMA): три виміри синхронізації</text>
<rect x="730.0" y="140.0" width="110.0" height="180.0" rx="8" fill="#2c3e50" stroke="#1a252f" stroke-width="2.0"/>
<text x="785.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Базова станція</text>
<text x="785.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ecf0f1" text-anchor="middle">/ Точка доступу</text>
<text x="785.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1abc9c" text-anchor="middle" font-weight="700">Спільний FFT</text>
<text x="785.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#bdc3c7" text-anchor="middle">Один часовий</text>
<text x="785.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#bdc3c7" text-anchor="middle">інтервал демодуляції</text>
<rect x="70.0" y="65.0" width="100.0" height="70.0" rx="6" fill="#edf3fc" stroke="#2457d6" stroke-width="1.6"/>
<text x="120.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Абонент 1 (Близько)</text>
<text x="120.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RU #1 (f₁..f₂₆)</text>
<text x="120.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">d = 15 м</text>
<rect x="70.0" y="255.0" width="100.0" height="70.0" rx="6" fill="#fbeee6" stroke="#d35400" stroke-width="1.6"/>
<text x="120.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Абонент 2 (Далеко)</text>
<text x="120.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RU #2 (f₂₇..f₅₂)</text>
<text x="120.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">d = 350 м</text>
<line x1="170.0" y1="100.0" x2="730.0" y2="180.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="715.0" y1="177.0" x2="730.0" y2="180.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="170.0" y1="290.0" x2="730.0" y2="220.0" stroke="#d35400" stroke-width="2.0"/>
<line x1="715.0" y1="217.0" x2="730.0" y2="220.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="280.0" y="80.0" width="380.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="470.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. Час: Випередження передачі (Timing Advance, TA)</text>
<text x="470.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Далекий абонент стартує раніше, щоб обидва сигнали потрапили в CP</text>
<text x="470.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Помилка |Δt| &lt; 0.1 · T_cp (інакше втрата ортогональності)</text>
<rect x="280.0" y="170.0" width="380.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="470.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Частота: Компенсація зсуву несучої (CFO Correction)</text>
<text x="470.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Різниця гетеродинів спричиняє міжканальну заваду (ICI) між RU</text>
<text x="470.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Точність |Δf_cfo| &lt; 1–2% від кроку Δf</text>
<rect x="280.0" y="260.0" width="380.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Потужність: Контроль рівнів (UL Power Control)</text>
<text x="470.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Близький сигнал не повинен засліпити АЦП і заглушити далекого</text>
<text x="470.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вирівнювання потужності на вході базової станції (усунення Near-Far)</text>
<rect x="280.0" y="350.0" width="480.0" height="50.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="520.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Керування через Downlink Trigger Frame (Wi-Fi 6) або DCI (LTE/5G):</text>
<text x="520.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Базова станція диктує кожному: номер RU/RB, точний час старту, схему MCS та цільову потужність</text>
</svg>