<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="360.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="163.3" y="8.0" width="533.4" height="32.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/><text x="430.0" y="28.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Кореляційний демодулятор (деспрединг): видобування сигналу з-під шуму</tspan></text>
<rect x="42.5" y="78.5" width="145.1" height="63.0" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/><text x="115.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Вхідна суміш r(t)</tspan><tspan x="115.0" dy="13.0">Корисний сигнал s₁(t)</tspan><tspan x="115.0" dy="13.0">+ Інші абоненти ∑s_k(t)</tspan><tspan x="115.0" dy="13.0">+ Тепловий шум n(t)</tspan></text>
<line x1="200.0" y1="110.0" x2="270.0" y2="110.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="290.0" cy="110.0" r="15.0" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<text x="290.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">×</text>
<rect x="226.0" y="180.0" width="128.0" height="50.0" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="290.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle"><tspan x="290.0" dy="0.0">Синхронний код c₁(t)</tspan><tspan x="290.0" dy="13.0">(Точна копія коду</tspan><tspan x="290.0" dy="13.0">цільового абонента)</tspan></text>
<line x1="290.0" y1="170.0" x2="290.0" y2="130.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310.0" y1="110.0" x2="390.0" y2="110.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">c₁(t) · r(t)</text>
<rect x="384.6" y="85.0" width="150.8" height="50.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="460.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="460.0" dy="0.0">Інтегратор зі скиданням</tspan><tspan x="460.0" dy="13.0">∫₀^{T_b} (...) dt</tspan><tspan x="460.0" dy="13.0">Накопичення енергії біта</tspan></text>
<line x1="535.0" y1="110.0" x2="615.0" y2="110.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">Y(T_b)</text>
<rect x="616.0" y="85.0" width="128.0" height="50.0" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/><text x="680.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle"><tspan x="680.0" dy="0.0">Пороговий вирішувач</tspan><tspan x="680.0" dy="13.0">Якщо Y &gt; 0 → d̂ = +1</tspan><tspan x="680.0" dy="13.0">Якщо Y &lt; 0 → d̂ = -1</tspan></text>
<line x1="755.0" y1="110.0" x2="820.0" y2="110.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="830.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="start" font-weight="700">d̂₁</text>
<rect x="30.0" y="255.0" width="800.0" height="90.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="45.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">Математичний баланс енергії після деспредингу:</text>
<text x="45.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="start">• Корисний сигнал s₁(t) · c₁(t) = d₁ · c₁²(t) = d₁ · (+1) → інтегрується когерентно з повним підсиленням L_c</text>
<text x="45.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">• Чужі сигнали s_k(t) · c₁(t) = d_k · [c_k(t) · c₁(t)] → взаємна кореляція близька до 0 (подавляються у G_p разів)</text>
<text x="45.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Тепловий шум n(t) · c₁(t) → залишається некорельованим білим шумом і не накопичується когерентно</text>
</svg>