<rect x="410.0" y="222.0" width="340.0" height="85.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/><text x="580.0" y="250.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Ефекти Massive MIMO:</tspan><tspan x="580.0" dy="11.7">1. Асимптотична ортогональність каналів: (Hᴴ·H)/M → I при M → ∞.</tspan><tspan x="580.0" dy="11.7">2. Затвердіння каналу (Channel Hardening): швидкі завмирання зникають.</tspan><tspan x="580.0" dy="11.7">3. Простий лінійний прекодинг (ZF/MRT) досягає оптимуму.</tspan></text>
<rect x="20.0" y="325.0" width="740.0" height="72.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="358.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Massive MIMO усуває внутрішньостільникову інтерференцію виключно просторовою фільтрацією в цифровій базовій смузі.</tspan><tspan x="390.0" dy="11.7">Стандарти Wi-Fi 6/7 (802.11ax/be) та 5G NR використовують явний та неявний зворотний зв'язок (SRS reciprocity в TDD) для побудови прекодерів.</tspan></text>
