<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розтягування такту: ведений притримує SCL внизу — «зачекай»</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо ведений не встиг (рахує, готує дані), він тримає SCL низьким, і ведучий мусить чекати</text>
<text x="94.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">SCL</text>
