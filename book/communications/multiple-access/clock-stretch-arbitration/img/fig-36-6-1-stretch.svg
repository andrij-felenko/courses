<text x="308.4" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">ведений ТРИМАЄ SCL внизу</text>
<text x="308.4" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(ведучий уже відпустив, та лінія не піднялась)</text>
<line x1="308.4" y1="258.0" x2="308.4" y2="200.0" stroke="#b08900" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="110.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ведучий чекає, поки SCL підніметься, і лише тоді веде далі</text>
<rect x="60.0" y="320.0" width="800.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Розтягування — це «гальмо» з боку веденого: єдиний спосіб для повільного чіпа сказати «ще не готовий».</text>
<text x="460.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Працює лише тому, що SCL — відкритий колектор (§36.2): притримати внизу може будь-хто.</text>
