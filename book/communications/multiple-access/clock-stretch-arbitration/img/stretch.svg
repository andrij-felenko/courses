<text x="315.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">ведений тримає SCL внизу</text>
<text x="315.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(ведучий уже відпустив, та лінія не піднялась)</text>
<text x="120.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">ведучий чекає, поки SCL підніметься, і лише тоді веде далі</text>
<rect x="60.0" y="274.0" width="700.0" height="42.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Розтягування — «гальмо» з боку веденого: єдиний спосіб повільному чіпу сказати «ще не готовий».</tspan><tspan x="410.0" dy="14.3">Працює лише тому, що SCL — спільна лінія з монтажним «І»: притримати внизу може будь-хто.</tspan></text>
