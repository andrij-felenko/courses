<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">EIRP: антена не додає енергії, а концентрує її</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">EIRP = P_tx + G_tx — ефективна випромінена потужність; саме її обмежує закон</text>
<text x="230.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">всебічна антена (0 дБі)</text>
<circle cx="230.0" cy="180.0" r="55.0" fill="none" stroke="#1f47b5" stroke-width="2"/>
<line x1="230.0" y1="180.0" x2="285.0" y2="180.0" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="277.6" y2="207.5" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="257.5" y2="227.6" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="230.0" y2="235.0" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="202.5" y2="227.6" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="182.4" y2="207.5" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="175.0" y2="180.0" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="182.4" y2="152.5" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="202.5" y2="132.4" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="230.0" y2="125.0" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="257.5" y2="132.4" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<line x1="230.0" y1="180.0" x2="277.6" y2="152.5" stroke="#1f47b5" stroke-width="0.8" stroke-linecap="round"/>
<text x="230.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">енергія рівно навсібіч</text>
<text x="670.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">спрямована (+12 дБі)</text>
<path d="M 600,180 Q 670,110 760,180 Q 670,200 600,180 Z" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<line x1="600.0" y1="180.0" x2="770.0" y2="180.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="670.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">той самий ват — але в промінь</text>
<rect x="60.0" y="286.0" width="780.0" height="50.0" rx="9" fill="#fbf3df" stroke="#b08900" stroke-width="1.4"/>
<text x="450.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому виграш антени (дБі) входить у бюджет як «плюс» — і для TX, і для RX.</text>
<text x="450.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Але EIRP обмежений регулятором (напр. +20 дБм у смузі 2.4 ГГц у ЄС) — не можна світити як завгодно гучно.</text>
</svg>
