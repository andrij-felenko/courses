<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування порогу чутливості приймача</text>
<rect x="10.0" y="40.0" width="760.0" height="305.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="40.0" y="260.0" width="360.0" height="60.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="220.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Тепловий шум середовища (k_B · T)</tspan><tspan x="220.0" dy="16.9">-174 dBm/Hz (при T = 290 K)</tspan></text>
<rect x="40.0" y="195.0" width="360.0" height="55.0" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
<text x="220.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">+ Смуга пропускання (10 · log10 B)</tspan><tspan x="220.0" dy="16.9">+60 dB (для смуги B = 1 МГц)</tspan></text>
<rect x="40.0" y="130.0" width="360.0" height="55.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
<text x="220.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">+ Коефіцієнт шуму приймача (N_F)</tspan><tspan x="220.0" dy="16.9">+5 dB (власні шуми підсилювача/LNA)</tspan></text>
<rect x="40.0" y="65.0" width="360.0" height="55.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">+ Поріг сигнал/шум (SNR_min)</tspan><tspan x="220.0" dy="16.9">+10 dB (для демодуляції QPSK)</tspan></text>
<line x1="415.0" y1="290.0" x2="415.0" y2="92.0" stroke="#1e293b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="440.0" y="65.0" width="310.0" height="255.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="595.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#14532d" text-anchor="middle" font-weight="700">Підсумковий поріг чутливості</text>
<text x="595.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">P_sens = k_B·T + 10·log10(B) + N_F + SNR_min</tspan><tspan x="595.0" dy="16.9"></tspan><tspan x="595.0" dy="16.9">P_sens = -174 + 60 + 5 + 10</tspan><tspan x="595.0" dy="16.9"></tspan><tspan x="595.0" dy="16.9">P_sens = -99 dBm</tspan></text>
<rect x="460.0" y="240.0" width="270.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="595.0" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle"><tspan x="595.0" dy="0.0">Якщо прийнятий сигнал P_RX &lt; -99 dBm,</tspan><tspan x="595.0" dy="15.0">приймач не зможе декодувати дані</tspan><tspan x="595.0" dy="15.0">(імовірність помилки BER розтеться).</tspan></text>
</svg>