<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Читаємо даташит: запас лінії — різниця TX і чутливості RX</text>
<line x1="110.0" y1="150.0" x2="670.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="650.0" y1="150.0" x2="670.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="674.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">dBm</text>
<line x1="166.0" y1="143.0" x2="166.0" y2="157.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="166.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−95 dBm</text>
<text x="166.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">чутливість RX</text>
<line x1="625.2" y1="143.0" x2="625.2" y2="157.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="625.2" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+20 dBm</text>
<text x="625.2" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">потужність TX</text>
<path d="M 166.0 110.0 Q 395.6 72.0 625.2 110.0" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="395.6" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">запас на всі втрати = 115 дБ</text>
<rect x="80.0" y="206.0" width="620.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Різниця двох чисел даташита — твій бюджет у децибелах:</tspan><tspan x="390.0" dy="15.6">(+20) − (−95) = 115 дБ. Стільки можна «втратити» на дорозі, поки зв'язок живий.</tspan></text>
</svg>