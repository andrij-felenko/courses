<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Децибели — спільна мова всього радіотракту</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">підсилення, втрати, шум, виграш антени — усе ВІДНОШЕННЯ, тож усе зручно в дБ</text>
<rect x="60.0" y="96.0" width="200.0" height="120.0" rx="10" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<text x="160.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">підсилення</text>
<text x="160.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+дБ</text>
<text x="160.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">підсилювач додає</text>
<rect x="267.0" y="96.0" width="200.0" height="120.0" rx="10" fill="#fbfbfb" stroke="#c0271e" stroke-width="2"/>
<text x="367.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">втрати</text>
<text x="367.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">−дБ</text>
<text x="367.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кабель, стіна, відстань</text>
<rect x="474.0" y="96.0" width="200.0" height="120.0" rx="10" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<text x="574.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SNR</text>
<text x="574.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дБ</text>
<text x="574.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сигнал / шум</text>
<rect x="681.0" y="96.0" width="200.0" height="120.0" rx="10" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<text x="781.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">виграш антени</text>
<text x="781.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">dBi</text>
<text x="781.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">спрямованість антени</text>
<rect x="60.0" y="236.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Раз усе — відношення, увесь шлях сигналу описують однією мовою дБ і просто складають.</text>
<text x="450.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">dBi — виграш антени відносно ідеальної всебічної; теж логарифмічне відношення (§41).</text>
</svg>
