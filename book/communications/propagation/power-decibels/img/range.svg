<text x="380.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">розмах ≈ 13 порядків  (× 10 000 000 000 000)</text>
<rect x="60.0" y="226.0" width="640.0" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="250.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Лінійно «0.000000000001 Вт» писати незручно й легко помилитися.</tspan><tspan x="380.0" dy="15.6">Логарифм стискає кожне «×10» в однаковий крок — числа стають охайними.</tspan></text>
