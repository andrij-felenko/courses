<text x="110.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ISI від τ_max</text>
<rect x="160.0" y="260.0" width="40.0" height="55.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/>
<rect x="200.0" y="260.0" width="480.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<text x="440.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вікно обробки FFT приймача (абсолютно чисте від ISI!)</text>
