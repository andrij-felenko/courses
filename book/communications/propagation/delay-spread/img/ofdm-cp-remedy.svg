<text x="110.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">τ_max</text>
<line x1="60.0" y1="355.0" x2="200.0" y2="355.0" stroke="#d35400" stroke-width="2.0"/>
<text x="130.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">T_CP (тривалість CP)</text>
<text x="380.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Умова відсутності ISI: T_CP ≥ τ_max</text>
