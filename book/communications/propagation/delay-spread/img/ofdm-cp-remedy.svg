<text x="130.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">CP (копія хвоста)</text>
<rect x="200.0" y="120.0" width="480.0" height="55.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.0"/>
<text x="440.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="700">Корисна частина символу T_sub (відліки IFFT)</text>
<path d="M 620,120 C 620,95 130,95 130,120" fill="none" stroke="#d35400" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="370.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle">циклічне копіювання (захист ортогональності)</text>
<text x="50.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Прийнятий символ у разі часового розкиду затримок τ_max ≤ T_CP:</text>
