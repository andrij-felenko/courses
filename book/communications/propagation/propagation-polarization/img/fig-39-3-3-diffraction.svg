<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дифракція: хвиля огинає край і заходить «у тінь»</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за перешкодою не повна темрява — хвиля загинається за ріг; що довша хвиля, то сильніше</text>
<rect x="420.0" y="150.0" width="40.0" height="160.0" rx="0" fill="#e3ded2" stroke="#9a9488" stroke-width="2"/>
<line x1="120.0" y1="130.0" x2="120.0" y2="300.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="160.0" y1="130.0" x2="160.0" y2="300.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="200.0" y1="130.0" x2="200.0" y2="300.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="220.0" y1="215.0" x2="410.0" y2="215.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="230.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">фронти хвилі →</text>
<path d="M 440,150 A 30 30 0 0 1 434,180" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<path d="M 440,150 A 60 60 0 0 1 428,210" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<path d="M 440,150 A 90 90 0 0 1 422,240" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<text x="560.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">загинається у «тінь» за краєм</text>
<text x="520.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">зона тіні (сигнал слабший, але є)</text>
<rect x="60.0" y="286.0" width="780.0" height="40.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.3"/>
<text x="450.0" y="311.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому за рогом будинку зв'язок є (хоч слабший); і саме тому НИЗЬКІ частоти краще «заходять» за перешкоди.</text>
</svg>
