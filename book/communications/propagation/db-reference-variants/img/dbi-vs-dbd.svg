<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опорні одиниці підсилення антен: dBi проти dBd</text>
<circle cx="200.0" cy="190.0" r="65.0" fill="#eaf2ff" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="200.0" cy="190.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ізотропний випромінювач</text>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0 dBi (ідеальна сфера)</text>
<text x="200.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Випромінює однаково в 3D</text>
<line x1="310.0" y1="190.0" x2="420.0" y2="190.0" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="365.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="700">+2.15 dB</text>
<text x="365.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">dBi = dBd + 2.15</text>
<ellipse cx="560.0" cy="190.0" rx="95.0" ry="60.0" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.0"/>
<line x1="560.0" y1="145.0" x2="560.0" y2="235.0" stroke="#1a1a1a" stroke-width="4.0"/>
<circle cx="560.0" cy="190.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="560.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="middle" font-weight="700">Півхвильовий диполь</text>
<text x="560.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0 dBd = 2.15 dBi</text>
<text x="560.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спрямовує енергію в бік</text>
</svg>