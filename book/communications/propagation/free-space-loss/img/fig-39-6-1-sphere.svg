  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому сигнал слабшає навіть у порожнечі: куля розпливається</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама потужність розмазується по дедалі більшій сфері (площа 4πr²) → густина падає як 1/r²</text>
<circle cx="200.0" cy="210.0" r="10.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="200.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">TX</text>
<path d="M 200,130 A 80 80 0 0 1 200,290" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="257.6" y="152.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">r</text>
<path d="M 200,50 A 160 160 0 0 1 200,370" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="315.2" y="94.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">2r</text>
<path d="M 200,-30 A 240 240 0 0 1 200,450" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="372.8" y="37.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3r</text>
<rect x="432.0" y="198.0" width="18.0" height="24.0" rx="0" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="480.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">RX ловить</text>
<text x="480.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">крихітний клаптик</text>
<rect x="60.0" y="300.0" width="780.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це той самий закон оберненого квадрата, що й у Кулона/поля (§1.2): вплив розбавляється по сфері.</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Жодного поглинання — лише геометрія: що далі, то тоншим клаптиком хвилі дістається приймачу.</text>
</svg>
