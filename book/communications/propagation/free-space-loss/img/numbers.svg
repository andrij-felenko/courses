  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Числа: втрати у вільному просторі на 2.4 ГГц</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">навіть без перешкод відстань «з'їдає» десятки децибел — це найбільший пожирач бюджету</text>
<rect x="200.0" y="96.0" width="500.0" height="32.0" rx="6" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="216.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">відстань</text>
<text x="480.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">втрати (приблизно)</text>
<rect x="200.0" y="128.0" width="500.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="216.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 м</text>
<text x="480.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">≈ 40 дБ</text>
<rect x="200.0" y="166.0" width="500.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="216.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">10 м</text>
<text x="480.0" y="191.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">≈ 60 дБ</text>
<rect x="200.0" y="204.0" width="500.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="216.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">100 м</text>
<text x="480.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">≈ 80 дБ</text>
<rect x="200.0" y="242.0" width="500.0" height="38.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="216.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 км</text>
<text x="480.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">≈ 100 дБ</text>
<rect x="60.0" y="290.0" width="780.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожне ×10 відстані додає ≈20 дБ втрат. На 100 м уже −80 дБ — і це ще в чистому полі.</text>
<text x="450.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Типовий запас радіолінії — близько 115 дБ: відстань легко з'їдає більшу його частину.</text>
</svg>
