<text x="735.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">(дБм)</text>
<rect x="50.0" y="260.0" width="680.0" height="75.0" rx="6" fill="#fcf3cf" stroke="#f1c40f" stroke-width="1.5"/><text x="390.0" y="286.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Формула розрахунку цифрового RSSI у DSP:</tspan><tspan x="390.0" dy="15.0">RSSI (дБм) = 10 · log₁₀( ∑(Iₖ² + Qₖ²) / N ) − Gain_AGC + Calibration_Offset</tspan><tspan x="390.0" dy="15.0">DSP сумує цифрову потужність відліків і віднімає поточний коефіцієнт підсилення AGC.</tspan></text>
</svg>