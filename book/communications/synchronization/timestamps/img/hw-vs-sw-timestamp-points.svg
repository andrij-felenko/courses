<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точки фіксування міток часу в мережевому стеку та джерело невизначеності</text>
<rect x="40.0" y="65.0" width="480.0" height="58.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="280.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Користувацька програма</tspan><tspan x="280.0" dy="16.2">gettimeofday() / clock_gettime()</tspan></text>
