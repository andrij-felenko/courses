<rect x="550.0" y="143.0" width="260.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Джитер: 10–50 мкс (стек протоколів, блокування)</tspan></text>
<line x1="280.0" y1="201.0" x2="280.0" y2="221.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
