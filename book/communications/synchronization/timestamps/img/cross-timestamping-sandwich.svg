<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехресне фіксування часу: Програмний «сендвіч» проти апаратного Cross-TS</text>
<rect x="40.0" y="60.0" width="365.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="222.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="222.5" dy="0.0">Програмне опитування (PTP_SYS_OFFSET)</tspan></text>
<rect x="60.0" y="110.0" width="325.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="222.5" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="222.5" dy="0.0">1. Зчитування CPU TSC₁ (t_cpu1)</tspan></text>
<line x1="222.0" y1="144.0" x2="222.0" y2="162.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="162.0" width="325.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="222.5" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="222.5" dy="0.0">2. Читання PHC через PCIe шину (t_phc)</tspan></text>
<line x1="222.0" y1="196.0" x2="222.0" y2="214.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="214.0" width="325.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="222.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="222.5" dy="0.0">3. Зчитування CPU TSC₂ (t_cpu2)</tspan></text>
<rect x="40.0" y="265.0" width="365.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="222.5" y="291.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="222.5" dy="0.0">Оцінка часу CPU: t_cpu ≈ (t_cpu1 + t_cpu2) / 2</tspan><tspan x="222.5" dy="15.0">Похибка: ±(t_cpu2 − t_cpu1) / 2</tspan><tspan x="222.5" dy="15.0">Затримка шини PCIe: 500 нс – 5 мкс</tspan><tspan x="222.5" dy="15.0">(несиметричні черги транзакцій PCIe)</tspan></text>
<rect x="435.0" y="60.0" width="365.0" height="35.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="617.5" y="81.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="617.5" dy="0.0">Апаратне фіксування (PTP_SYS_OFFSET_PRECISE / PTM)</tspan></text>
<rect x="455.0" y="110.0" width="325.0" height="42.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="617.5" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="617.5" dy="0.0">Апаратний тригер / Сигнал PCIe PTM</tspan><tspan x="617.5" dy="15.0">(Спільний фронт стробування)</tspan></text>
<line x1="617.0" y1="152.0" x2="525.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="617.0" y1="152.0" x2="710.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="445.0" y="185.0" width="160.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="525.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Регістр CPU</tspan><tspan x="525.0" dy="15.0">(TSC / ART)</tspan><tspan x="525.0" dy="15.0">Одночасна фіксація</tspan></text>
<rect x="630.0" y="185.0" width="160.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Регістр PHC</tspan><tspan x="710.0" dy="15.0">(IEEE 1588 Clock)</tspan><tspan x="710.0" dy="15.0">Одночасна фіксація</tspan></text>
<rect x="435.0" y="265.0" width="365.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="617.5" y="291.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="617.5" dy="0.0">Зіставлення: (t_cpu, t_phc) фіксуються в один такт</tspan><tspan x="617.5" dy="15.0">Похибка прив'язки: &lt; 5–10 нс</tspan><tspan x="617.5" dy="15.0">Повністю усуває вплив затримок ОС,</tspan><tspan x="617.5" dy="15.0">шини PCIe та переривань процесора</tspan></text>
</svg>