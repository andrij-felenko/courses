<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бітова структура основних форматів часових міток</text>
<text x="40.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. NTP 64-бітний формат (RFC 5905, шкала з 1900 року, квант 232.8 пс):</text>
<rect x="40.0" y="88.0" width="370.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="225.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">32 біти: Цілі секунди</tspan><tspan x="225.0" dy="15.0">Діапазон: 0 .. 4 294 967 295 с (~136 років)</tspan></text>
<rect x="420.0" y="88.0" width="370.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="105.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">32 біти: Дробова частина секунди</tspan><tspan x="605.0" dy="13.7">Квант: 2⁻³² с ≈ 0.2328 нс (двійковий фіксований дріб)</tspan></text>
<text x="40.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. PTP IEEE 1588 80-бітний формат (шкала TAI з 1970 року) + CorrectionField:</text>
<rect x="40.0" y="198.0" width="440.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">48 бітів: Секунди TAI (UInt48)</tspan><tspan x="260.0" dy="15.0">Діапазон: ~8.9 млн років без переповнення</tspan></text>
<rect x="490.0" y="198.0" width="300.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">32 біти: Наносекунди (UInt32)</tspan><tspan x="640.0" dy="15.0">Діапазон: 0 .. 999 999 999 нс</tspan></text>
<rect x="40.0" y="246.0" width="750.0" height="36.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="415.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">CorrectionField (64 біти): Наносекунди, масштабовані на 2¹⁶ (48 бітів цілих нс + 16 бітів суб-нс дробу)</tspan></text>
<text x="40.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">3. RTP 32-бітний формат (RFC 3550, такти медіа-кодека):</text>
<rect x="40.0" y="353.0" width="750.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="415.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">32 біти: Лічильник тактів квантування медіапотоку (RTP Timestamp)</tspan><tspan x="415.0" dy="15.0">Відео (90 кГц): 1 такт = 11.11 мкс (період переповнення ~13.2 години)</tspan><tspan x="415.0" dy="15.0">Аудіо (48 кГц): 1 такт = 20.83 мкс (період переповнення ~24.8 години)</tspan></text>
</svg>