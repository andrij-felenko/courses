<line x1="222.8" y1="235.0" x2="222.8" y2="385.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 2"/>
<line x1="207.8" y1="330.0" x2="207.8" y2="290.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="200.8" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end" font-weight="700">PM₀ &gt; 0</text>
<line x1="237.8" y1="330.0" x2="237.8" y2="317.9" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="244.8" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">PM &lt; 0 (зрив)</text>
<rect x="380.0" y="75.0" width="340.0" height="150.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="395.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Математичний механізм втрати фази</text>
<text x="395.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Передатна функція затримки: W(s) = e^{-s·τ}</text>
<text x="395.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Зсув фази: Δφ(ω) = -ω·τ (рад) = -57.3°·ω·τ</text>
<text x="395.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запас за фазою: PM = PM₀ - ω_c·τ</text>
<text x="395.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Критична затримка зриву стійкості: τ_crit = PM₀ / ω_c</text>
<text x="395.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">  (при PM₀=45° та ω_c=25 рад/с → τ_crit = 31.4 мс)</text>
<rect x="380.0" y="235.0" width="340.0" height="150.0" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.2"/>
<text x="395.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Наслідки для замкненого контуру (Feedback)</text>
<text x="395.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Негативний зворотний зв'язок стає позитивним</text>
<text x="395.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Виникнення стійких автоколивань (граничні цикли)</text>
<text x="395.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Розхитування сервоприводів та перегрів моторів</text>
<text x="395.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пілотажне розгойдування (Pilot-Induced Oscillation)</text>
<text x="395.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Зниження коефіцієнтів PID як паліатив погіршує динаміку</text>
<rect x="35.0" y="410.0" width="690.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="425.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Вплив чистого запізнення: амплітуда не змінюється (0 дБ), але фаза падає лінійно з частотою ω, руйнуючи запас стійкості PM.</tspan></text>
</svg>