<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розходження часових шкал TAI, UT1 та ступінчасте коригування UTC</text>
<rect x="30.0" y="55.0" width="780.0" height="46.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">TAI (Міжнародний атомний час): Шкала на базі 400+ цезієвих еталонів. Суворо рівномірна та неперервна (секунда SI).</tspan></text>
<rect x="30.0" y="109.0" width="780.0" height="46.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="420.0" y="135.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">UT1 (Астрономічний час обертання Землі): Шкала за кутом повороту планети. Нерівномірна через припливне гальмування та рух магми.</tspan></text>
<rect x="30.0" y="163.0" width="780.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">UTC (Координований всесвітній час): Секунда SI (як у TAI), але з дискретними кроками +1 с (23:59:60) для утримання |UTC−UT1| &lt; 0.9 с.</tspan></text>
<line x1="50.0" y1="360.0" x2="790.0" y2="360.0" stroke="#333333" stroke-width="1.5"/>
<line x1="750.0" y1="360.0" x2="800.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Час (роки)</text>
