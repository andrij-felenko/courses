<text x="125.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дробова частина</text>
<rect x="450.0" y="195.0" width="470.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="685.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова послідовність періодів дільника (при FRAC/16 = 3/16)</text>
