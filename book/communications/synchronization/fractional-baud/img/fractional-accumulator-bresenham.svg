<text x="295.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b07a00" text-anchor="middle" font-weight="700">Фазовий акумулятор</text>
<text x="295.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACC = ACC + FRAC</text>
<text x="295.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">модуль M (16 або 8)</text>
<text x="295.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">регістр фази [m біт]</text>
<line x1="240.0" y1="210.0" x2="240.0" y2="179.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="240.0" y1="185.0" x2="240.0" y2="179.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Carry (+1)</text>
