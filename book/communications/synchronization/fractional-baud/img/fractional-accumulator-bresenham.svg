<text x="685.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">16 циклів дільника = 13 циклів по N тактів + 3 цикли по (N+1) тактів</text>
<text x="685.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Середній коефіцієнт ділення: DIV_avg = N + 3/16 (без накопичення фазового дрейфу)</text>
<rect x="40.0" y="335.0" width="880.0" height="105.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Принцип роботи фазового акумулятора (алгоритм Брезенгема): на кожному вихідному такті до регістра ACC додається дріб FRAC.</tspan><tspan x="480.0" dy="15.0">Коли ACC досягає модуля M (16 або 8), виникає переповнення (Carry), яке вмикає поділ на N+1 замість N на один цикл,</tspan><tspan x="480.0" dy="15.0">а з акумулятора віднімається M. Завдяки рівномірному розподілу додаткових тактів у часі сумарна фазова похибка</tspan><tspan x="480.0" dy="15.0">кадру UART утримується в межах 1/16 біта, що унеможливлює накопичення фазового розсинхрону.</tspan></text>
</svg>