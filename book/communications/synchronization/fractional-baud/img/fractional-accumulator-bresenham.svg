<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схемотехніка дробового дільника: фазовий акумулятор та подвійний модуль</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">динамічне подовження окремих циклів ділення на 1 такт для синтезу середнього дробового коефіцієнта</text>
<rect x="40.0" y="110.0" width="100.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="90.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">f_CK</text>
<text x="90.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тактовий сигнал</text>
<line x1="140.0" y1="137.0" x2="200.0" y2="137.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
