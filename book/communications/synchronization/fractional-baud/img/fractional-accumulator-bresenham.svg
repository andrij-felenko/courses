<text x="315.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ділить на N або N+1</text>
<text x="315.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">керований лічильник тактів</text>
<line x1="430.0" y1="137.0" x2="510.0" y2="137.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
