<text x="685.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Очищений клок f_out
(Ультранизький джиттер σ &lt; 100 фс)</text>
<rect x="30.0" y="290.0" width="700.0" height="100.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="45.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Компроміс смуги петлі ФАПЧ (Loop Bandwidth f_BW):</text>
<text x="45.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• f &lt; f_BW (Низькі частоти): Петля відстежує опорний сигнал f_ref (виправляє повільний дрейф частоти).</text>
<text x="45.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• f &gt; f_BW (Високі частоти): Петльовий фільтр блокує швидкий фазовий шум f_ref; вихід визначається надчистим VCXO.</text>
<text x="45.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">• Оптимум f_BW: Обирається на точці перетину спектральних густин фазового шуму вхідного клоку та внутрішнього VCXO.</text>
