<rect x="20.0" y="380.0" width="620.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="330.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Затримка в іоносфері різна над різними місцями, тож поправка — не одне число, а карта:</tspan><tspan x="330.0" dy="15.6">SBAS дає затримку у вузлах сітки, приймач інтерполює її в точці протику променем.</tspan></text>
