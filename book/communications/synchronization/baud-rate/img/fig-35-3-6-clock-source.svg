<rect x="60.0" y="352.0" width="800.0" height="56.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бюджет ≈5% ділять: похибка baud TX + похибка baud RX + дрейф годинника + зерно передискретизації.</text>
<text x="460.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому два пристрої з внутрішнім RC на 115200 часто «не бачать» одне одного, а з кварцами — легко.</text>
