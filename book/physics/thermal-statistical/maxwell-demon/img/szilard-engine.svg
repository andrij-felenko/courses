<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 834.3 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="834.3" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириетапний термодинамічний цикл двигуна Сіларда (1929)</text>
<rect x="25.0" y="55.0" width="180.0" height="330.0" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
<rect x="25.0" y="55.0" width="180.0" height="35.0" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<rect x="25.0" y="75.0" width="180.0" height="15.0" rx="6" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<text x="115.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">1. Вставляння</text>
<line x1="35.0" y1="90.0" x2="195.0" y2="90.0" stroke="#333333" stroke-width="1.0"/>
<rect x="45.0" y="105.0" width="140.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<line x1="115.0" y1="105.0" x2="115.0" y2="205.0" stroke="#333333" stroke-width="2.0" stroke-dasharray="3,3"/>
<circle cx="70.0" cy="155.0" r="7.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<rect x="32.9" y="265.2" width="164.2" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="115.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Перегородка ділить</tspan><tspan x="115.0" dy="14.3">об'єм V навпіл.</tspan><tspan x="115.0" dy="14.3">Молекула з одного боку.</tspan></text>
<rect x="220.0" y="55.0" width="180.0" height="330.0" rx="8" fill="none" stroke="#d97706" stroke-width="1.5"/>
<rect x="220.0" y="55.0" width="180.0" height="35.0" rx="8" fill="#fef3c7" stroke="none" stroke-width="1.5"/>
<rect x="220.0" y="75.0" width="180.0" height="15.0" rx="6" fill="#fef3c7" stroke="none" stroke-width="1.5"/>
<text x="310.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Вимірювання</text>
<line x1="230.0" y1="90.0" x2="390.0" y2="90.0" stroke="#d97706" stroke-width="1.0"/>
<rect x="240.0" y="105.0" width="140.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<line x1="310.0" y1="105.0" x2="310.0" y2="205.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="265.0" cy="155.0" r="7.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="310.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Пам'ять: [ L ]</text>
<rect x="234.2" y="265.2" width="151.7" height="59.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/><text x="310.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Демон реєструє:</tspan><tspan x="310.0" dy="14.3">молекула Ліворуч (L).</tspan><tspan x="310.0" dy="14.3">Пам'ять = 1 біт.</tspan></text>
<rect x="415.0" y="55.0" width="180.0" height="330.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="415.0" y="55.0" width="180.0" height="35.0" rx="8" fill="#dcfce7" stroke="none" stroke-width="1.5"/>
<rect x="415.0" y="75.0" width="180.0" height="15.0" rx="6" fill="#dcfce7" stroke="none" stroke-width="1.5"/>
<text x="505.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Розширення</text>
<line x1="425.0" y1="90.0" x2="585.0" y2="90.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="435.0" y="105.0" width="140.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<line x1="555.0" y1="105.0" x2="555.0" y2="205.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="475.0" y1="155.0" x2="550.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="470.0" cy="155.0" r="7.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="505.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">W = k_B T ln 2</text>
<rect x="410.4" y="265.2" width="189.3" height="59.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="505.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Газ розширюється,</tspan><tspan x="505.0" dy="14.3">виконує роботу W = kT ln 2,</tspan><tspan x="505.0" dy="14.3">поглинає Q з теплостата.</tspan></text>
<rect x="610.0" y="55.0" width="180.0" height="330.0" rx="8" fill="none" stroke="#2457d6" stroke-width="1.5"/>
<rect x="610.0" y="55.0" width="180.0" height="35.0" rx="8" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<rect x="610.0" y="75.0" width="180.0" height="15.0" rx="6" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<text x="700.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">4. Стирання</text>
<line x1="620.0" y1="90.0" x2="780.0" y2="90.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="630.0" y="105.0" width="140.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<circle cx="700.0" cy="155.0" r="7.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<line x1="700.0" y1="220.0" x2="700.0" y2="240.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Q_виділ ≥ k_B T ln 2</text>
<rect x="624.2" y="265.2" width="151.7" height="59.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="700.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Стирання 1 біта</tspan><tspan x="700.0" dy="14.3">пам'яті демона (0).</tspan><tspan x="700.0" dy="14.3">Q_стирання = kT ln 2.</tspan></text>
<rect x="5.7" y="394.0" width="808.6" height="32.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Сумарний баланс ентропії за весь цикл: ΔS_сумарна = ΔS_теплостата + ΔS_стирання = -k_B ln 2 + k_B ln 2 = 0</tspan></text>
</svg>