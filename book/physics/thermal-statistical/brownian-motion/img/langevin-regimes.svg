<text x="360.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Залежність середнього квадрата зсуву &lt;x²(t)&gt; від часу t у логарифмічному масштабі</text>
