<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 771.28 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="771.28" height="380" fill="#ffffff"/>
