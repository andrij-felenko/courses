<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс сил у рівнянні Ланжевена: m (dv/dt) = -γ v + ξ(t)</text>
<circle cx="410.0" cy="160.0" r="38.0" fill="#fdedec" stroke="#e67e22" stroke-width="2.5"/>
<text x="410.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Частинка</text>
<text x="410.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">маса m, швидкість v</text>
<line x1="372.0" y1="160.0" x2="230.0" y2="160.0" stroke="#2980b9" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="98.4" y="128.4" width="143.1" height="63.2" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="170.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">В'язке гальмування</tspan><tspan x="170.0" dy="15.6">F_дисипації = -γ·v</tspan><tspan x="170.0" dy="15.6">(Вивід енергії)</tspan></text>
<line x1="448.0" y1="160.0" x2="590.0" y2="160.0" stroke="#e67e22" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="575.0" y="128.4" width="150.0" height="63.2" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/><text x="650.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Тепловий шум</tspan><tspan x="650.0" dy="15.6">F_флуктуації = ξ(t)</tspan><tspan x="650.0" dy="15.6">(Вхід енергії)</tspan></text>
<line x1="160.0" y1="235.0" x2="660.0" y2="235.0" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="230.7" y="230.1" width="358.5" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/><text x="410.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Умова термодинамічної рівноваги:</tspan><tspan x="410.0" dy="16.9">⟨ξ(t) ξ(t')⟩ = 2 · γ · k_B · T · δ(t - t')</tspan></text>
</svg>