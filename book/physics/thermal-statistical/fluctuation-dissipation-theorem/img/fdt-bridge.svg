<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="340.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема флуктуації-дисипації як двосторонній місток</text>
<rect x="40.0" y="70.0" width="240.0" height="210.0" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="2.0"/><text x="160.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Спонтанні флуктуації</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">• Тепловий рух (k_B T)</tspan><tspan x="160.0" dy="16.9">• Шум Найквіста U_ш</tspan><tspan x="160.0" dy="16.9">• Броунівська тряска</tspan><tspan x="160.0" dy="16.9"></tspan><tspan x="160.0" dy="16.9">Хаотичні поштовхи</tspan></text>
<rect x="580.0" y="70.0" width="240.0" height="210.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.0"/><text x="700.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Дисипативний відгук</tspan><tspan x="700.0" dy="16.9"></tspan><tspan x="700.0" dy="16.9">• В'язке тертя γ</tspan><tspan x="700.0" dy="16.9">• Електричний опір R</tspan><tspan x="700.0" dy="16.9">• Уявна сприйнятливість χ''</tspan><tspan x="700.0" dy="16.9"></tspan><tspan x="700.0" dy="16.9">Втрати енергії в тепло</tspan></text>
<rect x="315.0" y="105.0" width="230.0" height="140.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="430.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Тепловий батут (T)</tspan><tspan x="430.0" dy="13.0"></tspan><tspan x="430.0" dy="13.0">ФДТ: S_A(ω) = (2 k_B T / ω) χ''(ω)</tspan><tspan x="430.0" dy="13.0"></tspan><tspan x="430.0" dy="13.0">Мікроскопічний баланс</tspan></text>
<line x1="280.0" y1="145.0" x2="315.0" y2="145.0" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="315.0" y1="205.0" x2="280.0" y2="205.0" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="545.0" y1="145.0" x2="580.0" y2="145.0" stroke="#2980b9" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="205.0" x2="545.0" y2="205.0" stroke="#2980b9" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Єдине мікроскопічне джерело: теплові зіткнення з термостатом</text>
</svg>