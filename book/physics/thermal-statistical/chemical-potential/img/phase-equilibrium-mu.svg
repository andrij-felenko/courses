<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" height="390">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Градієнт хімічного потенціалу Δμ як рушійна сила перенесення маси</text>
<rect x="40.0" y="60.0" width="330.0" height="270.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="205.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Нерівноважний стан (μ₁ &gt; μ₂)</text>
<rect x="60.0" y="110.0" width="130.0" height="150.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="125.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 1 (Рідина)</text>
<text x="125.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">μ₁ (високий)</text>
<text x="125.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Високий тиск / N₁</text>
<line x1="200.0" y1="185.0" x2="250.0" y2="185.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="225.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Потік J_N</text>
<rect x="260.0" y="110.0" width="95.0" height="150.0" rx="6" fill="#fff6ee" stroke="#c0392b" stroke-width="1.5"/>
<text x="307.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 2 (Пара)</text>
<text x="307.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">μ₂ (низький)</text>
<text x="307.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пара розріджена</text>
<text x="205.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Маса самовільно тече від вищого μ₁ до нижчого μ₂</text>
<rect x="410.0" y="60.0" width="330.0" height="270.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="575.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Термодинамічна рівновага (μ₁ = μ₂)</text>
<rect x="425.0" y="110.0" width="120.0" height="150.0" rx="6" fill="#eef9f2" stroke="#27ae60" stroke-width="1.5"/>
<text x="485.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 1 (Рідина)</text>
<text x="485.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">μ₁ = μ_рівн</text>
<text x="485.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Насичений стан</text>
<text x="575.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">J_ввип = J_конд</text>
<line x1="550.0" y1="175.0" x2="600.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="195.0" x2="550.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="605.0" y="110.0" width="120.0" height="150.0" rx="6" fill="#eef9f2" stroke="#27ae60" stroke-width="1.5"/>
<text x="665.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 2 (Пара)</text>
<text x="665.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">μ₂ = μ_рівн</text>
<text x="665.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Насичена пара P_sat</text>
<text x="575.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Випар і конденсація збалансовані: Δμ = 0</text>
<text x="390.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Умова рівноваги фаз: T₁ = T₂,  P₁ = P₂,  μ₁(T, P) = μ₂(T, P)</text>
</svg>