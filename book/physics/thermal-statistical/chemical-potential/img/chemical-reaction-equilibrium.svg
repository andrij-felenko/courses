<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинаміка хімічної реакції: ν_A A + ν_B B ⇌ ν_C C + ν_D D</text>
<rect x="40.0" y="70.0" width="265.0" height="160.0" rx="8" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="172.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Реагенти (A + B)</text>
<text x="172.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сумарний хімічний потенціал:</text>
<text x="172.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">μ_вхід = ν_A·μ_A + ν_B·μ_B</text>
<text x="172.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">При хімічному зсуві знижується G</text>
<rect x="335.0" y="90.0" width="110.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<line x1="350.0" y1="135.0" x2="430.0" y2="135.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="430.0" y1="165.0" x2="350.0" y2="165.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пряма</text>
<text x="390.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зворотна</text>
<rect x="475.0" y="70.0" width="265.0" height="160.0" rx="8" fill="#eef9f2" stroke="#27ae60" stroke-width="1.5"/>
<text x="607.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Продукти (C + D)</text>
<text x="607.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сумарний хімічний потенціал:</text>
<text x="607.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">μ_вихід = ν_C·μ_C + ν_D·μ_D</text>
<text x="607.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Накопичення продуктів росте μ_вихід</text>
<rect x="73.7" y="260.1" width="632.6" height="49.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="390.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Спорідненість реакції: ΔG_r = ∑ ν_i · μ_i</tspan><tspan x="390.0" dy="16.9">Умова хімічної рівноваги: ΔG_r = 0  ⇒  ν_A·μ_A + ν_B·μ_B = ν_C·μ_C + ν_D·μ_D</tspan></text>
<text x="390.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">При рівновазі сума хімічних потенціалів реагентів точно дорівнює сумі потенціалів продуктів</text>
</svg>