<text x="470.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Класичний ідеальний газ: μ = k_B T ln(n λ_dB³)</text>
<text x="390.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Високі T або низька густина: усі квантові статистики асимптотично прямують до класичної межі (μ &lt; 0)</text>
