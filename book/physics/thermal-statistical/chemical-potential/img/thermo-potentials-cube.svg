<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинамічні потенціали та часткові похідні по числу частинок N</text>
<rect x="40.0" y="60.0" width="330.0" height="145.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="60.0" width="330.0" height="34.0" rx="8" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="83.0" width="330.0" height="12" fill="#c0392b" stroke="none"/>
<text x="205.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Внутрішня енергия U(S, V, N)</text>
<text x="205.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">dU = T·dS - P·dV + μ·dN</text>
<rect x="118.4" y="157.5" width="173.2" height="25.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">(∂U / ∂N)_(S, V) = μ</tspan></text>
<rect x="410.0" y="60.0" width="330.0" height="145.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="410.0" y="60.0" width="330.0" height="34.0" rx="8" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<rect x="410.0" y="83.0" width="330.0" height="12" fill="#2457d6" stroke="none"/>
<text x="575.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Вільна енергія Гельмгольца F(T, V, N)</text>
<text x="575.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">dF = -S·dT - P·dV + μ·dN</text>
<rect x="488.4" y="157.5" width="173.2" height="25.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="575.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">(∂F / ∂N)_(T, V) = μ</tspan></text>
<rect x="40.0" y="235.0" width="330.0" height="145.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="235.0" width="330.0" height="34.0" rx="8" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="258.0" width="330.0" height="12" fill="#27ae60" stroke="none"/>
<text x="205.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Ентальпія H(S, P, N)</text>
<text x="205.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">dH = T·dS + V·dP + μ·dN</text>
<rect x="118.4" y="332.5" width="173.2" height="25.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">(∂H / ∂N)_(S, P) = μ</tspan></text>
<rect x="410.0" y="235.0" width="330.0" height="145.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="410.0" y="235.0" width="330.0" height="34.0" rx="8" fill="#8e44ad" stroke="#333333" stroke-width="1.5"/>
<rect x="410.0" y="258.0" width="330.0" height="12" fill="#8e44ad" stroke="none"/>
<text x="575.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Енергія Гіббса G(T, P, N)</text>
<text x="575.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">dG = -S·dT + V·dP + μ·dN</text>
<rect x="488.4" y="332.5" width="173.2" height="25.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/><text x="575.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">(∂G / ∂N)_(T, P) = μ</tspan></text>
<text x="390.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Для однокомпонентної системи: G(T, P, N) = N · μ(T, P)  ⇒  μ = g(T, P) (молярна/питома енергія Гіббса)</text>
</svg>