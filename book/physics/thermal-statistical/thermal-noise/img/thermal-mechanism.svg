<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за §1.2.9 електрони безперервно товчуться від теплоти; навіть без струму їхній хаотичний рух дає мізерну змінну напругу на кінцях резистора</text>
