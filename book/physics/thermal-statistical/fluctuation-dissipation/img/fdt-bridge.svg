<rect x="126.1" y="251.2" width="587.7" height="47.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Той самий тепловий хаос мікроатомів породжує і гальмування зовн. сили (дисипацію),</tspan><tspan x="420.0" dy="15.6">і хаотичні удари по макросистемі (флуктуації). Механізм взаємодії один і той самий.</tspan></text>
