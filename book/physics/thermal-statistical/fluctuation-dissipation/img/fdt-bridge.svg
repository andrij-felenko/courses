<rect x="28.9" y="94.7" width="242.3" height="100.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="150.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Спонтанні флуктуації</tspan><tspan x="150.0" dy="16.9"></tspan><tspan x="150.0" dy="16.9">• Випадковий тепловий рух</tspan><tspan x="150.0" dy="16.9">• Спектральна густина S_A(ω)</tspan><tspan x="150.0" dy="16.9">• Шуми: Джонсона, Броунівський</tspan></text>
<rect x="561.4" y="94.7" width="257.1" height="100.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="690.0" y="115.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Лінійна дисипація</tspan><tspan x="690.0" dy="16.9"></tspan><tspan x="690.0" dy="16.9">• Поглинання зовн. енергії</tspan><tspan x="690.0" dy="16.9">• Уявна сприйнятливість Im[χ(ω)]</tspan><tspan x="690.0" dy="16.9">• Тертя γ, опір R, в'язкість η</tspan></text>
