<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому працює радіатор: ланцюг із кондукції, тоді конвекції</text>
<text x="430.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тепло від кристала йде твердими тілами (кондукція), а з ребер зривається в повітря (конвекція + трохи ІЧ)</text>
<rect x="49.0" y="124.0" width="92.0" height="52.0" rx="8" fill="#fff" stroke="#c0271e" stroke-width="2"/>
<text x="95.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">кристал</text>
<text x="95.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">junction</text>
<rect x="189.0" y="124.0" width="92.0" height="52.0" rx="8" fill="#fff" stroke="#e08030" stroke-width="2"/>
<text x="235.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">корпус</text>
<text x="235.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">case</text>
<rect x="324.0" y="124.0" width="92.0" height="52.0" rx="8" fill="#fff" stroke="#a06a00" stroke-width="2"/>
<text x="370.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#a06a00" text-anchor="middle" font-weight="bold" font-style="normal">паста</text>
<text x="370.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">TIM</text>
<rect x="464.0" y="124.0" width="92.0" height="52.0" rx="8" fill="#fff" stroke="#1f8a3b" stroke-width="2"/>
<text x="510.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">радіатор</text>
<text x="510.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">heat sink</text>
<rect x="635.0" y="124.0" width="110.0" height="52.0" rx="8" fill="#fff" stroke="#1f47b5" stroke-width="2"/>
<text x="690.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">повітря</text>
<text x="690.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ambient</text>
<line x1="145.0" y1="150.0" x2="179.0" y2="150.0" stroke="#e0792a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="165.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e0792a" text-anchor="middle" font-weight="bold" font-style="normal">кондукція</text>
<text x="165.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крізь кремній і метал</text>
<line x1="285.0" y1="150.0" x2="314.0" y2="150.0" stroke="#e0792a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="302.5" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e0792a" text-anchor="middle" font-weight="bold" font-style="normal">кондукція</text>
<text x="302.5" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крізь пасту (виганяє повітря)</text>
<line x1="420.0" y1="150.0" x2="454.0" y2="150.0" stroke="#e0792a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="440.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e0792a" text-anchor="middle" font-weight="bold" font-style="normal">кондукція</text>
<text x="440.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у тіло радіатора</text>
<line x1="560.0" y1="150.0" x2="634.0" y2="150.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="600.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">конвекція + ІЧ</text>
<text x="600.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ребра → рухоме повітря</text>
<path d="M 560,194 Q 568,204 560,214" fill="none" stroke="#d08a1e" stroke-width="1.8"/>
<path d="M 570,194 Q 578,204 570,214" fill="none" stroke="#d08a1e" stroke-width="1.8"/>
<path d="M 580,194 Q 588,204 580,214" fill="none" stroke="#d08a1e" stroke-width="1.8"/>
<text x="600.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#a06a00" text-anchor="start" font-weight="normal" font-style="italic">трохи ІЧ-випромінювання (мале за низьких T)</text>
<rect x="60.0" y="250.0" width="740.0" height="110.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="430.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кожна ланка — це тепловий опір Rθ (§1.3.9), і всі вони стоять ПОСЛІДОВНО:</text>
<text x="430.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ(j→корпус) + Rθ(паста) + Rθ(радіатор→повітря)  →  ΔT = P · Rθ_сум</text>
<text x="430.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">«Поліпшити охолодження» = зменшити котрусь ланку: кращий контакт і паста (кондукція),</text>
<text x="430.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більша площа ребер і обдув (конвекція). Радіатор б'є саме по найслабшій ланці — віддачі в повітря.</text>
</svg>
