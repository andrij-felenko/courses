<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
  </marker>
</defs>
<rect x="0.0" y="0.0" width="840.0" height="520.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/><text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична висота Z проти геопотенціальної h</text><text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зменшення прискорення вільного падіння g(Z) та еквівалентний потенціал g₀·h</text><rect x="63.4" y="337.4" width="233.2" height="45.3" rx="6" fill="#f1f5f9" stroke="#1a1a1a" stroke-width="1.5"/><text x="180.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Поверхня Землі (R_E = 6356.766 км)</tspan><tspan x="180.0" dy="14.3">g = g₀ = 9.80665 м/с²</tspan></text><line x1="180.0" y1="480.0" x2="180.0" y2="415.0" stroke="#1a1a1a" stroke-width="1.8"/><path d="M 180.0 415.0 L 185.5 426.0 L 174.5 426.0 z" fill="#1a1a1a"/><line x1="180.0" y1="305.0" x2="180.0" y2="140.0" stroke="#d97706" stroke-width="2.5"/><path d="M 180.0 140.0 L 185.5 151.0 L 174.5 151.0 z" fill="#d97706"/><text x="190.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Z (геометрична висота)</text><rect x="405.8" y="81.8" width="308.4" height="76.4" rx="6" fill="#fffbe6" stroke="#ffe58f" stroke-width="1.5"/><text x="560.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Геометрична висота Z:</tspan><tspan x="560.0" dy="15.0">Реальна фізична відстань від рівня моря (м).</tspan><tspan x="560.0" dy="15.0">g(Z) = g₀ · ( R_E / (R_E + Z) )²</tspan><tspan x="560.0" dy="15.0">Прискорення g спадає з висотою Z.</tspan></text><rect x="451.7" y="214.3" width="216.6" height="91.3" rx="6" fill="#e6f7ff" stroke="#91caff" stroke-width="1.5"/><text x="560.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Геопотенціальна висота h:</tspan><tspan x="560.0" dy="15.0">h = ( R_E · Z ) / ( R_E + Z )</tspan><tspan x="560.0" dy="15.0">Шкала висоти при сталому g₀:</tspan><tspan x="560.0" dy="15.0">g₀ · dh = g(Z) · dZ</tspan><tspan x="560.0" dy="15.0">Спрощує рівняння гідростатики!</tspan></text><line x1="560.0" y1="180.0" x2="560.0" y2="200.0" stroke="#2457d6" stroke-width="2.0"/><path d="M 560.0 200.0 L 554.5 189.0 L 565.5 189.0 z" fill="#2457d6"/><rect x="383.8" y="380.2" width="352.3" height="59.6" rx="6" fill="#f6ffed" stroke="#b7eb8f" stroke-width="1.5"/><text x="560.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Приклад на Z = 80.0 км:</tspan><tspan x="560.0" dy="14.3">h = (6356.766 · 80) / (6356.766 + 80) = 79.006 км</tspan><tspan x="560.0" dy="14.3">Похибка без геопотенціалу: ~1.24% (падіння g на 2.5%)</tspan></text>
</svg>
