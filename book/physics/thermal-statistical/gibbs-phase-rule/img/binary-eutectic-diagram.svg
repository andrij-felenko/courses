<rect x="195.9" y="352.4" width="248.3" height="35.3" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">ТВЕРДА СУМІШ (Кристали A + Кристали B)</tspan><tspan x="320.0" dy="14.3">C = 2, P = 2 =&gt; F' = 1 (при P=const)</tspan></text>
