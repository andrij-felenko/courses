<rect x="203.6" y="89.3" width="232.9" height="51.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">РІДКИЙ РОЗЧИН (L)</tspan><tspan x="320.0" dy="15.0">C = 2, P = 1 =&gt; F' = 2 - 1 + 1 = 2</tspan><tspan x="320.0" dy="15.0">(Можна змінювати T та x_B)</tspan></text>
<rect x="243.2" y="197.1" width="133.7" height="45.8" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="310.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Евтоктична точка E</tspan><tspan x="310.0" dy="13.7">P = 3 (L + A_s + B_s)</tspan><tspan x="310.0" dy="13.7">F' = 2 - 3 + 1 = 0</tspan></text>
