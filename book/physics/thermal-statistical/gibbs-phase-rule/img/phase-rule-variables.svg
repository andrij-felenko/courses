<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс інтенсивних змінних та рівнянь термодинамічної рівноваги</text>
<rect x="10.0" y="10.0" width="620.0" height="400.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.0"/>
<rect x="64.8" y="49.7" width="190.4" height="100.6" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="70.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ІНТЕНСИВНІ ЗМІННІ</tspan><tspan x="160.0" dy="16.9">• T (Температура)</tspan><tspan x="160.0" dy="16.9">• P (Тиск)</tspan><tspan x="160.0" dy="16.9">• x_i^α (Концентрації)</tspan><tspan x="160.0" dy="16.9">Усього змінних: 2 + P·C</tspan></text>
<rect x="345.1" y="49.7" width="249.7" height="100.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="70.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">РІВНЯННЯ РІВНОВАГИ</tspan><tspan x="470.0" dy="16.9">• ∑ x_i^α = 1 (в кожній фазі P)</tspan><tspan x="470.0" dy="16.9">• μ_i¹ = μ_i² = ... = μ_i^P</tspan><tspan x="470.0" dy="16.9">  (по P-1 для кожного C)</tspan><tspan x="470.0" dy="16.9">Усього рівнянь: P + C·(P - 1)</tspan></text>
<line x1="160.0" y1="175.0" x2="270.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="175.0" x2="370.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="123.4" y="243.9" width="393.2" height="52.2" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="320.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Ступені вільності F = (Змінні) - (Рівняння)</tspan><tspan x="320.0" dy="18.2">F = (2 + P·C) - [P + C·(P - 1)]</tspan></text>
<line x1="320.0" y1="315.0" x2="320.0" y2="350.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="114.7" y="357.5" width="410.6" height="35.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="320.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">ГОЛОВНЕ ПРАВИЛО ФАЗ ГІББСА:  F = C - P + 2</tspan></text>
</svg>