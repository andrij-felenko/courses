<rect x="530.0" y="135.0" width="250.0" height="100.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="655.0" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Параметри Пуассонівського розподілу:</tspan><tspan x="655.0" dy="11.7">• Дисперсія: Var(N) = σ² = &lt;N&gt;</tspan><tspan x="655.0" dy="11.7">• Стандартне відхилення: σ = √&lt;N&gt; = 10</tspan><tspan x="655.0" dy="11.7">• Відносна похибка: σ / &lt;N&gt; = 1 / √&lt;N&gt; = 10%</tspan><tspan x="655.0" dy="11.7">• Двостороння довірча зона 68.3%: 100 ± 10</tspan></text>
<text x="380.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">При збільшенні кількості відліків N відносна статистична похибка спадає пропорційно 1/√N</text>
