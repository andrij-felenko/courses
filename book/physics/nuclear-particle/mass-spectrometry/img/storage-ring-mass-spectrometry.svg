<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
<rect width="860" height="520" fill="#ffffff"/>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мас-спектрометрія у накопичувальних кільцях важких іонів</text>
<rect x="100.0" y="110.0" width="660.0" height="190.0" rx="95" fill="#f4f6f8" stroke="#34495e" stroke-width="2.5"/>
<rect x="180.0" y="150.0" width="500.0" height="110.0" rx="55" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
<rect x="105.0" y="115.0" width="650.0" height="180.0" rx="90" fill="none" stroke="#2980b9" stroke-width="2.0" stroke-dasharray="6,4"/>
<rect x="115.0" y="125.0" width="630.0" height="160.0" rx="80" fill="none" stroke="#e74c3c" stroke-width="2.0" stroke-dasharray="6,4"/>
<line x1="40.0" y1="205.0" x2="100.0" y2="205.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="70.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="700">Пучок іонів</text>
<rect x="190.0" y="60.0" width="200.0" height="36.0" rx="4" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
<text x="290.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="700">Електронне охолодження</text>
<rect x="470.0" y="60.0" width="180.0" height="36.0" rx="4" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/>
<text x="560.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e5109" text-anchor="middle" font-weight="700">Детектор Шотткі</text>
<rect x="350.0" y="310.0" width="160.0" height="32.0" rx="4" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/>
<text x="430.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#117a65" text-anchor="middle" font-weight="700">TOF-детектор (IMS)</text>
<rect x="60.0" y="360.0" width="350.0" height="135.0" rx="6" fill="#fcf3cf" stroke="#f1c40f" stroke-width="1.5"/>
<text x="235.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7d6608" text-anchor="middle" font-weight="700">Schottky Mass Spectrometry (SMS)</text>
<text x="235.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">• Потребує електронного охолодження (Δv/v -&gt; 10⁻⁷)</tspan><tspan x="235.0" dy="15.0">• Вимірювання частоти обертання неруйнівним способом</tspan><tspan x="235.0" dy="15.0">• Тривалість вимірювання: t &gt; 1-10 секунд</tspan><tspan x="235.0" dy="15.0">• Точність маси: δm/m ~ 10⁻⁶...10⁻⁷</tspan></text>
<rect x="450.0" y="360.0" width="350.0" height="135.0" rx="6" fill="#d5f5e3" stroke="#2ecc71" stroke-width="1.5"/>
<text x="625.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#196f3d" text-anchor="middle" font-weight="700">Isochronous Mass Spectrometry (IMS)</text>
<text x="625.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">• Налаштування кільця у режим γ = γ_t (ізохронізм)</tspan><tspan x="625.0" dy="15.0">• Період обертання не залежить від розкиду швидкостей</tspan><tspan x="625.0" dy="15.0">• Рекордний час вимірювання: t_1/2 &gt; 10-50 мкс!</tspan><tspan x="625.0" dy="15.0">• Ідеально для ультракороткоживучих нуклідів</tspan></text>
</svg>