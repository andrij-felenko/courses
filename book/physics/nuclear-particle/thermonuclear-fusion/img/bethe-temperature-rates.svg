<text x="190.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">pp-ланцюжок (ε ∝ T⁴)</text>
<text x="330.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">CNO-цикл (ε ∝ T¹⁷)</text>
<rect x="515.0" y="90.0" width="290.0" height="85.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="660.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">1. pp-ланцюжок (маломасивні зорі)</tspan><tspan x="660.0" dy="13.0">Чудовий опір температурі ε ∝ T⁴.</tspan><tspan x="660.0" dy="13.0">Домінує в Сонці (T_c ≈ 15.7·10⁶ K),</tspan><tspan x="660.0" dy="13.0">забезпечує стабільне горіння мільярди років.</tspan></text>
<rect x="515.0" y="190.0" width="290.0" height="100.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">2. CNO-цикл (масивні зорі M &gt; 1.3 M_☉)</tspan><tspan x="660.0" dy="14.3">Екстремальна чутливість ε ∝ T¹⁷!</tspan><tspan x="660.0" dy="14.3">Найменше підвищення температури</tspan><tspan x="660.0" dy="14.3">викликає вибуховий приріст енергії.</tspan><tspan x="660.0" dy="14.3">Домінує у гарячих ядрах.</tspan></text>
<rect x="515.0" y="305.0" width="290.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="337.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">3. Наслідки для структури зорі</tspan><tspan x="660.0" dy="14.3">Через ε ∝ T¹⁷ енерговиділення CNO</tspan><tspan x="660.0" dy="14.3">гостро сфокусоване в центрі ядра.</tspan><tspan x="660.0" dy="14.3">Це створює колосальний потік тепла</tspan><tspan x="660.0" dy="14.3">і формує конвективне ядро в масивних зорях.</tspan></text>
