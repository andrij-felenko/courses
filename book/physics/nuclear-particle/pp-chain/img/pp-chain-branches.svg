<rect x="275.0" y="315.0" width="210.0" height="190.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="380.0" y="363.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">pp-II гілка (~14.1%)</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">³He + ⁴He → ⁷Be + γ</tspan><tspan x="380.0" dy="14.3">⁷Be + e⁻ → ⁷Li + νₑ</tspan><tspan x="380.0" dy="14.3">⁷Li + p → 2 ⁴He</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Q_eff = 25.66 МЕв</tspan><tspan x="380.0" dy="14.3">E_ν = 0.862 МЕв</tspan></text>
