<rect x="302.4" y="68.4" width="355.2" height="63.2" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="480.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">1. Стадія ініціації (утворення дейтерію)</tspan><tspan x="480.0" dy="15.6">p + p → ²H + e⁺ + νₑ  (99.77%, Q = 1.442 МЕв)</tspan><tspan x="480.0" dy="15.6">p + e⁻ + p → ²H + νₑ  (pep, 0.23%, Q = 1.442 МЕв)</tspan></text>
