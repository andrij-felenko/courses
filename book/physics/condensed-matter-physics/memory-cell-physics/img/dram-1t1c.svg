<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">DRAM: біт — це заряд на одному конденсаторі</text>
<rect x="150.0" y="95.0" width="40.0" height="26.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<line x1="170.0" y1="79.0" x2="170.0" y2="95.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="159.0" y1="79.0" x2="181.0" y2="79.0" stroke="#27ae60" stroke-width="3.0"/>
<line x1="150.0" y1="121.0" x2="150.0" y2="133.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="190.0" y1="121.0" x2="190.0" y2="133.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="190.0" y1="95.0" x2="240.0" y2="95.0" stroke="#b9770e" stroke-width="2.4"/>
<text x="170.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">лінія слова</text>
<line x1="150.0" y1="121.0" x2="110.0" y2="121.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="95.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end" font-weight="700">біт-лінія</text>
<line x1="170.0" y1="133.0" x2="170.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="150.0" y1="165.0" x2="190.0" y2="165.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="150.0" y1="174.0" x2="190.0" y2="174.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="170.0" y1="174.0" x2="170.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="156.0" y1="196.0" x2="184.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="161.0" y1="201.0" x2="179.0" y2="201.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="166.0" y1="206.0" x2="174.0" y2="206.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="232.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">конденсатор:</text>
<text x="232.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">тут «живе» біт (заряд = 1)</text>
<rect x="440.0" y="70.0" width="350.0" height="130.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/><text x="615.0" y="139.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0"></tspan></text>
<text x="615.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Крихітна — звідси щільність</text>
<text x="456.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">лише 2 елементи проти 6 транзисторів SRAM</text>
<text x="456.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ у рази більше біт на тому самому кристалі</text>
<text x="456.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→ дешевша на біт; тому DRAM — велика пам'ять ПК,</text>
<text x="456.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">а SRAM лишають для малого й швидкого</text>
<text x="105.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Підступ: заряд СТІКАЄ</text>
<line x1="120.0" y1="260.0" x2="120.0" y2="370.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="120.0" y1="370.0" x2="410.0" y2="370.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="114.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">заряд</text>
<text x="416.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">час</text>
<polyline points="120.0,270.0 127.2,276.2 134.5,282.0 141.8,287.3 149.0,292.3 156.2,296.9 163.5,301.2 170.8,305.1 178.0,308.8 185.2,312.2 192.5,315.4 199.8,318.3 207.0,321.0 214.2,323.6 221.5,325.9 228.8,328.1 236.0,330.1 243.2,332.0 250.5,333.7 257.8,335.3 265.0,336.8 272.2,338.2 279.5,339.5 286.8,340.7 294.0,341.8 301.2,342.8 308.5,343.8 315.8,344.6 323.0,345.5 330.2,346.2 337.5,346.9 344.8,347.6 352.0,348.2 359.2,348.8 366.5,349.3 373.8,349.8 381.0,350.2 388.2,350.6 395.5,351.0 402.8,351.4 410.0,351.7" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<line x1="120.0" y1="344.0" x2="410.0" y2="344.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="126.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">повний (1)</text>
<text x="410.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">поріг: нижче — «1» втрачено</text>
<text x="265.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">мілісекунди — і заряд протік крізь неідеальний ізолятор</text>
<rect x="440.0" y="250.0" width="350.0" height="120.0" rx="6" fill="#fff8e8" stroke="#b9770e" stroke-width="1.6"/><text x="615.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0"></tspan></text>
<text x="615.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">Розв'язок: ОСВІЖЕННЯ</text>
<text x="456.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">кожні кілька мс комірку перечитують</text>
<text x="456.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">і записують назад — поки біт ще цілий.</text>
<text x="456.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Звідси «динамічна»: стан не стоїть сам.</text>
<text x="456.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Читання теж РУЙНІВНЕ (ключ відкрив —</text>
<text x="456.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">заряд витік), тож одразу пишуть назад.</text>
<text x="410.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тут лише фізика комірки; коли освіжати й з якими таймінгами — це вже зовнішній контролер пам'яті.</text>
</svg>