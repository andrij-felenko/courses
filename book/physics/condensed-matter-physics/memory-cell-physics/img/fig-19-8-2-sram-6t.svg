<svg xmlns="http://www.w3.org/2000/svg" width="900" height="484" viewBox="0 0 900 484">
<rect width="900" height="484" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">SRAM: біт тримає петля з двох інверторів (6 транзисторів)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це той самий тригер із Розділу 16, тепер у кремнії: два інвертори, замкнені в кільце, тримають один зі станів 0/1</text>
<path d="M 310.0 155.0 L 310.0 195.0 L 350.0 175.0 Z" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<circle cx="354.0" cy="175.0" r="3.5" fill="#ffffff" stroke="#1f47b5" stroke-width="1.6"/>
<path d="M 580.0 155.0 L 580.0 195.0 L 540.0 175.0 Z" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<circle cx="536.0" cy="175.0" r="3.5" fill="#ffffff" stroke="#c0271e" stroke-width="1.6"/>
<text x="330.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">інвертор 1</text>
<text x="560.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">інвертор 2</text>
<line x1="354.0" y1="169.0" x2="536.0" y2="147.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="536.0" y1="181.0" x2="354.0" y2="203.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="445.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вихід одного → вхід іншого</text>
<circle cx="352.0" cy="197.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="538.0" cy="153.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="290.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Q = 1</text>
<text x="602.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Q̄ = 0</text>
<rect x="250.0" y="235.0" width="40.0" height="26.0" rx="4" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<line x1="270.0" y1="219.0" x2="270.0" y2="235.0" stroke="#1f8a3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="259.0" y1="219.0" x2="281.0" y2="219.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="250.0" y1="261.0" x2="250.0" y2="273.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="290.0" y1="261.0" x2="290.0" y2="273.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="270.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">M5</text>
<rect x="610.0" y="235.0" width="40.0" height="26.0" rx="4" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<line x1="630.0" y1="219.0" x2="630.0" y2="235.0" stroke="#1f8a3b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="619.0" y1="219.0" x2="641.0" y2="219.0" stroke="#1f8a3b" stroke-width="3" stroke-linecap="round"/>
<line x1="610.0" y1="261.0" x2="610.0" y2="273.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="650.0" y1="261.0" x2="650.0" y2="273.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="630.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">M6</text>
<line x1="220.0" y1="248.0" x2="250.0" y2="248.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="650.0" y1="248.0" x2="680.0" y2="248.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="150.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">біт-лінія</text>
<text x="752.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">біт-лінія</text>
<line x1="270.0" y1="215.0" x2="270.0" y2="235.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="630.0" y1="215.0" x2="630.0" y2="235.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="270.0" y1="205.0" x2="630.0" y2="205.0" stroke="#caa24a" stroke-width="2.4" stroke-linecap="round"/>
<text x="450.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">лінія слова (вибір комірки)</text>
<text x="450.0" y="227.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">2 транзистори доступу пускають читання/запис лише обраної комірки</text>
<rect x="60.0" y="100.0" width="230.0" height="150.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.6"/>
<text x="175.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Чому стабільна</text>
<text x="76.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кільце двох інверторів має</text>
<text x="76.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">лише два стійкі стани:</text>
<text x="76.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Q=1,Q̄=0  або  Q=0,Q̄=1.</text>
<text x="76.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Кожен підживлює інший —</text>
<text x="76.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">біт «тримає сам себе»,</text>
<text x="76.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">доки є живлення.</text>
<rect x="610.0" y="100.0" width="230.0" height="150.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="725.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ціна: 6 транзисторів</text>
<text x="626.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4 на петлю + 2 на доступ</text>
<text x="626.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ комірка ВЕЛИКА</text>
<text x="626.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ дорога на біт, мало вмісту</text>
<text x="626.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="626.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Зате: дуже ШВИДКА,</text>
<text x="626.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">не потребує освіження.</text>
<rect x="60.0" y="300.0" width="780.0" height="60.0" rx="10" fill="#f4f7f4" stroke="#1f47b5" stroke-width="1.6"/>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси характер SRAM: блискавична (читати — лише глянути на вузол) і стабільна, але КОМІРКА ВЕЛИКА (6 транзисторів),</text>
<text x="450.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тож SRAM дорога й її мало — лічені кілобайти на МК і швидкі кеші процесора. І летка: вимкнув живлення — петля розпалась, біт зник.</text>
<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Пам'ятаєте «комірка ≈ тригер» із зоопарку §19.3? Ось вона буквально: SRAM — це масив крихітних тригерів, по одному на біт.</text>
<text x="450.0" y="414.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Статична (Static RAM) — бо стан тримається сам, без періодичного відновлення (на відміну від динамічної DRAM, далі).</text>
<text x="450.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тригер тут — той самий механізм перехресного зв'язку, що ми бачили в Розділі 16; пам'ять просто повторила його мільйони разів.</text>
</svg>
