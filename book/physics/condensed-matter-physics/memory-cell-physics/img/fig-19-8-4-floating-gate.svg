<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Плавучий затвор: транзистор, що ПАМ'ЯТАЄ заряд роками</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">звичайний польовий транзистор, але між затвором і каналом ВМУРОВАНО ще один затвор, з усіх боків в ізоляторі — заряд там замкнено</text>
<rect x="120.0" y="260.0" width="360.0" height="40.0" rx="0" fill="#eef0f4" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="300.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кремнієва підкладка (канал між витоком і стоком)</text>
<rect x="120.0" y="240.0" width="60.0" height="20.0" rx="0" fill="#dfe6f5" stroke="#1f47b5" stroke-width="1.3"/>
<text x="150.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">витік</text>
<rect x="420.0" y="240.0" width="60.0" height="20.0" rx="0" fill="#dfe6f5" stroke="#1f47b5" stroke-width="1.3"/>
<text x="450.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стік</text>
<rect x="190.0" y="228.0" width="220.0" height="12.0" rx="0" fill="#f3f5fd" stroke="#8a8a8a" stroke-width="1"/>
<text x="488.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">тонкий «тунельний» оксид</text>
<rect x="190.0" y="196.0" width="220.0" height="28.0" rx="3" fill="#fff2cc" stroke="#caa24a" stroke-width="2"/>
<text x="300.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">ПЛАВУЧИЙ затвор (заряд замкнено тут)</text>
<text x="215.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<text x="245.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<text x="275.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<text x="305.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<text x="335.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<text x="365.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<text x="395.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">–</text>
<rect x="190.0" y="184.0" width="220.0" height="12.0" rx="0" fill="#f3f5fd" stroke="#8a8a8a" stroke-width="1"/>
<text x="488.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ізолятор (з усіх боків!)</text>
<rect x="190.0" y="156.0" width="220.0" height="28.0" rx="3" fill="#dfe6f5" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="300.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">керівний затвор (звідси читаємо/пишемо)</text>
<line x1="300.0" y1="140.0" x2="300.0" y2="156.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вивід</text>
<rect x="540.0" y="100.0" width="330.0" height="196.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.6"/>
<text x="705.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">Як заряд кодує біт</text>
<text x="556.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Заряд на плавучому затворі ЗСУВАЄ поріг,</text>
<text x="556.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">за яким транзистор відкривається.</text>
<text x="556.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="556.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">• є замкнений заряд → високий поріг → «0»</text>
<text x="556.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">• нема заряду → низький поріг → «1»</text>
<text x="556.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Читаємо просто: пробуємо ввімкнути —</text>
<text x="556.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відкрився чи ні і каже, який біт усередині.</text>
<rect x="60.0" y="320.0" width="780.0" height="84.0" rx="10" fill="#f4f7f4" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось де ховається НЕЛЕТКІСТЬ Flash (§19.3): плавучий затвор оточений ізолятором, тож замкнений заряд нікуди не дінеться —</text>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тримається роками БЕЗ живлення. Це фізичний механізм того «чорнила на папері», яким ми образно називали Flash у §19.3.</text>
<text x="450.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Заряд лічать одиницями електронів; саме тому з роками чи від нагріву він помалу губиться — звідси скінченний строк зберігання Flash.</text>
<text x="450.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та якщо заряд замкнено ізолятором — як він туди потрапляє й як його прибрати? У цьому й уся складність запису — наступний рисунок.</text>
<text x="450.0" y="458.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Споріднені нелеткі — EEPROM і давніша EPROM зі скляним віконцем — теж на плавучому затворі; докладніше у вставках до теми.)</text>
</svg>
