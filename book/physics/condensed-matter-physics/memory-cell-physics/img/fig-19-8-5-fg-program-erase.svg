<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому Flash пише повільно й зношується: заряд мусить пройти КРІЗЬ ізолятор</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">щоб закласти чи прибрати заряд, електрони силоміць проштовхують крізь тонкий оксид — це і повільно, і потроху руйнує сам оксид</text>
<rect x="70.0" y="92.0" width="360.0" height="150.0" rx="12" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="250.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЗАПИС: загнати заряд усередину</text>
<rect x="110.0" y="134.0" width="280.0" height="22.0" rx="3" fill="#dfe6f5" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="250.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">керівний затвор (висока напруга)</text>
<rect x="110.0" y="162.0" width="280.0" height="16.0" rx="0" fill="#f3f5fd" stroke="#8a8a8a" stroke-width="1"/>
<rect x="110.0" y="180.0" width="280.0" height="24.0" rx="3" fill="#fff2cc" stroke="#caa24a" stroke-width="1.8"/>
<text x="250.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">плавучий затвор</text>
<line x1="150.0" y1="176.0" x2="150.0" y2="188.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<line x1="200.0" y1="176.0" x2="200.0" y2="188.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<line x1="250.0" y1="176.0" x2="250.0" y2="188.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<line x1="300.0" y1="176.0" x2="300.0" y2="188.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<line x1="350.0" y1="176.0" x2="350.0" y2="188.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="250.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сильне поле проштовхує електрони КРІЗЬ оксид усередину</text>
<rect x="470.0" y="92.0" width="360.0" height="150.0" rx="12" fill="#fdf6f6" stroke="#c0271e" stroke-width="1.8"/>
<text x="650.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">СТИРАННЯ: витягти заряд назад</text>
<rect x="510.0" y="134.0" width="280.0" height="24.0" rx="3" fill="#fff2cc" stroke="#caa24a" stroke-width="1.8"/>
<text x="650.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">плавучий затвор</text>
<rect x="510.0" y="166.0" width="280.0" height="16.0" rx="0" fill="#f3f5fd" stroke="#8a8a8a" stroke-width="1"/>
<rect x="510.0" y="188.0" width="280.0" height="22.0" rx="3" fill="#dfe6f5" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="650.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">підкладка (висока напруга)</text>
<line x1="550.0" y1="166.0" x2="550.0" y2="158.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<line x1="600.0" y1="166.0" x2="600.0" y2="158.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<line x1="650.0" y1="166.0" x2="650.0" y2="158.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<line x1="700.0" y1="166.0" x2="700.0" y2="158.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<line x1="750.0" y1="166.0" x2="750.0" y2="158.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="650.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поле зворотного знаку витягує електрони геть</text>
<rect x="60.0" y="262.0" width="780.0" height="130.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="1.7"/>
<text x="450.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два наслідки — і обидва ми вже бачили в §19.3 як «примхи Flash», тепер ясно ЧОМУ:</text>
<text x="90.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">ПОВІЛЬНО:</text>
<text x="190.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">проштовхати заряд крізь ізолятор — мікро-мілісекунди (проти тактів у RAM), і робиться це цілими блоками.</text>
<text x="90.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">ЗНОС:</text>
<text x="190.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кожен «прорив» крізь оксид потроху його псує; після ~10 000–100 000 циклів комірка перестає тримати заряд.</text>
<text x="90.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ЧИТАННЯ:</text>
<text x="190.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">навпаки, легке й швидке — заряду не чіпаємо, лише дивимось на поріг; тому код виконують прямо з Flash.</text>
<text x="450.0" y="418.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ось і фізичне коріння всього характеру Flash із §19.3: читати — легко, писати — важко, блоками й зі зносом. Усе через цей бар'єр-ізолятор.</text>
<text x="450.0" y="444.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сам квантовий механізм проходу електрона крізь ізолятор (тунелювання Фаулера—Нордгайма) і чому він зношує оксид — у 🧮-вставці до теми.</text>
</svg>
