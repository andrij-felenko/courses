<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис і стирання: заряд мусить пройти крізь ізолятор</text>
<rect x="50.0" y="56.0" width="350.0" height="150.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="225.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАПИС: загнати заряд усередину</text>
<rect x="90.0" y="96.0" width="270.0" height="22.0" rx="6" fill="#dfe6f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="225.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">керівний затвор (висока напруга)</text>
<rect x="90.0" y="124.0" width="270.0" height="14.0" rx="6" fill="#f3f5fd" stroke="#6b7280" stroke-width="1.0"/>
<rect x="90.0" y="142.0" width="270.0" height="22.0" rx="6" fill="#fff2cc" stroke="#b9770e" stroke-width="1.8"/>
<text x="225.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">плавучий затвор</text>
<line x1="130.0" y1="138.0" x2="130.0" y2="124.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="180.0" y1="138.0" x2="180.0" y2="124.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="138.0" x2="230.0" y2="124.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="138.0" x2="280.0" y2="124.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="330.0" y1="138.0" x2="330.0" y2="124.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">сильне поле проштовхує електрони КРІЗЬ оксид усередину</text>
<rect x="420.0" y="56.0" width="350.0" height="150.0" rx="6" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.8"/>
<text x="595.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">СТИРАННЯ: витягти заряд назад</text>
<rect x="460.0" y="96.0" width="270.0" height="22.0" rx="6" fill="#fff2cc" stroke="#b9770e" stroke-width="1.8"/>
<text x="595.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b9770e" text-anchor="middle" font-weight="700">плавучий затвор</text>
<rect x="460.0" y="124.0" width="270.0" height="14.0" rx="6" fill="#f3f5fd" stroke="#6b7280" stroke-width="1.0"/>
<rect x="460.0" y="142.0" width="270.0" height="22.0" rx="6" fill="#dfe6f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="595.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">підкладка (висока напруга)</text>
<line x1="500.0" y1="124.0" x2="500.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="124.0" x2="550.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="124.0" x2="600.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="124.0" x2="650.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="124.0" x2="700.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">поле зворотного знаку витягує електрони геть</text>
<rect x="50.0" y="224.0" width="720.0" height="132.0" rx="6" fill="#fff8e8" stroke="#b9770e" stroke-width="1.7"/>
<text x="410.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідси — увесь характер запису Flash:</text>
<text x="70.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="start" font-weight="700">ПОВІЛЬНО:</text>
<text x="168.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">проштовхати заряд крізь ізолятор — мікро- й мілісекунди (проти тактів RAM), і робиться це блоками.</text>
<text x="70.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ЗНОС:</text>
<text x="168.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">кожен прохід крізь оксид потроху його псує; після ~10⁴–10⁵ циклів комірка не тримає заряд.</text>
<text x="70.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">ЧИТАННЯ:</text>
<text x="168.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">навпаки, легке й швидке — заряду не чіпає, лише дивиться на поріг; тому код виконують прямо з Flash.</text>
<text x="410.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Сам квантовий механізм проходу електрона крізь ізолятор (тунелювання) і чому він руйнує оксид — окрема, тонша історія.</text>
</svg>