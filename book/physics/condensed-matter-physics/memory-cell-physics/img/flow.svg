<rect x="420.0" y="56.0" width="360.0" height="230.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.7"/>
<text x="600.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">EPROM: дешева петля на столі</text>
<rect x="470.0" y="110.0" width="260.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
