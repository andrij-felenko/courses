<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маскова ROM проти EPROM: один постріл проти ітерації</text>
<rect x="40.0" y="56.0" width="360.0" height="230.0" rx="6" fill="#fdf6f6" stroke="#c0392b" stroke-width="1.7"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Маскова ROM: один постріл</text>
<rect x="64.0" y="96.0" width="312.0" height="28.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
