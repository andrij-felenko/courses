<text x="220.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">чекаєш тижні, платиш дорого</text>
<line x1="220.0" y1="196.0" x2="220.0" y2="204.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="64.0" y="204.0" width="312.0" height="28.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="220.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">отримав чипи з «вкарбованим» кодом</text>
<line x1="220.0" y1="232.0" x2="220.0" y2="240.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
