<text x="220.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">замовив фотомаски</text>
<line x1="220.0" y1="160.0" x2="220.0" y2="168.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
