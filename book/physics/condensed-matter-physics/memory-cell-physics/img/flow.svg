<line x1="600.0" y1="218.0" x2="600.0" y2="226.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">«Дорого й повільно помилятися» змінилося на «дешево й швидко» — а отже, швидше вчитися.</text>
