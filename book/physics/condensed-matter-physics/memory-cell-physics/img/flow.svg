<text x="600.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">прошив той самий чип знову</text>
<line x1="730.0" y1="124.0" x2="752.0" y2="124.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
