<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроскопічний механізм взаємодії Дзялошинського — Моріа (DMI)</text>
<rect x="20.0" y="50.0" width="355.0" height="300.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="197.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Симетричний обмін (Гейзенберг)</text>
<text x="197.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">E_ex = -J · (S_i · S_j)</text>
<circle cx="110.0" cy="180.0" r="16.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.0"/>
<text x="110.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">S_i</text>
<circle cx="280.0" cy="180.0" r="16.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.0"/>
<text x="280.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">S_j</text>
<line x1="110.0" y1="160.0" x2="110.0" y2="115.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="280.0" y1="160.0" x2="280.0" y2="115.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="126.0" y1="180.0" x2="264.0" y2="180.0" stroke="#64748b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="197.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Обмін J &gt; 0</text>
<rect x="71.9" y="234.2" width="250.3" height="51.6" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="197.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="197.0" dy="0.0">Інваріантність відносно інверсії:</tspan><tspan x="197.0" dy="14.3">Спіни прагнуть встановитися паралельно</tspan><tspan x="197.0" dy="14.3">(або антипаралельно при J &lt; 0)</tspan></text>
<rect x="405.0" y="50.0" width="355.0" height="300.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="582.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Асиметричний обмін (DMI)</text>
<text x="582.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">E_DMI = -D_ij · (S_i × S_j)</text>
<circle cx="480.0" cy="200.0" r="16.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.0"/>
<text x="480.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">S_i</text>
<circle cx="680.0" cy="200.0" r="16.0" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.0"/>
<text x="680.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">S_j</text>
<circle cx="580.0" cy="130.0" r="18.0" fill="#7c3aed" stroke="#6d28d9" stroke-width="2.0"/>
<text x="580.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">HM</text>
<text x="580.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">Спін-орбітальний зв'язок (L·S)</text>
<line x1="492.0" y1="190.0" x2="568.0" y2="140.0" stroke="#7c3aed" stroke-width="2.0"/>
<line x1="668.0" y1="190.0" x2="592.0" y2="140.0" stroke="#7c3aed" stroke-width="2.0"/>
<line x1="480.0" y1="180.0" x2="480.0" y2="135.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="180.0" x2="720.0" y2="180.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="200.0" x2="580.0" y2="235.0" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="615.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">Вектор D_ij</text>
<rect x="441.2" y="244.2" width="281.6" height="51.6" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/><text x="582.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="582.0" dy="0.0">Порушення симетрії інверсії на межі плівок:</tspan><tspan x="582.0" dy="14.3">Змушує сусідні спіни повертатися</tspan><tspan x="582.0" dy="14.3">під кутом 90°, задаючи киральність</tspan></text>
<text x="390.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Конкуренція між Гейзенбергівським обміном J та DMI визначає характерний розмір і структуру скирміона</text>
</svg>