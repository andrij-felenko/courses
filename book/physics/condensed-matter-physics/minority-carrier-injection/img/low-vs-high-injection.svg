<rect x="10.0" y="10.0" width="780.0" height="380.0" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-width="1.0"/><text x="400.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння режимів ін'єкції неосновних носіїв</text><rect x="30.0" y="60.0" width="360.0" height="310.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">1. Низький рівень ін'єкції (Δp &lt;&lt; n_n0)</text><rect x="70.0" y="140.0" width="90.0" height="180.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">n_n0
(Основні
електрони)</text><rect x="190.0" y="295.0" width="90.0" height="25.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Δp &lt;&lt; n_n0</text><rect x="60.8" y="315.2" width="298.4" height="49.6" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="210.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">• Концентрація основних носіїв не змінюється</tspan><tspan x="210.0" dy="14.3">• Транспорт — суто дифузійний (E ≈ 0)</tspan><tspan x="210.0" dy="14.3">• Час життя τ_p = const (лінійна рекомбінація)</tspan></text><rect x="410.0" y="60.0" width="360.0" height="310.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="590.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">2. Високий рівень ін'єкції (Δp ≥ n_n0)</text><rect x="450.0" y="200.0" width="90.0" height="120.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="495.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">n_n0</text><rect x="450.0" y="140.0" width="90.0" height="60.0" rx="6" fill="#bfdbfe" stroke="#2457d6" stroke-width="1.5"/><text x="495.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">+ Δn</text><rect x="570.0" y="140.0" width="90.0" height="180.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Δp ≈ n_n0
(Висока
ін'єкція)</text><rect x="450.2" y="315.2" width="279.6" height="49.6" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="590.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">• Квазінейтральність залучає Δn ≈ Δp</tspan><tspan x="590.0" dy="14.3">• Виникає внутрішнє амбіполярне поле E_amb</tspan><tspan x="590.0" dy="14.3">• Зниження коефіцієнта підсилення (Вебстер)</tspan></text>
