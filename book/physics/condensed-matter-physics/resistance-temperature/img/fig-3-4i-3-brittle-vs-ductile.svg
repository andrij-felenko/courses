<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
<rect width="800" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прорив Кулиджа: крихкий вольфрам став пластичним дротом</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Юст і Ганаман дали вольфрам, та крихкий; Кулидж навчився тягти його в тонку гнучку нитку</text>
<rect x="40.0" y="90.0" width="360.0" height="230.0" rx="12" fill="#fbece9" stroke="#c0271e" stroke-width="1.6"/>
<text x="220.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Крихкий (1904)</text>
<line x1="90.0" y1="182.0" x2="200.0" y2="182.0" stroke="#888888" stroke-width="5" stroke-linecap="round"/>
<polyline points="200.0,182.0 210.0,168.0 218.0,196.0" fill="none" stroke="#888888" stroke-width="4"/>
<line x1="232.0" y1="182.0" x2="350.0" y2="182.0" stroke="#888888" stroke-width="5" stroke-linecap="round"/>
<text x="220.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ламається при згинанні</text>
<text x="220.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">крихкий вольфрам не витягнеш</text>
<text x="220.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у тонку нитку — лампа недовговічна</text>
<rect x="420.0" y="90.0" width="360.0" height="230.0" rx="12" fill="#eef5ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="600.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Пластичний (Кулидж, 1910)</text>
<line x1="460.0" y1="182.0" x2="560.0" y2="182.0" stroke="#888888" stroke-width="8" stroke-linecap="round"/>
<rect x="560.0" y="168.0" width="20.0" height="28.0" rx="3" fill="#cfe0ef" stroke="#5b87a6" stroke-width="2"/>
<text x="575.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#3a6b86" text-anchor="middle" font-weight="bold" font-style="normal">алмазна фільєра</text>
<line x1="580.0" y1="182.0" x2="736.0" y2="182.0" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
<line x1="700.0" y1="182.0" x2="740.0" y2="182.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="660.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тягнуть у тонесенький дріт</text>
<text x="600.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">гнучкий вольфрам → тонка спіраль,</text>
<text x="600.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">яскрава й довговічна лампа</text>
<text x="400.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Саме ця «пластична» технологія (тягнути крізь алмаз) і зробила вольфрамову лампу масовою.</text>
</svg>
