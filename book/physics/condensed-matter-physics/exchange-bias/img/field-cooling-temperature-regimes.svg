<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурні режими термомагнітного оброблення (Field Cooling)</text>
<line x1="70.0" y1="310.0" x2="700.0" y2="310.0" stroke="#64748b" stroke-width="2.0"/>
<line x1="680.0" y1="310.0" x2="715.0" y2="310.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="715.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Температура T</text>
<line x1="220.0" y1="70.0" x2="220.0" y2="320.0" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="220.0" cy="310.0" r="6.0" fill="#ef4444" stroke="none" stroke-width="1.5"/>
<text x="220.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">T_B</text>
<text x="220.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Температура блокування</text>
<line x1="440.0" y1="70.0" x2="440.0" y2="320.0" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="440.0" cy="310.0" r="6.0" fill="#16a34a" stroke="none" stroke-width="1.5"/>
<text x="440.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">T_N</text>
<text x="440.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Температура Нееля (AFM)</text>
<line x1="620.0" y1="70.0" x2="620.0" y2="320.0" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="620.0" cy="310.0" r="6.0" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="620.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">T_C</text>
<text x="620.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">Температура Кюрі (FM)</text>
<rect x="80.0" y="80.0" width="140.0" height="200.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="150.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Обмінне зміщення</text>
<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">активне (H_EB &gt; 0)</text>
<text x="150.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">FM: феромагнітний
AFM: спіни закріплені</text>
<rect x="230.0" y="80.0" width="200.0" height="200.0" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="330.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">Розблокована фаза</text>
<text x="330.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle" font-weight="700">H_EB = 0, зростає H_c</text>
<text x="330.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle">Тепловий рух долає
анізотропію K_AFM</text>
<rect x="450.0" y="80.0" width="160.0" height="200.0" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
<text x="530.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a16207" text-anchor="middle" font-weight="700">Нагрівання FC</text>
<text x="530.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">AFM у парамагнітному стані</text>
<text x="530.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ca8a04" text-anchor="middle">FM орієнтується уздовж H_FC</text>
<line x1="490.0" y1="245.0" x2="190.0" y2="245.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="330.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Охолодження в полі H_FC (Field Cooling)</text>
<text x="380.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Для створення обмінного зміщення структуру нагрівають вище T_B та охолоджують у полі H_FC</text>
</svg>