<text x="340.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Потужність P(V)</text>
<circle cx="90.0" cy="100.0" r="5.0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="80.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="end" font-weight="700">I_sc</text>
<circle cx="470.0" cy="370.0" r="5.0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="470.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">V_oc</text>
<circle cx="400.0" cy="145.0" r="6.0" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
<line x1="400.0" y1="370.0" x2="400.0" y2="145.0" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
