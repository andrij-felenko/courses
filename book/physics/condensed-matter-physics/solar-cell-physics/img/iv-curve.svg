<text x="400.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">V_mp</text>
<text x="80.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="end" font-weight="700">I_mp</text>
<text x="415.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="left" font-weight="700">MPP (Точка макс. потужності)</text>
<rect x="560.0" y="70.0" width="260.0" height="330.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="690.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахункові співвідношення:</text>
<text x="575.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="left" font-weight="700">1. Рівняння освітленої ВАХ:</text>
<text x="585.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="left">I(V) = I_ph − I_0(e^{qV/k_BT} − 1)</text>
<text x="575.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="left" font-weight="700">2. Напруга холостого ходу:</text>
<text x="585.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="left">V_oc = (k_BT/q) ln(I_ph/I_0 + 1)</text>
<text x="575.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="left" font-weight="700">3. Коефіцієнт заповнення FF:</text>
<text x="585.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="left" font-weight="700">FF = (V_mp × I_mp) / (V_oc × I_sc)</text>
<text x="585.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="left">Для Si: FF ≈ 0.78 … 0.84</text>
<text x="575.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="left" font-weight="700">4. ККД елемента (η):</text>
<text x="585.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="left" font-weight="700">η = P_max / P_in</text>
<text x="585.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="left" font-weight="700">η = (V_oc × I_sc × FF) / P_in</text>
</svg>