<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переключення переносом спінового моменту (STT) у pMTJ</text>
<rect x="20.0" y="50.0" width="370.0" height="360.0" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2.0"/>
<text x="205.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Режим AP → P (Струм I: Free → Pinned)</text>
<text x="205.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Електрони рухаються: Pinned → Free</text>
<rect x="40.0" y="115.0" width="330.0" height="75.0" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/><text x="205.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">1. Електрони проходять Pinned шар і поляризуються (спін ↑).</tspan><tspan x="205.0" dy="11.7">2. Поляризований потік входить у Free шар.</tspan><tspan x="205.0" dy="11.7">3. Спіновий момент передається намагніченості M_free.</tspan></text>
<circle cx="205.0" cy="260.0" r="55.0" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
<line x1="205.0" y1="260.0" x2="205.0" y2="210.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="220.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">M_free (↓)</text>
<line x1="205.0" y1="260.0" x2="245.0" y2="245.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">τ_STT</text>
<line x1="205.0" y1="260.0" x2="175.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="155.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">τ_damp</text>
<rect x="40.0" y="330.0" width="330.0" height="65.0" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="205.0" y="359.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Момент τ_STT протидіє загатуванню Гільберта τ_damp.</tspan><tspan x="205.0" dy="11.7">При I &gt; I_c0 намагніченість перевертається в стан ↑ (P).</tspan></text>
<rect x="410.0" y="50.0" width="370.0" height="360.0" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2.0"/>
<text x="595.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">Режим P → AP (Струм I: Pinned → Free)</text>
<text x="595.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Електрони рухаються: Free → Pinned</text>
<rect x="430.0" y="115.0" width="330.0" height="75.0" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/><text x="595.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">1. Електрони зі спіном ↑ легко проходять у Pinned шар.</tspan><tspan x="595.0" dy="11.7">2. Електрони зі спіном ↓ відбиваються від Pinned інтерфейсу.</tspan><tspan x="595.0" dy="11.7">3. Відбитий потік ↓ повертається і перевертає Free шар.</tspan></text>
<circle cx="595.0" cy="260.0" r="55.0" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
<line x1="595.0" y1="260.0" x2="595.0" y2="210.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="610.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">M_free (↑)</text>
<line x1="595.0" y1="260.0" x2="555.0" y2="275.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">τ_STT</text>
<line x1="595.0" y1="260.0" x2="625.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">τ_damp</text>
<rect x="430.0" y="330.0" width="330.0" height="65.0" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="595.0" y="359.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Відбиті спіни створюють τ_STT у напрямку ↓.</tspan><tspan x="595.0" dy="11.7">При I &gt; I_c0 орієнтація змінюється на антипаралельну (AP).</tspan></text>
</svg>