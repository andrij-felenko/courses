<rect x="465.0" y="100.0" width="300.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="615.0" y="144.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Поздовжня анізотропія (iMTJ):</tspan><tspan x="615.0" dy="11.7">• Намагніченість у площині плівки.</tspan><tspan x="615.0" dy="11.7">• Форма створює демагнетизуюче поле 4πM_s.</tspan><tspan x="615.0" dy="11.7">• Високий струм: I_c0 ∝ M_s² · V · (1 + 4πM_s / 2H_k)</tspan><tspan x="615.0" dy="11.7">• Складність масштабування нижче 40 нм.</tspan></text>
<rect x="465.0" y="245.0" width="300.0" height="140.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Перпендикулярна анізотропія (pMTJ):</tspan><tspan x="615.0" dy="14.3">• Інтерфейсна анізотропія (iPMA) CoFeB/MgO.</tspan><tspan x="615.0" dy="14.3">• Скасовано демагнетизуючий штраф 4πM_s.</tspan><tspan x="615.0" dy="14.3">• Низький струм: I_c0 ∝ (2e/ℏ) · α · E_b / η</tspan><tspan x="615.0" dy="14.3">• Масштабується до 10 нм із Δ ≥ 60!</tspan></text>
