<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спіново-поляризоване тунелювання та ефект TMR</text>
<rect x="20.0" y="50.0" width="370.0" height="360.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="205.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Паралельний стан (P): R_P (Низький опір)</text>
<rect x="40.0" y="100.0" width="100.0" height="180.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">Фіксований шар</tspan><tspan x="90.0" dy="11.7">CoFeB (Pinned)</tspan><tspan x="90.0" dy="11.7">Magnetization ↑</tspan><tspan x="90.0" dy="11.7">DOS: N_up &gt;&gt; N_dn</tspan></text>
<rect x="150.0" y="100.0" width="40.0" height="180.0" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="170.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Бар'єр</tspan><tspan x="170.0" dy="11.7">MgO</tspan><tspan x="170.0" dy="11.7">(~1 нм)</tspan></text>
<rect x="200.0" y="100.0" width="100.0" height="180.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Вільний шар</tspan><tspan x="250.0" dy="11.7">CoFeB (Free)</tspan><tspan x="250.0" dy="11.7">Magnetization ↑</tspan><tspan x="250.0" dy="11.7">DOS: N_up &gt;&gt; N_dn</tspan></text>
<line x1="140.0" y1="140.0" x2="200.0" y2="140.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="170.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Спін ↑ (високий потік)</text>
<line x1="140.0" y1="220.0" x2="200.0" y2="220.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="170.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спін ↓ (низький)</text>
<rect x="40.0" y="300.0" width="330.0" height="95.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="338.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Основний потік електронів (спін ↑) знаходить вільні стани такого ж спіну.</tspan><tspan x="205.0" dy="11.7">Провідність висока → Опір R_P = R_min</tspan><tspan x="205.0" dy="11.7">Логічний стан: «0»</tspan></text>
<rect x="410.0" y="50.0" width="370.0" height="360.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="2.0"/>
<text x="595.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Антипаралельний стан (AP): R_AP (Високий опір)</text>
<rect x="430.0" y="100.0" width="100.0" height="180.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Фіксований шар</tspan><tspan x="480.0" dy="11.7">CoFeB (Pinned)</tspan><tspan x="480.0" dy="11.7">Magnetization ↑</tspan><tspan x="480.0" dy="11.7">DOS: N_up &gt;&gt; N_dn</tspan></text>
<rect x="540.0" y="100.0" width="40.0" height="180.0" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/><text x="560.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Бар'єр</tspan><tspan x="560.0" dy="11.7">MgO</tspan><tspan x="560.0" dy="11.7">(~1 нм)</tspan></text>
<rect x="590.0" y="100.0" width="100.0" height="180.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Вільний шар</tspan><tspan x="640.0" dy="11.7">CoFeB (Free)</tspan><tspan x="640.0" dy="11.7">Magnetization ↓</tspan><tspan x="640.0" dy="11.7">DOS: N_dn &gt;&gt; N_up</tspan></text>
<line x1="530.0" y1="140.0" x2="590.0" y2="140.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="560.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мало станів ↑</text>
<line x1="530.0" y1="220.0" x2="590.0" y2="220.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="560.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мало станів ↓</text>
<rect x="430.0" y="300.0" width="330.0" height="95.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Спіново-поляризований потік не знаходить станів відповідної орієнтації.</tspan><tspan x="595.0" dy="11.7">Провідність низька → Опір R_AP = R_max</tspan><tspan x="595.0" dy="11.7">Формула Julliere: TMR = (R_AP - R_P) / R_P &gt; 200%</tspan><tspan x="595.0" dy="11.7">Логічний стан: «1»</tspan></text>
</svg>