<text x="200.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">(поляризація)</text>
<line x1="450.0" y1="125.0" x2="400.0" y2="100.0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
