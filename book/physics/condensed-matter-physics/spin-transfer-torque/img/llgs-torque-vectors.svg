<ellipse cx="340.0" cy="140.0" rx="130.0" ry="40.0" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="340.0" y1="230.0" x2="450.0" y2="125.0" stroke="#b91c1c" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="462.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="700" font-style="italic">m</text>
<line x1="240.0" y1="230.0" x2="240.0" y2="110.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
