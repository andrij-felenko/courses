<text x="365.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700" font-style="italic">T_damp (загасання)</text>
<line x1="450.0" y1="125.0" x2="500.0" y2="85.0" stroke="#16a34a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="510.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700" font-style="italic">T_STT (Слончевський)</text>
<rect x="550.0" y="70.0" width="190.0" height="280.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="645.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівняння ЛЛҐС</text>
<text x="565.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">dm/dt =</text>
<text x="565.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="700">-γ₀ (m × H_eff)</text>
<text x="565.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(прецесія)</text>
<text x="565.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">+ α (m × dm/dt)</text>
<text x="565.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(дисипація Ґільберта)</text>
<text x="565.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">- γ₀ a_J [m × (m × p)]</text>
<text x="565.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(момент Слончевського)</text>
<text x="565.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">- γ₀ b_J (m × p)</text>
<text x="565.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">(польовий момент)</text>
<text x="380.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">При T_STT &gt; T_damp виникає антизагасання, що веде до перемикання або автоколивань</text>
</svg>