<rect x="489.4" y="327.0" width="176.2" height="32.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="577.5" y="347.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="577.5" dy="0.0">Стан P: R_P (Низький)</tspan></text>
<text x="390.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Полярність електричного струму визначає напрямок перемикання між станами R_P та R_AP</text>
