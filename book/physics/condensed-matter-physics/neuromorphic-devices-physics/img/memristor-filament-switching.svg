<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика резистивного переключення у OxRAM (ReRAM)</text>
<rect x="30.0" y="55.0" width="350.0" height="345.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="205.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Стан LRS (SET): Низький опір (Вмикання)</text>
<rect x="50.0" y="105.0" width="310.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Верхній електрод (TE: TiN / Pt) — Напруга V &gt; 0</tspan></text>
<rect x="50.0" y="245.0" width="310.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="205.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Нижній електрод (BE: TiN / Pt) — Заземлення (GND)</tspan></text>
<rect x="50.0" y="140.0" width="310.0" height="105.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.0"/>
<text x="80.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="start">Оксидна матриця HfO₂ / TiO₂</text>
<rect x="185.0" y="140.0" width="40.0" height="105.0" rx="2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="205.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Нитка V_O</text>
<rect x="50.0" y="290.0" width="310.0" height="95.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">1. Електричне поле розриває зв'язки Hf-O.</tspan><tspan x="205.0" dy="11.7">2. Іони O²⁻ мігрують до TE, залишаючи вакансії V_Oⁿ⁺.</tspan><tspan x="205.0" dy="11.7">3. Сформовано суцільний місток → металевий/омічний опір R_SET.</tspan></text>
<rect x="420.0" y="55.0" width="350.0" height="345.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="2.0"/>
<text x="595.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Стан HRS (RESET): Високий опір (Вимкнення)</text>
<rect x="440.0" y="105.0" width="310.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Верхній електрод (TE) — Зворотна напруга V &lt; 0</tspan></text>
<rect x="440.0" y="245.0" width="310.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="595.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Нижній електрод (BE) — Заземлення (GND)</tspan></text>
<rect x="440.0" y="140.0" width="310.0" height="105.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.0"/>
<text x="470.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="start">Оксидна матриця HfO₂</text>
<rect x="575.0" y="175.0" width="40.0" height="70.0" rx="2" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
<rect x="575.0" y="140.0" width="40.0" height="35.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
<text x="595.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">Зазор Δx</text>
<text x="595.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Залишок</text>
<rect x="440.0" y="290.0" width="310.0" height="95.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">1. Джоулів нагрів розігріває локальну область нитки.</tspan><tspan x="595.0" dy="11.7">2. Іони O²⁻ повертаються з TE і рекомбінують з вакансіями.</tspan><tspan x="595.0" dy="11.7">3. Виникає тунельний діелектричний зазор → опір R_RESET.</tspan></text>
</svg>