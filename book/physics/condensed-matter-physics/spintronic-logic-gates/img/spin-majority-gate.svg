<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спіновий мажоритарний логічний елемент (Majority Gate) для AND/OR</text>
<rect x="30.0" y="50.0" width="400.0" height="310.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="230.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наномагнітна мажоритарна комірка</text>
<rect x="70.0" y="110.0" width="70.0" height="50.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="105.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Вхід A</text>
<line x1="105.0" y1="150.0" x2="105.0" y2="118.0" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="105.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">M_A</text>
<rect x="70.0" y="250.0" width="70.0" height="50.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="105.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">Вхід B</text>
<line x1="105.0" y1="290.0" x2="105.0" y2="258.0" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="105.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">M_B</text>
<rect x="70.0" y="180.0" width="70.0" height="50.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<text x="105.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Вхід C</text>
<text x="105.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">(Керування)</text>
<path d="M 140 135 L 220 190" fill="none" stroke="#94a3b8" stroke-width="2.0" stroke-dasharray="3,3"/>
<path d="M 140 205 L 220 205" fill="none" stroke="#d97706" stroke-width="2.0" stroke-dasharray="3,3"/>
<path d="M 140 275 L 220 220" fill="none" stroke="#94a3b8" stroke-width="2.0" stroke-dasharray="3,3"/>
<circle cx="240.0" cy="205.0" r="30.0" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.0"/>
<text x="240.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="700">Вузол</text>
<text x="240.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle">сумування</text>
<line x1="270.0" y1="205.0" x2="320.0" y2="205.0" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="288.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="700">M_net</text>
<rect x="300.0" y="180.0" width="105.0" height="50.0" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="352.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Вихід Y</text>
<text x="352.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Maj(A,B,C)</text>
<text x="230.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Магнітне дипольне зчеплення або спіновий струм</text>
<rect x="460.0" y="50.0" width="290.0" height="310.0" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="605.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Логічна функція та режим</text>
<rect x="475.0" y="95.0" width="260.0" height="45.0" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1.0"/>
<text x="605.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Y = A·B + B·C + A·C</text>
<text x="605.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Мажоритарна більшість від 3 входів)</text>
<rect x="475.0" y="155.0" width="260.0" height="80.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="605.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Режим AND (Вентиль І):</text>
<text x="605.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Вхід C = 0 (намагніченість ↓)</text>
<text x="605.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Y = A·B + B·0 + A·0 = A · B</text>
<rect x="475.0" y="245.0" width="260.0" height="80.0" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="605.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Режим OR (Вентиль АБО):</text>
<text x="605.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Вхід C = 1 (намагніченість ↑)</text>
<text x="605.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Y = A·B + B·1 + A·1 = A + B</text>
<text x="605.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Програмування вентиля зміною сигналу C</text>
<text x="390.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Один спіновий елемент виконує реконфігуровні логічні операції AND/OR без перебудови структури</text>
</svg>