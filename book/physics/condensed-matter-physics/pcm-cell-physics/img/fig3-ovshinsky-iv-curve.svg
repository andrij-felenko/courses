<line x1="550.0" y1="330.0" x2="550.0" y2="360.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="550.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_th</text>
<text x="585.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Порогова точка (V_th, I_th)</text>
