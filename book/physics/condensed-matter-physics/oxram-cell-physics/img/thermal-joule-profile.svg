<text x="430.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="700">T_max = √( T_0² + V² / (4 · L_W) ),  де L_W = 2.44·10⁻⁸ Вт·Ом/К² (число Відемана — Франца)</text>
