<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоканальна модель Мотта для паралельного та антипаралельного станів</text>
<rect x="25.0" y="55.0" width="370.0" height="340.0" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="210.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Паралельний стан (FM1 ↑ / FM2 ↑)</text>
<text x="210.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Низький опір: R_P (Коротке замикання каналу спін-вгору)</text>
<rect x="55.0" y="125.0" width="90.0" height="160.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="100.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">FM 1</text>
<line x1="100.0" y1="245.0" x2="100.0" y2="170.0" stroke="#1d4ed8" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="100.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">M₁ ↑</text>
<rect x="165.0" y="125.0" width="70.0" height="160.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="200.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">NM (Cu)</text>
<rect x="255.0" y="125.0" width="90.0" height="160.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="300.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">FM 2</text>
<line x1="300.0" y1="245.0" x2="300.0" y2="170.0" stroke="#1d4ed8" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="300.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">M₂ ↑</text>
<path d="M 40 165 L 360 165" fill="none" stroke="#15803d" stroke-width="3.5"/>
<circle cx="75.0" cy="165.0" r="5.0" fill="#15803d" stroke="none" stroke-width="1.5"/>
<circle cx="315.0" cy="165.0" r="5.0" fill="#15803d" stroke="none" stroke-width="1.5"/>
<text x="200.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Канал спін-↑ (мале розсіювання r_↑)</text>
<path d="M 40 225 L 90 225 L 105 210 L 125 240 L 145 225 L 265 225 L 290 205 L 310 235 L 360 225" fill="none" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="3,2"/>
<text x="200.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Канал спін-↓ (сильне розсіювання r_↓)</text>
<rect x="60.0" y="305.0" width="300.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="210.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема: r_↑ || r_↓</text>
<text x="210.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">R_P = (r_↑ · r_↓) / (r_↑ + r_↓) ≈ r_↑</text>
<rect x="425.0" y="55.0" width="370.0" height="340.0" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
<text x="610.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#be123c" text-anchor="middle" font-weight="700">Антипаралельний стан (FM1 ↑ / FM2 ↓)</text>
<text x="610.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9f1239" text-anchor="middle" font-weight="700">Високий опір: R_AP (Обидва канали розсіюються)</text>
<rect x="455.0" y="125.0" width="90.0" height="160.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="500.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">FM 1</text>
<line x1="500.0" y1="245.0" x2="500.0" y2="170.0" stroke="#1d4ed8" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="500.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">M₁ ↑</text>
<rect x="565.0" y="125.0" width="70.0" height="160.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="600.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">NM (Cu)</text>
<rect x="655.0" y="125.0" width="90.0" height="160.0" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
<text x="700.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">FM 2</text>
<line x1="700.0" y1="170.0" x2="700.0" y2="245.0" stroke="#c2410c" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="700.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">M₂ ↓</text>
<path d="M 440 165 L 655 165 L 680 145 L 700 180 L 760 165" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,2"/>
<text x="600.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Спін-↑: r_↑ у FM1, але r_↓ у FM2</text>
<path d="M 440 225 L 490 225 L 505 210 L 525 240 L 545 225 L 760 225" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,2"/>
<text x="600.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Спін-↓: r_↓ у FM1, але r_↑ у FM2</text>
<rect x="460.0" y="305.0" width="300.0" height="75.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="610.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема: (r_↑ + r_↓) || (r_↓ + r_↑)</text>
<text x="610.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#be123c" text-anchor="middle" font-weight="700">R_AP = (r_↑ + r_↓) / 2 &gt; R_P</text>
<text x="410.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Різниця між R_AP та R_P визначає величину ефекту гігантського магнітоопору (GMR)</text>
</svg>