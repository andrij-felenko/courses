<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 854.67 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="854.67" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залежність енергії від розміру частинки та критичний радіус R_c</text>
<line x1="100.0" y1="290.0" x2="750.0" y2="290.0" stroke="#333333" stroke-width="1.5"/>
<line x1="740.0" y1="290.0" x2="760.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="775.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Радіус частинки R</text>
<line x1="100.0" y1="290.0" x2="100.0" y2="60.0" stroke="#333333" stroke-width="1.5"/>
<line x1="100.0" y1="70.0" x2="100.0" y2="50.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="85.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергія E</text>
<path d="M 100,290 Q 300,270 550,70" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="450.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">E1 ∝ R³ (однодоменний стан, Ed)</text>
<path d="M 100,230 Q 350,200 700,120" fill="none" stroke="#2457d6" stroke-width="2.5"/>
<text x="715.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">E2 ∝ R² + E'd (дводоменний стан)</text>
<circle cx="420.0" cy="175.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<line x1="420.0" y1="175.0" x2="420.0" y2="290.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="420.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Критичний радіус Rc</text>
<rect x="120.0" y="80.0" width="220.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="230.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">R &lt; Rc : ОДНОДОМЕННІ ЧАСТИНИ</tspan><tspan x="230.0" dy="14.3">(Енергетично невигідно</tspan><tspan x="230.0" dy="14.3">створювати доменну стінку)</tspan></text>
<rect x="480.0" y="200.0" width="240.0" height="70.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="600.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">R &gt; Rc : БАГАТОДОМЕННІ ЧАСТИНИ</tspan><tspan x="600.0" dy="14.3">(Утворення доменів зменшує</tspan><tspan x="600.0" dy="14.3">повну вільну енергію)</tspan></text>
<rect x="145.1" y="223.5" width="269.9" height="33.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Rc ≈ 9 · √(A · K) / (μ₀ · M_s²)</tspan></text>
</svg>