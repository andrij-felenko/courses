<svg xmlns="http://www.w3.org/2000/svg" viewBox="-19.5 -10 819.5 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-19.5" y="-10" width="819.5" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл електрохімічного переключення (SET / RESET) у CBRAM</text>
<rect x="20.0" y="50.0" width="175.0" height="380.0" rx="6" fill="#fffbe6" stroke="#d97706" stroke-width="1.5"/>
<text x="107.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">1. Анодне окиснення</text>
<rect x="30.0" y="95.0" width="155.0" height="130.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="107.5" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="107.5" dy="0.0">Вхідний стан: HRS</tspan><tspan x="107.5" dy="11.7">V &gt; V_SET &gt; 0 B</tspan><tspan x="107.5" dy="11.7"></tspan><tspan x="107.5" dy="11.7">Ag → Ag⁺ + e⁻</tspan><tspan x="107.5" dy="11.7">(або Cu → Cu²⁺ + 2e⁻)</tspan><tspan x="107.5" dy="11.7"></tspan><tspan x="107.5" dy="11.7">Реакція за кінетикою Батлера-Фольмера.</tspan></text>
<circle cx="107.0" cy="260.0" r="22.0" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<text x="107.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Ag⁺</text>
<line x1="107.0" y1="285.0" x2="107.0" y2="320.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="340.0" width="155.0" height="75.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="107.5" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="107.5" dy="0.0">Інжекція катіонів у твердий електроліт під дією поля</tspan></text>
<rect x="210.0" y="50.0" width="175.0" height="380.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="297.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">2. Міграція та ріст</text>
<rect x="220.0" y="95.0" width="155.0" height="130.0" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/><text x="297.5" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Поле E ≈ 10⁶ В/см</tspan><tspan x="297.5" dy="11.7">Дрейф Мотта-Герні</tspan><tspan x="297.5" dy="11.7"></tspan><tspan x="297.5" dy="11.7">Катодне відновлення:</tspan><tspan x="297.5" dy="11.7">Ag⁺ + e⁻ → Ag⁰</tspan><tspan x="297.5" dy="11.7"></tspan><tspan x="297.5" dy="11.7">Ріст містка від катода до анода!</tspan></text>
<rect x="272.0" y="240.0" width="50.0" height="80.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
<line x1="297.0" y1="320.0" x2="297.0" y2="260.0" stroke="#d97706" stroke-width="6.0"/>
<line x1="297.0" y1="270.0" x2="297.0" y2="245.0" stroke="#0369a1" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.0" y="340.0" width="155.0" height="75.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/><text x="297.5" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="297.5" dy="0.0">Утворення та ріст металевого наноконуса</tspan></text>
<rect x="400.0" y="50.0" width="175.0" height="380.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="487.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#047857" text-anchor="middle" font-weight="700">3. Замикання (SET)</text>
<rect x="410.0" y="95.0" width="155.0" height="130.0" rx="6" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/><text x="487.5" y="133.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Контакт з анодом!</tspan><tspan x="487.5" dy="11.7">Перехід HRS → LRS</tspan><tspan x="487.5" dy="11.7"></tspan><tspan x="487.5" dy="11.7">Струм обмежується комплайєнсом I_CC.</tspan><tspan x="487.5" dy="11.7"></tspan><tspan x="487.5" dy="11.7">Формування атомарного звуження.</tspan></text>
<line x1="487.0" y1="320.0" x2="487.0" y2="230.0" stroke="#d97706" stroke-width="7.0"/>
<circle cx="487.0" cy="230.0" r="5.0" fill="#047857" stroke="#065f46" stroke-width="1.5"/>
<rect x="410.0" y="340.0" width="155.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="487.5" y="374.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="487.5" dy="0.0">Стан LRS (ON)</tspan><tspan x="487.5" dy="13.0">Провідність G = n · G₀</tspan></text>
<rect x="590.0" y="50.0" width="190.0" height="380.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="685.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">4. Розрив (RESET)</text>
<rect x="600.0" y="95.0" width="170.0" height="130.0" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/><text x="685.0" y="133.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Зворотне поле V &lt; 0 B</tspan><tspan x="685.0" dy="11.7">V &lt; V_RESET</tspan><tspan x="685.0" dy="11.7"></tspan><tspan x="685.0" dy="11.7">Джоулів нагрів I²R локалізований у звуженні.</tspan><tspan x="685.0" dy="11.7"></tspan><tspan x="685.0" dy="11.7">Термічне + електрохімічне розчинення.</tspan></text>
<line x1="685.0" y1="320.0" x2="685.0" y2="260.0" stroke="#d97706" stroke-width="6.0"/>
<circle cx="685.0" cy="250.0" r="8.0" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<rect x="600.0" y="340.0" width="170.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Локальне теплове плавлення та розрив містка</tspan></text>
</svg>