<line x1="625.0" y1="235.0" x2="625.0" y2="190.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="625.0" y1="205.0" x2="625.0" y2="250.0" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="629.1" y="202.3" width="91.8" height="35.3" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><text x="675.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Щілина Мотта</tspan><tspan x="675.0" dy="14.3">E_g ≈ U - W</tspan></text>
<rect x="468.4" y="332.4" width="223.2" height="35.3" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/><text x="580.0" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle"><tspan x="580.0" dy="0.0">Розщеплення на дві зони → Ізолятор</tspan><tspan x="580.0" dy="14.3">(заборонена зона E_g &gt; 0)</tspan></text>
<text x="390.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Сильна електронна кореляція U розщеплює зонний спектр та утворює диелектричний стан Мотта</text>
</svg>