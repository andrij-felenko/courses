<path d="M 75 225 Q 205 225 75 155.0 Z" fill="#e2e8f0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="65.0" y1="225.0" x2="235.0" y2="225.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="5,3"/>
<text x="260.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">E_F (Рівень Фермі)</text>
<text x="175.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Ширина зони W = 2z·t</text>
<rect x="110.4" y="332.4" width="179.3" height="35.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="200.0" dy="0.0">Напівзаповнена зона → Метал</tspan><tspan x="200.0" dy="14.3">(безперервний спектр)</tspan></text>
<rect x="405.0" y="55.0" width="350.0" height="320.0" rx="6" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="700">Модель Габбарда (U &gt; W, Моттівський ізолятор)</text>
<line x1="455.0" y1="335.0" x2="455.0" y2="115.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">E</text>
