<rect x="495.0" y="80.0" width="240.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Пролітні частинки</tspan><tspan x="615.0" dy="14.3">v_|| &gt; v_⊥ · (2ε)^1/2</tspan><tspan x="615.0" dy="14.3">Обігають весь тороїд</tspan><tspan x="615.0" dy="14.3">уздовж силових ліній.</tspan></text>
<rect x="495.0" y="170.0" width="240.0" height="110.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="615.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Заперті частинки</tspan><tspan x="615.0" dy="14.3">v_|| / v_⊥ &lt; (2ε)^1/2</tspan><tspan x="615.0" dy="14.3">Захоплюються магнітним</tspan><tspan x="615.0" dy="14.3">дзеркалом у сильному полі</tspan><tspan x="615.0" dy="14.3">й здійснюють бананні орбіти.</tspan></text>
<rect x="495.0" y="300.0" width="240.0" height="90.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="615.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Ширина банана Δr_b:</tspan><tspan x="615.0" dy="14.3">Δr_b ≈ (q · ρ_p) / √ε</tspan><tspan x="615.0" dy="14.3">Визначає неокласичний</tspan><tspan x="615.0" dy="14.3">перенос тепла й частинок.</tspan></text>
