<text x="420.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внесок кварків до β₀:</text>
<text x="420.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">Δβ₀(кварки) = - (2/3) · n_f</text>
