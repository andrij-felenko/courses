<text x="237.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_read &gt; V_c</text>
<rect x="84.6" y="260.2" width="245.7" height="59.6" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/><text x="207.5" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle"><tspan x="207.5" dy="0.0">РУЙНІВНЕ ЗЧИТАННЯ (Destructive Read)</tspan><tspan x="207.5" dy="14.3">Переполяризація генерує струм зсуву.</tspan><tspan x="207.5" dy="14.3">Вимагає обов'язкового перезапису!</tspan></text>
