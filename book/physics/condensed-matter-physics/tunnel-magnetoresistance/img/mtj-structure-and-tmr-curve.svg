<text x="710.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Паралельний стан (↑ ↑)</text>
<line x1="505.0" y1="160.0" x2="790.0" y2="160.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="488.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="end" font-weight="700">R_AP</text>
<text x="575.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Антипаралельний стан (↑ ↓)</text>
<path d="M 515 160 L 700 160 L 700 310 L 790 310" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 790 310 L 580 310 L 580 160 L 515 160" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<line x1="760.0" y1="310.0" x2="760.0" y2="160.0" stroke="#166534" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="760.0" y1="160.0" x2="760.0" y2="310.0" stroke="#166534" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="755.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="end" font-weight="700">ΔR = R_AP - R_P</text>
<text x="420.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Синтетичний антиферомагнетик (SAF) заклинює опорний шар, забезпечуючи чітке перемикання опору</text>
