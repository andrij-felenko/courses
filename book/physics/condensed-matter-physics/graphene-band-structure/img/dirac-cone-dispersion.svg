<line x1="80.0" y1="240.0" x2="450.0" y2="240.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="465.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">q_x</text>
<polygon points="130,100 260,240 390,100" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
