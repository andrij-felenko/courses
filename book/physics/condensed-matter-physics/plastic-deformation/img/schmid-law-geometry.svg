<svg xmlns="http://www.w3.org/2000/svg" viewBox="-111.02 -10 894.62 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-111.02" y="-10" width="894.62" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="115.0" y="90.0" width="90.0" height="260.0" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="160.0" y1="90.0" x2="160.0" y2="25.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="175.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Сила F (осьовий розтяг)</text>
<line x1="160.0" y1="350.0" x2="160.0" y2="415.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="175.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Сила F</text>
<line x1="160.0" y1="20.0" x2="160.0" y2="420.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="145.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Осьовий напрямок n</text>
<ellipse cx="160" cy="220" rx="50.0" ry="25" transform="rotate(-35 160 220)" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<line x1="160.0" y1="220.0" x2="233.7" y2="168.4" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="221.7" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">Нормаль n_s</text>
<text x="178.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Кут φ</text>
<line x1="160.0" y1="220.0" x2="229.6" y2="171.2" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="244.6" y="166.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Напрямок s</text>
<text x="198.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Кут λ</text>
<text x="95.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Площина ковзання A_s = A₀ / cos φ</text>
<line x1="100.0" y1="255.0" x2="145.0" y2="225.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="386.5" y="140.8" width="387.1" height="138.4" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="580.0" y="163.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Формула розрахованого зсувного напруження:</tspan><tspan x="580.0" dy="16.9"></tspan><tspan x="580.0" dy="16.9">τ = (F_s) / A_s = (F · cos λ) / (A₀ / cos φ)</tspan><tspan x="580.0" dy="16.9"></tspan><tspan x="580.0" dy="16.9">τ = σ · cos φ · cos λ = σ · m</tspan><tspan x="580.0" dy="16.9"></tspan><tspan x="580.0" dy="16.9">де m = cos φ · cos λ — фактор Шміда (0 ≤ m ≤ 0.5)</tspan></text>
<rect x="412.7" y="315.0" width="334.6" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Умова початку плинності (Критичне напруження):</tspan><tspan x="580.0" dy="15.6"></tspan><tspan x="580.0" dy="15.6">τ_max = τ_crss   ⇒   σ_y = (τ_crss) / m_max</tspan><tspan x="580.0" dy="15.6"></tspan><tspan x="580.0" dy="15.6">Максимальне значення m = 0.5 при φ = λ = 45°:</tspan><tspan x="580.0" dy="15.6">Мінімальна границя плинності σ_y = 2 · τ_crss</tspan></text>
</svg>