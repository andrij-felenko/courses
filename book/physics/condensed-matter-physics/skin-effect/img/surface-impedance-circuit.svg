<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поверхневий імпеданс провідника Z_s = R_s + i · X_s</text>
<rect x="20.0" y="45.0" width="360.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еквівалентна схема скін-шару</text>
<line x1="40.0" y1="180.0" x2="110.0" y2="180.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="75.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Поле E_s</text>
<rect x="110.0" y="130.0" width="180.0" height="100.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2.0"/>
<text x="200.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Z_s = R_s + i · X_s</text>
<rect x="130.0" y="180.0" width="50.0" height="30.0" rx="6" fill="#dbeafe" stroke="#c0392b" stroke-width="1.5"/>
<text x="155.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_s</text>
<text x="195.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<circle cx="225.0" cy="195.0" r="12.0" fill="#fee2e2" stroke="#2457d6" stroke-width="1.5"/>
<text x="225.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">X_s</text>
<text x="200.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_s = 1 / (σ · δ)</text>
<text x="200.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">X_s = ω · L_s = 1 / (σ · δ)</text>
<text x="200.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Активні втрати = Реактивна енергія</text>
<text x="200.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">(Рівність активного й індуктивного опорів)</text>
<rect x="400.0" y="45.0" width="360.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фазове співвідношення полів (45°)</text>
<line x1="440.0" y1="230.0" x2="700.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520.0" y1="310.0" x2="520.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Re</text>
<text x="502.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Im</text>
<line x1="520.0" y1="230.0" x2="630.0" y2="230.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="575.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">R_s</text>
<line x1="630.0" y1="230.0" x2="630.0" y2="120.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">i · X_s</text>
<line x1="520.0" y1="230.0" x2="630.0" y2="120.0" stroke="#8b5cf6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="540.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8b5cf6" text-anchor="start" font-weight="700">Z_s = R_s · √2 e^(i π/4)</text>
<path d="M 560 230 A 40 40 0 0 0 548 202" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="570.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle" font-weight="700">φ = 45° (π/4)</text>
<text x="580.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">Струм запізнюється відносно напруженості</text>
<text x="580.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">електричного поля точно на 45° (π/4)</text>
</svg>