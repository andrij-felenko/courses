<rect x="455.0" y="90.0" width="285.0" height="290.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="437.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">δ</text>
