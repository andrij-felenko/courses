<line x1="428.0" y1="360.0" x2="680.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="428.0" y1="354.0" x2="428.0" y2="366.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="680.0" y1="354.0" x2="680.0" y2="366.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="554.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Довжина пробігу l ≫ δ (до 10⁻⁴ м)</text>
<text x="642.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="642.0" dy="0.0">Нелокальний зв'язок:</tspan><tspan x="642.0" dy="13.0">j(r) = ∫ K(r,r') E(r') dr'</tspan><tspan x="642.0" dy="13.0">Низькі T (4.2 K), ВЧ (ВЧ/СВЧ)</tspan><tspan x="642.0" dy="13.0">Опір R_s ∝ f^(2/3) (не залежить від σ)</tspan></text>
</svg>