<text x="420.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Вибір орієнтації затравки визначає швидкість нарощування та акустичні втрати (-OH дефекти)</text>
