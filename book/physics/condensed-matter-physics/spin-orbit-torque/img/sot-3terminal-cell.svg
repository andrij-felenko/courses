<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння схемотехніки STT-MRAM (2T) та SOT-MRAM (3T)</text>
<rect x="20.0" y="55.0" width="380.0" height="360.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="210.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Двотермінальна STT-MRAM комірка</text>
<rect x="150.0" y="135.0" width="120.0" height="30.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<text x="210.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Pinned Layer</text>
<rect x="150.0" y="165.0" width="120.0" height="20.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
<text x="210.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700">Tunnel Barrier MgO</text>
<rect x="150.0" y="185.0" width="120.0" height="30.0" rx="6" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="210.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700">Free Layer</text>
<line x1="210.0" y1="105.0" x2="210.0" y2="230.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="280.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Запис I_write</text>
<text x="280.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start">(Високий струм!)</text>
<line x1="210.0" y1="230.0" x2="210.0" y2="295.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700">Зчитування I_read</text>
<rect x="35.0" y="330.0" width="350.0" height="70.0" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
<text x="45.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9f1239" text-anchor="start" font-weight="700">Проблеми STT:</text>
<text x="45.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#881337" text-anchor="start">• Струм запису зношує бар'єр MgO (деградація)</text>
<text x="45.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#881337" text-anchor="start">• Конфлікт між швидкістю та надійністю read/write</text>
<rect x="420.0" y="55.0" width="380.0" height="360.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="610.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Тритермінальна SOT-MRAM комірка</text>
<rect x="550.0" y="125.0" width="120.0" height="25.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<text x="610.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Pinned Layer</text>
<rect x="550.0" y="150.0" width="120.0" height="15.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
<text x="610.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700">Barrier MgO</text>
<rect x="550.0" y="165.0" width="120.0" height="25.0" rx="6" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="610.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700">Free Layer</text>
<rect x="460.0" y="190.0" width="300.0" height="25.0" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
<text x="610.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">HM Шлях (Pt / W / Ta)</text>
<circle cx="470.0" cy="202.0" r="6.0" fill="#ea580c" stroke="none" stroke-width="1.5"/>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">T1 (Write 1)</text>
<circle cx="750.0" cy="202.0" r="6.0" fill="#ea580c" stroke="none" stroke-width="1.5"/>
<text x="750.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">T2 (Write 2)</text>
<circle cx="690.0" cy="125.0" r="6.0" fill="#2563eb" stroke="none" stroke-width="1.5"/>
<text x="690.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700">T3 (Read)</text>
<line x1="485.0" y1="202.0" x2="735.0" y2="202.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="610.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">I_write (не проходить через MgO!)</text>
<line x1="690.0" y1="125.0" x2="690.0" y2="202.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="435.0" y="330.0" width="350.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="445.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="start" font-weight="700">Переваги SOT:</text>
<text x="445.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="start">• Розділені канали: MgO захищений від руйнування</text>
<text x="445.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="start">• Запис &lt; 1 нс, ресурсоємність &gt; 10¹⁵ циклів</text>
<text x="410.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Розділення шляхів читання і запису вирішує фундаментальну проблему надійності MRAM</text>
</svg>