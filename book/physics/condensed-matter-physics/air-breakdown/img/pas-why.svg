<text x="450.0" y="438.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#8a6a14" text-anchor="middle" font-weight="normal" font-style="normal">для повітря ≈ 330 В  (нижче за цю напругу суцільне повітря не пробити жодним зазором)</text>
