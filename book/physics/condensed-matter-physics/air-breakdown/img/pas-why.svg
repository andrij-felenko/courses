<text x="264.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">до анода, не вдаривши нікого:</text>
<text x="264.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">лавини нема → потрібна ВИЩА U</text>
