<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причини відхилень від правила Матіссена (DMR)</text>
<rect x="30.0" y="75.0" width="195.0" height="290.0" rx="6" fill="#fcf3cf" stroke="#f39c12" stroke-width="2.0"/>
<text x="127.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">1. Анізотропія</text>
<text x="127.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">поверхні Фермі</text>
<line x1="45.0" y1="135.0" x2="210.0" y2="135.0" stroke="#f39c12" stroke-width="1.0"/>
<text x="42.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Різні ділянки к-простору</text>
<text x="42.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  мають різну кутову</text>
<text x="42.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  інтенсивність розсіяння</text>
<text x="42.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Фонони й домішки</text>
<text x="42.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  перерозподіляють</text>
<text x="42.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  функцію розподілу</text>
<text x="42.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Варіаційний принцип</text>
<text x="42.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">Колера: Δρ &gt; 0</text>
<rect x="242.0" y="75.0" width="195.0" height="290.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="2.0"/>
<text x="339.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#117864" text-anchor="middle" font-weight="700">2. Двозонна</text>
<text x="339.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#117864" text-anchor="middle" font-weight="700">провідність</text>
<line x1="257.0" y1="135.0" x2="422.0" y2="135.0" stroke="#16a085" stroke-width="1.0"/>
<text x="254.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Паралельні канали:</text>
<text x="254.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  s-зоні та d-зоні металу</text>
<text x="254.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Додаються провідності</text>
<text x="254.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  σ = σ_s + σ_d , а не</text>
<text x="254.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  питомі опори ρ!</text>
<text x="254.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Формула Зондгаймера:</text>
<text x="254.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#117864" text-anchor="start" font-weight="700">ρ = ρ₁ ρ₂ / (ρ₁ + ρ₂)</text>
<text x="254.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">порушує адитивність</text>
<rect x="454.0" y="75.0" width="195.0" height="290.0" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="2.0"/>
<text x="551.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Інтерференція</text>
<text x="551.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">(Каган–Жернов)</text>
<line x1="469.0" y1="135.0" x2="634.0" y2="135.0" stroke="#e74c3c" stroke-width="1.0"/>
<text x="466.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Електрон-фонон-домішкове</text>
<text x="466.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  зв'язування</text>
<text x="466.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Важкі домішки змінюють</text>
<text x="466.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  коливальний спектр</text>
<text x="466.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  (квазілокальні моди)</text>
<text x="466.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Температурний член:</text>
<text x="466.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Δρ(T, c) ∝ c · T⁵</text>
<text x="466.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-style="italic">неадитивний внесок</text>
</svg>