<text x="380.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Інжектований спіновий струм спричиняє локальне поглинання або виділення тепла ΔQ = T S_S J_s</text>
