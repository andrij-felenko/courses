<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електростатичне поле гомопереходу vs Квазіелектричні поля гетероструктури</text>
<rect x="15.0" y="55.0" width="380.0" height="335.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="205.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Гомоперехід (однаковий напівпровідник)</text>
<text x="205.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Поле F(z) єдине для обох типів носіїв</text>
<path d="M 35 145 C 120 145, 150 225, 240 225 L 375 225" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<path d="M 35 245 C 120 245, 150 325, 240 325 L 375 325" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="50.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">E_c(z)</text>
<text x="50.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">E_v(z)</text>
<line x1="170.0" y1="185.0" x2="110.0" y2="185.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="140.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">F_e = -q·F</text>
<line x1="170.0" y1="285.0" x2="230.0" y2="285.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="200.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">F_h = +q·F</text>
<rect x="35.0" y="335.0" width="340.0" height="42.0" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="205.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Жорсткий зв'язок: F_e = -F_h</text>
<text x="205.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Неможливо штовхати е⁻ та h⁺ в один бік</text>
<rect x="415.0" y="55.0" width="380.0" height="335.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="605.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Градний гетероперехід Крьомера</text>
<text x="605.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-style="italic">Змінна ширина Eg(z) створює квазіполя</text>
<path d="M 435 135 L 775 235" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<path d="M 435 305 L 775 305" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="450.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">E_c(z)</text>
<text x="450.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">E_v(z)</text>
<line x1="545.0" y1="185.0" x2="645.0" y2="235.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="610.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">F_e = -dE_c/dz &gt; 0</text>
<text x="595.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">F_h = dE_v/dz ≈ 0</text>
<rect x="435.0" y="335.0" width="340.0" height="42.0" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="605.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Незалежність: F_e та F_h розв'язані!</text>
<text x="605.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Електрони прискорюються без руху дірок</text>
</svg>