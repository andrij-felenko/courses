<svg xmlns="http://www.w3.org/2000/svg" viewBox="-33 -10 793 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-33" y="-10" width="793" height="370" fill="#ffffff"/>
