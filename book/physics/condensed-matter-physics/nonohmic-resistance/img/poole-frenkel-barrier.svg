<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 436.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="436.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Деформація потенціалу ловушки в сильному полі (Ефект Пуля — Френкеля)</text>
<text x="420.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Електричне поле E знижує висоту кулонівського бар'єру на ΔE = 2·√(e³·E / 4πε)</text>
<path d="M 140 120 Q 380 130 420 340 Q 460 130 700 120" stroke="#6b7280" stroke-width="1.8" fill="none" stroke-dasharray="4 4"/>
<text x="250.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Потенціал без поля (E = 0)</text>
<path d="M 140 200 Q 380 210 420 340 Q 450 160 700 100" stroke="#c0392b" stroke-width="2.5" fill="none"/>
<text x="580.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Потенціал у полі E &gt; 0</text>
<circle cx="420.0" cy="340.0" r="6.0" fill="#2457d6" stroke="#1b4f72" stroke-width="1.5"/>
<text x="420.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Іонізований центр (ловушка)</text>
<line x1="240.0" y1="120.0" x2="600.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="290.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Дно зони провідності E_c</text>
<line x1="500.0" y1="120.0" x2="500.0" y2="155.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="493.0" y1="120.0" x2="507.0" y2="120.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="493.0" y1="155.0" x2="507.0" y2="155.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="530.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ΔE = β_PF · √E</text>
<line x1="420.0" y1="320.0" x2="480.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="495.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Термічний викид</text>
<line x1="180.0" y1="395.0" x2="660.0" y2="395.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Напрямок зовнішнього електричного поля E</text>
