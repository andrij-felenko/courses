<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Швидкість дрейфу «на серветці»: I = n·e·A·v</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за секунду крізь переріз проходить заряд цілого стовпчика електронів завдовжки v</text>
<rect x="90.0" y="150.0" width="420.0" height="90.0" rx="6" fill="#fbfbfb" stroke="#b9b3a6" stroke-width="2"/>
<line x1="390.0" y1="136.0" x2="390.0" y2="254.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="390.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">переріз A</text>
<rect x="270.0" y="150.0" width="120.0" height="90.0" rx="0" fill="#eaf2f7" stroke="#1f8a3b" stroke-width="1.6"/>
<circle cx="290.0" cy="175.0" r="6.0" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="286.7" y1="175.0" x2="293.3" y2="175.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
