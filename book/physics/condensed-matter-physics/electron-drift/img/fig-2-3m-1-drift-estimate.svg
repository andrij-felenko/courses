<line x1="321.7" y1="205.0" x2="328.3" y2="205.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="360.0" cy="180.0" r="6.0" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="356.7" y1="180.0" x2="363.3" y2="180.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="305.0" cy="215.0" r="6.0" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="301.7" y1="215.0" x2="308.3" y2="215.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="345.0" cy="170.0" r="6.0" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="341.7" y1="170.0" x2="348.3" y2="170.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="370.0" cy="210.0" r="6.0" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="366.7" y1="210.0" x2="373.3" y2="210.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="285.0" cy="202.0" r="6.0" fill="none" stroke="#1f47b5" stroke-width="1.6"/>
<line x1="281.7" y1="202.0" x2="288.3" y2="202.0" stroke="#1f47b5" stroke-width="1.6" stroke-linecap="round"/>
