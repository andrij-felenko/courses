<text x="340.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">v (дрейф)</text>
<text x="330.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">стовпчик довжини v·Δt</text>
<text x="528.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">За час Δt усі електрони</text>
<text x="528.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зсунулись на v·Δt — крізь</text>
<text x="528.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">переріз пройшов заряд</text>
<text x="528.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">усього стовпчика:</text>
<text x="528.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Q = n·(A·v·Δt)·e</text>
<text x="528.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">I = Q/Δt = n·e·A·v</text>
<rect x="70.0" y="294.0" width="680.0" height="88.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="84.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Оцінка (мідь, 1 А, дріт 1 мм²):</text>
<text x="84.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">v = I/(n·e·A) ≈ 1 / (10²⁹ · 1.6×10⁻¹⁹ · 10⁻⁶) ≈ 6×10⁻⁵ м/с</text>
<text x="84.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">≈ 0.06 мм/с — повільніше за равлика! А лампа спалахує миттєво (поле біжить, §1.2.4).</text>
</svg>
