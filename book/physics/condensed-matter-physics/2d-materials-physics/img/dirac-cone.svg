<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 711 430.92" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="711" height="430.92" fill="#ffffff"/>
