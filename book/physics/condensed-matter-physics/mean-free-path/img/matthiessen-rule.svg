<text x="500.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ρ_total(T) = ρ_res + ρ_ph(T)</text>
