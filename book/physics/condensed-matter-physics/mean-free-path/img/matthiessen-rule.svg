<text x="180.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Область Блоха — Грюнайзена (ρ ∝ T⁵)</text>
<text x="520.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Високотемпературна область (ρ ∝ T)</text>
