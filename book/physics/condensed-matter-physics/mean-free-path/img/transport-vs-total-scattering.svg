<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння малокутового та ізотропного розсіювання імпульсу</text>
<line x1="400.0" y1="45.0" x2="400.0" y2="340.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="200.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">а) Малокутове розсіювання (θ ≪ 90°)</text>
<text x="200.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Низькі T (акустичні фонони), макроскопічні дефекти</text>
<line x1="40.0" y1="200.0" x2="180.0" y2="200.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="100.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вхідний імпульс k</text>
<circle cx="180.0" cy="200.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="180.0" y1="200.0" x2="330.0" y2="160.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="270.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">k'</text>
<line x1="180.0" y1="200.0" x2="340.0" y2="200.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="240.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кут θ ≪ 1</text>
<rect x="40.0" y="250.0" width="320.0" height="75.0" rx="5" fill="#f4f6f7" stroke="#333333" stroke-width="1.0"/>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">(1 - cos θ) ≪ 1  ⟹  Втрата імпульсу мала</text>
<text x="200.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Транспортний час tau_tr ≫ tau_0</text>
<text x="600.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">б) Ізотропне розсіювання (⟨cos θ⟩ = 0)</text>
<text x="600.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Високі T, короткосяжні точкові дефекти</text>
<line x1="440.0" y1="200.0" x2="580.0" y2="200.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вхідний імпульс k</text>
<circle cx="580.0" cy="200.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="580.0" y1="200.0" x2="670.0" y2="110.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="200.0" x2="680.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="200.0" x2="680.0" y2="250.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="200.0" x2="650.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="200.0" x2="510.0" y2="260.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="250.0" width="320.0" height="75.0" rx="5" fill="#f4f6f7" stroke="#333333" stroke-width="1.0"/>
<text x="600.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">⟨cos θ⟩ = 0  ⟹  Повна втрата пам'яті</text>
<text x="600.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Транспортний час tau_tr = tau_0</text>
</svg>