<line x1="390.0" y1="380.0" x2="440.0" y2="380.0" stroke="#b9770e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">Товщина δ</text>
<rect x="464.6" y="303.1" width="270.8" height="73.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="600.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Формула BPS:</tspan><tspan x="600.0" dy="14.3">k_eff = k₀ / [ k₀ + (1 − k₀) e^(−vδ/D) ]</tspan><tspan x="600.0" dy="14.3">• v → 0 ⇒ k_eff → k₀ (макс. очищення)</tspan><tspan x="600.0" dy="14.3">• v → ∞ ⇒ k_eff → 1 (без очищення)</tspan></text>
</svg>