<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дифузійний приповерхневий шар товщиною δ у моделі Бертона — Прімма — Сліхтера</text>
