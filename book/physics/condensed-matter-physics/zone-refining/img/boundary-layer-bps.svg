<text x="160.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C_S = k₀ · C_L(0)</text>
<line x1="260.0" y1="340.0" x2="260.0" y2="150.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
