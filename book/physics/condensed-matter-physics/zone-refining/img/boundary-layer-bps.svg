<text x="230.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C_L(0)</text>
<circle cx="440.0" cy="260.0" r="5.0" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
