<text x="350.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="middle" font-weight="700">Дифузійний шар δ</text>
<rect x="440.0" y="60.0" width="320.0" height="360.0" rx="6" fill="#ebf5fb" stroke="none" stroke-width="1.5"/>
<text x="600.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b4f72" text-anchor="middle" font-weight="700">Об'єм рідкої зони (конвекція)</text>
