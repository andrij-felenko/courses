<rect x="610.0" y="200.0" width="120.0" height="35.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text x="670.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">Зона бігу (Fr &gt; 0.5)</text>
<line x1="610.0" y1="165.0" x2="610.0" y2="255.0" stroke="#d97706" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="610.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Перехід Александра: Fr ≈ 0.5</text>
<text x="620.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">При Fr &gt; 0.5 доцентрове</text>
<text x="620.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">прискорення змушує відривати</text>
<text x="620.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">стопу від поверхні</text>
<rect x="40.0" y="325.0" width="740.0" height="155.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="386.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Біомеханіка локомоції тварин та людини (закономерність Александра):</tspan><tspan x="410.0" dy="13.0">• Біомеханічне число Фруда визначається як Fr = v / √(g·L), де L — довжина кінцівки.</tspan><tspan x="410.0" dy="13.0">• При ходьбі центр мас рухається по дузі кола: відрив стопи настає, коли доцентрове прискорення v²/L дорівнює g.</tspan><tspan x="410.0" dy="13.0">• Емпіричний перехід від ходьби до бігу у ссавців, птахів та людини відбувається при досягненні Fr ≈ 0.5 (Fr² ≈ 0.25).</tspan></text>
</svg>