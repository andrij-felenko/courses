<text x="620.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехід ходьба → біг за Fr</text>
<line x1="490.0" y1="245.0" x2="750.0" y2="245.0" stroke="#475569" stroke-width="2.0"/>
<line x1="490.0" y1="239.0" x2="490.0" y2="251.0" stroke="#475569" stroke-width="1.5"/>
<text x="483.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0.0 (статика)</text>
<line x1="550.0" y1="239.0" x2="550.0" y2="251.0" stroke="#475569" stroke-width="1.5"/>
<text x="550.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0.25 (повільна)</text>
<line x1="610.0" y1="239.0" x2="610.0" y2="251.0" stroke="#475569" stroke-width="1.5"/>
<text x="610.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0.5 (критична)</text>
<line x1="730.0" y1="239.0" x2="730.0" y2="251.0" stroke="#475569" stroke-width="1.5"/>
<text x="730.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1.0 (теоретична)</text>
<rect x="490.0" y="200.0" width="120.0" height="35.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
