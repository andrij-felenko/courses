<rect x="40.0" y="305.0" width="740.0" height="150.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="363.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Механіка гідравлічного стрибка у відкритому каналі:</tspan><tspan x="410.0" dy="13.7">• Гідравлічний стрибок — це нелінійний перехід від надкритичного потоку (Fr₁ &gt; 1) до докритичного (Fr₂ &lt; 1).</tspan><tspan x="410.0" dy="13.7">• Кільцевий вихровий вал інтенсивно дисипує кінетичну енергію потоку у тепло та турбулентний шум.</tspan><tspan x="410.0" dy="13.7">• Спряжені глибини h₁ та h₂ однозначно визначаються вхідним числом Фруда Fr₁ згідно з рівнянням збереження імпульсу.</tspan></text>
