<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві теореми Нетер: збереження проти тотожності</text>
<line x1="470.0" y1="48.0" x2="470.0" y2="350.0" stroke="#d6dde6" stroke-width="1.4" stroke-dasharray="5,6"/>
<rect x="60.0" y="46.0" width="380.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Перша теорема</tspan></text>
<rect x="60.0" y="96.0" width="380.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="250.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Глобальна (скінченна) симетрія</tspan><tspan x="250.0" dy="16.9">один параметр на всю систему</tspan><tspan x="250.0" dy="16.9">напр. зсув у часі — однаковий усюди</tspan></text>
<line x1="250.0" y1="188.0" x2="250.0" y2="226.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="232.0" width="380.0" height="84.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Збережена ВЕЛИЧИНА</tspan><tspan x="250.0" dy="16.9">dQ/dt = 0</tspan><tspan x="250.0" dy="16.9">енергія · імпульс · момент</tspan></text>
<rect x="500.0" y="46.0" width="380.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="690.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Друга теорема</tspan></text>
<rect x="500.0" y="96.0" width="380.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="690.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Локальна (калібрувальна) симетрія</tspan><tspan x="690.0" dy="16.9">довільна функція в кожній точці</tspan><tspan x="690.0" dy="16.9">напр. свобода координат у ЗТВ</tspan></text>
<line x1="690.0" y1="188.0" x2="690.0" y2="226.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="500.0" y="232.0" width="380.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="690.0" y="261.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">ТОТОЖНІСТЬ між рівняннями</tspan><tspan x="690.0" dy="16.9">0 = 0</tspan><tspan x="690.0" dy="16.9">не нова величина, а залежність</tspan></text>
<rect x="60.0" y="352.0" width="820.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="470.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Саме друга теорема пояснила загадку ЗТВ: там збереження енергії «вироджується»</tspan><tspan x="470.0" dy="16.9">в тотожність 0 = 0 — це підпис локальної симетрії простору-часу, а не зникнення енергії.</tspan></text>
</svg>