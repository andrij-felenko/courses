<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="472" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="472.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Постріл: рівна сила обом — та легша куля летить, важка гармата ледь відходить</text>
<rect x="210.0" y="158.0" width="180.0" height="84.0" rx="8" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="300.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">M = 800 кг</text>
<rect x="390.0" y="184.0" width="40.0" height="32.0" rx="4" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="460.0" cy="200.0" r="17.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="460.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">m = 4 кг</text>
<line x1="458.0" y1="142.0" x2="544.0" y2="142.0" stroke="#c0392b" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="552.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">сила на кулю</text>
<line x1="250.0" y1="142.0" x2="164.0" y2="142.0" stroke="#2457d6" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="156.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">сила на гармату</text>
<text x="355.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сили рівні</text>
<line x1="464.0" y1="262.0" x2="674.0" y2="262.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="682.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">v = 400 м/с</text>
<line x1="240.0" y1="262.0" x2="214.0" y2="262.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="208.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">V = 2 м/с</text>
<rect x="155.6" y="344.5" width="568.7" height="35.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.3"/><text x="440.0" y="367.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Рівна сила ⟹ рівна кількість руху:  m·v = M·V = 1600 кг·м/с</tspan></text>
<rect x="164.3" y="412.0" width="551.5" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="440.0" y="434.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">уперед 1600 + назад 1600 = 0 — стільки ж, скільки до пострілу</tspan></text>
</svg>