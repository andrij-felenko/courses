<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="980.0" height="600.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від Декартової хиби до Ньютонового закону</text>
<line x1="118.0" y1="70.0" x2="118.0" y2="560.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="118.0" cy="96.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1644</text>
<rect x="150.0" y="69.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.4"/><text x="550.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Рене Декарт · Франція</tspan><tspan x="550.0" dy="18.2">«Кількість руху» = маса·швидкість, без напряму. Сім правил удару — майже всі хибні.</tspan></text>
<circle cx="118.0" cy="168.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1656</text>
<rect x="150.0" y="141.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="550.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Крістіан Гюйгенс · Нідерланди</tspan><tspan x="550.0" dy="18.2">Виводить правильні правила пружного удару з відносності руху; ховає рукопис на 12 років.</tspan></text>
<circle cx="118.0" cy="240.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1668·xi</text>
<rect x="150.0" y="213.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="550.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Джон Валліс · Англія</tspan><tspan x="550.0" dy="18.2">Непружний удар через збереження кількості руху. Перший у друці — 15 листопада.</tspan></text>
<circle cx="118.0" cy="312.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1668·xii</text>
<rect x="150.0" y="285.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="550.0" y="307.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Крістофер Рен · Англія</tspan><tspan x="550.0" dy="18.2">Пружний удар + дослід із маятниками перед Королівським товариством.</tspan></text>
<circle cx="118.0" cy="384.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1669</text>
<rect x="150.0" y="357.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="550.0" y="379.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Гюйгенс — у друці</tspan><tspan x="550.0" dy="18.2">Оприлюднює пружні правила у Philosophical Transactions і Journal des Sçavans.</tspan></text>
<circle cx="118.0" cy="456.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1687</text>
<rect x="150.0" y="429.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/><text x="550.0" y="451.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Ісаак Ньютон · Англія</tspan><tspan x="550.0" dy="18.2">Зводить усе в третій закон (actio = reactio); у Схолії віддає належне трьом.</tspan></text>
<circle cx="118.0" cy="528.0" r="8.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1703</text>
<rect x="150.0" y="501.0" width="800.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="550.0" y="523.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">«De motu corporum ex percussione»</tspan><tspan x="550.0" dy="18.2">Головна праця Гюйгенса про удар виходить друком — уже посмертно.</tspan></text>
</svg>