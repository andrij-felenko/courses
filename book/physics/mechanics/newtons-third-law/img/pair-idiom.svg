<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="430.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сила пари — одне число, роздане двом тілам із протилежним знаком</text>
<rect x="280.0" y="138.0" width="84.0" height="68.0" rx="8" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="536.0" y="138.0" width="84.0" height="68.0" rx="8" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="322.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло i</text>
<text x="578.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло j</text>
<rect x="314.4" y="50.5" width="271.1" height="35.0" rx="6" fill="#fff8e6" stroke="#d98324" stroke-width="1.6"/><text x="450.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">s = k · (d₀ − r) · (dx ∕ r)</tspan></text>
<text x="450.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">одне обчислення на пару</text>
<line x1="406.0" y1="84.0" x2="322.0" y2="132.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5"/>
<line x1="494.0" y1="84.0" x2="578.0" y2="132.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 5"/>
<line x1="370.0" y1="172.0" x2="458.0" y2="172.0" stroke="#c0392b" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="414.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">F[i] += s</text>
<text x="414.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">(дія)</text>
<line x1="530.0" y1="172.0" x2="442.0" y2="172.0" stroke="#2457d6" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="486.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">F[j] −= s</text>
<text x="486.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">(протидія)</text>
<rect x="125.1" y="312.2" width="649.8" height="35.5" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="450.0" y="334.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">пара-раз: те саме s обом → ΣF = 0 за побудовою, хоч який закон і округлення</tspan></text>
<rect x="91.6" y="372.2" width="716.7" height="35.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="450.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">свій прохід на кожне тіло: реакцію лічать заново → баланс лише поки збіг тримається</tspan></text>
</svg>