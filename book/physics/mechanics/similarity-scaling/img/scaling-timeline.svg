<rect x="0.0" y="0.0" width="880.0" height="650.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один хід думки крізь три століття</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">закони знають лише відношення, не абсолютний розмір</text>
<line x1="190.0" y1="78.0" x2="190.0" y2="606.0" stroke="#6b7280" stroke-width="2.6"/>
