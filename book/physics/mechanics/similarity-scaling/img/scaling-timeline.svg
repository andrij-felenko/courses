<rect x="220.0" y="392.0" width="634.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="537.0" y="426.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Федерман · Рябушинський (Росія): незалежно виводять те саме</tspan></text>
