<rect x="220.0" y="544.0" width="634.0" height="60.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.5"/><text x="537.0" y="569.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Тейлор: вага атомної бомби з фотографій вогняної кулі —</tspan><tspan x="537.0" dy="18.2">самим розмірним аналізом</tspan></text>
