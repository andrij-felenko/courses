<text x="172.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1638</text>
<rect x="220.0" y="88.0" width="634.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="537.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Ґалілей: велетень завалиться під власною вагою —</tspan><tspan x="537.0" dy="18.2">суходільний розмір має межу</tspan></text>
<line x1="190.0" y1="194.0" x2="220.0" y2="194.0" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="190.0" cy="194.0" r="6.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="172.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1872</text>
<rect x="220.0" y="164.0" width="634.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="537.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Фруд: мала модель корабля передбачає велетня,</tspan><tspan x="537.0" dy="18.2">якщо швидкості як √(довжина)</tspan></text>
<line x1="190.0" y1="270.0" x2="220.0" y2="270.0" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="190.0" cy="270.0" r="6.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="172.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1883</text>
<rect x="220.0" y="240.0" width="634.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="537.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Рейнольдс: одне безрозмірне число вирішує —</tspan><tspan x="537.0" dy="18.2">плавна течія чи зрив у вихор</tspan></text>
