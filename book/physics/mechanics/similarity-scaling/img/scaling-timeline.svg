<rect x="220.0" y="468.0" width="634.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="537.0" y="502.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="537.0" dy="0.0">Бекінгем (США): додає лише символ π і назву — вона й прилипла</tspan></text>
<line x1="190.0" y1="574.0" x2="220.0" y2="574.0" stroke="#6b7280" stroke-width="1.6"/>
