<rect x="520.0" y="222.0" width="236.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="638.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="638.0" dy="0.0">об'єм:  L³ → 8L³</tspan><tspan x="638.0" dy="16.9">× 8  (як куб)</tspan></text>
<rect x="118.6" y="398.0" width="542.8" height="36.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.4"/><text x="390.0" y="420.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">міцність ∝ площа (×4), а вага ∝ об'єм (×8)  →  напруження ×2</tspan></text>
