<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="960" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="500.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Момент штовхає L упоперек — і той повертається, а не росте</text>
<text x="270.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вид згори (уздовж вертикалі)</text>
<ellipse cx="270.0" cy="250.0" rx="122.0" ry="122.0" fill="none" fill-opacity="1.00" stroke="#d7dbe0" stroke-width="1.3" stroke-dasharray="4 5"/>
<circle cx="270.0" cy="250.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="270.0" y1="250.0" x2="392.0" y2="250.0" stroke="#2457d6" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="331.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-style="italic">L·sinθ</text>
<line x1="392.0" y1="250.0" x2="392.0" y2="172.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="402.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">M = dL/dt</text>
<path d="M 392.0 238.0 L 380.0 238.0 L 380.0 250.0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<line x1="270.0" y1="250.0" x2="372.3" y2="183.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M 300.0 250.0 A 30 30 0 0 0 295.2 233.7" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<text x="333.4" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">dφ</text>
<path d="M 372.1 151.4 A 142.0 142.0 0 0 0 235.6 112.2" fill="none" stroke="#7d3c98" stroke-width="2.4"/><path d="M 235.6 112.2 L 244.3 105.4 L 246.4 114.2 z" fill="#7d3c98"/>
<text x="212.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#7d3c98" text-anchor="middle" font-weight="700">Ω</text>
<text x="660.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий поворот — для швидкості</text>
<ellipse cx="660.0" cy="250.0" rx="74.0" ry="74.0" fill="none" fill-opacity="1.00" stroke="#d7dbe0" stroke-width="1.3" stroke-dasharray="4 5"/>
<circle cx="660.0" cy="250.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="734.0" y1="250.0" x2="734.0" y2="180.0" stroke="#2457d6" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="744.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">v</text>
<line x1="734.0" y1="250.0" x2="676.0" y2="250.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="697.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">F</text>
<path d="M 734.0 239.0 L 723.0 239.0 L 723.0 250.0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<path d="M 751.5 259.6 A 92.0 92.0 0 0 0 697.4 166.0" fill="none" stroke="#6b7280" stroke-width="1.8"/><path d="M 697.4 166.0 L 707.3 165.9 L 704.0 173.4 z" fill="#6b7280"/>
<text x="660.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">сила F ⊥ v → v повертається,</tspan><tspan x="660.0" dy="15.6">тіло біжить колом</tspan></text>
<rect x="20.7" y="450.0" width="898.7" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="470.0" y="472.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Ω = M / (L·sinθ) = m·g·r / (J·ω)   —   нахил θ випадає; швидший спін (більше ω) → повільніша прецесія</tspan></text>
</svg>