<rect x="545.3" y="433.5" width="189.4" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="457.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">F(тиск) = Δp · πR²</tspan></text>
<rect x="150.0" y="506.0" width="620.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="534.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">рівновага півкулі:  Δp · πR² = σ · 2πR   ⟹   Δp = 2σ / R</tspan></text>
