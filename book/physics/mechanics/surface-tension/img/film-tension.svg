<rect x="120.0" y="402.0" width="660.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">потягнути стрижень на Δx назовні → нова площа 2L·Δx, робота σ·2L·Δx</tspan><tspan x="450.0" dy="17.6">σ = сила / довжина (Н/м)  =  енергія / площа (Дж/м²) — одне число, дві мови</tspan></text>
