<rect x="120.0" y="470.0" width="680.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="495.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Викривлена натягнута поверхня тисне на те, що під нею. Що менший радіус — то крутіша кривина й вищий тиск усередині.</tspan></text>
