<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід закону інерції: сходинки одного відкриття</text>
<line x1="96.0" y1="84.0" x2="96.0" y2="636.0" stroke="#c7ccd3" stroke-width="3.0"/>
<circle cx="96.0" cy="84.0" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="3.0"/>
<text x="74.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">IV ст. до н.е.</text>
<text x="138.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Арістотель · грек</text>
<text x="138.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">рух потребує невпинного двигуна; спокій — природний</text>
<rect x="762.7" y="71.0" width="113.3" height="26.0" rx="13" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="819.4" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ХИБНА ОСНОВА</text>
<circle cx="96.0" cy="176.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="74.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">VI ст.</text>
<text x="138.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Йоан Філопон · Александрія</text>
<text x="138.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">тілу вкладено внутрішню рушійну силу</text>
<rect x="755.3" y="163.0" width="120.7" height="26.0" rx="13" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="815.6" y="180.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ПЕРША ТРІЩИНА</text>
<circle cx="96.0" cy="268.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="74.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">XIV ст.</text>
<text x="138.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Жан Бурідан · Франція</text>
<text x="138.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">імпетус ∝ вага · швидкість, сам не згасає</text>
<rect x="740.4" y="255.0" width="135.6" height="26.0" rx="13" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="808.2" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ЗАРОДОК p = m·v</text>
<circle cx="96.0" cy="360.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="74.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">1610-ті</text>
<text x="138.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Йоганн Кеплер · Німеччина</text>
<text x="138.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">увів слово inertia — та в сенсі «тяга до спокою»</text>
<rect x="740.4" y="347.0" width="135.6" height="26.0" rx="13" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="808.2" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ІМʼЯ БЕЗ ЗМІСТУ</text>
<circle cx="96.0" cy="452.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="3.0"/>
<text x="74.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">бл. 1632</text>
<text x="138.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Ґалілео Ґалілей · Італія</text>
<text x="138.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">інерція є — але горизонтальна, «кругова»</text>
<rect x="747.8" y="439.0" width="128.2" height="26.0" rx="13" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="811.9" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ОБМЕЖЕНА ФОРМА</text>
<circle cx="96.0" cy="544.0" r="8.0" fill="#ffffff" stroke="#27ae60" stroke-width="3.0"/>
<text x="74.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">1640–1644</text>
<text x="138.0" y="536.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Ґассенді й Декарт · Франція</text>
<text x="138.0" y="559.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">вільне тіло йде рівно і ПРЯМО, без кінця</text>
<rect x="725.5" y="531.0" width="150.5" height="26.0" rx="13" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="800.8" y="548.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗАГАЛЬНИЙ ПРИНЦИП</text>
<circle cx="96.0" cy="636.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="3.0"/>
<text x="74.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">1687</text>
<text x="138.0" y="628.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Ісаак Ньютон · Англія</text>
<text x="138.0" y="651.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start">закріпив як Lex I у «Началах»</text>
<rect x="770.2" y="623.0" width="105.8" height="26.0" rx="13" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="823.1" y="640.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">КОДИФІКАЦІЯ</text>
</svg>