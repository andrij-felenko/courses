<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник газової динаміки: Kn, Ma та Re</text>
<rect x="334.9" y="64.8" width="150.2" height="70.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="410.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Число Кнудсена</tspan><tspan x="410.0" dy="18.2">Kn = λ / L</tspan><tspan x="410.0" dy="18.2">(Розрідженість)</tspan></text>
<rect x="113.6" y="304.8" width="132.8" height="70.4" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="2.0"/><text x="180.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Число Маха</tspan><tspan x="180.0" dy="18.2">Ma = v / a</tspan><tspan x="180.0" dy="18.2">(Стисливість)</tspan></text>
<rect x="534.5" y="304.8" width="211.0" height="70.4" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="2.0"/><text x="640.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Число Рейнольдса</tspan><tspan x="640.0" dy="18.2">Re = ρ·v·L / μ</tspan><tspan x="640.0" dy="18.2">(В'язкість та інерція)</tspan></text>
<line x1="350.0" y1="135.0" x2="230.0" y2="290.0" stroke="#333333" stroke-width="2.0"/>
<line x1="470.0" y1="135.0" x2="590.0" y2="290.0" stroke="#333333" stroke-width="2.0"/>
<line x1="270.0" y1="340.0" x2="540.0" y2="340.0" stroke="#333333" stroke-width="2.0"/>
<rect x="290.0" y="195.0" width="240.0" height="95.0" rx="6" fill="#fff8eb" stroke="#e67e22" stroke-width="1.8"/><text x="410.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Співвідношення фон Кармана:</tspan><tspan x="410.0" dy="16.9"></tspan><tspan x="410.0" dy="16.9">Kn ≈ (Ma / Re) · √(γ·π / 2)</tspan><tspan x="410.0" dy="16.9"></tspan><tspan x="410.0" dy="16.9">Kn зростає при високому Ma</tspan><tspan x="410.0" dy="16.9">або при малому Re</tspan></text>
<rect x="60.0" y="400.0" width="700.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Практичний висновок: під час гіперзвукового входу в атмосферу (велике Ma) на високих альтернативах (мала густина ρ → мале Re)</tspan><tspan x="410.0" dy="12.3">газ стає сильно розрідженим (велике Kn), навіть якщо геометричний розмір апарата L становить кілька метрів.</tspan></text>
</svg>