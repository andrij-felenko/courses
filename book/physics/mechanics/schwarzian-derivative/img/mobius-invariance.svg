<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інваріантність похідної Шварца відносно дробово-лінійних перетворень</text>
<rect x="85.2" y="109.9" width="149.5" height="60.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Функція f(x)</tspan><tspan x="160.0" dy="18.2">S(f)(x) = q(x)</tspan></text>
<line x1="260.0" y1="140.0" x2="380.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">M(z) = (az+b)/(cz+d)</text>
<text x="320.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дробово-лінійне</text>
<rect x="394.9" y="109.9" width="210.3" height="60.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Композиція M(f(x))</tspan><tspan x="500.0" dy="18.2">S(M ∘ f)(x) = S(f)(x)</tspan></text>
<rect x="80.0" y="230.0" width="700.0" height="110.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="430.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок з лінійними системними рівняннями 2-го порядку</text>
<text x="430.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">Якщо y₁ і y₂ — незалежні розв'язки y'' + q(x)y = 0, то відношення f(x) = y₁/y₂ має S(f) = 2 q(x)</text>
<text x="430.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Будь-яка інша пара розв'язків пов'язана матрицею SL(2,ℝ) і дає те саме S(f)</text>
</svg>