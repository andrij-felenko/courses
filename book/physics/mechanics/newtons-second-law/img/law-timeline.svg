<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 920 680" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="920" height="680" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="660.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон визрівав дві тисячі років і не в одних руках</text>
<line x1="262.0" y1="84.0" x2="262.0" y2="604.0" stroke="#6b7280" stroke-width="2.5"/>
<circle cx="262.0" cy="121.1" r="8.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">~350 до н.е.</text>
<text x="288.0" y="117.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">Арістотель</text>
<text x="288.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">рух тримає сила; нема сили — рух гасне</text>
<circle cx="262.0" cy="195.4" r="8.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="200.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">VI–XIV ст.</text>
<text x="288.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="700">Філопон · Бурідан</text>
<text x="288.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">імпетус: тіло несе вкладену «силу руху»</text>
<circle cx="262.0" cy="269.7" r="8.0" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1632 · 1644</text>
<text x="288.0" y="265.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">Ґалілей · Декарт</text>
<text x="288.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">інерція: рух триває сам, без сили</text>
<circle cx="262.0" cy="344.0" r="8.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1687</text>
<text x="288.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Ньютон, «Начала»</text>
<text x="288.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">закон через ЗМІНУ кількості руху — не F = ma</text>
<circle cx="262.0" cy="418.3" r="8.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="423.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1716</text>
<text x="288.0" y="414.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Якоб Герман</text>
<text x="288.0" y="435.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Phoronomia: F = m·dv/dt у явному вигляді</text>
<circle cx="262.0" cy="492.6" r="8.0" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="497.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1750</text>
<text x="288.0" y="488.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Леонард Ейлер</text>
<text x="288.0" y="509.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">«нове начало»: загальна форма F = m·a</text>
<circle cx="262.0" cy="566.9" r="8.0" fill="#1a1a1a" stroke="#ffffff" stroke-width="2.0"/>
<text x="238.0" y="571.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1948</text>
<text x="288.0" y="562.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">9-та ГКМВ</text>
<text x="288.0" y="583.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">одиниці сили дають ім'я «ньютон»</text>
</svg>