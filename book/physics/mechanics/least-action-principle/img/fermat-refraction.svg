<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прадід принципу: світло обирає найшвидший за часом шлях</text>
<rect x="80.0" y="62.0" width="680.0" height="196.0" rx="0" fill="#fbfcfd" stroke="#e3e8ee" stroke-width="1.2"/>
<rect x="80.0" y="258.0" width="680.0" height="138.0" rx="0" fill="#eaf1fb" stroke="#d5e0f2" stroke-width="1.2"/>
<line x1="80.0" y1="258.0" x2="760.0" y2="258.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="752.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">повітря — світло швидке</text>
<text x="752.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">вода — світло повільне</text>
<path d="M 200.0 120.0 L 600.0 372.0" fill="none" stroke="#b6bfca" stroke-width="1.8" stroke-dasharray="7,5"/>
<circle cx="419.0" cy="258.0" r="3.5" fill="#b6bfca" stroke="#b6bfca" stroke-width="1.0"/>
<text x="300.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">прямий — коротший у метрах,</text>
<text x="300.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">але довший у часі</text>
<path d="M 200.0 120.0 L 470.0 258.0" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<path d="M 470.0 258.0 L 600.0 372.0" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<circle cx="200.0" cy="120.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="186.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">A</text>
<circle cx="600.0" cy="372.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="614.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">B</text>
<circle cx="470.0" cy="258.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="470.0" y1="180.0" x2="470.0" y2="336.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,5"/>
<text x="478.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">нормаль</text>
<text x="430.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-style="italic">θ₁</text>
<text x="450.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-style="italic">θ₂</text>
<text x="560.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">заломлений —</text>
<text x="560.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">найшвидший за часом</text>
<rect x="80.0" y="414.0" width="680.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="420.0" y="433.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">у повільній воді промінь іде крутіше (ближче до нормалі, θ₂ &lt; θ₁), щоб менше пройти</tspan><tspan x="420.0" dy="16.2">повільним середовищем — саме тому світло й заломлюється на межі</tspan></text>
</svg>