<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="520.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контрприклад Данжуа: блукаючі інтервали I_n та канторів атрактор K</text>
<text x="430.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розгортка кола S¹ = K ∪ (⋃ I_n): вклеювання блукаючих інтервалів I_n</text>
<line x1="100.0" y1="160.0" x2="760.0" y2="160.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="218.8" y="148.0" width="66.0" height="24.0" rx="2" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="251.8" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I_0</text>
<rect x="377.2" y="148.0" width="46.2" height="24.0" rx="2" fill="#8e44ad" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="400.3" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I_1</text>
<rect x="548.8" y="148.0" width="33.0" height="24.0" rx="2" fill="#8e44ad" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="565.3" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I_2</text>
<rect x="133.0" y="148.0" width="33.0" height="24.0" rx="2" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="149.5" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I_-1</text>
<rect x="661.0" y="148.0" width="19.8" height="24.0" rx="2" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="670.9" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I_-2</text>
<text x="331.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Множина Кантора K (доскональна, ніде не щільна)</text>
<line x1="298.0" y1="178.0" x2="364.0" y2="178.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="430.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості мінімальної множини K та блукаючого інтервалу I_0</text>
<rect x="90.0" y="275.0" width="210.0" height="100.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="195.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Dіз'юнктність</text>
<text x="195.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">fⁿ(I_0) ∩ fᵐ(I_0) = ∅</text>
<text x="195.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">при n ≠ m</text>
<rect x="325.0" y="275.0" width="210.0" height="100.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="430.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Збіжність довжин</text>
<text x="430.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">∑ |fⁿ(I_0)| ≤ 1 &lt; ∞</text>
<text x="430.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">сума довжин обмежена</text>
<rect x="560.0" y="275.0" width="210.0" height="100.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="665.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Локальна щільність</text>
<text x="665.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Орбіти щільні в K,</text>
<text x="665.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">але НЕ щільні на S¹</text>
<rect x="130.0" y="400.0" width="600.0" height="60.0" rx="4" fill="#fee2e2" stroke="#2457d6" stroke-width="1.2"/>
<text x="430.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Умови виникнення: f ∈ C¹(S¹), але log f' НЕ має обмеженої варіації</text>
<text x="430.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Var(log f') = ∞ (відсутність $C^{1+\alpha}$ гладкості)</text>
</svg>