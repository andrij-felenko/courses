<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація динаміки кругових відображень за гладкістю та α</text>
<rect x="90.0" y="90.0" width="320.0" height="300.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="250.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">Раціональне число обертання α = p/q</text>
<text x="110.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Наявність періодичних орбіт</text>
<text x="110.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Період усіх замкнених орбіт = q</text>
<text x="110.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фазове захоплення (lock-in)</text>
<text x="110.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Структурна стійкість (Арнольд)</text>
<rect x="105.0" y="265.0" width="290.0" height="80.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.0"/>
<text x="250.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Динамічний висновок:</text>
<text x="250.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Орбіти прямують до циклів.</text>
<text x="250.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Режим є неергодичним.</text>
<rect x="430.0" y="90.0" width="320.0" height="300.0" rx="4" fill="#f0fdf4" stroke="#c0392b" stroke-width="1.5"/>
<text x="590.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ірраціональне число обертання α ∉ ℚ</text>
<text x="450.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1) f ∈ C² (або C¹⁺ˡⁱᵖ): Теорема Данжуа</text>
<text x="465.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ Траєкторії всюди щільні</text>
<text x="465.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ Строга ергодичність</text>
<text x="465.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ Немає блукаючих інтервалів</text>
<text x="450.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">2) f ∈ C¹ (Var(log f') = ∞):</text>
<text x="465.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ Контрприклад Данжуа</text>
<text x="465.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ Блукаючі інтервали I_n</text>
<text x="465.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">→ Канторів мінімальний атрактор</text>
</svg>