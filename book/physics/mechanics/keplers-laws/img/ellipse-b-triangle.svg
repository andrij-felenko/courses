<line x1="300.0" y1="300.0" x2="143.5" y2="300.0" stroke="#a9760a" stroke-width="2.8"/>
<text x="221.7" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#a9760a" text-anchor="middle" font-weight="700">c</text>
<line x1="300.0" y1="300.0" x2="300.0" y2="160.0" stroke="#27ae60" stroke-width="2.6"/>
<text x="284.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">b</text>
<line x1="143.5" y1="300.0" x2="300.0" y2="160.0" stroke="#c0392b" stroke-width="2.8"/>
<text x="205.7" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">a</text>
<line x1="456.5" y1="300.0" x2="300.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="394.3" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-style="italic">a</text>
<line x1="286.0" y1="300.0" x2="286.0" y2="286.0" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="286.0" y1="286.0" x2="300.0" y2="286.0" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="295.0" y1="295.0" x2="305.0" y2="305.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="295.0" y1="305.0" x2="305.0" y2="295.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="308.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">центр</text>
<circle cx="143.5" cy="300.0" r="11.0" fill="#ffe6a1" stroke="#e0a800" stroke-width="2.2"/>
<text x="143.5" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a9760a" text-anchor="middle" font-weight="700">фокус (Сонце)</text>
<circle cx="456.5" cy="300.0" r="5.0" fill="none" stroke="#6b7280" stroke-width="1.8"/>
<text x="456.5" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">порожній фокус</text>
<circle cx="300.0" cy="160.0" r="6.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="300.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">кінець малої осі</text>
<text x="300.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(рівновіддалений від фокусів)</text>
<rect x="588.0" y="108.0" width="296.0" height="316.0" rx="6" fill="#fbfbfd" stroke="#333333" stroke-width="1.3"/>
<text x="608.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">a² = b² + c²</text>
<text x="608.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">гіпотенуза a, катети b і c</text>
<line x1="608.0" y1="182.0" x2="864.0" y2="182.0" stroke="#e2e6ea" stroke-width="1.0"/>
<text x="608.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">b = a·√(1 − e²)</text>
<text x="608.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#a9760a" text-anchor="start" font-weight="700">c = a·e      e = c/a</text>
<line x1="608.0" y1="254.0" x2="864.0" y2="254.0" stroke="#e2e6ea" stroke-width="1.0"/>
<text x="608.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">сплюснутість b/a = √(1 − e²):</text>
<text x="608.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Земля   e=0.017  →  b/a = 0.99986</text>
<text x="608.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Марс    e=0.093  →  b/a = 0.9956</text>
<text x="608.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Галлея  e=0.967  →  b/a = 0.255</text>
<text x="608.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">мале e → орбіта майже коло,</text>
<text x="608.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">але фокус помітно збоку (c = a·e)</text>
<rect x="160.6" y="481.0" width="578.9" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="500.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">верхівка малої осі рівновіддалена від фокусів  ⟹  кожна нитка = a  ⟹  a² = b² + c²</tspan></text>
</svg>