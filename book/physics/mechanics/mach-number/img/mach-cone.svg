<rect x="70.0" y="325.0" width="680.0" height="160.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="384.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Геометричний зміст числа Маха:</tspan><tspan x="410.0" dy="16.9">• При M &lt; 1 акустичні збурення випереджають тіло та попереджають середовище.</tspan><tspan x="410.0" dy="16.9">• При M = 1 сферичні фронти стискаються у плоский звуковий бар'єр.</tspan><tspan x="410.0" dy="16.9">• При M &gt; 1 збурення замикаються у конус Маха з напівкутом μ = arcsin(1/M).</tspan></text>
</svg>