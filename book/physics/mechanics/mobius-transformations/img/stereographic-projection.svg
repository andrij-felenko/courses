<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="440.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стереографічна проекція сфери Рімана на комплексну площину</text>
<polygon points="80,270 620,270 520,390 20,390" fill="#f0f4f8" stroke="#94a3b8" stroke-width="1.5"/>
<text x="410.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Комплексна площина ℂ (z = x + iy)</text>
<circle cx="340.0" cy="220.0" r="120.0" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<ellipse cx="340" cy="220" rx="120" ry="35" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<circle cx="340.0" cy="100.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="340.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Північний полюс N (∞)</text>
<circle cx="340.0" cy="340.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="340.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">Південний полюс S (0)</text>
<circle cx="420.0" cy="160.0" r="4.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="434.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Точка P(x, y, Z) на сфері</text>
<line x1="340.0" y1="100.0" x2="500.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,3"/>
<circle cx="500.0" cy="280.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="515.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Проекція z ∈ ℂ</text>
<rect x="580.0" y="140.0" width="180.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="650.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Властивості:</text>
<text x="650.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• N ↦ Нескінченність ∞</text>
<text x="650.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• S ↦ Початок координат 0</text>
<text x="650.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Кола на сфері ↦</text>
<text x="650.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">  Кола/Прямі на ℂ</text>
<text x="650.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">• Поворот сфери ≡ Мьобіус</text>
</svg>