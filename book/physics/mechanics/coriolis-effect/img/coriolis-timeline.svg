<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="600.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Майже три століття: доданок з'явився в математиці, а ім'я дістав останнім</text>
<rect x="120.0" y="289.0" width="734.0" height="62.0" rx="11" fill="#f2f7f4" stroke="none" stroke-width="0.0"/>
<rect x="120.0" y="363.0" width="734.0" height="62.0" rx="11" fill="#fdf2f1" stroke="none" stroke-width="0.0"/>
<line x1="210.0" y1="76.0" x2="210.0" y2="564.0" stroke="#6b7280" stroke-width="2.2"/>
<text x="178.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="end" font-weight="700">1651</text>
<circle cx="210.0" cy="98.0" r="7.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="236.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Річчолі й Ґрімальді: відхилення ядра —</text>
<text x="236.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">його брали за доказ ПРОТИ обертання Землі</text>
<text x="178.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">1749</text>
<circle cx="210.0" cy="172.0" r="7.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="236.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ейлер: доданок у рівняннях руху рідини,</text>
<text x="236.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ще без окремого фізичного тлумачення</text>
<text x="178.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">1778</text>
<circle cx="210.0" cy="246.0" r="7.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="236.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Лаплас: той самий доданок</text>
<text x="236.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">у рівняннях океанських припливів</text>
<text x="178.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">1835</text>
<circle cx="210.0" cy="320.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="236.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Коріоліс: «складена відцентрова сила»</text>
<text x="236.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">у теорії обертових МАШИН — не погоди</text>
<text x="178.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">1851</text>
<circle cx="210.0" cy="394.0" r="7.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="236.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Фуко: маятник у паризькому Пантеоні —</text>
<text x="236.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">обертання Землі нарешті стало видимим</text>
<text x="178.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">1857</text>
<circle cx="210.0" cy="468.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="236.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Феррел (1856) і Бейс-Балло (1857):</text>
<text x="236.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ефект уже керує вітрами й циклонами</text>
<text x="178.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">≈1920</text>
<circle cx="210.0" cy="542.0" r="7.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="236.0" y="539.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">і лише тепер доданок дістає ім'я —</text>
<text x="236.0" y="558.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«сила Коріоліса»</text>
</svg>