<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як народжувався закон нерозривності</text>
<line x1="108.0" y1="70.0" x2="108.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="108.0" y1="120.0" x2="108.0" y2="214.0" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="3 7"/>
<line x1="108.0" y1="214.0" x2="108.0" y2="520.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="108.0" y1="520.0" x2="108.0" y2="546.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="108.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">час</text>
<circle cx="108.0" cy="98.0" r="7.5" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="132.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Герон Александрійський · бл. 62 р. н.е.</text>
<text x="132.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">У «Діоптрі»: витрата — це площа, помножена на швидкість, а не сам отвір.</text>
<text x="132.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">≈ 15 століть — думку загублено;</text>
<text x="132.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">річку далі міряють шириною отвору</text>
<circle cx="108.0" cy="240.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="132.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Леонардо да Вінчі · бл. 1508 (Кодекс Лестера)</text>
<text x="132.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Скільки води входить, стільки й виходить; де вужче — там швидше. Словами.</text>
<circle cx="108.0" cy="360.0" r="7.5" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="132.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Бенедетто Кастеллі · 1628, Рим</text>
<text x="132.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Точний закон A · v = const: площа й швидкість обернено пропорційні.</text>
<circle cx="108.0" cy="475.0" r="7.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="132.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Леонард Ойлер · 1757</text>
<text x="132.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Диференціальне рівняння нерозривності: ∂ρ/∂t + ∇·(ρv) = 0.</text>
</svg>