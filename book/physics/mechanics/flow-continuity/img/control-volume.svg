<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться закон: облік маси в контрольному об'ємі</text>
<rect x="275.0" y="121.0" width="250.0" height="150.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">контрольний об'єм</text>
<text x="400.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">маса всередині</text>
<line x1="147.0" y1="196.0" x2="269.0" y2="196.0" stroke="#2457d6" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="147.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">втікає</text>
<text x="147.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">ρ₁ · A₁ · v₁</text>
<line x1="531.0" y1="196.0" x2="653.0" y2="196.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="653.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">витікає</text>
<text x="653.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end">ρ₂ · A₂ · v₂</text>
<rect x="80.0" y="320.0" width="640.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="350.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">накопичення = приток − витік      •      усталена течія → приток = витік</tspan></text>
</svg>