<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">Динаміка нечасововпорядкованого корелятора (OTOC) та межа хаосу MSS</text>
<rect x="40.0" y="60.0" width="450.0" height="310.0" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/>
<text x="265.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Зростання хаосу F(t) у часі t</text>
<line x1="80.0" y1="330.0" x2="460.0" y2="330.0" stroke="#334155" stroke-width="1.5"/>
<line x1="80.0" y1="330.0" x2="80.0" y2="110.0" stroke="#334155" stroke-width="1.5"/>
<text x="465.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">t</text>
<text x="78.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">F(t)</text>
<line x1="80.0" y1="130.0" x2="450.0" y2="130.0" stroke="#64748b" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="70.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">1</text>
<text x="70.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">0</text>
<path d="M 80 135 L 200 140 Q 310 160 360 280 L 440 320" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<line x1="360.0" y1="330.0" x2="360.0" y2="110.0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">t_* (Scrambling time)</text>
<text x="220.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">1 - (c/N) e^(λ_L t)</text>
<rect x="510.0" y="60.0" width="320.0" height="310.0" rx="8" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
<text x="670.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Межа хаосу MSS</text>
<text x="670.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(Maldacena-Shenker-Stanford)</text>
<line x1="530.0" y1="128.0" x2="810.0" y2="128.0" stroke="#fecaca" stroke-width="1.0"/>
<text x="530.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start" font-weight="700">Показник Ляпунова λ_L:</text>
<rect x="540.0" y="170.0" width="260.0" height="45.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="670.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">λ_L = 2π k_B T / ℏ</text>
<text x="530.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• SYK є МАКСИМАЛЬНО хаотичною</text>
<text x="545.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">квантовою системою.</text>
<text x="530.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Час скрамблінгу інформації:</text>
<text x="545.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">t_* = (ℏ / 2π k_B T) · ln N</text>
<text x="530.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">• Аналог насичення горизонту чорної діри.</text>
</svg>