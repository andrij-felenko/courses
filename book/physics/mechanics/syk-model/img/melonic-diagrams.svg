<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 958 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="958" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">Мелонна діаграматика та самоузгодження Швінгера-Дайсона у границі N → ∞</text>
<rect x="30.0" y="50.0" width="800.0" height="160.0" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="start" font-weight="700">1. Рівняння Швінгера-Дайсона: G⁻¹ = G₀⁻¹ - Σ</text>
<text x="90.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">G(τ)</text>
<line x1="60.0" y1="145.0" x2="140.0" y2="145.0" stroke="#1e3a8a" stroke-width="4.0"/>
<circle cx="60.0" cy="145.0" r="4.0" fill="#1e3a8a" stroke="#333333" stroke-width="1.5"/>
<circle cx="140.0" cy="145.0" r="4.0" fill="#1e3a8a" stroke="#333333" stroke-width="1.5"/>
<text x="165.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">=</text>
<text x="215.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">G₀(τ)</text>
<line x1="190.0" y1="145.0" x2="260.0" y2="145.0" stroke="#64748b" stroke-width="1.5"/>
<circle cx="190.0" cy="145.0" r="3.0" fill="#64748b" stroke="#333333" stroke-width="1.5"/>
<circle cx="260.0" cy="145.0" r="3.0" fill="#64748b" stroke="#333333" stroke-width="1.5"/>
<text x="285.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#334155" text-anchor="middle" font-weight="700">+</text>
<line x1="310.0" y1="145.0" x2="360.0" y2="145.0" stroke="#64748b" stroke-width="1.5"/>
<ellipse cx="395" cy="145" rx="35" ry="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="395.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Σ(τ)</text>
<line x1="430.0" y1="145.0" x2="480.0" y2="145.0" stroke="#1e3a8a" stroke-width="4.0"/>
<circle cx="310.0" cy="145.0" r="3.0" fill="#64748b" stroke="#333333" stroke-width="1.5"/>
<circle cx="480.0" cy="145.0" r="4.0" fill="#1e3a8a" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start" font-weight="700">Інтегральне самоузгодження у часовому просторі:</text>
<text x="520.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">G(τ - τ') = G₀(τ - τ') + ∫ G₀(τ - τ'') Σ(τ'' - τ''') G(τ''' - τ') dτ'' dτ'''</text>
<rect x="30.0" y="230.0" width="800.0" height="170.0" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="50.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="start" font-weight="700">2. Мелонна самоенергія Σ(τ) = J² · [G(τ)]³ (для q=4)</text>
<circle cx="140.0" cy="335.0" r="5.0" fill="#334155" stroke="#333333" stroke-width="1.5"/>
<circle cx="300.0" cy="335.0" r="5.0" fill="#334155" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">τ = 0</text>
<text x="300.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">τ</text>
<path d="M 140 335 Q 220 270 300 335" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
<path d="M 140 335 L 300 335" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
<path d="M 140 335 Q 220 400 300 335" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
<path d="M 140 335 Q 220 240 300 335" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="220.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">⟨J_ijkl J_ijkl⟩ = 6 J² / N³</text>
<text x="220.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">G(τ)</text>
<text x="220.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">G(τ)</text>
<text x="220.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">G(τ)</text>
<text x="370.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• У границі N → ∞ виживають ЛЕШЕ мелонні (плоскі) діаграми.</text>
<text x="370.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Перехресні (non-nested) діаграми пригнічені як O(1/N²).</text>
<text x="370.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Рівняння допускає точний аналітичний розв'язок у конформній межі.</text>
</svg>