<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">Голографічний дуалізм: 0+1D квантова модель SYK ↔ 1+1D JT-гравітація в AdS₂</text>
<rect x="40.0" y="70.0" width="340.0" height="300.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="210.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">Квантова межа (0+1D)</text>
<text x="210.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Модель Зачдева-Є-Кітаєва (SYK)</text>
<line x1="60.0" y1="140.0" x2="360.0" y2="140.0" stroke="#86efac" stroke-width="1.0"/>
<text x="65.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• N Майоранівських ферміонів χ_i</text>
<text x="65.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Випадкова all-to-all взаємодія J_ijkl</text>
<text x="65.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Емерджентна конформна симетрія</text>
<text x="65.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start">• Максимальний хаос λ_L = 2π T</text>
<text x="65.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start">• Залишкова ентропія S₀ = N · s₀</text>
<text x="65.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="start" font-weight="700">Динаміка описується дією Шварціана S[f]</text>
<line x1="400.0" y1="220.0" x2="460.0" y2="220.0" stroke="#7c3aed" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="220.0" x2="400.0" y2="220.0" stroke="#7c3aed" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="430.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">AdS₂ / CFT₁</text>
<text x="430.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">Дуальність</text>
<rect x="480.0" y="70.0" width="340.0" height="300.0" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="650.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700">Гравітаційний балк (1+1D)</text>
<text x="650.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">JT-гравітація Жакова-Тетельбойма</text>
<line x1="500.0" y1="140.0" x2="800.0" y2="140.0" stroke="#c4b5fd" stroke-width="1.0"/>
<text x="505.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Метрика простору AdS₂ зі зрізом</text>
<text x="505.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Дилатонне поле Φ(x) та кривизна R = -2</text>
<text x="505.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">• Динаміка межі (Boundary Graviton)</text>
<text x="505.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start">• 2D квантова чорна діра з горизонтом</text>
<text x="505.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start">• Термодинамічна ентропія Бетенштейна</text>
<text x="505.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="700">Дія межі збігається з діянням Шварціана</text>
</svg>