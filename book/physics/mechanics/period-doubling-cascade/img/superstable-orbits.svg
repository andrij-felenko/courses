<text x="260.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x = 1/2</text>
<rect x="405.6" y="165.0" width="368.8" height="110.0" rx="6" fill="#f4f6f8" stroke="#8e44ad" stroke-width="1.5"/><text x="590.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Умова надстійкості:</tspan><tspan x="590.0" dy="15.6">Для циклу {x₁, x₂}: (f²)'(x₁) = f '(x₁)·f '(x₂) = 0</tspan><tspan x="590.0" dy="15.6"></tspan><tspan x="590.0" dy="15.6">Оскільки похідна в вершині f '(1/2) = 0,</tspan><tspan x="590.0" dy="15.6">цикл проходить точнісінько через максимум.</tspan><tspan x="590.0" dy="15.6">Це дає строгі реперні точки для розрахунку α.</tspan></text>
<rect x="40.9" y="436.0" width="738.2" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="456.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Павутиння ітерацій приходить у замкнений прямокутник. Дотик до максимуму f '(x*)=0 робить цикл надстійким</tspan></text>
