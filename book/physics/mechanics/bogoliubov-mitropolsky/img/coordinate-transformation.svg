<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія заміни змінних Боголюбова: x = ξ + ε u₁(t, ξ)</text>
<rect x="58.6" y="114.2" width="242.9" height="91.7" rx="6" fill="#FFF5F5" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Вихідний простір змінних x(t)</tspan><tspan x="180.0" dy="16.9"></tspan><tspan x="180.0" dy="16.9">dx/dt = ε X(t, x)</tspan><tspan x="180.0" dy="16.9">(Містить швидкі осциляції)</tspan></text>
<rect x="507.4" y="114.2" width="265.1" height="91.7" rx="6" fill="#F0F9FF" stroke="#2457d6" stroke-width="2.0"/><text x="640.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Усереднений простір змінних ξ(t)</tspan><tspan x="640.0" dy="16.9"></tspan><tspan x="640.0" dy="16.9">dξ/dt = ε A₁(ξ) + ε² A₂(ξ)</tspan><tspan x="640.0" dy="16.9">(Автономна згладжена динаміка)</tspan></text>
<line x1="310.0" y1="130.0" x2="500.0" y2="130.0" stroke="#27ae60" stroke-width="2.5"/><path d="M 500.0 130.0 L 491.0 133.6 L 491.0 126.4 z" fill="#27ae60"/>
<text x="405.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Заміна Боголюбова x = ξ + ε u₁(t, ξ)</text>
<line x1="500.0" y1="190.0" x2="310.0" y2="190.0" stroke="#6b7280" stroke-width="2.0"/><path d="M 310.0 190.0 L 319.0 186.4 L 319.0 193.6 z" fill="#6b7280"/>
<text x="405.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Оператор усереднення ⟨X(t, ξ)⟩</text>
<rect x="144.9" y="274.2" width="530.2" height="51.6" rx="6" fill="#FAFBFD" stroke="#d0d7de" stroke-width="1.2"/><text x="410.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Функція u₁(t, ξ) виключає пульсації: ∂u₁/∂t = X(t, ξ) - A₁(ξ)</tspan><tspan x="410.0" dy="15.6">Усереднене векторне поле A₁(ξ) = (1/T) ∫ X(t, ξ) dt описує системний дрейф</tspan></text>
</svg>