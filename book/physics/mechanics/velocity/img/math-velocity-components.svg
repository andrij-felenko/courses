<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модуль швидкості — гіпотенуза за складовими</text>
<line x1="190.0" y1="340.0" x2="470.0" y2="340.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="470.0" y1="340.0" x2="470.0" y2="150.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<polyline points="456.0,340.0 456.0,326.0 470.0,326.0" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<line x1="190.0" y1="340.0" x2="470.0" y2="150.0" stroke="#c0392b" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="190.0" cy="340.0" r="6.0" fill="#fef6e7" stroke="#c0392b" stroke-width="2.0"/>
<text x="330.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">vx = dx/dt</text>
<text x="482.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">vy = dy/dt</text>
<text x="300.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700" font-style="italic">v</text>
<text x="300.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">|v| = √(vx² + vy²)</text>
<text x="180.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">точка на траєкторії</text>
<rect x="30.9" y="417.2" width="658.1" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="360.0" y="438.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Складові vx, vy — похідні координат, катети прямокутного трикутника.</tspan><tspan x="360.0" dy="15.6">Вектор швидкості — гіпотенуза; його довжина за Піфагором і є модуль |v|, число на спідометрі.</tspan></text>
</svg>