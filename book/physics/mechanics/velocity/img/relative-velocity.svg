<text x="330.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start"><tspan x="330.0" dy="0.0">відносно берега</tspan><tspan x="330.0" dy="15.0">= сума векторів</tspan></text>
<rect x="107.8" y="431.2" width="644.4" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="430.0" y="452.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Швидкості складаються як вектори: човен‑берег = човен‑вода + вода‑берег.</tspan><tspan x="430.0" dy="15.6">Та сама подія має різну швидкість у різних системах відліку — «абсолютної» швидкості немає.</tspan></text>
