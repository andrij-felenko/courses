<text x="176.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end"><tspan x="176.0" dy="0.0">човен</tspan><tspan x="176.0" dy="15.0">відносно води</tspan></text>
