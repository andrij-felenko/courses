<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1040.0" height="760.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Арістотелів світ природних місць чотирьох стихій</text>
<text x="260.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Світ Арістотеля: концентричні природні місця</text>
<circle cx="260.0" cy="310.0" r="190.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="260.0" cy="310.0" r="145.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="260.0" cy="310.0" r="102.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="260.0" cy="310.0" r="55.0" fill="#a9946b" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="560.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стихії за природним місцем</text>
<rect x="560.0" y="129.0" width="22.0" height="22.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="594.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Вогонь</text>
<rect x="594.0" y="152.0" width="340.0" height="34.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="764.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="764.0" dy="0.0">найлегший, лине вгору (levitas)</tspan></text>
<rect x="560.0" y="221.0" width="22.0" height="22.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="594.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Повітря</text>
<rect x="594.0" y="244.0" width="340.0" height="34.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="764.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="764.0" dy="0.0">легке — теж тягнеться вгору</tspan></text>
<rect x="560.0" y="313.0" width="22.0" height="22.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="594.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Вода</text>
<rect x="594.0" y="336.0" width="340.0" height="34.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="764.0" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="764.0" dy="0.0">важка — тягнеться вниз (gravitas)</tspan></text>
<rect x="560.0" y="405.0" width="22.0" height="22.0" rx="4" fill="#a9946b" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="594.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Земля</text>
<rect x="594.0" y="428.0" width="340.0" height="34.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="764.0" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="764.0" dy="0.0">найважча — у самому центрі світу</tspan></text>
<circle cx="230.0" cy="590.0" r="14.0" fill="#a9946b" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="230.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">камінь</text>
<line x1="230.0" y1="610.0" x2="230.0" y2="662.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="131.1" y="666.2" width="197.8" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="230.0" y="686.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="230.0" dy="0.0">gravitas: тягнеться вниз —</tspan><tspan x="230.0" dy="15.6">вроджена важкість тіла</tspan></text>
<circle cx="680.0" cy="662.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="680.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">полум'я</text>
<line x1="680.0" y1="646.0" x2="680.0" y2="594.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="553.7" y="666.2" width="252.6" height="47.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="686.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="680.0" dy="0.0">levitas: тягнеться вгору —</tspan><tspan x="680.0" dy="15.6">вроджена легкість, не «менша вага»</tspan></text>
<rect x="131.1" y="720.5" width="777.8" height="35.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="520.0" y="742.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">вага тут — вроджена вдача самого тіла: ніхто не тягне ззовні, тіло рухається до свого природного місця</tspan></text>
</svg>