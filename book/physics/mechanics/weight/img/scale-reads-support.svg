<rect x="0.0" y="0.0" width="980.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що насправді міряють терези: не тяжіння, а поштовх опори</text>
<line x1="150.0" y1="450.0" x2="520.0" y2="450.0" stroke="#2457d6" stroke-width="1.6"/><line x1="150.0" y1="450.0" x2="141.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="168.5" y1="450.0" x2="159.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="187.0" y1="450.0" x2="178.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="205.5" y1="450.0" x2="196.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="224.0" y1="450.0" x2="215.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="242.5" y1="450.0" x2="233.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="261.0" y1="450.0" x2="252.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="279.5" y1="450.0" x2="270.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="298.0" y1="450.0" x2="289.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="316.5" y1="450.0" x2="307.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="335.0" y1="450.0" x2="326.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="353.5" y1="450.0" x2="344.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="372.0" y1="450.0" x2="363.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="390.5" y1="450.0" x2="381.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="409.0" y1="450.0" x2="400.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="427.5" y1="450.0" x2="418.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="446.0" y1="450.0" x2="437.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="464.5" y1="450.0" x2="455.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="483.0" y1="450.0" x2="474.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="501.5" y1="450.0" x2="492.5" y2="459.0" stroke="#2457d6" stroke-width="1.0"/><line x1="520.0" y1="450.0" x2="511.0" y2="459.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="252.0" y="420.0" width="156.0" height="30.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/><rect x="303.0" y="426.0" width="54.0" height="18.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="330.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">N</text>
<circle cx="330.0" cy="312.5" r="20.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/><line x1="330.0" y1="333.0" x2="330.0" y2="376.5" stroke="#1a1a1a" stroke-width="2.6"/><line x1="330.0" y1="339.0" x2="305.7" y2="363.7" stroke="#1a1a1a" stroke-width="2.6"/><line x1="330.0" y1="339.0" x2="354.3" y2="363.7" stroke="#1a1a1a" stroke-width="2.6"/><line x1="330.0" y1="376.5" x2="310.8" y2="420.0" stroke="#1a1a1a" stroke-width="2.6"/><line x1="330.0" y1="376.5" x2="349.2" y2="420.0" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="330.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тяжіння тягне кожну частинку тіла рівномірно — саме собою невідчутне</text>
<line x1="310.0" y1="324.0" x2="310.0" y2="350.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="330.0" y1="324.0" x2="330.0" y2="350.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="350.0" y1="324.0" x2="350.0" y2="350.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="212.0" y1="324.0" x2="212.0" y2="412.0" stroke="#1a1a1a" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="202.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">m·g</text>
<text x="202.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">тяжіння</text>
<line x1="430.0" y1="418.0" x2="430.0" y2="342.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="442.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700"><tspan x="442.0" dy="0.0">N — сила</tspan><tspan x="442.0" dy="15.6">реакції опори</tspan></text>
<line x1="330.0" y1="422.0" x2="330.0" y2="440.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="330.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">тіло тисне на майданчик так само (3-й закон)</text>
<rect x="668.7" y="230.0" width="202.6" height="40.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="770.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">у спокої:  N = m·g</tspan></text>
<rect x="628.0" y="300.0" width="284.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="770.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">пружина всередині ловить силу N,</tspan><tspan x="770.0" dy="16.2">з якою тіло тисне на майданчик —</tspan><tspan x="770.0" dy="16.2">а не тяжіння. Тому в спокої</tspan><tspan x="770.0" dy="16.2">прилад показує вагу тяжіння m·g.</tspan></text>
<rect x="163.5" y="514.2" width="653.0" height="35.5" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="490.0" y="536.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">тяжіння невідчутне; вага, яку ти відчуваєш і читаєш на шкалі, — це поштовх опори N</tspan></text>
</svg>