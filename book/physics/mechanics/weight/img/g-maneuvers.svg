<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1080.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="540.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уявна вага в буденних маневрах — у частках звичайної ваги (g)</text>
<line x1="516.0" y1="72.0" x2="516.0" y2="498.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="516.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 g — звичайна вага</text>
<text x="372.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Вільне падіння / невагомість</text>
<circle cx="388.0" cy="96.0" r="4.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="400.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">0.00 g</text>
<text x="372.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Ліфт гальмує перед зупинкою</text>
<rect x="388.0" y="143.0" width="112.6" height="26.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="512.6" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">0.88 g</text>
<text x="372.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Стоїш на землі</text>
<rect x="388.0" y="203.0" width="128.0" height="26.0" rx="4" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="528.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1.00 g</text>
<text x="372.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Ліфт розганяється вгору</text>
<rect x="388.0" y="263.0" width="143.4" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="543.4" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1.12 g</text>
<text x="372.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Різке гальмування авто</text>
<rect x="388.0" y="323.0" width="172.8" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="572.8" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1.35 g</text>
<text x="644.8" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(бічне ~0.9 g)</text>
<text x="372.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Гірки, низ великої петлі</text>
<rect x="388.0" y="383.0" width="512.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="912.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4.00 g</text>
<text x="372.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end">Винищувач виходить із піке</text>
<rect x="388.0" y="443.0" width="640.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="1040.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">5.00 g</text>
<rect x="105.1" y="508.8" width="869.9" height="34.5" rx="6" fill="#eef2fb" stroke="#27ae60" stroke-width="1.4"/><text x="540.0" y="530.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">усе це — один поштовх опори N на одиницю маси: більший за 1 g притискає (важчаєш), менший відпускає, нуль — невагомість</tspan></text>
</svg>