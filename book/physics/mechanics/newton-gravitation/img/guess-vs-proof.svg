<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="450.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Здогад — ще не закон: що зробив Гук, а що Ньютон</text>
<rect x="40.0" y="62.0" width="390.0" height="300.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.4"/>
<rect x="470.0" y="62.0" width="390.0" height="300.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.4"/>
<rect x="144.5" y="73.0" width="180.9" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="92.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">РОБЕРТ ГУК — здогад</tspan></text>
<rect x="552.8" y="73.0" width="224.3" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="665.0" y="92.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">ІСААК НЬЮТОН — доведення</tspan></text>
<circle cx="64.0" cy="140.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="80.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">тяжіння тягне до центра тіла</tspan></text>
<circle cx="64.0" cy="186.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="80.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">рух по прямій, доки сила не зверне</tspan></text>
<circle cx="64.0" cy="232.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="80.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="80.0" dy="0.0">1/r² — записав у листі, як здогад</tspan></text>
<circle cx="64.0" cy="278.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="80.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="80.0" dy="0.0">але орбіту з нього</tspan><tspan x="80.0" dy="15.2">вивести не зумів</tspan></text>
<circle cx="494.0" cy="140.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="510.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">з 1/r² математично виводить еліпс</tspan></text>
<circle cx="494.0" cy="186.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="510.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">і Кеплерів закон площ</tspan></text>
<circle cx="494.0" cy="232.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="510.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">теорема про кулю: тягне як точка</tspan></text>
<circle cx="494.0" cy="278.0" r="3.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="510.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="510.0" dy="0.0">закон — універсальний</tspan><tspan x="510.0" dy="15.2">і виражений у числах</tspan></text>
<rect x="157.1" y="405.0" width="585.7" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Гук угадав закон — Ньютон довів, що з нього випливають еліпси (і сам Гук це визнав)</tspan></text>
</svg>