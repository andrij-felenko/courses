<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарматне ядро Ньютона: досить швидке — і падіння стає орбітою</text>
<text x="360.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що швидше вистрелити, то далі ядро пролетить, поки падає</text>
<circle cx="360.0" cy="470.0" r="200.0" fill="#eef3fb" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="360" cy="470" r="240" fill="none" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="7,6"/>
<polygon points="332,272 388,272 360,230" fill="#d8dee7" stroke="#333333" stroke-width="1.4"/>
<line x1="360.0" y1="230.0" x2="394.0" y2="230.0" stroke="#1a1a1a" stroke-width="6.0"/>
<circle cx="360.0" cy="230.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="402.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">v →</text>
<path d="M 360 230 Q 452 230 460 297" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<path d="M 360 230 Q 520 230 537 376" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<circle cx="460.0" cy="297.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="537.0" cy="376.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="474.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">падає близько</text>
<text x="552.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">летить далі</text>
<text x="150.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">орбіта</text>
<text x="150.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">(промах!)</text>
<rect x="74.7" y="111.8" width="262.5" height="76.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="206.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">Орбіта — це вільне падіння,</tspan><tspan x="206.0" dy="15.0">яке не завершується ударом:</tspan><tspan x="206.0" dy="15.0">поверхня закруглюється вниз</tspan><tspan x="206.0" dy="15.0">так само швидко, як ядро опускається.</tspan></text>
</svg>