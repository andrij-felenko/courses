<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="430.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка Місяцем: те саме тяжіння, послаблене квадратом відстані</text>
<circle cx="150.0" cy="250.0" r="70.0" fill="#eef3fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">Земля</text>
<circle cx="150.0" cy="180.0" r="8.0" fill="#fef6e7" stroke="#c0392b" stroke-width="2.0"/>
<line x1="150.0" y1="184.0" x2="150.0" y2="220.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="164.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">яблуко:  r = R,  a = 9.81 м/с²</text>
<circle cx="772.0" cy="250.0" r="24.0" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/>
<text x="772.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Місяць</text>
<line x1="744.0" y1="250.0" x2="708.0" y2="250.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="772.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">r ≈ 60 R</text>
<line x1="226.0" y1="250.0" x2="702.0" y2="250.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<text x="481.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">≈ 60 радіусів Землі</text>
<polyline points="228.0,133.9 237.0,148.4 246.0,159.1 255.0,167.1 264.0,173.3 273.0,178.2 282.0,182.1 291.0,185.3 300.0,188.0 309.0,190.2 318.0,192.0 327.0,193.6 336.0,195.0 345.0,196.1 354.0,197.2 363.0,198.1 372.0,198.9 381.0,199.6 390.0,200.2 399.0,200.7 408.0,201.2 417.0,201.7 426.0,202.1 435.0,202.4 444.0,202.8 453.0,203.1 462.0,203.4 471.0,203.6 480.0,203.9 489.0,204.1 498.0,204.3 507.0,204.5 516.0,204.6 525.0,204.8 534.0,204.9 543.0,205.1 552.0,205.2 561.0,205.3 570.0,205.4 579.0,205.6 588.0,205.7 597.0,205.7 606.0,205.8 615.0,205.9 624.0,206.0 633.0,206.1 642.0,206.1 651.0,206.2 660.0,206.3 669.0,206.3 678.0,206.4 687.0,206.4 696.0,206.5" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="300.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">a ∝ 1/r²  (тяжіння швидко слабшає)</text>
<rect x="110.4" y="325.6" width="255.1" height="48.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="238.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="238.0" dy="0.0">Закон 1/r² обіцяє:</tspan><tspan x="238.0" dy="16.2">a = 9.81 / 60²  ≈  2.70·10⁻³ м/с²</tspan></text>
<rect x="538.0" y="325.6" width="248.0" height="48.8" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="662.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="662.0" dy="0.0">Орбіта Місяця дає:</tspan><tspan x="662.0" dy="16.2">a = 4π²r / T²  ≈  2.72·10⁻³ м/с²</tspan></text>
<text x="450.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="34" fill="#27ae60" text-anchor="middle" font-weight="700">=</text>
<rect x="198.8" y="392.8" width="502.5" height="30.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="450.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">два незалежні шляхи — і те саме число:  земне й небесне тяжіння одне</tspan></text>
</svg>