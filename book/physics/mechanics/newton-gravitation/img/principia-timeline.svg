<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 920 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="920" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="620.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Не одна мить, а двадцять років: як дозрівали «Начала»</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">яблуко 1666-го — лише зернина; закон склався аж у 1680-х</text>
<line x1="300.0" y1="92.0" x2="300.0" y2="585.0" stroke="#333333" stroke-width="2.6"/>
<circle cx="300.0" cy="112.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="278.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1665–66</text>
<text x="326.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">Вулсторп, чума — Трініті зачинено.</tspan><tspan x="326.0" dy="16.0">Перша «перевірка Місяцем»: «доволі близько».</tspan></text>
<rect x="285.0" y="150.0" width="30.0" height="96.0" rx="8" fill="#f0f1f4" stroke="none" stroke-width="0.0"/>
<line x1="300" y1="150" x2="300" y2="246" stroke="#6b7280" stroke-width="2.6" stroke-dasharray="3,7"/>
<rect x="384.9" y="167.4" width="182.2" height="61.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="476.0" y="186.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="476.0" dy="0.0">≈ 13 років — відкладено:</tspan><tspan x="476.0" dy="15.6">не міг довести, що куля</tspan><tspan x="476.0" dy="15.6">тягне як точка в центрі</tspan></text>
<circle cx="300.0" cy="272.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="278.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1679–80</text>
<text x="326.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">Листи Гука: здогад про 1/r²</tspan><tspan x="326.0" dy="16.0">— без доведення.</tspan></text>
<circle cx="300.0" cy="338.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="278.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">січень 1684</text>
<text x="326.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">Кав'ярня: Галлей, Рен, Гук.</tspan><tspan x="326.0" dy="16.0">Рен ставить заклад на доведення.</tspan></text>
<circle cx="300.0" cy="400.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="278.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">серпень 1684</text>
<text x="326.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">Галлей у Ньютона: «Який шлях планети?»</tspan><tspan x="326.0" dy="16.0">— «Еліпс. Я вже це порахував.»</tspan></text>
<circle cx="300.0" cy="460.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="278.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">листопад 1684</text>
<text x="326.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">«De motu corporum in gyrum» —</tspan><tspan x="326.0" dy="16.0">дев'ять сторінок для Галлея.</tspan></text>
<circle cx="300.0" cy="516.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="278.0" y="521.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1685</text>
<text x="326.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">Радіус Пікара + теорема про кулю:</tspan><tspan x="326.0" dy="16.0">тепер збіг стає точним.</tspan></text>
<circle cx="300.0" cy="568.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="278.0" y="573.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1687</text>
<text x="326.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="326.0" dy="0.0">«Начала» виходять — коштом Галлея.</tspan></text>
</svg>