<text x="430.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вид згори — коромисло на нитці, малі кульки на кінцях, великі кулі підводять збоку</text>
