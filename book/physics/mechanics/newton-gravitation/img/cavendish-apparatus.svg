<text x="252.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">велика куля  M ≈ 158 кг (свинець)</text>
<text x="648.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">M ≈ 158 кг</text>
<text x="312.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-style="italic">тяг F</text>
<rect x="144.7" y="444.6" width="570.6" height="50.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="430.0" y="466.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Тяг спрямований горизонтально, впоперек нитки — тож вертикальне тяжіння Землі</tspan><tspan x="430.0" dy="16.2">лише тримає коромисло на вазі й виміру не заважає; кут θ і є мірою сили.</tspan></text>
