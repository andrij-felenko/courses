<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="400.0" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="370.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Бароклінна циркуляція морського бризу</text>
<rect x="40.0" y="240.0" width="320.0" height="100.0" rx="0" fill="#fef3c7" stroke="#fde047" stroke-width="1.5"/>
<text x="200.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700">СУХОДІЛ (теплий)
Висока T, мала густина ρ</text>
<rect x="360.0" y="240.0" width="340.0" height="100.0" rx="0" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
<text x="530.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#075985" text-anchor="middle" font-weight="700">МОРЕ (холодне)
Низька T, висока густина ρ</text>
<line x1="360.0" y1="240.0" x2="360.0" y2="340.0" stroke="#0284c7" stroke-width="2.0" stroke-dasharray="5,5"/>
<line x1="60.0" y1="90.0" x2="680.0" y2="90.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="75.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">p = 950 hPa (верхній рівень)</text>
<line x1="60.0" y1="230.0" x2="680.0" y2="230.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="75.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">p = 1013 hPa (поверхня)</text>
<line x1="120.0" y1="70.0" x2="580.0" y2="250.0" stroke="#2563eb" stroke-width="2.0"/>
<text x="585.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start">ρ = const (ізопікна)</text>
<line x1="360.0" y1="120.0" x2="360.0" y2="200.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="375.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">∇p (вертикальний)</text>
<line x1="260.0" y1="160.0" x2="440.0" y2="160.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="445.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">∇ρ (горизонтальний)</text>
<line x1="520.0" y1="215.0" x2="220.0" y2="215.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="370.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Поверхневий бриз (з моря на суходіл)</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="110.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="125.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Конвективний
підйом</text>
<line x1="220.0" y1="105.0" x2="520.0" y2="105.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="370.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Верхній зворотний потік</text>
<line x1="560.0" y1="110.0" x2="560.0" y2="200.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="620.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Опускання
повітря</text>
<rect x="107.5" y="353.0" width="525.0" height="24.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="370.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle"><tspan x="370.0" dy="0.0">Соленоїдальний момент τ = (∇ρ × ∇p) / ρ² прискорює замкнену циркуляцію Г(t)</tspan></text>
</svg>