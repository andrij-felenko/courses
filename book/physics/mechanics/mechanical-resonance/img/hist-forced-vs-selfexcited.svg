<circle cx="657.0" cy="215.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="657.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<rect x="501.8" y="370.4" width="306.4" height="43.3" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.2"/><text x="655.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">рух САМ породжує силу, що штовхає в такт руху:</tspan><tspan x="655.0" dy="14.3">від'ємне загасання, енергія з рівного джерела</tspan></text>
</svg>