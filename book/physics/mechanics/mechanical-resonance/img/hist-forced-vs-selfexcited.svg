<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 900 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="900" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому «резонанс» — це не одне явище</text>
<line x1="440.0" y1="52.0" x2="440.0" y2="452.0" stroke="#333333" stroke-width="1.1" stroke-dasharray="3,7"/>
<text x="225.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Вимушений резонанс</text>
<text x="225.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">приклад: солдати в ногу</text>
<rect x="146.6" y="118.4" width="156.8" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="225.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">зовнішній двигун</tspan><tspan x="225.0" dy="15.6">F₀·cos(ω t)</tspan><tspan x="225.0" dy="15.6">частота ω — стороння</tspan></text>
<line x1="225.0" y1="187.0" x2="225.0" y2="249.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="243.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">штовхає</text>
<rect x="151.8" y="263.2" width="146.5" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="225.0" y="283.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">система (міст)</tspan><tspan x="225.0" dy="15.6">власна частота ω₀</tspan></text>
<rect x="131.4" y="370.4" width="187.3" height="43.3" rx="6" fill="#f7f7f7" stroke="#333333" stroke-width="1.2"/><text x="225.0" y="388.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">сплеск ЛИШЕ коли ω ≈ ω₀</tspan><tspan x="225.0" dy="14.3">прибери ту частоту — зникне</tspan></text>
<text x="655.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Самозбудні коливання</text>
<text x="655.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">приклад: флатер Такоми, юрба Міленіуму</text>
<rect x="497.9" y="191.2" width="124.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="560.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">система (міст)</tspan><tspan x="560.0" dy="15.6">рух x(t)</tspan></text>
<rect x="693.9" y="191.2" width="136.3" height="47.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="762.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="762.0" dy="0.0">рівне джерело</tspan><tspan x="762.0" dy="15.6">вітер / крок юрби</tspan></text>
<text x="657.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">зв'язок</text>
