<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 859.24 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="859.24" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехід від лінійного закону Дарсі до режиму Форхгеймера</text>
<line x1="100.0" y1="380.0" x2="740.0" y2="380.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="755.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">швидкість vⲇ</text>
<line x1="100.0" y1="380.0" x2="100.0" y2="80.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="100.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">перепад тиску −∇p</text>
<line x1="100.0" y1="380.0" x2="340.0" y2="240.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="260.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Закон Дарсі (лінійний)</text>
<text x="260.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">−∇p = (μ / k) vⲇ</text>
<line x1="340.0" y1="240.0" x2="600.0" y2="90.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<path d="M 100,380 Q 340,240 620,80" fill="none" stroke="#c0392b" stroke-width="2.8"/>
<text x="490.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Режим Форхгеймера (нелінійний)</text>
<text x="490.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">−∇p = (μ / k) vⲇ + β ρ vⲇ²</text>
<line x1="340.0" y1="380.0" x2="340.0" y2="80.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="340.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Reₚ ≈ 1...10</text>
<text x="340.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(критичне число)</text>
<rect x="120.0" y="100.0" width="180.0" height="45.0" rx="6" fill="#eef9f2" stroke="#27ae60" stroke-width="1.0"/>
<text x="210.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Ламінарний режим
(в'язке тертя панує)</text>
<rect x="420.0" y="310.0" width="240.0" height="45.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.0"/>
<text x="540.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Турбулентно-інерційний режим
(вихори у порах гальмують потік)</text>
</svg>