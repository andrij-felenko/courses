<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двісті років навколо одного запитання: у якому степені радіус?</text>
<line x1="176.0" y1="52.0" x2="176.0" y2="588.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="206.0" y="56.0" width="660.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<circle cx="176.0" cy="82.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="152.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1685</text>
<text x="222.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Роберт Гук</text>
<text x="222.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">причина — опора вгинається, а частина деформації не повертається</text>
<rect x="206.0" y="124.0" width="660.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="176.0" cy="150.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="152.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1781</text>
<text x="222.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Шарль-Оґюстен де Кулон</text>
<text x="222.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">циліндри по дубовій дошці: опір ∝ навантаженню й ∝ 1/діаметр</text>
<rect x="206.0" y="192.0" width="660.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<circle cx="176.0" cy="218.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="152.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1831–1834</text>
<text x="222.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Артюр Морен</text>
<text x="222.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">динамометр у Меці: закони тертя підтверджено, Кулон стає каноном</text>
<rect x="206.0" y="260.0" width="660.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="176.0" cy="286.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="152.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1837</text>
<text x="222.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Жуль Дюпюї</text>
<text x="222.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тяга возів на дорогах: опір ∝ 1/√діаметр, полеміка з Мореном</text>
<rect x="206.0" y="328.0" width="660.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<circle cx="176.0" cy="354.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="152.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1876</text>
<text x="222.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Осборн Рейнольдс</text>
<text x="222.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">винне мікропроковзування всередині плями дотику</text>
<rect x="206.0" y="396.0" width="660.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<circle cx="176.0" cy="422.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="152.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1882</text>
<text x="222.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Генріх Герц</text>
<text x="222.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">теорія пружного контакту: розмір плями a ∝ √(N·R/E)</text>
<rect x="206.0" y="464.0" width="660.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<circle cx="176.0" cy="490.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="152.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1955</text>
<text x="222.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Девід Тейбор</text>
<text x="222.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">проковзування замало — губить енергію гістерезис у товщі</text>
<rect x="206.0" y="532.0" width="660.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<circle cx="176.0" cy="558.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="152.0" y="563.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">2021</text>
<text x="222.0" y="554.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">євромітка, ISO 28580</text>
<text x="222.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">C_rr не виводять із радіуса, а міряють шину на барабані</text>
