<line x1="498.0" y1="210.0" x2="531.9" y2="210.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="533.9" y="193.5" width="52.2" height="33.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="560.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">кінь</tspan></text>
