<text x="140.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">2.4 оберти</tspan><tspan x="140.0" dy="16.9">за хвилину</tspan></text>
<rect x="169.9" y="391.6" width="420.1" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">шлях коня за хвилину:  s = 2.4 · 2π · 12 ≈ 181 фут</tspan><tspan x="380.0" dy="16.9">робота за хвилину:  180 · 181 ≈ 32 572 фут·фунта</tspan><tspan x="380.0" dy="16.9">Ватт округлив: 33 000 фут·фунтів/хв = 550 фут·фунтів/с</tspan></text>
