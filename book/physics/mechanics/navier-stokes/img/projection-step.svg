<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1000.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок методу проєкції: розщепити на предиктор і корекцію</text>
<circle cx="70.0" cy="150.0" r="30.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="70.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">vₙ</text><text x="70.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">∇·v = 0</text>
<rect x="142.2" y="121.9" width="145.5" height="56.2" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="215.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Предиктор</tspan><tspan x="215.0" dy="18.2">−(v·∇)v + ν∇²v</tspan></text>
<text x="215.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">тиск ігноруємо</text>
<circle cx="360.0" cy="150.0" r="30.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="360.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">v*</text><text x="360.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">∇·v ≠ 0</text>
<rect x="444.2" y="121.9" width="171.6" height="56.2" rx="6" fill="#e6f6f4" stroke="#0b7a75" stroke-width="1.8"/><text x="530.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Пуассон</tspan><tspan x="530.0" dy="18.2">∇²p = (ρ/Δt)·∇·v*</tspan></text>
<rect x="634.9" y="121.9" width="180.2" height="56.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="725.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Корекція</tspan><tspan x="725.0" dy="18.2">v = v* − (Δt/ρ)·∇p</tspan></text>
<circle cx="895.0" cy="150.0" r="30.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/><text x="895.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">vₙ₊₁</text><text x="895.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">∇·v = 0</text>
