<line x1="392.0" y1="150.0" x2="442.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2"/><path d="M 442.0 150.0 L 431.0 155.5 L 431.0 144.5 z" fill="#1a1a1a"/>
<line x1="620.0" y1="150.0" x2="638.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2"/><path d="M 638.0 150.0 L 627.0 155.5 L 627.0 144.5 z" fill="#1a1a1a"/>
<line x1="812.0" y1="150.0" x2="862.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2"/><path d="M 862.0 150.0 L 851.0 155.5 L 851.0 144.5 z" fill="#1a1a1a"/>
<text x="500.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">три гравці одного кроку</text>
<rect x="168.9" y="275.2" width="162.3" height="33.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="250.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">конвекція  (v·∇)v</tspan></text>
<rect x="427.2" y="275.2" width="145.6" height="33.5" rx="6" fill="#f3ecfb" stroke="#7a1f9e" stroke-width="1.6"/><text x="500.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">в'язкість  ν∇²v</tspan></text>
<rect x="645.4" y="275.2" width="229.2" height="33.5" rx="6" fill="#e6f6f4" stroke="#0b7a75" stroke-width="1.6"/><text x="760.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">тиск: проєкція на ∇·v = 0</tspan></text>
<rect x="158.3" y="353.5" width="683.5" height="37.0" rx="6" fill="#fff8e6" stroke="#b5651d" stroke-width="1.5"/><text x="500.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Гельмгольц — Ходж:  поле = (∇p-частина) + (бездивергентна);  проєкція відкидає ∇p-частину</tspan></text>
</svg>