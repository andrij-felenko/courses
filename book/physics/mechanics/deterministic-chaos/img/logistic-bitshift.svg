<rect x="130.7" y="338.8" width="618.5" height="78.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="440.0" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Заміна x = sin²(π·θ) перетворює логістичне відображення на подвоєння числа θ, а подвоєння</tspan><tspan x="440.0" dy="15.0">у двійковому записі — це просто зсув: щокроку старший біт вилітає, а на його місце виходить</tspan><tspan x="440.0" dy="15.0">наступний. Різниця 10⁻⁹ між стартами сидить аж у 31-му біті — тож тридцять кроків обидві</tspan><tspan x="440.0" dy="15.0">орбіти читають ту саму стрічку, цифра в цифру.</tspan></text>
