<rect x="90.9" y="552.3" width="638.2" height="63.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="573.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Угорі — обидві орбіти: майже тридцять кроків точки лягають одна на одну, тоді розлітаються.</tspan><tspan x="410.0" dy="15.0">Внизу — відстань між ними в лог-шкалі: вона йде вздовж сірої прямої «×2 за крок» (окремі кроки</tspan><tspan x="410.0" dy="15.0">стискають розрив, середнє — ні) і впирається в стелю, бо далі розходитися просто нікуди.</tspan></text>
