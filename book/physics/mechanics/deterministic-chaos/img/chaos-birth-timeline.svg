<text x="231.0" y="662.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Олександр Шарковський, Київ · Лі й Йорк</text>
<text x="231.0" y="681.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">порядок періодів; слово «хаос» входить у математику</text>
