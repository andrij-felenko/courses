<circle cx="186.0" cy="326.0" r="5.4" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<line x1="193.0" y1="326.0" x2="218.0" y2="326.0" stroke="#c9ced6" stroke-width="1.4"/>
<text x="231.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Жак Адамар</text>
<text x="231.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перший чистий приклад: геодезичні на сідлоподібній поверхні</text>
