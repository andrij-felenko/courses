<rect x="218.0" y="437.0" width="382.2" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="186.0" cy="462.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<line x1="193.0" y1="462.0" x2="218.0" y2="462.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="231.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">72 роки думка не ставала наукою</text>
<text x="231.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c4a42" text-anchor="start">порахувати довгу траєкторію просто не було на чому</text>
