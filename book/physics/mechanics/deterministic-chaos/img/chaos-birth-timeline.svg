<line x1="193.0" y1="734.0" x2="218.0" y2="734.0" stroke="#c9ced6" stroke-width="1.4"/>
<text x="231.0" y="730.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Рюель і Такенс · Мей · Фейгенбаум</text>
<text x="231.0" y="749.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«дивний атрактор», логістичне відображення, універсальність</text>
