<circle cx="186.0" cy="530.0" r="5.4" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<line x1="193.0" y1="530.0" x2="218.0" y2="530.0" stroke="#c9ced6" stroke-width="1.4"/>
<text x="231.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Едвард Лоренц · Йосісуке Уеда</text>
<text x="231.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">машина крутить рівняння тисячі разів — розбіжність видно на око</text>
