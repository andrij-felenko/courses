<text x="170.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1889</text>
<rect x="218.0" y="233.0" width="332.4" height="50.0" rx="6" fill="#fcfcfd" stroke="#e4e7eb" stroke-width="1.3"/>
<circle cx="186.0" cy="258.0" r="5.4" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<line x1="193.0" y1="258.0" x2="218.0" y2="258.0" stroke="#c9ced6" stroke-width="1.4"/>
<text x="231.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Олександр Ляпунов, Харків</text>
<text x="231.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">показник, яким міряють швидкість розбігання</text>
