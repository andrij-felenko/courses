<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нормальна сила з однієї проєкції: куди дивиться нормаль і що дозволяє в'язь</text>
<text x="280.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">геометрія: кут нормалі β</text>
<path d="M 100.0 398.0 L 460.0 398.0 L 460.0 190.0 Z" fill="#eef1f4" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M 276.2 237.3 L 301.2 280.6 L 257.8 305.6 L 232.8 262.3 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="267.0" y1="271.5" x2="267.0" y2="156.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,4"/>
<line x1="267.0" y1="271.5" x2="208.0" y2="169.3" stroke="#1a1a1a" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="196.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">N · n̂</text>
<line x1="267.0" y1="271.5" x2="267.0" y2="363.5" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="287.0" y="368.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">m·g</text>
<path d="M 228.0 203.9 L 229.5 203.1 L 231.0 202.3 L 232.5 201.5 L 234.0 200.8 L 235.6 200.1 L 237.2 199.4 L 238.7 198.8 L 240.3 198.2 L 241.9 197.6 L 243.5 197.1 L 245.2 196.6 L 246.8 196.1 L 248.5 195.7 L 250.1 195.3 L 251.8 195.0 L 253.5 194.7 L 255.1 194.4 L 256.8 194.2 L 258.5 193.9 L 260.2 193.8 L 261.9 193.7 L 263.6 193.6 L 265.3 193.5 L 267.0 193.5" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="242.2" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">β</text>
<text x="280.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">β — кут між нормаллю та прямовисною</text>
<text x="784.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">яке a⊥ допускає в'язь</text>
<rect x="560.0" y="92.0" width="448.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="784.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="784.0" dy="0.0">нерухома пряма опора</tspan><tspan x="784.0" dy="18.9">a⊥ = 0</tspan></text>
<rect x="560.0" y="180.0" width="448.0" height="72.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="784.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="784.0" dy="0.0">опора йде з прискоренням a вздовж нормалі</tspan><tspan x="784.0" dy="18.9">a⊥ = a</tspan></text>
<rect x="560.0" y="268.0" width="448.0" height="94.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="784.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="784.0" dy="0.0">крива опора: швидкість v, радіус кривини R</tspan><tspan x="784.0" dy="18.9">центр кривини з боку нормалі:  a⊥ = +v²/R</tspan><tspan x="784.0" dy="18.9">з протилежного боку:  a⊥ = −v²/R</tspan></text>
<rect x="328.7" y="455.0" width="382.6" height="50.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="520.0" y="487.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">N = m · ( a⊥ + g · cos β )</tspan></text>
</svg>