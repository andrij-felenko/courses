<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">На схилі у поверхню вдавлює лише перпендикулярна частина ваги</text>
<path d="M 150.0 402.0 L 772.0 402.0 L 772.0 150.0 Z" fill="#eef1f4" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M 458.6 212.4 L 478.9 262.5 L 428.9 282.8 L 408.6 232.7 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="443.7" y1="247.6" x2="443.7" y2="379.6" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="443.7" y="401.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">вага  mg</text>
<line x1="443.7" y1="247.6" x2="397.8" y2="266.2" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="397.8" y1="266.2" x2="443.7" y2="379.6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="385.8" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">mg·sinθ</text>
<text x="385.8" y="303.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">котить униз</text>
<line x1="443.7" y1="247.6" x2="489.7" y2="361.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="489.7" y1="361.0" x2="443.7" y2="379.6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="505.7" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">mg·cosθ</text>
<text x="505.7" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вдавлює</text>
<line x1="443.7" y1="247.6" x2="397.8" y2="134.2" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="389.8" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">N = mg·cosθ</text>
<path d="M 220.0 402.0 A 70 70 0 0 0 214.9 375.7" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="230.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ</text>
<rect x="223.3" y="456.5" width="493.4" height="55.1" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">у поверхню тисне лише mg·cosθ → N = mg·cosθ, менша за вагу;</tspan><tspan x="470.0" dy="17.6">чим крутіший схил, тим менша N (до нуля на прямовисній стіні)</tspan></text>
</svg>