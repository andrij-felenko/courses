<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1020" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="1020" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три століття питання «чому тверде не проходить крізь тверде»</text>
<line x1="258.0" y1="78.0" x2="258.0" y2="986.0" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 7"/>
<text x="228.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1687</text>
<circle cx="258.0" cy="122.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="89.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="117.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Ісаак Ньютон, «Начала»</tspan><tspan x="654.0" dy="18.2">непроникність оголошено первинною властивістю тіл</tspan></text>
<text x="228.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1758</text>
<circle cx="258.0" cy="204.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="171.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="199.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Руджер Бошкович, «Теорія натуральної філософії»</tspan><tspan x="654.0" dy="18.2">дотику немає: відсіч росте без меж, тіла не стикаються</tspan></text>
<text x="228.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1842</text>
<circle cx="258.0" cy="286.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="253.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="281.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Семюел Ерншоу</tspan><tspan x="654.0" dy="18.2">самі кулонівські сили не дають стійкої рівноваги</tspan></text>
<text x="228.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1873</text>
<circle cx="258.0" cy="368.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="335.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="363.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Йоганнес ван дер Ваальс</tspan><tspan x="654.0" dy="18.2">тверду серцевину молекули вставлено в теорію руками</tspan></text>
<text x="228.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1911</text>
<circle cx="258.0" cy="450.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="417.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="445.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Ернест Резерфорд</tspan><tspan x="654.0" dy="18.2">атом майже порожній — а речовина далі непроникна</tspan></text>
<text x="228.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1913–1927</text>
<circle cx="258.0" cy="532.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="499.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="527.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Нільс Бор, Вернер Гайзенберг</tspan><tspan x="654.0" dy="18.2">невизначеність дає атомові розмір, але не дає твердості</tspan></text>
<text x="228.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1925</text>
<circle cx="258.0" cy="614.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="581.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="609.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Вольфганг Паулі</tspan><tspan x="654.0" dy="18.2">заборона на однаковий стан; ішлося про спектри, не твердість</tspan></text>
<text x="228.0" y="702.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1926</text>
<circle cx="258.0" cy="696.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="663.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="691.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Енріко Фермі, Поль Дірак, Ральф Фаулер</tspan><tspan x="654.0" dy="18.2">заборона обертається тиском: він тримає білого карлика</tspan></text>
<text x="228.0" y="784.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1931</text>
<circle cx="258.0" cy="778.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="745.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="773.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Пауль Еренфест</tspan><tspan x="654.0" dy="18.2">питання названо прямо: чому камінь такий об'ємистий?</tspan></text>
<text x="228.0" y="866.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1967</text>
<circle cx="258.0" cy="860.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="827.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="855.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Фрімен Дайсон і Ендрю Ленард</tspan><tspan x="654.0" dy="18.2">доведено: з ферміонами E ≥ −C·N, з бозонами — колапс</tspan></text>
<text x="228.0" y="948.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1975</text>
<circle cx="258.0" cy="942.0" r="8.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="284.0" y="909.0" width="740.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="654.0" y="937.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="654.0" dy="0.0">Елліотт Ліб і Вальтер Тіррінг</tspan><tspan x="654.0" dy="18.2">коротке доведення; стала падає з 10¹⁴ приблизно до 5</tspan></text>
</svg>