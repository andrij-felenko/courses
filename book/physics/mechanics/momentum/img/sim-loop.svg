<rect x="184.8" y="472.5" width="570.3" height="35.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.3"/><text x="470.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Кадр лише перекладає рух між тілами — не додає й не забирає його з системи</tspan></text>
