<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один кадр симулятора: чотири такти по колу, а Σp у центрі стоїть</text>
<rect x="126.0" y="147.0" width="258.0" height="84.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.8"/><text x="255.0" y="185.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">1 · Пролетіти крок Δt</tspan><tspan x="255.0" dy="16.9">x += v·Δt — вільний рух</tspan></text>
<rect x="556.0" y="147.0" width="258.0" height="84.0" rx="6" fill="#f7f9fc" stroke="#27ae60" stroke-width="1.8"/><text x="685.0" y="185.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">2 · Знайти дотик</tspan><tspan x="685.0" dy="16.9">хто кого торкнувся</tspan></text>
<rect x="556.0" y="339.0" width="258.0" height="84.0" rx="6" fill="#f7f9fc" stroke="#c0392b" stroke-width="1.8"/><text x="685.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">3 · Розв'язати удар</tspan><tspan x="685.0" dy="16.9">імпульс + e → нові v</tspan></text>
<rect x="126.0" y="339.0" width="258.0" height="84.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.8"/><text x="255.0" y="377.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">4 · Звірити Σp</tspan><tspan x="255.0" dy="16.9">має бути той самий</tspan></text>
