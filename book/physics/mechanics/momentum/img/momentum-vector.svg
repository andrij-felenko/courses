<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпульс p = m·v: різні маса й швидкість — той самий запас руху</text>
<rect x="90.0" y="117.0" width="96.0" height="66.0" rx="7" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="138.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">m</text>
<text x="120.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">важке, повільне</text>
<line x1="250.0" y1="120.0" x2="292.0" y2="120.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="304.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">v = 2 м/с</text>
<line x1="250.0" y1="172.0" x2="400.0" y2="172.0" stroke="#2457d6" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="412.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">p = 12 кг·м/с</text>
<circle cx="120.0" cy="300.0" r="24.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="120.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">m</text>
<text x="120.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">легке, швидке</text>
<line x1="250.0" y1="270.0" x2="426.0" y2="270.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="438.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">v = 12 м/с</text>
<line x1="250.0" y1="322.0" x2="400.0" y2="322.0" stroke="#2457d6" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="412.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">p = 12 кг·м/с</text>
<rect x="104.8" y="388.5" width="610.4" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="410.0" y="410.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">6 кг · 2 м/с  =  1 кг · 12 м/с  =  12 кг·м/с   —   однаково важко спинити</tspan></text>
</svg>