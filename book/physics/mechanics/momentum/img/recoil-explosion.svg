<text x="581.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">p₃</text>
<circle cx="620.0" cy="300.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="616.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">старт = фініш</text>
<rect x="129.5" y="422.0" width="620.9" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="440.0" y="444.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">p₁ + p₂ + p₃ = 0     трикутник замикається — збереження по кожній осі</tspan></text>
</svg>