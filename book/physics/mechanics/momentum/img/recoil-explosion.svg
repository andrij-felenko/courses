<line x1="620.0" y1="300.0" x2="782.0" y2="194.7" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="720.7" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">p₁</text>
