<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="580.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тонка стіна й швидке тіло: фіксований крок промахується, подієвий — ні</text>
<text x="480.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наївний крок: за один Δt тіло перестрибує стіну — перекриття ніхто не бачить</text>
<line x1="80.0" y1="185.0" x2="880.0" y2="185.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="540.0" y="139.0" width="10.0" height="92.0" rx="2" fill="#f1d9d4" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="545.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">стіна</text>
<text x="483.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">стрибок  v·Δt  &gt;  товщина стіни</text>
<line x1="177.0" y1="185.0" x2="813.0" y2="185.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<circle cx="155.0" cy="185.0" r="17.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="155.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">t = n</text>
<circle cx="835.0" cy="185.0" r="17.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/>
<text x="835.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">t = n+1</text>
<line x1="60.0" y1="320.0" x2="900.0" y2="320.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 6"/>
<text x="480.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Подієвий крок: рахуємо мить дотику t* і спиняємо світ рівно на ній</text>
<line x1="80.0" y1="470.0" x2="880.0" y2="470.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="540.0" y="424.0" width="10.0" height="92.0" rx="2" fill="#f1d9d4" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="545.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">стіна</text>
<text x="320.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">адванс до t*</text>
<line x1="177.0" y1="470.0" x2="519.0" y2="470.0" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<circle cx="155.0" cy="470.0" r="17.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="155.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">t = n</text>
<circle cx="522.0" cy="470.0" r="17.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="522.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">t*</text>
<line x1="499.0" y1="498.0" x2="335.0" y2="498.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="417.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">розв'язали удар — відскок</text>
</svg>