<rect x="53.7" y="412.5" width="792.6" height="35.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.3"/><text x="450.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Як число «руху» — вдвічі більше за нуль; як вектор — рівно нуль. Цю різницю в напрямі й проґавив Декарт.</tspan></text>
