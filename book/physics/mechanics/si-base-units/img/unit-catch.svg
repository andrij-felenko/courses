<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1040.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де спиняється сплутана одиниця — залежно від підходу</text>
<text x="205.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">написано</text>
<text x="430.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">КОМПІЛЯЦІЯ</text>
<text x="650.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ВИКОНАННЯ (у польоті)</text>
<text x="897.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">НАСЛІДОК</text>
<line x1="430.0" y1="74.0" x2="430.0" y2="92.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="650.0" y1="74.0" x2="650.0" y2="92.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="14.0" y="125.0" width="188.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="108.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="108.0" dy="0.0">голий double</tspan><tspan x="108.0" dy="16.9">(без одиниці)</tspan></text>
<line x1="205.0" y1="155.0" x2="762.0" y2="155.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="772.0" y="125.0" width="252.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="898.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="898.0" dy="0.0">Марс: періапсида 57 км</tspan><tspan x="898.0" dy="16.9">замість 226 — зонд згоряє</tspan></text>
<rect x="14.0" y="225.0" width="188.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="108.0" y="251.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="108.0" dy="0.0">pint · одиниця в даних</tspan><tspan x="108.0" dy="15.6">(рантайм)</tspan></text>
<line x1="205.0" y1="255.0" x2="650.0" y2="255.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="646.0" y="231.0" width="8.0" height="48.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<rect x="572.3" y="196.0" width="155.4" height="26.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="650.0" y="213.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">DimensionalityError</tspan></text>
<line x1="656.0" y1="255.0" x2="762.0" y2="255.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="772.0" y="225.0" width="252.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="898.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="898.0" dy="0.0">спіймано —</tspan><tspan x="898.0" dy="16.9">але вже в польоті</tspan></text>
<rect x="14.0" y="325.0" width="188.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="108.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="108.0" dy="0.0">одиниця в типі</tspan><tspan x="108.0" dy="16.9">(newtype / показники)</tspan></text>
<line x1="205.0" y1="355.0" x2="430.0" y2="355.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="426.0" y="331.0" width="8.0" height="48.0" rx="2" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<rect x="367.2" y="296.0" width="125.6" height="26.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="430.0" y="313.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">не компілюється</tspan></text>
<line x1="436.0" y1="355.0" x2="762.0" y2="355.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="772.0" y="325.0" width="252.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/><text x="898.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="898.0" dy="0.0">спинено до запуску —</tspan><tspan x="898.0" dy="16.9">правка за секунди</tspan></text>
<text x="520.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Що раніший рубіж лову — то дешевша ціна помилки.</text>
</svg>