<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="452.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="400.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розмірності пришпилюють показники: маятник</text>
<rect x="165.8" y="61.0" width="468.4" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="400.0" y="85.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">T = C · ℓᵃ · mᵇ · gᶜ        (шукаємо a, b, c)</tspan></text>
<text x="400.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">де [ℓ]=L,  [m]=M,  [g]=L·T⁻²  — і показники мусять збігтися:</text>
<rect x="70.0" y="152.0" width="660.0" height="54.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.3"/><text x="400.0" y="184.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">M :   0 = b            →   b = 0     (маса випадає)</tspan></text>
<rect x="70.0" y="218.0" width="660.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="400.0" y="250.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">T :   1 = −2c          →   c = −½</tspan></text>
<rect x="70.0" y="284.0" width="660.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="400.0" y="316.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">L :   0 = a + c        →   a = +½</tspan></text>
<rect x="263.2" y="383.0" width="273.5" height="50.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="400.0" y="415.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">T = C · √( ℓ / g )</tspan></text>
</svg>