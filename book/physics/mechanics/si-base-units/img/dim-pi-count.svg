<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки безрозмірних комбінацій — стільки й невизначеності</text>
<rect x="40.0" y="66.0" width="410.0" height="300.0" rx="10" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.4"/>
<rect x="60.0" y="82.0" width="370.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/><text x="245.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Маятник:  T, ℓ, m, g</tspan></text>
<text x="245.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">величин із розмірністю   n = 4</text>
<text x="245.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">базових розмірностей     k = 3</text>
<text x="245.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">n − k = 1  безрозмірна група</text>
<text x="245.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">π₁ = T·√(g/ℓ) = стала</text>
<rect x="132.6" y="311.0" width="224.9" height="42.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.7"/><text x="245.0" y="338.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">T = √(ℓ/g) · стала</tspan></text>
<rect x="490.0" y="66.0" width="410.0" height="300.0" rx="10" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.4"/>
<rect x="510.0" y="82.0" width="370.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/><text x="695.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Додаємо амплітуду θ (безрозмірна)</tspan></text>
<text x="695.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">π₁ = T·√(g/ℓ)      π₂ = θ</text>
<text x="695.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">груп тепер дві</text>
<text x="695.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 групи → π₁ = f(π₂)</text>
<text x="695.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">f — розмірностям не видна</text>
<rect x="588.1" y="311.0" width="213.7" height="42.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.7"/><text x="695.0" y="338.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">T = √(ℓ/g) · f(θ)</tspan></text>
<text x="470.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">одна група → відповідь з точністю до сталої;   більше груп → невизначена функція</text>
</svg>