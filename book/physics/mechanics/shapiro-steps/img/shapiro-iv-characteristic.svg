<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="850" height="460" style="background-color: #1e1e2e; font-family: system-ui, -apple-system, sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#a6adc8" />
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f38ba8" />
  </marker>
</defs>
<rect x="15" y="15" width="820" height="430" rx="12" fill="#181825" stroke="#313244" stroke-width="2" />
<text x="425" y="45" fill="#cdd6f4" font-size="20" font-weight="bold" text-anchor="middle">Вольт-амперна характеристика з квантованими сходинками Шапіро</text>
<path d="M 160 375 L 780 375" stroke="#a6adc8" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M 160 375 L 160 70" stroke="#a6adc8" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="790" y="405" fill="#cdd6f4" font-size="14" font-weight="bold" text-anchor="end">Напруга ⟨V⟩</text>
<text x="150" y="55" fill="#cdd6f4" font-size="15" font-weight="bold" text-anchor="middle">Струм I_dc</text>
<path d="M 160 375 L 160 310 C 170 300 220 280 300 240 C 380 200 500 150 720 100" stroke="#585b70" stroke-width="2" stroke-dasharray="6,6" fill="none" />
<text x="630" y="140" fill="#6c7086" font-size="13">Без НВЧ випромінювання (I_ac = 0)</text>
<line x1="310" y1="70" x2="310" y2="375" stroke="#313244" stroke-width="1.5" stroke-dasharray="4,4" />
<line x1="470" y1="70" x2="470" y2="375" stroke="#313244" stroke-width="1.5" stroke-dasharray="4,4" />
<line x1="630" y1="70" x2="630" y2="375" stroke="#313244" stroke-width="1.5" stroke-dasharray="4,4" />
<text x="160" y="400" fill="#a6e3a1" font-size="13" font-weight="bold" text-anchor="middle">V = 0</text>
<text x="310" y="400" fill="#89dceb" font-size="13" font-weight="bold" text-anchor="middle">V₁ = ħ·ω_rf / 2e</text>
<text x="470" y="400" fill="#89dceb" font-size="13" font-weight="bold" text-anchor="middle">V₂ = 2·V₁</text>
<text x="630" y="400" fill="#89dceb" font-size="13" font-weight="bold" text-anchor="middle">V₃ = 3·V₁</text>
<path d="M 160 375 L 160 290 C 190 285 280 265 310 260 L 310 200 C 340 195 440 185 470 180 L 470 130 C 500 125 600 120 630 115 L 630 80" stroke="#89dceb" stroke-width="3.5" fill="none" />
<line x1="295" y1="200" x2="295" y2="260" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
<text x="285" y="235" fill="#f9e2af" font-size="13" font-weight="bold" text-anchor="end">Ширина сходинки ΔI₁</text>
<text x="148" y="335" fill="#a6e3a1" font-size="14" font-weight="bold" text-anchor="end">n = 0</text>
<text x="322" y="235" fill="#89dceb" font-size="14" font-weight="bold">n = 1</text>
<text x="482" y="155" fill="#89dceb" font-size="14" font-weight="bold">n = 2</text>
<text x="642" y="100" fill="#89dceb" font-size="14" font-weight="bold">n = 3</text>
<rect x="520" y="170" width="290" height="80" rx="8" fill="#313244" stroke="#45475a" />
<text x="665" y="195" fill="#f5e0dc" font-size="14" font-weight="bold" text-anchor="middle">Квантування напруги Шапіро:</text>
<text x="665" y="225" fill="#89dceb" font-size="17" font-weight="bold" font-family="monospace" text-anchor="middle">V_n = n · (h · f_rf / 2e)</text>
</svg>