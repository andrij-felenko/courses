<text x="478.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">U</text>
<text x="194.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">t₁ &lt; t₂ &lt; t₃</text>
<rect x="566.0" y="92.0" width="404.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="768.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="768.0" dy="0.0">u(y, t) = U · erfc( y / (2·√(ν·t)) )</tspan></text>
<rect x="566.0" y="168.0" width="404.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="768.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="768.0" dy="0.0">Єдиний масштаб довжини в задачі — √(ν·t).</tspan><tspan x="768.0" dy="16.9">Тому профіль із часом лише РОЗТЯГУЄТЬСЯ,</tspan><tspan x="768.0" dy="16.9">не міняючи форми: рух проникає вглиб на</tspan><tspan x="768.0" dy="16.9">глибину  δ ~ √(ν·t).  Учетверо довше чекаєш —</tspan><tspan x="768.0" dy="16.9">лише вдвічі глибше проникло (t₂=4t₁ → δ₂=2δ₁).</tspan></text>
<rect x="566.0" y="288.0" width="404.0" height="96.0" rx="6" fill="#fff6e8" stroke="#e08e0b" stroke-width="1.5"/><text x="768.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="768.0" dy="0.0">за t = 1 с  (край δ ≈ 4·√(ν·t)):</tspan><tspan x="768.0" dy="16.9">• вода    ν = 1.0·10⁻⁶ м²/с  → δ ≈ 4 мм</tspan><tspan x="768.0" dy="16.9">• повітря  ν = 1.5·10⁻⁵ м²/с  → δ ≈ 1.6 см</tspan><tspan x="768.0" dy="16.9">• мед     ν ≈ 7·10⁻³ м²/с    → δ ≈ 0.3 м</tspan></text>
<rect x="566.0" y="400.0" width="404.0" height="72.0" rx="6" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.5"/><text x="768.0" y="424.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="768.0" dy="0.0">erfc спадає круто: при  y = 4·√(ν·t)  швидкість</tspan><tspan x="768.0" dy="16.2">уже &lt; 1 % від U — практичний край розігнаного</tspan><tspan x="768.0" dy="16.2">шару (у сталій течії це майбутній межовий шар).</tspan></text>
</svg>