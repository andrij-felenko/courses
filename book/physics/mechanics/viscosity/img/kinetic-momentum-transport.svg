<rect x="600.0" y="96.0" width="352.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="776.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="776.0" dy="0.0">потік імпульсу через площину:</tspan><tspan x="776.0" dy="18.2">τ = ⅓·ρ·v̄·λ · (du/dy)</tspan><tspan x="776.0" dy="18.2">⇒  μ = ⅓·ρ·v̄·λ</tspan><tspan x="776.0" dy="18.2">(строга кінетика: коеф. ≈ 0.49)</tspan></text>
