<rect x="0.0" y="0.0" width="980.0" height="500.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому енергія зберігається: однорідність часу</text>
