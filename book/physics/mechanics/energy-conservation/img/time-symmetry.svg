<text x="255.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">той самий дослід → той самий результат</text>
<rect x="95.0" y="360.0" width="320.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/><text x="255.0" y="379.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">закон не залежить від того, КОЛИ дивишся</tspan><tspan x="255.0" dy="16.9">⇒ повна енергія зберігається</tspan></text>
