<circle cx="880.0" cy="322.0" r="26.0" fill="none" stroke="#c0392b" stroke-width="4.0"/><line x1="861.5" y1="340.5" x2="898.5" y2="303.5" stroke="#c0392b" stroke-width="4.0"/>
<text x="880.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вічний двигун</text>
