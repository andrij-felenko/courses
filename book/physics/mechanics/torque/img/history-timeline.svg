<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 930" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="930" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="930.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від важеля до слова «torque»: понад дві тисячі років</text>
<line x1="182.0" y1="104.0" x2="182.0" y2="854.0" stroke="#6b7280" stroke-width="2.2"/>
<text x="156.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">прадавно</text>
<line x1="182.0" y1="128.0" x2="210.0" y2="128.0" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="182.0" cy="128.0" r="9.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.6"/>
<rect x="210.0" y="92.0" width="640.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="530.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Важіль, лом, шадуф, коромисло терезів — у щоденному вжитку.</tspan><tspan x="530.0" dy="18.2">Принцип знали з практики, без жодної теорії.</tspan></text>
<text x="156.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">≈330 до н.е.</text>
<line x1="182.0" y1="228.0" x2="210.0" y2="228.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="182.0" cy="228.0" r="9.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="210.0" y="192.0" width="640.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="530.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">«Механіка» школи Арістотеля: перший теоретичний опис —</tspan><tspan x="530.0" dy="18.2">важіль зводять до кола. Центра ваги ще немає.</tspan></text>
<text x="156.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">≈250 до н.е.</text>
<line x1="182.0" y1="328.0" x2="210.0" y2="328.0" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="182.0" cy="328.0" r="9.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.6"/>
<rect x="210.0" y="292.0" width="640.0" height="72.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="530.0" y="323.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Архімед, «Про рівновагу площин»: строге доведення закону</tspan><tspan x="530.0" dy="18.2">важеля через центр ваги. Правило стає теоремою.</tspan></text>
<text x="156.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">≈340 н.е.</text>
<line x1="182.0" y1="428.0" x2="210.0" y2="428.0" stroke="#6b7280" stroke-width="1.6"/>
<circle cx="182.0" cy="428.0" r="9.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.6"/>
<rect x="210.0" y="392.0" width="640.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="530.0" y="423.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Папп записує «дайте точку опори — і зрушу Землю».</tspan><tspan x="530.0" dy="18.2">Переказ через 500 років — легенда, не прямий доказ.</tspan></text>
<text x="156.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">XIII ст.</text>
<line x1="182.0" y1="528.0" x2="210.0" y2="528.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="182.0" cy="528.0" r="9.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="210.0" y="492.0" width="640.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="530.0" y="523.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">«Наука про ваги» (Йордан Неморарій): важіль через</tspan><tspan x="530.0" dy="18.2">уявні переміщення. Латина вживає momentum.</tspan></text>
<text x="156.0" y="633.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">≈1600</text>
<line x1="182.0" y1="628.0" x2="210.0" y2="628.0" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="182.0" cy="628.0" r="9.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="210.0" y="592.0" width="640.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="530.0" y="623.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Галілей робить momento терміном — статичний момент,</tspan><tspan x="530.0" dy="18.2">добуток ваги на відстань (M = F · d).</tspan></text>
<text x="156.0" y="733.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1811</text>
<line x1="182.0" y1="728.0" x2="210.0" y2="728.0" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="182.0" cy="728.0" r="9.0" fill="#eef2fb" stroke="#2457d6" stroke-width="2.6"/>
<rect x="210.0" y="692.0" width="640.0" height="72.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="530.0" y="723.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">«Момент сили» усталюється в механіці</tspan><tspan x="530.0" dy="18.2">(Пуассон, «Трактат з механіки»).</tspan></text>
<text x="156.0" y="833.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1884</text>
<line x1="182.0" y1="828.0" x2="210.0" y2="828.0" stroke="#c0392b" stroke-width="1.6"/>
<circle cx="182.0" cy="828.0" r="9.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<rect x="210.0" y="792.0" width="640.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="530.0" y="823.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Джеймс Томсон пропонує слово «torque»; того ж року</tspan><tspan x="530.0" dy="18.2">його вживає Сілванус Томпсон. Друге ім'я величини.</tspan></text>
</svg>