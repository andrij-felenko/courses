<rect x="119.9" y="418.0" width="560.2" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="400.0" y="440.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">rᵢ×fᵢⱼ + rⱼ×fⱼᵢ = (rᵢ − rⱼ)×fᵢⱼ = 0     (сила ∥ лінії центрів)</tspan></text>
