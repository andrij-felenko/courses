<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими витікання газу із сопла Лаваля залежно від протитиску P_amb</text>
<rect x="60.0" y="60.0" width="410.0" height="210.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.8"/>
<text x="72.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2980b9" text-anchor="start" font-weight="700">1. Дозвуковий режим (P_amb занадто високий)</text>
<path d="M 90,125 L 150,148 L 290,115" fill="none" stroke="#34495e" stroke-width="2"/>
<path d="M 90,195 L 150,172 L 290,205" fill="none" stroke="#34495e" stroke-width="2"/>
<line x1="100.0" y1="160.0" x2="270.0" y2="160.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="72.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Газ не досягає M=1 у горловині. Сопло працює як труба Вентурі.</text>
<text x="458.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="end" font-weight="700">M &lt; 1 усюди</text>
<rect x="490.0" y="60.0" width="410.0" height="210.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.8"/>
<text x="502.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">2. Перерозширений зі скачком усередині</text>
<path d="M 520,125 L 580,148 L 720,115" fill="none" stroke="#34495e" stroke-width="2"/>
<path d="M 520,195 L 580,172 L 720,205" fill="none" stroke="#34495e" stroke-width="2"/>
<line x1="530.0" y1="160.0" x2="630.0" y2="160.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="640.0" y1="138.0" x2="640.0" y2="182.0" stroke="#8e44ad" stroke-width="3.0"/>
<line x1="650.0" y1="160.0" x2="715.0" y2="160.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="502.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">У дифузорі виникає прямий скачок ущільнення. Потік за ним дозвуковий.</text>
<text x="888.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="end" font-weight="700">M &gt; 1 -&gt; Скачок -&gt; M &lt; 1</text>
<rect x="60.0" y="300.0" width="410.0" height="210.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="72.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">3. Розрахунковий режим (P_e = P_amb)</text>
<path d="M 90,365 L 150,388 L 290,355" fill="none" stroke="#34495e" stroke-width="2"/>
<path d="M 90,435 L 150,412 L 290,445" fill="none" stroke="#34495e" stroke-width="2"/>
<line x1="100.0" y1="400.0" x2="280.0" y2="400.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<rect x="290.0" y="358.0" width="120.0" height="84.0" rx="0" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.0"/>
<text x="72.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Повне ізоентропійне розширення. Гладкий надзвуковий струмінь на виході.</text>
<text x="458.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">M &gt; 1 на виході (ідеальний)</text>
<rect x="490.0" y="300.0" width="410.0" height="210.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.8"/>
<text x="502.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="start" font-weight="700">4. Недорозширений режим (P_e &gt; P_amb)</text>
<path d="M 520,365 L 580,388 L 720,355" fill="none" stroke="#34495e" stroke-width="2"/>
<path d="M 520,435 L 580,412 L 720,445" fill="none" stroke="#34495e" stroke-width="2"/>
<line x1="530.0" y1="400.0" x2="710.0" y2="400.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="720.0" y1="355.0" x2="800.0" y2="340.0" stroke="#d35400" stroke-width="2.0" stroke-dasharray="4,2"/>
<line x1="720.0" y1="445.0" x2="800.0" y2="460.0" stroke="#d35400" stroke-width="2.0" stroke-dasharray="4,2"/>
<text x="502.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Тиск на зрізі вищий за зовнішній. Розширення продовжується поза соплом.</text>
<text x="888.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="end" font-weight="700">Віяло Прандтля-Майєра</text>
</svg>