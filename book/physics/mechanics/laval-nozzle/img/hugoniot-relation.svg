<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="960" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок зміни перерізу та швидкості: співвідношення Гюгоньо</text>
<rect x="321.1" y="52.0" width="297.8" height="36.0" rx="6" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/><text x="470.0" y="75.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">dA / A = (M² - 1) · (du / u)</tspan></text>
<text x="240.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2980b9" text-anchor="middle" font-weight="700">Дозвуковий режим (M &lt; 1)</text>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">M² - 1 &lt; 0  =&gt;  знаки dA та du ПРОТИЛЕЖНІ</text>
<polygon points="90.0,185.0 390.0,210.0 390.0,250.0 90.0,275.0" fill="#ebf5fb" stroke="#2980b9" stroke-width="2"/>
