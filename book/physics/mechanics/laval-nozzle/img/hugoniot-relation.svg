<line x1="720.0" y1="230.0" x2="810.0" y2="230.0" stroke="#c0392b" stroke-width="3.8" marker-end="url(#arrow)"/>
<text x="700.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">du &gt; 0 (розгін)</text>
<rect x="605.1" y="290.2" width="189.8" height="39.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="700.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Розширення каналу (dA &gt; 0)</tspan><tspan x="700.0" dy="15.6">прискорює надзвуковий газ!</tspan></text>
<line x1="470.0" y1="115.0" x2="470.0" y2="410.0" stroke="#d5dbdb" stroke-width="1.2" stroke-dasharray="4,4"/>
