<line x1="260.0" y1="230.0" x2="340.0" y2="230.0" stroke="#2980b9" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="240.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">du &gt; 0 (розгін)</text>
<rect x="151.9" y="290.2" width="176.2" height="39.6" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.2"/><text x="240.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Звуження каналу (dA &lt; 0)</tspan><tspan x="240.0" dy="15.6">прискорює дозвуковий газ</tspan></text>
<text x="700.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Надзвуковий режим (M &gt; 1)</text>
<text x="700.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">M² - 1 &gt; 0  =&gt;  знаки dA та du ЗБІГАЮТЬСЯ</text>
