<rect x="45.4" y="515.2" width="829.1" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="460.0" y="536.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Задай одну функцію — потенціальну енергію від положення — і всі сили випливуть із неї як ухил місцевості з мапи висот.</tspan><tspan x="460.0" dy="15.6">Природа зсуває тіло до нижчого U: у долині (мінімумі) воно застигає стійко, на вершині (максимумі) тікає від поштовху.</tspan></text>
