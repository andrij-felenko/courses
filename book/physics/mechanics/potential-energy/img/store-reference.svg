<rect x="63.3" y="492.8" width="793.5" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="460.0" y="512.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Абсолютне значення U залежить від обраного нуля й саме собою нічого не означає — фізично проявляється лише різниця ΔU.</tspan><tspan x="460.0" dy="15.0">Для того самого спуску Δh вона однакова за будь-якого відліку, тож нуль ставлять там, де зручно рахувати.</tspan></text>
