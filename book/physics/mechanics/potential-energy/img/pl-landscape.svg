<rect x="195.7" y="549.6" width="548.7" height="80.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="470.0" y="570.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Одна функція U(x) задає весь краєвид: корені U′ дають три рівноваги (±1 і 0),</tspan><tspan x="470.0" dy="15.6">а знак U″ їх сортує — дно долин стійке, маківка хребта хиткa.</tspan><tspan x="470.0" dy="15.6">Рівень повної енергії вирішує долю руху: нижчий за бар'єр (E=−0.13) —</tspan><tspan x="470.0" dy="15.6">тіло гойдається в одній ямі; вищий (E=+0.15) — перелітає між обома.</tspan></text>
