<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1000.0" height="600.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки, що сходяться в назві «потенціальна енергія»</text>
<text x="500.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">слово «потенціальна» — від математики поля; слово «енергія» — від Аристотеля через фізику руху</text>
<text x="54.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Нитка МАТЕМАТИКИ — «потенціальна функція»</text>
<text x="54.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Нитка ЕНЕРГІЇ — актуальне / потенційне Аристотеля</text>
<rect x="50.0" y="128.0" width="200.0" height="58.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="150.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Лаґранж · 1773</tspan><tspan x="150.0" dy="16.2">функція тяжіння, без імені</tspan></text>
<rect x="300.0" y="128.0" width="200.0" height="58.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="400.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Ґрін · 1828</tspan><tspan x="400.0" dy="16.2">«потенціальна функція»</tspan></text>
<rect x="550.0" y="128.0" width="200.0" height="58.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="650.0" y="153.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Ґаусс 1840 · Томсон 1845</tspan><tspan x="650.0" dy="16.2">усталення назви</tspan></text>
<rect x="50.0" y="330.0" width="200.0" height="58.0" rx="6" fill="#eaf0fb" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Аристотель · ~350 до н.е.</tspan><tspan x="150.0" dy="16.2">dynamis / energeia</tspan></text>
<rect x="300.0" y="330.0" width="200.0" height="58.0" rx="6" fill="#eaf0fb" stroke="#2457d6" stroke-width="1.6"/><text x="400.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Ляйбніц · vis viva</tspan><tspan x="400.0" dy="16.2">«жива сила» ~ m·v²</tspan></text>
<rect x="550.0" y="330.0" width="200.0" height="58.0" rx="6" fill="#eaf0fb" stroke="#2457d6" stroke-width="1.6"/><text x="650.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Юнґ · 1807</tspan><tspan x="650.0" dy="16.2">слово «energy»</tspan></text>
<line x1="254.0" y1="157.0" x2="296.0" y2="157.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="254.0" y1="359.0" x2="296.0" y2="359.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="504.0" y1="157.0" x2="546.0" y2="157.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="504.0" y1="359.0" x2="546.0" y2="359.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="781.3" y="224.6" width="197.3" height="66.8" rx="6" fill="#fdf3e0" stroke="#b9770e" stroke-width="2.2"/><text x="880.0" y="245.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Ренкін · 1853</tspan><tspan x="880.0" dy="16.9">ПОТЕНЦІАЛЬНА ЕНЕРГІЯ</tspan><tspan x="880.0" dy="16.9">= енергія конфігурації</tspan></text>
<line x1="754.0" y1="163.0" x2="777.3" y2="240.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="754.0" y1="353.0" x2="777.3" y2="276.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="781.9" y="438.6" width="196.1" height="46.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="458.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Томсон і Тет · 1867</tspan><tspan x="880.0" dy="16.2">«актуальна» → «кінетична»</tspan></text>
<line x1="880.0" y1="294.4" x2="880.0" y2="435.6" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="67.2" y="536.8" width="865.6" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="500.0" y="556.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Обидві нитки тяглися нарізно: математики будували безіменну функцію поля, а «енергію» вивищив Юнґ із аристотелівської пари.</tspan><tspan x="500.0" dy="15.0">1853-го Ренкін звів їх в одну назву; 1867-го Томсон і Тет замінили Ренкінову «актуальну» на «кінетичну» — так терміни й застигли.</tspan></text>
</svg>