<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оператор ренормалізації T в функціональному просторі</text>
<rect x="57.4" y="126.6" width="205.2" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Вхідне відображення f(x)</tspan><tspan x="160.0" dy="16.9">з квадратичним максимумом</tspan><tspan x="160.0" dy="16.9">в точці x = 0</tspan></text>
<line x1="260.0" y1="160.0" x2="350.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="305.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Подвійна ітерація</text>
<text x="305.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">f(f(x))</text>
<rect x="337.4" y="126.6" width="205.2" height="66.8" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="440.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Друга ітерація f⁽²⁾(x)</tspan><tspan x="440.0" dy="16.9">Має 4 локальні екстремуми</tspan><tspan x="440.0" dy="16.9">поблизу центра</tspan></text>
<line x1="530.0" y1="160.0" x2="620.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Масштабування -α</text>
<text x="575.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">x ↦ x / (-α)</text>
<rect x="619.6" y="126.6" width="160.8" height="66.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="147.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Ренормалізоване</tspan><tspan x="700.0" dy="16.9">відображення T f(x)</tspan><tspan x="700.0" dy="16.9">= -α·f(f(x / -α))</tspan></text>
<line x1="80.0" y1="260.0" x2="720.0" y2="260.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="86.2" y="281.2" width="627.6" height="117.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="302.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Універсальна непорушна функція g(x) = T g(x):</tspan><tspan x="400.0" dy="16.9"></tspan><tspan x="400.0" dy="16.9">g(x) = -α · g( g( x / -α ) )</tspan><tspan x="400.0" dy="16.9"></tspan><tspan x="400.0" dy="16.9">Спектр лінеаризованого оператора L = dT|_g містить єдине нестійке власне значення:</tspan><tspan x="400.0" dy="16.9">λ₁ = δ = 4.6692016...</tspan></text>
</svg>