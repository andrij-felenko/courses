<text x="420.8" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">d₃ = d₂/(-α)</text>
<rect x="426.6" y="172.8" width="286.8" height="94.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="588.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="588.0" dy="0.0">Універсальний масштаб маштабування:</tspan><tspan x="588.0" dy="15.6">α = lim (d_k / d_{k+1}) = -2.5029078...</tspan><tspan x="588.0" dy="15.6"></tspan><tspan x="588.0" dy="15.6">Знак «мінус» означає інверсію</tspan><tspan x="588.0" dy="15.6">положення орбіти відносно x = 1/2</tspan></text>
