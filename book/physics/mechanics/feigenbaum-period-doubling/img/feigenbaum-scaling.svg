<line x1="390.0" y1="235.0" x2="390.0" y2="245.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="326.0" y1="235.0" x2="326.0" y2="245.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="358.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">d₂ = -d₁/α</text>
