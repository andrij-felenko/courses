<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричне масштабування орбіт та константа α</text>
<line x1="390.0" y1="60.0" x2="390.0" y2="390.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="390.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">x = 1/2 (екстремум)</text>
