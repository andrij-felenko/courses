<line x1="300.0" y1="205.0" x2="415.0" y2="248.9" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,4"/>
<text x="268.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">у Орема — «широта» якості,</text>
<text x="268.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">у нас — координата (час; швидкість)</text>
