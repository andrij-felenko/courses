<text x="662.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">пройдений шлях</text>
<circle cx="150.0" cy="400.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="138.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">початок</text>
<rect x="90.4" y="460.6" width="599.1" height="50.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="390.0" y="482.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Кожній миті — своя вертикальна «широта» (швидкість); їхні верхи лягають у пряму.</tspan><tspan x="390.0" dy="16.2">Це ще картина, не рівняння. Але вісь, друга вісь і точка як пара чисел — уже тут.</tspan></text>
