<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="520.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження координат: одна ідея, кілька рук, три століття</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">передвісник · незалежна ідея · друк · система · слова</text>
<line x1="128.0" y1="96.0" x2="128.0" y2="478.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="2,5"/>
<rect x="74.0" y="99.0" width="108.0" height="46.0" rx="8" fill="#6b7280" stroke="none" stroke-width="0.0"/>
<text x="128.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">≈1350</text>
<text x="128.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">ПЕРЕДВІСНИК</text>
<text x="202.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Орем малює «широту форм» — картину якості, ще без рівнянь</text>
<rect x="74.0" y="165.0" width="108.0" height="46.0" rx="8" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="128.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1636</text>
<text x="128.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">ІДЕЯ</text>
<text x="202.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Ферма: рівняння з двома невідомими — це крива (рукопис)</text>
<rect x="74.0" y="231.0" width="108.0" height="46.0" rx="8" fill="#2457d6" stroke="none" stroke-width="0.0"/>
<text x="128.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1637</text>
<text x="128.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">ДРУК</text>
<text x="202.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Декарт друкує La Géométrie — але осі в нього косі, довільні</text>
<rect x="74.0" y="297.0" width="108.0" height="46.0" rx="8" fill="#b07a2f" stroke="none" stroke-width="0.0"/>
<text x="128.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1649</text>
<text x="128.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">СИСТЕМА</text>
<text x="202.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">ван Схотен латиною: звідси й пішли перпендикулярні осі, квадранти</text>
<rect x="74.0" y="363.0" width="108.0" height="46.0" rx="8" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="128.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1679</text>
<text x="128.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">ДРУК</text>
<text x="202.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Ферма виходить посмертно — рукопис пролежав у тіні 43 роки</text>
<rect x="74.0" y="429.0" width="108.0" height="46.0" rx="8" fill="#1a1a1a" stroke="none" stroke-width="0.0"/>
<text x="128.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">1692</text>
<text x="128.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">СЛОВА</text>
<text x="202.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Ляйбніц усталює «абсцису», «ординату», «координати»</text>
<line x1="186.0" y1="188.0" x2="186.0" y2="386.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="194.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">та сама ідея,</text>
<text x="194.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">друк аж через 43 роки</text>
</svg>