<rect x="650.7" y="346.5" width="78.6" height="51.1" rx="6" fill="#f7efe2" stroke="#b07a2f" stroke-width="1.6"/><text x="690.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b07a2f" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">від O′:</tspan><tspan x="690.0" dy="17.6">(3, 1)</tspan></text>
<rect x="163.9" y="418.6" width="492.2" height="50.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="410.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Об'єкт не зрушив, а координати різні: (5, 2) від O, (3, 1) від O′.</tspan><tspan x="410.0" dy="16.2">Абсолютного «де» немає — положення завжди відлічене від чогось.</tspan></text>
