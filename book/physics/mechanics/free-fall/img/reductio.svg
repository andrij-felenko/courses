<rect x="99.1" y="394.8" width="701.7" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="414.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Хай навіть Арістотель має рацію — зв'язана пара мусила б падати і повільніше, і швидше за важчий камінь.</tspan><tspan x="450.0" dy="15.0">Суперечності немає лише тоді, коли швидкість падіння від ваги взагалі не залежить.</tspan></text>
