<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що знали — і чого не могли пояснити</text>
<rect x="60.0" y="72.0" width="400.0" height="250.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.9"/>
<text x="260.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЗНАЛИ  (да Вінчі 1493, Амонтон 1699)</text>
<rect x="84.0" y="118.0" width="352.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="260.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">1.  Тертя ∝ навантаженню</tspan><tspan x="260.0" dy="19.5">F = μ · N</tspan></text>
<rect x="84.0" y="214.0" width="352.0" height="80.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/><text x="260.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">2.  Тертя НЕ залежить</tspan><tspan x="260.0" dy="19.5">від видимої площі</tspan></text>
<rect x="540.0" y="72.0" width="400.0" height="250.0" rx="10" fill="#fdf1ee" stroke="#c0392b" stroke-width="1.9"/>
<text x="740.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">НЕ РОЗУМІЛИ  (≈ 250 років)</text>
<rect x="564.0" y="118.0" width="352.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="740.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Чому важить навантаження,</tspan><tspan x="740.0" dy="19.5">а не видима площа?</tspan></text>
<rect x="564.0" y="214.0" width="352.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="740.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Що таке μ?</tspan><tspan x="740.0" dy="19.5">звідки береться це число?</tspan></text>
<rect x="60.0" y="372.0" width="880.0" height="116.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="500.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Боуден і Тейбор, 1950 — розгадка</text>
<rect x="84.0" y="412.0" width="832.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="500.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">справжня площа дотику крихітна й ∝ навантаженню (вершечки течуть, не пружинять)</tspan><tspan x="500.0" dy="17.6">→ обидва закони випливають;  μ ≈ міцність зчеплень ÷ твердість поверхні</tspan></text>
<line x1="260.0" y1="322.0" x2="260.0" y2="372.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="322.0" x2="740.0" y2="372.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>