<text x="445.8" y="367.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">вага  mg</text>
<line x1="432.8" y1="241.3" x2="389.9" y2="257.9" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="389.9" y1="257.9" x2="432.8" y2="369.3" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="379.9" y="273.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">mg·sinθ</text>
<text x="379.9" y="290.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">котить униз</text>
<line x1="432.8" y1="241.3" x2="389.9" y2="129.9" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="383.9" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">N = mg·cosθ</text>
<line x1="432.8" y1="241.3" x2="518.7" y2="208.3" stroke="#2457d6" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="526.7" y="204.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">тертя  μ_s·N</text>
<path d="M 216.0 385.0 A 66 66 0 0 0 211.6 361.3" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="224.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">θ</text>
<rect x="148.8" y="433.0" width="622.5" height="38.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="456.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">зрив, коли mg·sinθ &gt; μ_s·mg·cosθ   →   m і g скорочуються   →   μ_s = tan θ</tspan></text>
