<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Похилина як вимірювач тертя: зрив, коли tan θ = μ_s</text>
<path d="M 150.0 385.0 L 760.0 385.0 L 760.0 150.0 Z" fill="#eef1f4" stroke="#1a1a1a" stroke-width="2.0"/>
<path d="M 447.7 207.7 L 466.4 256.3 L 417.9 274.9 L 399.2 226.4 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
