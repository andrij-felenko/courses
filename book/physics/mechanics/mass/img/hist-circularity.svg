<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1160.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="580.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Означення, що кусає себе за хвіст — і як Мах його розтяв</text>
<rect x="60.0" y="74.0" width="430.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="275.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Ньютон (1687): коло «маса ↔ густина»</tspan></text>
<path d="M405.0 182.0 Q290.0 150.0 175.0 182.0" fill="none" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="290.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">m = ρ · V</text>
<path d="M175.0 228.0 Q290.0 300.0 405.0 228.0" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="290.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ρ = m / V</text>
<rect x="128.3" y="185.0" width="93.4" height="40.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/><text x="175.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">маса  m</tspan></text>
<rect x="343.4" y="185.0" width="123.2" height="40.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/><text x="405.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">густина  ρ</tspan></text>
<rect x="70.0" y="366.0" width="440.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="290.0" y="390.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">масу означено через ρ, а ρ — через масу:</tspan><tspan x="290.0" dy="16.9">коло замкнене, «речовини» так і не видно</tspan></text>
<line x1="516.0" y1="205.0" x2="620.0" y2="205.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="568.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мах розтинає</text>
<rect x="660.0" y="74.0" width="440.0" height="32.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="880.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">Мах (1868): міряй взаємні прискорення</tspan></text>
<text x="874.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лишаєш два тіла у взаємодії — і тільки</text>
<polyline points="816.00,210.00 826.25,219.00 836.50,201.00 846.75,219.00 857.00,201.00 867.25,219.00 877.50,201.00 887.75,219.00 898.00,201.00 908.25,219.00 918.50,201.00 928.75,219.00 939.00,210.00" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="788.0" cy="210.0" r="28.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="788.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="960.0" cy="210.0" r="21.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="960.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<line x1="756.0" y1="210.0" x2="680.0" y2="210.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="674.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">a₁</text>
<line x1="984.0" y1="210.0" x2="1068.0" y2="210.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="1076.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">a₂</text>
<rect x="678.4" y="297.5" width="403.3" height="37.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="321.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">m₁ · a₁ = m₂ · a₂   ⇒   m₁ / m₂ = a₂ / a₁</tspan></text>
<rect x="700.0" y="372.0" width="360.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.3"/><text x="880.0" y="390.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="880.0" dy="0.0">маса — число з досліду,</tspan><tspan x="880.0" dy="16.9">а не прихована «речовина»</tspan></text>
</svg>