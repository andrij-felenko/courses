<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1300.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="650.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як народжувалося поняття маси: дійові особи й дати</text>
<line x1="80.0" y1="300.0" x2="1250.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="1240.0" y1="300.0" x2="1258.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1254.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<line x1="160.0" y1="292.0" x2="160.0" y2="260.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="65.0" y="142.0" width="190.0" height="118.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="160.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">≈1618 · Кеплер</tspan><tspan x="160.0" dy="16.9">уводить «інерцію» —</tspan><tspan x="160.0" dy="16.9">але як хист тіла</tspan><tspan x="160.0" dy="16.9">до спокою</tspan></text>
<circle cx="160.0" cy="300.0" r="8.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.4"/>
<line x1="356.0" y1="308.0" x2="356.0" y2="340.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="261.0" y="340.0" width="190.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="356.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="356.0" dy="0.0">1687 · Ньютон</tspan><tspan x="356.0" dy="16.9">«кількість матерії»</tspan><tspan x="356.0" dy="16.9">= густина × об'єм;</tspan><tspan x="356.0" dy="16.9">а міряє — вагою</tspan></text>
<circle cx="356.0" cy="300.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<line x1="552.0" y1="292.0" x2="552.0" y2="260.0" stroke="#a9946b" stroke-width="1.6"/>
<rect x="457.0" y="142.0" width="190.0" height="118.0" rx="6" fill="#f6f3ea" stroke="#a9946b" stroke-width="1.8"/><text x="552.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="552.0" dy="0.0">1748 · Ломоносов</tspan><tspan x="552.0" dy="16.9">лист Ойлерові:</tspan><tspan x="552.0" dy="16.9">загальна теза</tspan><tspan x="552.0" dy="16.9">збереження</tspan></text>
<circle cx="552.0" cy="300.0" r="8.0" fill="#f6f3ea" stroke="#a9946b" stroke-width="2.4"/>
<line x1="748.0" y1="308.0" x2="748.0" y2="340.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="653.0" y="340.0" width="190.0" height="118.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="748.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">1770-ті–89 · Лавуазьє</tspan><tspan x="748.0" dy="16.9">запаяна посудина →</tspan><tspan x="748.0" dy="16.9">дослідний закон</tspan><tspan x="748.0" dy="16.9">збереження маси</tspan></text>
<circle cx="748.0" cy="300.0" r="8.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.4"/>
<line x1="944.0" y1="292.0" x2="944.0" y2="260.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="849.0" y="142.0" width="190.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="944.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="944.0" dy="0.0">1868 · Мах</tspan><tspan x="944.0" dy="16.9">маса = відношення</tspan><tspan x="944.0" dy="16.9">взаємних прискорень —</tspan><tspan x="944.0" dy="16.9">облік, не «річ»</tspan></text>
<circle cx="944.0" cy="300.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<line x1="1140.0" y1="308.0" x2="1140.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="1045.0" y="340.0" width="190.0" height="118.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.8"/><text x="1140.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">1905 · Айнштайн</tspan><tspan x="1140.0" dy="16.9">маса спокою,</tspan><tspan x="1140.0" dy="16.9">E = m·c²; поняття</tspan><tspan x="1140.0" dy="16.9">розколюється</tspan></text>
<circle cx="1140.0" cy="300.0" r="8.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="285.0" y="516.2" width="729.9" height="35.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="538.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">одне слово поволі розчепили на три: скільки речовини · як важко · як воно опирається розгону</tspan></text>
</svg>