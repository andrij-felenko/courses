<rect x="520.3" y="99.2" width="159.4" height="101.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="600.0" y="121.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">сума плечей:</tspan><tspan x="600.0" dy="16.2">+20 + 8 − 8 = 20 Дж</tspan><tspan x="600.0" dy="16.2"></tspan><tspan x="600.0" dy="16.2">зворотне плече (−8)</tspan><tspan x="600.0" dy="16.2">ВІДНІМАЄ енергію</tspan></text>
<rect x="66.6" y="410.8" width="646.7" height="50.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="390.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">На зворотному плечі рух іде ліворуч (Δr), а сила F₂ дивиться праворуч — добуток F·Δr від'ємний,</tspan><tspan x="390.0" dy="15.0">і 8 Дж віднімаються самі, без жодного «if». Сумувати модулі кроків — груба помилка.</tspan></text>
