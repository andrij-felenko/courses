<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="980.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна сила — два різні рахунки</text>
<text x="490.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Сила діє протягом ЧАСУ  —  сторона Декарта</text><rect x="60.0" y="119.0" width="150.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Сила F</tspan></text><line x1="216.0" y1="150.0" x2="366.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="291.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">× час Δt</text><rect x="372.0" y="119.0" width="246.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="495.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Імпульс</tspan><tspan x="495.0" dy="18.2">F · Δt</tspan></text><line x1="624.0" y1="150.0" x2="756.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="690.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">змінює</text><rect x="762.0" y="119.0" width="196.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">кількість руху</tspan><tspan x="860.0" dy="17.6">m · v</tspan></text>
<text x="490.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f7a3d" text-anchor="middle" font-weight="700">Сила діє вздовж ВІДСТАНІ  —  сторона Ляйбніца</text><rect x="60.0" y="291.0" width="150.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="135.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Сила F</tspan></text><line x1="216.0" y1="322.0" x2="366.0" y2="322.0" stroke="#1f7a3d" stroke-width="2.0" marker-end="url(#arrow)"/><text x="291.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f7a3d" text-anchor="middle" font-weight="700">× відстань d</text><rect x="372.0" y="291.0" width="246.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="317.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Робота</tspan><tspan x="495.0" dy="18.2">F · d</tspan></text><line x1="624.0" y1="322.0" x2="756.0" y2="322.0" stroke="#1f7a3d" stroke-width="2.0" marker-end="url(#arrow)"/><text x="690.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">змінює</text><rect x="762.0" y="291.0" width="196.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#1f7a3d" stroke-width="1.5"/><text x="860.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">кінетична енергія</tspan><tspan x="860.0" dy="17.6">½ · m · v²</tspan></text>
<rect x="182.3" y="415.6" width="615.4" height="52.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="490.0" y="438.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Обидва рахунки правдиві й обидва зберігаються — вони відповідають на різні питання.</tspan><tspan x="490.0" dy="16.2">Коріоліс (1829) розвів їх, показавши, що робота дорівнює зміні ½m·v², а не m·v².</tspan></text>
</svg>