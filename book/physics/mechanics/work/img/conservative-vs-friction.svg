<text x="765.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сила тертя</text>
<text x="765.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">завжди проти руху</text>
<text x="745.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">∮ F·dr = −μ·N·L  &lt; 0</text>
<text x="745.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кожне ребро відбирає, обхід не повертається в нуль</text>
<rect x="131.8" y="515.6" width="736.5" height="52.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="500.0" y="538.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Консервативна сила: замкнений обхід дає нуль — тому їй можна приписати потенціал U і роботу W = −ΔU.</tspan><tspan x="500.0" dy="16.2">Тертя: обхід дає −μ·N·L, що росте з довжиною контуру L, — потенціалу не існує.</tspan></text>
