<text x="254.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">W = F·d</text>
<text x="738.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пружина:  F = k·x</text>
<line x1="560.0" y1="372.0" x2="900.0" y2="372.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
