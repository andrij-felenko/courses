<text x="725.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">W = ½·k·x²</text>
<rect x="122.4" y="415.6" width="715.1" height="52.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="480.0" y="438.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Стала сила замітає прямокутник F·d; сила пружини росте прямою F = k·x і замітає трикутник ½·k·x².</tspan><tspan x="480.0" dy="16.2">Хоч якою була б крива сили, робота — це площа під нею.</tspan></text>
