<text x="552.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">сила F</text>
<text x="896.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">переміщення</text>
<polygon points="560.0,372.0 860.0,372.0 860.0,162.0" fill="#fdecea" stroke="none"/>
<line x1="560.0" y1="372.0" x2="860.0" y2="162.0" stroke="#c0392b" stroke-width="2.8"/>
