<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як рівняння дальності дістало ім'я Бреге</text>
<line x1="168.0" y1="66.0" x2="168.0" y2="432.0" stroke="#6b7280" stroke-width="2.5"/>
<rect x="208.0" y="77.0" width="648.0" height="66.0" rx="6" fill="#eef1f4" stroke="#c2c8cf" stroke-width="1.5"/><text x="532.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.0" dy="0.0">Літаки щойно перетнули Атлантику (NC-4, потім Алкок і Браун):</tspan><tspan x="532.0" dy="18.9">питання «як далеко долетить?» стає головним</tspan></text>
<line x1="168.0" y1="110.0" x2="208.0" y2="110.0" stroke="#c2c8cf" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="168.0" cy="110.0" r="7.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="150.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1919</text>
<rect x="208.0" y="173.0" width="648.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="532.0" y="201.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.0" dy="0.0">Джозеф Дж. Коффін (США), NACA Report 69 —</tspan><tspan x="532.0" dy="18.9">перше друковане виведення рівняння дальності</tspan></text>
<line x1="168.0" y1="206.0" x2="208.0" y2="206.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="168.0" cy="206.0" r="7.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="150.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">1920</text>
<rect x="208.0" y="273.0" width="648.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="532.0" y="301.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.0" dy="0.0">Луї Шарль Бреге (Франція) незалежно публікує</tspan><tspan x="532.0" dy="18.9">те саме рівняння у практичному вигляді</tspan></text>
<line x1="168.0" y1="306.0" x2="208.0" y2="306.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="168.0" cy="306.0" r="7.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="150.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">1923</text>
<rect x="208.0" y="369.0" width="648.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="532.0" y="397.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.0" dy="0.0">підручники закріплюють назву «рівняння Бреге» —</tspan><tspan x="532.0" dy="18.9">традицією, а не за правом першості</tspan></text>
<line x1="168.0" y1="402.0" x2="208.0" y2="402.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="168.0" cy="402.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="150.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">згодом</text>
</svg>