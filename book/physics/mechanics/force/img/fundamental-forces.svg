<rect x="0.0" y="0.0" width="900.0" height="620.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усе розмаїття сил зводиться до чотирьох взаємодій</text>
<rect x="62.5" y="68.5" width="55.0" height="31.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.3"/><text x="90.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">тертя</tspan></text>
<line x1="90.0" y1="100.0" x2="406.8" y2="164.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="242.5" y="68.5" width="55.0" height="31.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.3"/><text x="270.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">натяг</tspan></text>
<line x1="270.0" y1="100.0" x2="428.4" y2="164.0" stroke="#6b7280" stroke-width="1.0"/>
