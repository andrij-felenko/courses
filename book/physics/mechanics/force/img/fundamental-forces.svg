<line x1="450.0" y1="100.0" x2="450.0" y2="164.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="587.7" y="68.5" width="84.7" height="31.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.3"/><text x="630.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">пружність</tspan></text>
<line x1="630.0" y1="100.0" x2="471.6" y2="164.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="752.8" y="68.5" width="114.3" height="31.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.3"/><text x="810.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">поштовх м'яза</tspan></text>
<line x1="810.0" y1="100.0" x2="493.2" y2="164.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="450.0" y1="138.0" x2="450.0" y2="164.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="270.0" y="168.0" width="360.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="450.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">усе це — Електромагнітна взаємодія (на рівні атомів)</tspan></text>
<text x="450.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">а в самій основі природи сил лише чотири:</text>
