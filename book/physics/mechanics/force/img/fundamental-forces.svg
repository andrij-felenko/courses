<text x="123.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">радіус: ∞</text>
<text x="123.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">сила ~ 10⁻³⁸</text>
<text x="123.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="123.0" dy="0.0">притягує все,</tspan><tspan x="123.0" dy="15.6">що має масу</tspan></text>
<rect x="241.0" y="290.0" width="200.0" height="250.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
<text x="341.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Електромагнітна</text>
<line x1="257.0" y1="338.0" x2="425.0" y2="338.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="341.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">радіус: ∞</text>
<text x="341.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">сила ~ 10⁻²</text>
<text x="341.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="341.0" dy="0.0">заряди, струми,</tspan><tspan x="341.0" dy="15.6">світло, «дотик»</tspan></text>
<rect x="459.0" y="290.0" width="200.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="559.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сильна</text>
<line x1="475.0" y1="338.0" x2="643.0" y2="338.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="559.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">радіус ~ 10⁻¹⁵ м</text>
<text x="559.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сила ~ 1</text>
<text x="559.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="559.0" dy="0.0">тримає</tspan><tspan x="559.0" dy="15.6">атомне ядро</tspan></text>
<rect x="677.0" y="290.0" width="200.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/>
<text x="777.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Слабка</text>
<line x1="693.0" y1="338.0" x2="861.0" y2="338.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="777.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">радіус ~ 10⁻¹⁸ м</text>
<text x="777.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">сила ~ 10⁻⁶</text>
<text x="777.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="777.0" dy="0.0">деякі</tspan><tspan x="777.0" dy="15.6">радіорозпади</tspan></text>
<rect x="90.7" y="564.5" width="718.5" height="35.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="450.0" y="586.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">гравітація мізерно слабка — та єдина завжди тільки додається й сягає без меж, тож керує зорями</tspan></text>
