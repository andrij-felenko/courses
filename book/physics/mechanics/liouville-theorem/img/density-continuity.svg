<rect x="57.7" y="310.5" width="644.7" height="29.0" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/><text x="380.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Баланс потоків:  ∂q̇/∂q + ∂ṗ/∂p = ∂²H/(∂q ∂p) - ∂²H/(∂p ∂q) ≡ 0  ⇒  div v = 0</tspan></text>
