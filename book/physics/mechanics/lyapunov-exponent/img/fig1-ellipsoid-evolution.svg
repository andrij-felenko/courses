<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 895.6 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="895.6" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Деформація фазового елемента та показники Ляпунова</text>
<rect x="30.0" y="60.0" width="380.0" height="330.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Початковий момент часу t = 0</text>
<circle cx="220.0" cy="200.0" r="50.0" fill="#ffffff" stroke="#2563eb" stroke-width="2.0"/>
<line x1="220.0" y1="200.0" x2="270.0" y2="200.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="220.0" y1="200.0" x2="220.0" y2="150.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="220.0" y1="200.0" x2="185.0" y2="235.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">δx₁(0)</text>
<text x="220.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">δx₂(0)</text>
<text x="170.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="end" font-weight="700">δx₃(0)</text>
<text x="220.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle"><tspan x="220.0" dy="0.0">Початковий об'єм: V(0) = (4/3)π r₀³</tspan><tspan x="220.0" dy="15.4">Ізотропний інфінітезимальний шар</tspan><tspan x="220.0" dy="15.4">Радіус-вектор: ||δx(0)|| = ε</tspan></text>
<line x1="420.0" y1="200.0" x2="470.0" y2="200.0" stroke="#e08a1e" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="445.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle" font-weight="700">Еволюція t &gt; 0</text>
<text x="445.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08a1e" text-anchor="middle" font-style="italic">e^{J t}</text>
<rect x="480.0" y="60.0" width="370.0" height="330.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="665.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Деформований еліпсоїд t &gt; 0</text>
<ellipse cx="665" cy="200" rx="120" ry="35" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
<line x1="665.0" y1="200.0" x2="785.0" y2="200.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="665.0" y1="200.0" x2="665.0" y2="165.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="665.0" y1="200.0" x2="640.0" y2="220.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="800.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">e^{λ₁t} δx₁(0)</text>
<text x="665.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">e^{λ₂t} δx₂(0)</text>
<text x="630.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="end" font-weight="700">e^{λ₃t} δx₃(0)</text>
<text x="665.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle"><tspan x="665.0" dy="0.0">Головні осі: δxᵢ(t) ~ exp(λᵢ t) δxᵢ(0)</tspan><tspan x="665.0" dy="13.5">Об'єм: V(t) = V(0) exp((λ₁ + λ₂ + λ₃) t)</tspan><tspan x="665.0" dy="13.5">λ₁ &gt; 0: розтягнення (хаос)</tspan><tspan x="665.0" dy="13.5">λ₂ = 0: вздовж траєкторії</tspan><tspan x="665.0" dy="13.5">λ₃ &lt; 0: стискання фазового об'єму</tspan></text>
</svg>