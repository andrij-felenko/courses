<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стовп над площадкою: P = P₀ + ρ·g·h</text>
<rect x="150.0" y="120.0" width="280.0" height="350.0" rx="3" fill="#bfe0f2" stroke="#7cc0e0" stroke-width="1.6"/>
<rect x="255.0" y="120.0" width="80.0" height="300.0" rx="0" fill="#7cc0e0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="305.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">площа A</text>
<line x1="180.0" y1="122.0" x2="180.0" y2="418.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="168.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-style="italic">h</text>
<line x1="295.0" y1="92.0" x2="295.0" y2="117.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="295.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">P₀·A</text>
<line x1="295.0" y1="232.0" x2="295.0" y2="330.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="346.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">вага ρgAh</text>
<line x1="295.0" y1="452.0" x2="295.0" y2="424.0" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="295.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">P(h)·A</text>
<rect x="671.1" y="123.5" width="197.8" height="53.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">P(h)·A = P₀·A + ρgA·h</tspan><tspan x="770.0" dy="17.6">⟹  P(h) = P₀ + ρg·h</tspan></text>
<rect x="651.2" y="267.1" width="237.6" height="49.9" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">тонкий шар:  dP = ρg·dh</tspan><tspan x="770.0" dy="16.9">ρ = const  ⟹  P лінійно з h</tspan></text>
<rect x="659.2" y="387.1" width="221.5" height="49.9" rx="6" fill="#fdf3e6" stroke="#e08e0b" stroke-width="1.5"/><text x="770.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">газ: ρ росте з тиском</tspan><tspan x="770.0" dy="16.9">⟹  не пряма, а експонента</tspan></text>
<rect x="95.0" y="520.0" width="850.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="545.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Тиск на глибині — вага стовпа рідини над одиницею площі. Стала густина дає однаковий</tspan><tspan x="520.0" dy="16.9">приріст на кожен метр глибини — тому пряма P = P₀ + ρgh.</tspan></text>
</svg>