<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клин рідини: чому тиск однаковий на всі грані</text>
<polygon points="250.0,440.0 470.0,440.0 250.0,250.0" fill="#bfe0f2" stroke="#7cc0e0" stroke-width="1.8"/>
<text x="300.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Δx</text>
<text x="232.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-style="italic">Δz</text>
<text x="456.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">Δs</text>
<text x="440.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">θ</text>
<line x1="182.0" y1="345.0" x2="248.0" y2="345.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="174.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">Px</text>
<line x1="360.0" y1="508.0" x2="360.0" y2="443.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="360.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Pz</text>
<line x1="404.0" y1="291.0" x2="360.0" y2="345.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="416.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Pn</text>
<line x1="322.0" y1="360.0" x2="322.0" y2="428.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="312.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">ρg·V</text>
<rect x="700.2" y="116.6" width="229.6" height="66.8" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="815.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">рівновага по x:</tspan><tspan x="815.0" dy="16.9">Px·Δz = Pn·Δs·sinθ = Pn·Δz</tspan><tspan x="815.0" dy="16.9">⟹  Px = Pn</tspan></text>
<rect x="708.3" y="271.6" width="213.4" height="66.8" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="815.0" y="292.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">рівновага по z:</tspan><tspan x="815.0" dy="16.9">Pz·Δx = Pn·Δx + ρg·½ΔxΔz</tspan><tspan x="815.0" dy="16.9">⟹  Pz = Pn + ½ρg·Δz</tspan></text>
<rect x="688.1" y="417.1" width="253.7" height="49.9" rx="6" fill="#fdf3e6" stroke="#e08e0b" stroke-width="1.5"/><text x="815.0" y="438.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">сили тиску ∝ ℓ²,   вага ∝ ℓ³</tspan><tspan x="815.0" dy="16.9">ℓ→0:  вага зникає  ⟹  Pz = Pn</tspan></text>
<rect x="95.0" y="566.0" width="870.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Клин будь-якого нахилу θ дає Px = Pz = Pn: тиск однаковий на всі боки.</tspan><tspan x="530.0" dy="17.6">Отже тиск — скаляр, приписаний до точки, а не напрямлена величина.</tspan></text>
</svg>