<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="430.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один поворот — дві системи відліку</text>
<text x="210.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">погляд із тротуару</text>
<text x="210.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(інерціальна система)</text>
<circle cx="210.0" cy="220.0" r="100.0" fill="#fbfcfe" stroke="#6b7280" stroke-width="1.6"/><circle cx="210.0" cy="220.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><path d="M 240.6 194.3 A 40.0 40.0 0 0 0 175.4 200.0" fill="none" stroke="#27ae60" stroke-width="1.9"/><path d="M 175.4 200.0 L 176.2 191.3 L 182.5 194.9 z" fill="#27ae60"/>
<circle cx="310.0" cy="220.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="310.0" y1="214.0" x2="310.0" y2="154.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="5 4"/><path d="M 310.0 154.0 L 314.5 163.0 L 305.5 163.0 z" fill="#6b7280"/>
<text x="310.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">інерція: прямо</text>
<line x1="302.0" y1="220.0" x2="240.0" y2="220.0" stroke="#2457d6" stroke-width="3.0"/><path d="M 240.0 220.0 L 252.0 214.0 L 252.0 226.0 z" fill="#2457d6"/>
<text x="240.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">до центра</text>
<text x="240.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(реальна)</text>
<text x="210.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">єдина реальна сила — до центра;</text>
<text x="210.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вона й гне прямий рух у дугу</text>
<text x="590.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">погляд із машини</text>
<text x="590.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(обертова система)</text>
<circle cx="590.0" cy="220.0" r="100.0" fill="#fbfcfe" stroke="#6b7280" stroke-width="1.6"/><circle cx="590.0" cy="220.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/><path d="M 620.6 194.3 A 40.0 40.0 0 0 0 555.4 200.0" fill="none" stroke="#27ae60" stroke-width="1.9"/><path d="M 555.4 200.0 L 556.2 191.3 L 562.5 194.9 z" fill="#27ae60"/>
<circle cx="690.0" cy="220.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="682.0" y1="220.0" x2="620.0" y2="220.0" stroke="#2457d6" stroke-width="3.0"/><path d="M 620.0 220.0 L 632.0 214.0 L 632.0 226.0 z" fill="#2457d6"/>
<text x="624.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">двері</text>
<text x="624.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(реальна)</text>
<line x1="698.0" y1="220.0" x2="760.0" y2="220.0" stroke="#c0392b" stroke-width="3.0"/><path d="M 760.0 220.0 L 748.0 226.0 L 748.0 214.0 z" fill="#c0392b"/>
<text x="730.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">відцентрова</text>
<text x="730.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(вигадана)</text>
<text x="590.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рівновага: у цій системі</text>
<text x="590.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тіло нерухоме</text>
<rect x="8.1" y="392.5" width="783.7" height="31.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="400.0" y="412.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">назовні тіло ніщо не штовхає — відцентрову дописують, щоб урятувати F = m·a в обертовій системі</tspan></text>
</svg>