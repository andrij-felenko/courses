<rect x="0.0" y="0.0" width="920.0" height="348.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Триста п'ятдесят років: як мінявся статус відцентрової сили</text>
<line x1="36.0" y1="66.0" x2="884.0" y2="66.0" stroke="#6b7280" stroke-width="2.0"/><path d="M 884.0 66.0 L 873.0 71.5 L 873.0 60.5 z" fill="#6b7280"/>
<text x="460.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">розуміння з часом →</text>
<rect x="30.0" y="86.0" width="200.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="130.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Реальна сила,</tspan><tspan x="130.0" dy="16.9">що жене назовні</tspan></text>
<text x="130.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1644 – 1689</text>
<rect x="30.0" y="184.0" width="200.0" height="132.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="46.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Декарт (Descartes)</text>
<text x="46.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Гюйгенс (Huygens)</text>
<text x="46.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Ляйбніц (Leibniz)</text>
<rect x="250.0" y="86.0" width="200.0" height="64.0" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.6"/><text x="350.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Ознака справжнього,</tspan><tspan x="350.0" dy="16.9">абсолютного обертання</tspan></text>
<text x="350.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1687</text>
<rect x="250.0" y="184.0" width="200.0" height="132.0" rx="6" fill="#f3e8f8" stroke="#8e44ad" stroke-width="1.3"/>
<text x="266.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Ньютон (Newton):</text>
<text x="266.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">відро з водою</text>
<rect x="470.0" y="86.0" width="200.0" height="64.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.6"/><text x="570.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Фіктивний доданок</tspan><tspan x="570.0" dy="16.9">обертової системи</tspan></text>
<text x="570.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1721 – 1883</text>
<rect x="470.0" y="184.0" width="200.0" height="132.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.3"/>
<text x="486.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Барклі (Berkeley)</text>
<text x="486.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">д'Аламбер (d'Alembert)</text>
<text x="486.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Коріоліс (Coriolis)</text>
<text x="486.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Мах (Mach)</text>
<rect x="690.0" y="86.0" width="200.0" height="64.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="790.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Локально нероздільна</tspan><tspan x="790.0" dy="16.9">з тяжінням</tspan></text>
<text x="790.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1915</text>
<rect x="690.0" y="184.0" width="200.0" height="132.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="706.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Айнштайн (Einstein):</text>
<text x="706.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">загальна відносність</text>
</svg>