<rect x="95.0" y="500.0" width="850.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="527.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Плавуче тіло тоне доти, доки витіснена вода не зважить стільки ж, скільки воно саме.</tspan><tspan x="520.0" dy="16.9">Тому частка зануреного об'єму дорівнює відношенню густин. Для льоду в морській воді це ≈ 0.895 —</tspan><tspan x="520.0" dy="16.9">майже дев'ять десятих ховається під водою, а над хвилями лишається сама верхівка.</tspan></text>
