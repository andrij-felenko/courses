<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Понтон: метацентрична висота GM = I/V − BG у числах</text>
<rect x="150.0" y="258.0" width="360.0" height="152.0" rx="6" fill="#bfe0f2" stroke="none" stroke-width="1.5"/>
<polyline points="158.0,254.0 184.0,262.0 210.0,254.0 236.0,262.0 262.0,254.0 288.0,262.0 314.0,254.0 340.0,262.0 366.0,254.0 392.0,262.0 418.0,254.0 444.0,262.0 470.0,254.0 496.0,262.0 522.0,254.0" fill="none" stroke="#7cc0e0" stroke-width="1.8"/>
<rect x="200.0" y="168.0" width="230.0" height="216.0" rx="3" fill="#e6cd93" stroke="#c9a860" stroke-width="2.0"/>
<rect x="202.0" y="258.0" width="226.0" height="125.0" rx="6" fill="#7cc0e0" stroke="none" stroke-width="1.5"/>
<line x1="315.0" y1="162.0" x2="315.0" y2="390.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 5"/>
<circle cx="315.0" cy="384.0" r="4.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.2"/>
<text x="327.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">K</text>
<circle cx="315.0" cy="321.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.4"/>
<text x="327.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">B (d/2)</text>
<circle cx="315.0" cy="276.0" r="5.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.4"/>
<text x="327.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700" font-style="italic">G</text>
<line x1="200.0" y1="408.0" x2="430.0" y2="408.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="430.0" y1="408.0" x2="200.0" y2="408.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="315.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">b = 2 м</text>
<line x1="174.0" y1="258.0" x2="174.0" y2="384.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="174.0" y1="384.0" x2="174.0" y2="258.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="166.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">d</text>
<text x="444.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7cc0e0" text-anchor="start" font-weight="700">ватерлінія</text>
<rect x="556.0" y="152.0" width="210.0" height="92.0" rx="4" fill="#f2f8fc" stroke="#7cc0e0" stroke-width="1.6"/>
<line x1="556.0" y1="198.0" x2="766.0" y2="198.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="661.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">площа ватерлінії  L × b</text>
<text x="774.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">вісь крену</text>
<text x="661.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">I = ∫x² dA = L·b³/12</text>
<rect x="710.0" y="161.8" width="380.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="182.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">V = L·b·d = 2.8 м³</tspan></text>
<rect x="710.0" y="223.8" width="380.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">I = L·b³/12 = 2.667 м⁴</tspan></text>
<rect x="710.0" y="285.8" width="380.0" height="32.5" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">BM = I/V = b²/(12d) = 0.952 м</tspan></text>
<rect x="710.0" y="347.8" width="380.0" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">BG = KG − KB = 0.30 − 0.175 = 0.125 м</tspan></text>
<rect x="710.0" y="409.8" width="380.0" height="32.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="430.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">GM = BM − BG = 0.827 м  &gt; 0  остійно</tspan></text>
<rect x="150.0" y="512.0" width="900.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="537.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">BM = b²/(12d) залежить від ширини у КВАДРАТІ. Широкий пліт (b = 2 м) остійний із запасом;</tspan><tspan x="600.0" dy="16.9">звузити до b = 0.5 м — і GM стає від'ємним, той самий понтон перекидається на бік.</tspan></text>
</svg>