<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон Архімеда: поштовх дорівнює вазі витісненої рідини</text>
<line x1="540.0" y1="92.0" x2="540.0" y2="470.0" stroke="#dfe4ea" stroke-width="1.4" stroke-dasharray="4 6"/>
<rect x="110.0" y="128.0" width="350.0" height="324.0" rx="4" fill="#bfe0f2" stroke="#7cc0e0" stroke-width="1.6"/>
<polyline points="116.0,124.0 142.0,132.0 168.0,124.0 194.0,132.0 220.0,124.0 246.0,132.0 272.0,124.0 298.0,132.0 324.0,124.0 350.0,132.0 376.0,124.0 402.0,132.0 428.0,124.0 454.0,132.0 480.0,124.0" fill="none" stroke="#7cc0e0" stroke-width="1.8"/>
<text x="285.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">реальне тіло — сталь</text>
<rect x="223.0" y="250.0" width="124.0" height="96.0" rx="4" fill="#c4c9d2" stroke="#8b9099" stroke-width="1.8"/>
<text x="285.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">сталь</text>
<line x1="285.0" y1="250.0" x2="285.0" y2="190.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="285.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">F_арх угору</text>
<text x="285.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">= вазі витісненої води</text>
<rect x="620.0" y="128.0" width="350.0" height="324.0" rx="4" fill="#bfe0f2" stroke="#7cc0e0" stroke-width="1.6"/>
<polyline points="626.0,124.0 652.0,132.0 678.0,124.0 704.0,132.0 730.0,124.0 756.0,132.0 782.0,124.0 808.0,132.0 834.0,124.0 860.0,132.0 886.0,124.0 912.0,132.0 938.0,124.0 964.0,132.0 990.0,124.0" fill="none" stroke="#7cc0e0" stroke-width="1.8"/>
<text x="795.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">уявний двійник — та сама вода</text>
<rect x="733.0" y="250.0" width="124.0" height="96.0" rx="4" fill="#7cc0e0" stroke="#2457d6" stroke-width="2.0"/>
<text x="795.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">вода</text>
<line x1="761.0" y1="250.0" x2="761.0" y2="196.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="761.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">поштовх</text>
<line x1="829.0" y1="346.0" x2="829.0" y2="400.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="829.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вага води</text>
<text x="795.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">висить у рівновазі → поштовх = її вага</text>
<rect x="95.0" y="496.0" width="890.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="522.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Заміни тіло на воду тієї самої форми — вона висить у спокої, отже сили тиску тримають рівно її вагу.</tspan><tspan x="540.0" dy="16.9">Навколишня рідина тисне на межу однаково, хоч там вода, хоч сталь, хоч корок — тож поштовх той самий:</tspan><tspan x="540.0" dy="16.9">вага витісненої рідини. Форма тіла врахована сама, бо ми взяли порожнину саме його обрису.</tspan></text>
</svg>