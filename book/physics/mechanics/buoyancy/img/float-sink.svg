<rect x="140.0" y="600.0" width="840.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="620.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Ні вага, ні матеріал самі по собі не вирішують — лише відношення густин. Тому й сталевий</tspan><tspan x="560.0" dy="16.2">корабель плаває: усередині повітря, і середня густина всього корпусу виходить меншою за воду.</tspan></text>
