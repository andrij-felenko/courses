<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доля тексту: як «Про плавучі тіла» дійшло до нас</text>
<line x1="96.0" y1="252.0" x2="1156.0" y2="252.0" stroke="#6b7280" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="150.0" y1="243.0" x2="150.0" y2="208.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="74.0" y="109.6" width="151.9" height="76.8" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="150.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">бл. 250 до н.е.</tspan><tspan x="150.0" dy="15.6">Архімед пише</tspan><tspan x="150.0" dy="15.6">«Про плавучі тіла»</tspan><tspan x="150.0" dy="15.6">(Сиракузи)</tspan></text>
