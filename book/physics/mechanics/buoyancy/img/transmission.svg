<circle cx="900.0" cy="252.0" r="7.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/>
<line x1="1092.0" y1="261.0" x2="1092.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="1008.6" y="335.4" width="166.8" height="61.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1092.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1092.0" dy="0.0">1998</tspan><tspan x="1092.0" dy="15.6">Christie's, $2 млн →</tspan><tspan x="1092.0" dy="15.6">цифрове відчитання</tspan></text>
<circle cx="1092.0" cy="252.0" r="7.5" fill="#27ae60" stroke="#ffffff" stroke-width="2.0"/>
<rect x="120.0" y="474.0" width="1000.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="503.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Дві з половиною тисячі років трактат тримався на волосині: латина Мербеке зберегла Заходу зміст,</tspan><tspan x="620.0" dy="16.9">а ЄДИНИЙ грецький список уцілів лиш тому, що його не дочистили під молитовник. Вісь часу не в масштабі.</tspan></text>
</svg>