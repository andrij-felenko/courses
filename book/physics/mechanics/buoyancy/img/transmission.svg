<line x1="338.0" y1="261.0" x2="338.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="265.8" y="335.4" width="144.5" height="61.2" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="338.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="338.0" dy="0.0">X ст.</tspan><tspan x="338.0" dy="15.6">єдиний грецький</tspan><tspan x="338.0" dy="15.6">список (Візантія)</tspan></text>
