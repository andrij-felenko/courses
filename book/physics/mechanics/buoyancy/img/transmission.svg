<line x1="520.0" y1="243.0" x2="520.0" y2="208.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="447.8" y="109.6" width="144.5" height="76.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">1229</tspan><tspan x="520.0" dy="15.6">текст зішкребли —</tspan><tspan x="520.0" dy="15.6">зверху молитовник</tspan><tspan x="520.0" dy="15.6">(палімпсест)</tspan></text>
<circle cx="520.0" cy="252.0" r="7.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<line x1="702.0" y1="261.0" x2="702.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="622.3" y="327.6" width="159.4" height="76.8" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="702.0" y="346.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">1269</tspan><tspan x="702.0" dy="15.6">Мербеке:</tspan><tspan x="702.0" dy="15.6">латинський переклад</tspan><tspan x="702.0" dy="15.6">(з іншого списку)</tspan></text>
<circle cx="702.0" cy="252.0" r="7.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2.0"/>
<line x1="900.0" y1="243.0" x2="900.0" y2="208.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
