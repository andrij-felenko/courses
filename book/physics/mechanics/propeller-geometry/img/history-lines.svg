<rect x="0.0" y="0.0" width="720.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві теорії гвинта сходяться на братах Райт</text>
<rect x="30.0" y="24.0" width="250.0" height="26.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="41.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">ТЕОРІЯ ІМПУЛЬСУ  (диск)</tspan></text>
<rect x="440.0" y="24.0" width="250.0" height="26.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="41.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">ЕЛЕМЕНТ ЛОПАТІ  (крила)</tspan></text>
<rect x="30.0" y="58.0" width="250.0" height="40.0" rx="6" fill="#f6f9ff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Ренкін, 1865 — заклав ідею</tspan></text>
<rect x="30.0" y="118.0" width="250.0" height="40.0" rx="6" fill="#f6f9ff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Ґрінгілл, 1888 — математика</tspan></text>
<line x1="155.0" y1="98.0" x2="155.0" y2="118.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="30.0" y="178.0" width="250.0" height="40.0" rx="6" fill="#f6f9ff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="202.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Р.Е. Фруд, 1889 — довів до пуття</tspan></text>
<line x1="155.0" y1="158.0" x2="155.0" y2="178.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="440.0" y="58.0" width="250.0" height="40.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">В. Фруд, 1878 — кинув думку</tspan></text>
<line x1="565.0" y1="98.0" x2="565.0" y2="118.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="440.0" y="118.0" width="250.0" height="100.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="565.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Джевецький, 1880–90-ті —</tspan><tspan x="565.0" dy="15.6">зробив робочою (метод 1892)</tspan></text>
<rect x="30.0" y="240.0" width="250.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">знає, СКІЛЬКИ маси відкинути,</tspan><tspan x="155.0" dy="14.3">але мовчить про форму лопаті</tspan></text>
<rect x="440.0" y="240.0" width="250.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="565.0" y="259.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">знає силу КОЖНОЇ смужки,</tspan><tspan x="565.0" dy="14.3">але не знає швидкості набігання</tspan></text>
<line x1="155.0" y1="286.0" x2="155.0" y2="318.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="155.0" y1="318.0" x2="270.0" y2="340.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="565.0" y1="286.0" x2="565.0" y2="318.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="565.0" y1="318.0" x2="450.0" y2="340.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="210.0" y="340.0" width="300.0" height="56.0" rx="6" fill="#fff6ea" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="364.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">БРАТИ РАЙТ, 1903</tspan><tspan x="360.0" dy="15.6">зшили обидві теорії в один розрахунок</tspan></text>
<text x="360.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">півстоліття лінії текли поруч і не зливалися;</tspan><tspan x="360.0" dy="14.3">їх поєднав розрахунок повітряного гвинта — ККД ≈ 66–70 %</tspan></text>
</svg>