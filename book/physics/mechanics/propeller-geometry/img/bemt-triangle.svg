<text x="360.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">осьова проєкція (L cos φ − D sin φ) → тяга dT;</tspan><tspan x="360.0" dy="14.3">колова проєкція (L sin φ + D cos φ)·r → момент dQ</tspan></text>
