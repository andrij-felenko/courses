<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм компенсації конформної аномалії c_total = c_matter + c_ghost = 0</text>
<rect x="76.9" y="106.6" width="326.3" height="66.8" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="240.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Матеріальний сектор (Бозони Xᵐ)</tspan><tspan x="240.0" dy="16.9">c_matter = D</tspan><tspan x="240.0" dy="16.9">(+1 на кожен просторово-часовий вимір)</tspan></text>
<rect x="420.9" y="106.6" width="318.2" height="66.8" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.8"/><text x="580.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Духовий сектор BRST (Духи b, c)</tspan><tspan x="580.0" dy="16.9">c_ghost = -26</tspan><tspan x="580.0" dy="16.9">(-26 від калібрування дифеоморфізмів)</tspan></text>
<line x1="240.0" y1="200.0" x2="360.0" y2="270.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="580.0" y1="200.0" x2="460.0" y2="270.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="263.5" y="271.9" width="293.1" height="56.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.2"/><text x="410.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Повна конформна аномалія:</tspan><tspan x="410.0" dy="18.2">c_total = D - 26 = 0  ⇒  D = 26</tspan></text>
<rect x="10.7" y="388.2" width="798.6" height="23.5" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="410.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="410.0" dy="0.0">Умови D = 26 (бозонна струна) та D = 10 (суперструна, c_ghost = -15) усувають духи з від'ємною нормою (No-Ghost Theorem)</tspan></text>
</svg>