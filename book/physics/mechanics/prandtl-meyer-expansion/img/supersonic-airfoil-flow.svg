<rect x="40.0" y="415.0" width="740.0" height="65.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="429.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Утворення хвильового опору надзвукового профілю:</tspan><tspan x="410.0" dy="15.0">• На передньому клині тиск підвищується через косий скачок ущільнення (+Δp).</tspan><tspan x="410.0" dy="15.0">• У зломі профілю тиск різко падає через віяло розширення Прандтля — Майєра (-Δp).</tspan><tspan x="410.0" dy="15.0">• Різниця тисків між передньою та задньою поверхнями створює хвильовий опір (Wave Drag).</tspan></text>
