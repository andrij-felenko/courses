<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="540.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад прискорення: дотична a_τ + нормальна a_n</text>
<path d="M 276.1 323.0 A 250.0 250.0 0 0 1 583.9 323.0" fill="none" stroke="#cdd5df" stroke-width="2.2"/>
<text x="270.1" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">траєкторія</text>
<line x1="430.0" y1="270.0" x2="430.0" y2="520.0" stroke="#c8b7de" stroke-width="1.6" stroke-dasharray="5,6"/>
<text x="442.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-style="italic">r</text>
<circle cx="430.0" cy="520.0" r="3.4" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">центр кривини</text>
<circle cx="430.0" cy="270.0" r="8.5" fill="#fef6e7" stroke="#c0392b" stroke-width="2.2"/>
<line x1="428.0" y1="248.0" x2="580.0" y2="248.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="580.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">v</text>
<line x1="430.0" y1="270.0" x2="525.0" y2="270.0" stroke="#8e44ad" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="533.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700" font-style="italic">a_τ = dv/dt</text>
<line x1="430.0" y1="270.0" x2="430.0" y2="445.0" stroke="#8e44ad" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="418.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="end" font-weight="700" font-style="italic">a_n = v²/r</text>
<line x1="430.0" y1="270.0" x2="525.0" y2="445.0" stroke="#1a1a1a" stroke-width="3.8" marker-end="url(#arrow)"/>
<text x="535.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">a</text>
<text x="535.0" y="461.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">= √(a_τ² + a_n²)</text>
<path d="M 445.0 270.0 L 445.0 285.0 L 430.0 285.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="544.0" y="88.0" width="268.0" height="122.0" rx="8" fill="#fbfcfd" stroke="#333333" stroke-width="1.2"/>
<line x1="560.0" y1="112.0" x2="590.0" y2="112.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="598.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">v — швидкість (по дотичній)</text>
<line x1="560.0" y1="142.0" x2="590.0" y2="142.0" stroke="#8e44ad" stroke-width="3.4"/>
<text x="598.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">a_τ — міняє модуль швидкості</text>
<line x1="560.0" y1="172.0" x2="590.0" y2="172.0" stroke="#8e44ad" stroke-width="3.4"/>
<text x="598.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">a_n — міняє напрям (до центра)</text>
<line x1="560.0" y1="202.0" x2="590.0" y2="202.0" stroke="#1a1a1a" stroke-width="3.8"/>
<text x="598.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">a — повне прискорення (сума)</text>
<rect x="166.1" y="486.6" width="527.9" height="50.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="430.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Дотична складова розганяє чи гальмує (міняє модуль v); нормальна</tspan><tspan x="430.0" dy="16.2">завертає (міняє напрям). Вони перпендикулярні — тому a = √(a_τ² + a_n²)</tspan></text>
</svg>