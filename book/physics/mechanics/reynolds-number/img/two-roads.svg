<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="442" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="442.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два шляхи до одного числа Рейнольдса</text>
<rect x="55.0" y="66.0" width="360.0" height="186.0" rx="6" fill="#f6f9ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="235.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">оцінка порядку величини</text>
<text x="235.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">сила інерції ≈ ρ·v²·L²</text>
<text x="235.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">сила в'язкості ≈ μ·v·L</text>
<line x1="81.0" y1="184.0" x2="389.0" y2="184.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="235.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">інерція / в'язкість</text>
<text x="235.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">= ρvL/μ = Re</text>
<rect x="485.0" y="66.0" width="360.0" height="186.0" rx="6" fill="#fff6f4" stroke="#c0392b" stroke-width="1.5"/>
<text x="665.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">знерозмірнення Нав'є–Стокса</text>
<text x="665.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Du*/Dt* = −∇*p* + (1/Re)∇*²u*</text>
<text x="665.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">коефіцієнт при в'язкому члені</text>
<line x1="511.0" y1="184.0" x2="819.0" y2="184.0" stroke="#6b7280" stroke-width="1.3"/>
<text x="665.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">= μ/(ρvL)</text>
<text x="665.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">= 1/Re</text>
<line x1="275.0" y1="256.0" x2="432.0" y2="342.0" stroke="#1a1a1a" stroke-width="2.0"/><path d="M 432.0 342.0 L 419.7 341.5 L 425.0 331.9 z" fill="#1a1a1a"/>
<line x1="625.0" y1="256.0" x2="468.0" y2="342.0" stroke="#1a1a1a" stroke-width="2.0"/><path d="M 468.0 342.0 L 475.0 331.9 L 480.3 341.5 z" fill="#1a1a1a"/>
<rect x="224.1" y="346.5" width="451.8" height="39.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="371.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">той самий дріб  Re = ρvL/μ  керує всім потоком</tspan></text>
<text x="450.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">оцінка дає Re, знерозмірнення — обернене 1/Re: те саме відношення тих самих двох членів</text>
</svg>