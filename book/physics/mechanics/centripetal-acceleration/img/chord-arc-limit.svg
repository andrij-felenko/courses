<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="420.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хорда ≠ дуга: різниця другого порядку зникає в границі</text>
<circle cx="420.0" cy="500.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="420.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">центр</text>
<line x1="420.0" y1="500.0" x2="550.2" y2="207.7" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="420.0" y1="500.0" x2="289.8" y2="207.7" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="501.1" y="359.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">r</text>
<text x="338.9" y="359.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">r</text>
<circle cx="550.2" cy="207.7" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
