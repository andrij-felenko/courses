<text x="566.2" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">P₁</text>
<text x="273.8" y="203.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">P₂</text>
<path d="M 550.2 207.7 A 320.0 320.0 0 0 0 289.8 207.7" fill="none" stroke="#27ae60" stroke-width="4.2"/>
<text x="420.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">дуга = r·Δθ = v·Δt</text>
<line x1="550.2" y1="207.7" x2="289.8" y2="207.7" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="6,5"/>
<text x="420.0" y="233.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">хорда = 2r·sin(Δθ/2)</text>
<path d="M 442.0 450.7 A 54.0 54.0 0 0 0 398.0 450.7" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<text x="420.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">Δθ</text>
<rect x="107.7" y="512.2" width="624.6" height="35.5" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="420.0" y="534.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">хорда / дуга = sin(Δθ/2)/(Δθ/2) = 1 − (Δθ)²/24 + …   →   1   при  Δθ → 0</tspan></text>
