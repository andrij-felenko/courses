<rect x="18.2" y="492.5" width="763.5" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="400.0" y="514.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">r(t) = R·(cos ωt, sin ωt)   →   v = dr/dt ⊥ r   →   a = d²r/dt² = −ω²·r   (|a| = ω²r = v²/r)</tspan></text>
