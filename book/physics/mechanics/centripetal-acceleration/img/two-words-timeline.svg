<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1000.0" height="460.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві назви — у зворотному до логіки порядку</text>
<text x="700.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">vis centrifuga → назовні (fugere — тікати)</text>
<text x="700.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">vis centripeta → до центра (petere — прагнути)</text>
<line x1="105.0" y1="250.0" x2="905.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.6"/>
<path d="M 915.0 250.0 L 905.0 244.0 L 905.0 256.0 z" fill="#1a1a1a"/>
<text x="902.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">час</text>
<circle cx="254.0" cy="250.0" r="6.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="254.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1659</text>
<line x1="254.0" y1="244.0" x2="254.0" y2="148.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="139.4" y="75.0" width="229.2" height="69.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="254.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">1659 · Гюйгенс, «De vi centrifuga»</tspan><tspan x="254.0" dy="14.3">геометрично виводить v²/r</tspan><tspan x="254.0" dy="14.3">і називає силу vis centrifuga</tspan><tspan x="254.0" dy="14.3">(рукопис; надрук. посмертно 1703)</tspan></text>
<circle cx="509.1" cy="250.0" r="6.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="509.1" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1673</text>
<line x1="509.1" y1="244.0" x2="509.1" y2="213.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="397.7" y="169.3" width="222.9" height="41.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="509.1" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="509.1" dy="0.0">1673 · «Horologium Oscillatorium»</tspan><tspan x="509.1" dy="14.3">13 теорем — без доведень</tspan></text>
<circle cx="709.6" cy="250.0" r="6.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="709.6" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1684</text>
<line x1="709.6" y1="256.0" x2="709.6" y2="305.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="595.0" y="312.2" width="229.2" height="55.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="709.6" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="709.6" dy="0.0">1684 · Ньютон, «De motu corporum»</tspan><tspan x="709.6" dy="14.3">називає vis centripeta — до центра</tspan><tspan x="709.6" dy="14.3">(канонізовано в «Principia», 1687)</tspan></text>
<rect x="141.2" y="343.4" width="317.6" height="63.2" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Логіка й історія розходяться:</tspan><tspan x="300.0" dy="15.6">відцентрову назвали ПЕРШОЮ (1659),</tspan><tspan x="300.0" dy="15.6">а доцентрову — аж через 25 років (1684).</tspan></text>
</svg>