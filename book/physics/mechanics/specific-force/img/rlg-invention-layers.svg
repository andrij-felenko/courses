<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий лазерний гіроскоп — винахід у чотири шари</text>
<line x1="44.0" y1="88.0" x2="44.0" y2="364.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="72.0" y="84.0" width="196.0" height="62.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Ідея</tspan></text>
<rect x="286.0" y="84.0" width="560.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="566.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">Кліффорд Гір (Clifford Heer), 1961 — узяти кільцевий</tspan><tspan x="566.0" dy="15.6">лазер і ефект Саньяка, щоб «почути» обертання</tspan></text>
<rect x="72.0" y="158.0" width="196.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="170.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Теорія</tspan></text>
<rect x="286.0" y="158.0" width="560.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="566.0" y="185.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">Гір і Адольф Розенталь (Adolph Rosenthal), 1961–62 —</tspan><tspan x="566.0" dy="15.6">як обертання розводить частоти зустрічних променів</tspan></text>
<rect x="72.0" y="232.0" width="196.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Перший робочий зразок</tspan></text>
<rect x="286.0" y="232.0" width="560.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="566.0" y="259.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">Вільям Мейсек (William Macek) і Девід Девіс (David Davis),</tspan><tspan x="566.0" dy="15.6">Sperry Gyroscope, 1963 — квадрат зі стороною ≈ 1 метр</tspan></text>
<rect x="72.0" y="306.0" width="196.0" height="62.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Робочий прилад</tspan></text>
<rect x="286.0" y="306.0" width="560.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="566.0" y="333.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="566.0" dy="0.0">Honeywell (Фредерік Ароновіц, Джозеф Кілпатрік), 1960–80-ті —</tspan><tspan x="566.0" dy="15.6">довести до розміру й ціни серійного авіаприладу</tspan></text>
<text x="440.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">від ідеї (1961) до серійного приладу — близько двадцяти років; жоден рядок не «винайшов RLG» сам</text>
</svg>