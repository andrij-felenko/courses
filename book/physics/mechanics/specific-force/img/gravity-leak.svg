<text x="286.0" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="end" font-weight="700">g</text>
<text x="286.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">справжній низ (1g)</text>
<line x1="300.0" y1="150.0" x2="359.9" y2="325.0" stroke="#333333" stroke-width="2.4" stroke-dasharray="7 5"/>
