<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Похибка гіроскопа нахиляє «низ» — і гравітація тече в горизонт</text>
<line x1="300.0" y1="150.0" x2="300.0" y2="359.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
