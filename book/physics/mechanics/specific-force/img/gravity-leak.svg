<rect x="140.0" y="372.0" width="420.0" height="48.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="350.0" y="399.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">δθ = 1 мрад  →  g·sinδθ ≈ 9.81 · 0.001 = 0.0098 м/с²  (= 1 мілі-g)</tspan></text>
