<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="980.0" height="616.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто винайшов інерціальну систему: поняття зібрано шарами</text>
<text x="490.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">згори вниз — за часом (не в масштабі); праворуч — який шар думки додав кожен</text>
<line x1="72.0" y1="100.0" x2="72.0" y2="520.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="79.0" y1="100.0" x2="150.0" y2="100.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="100.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<rect x="150.0" y="73.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">≈350 до н.е. · Аристотель (Ἀριστοτέλης)</text>
<text x="163.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">рух треба весь час штовхати — хибний старт</text>
<rect x="758.4" y="85.0" width="107.3" height="30.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="812.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">ХИБНИЙ СТАРТ</tspan></text>
<line x1="79.0" y1="170.0" x2="150.0" y2="170.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="170.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="150.0" y="143.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1632 · Ґалілео Ґалілей (Galileo Galilei)</text>
<text x="163.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">відносність руху; тіло само береже рух — та коловий</text>
<rect x="788.1" y="155.0" width="47.8" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="812.0" y="174.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">ІДЕЯ</tspan></text>
<line x1="79.0" y1="240.0" x2="150.0" y2="240.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="240.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="150.0" y="213.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1644 · Рене Декарт (René Descartes)</text>
<text x="163.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">чиста ПРЯМОЛІНІЙНА інерція (Principia, 1644)</text>
<rect x="758.4" y="225.0" width="107.3" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="812.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">ФОРМУЛЮВАННЯ</tspan></text>
<line x1="79.0" y1="310.0" x2="150.0" y2="310.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="310.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="150.0" y="283.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1687 · Ісаак Ньютон (Isaac Newton)</text>
<text x="163.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перший закон + «абсолютний простір» (Principia)</text>
<rect x="762.1" y="295.0" width="99.8" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="314.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">КОДИФІКАЦІЯ</tspan></text>
<line x1="79.0" y1="380.0" x2="150.0" y2="380.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="380.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<rect x="150.0" y="353.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1869 · Карл Нойман (Carl Neumann)</text>
<text x="163.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">«тіло Альфа» — опорне тіло замість простору</text>
<rect x="777.0" y="365.0" width="70.1" height="30.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="812.0" y="384.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">ЗАРОДОК</tspan></text>
<line x1="79.0" y1="450.0" x2="150.0" y2="450.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="450.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="150.0" y="423.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1883 · Ернст Мах (Ernst Mach)</text>
<text x="163.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">простір незримий; опора — далекі зорі й маси</text>
<rect x="777.0" y="435.0" width="70.1" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="812.0" y="454.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">КРИТИКА</tspan></text>
<line x1="79.0" y1="520.0" x2="150.0" y2="520.0" stroke="#6b7280" stroke-width="1.4"/>
<circle cx="72.0" cy="520.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="150.0" y="493.0" width="560.0" height="54.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
<text x="163.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1885 · Людвіг Ланге (Ludwig Lange)</text>
<text x="163.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">термін «інерціальна система» + робочий припис</text>
<rect x="780.7" y="505.0" width="62.6" height="30.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="812.0" y="524.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">ТЕРМІН</tspan></text>
<rect x="164.4" y="558.2" width="651.3" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="490.0" y="579.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Жоден не зробив усе сам: ІДЕЯ (Ґалілей) → ФОРМУЛЮВАННЯ (Декарт) → ЗАКОН і ПРОСТІР (Ньютон) →</tspan><tspan x="490.0" dy="15.6">КРИТИКА (Мах) → ОПЕРАЦІЙНЕ ПОНЯТТЯ Й ТЕРМІН (Ланге, на думці Ноймана)</tspan></text>
</svg>