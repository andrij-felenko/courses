<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="476" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="476.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама склянка, дві системи: у гальмівному вагоні з'являється сила без джерела</text>
<line x1="452.0" y1="58.0" x2="452.0" y2="392.0" stroke="#dfe4ea" stroke-width="1.3" stroke-dasharray="4,6"/>
<text x="230.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перон — інерціальна система</text>
<rect x="142.0" y="155.0" width="176.0" height="82.0" rx="13" fill="#eef2f7" stroke="#333333" stroke-width="1.9"/><rect x="158.0" y="167.0" width="30.0" height="26.0" rx="4" fill="#dbe6f5" stroke="#333333" stroke-width="1.2"/><rect x="272.0" y="167.0" width="30.0" height="26.0" rx="4" fill="#dbe6f5" stroke="#333333" stroke-width="1.2"/><circle cx="182.0" cy="249.0" r="13.0" fill="#d8dee6" stroke="#333333" stroke-width="1.7"/><circle cx="278.0" cy="249.0" r="13.0" fill="#d8dee6" stroke="#333333" stroke-width="1.7"/>
<rect x="196.0" y="210.0" width="68.0" height="6.0" rx="2" fill="#cbb892" stroke="#333333" stroke-width="1.2"/><line x1="204.0" y1="216.0" x2="204.0" y2="230.0" stroke="#333333" stroke-width="1.6"/><line x1="256.0" y1="216.0" x2="256.0" y2="230.0" stroke="#333333" stroke-width="1.6"/><path d="M 218.0 184.0 L 242.0 184.0 L 238.0 210.0 L 222.0 210.0 Z" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.9"/>
<line x1="250.0" y1="184.0" x2="326.0" y2="184.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="288.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">v</text>
<text x="250.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">склянка зберігає швидкість</text>
<line x1="224.0" y1="270.0" x2="152.0" y2="270.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="236.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">A: вагон гальмує</text>
<rect x="43.0" y="324.8" width="374.0" height="46.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="230.0" y="344.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">горизонтальних сил на склянку немає  →  a = 0</tspan><tspan x="230.0" dy="15.0">вона просто зберігає швидкість, а стіл тікає з-під неї</tspan></text>
<text x="668.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вагон — неінерціальна система</text>
<rect x="580.0" y="155.0" width="176.0" height="82.0" rx="13" fill="#eef2f7" stroke="#333333" stroke-width="1.9"/><rect x="596.0" y="167.0" width="30.0" height="26.0" rx="4" fill="#dbe6f5" stroke="#333333" stroke-width="1.2"/><rect x="710.0" y="167.0" width="30.0" height="26.0" rx="4" fill="#dbe6f5" stroke="#333333" stroke-width="1.2"/><circle cx="620.0" cy="249.0" r="13.0" fill="#d8dee6" stroke="#333333" stroke-width="1.7"/><circle cx="716.0" cy="249.0" r="13.0" fill="#d8dee6" stroke="#333333" stroke-width="1.7"/>
<rect x="634.0" y="210.0" width="68.0" height="6.0" rx="2" fill="#cbb892" stroke="#333333" stroke-width="1.2"/><line x1="642.0" y1="216.0" x2="642.0" y2="230.0" stroke="#333333" stroke-width="1.6"/><line x1="694.0" y1="216.0" x2="694.0" y2="230.0" stroke="#333333" stroke-width="1.6"/><path d="M 656.0 184.0 L 680.0 184.0 L 676.0 210.0 L 660.0 210.0 Z" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.9"/>
<line x1="688.0" y1="184.0" x2="772.0" y2="184.0" stroke="#c0392b" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="692.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">F = m·A</text>
<text x="692.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">вигадана сила — джерела немає</text>
<text x="646.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">склянка сама
розганяється (a′)</text>
<rect x="494.1" y="324.8" width="347.8" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="668.0" y="344.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="668.0" dy="0.0">склянка сама розганяється вперед з a′ = A</tspan><tspan x="668.0" dy="15.0">щоб урятувати F = m·a′, дописують силу без джерела</tspan></text>
<rect x="208.4" y="423.8" width="483.1" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="450.0" y="444.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Наявність сил без штовхача — і є прикмета неінерціальної системи.</tspan></text>
</svg>