<rect x="473.4" y="224.4" width="325.2" height="87.2" rx="6" fill="#eef3fb" stroke="#27ae60" stroke-width="1.5"/><text x="636.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="636.0" dy="0.0">За час dt система повертає ê на dφ = ω·dt.</tspan><tspan x="636.0" dy="16.2">Кінець ê заходить по колу → приріст dê</tspan><tspan x="636.0" dy="16.2">перпендикулярний до ê, довжиною |ê|·dφ.</tspan><tspan x="636.0" dy="16.2">Саме це й дає векторний добуток ω×ê.</tspan></text>
