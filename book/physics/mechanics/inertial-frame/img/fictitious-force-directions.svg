<text x="380.1" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">−2m·ω×v</text>
<rect x="190.4" y="441.2" width="439.2" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="410.0" y="462.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Відцентрова — від осі назовні, залежить лише від положення.</tspan><tspan x="410.0" dy="15.6">Коріолісова — перпендикулярна до швидкості, лише збиває вбік.</tspan></text>
