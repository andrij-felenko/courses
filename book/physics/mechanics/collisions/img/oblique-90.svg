<rect x="748.2" y="406.1" width="221.5" height="83.7" rx="6" fill="#fbf3e3" stroke="#b9770e" stroke-width="1.4"/><text x="859.0" y="427.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="859.0" dy="0.0">ціль у спокої, рівні маси</tspan><tspan x="859.0" dy="16.9">u = v₁ + v₂</tspan><tspan x="859.0" dy="16.9">|u|² = |v₁|² + |v₂|²</tspan><tspan x="859.0" dy="16.9">⇒  v₁·v₂ = 0  ⇒  v₁ ⟂ v₂</tspan></text>
