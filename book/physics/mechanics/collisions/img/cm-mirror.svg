<rect x="107.4" y="402.5" width="785.2" height="35.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="500.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">v = 2·V_cm − u : кожна швидкість після удару — дзеркальний відбиток тієї, що до, відносно спільної V_cm</tspan></text>
