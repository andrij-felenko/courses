<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1000.0" height="600.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резолвер контакту: один скаляр j розсуває пару тіл уздовж нормалі</text>
<circle cx="330.0" cy="250.0" r="100.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="530.0" cy="250.0" r="125.0" fill="#eef6ef" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="324.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло 1</text>
<text x="324.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">m₁</text>
<text x="554.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло 2</text>
<text x="554.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">m₂</text>
<line x1="417.5" y1="108.0" x2="417.5" y2="392.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="6 6"/>
<line x1="405.0" y1="372.0" x2="430.0" y2="372.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="430.0" y1="372.0" x2="405.0" y2="372.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="417.5" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">d — глибина проникання</text>
<line x1="417.5" y1="158.0" x2="309.5" y2="158.0" stroke="#1a1a1a" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="359.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">n</text>
<rect x="103.8" y="109.5" width="327.5" height="25.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="267.5" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">нормаль контакту  (від тіла 2 до тіла 1),  |n| = 1</tspan></text>
<line x1="330.0" y1="250.0" x2="180.0" y2="250.0" stroke="#c0392b" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="162.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">+ j·n</text>
<line x1="530.0" y1="250.0" x2="695.0" y2="250.0" stroke="#2457d6" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="704.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">− j·n</text>
<rect x="91.3" y="444.1" width="207.4" height="51.9" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="195.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">1 · швидкість зближення</tspan><tspan x="195.0" dy="16.9">vₙ = (v₁ − v₂) · n</tspan></text>
<rect x="372.1" y="444.1" width="255.7" height="51.9" rx="6" fill="#fbf3e3" stroke="#b9770e" stroke-width="1.5"/><text x="500.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">2 · скалярний поштовх</tspan><tspan x="500.0" dy="16.9">j = −(1+e)·vₙ / (1/m₁ + 1/m₂)</tspan></text>
<rect x="684.1" y="444.1" width="255.7" height="51.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="812.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="812.0" dy="0.0">3 · розсунути швидкості</tspan><tspan x="812.0" dy="16.9">v₁ += j·n/m₁     v₂ −= j·n/m₂</tspan></text>
<rect x="38.6" y="552.0" width="922.9" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="500.0" y="572.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Порахувати j за нормаллю — і розкидати ±j·n, поділивши на масу кожного тіла: імпульс пари точний, а стіна (1/m = 0) стоїть непорушно</tspan></text>
</svg>