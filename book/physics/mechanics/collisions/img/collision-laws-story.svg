<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="980.0" height="690.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження законів удару: чотири акти одного століття</text>
<line x1="120.0" y1="92.0" x2="120.0" y2="632.0" stroke="#6b7280" stroke-width="2.6"/>
<circle cx="120.0" cy="150.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="98.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1644</text>
<rect x="150.0" y="96.0" width="780.0" height="108.0" rx="10" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.8"/>
<text x="168.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Рене Декарт, «Principia philosophiae»</text>
<text x="168.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">«Кількість руху» = розмір × швидкість, БЕЗ напряму; сім правил удару — частина хибні.</text>
<text x="168.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Бракує напряму: куля, відскочивши назад, у Декартовім рахунку «зберігає» рух.</text>
<circle cx="120.0" cy="300.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="98.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1668–69</text>
<rect x="150.0" y="246.0" width="780.0" height="108.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="168.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Королівське товариство ставить задачу всій Європі</text>
<text x="168.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Валліс (непружний) · Рен (пружний) · Гюйґенс (пружний) — три відповіді збіглися.</text>
<text x="168.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Народжується закон імпульсу: зберігається m·v — тепер із напрямом.</text>
<circle cx="120.0" cy="450.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<text x="98.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1656→1703</text>
<rect x="150.0" y="396.0" width="780.0" height="108.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="168.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Крістіан Гюйґенс, «De Motu Corporum ex Percussione»</text>
<text x="168.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Відносність руху (уявний човен) як інструмент; друга збережна величина — «жива сила» m·v².</text>
<text x="168.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Розв'язав ще 1656 — повний трактат вийшов посмертно, 1703.</text>
<circle cx="120.0" cy="600.0" r="8.0" fill="#b9770e" stroke="#b9770e" stroke-width="2.0"/>
<text x="98.0" y="605.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="end" font-weight="700">1687</text>
<rect x="150.0" y="546.0" width="780.0" height="108.0" rx="10" fill="#fbf3e3" stroke="#b9770e" stroke-width="1.8"/>
<text x="168.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Ісаак Ньютон, «Математичні начала»</text>
<text x="168.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Не теорія, а вимір: розгойдані кульки з вовни, сталі, корка, скла.</text>
<text x="168.0" y="628.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Розліт — стала частка зближення: вовна й сталь ≈ 5/9, скло ≈ 15/16.</text>
</svg>