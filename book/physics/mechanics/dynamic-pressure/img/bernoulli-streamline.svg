<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стала Бернуллі: уздовж цівки завжди, на все поле — лише без вихору</text>
<line x1="440.0" y1="62.0" x2="440.0" y2="374.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="225.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">загальна течія (з вихором)</text>
<path d="M74,122 Q225,92 398,114" fill="none" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="62.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">C₁</text>
<path d="M74,188 Q225,158 398,180" fill="none" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="62.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">C₂</text>
<path d="M74,254 Q225,224 398,246" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="62.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">C₃</text>
<text x="225.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ω = ∇×v ≠ 0</text>
<text x="225.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">стала своя на кожній цівці:</text>
<text x="225.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C₁ ≠ C₂ ≠ C₃</text>
<text x="655.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">безвихрова течія</text>
<path d="M502,122 Q655,92 828,114" fill="none" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="490.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">C</text>
<path d="M502,188 Q655,158 828,180" fill="none" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="490.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">C</text>
<path d="M502,254 Q655,224 828,246" fill="none" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="490.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">C</text>
<text x="655.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">ω = ∇×v = 0</text>
<text x="655.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">одна стала на все поле:</text>
<text x="655.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">C однакова скрізь</text>
</svg>