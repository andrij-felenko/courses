<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щоб полетіти вбік, звичайна рама мусить нахилитися</text>
<line x1="110.0" y1="150.0" x2="250.0" y2="150.0" stroke="#6b7280" stroke-width="7.0"/><circle cx="180.0" cy="150.0" r="10.0" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><line x1="180.0" y1="150.0" x2="180.0" y2="70.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/><text x="176.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">T</text><text x="180.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівна платформа:
тяга строго вгору, убік — нікуди</text>
<line x1="456.6" y1="179.6" x2="583.4" y2="120.4" stroke="#6b7280" stroke-width="7.0"/><circle cx="520.0" cy="150.0" r="10.0" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><line x1="520.0" y1="150.0" x2="553.8" y2="77.5" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/><text x="549.8" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">T</text><line x1="520.0" y1="202.0" x2="550.4" y2="202.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/><text x="535.2" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">рух убік</text><text x="520.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нахилив усю раму —
з'явилась бічна складова</text>
</svg>