<rect x="460.9" y="83.0" width="168.2" height="49.9" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.5"/><text x="545.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">стовпчик мотора i</tspan><tspan x="545.0" dy="16.9">у матриці розподілу:</tspan></text>
<text x="430.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1</text>
<text x="478.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">тяга — завжди вгору</text>
