<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий показ: нахил у тяжіння й справжній розгін — не розрізнити</text>
<line x1="470.0" y1="58.0" x2="470.0" y2="388.0" stroke="#dfe4ea" stroke-width="1.3" stroke-dasharray="4,6"/>
<text x="250.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нерухомий, але нахилений на φ</text>
<line x1="180.5" y1="197.3" x2="319.5" y2="146.7" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<polygon points="206.4,151.7 270.3,128.4 293.6,192.3 229.7,215.6" fill="#e8edf3" stroke="#333333" stroke-width="1.8"/><circle cx="250.0" cy="172.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<line x1="250.0" y1="172.0" x2="250.0" y2="106.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="250.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">g (реакція)</text>
<line x1="250.0" y1="172.0" x2="297.0" y2="154.9" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="329.0" y="148.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">g·sinφ</text>
<rect x="106.6" y="308.2" width="286.8" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="250.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">нерухомий:  a = 0,  нахил φ = 3°</tspan><tspan x="250.0" dy="15.6">→ поздовжній показ  g·sin3° = 0.51 м/с²</tspan></text>
<text x="690.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівний, але розганяється вперед</text>
<line x1="612.0" y1="172.0" x2="768.0" y2="172.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,5"/>
<polygon points="656.0,138.0 724.0,138.0 724.0,206.0 656.0,206.0" fill="#e8edf3" stroke="#333333" stroke-width="1.8"/><circle cx="690.0" cy="172.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<line x1="690.0" y1="172.0" x2="756.0" y2="172.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="698.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">a = g·sin3°</text>
<rect x="529.5" y="308.2" width="321.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="690.0" y="328.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">рівний:  справжній розгін уперед</tspan><tspan x="690.0" dy="15.6">a = 0.51 м/с²  →  той самий поздовжній показ</tspan></text>
<rect x="156.2" y="410.6" width="627.6" height="50.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="470.0" y="432.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Акселерометр видає ОДНЕ поздовжнє число — 0.51 м/с². Нахил чи розгін — не розрізнити.</tspan><tspan x="470.0" dy="16.2">Алгоритм читає нахил як розгін: фальшивий дрейф  ½·g·sinφ·t² ≈ 924 м за хвилину.</tspan></text>
</svg>