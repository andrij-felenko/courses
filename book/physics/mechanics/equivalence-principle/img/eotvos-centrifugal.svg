<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="452.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки горизонтальна «гравітація»: відцентрова на широті φ</text>
<circle cx="240.0" cy="268.0" r="118.0" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/>
<line x1="240.0" y1="150.0" x2="240.0" y2="392.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="240.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вісь ω</text>
<line x1="122.0" y1="268.0" x2="358.0" y2="268.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5,5"/>
<text x="366.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">екв.</text>
<line x1="240.0" y1="268.0" x2="323.4" y2="184.6" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<text x="256.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">φ</text>
<circle cx="323.4" cy="184.6" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="323.4" y1="184.6" x2="344.7" y2="163.3" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,3"/>
<text x="337.4" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">виска</text>
<line x1="323.4" y1="184.6" x2="279.6" y2="228.4" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="359.4" y1="148.6" x2="395.4" y2="184.6" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="359.4" y1="220.6" x2="395.4" y2="184.6" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="323.4" y1="184.6" x2="395.4" y2="184.6" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="323.4" y1="184.6" x2="359.4" y2="148.6" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="363.4" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">верт.</text>
<line x1="323.4" y1="184.6" x2="359.4" y2="220.6" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="365.4" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">g_гор</text>
<rect x="440.0" y="118.0" width="312.0" height="258.0" rx="8" fill="#f7f9fb" stroke="#333333" stroke-width="1.3"/>
<text x="458.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">відцентрова = ω²·R·cosφ</text>
<text x="458.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">верт. = ω²R·cos²φ  (послаблює g)</text>
<text x="458.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">гор. = (ω²R/2)·sin2φ</text>
<text x="458.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">макс. на φ = 45°:</text>
<text x="458.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">≈ 1.7·10⁻² м/с² ≈ 0.0017 g</text>
<rect x="489.8" y="306.4" width="212.4" height="43.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.3"/><text x="596.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">терези читають різницю η·g_гор,</tspan><tspan x="596.0" dy="14.3">а спільну вагу — у натяг нитки</tspan></text>
<line x1="70.0" y1="414.0" x2="96.0" y2="414.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="102.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">тяжіння до центра (за m_g)</text>
</svg>