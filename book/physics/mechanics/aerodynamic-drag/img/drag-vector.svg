<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір напрямлений строго проти вектора швидкості, а величину задає повна швидкість |v|</text>
<circle cx="330.0" cy="250.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="318.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">тіло в польоті</text>
<line x1="330.0" y1="250.0" x2="470.0" y2="145.0" stroke="#c0392b" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="478.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">швидкість  v</text>
<line x1="330.0" y1="250.0" x2="470.0" y2="250.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="470.0" y1="250.0" x2="470.0" y2="145.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="400.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">vₓ</text>
<text x="482.0" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">v_y</text>
<line x1="330.0" y1="250.0" x2="218.0" y2="334.0" stroke="#2457d6" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="210.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">опір</text>
<text x="210.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end">(проти v)</text>
<line x1="330.0" y1="250.0" x2="330.0" y2="355.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="340.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">вага  m·g</text>
<rect x="630.2" y="186.2" width="189.6" height="111.7" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="725.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">a = g − β·|v|·v</tspan><tspan x="725.0" dy="17.6">β = ½·ρ·C_d·A / m</tspan><tspan x="725.0" dy="17.6">aₓ = −β·|v|·vₓ</tspan><tspan x="725.0" dy="17.6">a_y = −g − β·|v|·v_y</tspan><tspan x="725.0" dy="17.6">|v| = √( vₓ² + v_y² )</tspan></text>
<rect x="146.4" y="409.2" width="647.3" height="37.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Множник |v| той самий для обох осей — опір НЕ розкладається на vₓ² і v_y² окремо.</tspan></text>
</svg>