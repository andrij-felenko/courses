<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="404" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="880.0" height="404.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет невизначеності для  g = 4π²L / T²</text>
<line x1="250.0" y1="84.0" x2="250.0" y2="250.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="485.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">внесок у u(g),  м/с²</text>
<rect x="250.0" y="98.0" width="470.0" height="44.0" rx="4" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/><text x="238.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">час T</text><text x="238.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">тип A (розкид повторів)</text><text x="730.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">0.0502  (98.5%)</text>
<rect x="250.0" y="178.0" width="58.0" height="44.0" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="238.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">довжина L</text><text x="238.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">тип B (поділка рулетки)</text><text x="318.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">0.0062  (1.5%)</text>
<rect x="248.0" y="296.0" width="560.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="528.0" y="322.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="528.0" dy="0.0">u_c = √(0.0502² + 0.0062²) = 0.0505 м/с²   →   U = 2·u_c = 0.10 м/с²</tspan></text>
<rect x="80.4" y="366.5" width="719.2" height="31.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="440.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">g = (9.81 ± 0.10) м/с² — час дає 98.5% розкиду, отже покращувати треба його, не довжину</tspan></text>
</svg>