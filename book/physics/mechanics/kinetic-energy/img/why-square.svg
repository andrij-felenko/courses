<rect x="148.3" y="525.4" width="603.4" height="65.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="546.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Рівні прирости швидкості коштують дедалі більшої роботи — 1, 3, 5, 7 (непарні числа):</tspan><tspan x="450.0" dy="15.6">тіло вже мчить швидше й за однаковий час проходить довший шлях.</tspan><tspan x="450.0" dy="15.6">Суми непарних — точні квадрати 1, 4, 9, 16. Тому енергія росте як v², а не як v.</tspan></text>
