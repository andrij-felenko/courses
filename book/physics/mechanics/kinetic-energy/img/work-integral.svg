<text x="255.8" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">W = ∫ F dx</text>
<text x="255.8" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">= площа під кривою</text>
<rect x="610.5" y="203.9" width="318.9" height="92.2" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="228.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">F dx  =  m (dv/dt) dx</tspan><tspan x="770.0" dy="17.6">         =  m (dx/dt) dv  =  m·v dv</tspan><tspan x="770.0" dy="17.6">∫ m·v dv  =  m · ½v²</tspan><tspan x="770.0" dy="17.6">  =  ½mv²кінц − ½mv²поч</tspan></text>
<text x="770.0" y="193.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ключ — заміна змінної:</text>
<text x="770.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">∫v dv = ½v²  дає і ½, і квадрат</text>
<rect x="133.8" y="495.2" width="692.3" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="480.0" y="516.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Стала сила: робота = F·d (прямокутник). Змінна: січемо шлях на кроки Δx, на кожному F майже стала,</tspan><tspan x="480.0" dy="15.6">сумуємо F·Δx і згущуємо крок — сума стає інтегралом ∫F dx, тобто площею під кривою F(x).</tspan></text>
