<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Роботу виконує лише складова сили вздовж руху; поперечна — нуль</text>
<line x1="540.0" y1="66.0" x2="540.0" y2="520.0" stroke="#dfe4ea" stroke-width="1.2" stroke-dasharray="4,6"/>
<line x1="150.0" y1="300.0" x2="480.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="462.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">dr  (переміщення)</text>
<line x1="150.0" y1="300.0" x2="357.3" y2="160.2" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="363.3" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">F</text>
<line x1="150.0" y1="300.0" x2="357.3" y2="300.0" stroke="#1f7a3d" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="253.6" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f7a3d" text-anchor="middle" font-weight="700">F∥ = F·cosθ  (виконує роботу)</text>
<line x1="357.3" y1="300.0" x2="357.3" y2="160.2" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="367.3" y="230.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">F⊥</text>
<text x="367.3" y="248.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">роботи 0</text>
<path d="M 357.3 300.0 h -12 v -12" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<path d="M 194.0 300.0 A 44 44 0 0 0 186.5 275.4" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<text x="210.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">θ</text>
<rect x="171.8" y="412.2" width="256.4" height="35.5" rx="6" fill="#eef2f9" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="434.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">W = F · dr = F·d·cosθ = F∥·d</tspan></text>
<text x="750.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Поперечна сила → нуль роботи → стала швидкість</text>
<circle cx="660.0" cy="170.0" r="46.0" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,5"/>
<circle cx="660.0" cy="170.0" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="660.0" cy="124.0" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="660.0" y1="124.0" x2="660.0" y2="170.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="660.0" y1="124.0" x2="700.0" y2="124.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="704.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">v</text>
<text x="668.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">натяг</text>
<text x="760.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">камінь на мотузці:</text>
<text x="760.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">натяг ⊥ v  →  W = 0</text>
<text x="760.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">модуль швидкості сталий</text>
<circle cx="660.0" cy="300.0" r="13.0" fill="#eef2f9" stroke="#2457d6" stroke-width="1.6"/>
<text x="660.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">M</text>
<circle cx="660.0" cy="300.0" r="42.0" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,5"/>
<circle cx="702.0" cy="300.0" r="5.5" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<line x1="702.0" y1="300.0" x2="672.0" y2="300.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="702.0" y1="300.0" x2="702.0" y2="262.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="760.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">супутник на орбіті:</text>
<text x="760.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">тяжіння (доцентрове) ⊥ v</text>
<text x="760.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стала орбітальна швидкість</text>
<line x1="620.0" y1="430.0" x2="690.0" y2="430.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="650.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">рух</text>
<line x1="655.0" y1="430.0" x2="655.0" y2="470.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="662.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">mg</text>
<text x="760.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">горизонтальний рух:</text>
<text x="760.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">тяжіння mg ⊥ переміщенню</text>
<text x="760.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">W = 0 (висота не міняється)</text>
<text x="750.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">також: нормальна реакція опори, сила Лоренца qv×B</text>
<rect x="93.8" y="518.0" width="772.4" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="480.0" y="538.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Скалярний добуток F·dr вибирає лише проєкцію сили на напрям руху: сила поперек переміщення руху не пришвидшує.</tspan></text>
</svg>