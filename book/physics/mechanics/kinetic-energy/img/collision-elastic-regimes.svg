<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="930" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="930.0" height="600.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="465.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пружний удар у нерухому ціль: результат вирішує відношення мас</text>
<text x="465.0" y="49.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">маси й швидкість налітача ті самі — а розліт щоразу інший</text>
<text x="38.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівні маси   m₁ = m₂</text>
<text x="300.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">до</text>
<circle cx="256.0" cy="140.0" r="20.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.3"/><text x="256.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">m</text>
<circle cx="344.0" cy="140.0" r="20.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.3"/><text x="344.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">m</text>
<line x1="256.0" y1="104.0" x2="296.0" y2="104.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/><text x="276.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">u</text>
<text x="344.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<line x1="420.0" y1="140.0" x2="550.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пружний</text>
<text x="700.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">після</text>
<circle cx="646.0" cy="140.0" r="20.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.3"/><text x="646.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">m</text>
<circle cx="762.0" cy="140.0" r="20.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.3"/><text x="762.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">m</text>
<text x="646.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<line x1="762.0" y1="104.0" x2="802.0" y2="104.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/><text x="782.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">v = u</text>
<text x="465.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">швидкості міняються місцями: налітач спиняється, ціль зривається з тією ж швидкістю</text>
<text x="38.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Важке б'є легке   m₁ ≫ m₂</text>
<text x="300.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">до</text>
<circle cx="256.0" cy="300.0" r="30.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.3"/><text x="256.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">M</text>
<circle cx="344.0" cy="300.0" r="13.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.3"/><text x="344.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">m</text>
<line x1="256.0" y1="254.0" x2="296.0" y2="254.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/><text x="276.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">u</text>
<text x="344.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<line x1="420.0" y1="300.0" x2="550.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пружний</text>
<text x="700.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">після</text>
<circle cx="646.0" cy="300.0" r="30.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.3"/><text x="646.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">M</text>
<circle cx="762.0" cy="300.0" r="13.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.3"/><text x="762.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">m</text>
<line x1="646.0" y1="254.0" x2="686.0" y2="254.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/><text x="666.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">≈ u</text>
<line x1="762.0" y1="271.0" x2="842.0" y2="271.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/><text x="802.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">≈ 2u</text>
<text x="465.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">важке майже не гальмує, а легке відлітає вдвічі прудкіше за налітача</text>
<text x="38.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Легке б'є важке   m₁ ≪ m₂</text>
<text x="300.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">до</text>
<circle cx="256.0" cy="458.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.3"/><text x="256.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">m</text>
<circle cx="344.0" cy="458.0" r="30.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.3"/><text x="344.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">M</text>
<line x1="256.0" y1="429.0" x2="296.0" y2="429.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/><text x="276.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">u</text>
<text x="344.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<line x1="420.0" y1="458.0" x2="550.0" y2="458.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="485.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пружний</text>
<text x="700.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">після</text>
<circle cx="646.0" cy="458.0" r="13.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.3"/><text x="646.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">m</text>
<circle cx="762.0" cy="458.0" r="30.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.3"/><text x="762.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">M</text>
<line x1="646.0" y1="429.0" x2="606.0" y2="429.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/><text x="626.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">≈ −u</text>
<text x="762.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">≈ 0</text>
<text x="465.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">легке відскакує назад, важке ледь зрушується — як м'яч від стіни</text>
<rect x="125.7" y="541.2" width="678.6" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="465.0" y="562.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Той самий налітач, той самий пружний удар — а розліт диктує лише відношення мас:</tspan><tspan x="465.0" dy="15.6">рівні маси міняються швидкостями; важке пробиває крізь; легке відскакує, майже не зрушивши ціль.</tspan></text>
</svg>