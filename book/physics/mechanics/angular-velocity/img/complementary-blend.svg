<rect x="282.0" y="289.0" width="192.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="378.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="378.0" dy="0.0">нахил</tspan><tspan x="378.0" dy="16.2">θ_a = atan2(a)</tspan></text>
<rect x="541.0" y="170.0" width="198.0" height="98.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="640.0" y="207.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">зшивач</tspan><tspan x="640.0" dy="16.2">α·(θ + ω·dt)</tspan><tspan x="640.0" dy="16.2">+ (1−α)·θ_a</tspan></text>
