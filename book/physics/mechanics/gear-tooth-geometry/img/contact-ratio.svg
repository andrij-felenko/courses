<text x="380.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">AB довший за p_осн (тут ≈ 1.6 · p_осн), тож поки пара 1 не вийшла в B,</tspan><tspan x="380.0" dy="14.3">пара 2 вже ввійшла в A — контакт не переривається.  ε = AB / p_осн &gt; 1</tspan></text>
