<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік векторного поля E через похилений майданчик dA</text>
<polygon points="220.0,240.0 360.0,240.0 420.0,140.0 280.0,140.0" fill="#eef6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="290.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Майданчик dA</text>
<line x1="320.0" y1="190.0" x2="390.0" y2="80.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="400.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">n̂ (орт нормалі)</text>
<line x1="260.0" y1="270.0" x2="260.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="320.0" y1="270.0" x2="320.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="270.0" x2="380.0" y2="70.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="325.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">E (вектор поля)</text>
<path d="M 320 145 A 45 45 0 0 1 348 150" stroke="#d35400" stroke-width="1.8" fill="none"/>
<text x="342.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d35400" text-anchor="middle" font-weight="700">θ</text>
<rect x="489.5" y="127.2" width="191.0" height="125.6" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.4"/><text x="585.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Проекція поля на нормаль:</tspan><tspan x="585.0" dy="15.6">E_n = E · cos(θ)</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Елементарний потік:</tspan><tspan x="585.0" dy="15.6">dΦ_E = E · dA</tspan><tspan x="585.0" dy="15.6">    = E · n̂ · dA</tspan><tspan x="585.0" dy="15.6">    = E · cos(θ) · dA</tspan></text>
</svg>