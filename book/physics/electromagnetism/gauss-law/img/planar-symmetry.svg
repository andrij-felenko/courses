<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гауссовий циліндрик («таблетка») для нескінченної площини</text>
<polygon points="250.0,60.0 300.0,100.0 300.0,310.0 250.0,270.0" fill="#fff4e6" stroke="#d35400" stroke-width="2.0"/>
<text x="310.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start" font-weight="700">Площина (густина σ)</text>
<text x="270.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="270.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="270.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="270.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="195.0" y1="165.0" x2="355.0" y2="165.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="195.0" y1="215.0" x2="355.0" y2="215.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5,4"/>
<ellipse cx="195.0" cy="190.0" rx="16.0" ry="25.0" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
<ellipse cx="355.0" cy="190.0" rx="16.0" ry="25.0" fill="#eef6ff" stroke="#2457d6" stroke-width="1.8"/>
<line x1="355.0" y1="190.0" x2="400.0" y2="190.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="405.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">E (вправо)</text>
<line x1="195.0" y1="190.0" x2="150.0" y2="190.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="145.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">E (вліво)</text>
<text x="275.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Φ_wall = 0 (E ∥ стінці)</text>
<rect x="482.7" y="88.2" width="204.7" height="203.6" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.4"/><text x="585.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Потік через два денця:</tspan><tspan x="585.0" dy="15.6">Φ_E = E · A + E · A</tspan><tspan x="585.0" dy="15.6">    = 2 · E · A</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Заряд усередині:</tspan><tspan x="585.0" dy="15.6">Q_enclosed = σ · A</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Рівняння Гаусса:</tspan><tspan x="585.0" dy="15.6">2 · E · A = (σ · A) / ε₀</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Електричне поле:</tspan><tspan x="585.0" dy="15.6">E = σ / (2ε₀)  (однорідне!)</tspan></text>
</svg>