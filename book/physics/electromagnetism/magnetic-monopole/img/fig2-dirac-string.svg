<rect x="0.0" y="0.0" width="720.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія струни Дірака та калібрувальні патчі UN, US</text>
<circle cx="230.0" cy="190.0" r="100.0" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/>
<line x1="248.0" y1="190.0" x2="352.0" y2="190.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="242.7" y1="177.3" x2="316.3" y2="103.7" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="230.0" y1="172.0" x2="230.0" y2="68.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="217.3" y1="177.3" x2="143.7" y2="103.7" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="212.0" y1="190.0" x2="108.0" y2="190.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="217.3" y1="202.7" x2="143.7" y2="276.3" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="242.7" y1="202.7" x2="316.3" y2="276.3" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="230.0" y1="190.0" x2="230.0" y2="340.0" stroke="#2457d6" stroke-width="3.5"/>
<circle cx="230.0" cy="190.0" r="14.0" fill="#ef4444" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">g</text>
<rect x="121.5" y="347.5" width="216.9" height="21.0" rx="6" fill="#fee2e2" stroke="#2457d6" stroke-width="1.2"/><text x="230.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Струна Дірака (сингулярність A_N)</tspan></text>
<text x="100.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Патч UN</text>
<text x="100.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(без струни донизу)</text>
<text x="100.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">Патч US</text>
<text x="100.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(без струни догори)</text>
<rect x="390.0" y="52.0" width="270.0" height="295.0" rx="10" fill="#f8fafc" stroke="#27ae60" stroke-width="1.4"/>
<text x="530.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Калібрувальне узгодження</text>
<text x="530.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">У зоні перекриття (екватор):</text>
<text x="530.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">A_N − A_S = ∇ Λ</text>
<text x="530.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"></text>
<text x="530.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фазовий множник хвильової функції:</text>
<text x="530.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">exp(i q Λ / ℏ) мусить бути</text>
<text x="530.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">однозначним при 2π обході:</text>
<text x="530.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"></text>
<rect x="439.4" y="232.5" width="181.3" height="25.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="530.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">q · g = 2 · π · ℏ · n</tspan></text>
<text x="530.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"></text>
<text x="530.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Отже, існування хоча б одного g</text>
<text x="530.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пояснює квантування заряду q!</text>
</svg>