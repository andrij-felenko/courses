<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="340.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асиметрія рівнянь Максвелла та дуальне розширення</text>
<line x1="370.0" y1="48.0" x2="370.0" y2="296.0" stroke="#d6dde6" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="185.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичні рівняння (без монополів)</text>
<rect x="123.3" y="72.0" width="123.4" height="26.0" rx="6" fill="#f4f6f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">∇ · E = ρ_e / ε₀</tspan></text>
<rect x="51.5" y="120.0" width="267.1" height="26.0" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2"/><text x="185.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">∇ · B = 0   [немає магнітних зарядів]</tspan></text>
<rect x="119.9" y="168.0" width="130.3" height="26.0" rx="6" fill="#f4f6f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">∇ × E = − ∂B / ∂t</tspan></text>
<rect x="75.4" y="216.0" width="219.2" height="26.0" rx="6" fill="#f4f6f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="185.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">∇ × B = μ₀ J_e + μ₀ ε₀ ∂E / ∂t</tspan></text>
<text x="555.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дуально-симетричні (з магнітним зарядом)</text>
<rect x="493.3" y="72.0" width="123.4" height="26.0" rx="6" fill="#f4f6f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="555.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">∇ · E = ρ_e / ε₀</tspan></text>
<rect x="414.6" y="120.0" width="280.8" height="26.0" rx="6" fill="#edf2ff" stroke="#3b82f6" stroke-width="1.2"/><text x="555.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">∇ · B = μ₀ ρ_m   [магнітна густина ρ_m]</tspan></text>
<rect x="377.0" y="168.0" width="356.0" height="26.0" rx="6" fill="#edf2ff" stroke="#3b82f6" stroke-width="1.2"/><text x="555.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">∇ × E = − μ₀ J_m − ∂B / ∂t   [магнітний струм J_m]</tspan></text>
<rect x="445.4" y="216.0" width="219.2" height="26.0" rx="6" fill="#f4f6f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="555.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">∇ × B = μ₀ J_e + μ₀ ε₀ ∂E / ∂t</tspan></text>
<rect x="185.3" y="310.5" width="369.4" height="23.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="370.0" y="325.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Симетрія дуальності: E → B, B → −E, ρ_e → ρ_m, ρ_m → −ρ_e</tspan></text>
</svg>