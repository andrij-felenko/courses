<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація крайових умов у задачах електростатики</text>
<rect x="30.0" y="75.0" width="220.0" height="240.0" rx="8" fill="#f0f4fe" stroke="#2457d6" stroke-width="1.8"/>
<text x="140.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Умова Діріхле (1-го роду)</text>
<rect x="60.0" y="135.0" width="160.0" height="45.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="140.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">φ|Γ = V₀ (фіксований)</text>
<text x="140.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фіксований потенціал</text>
<text x="140.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Металеві електроди,</text>
<text x="140.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">підключені до джерел</text>
<text x="140.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">напруги.</text>
<rect x="270.0" y="75.0" width="220.0" height="240.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="380.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Умова Неймана (2-го роду)</text>
<rect x="290.0" y="135.0" width="180.0" height="45.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">∂φ/∂n|Γ = −Eₙ = σ / ε₀</text>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фіксована нормальна похідна</text>
<text x="380.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Задана густина заряду σ</text>
<text x="380.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">або ізольована межа</text>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(Eₙ = 0, ∂φ/∂n = 0).</text>
<rect x="510.0" y="75.0" width="220.0" height="240.0" rx="8" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.8"/>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Умова Робена (змішана)</text>
<rect x="525.0" y="135.0" width="190.0" height="45.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">a·φ + b·(∂φ/∂n) = c</text>
<text x="620.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лінійна комбінація</text>
<text x="620.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Межа розділу середовищ,</text>
<text x="620.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тонкі діелектричні шари,</text>
<text x="620.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">конвективний теплообмін.</text>
</svg>