<text x="235.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2b6cb0" text-anchor="middle" font-weight="700">μ = I · S · n</text>
<text x="235.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">n — одинична нормаль</text>
