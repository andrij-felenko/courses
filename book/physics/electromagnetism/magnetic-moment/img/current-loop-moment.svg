<text x="320.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e53e3e" text-anchor="middle" font-weight="700">Струм I</text>
<text x="220.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="700">Площа контуру S</text>
