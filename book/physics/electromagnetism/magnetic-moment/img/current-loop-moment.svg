<text x="540.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="middle">4 пальці → напрям струму I</text>
<text x="540.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle">Великий палець → напрям моменту μ</text>
<text x="430.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">• μ не залежить від форми контуру</text>
<text x="430.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">• Модуль |μ| = I · S  [А·м²]</text>
<text x="430.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">• Вектор μ перпендикулярний до площини</text>
<text x="430.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">• Створення поля B на відстані</text>
<rect x="88.1" y="328.5" width="563.8" height="23.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="370.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Магнітний момент μ повністю визначає дипольне магнітне поле контуру на великих відстанях</tspan></text>
