<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Орбітальний та спіновий магнітні моменти електрона</text>
<text x="200.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="700">Орбітальний рух (g_L = 1)</text>
<circle cx="200.0" cy="190.0" r="10.0" fill="#e53e3e" stroke="none" stroke-width="1.5"/>
<text x="200.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">+e</text>
<path d="M 125.000000 190.000000 A 75 35 0 1 0 275.000000 190.000000 A 75 35 0 1 0 125.000000 190.000000" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="275.0" cy="190.0" r="7.0" fill="#3182ce" stroke="none" stroke-width="1.5"/>
<text x="275.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">−e</text>
<line x1="275.0" y1="190.0" x2="275.0" y2="145.0" stroke="#718096" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">v</text>
<line x1="200.0" y1="190.0" x2="200.0" y2="100.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="212.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="700">L</text>
<line x1="200.0" y1="190.0" x2="200.0" y2="280.0" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="212.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="start" font-weight="700">μ_L = − (e / 2m_e) L</text>
<text x="540.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#805ad5" text-anchor="middle" font-weight="700">Власний спін електрона (g_S ≈ 2)</text>
<circle cx="540.0" cy="190.0" r="35.0" fill="#ebf8ff" stroke="#3182ce" stroke-width="2.0"/>
<text x="540.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="700">−e</text>
<line x1="540.0" y1="190.0" x2="540.0" y2="95.0" stroke="#805ad5" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="552.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#805ad5" text-anchor="start" font-weight="700">S = ½ ℏ</text>
<line x1="540.0" y1="190.0" x2="540.0" y2="285.0" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="552.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="start" font-weight="700">μ_S = − g_S (e / 2m_e) S</text>
<text x="620.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start" font-weight="700">μ_B = e·ℏ / (2m_e)</text>
<text x="620.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="start">≈ 9.274 × 10⁻²⁴ Дж/Тл</text>
<rect x="19.2" y="328.5" width="701.7" height="23.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="370.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Через негативний заряд електрона магнітні моменти μ_L та μ_S направлені протилежно до моментів імпульсу L та S</tspan></text>
</svg>