<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітний диполь у зовнішньому полі B: обертальний момент та енергія</text>
<line x1="80.0" y1="80.0" x2="360.0" y2="80.0" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="80.0" y1="115.0" x2="360.0" y2="115.0" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="80.0" y1="150.0" x2="360.0" y2="150.0" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="80.0" y1="185.0" x2="360.0" y2="185.0" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="80.0" y1="220.0" x2="360.0" y2="220.0" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="80.0" y1="255.0" x2="360.0" y2="255.0" stroke="#3182ce" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#3182ce" text-anchor="middle" font-weight="700">Поле B</text>
<line x1="220.0" y1="180.0" x2="273.6" y2="135.0" stroke="#e53e3e" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="283.6" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e53e3e" text-anchor="middle" font-weight="700">μ</text>
<line x1="220.0" y1="180.0" x2="280.0" y2="180.0" stroke="#718096" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="265.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">θ</text>
<line x1="255.0" y1="135.0" x2="270.0" y2="165.0" stroke="#d69e2e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="160.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700">Момент τ = μ × B</text>
<rect x="410.0" y="70.0" width="260.0" height="220.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="540.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потенціальна енергія U(θ)</text>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="700">θ = 0° (паралельно)</text>
<text x="430.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">U = − μ · B  [мінімум, стійкий]</text>
<text x="430.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="start" font-weight="700">θ = 90° (перпендикулярно)</text>
<text x="430.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">U = 0</text>
<text x="430.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e53e3e" text-anchor="start" font-weight="700">θ = 180° (антипаралельно)</text>
<text x="430.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2d3748" text-anchor="start">U = + μ · B  [максимум, нестійкий]</text>
<rect x="66.2" y="328.5" width="607.6" height="23.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="370.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Зовнішнє поле намагається повернути магнітний момент паралельно до векторів B (мінімум енергії)</tspan></text>
</svg>