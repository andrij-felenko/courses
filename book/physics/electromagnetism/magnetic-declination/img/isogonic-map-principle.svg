<rect x="455.0" y="115.0" width="245.0" height="305.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="577.5" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="577.5" dy="0.0">Формула зв'язку:</tspan><tspan x="577.5" dy="14.3">  Ψ_true = Ψ_mag + D</tspan><tspan x="577.5" dy="14.3"></tspan><tspan x="577.5" dy="14.3">Приклад розрахунку:</tspan><tspan x="577.5" dy="14.3">  Магнітний курс (Ψ_mag) = 45°</tspan><tspan x="577.5" dy="14.3">  Схилення (D) = +12° (Східне)</tspan><tspan x="577.5" dy="14.3">  -----------------------------</tspan><tspan x="577.5" dy="14.3">  Істинний курс = 45° + 12° = 57°</tspan><tspan x="577.5" dy="14.3"></tspan><tspan x="577.5" dy="14.3">Західне схилення (D &lt; 0):</tspan><tspan x="577.5" dy="14.3">  Якщо D = -8° (Західне),</tspan><tspan x="577.5" dy="14.3">  Істинний курс = 45° + (-8°) = 37°</tspan><tspan x="577.5" dy="14.3"></tspan><tspan x="577.5" dy="14.3">Нормалізація в [0°, 360°):</tspan><tspan x="577.5" dy="14.3">  Ψ_true = (Ψ_mag + D + 360°) % 360°</tspan></text>
