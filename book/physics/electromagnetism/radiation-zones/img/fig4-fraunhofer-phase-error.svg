<circle cx="80.0" cy="190.0" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.5"/>
<line x1="60.0" y1="90.0" x2="60.0" y2="290.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="60.0" y1="170.0" x2="60.0" y2="90.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="60.0" y1="210.0" x2="60.0" y2="290.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="45.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">D</text>
<circle cx="580.0" cy="190.0" r="6.0" fill="#1a1a1a" stroke="none" stroke-width="1.5"/>
<text x="595.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Точка P(r)</text>
<line x1="80.0" y1="190.0" x2="580.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="330.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">r (центральний промінь)</text>
