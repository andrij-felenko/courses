<text x="350.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">r' = √(r² + (D/2)²)</text>
<path d="M 360.000000,100.000000 A 300,300 0 0,1 360.000000,280.000000" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="3,3"/>
<text x="375.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle">Сферичний фронт хвилі</text>
<rect x="254.4" y="263.1" width="371.1" height="73.9" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="440.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Критерій квазіплоского фронту:</tspan><tspan x="440.0" dy="14.3">• Різниця ходу: Δr ≈ D² / (8r)</tspan><tspan x="440.0" dy="14.3">• Похибка фази: Δφ = k·Δr = (2π/λ)·(D²/8r) ≤ π/8 (22.5°)</tspan><tspan x="440.0" dy="14.3">• Звідси межа Фраунгофера: r ≥ 2D² / λ</tspan></text>
</svg>