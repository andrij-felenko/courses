<text x="140.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Магнітна рамка (Z ≪ Z₀)</text>
<line x1="220.0" y1="300.0" x2="220.0" y2="80.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<circle cx="220.0" cy="300.0" r="4.0" fill="#1a1a1a" stroke="none" stroke-width="1.5"/>
<text x="220.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1.0 (Ближня межа)</text>
<rect x="506.5" y="65.9" width="226.9" height="188.3" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="620.0" y="85.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Властивості хвильового опору:</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">• Електричне джерело:</tspan><tspan x="620.0" dy="14.3">  E-поле переважає в ближній зоні</tspan><tspan x="620.0" dy="14.3">  High Impedance Field</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">• Магнітне джерело:</tspan><tspan x="620.0" dy="14.3">  H-поле переважає в ближній зоні</tspan><tspan x="620.0" dy="14.3">  Low Impedance Field</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">• Далека зона:</tspan><tspan x="620.0" dy="14.3">  Z → Z₀ = √(μ₀/ε₀) ≈ 377 Ом</tspan></text>
</svg>