<rect x="0.0" y="0.0" width="760.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвильовий опір випромінювання Z = E / H у ближній та далекій зонах</text>
<rect x="20.0" y="46.0" width="720.0" height="314.0" rx="10" fill="#fafbfc" stroke="#27ae60" stroke-width="1.5"/>
