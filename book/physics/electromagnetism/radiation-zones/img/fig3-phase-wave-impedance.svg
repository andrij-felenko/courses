<text x="90.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="end" font-weight="700">Z₀ = 377 Ом</text>
<path d="M 115.000000,100.000000 Q 200.000000,130.000000 530.000000,190.000000" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="140.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Електричний диполь (Z ≫ Z₀)</text>
