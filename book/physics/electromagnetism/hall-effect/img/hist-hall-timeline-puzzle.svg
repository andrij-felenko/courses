<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ефект є — а носія ще нема: 18 років без електрона</text>
<text x="450.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Холл міряв рух заряду, не знаючи, що то за заряд. А знак напруги в деяких металах виявився «неправильним».</text>
<line x1="80.0" y1="150.0" x2="820.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="820.0" y1="150.0" x2="832.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="836.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">рік</text>
<line x1="99.3" y1="143.0" x2="99.3" y2="157.0" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="99.3" cy="150.0" r="4.0" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
<text x="99.3" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">1873</text>
<text x="99.3" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Максвелл:</text>
<text x="99.3" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">«Трактат»</text>
<text x="99.3" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">сила на провідник,</text>
<text x="99.3" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">не на струм</text>
<line x1="137.9" y1="143.0" x2="137.9" y2="157.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="137.9" cy="150.0" r="5.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="137.9" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1879</text>
<text x="137.9" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ЕФЕКТ ХОЛЛА</text>
<text x="137.9" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">поперечна напруга;</text>
<text x="137.9" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Холлу 23 роки</text>
<line x1="144.3" y1="143.0" x2="144.3" y2="157.0" stroke="#e08030" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="144.3" cy="150.0" r="4.0" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<text x="144.3" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">1880</text>
<text x="144.3" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">аномальний</text>
<text x="144.3" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">ефект</text>
<text x="144.3" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">у залізі ~10×</text>
<text x="144.3" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">більший</text>
<line x1="253.7" y1="143.0" x2="253.7" y2="157.0" stroke="#1f47b5" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="253.7" cy="150.0" r="5.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="253.7" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1897</text>
<text x="253.7" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ЕЛЕКТРОН</text>
<text x="253.7" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Дж. Дж. Томсон;</text>
<text x="253.7" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">аж тепер ясно,</text>
<text x="253.7" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">що то за носій</text>
<line x1="787.8" y1="143.0" x2="787.8" y2="157.0" stroke="#1f8a3b" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="787.8" cy="150.0" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="787.8" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1980</text>
<text x="787.8" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">квантовий</text>
<text x="787.8" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ефект Холла</text>
<text x="787.8" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">фон Клітцинг;</text>
<text x="787.8" y="241.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">еталон опору</text>
<line x1="137.9" y1="246.0" x2="253.7" y2="246.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="137.9" y1="241.0" x2="137.9" y2="251.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="253.7" y1="241.0" x2="253.7" y2="251.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="195.8" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">18 років</text>
<text x="195.8" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ефект виміряно раніше за носія</text>
<rect x="60.0" y="372.0" width="780.0" height="80.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="450.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Загадка, що пережила самого Холла</text>
<text x="450.0" y="417.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Знак напруги показує знак носіїв. Та в деяких металах він виходив «додатним», ніби заряд +</text>
<text x="450.0" y="435.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— провідники з ДІРКАМИ. Пояснила це лише квантова зонна теорія (1930-ті), а не сам дослід.</text>
</svg>
