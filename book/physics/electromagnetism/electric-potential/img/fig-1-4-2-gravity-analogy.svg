<text x="615.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відпустиш → лине за полем, PE→KE</text>
<text x="410.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">відповідність: висота h ↔ потенціал;  m·g ↔ q·E.  Розрив аналогії: заряд буває ДВОХ знаків (− «падає вгору»).</text>
