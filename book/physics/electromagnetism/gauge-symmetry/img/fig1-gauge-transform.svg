<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Калібрувальна орбіта потенціалів та інваріантність спостережуваних полів</text>
<rect x="20.0" y="50.0" width="340.0" height="270.0" rx="10" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="190.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір електромагнітних потенціалів</text>
<path d="M 50 260 C 110 120, 270 280, 330 110" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
<text x="270.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Калібрувальна орбіта</text>
<circle cx="90.0" cy="210.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="40.4" y="119.0" width="99.3" height="22.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="90.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Набір (φ, A)</tspan></text>
<circle cx="260.0" cy="170.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<rect x="170.2" y="217.3" width="139.6" height="35.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Набір (φ', A') =</tspan><tspan x="240.0" dy="14.3">(φ - ∂λ/∂t, A + ∇λ)</tspan></text>
<path d="M 100 195 Q 175 140 250 165" stroke="#27ae60" stroke-width="2" fill="none"/>
<line x1="240.0" y1="160.0" x2="250.0" y2="165.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="175.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Перетворення λ(r, t)</text>
<rect x="400.0" y="50.0" width="320.0" height="270.0" rx="10" fill="#f1f5f9" stroke="#27ae60" stroke-width="1.8"/>
<text x="560.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний простір спостережень</text>
<line x1="97.0" y1="210.0" x2="480.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="260.0" y1="170.0" x2="480.0" y2="180.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="560.0" cy="180.0" r="10.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="459.0" y="103.2" width="202.0" height="43.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Фізичні поля:</tspan><tspan x="560.0" dy="15.6">E = -∇φ - ∂A/∂t,  B = ∇×A</tspan></text>
<text x="560.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЄДИНИЙ ФІЗИЧНИЙ СТАН</text>
<text x="560.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Напруженості E та B не змінюються)</text>
<rect x="36.6" y="346.0" width="666.7" height="24.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="370.0" y="362.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Нескінченна кількість наборів (φ, A) уздовж орбіти відповідає єдиній фізичній реальності</tspan></text>
</svg>