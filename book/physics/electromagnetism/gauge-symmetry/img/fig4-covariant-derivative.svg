<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальна фазова симетрія U(1) та компенсаційне калібрувальне поле</text>
<rect x="20.0" y="50.0" width="340.0" height="270.0" rx="10" fill="#fcfdfd" stroke="#333333" stroke-width="1.5"/>
<text x="190.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальне обертання фази хвильової функції</text>
<circle cx="190.0" cy="180.0" r="65.0" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="110.0" y1="180.0" x2="270.0" y2="180.0" stroke="#cbd5e1" stroke-width="1.0"/>
<line x1="190.0" y1="100.0" x2="190.0" y2="260.0" stroke="#cbd5e1" stroke-width="1.0"/>
<line x1="190.0" y1="180.0" x2="235.0" y2="135.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="190.0" y1="180.0" x2="235.0" y2="135.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="245.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ψ(r)</text>
<path d="M 235 135 A 65 65 0 0 0 170 118" stroke="#2457d6" stroke-width="2" fill="none"/>
<line x1="200.0" y1="120.0" x2="170.0" y2="118.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ψ'(r) = e^{i q λ/ℏ} ψ(r)</text>
<rect x="365.0" y="50.0" width="355.0" height="270.0" rx="10" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/>
<text x="542.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компенсація за допомогою поля A_μ</text>
<rect x="408.5" y="107.3" width="267.1" height="35.3" rx="6" fill="#fef2f2" stroke="#2457d6" stroke-width="1.5"/><text x="542.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">Звичайна похідна: ∂_μ ψ'(r)</tspan><tspan x="542.0" dy="14.3">містить нековаріантний член (q/ℏ)(∂_μ λ)ψ</tspan></text>
<rect x="414.2" y="169.5" width="255.5" height="21.0" rx="6" fill="#e0f2fe" stroke="#c0392b" stroke-width="1.5"/><text x="542.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="542.0" dy="0.0">Перетворення поля: A_μ → A_μ + ∂_μ λ</tspan></text>
<rect x="445.0" y="228.0" width="194.0" height="44.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="542.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="542.0" dy="0.0">Коваріантна похідна:</tspan><tspan x="542.0" dy="13.0">D_μ = ∂_μ - i (q/ℏ) A_μ</tspan><tspan x="542.0" dy="13.0">(D_μ ψ)' = e^{i q λ/ℏ} (D_μ ψ)</tspan></text>
<rect x="47.8" y="346.0" width="644.4" height="24.0" rx="6" fill="#f1f5f9" stroke="#27ae60" stroke-width="1.2"/><text x="370.0" y="362.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Вимоги локальної калібрувальної симетрії НЕМІНУЧЕ породжують електромагнітне поле A_μ</tspan></text>
</svg>