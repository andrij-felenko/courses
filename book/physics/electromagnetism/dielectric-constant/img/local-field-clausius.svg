<text x="300.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−−−</text>
<text x="440.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+++</text>
<rect x="60.0" y="220.0" width="220.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Локальне поле:</tspan><tspan x="170.0" dy="13.0">E_loc = E + P / (3·ε₀)</tspan><tspan x="170.0" dy="13.0"></tspan><tspan x="170.0" dy="13.0">Рівняння Клаузіуса—Моссотті:</tspan><tspan x="170.0" dy="13.0">(ε_r − 1)/(ε_r + 2) = N·α / (3·ε₀)</tspan></text>
