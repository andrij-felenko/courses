<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="360" fill="#ffffff"/>
