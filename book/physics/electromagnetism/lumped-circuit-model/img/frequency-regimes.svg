<text x="375.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">d ~ λ  (0.1λ &lt; d &lt; 10λ)</text>
<rect x="269.2" y="208.0" width="211.5" height="74.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.0"/><text x="375.0" y="222.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">• Хвильове запізнення τ ~ T</tspan><tspan x="375.0" dy="13.0">• Відбиття та хвильовий опір Z₀</tspan><tspan x="375.0" dy="13.0">• Телеграфні рівняння (1D PDE)</tspan><tspan x="375.0" dy="13.0">• Коаксіал, полоскові лінії</tspan><tspan x="375.0" dy="13.0">• Матриці розсіювання (S-параметри)</tspan></text>
