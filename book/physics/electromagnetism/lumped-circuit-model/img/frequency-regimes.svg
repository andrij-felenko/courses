<rect x="87.8" y="208.0" width="154.5" height="74.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.0"/><text x="165.0" y="222.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">• Поля локалізовані</tspan><tspan x="165.0" dy="13.0">• Запізнення τ ≪ T</tspan><tspan x="165.0" dy="13.0">• Закони Кірхгофа KCL/KVL</tspan><tspan x="165.0" dy="13.0">• Ззвичайні ДУ (ODE)</tspan><tspan x="165.0" dy="13.0">• Схеми R, L, C, M</tspan></text>
