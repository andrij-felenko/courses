<text x="470.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Закон Фарадея: ЕРС = −dΦ/dt — наведена напруга дорівнює швидкості зміни магнітного потоку Φ крізь котушку.</text>
<text x="470.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Більше витків, сильніший магніт, швидший рух → більша ЕРС. Нерухоме поле струму не наводить.</text>
