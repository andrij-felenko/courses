<text x="450.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Саме коливний струм у диполі Герца й породжував його хвилю — і так само в кожній антені.</text>
